<!--
  ═════ ربط Laravel (Laravel mapping) ═════
  • كل حالة هنا تصبح قالبًا مستقلًا: resources/views/errors/{code}.blade.php
      403.blade.php · 404.blade.php · 419.blade.php · 429.blade.php · 500.blade.php
    والحالتان الخاصتان (quota / suspended) تُعرضان من Middleware/Exception مخصّص
    (مثل QuotaExceededException → errors/quota.blade.php، و AccountSuspended → errors/suspended.blade.php).
  • القالب يُرسَم بالكامل على الخادم (العنوان، الوصف، الروابط، رقم المرجع، Retry-After، أرقام الحصة)
    ولا يعتمد على JavaScript إطلاقًا؛ Alpine في هذا الملف مجرد طبقة معاينة للنموذج الأولي.
  • 429: قيمة retry_after تأتي من ترويسة Retry-After في الاستثناء ThrottleRequestsException.
  • 500: رقم المرجع (REQ-xxxxxxxx) يُولَّد على الخادم ويُسجَّل مع الاستثناء في السجلات (Log context)،
    لا يُولَّد في المتصفح كما هنا.
  • 419: رابط الدخول يحمل ?redirect= (يُفضَّل url()->previous() إن كان من نفس النطاق، وإلا dashboard).
  • suspended: «تسجيل الخروج» في Laravel نموذج POST إلى route('logout') مع @csrf وليس رابطًا.
  • أضف <meta name="robots" content="noindex"> في layout الأخطاء.
-->

<!-- ① تطبيق الثيم واللغة قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      if (loc !== 'ar' && loc !== 'en') loc = 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

    const b = new Uint8Array(4);
    (window.crypto || globalThis.crypto).getRandomValues(b);

    const raw = params.get(key);
    if (raw === null || raw.trim() === '') return def;
    const n = Number(raw);
    return Number.isFinite(n) && n >= min ? Math.floor(n) : def;
  }

      copyState: '',            // '' | 'ok' | 'fail'
      retryAfter: 20, deadline: 0, retrySeconds: 0, retryTimer: null, announcedReady: false,
      quota: { used: 150, limit: 150, resource: 'seats' },
      prevPage: 'dashboard',

      /* --- بيانات مشتقة --- */
      get def() { return ERRORS[this.type]; },
      get text() { return this.def[this.lang]; },
      get tone() { return TONE[this.def.tone]; },
      get types() { return Object.keys(ERRORS); },
      get codeLabel() { return this.def.code || this.def.short.en.toLowerCase(); },
      get locTag() { return this.lang === 'ar' ? 'ar-u-nu-latn' : 'en'; },
      get actions() { return this.def.actions.map((id, i) => this.action(id, i)); },
      labelFor(key) { return ERRORS[key].short[this.lang]; },

      /* --- الترجمة --- */
      t(k) { return (I18N[this.lang] && I18N[this.lang][k]) || k; },
      tf(k, vars) { return this.t(k).replace(/\{(\w+)\}/g, (m, n) => (vars && n in vars ? vars[n] : m)); },
      fmt(n) { return new Intl.NumberFormat(this.locTag).format(n); },

      init() {
        const q = new URLSearchParams(location.search);
        const tp = q.get('type');
        if (tp && ERRORS[tp]) this.type = tp;
        this.retryAfter = numParam(q, 'retry_after', 20, 0);
        const limit = numParam(q, 'limit', 150, 1);
        this.quota = {
          limit,
          used: numParam(q, 'used', limit, 0),   // الافتراضي: الحصة مستهلكة بالكامل
          resource: q.get('resource') === 'tokens' ? 'tokens' : 'seats',
        };
        this.prevPage = this.computePrevPage();
        this.$watch('lang', () => this.applyLang());
        this.$watch('type', () => {
          this.applyLang(); this.syncQuery(); this.manageRetryTimer();
          this.copyState = '';
          this.liveMsg = this.title();
        });
        this.applyLang();
        this.manageRetryTimer();
        this.ready = true;
      },
      title() { return (this.def.code ? this.def.code + ' · ' : '') + this.text.title; },
      applyLang() {
        const h = document.documentElement;
        h.lang = this.lang; h.dir = this.lang === 'ar' ? 'rtl' : 'ltr';
        try { localStorage.setItem('firob-locale', this.lang); } catch (e) {}
        if (window.FIROB && FIROB.setLocale) FIROB.setLocale(this.lang);
        document.title = this.title() + ' — FirOb';
      },
      syncQuery() {
        const url = new URL(location.href);
        url.searchParams.set('type', this.type);
        history.replaceState(null, '', url);
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
      },

      /* --- الصفحة السابقة (419): من نفس النطاق فقط، وإلا dashboard --- */
      computePrevPage() {
        try {
          const ref = document.referrer;
          if (ref) {
            const u = new URL(ref);
            if (u.origin === location.origin && u.pathname !== location.pathname) return u.pathname + u.search + u.hash;
          }
        } catch (e) {}
        return 'dashboard';
      },

      /* --- تعريف الإجراء: رابط حقيقي أو زر --- */
      action(id, i) {
        const a = { id, label: this.t(id), icon: ACTION_ICONS[id], variant: i === 0 ? 'btn-accent' : i === 1 ? 'btn-outline' : 'btn-ghost', href: null };
        if (id === 'home') a.href = PATHS.dashboard;
        else if (id === 'switchAccount') a.href = PATHS.login + '?switch=1';
        else if (id === 'login') a.href = PATHS.login + '?redirect=' + encodeURIComponent(this.prevPage);
        else if (id === 'upgrade') a.href = PATHS.upgrade;
        else if (id === 'logout') a.href = PATHS.login + '?logged_out=1'; // Laravel: POST route('logout') + @csrf
        else if (id === 'support') a.href = this.mailtoHref();
        return a;
      },
      run(id) {
        if (id === 'retry') this.refresh();
        else if (id === 'back') this.goBack();
      },
      isDisabled(id) { return id === 'retry' && this.type === '429' && this.retrySeconds > 0; },

      /* --- الدعم: رابط بريد حقيقي يحمل الرمز ورقم المرجع --- */
      mailtoHref() {
        const vars = { code: this.codeLabel, ref: this.refId, url: location.href };
        return 'mailto:' + SUPPORT_EMAIL + '?subject=' + encodeURIComponent(this.tf('mailSubject', vars)) +
               '&body=' + encodeURIComponent(this.tf('mailBody', vars));
      },

      /* --- نسخ رقم المرجع مع إبلاغ صادق بالنجاح أو الفشل --- */
      async copyRef() {
        let ok = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(this.refId); ok = true; }
        } catch (e) { ok = false; }
        if (!ok) {
          try {
            const ta = document.createElement('textarea');
            ta.value = this.refId; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            ok = document.execCommand('copy') === true;
            ta.remove();
          } catch (e) { ok = false; }
        }
        this.copyState = ok ? 'ok' : 'fail';
        this.liveMsg = ok ? this.t('copied') : this.t('copyFailed');
        if (ok) this.notify(this.t('copied'));
        else if (this.$refs.refText) {
          try { const r = document.createRange(); r.selectNodeContents(this.$refs.refText); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
        }
        return ok;
      },

      /* --- عدّاد 429 قائم على موعد نهائي (لا يتراكم فيه الانحراف) --- */
      manageRetryTimer() {
        clearInterval(this.retryTimer); this.retryTimer = null;
        this.announcedReady = false;
        if (this.type !== '429') { this.retrySeconds = 0; return; }
        this.deadline = Date.now() + this.retryAfter * 1000;
        this.tick();
        if (this.retrySeconds > 0) this.retryTimer = setInterval(() => this.tick(), 250);
      },
      tick() {
        const left = Math.max(0, Math.ceil((this.deadline - Date.now()) / 1000));
        this.retrySeconds = left;
        if (left === 0) {
          clearInterval(this.retryTimer); this.retryTimer = null;
          if (!this.announcedReady) { this.announcedReady = true; this.liveMsg = this.t('retryNow'); }
        }
      },

      /* --- مقياس الحصة --- */
      get quotaPct() { return Math.min(100, Math.round((this.quota.used / this.quota.limit) * 100)); },
      get quotaResource() { return this.t(this.quota.resource === 'tokens' ? 'resTokens' : 'resSeats'); },
      get quotaPctText() { return new Intl.NumberFormat(this.locTag, { style: 'percent', maximumFractionDigits: 0 }).format(this.quotaPct / 100); },
      get quotaValueText() {
        return this.tf('quotaValueText', { used: this.fmt(this.quota.used), limit: this.fmt(this.quota.limit), resource: this.quotaResource, pct: this.quotaPctText });
      },

      /* --- إجراءات الواجهة --- */
      notify(msg) {   // يُستخدم للنجاح فقط
        this.toast = msg; clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => this.toast = '', 3500);
      },
      refresh() { this.liveMsg = this.t('reloading'); setTimeout(() => location.reload(), 300); },
      goBack() { history.length > 1 ? history.back() : (location.href = PATHS.dashboard); },
    };
  }
</script>
</head>

<body x-data="app()" class="app-h flex flex-col">

<!-- منطقة إعلان وحيدة لقارئات الشاشة: تبديل الحالة، انتهاء العدّاد، نتيجة النسخ، إعادة التحميل -->
<p class="sr-only" aria-live="polite" x-text="liveMsg"></p>

<!-- إشعار نجاح عائم (للنجاح فقط؛ الإعلان الصوتي يتم عبر منطقة liveMsg أعلاه) -->
<div x-show="toast" x-cloak x-transition.opacity
     class="fixed inset-x-4 top-4 z-50 mx-auto max-w-md rounded-xl border border-success-100 bg-success-50 p-4 text-caption font-bold text-success-800 shadow-pop dark:border-success-500/30 dark:bg-success-500/10 dark:text-success-500">
  <div class="flex items-start gap-3">
    <i class="fa-solid fa-circle-check mt-0.5" aria-hidden="true"></i>
    <p class="flex-1" x-text="toast"></p>
  </div>
</div>

<!-- ═════ الشريط العلوي: الشعار + أدوات العرض ═════ -->
<header class="flex shrink-0 items-center justify-between gap-3 px-4 py-3 sm:px-8">
  <a href="../index.html" class="inline-flex items-center gap-2.5 rounded-lg">
    <span class="inline-flex items-center rounded-lg bg-white p-1 shadow-sm">
      <img src="../asset/images/firob-logo.png" alt="FirOb" class="block h-7 w-auto max-w-[8rem] object-contain">
    </span>
  </a>
  <div x-cloak class="flex items-center gap-2">
    <button type="button" class="tool" @click="toggleTheme()" :aria-pressed="dark.toString()"
            :aria-label="t('darkMode')" :title="t('darkMode')">
      <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
    </button>
    <div class="flex h-10 items-center rounded-xl border border-line-strong bg-field p-1" role="group" :aria-label="lang === 'ar' ? 'اللغة' : 'Language'">
      <button type="button" lang="ar" class="h-full rounded-lg px-3.5 text-caption font-bold transition-colors focus-visible:outline-none focus-visible:shadow-[var(--ring)]"
              :class="lang === 'ar' ? 'bg-primary-500 text-white' : 'text-muted hover:bg-soft'" :aria-pressed="(lang === 'ar').toString()" @click="lang = 'ar'">عربي</button>
      <button type="button" lang="en" class="h-full rounded-lg px-3.5 text-caption font-bold transition-colors focus-visible:outline-none focus-visible:shadow-[var(--ring)]"
              :class="lang === 'en' ? 'bg-primary-500 text-white' : 'text-muted hover:bg-soft'" :aria-pressed="(lang === 'en').toString()" @click="lang = 'en'">EN</button>
    </div>
  </div>
</header>

<!-- ═════ شريط معاينة الحالات (PROTOTYPE ONLY) ═════
     أداة عرض للنموذج الأولي فقط: معزولة تمامًا عن منطق الإنتاج، ولا وجود لها في قوالب
     resources/views/errors/*.blade.php — احذف هذا الشريط بالكامل قبل الإطلاق.
     مخفي بـ x-cloak فلا يظهر دون JavaScript. -->
<div x-cloak class="sticky top-0 z-20 shrink-0 border-b border-line/70 bg-card/75 px-4 py-2 backdrop-blur-md sm:px-8" data-prototype-only>
  <div class="mx-auto flex max-w-5xl flex-wrap items-center gap-1.5" role="group" :aria-label="t('previewGroup')">
    <span class="inline-flex shrink-0 items-center gap-1.5 rounded-full border border-line-strong/70 bg-field/70 px-2.5 py-1 text-[0.75rem] font-extrabold text-muted">
      <i class="fa-solid fa-sliders text-accent-600 dark:text-accent-500" aria-hidden="true"></i>
      <span x-text="t('previewLabel')"></span>
    </span>
    <template x-for="key in types" :key="key">
      <button type="button" class="pill text-[0.8125rem]" :class="type === key ? 'border-primary-500 bg-primary-500 text-white shadow-sm' : 'border-line text-muted hover:bg-soft'"
              @click="type = key" :aria-pressed="(type === key).toString()">
        <span x-text="labelFor(key)"></span>
      </button>
    </template>
    <span class="hidden text-[0.75rem] text-muted md:inline" x-text="t('previewHint')"></span>
  </div>
</div>

<!-- ═════ المحتوى الرئيسي ═════
     المحتوى الافتراضي (404 بالعربية) مكتوب نصًا ثابتًا في HTML — يُقرأ دون JavaScript،
     ثم يتسلّمه Alpine عبر x-text/:href. هذا ما سيُرسَم على الخادم في errors/404.blade.php. -->
<main class="flex min-h-0 flex-1 items-center justify-center overflow-y-auto px-4 py-10 sm:px-8">
  <div class="w-full max-w-2xl">
    <section class="card p-8 text-center sm:p-12" aria-labelledby="error-title">

      <!-- أيقونة توضيحية بخلفية متوهجة بحسب درجة الخطورة (زخرفية) -->
      <div x-cloak class="relative mx-auto mb-7 grid h-32 w-32 place-items-center sm:h-36 sm:w-36" aria-hidden="true">
        <span class="absolute inset-0 rounded-full blur-2xl transition-colors duration-300" :class="tone.glow"></span>
        <span class="absolute inset-3 rounded-full transition-colors duration-300" :class="tone.ring"></span>
        <span class="absolute inset-3 rounded-full border-2 border-dashed opacity-30 transition-colors duration-300" :class="tone.ic"></span>
        <span class="relative grid h-24 w-24 place-items-center rounded-full bg-card shadow-card ring-1 ring-line/60 sm:h-28 sm:w-28">
          <i class="text-4xl sm:text-5xl" :class="[def.icon, tone.ic]"></i>
        </span>
      </div>

      <!-- رمز الحالة + العنوان -->
      <span x-show="def.code" class="badge mb-3" :class="tone.badge">
        <bdi dir="ltr" x-text="def.code">404</bdi>
      </span>
      <h1 id="error-title" class="text-h1 font-extrabold text-ink" x-text="text.title">الصفحة غير موجودة</h1>
      <p class="mx-auto mt-3 max-w-md text-label leading-7 text-muted" x-text="text.desc">الرابط الذي حاولت الوصول إليه غير موجود، أو تم نقله أو حذفه. تحقّق من صحة الرابط أو عد إلى الصفحة الرئيسية.</p>

      <!-- 419: تنبيه فقدان البيانات غير المحفوظة -->
      <p x-show="type === '419'" x-cloak class="mx-auto mt-4 max-w-md rounded-xl border border-warning-500/30 bg-warning-50 p-3 text-caption font-bold text-warning-800 dark:bg-warning-500/10 dark:text-warning-500">
        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
        <span x-text="t('unsavedNote')"></span>
      </p>

      <!-- عدّاد إعادة المحاولة (429 فقط): مرئي لكنه ليس منطقة حيّة؛ الإعلان عند الصفر عبر liveMsg -->
      <div x-show="type === '429'" x-cloak class="mx-auto mt-5 max-w-xs rounded-xl border border-line bg-soft/60 p-3 text-caption font-bold text-muted">
        <p x-show="retrySeconds > 0"><span x-text="t('retryIn')"></span> <bdi dir="ltr" class="tabular-nums text-ink" x-text="fmt(retrySeconds)"></bdi> <span x-text="t('seconds')"></span></p>
        <p x-show="retrySeconds <= 0" class="text-success-700 dark:text-success-500"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> <span x-text="t('retryNow')"></span></p>
      </div>

      <!-- مقياس الحصة (quota فقط) — ?used=&limit=&resource=seats|tokens -->
      <div x-show="type === 'quota'" x-cloak class="mx-auto mt-5 max-w-xs text-start">
        <div class="mb-1.5 flex items-center justify-between gap-3 text-caption font-bold">
          <span id="quota-label" class="text-warning-700 dark:text-warning-500"><span x-text="t('quotaLabel')"></span> · <span x-text="quotaResource"></span></span>
          <bdi dir="ltr" class="text-muted tabular-nums" x-text="fmt(quota.used) + ' / ' + fmt(quota.limit)"></bdi>
        </div>
        <div class="quota-track" role="progressbar" aria-labelledby="quota-label" aria-valuemin="0" aria-valuemax="100"
             :aria-valuenow="quotaPct" :aria-valuetext="quotaValueText">
          <div class="quota-fill" :class="quotaPct >= 100 ? 'bg-error-500' : 'bg-warning-500'" :style="'width:' + quotaPct + '%'"></div>
        </div>
        <p class="mt-1.5 text-[0.75rem] text-muted"><span x-text="quotaPctText"></span> <span x-text="t('quotaOf')"></span></p>
      </div>

      <!-- رقم المرجع (500 و 429) مع زر نسخ صادق -->
      <div x-show="def.showRef" x-cloak class="mx-auto mt-5 max-w-sm rounded-xl border border-line bg-field p-3 text-caption">
        <div class="flex flex-wrap items-center justify-center gap-2">
          <span class="font-bold text-muted" x-text="t('refId')"></span>
          <code x-ref="refText" dir="ltr" class="select-all rounded bg-soft px-2 py-0.5 font-mono font-bold text-ink" x-text="refId"></code>
          <button type="button" class="pill border-line text-brand hover:bg-soft" @click="copyRef()" :aria-label="t('copyRef')">
            <i class="fa-regular" :class="copyState === 'ok' ? 'fa-circle-check' : 'fa-copy'" aria-hidden="true"></i>
            <span x-text="t('copy')"></span>
          </button>
        </div>
        <p class="mt-1.5 text-[0.75rem] text-muted" x-text="t('refHint')"></p>
        <p x-show="copyState === 'fail'" class="mt-1.5 text-[0.75rem] font-bold text-error-700 dark:text-red-300" x-text="t('copyFailed')"></p>
      </div>

      <!-- أزرار الإجراءات: مجموعة لكل حالة (ERRORS[type].actions) -->
      <div class="mt-8 flex flex-wrap items-center justify-center gap-3 sm:gap-4">
        <!-- بديل ثابت دون JavaScript (404): يُستبدل بالمجموعة الديناميكية فور تشغيل Alpine -->
        <a x-show="!ready" href="../tenant-admin/TenantDashboard.html" class="btn btn-accent btn-lg min-w-[11rem] flex-none">العودة للرئيسية</a>
        <template x-for="a in actions" :key="type + a.id">
          <span class="contents">
            <template x-if="a.href">
              <a :href="a.href" class="btn btn-lg flex-none" :class="[a.variant, a.variant !== 'btn-ghost' ? 'min-w-[11rem]' : '']">
                <i :class="a.icon" aria-hidden="true"></i>
                <span x-text="a.label"></span>
              </a>
            </template>
            <template x-if="!a.href">
              <button type="button" class="btn btn-lg flex-none" :class="[a.variant, a.variant !== 'btn-ghost' ? 'min-w-[11rem]' : '']"
                      :disabled="isDisabled(a.id)" @click="run(a.id)">
                <i :class="a.icon" aria-hidden="true"></i>
                <span x-text="a.label"></span>
              </button>
            </template>
          </span>
        </template>
      </div>
    </section>

    <!-- تذييل الإنتاج -->
    <footer class="mt-6 flex flex-wrap items-center justify-center gap-3 px-4 text-[0.8125rem] text-muted">
      <span x-text="t('rights')">© 2026 FirOb · جميع الحقوق محفوظة</span>
      <a href="../index.html" class="pill text-muted hover:bg-soft hover:text-ink">&#8962; <span x-text="t('backToMap')">خريطة الشاشات</span></a>
    </footer>
  </div>
</main>

</body>
</html>
