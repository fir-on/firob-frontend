        const file = input.files && input.files[0];
        if (!file) return;
        this.avatarError = null;
        if (!AVATAR_TYPES.includes(file.type)) this.avatarError = 'pf.errPhotoType';
        else if (file.size > AVATAR_MAX) this.avatarError = 'pf.errPhotoSize';
        if (this.avatarError) { try { input.value = ''; } catch (e) {} return; }
        if (this.avatar && this.avatar !== this.savedAvatar) URL.revokeObjectURL(this.avatar);
        this.avatar = URL.createObjectURL(file);
        try { input.value = ''; } catch (e) {}   // يسمح باختيار الملف نفسه مجددًا
        this.announce(this.t('pf.photoSelectedLive'));
      },
      removeAvatar() {
        if (this.avatar && this.avatar !== this.savedAvatar) URL.revokeObjectURL(this.avatar);
        this.avatar = null;
        this.avatarError = null;
        this.announce(this.t('pf.photoRemovedLive'));
      },
      async copyText(text, okMsg) {
        try {
          if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('no clipboard');
          await navigator.clipboard.writeText(text);
          this.announce(okMsg); this.toast(okMsg, 'success');
          return true;
        } catch (e) {
          const msg = this.t('copyFailed');
          this.announce(msg); this.toast(msg, 'error');
          return false;
        }
      },
      copyEmail() { return this.copyText(this.profile.email, this.t('pf.copied')); },

      /* ---------- التبويبات (نمط ARIA كامل) ---------- */
      tabs: [
        { key: 'personal', label: 'pf.tabPersonal' },
        { key: 'security', label: 'pf.tabSecurity' },
        { key: 'notifications', label: 'pf.tabNotifications' },
      ],
      activeTab: 'personal',
      setTab(key, focus = false) {
        if (!TABS.includes(key)) return;
        this.activeTab = key;
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('tab', key);
          history.replaceState(history.state, '', url.toString());
        } catch (e) {}
        if (focus) {
          const go = () => document.getElementById('pf-tab-btn-' + key)?.focus();
          if (this.$nextTick) this.$nextTick(go); else go();
        }
      },
      onTabKey(e) {
        const i = TABS.indexOf(this.activeTab);
        const rtl = this.locale === 'ar';
        let n = null;
        if (e.key === 'ArrowRight') n = rtl ? i - 1 : i + 1;
        else if (e.key === 'ArrowLeft') n = rtl ? i + 1 : i - 1;
        else if (e.key === 'Home') n = 0;
        else if (e.key === 'End') n = TABS.length - 1;
        if (n === null) return;
        e.preventDefault();
        this.setTab(TABS[(n + TABS.length) % TABS.length], true);
      },

      setTheme(isDark) {
        if (this.dark === isDark) return;
        this.toggleTheme();
      },

      /* ---------- النوافذ: فتح/إغلاق مع إعادة التركيز ---------- */
      opener: null,
      openModal(name, opener) {
        this.opener = opener || document.activeElement || null;
        this.modal = name;
      },
      closeModal(fallbackId) {
        if (this.modalBusy) return;
        this.modal = null;
        this.pendingAction = null; this.reauthPassword = ''; this.reauthError = false;
        this.revokeTarget = null;
        const el = this.opener; this.opener = null;
        const back = () => {
          const visible = el && el.isConnected !== false && typeof el.focus === 'function' && !el.disabled
            && (typeof el.getClientRects !== 'function' || el.getClientRects().length > 0);
          if (visible) el.focus();
          else if (fallbackId) document.getElementById(fallbackId)?.focus();
        };
        if (this.$nextTick) this.$nextTick(back); else back();
      },

      /* ---------- إعادة المصادقة قبل الإجراءات الحساسة ---------- */
      pendingAction: null,      // 'enable2fa' | 'disable2fa' | 'regenerate' | 'logoutOthers'
      reauthPassword: '',
      reauthError: false,
      get reauthDanger() { return this.pendingAction === 'disable2fa' || this.pendingAction === 'logoutOthers'; },
      requestReauth(action, opener) {
        this.pendingAction = action;
        this.reauthPassword = '';
        this.reauthError = false;
        this.opener = opener || document.activeElement || null;
        this.modal = 'reauth';
      },
      async confirmReauth() {
        if (this.modalBusy || !this.pendingAction) return false;
        if (!this.reauthPassword.trim()) {
          this.reauthError = true;
          this.$refs?.reauthPassword?.focus();
          return false;
        }
        this.modalBusy = true;
        await new Promise(r => setTimeout(r, this.delay));
        const action = this.pendingAction;
        const fallback = this.runSecureAction(action);
        this.modalBusy = false;
        this.closeModal(fallback);
        return true;
      },
      runSecureAction(action) {
        if (action === 'enable2fa') {
          this.twofa.enabled = true;
          this.twofa.setupOpen = false;
          this.twofa.verifyCode = '';
          this.recoveryCodes = generateRecoveryCodes();
          this.codesRevealed = true;
          this.addActivity('twofaEnabled', 'fa-solid fa-shield-halved', 'bg-primary-500/15 text-brand');
          this.announce(this.t('sec.twofaEnabledLive'));
          return 'sec-recovery-title';
        }
        if (action === 'disable2fa') {
          this.twofa.enabled = false;
          this.recoveryCodes = [];
          this.codesRevealed = false;
          this.twofa.secretKey = generateSecret();
          this.addActivity('twofaDisabled', 'fa-solid fa-shield-halved', 'bg-error-500/15 text-error-700 dark:text-red-300');
          this.announce(this.t('sec.twofaDisabledLive'));
          return 'sec-2fa-title';
        }
        if (action === 'regenerate') {
          this.recoveryCodes = generateRecoveryCodes();
          this.codesRevealed = true;
          this.addActivity('codesRegenerated', 'fa-solid fa-rotate', 'bg-warning-500/15 text-warning-700 dark:text-warning-500');
          this.announce(this.t('sec.codesRegeneratedLive'));
          return 'sec-recovery-title';
        }
        if (action === 'logoutOthers') {
          const n = this.otherSessions.length;
          this.sessions = this.sessions.filter(s => s.current);
          this.addActivity('othersRevoked', 'fa-solid fa-right-from-bracket', 'bg-error-500/15 text-error-700 dark:text-red-300');
          this.announce(this.tf('sec.othersRevokedLive', { n }));
          return 'sec-sessions-title';
        }
        return null;
      },

      /* ---------- المصادقة الثنائية (2FA) ---------- */
      twofa: { enabled: true, setupOpen: false, secretKey: '', verifyCode: '', verifyError: false },
      isValidTotp(code) { return TOTP_RE.test(String(code ?? '')); },
      toggleTwofa() {
        if (this.twofa.enabled) { this.requestReauth('disable2fa'); return; }
        this.twofa.setupOpen = !this.twofa.setupOpen;
        this.twofa.verifyCode = '';
        this.twofa.verifyError = false;
      },
      cancelTwofaSetup() {
        this.twofa.setupOpen = false;
        this.twofa.verifyCode = '';
        this.twofa.verifyError = false;
      },
      confirmEnableTwofa() {
        if (!this.isValidTotp(this.twofa.verifyCode.trim())) {
          this.twofa.verifyError = true;
          this.$refs?.verifyCode?.focus();
          return false;
        }
        this.twofa.verifyError = false;
        this.requestReauth('enable2fa');
        return true;
      },
      copySecretKey() { return this.copyText(this.twofa.secretKey.replace(/\s/g, ''), this.t('sec.secretCopiedLive')); },

      /* ---------- رموز الاسترداد ---------- */
      recoveryCodes: [],
      codesRevealed: false,
      generateRecoveryCodes,
      passwordScore,
      copyRecoveryCodes() { return this.copyText(this.recoveryCodes.join('\n'), this.t('sec.codesCopiedLive')); },
      downloadRecoveryCodes() {
        const text = [this.t('sec.codesFileHeader') + ' — ' + this.profile.email, new Date(this.now).toISOString(), '', ...this.recoveryCodes, ''].join('\n');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'firob-recovery-codes.txt'; a.rel = 'noopener';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        this.announce(this.t('sec.codesDownloadedLive'));
        return blob;
      },
      hideRecoveryCodes() {
        this.codesRevealed = false;
        this.announce(this.t('sec.codesHiddenLive'));
      },

      /* ---------- الجلسات النشطة ---------- */
      sessions: [
        { id: 1, device: DEV.chromeWin11, ip: '41.238.90.14', location: { ar: 'غزة، فلسطين', en: 'Gaza, Palestine' }, lastActive: ago(0), icon: 'fa-solid fa-desktop', current: true },
        { id: 2, device: DEV.safariIphone, ip: '172.56.44.9', location: { ar: 'غزة، فلسطين', en: 'Gaza, Palestine' }, lastActive: ago(3 * HOUR), icon: 'fa-solid fa-mobile-screen', current: false },
        { id: 3, device: DEV.chromeAndroid, ip: '185.94.22.61', location: { ar: 'رام الله، فلسطين', en: 'Ramallah, Palestine' }, lastActive: ago(2 * DAY), icon: 'fa-solid fa-mobile-screen', current: false },
        { id: 4, device: DEV.edgeWin10, ip: '154.119.3.72', location: { ar: 'الخليل، فلسطين', en: 'Hebron, Palestine' }, lastActive: ago(5 * DAY), icon: 'fa-solid fa-desktop', current: false },
      ],
      get otherSessions() { return this.sessions.filter(s => !s.current); },
      revokeTarget: null,
      askRevokeSession(s, opener) {
        if (!s || s.current) return;
        this.revokeTarget = s;
        this.openModal('revoke', opener);
      },
      async confirmRevokeSession() {
        if (this.modalBusy || !this.revokeTarget || this.revokeTarget.current) return false;
        this.modalBusy = true;
        await new Promise(r => setTimeout(r, this.delay));
        const target = this.revokeTarget;
        this.sessions = this.sessions.filter(s => s.id !== target.id);
        this.addActivity('sessionRevoked', 'fa-solid fa-xmark', 'bg-error-500/15 text-error-700 dark:text-red-300', target.device);
        this.announce(this.tf('sec.sessionRevokedLive', { device: this.L(target.device) }));
        this.modalBusy = false;
        this.opener = null;   // الصف أُزيل → التركيز يعود لعنوان القسم
        this.closeModal('sec-sessions-title');
        return true;
      },

      /* ---------- كلمة المرور ---------- */
      password: { current: '', new: '', confirm: '', showCurrent: false, showNew: false, showConfirm: false },
      pwErrors: {},
      pwSubmitted: false,
      pwBusy: false,
      get pwScore() { return passwordScore(this.password.new); },
      get strengthColor() { return ['bg-error-600', 'bg-error-600', 'bg-warning-500', 'bg-primary-500', 'bg-success-500'][this.pwScore]; },
      get strengthText() { return ['text-danger', 'text-danger', 'text-warning-800 dark:text-warning-500', 'text-brand', 'text-success-700 dark:text-success-500'][this.pwScore]; },
      validatePassword() {
        const p = this.password, e = {};
        if (!p.current) e.current = 'sec.errCurrentRequired';
        if (!p.new) e.new = 'sec.errNewRequired';
        else if (p.new.length < 8) e.new = 'sec.errNewShort';
        else if (p.current && p.new === p.current) e.new = 'sec.errNewSame';
        else if (passwordScore(p.new) < 2) e.new = 'sec.errNewWeak';
        if (p.new && p.confirm !== p.new) e.confirm = 'sec.errConfirmMismatch';
        else if (!p.new && !p.confirm) { /* يكفي خطأ الحقل الجديد */ }
        this.pwErrors = e;
        return e;
      },
      pwRevalidate() { if (this.pwSubmitted) this.validatePassword(); },
      async updatePassword() {
        if (this.pwBusy) return false;
        this.pwSubmitted = true;
        const e = this.validatePassword();
        const first = ['current', 'new', 'confirm'].find(k => e[k]);
        if (first) {
          const ids = { current: 'sec-current-password', new: 'sec-new-password', confirm: 'sec-confirm-password' };
          const go = () => document.getElementById(ids[first])?.focus();
          if (this.$nextTick) this.$nextTick(go); else go();
          return false;
        }
        this.pwBusy = true;
        await new Promise(r => setTimeout(r, this.delay));
        Object.assign(this.password, { current: '', new: '', confirm: '', showCurrent: false, showNew: false, showConfirm: false });
        this.pwErrors = {}; this.pwSubmitted = false;
        this.addActivity('passwordChanged', 'fa-solid fa-key', 'bg-primary-500/15 text-brand');
        this.announce(this.t('sec.passwordUpdatedLive'));
        this.toast(this.t('sec.passwordUpdatedLive'), 'success');
        this.pwBusy = false;
        return true;
      },

      /* ---------- سجل النشاط الأمني ---------- */
      securityActivity: [
        { id: 1, key: 'login', device: DEV.chromeWin11, at: ago(10 * MIN), icon: 'fa-solid fa-right-to-bracket', tone: 'bg-success-500/15 text-success-700 dark:text-success-500' },
        { id: 2, key: 'newDeviceLogin', device: DEV.chromeAndroid, at: ago(3 * HOUR), icon: 'fa-solid fa-triangle-exclamation', tone: 'bg-warning-500/15 text-warning-700 dark:text-warning-500' },
        { id: 3, key: 'twofaEnabled', at: ago(2 * DAY), icon: 'fa-solid fa-shield-halved', tone: 'bg-primary-500/15 text-brand' },
        { id: 4, key: 'passwordChanged', at: ago(7 * DAY), icon: 'fa-solid fa-key', tone: 'bg-primary-500/15 text-brand' },
        { id: 5, key: 'sessionRevoked', device: { ar: 'Safari على iPhone 13', en: 'Safari on iPhone 13' }, at: ago(14 * DAY), icon: 'fa-solid fa-xmark', tone: 'bg-error-500/15 text-error-700 dark:text-red-300' },
      ],
      nextActivityId: 100,
      addActivity(key, icon, tone, device) {
        this.securityActivity = [{ id: this.nextActivityId++, key, device: device || null, at: new Date().toISOString(), icon, tone }, ...this.securityActivity];
        this.now = Date.now();
      },
      activityText(a) { return this.tf('sec.activity.' + a.key, { device: this.L(a.device) }); },

      /* ---------- شريط الحفظ ---------- */
      delay: 500,
      async saveChanges() {
        if (this.busy) return false;
        this.showSummary = true;
        if (!this.validatePersonal()) {
          const first = this.personalErrorKeys[0];
          this.setTab('personal');
          const go = () => this.focusField(first);
          if (this.$nextTick) this.$nextTick(go); else go();
          return false;
        }
        this.busy = true;
        await new Promise(r => setTimeout(r, this.delay));
        const f = this.form;
        const email = f.email.trim();
        this.profile.name = { ar: f.nameAr.trim(), en: f.nameEn.trim() };
        this.profile.phone = f.phone.trim().replace(/\s+/g, ' ');
        this.profile.bio = f.bio.trim();
        let emailMsg = null;
        if (email.toLowerCase() !== this.profile.email.toLowerCase()) {
          if (this.profile.pendingEmail !== email) {
            this.addActivity('emailChangeRequested', 'fa-regular fa-envelope', 'bg-info-500/15 text-info-700 dark:text-blue-300');
            emailMsg = this.tf('pf.savedEmailLive', { email });
          }
          this.profile.pendingEmail = email;
        } else {
          this.profile.pendingEmail = null;
        }
        this.form = this.formFromProfile();
        if (this.savedAvatar && this.savedAvatar !== this.avatar) URL.revokeObjectURL(this.savedAvatar);
        this.savedAvatar = this.avatar;
        this.savedPrefs = clone(this.notifPrefs);
        this.takeSnapshot();
        this.showSummary = false;
        this.busy = false;
        const msg = emailMsg || this.t('pf.savedLive');
        this.announce(msg);
        this.toast(msg, 'success');
        return true;
      },
      savedPrefs: null,
      discardChanges() {
        if (this.busy) return;
        const snap = JSON.parse(this.snapshot);
        this.form = snap.form;
        if (this.avatar && this.avatar !== this.savedAvatar) URL.revokeObjectURL(this.avatar);
        this.avatar = this.savedAvatar;
        this.avatarError = null;
        this.notifPrefs = snap.prefs;
        this.errors = {}; this.touched = {}; this.showSummary = false; this.lastBioMark = null; this.bioLive = '';
        this.announce(this.t('pf.discardedLive'));
      },

      /* ---------- SweetAlert2: تنبيهات (مؤجَّل التحميل → حماية) ---------- */
      toast(msg, icon = 'success') {
        if (!window.Swal) return;
        window.Swal.fire({
          toast: true, position: 'top-end', icon, title: msg,
          showConfirmButton: false, timer: 3000,
          customClass: { popup: 'firob-swal firob-toast' },
        });
      },

      /* ---------- عامة ---------- */
      init() {
        this.twofa.secretKey = generateSecret();
        this.recoveryCodes = generateRecoveryCodes();   // موجودة مسبقًا ومخفية (عُرضت عند التفعيل)
        this.codesRevealed = false;
        this.form = this.formFromProfile();
        this.savedPrefs = clone(this.notifPrefs);
        this.takeSnapshot();
        document.title = this.t('pf.title') + ' — FirOb';
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        wideMQ.addEventListener('change', (m) => { this.wide = m.matches; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        try {
          const tabParam = new URLSearchParams(window.location.search).get('tab');
          if (TABS.includes(tabParam)) this.activeTab = tabParam;
        } catch (e) {}
        window.addEventListener('beforeunload', (e) => {
          if (!this.dirty) return;
          e.preventDefault();
          e.returnValue = '';
        });
        const timer = setInterval(() => { this.now = Date.now(); }, 60 * 1000);
        if (timer && typeof timer.unref === 'function') timer.unref();
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      /* Escape على مستوى النافذة يغلق القوائم فقط — النوافذ تعالج Escape بنفسها (.stop) */
      closeAll() {
        if (this.modal) return;
        this.notifOpen = false; this.profileOpen = false; this.mobileNav = false;
      },
    };
  }
</script>
</body>
</html>
