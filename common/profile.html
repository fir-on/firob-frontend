<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>الملف الشخصي والإعدادات — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  {@apply bg-accent-500/20 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink dark:bg-soft-2; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-muted; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- التبويبات (Profile Tabs) ---------- */
    .tab-btn { @apply inline-flex shrink-0 items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-bold text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .tab-btn[aria-selected="true"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-500 hover:text-white; }

    /* ---------- مفتاح التبديل (Switch) ---------- */
    .switch { @apply inline-flex cursor-pointer items-center gap-3 text-sm font-medium; }
    .switch-track { @apply relative h-6 w-11 shrink-0 rounded-full transition-colors; background: rgb(var(--line-strong)); }
    .switch-track::after { content: ''; @apply absolute start-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform; }
    .peer:checked ~ .switch-track { @apply bg-primary-500; }
    .peer:checked ~ .switch-track::after { transform: translateX(1.25rem); }
    [dir='rtl'] .peer:checked ~ .switch-track::after { transform: translateX(-1.25rem); }
    .peer:focus-visible ~ .switch-track { box-shadow: var(--ring); }
    .switch-track { box-shadow: inset 0 0 0 1px rgb(var(--line-strong)); }
    /* زر الكاميرا: label يلف input مخفيًا → حلقة التركيز عبر focus-within */
    .avatar-trigger:focus-within { box-shadow: var(--ring); }

    /* ---------- النافذة المنبثقة ---------- */
    .modal-panel { @apply relative flex max-h-[90dvh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }

    /* ---------- رموز الاسترداد (Recovery Codes) ---------- */
    .code-chip { @apply select-all rounded-lg border border-line bg-field px-3 py-2 text-center font-mono text-sm tracking-wide text-ink; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }

    /* ---------- [layout: full-height sidebar + bottom footer] ---------- */
    html, body { min-height: 100%; }
    body { margin: 0; }
    .app-col { min-height: 100vh; min-height: 100dvh; }
    @media (min-width: 1024px) {
      #sidebar { height: 100vh; height: 100dvh; }
      .app-col { margin-inline-start: 18rem; transition: margin-inline-start .3s ease; }
      .app-col.is-collapsed { margin-inline-start: 5rem; }
      .save-bar { inset-inline-start: 18rem; transition: inset-inline-start .3s ease; }
      .save-bar.is-collapsed { inset-inline-start: 5rem; }
    }
</style>

<!-- ⑥ Alpine.js (+ إضافة Focus لحصر التركيز داخل النوافذ المنبثقة) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- ⑦ SweetAlert2 -->
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5"></script>
</head>

<body x-data="shell()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch.focus(); }"
      @scroll.window="openMenuId = null" @resize.window="openMenuId = null"
      :class="{ 'overflow-hidden': (mobileNav && mobile) || modal }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <span class="inline-flex min-w-0 flex-1 items-center gap-3" :class="!expanded && 'lg:flex-none lg:justify-center'">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </span>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-muted" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="(item.key === 'notificationCenter' ? unread : item.count) && expanded"
                        class="shrink-0 rounded-full text-xs"
                        :class="item.tone === 'primary' ? 'bg-primary-500/10 px-2 py-0.5 font-bold text-brand' : 'bg-accent-500 px-2 font-extrabold text-onaccent'"
                        x-text="item.key === 'notificationCenter' ? unread : item.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="app-col flex min-w-0 flex-1 flex-col" :class="collapsed && 'is-collapsed'">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex"><bdi dir="ltr">Ctrl K</bdi></kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="t('notif.' + n.key)"></p>
                      <time class="text-xs text-muted" :datetime="n.at" :title="fmtDateTime(n.at)" x-text="rel(n.at)"></time>
                    </div>
                  </li>
                </template>
              </ul>
              <div class="border-t border-line p-2">
                <a href="notifications.html" class="menu-item justify-center text-brand" @click="notifOpen = false">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  <span x-text="t('viewAllNotif')"></span>
                </a>
              </div>
            </div>
          </div>

          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" class="flex max-w-[14rem] items-center gap-2 rounded-xl p-1 transition hover:bg-soft focus-visible:ring-2 md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    aria-haspopup="menu" :aria-expanded="profileOpen.toString()" aria-controls="profile-menu" :aria-label="displayName + ' — ' + t('accountMenu')">
              <span class="grid h-9 w-9 shrink-0 place-items-center overflow-hidden rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true"><img x-show="savedAvatar" x-cloak :src="savedAvatar || ''" alt="" class="h-full w-full object-cover"><span x-show="!savedAvatar" x-text="initials"></span></span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="displayName"></span>
                <span class="block truncate text-xs text-muted" x-text="t('pf.roles.' + role)"></span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted md:block" aria-hidden="true"></i>
            </button>
            <div id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-56" role="menu" :aria-label="t('accountMenu')">
              <a href="profile.html" role="menuitem" class="menu-item" aria-current="page"><i class="fa-regular fa-user w-4 text-brand" aria-hidden="true"></i> <span x-text="t('profile')"></span></a>
              <button type="button" role="menuitem" class="menu-item cursor-not-allowed opacity-60" aria-disabled="true" tabindex="-1"><i class="fa-solid fa-gear w-4 text-muted" aria-hidden="true"></i> <span x-text="t('settings')"></span></button>
              <a href="errors.html" role="menuitem" class="menu-item"><i class="fa-solid fa-triangle-exclamation w-4 text-muted" aria-hidden="true"></i> <span x-text="t('systemStatus')"></span></a>
              <div role="separator" class="border-t border-line"></div>
              <a href="../auth/login.html" role="menuitem" class="menu-item !text-danger"><i class="fa-solid fa-arrow-right-from-bracket w-4" aria-hidden="true"></i> <span x-text="t('logout')"></span></a>
            </div>
          </div>
        </div>
      </div>

      <!-- زبدة الخبز (Breadcrumb) -->
      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="locale === 'ar' ? 'مسار التنقل' : 'Breadcrumb'">
          <ol class="flex items-center gap-2" role="list">
            <li><a href="../index.html" class="hover:text-brand hover:underline" x-text="t('breadcrumb.home')"></a></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li class="text-ink" x-text="t('pf.title')"></li>
          </ol>
        </nav>
      </div>
    </header>

    <!-- ================= المحتوى الرئيسي — الملف الشخصي والإعدادات ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1000px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">

      <!-- منطقة إعلان نتائج الإجراءات لقارئات الشاشة -->
      <p class="sr-only" aria-live="polite" x-text="liveMsg"></p>

      <!-- العنوان + روابط الرجوع السريع (حسب الدور) -->
      <section class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end sm:justify-between">
        <div class="min-w-0">
          <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="t('pf.title')"></h1>
          <p class="mt-1 text-sm text-muted sm:text-base" x-text="t('pf.subtitle')"></p>
        </div>
        <nav class="flex shrink-0 flex-wrap items-center gap-2" :aria-label="t('pf.quickNavLabel')" x-show="canSeeTenantLink || canSeePlatformLink">
          <span class="hidden text-xs font-bold text-muted sm:inline" aria-hidden="true" x-text="t('pf.quickNavLabel')"></span>
          <a href="../tenant-admin/TenantDashboard.html" class="btn btn-outline btn-sm" x-show="canSeeTenantLink">
            <i class="fa-solid fa-gauge-high" aria-hidden="true"></i>
            <span x-text="t('pf.backToTenant')"></span>
          </a>
          <a href="../super-admin/overview.html" class="btn btn-outline btn-sm" x-show="canSeePlatformLink">
            <i class="fa-solid fa-crown" aria-hidden="true"></i>
            <span x-text="t('pf.backToPlatform')"></span>
          </a>
        </nav>
      </section>

      <!-- ================= بطاقة نظرة عامة على المستخدم (Avatar Card) ================= -->
      <section class="panel p-4 sm:p-6" aria-labelledby="pf-user-name">
        <div class="flex flex-col items-start gap-5 sm:flex-row">

          <!-- الصورة الرمزية + تحديثها -->
          <div class="flex shrink-0 flex-col items-center gap-3">
            <div class="relative h-24 w-24 sm:h-28 sm:w-28">
              <div class="grid h-full w-full place-items-center overflow-hidden rounded-2xl bg-soft ring-4 ring-card">
                <img x-show="avatar" x-cloak :src="avatar || ''" class="h-full w-full object-cover" :alt="tf('pf.avatarAlt', { name: displayName })">
                <span x-show="!avatar" class="text-3xl font-extrabold text-brand" aria-hidden="true" x-text="initials"></span>
              </div>
              <label for="avatar-input"
                     class="avatar-trigger absolute -bottom-1 -end-1 grid h-10 w-10 cursor-pointer place-items-center rounded-full border-2 border-card bg-primary-500 text-white shadow-lg transition hover:bg-primary-600"
                     :title="t('pf.changePhoto')">
                <i class="fa-solid fa-camera text-sm" aria-hidden="true"></i>
                <input id="avatar-input" x-ref="avatarInput" type="file" accept="image/png,image/jpeg,image/webp" class="sr-only"
                       @change="onAvatarChange($event)" :aria-label="t('pf.changePhoto')"
                       :aria-invalid="avatarError ? 'true' : null" aria-describedby="pf-photo-hint pf-photo-error">
              </label>
            </div>
            <div class="flex flex-col items-center gap-1 text-center">
              <button type="button" class="text-xs font-bold text-danger hover:underline disabled:cursor-not-allowed disabled:text-muted disabled:no-underline"
                      :disabled="!avatar" @click="removeAvatar()" x-text="t('pf.removePhoto')"></button>
              <p id="pf-photo-hint" class="max-w-[10rem] text-[11px] leading-4 text-muted" x-text="t('pf.photoHint')"></p>
              <p id="pf-photo-error" class="err max-w-[12rem] justify-center" role="alert" x-show="avatarError" x-cloak>
                <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="avatarError ? t(avatarError) : ''"></span>
              </p>
              <p class="badge badge-accent" x-show="avatarDirty" x-cloak x-text="t('pf.photoUnsaved')"></p>
            </div>
          </div>

          <!-- بيانات المستخدم (من آخر حفظ — لا تتغير أثناء الكتابة) -->
          <div class="min-w-0 flex-1">
            <h2 id="pf-user-name" class="truncate text-xl font-extrabold leading-tight text-ink" x-text="displayName"></h2>
            <div class="mt-1 flex flex-wrap items-center gap-1.5">
              <p class="truncate text-sm text-muted" dir="ltr" :style="ltrAlign" x-text="profile.email"></p>
              <button type="button" class="act group relative h-7 w-7" @click="copyEmail()" :aria-label="t('pf.copyEmail')">
                <i class="fa-regular fa-copy text-xs" aria-hidden="true"></i>
                <span class="tooltip-arrow" aria-hidden="true"></span>
                <span class="tooltip-bubble" aria-hidden="true" x-text="t('pf.copyEmail')"></span>
              </button>
            </div>
            <p class="mt-1 text-xs font-bold text-yellow-900 dark:text-accent-500" x-show="profile.pendingEmail" x-cloak>
              <i class="fa-regular fa-envelope" aria-hidden="true"></i>
              <span x-text="tf('pf.pendingEmailShort', { email: profile.pendingEmail || '' })"></span>
            </p>

            <div class="mt-3 flex flex-wrap items-center gap-2">
              <span class="badge badge-primary" x-text="t('pf.roles.' + role)"></span>
              <span class="badge badge-success"><span class="h-1.5 w-1.5 rounded-full bg-current" aria-hidden="true"></span><span x-text="t('pf.statusActive')"></span></span>
            </div>

            <p class="mt-3 text-xs text-muted">
              <span x-text="t('pf.belongsTo')"></span>: <span class="font-bold text-ink" x-text="L(profile.tenant)"></span>
              <span class="mx-1.5 text-muted" aria-hidden="true">·</span>
              <span x-text="t('pf.joinedLabel')"></span>: <time class="font-bold text-ink" :datetime="profile.joined" x-text="fmtDate(profile.joined)"></time>
            </p>
          </div>
        </div>
      </section>

      <!-- ================= تنقّل الأقسام (Tabs) ================= -->
      <section class="panel p-2 sm:p-3">
        <!-- قائمة منسدلة — للجوال (متزامنة مع التبويبات و ?tab=) -->
        <div class="relative sm:hidden">
          <label for="pf-tab-select" class="sr-only" x-text="t('pf.tabsLabel')"></label>
          <select id="pf-tab-select" :value="activeTab" @change="setTab($event.target.value)" class="field w-full appearance-none pe-9 font-bold">
            <template x-for="tb in tabs" :key="tb.key">
              <option :value="tb.key" :selected="activeTab === tb.key" x-text="t(tb.label)"></option>
            </template>
          </select>
          <i class="fa-solid fa-chevron-down pointer-events-none absolute end-3.5 top-1/2 -translate-y-1/2 text-xs text-muted" aria-hidden="true"></i>
        </div>
        <!-- تبويبات — سطح المكتب: tabindex متنقل + الأسهم (حسب الاتجاه) + Home/End -->
        <div role="tablist" class="hidden items-center gap-1 overflow-x-auto scroll-thin sm:flex" :aria-label="t('pf.tabsLabel')" @keydown="onTabKey($event)">
          <button type="button" role="tab" id="pf-tab-btn-personal" aria-controls="pf-tab-panel-personal"
                  :aria-selected="(activeTab === 'personal').toString()" :tabindex="activeTab === 'personal' ? 0 : -1"
                  class="tab-btn" @click="setTab('personal')">
            <i class="fa-regular fa-user" aria-hidden="true"></i> <span x-text="t('pf.tabPersonal')"></span>
          </button>
          <button type="button" role="tab" id="pf-tab-btn-security" aria-controls="pf-tab-panel-security"
                  :aria-selected="(activeTab === 'security').toString()" :tabindex="activeTab === 'security' ? 0 : -1"
                  class="tab-btn" @click="setTab('security')">
            <i class="fa-solid fa-shield-halved" aria-hidden="true"></i> <span x-text="t('pf.tabSecurity')"></span>
          </button>
          <button type="button" role="tab" id="pf-tab-btn-notifications" aria-controls="pf-tab-panel-notifications"
                  :aria-selected="(activeTab === 'notifications').toString()" :tabindex="activeTab === 'notifications' ? 0 : -1"
                  class="tab-btn" @click="setTab('notifications')">
            <i class="fa-regular fa-bell" aria-hidden="true"></i> <span x-text="t('pf.tabNotifications')"></span>
          </button>
        </div>
      </section>

      <!-- ================= Tab 1: البيانات الشخصية ================= -->
      <section id="pf-tab-panel-personal" role="tabpanel" aria-labelledby="pf-tab-btn-personal" x-show="activeTab === 'personal'" x-cloak class="panel space-y-5 p-4 sm:p-6">
        <h2 class="sr-only" x-text="t('pf.tabPersonal')"></h2>

        <!-- ملخص الأخطاء (يظهر بعد محاولة الحفظ) -->
        <div id="pf-error-summary" tabindex="-1" role="alert" x-show="showSummary && personalErrorKeys.length" x-cloak
             class="rounded-xl border border-error-600/40 bg-error-500/5 p-4 text-sm">
          <p class="font-extrabold text-danger" x-text="tf('pf.errorSummary', { n: personalErrorKeys.length })"></p>
          <ul class="mt-2 list-disc space-y-1 ps-5" role="list">
            <template x-for="k in personalErrorKeys" :key="k">
              <li><a :href="'#' + fieldIds[k]" class="font-bold text-danger underline underline-offset-2" @click.prevent="focusField(k)" x-text="t(errors[k])"></a></li>
            </template>
          </ul>
        </div>

        <div class="grid gap-5 sm:grid-cols-2">
          <div>
            <label for="pf-name-ar" class="label"><span x-text="t('pf.fieldNameAr')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
            <input id="pf-name-ar" type="text" lang="ar" dir="rtl" x-model="form.nameAr" class="field" required aria-required="true" autocomplete="name" maxlength="80"
                   @blur="touch('nameAr')" @input="revalidate('nameAr')"
                   :aria-invalid="errors.nameAr ? 'true' : 'false'" :aria-describedby="errors.nameAr ? 'pf-name-ar-err' : null">
            <p id="pf-name-ar-err" class="err" role="alert" x-show="errors.nameAr" x-cloak><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="errors.nameAr ? t(errors.nameAr) : ''"></span></p>
          </div>
          <div>
            <label for="pf-name-en" class="label"><span x-text="t('pf.fieldNameEn')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
            <input id="pf-name-en" type="text" lang="en" dir="ltr" :style="ltrAlign" x-model="form.nameEn" class="field" required aria-required="true" maxlength="80"
                   @blur="touch('nameEn')" @input="revalidate('nameEn')"
                   :aria-invalid="errors.nameEn ? 'true' : 'false'" :aria-describedby="errors.nameEn ? 'pf-name-en-err' : null">
            <p id="pf-name-en-err" class="err" role="alert" x-show="errors.nameEn" x-cloak><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="errors.nameEn ? t(errors.nameEn) : ''"></span></p>
          </div>
          <div>
            <label for="pf-email" class="label"><span x-text="t('pf.fieldEmail')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
            <input id="pf-email" type="email" x-model="form.email" dir="ltr" :style="ltrAlign" class="field" required aria-required="true" autocomplete="email"
                   @blur="touch('email')" @input="revalidate('email')"
                   :aria-invalid="errors.email ? 'true' : 'false'"
                   :aria-describedby="[errors.email ? 'pf-email-err' : '', emailChangeState ? 'pf-email-note' : ''].filter(Boolean).join(' ') || null">
            <p id="pf-email-err" class="err" role="alert" x-show="errors.email" x-cloak><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="errors.email ? t(errors.email) : ''"></span></p>
            <div id="pf-email-note" x-show="emailChangeState" x-cloak class="mt-2 flex items-start gap-2 rounded-lg border border-info-500/30 bg-info-500/10 p-2.5 text-xs font-bold leading-5 text-info-800 dark:text-blue-300">
              <i class="fa-solid fa-circle-info mt-0.5 shrink-0" aria-hidden="true"></i>
              <div class="min-w-0">
                <p x-show="emailChangeState === 'editing'" x-text="t('pf.emailChangeNotice')"></p>
                <p x-show="emailChangeState === 'pending'" x-text="tf('pf.emailPendingNotice', { pending: profile.pendingEmail || '', current: profile.email })"></p>
                <button type="button" class="mt-1 underline underline-offset-2" x-show="emailChangeState === 'pending'" @click="cancelPendingEmail()" x-text="t('pf.cancelEmailChange')"></button>
              </div>
            </div>
          </div>
          <div>
            <label for="pf-phone" class="label" x-text="t('pf.fieldPhone')"></label>
            <input id="pf-phone" type="tel" x-model="form.phone" dir="ltr" :style="ltrAlign" class="field" autocomplete="tel" inputmode="tel" placeholder="+970 59 123 4567"
                   @blur="touch('phone')" @input="revalidate('phone')"
                   :aria-invalid="errors.phone ? 'true' : 'false'" :aria-describedby="errors.phone ? 'pf-phone-hint pf-phone-err' : 'pf-phone-hint'">
            <p id="pf-phone-hint" class="hint" x-text="t('pf.phoneHint')"></p>
            <p id="pf-phone-err" class="err" role="alert" x-show="errors.phone" x-cloak><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="errors.phone ? t(errors.phone) : ''"></span></p>
          </div>
          <!-- المؤسسة: صفة للمستأجر — للقراءة فقط -->
          <div class="sm:col-span-2">
            <p class="label" x-text="t('pf.fieldInstitution')"></p>
            <p class="rounded-lg border border-line bg-soft px-3.5 py-2.5 text-sm font-bold text-ink">
              <span x-text="L(profile.jobTitle)"></span> <span class="text-muted" aria-hidden="true">—</span> <span x-text="L(profile.tenant)"></span>
            </p>
            <p class="hint" x-text="t('pf.institutionHint')"></p>
          </div>
          <div class="sm:col-span-2">
            <label for="pf-bio" class="label" x-text="t('pf.fieldBio')"></label>
            <textarea id="pf-bio" rows="4" x-model="form.bio" maxlength="280" class="field resize-none"
                      @input="onBioInput(); revalidate('bio')" @blur="touch('bio')"
                      :aria-invalid="errors.bio ? 'true' : 'false'" :aria-describedby="errors.bio ? 'pf-bio-count pf-bio-err' : 'pf-bio-count'"></textarea>
            <p id="pf-bio-count" class="hint tabular-nums" :class="bioRemaining <= 20 && 'font-bold text-yellow-900 dark:text-accent-500'"
               x-text="tf('pf.bioCounter', { n: form.bio.length, max: BIO_MAX })"></p>
            <p class="sr-only" aria-live="polite" x-text="bioLive"></p>
            <p id="pf-bio-err" class="err" role="alert" x-show="errors.bio" x-cloak><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="errors.bio ? t(errors.bio) : ''"></span></p>
          </div>
        </div>
      </section>

      <!-- ================= Tab 2: الأمان والخصوصية ================= -->
      <section id="pf-tab-panel-security" role="tabpanel" aria-labelledby="pf-tab-btn-security" x-show="activeTab === 'security'" x-cloak class="space-y-4 sm:space-y-6">
        <h2 class="sr-only" x-text="t('pf.tabSecurity')"></h2>

        <!-- ---------- المصادقة الثنائية (2FA) ---------- -->
        <div class="panel p-4 sm:p-6" role="region" aria-labelledby="sec-2fa-title">
          <div class="flex flex-wrap items-start justify-between gap-4">
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-2.5">
                <h3 id="sec-2fa-title" tabindex="-1" class="text-sm font-extrabold text-ink focus:outline-none" x-text="t('sec.twofaTitle')"></h3>
                <span class="badge" :class="twofa.enabled ? 'badge-success' : 'badge-muted'">
                  <span class="h-1.5 w-1.5 rounded-full bg-current" aria-hidden="true"></span>
                  <span x-text="twofa.enabled ? t('sec.statusEnabled') : t('sec.statusDisabled')"></span>
                </span>
              </div>
              <p id="sec-2fa-desc" class="mt-1.5 max-w-xl text-sm text-muted" x-text="t('sec.twofaDesc')"></p>
            </div>

            <button type="button" role="switch" :aria-checked="twofa.enabled.toString()" :aria-label="t('sec.twofaToggleLabel')" aria-describedby="sec-2fa-desc"
                    class="relative inline-flex h-7 w-[3.25rem] shrink-0 items-center rounded-full border px-px transition-colors focus-visible:ring-2"
                    :class="twofa.enabled ? 'justify-end border-primary-700 bg-primary-500' : 'justify-start border-line-strong bg-line-strong/40'"
                    @click="toggleTwofa()">
              <!-- الموضع عبر justify-start/end (منطقي — يعمل في RTL و LTR) -->
              <span class="inline-block h-6 w-6 rounded-full bg-white shadow ring-1 ring-line-strong/60"></span>
            </button>
          </div>

          <!-- تدفّق التفعيل (Setup Flow) -->
          <div x-show="twofa.setupOpen" x-cloak x-transition class="mt-5 space-y-5 rounded-xl border border-line bg-soft/40 p-4 sm:p-5">
            <div class="flex flex-wrap items-center gap-2">
              <span class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-primary-500 text-xs font-extrabold text-white" aria-hidden="true">1</span>
              <h4 class="text-sm font-extrabold text-ink" x-text="t('sec.step1Title')"></h4>
            </div>
            <p class="text-sm text-muted" x-text="t('sec.step1Desc')"></p>

            <div class="flex flex-col items-start gap-5 sm:flex-row">
              <!-- صندوق رمز QR (توضيحي) -->
              <div class="grid h-36 w-36 shrink-0 place-items-center rounded-xl border-2 border-dashed border-line-strong bg-field text-muted" role="img" :aria-label="t('sec.qrAlt')">
                <i class="fa-solid fa-qrcode text-5xl" aria-hidden="true"></i>
              </div>

              <div class="min-w-0 flex-1 space-y-3">
                <div>
                  <label for="sec-secret-key" class="label" x-text="t('sec.secretKeyLabel')"></label>
                  <div class="relative">
                    <input id="sec-secret-key" type="text" readonly :value="twofa.secretKey" aria-describedby="sec-secret-hint"
                           dir="ltr" :style="ltrAlign" class="field pe-11 font-mono tracking-wider">
                    <button type="button" class="group absolute inset-y-0 end-0 grid w-11 place-items-center text-muted transition hover:text-brand"
                            @click="copySecretKey()" :aria-label="t('sec.copySecretKey')">
                      <i class="fa-regular fa-copy text-sm" aria-hidden="true"></i>
                      <span class="tooltip-arrow" aria-hidden="true"></span>
                      <span class="tooltip-bubble" aria-hidden="true" x-text="t('sec.copySecretKey')"></span>
                    </button>
                  </div>
                  <p id="sec-secret-hint" class="hint" x-text="t('sec.secretKeyHint')"></p>
                </div>
              </div>
            </div>

            <div class="border-t border-line pt-5">
              <div class="flex flex-wrap items-center gap-2">
                <span class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-primary-500 text-xs font-extrabold text-white" aria-hidden="true">2</span>
                <h4 class="text-sm font-extrabold text-ink" x-text="t('sec.step2Title')"></h4>
              </div>
              <div class="mt-3 flex flex-col gap-3 sm:flex-row sm:items-start">
                <div class="w-full sm:max-w-[12rem]">
                  <label for="sec-verify-code" class="sr-only" x-text="t('sec.verifyLabel')"></label>
                  <input id="sec-verify-code" x-ref="verifyCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"
                         x-model="twofa.verifyCode" @input="twofa.verifyError = false" @keydown.enter.prevent="confirmEnableTwofa()"
                         :placeholder="t('sec.verifyPlaceholder')" dir="ltr" style="text-align:center"
                         :aria-invalid="twofa.verifyError ? 'true' : 'false'"
                         :aria-describedby="twofa.verifyError ? 'sec-verify-hint sec-verify-err' : 'sec-verify-hint'"
                         class="field text-center font-mono text-lg tracking-[0.35em]">
                  <p id="sec-verify-err" class="err" role="alert" x-show="twofa.verifyError" x-cloak>
                    <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="t('sec.verifyError')"></span>
                  </p>
                </div>
                <div class="flex shrink-0 gap-2">
                  <button type="button" class="btn btn-primary" @click="confirmEnableTwofa()">
                    <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                    <span x-text="t('sec.btnVerifyEnable')"></span>
                  </button>
                  <button type="button" class="btn btn-outline" @click="cancelTwofaSetup()" x-text="t('sec.cancel')"></button>
                </div>
              </div>
              <p id="sec-verify-hint" class="hint" x-text="t('sec.verifyHint')"></p>
            </div>
          </div>
        </div>

        <!-- ---------- رموز الاسترداد (Recovery Codes) ---------- -->
        <div x-show="twofa.enabled" x-cloak x-transition class="panel p-4 sm:p-6" role="region" aria-labelledby="sec-recovery-title">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0">
              <h3 id="sec-recovery-title" tabindex="-1" class="text-sm font-extrabold text-ink focus:outline-none" x-text="t('sec.recoveryTitle')"></h3>
              <p class="mt-1 max-w-xl text-sm text-muted" x-text="t('sec.recoverySubtitle')"></p>
            </div>
          </div>

          <!-- (أ) الرموز ظاهرة مرة واحدة بعد التوليد -->
          <template x-if="codesRevealed && recoveryCodes.length">
            <div>
              <div class="mt-3 flex items-start gap-2.5 rounded-xl border border-warning-500/30 bg-warning-50 p-3.5 text-warning-800 dark:bg-warning-500/10 dark:text-warning-500">
                <i class="fa-solid fa-triangle-exclamation mt-0.5 shrink-0" aria-hidden="true"></i>
                <p class="text-xs font-bold leading-5" x-text="t('sec.recoveryWarning')"></p>
              </div>

              <ul class="mt-4 grid grid-cols-2 gap-2.5 sm:grid-cols-3" role="list" dir="ltr" :aria-label="t('sec.recoveryTitle')">
                <template x-for="code in recoveryCodes" :key="code">
                  <li class="code-chip" x-text="code"></li>
                </template>
              </ul>

              <div class="mt-5 flex flex-wrap gap-2.5">
                <button type="button" class="btn btn-outline btn-sm" @click="copyRecoveryCodes()">
                  <i class="fa-regular fa-copy" aria-hidden="true"></i>
                  <span x-text="t('sec.btnCopyAll')"></span>
                </button>
                <button type="button" class="btn btn-outline btn-sm" @click="downloadRecoveryCodes()">
                  <i class="fa-solid fa-download" aria-hidden="true"></i>
                  <span x-text="t('sec.btnDownload')"></span>
                </button>
                <button type="button" class="btn btn-primary btn-sm ms-auto" @click="hideRecoveryCodes()">
                  <i class="fa-solid fa-check" aria-hidden="true"></i>
                  <span x-text="t('sec.btnCodesSaved')"></span>
                </button>
              </div>
            </div>
          </template>

          <!-- (ب) الرموز مخفية بعد عرضها -->
          <template x-if="!codesRevealed || !recoveryCodes.length">
            <div class="mt-4 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-dashed border-line-strong p-4">
              <p class="flex min-w-0 items-start gap-2 text-sm text-muted">
                <i class="fa-solid fa-eye-slash mt-0.5 shrink-0" aria-hidden="true"></i>
                <span x-text="tf('sec.codesHidden', { n: recoveryCodes.length })"></span>
              </p>
              <button type="button" class="btn btn-outline btn-sm" @click="requestReauth('regenerate', $event.currentTarget)">
                <i class="fa-solid fa-rotate" aria-hidden="true"></i>
                <span x-text="t('sec.btnRegenerateView')"></span>
              </button>
            </div>
          </template>
        </div>

        <!-- ---------- الجلسات النشطة ---------- -->
        <div class="panel p-4 sm:p-6" role="region" aria-labelledby="sec-sessions-title">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0">
              <h3 id="sec-sessions-title" tabindex="-1" class="text-sm font-extrabold text-ink focus:outline-none" x-text="t('sec.sessionsTitle')"></h3>
              <p class="mt-1 text-sm text-muted" x-text="t('sec.sessionsSubtitle')"></p>
            </div>
            <button type="button" id="sec-logout-others" class="btn btn-outline btn-sm shrink-0" :disabled="!otherSessions.length"
                    @click="requestReauth('logoutOthers', $event.currentTarget)">
              <i class="fa-solid fa-right-from-bracket rtl:-scale-x-100" aria-hidden="true"></i>
              <span x-text="t('sec.logoutAllOther')"></span>
            </button>
          </div>

          <!-- عرض واحد: جدول للشاشات العريضة أو بطاقات للجوال -->
          <template x-if="wide">
            <div class="mt-4 overflow-x-auto pt-2">
              <table class="w-full min-w-[640px] border-collapse text-sm">
                <caption class="sr-only" x-text="t('sec.sessionsTitle')"></caption>
                <thead>
                  <tr class="bg-soft text-ink">
                    <th scope="col" class="rounded-s-lg px-4 py-3 text-start text-xs font-extrabold" x-text="t('sec.colDevice')"></th>
                    <th scope="col" class="px-4 py-3 text-start text-xs font-extrabold" x-text="t('sec.colIp')"></th>
                    <th scope="col" class="px-4 py-3 text-start text-xs font-extrabold" x-text="t('sec.colLocation')"></th>
                    <th scope="col" class="px-4 py-3 text-start text-xs font-extrabold" x-text="t('sec.colLastActive')"></th>
                    <th scope="col" class="rounded-e-lg px-4 py-3 text-end text-xs font-extrabold" x-text="t('sec.colActions')"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-line">
                  <template x-for="s in sessions" :key="s.id">
                    <tr class="transition hover:bg-soft/40">
                      <th scope="row" class="px-4 py-3.5 text-start align-middle font-normal">
                        <div class="flex items-center gap-2.5">
                          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-soft text-brand" aria-hidden="true"><i :class="s.icon"></i></span>
                          <p class="flex min-w-0 flex-wrap items-center gap-2 font-bold leading-5 text-ink">
                            <span x-text="L(s.device)"></span>
                            <span x-show="s.current" class="badge badge-success text-[10px]"><span x-text="t('sec.currentSessionBadge')"></span></span>
                          </p>
                        </div>
                      </th>
                      <td class="whitespace-nowrap px-4 py-3.5 align-middle text-muted" dir="ltr" :style="ltrAlign" x-text="s.ip"></td>
                      <td class="whitespace-nowrap px-4 py-3.5 align-middle text-muted" x-text="L(s.location)"></td>
                      <td class="whitespace-nowrap px-4 py-3.5 align-middle text-muted">
                        <time :datetime="s.lastActive" :title="fmtDateTime(s.lastActive)" x-text="s.current ? t('sec.activeNow') : rel(s.lastActive)"></time>
                      </td>
                      <td class="px-4 py-3.5 align-middle">
                        <div class="flex justify-end">
                          <template x-if="!s.current">
                            <button type="button" class="act group relative text-danger" @click="askRevokeSession(s, $event.currentTarget)"
                                    :aria-label="tf('sec.revokeSessionFor', { device: L(s.device) })">
                              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                              <span class="tooltip-arrow" aria-hidden="true"></span>
                              <span class="tooltip-bubble" aria-hidden="true" x-text="t('sec.sessionRevoke')"></span>
                            </button>
                          </template>
                          <template x-if="s.current">
                            <span class="text-end text-xs text-muted">
                              <span class="block font-bold text-ink" x-text="t('sec.thisDevice')"></span>
                              <span class="block" x-text="t('sec.thisDeviceHint')"></span>
                            </span>
                          </template>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template x-if="!wide">
            <ul class="mt-4 space-y-3" role="list">
              <template x-for="s in sessions" :key="s.id">
                <li class="rounded-xl border border-line p-3.5">
                  <div class="flex items-start gap-3">
                    <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-soft text-brand" aria-hidden="true"><i :class="s.icon"></i></span>
                    <div class="min-w-0 flex-1">
                      <p class="flex flex-wrap items-center gap-2 font-bold leading-6 text-ink">
                        <span x-text="L(s.device)"></span>
                        <span x-show="s.current" class="badge badge-success"><span x-text="t('sec.currentSessionBadge')"></span></span>
                      </p>
                      <p class="truncate text-xs text-muted" dir="ltr" :style="ltrAlign" x-text="s.ip"></p>
                      <p class="truncate text-xs text-muted">
                        <span x-text="L(s.location)"></span> <span aria-hidden="true">·</span>
                        <time :datetime="s.lastActive" x-text="s.current ? t('sec.activeNow') : rel(s.lastActive)"></time>
                      </p>
                    </div>
                  </div>
                  <template x-if="!s.current">
                    <button type="button" class="btn btn-outline btn-sm mt-3 w-full" @click="askRevokeSession(s, $event.currentTarget)"
                            :aria-label="tf('sec.revokeSessionFor', { device: L(s.device) })">
                      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                      <span x-text="t('sec.sessionRevoke')"></span>
                    </button>
                  </template>
                  <template x-if="s.current">
                    <p class="mt-3 rounded-lg bg-soft px-3 py-2 text-xs text-muted">
                      <span class="font-bold text-ink" x-text="t('sec.thisDevice')"></span> — <span x-text="t('sec.thisDeviceHint')"></span>
                    </p>
                  </template>
                </li>
              </template>
            </ul>
          </template>
        </div>

        <!-- ---------- تغيير كلمة المرور ---------- -->
        <form class="panel space-y-5 p-4 sm:p-6" aria-labelledby="sec-password-title" novalidate @submit.prevent="updatePassword()">
          <div>
            <h3 id="sec-password-title" class="text-sm font-extrabold text-ink" x-text="t('sec.passwordTitle')"></h3>
            <p class="mt-1 text-sm text-muted" x-text="t('sec.passwordSubtitle')"></p>
          </div>
          <!-- حقل اسم مستخدم مخفي لمديري كلمات المرور -->
          <input type="text" class="hidden" autocomplete="username" :value="profile.email" tabindex="-1" aria-hidden="true">

          <div>
            <label for="sec-current-password" class="label" x-text="t('sec.fieldCurrentPassword')"></label>
            <div class="relative">
              <input id="sec-current-password" :type="password.showCurrent ? 'text' : 'password'" x-model="password.current" @input="pwRevalidate('current')"
                     dir="ltr" :style="ltrAlign" class="field pe-11" autocomplete="current-password" required aria-required="true"
                     :aria-invalid="pwErrors.current ? 'true' : 'false'" :aria-describedby="pwErrors.current ? 'sec-current-err' : null">
              <button type="button" class="absolute inset-y-0 end-0 grid w-11 place-items-center text-muted transition hover:text-brand"
                      @click="password.showCurrent = !password.showCurrent" :aria-pressed="password.showCurrent.toString()" :aria-label="t('sec.showPassword')">
                <i class="fa-solid" :class="password.showCurrent ? 'fa-eye-slash' : 'fa-eye'" aria-hidden="true"></i>
              </button>
            </div>
            <p id="sec-current-err" class="err" role="alert" x-show="pwErrors.current" x-cloak><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="pwErrors.current ? t(pwErrors.current) : ''"></span></p>
          </div>

          <div class="grid gap-5 sm:grid-cols-2">
            <div>
              <label for="sec-new-password" class="label" x-text="t('sec.fieldNewPassword')"></label>
              <div class="relative">
                <input id="sec-new-password" :type="password.showNew ? 'text' : 'password'" x-model="password.new" @input="pwRevalidate('new')"
                       dir="ltr" :style="ltrAlign" class="field pe-11" autocomplete="new-password" required aria-required="true"
                       :aria-invalid="pwErrors.new ? 'true' : 'false'"
                       :aria-describedby="pwErrors.new ? 'sec-new-hint sec-strength sec-new-err' : 'sec-new-hint sec-strength'">
                <button type="button" class="absolute inset-y-0 end-0 grid w-11 place-items-center text-muted transition hover:text-brand"
                        @click="password.showNew = !password.showNew" :aria-pressed="password.showNew.toString()" :aria-label="t('sec.showPassword')">
                  <i class="fa-solid" :class="password.showNew ? 'fa-eye-slash' : 'fa-eye'" aria-hidden="true"></i>
                </button>
              </div>
              <p id="sec-new-hint" class="hint" x-text="t('sec.passwordHint')"></p>
              <!-- مقياس القوة: 4 مقاطع + نص -->
              <div class="mt-2" x-show="password.new" x-cloak>
                <div id="sec-strength" role="meter" aria-valuemin="0" aria-valuemax="4" :aria-valuenow="pwScore"
                     :aria-valuetext="t('sec.strength.' + pwScore)" :aria-label="t('sec.strengthLabel')" class="flex gap-1">
                  <template x-for="i in 4" :key="i">
                    <span class="h-1.5 flex-1 rounded-full transition-colors" :class="i <= pwScore ? strengthColor : 'bg-line-strong/30'" aria-hidden="true"></span>
                  </template>
                </div>
                <p class="mt-1 text-xs font-bold" :class="strengthText" aria-hidden="true">
                  <span x-text="t('sec.strengthLabel')"></span>: <span x-text="t('sec.strength.' + pwScore)"></span>
                </p>
              </div>
              <p id="sec-new-err" class="err" role="alert" x-show="pwErrors.new" x-cloak><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="pwErrors.new ? t(pwErrors.new) : ''"></span></p>
            </div>
            <div>
              <label for="sec-confirm-password" class="label" x-text="t('sec.fieldConfirmPassword')"></label>
              <div class="relative">
                <input id="sec-confirm-password" :type="password.showConfirm ? 'text' : 'password'" x-model="password.confirm" @input="pwRevalidate('confirm')"
                       dir="ltr" :style="ltrAlign" class="field pe-11" autocomplete="new-password" required aria-required="true"
                       :aria-invalid="pwErrors.confirm ? 'true' : 'false'" :aria-describedby="pwErrors.confirm ? 'sec-confirm-err' : null">
                <button type="button" class="absolute inset-y-0 end-0 grid w-11 place-items-center text-muted transition hover:text-brand"
                        @click="password.showConfirm = !password.showConfirm" :aria-pressed="password.showConfirm.toString()" :aria-label="t('sec.showPassword')">
                  <i class="fa-solid" :class="password.showConfirm ? 'fa-eye-slash' : 'fa-eye'" aria-hidden="true"></i>
                </button>
              </div>
              <p id="sec-confirm-err" class="err" role="alert" x-show="pwErrors.confirm" x-cloak><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="pwErrors.confirm ? t(pwErrors.confirm) : ''"></span></p>
            </div>
          </div>

          <div class="flex justify-end">
            <button type="submit" class="btn btn-primary" :disabled="pwBusy" :aria-busy="pwBusy.toString()">
              <i class="fa-solid" :class="pwBusy ? 'fa-circle-notch animate-spin' : 'fa-key'" aria-hidden="true"></i>
              <span x-text="pwBusy ? t('pf.saving') : t('sec.btnUpdatePassword')"></span>
            </button>
          </div>
        </form>

        <!-- ---------- سجل النشاط الأمني الأخير ---------- -->
        <div class="panel p-4 sm:p-6" role="region" aria-labelledby="sec-activity-title">
          <h3 id="sec-activity-title" class="text-sm font-extrabold text-ink" x-text="t('sec.activityTitle')"></h3>
          <p class="mt-1 text-sm text-muted" x-text="t('sec.activitySubtitle')"></p>

          <ul class="mt-4 space-y-2" role="list">
            <template x-for="a in securityActivity" :key="a.id">
              <li class="flex items-center gap-3 rounded-xl border border-line p-3.5">
                <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="a.tone" aria-hidden="true"><i :class="a.icon"></i></span>
                <p class="min-w-0 flex-1 text-sm font-bold text-ink" x-text="activityText(a)"></p>
                <time class="shrink-0 text-xs text-muted" :datetime="a.at" :title="fmtDateTime(a.at)" x-text="rel(a.at)"></time>
              </li>
            </template>
          </ul>
        </div>
      </section>

      <!-- ================= Tab 3: التفضيلات والإشعارات ================= -->
      <section id="pf-tab-panel-notifications" role="tabpanel" aria-labelledby="pf-tab-btn-notifications" x-show="activeTab === 'notifications'" x-cloak class="space-y-4 sm:space-y-6">
        <h2 class="sr-only" x-text="t('pf.tabNotifications')"></h2>

        <div class="panel space-y-4 p-4 sm:p-6">
          <h3 class="text-sm font-extrabold text-ink" x-text="t('pf.preferencesGroup')"></h3>

          <div>
            <p id="pf-lang-label" class="label" x-text="t('pf.fieldLanguage')"></p>
            <div class="flex h-11 items-center rounded-xl border border-line-strong bg-field p-1" role="group" aria-labelledby="pf-lang-label" aria-describedby="pf-lang-hint">
              <button type="button" lang="ar" class="h-full flex-1 rounded-lg text-sm font-bold transition" :class="locale === 'ar' ? 'bg-primary-500 text-white' : 'text-muted hover:bg-soft'"
                      :aria-pressed="(locale === 'ar').toString()" @click="setLocale('ar')">العربية</button>
              <button type="button" lang="en" class="h-full flex-1 rounded-lg text-sm font-bold transition" :class="locale === 'en' ? 'bg-primary-500 text-white' : 'text-muted hover:bg-soft'"
                      :aria-pressed="(locale === 'en').toString()" @click="setLocale('en')">English</button>
            </div>
            <p id="pf-lang-hint" class="hint" x-text="t('pf.languageHint')"></p>
          </div>

          <div>
            <p id="pf-theme-label" class="label" x-text="t('pf.themeLabel')"></p>
            <div class="flex h-11 items-center rounded-xl border border-line-strong bg-field p-1" role="group" aria-labelledby="pf-theme-label" aria-describedby="pf-theme-hint">
              <button type="button" class="h-full flex-1 rounded-lg text-sm font-bold transition" :class="!dark ? 'bg-primary-500 text-white' : 'text-muted hover:bg-soft'"
                      :aria-pressed="(!dark).toString()" @click="setTheme(false)">
                <i class="fa-solid fa-sun" aria-hidden="true"></i> <span x-text="t('pf.themeLight')"></span>
              </button>
              <button type="button" class="h-full flex-1 rounded-lg text-sm font-bold transition" :class="dark ? 'bg-primary-500 text-white' : 'text-muted hover:bg-soft'"
                      :aria-pressed="dark.toString()" @click="setTheme(true)">
                <i class="fa-solid fa-moon" aria-hidden="true"></i> <span x-text="t('pf.themeDark')"></span>
              </button>
            </div>
            <p id="pf-theme-hint" class="hint" x-text="t('pf.themeHint')"></p>
          </div>
        </div>

        <div class="panel space-y-3 p-4 sm:p-6">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h3 class="text-sm font-extrabold text-ink" x-text="t('pf.notifEmailGroup')"></h3>
            <a href="notifications.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-brand hover:underline">
              <i class="fa-regular fa-bell" aria-hidden="true"></i> <span x-text="t('pf.openNotificationCenter')"></span>
            </a>
          </div>

          <!-- تنبيهات الأمان إلزامية -->
          <label class="switch w-full cursor-not-allowed items-start justify-between rounded-xl border border-line bg-soft/40 p-4">
            <span class="min-w-0 pe-3">
              <span class="block font-bold text-ink" x-text="t('pf.notifEmailSecurity')"></span>
              <span id="pf-notif-security-hint" class="mt-0.5 block text-xs text-muted" x-text="t('pf.notifEmailSecurityMandatory')"></span>
            </span>
            <input type="checkbox" class="peer sr-only" checked disabled aria-describedby="pf-notif-security-hint">
            <span class="switch-track opacity-70" aria-hidden="true"></span>
          </label>

          <template x-for="k in ['emailProduct', 'emailDigest']" :key="k">
            <label class="switch w-full items-start justify-between rounded-xl border border-line p-4">
              <span class="min-w-0 pe-3">
                <span class="block font-bold text-ink" x-text="t('pf.notifPrefs.' + k)"></span>
              </span>
              <input type="checkbox" class="peer sr-only" x-model="notifPrefs[k]">
              <span class="switch-track" aria-hidden="true"></span>
            </label>
          </template>
        </div>

        <div class="panel space-y-3 p-4 sm:p-6">
          <h3 class="text-sm font-extrabold text-ink" x-text="t('pf.notifSystemGroup')"></h3>

          <template x-for="k in ['sysAssignments', 'sysResults', 'sysQuota']" :key="k">
            <label class="switch w-full items-start justify-between rounded-xl border border-line p-4">
              <span class="min-w-0 pe-3">
                <span class="block font-bold text-ink" x-text="t('pf.notifPrefs.' + k)"></span>
              </span>
              <input type="checkbox" class="peer sr-only" x-model="notifPrefs[k]">
              <span class="switch-track" aria-hidden="true"></span>
            </label>
          </template>
        </div>
      </section>
    </main>

    <!-- ================= Footer (كل النصوص عبر I18N) ================= -->
    <footer class="mt-auto border-t border-line bg-card/60"
          :class="(dirty && activeTab !== 'security') && 'pb-24'"
          style="padding-bottom: env(safe-area-inset-bottom, 0px);">
    <div class="mx-auto flex w-full min-w-0 max-w-[1400px] flex-col gap-4 px-3 py-0 sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-8">

      <div class="flex min-w-0 items-center gap-3">
        <img src="../asset/images/firob-logo.png" alt="FirOb" loading="lazy" decoding="async" class="block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        <p class="min-w-0 text-sm text-muted"><span x-text="t('footer.tagline')"></span>
          <span class="block text-xs sm:inline sm:text-sm">
            <span class="hidden sm:inline" aria-hidden="true">·</span>
            © <span class="tabular-nums" x-text="year"></span> <span x-text="t('footer.rights')"></span>
          </span>
        </p>
      </div>

      <nav :aria-label="t('footer.navLabel')" class="min-w-0">
        <ul class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm font-bold" role="list">
          <li><a href="../index.html" class="rounded font-bold text-muted underline-offset-4 transition hover:text-brand hover:underline"><span aria-hidden="true">&#8962;</span> <span x-text="t('footer.screenMap')"></span></a></li>
          <template x-for="k in ['help', 'docs', 'privacy', 'terms']" :key="k">
            <li><span class="inline-flex cursor-not-allowed items-center text-muted" aria-disabled="true" x-text="t('footer.' + k)"></span></li>
          </template>
        </ul>
      </nav>

      <div class="flex flex-wrap items-center gap-2">
        <span class="badge badge-success">
          <span class="h-2 w-2 rounded-full bg-success-500" aria-hidden="true"></span>
          <span x-text="t('footer.systemsOk')"></span>
        </span>
      </div>
    </div>
  </footer>
  </div>
</div>

<!-- ==========================================================================
     شريط الحفظ الثابت — يظهر فقط عند وجود تغييرات غير محفوظة (ومخفي في تبويب الأمان)
     ========================================================================== -->

        const diff = Math.max(0, this.now - new Date(iso).getTime());   // لا أوقات مستقبلية
        const rtf = new Intl.RelativeTimeFormat(this.intlLocale, { numeric: 'auto' });
        const s = Math.round(diff / 1000);
        if (s < 60) return rtf.format(0, 'second');
        const m = Math.round(s / 60); if (m < 60) return rtf.format(-m, 'minute');
        const h = Math.round(m / 60); if (h < 24) return rtf.format(-h, 'hour');
