<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<meta name="color-scheme" content="light dark">
<!-- روابط الدعوة تحمل رمزًا سريًا: لا فهرسة، ولا تسريب للرابط عبر ترويسة Referer -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="description" content="أكمل بيانات حسابك لقبول دعوة الانضمام إلى مساحة منشأتك التعليمية على FirOb.">
<title>قبول الدعوة وإنشاء الحساب — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض الوضع الفاتح) -->
<script>
  (function () {
    var d = false;
    try {
      var s = localStorage.getItem('firob-theme');
      d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) {
      d = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    document.documentElement.classList.toggle('dark', d);
    var m = document.getElementById('theme-color');
    if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ①-ج تطبيق اللغة والاتجاه قبل الرسم (يمنع قفزة RTL → LTR) -->
<script>
  (function () {
    var l = (window.FIROB && FIROB.locale) || 'ar';
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  })();
</script>

      rights: '© 2026 FirOb · All rights reserved', screens: 'Screen map',
    },
  };

  const REDIRECT_SECS = 6;
  const DAY = 86400000;

  function app() {
    return {
      /* --- الحالة العامة --- */
      lang: (window.FIROB && FIROB.locale) || document.documentElement.lang || 'ar',
      dark: document.documentElement.classList.contains('dark'),

      /* --- بيانات الدعوة (في Laravel: تُمرَّر من InvitationController بعد التحقق من التوكن الموقّع) ---
         status: valid | expired | used | invalid  ← يُحسب في الخادم فقط (expires_at / accepted_at / revoked_at)
         ملاحظة: التواريخ هنا نسبية لوقت فتح الصفحة كي لا يتقادم النموذج الأولي (تُستبدل بقيم الخادم). */
      invite: {
        status: 'valid',
        token: 'inv_01J8Z3K4QW7T9RX2M5N6P8B1C3',
        email: 'sara.ahmad@alnoor-school.edu',
        tenant: { ar: 'مدارس النور الأهلية', en: 'Al-Noor Private Schools' },
        tenantSlug: 'alnoor',
        inviter: { ar: 'أ. خالد العمري', en: 'Mr. Khaled Alomari' },
        role: 'roleTeacher',
        expiresAt: new Date(Date.now() + 6 * DAY).toISOString(),
        expiredAt: new Date(Date.now() - 2 * DAY).toISOString(),
        usedAt: new Date(Date.now() - 1 * DAY).toISOString(),
      },
      supportUrl: 'https://fir-on.net/contact-ar/',

      /* --- النموذج --- */
      username: '', name: '', password: '', password_confirmation: '', terms: false,
      showPw: false, showPw2: false, capsOn: false, capsOn2: false,
      busy: false, requesting: false, requested: false, done: false, countdown: 0, cdTimer: null,
      errors: {}, touched: {}, alert: '', alertMsg: '', alertTimer: null,

      /* --- شبكة زخرفية (مطابقة لشاشة الدخول) --- */
      tone: { m: 'bg-white/10', l: 'bg-white/[.06]', d: 'bg-primary-900/30', a: 'bg-accent-500/80', '-': '' },
      cells: [
        'm','l:play','-','a:check','d','-',
        '-','m','d:table','-','l','-',
        'd:book','-','m','-','a:users','-',
        '-','d','-','l:folder','-','m',
        'm','-','d','-','l:code','-',
        '-','d','-','m','-','l',
      ],

      /* --- الترجمة والثيم --- */
      t(k, ...a) {
        let s = (I18N[this.lang] && I18N[this.lang][k]) ?? I18N.ar[k];
        if (typeof s === 'function') return s(...a);
        s = s || k;
        if (a[0] && typeof a[0] === 'object') Object.keys(a[0]).forEach(n => { s = s.replace('{' + n + '}', a[0][n]); });
        return s;
      },
      init() {
        this.$watch('lang', () => this.applyLang());
        this.applyLang(); this.syncMeta();
        try {
          const mq = window.matchMedia('(prefers-color-scheme: dark)');
          mq.addEventListener?.('change', (e) => {
            let saved = null; try { saved = localStorage.getItem('firob-theme'); } catch (_) {}
            if (!saved) this.setTheme(e.matches, false);
          });
        } catch (_) {}
        try {
          const p = new URLSearchParams(location.search).get('state');
          if (['valid', 'expired', 'used', 'invalid'].includes(p)) this.invite.status = p;
        } catch (_) {}
        if (this.isValid && window.matchMedia && matchMedia('(pointer: fine)').matches) {
          this.$nextTick(() => document.getElementById('username')?.focus({ preventScroll: true }));
        }
      },
      applyLang() {
        const h = document.documentElement;
        h.lang = this.lang; h.dir = this.lang === 'ar' ? 'rtl' : 'ltr';
        if (window.FIROB && typeof FIROB.setLocale === 'function') FIROB.setLocale(this.lang);   /* يثبّت اللغة للصفحة التالية */
        document.title = this.t(this.isValid ? (this.done ? 'doneTitle' : 'title') : this.errorView().title) + ' — FirOb';
      },
      setTheme(isDark, persist = true) {
        document.body.classList.add('theme-anim');
        this.dark = isDark;
        document.documentElement.classList.toggle('dark', isDark);
        if (persist) { try { localStorage.setItem('firob-theme', isDark ? 'dark' : 'light'); } catch (e) {} }
        this.syncMeta();
        clearTimeout(this._themeT); this._themeT = setTimeout(() => document.body.classList.remove('theme-anim'), 350);
      },
      toggleTheme() { this.setTheme(!this.dark); },
      syncMeta() { document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7'); },

      /* --- مساعدات العرض --- */
      get isValid() { return this.invite.status === 'valid'; },
      tenantName() { return this.invite.tenant[this.lang]; },
      inviterName() { return this.invite.inviter[this.lang]; },
      get usernameSuggestion() {
        return (this.invite.email.split('@')[0] || '').toLowerCase().replace(/[^a-z0-9._-]/g, '').slice(0, 30) || 'sara.ahmad';
      },
      fmtDate(iso) {
        try {
          return new Date(iso).toLocaleDateString(this.lang === 'ar' ? 'ar-u-nu-latn' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        } catch (e) { return iso; }
      },
      daysLeft() {
        const ms = new Date(this.invite.expiresAt) - new Date();
        return Math.max(0, Math.ceil(ms / DAY) - (ms < DAY ? 1 : 0));
      },
      errorView() {
        const s = this.invite.status;
        const map = {
          expired: { title: 'expiredTitle', msg: 'expiredMsg', icon: 'i-clock', code: '410 · INVITATION_EXPIRED', metaLabel: 'expiredOn', metaDate: this.invite.expiredAt, tone: 'alert-warning', ring: 'bg-warning-500/15 text-warning-700 dark:text-[#FCD34D]' },
          used:    { title: 'usedTitle',    msg: 'usedMsg',    icon: 'i-user-check', code: '409 · INVITATION_USED', metaLabel: 'usedOn', metaDate: this.invite.usedAt, tone: 'alert-info', ring: 'bg-soft text-brand' },
          invalid: { title: 'invalidTitle', msg: 'invalidMsg', icon: 'i-link-off', code: '404 · INVITATION_NOT_FOUND', metaLabel: '', metaDate: '', tone: 'alert-error', ring: 'bg-error-500/15 text-danger' },
        };
        return map[s] || map.invalid;
      },

      /* --- قوة كلمة المرور --- */
      get rules() {
        const p = this.password;
        return {
          rLen:  p.length >= 8,
          rCase: /[a-z]/.test(p) && /[A-Z]/.test(p),
          rNum:  /\d/.test(p),
          rSym:  /[^A-Za-z0-9]/.test(p),
        };
      },
      get score() { return this.password ? Object.values(this.rules).filter(Boolean).length : 0; },
      barColor(i) {
        if (i > this.score) return '';
        return ['', 'bg-error-500', 'bg-warning-500', 'bg-primary-500', 'bg-success-500'][this.score];
      },
      get strengthColor() {
        return ['text-muted', 'text-danger', 'text-warning-700 dark:text-[#FCD34D]', 'text-brand', 'text-ok'][this.score];
      },
      get pwMatch() { return this.password_confirmation.length > 0 && this.password === this.password_confirmation; },
      checkCaps(e, which) { if (e && typeof e.getModifierState === 'function') this[which] = e.getModifierState('CapsLock'); },
      togglePw(which, id) {
        this[which] = !this[which];
        this.$nextTick(() => { const i = document.getElementById(id); i.focus(); const n = i.value.length; try { i.setSelectionRange(n, n); } catch (_) {} });
      },
      sanitizeUsername() {
        this.username = this.username.toLowerCase()
          .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x0660)
          .replace(/\s+/g, '').replace(/[^a-z0-9._-]/g, '').slice(0, 30);
        this.clear('username');
      },

      /* --- التحقق (واجهة فقط — التحقق الفعلي في AcceptInvitationRequest على الخادم) --- */
      rulesFor(field) {
        switch (field) {
          case 'username':
            if (!this.username) return 'usernameReq';
            if (!/^[a-z0-9](?:[a-z0-9._-]{1,28})[a-z0-9]$/.test(this.username)) return 'usernameFmt';
            return '';
          case 'name': {
            const n = this.name.trim();
            if (!n) return 'nameReq';
            if (n.length < 3) return 'nameMin';
            if (n.length > 100) return 'nameMax';
            return '';
          }
          case 'password':
            if (!this.password) return 'passReq';
            if (this.score < 4) return 'passWeak';
            return '';
          case 'password_confirmation':
            if (!this.password_confirmation) return 'confirmReq';
            if (this.password !== this.password_confirmation) return 'confirmMismatch';
            return '';
          case 'terms':
            return this.terms ? '' : 'termsReq';
        }
        return '';
      },
      /* تحقق عند مغادرة الحقل — لا نُظهر خطأ "مطلوب" لحقل لم يُكتب فيه بعد */
      check(field, force = false) {
        const val = this[field];
        if (!force && typeof val === 'string' && !val.trim()) return;
        this.touched[field] = true; this.errors[field] = this.rulesFor(field);
      },
      clear(field) { if (this.errors[field]) this.errors[field] = ''; },
      validate() {
        this.name = this.name.trim();
        const e = {};
        ['username', 'name', 'password', 'password_confirmation', 'terms'].forEach(f => {
          const r = this.rulesFor(f); if (r) e[f] = r; this.touched[f] = true;
        });
        this.errors = e;
        return Object.keys(e).length === 0;
      },
      isOk(field) { return !!this.touched[field] && !this.errors[field] && !this.rulesFor(field); },
      describe(...ids) { return ids.filter(Boolean).join(' ') || null; },

      /* --- الإشعارات --- */
      notify(type, key, ms = 5500) {
        this.alert = type; this.alertMsg = key; clearTimeout(this.alertTimer);
        if (ms) this.alertTimer = setTimeout(() => this.alert = '', ms);
      },
      dismiss() { clearTimeout(this.alertTimer); this.alert = ''; },
      go(page, delay) {
        if (window.FIROB && typeof FIROB.go === 'function') return FIROB.go(page, delay);
        setTimeout(() => { window.location.href = '../' + page + '.html'; }, delay || 0);
      },

      /* --- الإرسال --- */
      async submit() {
        if (this.busy) return;
        this.alert = '';
        if (!this.validate()) {
          this.notify('error', 'formErr');
          this.$nextTick(() => {
            const el = this.$refs.form.querySelector('[aria-invalid="true"]');
            if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.focus({ preventScroll: true }); }
          });
          return;
        }
        this.busy = true;
        /* ---- التكامل مع Laravel ----
           Blade:    this.$refs.form.submit();   (POST /invitations/{token}/accept + @csrf)
           Livewire: $wire.accept({ username, name, password, password_confirmation, terms })
           الخادم يعيد التحقق من صلاحية الدعوة داخل Transaction + قفل للسجل،
           ثم ينشئ users (tenant_id من الدعوة لا من الطلب) ويضبط invitations.accepted_at. */
        await new Promise(r => setTimeout(r, 1100));   // محاكاة للعرض فقط
        this.busy = false;

        if (['admin', 'root', 'firob'].includes(this.username)) {
          this.errors.username = 'usernameTaken';
          this.notify('error', 'formErr');
          this.$nextTick(() => document.getElementById('username')?.focus());
          return;
        }
        /* نمسح كلمات المرور من الذاكرة بعد النجاح */
        this.password = ''; this.password_confirmation = ''; this.showPw = this.showPw2 = false;
        this.done = true; this.applyLang();
        this.notify('success', 'success');
        this.$nextTick(() => { this.$refs.main.scrollTop = 0; this.$refs.doneTitle?.focus(); });
        this.startCountdown();
      },
      startCountdown() {
        this.countdown = REDIRECT_SECS; clearInterval(this.cdTimer);
        this.cdTimer = setInterval(() => {
          if (--this.countdown <= 0) { clearInterval(this.cdTimer); this.go('dashboard', 0); }
        }, 1000);
      },
      cancelRedirect() { clearInterval(this.cdTimer); this.countdown = 0; },
      async requestNew() {
        if (this.requesting || this.requested) return;
        this.requesting = true;
        await new Promise(r => setTimeout(r, 900));   // محاكاة: POST /invitations/{token}/resend-request (مع Rate Limiting في الخادم)
        this.requesting = false; this.requested = true;
        this.notify('success', 'resendOk', 7000);
      },

      /* --- أدوات النموذج الأولي (احذفها قبل الإنتاج) --- */
      setState(s) {
        this.invite.status = s; this.done = false; this.errors = {}; this.touched = {}; this.requested = false;
        this.cancelRedirect(); this.dismiss(); this.applyLang();
        this.$nextTick(() => { if (this.$refs.main) this.$refs.main.scrollTop = 0; });
      },
    };
  }
</script>

       x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="-translate-y-3 opacity-0" x-transition:enter-end="translate-y-0 opacity-100"
       x-transition:leave="transition duration-150 ease-in" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
       class="pointer-events-auto w-full max-w-md rounded-xl bg-card shadow-pop">

      <svg class="ic mt-0.5" aria-hidden="true"><use :href="alert === 'error' ? '#i-x-circle' : '#i-check-circle'"/></svg>
      <p class="flex-1" x-text="alert ? t(alertMsg) : ''"></p>
      <button type="button" class="-m-1.5 grid h-8 w-8 shrink-0 place-items-center rounded-lg opacity-70 transition hover:opacity-100 focus-visible:outline-none focus-visible:shadow-[var(--ring)]" @click="dismiss()" :aria-label="t('dismiss')">
        <svg class="ic !h-4 !w-4" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="app-h flex overflow-hidden">

  <!-- ╔══════════ الجانب الأول: الهوية البصرية + ملخص الدعوة — من التابلت (md) فما فوق ══════════╗ -->
  <aside class="relative hidden h-full overflow-hidden bg-gradient-to-br from-primary-500 via-primary-700 to-primary-900 text-white dark:from-[#0A4356] dark:via-[#062F3B] dark:to-[#031820] md:flex md:w-[40%] lg:w-[45%] xl:w-[44%]"
         style="padding-top: var(--sat); padding-bottom: var(--sab);">

    <div aria-hidden="true" class="absolute inset-0 grid grid-cols-6 grid-rows-6 gap-2 p-4 lg:gap-3 lg:p-6">

        <div class="grid place-items-center rounded-2xl motion-safe:animate-[breath_7s_ease-in-out_infinite]"
             :class="tone[c.split(':')[0]]" :style="{ animationDelay: ((i * 7) % 11) * 0.5 + 's' }">
          <template x-if="c.includes(':')">
            <svg class="ic" :class="c.startsWith('a') ? 'text-onaccent' : 'text-white/70'"><use :href="'#i-' + c.split(':')[1]"/></svg>
          </template>
        </div>
      </template>
    </div>
    <div aria-hidden="true" class="absolute -bottom-24 -start-24 h-80 w-80 rounded-full bg-accent-500/15 blur-3xl"></div>
    <div aria-hidden="true" class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(7,60,76,.8)_0%,rgba(7,60,76,.52)_52%,transparent_100%)]"></div>

    <div class="no-scrollbar relative z-10 m-auto flex max-h-full w-full flex-col items-center overflow-y-auto px-[clamp(1.5rem,4vw,4rem)] py-6 text-center short:py-4">

      <!-- الشعار: أبعاد صريحة (لا CLS) + أولوية تحميل عالية -->
      <div class="inline-flex items-center rounded-xl bg-white p-0 shadow-pop">
        <img src="../asset/images/firob-logo.png" alt="FirOb" width="352" height="96" fetchpriority="high" decoding="async"
             class="mx-1 -my-2.5 block h-[clamp(3.25rem,9vh,6rem)] w-auto max-w-[min(22rem,80%)] object-contain">
      </div>
      <p class="mt-3 text-lead font-bold text-primary-50 short:mt-2" x-text="t('brandTag')"></p>

      <h2 class="mt-[clamp(1rem,3vh,1.75rem)] max-w-lg text-balance text-display font-extrabold" x-text="t('heroTitle')"></h2>
      <p class="mt-2 max-w-md text-label text-primary-100 short:hidden" x-text="t('heroSub')"></p>

      <!-- بطاقة الدعوة (حالة صالحة) -->
      <div x-show="isValid" class="mt-[clamp(1rem,3vh,1.75rem)] w-full max-w-md rounded-2xl border border-white/20 bg-white/10 p-4 text-start backdrop-blur-md">
        <div class="flex items-center gap-3">
          <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-accent-500 text-onaccent" aria-hidden="true"><svg class="ic"><use href="#i-envelope-open"/></svg></span>
          <div class="min-w-0">
            <p class="text-caption text-primary-100" x-text="t('invitedTo')"></p>
            <p class="truncate text-lead font-extrabold" x-text="tenantName()"></p>
          </div>
        </div>
        <dl class="mt-3 grid grid-cols-1 gap-2 border-t border-white/15 pt-3 text-caption lg:grid-cols-3">
          <div class="flex min-w-0 justify-between gap-2 lg:block"><dt class="text-primary-100" x-text="t('invitedBy')"></dt><dd class="truncate font-bold" x-text="inviterName()"></dd></div>
          <div class="flex min-w-0 justify-between gap-2 lg:block"><dt class="text-primary-100" x-text="t('role')"></dt><dd class="truncate font-bold" x-text="t(invite.role)"></dd></div>
          <div class="flex min-w-0 justify-between gap-2 lg:block"><dt class="text-primary-100" x-text="t('expires')"></dt><dd class="truncate font-bold" x-text="fmtDate(invite.expiresAt)"></dd></div>
        </dl>
      </div>

      <ul class="mt-[clamp(.875rem,2.6vh,1.5rem)] w-full max-w-md space-y-[clamp(.5rem,1.4vh,.75rem)] text-start text-label short:hidden">
        <li class="feature">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-white/15 text-accent-500" aria-hidden="true"><svg class="ic"><use href="#i-book"/></svg></span>
          <span class="font-medium" x-text="t('hero1')"></span>
        </li>
        <li class="feature">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-white/15 text-accent-500" aria-hidden="true"><svg class="ic"><use href="#i-badge"/></svg></span>
          <span class="font-medium" x-text="t('hero2')"></span>
        </li>
        <li class="feature">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-white/15 text-accent-500" aria-hidden="true"><svg class="ic"><use href="#i-shield"/></svg></span>
          <span class="font-medium" x-text="t('hero3')"></span>
        </li>
      </ul>
    </div>
  </aside>

  <!-- ╔══════════ الجانب الثاني: النموذج / حالة الخطأ ══════════╗ -->
  <div class="safe-x flex h-full min-w-0 flex-1 flex-col bg-[radial-gradient(48rem_22rem_at_50%_0%,rgb(var(--glow)/0.13),transparent)]">

    <!-- شريط علوي (يحترم النوتش) -->
    <header class="flex shrink-0 items-center justify-between gap-3 px-4 pb-2 sm:px-8 lg:px-10" style="padding-top: calc(.5rem + var(--sat));">
      <div class="flex min-w-0 items-center gap-2.5 md:hidden">
        <span class="inline-flex items-center rounded-lg bg-white p-1 shadow-sm">
          <img src="../asset/images/firob-logo.png" alt="FirOb" width="112" height="28" decoding="async" class="block h-7 w-auto max-w-[8rem] object-contain">
        </span>
      </div>
      <span class="hidden md:block" aria-hidden="true"></span>

      <div class="flex shrink-0 items-center gap-2">
        <button type="button" class="tool" @click="toggleTheme()" :aria-pressed="dark"
                :aria-label="dark ? t('themeLight') : t('themeDark')" :title="dark ? t('themeLight') : t('themeDark')">
          <svg class="ic" x-show="!dark" aria-hidden="true"><use href="#i-moon"/></svg>
          <svg class="ic" x-show="dark" x-cloak aria-hidden="true"><use href="#i-sun"/></svg>
        </button>

        <div class="flex h-10 items-center rounded-xl border border-line-strong bg-field p-1" role="group" :aria-label="t('langGroup')">
          <button type="button" lang="ar" class="h-full rounded-lg px-3.5 text-caption font-bold transition-colors focus-visible:outline-none focus-visible:shadow-[var(--ring)]"
                  :class="lang === 'ar' ? 'bg-primary-500 text-white' : 'text-muted hover:bg-soft'" :aria-pressed="lang === 'ar'" @click="lang = 'ar'">عربي</button>
          <button type="button" lang="en" class="h-full rounded-lg px-3.5 text-caption font-bold transition-colors focus-visible:outline-none focus-visible:shadow-[var(--ring)]"
                  :class="lang === 'en' ? 'bg-primary-500 text-white' : 'text-muted hover:bg-soft'" :aria-pressed="lang === 'en'" @click="lang = 'en'">EN</button>
        </div>
      </div>
    </header>

    <!-- المحتوى: النموذج طويل → تمرير داخلي بشريط رفيع ظاهر + حجز مساحة لشريط التجربة ومسافة الأمان -->
    <main id="main" x-ref="main" tabindex="-1" class="thin-scroll flex min-h-0 flex-1 overflow-y-auto overflow-x-hidden px-4 pt-3 focus:outline-none sm:px-8 short:pt-1"
          style="padding-bottom: calc(var(--ribbon-h) + var(--sab));">
      <div class="m-auto flex w-full flex-col items-center">

      <!-- ═════ (A) الدعوة صالحة: نموذج إنشاء الحساب ═════ -->
      <section x-show="isValid && !done" class="card w-full max-w-[32rem] p-[clamp(1.25rem,3vh,2.25rem)] max-[359px]:rounded-2xl max-[359px]:p-4 xshort:p-4" aria-labelledby="reg-title">

        <header class="mb-[clamp(.75rem,2vh,1.25rem)] xshort:mb-2">
          <div class="flex items-center gap-3">
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl border border-line bg-soft text-brand short:h-9 short:w-9" aria-hidden="true"><svg class="ic"><use href="#i-user-check"/></svg></span>
            <h1 id="reg-title" class="text-h1 font-extrabold text-ink" x-text="t('title')">قبول الدعوة وإنشاء الحساب</h1>
          </div>
          <p class="mt-2 text-caption text-muted short:hidden" x-text="t('subtitle')"></p>

          <!-- ملخص الدعوة المضغوط للجوال (الشريط الجانبي مخفي تحت md) -->
          <div class="mt-3 rounded-2xl border border-line bg-soft/60 p-3 md:hidden">
            <div class="flex items-center gap-2.5">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-accent-500 text-onaccent" aria-hidden="true"><svg class="ic !h-4 !w-4"><use href="#i-building"/></svg></span>
              <div class="min-w-0 flex-1">
                <p class="truncate text-label font-extrabold" x-text="tenantName()"></p>
                <p class="truncate text-[0.8125rem] text-muted"><span x-text="t('invitedBy')"></span> <span class="font-bold" x-text="inviterName()"></span></p>
              </div>
              <span class="badge shrink-0 bg-primary-500/10 text-brand" x-text="t(invite.role)"></span>
            </div>
          </div>

          <p class="mt-3 flex flex-wrap items-center gap-x-1.5 gap-y-0.5 text-[0.8125rem] font-bold"
             :class="daysLeft() <= 2 ? 'text-warning-700 dark:text-[#FCD34D]' : 'text-muted'">
            <svg class="ic !h-4 !w-4" aria-hidden="true"><use href="#i-clock"/></svg>
            <span x-text="t('daysLeft', daysLeft())"></span>
            <span class="font-medium" aria-hidden="true">·</span>
            <span class="font-medium"><span x-text="t('expires')"></span> <span x-text="fmtDate(invite.expiresAt)"></span></span>
          </p>
        </header>

        <!-- Laravel: action="{{ route('invitations.accept', $invitation->token) }}" + @csrf -->
        <form id="register-form" x-ref="form" method="POST" action="/invitations/accept" novalidate
              class="space-y-[clamp(.75rem,1.7vh,1.125rem)]" :aria-busy="busy" @submit.prevent="submit()">
          <input type="hidden" name="_token" value=""><!-- Blade: @csrf -->
          <input type="hidden" name="token" :value="invite.token">

          <!-- ① البريد الإلكتروني (مقفل) — يبقى قابلًا للوصول بالقارئ ولا يأخذ تركيز Tab -->
          <div>
            <label class="label mb-1.5" for="email" x-text="t('emailLabel')"></label>
            <div class="fgroup" data-readonly="true">
              <svg class="ic text-muted" aria-hidden="true"><use href="#i-mail"/></svg>
              <!-- autocomplete=username: البريد هو مُعرّف الدخول، فيحفظه مدير كلمات المرور مع كلمة المرور الجديدة -->
              <input id="email" name="email" type="email" dir="ltr" readonly aria-readonly="true" tabindex="-1"
                     autocomplete="username" class="fgroup-input rtl-end" :value="invite.email" aria-describedby="email-hint">
              <svg class="ic !h-4 !w-4 text-muted" aria-hidden="true"><use href="#i-lock"/></svg>
            </div>
            <p id="email-hint" class="hint flex items-center gap-1.5 short:hidden"><svg class="ic !h-4 !w-4" aria-hidden="true"><use href="#i-shield"/></svg><span x-text="t('emailLocked')"></span></p>
          </div>

          <!-- ② اسم المستخدم + الاسم الكامل -->
          <div class="grid gap-[clamp(.75rem,1.7vh,1.125rem)] sm:grid-cols-2">
            <div class="min-w-0">
              <label class="label mb-1.5" for="username"><span x-text="t('usernameLabel')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
              <div class="fgroup" :data-invalid="!!errors.username" :data-valid="isOk('username')">
                <svg class="ic text-muted" aria-hidden="true"><use href="#i-at"/></svg>
                <input id="username" name="username" type="text" dir="ltr" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
                       enterkeyhint="next" maxlength="30" :placeholder="usernameSuggestion" class="fgroup-input rtl-end"
                       x-model="username" @input="sanitizeUsername()" @blur="check('username')"
                       :aria-invalid="!!errors.username" :aria-describedby="errors.username ? 'username-err' : 'username-hint'">
                <svg x-show="isOk('username')" x-cloak class="ic !h-4 !w-4 text-ok" aria-hidden="true"><use href="#i-check-circle"/></svg>
              </div>
              <p id="username-hint" class="hint short:hidden" x-show="!errors.username" x-text="t('usernameHint')"></p>
              <p id="username-err" class="err" x-show="errors.username" x-cloak><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-x-circle"/></svg><span x-text="t(errors.username)"></span></p>
            </div>

            <div class="min-w-0">
              <label class="label mb-1.5" for="name"><span x-text="t('nameLabel')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
              <div class="fgroup" :data-invalid="!!errors.name" :data-valid="isOk('name')">
                <svg class="ic text-muted" aria-hidden="true"><use href="#i-user"/></svg>
                <input id="name" name="name" type="text" autocomplete="name" autocapitalize="words" enterkeyhint="next" maxlength="100" class="fgroup-input"
                       :placeholder="t('namePh')"
                       x-model="name" @input="clear('name')" @blur="check('name')"
                       :aria-invalid="!!errors.name" :aria-describedby="errors.name ? 'name-err' : null">
                <svg x-show="isOk('name')" x-cloak class="ic !h-4 !w-4 text-ok" aria-hidden="true"><use href="#i-check-circle"/></svg>
              </div>
              <p id="name-err" class="err" x-show="errors.name" x-cloak><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-x-circle"/></svg><span x-text="t(errors.name)"></span></p>
            </div>
          </div>

          <!-- ③ كلمة المرور -->
          <div>
            <label class="label mb-1.5" for="password"><span x-text="t('passLabel')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
            <div class="fgroup !pe-1.5" :data-invalid="!!errors.password" :data-valid="touched.password && score === 4 && !errors.password">
              <svg class="ic text-muted" aria-hidden="true"><use href="#i-key"/></svg>
              <input id="password" name="password" dir="ltr" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"
                     enterkeyhint="next" maxlength="128" placeholder="••••••••"
                     class="fgroup-input rtl-end" :type="showPw ? 'text' : 'password'"
                     x-model="password" @input="clear('password'); if (touched.password_confirmation) check('password_confirmation')"
                     @blur="check('password'); capsOn = false"
                     @keydown="checkCaps($event, 'capsOn')" @keyup="checkCaps($event, 'capsOn')"
                     :aria-invalid="!!errors.password" :aria-describedby="describe('password-rules', errors.password && 'password-err', capsOn && 'caps1')">
              <button type="button" class="btn btn-ghost btn-icon shrink-0 !text-muted" @mousedown.prevent @click="togglePw('showPw', 'password')"
                      :aria-pressed="showPw" aria-controls="password" :aria-label="showPw ? t('hidePw') : t('showPw')" :title="showPw ? t('hidePw') : t('showPw')">
                <svg class="ic" x-show="!showPw" aria-hidden="true"><use href="#i-eye"/></svg>
                <svg class="ic" x-show="showPw" x-cloak aria-hidden="true"><use href="#i-eye-off"/></svg>
              </button>
            </div>

            <!-- مؤشر القوة + الشروط (الإعلان الصوتي للمستوى فقط، لا لكل ضغطة مفتاح) -->
            <div class="mt-2">
              <div class="flex items-center gap-3">
                <div class="flex flex-1 gap-1.5" dir="ltr" aria-hidden="true">
                  <template x-for="i in 4" :key="i"><span class="meter-bar" :class="barColor(i)"></span></template>
                </div>
                <p class="shrink-0 text-[0.8125rem] font-bold" :class="strengthColor" role="status" aria-live="polite">
                  <span class="font-medium text-muted" x-text="t('strength')"></span>
                  <span x-text="t('s' + score)"></span>
                </p>
              </div>
              <ul id="password-rules" class="mt-2 grid grid-cols-1 gap-x-3 gap-y-1 min-[380px]:grid-cols-2" :aria-label="t('rulesTitle')">
                <template x-for="(met, key) in rules" :key="key">
                  <li class="rule" :data-met="met">
                    <svg class="ic !h-4 !w-4" aria-hidden="true"><use :href="met ? '#i-check' : '#i-dot'"/></svg>
                    <span x-text="t(key)"></span>
                    <span class="sr-only" x-text="'— ' + (met ? t('met') : t('unmet'))"></span>
                  </li>
                </template>
              </ul>
              <p class="sr-only" role="status" x-text="score === 4 ? t('rulesDone') : ''"></p>
            </div>
            <p id="password-err" class="err" x-show="errors.password" x-cloak><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-x-circle"/></svg><span x-text="t(errors.password)"></span></p>
            <p id="caps1" class="warn" x-show="capsOn" x-cloak role="status"><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-warning"/></svg><span x-text="t('caps')"></span></p>
          </div>

          <!-- ④ تأكيد كلمة المرور (اللصق مسموح: منعه يضرّ مديري كلمات المرور — WCAG 3.3.8) -->
          <div>
            <label class="label mb-1.5" for="password_confirmation"><span x-text="t('confirmLabel')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
            <div class="fgroup !pe-1.5" :data-invalid="!!errors.password_confirmation" :data-valid="pwMatch && !errors.password_confirmation">
              <svg class="ic text-muted" aria-hidden="true"><use href="#i-lock"/></svg>
              <input id="password_confirmation" name="password_confirmation" dir="ltr" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"
                     enterkeyhint="done" maxlength="128" placeholder="••••••••"
                     class="fgroup-input rtl-end" :type="showPw2 ? 'text' : 'password'"
                     x-model="password_confirmation" @input="clear('password_confirmation')" @blur="check('password_confirmation'); capsOn2 = false"
                     @keydown="checkCaps($event, 'capsOn2')" @keyup="checkCaps($event, 'capsOn2')"
                     :aria-invalid="!!errors.password_confirmation"
                     :aria-describedby="describe(errors.password_confirmation && 'confirm-err', pwMatch && !errors.password_confirmation && 'confirm-ok', capsOn2 && 'caps2')">
              <button type="button" class="btn btn-ghost btn-icon shrink-0 !text-muted" @mousedown.prevent @click="togglePw('showPw2', 'password_confirmation')"
                      :aria-pressed="showPw2" aria-controls="password_confirmation" :aria-label="showPw2 ? t('hidePw') : t('showPw')" :title="showPw2 ? t('hidePw') : t('showPw')">
                <svg class="ic" x-show="!showPw2" aria-hidden="true"><use href="#i-eye"/></svg>
                <svg class="ic" x-show="showPw2" x-cloak aria-hidden="true"><use href="#i-eye-off"/></svg>
              </button>
            </div>
            <p id="confirm-err" class="err" x-show="errors.password_confirmation" x-cloak><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-x-circle"/></svg><span x-text="t(errors.password_confirmation)"></span></p>
            <p id="confirm-ok" class="okmsg" x-show="pwMatch && !errors.password_confirmation" x-cloak><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-check-circle"/></svg><span x-text="t('match')"></span></p>
            <p id="caps2" class="warn" x-show="capsOn2" x-cloak role="status"><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-warning"/></svg><span x-text="t('caps')"></span></p>
          </div>

          <!-- ⑤ الموافقة على الشروط (روابط حقيقية؛ النقر عليها لا يبدّل مربع الاختيار) -->
          <div>
            <div class="flex items-start gap-2.5 text-label font-medium leading-6">
              <input id="terms" type="checkbox" name="terms" value="1" class="check" x-model="terms"
                     @change="terms ? clear('terms') : check('terms', true)"
                     :aria-invalid="!!errors.terms" :aria-describedby="errors.terms ? 'terms-err' : null">
              <p>
                <label for="terms" class="cursor-pointer select-none" x-text="t('termsPre')"></label>
                <a href="terms.html" target="_blank" rel="noopener" class="link inline-flex items-center gap-0.5 !text-label">
                  <span x-text="t('terms')"></span><svg class="ic !h-3.5 !w-3.5" aria-hidden="true"><use href="#i-external"/></svg><span class="sr-only" x-text="t('newTab')"></span>
                </a>
                <span x-text="t('and')"></span>
                <a href="privacy.html" target="_blank" rel="noopener" class="link inline-flex items-center gap-0.5 !text-label">
                  <span x-text="t('privacy')"></span><svg class="ic !h-3.5 !w-3.5" aria-hidden="true"><use href="#i-external"/></svg><span class="sr-only" x-text="t('newTab')"></span>
                </a>
                <label for="terms" class="cursor-pointer select-none" x-text="t('termsPost')"></label>
                <span class="text-danger" aria-hidden="true">*</span>
              </p>
            </div>
            <p id="terms-err" class="err" x-show="errors.terms" x-cloak><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-x-circle"/></svg><span x-text="t(errors.terms)"></span></p>
          </div>

          <!-- زر الإرسال -->
          <button type="submit" class="btn btn-accent btn-lg w-full whitespace-normal text-center" :class="busy && 'is-loading'" :aria-busy="busy" :disabled="busy">
            <svg x-show="busy" x-cloak class="ic animate-spin" aria-hidden="true"><use href="#i-spinner"/></svg>
            <svg x-show="!busy" class="ic" aria-hidden="true"><use href="#i-user-check"/></svg>
            <span x-text="busy ? t('busy') : t('submit')">إنشاء الحساب وإتمام الانضمام</span>
            <svg x-show="!busy" class="ic ltr:rotate-180" aria-hidden="true"><use href="#i-arrow"/></svg>
          </button>
        </form>

        <p class="mt-[clamp(.75rem,2vh,1.25rem)] text-center text-label text-muted">
          <span x-text="t('haveAccount')"></span>
          <a href="login.html" class="link ms-1 inline-flex min-h-[2.75rem] items-center !text-label" x-text="t('login')"></a>
        </p>
      </section>

      <!-- ═════ (B) نجاح إنشاء الحساب ═════ -->
      <section x-show="isValid && done" x-cloak class="card w-full max-w-[27rem] p-[clamp(1.25rem,3.5vh,2.5rem)] text-center max-[359px]:rounded-2xl max-[359px]:p-4" aria-labelledby="done-title">
        <template x-if="done">
          <span class="mx-auto grid h-16 w-16 place-items-center rounded-full bg-success-500/15 text-ok motion-safe:animate-[pop-in_.5s_ease-out] short:h-14 short:w-14" aria-hidden="true">
            <svg class="ic !h-8 !w-8"><use href="#i-check-circle"/></svg>
          </span>
        </template>
        <h1 id="done-title" x-ref="doneTitle" tabindex="-1" class="mt-4 text-h1 font-extrabold focus:outline-none short:mt-3" x-text="t('doneTitle')"></h1>
        <p class="mt-2 text-label text-muted" x-text="t('doneMsg')"></p>

        <dl class="mt-4 divide-y divide-line rounded-2xl border border-line bg-soft/50 px-4 text-start xshort:hidden">
          <div class="meta-row"><dt class="text-muted" x-text="t('joinedTo')"></dt><dd class="min-w-0 truncate font-bold" x-text="tenantName()"></dd></div>
          <div class="meta-row"><dt class="text-muted" x-text="t('usernameLabel')"></dt><dd dir="ltr" class="min-w-0 truncate font-bold" x-text="'@' + username"></dd></div>
          <div class="meta-row"><dt class="text-muted" x-text="t('role')"></dt><dd><span class="badge bg-primary-500/10 text-brand" x-text="t(invite.role)"></span></dd></div>
        </dl>

        <a href="../tenant-admin/TenantDashboard.html" class="btn btn-primary btn-lg mt-5 w-full" @click="cancelRedirect()">
          <span x-text="t('goDashboard')"></span>
          <svg class="ic ltr:rotate-180" aria-hidden="true"><use href="#i-arrow"/></svg>
        </a>
        <!-- تحويل تلقائي قابل للإيقاف (WCAG 2.2.1) -->
        <div class="mt-3 flex flex-wrap items-center justify-center gap-x-2 text-caption text-muted" x-show="countdown > 0">
          <span class="inline-flex items-center gap-1.5"><svg class="ic !h-4 !w-4" aria-hidden="true"><use href="#i-clock"/></svg><span x-text="t('redirecting', { s: countdown })"></span></span>
          <button type="button" class="link min-h-[2.25rem] !text-caption" @click="cancelRedirect()" x-text="t('stay')"></button>
        </div>
      </section>

      <!-- ═════ (C) حالة الخطأ: منتهية / مستخدمة / غير صالحة ═════ -->
      <section x-show="!isValid" x-cloak class="card w-full max-w-[28rem] p-[clamp(1.25rem,3.5vh,2.5rem)] max-[359px]:rounded-2xl max-[359px]:p-4 xshort:p-4" aria-labelledby="err-title" aria-describedby="err-msg">
        <div class="text-center">
          <span class="mx-auto grid h-16 w-16 place-items-center rounded-2xl short:h-14 short:w-14" :class="errorView().ring" aria-hidden="true">
            <svg class="ic !h-8 !w-8"><use :href="'#' + errorView().icon"/></svg>
          </span>
          <h1 id="err-title" class="mt-4 text-h1 font-extrabold short:mt-3" x-text="t(errorView().title)"></h1>
        </div>

        <div class="alert mt-4" :class="errorView().tone">
          <svg class="ic mt-0.5" aria-hidden="true"><use href="#i-warning"/></svg>
          <p id="err-msg" class="flex-1 leading-6" x-text="t(errorView().msg)"></p>
        </div>
        <p class="mt-3 text-caption text-muted" x-show="invite.status === 'invalid'" x-text="t('invalidTip')"></p>

        <dl class="mt-4 divide-y divide-line rounded-2xl border border-line bg-soft/50 px-4 xshort:hidden">
          <div class="meta-row" x-show="invite.status !== 'invalid'">
            <dt class="text-muted" x-text="t('emailLabel')"></dt>
            <dd dir="ltr" class="min-w-0 truncate font-bold" x-text="invite.email"></dd>
          </div>
          <div class="meta-row" x-show="invite.status !== 'invalid'">
            <dt class="text-muted" x-text="t('joinedTo')"></dt>
            <dd class="min-w-0 truncate font-bold" x-text="tenantName()"></dd>
          </div>
          <div class="meta-row" x-show="errorView().metaLabel">
            <dt class="text-muted" x-text="errorView().metaLabel ? t(errorView().metaLabel) : ''"></dt>
            <dd class="font-bold" x-text="errorView().metaDate ? fmtDate(errorView().metaDate) : ''"></dd>
          </div>
          <div class="meta-row">
            <dt class="text-muted" x-text="t('errorCode')"></dt>
            <dd dir="ltr"><code class="rounded bg-field px-1.5 py-0.5 text-[0.8125rem] font-bold text-muted" x-text="errorView().code"></code></dd>
          </div>
        </dl>

        <!-- الإجراءات حسب الحالة -->
        <div class="mt-5 space-y-2.5">
          <template x-if="invite.status === 'expired'">
            <button type="button" class="btn btn-primary btn-lg w-full" :class="requesting && 'is-loading'" :disabled="requesting || requested" :aria-busy="requesting" @click="requestNew()">
              <svg x-show="requesting" class="ic animate-spin" aria-hidden="true"><use href="#i-spinner"/></svg>
              <svg x-show="!requesting" class="ic" aria-hidden="true"><use :href="requested ? '#i-check-circle' : '#i-send'"/></svg>
              <span x-text="requesting ? t('requesting') : (requested ? t('requested') : t('requestNew'))"></span>
            </button>
          </template>

          <template x-if="invite.status === 'used'">
            <a :href="'login.html?email=' + encodeURIComponent(invite.email)" class="btn btn-primary btn-lg w-full">
              <svg class="ic" aria-hidden="true"><use href="#i-login"/></svg>
              <span x-text="t('login')"></span>
            </a>
          </template>

          <template x-if="invite.status === 'invalid'">
            <a :href="supportUrl" target="_blank" rel="noopener" class="btn btn-primary btn-lg w-full">
              <svg class="ic" aria-hidden="true"><use href="#i-mail"/></svg>
              <span x-text="t('contactAdmin')"></span>
              <span class="sr-only" x-text="t('newTab')"></span>
            </a>
          </template>

          <div class="flex flex-wrap items-center justify-center gap-x-4">
            <a href="login.html" class="link inline-flex min-h-[2.75rem] items-center" x-show="invite.status !== 'used'" x-text="t('backLogin')"></a>
            <a :href="'forgot-password.html?email=' + encodeURIComponent(invite.email)" class="link inline-flex min-h-[2.75rem] items-center" x-show="invite.status === 'used'" x-text="t('forgot')"></a>
          </div>
        </div>
      </section>

      <!-- تذييل: داخل منطقة التمرير فلا يقتطع من ارتفاع النموذج -->
      <footer class="mt-4 flex flex-wrap items-center justify-center gap-x-3 gap-y-2 px-4 py-2 text-center text-[0.8125rem] text-muted short:mt-2">
        <span x-text="t('rights')"></span>
        <a href="../index.html" class="pill inline-flex items-center gap-1 text-muted hover:bg-soft hover:text-ink">
          <svg class="ic !h-3.5 !w-3.5" aria-hidden="true"><use href="#i-home"/></svg><span x-text="t('screens')"></span>
        </a>
      </footer>
      </div>
    </main>
  </div>
</div>

<!-- ========== شريط النموذج الأولي العائم (Prototype Ribbon) — معزول عن التذييل الإنتاجي، احذفه بالكامل قبل الإطلاق ========== -->
<div class="fixed z-50" style="bottom: calc(.75rem + var(--sab)); inset-inline-end: calc(.75rem + var(--sar)); max-width: calc(100vw - 1.5rem - var(--sal) - var(--sar));">
  <div class="no-scrollbar flex items-center gap-1.5 overflow-x-auto rounded-full border border-dashed border-accent-500/70 bg-slate-900/90 p-1.5 shadow-pop backdrop-blur-md" role="group" :aria-label="t('stateLabel')">
    <span class="flex shrink-0 items-center gap-1 rounded-full bg-accent-500 px-2.5 py-1 text-[0.6875rem] font-extrabold uppercase tracking-wide text-onaccent">
      <svg class="ic !h-3.5 !w-3.5" aria-hidden="true"><use href="#i-sparkle"/></svg>
      <span class="hidden sm:inline" x-text="t('stateLabel')"></span>
    </span>
    <button type="button" class="pill min-h-[2.25rem] shrink-0 whitespace-nowrap !border-white/20 !text-white hover:!bg-white/10" :aria-pressed="invite.status === 'valid'" @click="setState('valid')" x-text="t('stValid')"></button>
    <button type="button" class="pill min-h-[2.25rem] shrink-0 whitespace-nowrap !border-white/20 !text-white hover:!bg-white/10" :aria-pressed="invite.status === 'expired'" @click="setState('expired')" x-text="t('stExpired')"></button>
    <button type="button" class="pill min-h-[2.25rem] shrink-0 whitespace-nowrap !border-white/20 !text-white hover:!bg-white/10" :aria-pressed="invite.status === 'used'" @click="setState('used')" x-text="t('stUsed')"></button>
    <button type="button" class="pill min-h-[2.25rem] shrink-0 whitespace-nowrap !border-red-400/60 !text-red-300 hover:!bg-red-500/15" :aria-pressed="invite.status === 'invalid'" @click="setState('invalid')" x-text="t('stInvalid')"></button>
  </div>
</div>

</body>
</html>
