<!DOCTYPE html>
<html lang="ar" dir="rtl">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<meta name="color-scheme" content="light dark">
<title>نسيت كلمة المرور — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض الوضع الفاتح) -->
<script>
  (function () {
    var d = false;
    try {
      var s = localStorage.getItem('firob-theme');
      d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) {
      d = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    document.documentElement.classList.toggle('dark', d);
    var m = document.getElementById('theme-color');
    if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ①-ج تطبيق اللغة والاتجاه قبل الرسم (يمنع قفزة RTL → LTR) -->
<script>
  (function () {
    var l = (window.FIROB && FIROB.locale) || 'ar';
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  })();
</script>

<script>

    darkMode: 'class',
    theme: { extend: {
      /* شاشات قصيرة: نضغط العناصر الثانوية بدل ظهور سكرول */

        short:  { raw: '(max-height: 760px)' },   /* لابتوب 13" / تابلت أفقي */
        xshort: { raw: '(max-height: 560px)' },   /* جوال أفقي */

      fontSize: {
        caption: ['0.875rem',  { lineHeight: '1.375rem' }],                               // 14px
        label:   ['0.9375rem', { lineHeight: '1.5rem'   }],                               // 15px
        body:    ['1rem',      { lineHeight: '1.5rem'   }],                               // 16px
        lead:    ['1.0625rem', { lineHeight: '1.75rem'  }],                               // 17px
        h1:      ['clamp(1.375rem, 1rem + 1.5vh, 1.875rem)', { lineHeight: '1.3'  }],    // 22 → 30px
        display: ['clamp(1.5rem, 0.9rem + 2.2vh, 2.5rem)',   { lineHeight: '1.35' }],    // 24 → 40px
      },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },

<!-- ④ طبقة المكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;

      /* مسافات الأمان (النوتش / شريط الإيماءات) */
      --sat: env(safe-area-inset-top, 0px);    --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);   --sar: env(safe-area-inset-right, 0px);
      /* مساحة محجوزة أسفل المحتوى لشريط التجربة العائم */
      --ribbon-h: 4rem;
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165; --ok: 110 231 183;   --glow: 14 128 161;
    }

    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html[lang='en'] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* الصفحة ثابتة؛ التمرير (إن لزم) داخل منطقة البطاقة فقط — ولا تمرير أفقي إطلاقًا */
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; max-width: 100%; }
    body { @apply bg-page text-body text-ink antialiased; -webkit-tap-highlight-color: transparent; }
    body.theme-anim, body.theme-anim * { transition: background-color .3s, border-color .3s, color .3s !important; }
    [x-cloak] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    @keyframes breath { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes pop    { 0% { transform: scale(.3); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
    .pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1) 1 both; }

    .app-h { height: 100vh; height: 100dvh; }
    .safe-x { padding-left: var(--sal); padding-right: var(--sar); }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    .ic { @apply h-5 w-5 shrink-0 fill-none stroke-current; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

    /* ---- Buttons ---- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2.5 whitespace-nowrap rounded-xl border border-transparent px-4 text-label font-bold transition duration-150; padding-block: .625rem; touch-action: manipulation; min-height: 2.75rem; }
    .btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .btn:disabled { @apply cursor-not-allowed opacity-60; }
    .btn.is-loading { @apply pointer-events-none cursor-progress opacity-100; }
    .btn-lg { @apply min-h-[3rem] px-6 text-[1.0625rem] leading-7 active:translate-y-px; padding-block: clamp(.6rem, 1.5vh, .875rem); }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .btn-primary:not(:disabled):hover { @apply bg-primary-600; }
    .btn-primary:not(:disabled):active { @apply bg-primary-800; }
    .btn-accent { @apply bg-accent-500 text-onaccent shadow-lg shadow-accent-500/25; }
    .btn-accent:not(:disabled):hover { @apply bg-accent-600; }
    .btn-accent:not(:disabled):active { @apply bg-accent-700; }
    .btn-ghost { @apply bg-transparent text-brand; }
    .btn-ghost:not(:disabled):hover { @apply bg-soft; }
    .btn-ghost:not(:disabled):active { @apply bg-soft-2; }
    .btn-outline { @apply border-line-strong bg-field text-ink; }
    .btn-outline:not(:disabled):hover { @apply border-primary-500 bg-soft; }
    /* زر في حالة الانتظار: يبقى مقروءًا (ليس باهتًا) مع شريط تقدّم زمني داخلي */
    .btn-wait { @apply relative overflow-hidden border-line-strong bg-soft text-ink shadow-none; opacity: 1 !important; }

    /* ---- Form ---- */
    .label { @apply block text-label font-bold text-ink; }
    .hint  { @apply mt-1.5 text-caption text-muted; }
    .err   { @apply mt-1.5 flex items-start gap-1.5 text-caption font-bold text-danger; }

    .fgroup { @apply flex w-full items-center gap-3 rounded-xl border border-line-strong bg-field px-4 text-body text-ink transition; }
    .fgroup:hover { @apply border-primary-500; }
    .fgroup:focus-within { @apply border-brand; box-shadow: var(--ring); }
    .fgroup[data-invalid='true'] { @apply border-error-600 bg-error-500/10; }
    .fgroup[data-invalid='true']:focus-within { box-shadow: 0 0 0 2px rgb(var(--card)), 0 0 0 4px #DC2626; }
    .ok-mark { @apply opacity-0 transition-opacity; color: rgb(var(--ok)); }
    .fgroup[data-valid='true'] .ok-mark { @apply opacity-100; }
    /* 16px على الأقل دائمًا — يمنع التكبير التلقائي في iOS */
    .fgroup-input { @apply min-w-0 flex-1 bg-transparent leading-6 text-ink outline-none placeholder:text-muted/70; font-size: max(16px, 1rem); padding-block: clamp(.5rem, 1.35vh, .75rem); min-height: 2.75rem; }
    [dir='rtl'] .fgroup-input.rtl-end { text-align: right; }
    .fgroup-input:-webkit-autofill, .fgroup-input:-webkit-autofill:hover, .fgroup-input:-webkit-autofill:focus {
      -webkit-text-fill-color: rgb(var(--ink)); caret-color: rgb(var(--ink));
      box-shadow: 0 0 0 1000px rgb(var(--field)) inset; transition: background-color 9999s;
    }

    /* ---- Alerts (إشعار عائم) ---- */
    .alert { @apply flex items-start gap-3 rounded-xl border border-s-4 p-4 text-caption font-medium; }
    .alert-error   { background: #FEF2F2; border-color: #FEE2E2; border-inline-start-color: #EF4444; color: #991B1B; }
    .alert-success { background: #ECFDF5; border-color: #D1FAE5; border-inline-start-color: #10B981; color: #065F46; }
    .dark .alert-error   { background: #2A1518; border-color: rgb(239 68 68 / .30);  border-inline-start-color: #EF4444; color: #FCA5A5; }
    .dark .alert-success { background: #0F2A24; border-color: rgb(16 185 129 / .30); border-inline-start-color: #10B981; color: #6EE7B7; }

    /* ---- Card / Link / Tool ---- */
    .card { @apply rounded-3xl border border-line bg-card shadow-card; }
    .dark .card { box-shadow: 0 24px 48px -24px rgb(0 0 0 / .75); }
    .link { @apply rounded text-caption font-bold text-brand underline-offset-4 transition-colors hover:underline; }
    .link:focus-visible { outline: none; box-shadow: var(--ring); }
    .tool { @apply grid h-10 w-10 place-items-center rounded-xl border border-line-strong bg-field text-muted transition-colors hover:bg-soft hover:text-ink; }
    .tool:focus-visible { outline: none; box-shadow: var(--ring); }
    .feature { @apply flex items-center gap-3.5 rounded-2xl border border-white/20 bg-white/10 backdrop-blur-md; padding: clamp(.5rem, 1.5vh, .875rem) 1rem; }
    .pill { @apply rounded-full border border-line-strong px-3 py-0.5 text-[0.8125rem] font-bold transition-colors focus-visible:outline-none focus-visible:shadow-[var(--ring)] disabled:cursor-not-allowed disabled:opacity-50; }
  }
</style>

  /* اختصارات لفتح صندوق البريد حسب نطاق البريد (تحسين للتجربة فقط) */
  const MAIL_APPS = [
    { re: /^(gmail|googlemail)\.com$/i,             name: 'Gmail',   url: 'https://mail.google.com/mail/u/0/#search/from%3Afirob' },
    { re: /^(outlook|hotmail|live|msn)\.[a-z.]+$/i,  name: 'Outlook', url: 'https://outlook.live.com/mail/0/' },
    { re: /^(yahoo|ymail)\.[a-z.]+$/i,               name: 'Yahoo',   url: 'https://mail.yahoo.com/' },
    { re: /^(icloud|me|mac)\.com$/i,                 name: 'iCloud',  url: 'https://www.icloud.com/mail' },
  ];

  const COOLDOWN_KEY = 'firob-forgot-cooldown';

  function toLatinDigits(str) {
    return String(str).replace(/[٠-٩۰-۹]/g, d => String(d.charCodeAt(0) & 0xF));
  }
  function toSlug(str) {
    return toLatinDigits(str).toLowerCase().replace(/[\s_.]+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-{2,}/g, '-').replace(/^-+/, '').slice(0, 63);
  }

  function app() {
    return {
      /* --- الحالة --- */
      lang: (window.FIROB && FIROB.locale) || document.documentElement.lang || 'ar',
      dark: document.documentElement.classList.contains('dark'),
      tenant: '', email: '', tenantInfo: false,
      busy: false, sent: false, errors: {},
      alert: '', alertMsg: '', alertTimer: null,
      cooldown: 0, cooldownTotal: 60, cooldownUntil: 0, cdTimer: null, COOLDOWN: 60,
      srMsg: '', pulse: 0,

      /* --- شبكة العناصر التعليمية الزخرفية --- */
      tone: { m: 'bg-white/10', l: 'bg-white/[.06]', d: 'bg-primary-900/30', a: 'bg-accent-500/80', '-': '' },
      cells: [
        'm','l:play','-','a:check','d','-',
        '-','m','d:table','-','l','-',
        'd:book','-','m','-','a:key','-',
        '-','d','-','l:folder','-','m',
        'm','-','d','-','l:code','-',
        '-','d','-','m','-','l',
      ],

      /* --- الترجمة والثيم --- */
      t(k, vars) {
        let s = (I18N[this.lang] && I18N[this.lang][k]) || I18N.ar[k] || k;
        if (vars) Object.keys(vars).forEach(n => { s = s.replace('{' + n + '}', vars[n]); });
        return s;
      },
      init() {
        this.$watch('lang', () => this.applyLang()); this.applyLang(); this.syncMeta();
        try {
          const mq = window.matchMedia('(prefers-color-scheme: dark)');
          mq.addEventListener?.('change', (e) => {
            let saved = null; try { saved = localStorage.getItem('firob-theme'); } catch (_) {}
            if (!saved) this.setTheme(e.matches, false);
          });
        } catch (_) {}

        /* تعبئة مسبقة من صفحة الدخول: forgot-password.html?email=...&tenant=... */
        try {
          const q = new URLSearchParams(location.search);
          if (q.get('email')) this.email = q.get('email').trim();
          if (q.get('tenant')) this.tenant = toSlug(q.get('tenant'));
        } catch (_) {}

        /* استئناف العدّاد بعد تحديث الصفحة (لا يُعاد ضبطه بالضغط على F5) */
        let saved = null; try { saved = JSON.parse(sessionStorage.getItem(COOLDOWN_KEY) || 'null'); } catch (_) {}
        if (saved && saved.until > Date.now()) this.startCooldown(Math.ceil((saved.until - Date.now()) / 1000), saved.until, saved.total);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) this.tick(); });

        /* تركيز تلقائي على أول حقل فارغ في أجهزة المؤشر الدقيق فقط */
        if (window.matchMedia && matchMedia('(pointer: fine)').matches) {
          this.$nextTick(() => (this.tenant ? this.$refs.email : this.$refs.tenant)?.focus({ preventScroll: true }));
        }
      },
      applyLang() {
        const h = document.documentElement;
        h.lang = this.lang; h.dir = this.lang === 'ar' ? 'rtl' : 'ltr';
        if (window.FIROB && typeof FIROB.setLocale === 'function') FIROB.setLocale(this.lang);   /* يثبّت اللغة للصفحة التالية */
        document.title = this.t(this.sent ? 'sentTitle' : 'title') + ' — FirOb';
      },
      setTheme(isDark, persist = true) {
        document.body.classList.add('theme-anim');
        this.dark = isDark;
        document.documentElement.classList.toggle('dark', isDark);
        if (persist) { try { localStorage.setItem('firob-theme', isDark ? 'dark' : 'light'); } catch (e) {} }
        this.syncMeta();
        clearTimeout(this._themeT); this._themeT = setTimeout(() => document.body.classList.remove('theme-anim'), 350);
      },
      toggleTheme() { this.setTheme(!this.dark); },
      syncMeta() { document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7'); },

      /* --- مساعدات العرض --- */
      get tenantPreview() { return (this.tenant.replace(/-+$/, '') || 'school-name') + '.firob.net'; },
      get mailApp() {
        const domain = (this.email.split('@')[1] || '').trim();
        return MAIL_APPS.find(m => m.re.test(domain)) || null;
      },

      /* --- التحقق --- */
      tenantRule(v) { if (!v) return 'tenantReq'; if (!/^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$/.test(v)) return 'tenantFmt'; return ''; },
      emailRule(v)  { v = v.trim(); if (!v) return 'emailReq'; if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'emailFmt'; return ''; },
      get tenantOk() { return !!this.tenant && !this.tenantRule(this.tenant) && !this.errors.tenant; },
      get emailOk()  { return !!this.email.trim() && !this.emailRule(this.email) && !this.errors.email; },
      onTenantInput() { this.tenant = toSlug(this.tenant); this.errors.tenant = ''; },
      /* تحقق عند مغادرة الحقل — فقط إذا كتب المستخدم شيئًا */
      blurField(f) {
        if (f === 'tenant') { this.tenant = this.tenant.replace(/-+$/, ''); if (this.tenant) this.errors.tenant = this.tenantRule(this.tenant); }
        if (f === 'email')  { this.email = this.email.trim(); if (this.email) this.errors.email = this.emailRule(this.email); }
      },
      validate() {
        this.tenant = this.tenant.replace(/-+$/, ''); this.email = this.email.trim();
        const e = {};
        const tn = this.tenantRule(this.tenant); if (tn) e.tenant = tn;
        const em = this.emailRule(this.email);   if (em) e.email = em;
        this.errors = e;
        return Object.keys(e).length === 0;
      },

      /* --- الإشعار --- */
      notify(type, msg, ms = 5000) {
        this.alert = type; this.alertMsg = msg; clearTimeout(this.alertTimer);
        if (ms) this.alertTimer = setTimeout(() => this.alert = '', ms);
      },
      dismiss() { clearTimeout(this.alertTimer); this.alert = ''; },

      /* --- العدّاد التنازلي (مبني على وقت انتهاء ثابت؛ يشمل زر الإرسال وزر إعادة الإرسال) --- */
      get countdown() {
        return String(Math.floor(this.cooldown / 60)).padStart(2, '0') + ':' + String(this.cooldown % 60).padStart(2, '0');
      },
      get cooldownPct() { return this.cooldownTotal ? (this.cooldown / this.cooldownTotal) * 100 : 0; },
      startCooldown(sec, until, total) {
        this.cooldownTotal = total || sec;
        this.cooldownUntil = until || (Date.now() + sec * 1000);
        try { sessionStorage.setItem(COOLDOWN_KEY, JSON.stringify({ until: this.cooldownUntil, total: this.cooldownTotal })); } catch (_) {}
        clearInterval(this.cdTimer);
        this.srMsg = this.t('waitSr', { s: sec });
        this.tick();
        this.cdTimer = setInterval(() => this.tick(), 250);
      },
      tick() {
        if (!this.cooldownUntil) return;
        const left = Math.max(0, Math.ceil((this.cooldownUntil - Date.now()) / 1000));
        this.cooldown = left;
        if (left === 0) {
          clearInterval(this.cdTimer); this.cooldownUntil = 0;
          try { sessionStorage.removeItem(COOLDOWN_KEY); } catch (_) {}
          this.srMsg = this.t('readySr');
        }
      },
      resetCooldown() {
        clearInterval(this.cdTimer); this.cooldown = 0; this.cooldownUntil = 0;
        try { sessionStorage.removeItem(COOLDOWN_KEY); } catch (_) {}
      },

      /* --- الإرسال --- */
      async submit(force) {
        if (this.busy || this.cooldown > 0) return;
        this.alert = '';
        if (!this.validate()) {
          this.$nextTick(() => this.$refs.form.querySelector('[aria-invalid="true"]')?.focus());
          return;
        }
        this.busy = true;
        /* ---- التكامل مع Laravel ----
           Blade:    this.$refs.form.submit();   // POST /forgot-password
           Livewire: $wire.sendResetLink({ tenant, email })
           الرد موحّد سواء وُجد الحساب أم لا (يمنع تعداد الحسابات)،
           والـ Rate Limiting وحل الـ Tenant يتمّان في الخادم فقط. */
        await new Promise(r => setTimeout(r, 900));   // محاكاة للعرض فقط
        this.busy = false;
        if (force === 'bad') { this.notify('error', 'serverErr', 7000); return; }
        this.sent = true; this.pulse++; this.applyLang();
        this.startCooldown(this.COOLDOWN);
        this.notify('success', 'sentOk');
        this.$nextTick(() => this.$refs.sentTitle.focus());
      },
      async resend() {
        if (this.cooldown > 0 || this.busy) return;
        this.busy = true;
        await new Promise(r => setTimeout(r, 900));   // محاكاة للعرض فقط
        this.busy = false; this.pulse++;
        this.startCooldown(this.COOLDOWN);
        this.notify('success', 'resendOk');
      },
      /* العودة لتعديل البيانات: لا نُصفّر العدّاد (وإلا أمكن تجاوزه بسهولة) */
      editEmail() {
        this.sent = false; this.dismiss(); this.applyLang();
        this.$nextTick(() => this.$refs.email?.focus());
      },
      demo(ok) {
        if (this.busy) return;
        this.resetCooldown(); this.sent = false; this.errors = {};
        this.tenant = 'demo-school'; this.email = 'teacher@gmail.com';
        this.submit(ok ? 'ok' : 'bad');
      },
    };
  }
</script>
</head>

              <bdi dir="ltr" class="break-all font-bold" :class="tenant ? 'text-brand' : 'text-ink'" x-text="tenantPreview">school-name.firob.net</bdi>
            </p>
            <p id="tenant-err" class="err" x-show="errors.tenant" x-cloak><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-x-circle"/></svg><span x-text="t(errors.tenant)"></span></p>
          </div>

          <!-- ② البريد الإلكتروني -->
          <div>
            <label class="label mb-1.5" for="email"><span x-text="t('emailLabel')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
            <div class="fgroup" :data-invalid="!!errors.email" :data-valid="emailOk">
              <svg class="ic text-muted" aria-hidden="true"><use href="#i-mail"/></svg>
              <input id="email" x-ref="email" name="email" type="email" dir="ltr" inputmode="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false"
                     enterkeyhint="send" placeholder="name@school.edu" required aria-required="true"
                     class="fgroup-input rtl-end"
                     x-model="email" @input="errors.email = ''" @blur="blurField('email')"
                     :aria-invalid="!!errors.email" :aria-describedby="errors.email ? 'email-err' : null">
              <svg class="ic ok-mark !h-4 !w-4" aria-hidden="true"><use href="#i-tick"/></svg>
            </div>
            <p id="email-err" class="err" x-show="errors.email" x-cloak><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-x-circle"/></svg><span x-text="t(errors.email)"></span></p>
          </div>

          <!-- زر الإرسال (يحترم العدّاد أيضًا عند العودة لتعديل البيانات) -->
          <button type="submit" class="btn btn-lg w-full" :class="[cooldown > 0 && !busy ? 'btn-wait' : 'btn-accent', busy && 'is-loading']"
                  :aria-busy="busy" :disabled="busy || cooldown > 0">
            <span x-show="cooldown > 0 && !busy" x-cloak class="absolute inset-y-0 start-0 bg-primary-500/15 transition-[width] duration-300 ease-linear dark:bg-primary-500/25" :style="'width:' + cooldownPct + '%'" aria-hidden="true"></span>
            <svg x-show="busy" x-cloak class="ic relative animate-spin" aria-hidden="true"><use href="#i-spinner"/></svg>
            <svg x-show="!busy && cooldown > 0" x-cloak class="ic relative" aria-hidden="true"><use href="#i-clock"/></svg>
            <span class="relative truncate" x-show="busy" x-cloak x-text="t('busy')"></span>
            <span class="relative truncate" x-show="!busy && cooldown === 0" x-text="t('submit')">إرسال رابط الاستعادة</span>
            <span class="relative truncate" x-show="!busy && cooldown > 0" x-cloak><span x-text="t('submitWait')"></span> <bdi dir="ltr" class="tabular-nums" x-text="countdown"></bdi></span>
            <svg x-show="!busy && cooldown === 0" class="ic relative ltr:rotate-180" aria-hidden="true"><use href="#i-arrow"/></svg>
          </button>
        </form>

        <p class="mt-[clamp(.75rem,2vh,1.25rem)] text-center">
          <a href="login.html" class="link inline-flex min-h-[2.75rem] items-center gap-1.5 !text-label">
            <svg class="ic !h-4 !w-4 rtl:rotate-180" aria-hidden="true"><use href="#i-arrow"/></svg>
            <span x-text="t('backLogin')"></span>
          </a>
        </p>
      </section>

      <!-- ═════ الحالة ②: تم الإرسال ═════ -->
      <section x-show="sent" x-cloak class="card w-full max-w-[27rem] p-[clamp(1.25rem,3vh,2.25rem)] max-[359px]:rounded-2xl max-[359px]:p-4 xshort:p-4" aria-labelledby="sent-title">

        <div class="mb-[clamp(.75rem,2.2vh,1.25rem)] xshort:mb-2">
          <div class="flex items-center gap-3">
            <span class="relative grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-primary-500 text-white shadow-lg shadow-primary-500/30 short:h-9 short:w-9" aria-hidden="true">
              <svg class="ic"><use href="#i-mail-open"/></svg>
              <template x-for="n in [pulse]" :key="'b' + n">
                <span class="pop absolute -bottom-1.5 -end-1.5 grid h-5 w-5 place-items-center rounded-full border-2 border-card bg-accent-500 text-onaccent">
                  <svg class="ic !h-3 !w-3" style="stroke-width:3"><use href="#i-tick"/></svg>
                </span>
              </template>
            </span>
            <h1 id="sent-title" x-ref="sentTitle" tabindex="-1" class="text-h1 font-extrabold text-ink focus:outline-none" x-text="t('sentTitle')"></h1>
          </div>
        </div>

        <div class="space-y-2 text-caption text-muted">
          <p x-text="t('sentText')"></p>
          <div class="rounded-xl border border-line bg-soft/60 px-3 py-2.5">
            <bdi dir="ltr" class="block select-all break-all text-[1.0625rem] font-extrabold leading-snug text-ink" x-text="email"></bdi>
            <a x-show="mailApp" x-cloak :href="mailApp && mailApp.url" target="_blank" rel="noopener" class="link mt-1 inline-flex min-h-[2rem] items-center gap-1">
              <span x-text="mailApp ? t('openInbox', { app: mailApp.name }) : ''"></span>
              <svg class="ic !h-3.5 !w-3.5" aria-hidden="true"><use href="#i-external"/></svg>
            </a>
          </div>
          <p class="inline-flex items-center gap-1.5 font-bold text-ink"><svg class="ic !h-4 !w-4 text-brand" aria-hidden="true"><use href="#i-clock"/></svg><span x-text="t('sentValid')"></span></p>
        </div>

        <p class="mt-[clamp(.625rem,1.7vh,1rem)] flex items-start gap-2 rounded-xl border border-accent-200 bg-accent-100/60 px-3 py-2.5 text-caption text-onaccent dark:border-accent-500/25 dark:bg-accent-500/10 dark:text-accent-100 xshort:hidden">
          <svg class="ic mt-0.5 !h-4 !w-4 text-accent-700 dark:text-accent-500" aria-hidden="true"><use href="#i-bulb"/></svg>
          <span x-text="t('sentTip')"></span>
        </p>

        <div class="mt-[clamp(.75rem,2vh,1.25rem)] space-y-2">
          <!-- إعادة الإرسال مع عدّاد وشريط تقدّم -->
          <button type="button" class="btn btn-lg w-full" :class="[cooldown > 0 && !busy ? 'btn-wait' : 'btn-accent', busy && 'is-loading']"
                  :aria-busy="busy" :disabled="cooldown > 0 || busy" @click="resend()">
            <span x-show="cooldown > 0 && !busy" x-cloak class="absolute inset-y-0 start-0 bg-primary-500/15 transition-[width] duration-300 ease-linear dark:bg-primary-500/25" :style="'width:' + cooldownPct + '%'" aria-hidden="true"></span>
            <svg x-show="busy" x-cloak class="ic relative animate-spin" aria-hidden="true"><use href="#i-spinner"/></svg>
            <svg x-show="!busy && cooldown === 0" class="ic relative rtl:-scale-x-100" aria-hidden="true"><use href="#i-send"/></svg>
            <svg x-show="!busy && cooldown > 0" x-cloak class="ic relative" aria-hidden="true"><use href="#i-clock"/></svg>
            <span class="relative truncate" x-show="busy" x-cloak x-text="t('busy')"></span>
            <span class="relative truncate" x-show="!busy && cooldown === 0" x-text="t('resend')"></span>
            <span class="relative truncate" x-show="!busy && cooldown > 0" x-cloak><span x-text="t('resendWait')"></span> <bdi dir="ltr" class="tabular-nums" x-text="countdown"></bdi></span>
          </button>

          <!-- عرض فقط: يقوم مقام النقر على الرابط داخل البريد، ليكتمل المسار أمام العميل.
               في Laravel يصل المستخدم إلى reset-password عبر رابط موقّع يحمل token — احذف هذا الزر قبل الإطلاق. -->
          <a href="reset-password.html" class="btn btn-ghost btn-lg w-full !border !border-dashed !border-line-strong">
            <svg class="ic" aria-hidden="true"><use href="#i-check-circle"/></svg>
            <span class="truncate" x-text="t('openLink')"></span>
            <span class="rounded-full bg-accent-500/20 px-2 py-0.5 text-[0.6875rem] font-extrabold text-accent-700 dark:text-accent-500" x-text="t('simulated')"></span>
          </a>

          <div class="grid grid-cols-1 gap-2 min-[400px]:grid-cols-2">
            <button type="button" class="btn btn-outline w-full" @click="editEmail()">
              <svg class="ic !h-4 !w-4" aria-hidden="true"><use href="#i-edit"/></svg><span class="truncate" x-text="t('changeEmail')"></span>
            </button>
            <a href="login.html" class="btn btn-ghost w-full">
              <svg class="ic !h-4 !w-4 rtl:rotate-180" aria-hidden="true"><use href="#i-arrow"/></svg><span class="truncate" x-text="t('backLogin')"></span>
            </a>
          </div>
        </div>
      </section>

      <!-- تذييل: داخل منطقة التمرير فلا يقتطع من ارتفاع البطاقة -->
      <footer class="mt-4 flex flex-wrap items-center justify-center gap-x-3 gap-y-2 px-4 py-2 text-center text-[0.8125rem] text-muted short:mt-2">
        <span x-text="t('rights')"></span>
        <a href="../index.html" class="pill inline-flex items-center gap-1 text-muted hover:bg-soft hover:text-ink">
          <svg class="ic !h-3.5 !w-3.5" aria-hidden="true"><use href="#i-home"/></svg><span x-text="t('screens')"></span>
        </a>
      </footer>
      </div>
    </main>
  </div>
</div>

<!-- ========== شريط النموذج الأولي العائم (Prototype Ribbon) — معزول عن التذييل الإنتاجي، احذفه بالكامل قبل الإطلاق ========== -->
<div class="fixed z-50" style="bottom: calc(.75rem + var(--sab)); inset-inline-end: calc(.75rem + var(--sar)); max-width: calc(100vw - 1.5rem - var(--sal) - var(--sar));"
     role="region" :aria-label="t('demoLabel')">
  <div class="no-scrollbar flex items-center gap-1.5 overflow-x-auto rounded-full border border-dashed border-accent-500/70 bg-slate-900/90 p-1.5 shadow-pop backdrop-blur-md">
    <span class="flex shrink-0 items-center gap-1 rounded-full bg-accent-500 px-2.5 py-1 text-[0.6875rem] font-extrabold uppercase tracking-wide text-onaccent">
      <svg class="ic !h-3.5 !w-3.5" aria-hidden="true"><use href="#i-sparkle"/></svg>
      <span class="hidden sm:inline" x-text="t('demoTitle')"></span>
    </span>
    <button type="button" class="pill min-h-[2.25rem] shrink-0 whitespace-nowrap !border-white/20 !text-white hover:!bg-white/10" :disabled="busy" @click="demo(true)" x-text="t('demoOk')"></button>
    <button type="button" class="pill min-h-[2.25rem] shrink-0 whitespace-nowrap !border-red-400/60 !text-red-300 hover:!bg-red-500/15" :disabled="busy" @click="demo(false)" x-text="t('demoBad')"></button>
  </div>
</div>

</body>
</html>
