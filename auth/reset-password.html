<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer"><!-- لا نُسرّب الـ token في ترويسة Referer عند فتح روابط خارجية -->
<title>استعادة كلمة المرور — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض الوضع الفاتح) -->
<script>
  (function () {
    var d = false;
    try {
      var s = localStorage.getItem('firob-theme');
      d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) {
      d = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    document.documentElement.classList.toggle('dark', d);
    var m = document.getElementById('theme-color');
    if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ①-ج تطبيق اللغة والاتجاه قبل الرسم (يمنع قفزة RTL → LTR) -->
<script>
  (function () {
    var l = (window.FIROB && FIROB.locale) || 'ar';
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  })();
</script>

<script>

    darkMode: 'class',

      /* شاشات قصيرة: نضغط العناصر الثانوية بدل ظهور سكرول */

        caption: ['0.875rem',  { lineHeight: '1.375rem' }],                               // 14px

        body:    ['1rem',      { lineHeight: '1.5rem'   }],                               // 16px

        display: ['clamp(1.5rem, 0.9rem + 2.2vh, 2.5rem)',   { lineHeight: '1.35' }],    // 24 → 40px

      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },

        error:   { 500:'#EF4444', 600:'#DC2626' },

  const REDIRECT_SECS = 8;

  function app() {
    return {
      /* --- الحالة --- */
      lang: (window.FIROB && FIROB.locale) || document.documentElement.lang || 'ar',
      dark: document.documentElement.classList.contains('dark'),
      view: 'form',                                   // form | done | expired
      /* Laravel: تُمرَّر من الرابط الموقّع/الخادم (token + email + tenant) */
      token: 'demo-token', tenant: 'demo-school', email: 'teacher@firob.sa',
      password: '', confirm: '',
      showPw: false, showPw2: false, capsOn: false, capsOn2: false,
      busy: false, errors: {}, alert: '', alertMsg: '', alertTimer: null,
      redirectLeft: 0, redirectTimer: null,

      /* --- شبكة العناصر التعليمية الزخرفية --- */
      tone: { m: 'bg-white/10', l: 'bg-white/[.06]', d: 'bg-primary-900/30', a: 'bg-accent-500/80', '-': '' },
      cells: [
        'm','l:play','-','a:check','d','-',
        '-','m','d:table','-','l','-',
        'd:book','-','m','-','a:key','-',
        '-','d','-','l:folder','-','m',
        'm','-','d','-','l:code','-',
        '-','d','-','m','-','l',
      ],

      /* --- الترجمة والثيم --- */
      t(k, vars) {
        let s = (I18N[this.lang] && I18N[this.lang][k]) || I18N.ar[k] || k;
        if (vars) Object.keys(vars).forEach(n => { s = s.replace('{' + n + '}', vars[n]); });
        return s;
      },
      init() {
        this.$watch('lang', () => this.applyLang()); this.applyLang(); this.syncMeta();
        try {
          const mq = window.matchMedia('(prefers-color-scheme: dark)');
          mq.addEventListener?.('change', (e) => {
            let saved = null; try { saved = localStorage.getItem('firob-theme'); } catch (_) {}
            if (!saved) this.setTheme(e.matches, false);
          });
        } catch (_) {}

        /* بيانات الرابط: reset-password.html?token=...&email=...&tenant=...&state=expired */
        try {
          const q = new URLSearchParams(location.search);
          if (q.get('token'))  this.token  = q.get('token');
          if (q.get('email'))  this.email  = q.get('email');
          if (q.get('tenant')) this.tenant = q.get('tenant');
          if (q.get('state') === 'expired' || (q.has('token') && !q.get('token'))) this.view = 'expired';
          /* نُزيل الـ token من شريط العنوان (لا يبقى في السجل أو يُنسخ بالخطأ) */
          if (q.has('token') && history.replaceState) history.replaceState(null, '', location.pathname);
        } catch (_) {}

        /* تركيز تلقائي على حقل كلمة المرور في أجهزة المؤشر الدقيق فقط */
        if (this.view === 'form' && window.matchMedia && matchMedia('(pointer: fine)').matches) {
          this.$nextTick(() => this.$refs.password?.focus({ preventScroll: true }));
        }
      },
      applyLang() {
        const h = document.documentElement;
        h.lang = this.lang; h.dir = this.lang === 'ar' ? 'rtl' : 'ltr';
        if (window.FIROB && typeof FIROB.setLocale === 'function') FIROB.setLocale(this.lang);   /* يثبّت اللغة للصفحة التالية */
        const titleKey = { form: 'title', done: 'doneTitle', expired: 'badTitle' }[this.view];
        document.title = this.t(titleKey) + ' — FirOb';
      },
      setTheme(isDark, persist = true) {
        document.body.classList.add('theme-anim');
        this.dark = isDark;
        document.documentElement.classList.toggle('dark', isDark);
        if (persist) { try { localStorage.setItem('firob-theme', isDark ? 'dark' : 'light'); } catch (e) {} }
        this.syncMeta();
        clearTimeout(this._themeT); this._themeT = setTimeout(() => document.body.classList.remove('theme-anim'), 350);
      },
      toggleTheme() { this.setTheme(!this.dark); },
      syncMeta() { document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7'); },

      /* --- روابط تحمل السياق --- */
      get loginHref()  { return 'login.html?email=' + encodeURIComponent(this.email); },
      get forgotHref() { return 'forgot-password.html?email=' + encodeURIComponent(this.email) + '&tenant=' + encodeURIComponent(this.tenant); },

      /* --- قوة كلمة المرور والشروط --- */
      get rules() {
        const p = this.password;
        return [
          { k: 'rLen',    ok: p.length >= 8 },
          { k: 'rLetter', ok: /[A-Za-z؀-ۿ]/.test(p) },
          { k: 'rNum',    ok: /\d/.test(p) },
          { k: 'rMatch',  ok: p.length > 0 && p === this.confirm },
        ];
      },
      get allRulesOk() { return this.rules.every(r => r.ok); },
      get score() {
        const p = this.password; if (!p) return 0;
        let s = 0;
        if (p.length >= 8) s++;
        if (p.length >= 12) s++;
        if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;
        if (/\d/.test(p)) s++;
        if (/[^A-Za-z0-9]/.test(p)) s++;
        /* 5 معايير → 4 مستويات؛ ولا تتجاوز "ضعيفة" ما لم تُستوفَ الشروط الأساسية */
        const level = s <= 1 ? 1 : s === 2 ? 2 : s === 3 ? 3 : 4;
        const base = p.length >= 8 && /[A-Za-z؀-ۿ]/.test(p) && /\d/.test(p);
        return base ? level : 1;
      },
      get strengthKey() { return ['sNone', 'sWeak', 'sFair', 'sGood', 'sStrong'][this.score]; },
      get strengthColor() { return ['', 'bg-error-500', 'bg-amber-500', 'bg-primary-500', 'bg-emerald-500'][this.score]; },
      get strengthText()  { return ['text-muted', 'text-danger', 'text-amber-700 dark:text-amber-400', 'text-brand', 'text-emerald-700 dark:text-emerald-400'][this.score]; },
      checkCaps(e, which) {
        if (!e || typeof e.getModifierState !== 'function') return;
        this[which] = e.getModifierState('CapsLock');
      },
      togglePw(which, ref) {
        this[which] = !this[which];
        this.$nextTick(() => { const i = this.$refs[ref]; i.focus(); const n = i.value.length; try { i.setSelectionRange(n, n); } catch (_) {} });
      },

      /* --- النموذج --- */
      passError() {
        if (!this.password) return 'passReq';
        if (this.password.length < 8) return 'passMin';
        if (!/[A-Za-z؀-ۿ]/.test(this.password) || !/\d/.test(this.password)) return 'passMix';
        return '';
      },
      confError() {
        if (!this.confirm) return 'confReq';
        return this.confirm === this.password ? '' : 'confMatch';
      },
      blurField(f) {
        if (f === 'password' && this.password) this.errors.password = this.passError();
        if (f === 'confirm'  && this.confirm)  this.errors.confirm  = this.confError();
      },
      validate() {
        const e = {};
        const p = this.passError(); if (p) e.password = p;
        const c = this.confError(); if (c) e.confirm = c;
        this.errors = e;
        return Object.keys(e).length === 0;
      },
      notify(type, msg, ms = 5000) {
        this.alert = type; this.alertMsg = msg; clearTimeout(this.alertTimer);
        if (ms) this.alertTimer = setTimeout(() => this.alert = '', ms);
      },
      dismiss() { clearTimeout(this.alertTimer); this.alert = ''; },
      setView(v, ref) {
        this.view = v; this.dismiss(); this.applyLang();
        this.$nextTick(() => { this.$refs.main.scrollTop = 0; this.$refs[ref]?.focus(); });
      },

      /* --- التحويل التلقائي بعد النجاح (قابل للإلغاء) --- */
      startRedirect() {
        this.redirectLeft = REDIRECT_SECS; clearInterval(this.redirectTimer);
        this.redirectTimer = setInterval(() => {
          if (--this.redirectLeft <= 0) { clearInterval(this.redirectTimer); this.goLogin(); }
        }, 1000);
      },
      cancelRedirect() { clearInterval(this.redirectTimer); this.redirectLeft = 0; },
      goLogin() {
        if (window.FIROB && typeof FIROB.go === 'function') FIROB.go('login', 0);
        else window.location.href = this.loginHref;
      },

      async submit(force) {
        if (this.busy) return;
        this.alert = '';
        if (!this.validate()) {
          this.$nextTick(() => this.$refs.form.querySelector('[aria-invalid="true"]')?.focus());
          return;
        }
        this.busy = true;
        /* ---- التكامل مع Laravel ----
           Blade:    this.$refs.form.submit();   // POST /reset-password (token, tenant, email, password, password_confirmation)
           Livewire: $wire.resetPassword({ token, tenant, email, password, confirm })
           التحقق من صلاحية الـ token وسياسة كلمات المرور وإبطال الجلسات القديمة تتم في الخادم فقط. */
        await new Promise(r => setTimeout(r, 900));   // محاكاة للعرض فقط
        this.busy = false;
        if (force === 'bad') { this.notify('error', 'serverErr', 7000); return; }
        if (force === 'expired') { this.password = ''; this.confirm = ''; this.setView('expired', 'badTitle'); return; }
        /* نجاح: نمسح كلمات المرور من الذاكرة ثم ننتقل لحالة التأكيد */
        this.password = ''; this.confirm = ''; this.showPw = this.showPw2 = false;
        this.setView('done', 'doneTitle');
        this.startRedirect();
      },
      demo(mode) {
        if (this.busy) return;
        this.cancelRedirect();
        this.view = 'form'; this.errors = {}; this.applyLang();
        this.password = 'Firob2026x'; this.confirm = 'Firob2026x';
        this.$nextTick(() => this.submit(mode));
      },
    };
  }
</script>
</head>

            </div>
            <p id="password-err" class="err" x-show="errors.password" x-cloak><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-x-circle"/></svg><span x-text="t(errors.password)"></span></p>
            <p id="caps1" class="warn" x-show="capsOn" x-cloak role="status"><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-warning"/></svg><span x-text="t('caps')"></span></p>

            <!-- مؤشر القوة: الأشرطة للعين، والنص يُعلن لقارئ الشاشة عند تغيّر المستوى -->
            <div id="password-meter" class="mt-2 flex items-center gap-3">
              <div class="flex flex-1 gap-1.5" dir="ltr" aria-hidden="true">
                <template x-for="i in 4" :key="i">
                  <span class="meter-seg" :class="i <= score && strengthColor"></span>
                </template>
              </div>
              <p class="shrink-0 text-caption text-muted" role="status" aria-live="polite">
                <span class="sr-only" x-text="t('strengthLabel')"></span>
                <span class="font-bold" :class="strengthText" x-text="t(strengthKey)"></span>
              </p>
            </div>
          </div>

          <!-- ② تأكيد كلمة المرور -->
          <div>
            <label class="label mb-1.5" for="confirm"><span x-text="t('confirmPass')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
            <div class="fgroup !pe-1.5" :data-invalid="!!errors.confirm" :data-valid="!!confirm && confirm === password && password.length >= 8">
              <svg class="ic text-muted" aria-hidden="true"><use href="#i-lock"/></svg>
              <input id="confirm" x-ref="confirm" name="password_confirmation" dir="ltr" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"
                     enterkeyhint="done" placeholder="••••••••" required aria-required="true"
                     class="fgroup-input rtl-end" :type="showPw2 ? 'text' : 'password'"
                     x-model="confirm" @input="errors.confirm = ''"
                     @keydown="checkCaps($event, 'capsOn2')" @keyup="checkCaps($event, 'capsOn2')" @blur="capsOn2 = false; blurField('confirm')"
                     :aria-invalid="!!errors.confirm"
                     :aria-describedby="[errors.confirm ? 'confirm-err' : '', capsOn2 ? 'caps2' : ''].filter(Boolean).join(' ') || null">
              <svg class="ic ok-mark !h-4 !w-4" aria-hidden="true"><use href="#i-check"/></svg>
              <button type="button" class="btn btn-ghost btn-icon shrink-0 !text-muted" @mousedown.prevent @click="togglePw('showPw2', 'confirm')"
                      :aria-pressed="showPw2" :aria-label="showPw2 ? t('hidePw') : t('showPw')" :title="showPw2 ? t('hidePw') : t('showPw')" aria-controls="confirm">
                <svg class="ic" x-show="!showPw2" aria-hidden="true"><use href="#i-eye"/></svg>
                <svg class="ic" x-show="showPw2" x-cloak aria-hidden="true"><use href="#i-eye-off"/></svg>
              </button>
            </div>
            <p id="confirm-err" class="err" x-show="errors.confirm" x-cloak><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-x-circle"/></svg><span x-text="t(errors.confirm)"></span></p>
            <p id="caps2" class="warn" x-show="capsOn2" x-cloak role="status"><svg class="ic mt-0.5 !h-4 !w-4" aria-hidden="true"><use href="#i-warning"/></svg><span x-text="t('caps')"></span></p>
          </div>

          <!-- شروط كلمة المرور: تبقى ظاهرة دائمًا (معلومة أساسية)، وتُضغط فقط في الشاشات القصيرة -->
          <div id="password-rules" class="rounded-2xl border border-line bg-soft/40 px-3 py-2.5 short:py-2" :class="allRulesOk && '!border-emerald-500/40'">
            <p class="text-caption font-bold text-ink short:sr-only" x-text="t('rulesTitle')"></p>
            <ul class="mt-1 grid grid-cols-1 gap-x-3 gap-y-0.5 text-caption min-[380px]:grid-cols-2 short:mt-0">
              <template x-for="r in rules" :key="r.k">
                <li class="rule" :data-ok="r.ok">
                  <svg class="ic !h-4 !w-4" aria-hidden="true"><use :href="r.ok ? '#i-check-circle' : '#i-dot'"/></svg>
                  <span x-text="t(r.k)"></span>
                  <span class="sr-only" x-text="'— ' + (r.ok ? t('met') : t('unmet'))"></span>
                </li>
              </template>
            </ul>
            <p class="sr-only" role="status" x-text="allRulesOk ? t('rulesDone') : ''"></p>
          </div>

          <!-- زر الحفظ -->
          <button type="submit" class="btn btn-accent btn-lg w-full" :class="busy && 'is-loading'" :aria-busy="busy" :disabled="busy">
            <svg x-show="busy" x-cloak class="ic animate-spin" aria-hidden="true"><use href="#i-spinner"/></svg>
            <span x-text="busy ? t('busy') : t('submit')">تعيين كلمة المرور</span>
            <svg x-show="!busy" class="ic ltr:rotate-180" aria-hidden="true"><use href="#i-arrow"/></svg>
          </button>
        </form>

        <p class="mt-[clamp(.5rem,1.6vh,1.25rem)] text-center">
          <a href="login.html" class="link inline-flex min-h-[2.75rem] items-center gap-1.5 !text-label">
            <svg class="ic !h-4 !w-4 rtl:rotate-180" aria-hidden="true"><use href="#i-arrow"/></svg>
            <span x-text="t('backLogin')"></span>
          </a>
        </p>
      </section>

      <!-- ═════ الحالة ②: تم تغيير كلمة المرور ═════ -->
      <section x-show="view === 'done'" x-cloak class="card w-full max-w-[28rem] p-[clamp(1.25rem,3vh,2.25rem)] text-center max-[359px]:rounded-2xl max-[359px]:p-4 xshort:p-4" aria-labelledby="done-title">
        <template x-if="view === 'done'">
          <div class="relative mx-auto grid h-16 w-16 place-items-center short:h-14 short:w-14" aria-hidden="true">
            <span class="ripple absolute inset-0 rounded-full border-2 border-emerald-500/50"></span>
            <span class="pop grid h-full w-full place-items-center rounded-full bg-emerald-500 text-white shadow-lg shadow-emerald-500/30">
              <svg class="ic !h-8 !w-8" style="stroke-width:2.5"><use href="#i-check"/></svg>
            </span>
          </div>
        </template>
        <h1 id="done-title" x-ref="doneTitle" tabindex="-1" class="mt-4 text-h1 font-extrabold text-ink focus:outline-none short:mt-3" x-text="t('doneTitle')"></h1>
        <p class="mt-2 text-caption text-muted" x-text="t('doneText')"></p>
        <p class="mx-auto mt-3 inline-flex items-center gap-1.5 rounded-full bg-soft px-3 py-1 text-[0.8125rem] font-bold text-brand xshort:hidden">
          <svg class="ic !h-4 !w-4" aria-hidden="true"><use href="#i-shield"/></svg><span x-text="t('doneSecurity')"></span>
        </p>

        <a :href="loginHref" class="btn btn-accent btn-lg mt-[clamp(.75rem,2.2vh,1.5rem)] w-full" @click="cancelRedirect()">
          <span x-text="t('goLogin')"></span>
          <svg class="ic ltr:rotate-180" aria-hidden="true"><use href="#i-arrow"/></svg>
        </a>

        <!-- تحويل تلقائي قابل للإلغاء (WCAG 2.2.1: يمكن للمستخدم إيقاف المهلة) -->
        <div x-show="redirectLeft > 0" class="mt-3 flex flex-wrap items-center justify-center gap-x-2 gap-y-1 text-caption text-muted">
          <span class="inline-flex items-center gap-1.5"><svg class="ic !h-4 !w-4" aria-hidden="true"><use href="#i-clock"/></svg><span x-text="t('redirectIn', { s: redirectLeft })"></span></span>
          <button type="button" class="link min-h-[2.25rem] !text-caption" @click="cancelRedirect()" x-text="t('stay')"></button>
        </div>
      </section>

      <!-- ═════ الحالة ③: الرابط غير صالح أو منتهي ═════ -->
      <section x-show="view === 'expired'" x-cloak class="card w-full max-w-[28rem] p-[clamp(1.25rem,3vh,2.25rem)] max-[359px]:rounded-2xl max-[359px]:p-4 xshort:p-4" aria-labelledby="bad-title" aria-describedby="bad-text">
        <div class="flex items-center gap-3">
          <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl border border-error-500/30 bg-error-500/10 text-danger short:h-9 short:w-9" aria-hidden="true"><svg class="ic"><use href="#i-clock"/></svg></span>
          <h1 id="bad-title" x-ref="badTitle" tabindex="-1" class="text-h1 font-extrabold text-ink focus:outline-none" x-text="t('badTitle')"></h1>
        </div>
        <p id="bad-text" class="mt-3 text-caption text-muted" x-text="t('badText')"></p>
        <p class="mt-3 flex items-start gap-2 rounded-xl border border-line bg-soft/60 px-3 py-2.5 text-caption text-ink xshort:hidden">
          <svg class="ic mt-0.5 !h-4 !w-4 text-brand" aria-hidden="true"><use href="#i-shield"/></svg><span x-text="t('badWhy')"></span>
        </p>
        <div class="mt-[clamp(.75rem,2.2vh,1.5rem)] space-y-2">
          <!-- يمرّر البريد والمنشأة لصفحة «نسيت كلمة المرور» فتُملأ الحقول تلقائيًا -->
          <a :href="forgotHref" class="btn btn-accent btn-lg w-full">
            <svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg>
            <span x-text="t('newLink')"></span>
          </a>
          <a href="login.html" class="btn btn-ghost w-full">
            <svg class="ic !h-4 !w-4 rtl:rotate-180" aria-hidden="true"><use href="#i-arrow"/></svg><span x-text="t('backLogin')"></span>
          </a>
        </div>
      </section>

      <!-- تذييل: داخل منطقة التمرير فلا يقتطع من ارتفاع البطاقة -->
      <footer class="mt-4 flex flex-wrap items-center justify-center gap-x-3 gap-y-2 px-4 py-2 text-center text-[0.8125rem] text-muted short:mt-2">
        <span x-text="t('rights')"></span>
        <a href="../index.html" class="pill inline-flex items-center gap-1 text-muted hover:bg-soft hover:text-ink">
          <svg class="ic !h-3.5 !w-3.5" aria-hidden="true"><use href="#i-home"/></svg><span x-text="t('screens')"></span>
        </a>
      </footer>
      </div>
    </main>
  </div>
</div>

<!-- ========== شريط النموذج الأولي العائم (Prototype Ribbon) — معزول عن التذييل الإنتاجي، احذفه بالكامل قبل الإطلاق ========== -->
<div class="fixed z-50" style="bottom: calc(.75rem + var(--sab)); inset-inline-end: calc(.75rem + var(--sar)); max-width: calc(100vw - 1.5rem - var(--sal) - var(--sar));"
     role="region" :aria-label="t('demoLabel')">
  <div class="no-scrollbar flex items-center gap-1.5 overflow-x-auto rounded-full border border-dashed border-accent-500/70 bg-slate-900/90 p-1.5 shadow-pop backdrop-blur-md">
    <span class="flex shrink-0 items-center gap-1 rounded-full bg-accent-500 px-2.5 py-1 text-[0.6875rem] font-extrabold uppercase tracking-wide text-onaccent">
      <svg class="ic !h-3.5 !w-3.5" aria-hidden="true"><use href="#i-sparkle"/></svg>
      <span class="hidden sm:inline" x-text="t('demoTitle')"></span>
    </span>
    <button type="button" class="pill min-h-[2.25rem] shrink-0 whitespace-nowrap !border-white/20 !text-white hover:!bg-white/10" :disabled="busy" @click="demo('ok')" x-text="t('demoOk')"></button>
    <button type="button" class="pill min-h-[2.25rem] shrink-0 whitespace-nowrap !border-amber-300/60 !text-amber-200 hover:!bg-amber-400/15" :disabled="busy" @click="demo('expired')" x-text="t('demoExpired')"></button>
    <button type="button" class="pill min-h-[2.25rem] shrink-0 whitespace-nowrap !border-red-400/60 !text-red-300 hover:!bg-red-500/15" :disabled="busy" @click="demo('bad')" x-text="t('demoBad')"></button>
  </div>
</div>

</body>
</html>
