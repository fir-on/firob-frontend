<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<meta name="color-scheme" content="light dark">
<title>تحقق من بريدك الإلكتروني — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض الوضع الفاتح) -->
<script>
  (function () {
    var d = false;
    try {
      var s = localStorage.getItem('firob-theme');
      d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) {
      d = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    document.documentElement.classList.toggle('dark', d);
    var m = document.getElementById('theme-color');
    if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ①-ج تطبيق اللغة والاتجاه قبل الرسم (يمنع قفزة RTL → LTR) -->
<script>
  (function () {
    var l = (window.FIROB && FIROB.locale) || 'ar';
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  })();
</script>

<!-- ② الخطوط: Tajawal للواجهة العربية + Manrope للواجهة الإنجليزية -->

<script src="https://cdn.tailwindcss.com/3.4.5"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      /* شاشات قصيرة: نضغط العناصر الثانوية بدل ظهور سكرول */
      screens: {
        short:  { raw: '(max-height: 760px)' },   /* لابتوب 13" / تابلت أفقي */
        xshort: { raw: '(max-height: 560px)' },   /* جوال أفقي */
      },
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      fontSize: {
        caption: ['0.875rem',  { lineHeight: '1.375rem' }],                               // 14px
        label:   ['0.9375rem', { lineHeight: '1.5rem'   }],                               // 15px
        body:    ['1rem',      { lineHeight: '1.5rem'   }],                               // 16px
        lead:    ['1.0625rem', { lineHeight: '1.75rem'  }],                               // 17px
        h1:      ['clamp(1.375rem, 1rem + 1.5vh, 1.875rem)', { lineHeight: '1.3'  }],    // 22 → 30px
        display: ['clamp(1.5rem, 0.9rem + 2.2vh, 2.5rem)',   { lineHeight: '1.35' }],    // 24 → 40px
      },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        error:   { 500:'#EF4444', 600:'#DC2626' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;

    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165; --glow: 14 128 161;

    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html[lang='en'] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* الصفحة ثابتة؛ التمرير (إن لزم) داخل منطقة البطاقة فقط — ولا تمرير أفقي إطلاقًا */

  @layer components {
    @keyframes breath  { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes ripple  { 0% { transform: scale(.92); opacity: .75; } 100% { transform: scale(1.65); opacity: 0; } }
    @keyframes pop     { 0% { transform: scale(.3); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
    @keyframes nudge   { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-2px) rotate(-6deg); } 60% { transform: translateY(0) rotate(4deg); } }
    /* نبض مستمر هادئ (يشير إلى إجراء مطلوب) + موجة أقوى لمرة واحدة عند كل إرسال */
    .ripple-idle  { animation: ripple 2.6s cubic-bezier(.2,.7,.3,1) infinite; }
    .ripple-burst { animation: ripple 1.2s cubic-bezier(.2,.7,.3,1) 1 both; }
    .pop    { animation: pop .45s cubic-bezier(.3,1.6,.5,1) 1 both; }
    .nudge  { animation: nudge 2.6s ease-in-out infinite; transform-origin: 50% 80%; }

    .app-h { height: 100vh; height: 100dvh; }
    .safe-x { padding-left: var(--sal); padding-right: var(--sar); }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    .ic { @apply h-5 w-5 shrink-0 fill-none stroke-current; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

    .btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .btn:disabled { @apply cursor-not-allowed opacity-60; }
    .btn.is-loading { @apply pointer-events-none cursor-progress opacity-100; }
    .btn-lg { @apply min-h-[3rem] px-6 text-[1.0625rem] leading-7 active:translate-y-px; padding-block: clamp(.6rem, 1.5vh, .875rem); }
    .btn-accent { @apply bg-accent-500 text-onaccent shadow-lg shadow-accent-500/25; }
    .btn-accent:not(:disabled):hover { @apply bg-accent-600; }
    .btn-accent:not(:disabled):active { @apply bg-accent-700; }
    .btn-ghost { @apply bg-transparent text-brand; }
    .btn-ghost:not(:disabled):hover { @apply bg-soft; }

    /* زر في حالة الانتظار: يبقى مقروءًا (ليس باهتًا) مع شريط تقدّم داخلي */

    .alert { @apply flex items-start gap-3 rounded-xl border border-s-4 p-4 text-caption font-medium; }

    .alert-success { background: #ECFDF5; border-color: #D1FAE5; border-inline-start-color: #10B981; color: #065F46; }
    .dark .alert-error   { background: #2A1518; border-color: rgb(239 68 68 / .30);  border-inline-start-color: #EF4444; color: #FCA5A5; }
    .dark .alert-success { background: #0F2A24; border-color: rgb(16 185 129 / .30); border-inline-start-color: #10B981; color: #6EE7B7; }

    /* ---- Card / Link / Tool ---- */
    .card { @apply rounded-3xl border border-line bg-card shadow-card; }
    .dark .card { box-shadow: 0 24px 48px -24px rgb(0 0 0 / .75); }
    .link { @apply rounded text-caption font-bold text-brand underline-offset-4 transition-colors hover:underline; }
    .link:focus-visible { outline: none; box-shadow: var(--ring); }
    .tool { @apply grid h-10 w-10 place-items-center rounded-xl border border-line-strong bg-field text-muted transition-colors hover:bg-soft hover:text-ink; }
    .tool:focus-visible { outline: none; box-shadow: var(--ring); }
    .feature { @apply flex items-center gap-3.5 rounded-2xl border border-white/20 bg-white/10 backdrop-blur-md; padding: clamp(.5rem, 1.5vh, .875rem) 1rem; }
    .pill { @apply rounded-full border border-line-strong px-3 py-0.5 text-[0.8125rem] font-bold transition-colors focus-visible:outline-none focus-visible:shadow-[var(--ring)] disabled:cursor-not-allowed disabled:opacity-50; }

    /* ---- خطوات التفعيل ---- */
    .step { @apply relative flex items-center gap-3 text-caption font-medium text-ink; }
    .step-n { @apply relative z-[1] grid h-7 w-7 shrink-0 place-items-center rounded-lg border border-line bg-soft text-[0.8125rem] font-extrabold text-brand; }
    /* خط واصل بين الأرقام */
    .step:not(:last-child)::after { content: ""; position: absolute; inset-inline-start: .875rem; top: 1.75rem; height: calc(100% - 1rem); border-inline-start: 2px dashed rgb(var(--line)); }
  }
</style>

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
<script>
  /* النصوص — في Laravel تُنقل إلى lang/ar.json و lang/en.json */
  const I18N = {
    ar: {
      title: 'تحقق من بريدك الإلكتروني', skip: 'تخطّي إلى المحتوى',
      brandTag: 'مستودعك التعليمي الذكي',

      step3: 'اضغط زر «تأكيد الحساب» داخل الرسالة',
      stepsLabel: 'خطوات التفعيل',
      openInbox: 'افتح {app}',
      spamTip: 'لم تصلك الرسالة؟ تفقّد مجلد الرسائل غير المرغوب فيها (Spam)، وقد يستغرق وصولها بضع دقائق.',
      resend: 'إعادة إرسال بريد التحقق', busy: 'جارٍ الإرسال…', wait: 'إعادة الإرسال متاحة بعد',
      waitSr: 'يمكنك إعادة الإرسال بعد {s} ثانية.', readySr: 'يمكنك الآن إعادة إرسال بريد التحقق.',
      success: 'تم إرسال رابط تحقق جديد إلى بريدك الإلكتروني بنجاح.',
      serverErr: 'طلبات كثيرة خلال وقت قصير. انتظر قليلًا ثم حاول مجددًا.',
      close: 'إغلاق التنبيه',
      wrongEmail: 'ليس بريدك؟', otherAccount: 'تسجيل الدخول بحساب آخر',
      backLogin: 'العودة لتسجيل الدخول', openLink: 'فتح رابط التحقق', simulated: 'محاكاة',
      themeDark: 'تفعيل الوضع الداكن', themeLight: 'تفعيل الوضع الفاتح', langGroup: 'لغة الواجهة',
      demoTitle: 'تجربة سريعة', demoOk: 'إرسال ناجح', demoBad: 'تجاوز الحد', demoLabel: 'شريط التجربة السريعة للنموذج الأولي',
      rights: '© 2026 FirOb · جميع الحقوق محفوظة', screens: 'خريطة الشاشات',
    },
    en: {
      title: 'Verify your email', skip: 'Skip to content',
      brandTag: 'Your smart learning repository',
      heroTitle: 'Your account is almost ready — just confirm your email.',
      hero1: 'Email confirmation protects your account and institution',
      hero2: 'Once confirmed, you go straight to your institution’s workspace',
      hero3: 'You can request a new verification link anytime',
      subtitle: 'One last step to activate your account.',
      sentTo: 'We sent a verification link to:',
      body: 'Open the email and click the confirmation link to activate your account.',
      step1: 'Open your email inbox',
      step2: 'Find the FirOb message “Verify Email Address”',
      step3: 'Click “Verify account” inside the message',
      stepsLabel: 'Activation steps',
      openInbox: 'Open {app}',
      spamTip: 'Didn’t get it? Check your Spam folder — it may take a few minutes to arrive.',
      resend: 'Resend verification email', busy: 'Sending…', wait: 'You can resend in',
      waitSr: 'You can resend in {s} seconds.', readySr: 'You can now resend the verification email.',
      success: 'A new verification link has been sent to your email.',
      serverErr: 'Too many requests. Please wait a moment and try again.',
      close: 'Dismiss alert',
      wrongEmail: 'Not your email?', otherAccount: 'Sign in with another account',
      backLogin: 'Back to sign in', openLink: 'Open the verification link', simulated: 'Simulated',
      themeDark: 'Switch to dark mode', themeLight: 'Switch to light mode', langGroup: 'Interface language',
      demoTitle: 'Quick demo', demoOk: 'Successful send', demoBad: 'Rate limited', demoLabel: 'Prototype quick-demo ribbon',
      rights: '© 2026 FirOb · All rights reserved', screens: 'Screen map',
    },
  };

  /* اختصارات لفتح صندوق البريد حسب نطاق البريد (تحسين للتجربة فقط) */
  const MAIL_APPS = [
    { re: /^(gmail|googlemail)\.com$/i,                     name: 'Gmail',   url: 'https://mail.google.com/mail/u/0/#search/from%3Afirob' },
    { re: /^(outlook|hotmail|live|msn)\.[a-z.]+$/i,          name: 'Outlook', url: 'https://outlook.live.com/mail/0/' },
    { re: /^(yahoo|ymail)\.[a-z.]+$/i,                       name: 'Yahoo',   url: 'https://mail.yahoo.com/' },
    { re: /^(icloud|me|mac)\.com$/i,                         name: 'iCloud',  url: 'https://www.icloud.com/mail' },
  ];

  const COOLDOWN_KEY = 'firob-verify-cooldown-until';

  function app() {
    return {
      /* --- الحالة --- */
      lang: (window.FIROB && FIROB.locale) || document.documentElement.lang || 'ar',
      dark: document.documentElement.classList.contains('dark'),
      email: 'user@example.com',          // Blade: {{ auth()->user()->email }}
      busy: false, alert: '', alertTimer: null,
      cooldown: 0, cooldownTotal: 60, cooldownUntil: 0, cooldownTimer: null, COOLDOWN: 60,
      srMsg: '', pulse: 0,

      /* --- شبكة العناصر التعليمية الزخرفية --- */
      tone: { m: 'bg-white/10', l: 'bg-white/[.06]', d: 'bg-primary-900/30', a: 'bg-accent-500/80', '-': '' },
      cells: [
        'm','l:play','-','a:check','d','-',
        '-','m','d:mail','-','l','-',
        'd:book','-','m','-','a:send','-',
        '-','d','-','l:folder','-','m',
        'm','-','d','-','l:code','-',
        '-','d','-','m','-','l',
      ],

      /* --- الترجمة والثيم --- */
      t(k, vars) {
        let s = (I18N[this.lang] && I18N[this.lang][k]) || I18N.ar[k] || k;
        if (vars) Object.keys(vars).forEach(n => { s = s.replace('{' + n + '}', vars[n]); });
        return s;
      },
      init() {
        this.$watch('lang', () => this.applyLang()); this.applyLang(); this.syncMeta();
        try {
          const mq = window.matchMedia('(prefers-color-scheme: dark)');
          mq.addEventListener?.('change', (e) => {
            let saved = null; try { saved = localStorage.getItem('firob-theme'); } catch (_) {}
            if (!saved) this.setTheme(e.matches, false);
          });
        } catch (_) {}

        /* استئناف العدّاد بعد تحديث الصفحة (لا يُعاد ضبطه بالضغط على F5) */
        let saved = null; try { saved = JSON.parse(sessionStorage.getItem(COOLDOWN_KEY) || 'null'); } catch (_) {}
        if (saved && saved.until > Date.now()) this.startCooldown(Math.ceil((saved.until - Date.now()) / 1000), saved.until, saved.total);

        /* تصحيح العدّاد عند العودة إلى التبويب (المتصفحات تُبطئ المؤقتات في الخلفية) */
        document.addEventListener('visibilitychange', () => { if (!document.hidden) this.tick(); });

        /* Laravel: @if (session('status') === 'verification-link-sent') → this.afterSent() @endif */
      },
      applyLang() {
        const h = document.documentElement;
        h.lang = this.lang; h.dir = this.lang === 'ar' ? 'rtl' : 'ltr';
        if (window.FIROB && typeof FIROB.setLocale === 'function') FIROB.setLocale(this.lang);   /* يثبّت اللغة للصفحة التالية */
        document.title = this.t('title') + ' — FirOb';
      },
      setTheme(isDark, persist = true) {
        document.body.classList.add('theme-anim');
        this.dark = isDark;
        document.documentElement.classList.toggle('dark', isDark);
        if (persist) { try { localStorage.setItem('firob-theme', isDark ? 'dark' : 'light'); } catch (e) {} }
        this.syncMeta();
        clearTimeout(this._themeT); this._themeT = setTimeout(() => document.body.classList.remove('theme-anim'), 350);
      },
      toggleTheme() { this.setTheme(!this.dark); },
      syncMeta() { document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7'); },

      /* --- اختصار صندوق البريد --- */
      get mailApp() {
        const domain = (this.email.split('@')[1] || '').trim();
        return MAIL_APPS.find(m => m.re.test(domain)) || null;
      },

      /* --- الإشعار --- */
      notify(type, ms = 6000) {
        this.alert = type; clearTimeout(this.alertTimer);
        if (ms) this.alertTimer = setTimeout(() => this.alert = '', ms);
      },
      dismiss() { this.alert = ''; clearTimeout(this.alertTimer); },

      /* --- العدّاد التنازلي (مبني على وقت انتهاء ثابت لا على عدد النبضات) --- */
      get countdown() {
        return String(Math.floor(this.cooldown / 60)).padStart(2, '0') + ':' + String(this.cooldown % 60).padStart(2, '0');
      },
      get cooldownPct() { return this.cooldownTotal ? (this.cooldown / this.cooldownTotal) * 100 : 0; },
      startCooldown(sec, until, total) {
        this.cooldownTotal = total || sec;
        this.cooldownUntil = until || (Date.now() + sec * 1000);
        try { sessionStorage.setItem(COOLDOWN_KEY, JSON.stringify({ until: this.cooldownUntil, total: this.cooldownTotal })); } catch (_) {}
        clearInterval(this.cooldownTimer);
        this.srMsg = this.t('waitSr', { s: sec });
        this.tick();
        this.cooldownTimer = setInterval(() => this.tick(), 250);
      },
      tick() {
        if (!this.cooldownUntil) return;
        const left = Math.max(0, Math.ceil((this.cooldownUntil - Date.now()) / 1000));
        this.cooldown = left;
        if (left === 0) {
          clearInterval(this.cooldownTimer); this.cooldownUntil = 0;
          try { sessionStorage.removeItem(COOLDOWN_KEY); } catch (_) {}
          this.srMsg = this.t('readySr');   /* يُعلَن مرة واحدة لقارئ الشاشة */
        }
      },
      resetCooldown() {
        clearInterval(this.cooldownTimer); this.cooldown = 0; this.cooldownUntil = 0;
        try { sessionStorage.removeItem(COOLDOWN_KEY); } catch (_) {}
      },
      afterSent() { this.notify('success'); this.pulse++; this.startCooldown(this.COOLDOWN); },

      /* --- إعادة الإرسال --- */
      async resend(force) {
        if (this.busy || this.cooldown > 0) return;
        this.dismiss(); this.busy = true;
        /* ---- التكامل مع Laravel ----
           Blade:    this.$refs.form.submit();   // POST route('verification.send') + @csrf
           Livewire: $wire.resendVerification()
           الـ Rate Limiting (throttle:6,1) يُفرض في الخادم فقط؛ العدّاد هنا تحسين للتجربة. */
        await new Promise(r => setTimeout(r, 1000));   // محاكاة للعرض فقط
        this.busy = false;
        if (force === 'bad') { this.notify('error', 8000); this.startCooldown(30); return; }
        this.afterSent();
      },
      demo(ok) { if (this.busy) return; this.resetCooldown(); this.resend(ok ? 'ok' : 'bad'); },
    };
  }
</script>
</head>
