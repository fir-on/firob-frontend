<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض الوضع الفاتح) -->
<script>
  (function () {
    var d = false;
    try {
      var s = localStorage.getItem('firob-theme');
      d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) {
      d = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    document.documentElement.classList.toggle('dark', d);
    var m = document.getElementById('theme-color');
    if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ①-ج تطبيق اللغة والاتجاه قبل الرسم (يمنع قفزة RTL → LTR) -->
<script>
  (function () {
    var l = (window.FIROB && FIROB.locale) || 'ar';
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  })();
</script>

      brandTag: 'Your smart learning repository',
      heroTitle: 'An extra layer of protection for your account and institution.',
      hero1: 'A one-time code is required on every new-device sign-in',
      hero2: 'Codes expire within minutes to prevent reuse',
      hero3: 'Emergency recovery codes restore access if you lose your device',
      subOtp: 'Enter the 6-digit code sent to your email or shown in your authenticator app.',
      subRec: 'Enter one of the recovery codes you saved when enabling two-step verification.',
      sentTo: 'Sent to', tabOtp: 'Verification code', tabRec: 'Recovery code', tabsLabel: 'Verification method',
      otpLabel: 'Verification code', digit: 'Digit', of: 'of', pasteHint: 'You can paste the whole code at once.',
      recLabel: 'Recovery code', recHint: 'Each recovery code works only once and is then revoked.',
      trust: 'Trust this device for 30 days', trustHint: 'Don’t enable this on a shared or public device.',
      verify: 'Verify & continue', busy: 'Verifying…', verified: 'Verified',
      noCode: "Didn't get the code?", resend: 'Resend code', resendIn: 'Resend in', resending: 'Sending…',
      waitSr: 'You can request a new code in {s} seconds.', readySr: 'You can now request a new code.',
      back: 'Back to sign in', lostDevice: 'Lost your device? Use a recovery code', haveDevice: 'Have your device? Use a verification code',
      otpReq: 'Please enter all 6 digits.', recReq: 'Recovery code is required.', recFmt: 'Invalid recovery code format.',
      attemptsLeft: 'Attempts left:',
      errOtp: 'The code is incorrect or has expired. Please try again.',
      errRec: 'The recovery code is incorrect or has already been used.',
      lockedTitle: 'Attempts temporarily blocked',
      locked: 'Too many attempts. Request a new code or go back to sign in.',
      success: 'Verified successfully. Redirecting to your dashboard…',
      resent: 'A new code has been sent to your email.', dismiss: 'Dismiss notification',
      themeDark: 'Switch to dark mode', themeLight: 'Switch to light mode', langGroup: 'Interface language',
      demoTitle: 'Quick demo', demoOk: 'Valid code', demoBad: 'Wrong code', demoResend: 'Skip timer', demoLabel: 'Prototype quick-demo ribbon',
      rights: '© 2026 FirOb · All rights reserved', screens: 'Screen map',
    },
  };

  const LEN = 6;
  const MAX_ATTEMPTS = 5;
  const COOLDOWN = 60;
  const DEMO_OTP = '123456';
  const STORE_KEY = 'firob-2fa-state';

  /* تحويل الأرقام العربية/الفارسية إلى لاتينية */
  const toLatin = (s) => String(s || '')
    .replace(/[٠-٩]/g, (d) => d.charCodeAt(0) - 0x0660)
    .replace(/[۰-۹]/g, (d) => d.charCodeAt(0) - 0x06F0);

  function app() {
    return {
      /* --- الحالة --- */
      lang: (window.FIROB && FIROB.locale) || document.documentElement.lang || 'ar',
      dark: document.documentElement.classList.contains('dark'),
      mode: 'otp',                          // 'otp' | 'recovery'
      digits: Array(LEN).fill(''),
      recovery: '',
      trust: false,
      busy: false, verified: false, shaking: false,
      error: '', attempts: MAX_ATTEMPTS,
      cooldown: 0, cooldownUntil: 0, resending: false, timer: null,
      alert: '', alertTimer: null, srMsg: '',
      maskedEmail: 't•••••r@school.edu',    // Blade: يُمرَّر مُقنّعًا من الخادم

      /* --- شبكة الزخرفة --- */
      tone: { m: 'bg-white/10', l: 'bg-white/[.06]', d: 'bg-primary-900/30', a: 'bg-accent-500/80', '-': '' },
      cells: [
        'm','l:key','-','a:check','d','-',
        '-','m','d:lock','-','l','-',
        'd:shield-halved','-','m','-','a:fingerprint','-',
        '-','d','-','l:envelope','-','m',
        'm','-','d','-','l:mobile-screen','-',
        '-','d','-','m','-','l',
      ],

      /* --- مشتقات --- */
      get code() { return this.digits.join(''); },
      get complete() { return this.digits.every((d) => d !== ''); },
      get locked() { return this.attempts <= 0; },
      get mmss() {
        const m = Math.floor(this.cooldown / 60), s = this.cooldown % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      },
      get showAttempts() { return this.attempts < MAX_ATTEMPTS && !this.verified && !this.locked; },

      /* --- الترجمة والثيم --- */
      t(k, vars) {
        let s = (I18N[this.lang] && I18N[this.lang][k]) || I18N.ar[k] || k;
        if (vars) Object.keys(vars).forEach(n => { s = s.replace('{' + n + '}', vars[n]); });
        return s;
      },
      init() {
        this.$watch('lang', () => this.applyLang());
        this.$watch('mode', () => this.applyLang());
        this.$watch('attempts', () => this.persist());
        this.applyLang(); this.syncMeta();
        try {
          const mq = window.matchMedia('(prefers-color-scheme: dark)');
          mq.addEventListener?.('change', (e) => {
            let saved = null; try { saved = localStorage.getItem('firob-theme'); } catch (_) {}
            if (!saved) this.setTheme(e.matches, false);
          });
        } catch (_) {}

        /* استئناف العدّاد والمحاولات بعد تحديث الصفحة (الخادم هو المرجع النهائي) */
        let s = null; try { s = JSON.parse(sessionStorage.getItem(STORE_KEY) || 'null'); } catch (_) {}
        if (s) {
          if (typeof s.attempts === 'number') this.attempts = s.attempts;
          if (this.locked) this.error = 'locked';
          if (s.until > Date.now()) this.startCooldown(s.until);
        } else {
          this.startCooldown();   /* أول زيارة: الرمز أُرسل للتو */
        }
        document.addEventListener('visibilitychange', () => { if (!document.hidden) this.tick(); });

        if (!this.locked) this.$nextTick(() => this.focusBox(0, true));
      },
      persist() {
        try { sessionStorage.setItem(STORE_KEY, JSON.stringify({ until: this.cooldownUntil, attempts: this.attempts })); } catch (_) {}
      },
      applyLang() {
        const h = document.documentElement;
        h.lang = this.lang; h.dir = this.lang === 'ar' ? 'rtl' : 'ltr';
        if (window.FIROB && typeof FIROB.setLocale === 'function') FIROB.setLocale(this.lang);   /* يثبّت اللغة للصفحة التالية */
        document.title = this.t(this.mode === 'otp' ? 'titleOtp' : 'titleRec') + ' — FirOb';
      },
      setTheme(isDark, persist = true) {
        document.body.classList.add('theme-anim');
        this.dark = isDark;
        document.documentElement.classList.toggle('dark', isDark);
        if (persist) { try { localStorage.setItem('firob-theme', isDark ? 'dark' : 'light'); } catch (e) {} }
        this.syncMeta();
        clearTimeout(this._themeT); this._themeT = setTimeout(() => document.body.classList.remove('theme-anim'), 350);
      },
      toggleTheme() { this.setTheme(!this.dark); },
      syncMeta() { document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7'); },

      /* --- التبويبات (ARIA Tabs: تفعيل تلقائي + أسهم + Home/End) --- */
      setMode(m, focusTab = false) {
        if (this.mode === m) return;
        this.mode = m; if (!this.locked) this.error = '';
        this.$nextTick(() => {
          if (focusTab) { document.getElementById('tab-' + m)?.focus(); return; }
          m === 'otp' ? this.focusBox(this.firstEmpty()) : this.$refs.recovery?.focus();
        });
      },
      onTabKey(e) {
        const order = ['otp', 'recovery'];
        const rtl = document.documentElement.dir === 'rtl';
        let i = order.indexOf(this.mode);
        if (e.key === 'ArrowRight') i = rtl ? i - 1 : i + 1;
        else if (e.key === 'ArrowLeft') i = rtl ? i + 1 : i - 1;
        else if (e.key === 'Home') i = 0;
        else if (e.key === 'End') i = order.length - 1;
        else return;
        e.preventDefault();
        this.setMode(order[(i + order.length) % order.length], true);
      },

      /* --- حقول OTP --- */
      boxes() { return this.$refs.otp ? this.$refs.otp.querySelectorAll('input') : []; },
      focusBox(i, soft = false) {
        /* soft: لا نفتح لوحة مفاتيح الجوال تلقائيًا عند التحميل إلا على أجهزة المؤشر الدقيق */
        if (soft && !(window.matchMedia && matchMedia('(pointer: fine)').matches)) return;
        const b = this.boxes()[Math.max(0, Math.min(LEN - 1, i))];
        if (b) { b.focus({ preventScroll: soft }); b.select(); }
      },
      firstEmpty() { const i = this.digits.findIndex((d) => d === ''); return i === -1 ? LEN - 1 : i; },
      fill(start, raw) {
        const all = toLatin(raw).replace(/\D/g, '');
        /* لصق رمز كامل من أي خانة: نبدأ من الأولى */
        if (all.length >= LEN) start = 0;
        const chars = all.slice(0, LEN - start).split('');
        if (!chars.length) return;
        chars.forEach((c, k) => { this.digits[start + k] = c; });
        this.error = '';
        const next = start + chars.length;
        this.$nextTick(() => {
          if (this.complete) { this.boxes()[LEN - 1]?.blur(); this.submit(); }
          else this.focusBox(Math.min(next, LEN - 1));
        });
      },
      onInput(i, e) {
        const v = toLatin(e.target.value).replace(/\D/g, '');
        if (!v) {
          this.digits[i] = ''; e.target.value = '';
          /* لوحات أندرويد لا تُطلق keydown لـ Backspace (key = Unidentified) — نعالجها هنا */
          if (e.inputType === 'deleteContentBackward' && i > 0) this.focusBox(i - 1);
          return;
        }
        if (v.length > 1) { e.target.value = this.digits[i]; this.fill(i, v); return; }   // لصق/تعبئة تلقائية (one-time-code)
        this.digits[i] = v; e.target.value = v; this.error = '';
        if (i < LEN - 1) this.focusBox(i + 1);
        else if (this.complete) this.$nextTick(() => { e.target.blur(); this.submit(); });
      },
      onKeydown(i, e) {
        switch (e.key) {
          case 'Backspace':
            e.preventDefault();
            if (this.digits[i]) { this.digits[i] = ''; }
            else if (i > 0) { this.digits[i - 1] = ''; this.focusBox(i - 1); }
            this.error = '';
            break;
          case 'Delete':
            e.preventDefault(); this.digits[i] = ''; this.error = ''; break;
          case 'ArrowLeft':  e.preventDefault(); this.focusBox(i - 1); break;   // الحاوية LTR دائمًا
          case 'ArrowRight': e.preventDefault(); this.focusBox(i + 1); break;
          case 'Home': e.preventDefault(); this.focusBox(0); break;
          case 'End':  e.preventDefault(); this.focusBox(LEN - 1); break;
          case 'Enter': e.preventDefault(); this.submit(); break;
          default:
            if (e.key.length === 1 && !/[0-9٠-٩۰-۹]/.test(e.key) && !e.ctrlKey && !e.metaKey) e.preventDefault();
        }
      },
      onPaste(i, e) {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text');
        this.fill(i, text);
      },
      clearOtp() { this.digits = Array(LEN).fill(''); },

      /* --- رمز الاسترداد: تنظيف + إدراج الشرطة تلقائيًا (صيغة Fortify: 10-10) --- */
      onRecoveryInput() {
        let r = this.recovery.replace(/\s+/g, '').replace(/[^A-Za-z0-9-]/g, '');
        if (!r.includes('-') && r.length > 10) r = r.slice(0, 10) + '-' + r.slice(10);
        this.recovery = r.replace(/-{2,}/g, '-').slice(0, 21);
        if (!this.locked) this.error = '';
      },

      /* --- التحقق --- */
      validate() {
        if (this.mode === 'otp') {
          if (!this.complete) { this.error = 'otpReq'; return false; }
        } else {
          const r = this.recovery.trim();
          if (!r) { this.error = 'recReq'; return false; }
          if (!/^[A-Za-z0-9]{8,10}-?[A-Za-z0-9]{8,10}$/.test(r)) { this.error = 'recFmt'; return false; }
        }
        return true;
      },
      triggerShake() {
        this.shaking = false;
        this.$nextTick(() => { this.shaking = true; setTimeout(() => this.shaking = false, 450); });
        try { navigator.vibrate && navigator.vibrate(60); } catch (_) {}   /* تغذية لمسية خفيفة على الجوال */
      },
      notify(type, ms = 5000) {
        this.alert = type; clearTimeout(this.alertTimer);
        if (ms) this.alertTimer = setTimeout(() => this.alert = '', ms);
      },
      dismiss() { clearTimeout(this.alertTimer); this.alert = ''; },
      go(page, delay) {
        if (window.FIROB && typeof FIROB.go === 'function') return FIROB.go(page, delay);
        setTimeout(() => { window.location.href = '../' + page + '.html'; }, delay || 0);
      },
      async submit(force) {
        if (this.busy || this.verified || this.locked) return;
        this.alert = '';
        if (!this.validate()) {
          this.triggerShake();
          this.$nextTick(() => this.mode === 'otp' ? this.focusBox(this.firstEmpty()) : this.$refs.recovery?.focus());
          return;
        }
        this.busy = true;
        /* ---- التكامل مع Laravel (Fortify) ----
           Blade:    POST /two-factor-challenge  { code } أو { recovery_code } + @csrf
           Livewire: $wire.verify({ code, recovery_code, trust })
           التحقق الفعلي والـ Rate Limiting في الخادم فقط. */
        await new Promise((r) => setTimeout(r, 900));   // محاكاة للعرض فقط
        this.busy = false;

        const ok = force ? force === 'ok'
          : this.mode === 'otp' ? this.code === DEMO_OTP : true;

        if (ok) {
          this.verified = true; this.error = '';
          try { sessionStorage.removeItem(STORE_KEY); } catch (_) {}
          this.notify('success', 0);
          this.go('dashboard', 1000);   // رسالة النجاح تقول «جارٍ تحويلك إلى لوحة التحكم…»
        } else {
          this.attempts = Math.max(0, this.attempts - 1);
          this.error = this.locked ? 'locked' : (this.mode === 'otp' ? 'errOtp' : 'errRec');
          this.notify('error', 7000);
          this.triggerShake();
          if (this.mode === 'otp') { this.clearOtp(); if (!this.locked) this.$nextTick(() => this.focusBox(0)); }
          else if (!this.locked) this.$nextTick(() => this.$refs.recovery?.select());
          else this.$nextTick(() => this.$refs.lockCard?.focus());
        }
      },

      /* --- إعادة الإرسال (عدّاد مبني على وقت انتهاء ثابت) --- */
      startCooldown(until) {
        clearInterval(this.timer);
        this.cooldownUntil = until || (Date.now() + COOLDOWN * 1000);
        this.persist();
        this.srMsg = this.t('waitSr', { s: Math.ceil((this.cooldownUntil - Date.now()) / 1000) });
        this.tick();
        this.timer = setInterval(() => this.tick(), 250);
      },
      tick() {
        if (!this.cooldownUntil) return;
        const left = Math.max(0, Math.ceil((this.cooldownUntil - Date.now()) / 1000));
        this.cooldown = left;
        if (left === 0) { clearInterval(this.timer); this.cooldownUntil = 0; this.persist(); this.srMsg = this.t('readySr'); }
      },
      async resend() {
        if (this.cooldown > 0 || this.resending) return;
        this.resending = true;
        await new Promise((r) => setTimeout(r, 800));   // محاكاة للعرض فقط
        this.resending = false;
        this.attempts = MAX_ATTEMPTS; this.error = ''; this.verified = false;
        this.clearOtp(); this.startCooldown();
        this.notify('info');
        if (this.mode !== 'otp') this.setMode('otp');
        else this.$nextTick(() => this.focusBox(0));
      },

      /* --- اختصارات العرض --- */
      demo(kind) {
        if (this.busy || this.resending) return;
        if (kind === 'resend') { clearInterval(this.timer); this.cooldown = 0; this.cooldownUntil = 0; this.persist(); return; }
        const ok = kind === 'ok';
        if (this.locked) { this.attempts = MAX_ATTEMPTS; this.error = ''; }
        this.verified = false;
        if (this.mode === 'otp') this.digits = (ok ? DEMO_OTP : '987654').split('');
        else this.recovery = ok ? 'a8Kd2mQx9P-7rTz4LwB1n' : 'wrong00000-code000000';
        this.submit(ok ? 'ok' : 'bad');
      },
    };
  }
</script>
</head>

<body x-data="app()">

<a href="#verify-form" class="sr-only focus:not-sr-only focus:fixed focus:start-3 focus:top-3 focus:z-[70] focus:rounded-lg focus:bg-accent-500 focus:px-4 focus:py-2 focus:font-bold focus:text-onaccent" x-text="t('skip')">تخطّي إلى نموذج التحقق</a>

<!-- إعلانات العدّاد لقارئ الشاشة (مرة عند البدء ومرة عند الانتهاء، لا كل ثانية) -->
<p class="sr-only" role="status" aria-live="polite" x-text="srMsg"></p>

<!-- إشعار عائم: منطقة حيّة ثابتة في DOM، ومحتواها يظهر فوق الصفحة دون دفعها -->
<div class="pointer-events-none fixed inset-x-0 z-[60] flex justify-center px-4" style="top: calc(1rem + var(--sat));" aria-live="polite" aria-atomic="true">
  <div x-show="alert" x-cloak
       x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="-translate-y-3 opacity-0" x-transition:enter-end="translate-y-0 opacity-100"
       x-transition:leave="transition duration-150 ease-in" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
       class="pointer-events-auto w-full max-w-md rounded-xl bg-card shadow-pop">
    <div class="alert" :class="{ 'alert-error': alert === 'error', 'alert-success': alert === 'success', 'alert-info': alert === 'info' }"
         :role="alert === 'error' ? 'alert' : 'status'">
      <i class="fa-solid mt-0.5 text-base" :class="{ 'fa-circle-xmark': alert === 'error', 'fa-circle-check': alert === 'success', 'fa-paper-plane': alert === 'info' }" aria-hidden="true"></i>
      <p class="flex-1" x-text="!alert ? '' : alert === 'error' ? t(error || 'errOtp') : alert === 'success' ? t('success') : t('resent')"></p>
      <button type="button" class="-m-1.5 grid h-8 w-8 shrink-0 cursor-pointer place-items-center rounded-lg opacity-70 transition hover:opacity-100 focus-visible:outline-none focus-visible:shadow-[var(--ring)]"
              @click="dismiss()" :aria-label="t('dismiss')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>

<div class="app-h flex overflow-hidden">

  <!-- ╔══════════ الجانب الأول: الهوية البصرية — يظهر من التابلت (md) فما فوق ══════════╗ -->
  <aside class="relative hidden h-full overflow-hidden bg-gradient-to-br from-primary-500 via-primary-700 to-primary-900 text-white md:flex md:w-[42%] lg:w-1/2 xl:w-[46%] dark:from-[#0A4356] dark:via-[#062F3B] dark:to-[#031820]"
         style="padding-top: var(--sat); padding-bottom: var(--sab);">

    <div aria-hidden="true" class="absolute inset-0 grid grid-cols-6 grid-rows-6 gap-2 p-4 lg:gap-3 lg:p-6">
      <template x-for="(c, i) in cells" :key="i">
        <div class="grid place-items-center rounded-2xl motion-safe:animate-[breath_7s_ease-in-out_infinite]"
             :class="tone[c.split(':')[0]]" :style="{ animationDelay: ((i * 7) % 11) * 0.5 + 's' }">
          <template x-if="c.includes(':')">
            <i class="fa-solid text-lg" :class="['fa-' + c.split(':')[1], c.startsWith('a') ? 'text-onaccent' : 'text-white/70']"></i>
          </template>
        </div>
      </template>
    </div>
    <div aria-hidden="true" class="absolute -bottom-24 -start-24 h-80 w-80 rounded-full bg-accent-500/15 blur-3xl"></div>
    <div aria-hidden="true" class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(7,60,76,.78)_0%,rgba(7,60,76,.5)_52%,transparent_100%)]"></div>

    <div class="no-scrollbar relative z-10 m-auto flex max-h-full w-full flex-col items-center overflow-y-auto px-[clamp(1.5rem,4vw,4rem)] py-6 text-center short:py-4">

      <!-- الشعار: أبعاد صريحة (لا CLS) + أولوية تحميل عالية (غالبًا هو LCP على سطح المكتب) -->
      <div class="inline-flex items-center rounded-xl bg-white p-0 shadow-pop">
        <img src="../asset/images/firob-logo.png" alt="FirOb" width="352" height="96" fetchpriority="high" decoding="async"
             class="mx-1 -my-2.5 block h-[clamp(3.25rem,9vh,6rem)] w-auto max-w-[min(22rem,80%)] object-contain">
      </div>
      <p class="mt-3 text-lead font-bold text-primary-50 short:mt-2" x-text="t('brandTag')"></p>

      <!-- أيقونة الدرع المركزية -->
      <div class="relative mt-[clamp(1rem,3.4vh,2rem)] grid h-[clamp(4.5rem,11vh,6.5rem)] w-[clamp(4.5rem,11vh,6.5rem)] place-items-center rounded-3xl border border-white/25 bg-white/10 backdrop-blur-md short:hidden" aria-hidden="true">
        <span class="absolute inset-0 rounded-3xl bg-accent-500/20 motion-safe:animate-ping" style="animation-duration:3s"></span>
        <i class="fa-solid fa-shield-halved text-[clamp(2rem,5vh,3rem)] text-accent-500"></i>
      </div>

      <h2 class="mt-[clamp(1rem,3vh,1.75rem)] max-w-lg text-balance text-display font-extrabold" x-text="t('heroTitle')"></h2>

      <ul class="mt-[clamp(1rem,3.4vh,2.25rem)] w-full max-w-md space-y-[clamp(.5rem,1.4vh,.75rem)] text-start text-label xshort:hidden">
        <li class="feature">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-white/15 text-accent-500 short:h-9 short:w-9" aria-hidden="true"><i class="fa-solid fa-mobile-screen-button"></i></span>
          <span class="font-medium" x-text="t('hero1')"></span>
        </li>
        <li class="feature">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-white/15 text-accent-500 short:h-9 short:w-9" aria-hidden="true"><i class="fa-solid fa-stopwatch"></i></span>
          <span class="font-medium" x-text="t('hero2')"></span>
        </li>
        <li class="feature">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-white/15 text-accent-500 short:h-9 short:w-9" aria-hidden="true"><i class="fa-solid fa-key"></i></span>
          <span class="font-medium" x-text="t('hero3')"></span>
        </li>
      </ul>
    </div>
  </aside>

  <!-- ╔══════════ الجانب الثاني: نموذج التحقق ══════════╗ -->
  <div class="safe-x flex h-full min-w-0 flex-1 flex-col bg-[radial-gradient(48rem_22rem_at_50%_0%,rgba(14,128,161,.13),transparent)]">

    <!-- شريط علوي (يحترم النوتش) -->
    <header class="flex shrink-0 items-center justify-between gap-3 px-4 pb-2 sm:px-8 lg:px-10" style="padding-top: calc(.5rem + var(--sat));">
      <div class="flex min-w-0 items-center gap-2.5 md:hidden">
        <span class="inline-flex items-center rounded-lg bg-white p-1 shadow-sm">
          <img src="../asset/images/firob-logo.png" alt="FirOb" width="112" height="28" decoding="async" class="block h-7 w-auto max-w-[8rem] object-contain">
        </span>
      </div>
      <span class="hidden md:block" aria-hidden="true"></span>

      <div class="flex shrink-0 items-center gap-2">
        <button type="button" class="tool" @click="toggleTheme()" :aria-pressed="dark"
                :aria-label="dark ? t('themeLight') : t('themeDark')" :title="dark ? t('themeLight') : t('themeDark')">
          <i class="fa-regular fa-moon" x-show="!dark" aria-hidden="true"></i>
          <i class="fa-regular fa-sun" x-show="dark" x-cloak aria-hidden="true"></i>
        </button>

        <div class="flex h-10 items-center rounded-xl border border-line-strong bg-field p-1" role="group" :aria-label="t('langGroup')">
          <button type="button" lang="ar" class="h-full cursor-pointer rounded-lg px-3.5 text-caption font-bold transition-colors focus-visible:outline-none focus-visible:shadow-[var(--ring)]"
                  :class="lang === 'ar' ? 'bg-primary-500 text-white' : 'text-muted hover:bg-soft'" :aria-pressed="lang === 'ar'" @click="lang = 'ar'">عربي</button>
          <button type="button" lang="en" class="h-full cursor-pointer rounded-lg px-3.5 text-caption font-bold transition-colors focus-visible:outline-none focus-visible:shadow-[var(--ring)]"
                  :class="lang === 'en' ? 'bg-primary-500 text-white' : 'text-muted hover:bg-soft'" :aria-pressed="lang === 'en'" @click="lang = 'en'">EN</button>
        </div>
      </div>
    </header>

    <!-- المحتوى: يتمركز تلقائيًا؛ وإن ضاق الارتفاع يتمرّر داخليًا مع حجز مساحة لشريط التجربة ومسافة الأمان -->
    <main id="main" class="no-scrollbar flex min-h-0 flex-1 overflow-y-auto overflow-x-hidden px-4 pt-3 sm:px-8 short:pt-1"
          style="padding-bottom: calc(var(--ribbon-h) + var(--sab));">
      <div class="m-auto flex w-full flex-col items-center">
      <section class="card w-full max-w-[28rem] p-[clamp(1.25rem,3vh,2.25rem)] max-[359px]:rounded-2xl max-[359px]:p-4 xshort:p-4" aria-labelledby="verify-title" aria-describedby="verify-sub">

        <!-- الترويسة -->
        <header class="mb-[clamp(.75rem,2.2vh,1.25rem)] xshort:mb-2">
          <div class="flex items-center gap-3">
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl border text-lg transition-colors short:h-9 short:w-9"
                  :class="verified ? 'border-success-500/40 bg-success-500/10 text-ok' : 'border-line bg-soft text-brand'" aria-hidden="true">
              <i class="fa-solid" :class="verified ? 'fa-circle-check' : (mode === 'otp' ? 'fa-shield-halved' : 'fa-key')"></i>
            </span>
            <h1 id="verify-title" class="text-h1 font-extrabold text-ink" x-text="t(mode === 'otp' ? 'titleOtp' : 'titleRec')">التحقق بخطوتين</h1>
          </div>
          <p id="verify-sub" class="mt-2 text-caption text-muted xshort:hidden" x-text="t(mode === 'otp' ? 'subOtp' : 'subRec')"></p>
          <p x-show="mode === 'otp'" class="mt-2 inline-flex max-w-full items-center gap-2 rounded-lg border border-line bg-soft/60 px-2.5 py-1 text-caption text-muted short:hidden">
            <i class="fa-regular fa-envelope text-brand" aria-hidden="true"></i>
            <span x-text="t('sentTo')"></span>
            <bdi dir="ltr" class="truncate font-bold text-ink" x-text="maskedEmail"></bdi>
          </p>
        </header>

        <!-- مبدّل الوضع (ARIA Tabs كاملة: roving tabindex + أسهم + Home/End) -->
        <div class="seg mb-[clamp(.75rem,2.2vh,1.25rem)]" role="tablist" :aria-label="t('tabsLabel')" @keydown="onTabKey($event)">
          <span class="seg-thumb" aria-hidden="true" :style="mode === 'otp' ? 'inset-inline-start:.25rem' : 'inset-inline-start:50%'"></span>
          <button type="button" role="tab" id="tab-otp" class="seg-btn" :aria-selected="mode === 'otp'" aria-controls="panel-otp"
                  :tabindex="mode === 'otp' ? 0 : -1" @click="setMode('otp')">
            <i class="fa-solid fa-mobile-screen-button" aria-hidden="true"></i><span class="truncate" x-text="t('tabOtp')"></span>
          </button>
          <button type="button" role="tab" id="tab-recovery" class="seg-btn" :aria-selected="mode === 'recovery'" aria-controls="panel-rec"
                  :tabindex="mode === 'recovery' ? 0 : -1" @click="setMode('recovery')">
            <i class="fa-solid fa-life-ring" aria-hidden="true"></i><span class="truncate" x-text="t('tabRec')"></span>
          </button>
        </div>

        <!-- Laravel: action="{{ url('/two-factor-challenge') }}" + @csrf -->
        <form id="verify-form" method="POST" action="/two-factor-challenge" novalidate class="space-y-[clamp(.75rem,2vh,1.25rem)] short:space-y-3" :aria-busy="busy" @submit.prevent="submit()">

          <!-- ① لوحة OTP -->
          <div id="panel-otp" role="tabpanel" aria-labelledby="tab-otp" tabindex="-1" x-show="mode === 'otp'" x-transition.opacity.duration.200ms>
            <div class="mb-2 flex items-center justify-between gap-3">
              <span id="otp-label" class="label" x-text="t('otpLabel')"></span>
              <span x-show="showAttempts" x-cloak class="inline-flex items-center gap-1 text-caption font-bold" :class="attempts <= 2 ? 'text-danger' : 'text-muted'">
                <i class="fa-solid fa-shield" aria-hidden="true"></i><span x-text="t('attemptsLeft')"></span> <bdi class="tabular-nums" x-text="attempts"></bdi>
              </span>
            </div>

            <div x-ref="otp" dir="ltr" role="group" aria-labelledby="otp-label" :aria-describedby="error && !verified ? 'otp-err' : 'otp-hint'"
                 class="grid grid-cols-6 gap-[clamp(.375rem,1.6vw,.75rem)]" :class="shaking && mode === 'otp' && 'shake'">
              <template x-for="(d, i) in digits" :key="i">
                <input type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done"
                       :autocomplete="i === 0 ? 'one-time-code' : 'off'"
                       :name="'code[' + i + ']'"
                       class="otp"
                       :class="{ 'is-filled': d !== '' && !error && !verified, 'is-ok': verified }"
                       :value="d"
                       :disabled="busy || verified || locked"
                       :aria-invalid="!!error && !verified"
                       :aria-label="t('digit') + ' ' + (i + 1) + ' ' + t('of') + ' 6'"
                       @input="onInput(i, $event)"
                       @keydown="onKeydown(i, $event)"
                       @paste="onPaste(i, $event)"
                       @focus="$event.target.select()">
              </template>
            </div>
            <p id="otp-hint" class="hint xshort:hidden" x-show="!error"><i class="fa-regular fa-clipboard me-1" aria-hidden="true"></i><span x-text="t('pasteHint')"></span></p>
            <input type="hidden" name="code" :value="code">
          </div>

          <!-- ② لوحة رمز الاسترداد -->
          <div id="panel-rec" role="tabpanel" aria-labelledby="tab-recovery" tabindex="-1" x-show="mode === 'recovery'" x-cloak x-transition.opacity.duration.200ms>
            <div class="mb-1.5 flex items-center justify-between gap-3">
              <label class="label" for="recovery_code"><span x-text="t('recLabel')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
              <span x-show="showAttempts" x-cloak class="inline-flex items-center gap-1 text-caption font-bold" :class="attempts <= 2 ? 'text-danger' : 'text-muted'">
                <i class="fa-solid fa-shield" aria-hidden="true"></i><span x-text="t('attemptsLeft')"></span> <bdi class="tabular-nums" x-text="attempts"></bdi>
              </span>
            </div>
            <div class="fgroup" :class="shaking && mode === 'recovery' && 'shake'" :data-invalid="!!error && !verified">
              <i class="fa-solid fa-key text-muted" aria-hidden="true"></i>
              <input id="recovery_code" name="recovery_code" x-ref="recovery" type="text" dir="ltr"
                     autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" maxlength="21"
                     placeholder="abcd12efgh-ijkl34mnop"
                     class="fgroup-input tracking-wider" style="font-family:'Manrope',ui-monospace,monospace"
                     x-model="recovery" @input="onRecoveryInput()"
                     :disabled="busy || verified || locked"
                     :aria-invalid="!!error && !verified" :aria-describedby="error && !verified ? 'otp-err' : 'rec-hint'">
            </div>
            <p id="rec-hint" class="hint short:hidden" x-show="!error"><i class="fa-solid fa-circle-info me-1" aria-hidden="true"></i><span x-text="t('recHint')"></span></p>
          </div>

          <!-- رسالة الخطأ المشتركة (تُقرأ عبر aria-describedby؛ الإعلان الفوري يتم من الإشعار العائم) -->
          <p id="otp-err" class="err !mt-2" x-show="error && !verified && !locked" x-cloak>
            <i class="fa-solid fa-circle-xmark mt-0.5" aria-hidden="true"></i>
            <span x-text="error ? t(error) : ''"></span>
          </p>

          <!-- حالة القفل: بطاقة واضحة بإجراءين بدل نص خطأ فقط -->
          <div x-show="locked" x-cloak x-ref="lockCard" tabindex="-1" role="alert"
               class="rounded-2xl border border-error-500/30 bg-error-500/10 p-4 focus:outline-none">
            <p class="flex items-center gap-2 text-label font-extrabold text-danger">
              <i class="fa-solid fa-lock" aria-hidden="true"></i><span x-text="t('lockedTitle')"></span>
            </p>
            <p class="mt-1 text-caption text-ink" x-text="t('locked')"></p>
            <div class="mt-3 grid grid-cols-1 gap-2 min-[400px]:grid-cols-2">
              <button type="button" class="btn btn-outline w-full !text-caption" @click="resend()" :disabled="cooldown > 0 || resending">
                <i class="fa-solid" :class="resending ? 'fa-circle-notch fa-spin' : (cooldown > 0 ? 'fa-hourglass-half' : 'fa-rotate-right')" aria-hidden="true"></i>
                <span x-show="resending" x-text="t('resending')"></span>
                <span x-show="!resending && cooldown > 0"><span x-text="t('resendIn')"></span> <bdi dir="ltr" class="tabular-nums" x-text="mmss"></bdi></span>
                <span x-show="!resending && cooldown === 0" x-text="t('resend')"></span>
              </button>
              <a href="login.html" class="btn btn-ghost w-full !text-caption">
                <i class="fa-solid fa-arrow-right ltr:rotate-180" aria-hidden="true"></i><span x-text="t('back')"></span>
              </a>
            </div>
          </div>

          <!-- الوثوق بالجهاز -->
          <div x-show="!locked">
            <label class="flex min-h-11 cursor-pointer select-none items-center gap-2.5 text-label font-medium">
              <input type="checkbox" name="trust_device" class="check" x-model="trust" :disabled="verified" aria-describedby="trust-hint">
              <span x-text="t('trust')"></span>
            </label>
            <p id="trust-hint" class="-mt-1 ps-[1.875rem] text-[0.8125rem] text-muted" x-show="trust" x-cloak x-transition.opacity x-text="t('trustHint')"></p>
          </div>

          <!-- زر التحقق -->
          <button type="submit" class="btn btn-lg w-full" x-show="!locked"
                  :class="[verified ? 'btn-success' : 'btn-accent', busy && 'is-loading']" :aria-busy="busy"
                  :disabled="busy || verified || locked">
            <i x-show="busy" x-cloak class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
            <i x-show="verified" x-cloak class="fa-solid fa-circle-check" aria-hidden="true"></i>
            <span x-text="busy ? t('busy') : (verified ? t('verified') : t('verify'))">تحقّق ومتابعة</span>
            <i x-show="!busy && !verified" class="fa-solid fa-arrow-left ltr:rotate-180" aria-hidden="true"></i>
          </button>
        </form>

        <!-- إعادة الإرسال -->
        <div x-show="mode === 'otp' && !locked && !verified" class="mt-[clamp(.75rem,2vh,1.25rem)] flex flex-wrap items-center justify-center gap-x-2 gap-y-1 text-label text-muted short:mt-2">
          <span x-text="t('noCode')"></span>
          <button type="button" class="link inline-flex min-h-11 items-center gap-1.5 !text-label" @click="resend()" :disabled="cooldown > 0 || resending">
            <i class="fa-solid" :class="resending ? 'fa-circle-notch fa-spin' : (cooldown > 0 ? 'fa-hourglass-half' : 'fa-rotate-right')" aria-hidden="true"></i>
            <span x-show="resending" x-cloak x-text="t('resending')"></span>
            <span x-show="!resending && cooldown > 0"><span x-text="t('resendIn')"></span> <bdi dir="ltr" class="tabular-nums" x-text="mmss"></bdi></span>
            <span x-show="!resending && cooldown === 0" x-cloak x-text="t('resend')"></span>
          </button>
        </div>

        <!-- روابط سريعة -->
        <div x-show="!verified" class="mt-[clamp(.75rem,2vh,1.25rem)] flex flex-col items-center gap-1 border-t border-line pt-[clamp(.75rem,2vh,1.25rem)] short:mt-2 short:pt-2">
          <button type="button" class="link inline-flex min-h-11 items-center gap-1.5 text-center" @click="setMode(mode === 'otp' ? 'recovery' : 'otp')">
            <i class="fa-solid" :class="mode === 'otp' ? 'fa-life-ring' : 'fa-mobile-screen-button'" aria-hidden="true"></i>
            <span x-text="t(mode === 'otp' ? 'lostDevice' : 'haveDevice')"></span>
          </button>
          <a href="login.html" class="btn btn-ghost !px-3 !py-1.5 text-caption" x-show="!locked">
            <i class="fa-solid fa-arrow-right ltr:rotate-180" aria-hidden="true"></i>
            <span x-text="t('back')"></span>
          </a>
        </div>
      </section>

      <!-- تذييل: داخل منطقة التمرير فلا يقتطع من ارتفاع البطاقة -->
      <footer class="mt-4 flex flex-wrap items-center justify-center gap-x-3 gap-y-2 px-4 py-2 text-center text-[0.8125rem] text-muted short:mt-2">
        <span x-text="t('rights')"></span>
        <a href="../index.html" class="pill inline-flex items-center gap-1 text-muted hover:bg-soft hover:text-ink">
          <i class="fa-solid fa-house text-[0.75rem]" aria-hidden="true"></i><span x-text="t('screens')"></span>
        </a>
      </footer>
      </div>
    </main>
  </div>
</div>

<!-- ========== شريط النموذج الأولي العائم (Prototype Ribbon) — معزول عن التذييل الإنتاجي، احذفه بالكامل قبل الإطلاق ========== -->
<div class="fixed z-50" style="bottom: calc(.75rem + var(--sab)); inset-inline-end: calc(.75rem + var(--sar)); max-width: calc(100vw - 1.5rem - var(--sal) - var(--sar));"
     role="region" :aria-label="t('demoLabel')">
  <div class="no-scrollbar flex items-center gap-1.5 overflow-x-auto rounded-full border border-dashed border-accent-500/70 bg-slate-900/90 p-1.5 shadow-pop backdrop-blur-md">
    <span class="flex shrink-0 items-center gap-1 rounded-full bg-accent-500 px-2.5 py-1 text-[0.6875rem] font-extrabold uppercase tracking-wide text-onaccent">
      <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
      <span class="hidden sm:inline" x-text="t('demoTitle')"></span>
    </span>
    <button type="button" class="pill min-h-9 shrink-0 whitespace-nowrap !border-white/20 !text-white hover:!bg-white/10" :disabled="busy" @click="demo('ok')" x-text="t('demoOk')"></button>
    <button type="button" class="pill min-h-9 shrink-0 whitespace-nowrap !border-red-400/60 !text-red-300 hover:!bg-red-500/15" :disabled="busy" @click="demo('bad')" x-text="t('demoBad')"></button>
    <button type="button" class="pill min-h-9 shrink-0 whitespace-nowrap !border-sky-300/50 !text-sky-200 hover:!bg-sky-400/15" :disabled="busy || cooldown === 0" @click="demo('resend')" x-text="t('demoResend')"></button>
    <bdi dir="ltr" class="shrink-0 rounded-md bg-white/10 px-1.5 font-bold text-white" style="font-family:'Manrope',monospace">123456</bdi>
  </div>
</div>

</body>
</html>
