<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>تفاصيل محاولة وتصحيح — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* إلغاء أيقونة التفريغ الأصلية لحقول type="search" */
    input[type="search"]::-webkit-search-decoration,
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-results-button,
    input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  {@apply bg-accent-500/20 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }
    .badge-warning { @apply bg-warning-500/15 text-warning-700 dark:text-warning-500; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-line-strong; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }
    .btn-ai      { @apply border border-accent-500/50 bg-accent-500/10 text-yellow-900 hover:bg-accent-500/20 dark:text-accent-500; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- النافذة المنبثقة / اللوحة الجانبية ---------- */
    .modal-panel { @apply relative flex max-h-[90dvh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }

    /* ---------- مؤشر صحة/خطأ الإجابة (AnswerIndicator) ---------- */
    .ans-indicator { @apply grid h-9 w-9 shrink-0 place-items-center rounded-full text-sm; }

    /* ---------- حقل الدرجة اليدوية (ScoreInput) ---------- */
    .score-input { @apply h-11 w-24 rounded-lg border border-line-strong bg-field px-3 text-center text-sm font-extrabold tabular-nums text-ink transition; }
    .score-input:hover { @apply border-primary-500; }
    .score-input:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .score-input[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .score-input:read-only, .field:read-only { @apply cursor-default bg-soft text-ink; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }

    /* ---------- [layout: full-height sidebar + bottom footer] ---------- */
    html, body { min-height: 100%; }
    body { margin: 0; }
    .app-col { min-height: 100vh; min-height: 100dvh; }
    @media (min-width: 1024px) {
      #sidebar { height: 100vh; height: 100dvh; }
      .app-col { margin-inline-start: 18rem; transition: margin-inline-start .3s ease; }
      .app-col.is-collapsed { margin-inline-start: 5rem; }
      .save-bar { inset-inline-start: 18rem; transition: inset-inline-start .3s ease; }
      .save-bar.is-collapsed { inset-inline-start: 5rem; }
    }
</style>

<!-- ⑥ Alpine.js (+ Focus لحصر التركيز داخل النوافذ المنبثقة + Collapse) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- ⑦ SweetAlert2 -->
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5"></script>
</head>

<body x-data="quizGradingManager()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch.focus(); return; } onKey($event)"
      @scroll.window="notifOpen = false" @resize.window="notifOpen = false"
      :class="{ 'overflow-hidden': mobileNav && mobile }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <span class="inline-flex min-w-0 flex-1 items-center gap-3" :class="!expanded && 'lg:flex-none lg:justify-center'">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </span>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-muted" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="item.live && expanded && pendingTotal"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent"
                        x-text="num(pendingTotal)"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="app-col flex min-w-0 flex-1 flex-col" :class="collapsed && 'is-collapsed'">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex"><bdi dir="ltr">Ctrl K</bdi></kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-haspopup="true" :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="notifText(n)"></p>
                      <p class="text-xs text-muted"><time :datetime="n.at" x-text="relTime(n.at)"></time></p>
                    </div>
                  </li>
                </template>
              </ul>
              <div class="border-t border-line p-2">
                <a href="../common/notifications.html" class="menu-item justify-center text-brand" @click="notifOpen = false">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  <span x-text="t('viewAllNotif')"></span>
                </a>
              </div>
            </div>
          </div>

          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" class="flex max-w-[14rem] items-center gap-2 rounded-xl p-1 transition hover:bg-soft focus-visible:ring-2 md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    aria-haspopup="menu" :aria-expanded="profileOpen.toString()" aria-controls="profile-menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true" x-text="L(teacher.initials)"></span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="L(teacher.name)"></span>
                <span class="block truncate text-xs text-muted" x-text="t('roleTeacher')"></span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted md:block" aria-hidden="true"></i>
            </button>
            <div id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-56" role="menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <a href="../common/profile.html" role="menuitem" class="menu-item"><i class="fa-regular fa-user w-4 text-muted" aria-hidden="true"></i> <span x-text="t('profile')"></span></a>
              <button type="button" role="menuitem" class="menu-item cursor-not-allowed opacity-60" aria-disabled="true" tabindex="-1"><i class="fa-solid fa-gear w-4 text-muted" aria-hidden="true"></i> <span x-text="t('settings')"></span></button>
              <a href="../common/errors.html" role="menuitem" class="menu-item"><i class="fa-solid fa-triangle-exclamation w-4 text-muted" aria-hidden="true"></i> <span x-text="t('systemStatus')"></span></a>
              <div class="border-t border-line"></div>
              <a href="../auth/login.html" role="menuitem" class="menu-item !text-danger"><i class="fa-solid fa-arrow-right-from-bracket w-4" aria-hidden="true"></i> <span x-text="t('logout')"></span></a>
            </div>
          </div>
        </div>
      </div>

      <!-- زبدة الخبز (Breadcrumb) -->
      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="locale === 'ar' ? 'مسار التنقل' : 'Breadcrumb'">
          <ol class="flex items-center gap-2" role="list">
            <li x-text="t('breadcrumb.home')"></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li x-text="t('breadcrumb.portal')"></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li><a :href="resultsHref" class="hover:text-brand hover:underline" x-text="t('breadcrumb.results')"></a></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li class="text-ink" aria-current="page" x-text="t('qg.breadcrumbCurrent')"></li>
          </ol>
        </nav>
      </div>
    </header>

    <!-- ================= المحتوى الرئيسي — تصحيح محاولة واحدة ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1100px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">

      <!-- مناطق الإعلان لقارئ الشاشة -->
      <p class="sr-only" aria-live="polite" x-text="liveMsg"></p>
      <p class="sr-only" aria-live="polite" x-text="totalsMsg"></p>

      <!-- العنوان + روابط التنقّل (تحمل سياق الاختبار) -->
      <section class="flex flex-col gap-4">
        <div class="min-w-0">
          <div class="mb-2 flex flex-wrap items-center gap-2">
            <a :href="resultsHref" class="inline-flex items-center gap-1.5 text-xs font-bold text-muted transition hover:text-brand hover:underline">
              <i class="fa-solid fa-arrow-left rtl:-scale-x-100" aria-hidden="true"></i>
              <span x-text="t('qg.backToResults')"></span>
            </a>
            <span class="text-muted" aria-hidden="true">·</span>
            <a href="quizzes.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-muted transition hover:text-brand hover:underline">
              <i class="fa-solid fa-clipboard-question" aria-hidden="true"></i>
              <span x-text="t('qg.backToQuizzes')"></span>
            </a>
          </div>
          <h1 id="page-title" tabindex="-1" class="text-2xl font-extrabold text-brand focus:outline-none sm:text-3xl" x-text="t('qg.title')"></h1>
          <p class="mt-1 max-w-2xl text-sm text-muted sm:text-base" x-text="t('qg.subtitle')"></p>
        </div>
      </section>

      <!-- ================= حالة الخطأ (معرّف غير معروف / لا محاولات بانتظار التصحيح) ================= -->
      <template x-if="loadError">
        <section class="panel p-6 text-center sm:p-10" role="alert" aria-labelledby="load-error-title">
          <span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl text-xl"
                :class="loadError === 'notFound' ? 'bg-error-500/15 text-error-700 dark:text-red-300' : 'bg-success-500/15 text-success-700 dark:text-success-500'" aria-hidden="true">
            <i class="fa-solid" :class="loadError === 'notFound' ? 'fa-file-circle-xmark' : 'fa-circle-check'"></i>
          </span>
          <h2 id="load-error-title" class="mt-4 text-lg font-extrabold text-ink" x-text="loadError === 'notFound' ? t('qg.notFoundTitle') : t('qg.noPendingTitle')"></h2>
          <p class="mx-auto mt-2 max-w-md text-sm leading-6 text-muted">
            <span x-text="loadError === 'notFound' ? t('qg.notFoundText') : t('qg.noPendingText')"></span>
            <template x-if="loadError === 'notFound'">
              <bdi dir="ltr" class="font-mono font-bold text-ink" x-text="requestedId"></bdi>
            </template>
          </p>
          <a href="quiz-results.html" class="btn btn-primary mt-5">
            <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
            <span x-text="t('qg.goToResults')"></span>
          </a>
        </section>
      </template>

      <template x-if="attempt && work">
        <div class="space-y-4 sm:space-y-6">

          <!-- تنبيه: فُتحت أول محاولة بانتظار التصحيح لأن الرابط بلا معرّف -->
          <div x-show="autoPicked" class="flex items-start gap-2.5 rounded-xl border border-info-500/40 bg-info-50 p-3.5 text-sm font-bold text-info-700 dark:bg-info-500/10 dark:text-blue-300" role="status">
            <i class="fa-solid fa-circle-info mt-0.5" aria-hidden="true"></i>
            <span x-text="t('qg.autoPicked')"></span>
          </div>
          <!-- تنبيه: استُعيدت مسودة محفوظة محليًا -->
          <div x-show="restoredAt" class="flex items-start gap-2.5 rounded-xl border border-line bg-soft/60 p-3.5 text-sm font-bold text-ink" role="status">
            <i class="fa-solid fa-clock-rotate-left mt-0.5 text-brand" aria-hidden="true"></i>
            <span x-text="tf('qg.restored', { time: relTime(restoredAt) })"></span>
          </div>
          <!-- تنبيه: المحاولة للقراءة فقط -->
          <div x-show="!editable" class="flex items-start gap-2.5 rounded-xl border border-line bg-soft/60 p-3.5 text-sm font-bold text-ink" role="status">
            <i class="fa-solid fa-lock mt-0.5 text-muted" aria-hidden="true"></i>
            <span x-text="attempt.status === 'in_progress' ? t('qg.readOnlyInProgress') : t('qg.readOnlyPublished')"></span>
          </div>

          <!-- ================= بيانات الطالب والمحاولة ================= -->
          <section class="panel p-4 sm:p-6" aria-labelledby="attempt-heading">
            <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
              <div class="flex min-w-0 items-start gap-3.5">
                <span class="grid h-14 w-14 shrink-0 place-items-center rounded-2xl bg-soft text-lg font-extrabold text-brand" aria-hidden="true">
                  <i x-show="anonymous" class="fa-solid fa-user-secret"></i>
                  <span x-show="!anonymous" x-text="studentInitials"></span>
                </span>
                <div class="min-w-0">
                  <h2 id="attempt-heading" tabindex="-1" class="truncate text-lg font-extrabold leading-7 text-ink focus:outline-none" x-text="studentLabel"></h2>
                  <p class="truncate text-start text-xs text-muted" x-show="!anonymous">
                    <span x-text="t('qg.studentNo')"></span>:
                    <bdi dir="ltr" class="font-mono" x-text="student ? student.studentNo : '—'"></bdi>
                  </p>
                  <div class="mt-2 flex flex-wrap items-center gap-1.5">
                    <span class="badge badge-muted font-mono"><span class="sr-only" x-text="t('qg.quizCode') + ':'"></span><bdi dir="ltr" x-text="quiz.code"></bdi></span>
                    <span class="badge badge-muted font-mono"><span class="sr-only" x-text="t('qg.attemptId') + ':'"></span><bdi dir="ltr" x-text="attempt.id"></bdi></span>
                  </div>
                  <p class="mt-1.5 text-sm font-bold leading-6 text-ink" x-text="L(quiz.title)"></p>
                </div>
              </div>

              <div class="flex shrink-0 flex-col items-start gap-2 sm:items-end">
                <span class="badge text-sm" :class="statusMeta.badge">
                  <i class="fa-solid" :class="statusMeta.icon" aria-hidden="true"></i>
                  <span x-text="statusLabel"></span>
                </span>
                <!-- التصحيح المجهول -->
                <button type="button" role="switch" :aria-checked="anonymous.toString()" @click="toggleAnonymous()"
                        class="inline-flex items-center gap-2 rounded-xl px-2 py-1.5 text-xs font-bold text-ink transition hover:bg-soft">
                  <span class="flex h-5 w-9 shrink-0 items-center rounded-full px-0.5 transition"
                        :class="anonymous ? 'justify-end bg-primary-500' : 'justify-start bg-neutral-300 dark:bg-soft-2'" aria-hidden="true">
                    <span class="h-4 w-4 rounded-full bg-white shadow"></span>
                  </span>
                  <span x-text="t('qg.anonymous')"></span>
                </button>
              </div>
            </div>

            <dl class="mt-5 grid grid-cols-2 gap-3 border-t border-line pt-4 text-xs sm:grid-cols-4">
              <div>
                <dt class="font-bold text-muted" x-text="t('qg.submittedAt')"></dt>
                <dd class="mt-1 font-bold text-ink">
                  <template x-if="attempt.submittedAt">
                    <time :datetime="attempt.submittedAt" x-text="date(attempt.submittedAt)"></time>
                  </template>
                  <span x-show="!attempt.submittedAt" x-text="t('qg.notSubmitted')"></span>
                </dd>
              </div>
              <div>
                <dt class="font-bold text-muted" x-text="t('qg.timeTaken')"></dt>
                <dd class="mt-1 font-bold tabular-nums text-ink" x-text="timeTaken"></dd>
              </div>
              <div>
                <dt class="font-bold text-muted" x-text="t('qg.score')"></dt>
                <dd class="mt-1 font-extrabold tabular-nums text-brand" x-text="num(summary.earned) + ' / ' + num(summary.total)"></dd>
              </div>
              <div>
                <dt class="font-bold text-muted" x-text="t('qg.percentage')"></dt>
                <dd class="mt-1 font-extrabold tabular-nums text-brand" x-text="pct(summary.percent)"></dd>
              </div>
            </dl>

            <!-- تقدّم التصحيح في هذا الاختبار + التنقّل بين المحاولات المعلّقة -->
            <div class="mt-4 flex flex-col gap-3 border-t border-line pt-4 sm:flex-row sm:items-center sm:justify-between">
              <p class="flex items-center gap-2 text-sm font-bold text-ink">
                <i class="fa-solid fa-layer-group text-brand" aria-hidden="true"></i>
                <span x-text="progressText"></span>
              </p>
              <div class="flex flex-wrap items-center gap-2">
                <button type="button" class="btn btn-outline btn-sm" :disabled="!prevPending" @click="goPrev()"
                        :aria-keyshortcuts="isRtl ? 'Alt+ArrowRight' : 'Alt+ArrowLeft'">
                  <i class="fa-solid fa-arrow-left rtl:-scale-x-100" aria-hidden="true"></i>
                  <span x-text="t('qg.prevPending')"></span>
                </button>
                <button type="button" class="btn btn-outline btn-sm" :disabled="!nextPending" @click="goNext()"
                        :aria-keyshortcuts="isRtl ? 'Alt+ArrowLeft' : 'Alt+ArrowRight'">
                  <span x-text="t('qg.nextPending')"></span>
                  <i class="fa-solid fa-arrow-right rtl:-scale-x-100" aria-hidden="true"></i>
                </button>
                <!-- اختصارات لوحة المفاتيح -->
                <div class="relative" @click.outside="helpOpen = false">
                  <button type="button" x-ref="helpBtn" class="icon-btn h-9 w-9 border border-line" @click="helpOpen = !helpOpen"
                          :aria-expanded="helpOpen.toString()" aria-controls="shortcut-help" :aria-label="t('qg.shortcutsTitle')">
                    <i class="fa-regular fa-keyboard" aria-hidden="true"></i>
                  </button>
                  <div id="shortcut-help" x-cloak x-show="helpOpen" x-transition.opacity role="region" :aria-label="t('qg.shortcutsTitle')"
                       @keydown.escape.stop="helpOpen = false; $refs.helpBtn.focus()"
                       class="absolute end-0 top-full z-40 mt-2 w-72 max-w-[calc(100vw-2rem)] rounded-2xl border border-line bg-card p-4 text-start shadow-pop">
                    <p class="mb-2 text-sm font-extrabold text-ink" x-text="t('qg.shortcutsTitle')"></p>
                    <dl class="space-y-2 text-xs">
                      <div class="flex items-center justify-between gap-3">
                        <dt class="text-muted" x-text="t('qg.scSave')"></dt>
                        <dd><kbd class="rounded border border-line bg-page px-1.5 py-0.5 font-bold text-ink"><bdi dir="ltr">Alt + S</bdi></kbd></dd>
                      </div>
                      <div class="flex items-center justify-between gap-3">
                        <dt class="text-muted" x-text="t('qg.scNext')"></dt>
                        <dd><kbd class="rounded border border-line bg-page px-1.5 py-0.5 font-bold text-ink"><bdi dir="ltr" x-text="isRtl ? 'Alt + ←' : 'Alt + →'"></bdi></kbd></dd>
                      </div>
                      <div class="flex items-center justify-between gap-3">
                        <dt class="text-muted" x-text="t('qg.scPrev')"></dt>
                        <dd><kbd class="rounded border border-line bg-page px-1.5 py-0.5 font-bold text-ink"><bdi dir="ltr" x-text="isRtl ? 'Alt + →' : 'Alt + ←'"></bdi></kbd></dd>
                      </div>
                    </dl>
                    <p class="mt-3 text-[11px] leading-5 text-muted" x-text="t('qg.scNote')"></p>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- ================= تفصيل الإجابات والتصحيح ================= -->
          <section class="panel p-4 sm:p-6" aria-labelledby="answers-title">
            <h2 id="answers-title" class="mb-4 flex items-center gap-2 text-base font-extrabold text-ink">
              <i class="fa-solid fa-list-check text-brand" aria-hidden="true"></i>
              <span x-text="t('qg.answersTitle')"></span>
            </h2>

            <ol class="space-y-4" role="list">
              <template x-for="r in rows" :key="attempt.id + ':' + r.uid">
                <li class="rounded-xl border border-line p-4" :id="'q-' + r.uid" :aria-labelledby="'q-title-' + r.uid">

                  <!-- رأس السؤال -->
                  <div class="flex flex-wrap items-start justify-between gap-2">
                    <h3 :id="'q-title-' + r.uid" class="min-w-0 flex-1 font-bold leading-6 text-ink">
                      <span class="text-muted" x-text="tf('qg.questionN', { n: num(r.n) }) + ':'"></span>
                      <span x-text="L(r.q.text)"></span>
                    </h3>
                    <div class="flex shrink-0 flex-wrap items-center gap-1.5">
                      <span class="badge" :class="r.auto ? 'badge-info' : 'badge-accent'">
                        <i class="fa-solid" :class="r.auto ? 'fa-robot' : 'fa-pen-to-square'" aria-hidden="true"></i>
                        <span x-text="r.auto ? t('qg.gradedAuto') : t('qg.gradedManual')"></span>
                      </span>
                      <span class="badge" :class="rowBadge(r).cls">
                        <i class="fa-solid" :class="rowBadge(r).icon" aria-hidden="true"></i>
                        <span x-text="rowBadge(r).text"></span>
                      </span>
                    </div>
                  </div>

                  <!-- ========== تصحيح تلقائي (MCQ / صح-خطأ) — للقراءة فقط ========== -->
                  <template x-if="r.auto">
                    <div class="mt-3 flex items-start gap-3">
                      <span class="ans-indicator" :class="r.isCorrect ? 'bg-success-500/15 text-success-700 dark:text-success-500' : 'bg-error-500/15 text-error-700 dark:text-red-300'">
                        <i class="fa-solid" :class="r.isCorrect ? 'fa-check' : 'fa-xmark'" aria-hidden="true"></i>
                        <span class="sr-only" x-text="r.isCorrect ? t('qg.correct') : t('qg.incorrect')"></span>
                      </span>
                      <div class="min-w-0 flex-1">
                        <p class="text-sm font-bold" :class="r.isCorrect ? 'text-success-700 dark:text-success-500' : 'text-error-700 dark:text-red-300'" aria-hidden="true"
                           x-text="r.isCorrect ? t('qg.correct') : (r.ans.choiceUid ? t('qg.incorrect') : t('qg.unanswered'))"></p>
                        <ul class="mt-2 space-y-1.5" role="list" :aria-label="t('qg.options')">
                          <template x-for="o in r.q.options" :key="o.uid">
                            <li class="flex flex-wrap items-center gap-2 rounded-lg border px-3 py-2 text-sm"
                                :class="o.correct ? 'border-success-500/50 bg-success-500/5' : (o.uid === r.ans.choiceUid ? 'border-error-500/50 bg-error-500/5' : 'border-line')">
                              <bdi class="min-w-0 flex-1 text-ink" x-text="L(o.text)"></bdi>
                              <span x-show="o.uid === r.ans.choiceUid" class="badge badge-primary">
                                <i class="fa-solid fa-hand-pointer" aria-hidden="true"></i>
                                <span x-text="t('qg.studentChoice')"></span>
                              </span>
                              <span x-show="o.correct" class="badge badge-success">
                                <i class="fa-solid fa-check" aria-hidden="true"></i>
                                <span x-text="t('qg.correctAnswer')"></span>
                              </span>
                            </li>
                          </template>
                        </ul>
                      </div>
                    </div>
                  </template>

                  <!-- ========== تصحيح يدوي (مقالي / إجابة قصيرة) ========== -->
                  <template x-if="!r.auto">
                    <div class="mt-3 space-y-3">
                      <div>
                        <p class="mb-1.5 text-xs font-bold text-muted" x-text="t('qg.studentAnswer')"></p>
                        <p x-show="r.ans.text" class="whitespace-pre-wrap rounded-lg border border-line bg-soft/60 p-3 text-sm leading-6 text-ink" x-text="L(r.ans.text)"></p>
                        <p x-show="!r.ans.text" class="rounded-lg border border-dashed border-line p-3 text-sm italic text-muted" x-text="t('qg.noAnswer')"></p>
                      </div>

                      <details x-show="r.q.modelAnswer" class="rounded-lg border border-line">
                        <summary class="cursor-pointer px-3 py-2 text-xs font-bold text-brand" x-text="t('qg.modelAnswer')"></summary>
                        <p class="border-t border-line p-3 text-sm leading-6 text-ink" x-text="L(r.q.modelAnswer)"></p>
                      </details>

                      <!-- اقتراح الذكاء الاصطناعي (اقتراح فقط؛ ما يُخزَّن هو درجة المعلّم) -->
                      <div x-show="r.ans.aiSuggested != null" class="flex flex-wrap items-center gap-3 rounded-lg border border-accent-500/50 bg-accent-500/10 p-3 text-sm">
                        <i class="fa-solid fa-wand-magic-sparkles text-yellow-900 dark:text-accent-500" aria-hidden="true"></i>
                        <div class="min-w-0 flex-1">
                          <p class="font-bold text-ink">
                            <span x-text="t('qg.aiSuggested') + ':'"></span>
                            <span class="tabular-nums" x-text="num(r.ans.aiSuggested) + ' / ' + num(r.marks)"></span>
                          </p>
                          <p class="text-xs text-muted" x-text="t('qg.aiNote')"></p>
                        </div>
                        <button type="button" class="btn btn-ai btn-sm" :disabled="!editable || (r.ans.marksEarned === r.ans.aiSuggested && !errors[r.uid])"
                                @click="applySuggestion(r)" :aria-label="tf('qg.applySuggestionFor', { n: num(r.n) })">
                          <i class="fa-solid fa-check-double" aria-hidden="true"></i>
                          <span x-text="t('qg.applySuggestion')"></span>
                        </button>
                      </div>

                      <div class="grid grid-cols-1 gap-3 sm:grid-cols-[auto_1fr] sm:items-start">
                        <div>
                          <label class="label" :for="'score-' + r.uid" x-text="tf('qg.scoreFor', { n: num(r.n), max: num(r.marks) })"></label>
                          <div class="flex items-center gap-2">
                            <input type="text" inputmode="decimal" autocomplete="off" :id="'score-' + r.uid" class="score-input"
                                   :value="inputs[r.uid]" @input="setScore(r, $event.target.value)" :readonly="!editable"
                                   :aria-invalid="(!!errors[r.uid]).toString()"
                                   :aria-describedby="'score-hint-' + r.uid + (errors[r.uid] ? ' score-err-' + r.uid : '')">
                            <span class="shrink-0 text-sm font-bold text-muted" aria-hidden="true" x-text="'/ ' + num(r.marks)"></span>
                          </div>
                          <p :id="'score-hint-' + r.uid" class="hint" x-text="tf('qg.scoreHint', { max: num(r.marks) })"></p>
                          <template x-if="errors[r.uid]">
                            <p :id="'score-err-' + r.uid" class="err" role="alert">
                              <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                              <span x-text="scoreError(r)"></span>
                            </p>
                          </template>
                          <!-- درجات سريعة (سلّم مبسّط) -->
                          <div x-show="editable" class="mt-2 flex flex-wrap gap-1.5" role="group" :aria-label="tf('qg.quickScoresFor', { n: num(r.n) })">
                            <button type="button" class="rounded-full border border-line px-2.5 py-1 text-xs font-bold text-ink transition hover:bg-soft" @click="rubric(r, 'full')" x-text="tf('qg.rubricFull', { v: num(r.marks) })"></button>
                            <button type="button" class="rounded-full border border-line px-2.5 py-1 text-xs font-bold text-ink transition hover:bg-soft" @click="rubric(r, 'half')" x-text="tf('qg.rubricHalf', { v: num(r.marks / 2) })"></button>

    return {
      /* ---------- حالة عامة (Shell) ---------- */
      dark: document.documentElement.classList.contains('dark'),
      locale: document.documentElement.lang === 'en' ? 'en' : 'ar',
      mobile: !desktopMQ.matches,
      mobileNav: false,
      collapsed: false,
      notifOpen: false, profileOpen: false,
      active: 'reviewQueue',
      teacher: TC.TEACHER,
      get expanded() { return this.mobile || !this.collapsed; },
      get isRtl() { return this.locale === 'ar'; },

      /* ---------- الترجمة والتنسيق ---------- */
      t(path) {
        const dict = I18N[this.locale];
        return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), dict) ?? path;
      },
      tf(path, vars) {
        let s = this.t(path);
        Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
        return s;
      },
      L(obj) { return TC.loc(obj, this.locale); },
      num(n) { return TC.fmtNum(n, this.locale, { maximumFractionDigits: 2 }); },
      pct(p) { return TC.fmtPct(p, this.locale, 1); },
      date(iso) { return TC.fmtDate(iso, this.locale); },
      relTime(iso) { return TC.relTime(iso, this.locale); },
      setLocale(loc) {
        this.locale = loc;
        document.documentElement.lang = loc;
        document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
        try { localStorage.setItem('firob-locale', loc); } catch (e) {}
        this.updateTitle();
      },
      toggleLocale() { this.setLocale(this.locale === 'ar' ? 'en' : 'ar'); },
      updateTitle() {
        const id = this.attempt ? ' ' + this.attempt.id : '';
        document.title = this.t('qg.pageTitle') + id + ' — FirOb';
      },

      /* ---------- التنقل (Teacher Portal) ---------- */
      nav: [
        { group: 'main', items: [
          { key: 'teacherDashboard', icon: 'fa-solid fa-gauge-high', href: 'teacher-dashboard.html' },
        ]},
        { group: 'teaching', items: [
          { key: 'myCourses', icon: 'fa-solid fa-book-open', href: 'CoursesManagement.html' },
          { key: 'conceptsTree', icon: 'fa-solid fa-diagram-project', href: 'concepts.html' },
        ]},
        { group: 'assessment', items: [
          { key: 'quizBank', icon: 'fa-solid fa-list-check', href: 'quizzes.html' },
          { key: 'learningObjects', icon: 'fa-solid fa-cubes', href: 'learning-objects.html' },
          { key: 'aiStudio', icon: 'fa-solid fa-wand-magic-sparkles', href: 'ai-generator.html' },
        ]},
        { group: 'grading', items: [
          { key: 'reviewQueue', icon: 'fa-solid fa-clipboard-check', href: 'ReviewQueue.html' },
          { key: 'studentResults', icon: 'fa-solid fa-chart-line', href: 'quiz-results.html', live: true },
        ]},
      ],
      setActive(key) { this.active = key; this.mobileNav = false; },

      /* ---------- الإشعارات (من البيانات المشتركة، أوقات نسبية) ---------- */
      notifications: (() => {
        const pend = TC.ATTEMPTS.filter(a => a.status === 'pending_grading').slice().sort(bySubmitted).pop();
        const ai = TC.AI_USAGE.logs.filter(l => l.kind === 'feedback').slice(-1)[0];
        const list = [];
        if (pend) list.push({ id: 1, key: 'newAttempt', quizCode: pend.quizCode, at: pend.submittedAt, read: false, icon: 'fa-solid fa-inbox', tone: 'bg-warning-500/15 text-warning-800 dark:text-warning-500' });
        list.push({ id: 2, key: 'lowPassRate', quizCode: 'QZ-SCI-201', at: TC.addDays(TC.LOADED_AT, -1).toISOString(), read: false, icon: 'fa-solid fa-triangle-exclamation', tone: 'bg-error-500/15 text-error-700 dark:text-red-300' });
        if (ai) list.push({ id: 3, key: 'aiFeedbackReady', quizCode: ai.quizCode, at: ai.at, read: true, icon: 'fa-solid fa-wand-magic-sparkles', tone: 'bg-accent-500/20 text-yellow-900 dark:text-accent-500' });
        return list;
      })(),
      get unread() { return this.notifications.filter(n => !n.read).length; },
      notifText(n) {
        const q = TC.quiz(n.quizCode);
        const quiz = q ? this.L(q.title) : '';
        if (n.key === 'newAttempt') return this.tf('notif.newAttempt', { quiz });
        if (n.key === 'lowPassRate') return this.tf('notif.lowPassRate', { quiz });
        return this.tf('notif.aiFeedbackReady', { quiz });
      },

      /* ---------- حالة التصحيح ---------- */
      attempts: [],          // نسخة عميقة من TC.ATTEMPTS + المسودات المستعادة
      attemptId: null,
      requestedId: null,
      loadError: null,       // 'notFound' | 'noPending'
      autoPicked: false,
      restoredMap: {},       // id → وقت المسودة المستعادة
      work: null,            // نسخة العمل: { answers, generalComment }
      inputs: {},            // النص الخام لكل حقل درجة
      errors: {},            // مفتاح خطأ لكل حقل درجة
      dirty: false,
      savedAt: null,
      saving: false,
      publishing: false,
      navigating: false,
      justPublished: false,
      publishErrors: [],
      anonymous: false,
      helpOpen: false,
      liveMsg: '',
      totalsMsg: '',
      _totalsTimer: null,

      get attempt() { return this.attempts.find(a => a.id === this.attemptId) || null; },
      get quiz() { return this.attempt ? TC.quiz(this.attempt.quizCode) : null; },
      get student() { return this.attempt ? TC.student(this.attempt.studentId) : null; },
      get editable() { return !!this.attempt && EDITABLE.includes(this.attempt.status); },
      get restoredAt() { return this.attempt ? this.restoredMap[this.attempt.id] || null : null; },
      get statusMeta() { return STATUS_META[this.attempt?.status] || STATUS_META.pending_grading; },
      get statusLabel() { return this.attempt ? this.t('qg.status.' + this.attempt.status) : ''; },
      get resultsHref() { return this.quiz ? 'quiz-results.html?quiz=' + encodeURIComponent(this.quiz.code) : 'quiz-results.html'; },
      get pendingTotal() { return this.attempts.filter(a => a.status === 'pending_grading').length; },

      /** رقم مجهول ثابت للطالب داخل الاختبار (ترتيب بدء المحاولات) */
      get anonNumber() {
        if (!this.attempt) return 0;
        const list = this.attempts.filter(a => a.quizCode === this.attempt.quizCode)
          .slice().sort((a, b) => a.startedAt.localeCompare(b.startedAt) || a.id.localeCompare(b.id));
        return list.findIndex(a => a.id === this.attempt.id) + 1;
      },
      get studentLabel() {
        if (!this.attempt) return '';
        if (this.anonymous || !this.student) return this.tf('qg.anonStudent', { n: this.num(this.anonNumber) });
        return this.L(this.student.name);
      },
      get studentInitials() {
        const name = this.student ? this.L(this.student.name) : '';
        const parts = name.split(/\s+/).filter(Boolean);
        return parts.length ? (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')) : '?';
      },
      get timeTaken() {
        const a = this.attempt;
        if (!a || !a.submittedAt) return '—';
        const min = Math.max(0, Math.round((Date.parse(a.submittedAt) - Date.parse(a.startedAt)) / 60000));
        return TC.fmtNum(min, this.locale, { style: 'unit', unit: 'minute', unitDisplay: 'long' });
      },

      /** صفوف الأسئلة: السؤال + إجابة نسخة العمل */
      get rows() {
        if (!this.quiz || !this.work) return [];
        return this.quiz.questions.map((q, i) => {
          const ans = this.work.answers.find(x => x.qUid === q.uid);
          const auto = AUTO_TYPES.includes(q.type);
          const opt = auto ? q.options.find(o => o.uid === ans.choiceUid) : null;
          return { n: i + 1, uid: q.uid, q, ans, auto, marks: +q.marks || 0, isCorrect: auto ? !!(opt && opt.correct) : null };
        });
      },
      rowBadge(r) {
        const m = r.ans.marksEarned;
        if (m == null || this.errors[r.uid]) return { cls: 'badge-warning', icon: 'fa-hourglass-half', text: this.t('qg.pendingGrading') };
        const full = m >= r.marks, zero = m === 0;
        return { cls: full ? 'badge-success' : (zero ? 'badge-danger' : 'badge-accent'), icon: full ? 'fa-circle-check' : (zero ? 'fa-circle-xmark' : 'fa-circle-half-stroke'), text: this.num(m) + ' / ' + this.num(r.marks) };
      },

      /** المجاميع الحيّة */
      get summary() {
        const rows = this.rows;
        const total = rows.reduce((s, r) => s + r.marks, 0);
        let earned = 0, pending = 0;
        rows.forEach(r => {
          if (r.ans.marksEarned == null || this.errors[r.uid]) pending++;
          else earned += r.ans.marksEarned;
        });
        const percent = total ? Math.round((earned / total) * 1000) / 10 : 0;
        const passed = pending > 0 || !this.quiz ? null : percent >= this.quiz.passMark;
        return { earned, total, percent, pending, passed };
      },
      get resultLabel() {
        const s = this.summary;
        if (s.passed === null) return this.tf('qg.resultPending', { n: this.num(s.pending) });
        return s.passed ? this.t('qg.resultPassed') : this.t('qg.resultFailed');
      },
      announceTotals() {
        clearTimeout(this._totalsTimer);
        this._totalsTimer = setTimeout(() => {
          const s = this.summary;
          this.totalsMsg = this.tf('qg.totalsLive', { earned: this.num(s.earned), total: this.num(s.total), pct: this.pct(s.percent), result: this.resultLabel });
        }, 700);
      },

      /* ---------- ترتيب المحاولات المعلّقة في الاختبار ---------- */
      get quizOrder() {
        if (!this.attempt) return [];
        return this.attempts.filter(a => a.quizCode === this.attempt.quizCode && a.submittedAt).slice().sort(bySubmitted);
      },
      get pendingInQuiz() { return this.quizOrder.filter(a => a.status === 'pending_grading'); },
      get prevPending() {
        const order = this.quizOrder, i = order.findIndex(a => a.id === this.attemptId);
        if (i < 0) return null;
        for (let j = i - 1; j >= 0; j--) if (order[j].status === 'pending_grading') return order[j];
        return null;
      },
      get nextPending() {
        const order = this.quizOrder, i = order.findIndex(a => a.id === this.attemptId);
        if (i < 0) return this.pendingInQuiz[0] || null;
        for (let j = i + 1; j < order.length; j++) if (order[j].status === 'pending_grading') return order[j];
        return null;
      },
      get nextAfterPublish() {
        return this.nextPending || this.prevPending
          || this.attempts.filter(a => a.status === 'pending_grading' && a.id !== this.attemptId).slice().sort(bySubmitted)[0] || null;
      },
      get progressText() {
        const list = this.pendingInQuiz, k = list.findIndex(a => a.id === this.attemptId);
        if (k >= 0) return this.tf('qg.progressOf', { k: this.num(k + 1), n: this.num(list.length) });
        if (list.length) return this.tf('qg.progressOthers', { n: this.num(list.length) });
        return this.t('qg.progressNone');
      },

      /* ---------- الحالة المحفوظة ---------- */
      get saveStateText() {
        if (this.dirty) return this.t('qg.unsaved');
        const at = this.attempt && this.attempt.savedAt;
        return at ? this.tf('qg.savedAtLabel', { time: this.relTime(at) }) : this.t('qg.notSavedYet');
      },
      get publishErrorText() {
        return this.tf('qg.publishBlocked', { list: this.publishErrors.map(e => this.num(e.n)).join(this.locale === 'ar' ? '، ' : ', ') });
      },

      /* ---------- التحميل ---------- */
      restoreDraft(a) {
        const raw = lsGet(LS_PREFIX + a.id);
        if (!raw || a.status === 'in_progress') return a;
        let d;
        try { d = JSON.parse(raw); } catch (e) { return a; }
        if (!d || d.v !== 1 || !Array.isArray(d.answers)) return a;
        const qz = TC.quiz(a.quizCode);
        if (!qz) return a;
        d.answers.forEach(x => {
          const q = qz.questions.find(qq => qq.uid === x.qUid);
          const ans = a.answers.find(y => y.qUid === x.qUid);
          if (!q || !ans || AUTO_TYPES.includes(q.type)) return;
          const p = parseScore(x.marksEarned == null ? '' : x.marksEarned, q.marks);
          if (!p.error) ans.marksEarned = p.value;
          if (x.feedback && typeof x.feedback === 'object') ans.feedback = { ar: String(x.feedback.ar || ''), en: String(x.feedback.en || '') };
        });
        if (d.generalComment && typeof d.generalComment === 'object') a.generalComment = { ar: String(d.generalComment.ar || ''), en: String(d.generalComment.en || '') };
        if (EDITABLE.concat('published').includes(d.status)) a.status = d.status;
        ['savedAt', 'gradedAt', 'publishedAt'].forEach(k => { if (d[k] && !isNaN(Date.parse(d[k]))) a[k] = d[k]; });
        if (d.savedAt) this.restoredMap[a.id] = d.savedAt;
        return a;
      },
      load(id) {
        this.requestedId = id;
        this.helpOpen = false;
        const att = this.attempts.find(a => a.id === id);
        if (!att || !TC.quiz(att.quizCode)) {
          this.loadError = 'notFound'; this.attemptId = null; this.work = null;
          this.updateTitle();
          return false;
        }
        this.loadError = null;
        this.attemptId = id;
        const answers = TC.quiz(att.quizCode).questions.map(q => TC.clone(att.answers.find(x => x.qUid === q.uid)
          || { qUid: q.uid, choiceUid: null, text: null, marksEarned: null, aiSuggested: null, feedback: null }));
        this.work = { answers, generalComment: TC.clone(att.generalComment || { ar: '', en: '' }) };
        const inputs = {};
        this.work.answers.forEach(a => { inputs[a.qUid] = a.marksEarned == null ? '' : String(a.marksEarned); });
        this.inputs = inputs;
        this.errors = {};
        this.dirty = false;
        this.publishErrors = [];
        this.justPublished = false;
        this.updateTitle();
        return true;
      },
      syncUrl(id) {
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('attempt', id);
          history.replaceState(null, '', url.pathname + url.search + url.hash);
        } catch (e) {}
      },
      pickInitial() {
        const id = (new URLSearchParams(window.location.search).get('attempt') || '').trim();
        if (id) return this.load(id);
        const first = this.attempts.filter(a => a.status === 'pending_grading').slice().sort(bySubmitted)[0];
        if (!first) { this.loadError = 'noPending'; this.attemptId = null; this.work = null; this.updateTitle(); return false; }
        this.load(first.id);
        this.autoPicked = true;
        this.syncUrl(first.id);
        this.liveMsg = this.t('qg.autoPicked');
        return true;
      },

      /* ---------- إدخال الدرجات والملاحظات ---------- */
      rowOf(r) { return typeof r === 'string' ? this.rows.find(x => x.uid === r) : r; },
      setScore(r, raw) {
        r = this.rowOf(r);
        if (!r || r.auto || !this.editable) return { value: null, error: 'readonly' };
        const res = parseScore(raw, r.marks);
        this.inputs[r.uid] = raw == null ? '' : String(raw);
        r.ans.marksEarned = res.error ? null : res.value;
        if (res.error) this.errors[r.uid] = res.error; else delete this.errors[r.uid];
        this.errors = { ...this.errors };
        this.dirty = true;
        if (this.publishErrors.length) this.publishErrors = this.missingScores();
        this.announceTotals();
        return res;
      },
      scoreError(r) {
        const k = this.errors[r.uid];
        return k ? this.tf('qg.err.' + k, { max: this.num(r.marks) }) : '';
      },
      applySuggestion(r) {
        r = this.rowOf(r);
        if (!r || r.ans.aiSuggested == null) return;
        this.setScore(r, String(r.ans.aiSuggested));
        this.liveMsg = this.tf('qg.appliedSuggestion', { n: this.num(r.n) });
      },
      rubric(r, kind) {
        r = this.rowOf(r);
        if (!r) return;
        const v = kind === 'full' ? r.marks : kind === 'half' ? Math.floor(r.marks) / 2 : 0;
        this.setScore(r, String(v));
      },
      feedbackValue(r) { return (r.ans.feedback && r.ans.feedback[this.locale]) || ''; },
      setFeedback(r, value) {
        r = this.rowOf(r);
        if (!r || !this.editable) return;
        r.ans.feedback = { ar: '', en: '', ...(r.ans.feedback || {}), [this.locale]: String(value) };
        this.dirty = true;
      },
      setGeneralComment(value) {
        if (!this.editable) return;
        this.work.generalComment = { ar: '', en: '', ...(this.work.generalComment || {}), [this.locale]: String(value) };
        this.dirty = true;
      },
      missingScores() {
        return this.rows.filter(r => r.ans.marksEarned == null || this.errors[r.uid]).map(r => ({ uid: r.uid, n: r.n }));
      },
      focusScore(uid) {
        const el = document.getElementById('score-' + uid);
        if (el) { el.focus(); if (el.scrollIntoView) el.scrollIntoView({ block: 'center' }); }
      },

      /* ---------- الحفظ والنشر ---------- */
      serialize(att) {
        return {
          v: 1, attemptId: att.id, status: att.status,
          answers: att.answers.map(a => ({ qUid: a.qUid, marksEarned: a.marksEarned, feedback: a.feedback || null })),
          generalComment: att.generalComment || null,
          savedAt: att.savedAt || null, gradedAt: att.gradedAt || null, publishedAt: att.publishedAt || null,
        };
      },
      commit() {
        const att = this.attempt;
        att.answers = TC.clone(this.work.answers);
        att.generalComment = TC.clone(this.work.generalComment);
        att.savedAt = new Date().toISOString();
        return lsSet(LS_PREFIX + att.id, JSON.stringify(this.serialize(att)));
      },
      saveDraft() {
        if (!this.attempt) return false;
        if (!this.editable) { this.liveMsg = this.t('qg.cannotEdit'); return false; }
        if (this.saving) return false;
        this.saving = true;
        try {
          const hadInvalid = Object.keys(this.errors).length > 0;
          const stored = this.commit();
          this.dirty = false;
          this.liveMsg = !stored ? this.t('qg.savedMemoryOnly') : hadInvalid ? this.t('qg.savedWithInvalid') : this.t('qg.saved');
          return true;
        } finally { this.saving = false; }
      },
      async confirmDialog(opts) {
        if (typeof Swal === 'undefined') return { isConfirmed: window.confirm ? window.confirm(opts.text) : false };
        return Swal.fire({ customClass: { popup: 'firob-swal' }, buttonsStyling: true, ...opts });
      },
      async publish() {
        if (!this.attempt || !this.editable || this.publishing) return false;
        const missing = this.missingScores();
        if (missing.length) {
          this.publishErrors = missing;
          this.liveMsg = this.publishErrorText;
          this.$nextTick(() => this.focusScore(missing[0].uid));
          return false;
        }
        this.publishErrors = [];
        this.publishing = true;
        try {
          const s = this.summary;
          const res = await this.confirmDialog({
            titleText: this.t('qg.confirmPublishTitle'),
            text: this.tf('qg.confirmPublishText', { who: this.studentLabel, earned: this.num(s.earned), total: this.num(s.total), pct: this.pct(s.percent), result: this.resultLabel }),
            icon: 'question', showCancelButton: true, focusCancel: true,
            confirmButtonText: this.t('qg.confirmPublishBtn'), cancelButtonText: this.t('qg.cancel'),
          });
          if (!res || !res.isConfirmed) { this.liveMsg = this.t('qg.publishCancelled'); return false; }
          const att = this.attempt;
          const now = new Date().toISOString();
          att.status = 'published';
          att.gradedAt = att.gradedAt || now;
          att.publishedAt = now;
          const stored = this.commit();
          this.dirty = false;
          this.justPublished = true;
          this.liveMsg = this.tf('qg.publishedDone', { who: this.studentLabel }) + (stored ? '' : ' ' + this.t('qg.savedMemoryOnly'));
          this.$nextTick(() => document.getElementById('published-panel')?.focus());
          return true;
        } finally { this.publishing = false; }
      },

      /* ---------- التنقل بين المحاولات ---------- */
      async goTo(id) {
        if (!id || this.navigating || id === this.attemptId) return false;
        this.navigating = true;
        try {
          if (this.dirty && this.editable) {
            const res = await this.confirmDialog({
              titleText: this.t('qg.leaveTitle'), text: this.t('qg.leaveText'), icon: 'warning',
              showCancelButton: true, showDenyButton: true,
              confirmButtonText: this.t('qg.leaveSave'), denyButtonText: this.t('qg.leaveDiscard'), cancelButtonText: this.t('qg.leaveStay'),
            });
            if (res && res.isConfirmed) this.saveDraft();
            else if (!(res && res.isDenied)) return false;
          }
          this.autoPicked = false;
          if (!this.load(id)) return false;
          this.syncUrl(id);
          this.liveMsg = this.tf('qg.opened', { who: this.studentLabel, id });
          this.$nextTick(() => document.getElementById('attempt-heading')?.focus());
          return true;
        } finally { this.navigating = false; }
      },
      goNext() { if (this.nextPending) return this.goTo(this.nextPending.id); this.liveMsg = this.t('qg.noNext'); return Promise.resolve(false); },
      goPrev() { if (this.prevPending) return this.goTo(this.prevPending.id); this.liveMsg = this.t('qg.noPrev'); return Promise.resolve(false); },

      /* ---------- لوحة المفاتيح: Alt+S حفظ، Alt+أسهم (حسب الاتجاه) تنقّل ---------- */
      onKey(e) {
        if (!e || !e.altKey || e.ctrlKey || e.metaKey || !this.attempt) return;
        if (e.code === 'KeyS' || (e.key && e.key.toLowerCase() === 's')) { e.preventDefault(); this.saveDraft(); return; }
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        const tg = e.target, tag = tg && tg.tagName ? tg.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea' || tag === 'select' || (tg && tg.isContentEditable)) return;
        e.preventDefault();
        const forward = this.isRtl ? 'ArrowLeft' : 'ArrowRight';
        return e.key === forward ? this.goNext() : this.goPrev();
      },

      toggleAnonymous() {
        this.anonymous = !this.anonymous;
        lsSet(LS_ANON, this.anonymous ? '1' : '0');
        this.liveMsg = this.anonymous ? this.t('qg.anonOn') : this.t('qg.anonOff');
      },

      /* ---------- عامة ---------- */
      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        this.anonymous = lsGet(LS_ANON) === '1';
        this.attempts = TC.clone(TC.ATTEMPTS).map(a => this.restoreDraft(a));
        this.pickInitial();
        window.addEventListener('beforeunload', (e) => {
          if (this.dirty) { e.preventDefault(); e.returnValue = ''; return ''; }
        });
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      closeAll() {
        this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; this.helpOpen = false;
      },
    };
  }
</script>
