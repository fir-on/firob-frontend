<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>منشئ الاختبارات — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    input[type="search"]::-webkit-search-decoration,
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-results-button,
    input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- تلميحات أزرار الإجراءات (Action Tooltips) ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg border border-white/10 bg-slate-900/90 px-2.5 py-1 text-xs font-medium tracking-wide text-white opacity-0 shadow-xl backdrop-blur-md transition-all duration-200 ease-out;
      @apply dark:border-slate-800/20 dark:bg-slate-100 dark:text-slate-900;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-slate-900/90 opacity-0 transition-all duration-200 ease-out;
      @apply dark:border-t-slate-100;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  {@apply bg-accent-500/20 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }
    .badge-warning { @apply bg-warning-500/15 text-warning-700 dark:text-warning-500; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-line-strong; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }
    .btn-ai      { @apply border border-accent-500/50 bg-accent-500/10 text-yellow-900 hover:bg-accent-500/20 dark:text-accent-500; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-4 py-2.5 text-start text-sm font-medium text-ink transition-colors hover:bg-soft; }
    .combo-option.is-active   { @apply bg-soft; }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }
    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- النافذة المنبثقة / اللوحة الجانبية ---------- */
    .modal-panel { @apply relative flex max-h-[90dvh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }

    /* ---------- بطاقة المفهوم / نوع السؤال (Icon Chip) ---------- */
    .course-icon { @apply grid h-12 w-12 shrink-0 place-items-center rounded-xl text-lg; }

    /* ---------- شريط الإجراءات الثابت (Sticky Action Bar) ---------- */
    .sticky-actions { @apply sticky z-20 border-line bg-card/95 backdrop-blur-md; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }

    /* ---------- [layout: full-height sidebar + bottom footer] ---------- */
    html, body { min-height: 100%; }
    body { margin: 0; }
    .app-col { min-height: 100vh; min-height: 100dvh; }
    @media (min-width: 1024px) {
      #sidebar { height: 100vh; height: 100dvh; }
      .app-col { margin-inline-start: 18rem; transition: margin-inline-start .3s ease; }
      .app-col.is-collapsed { margin-inline-start: 5rem; }
      .save-bar { inset-inline-start: 18rem; transition: inset-inline-start .3s ease; }
      .save-bar.is-collapsed { inset-inline-start: 5rem; }
    }
</style>

<!-- ⑥ Alpine.js (+ Focus لحصر التركيز داخل النوافذ المنبثقة) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- ⑦ SweetAlert2 -->
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5"></script>
</head>

<body x-data="quizBuilder()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch.focus(); }"
      @scroll.window="notifOpen = false" @resize.window="notifOpen = false"
      :class="{ 'overflow-hidden': (mobileNav && mobile) || aiOpen || publishOpen }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<!-- منطقة الإعلانات الحية (قارئات الشاشة) -->
<p class="sr-only" aria-live="polite" aria-atomic="true" x-text="liveMsg"></p>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <span class="inline-flex min-w-0 flex-1 items-center gap-3" :class="!expanded && 'lg:flex-none lg:justify-center'">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </span>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-muted" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="item.count && expanded"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent"
                        x-text="fmtNum(item.count)"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="app-col flex min-w-0 flex-1 flex-col" :class="collapsed && 'is-collapsed'">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex"><bdi dir="ltr">Ctrl K</bdi></kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-haspopup="true" :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="notifText(n)"></p>
                      <p class="text-xs text-muted"><time :datetime="n.at" x-text="relTime(n.at)"></time></p>
                    </div>
                  </li>
                </template>
              </ul>
              <div class="border-t border-line p-2">
                <a href="../common/notifications.html" class="menu-item justify-center text-brand" @click="notifOpen = false">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  <span x-text="t('viewAllNotif')"></span>
                </a>
              </div>
            </div>
          </div>

          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" class="flex max-w-[14rem] items-center gap-2 rounded-xl p-1 transition hover:bg-soft focus-visible:ring-2 md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    aria-haspopup="menu" :aria-expanded="profileOpen.toString()" aria-controls="profile-menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true" x-text="loc(teacher.initials)"></span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="loc(teacher.name)"></span>
                <span class="block truncate text-xs text-muted" x-text="t('roleTeacher')"></span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted md:block" aria-hidden="true"></i>
            </button>
            <div id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-56" role="menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <a href="../common/profile.html" role="menuitem" class="menu-item"><i class="fa-regular fa-user w-4 text-muted" aria-hidden="true"></i> <span x-text="t('profile')"></span></a>
              <div class="border-t border-line"></div>
              <a href="../auth/login.html" role="menuitem" class="menu-item !text-danger" @click="guardLeave($event, '../auth/login.html')"><i class="fa-solid fa-arrow-right-from-bracket w-4" aria-hidden="true"></i> <span x-text="t('logout')"></span></a>
            </div>
          </div>
        </div>
      </div>

      <!-- زبدة الخبز (Breadcrumb) -->
      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="locale === 'ar' ? 'مسار التنقل' : 'Breadcrumb'">
          <ol class="flex items-center gap-2" role="list">
            <li><a href="teacher-dashboard.html" class="hover:text-brand hover:underline" @click="guardLeave($event, 'teacher-dashboard.html')" x-text="t('breadcrumb.portal')"></a></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li><a href="quizzes.html" class="hover:text-brand hover:underline" @click="guardLeave($event, 'quizzes.html')" x-text="t('breadcrumb.quizzes')"></a></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li class="text-ink" aria-current="page" x-text="t('qb.breadcrumbCurrent')"></li>
          </ol>
        </nav>
      </div>
    </header>

    <!-- ================= شريط الإجراءات الثابت (العلوي — سطح المكتب فقط) ================= -->
    <div x-show="!loadError" class="sticky-actions top-[var(--topbar-h)] hidden border-b lg:block lg:top-[calc(var(--topbar-h)+2rem)]">
      <div class="mx-auto flex w-full max-w-[1400px] flex-wrap items-center justify-between gap-3 px-3 py-3 sm:px-6 lg:px-8">
        <div class="min-w-0">
          <p class="truncate text-sm font-extrabold text-ink" x-text="(locale === 'en' ? (form.titleEn || form.titleAr) : (form.titleAr || form.titleEn)) || t('qb.untitled')"></p>
          <p class="flex flex-wrap items-center gap-1.5 text-xs text-muted">
            <span class="badge" :class="statusMeta(status).cls"><i class="fa-solid text-[9px]" :class="statusMeta(status).icon" aria-hidden="true"></i> <span x-text="t('qb.status.' + status)"></span></span>
            <span x-show="quizCode"><bdi dir="ltr" class="font-bold" x-text="quizCode"></bdi></span>
            <span aria-hidden="true">·</span>
            <span x-text="lastSavedLabel"></span>
            <span x-show="saveIndicator" aria-hidden="true">·</span>
            <span class="font-bold" :class="dirty ? 'text-warning-700 dark:text-warning-500' : 'text-success-700 dark:text-success-500'" x-text="saveIndicator"></span>
          </p>
        </div>
        <div class="flex flex-wrap items-center gap-2.5">
          <a href="quizzes.html" class="btn btn-outline" @click="guardLeave($event, 'quizzes.html')">
            <i class="fa-solid fa-arrow-left rtl:-scale-x-100" aria-hidden="true"></i>
            <span x-text="t('qb.actCancel')"></span>
          </a>
          <button type="button" class="btn btn-outline" @click="saveDraft()" :disabled="savingDraft || publishing" :aria-busy="savingDraft.toString()">
            <i class="fa-solid animate-spin fa-circle-notch" x-show="savingDraft" aria-hidden="true"></i>
            <i class="fa-regular fa-floppy-disk" x-show="!savingDraft" aria-hidden="true"></i>
            <span x-text="status === 'draft' ? t('qb.actSaveDraft') : t('qb.actSaveChanges')"></span>
          </button>
          <button type="button" class="btn btn-outline" @click="previewQuiz()">
            <i class="fa-regular fa-eye" aria-hidden="true"></i>
            <span x-text="t('qb.actPreview')"></span>
          </button>
          <button type="button" class="btn btn-accent" @click="requestPublish()" :disabled="publishing || savingDraft" :aria-busy="publishing.toString()">
            <i class="fa-solid animate-spin fa-circle-notch" x-show="publishing" aria-hidden="true"></i>
            <i class="fa-solid fa-paper-plane" x-show="!publishing" aria-hidden="true"></i>
            <span x-text="t('qb.actPublish')"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- ================= المحتوى الرئيسي — منشئ الاختبارات ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-6 px-3 py-4 focus:outline-none sm:p-6 lg:p-8"
          style="padding-bottom: max(10rem, env(safe-area-inset-bottom, 0px));">

      <!-- ===== حالة: رمز غير معروف ===== -->
      <template x-if="loadError">
        <section class="panel mx-auto max-w-xl p-6 text-center sm:p-8" aria-labelledby="nf-title">
          <span class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-2xl bg-error-500/10 text-2xl text-danger" aria-hidden="true"><i class="fa-solid fa-file-circle-xmark"></i></span>
          <h1 id="nf-title" class="text-xl font-extrabold text-ink" x-text="t('qb.notFoundTitle')"></h1>
          <p class="mt-2 text-sm leading-6 text-muted">
            <span x-text="tf('qb.notFoundText', { code: '⁨' + loadError.code + '⁩' })"></span>
          </p>
          <div class="mt-5 flex flex-wrap items-center justify-center gap-2.5">
            <a href="quizzes.html" class="btn btn-primary"><i class="fa-solid fa-arrow-left rtl:-scale-x-100" aria-hidden="true"></i> <span x-text="t('qb.notFoundBack')"></span></a>
            <a href="quiz-builder.html" class="btn btn-outline"><i class="fa-solid fa-plus" aria-hidden="true"></i> <span x-text="t('qb.notFoundNew')"></span></a>
          </div>
        </section>
      </template>

      <template x-if="!loadError">
      <div class="space-y-6">

      <!-- العنوان -->
      <section class="min-w-0">
        <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="isNew ? t('qb.title') : t('qb.titleEdit')"></h1>
        <p class="mt-1 max-w-2xl text-sm text-muted sm:text-base" x-text="isNew ? t('qb.subtitle') : t('qb.subtitleEdit')"></p>
        <p class="mt-2 flex flex-wrap items-center gap-2 text-xs text-muted">
          <span class="font-bold" x-text="t('qb.codeLabel') + ':'"></span>
          <span class="text-start" x-show="quizCode"><bdi dir="ltr" class="font-bold text-ink" x-text="quizCode"></bdi></span>
          <span x-show="!quizCode" x-text="t('qb.codePending')"></span>
        </p>
      </section>

      <!-- نجاح النشر -->
      <div x-show="published" x-cloak class="panel flex flex-wrap items-start justify-between gap-3 border-success-500/40 bg-success-500/10 p-4" role="status">
        <p class="flex min-w-0 items-start gap-2 text-sm font-bold text-success-700 dark:text-success-500">
          <i class="fa-solid fa-circle-check mt-1" aria-hidden="true"></i>
          <span x-text="publishedText"></span>
        </p>
        <div class="flex items-center gap-2">
          <a href="quizzes.html" class="btn btn-sm btn-primary"><i class="fa-solid fa-list-check" aria-hidden="true"></i> <span x-text="t('qb.goQuizzes')"></span></a>
          <button type="button" class="act" @click="published = null" :aria-label="t('qb.dismiss')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
      </div>

      <!-- تنبيه: محاولات مسجّلة -->
      <p x-show="attemptsCount > 0" class="flex items-start gap-2 rounded-xl border border-warning-500/40 bg-warning-500/10 p-3.5 text-sm font-bold text-warning-800 dark:text-warning-500">
        <i class="fa-solid fa-triangle-exclamation mt-1" aria-hidden="true"></i>
        <span x-text="tf('qb.attemptsWarn', { n: fmtNum(attemptsCount) })"></span>
      </p>

      <!-- ملخص الأخطاء -->
      <div x-show="errorList.length" x-cloak id="qb-error-summary" tabindex="-1" role="alert" aria-labelledby="qb-error-summary-title"
           class="panel border-error-600/50 bg-error-500/5 p-4 focus:outline-none sm:p-5">
        <h2 id="qb-error-summary-title" class="flex items-center gap-2 text-sm font-extrabold text-danger">
          <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
          <span x-text="tf('qb.errSummaryTitle', { n: fmtNum(errorList.length) })"></span>
        </h2>
        <ul class="mt-2 list-disc space-y-1 ps-6 text-sm" role="list">
          <template x-for="(e, ei) in errorList" :key="e.id + '-' + ei">
            <li><a :href="'#' + e.focus" class="font-bold text-danger underline underline-offset-2 hover:no-underline" @click.prevent="gotoError(e)" x-text="e.msg"></a></li>
          </template>
        </ul>
      </div>

      <!-- ================= Section 1: بيانات الاختبار الأساسية ================= -->
      <section class="panel p-5 sm:p-6" aria-labelledby="section1-title">
        <div class="mb-5 flex items-center gap-3">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-primary-500/10 text-brand" aria-hidden="true"><i class="fa-solid fa-circle-info"></i></span>
          <div class="min-w-0">
            <h2 id="section1-title" class="text-lg font-extrabold text-ink" x-text="t('qb.section1Title')"></h2>
            <p class="text-xs text-muted sm:text-sm" x-text="t('qb.section1Sub')"></p>
          </div>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label for="qb-title-ar" class="label" x-text="t('qb.fieldTitleAr')"></label>
            <input id="qb-title-ar" type="text" lang="ar" dir="rtl" x-model="form.titleAr" class="field" :placeholder="t('qb.fieldTitleArPh')"
                   :aria-invalid="invalid('qb-title-ar')" :aria-describedby="describedBy('qb-title-ar')">
            <p id="qb-title-ar-err" class="err" role="alert" x-show="err('qb-title-ar')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('qb-title-ar')"></span></p>
          </div>
          <div>
            <label for="qb-title-en" class="label" x-text="t('qb.fieldTitleEn')"></label>
            <input id="qb-title-en" type="text" lang="en" dir="ltr" x-model="form.titleEn" class="field" :placeholder="t('qb.fieldTitleEnPh')"
                   :aria-invalid="invalid('qb-title-en')" :aria-describedby="describedBy('qb-title-en')">
            <p id="qb-title-en-err" class="err" role="alert" x-show="err('qb-title-en')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('qb-title-en')"></span></p>
          </div>
        </div>

        <fieldset class="mt-4">
          <legend class="label mb-2" x-text="t('qb.fieldHierarchy')"></legend>
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
            <!-- المقرر -->
            <div class="relative"
                 x-data="selectDropdown({ id: 'qb-course', options: () => courseOptions, get: () => form.courseId, set: (v) => setCourse(v), placeholder: () => t('qb.selectCourse') })"
                 @click.outside="closeList()">
              <span id="qb-course-label" class="mb-1 block text-xs font-bold text-muted" x-text="t('qb.fieldCourse')"></span>
              <button type="button" id="qb-course" x-ref="btn" role="combobox" aria-haspopup="listbox"
                      :aria-expanded="open.toString()" aria-controls="qb-course-list" aria-labelledby="qb-course-label qb-course"
                      :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                      :aria-invalid="invalid('qb-course')" :aria-describedby="describedBy('qb-course')"
                      class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                      @click="toggleList()" @keydown="onKey($event)">
                <span class="truncate" x-text="triggerLabel"></span>
                <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
              </button>
              <ul x-show="open" x-cloak x-ref="list" id="qb-course-list" role="listbox" aria-labelledby="qb-course-label"
                  x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                <template x-for="(item, idx) in items" :key="item.value">
                  <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                      class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                      @click="choose(item)" @mousemove="active = idx">
                    <span class="truncate" x-text="item.label"></span>
                    <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                  </li>
                </template>
              </ul>
              <p id="qb-course-err" class="err" role="alert" x-show="err('qb-course')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('qb-course')"></span></p>
            </div>

            <!-- الوحدة -->
            <div class="relative"
                 x-data="selectDropdown({ id: 'qb-unit', options: () => unitOptions, get: () => form.unitId, set: (v) => setUnit(v), placeholder: () => t('qb.selectUnit') })"
                 @click.outside="closeList()">
              <span id="qb-unit-label" class="mb-1 block text-xs font-bold text-muted" x-text="t('qb.fieldUnit')"></span>
              <button type="button" id="qb-unit" x-ref="btn" role="combobox" aria-haspopup="listbox"
                      :aria-expanded="open.toString()" aria-controls="qb-unit-list" aria-labelledby="qb-unit-label qb-unit"
                      :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                      :aria-invalid="invalid('qb-unit')" :aria-describedby="describedBy('qb-unit')"
                      :disabled="!form.courseId"
                      class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                      @click="toggleList()" @keydown="onKey($event)">
                <span class="truncate" x-text="triggerLabel"></span>
                <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
              </button>
              <ul x-show="open" x-cloak x-ref="list" id="qb-unit-list" role="listbox" aria-labelledby="qb-unit-label"
                  x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                <template x-for="(item, idx) in items" :key="item.value">
                  <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                      class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                      @click="choose(item)" @mousemove="active = idx">
                    <span class="truncate" x-text="item.label"></span>
                    <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                  </li>
                </template>
              </ul>
              <p id="qb-unit-err" class="err" role="alert" x-show="err('qb-unit')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('qb-unit')"></span></p>
            </div>

            <!-- الدرس -->
            <div class="relative"
                 x-data="selectDropdown({ id: 'qb-lesson', options: () => lessonOptions, get: () => form.lessonId, set: (v) => form.lessonId = v })"
                 @click.outside="closeList()">
              <span id="qb-lesson-label" class="mb-1 block text-xs font-bold text-muted" x-text="t('qb.fieldLesson')"></span>
              <button type="button" id="qb-lesson" x-ref="btn" role="combobox" aria-haspopup="listbox"
                      :aria-expanded="open.toString()" aria-controls="qb-lesson-list" aria-labelledby="qb-lesson-label qb-lesson"
                      :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                      :disabled="!form.unitId"
                      class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                      @click="toggleList()" @keydown="onKey($event)">
                <span class="truncate" x-text="triggerLabel"></span>
                <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
              </button>
              <ul x-show="open" x-cloak x-ref="list" id="qb-lesson-list" role="listbox" aria-labelledby="qb-lesson-label"
                  x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                <template x-for="(item, idx) in items" :key="item.value">
                  <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                      class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                      @click="choose(item)" @mousemove="active = idx">
                    <span class="truncate" x-text="item.label"></span>
                    <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                  </li>
                </template>
              </ul>
            </div>
          </div>
          <p class="hint" x-text="t('qb.fieldHierarchyHint')"></p>
        </fieldset>

        <fieldset class="mt-4">
          <legend class="label mb-2" x-text="t('qb.fieldQuizType')"></legend>
          <div class="grid grid-cols-3 gap-2">
            <template x-for="qt in quizTypes" :key="qt">
              <label class="flex cursor-pointer items-center justify-center gap-2 rounded-lg border border-line-strong px-3 py-2.5 text-sm font-bold transition hover:border-primary-500 has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-brand"
                     :class="form.type === qt && 'border-primary-700 bg-soft text-brand'">
                <input type="radio" name="qb-quiz-type" :value="qt" x-model="form.type" class="sr-only">
                <i class="fa-solid fa-check text-xs" x-show="form.type === qt" aria-hidden="true"></i>
                <span x-text="t('qb.quizType.' + qt)"></span>
              </label>
            </template>
          </div>
        </fieldset>

        <fieldset class="mt-4">
          <legend class="label" x-text="t('qb.fieldInstructions')"></legend>
          <label class="mb-3 flex items-start gap-2 text-sm font-bold text-ink">
            <input type="checkbox" class="mt-0.5 h-4 w-4 shrink-0 accent-primary-500" :checked="form.instrAuto" @change="setInstrAuto($event.target.checked)">
            <span x-text="t('qb.instrAuto')"></span>
          </label>
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
              <label for="qb-instr-ar" class="label" x-text="t('qb.instrAr')"></label>
              <textarea id="qb-instr-ar" rows="3" lang="ar" dir="rtl" class="field resize-y" :readonly="form.instrAuto" :class="form.instrAuto && 'bg-soft'"
                        :value="instrValue('ar')" @input="form.instructions.ar = $event.target.value" aria-describedby="qb-instr-hint"></textarea>
            </div>
            <div>
              <label for="qb-instr-en" class="label" x-text="t('qb.instrEn')"></label>
              <textarea id="qb-instr-en" rows="3" lang="en" dir="ltr" class="field resize-y" :readonly="form.instrAuto" :class="form.instrAuto && 'bg-soft'"
                        :value="instrValue('en')" @input="form.instructions.en = $event.target.value" aria-describedby="qb-instr-hint"></textarea>
            </div>
          </div>
          <p id="qb-instr-hint" class="hint" x-text="t('qb.fieldInstructionsHint')"></p>
        </fieldset>
      </section>

      <!-- ================= Section 1-ب: الإعدادات والنافذة الزمنية ================= -->
      <section class="panel p-5 sm:p-6" aria-labelledby="section-settings-title">
        <div class="mb-5 flex items-center gap-3">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-primary-500/10 text-brand" aria-hidden="true"><i class="fa-solid fa-sliders"></i></span>
          <div class="min-w-0">
            <h2 id="section-settings-title" class="text-lg font-extrabold text-ink" x-text="t('qb.sectionSettingsTitle')"></h2>
            <p class="text-xs text-muted sm:text-sm" x-text="t('qb.sectionSettingsSub')"></p>
          </div>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
          <div>
            <label for="qb-duration" class="label" x-text="t('qb.fieldDuration')"></label>
            <div class="relative">
              <input id="qb-duration" type="number" inputmode="numeric" min="1" max="600" step="1" x-model.number="form.durationMin" class="field pe-16"
                     :aria-invalid="invalid('qb-duration')" :aria-describedby="describedBy('qb-duration')">
              <span class="pointer-events-none absolute inset-y-0 end-3.5 flex items-center text-xs font-bold text-muted" aria-hidden="true" x-text="t('qb.minutesSuffix')"></span>
            </div>
            <p id="qb-duration-err" class="err" role="alert" x-show="err('qb-duration')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('qb-duration')"></span></p>
          </div>
          <div>
            <label for="qb-attempts" class="label" x-text="t('qb.fieldAttempts')"></label>
            <input id="qb-attempts" type="number" inputmode="numeric" min="1" max="10" step="1" x-model.number="form.attemptsAllowed" class="field"
                   :aria-invalid="invalid('qb-attempts')" :aria-describedby="describedBy('qb-attempts')">
            <p id="qb-attempts-err" class="err" role="alert" x-show="err('qb-attempts')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('qb-attempts')"></span></p>
          </div>
          <div>
            <label for="qb-pass" class="label" x-text="t('qb.fieldPassMark')"></label>
            <div class="relative">
              <input id="qb-pass" type="number" inputmode="numeric" min="1" max="100" step="1" x-model.number="form.passMark" class="field pe-10"
                     :aria-invalid="invalid('qb-pass')" :aria-describedby="describedBy('qb-pass', 'qb-pass-hint')">
              <span class="pointer-events-none absolute inset-y-0 end-3.5 flex items-center text-xs font-bold text-muted" aria-hidden="true">%</span>
            </div>
            <p id="qb-pass-hint" class="hint" x-text="t('qb.passMarkHint')"></p>
            <p id="qb-pass-err" class="err" role="alert" x-show="err('qb-pass')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('qb-pass')"></span></p>
          </div>
          <div>
            <label for="qb-total-marks" class="label" x-text="t('qb.fieldTotalMarks')"></label>
            <output id="qb-total-marks" class="field block bg-soft font-extrabold tabular-nums" aria-describedby="qb-total-hint" x-text="fmtNum(totalMarks)"></output>
            <p id="qb-total-hint" class="hint" x-text="t('qb.totalMarksHint')"></p>
          </div>
        </div>

        <div class="mt-4 grid grid-cols-1 gap-4 lg:grid-cols-2">
          <fieldset>
            <legend class="label" x-text="t('qb.fieldShuffle')"></legend>
            <div class="space-y-2">
              <label class="flex items-center gap-2 text-sm font-bold text-ink">
                <input type="checkbox" x-model="form.shuffleQuestions" class="h-4 w-4 shrink-0 accent-primary-500">
                <span x-text="t('qb.fieldShuffleQ')"></span>
              </label>
              <label class="flex items-center gap-2 text-sm font-bold text-ink">
                <input type="checkbox" x-model="form.shuffleOptions" class="h-4 w-4 shrink-0 accent-primary-500">
                <span x-text="t('qb.fieldShuffleO')"></span>
              </label>
            </div>
          </fieldset>
          <fieldset>
            <legend class="label" x-text="t('qb.fieldShowResults')"></legend>
            <div class="space-y-2">
              <template x-for="rp in resultPolicies" :key="rp">
                <label class="flex items-center gap-2 text-sm font-bold text-ink">
                  <input type="radio" name="qb-show-results" :value="rp" x-model="form.showResults" class="h-4 w-4 shrink-0 accent-primary-500">
                  <span x-text="t('qb.showResults.' + rp)"></span>
                </label>
              </template>
            </div>
          </fieldset>
        </div>

        <fieldset class="mt-4">
          <legend class="label" x-text="t('qb.fieldWindow')"></legend>
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
              <label for="qb-opens" class="label" x-text="t('qb.fieldOpens')"></label>
              <input id="qb-opens" type="datetime-local" x-model="form.opensAt" class="field"
                     :aria-invalid="invalid('qb-opens')" :aria-describedby="describedBy('qb-opens', 'qb-tz-hint qb-opens-hint')">
              <p id="qb-opens-hint" class="hint" x-text="t('qb.opensHint')"></p>
              <p id="qb-opens-err" class="err" role="alert" x-show="err('qb-opens')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('qb-opens')"></span></p>
            </div>
            <div>
              <label for="qb-closes" class="label" x-text="t('qb.fieldCloses')"></label>
              <input id="qb-closes" type="datetime-local" x-model="form.closesAt" class="field"
                     :aria-invalid="invalid('qb-closes')" :aria-describedby="describedBy('qb-closes', 'qb-tz-hint')">
              <p id="qb-closes-err" class="err" role="alert" x-show="err('qb-closes')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('qb-closes')"></span></p>
            </div>
          </div>
          <p id="qb-tz-hint" class="hint flex items-center gap-1.5">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span x-text="t('qb.tzLabel')"></span>
            <span class="text-start">(<bdi dir="ltr">Asia/Gaza</bdi>)</span>
          </p>
        </fieldset>
      </section>

      <!-- ================= Section 2: توليد الأسئلة بالذكاء الاصطناعي ================= -->
      <section class="panel overflow-hidden border-accent-500/40 bg-gradient-to-br from-accent-500/10 via-card to-card p-5 sm:p-6" aria-labelledby="section2-title">
        <div class="flex flex-col items-start justify-between gap-4 sm:flex-row sm:items-center">
          <div class="flex min-w-0 items-start gap-3">
            <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-accent-500/20 text-xl text-yellow-900 dark:text-accent-500" aria-hidden="true"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
            <div class="min-w-0">
              <h2 id="section2-title" class="text-lg font-extrabold text-ink" x-text="t('qb.section2Title')"></h2>
              <p class="mt-0.5 max-w-xl text-xs text-muted sm:text-sm" x-text="t('qb.section2Sub')"></p>
            </div>
          </div>
          <button type="button" id="qb-ai-open" class="btn btn-ai shrink-0" @click="openAi()" aria-haspopup="dialog">
            <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
            <span x-text="t('qb.aiGenerateBtn')"></span>
          </button>
        </div>
      </section>

      <!-- ================= Section 3: قائمة أسئلة الاختبار ================= -->
      <section id="qb-questions" aria-labelledby="section3-title" tabindex="-1" class="focus:outline-none">
        <div class="mb-4 flex flex-col gap-3 lg:flex-row lg:items-end lg:justify-between">
          <div class="min-w-0">
            <h2 id="section3-title" class="text-lg font-extrabold text-ink" x-text="t('qb.section3Title')"></h2>
            <p class="text-xs text-muted sm:text-sm" x-text="t('qb.section3Sub')"></p>
            <p class="mt-1 text-sm font-bold text-brand" x-text="tf('qb.questionsSummary', { n: fmtNum(questions.length), m: fmtNum(totalMarks) })"></p>
          </div>
          <div class="flex flex-wrap items-center gap-2" role="group" :aria-label="t('qb.addGroup')">
            <template x-for="ty in types" :key="ty">
              <button type="button" :id="'qb-add-' + ty" class="btn btn-outline btn-sm" @click="addQuestion(ty)" :aria-label="tf('qb.addAs', { type: t('qb.type.' + ty) })">
                <i class="fa-solid fa-plus" aria-hidden="true"></i>
                <span x-text="t('qb.type.' + ty)"></span>
              </button>
            </template>
          </div>
        </div>
        <p id="qb-questions-err" class="err mb-3" role="alert" x-show="err('qb-questions')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('qb-questions')"></span></p>

        <!-- حالة فارغة -->
        <div x-show="!questions.length" class="panel grid place-items-center gap-2 border-dashed p-8 text-center">
          <span class="grid h-12 w-12 place-items-center rounded-2xl bg-primary-500/10 text-xl text-brand" aria-hidden="true"><i class="fa-solid fa-list-check"></i></span>
          <p class="font-extrabold text-ink" x-text="t('qb.emptyTitle')"></p>
          <p class="max-w-md text-sm text-muted" x-text="t('qb.emptyText')"></p>
        </div>

        <ol class="space-y-4" role="list">
          <template x-for="(q, qi) in questions" :key="q.uid">
            <li>
            <article class="panel p-5" :id="'q-' + q.uid" :aria-labelledby="'q-' + q.uid + '-label'">
              <header class="mb-4 flex flex-wrap items-start justify-between gap-3 border-b border-line pb-4">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-primary-500/10 text-sm font-extrabold text-brand" aria-hidden="true" x-text="fmtNum(qi + 1)"></span>
                  <h3 :id="'q-' + q.uid + '-label'" class="sr-only" x-text="tf('qb.questionN', { n: fmtNum(qi + 1) })"></h3>
                  <span class="badge" :class="typeCls(q.type)" x-text="t('qb.type.' + q.type)"></span>
                  <span class="badge" :class="bloomCls(q.bloom)" x-text="t('qb.bloom.' + q.bloom)"></span>
                  <span class="badge" :class="diffCls(q.difficulty)" x-text="t('qb.diff.' + q.difficulty)"></span>
                  <span class="badge badge-accent" x-show="q.aiDraft"><i class="fa-solid fa-wand-magic-sparkles text-[10px]" aria-hidden="true"></i> <span x-text="t('qb.aiDraftBadge')"></span></span>
                </div>
                <div class="flex items-center gap-1.5">
                  <button type="button" :id="'q-' + q.uid + '-up'" class="act group relative disabled:cursor-not-allowed disabled:opacity-40" @click="moveQuestion(qi, -1)" :disabled="qi === 0" :aria-label="tf('qb.moveUpAria', { n: fmtNum(qi + 1) })"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('qb.actMoveUp')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                  <button type="button" :id="'q-' + q.uid + '-down'" class="act group relative disabled:cursor-not-allowed disabled:opacity-40" @click="moveQuestion(qi, 1)" :disabled="qi === questions.length - 1" :aria-label="tf('qb.moveDownAria', { n: fmtNum(qi + 1) })"><i class="fa-solid fa-arrow-down" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('qb.actMoveDown')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                  <button type="button" :id="'q-' + q.uid + '-dup'" class="act group relative" @click="duplicateQuestion(qi)" :aria-label="tf('qb.duplicateAria', { n: fmtNum(qi + 1) })"><i class="fa-solid fa-copy" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('qb.actDuplicate')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                  <button type="button" :id="'q-' + q.uid + '-delete'" class="act group relative !text-danger hover:!bg-error-500/10" @click="deleteQuestion(qi)" :aria-label="tf('qb.deleteAria', { n: fmtNum(qi + 1) })"><i class="fa-solid fa-trash" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('qb.actDelete')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                </div>
              </header>

              <div class="grid grid-cols-1 gap-4 lg:grid-cols-[1fr_1fr_11rem]">
                <div>
                  <label :for="'q-' + q.uid + '-text-ar'" class="label" x-text="t('qb.qTextAr')"></label>
                  <textarea :id="'q-' + q.uid + '-text-ar'" rows="2" lang="ar" dir="rtl" class="field resize-y" x-model="q.text.ar"
                            :aria-invalid="invalid('q-' + q.uid + '-text-ar')" :aria-describedby="describedBy('q-' + q.uid + '-text-ar')"></textarea>
                  <p :id="'q-' + q.uid + '-text-ar-err'" class="err" role="alert" x-show="err('q-' + q.uid + '-text-ar')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('q-' + q.uid + '-text-ar')"></span></p>
                </div>
                <div>
                  <label :for="'q-' + q.uid + '-text-en'" class="label" x-text="t('qb.qTextEn')"></label>
                  <textarea :id="'q-' + q.uid + '-text-en'" rows="2" lang="en" dir="ltr" class="field resize-y" x-model="q.text.en"
                            :aria-invalid="invalid('q-' + q.uid + '-text-en')" :aria-describedby="describedBy('q-' + q.uid + '-text-en')"></textarea>
                  <p :id="'q-' + q.uid + '-text-en-err'" class="err" role="alert" x-show="err('q-' + q.uid + '-text-en')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('q-' + q.uid + '-text-en')"></span></p>
                </div>
                <div class="relative"
                     x-data="selectDropdown({ id: 'q-' + q.uid + '-type', options: () => typeOptions, get: () => q.type, set: (v) => changeType(q, v) })"
                     @click.outside="closeList()">
                  <span :id="'q-' + q.uid + '-type-label'" class="label" x-text="t('qb.qTypeLabel')"></span>
                  <button type="button" :id="'q-' + q.uid + '-type'" x-ref="btn" role="combobox" aria-haspopup="listbox"
                          :aria-expanded="open.toString()" :aria-controls="'q-' + q.uid + '-type-list'"
                          :aria-labelledby="'q-' + q.uid + '-label q-' + q.uid + '-type-label q-' + q.uid + '-type'"
                          :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                          class="field flex w-full items-center justify-between gap-2 text-start"
                          @click="toggleList()" @keydown="onKey($event)">
                    <span class="truncate" x-text="triggerLabel"></span>
                    <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
                  </button>
                  <ul x-show="open" x-cloak x-ref="list" :id="'q-' + q.uid + '-type-list'" role="listbox" :aria-labelledby="'q-' + q.uid + '-type-label'"
                      x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                    <template x-for="(item, idx) in items" :key="item.value">
                      <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                          class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                          @click="choose(item)" @mousemove="active = idx">
                        <span class="truncate" x-text="item.label"></span>
                        <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                      </li>
                    </template>
                  </ul>
                </div>
              </div>

              <!-- خيارات الاختيار من متعدد -->
              <template x-if="q.type === 'mcq'">
                <fieldset class="mt-4" :aria-invalid="invalid('q-' + q.uid + '-correct')" :aria-describedby="describedBy('q-' + q.uid + '-correct')">
                  <legend class="label mb-2" x-text="t('qb.optionsLegend')"></legend>
                  <ul class="space-y-2" role="list">
                    <template x-for="(o, oi) in q.options" :key="o.uid">
                      <li class="flex flex-wrap items-center gap-x-3 gap-y-2 rounded-lg border px-3.5 py-2.5 transition-colors"
                          :class="o.correct ? 'border-success-500/60 bg-success-50 dark:bg-success-500/10' : 'border-line-strong/60'">
                        <input type="radio" :id="'q-' + q.uid + '-opt-' + o.uid + '-radio'" :name="'q-' + q.uid + '-correct'" :checked="o.correct" @change="setCorrect(q, oi)"
                               class="h-4 w-4 shrink-0 accent-success-500" :aria-label="tf('qb.optCorrectAria', { n: fmtNum(oi + 1), m: fmtNum(qi + 1) })">
                        <input type="text" :id="'q-' + q.uid + '-opt-' + o.uid + '-ar'" lang="ar" dir="rtl" x-model="o.text.ar" :placeholder="t('qb.optPhAr')"
                               class="field min-w-[9rem] flex-1 py-1.5"
                               :aria-label="tf('qb.optAria', { n: fmtNum(oi + 1), m: fmtNum(qi + 1) }) + ' — ' + t('qb.langAr')"
                               :aria-invalid="invalid('q-' + q.uid + '-opt-' + o.uid + '-ar')" :aria-describedby="describedBy('q-' + q.uid + '-opt-' + o.uid + '-ar')">
                        <input type="text" :id="'q-' + q.uid + '-opt-' + o.uid + '-en'" lang="en" dir="ltr" x-model="o.text.en" :placeholder="t('qb.optPhEn')"
                               class="field min-w-[9rem] flex-1 py-1.5"
                               :aria-label="tf('qb.optAria', { n: fmtNum(oi + 1), m: fmtNum(qi + 1) }) + ' — ' + t('qb.langEn')">
                        <span class="badge badge-success shrink-0" x-show="o.correct"><i class="fa-solid fa-check text-[10px]" aria-hidden="true"></i> <span x-text="t('qb.correctAnswer')"></span></span>
                        <button type="button" class="act shrink-0 disabled:cursor-not-allowed disabled:opacity-40" @click="removeOption(q, oi)" :disabled="q.options.length <= OPT_MIN"
                                :aria-label="tf('qb.removeOptAria', { n: fmtNum(oi + 1), m: fmtNum(qi + 1) })" :title="t('qb.removeOpt')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
                        <p :id="'q-' + q.uid + '-opt-' + o.uid + '-ar-err'" class="err w-full" role="alert" x-show="err('q-' + q.uid + '-opt-' + o.uid + '-ar')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('q-' + q.uid + '-opt-' + o.uid + '-ar')"></span></p>
                      </li>
                    </template>
                  </ul>
                  <div class="mt-3 flex flex-wrap items-center gap-3">
                    <button type="button" :id="'q-' + q.uid + '-add-opt'" class="btn btn-outline btn-sm" @click="addOption(q)" :disabled="q.options.length >= OPT_MAX">
                      <i class="fa-solid fa-plus" aria-hidden="true"></i> <span x-text="t('qb.addOption')"></span>
                    </button>
                    <span class="text-xs text-muted" x-text="tf('qb.optionsCount', { n: fmtNum(q.options.length), max: fmtNum(OPT_MAX) })"></span>
                  </div>
                  <p :id="'q-' + q.uid + '-correct-err'" class="err" role="alert" x-show="err('q-' + q.uid + '-correct')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('q-' + q.uid + '-correct')"></span></p>
                </fieldset>
              </template>

              <!-- صح / خطأ -->
              <template x-if="q.type === 'tf'">
                <fieldset class="mt-4" :aria-invalid="invalid('q-' + q.uid + '-correct')" :aria-describedby="describedBy('q-' + q.uid + '-correct')">
                  <legend class="label mb-2" x-text="t('qb.tfLegend')"></legend>
                  <div class="grid grid-cols-2 gap-2">
                    <template x-for="(o, oi) in q.options" :key="o.uid">
                      <label class="flex cursor-pointer items-center justify-center gap-2 rounded-lg border px-3.5 py-2.5 font-bold transition-colors"
                             :class="o.correct ? 'border-success-500/60 bg-success-50 dark:bg-success-500/10' : 'border-line-strong/60'">
                        <input type="radio" :id="'q-' + q.uid + '-opt-' + o.uid + '-radio'" :name="'q-' + q.uid + '-correct'" :checked="o.correct" @change="setCorrect(q, oi)" class="h-4 w-4 accent-success-500">
                        <span x-text="loc(o.text)"></span>
                        <i class="fa-solid fa-check text-xs text-success-700 dark:text-success-500" x-show="o.correct" aria-hidden="true"></i>
                      </label>
                    </template>
                  </div>
                  <p :id="'q-' + q.uid + '-correct-err'" class="err" role="alert" x-show="err('q-' + q.uid + '-correct')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('q-' + q.uid + '-correct')"></span></p>
                </fieldset>
              </template>

              <!-- مقالي / إجابة قصيرة -->
              <template x-if="q.type === 'essay' || q.type === 'short'">
                <div class="mt-4">
                  <p class="rounded-xl border border-dashed border-line-strong/50 bg-page/50 p-3.5 text-xs leading-6 text-muted">
                    <i class="fa-solid fa-circle-info ms-1" aria-hidden="true"></i>
                    <span x-text="q.type === 'essay' ? t('qb.essayNote') : t('qb.shortNote')"></span>
                  </p>
                  <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                      <label :for="'q-' + q.uid + '-model-ar'" class="label" x-text="t('qb.modelAr')"></label>
                      <textarea :id="'q-' + q.uid + '-model-ar'" rows="2" lang="ar" dir="rtl" class="field resize-y" x-model="q.modelAnswer.ar" :placeholder="t('qb.modelAnswerPh')"></textarea>
                    </div>
                    <div>
                      <label :for="'q-' + q.uid + '-model-en'" class="label" x-text="t('qb.modelEn')"></label>
                      <textarea :id="'q-' + q.uid + '-model-en'" rows="2" lang="en" dir="ltr" class="field resize-y" x-model="q.modelAnswer.en" :placeholder="t('qb.modelAnswerPh')"></textarea>
                    </div>
                  </div>
                </div>
              </template>

              <!-- الدرجة والتصنيف -->
              <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-[8rem_1fr_1fr_2fr]">
                <div>
                  <label :for="'q-' + q.uid + '-marks'" class="label" x-text="t('qb.marksLabel')"></label>
                  <input :id="'q-' + q.uid + '-marks'" type="number" inputmode="decimal" min="0.5" step="0.5" x-model.number="q.marks" class="field"
                         :aria-invalid="invalid('q-' + q.uid + '-marks')" :aria-describedby="describedBy('q-' + q.uid + '-marks')">
                  <p :id="'q-' + q.uid + '-marks-err'" class="err" role="alert" x-show="err('q-' + q.uid + '-marks')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('q-' + q.uid + '-marks')"></span></p>
                </div>
                <div>
                  <label :for="'q-' + q.uid + '-bloom'" class="label" x-text="t('qb.bloomLabel')"></label>
                  <select :id="'q-' + q.uid + '-bloom'" class="field" x-model="q.bloom">
                    <template x-for="b in blooms" :key="b">
                      <option :value="b" :selected="b === q.bloom" x-text="t('qb.bloom.' + b)"></option>
                    </template>
                  </select>
                </div>
                <div>
                  <label :for="'q-' + q.uid + '-diff'" class="label" x-text="t('qb.difficultyLabel')"></label>
                  <select :id="'q-' + q.uid + '-diff'" class="field" x-model="q.difficulty">
                    <template x-for="d in diffs" :key="d">
                      <option :value="d" :selected="d === q.difficulty" x-text="t('qb.diff.' + d)"></option>

                    <option value="" :selected="!q.conceptId" x-text="t('qb.conceptNone')"></option>

              <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">

                <div>
                  <label :for="'q-' + q.uid + '-expl-en'" class="label" x-text="(q.type === 'essay' || q.type === 'short') ? t('qb.rubricEn') : t('qb.explEn')"></label>

                            :placeholder="(q.type === 'essay' || q.type === 'short') ? t('qb.rubricPh') : t('qb.explanationPh')"></textarea>
                </div>
              </div>
            </article>
            </li>
          </template>

<div x-cloak x-show="publishOpen" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4">

       x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="opacity-0 scale-95"
       class="modal-panel" :aria-busy="publishing.toString()">

        <span x-text="t('qb.pubTitle')"></span>

      <button type="button" class="icon-btn" :disabled="publishing" @click="closePublish()" :aria-label="t('qb.pubCancel')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>

    <div class="min-h-0 flex-1 space-y-3 overflow-y-auto p-5" x-show="publishOpen">
      <p id="pub-intro" class="text-sm text-muted" x-text="t('qb.pubIntro')"></p>
      <dl class="divide-y divide-line rounded-xl border border-line text-sm">
        <div class="flex items-center justify-between gap-3 px-4 py-2.5"><dt class="text-muted" x-text="t('qb.pubQuestions')"></dt><dd class="font-extrabold tabular-nums" x-text="publishOpen ? publishSummary.count : ''"></dd></div>
        <div class="flex items-center justify-between gap-3 px-4 py-2.5"><dt class="text-muted" x-text="t('qb.pubTotal')"></dt><dd class="font-extrabold tabular-nums" x-text="publishOpen ? publishSummary.total : ''"></dd></div>
        <div class="flex items-center justify-between gap-3 px-4 py-2.5"><dt class="text-muted" x-text="t('qb.pubOpens')"></dt><dd class="text-end font-bold" x-text="publishOpen ? publishSummary.opens : ''"></dd></div>
        <div class="flex items-center justify-between gap-3 px-4 py-2.5"><dt class="text-muted" x-text="t('qb.pubCloses')"></dt><dd class="text-end font-bold" x-text="publishOpen ? publishSummary.closes : ''"></dd></div>

    <footer class="flex shrink-0 items-center justify-end gap-3 border-t border-line bg-page/40 p-4">
      <button type="button" class="btn btn-outline" :disabled="publishing" @click="closePublish()" x-text="t('qb.pubCancel')"></button>
      <button type="button" class="btn btn-accent" :disabled="publishing" :aria-busy="publishing.toString()" @click="confirmPublish()">
        <i class="fa-solid animate-spin fa-circle-notch" x-show="publishing" aria-hidden="true"></i>
        <i class="fa-solid fa-paper-plane" x-show="!publishing" aria-hidden="true"></i>
        <span x-text="publishing ? t('qb.publishing') : t('qb.pubConfirm')"></span>

</div>

<!-- ==========================================================================
     نافذة — توليد الأسئلة بالذكاء الاصطناعي
