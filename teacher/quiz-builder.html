<div x-cloak x-show="aiOpen" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4">
  <div class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closeAi()" aria-hidden="true"></div>

  <div x-show="aiOpen" x-trap.noscroll="aiOpen" role="dialog" aria-modal="true" aria-labelledby="ai-title"
       @keydown.escape.stop="aiState === 'running' ? cancelAi() : closeAi()"
       x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="opacity-0 scale-95"
       class="modal-panel sm:max-w-xl" :aria-busy="(aiState === 'running').toString()">

    <header class="flex shrink-0 items-center justify-between gap-3 border-b border-line bg-soft p-5">
      <h2 id="ai-title" class="flex items-center gap-2.5 text-lg font-extrabold text-ink">
        <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-accent-500/20 text-yellow-900 dark:text-accent-500" aria-hidden="true"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
        <span x-text="t('qb.aiModalTitle')"></span>
      </h2>
      <button type="button" class="icon-btn" @click="closeAi()" :aria-label="t('qb.aiClose')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </header>

    <!-- ---- المعايير (idle / running / error / cancelled) ---- -->
    <form x-show="aiState !== 'done'" novalidate @submit.prevent="generateAi()" class="flex min-h-0 flex-1 flex-col">
      <div class="min-h-0 flex-1 space-y-4 overflow-y-auto p-5">
        <p class="text-sm leading-6 text-muted" x-text="t('qb.aiModalSubtitle')"></p>
        <p class="text-sm"><span class="font-bold text-muted" x-text="t('qb.aiCourseLabel') + ':'"></span> <span class="font-extrabold text-ink" x-text="course ? loc(course.title) : '—'"></span></p>

        <fieldset class="space-y-4" :disabled="aiState === 'running'">
          <div class="relative"
               x-data="selectDropdown({ id: 'ai-concept', options: () => aiConceptOptions, get: () => aiForm.conceptId, set: (v) => aiForm.conceptId = v })"
               @click.outside="closeList()">
            <span id="ai-concept-label" class="label" x-text="t('qb.aiFieldConcept')"></span>
            <button type="button" id="ai-concept" x-ref="btn" role="combobox" aria-haspopup="listbox"
                    :aria-expanded="open.toString()" aria-controls="ai-concept-list" aria-labelledby="ai-concept-label ai-concept"
                    :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                    class="field flex w-full items-center justify-between gap-2 text-start"
                    @click="toggleList()" @keydown="onKey($event)">
              <span class="truncate" x-text="triggerLabel"></span>
              <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
            </button>
            <ul x-show="open" x-cloak x-ref="list" id="ai-concept-list" role="listbox" aria-labelledby="ai-concept-label"
                x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
              <template x-for="(item, idx) in items" :key="item.value">
                <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                    class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                    @click="choose(item)" @mousemove="active = idx">
                  <span class="truncate" x-text="item.label"></span>
                  <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                </li>
              </template>
            </ul>
          </div>

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div class="relative"
                 x-data="selectDropdown({ id: 'ai-bloom', options: () => bloomOptions, get: () => aiForm.bloom, set: (v) => aiForm.bloom = v })"
                 @click.outside="closeList()">
              <span id="ai-bloom-label" class="label" x-text="t('qb.aiFieldBloom')"></span>
              <button type="button" id="ai-bloom" x-ref="btn" role="combobox" aria-haspopup="listbox"
                      :aria-expanded="open.toString()" aria-controls="ai-bloom-list" aria-labelledby="ai-bloom-label ai-bloom"
                      :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                      class="field flex w-full items-center justify-between gap-2 text-start"
                      @click="toggleList()" @keydown="onKey($event)">
                <span class="truncate" x-text="triggerLabel"></span>
                <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
              </button>
              <ul x-show="open" x-cloak x-ref="list" id="ai-bloom-list" role="listbox" aria-labelledby="ai-bloom-label"
                  x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                <template x-for="(item, idx) in items" :key="item.value">
                  <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                      class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                      @click="choose(item)" @mousemove="active = idx">
                    <span class="truncate" x-text="item.label"></span>
                    <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                  </li>
                </template>
              </ul>
            </div>

            <div class="relative"
                 x-data="selectDropdown({ id: 'ai-qtype', options: () => typeOptions, get: () => aiForm.qtype, set: (v) => aiForm.qtype = v })"
                 @click.outside="closeList()">
              <span id="ai-qtype-label" class="label" x-text="t('qb.aiFieldQType')"></span>
              <button type="button" id="ai-qtype" x-ref="btn" role="combobox" aria-haspopup="listbox"
                      :aria-expanded="open.toString()" aria-controls="ai-qtype-list" aria-labelledby="ai-qtype-label ai-qtype"
                      :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                      class="field flex w-full items-center justify-between gap-2 text-start"
                      @click="toggleList()" @keydown="onKey($event)">
                <span class="truncate" x-text="triggerLabel"></span>
                <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
              </button>
              <ul x-show="open" x-cloak x-ref="list" id="ai-qtype-list" role="listbox" aria-labelledby="ai-qtype-label"
                  x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                <template x-for="(item, idx) in items" :key="item.value">
                  <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                      class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                      @click="choose(item)" @mousemove="active = idx">
                    <span class="truncate" x-text="item.label"></span>
                    <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                  </li>
                </template>
              </ul>
            </div>
          </div>

          <fieldset>
            <legend class="label" x-text="t('qb.aiFieldDifficulty')"></legend>
            <div class="grid grid-cols-3 gap-2">
              <template x-for="d in diffs" :key="d">
                <label class="flex cursor-pointer items-center justify-center gap-2 rounded-lg border border-line-strong px-3 py-2.5 text-sm font-bold transition hover:border-primary-500 has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-brand"
                       :class="aiForm.difficulty === d && 'border-primary-700 bg-soft text-brand'">
                  <input type="radio" name="ai-difficulty" :value="d" x-model="aiForm.difficulty" class="sr-only">
                  <i class="fa-solid fa-check text-xs" x-show="aiForm.difficulty === d" aria-hidden="true"></i>
                  <span x-text="t('qb.diff.' + d)"></span>
                </label>
              </template>
            </div>
          </fieldset>

          <div>
            <label for="ai-count" class="label"><span x-text="t('qb.aiFieldCount')"></span> <span class="font-mono text-brand" x-text="fmtNum(aiForm.count)"></span></label>
            <input id="ai-count" x-model.number="aiForm.count" type="range" min="1" max="10" step="1" class="h-2 w-full cursor-pointer appearance-none rounded-full bg-line accent-primary-500">
          </div>
        </fieldset>

        <!-- حالة التشغيل -->
        <div x-show="aiState === 'running'" class="space-y-2">
          <p class="flex items-center gap-2 text-sm font-bold text-brand"><i class="fa-solid fa-circle-notch animate-spin" aria-hidden="true"></i> <span x-text="t('qb.aiGenerating')"></span></p>
          <div class="h-2 overflow-hidden rounded-full bg-line" role="progressbar" :aria-label="t('qb.aiProgressLabel')" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="aiProgress">
            <div class="h-full rounded-full bg-primary-500 transition-[width] duration-300" :style="'width:' + aiProgress + '%'"></div>
          </div>
        </div>
        <p x-show="aiState === 'error'" class="flex items-start gap-2 rounded-xl border border-error-600/40 bg-error-500/10 p-3 text-sm font-bold text-danger" role="alert">
          <i class="fa-solid fa-circle-exclamation mt-0.5" aria-hidden="true"></i> <span x-text="aiError"></span>
        </p>
        <p x-show="aiState === 'cancelled'" class="flex items-start gap-2 rounded-xl border border-line bg-page/50 p-3 text-sm font-bold text-muted">
          <i class="fa-solid fa-circle-stop mt-0.5" aria-hidden="true"></i> <span x-text="t('qb.aiCancelled')"></span>
        </p>
        <p class="text-xs text-muted"><i class="fa-solid fa-circle-info ms-1" aria-hidden="true"></i> <span x-text="t('qb.aiSourceNote')"></span></p>
      </div>

      <footer class="flex shrink-0 flex-wrap items-center justify-end gap-3 border-t border-line bg-page/40 p-4">
        <button type="button" class="btn btn-outline" x-show="aiState !== 'running'" @click="closeAi()" x-text="t('qb.aiClose')"></button>
        <button type="button" id="ai-cancel-run" class="btn btn-danger" x-show="aiState === 'running'" @click="cancelAi()">
          <i class="fa-solid fa-circle-stop" aria-hidden="true"></i> <span x-text="t('qb.aiCancelRun')"></span>
        </button>
        <button type="submit" id="ai-submit" class="btn btn-accent" :disabled="aiState === 'running'" :aria-busy="(aiState === 'running').toString()">
          <i class="fa-solid animate-spin fa-circle-notch" x-show="aiState === 'running'" aria-hidden="true"></i>
          <i class="fa-solid fa-wand-magic-sparkles" x-show="aiState !== 'running'" aria-hidden="true"></i>
          <span x-text="aiState === 'running' ? t('qb.aiGenerating') : (aiState === 'error' || aiState === 'cancelled' ? t('qb.aiRetry') : t('qb.aiSubmit'))"></span>
        </button>
      </footer>
    </form>

    <!-- ---- النتائج (done) ---- -->
    <div x-show="aiState === 'done'" x-cloak class="flex min-h-0 flex-1 flex-col">
      <div class="min-h-0 flex-1 space-y-3 overflow-y-auto p-5">
        <h3 id="ai-results-title" tabindex="-1" class="flex items-center gap-2 text-sm font-extrabold text-success-700 focus:outline-none dark:text-success-500">
          <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
          <span x-text="tf('qb.aiResultsTitle', { n: fmtNum(aiResults.length) })"></span>
        </h3>
        <p class="text-xs text-muted" x-text="t('qb.aiResultsHint')"></p>

      /* ---------- الإشعارات (مشتقة من TC) ---------- */
      notifications: (() => {

      /* ---------- حالة الاختبار ---------- */
      loadError: null,
      quizCode: null,
      isNew: true,
      status: 'draft',
      form: EMPTY_FORM(),
      questions: [],
      attemptsCount: 0,
      errors: {},
      errorList: [],
      showErrors: false,
      lastMode: 'publish',
      dirty: false, rev: 0, leaving: false,
      saveState: 'idle',
      lastSavedAt: null,
      nowTick: Date.now(),
      savingDraft: false, publishing: false,
      publishOpen: false, publishOpener: null, published: null,
      undo: null,
      liveMsg: '',
      delay: 500,
      aiDelay: 1200,

      emptyForm() { return EMPTY_FORM(); },
      normalizeQ(q) {
        const o2 = (o) => ({ ar: (o && o.ar) || '', en: (o && o.en) || '' });
        return {
          uid: q.uid, type: TYPES.includes(q.type) ? q.type : 'mcq',
          text: o2(q.text),
          options: (q.options || []).map((o) => ({ uid: o.uid, text: o2(o.text), correct: !!o.correct })),
          marks: +q.marks || 1,
          bloom: TC.BLOOMS.includes(q.bloom) ? q.bloom : 'remember',

          conceptId: q.conceptId || '',
          explanation: o2(q.explanation), modelAnswer: o2(q.modelAnswer),

        };
      },
      loadFromUrl() {
        let code = null;
        try { code = new URLSearchParams(location.search).get('quiz'); } catch (e) {}
        code = code == null ? '' : code.trim();
        if (!code) {
          this.isNew = true; this.quizCode = null; this.status = 'draft';
          this.form = this.emptyForm(); this.questions = []; this.lastSavedAt = null;
          return;
        }
        const qz = TC.quiz(code);
        if (!qz) { this.loadError = { code }; this.form = this.emptyForm(); return; }
        const c = deep(qz);
        this.isNew = false;
        this.quizCode = c.code;
        this.status = TC.quizStatus(qz);
        this.form = {
          titleAr: c.title.ar, titleEn: c.title.en,
          courseId: c.courseId, unitId: c.unitId || '', lessonId: c.lessonId || '',
          type: QUIZ_TYPES.includes(c.type) ? c.type : 'quiz',
          durationMin: c.durationMin, attemptsAllowed: c.attemptsAllowed, passMark: c.passMark,
          shuffleQuestions: !!c.shuffle, shuffleOptions: !!c.shuffle,
          showResults: RESULTS.includes(c.showResults) ? c.showResults : 'after_close',
          opensAt: toZoned(c.opensAt), closesAt: toZoned(c.closesAt),
          instrAuto: true, instructions: bi(),

        this.attemptsCount = TC.attemptsOf(c.code).length;

      },

      /* ---------- خيارات مشتقة ---------- */
      get course() { return this.form ? TC.course(this.form.courseId) : null; },
      get courseOptions() { return TC.COURSES.map((c) => ({ value: c.id, label: this.loc(c.title) })); },
      get unitOptions() { const c = this.course; return c ? c.units.map((u) => ({ value: u.id, label: this.loc(u.title) })) : []; },
      get lessonOptions() {

        return [{ value: '', label: this.t('qb.allLessons') }].concat(u ? u.lessons.map((l) => ({ value: l.id, label: this.loc(l.title) })) : []);
      },
      get conceptOptions() { return this.form ? TC.CONCEPTS.filter((k) => k.courseId === this.form.courseId) : []; },
      get typeOptions() { return TYPES.map((v) => ({ value: v, label: this.t('qb.type.' + v) })); },
      get bloomOptions() { return TC.BLOOMS.map((v) => ({ value: v, label: this.t('qb.bloom.' + v) })); },
      diffs: DIFFS, quizTypes: QUIZ_TYPES, resultPolicies: RESULTS, blooms: TC.BLOOMS, types: TYPES,
      OPT_MAX, OPT_MIN,
      statusMeta(s) { return STATUS_META[s] || STATUS_META.draft; },
      bloomCls(b) { return BLOOM_CLS[b] || 'badge-info'; },
      diffCls(d) { return DIFF_CLS[d] || 'badge-accent'; },
      typeCls(t) { return TYPE_CLS[t] || 'badge-primary'; },
      conceptLabel(k) { return this.loc(k.name) + ' (' + k.code + ')'; },

      setCourse(v) {
        if (!this.form || v === this.form.courseId) return;
        this.form.courseId = v; this.form.unitId = ''; this.form.lessonId = '';
        const ids = this.conceptOptions.map((k) => k.id);
        let n = 0;
        this.questions.forEach((q) => { if (q.conceptId && !ids.includes(q.conceptId)) { q.conceptId = ''; n++; } });
        this.aiForm.conceptId = '';
        if (n) this.announce(this.tf('qb.liveConceptsCleared', { n: this.fmtNum(n) }));
      },
      setUnit(v) { if (v === this.form.unitId) return; this.form.unitId = v; this.form.lessonId = ''; },

      /* ---------- الدرجة الكلية والتعليمات ---------- */
      get totalMarks() { return this.questions.reduce((s, q) => s + (+q.marks > 0 ? +q.marks : 0), 0); },
      autoInstructions(lang) {
        const min = new Intl.NumberFormat(intlLoc(lang), { style: 'unit', unit: 'minute', unitDisplay: 'long' }).format(+this.form.durationMin || 0);
        const att = new Intl.NumberFormat(intlLoc(lang)).format(+this.form.attemptsAllowed || 0);
        return I18N[lang].qb.instrTemplate.split('{min}').join(min).split('{attempts}').join(att);
      },
      instrValue(lang) { return this.form.instrAuto ? this.autoInstructions(lang) : this.form.instructions[lang]; },
      setInstrAuto(on) {
        if (!on) { this.form.instructions = { ar: this.autoInstructions('ar'), en: this.autoInstructions('en') }; }
        this.form.instrAuto = on;
      },

      /* ---------- منطقة الإعلانات الحية ---------- */
      announce(msg) { this.liveMsg = ''; this.$nextTick(() => { this.liveMsg = msg; }); },
      focusId(id, scroll = true) {
        const el = document.getElementById(id);
        if (!el) return false;
        if (scroll && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        el.focus({ preventScroll: true });
        return true;
      },
      focusLater(id) { this.$nextTick(() => setTimeout(() => this.focusId(id), 30)); },

      /* ---------- الأسئلة ---------- */
      qIndex(q) { return this.questions.findIndex((x) => x.uid === q.uid); },
      blankOptions(n = 4) { return Array.from({ length: n }, () => ({ uid: TC.uid('o'), text: bi(), correct: false })); },
      tfOptions() { return [{ uid: TC.uid('o'), text: bi('صح', 'True'), correct: false }, { uid: TC.uid('o'), text: bi('خطأ', 'False'), correct: false }]; },
      applyType(q, type) {
        const fromOpen = q.type === 'essay' || q.type === 'short';
        const toOpen = type === 'essay' || type === 'short';
        q.type = type;
        if (type === 'mcq') q.options = this.blankOptions(4);
        else if (type === 'tf') q.options = this.tfOptions();
        else q.options = [];
        if (!(fromOpen && toOpen)) q.modelAnswer = bi();
      },
      makeQuestion(type) {
        const q = { uid: TC.uid('q'), type: '', text: bi(), options: [], marks: type === 'essay' ? 5 : 1, bloom: 'remember', difficulty: 'medium', conceptId: '', explanation: bi(), modelAnswer: bi(), aiDraft: false };
        this.applyType(q, type);
        return q;
      },
      addQuestion(type = 'mcq') {
        const q = this.makeQuestion(type);
        this.questions.push(q);
        this.announce(this.tf('qb.liveAdded', { n: this.fmtNum(this.questions.length), type: this.t('qb.type.' + type) }));
        this.focusLater('q-' + q.uid + '-text-ar');
        return q;
      },
      duplicateQuestion(i) {
        const src = this.questions[i]; if (!src) return null;
        const copy = deep(src);
        copy.uid = TC.uid('q');
        copy.options = copy.options.map((o) => ({ ...o, uid: TC.uid('o') }));
        this.questions.splice(i + 1, 0, copy);
        this.announce(this.tf('qb.liveDuplicated', { n: this.fmtNum(i + 1), pos: this.fmtNum(i + 2) }));
        this.focusLater('q-' + copy.uid + '-text-ar');
        return copy;
      },
      deleteQuestion(i) {
        const q = this.questions[i]; if (!q) return;
        this.questions.splice(i, 1);
        this.clearUndo();
        const timer = setTimeout(() => { this.undo = null; }, UNDO_MS);
        this.undo = { q, index: i, timer };
        this.announce(this.tf('qb.liveDeleted', { n: this.fmtNum(i + 1) }));
        const next = this.questions[i] || this.questions[i - 1];
        this.$nextTick(() => { if (!(next && this.focusId('q-' + next.uid + '-delete', false))) this.focusId('qb-undo-btn', false) || this.focusId('qb-add-mcq', false); });
      },
      clearUndo() { if (this.undo) { clearTimeout(this.undo.timer); this.undo = null; } },
      undoDelete() {
        if (!this.undo) return;
        const { q, index, timer } = this.undo;
        clearTimeout(timer);
        const at = Math.min(index, this.questions.length);
        this.questions.splice(at, 0, q);
        this.undo = null;
        this.announce(this.tf('qb.liveRestored', { n: this.fmtNum(at + 1) }));
        this.focusLater('q-' + q.uid + '-delete');
      },
      moveQuestion(i, dir) {
        const j = i + dir, len = this.questions.length;
        if (i < 0 || i >= len || j < 0 || j >= len) return false;
        const [q] = this.questions.splice(i, 1);
        this.questions.splice(j, 0, q);
        this.announce(this.tf('qb.liveMoved', { from: this.fmtNum(i + 1), to: this.fmtNum(j + 1) }));
        const which = dir < 0 ? 'up' : 'down';
        const atEdge = which === 'up' ? j === 0 : j === len - 1;
        const target = 'q-' + q.uid + '-' + (atEdge ? (which === 'up' ? 'down' : 'up') : which);
        this.$nextTick(() => this.focusId(target, false));
        return target;
      },
      async changeType(q, type) {
        if (!TYPES.includes(type) || q.type === type) return false;
        const hasOpts = q.type === 'mcq' && q.options.some((o) => !blank(o.text.ar) || !blank(o.text.en));
        const isOpen = (x) => x === 'essay' || x === 'short';
        const hasModel = isOpen(q.type) && !isOpen(type) && (!blank(q.modelAnswer.ar) || !blank(q.modelAnswer.en));
        const loses = (hasOpts && type !== 'mcq') || (q.type === 'mcq' && type === 'tf' && q.options.some((o) => o.correct)) || hasModel;
        if (loses) {
          const ok = await this.confirm({
            icon: 'warning', titleText: this.t('qb.typeConfirmTitle'), text: this.tf('qb.typeConfirmText', { type: this.t('qb.type.' + type) }),
            confirmButtonText: this.t('qb.confirmChange'), cancelButtonText: this.t('qb.keepType'),
          });
          if (!ok) return false;
        }
        this.applyType(q, type);
        this.announce(this.tf('qb.liveTypeChanged', { n: this.fmtNum(this.qIndex(q) + 1), type: this.t('qb.type.' + type) }));
        return true;
      },

      /* ---------- الخيارات ---------- */
      addOption(q) {
        if (q.type !== 'mcq' || q.options.length >= OPT_MAX) return null;
        const o = { uid: TC.uid('o'), text: bi(), correct: false };
        q.options.push(o);
        this.announce(this.tf('qb.liveOptAdded', { n: this.fmtNum(q.options.length), m: this.fmtNum(this.qIndex(q) + 1) }));
        this.focusLater('q-' + q.uid + '-opt-' + o.uid + '-ar');
        return o;
      },
      removeOption(q, oi) {
        if (q.type !== 'mcq' || q.options.length <= OPT_MIN) return false;
        const [o] = q.options.splice(oi, 1);
        let msg = this.tf('qb.liveOptRemoved', { n: this.fmtNum(oi + 1), m: this.fmtNum(this.qIndex(q) + 1) });
        if (o.correct) msg += ' ' + this.t('qb.liveOptRemovedCorrect');
        this.announce(msg);
        const next = q.options[oi] || q.options[oi - 1];
        this.$nextTick(() => this.focusId('q-' + q.uid + '-opt-' + next.uid + '-ar', false));
        return true;
      },
      setCorrect(q, oi) { q.options.forEach((o, i) => { o.correct = i === oi; }); },

      /* ---------- التحقق ---------- */
      validate(mode = 'publish') {
        const E = [];
        const add = (id, msg, focus) => E.push({ id, msg, focus: focus || id });
        const f = this.form;
        if (mode === 'draft') {
          if (blank(f.titleAr) && blank(f.titleEn)) add('qb-title-ar', this.t('qb.errTitleDraft'));
        } else {
          if (blank(f.titleAr)) add('qb-title-ar', this.t('qb.errTitleAr'));
          if (blank(f.titleEn)) add('qb-title-en', this.t('qb.errTitleEn'));
          if (!f.courseId || !TC.course(f.courseId)) add('qb-course', this.t('qb.errCourse'));
          else if (!f.unitId) add('qb-unit', this.t('qb.errUnit'));
          const d = +f.durationMin;
          if (f.durationMin === '' || !Number.isInteger(d) || d < 1 || d > 600) add('qb-duration', this.t('qb.errDuration'));
          const a = +f.attemptsAllowed;
          if (f.attemptsAllowed === '' || !Number.isInteger(a) || a < 1 || a > 10) add('qb-attempts', this.t('qb.errAttempts'));
          const pm = +f.passMark;
          if (f.passMark === '' || f.passMark == null || !Number.isFinite(pm) || pm < 1 || pm > 100) add('qb-pass', this.t('qb.errPass'));
          const o = fromZoned(f.opensAt), c = fromZoned(f.closesAt);
          if (!o) add('qb-opens', this.t('qb.errOpensRequired'));
          if (!c) add('qb-closes', this.t('qb.errClosesRequired'));
          else if (o && Date.parse(c) <= Date.parse(o)) add('qb-closes', this.t('qb.errWindowOrder'));
          else if (Date.parse(c) <= Date.now()) add('qb-closes', this.t('qb.errClosesPast'));
          if (!this.questions.length) add('qb-questions', this.t('qb.errNoQuestions'), 'qb-add-mcq');
          this.questions.forEach((q, i) => {
            const n = this.fmtNum(i + 1), p = 'q-' + q.uid;
            if (blank(q.text.ar)) add(p + '-text-ar', this.tf('qb.errQTextAr', { n }));
            if (blank(q.text.en)) add(p + '-text-en', this.tf('qb.errQTextEn', { n }));
            if (q.type === 'mcq' || q.type === 'tf') {
              if (q.type === 'mcq') q.options.forEach((op, oi) => { if (blank(op.text.ar) && blank(op.text.en)) add(p + '-opt-' + op.uid + '-ar', this.tf('qb.errOptEmpty', { n, o: this.fmtNum(oi + 1) })); });
              const nc = q.options.filter((op) => op.correct).length;
              if (nc !== 1) add(p + '-correct', this.tf(nc ? 'qb.errQMultiCorrect' : 'qb.errQNoCorrect', { n }), q.options[0] ? p + '-opt-' + q.options[0].uid + '-radio' : p + '-text-ar');
            }
            const mk = +q.marks;
            if (q.marks === '' || q.marks == null || !Number.isFinite(mk) || mk <= 0) add(p + '-marks', this.tf('qb.errMarks', { n }));
            else if (Math.round(mk * 2) !== mk * 2) add(p + '-marks', this.tf('qb.errMarksStep', { n }));
          });
        }
        this.errorList = E;
        const map = {};
        E.forEach((e) => { if (!(e.id in map)) map[e.id] = e.msg; });
        this.errors = map;
        return E.length === 0;
      },
      err(id) { return this.errors[id] || ''; },
      invalid(id) { return this.errors[id] ? 'true' : null; },
      describedBy(id, hint) { return [this.errors[id] ? id + '-err' : '', hint || ''].filter(Boolean).join(' ') || null; },
      showErrorSummary() {
        this.announce(this.tf('qb.liveErrors', { n: this.fmtNum(this.errorList.length) }));
        this.$nextTick(() => this.focusId('qb-error-summary'));
      },
      gotoError(e) { this.focusId(e.focus || e.id); },

      /* ---------- تتبّع التغييرات والحفظ ---------- */
      touch() {
        if (this.loadError) return;
        this.dirty = true; this.rev++;
        if (this.saveState !== 'saving') this.saveState = 'dirty';
        if (this.showErrors) this.validate(this.lastMode);
      },
      get lastSavedLabel() {
        void this.nowTick;
        return this.lastSavedAt ? this.tf('qb.lastSavedAt', { rel: TC.relTime(this.lastSavedAt, this.locale) }) : this.t('qb.notSavedYet');
      },
      get saveIndicator() {
        if (this.saveState === 'saving') return this.t('qb.saving');
        if (this.saveState === 'blocked') return this.t('qb.autosaveBlocked');
        if (this.dirty) return this.status === 'draft' ? this.t('qb.unsavedAuto') : this.t('qb.unsaved');
        if (this.saveState === 'saved') return this.t('qb.saved');
        return '';
      },
      generateCode() {
        const c = this.course;
        const prefix = 'QZ-' + (c ? c.code.split('-')[0] : 'NEW') + '-';
        const nums = TC.QUIZZES.filter((q) => q.code.startsWith(prefix)).map((q) => parseInt(q.code.slice(prefix.length), 10)).filter((n) => !isNaN(n));
        const base = nums.length ? Math.max(...nums) : (c ? (TC.COURSES.indexOf(c) + 1) * 100 : 0);
        return prefix + String(base + 1).padStart(3, '0');
      },
      async saveDraft(auto = false) {
        if (this.savingDraft || this.publishing || this.loadError) return false;
        if (blank(this.form.titleAr) && blank(this.form.titleEn)) {
          if (auto) { this.saveState = 'blocked'; return false; }
          this.showErrors = true; this.lastMode = 'draft';
          this.validate('draft');
          this.showErrorSummary();
          return false;
        }
        if (!auto && this.lastMode === 'draft') { this.showErrors = false; this.errorList = []; this.errors = {}; }
        this.savingDraft = true; this.saveState = 'saving';
        const rev = this.rev;
        await wait(this.delay);
        if (!this.quizCode) { this.quizCode = this.generateCode(); this.syncTitle(); }
        this.isNew = false;
        this.lastSavedAt = new Date().toISOString();
        this.nowTick = Date.now();
        this.savingDraft = false;
        if (this.rev === rev) { this.dirty = false; this.saveState = 'saved'; } else { this.saveState = 'dirty'; }
        if (!auto) this.announce(this.status === 'draft' ? this.t('qb.liveSaved') : this.t('qb.liveSavedChanges'));
        return true;
      },
      autosaveTick() {
        this.nowTick = Date.now();
        if (this.dirty && this.status === 'draft' && !this.loadError && !this.publishOpen && !this.savingDraft && !this.publishing) return this.saveDraft(true);
        return false;
      },
      async confirm(opts) {
        if (typeof Swal === 'undefined') return window.confirm(opts.text);
        const r = await Swal.fire({ showCancelButton: true, reverseButtons: false, focusCancel: true, customClass: { popup: 'firob-swal' }, ...opts });
        return !!(r && r.isConfirmed);
      },
      async guardLeave(e, href) {
        if (!this.dirty) return true;
        e.preventDefault();
        const ok = await this.confirm({ icon: 'warning', titleText: this.t('qb.leaveTitle'), text: this.t('qb.leaveText'), confirmButtonText: this.t('qb.leaveConfirm'), cancelButtonText: this.t('qb.stay') });
        if (ok) { this.leaving = true; location.href = href; }
        return ok;
      },
      previewQuiz() {
        if (typeof Swal === 'undefined') { this.announce(this.t('qb.previewText')); return; }
        Swal.fire({ icon: 'info', titleText: this.t('qb.previewTitle'), text: this.t('qb.previewText'), confirmButtonText: this.t('qb.ok'), customClass: { popup: 'firob-swal' } });
      },

      /* ---------- النشر ---------- */
      get resultStatus() {
        const o = fromZoned(this.form && this.form.opensAt);
        return o && Date.parse(o) > Date.now() ? 'scheduled' : 'open';
      },
      get publishSummary() {
        return {
          count: this.fmtNum(this.questions.length), total: this.fmtNum(this.totalMarks),
          opens: this.fmtTz(fromZoned(this.form.opensAt)), closes: this.fmtTz(fromZoned(this.form.closesAt)),
          status: this.resultStatus,
        };
      },
      requestPublish() {
        if (this.publishing || this.loadError) return false;
        this.showErrors = true; this.lastMode = 'publish';
        if (!this.validate('publish')) { this.showErrorSummary(); return false; }
        this.publishOpener = document.activeElement;
        this.publishOpen = true;
        return true;
      },
      closePublish() {
        if (this.publishing) return;
        this.publishOpen = false;
        const el = this.publishOpener; this.publishOpener = null;
        this.$nextTick(() => el && el.focus && el.focus());
      },
      async confirmPublish() {
        if (this.publishing) return false;
        if (!this.validate('publish')) { this.publishOpen = false; this.showErrorSummary(); return false; }
        this.publishing = true;
        await wait(this.delay);
        const st = this.resultStatus;
        if (!this.quizCode) { this.quizCode = this.generateCode(); this.syncTitle(); }
        this.status = st;
        this.isNew = false;
        this.lastSavedAt = new Date().toISOString();
        this.nowTick = Date.now();
        this.dirty = false; this.saveState = 'saved';
        this.showErrors = false; this.errorList = []; this.errors = {};
        this.publishing = false;
        const when = st === 'scheduled' ? this.fmtTz(fromZoned(this.form.opensAt)) : this.fmtTz(fromZoned(this.form.closesAt));
        this.published = { status: st, when };
        this.closePublish();
        this.announce(this.tf(st === 'scheduled' ? 'qb.livePublishedScheduled' : 'qb.livePublishedOpen', { when }));
        return st;
      },
      get publishedText() {
        if (!this.published) return '';
        return this.tf(this.published.status === 'scheduled' ? 'qb.livePublishedScheduled' : 'qb.livePublishedOpen', { when: this.published.when });
      },

      /* ---------- التوليد بالذكاء الاصطناعي (قوالب حتمية) ---------- */
      aiOpen: false, aiOpener: null,
      aiState: 'idle', // idle | running | done | error | cancelled
      aiForm: { conceptId: '', bloom: 'understand', qtype: 'mcq', difficulty: 'medium', count: 5 },
      aiResults: [], aiProgress: 0, aiToken: 0, aiError: '',
      get aiConceptOptions() { return [{ value: '', label: this.t('qb.aiAllConcepts') }].concat(this.conceptOptions.map((k) => ({ value: k.id, label: this.conceptLabel(k) }))); },
      get aiSelectedCount() { return this.aiResults.filter((r) => r.selected).length; },
      openAi() {
        this.aiOpener = document.activeElement;
        this.aiState = 'idle'; this.aiResults = []; this.aiProgress = 0; this.aiError = '';
        if (this.aiForm.conceptId && !this.conceptOptions.some((k) => k.id === this.aiForm.conceptId)) this.aiForm.conceptId = '';
        this.aiOpen = true;
      },
      closeAi(focusId) {
        if (this.aiState === 'running') this.cancelAi(true);
        this.aiOpen = false;
        const el = this.aiOpener; this.aiOpener = null;
        this.$nextTick(() => { if (!(focusId && this.focusId(focusId))) el && el.focus && el.focus(); });
        setTimeout(() => { if (!this.aiOpen) { this.aiResults = []; this.aiState = 'idle'; this.aiProgress = 0; } }, 250);
      },
      async generateAi() {
        if (this.aiState === 'running') return false;
        const concepts = this.aiForm.conceptId ? [TC.concept(this.aiForm.conceptId)].filter(Boolean) : this.conceptOptions;
        if (!this.course) { this.aiState = 'error'; this.aiError = this.t('qb.aiErrorNoCourse'); this.announce(this.aiError); return false; }
        if (!concepts.length) { this.aiState = 'error'; this.aiError = this.t('qb.aiErrorNoConcepts'); this.announce(this.aiError); return false; }
        const count = Math.min(10, Math.max(1, parseInt(this.aiForm.count, 10) || 1));
        this.aiForm.count = count;
        const token = ++this.aiToken;
        this.aiState = 'running'; this.aiProgress = 0; this.aiResults = []; this.aiError = '';
        this.announce(this.tf('qb.aiLiveRunning', { n: this.fmtNum(count) }));
        this.$nextTick(() => this.focusId('ai-cancel-run', false));
        const steps = 4;
        for (let s = 1; s <= steps; s++) {
          await wait(this.aiDelay / steps);
          if (token !== this.aiToken || this.aiState !== 'running') return false;
          this.aiProgress = Math.round((s / steps) * 100);
        }
        this.aiResults = this.buildAiItems(concepts, count).map((q) => ({ q, selected: true }));
        this.aiState = 'done';
        this.announce(this.tf('qb.aiLiveDone', { n: this.fmtNum(count) }));
        this.$nextTick(() => this.focusId('ai-results-title', false));
        return true;
      },
      cancelAi(silent) {
        if (this.aiState !== 'running') return false;
        this.aiToken++;
        this.aiState = 'cancelled'; this.aiProgress = 0;
        if (!silent) { this.announce(this.t('qb.aiLiveCancelled')); this.$nextTick(() => this.focusId('ai-submit', false)); }
        return true;
      },
      buildAiItems(concepts, count) {
        const { qtype, bloom, difficulty } = this.aiForm;
        const base = { easy: 1, medium: 2, hard: 3 }[difficulty] || 1;
        const marks = qtype === 'essay' ? base * 2 : base;
        const placeOf = (k) => (k.lessonId && TC.lesson(k.courseId, k.unitId, k.lessonId)) || TC.unit(k.courseId, k.unitId);
        const lessonsOf = (cid) => { const c = TC.course(cid); return c ? c.units.flatMap((u) => u.lessons) : []; };
        const out = [];
        for (let i = 0; i < count; i++) {
          const k = concepts[i % concepts.length];
          const round = Math.floor(i / concepts.length);
          const real = placeOf(k);
          let place = real;
          let isTrue = true;
          if (qtype === 'tf' && i % 2 === 1) {
            const other = lessonsOf(k.courseId).find((l) => l.id !== k.lessonId);
            if (other) { place = other; isTrue = false; }
          }
          const fill = (s, lang) => s.split('{k}').join(k.name[lang]).split('{l}').join(place.title[lang]).split('{real}').join(real.title[lang])
            .split('{code}').join(k.code).split('{verb}').join(I18N[lang].qb.aiT.verb[bloom]).split('{r}').join(String(round + 1));
          const T = (get) => ({ ar: fill(get(I18N.ar.qb.aiT), 'ar'), en: fill(get(I18N.en.qb.aiT), 'en') });
          const variant = round > 0 ? T((d) => d.variant) : bi();
          const withVar = (o) => ({ ar: o.ar + variant.ar, en: o.en + variant.en });
          const q = { uid: 'ai-' + i, type: qtype, text: bi(), options: [], marks, bloom, difficulty, conceptId: k.id, explanation: bi(), modelAnswer: bi(), aiDraft: true };
          if (qtype === 'mcq') {
            q.text = withVar(T((d) => d.mcq[bloom]));
            const ci = i % 4;
            const texts = [1, 2, 3].map((n) => T((d) => d.opts[n]));
            texts.splice(ci, 0, T((d) => d.opts[0]));
            q.options = texts.map((tx, oi) => ({ uid: 'ai-' + i + '-' + oi, text: tx, correct: oi === ci }));
            q.explanation = T((d) => d.explMcq);
          } else if (qtype === 'tf') {
            q.text = withVar(T((d) => d.tf));
            q.options = this.tfOptions().map((o, oi) => ({ ...o, correct: oi === (isTrue ? 0 : 1) }));
            q.explanation = T((d) => (isTrue ? d.explTfTrue : d.explTfFalse));
          } else if (qtype === 'essay') {
            q.text = withVar(T((d) => d.essay));
            q.modelAnswer = T((d) => d.essayModel);
            q.explanation = T((d) => d.essayRubric);
          } else {
            q.text = withVar(T((d) => d.short));
            q.modelAnswer = { ar: k.name.ar, en: k.name.en };
            q.explanation = T((d) => d.shortRubric);
          }
          out.push(q);
        }
        return out;
      },
      toggleAllAi(on) { this.aiResults.forEach((r) => { r.selected = on; }); },
      addSelectedAi() {
        const sel = this.aiResults.filter((r) => r.selected);
        if (!sel.length) return 0;
        const added = sel.map((r) => {
          const q = deep(r.q);
          q.uid = TC.uid('q');
          q.options = q.options.map((o) => ({ ...o, uid: TC.uid('o') }));
          q.aiDraft = true;
          this.questions.push(q);
          return q;
        });
        this.announce(this.tf('qb.aiLiveAdded', { n: this.fmtNum(added.length) }));
        this.closeAi('q-' + added[0].uid + '-text-ar');
        return added.length;
      },

      /* ---------- SweetAlert2 ---------- */
      toastSuccess(msg) {
        if (typeof Swal === 'undefined') return;
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', titleText: msg, showConfirmButton: false, timer: 3000, customClass: { popup: 'firob-swal firob-toast' } });
      },

      /* ---------- عامة ---------- */
      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        this.loadFromUrl();
        this.syncTitle();
        this.$watch('form', () => this.touch());
        this.$watch('questions', () => this.touch());
        setInterval(() => this.autosaveTick(), AUTOSAVE_MS);
        window.addEventListener('beforeunload', (e) => { if (this.dirty && !this.leaving) { e.preventDefault(); e.returnValue = ''; } });
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      closeAll() {
        this.notifOpen = false; this.profileOpen = false; this.mobileNav = false;
      },
    };
  }
</script>
