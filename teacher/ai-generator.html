<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>مولّد المحتوى والأسئلة العام — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- تلميحات أزرار الإجراءات (Action Tooltips) ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg border border-white/10 bg-slate-900/90 px-2.5 py-1 text-xs font-medium tracking-wide text-white opacity-0 shadow-xl backdrop-blur-md transition-all duration-200 ease-out;
      @apply dark:border-slate-800/20 dark:bg-slate-100 dark:text-slate-900;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-slate-900/90 opacity-0 transition-all duration-200 ease-out;
      @apply dark:border-t-slate-100;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  {@apply bg-accent-500/20 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }
    .badge-warning { @apply bg-warning-500/15 text-warning-700 dark:text-warning-500; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-line-strong; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }
    .btn-ai      { @apply border border-accent-500/50 bg-accent-500/10 text-yellow-900 hover:bg-accent-500/20 dark:text-accent-500; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-4 py-2.5 text-start text-sm font-medium text-ink transition-colors hover:bg-soft; }
    .combo-option.is-active   { @apply bg-soft; }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }
    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- النافذة المنبثقة / اللوحة الجانبية ---------- */
    .modal-panel { @apply relative flex max-h-[90dvh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }

    /* ---------- مقياس الحصة (QuotaMeter) ---------- */
    .quota-track { @apply h-2.5 w-full overflow-hidden rounded-full bg-line; }
    .quota-fill  { @apply h-full rounded-full transition-all duration-500; }

    /* ---------- أزرار التبويب / الأقراص (Tabs & Pills) ---------- */
    .pill-option { @apply flex cursor-pointer select-none items-center justify-center gap-2 rounded-xl border border-line-strong px-3 py-2.5 text-center text-sm font-bold text-ink transition hover:border-primary-500; }
    .pill-option.is-checked { @apply border-primary-700 bg-soft text-brand; }
    .mode-tab { @apply flex min-w-0 flex-1 cursor-pointer select-none items-center justify-center gap-2 rounded-xl border border-line-strong px-3 py-3 text-center text-sm font-extrabold text-muted transition hover:border-primary-500 hover:text-ink; }
    .mode-tab.is-checked { @apply border-primary-700 bg-primary-500 text-white shadow-lg shadow-primary-500/25; }

    /* ---------- بطاقات نتائج التوليد ---------- */
    .gen-card { @apply rounded-xl border border-line bg-card p-4 transition; }
    .gen-skeleton { @apply h-24 animate-pulse rounded-xl border border-line bg-soft/60; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }

    /* ---------- [layout: full-height sidebar + bottom footer] ---------- */
    html, body { min-height: 100%; }
    body { margin: 0; }
    .app-col { min-height: 100vh; min-height: 100dvh; }
    @media (min-width: 1024px) {
      #sidebar { height: 100vh; height: 100dvh; }
      .app-col { margin-inline-start: 18rem; transition: margin-inline-start .3s ease; }
      .app-col.is-collapsed { margin-inline-start: 5rem; }
      .save-bar { inset-inline-start: 18rem; transition: inset-inline-start .3s ease; }
      .save-bar.is-collapsed { inset-inline-start: 5rem; }
    }
</style>

<!-- ⑥ Alpine.js (+ Focus لحصر التركيز داخل النوافذ المنبثقة) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- ⑦ SweetAlert2 -->
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5"></script>
</head>

<body x-data="aiGenerator()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch.focus(); }"
      @scroll.window="notifOpen = false" @resize.window="notifOpen = false"
      :class="{ 'overflow-hidden': (mobileNav && mobile) || logsOpen || quizOpen }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<!-- منطقة الإعلانات الحية (قارئات الشاشة) -->
<p class="sr-only" aria-live="polite" aria-atomic="true" x-text="liveMsg"></p>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <span class="inline-flex min-w-0 flex-1 items-center gap-3" :class="!expanded && 'lg:flex-none lg:justify-center'">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </span>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-muted" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="item.count && expanded"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent"
                        x-text="fmtNum(item.count)"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="app-col flex min-w-0 flex-1 flex-col" :class="collapsed && 'is-collapsed'">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex"><bdi dir="ltr">Ctrl K</bdi></kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-haspopup="true" :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="notifText(n)"></p>
                      <p class="text-xs text-muted"><time :datetime="n.at" x-text="relTime(n.at)"></time></p>
                    </div>
                  </li>
                </template>
              </ul>
              <div class="border-t border-line p-2">
                <a href="../common/notifications.html" class="menu-item justify-center text-brand" @click="notifOpen = false">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  <span x-text="t('viewAllNotif')"></span>
                </a>
              </div>
            </div>
          </div>

          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" class="flex max-w-[14rem] items-center gap-2 rounded-xl p-1 transition hover:bg-soft focus-visible:ring-2 md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    aria-haspopup="menu" :aria-expanded="profileOpen.toString()" aria-controls="profile-menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true" x-text="loc(teacher.initials)"></span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="loc(teacher.name)"></span>
                <span class="block truncate text-xs text-muted" x-text="t('roleTeacher')"></span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted md:block" aria-hidden="true"></i>
            </button>
            <div id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-56" role="menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <a href="../common/profile.html" role="menuitem" class="menu-item"><i class="fa-regular fa-user w-4 text-muted" aria-hidden="true"></i> <span x-text="t('profile')"></span></a>
              <div class="border-t border-line"></div>
              <a href="../auth/login.html" role="menuitem" class="menu-item !text-danger"><i class="fa-solid fa-arrow-right-from-bracket w-4" aria-hidden="true"></i> <span x-text="t('logout')"></span></a>
            </div>
          </div>
        </div>
      </div>

      <!-- زبدة الخبز (Breadcrumb) -->
      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="locale === 'ar' ? 'مسار التنقل' : 'Breadcrumb'">
          <ol class="flex items-center gap-2" role="list">
            <li><a href="teacher-dashboard.html" class="hover:text-brand hover:underline" x-text="t('breadcrumb.portal')"></a></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li class="text-ink" aria-current="page" x-text="t('navItems.aiStudio')"></li>
          </ol>
        </nav>
      </div>
    </header>

    <!-- ================= المحتوى الرئيسي ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-6 px-3 py-4 focus:outline-none sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">

      <!-- العنوان -->
      <section class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end sm:justify-between">
        <div class="min-w-0">
          <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="t('aig.title')"></h1>
          <p class="mt-1 max-w-2xl text-sm text-muted sm:text-base" x-text="t('aig.subtitle')"></p>
        </div>
        <button type="button" class="btn btn-outline shrink-0" @click="openLogs($event)" aria-haspopup="dialog">
          <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
          <span x-text="t('aig.logsBtn')"></span>
        </button>
      </section>

      <!-- ================= حصتي الشخصية من التوكنز ================= -->
      <section class="panel p-4 sm:p-5" aria-labelledby="tokens-title">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
          <div class="flex min-w-0 items-start gap-3">
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-accent-500/20 text-lg text-yellow-900 dark:text-accent-500" aria-hidden="true"><i class="fa-solid fa-coins"></i></span>
            <div class="min-w-0">
              <h2 id="tokens-title" class="font-extrabold text-ink" x-text="t('aig.tokens.title')"></h2>
              <p class="mt-0.5 text-xs text-muted sm:text-sm" x-text="t('aig.tokens.caption')"></p>
            </div>
          </div>

          <div class="min-w-0 flex-1 lg:max-w-md">
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs font-bold">
              <span class="text-ink" x-text="tf('aig.tokens.usedPct', { v: fmtPct(usagePct) })"></span>
              <span class="tabular-nums text-muted" x-text="tf('aig.tokens.usedOf', { used: fmtNum(usage.used), limit: fmtNum(usage.limit) })"></span>
            </div>
            <div class="quota-track mt-1.5" aria-hidden="true">
              <div class="quota-fill" :class="quotaTone" :style="'width:' + usagePct.toFixed(1) + '%'"></div>
            </div>
            <p class="mt-1.5 text-xs text-muted" x-text="tf('aig.tokens.remaining', { n: fmtNum(remaining), date: fmtDateOnly(usage.resetsOn) })"></p>
          </div>
        </div>
      </section>

      <!-- ================= استوديو التوليد ================= -->
      <div class="grid grid-cols-1 items-start gap-5 lg:grid-cols-2">

        <!-- ========== لوحة الإعدادات ========== -->
        <form id="settings" class="panel space-y-5 p-5 sm:p-6" novalidate @submit.prevent="generate()" aria-labelledby="settings-title">
          <h2 id="settings-title" class="text-lg font-extrabold text-ink" x-text="t('aig.settingsTitle')"></h2>

          <!-- ملخص الأخطاء -->
          <div id="gen-errors" x-cloak x-show="showErrors && errorList.length" tabindex="-1" role="alert"
               class="rounded-xl border border-error-600/40 bg-error-500/10 p-4 text-sm text-danger focus:outline-none">
            <p class="font-extrabold" x-text="tf('aig.errSummary', { n: fmtNum(errorList.length) })"></p>
            <ul class="mt-2 list-disc space-y-1 ps-5">
              <template x-for="e in errorList" :key="e.key">
                <li><a :href="'#' + e.target" class="font-bold underline underline-offset-2" @click.prevent="focusId(e.target)" x-text="e.msg"></a></li>
              </template>
            </ul>
          </div>

          <!-- نوع المحتوى (مجموعة أزرار راديو) -->
          <fieldset>
            <legend id="mode-legend" class="label" x-text="t('aig.modeLegend')"></legend>
            <div class="grid grid-cols-1 gap-2 sm:grid-cols-3" role="radiogroup" aria-labelledby="mode-legend">
              <template x-for="m in modes" :key="m.key">
                <label class="mode-tab has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-brand has-[:focus-visible]:ring-offset-2 has-[:focus-visible]:ring-offset-card" :class="mode === m.key && 'is-checked'">
                  <input type="radio" name="gen-mode" class="sr-only" :value="m.key" :checked="modeRender >= 0 && mode === m.key" @change="requestMode(m.key)">
                  <i class="fa-solid" :class="m.icon" aria-hidden="true"></i>
                  <span x-text="t('aig.mode.' + m.key)"></span>
                </label>
              </template>
            </div>
          </fieldset>

          <!-- المصدر: مقرر ← وحدة ← درس + المفاهيم -->
          <fieldset class="space-y-3 border-t border-line pt-5">
            <legend class="label float-start w-full" x-text="t('aig.sourceTitle')"></legend>
            <div class="clear-both grid grid-cols-1 gap-3 sm:grid-cols-3 lg:grid-cols-1 xl:grid-cols-3">

              <!-- المقرر -->
              <div class="relative"
                   x-data="selectDropdown({ id: 'ai-course', options: () => courseOptions, get: () => form.courseId, set: (v) => setCourse(v), placeholder: () => t('aig.selectCourse') })"
                   @click.outside="closeList()">
                <span id="ai-course-label" class="mb-1 block text-xs font-bold text-muted"><span x-text="t('aig.fieldCourse')"></span> <span class="text-danger" aria-hidden="true">*</span></span>
                <button type="button" id="ai-course" x-ref="btn" role="combobox" aria-haspopup="listbox" aria-required="true"
                        :aria-expanded="open.toString()" aria-controls="ai-course-list" aria-labelledby="ai-course-label ai-course"
                        :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                        :aria-invalid="invalid('course')" :aria-describedby="describedBy('course')"
                        class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                        @click="toggleList()" @keydown="onKey($event)">
                  <span class="truncate" :class="!selectedItem && 'text-muted'" x-text="triggerLabel"></span>
                  <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
                </button>
                <ul x-show="open" x-cloak x-ref="list" id="ai-course-list" role="listbox" aria-labelledby="ai-course-label"
                    x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                  <template x-for="(item, idx) in items" :key="item.value">
                    <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                        class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                        @click="choose(item)" @mousemove="active = idx">
                      <span class="truncate" x-text="item.label"></span>
                      <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                    </li>
                  </template>
                </ul>
                <p id="err-course" class="err" role="alert" x-show="err('course')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('course')"></span></p>
              </div>

              <!-- الوحدة -->
              <div class="relative"
                   x-data="selectDropdown({ id: 'ai-unit', options: () => unitOptions, get: () => form.unitId, set: (v) => setUnit(v), placeholder: () => t('aig.selectCourseFirst') })"
                   @click.outside="closeList()">
                <span id="ai-unit-label" class="mb-1 block text-xs font-bold text-muted" x-text="t('aig.fieldUnit')"></span>
                <button type="button" id="ai-unit" x-ref="btn" role="combobox" aria-haspopup="listbox"
                        :aria-expanded="open.toString()" aria-controls="ai-unit-list" aria-labelledby="ai-unit-label ai-unit"
                        :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                        :disabled="!form.courseId"
                        class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                        @click="toggleList()" @keydown="onKey($event)">
                  <span class="truncate" x-text="triggerLabel"></span>
                  <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
                </button>
                <ul x-show="open" x-cloak x-ref="list" id="ai-unit-list" role="listbox" aria-labelledby="ai-unit-label"
                    x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                  <template x-for="(item, idx) in items" :key="item.value">
                    <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                        class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                        @click="choose(item)" @mousemove="active = idx">
                      <span class="truncate" x-text="item.label"></span>
                      <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                    </li>
                  </template>
                </ul>
              </div>

              <!-- الدرس -->
              <div class="relative"
                   x-data="selectDropdown({ id: 'ai-lesson', options: () => lessonOptions, get: () => form.lessonId, set: (v) => setLesson(v), placeholder: () => (form.courseId ? t('aig.selectUnitFirst') : t('aig.selectCourseFirst')) })"
                   @click.outside="closeList()">
                <span id="ai-lesson-label" class="mb-1 block text-xs font-bold text-muted" x-text="t('aig.fieldLesson')"></span>
                <button type="button" id="ai-lesson" x-ref="btn" role="combobox" aria-haspopup="listbox"
                        :aria-expanded="open.toString()" aria-controls="ai-lesson-list" aria-labelledby="ai-lesson-label ai-lesson"
                        :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                        :disabled="!form.unitId"
                        class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                        @click="toggleList()" @keydown="onKey($event)">
                  <span class="truncate" x-text="triggerLabel"></span>
                  <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
                </button>
                <ul x-show="open" x-cloak x-ref="list" id="ai-lesson-list" role="listbox" aria-labelledby="ai-lesson-label"
                    x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                  <template x-for="(item, idx) in items" :key="item.value">
                    <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                        class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                        @click="choose(item)" @mousemove="active = idx">
                      <span class="truncate" x-text="item.label"></span>
                      <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                    </li>
                  </template>
                </ul>
              </div>
            </div>
            <p class="hint" x-text="t('aig.sourceHint')"></p>

            <!-- المفاهيم (اختيار متعدد) -->
            <fieldset x-show="mode !== 'concepts'" class="pt-1" aria-describedby="concepts-hint">
              <legend class="label float-start flex w-full flex-wrap items-center justify-between gap-2">
                <span x-text="t('aig.fieldConcepts')"></span>
                <span class="badge badge-muted" x-show="form.conceptIds.length" x-text="tf('aig.conceptsSelected', { n: fmtNum(form.conceptIds.length) })"></span>
              </legend>
              <p class="clear-both text-sm text-muted" x-show="!form.courseId" x-text="t('aig.conceptsNeedCourse')"></p>
              <p class="clear-both text-sm text-muted" x-show="form.courseId && !conceptOptions.length" x-text="t('aig.conceptsNone')"></p>
              <ul class="clear-both max-h-48 space-y-0.5 overflow-y-auto rounded-xl border border-line p-1.5 scroll-thin" x-show="conceptOptions.length" role="list">
                <template x-for="k in conceptOptions" :key="k.id">
                  <li>
                    <label class="flex cursor-pointer items-center gap-2.5 rounded-lg px-2.5 py-2 text-sm text-ink hover:bg-soft">
                      <input type="checkbox" class="h-4 w-4 shrink-0 accent-primary-500" :value="k.id" x-model="form.conceptIds">
                      <span class="min-w-0 flex-1" x-text="loc(k.name)"></span>
                      <bdi dir="ltr" class="shrink-0 text-xs font-bold text-muted" x-text="k.code"></bdi>
                    </label>
                  </li>
                </template>
              </ul>
              <div class="mt-1.5 flex flex-wrap items-center justify-between gap-2">
                <p id="concepts-hint" class="hint mt-0" x-text="t('aig.conceptsHint')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" x-show="form.conceptIds.length" @click="form.conceptIds = []" x-text="t('aig.clearConcepts')"></button>
              </div>
            </fieldset>
          </fieldset>

          <!-- ========== معطيات الأسئلة ========== -->
          <div x-show="mode === 'questions'" class="space-y-5 border-t border-line pt-5">
            <p class="label" x-text="t('aig.paramsTitle')"></p>

            <!-- العدد -->
            <div>
              <label for="ai-count-num" class="label" x-text="t('aig.fieldCount')"></label>
              <div class="flex items-center gap-3">
                <input id="ai-count" type="range" :min="COUNT_MIN" :max="COUNT_MAX" step="1" x-model.number="form.count"
                       :aria-label="t('aig.fieldCount')" :aria-valuetext="tf('aig.countValue', { n: fmtNum(form.count) })"
                       class="h-2 min-w-0 flex-1 cursor-pointer appearance-none rounded-full bg-line accent-primary-500">
                <input id="ai-count-num" type="number" inputmode="numeric" :min="COUNT_MIN" :max="COUNT_MAX" step="1" x-model.number="form.count"
                       class="field w-20 text-center tabular-nums" :aria-invalid="invalid('count')" :aria-describedby="describedBy('count', 'ai-count-hint')">
              </div>
              <p id="ai-count-hint" class="hint" x-text="tf('aig.countHint', { min: fmtNum(COUNT_MIN), max: fmtNum(COUNT_MAX) })"></p>
              <p id="err-count" class="err" role="alert" x-show="err('count')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('count')"></span></p>
            </div>

            <!-- أنواع الأسئلة (متعدد) -->
            <fieldset :aria-invalid="invalid('types')" :aria-describedby="describedBy('types', 'ai-types-hint')">
              <legend class="label" x-text="t('aig.fieldTypes')"></legend>
              <div class="grid grid-cols-2 gap-2">
                <template x-for="ty in types" :key="ty">
                  <label class="pill-option has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-brand has-[:focus-visible]:ring-offset-2 has-[:focus-visible]:ring-offset-card" :class="form.types.includes(ty) && 'is-checked'">
                    <input type="checkbox" class="sr-only" :id="'ai-type-' + ty" :value="ty" x-model="form.types">
                    <i class="fa-solid text-xs" :class="form.types.includes(ty) ? 'fa-square-check' : 'fa-square'" aria-hidden="true"></i>
                    <span x-text="t('aig.type.' + ty)"></span>
                  </label>
                </template>
              </div>
              <p id="ai-types-hint" class="hint" x-text="t('aig.typesHint')"></p>
              <p id="err-types" class="err" role="alert" x-show="err('types')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('types')"></span></p>
            </fieldset>

            <!-- مستوى بلوم: مستوى واحد أو مزيج -->
            <fieldset>
              <legend class="label" x-text="t('aig.fieldBloom')"></legend>
              <div class="grid grid-cols-2 gap-2" role="radiogroup" :aria-label="t('aig.fieldBloom')">
                <label class="pill-option has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-brand has-[:focus-visible]:ring-offset-2 has-[:focus-visible]:ring-offset-card" :class="form.bloomMode === 'single' && 'is-checked'">
                  <input type="radio" name="ai-bloom-mode" value="single" class="sr-only" :checked="form.bloomMode === 'single'" @change="setBloomMode('single')">
                  <span x-text="t('aig.distSingle')"></span>
                </label>
                <label class="pill-option has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-brand has-[:focus-visible]:ring-offset-2 has-[:focus-visible]:ring-offset-card" :class="form.bloomMode === 'mix' && 'is-checked'">
                  <input type="radio" name="ai-bloom-mode" value="mix" class="sr-only" :checked="form.bloomMode === 'mix'" @change="setBloomMode('mix')">
                  <span x-text="t('aig.distMix')"></span>
                </label>
              </div>

              <div x-show="form.bloomMode === 'single'" class="relative mt-3"
                   x-data="selectDropdown({ id: 'ai-bloom', options: () => bloomOptions, get: () => form.bloom, set: (v) => form.bloom = v })"
                   @click.outside="closeList()">
                <span id="ai-bloom-label" class="mb-1 block text-xs font-bold text-muted" x-text="t('aig.bloomLevel')"></span>
                <button type="button" id="ai-bloom" x-ref="btn" role="combobox" aria-haspopup="listbox"
                        :aria-expanded="open.toString()" aria-controls="ai-bloom-list" aria-labelledby="ai-bloom-label ai-bloom"
                        :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                        class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                        @click="toggleList()" @keydown="onKey($event)">
                  <span class="truncate" x-text="triggerLabel"></span>
                  <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
                </button>
                <ul x-show="open" x-cloak x-ref="list" id="ai-bloom-list" role="listbox" aria-labelledby="ai-bloom-label"
                    x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                  <template x-for="(item, idx) in items" :key="item.value">
                    <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                        class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                        @click="choose(item)" @mousemove="active = idx">
                      <span class="truncate" x-text="item.label"></span>
                      <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                    </li>
                  </template>
                </ul>
              </div>

              <div x-show="form.bloomMode === 'mix'" x-cloak class="mt-3">
                <div class="grid grid-cols-2 gap-2 sm:grid-cols-3">
                  <template x-for="b in blooms" :key="b">
                    <div>
                      <label :for="'ai-bmix-' + b" class="mb-1 block text-xs font-bold text-muted" x-text="t('aig.bloom.' + b)"></label>
                      <input type="number" :id="'ai-bmix-' + b" inputmode="numeric" min="0" :max="COUNT_MAX" step="1" class="field text-center tabular-nums"
                             x-model.number="form.bloomMix[b]" :aria-invalid="invalid('bloomMix')" :aria-describedby="describedBy('bloomMix', 'ai-bloom-sum')">
                    </div>
                  </template>
                </div>
                <div class="mt-2 flex flex-wrap items-center justify-between gap-2">
                  <p id="ai-bloom-sum" role="status" class="text-xs font-bold"
                     :class="bloomSum === form.count ? 'text-success-700 dark:text-success-500' : 'text-warning-700 dark:text-warning-500'">
                    <i class="fa-solid" :class="bloomSum === form.count ? 'fa-circle-check' : 'fa-circle-exclamation'" aria-hidden="true"></i>
                    <span x-text="sumMessage(bloomSum)"></span>
                  </p>
                  <button type="button" class="text-xs font-bold text-brand hover:underline" @click="distributeBloom()" x-text="t('aig.distribute')"></button>
                </div>
                <p id="err-bloomMix" class="err" role="alert" x-show="err('bloomMix')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('bloomMix')"></span></p>
              </div>
            </fieldset>

            <!-- الصعوبة: مستوى واحد أو مزيج -->
            <fieldset>
              <legend class="label" x-text="t('aig.fieldDifficulty')"></legend>
              <div class="grid grid-cols-2 gap-2" role="radiogroup" :aria-label="t('aig.fieldDifficulty')">
                <label class="pill-option has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-brand has-[:focus-visible]:ring-offset-2 has-[:focus-visible]:ring-offset-card" :class="form.diffMode === 'single' && 'is-checked'">
                  <input type="radio" name="ai-diff-mode" value="single" class="sr-only" :checked="form.diffMode === 'single'" @change="setDiffMode('single')">
                  <span x-text="t('aig.distSingle')"></span>
                </label>
                <label class="pill-option has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-brand has-[:focus-visible]:ring-offset-2 has-[:focus-visible]:ring-offset-card" :class="form.diffMode === 'mix' && 'is-checked'">
                  <input type="radio" name="ai-diff-mode" value="mix" class="sr-only" :checked="form.diffMode === 'mix'" @change="setDiffMode('mix')">
                  <span x-text="t('aig.distMix')"></span>
                </label>
              </div>

              <div x-show="form.diffMode === 'single'" class="mt-3 grid grid-cols-3 gap-2" role="radiogroup" :aria-label="t('aig.fieldDifficulty')">
                <template x-for="d in diffs" :key="d">
                  <label class="pill-option has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-brand has-[:focus-visible]:ring-offset-2 has-[:focus-visible]:ring-offset-card" :class="form.difficulty === d && 'is-checked'">
                    <input type="radio" name="ai-difficulty" class="sr-only" :value="d" x-model="form.difficulty">
                    <span x-text="t('aig.diff.' + d)"></span>
                  </label>
                </template>
              </div>

              <div x-show="form.diffMode === 'mix'" x-cloak class="mt-3">
                <div class="grid grid-cols-3 gap-2">
                  <template x-for="d in diffs" :key="d">
                    <div>
                      <label :for="'ai-dmix-' + d" class="mb-1 block text-xs font-bold text-muted" x-text="t('aig.diff.' + d)"></label>
                      <input type="number" :id="'ai-dmix-' + d" inputmode="numeric" min="0" :max="COUNT_MAX" step="1" class="field text-center tabular-nums"
                             x-model.number="form.diffMix[d]" :aria-invalid="invalid('diffMix')" :aria-describedby="describedBy('diffMix', 'ai-diff-sum')">
                    </div>
                  </template>
                </div>
                <div class="mt-2 flex flex-wrap items-center justify-between gap-2">
                  <p id="ai-diff-sum" role="status" class="text-xs font-bold"
                     :class="diffSum === form.count ? 'text-success-700 dark:text-success-500' : 'text-warning-700 dark:text-warning-500'">
                    <i class="fa-solid" :class="diffSum === form.count ? 'fa-circle-check' : 'fa-circle-exclamation'" aria-hidden="true"></i>
                    <span x-text="sumMessage(diffSum)"></span>
                  </p>
                  <button type="button" class="text-xs font-bold text-brand hover:underline" @click="distributeDiff()" x-text="t('aig.distribute')"></button>
                </div>
                <p id="err-diffMix" class="err" role="alert" x-show="err('diffMix')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('diffMix')"></span></p>
              </div>
            </fieldset>
          </div>

          <!-- ========== معطيات المفاهيم ========== -->
          <div x-show="mode === 'concepts'" x-cloak class="space-y-4 border-t border-line pt-5">
            <p class="label" x-text="t('aig.paramsTitle')"></p>
            <div>
              <label for="ai-ccount-num" class="label" x-text="t('aig.fieldConceptCount')"></label>
              <div class="flex items-center gap-3">
                <input id="ai-ccount" type="range" :min="COUNT_MIN" :max="CONCEPT_MAX" step="1" x-model.number="form.conceptCount"
                       :aria-label="t('aig.fieldConceptCount')" :aria-valuetext="tf('aig.conceptCountValue', { n: fmtNum(form.conceptCount) })"
                       class="h-2 min-w-0 flex-1 cursor-pointer appearance-none rounded-full bg-line accent-primary-500">
                <input id="ai-ccount-num" type="number" inputmode="numeric" :min="COUNT_MIN" :max="CONCEPT_MAX" step="1" x-model.number="form.conceptCount"
                       class="field w-20 text-center tabular-nums" :aria-invalid="invalid('conceptCount')" :aria-describedby="describedBy('conceptCount', 'ai-ccount-hint')">
              </div>
              <p id="ai-ccount-hint" class="hint" x-text="tf('aig.countHint', { min: fmtNum(COUNT_MIN), max: fmtNum(CONCEPT_MAX) })"></p>
              <p id="err-conceptCount" class="err" role="alert" x-show="err('conceptCount')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('conceptCount')"></span></p>
            </div>
          </div>

          <!-- ========== معطيات الملخصات ========== -->
          <div x-show="mode === 'summaries'" x-cloak class="space-y-4 border-t border-line pt-5">
            <p class="label" x-text="t('aig.paramsTitle')"></p>
            <fieldset>
              <legend class="label" x-text="t('aig.fieldSummaryLength')"></legend>
              <div class="grid grid-cols-3 gap-2">
                <template x-for="len in lengths" :key="len">
                  <label class="pill-option has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-brand has-[:focus-visible]:ring-offset-2 has-[:focus-visible]:ring-offset-card" :class="form.summaryLength === len && 'is-checked'">
                    <input type="radio" name="ai-summary-len" class="sr-only" :value="len" x-model="form.summaryLength">
                    <span x-text="t('aig.len.' + len)"></span>
                  </label>
                </template>
              </div>
            </fieldset>
          </div>

          <!-- لغة المخرجات -->
          <fieldset class="border-t border-line pt-5">
            <legend class="label float-start w-full" x-text="t('aig.fieldLang')"></legend>
            <div class="clear-both grid grid-cols-3 gap-2">
              <template x-for="lg in langs" :key="lg">
                <label class="pill-option has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-brand has-[:focus-visible]:ring-offset-2 has-[:focus-visible]:ring-offset-card" :class="form.lang === lg && 'is-checked'">
                  <input type="radio" name="ai-lang" class="sr-only" :value="lg" x-model="form.lang">
                  <span x-text="t('aig.lang.' + lg)"></span>
                </label>
              </template>
            </div>
          </fieldset>

          <!-- التعليمات الإضافية والملف المرجعي -->
          <div class="space-y-4 border-t border-line pt-5">
            <div>
              <label for="ai-prompt" class="label" x-text="t('aig.promptLabel')"></label>
              <textarea id="ai-prompt" rows="4" :maxlength="PROMPT_MAX" x-model="form.prompt" class="field resize-y"
                        :placeholder="t('aig.promptPlaceholder')" :aria-invalid="invalid('prompt')" :aria-describedby="describedBy('prompt', 'ai-prompt-count')"></textarea>
              <p id="ai-prompt-count" class="hint text-end tabular-nums" x-text="tf('aig.promptCount', { n: fmtNum(form.prompt.length), max: fmtNum(PROMPT_MAX) })"></p>
              <p id="err-prompt" class="err" role="alert" x-show="err('prompt')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('prompt')"></span></p>
            </div>

            <div>
              <label for="ai-file" class="label" x-text="t('aig.fileLabel')"></label>
              <input id="ai-file" type="file" accept=".pdf,.docx,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"
                     @change="onFile($event)" :aria-invalid="invalid('file')" :aria-describedby="describedBy('file', 'ai-file-hint')"
                     class="block w-full text-sm text-muted file:me-3 file:cursor-pointer file:rounded-lg file:border file:border-line file:bg-card file:px-3 file:py-1.5 file:text-xs file:font-bold file:text-ink hover:file:bg-soft">
              <p id="ai-file-hint" class="hint" x-text="t('aig.fileHint')"></p>
              <p id="err-file" class="err" role="alert" x-show="err('file')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="err('file')"></span></p>
              <div x-show="file" x-cloak class="mt-2 inline-flex max-w-full items-center gap-2 rounded-lg bg-info-500/10 px-3 py-1.5 text-xs font-bold text-info-700 dark:text-blue-300">
                <i class="fa-regular fa-file-lines shrink-0" aria-hidden="true"></i>
                <bdi class="min-w-0 truncate" x-text="file ? file.name : ''"></bdi>
                <span class="shrink-0 font-medium" x-text="file ? '(' + fmtBytes(file.size) + ')' : ''"></span>
                <button type="button" class="ms-1 grid h-6 w-6 shrink-0 place-items-center rounded hover:bg-info-500/20 focus-visible:ring-2" @click="removeFile()"
                        :aria-label="file ? tf('aig.removeFile', { name: file.name }) : ''">
                  <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- التقدير + التوليد -->
          <div class="space-y-3 border-t border-line pt-5">
            <p id="ai-estimate" class="flex items-start gap-2 rounded-xl px-3 py-2.5 text-sm font-bold"
               :class="overQuota ? 'bg-warning-500/15 text-warning-800 dark:text-warning-500' : 'bg-soft text-ink'">
              <i class="fa-solid mt-0.5" :class="overQuota ? 'fa-triangle-exclamation' : 'fa-coins'" aria-hidden="true"></i>
              <span>
                <span x-text="tf('aig.estimate', { n: fmtNum(estimate), rem: fmtNum(remaining) })"></span>
                <span x-show="overQuota" class="mt-0.5 block font-medium" x-text="t('aig.estimateOver')"></span>
              </span>
            </p>
            <button type="submit" id="ai-generate" class="btn btn-accent w-full justify-center py-3.5 text-base"
                    :disabled="genState === 'running'" :aria-busy="(genState === 'running').toString()" aria-describedby="ai-estimate">
              <i class="fa-solid animate-spin fa-circle-notch" x-show="genState === 'running'" aria-hidden="true"></i>
              <i class="fa-solid fa-wand-magic-sparkles" x-show="genState !== 'running'" aria-hidden="true"></i>
              <span x-text="genState === 'running' ? t('aig.generating') : t('aig.generateBtn')"></span>
            </button>
            <button type="button" class="btn btn-outline btn-sm w-full justify-center" @click="clearAll()">
              <i class="fa-solid fa-eraser" aria-hidden="true"></i>
              <span x-text="t('aig.clearBtn')"></span>
            </button>
          </div>
        </form>

        <!-- ========== المعاينة والنتائج ========== -->
        <section class="panel min-h-[32rem] p-5 sm:p-6" aria-labelledby="results-panel-title" :aria-busy="(genState === 'running').toString()">
          <h2 id="results-panel-title" class="sr-only" x-text="t('aig.resultsPanel')"></h2>

          <!-- حالة فارغة -->
          <div x-show="genState !== 'running' && !['error', 'cancelled', 'quota'].includes(genState) && !results.length"
               class="flex h-full min-h-[28rem] flex-col items-center justify-center text-center">
            <span class="mb-4 grid h-16 w-16 place-items-center rounded-2xl bg-primary-500/10 text-2xl text-brand" aria-hidden="true"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
            <p class="font-extrabold text-ink" x-text="genState === 'done' ? t('aig.allDiscarded') : t('aig.emptyTitle')"></p>
            <p class="mx-auto mt-1.5 max-w-sm text-sm text-muted" x-text="genState === 'done' ? t('aig.allDiscardedHint') : t('aig.emptySubtitle')"></p>
            <ul x-show="genState !== 'done'" class="mx-auto mt-5 max-w-sm space-y-2.5 text-start text-sm text-muted" role="list">
              <li class="flex items-start gap-2.5"><i class="fa-solid fa-circle-check mt-0.5 shrink-0 text-success-500" aria-hidden="true"></i> <span x-text="t('aig.tip1')"></span></li>
              <li class="flex items-start gap-2.5"><i class="fa-solid fa-circle-check mt-0.5 shrink-0 text-success-500" aria-hidden="true"></i> <span x-text="t('aig.tip2')"></span></li>
              <li class="flex items-start gap-2.5"><i class="fa-solid fa-circle-check mt-0.5 shrink-0 text-success-500" aria-hidden="true"></i> <span x-text="t('aig.tip3')"></span></li>
            </ul>
          </div>

          <!-- حالة التشغيل -->
          <div x-show="genState === 'running'" x-cloak class="flex h-full min-h-[28rem] flex-col items-center justify-center gap-5 text-center">
            <span class="grid h-14 w-14 place-items-center rounded-2xl bg-accent-500/20 text-xl text-yellow-900 dark:text-accent-500" aria-hidden="true">
              <i class="fa-solid fa-circle-notch animate-spin"></i>
            </span>
            <div>
              <p class="font-extrabold text-ink" x-text="t('aig.busyTitle')"></p>
              <p class="mt-1 text-sm font-bold text-muted tabular-nums" x-text="progressText"></p>
            </div>
            <div class="w-full max-w-sm">
              <div class="h-2 overflow-hidden rounded-full bg-line" role="progressbar" :aria-label="t('aig.progressLabel')"
                   aria-valuemin="0" aria-valuemax="100" :aria-valuenow="progressPct" :aria-valuetext="progressText">
                <div class="h-full rounded-full bg-primary-500 transition-[width] duration-300" :style="'width:' + progressPct + '%'"></div>
              </div>
            </div>
            <div class="w-full max-w-sm space-y-2.5" aria-hidden="true">
              <div class="gen-skeleton"></div>
              <div class="gen-skeleton"></div>
            </div>
            <button type="button" id="gen-cancel" class="btn btn-danger" @click="cancelRun()">
              <i class="fa-solid fa-circle-stop" aria-hidden="true"></i>
              <span x-text="t('aig.cancelBtn')"></span>
            </button>
          </div>

          <!-- حالات: خطأ / ملغى / الحصة -->
          <div x-show="['error', 'cancelled', 'quota'].includes(genState)" x-cloak class="flex h-full min-h-[28rem] flex-col items-center justify-center gap-4 text-center">
            <span class="grid h-14 w-14 place-items-center rounded-2xl text-xl" aria-hidden="true"
                  :class="genState === 'cancelled' ? 'bg-line text-muted' : genState === 'quota' ? 'bg-warning-500/15 text-warning-700 dark:text-warning-500' : 'bg-error-500/10 text-danger'">
              <i class="fa-solid" :class="genState === 'cancelled' ? 'fa-circle-stop' : genState === 'quota' ? 'fa-gauge-high' : 'fa-triangle-exclamation'"></i>
            </span>
            <h3 id="gen-status-title" tabindex="-1" class="text-lg font-extrabold text-ink focus:outline-none" x-text="statusTitle"></h3>
            <p class="mx-auto max-w-md text-sm leading-6 text-muted" x-text="statusText"></p>
            <div class="flex flex-wrap items-center justify-center gap-2">
              <button type="button" class="btn btn-accent" x-show="genState !== 'quota'" @click="generate()">
                <i class="fa-solid fa-rotate-right" aria-hidden="true"></i> <span x-text="t('aig.retryBtn')"></span>
              </button>
              <button type="button" class="btn btn-outline" @click="backToSettings()">
                <i class="fa-solid fa-sliders" aria-hidden="true"></i> <span x-text="t('aig.backToSettings')"></span>
              </button>
            </div>
          </div>

          <!-- النتائج -->
          <div x-show="results.length && genState !== 'running'" x-cloak class="space-y-4">
            <div>
              <h3 id="results-title" tabindex="-1" class="flex items-center gap-2 text-base font-extrabold text-success-700 focus:outline-none dark:text-success-500">
                <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                <span x-text="tf('aig.resultsTitle', { n: fmtNum(results.length) })"></span>
              </h3>
              <p class="mt-1 text-xs text-muted" x-text="t('aig.resultsHint')"></p>
            </div>

            <!-- شريط الإجراءات الجماعية -->
            <div x-show="selectable.length" class="flex flex-col gap-3 rounded-xl border border-line bg-page/50 p-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <label class="flex items-center gap-2 text-sm font-bold text-ink">
                  <input type="checkbox" id="select-all" class="h-4 w-4 accent-primary-500" :checked="allSelected"
                         x-effect="$el.indeterminate = someSelected" @change="toggleAll($event.target.checked)">
                  <span x-text="t('aig.selectAll')"></span>
                </label>
                <span class="text-xs font-bold text-muted" x-text="tf('aig.selectedCount', { n: fmtNum(selectedItems.length), total: fmtNum(selectable.length) })"></span>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button type="button" class="btn btn-primary btn-sm" @click="saveSelected()" :aria-disabled="(!selectedItems.length).toString()" :class="!selectedItems.length && 'opacity-60'">
                  <i class="fa-solid fa-box-archive" aria-hidden="true"></i>
                  <span x-text="t('aig.saveDrafts.' + kindOf())"></span>
                </button>
                <button type="button" class="btn btn-outline btn-sm" x-show="results[0] && results[0].kind === 'question'" @click="openQuiz($event)" aria-haspopup="dialog"
                        :aria-disabled="(!selectedQuestions.length).toString()" :class="!selectedQuestions.length && 'opacity-60'">
                  <i class="fa-solid fa-plus" aria-hidden="true"></i>
                  <span x-text="t('aig.addToQuiz')"></span>
                </button>
                <button type="button" class="btn btn-outline btn-sm ms-auto" @click="clearResults()">
                  <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
                  <span x-text="t('aig.clearResults')"></span>
                </button>
              </div>
            </div>
            <div x-show="!selectable.length" class="flex justify-end">
              <button type="button" class="btn btn-outline btn-sm" @click="clearResults()">
                <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
                <span x-text="t('aig.clearResults')"></span>
              </button>
            </div>

            <!-- إشعار الحفظ -->
            <div id="saved-notice" x-show="savedNotice" x-cloak tabindex="-1" role="status"
                 class="rounded-xl border border-success-500/40 bg-success-500/10 p-3 text-sm focus:outline-none">
              <p class="flex items-start gap-2 font-bold text-success-700 dark:text-success-500">
                <i class="fa-solid fa-circle-check mt-0.5" aria-hidden="true"></i>
                <span x-text="savedNotice ? tf('aig.savedNotice.' + savedNotice.kind, { n: fmtNum(savedNotice.n) }) : ''"></span>
              </p>
              <a href="ReviewQueue.html" class="mt-1.5 inline-flex items-center gap-1.5 font-bold text-brand hover:underline">
                <span x-text="t('aig.openReview')"></span> <i class="fa-solid fa-arrow-right rtl:-scale-x-100 text-xs" aria-hidden="true"></i>
              </a>
              <p class="mt-1 text-xs text-muted" x-text="t('aig.sessionNote')"></p>
            </div>

            <!-- إشعار الإضافة إلى اختبار -->
            <div id="added-notice" x-show="addedNotice" x-cloak tabindex="-1" role="status"
                 class="rounded-xl border border-primary-500/40 bg-primary-500/10 p-3 text-sm focus:outline-none">
              <p class="flex items-start gap-2 font-bold text-ink">
                <i class="fa-solid fa-circle-check mt-0.5 text-brand" aria-hidden="true"></i>
                <span x-text="addedNotice ? tf('aig.addedNotice', { n: fmtNum(addedNotice.n), title: loc(addedNotice.title) }) : ''"></span>
              </p>
              <a :href="addedNotice ? 'quiz-builder.html?quiz=' + encodeURIComponent(addedNotice.code) : '#'" class="mt-1.5 inline-flex items-center gap-1.5 font-bold text-brand hover:underline">
                <span x-text="addedNotice ? tf('aig.openQuiz', { code: addedNotice.code }) : ''"></span> <i class="fa-solid fa-arrow-right rtl:-scale-x-100 text-xs" aria-hidden="true"></i>
              </a>
              <p class="mt-1 text-xs text-muted" x-text="t('aig.quizDlg.note')"></p>
            </div>

            <!-- بطاقات المسودات -->
            <ol class="space-y-4" role="list">
              <template x-for="(r, ri) in results" :key="r.uid">
                <li>
                  <article class="gen-card" :class="r.selected && 'border-primary-500/60 bg-soft/40'" :aria-labelledby="'r-' + r.uid + '-h'">
                    <header class="mb-3 flex flex-wrap items-start justify-between gap-2">
                      <div class="flex min-w-0 items-center gap-2.5">
                        <input type="checkbox" x-show="r.kind !== 'summary'" :id="'r-' + r.uid + '-sel'" x-model="r.selected" class="h-4 w-4 shrink-0 accent-primary-500"
                               :aria-label="tf('aig.selectItem', { label: label(r) })">
                        <h4 :id="'r-' + r.uid + '-h'" class="text-sm font-extrabold text-ink" x-text="label(r)"></h4>
                      </div>
                      <span class="badge badge-warning shrink-0"><i class="fa-solid fa-triangle-exclamation text-[10px]" aria-hidden="true"></i> <span x-text="t('aig.aiDraft')"></span></span>
                      <div class="flex w-full flex-wrap items-center gap-1.5">
                        <span class="badge badge-primary" x-show="r.type" x-text="r.type ? t('aig.type.' + r.type) : ''"></span>
                        <span class="badge" :class="bloomCls(r.bloom)" x-show="r.bloom" x-text="r.bloom ? t('aig.bloom.' + r.bloom) : ''"></span>
                        <span class="badge" :class="diffCls(r.difficulty)" x-show="r.difficulty" x-text="r.difficulty ? t('aig.diff.' + r.difficulty) : ''"></span>
                        <span class="badge badge-muted" x-show="r.marks"><i class="fa-solid fa-star text-[9px]" aria-hidden="true"></i> <span x-text="tf('aig.marks', { n: fmtNum(r.marks) })"></span></span>
                        <span class="badge badge-success" x-show="r.status === 'draft'"><i class="fa-solid fa-box-archive text-[10px]" aria-hidden="true"></i> <span x-text="t('aig.statusSaved')"></span></span>
                        <span class="badge badge-info" x-show="r.addedTo"><i class="fa-solid fa-plus text-[10px]" aria-hidden="true"></i> <span x-text="r.addedTo ? tf('aig.addedTo', { code: r.addedTo }) : ''"></span></span>

<script>
/* ==========================================================================
   FirOb — بيانات المعلم المشتركة (Teacher shared mock data) — global `TC`
   مصدر واحد متّسق لكل صفحات المعلم: المقررات، المفاهيم، العناصر التعليمية،
   الاختبارات وأسئلتها، الطلبة، المحاولات، استهلاك الذكاء الاصطناعي، طلبات المراجعة.
   - كل الطوابع الزمنية محسوبة نسبةً إلى لحظة التحميل (إزاحات ثابتة، بلا عشوائية).
   - البيانات للقراءة؛ انسخها نسخًا عميقًا (TC.clone) قبل تعديلها في حالة الصفحة.
   ========================================================================== */
const TC = (() => {
  'use strict';

  /* ---------------- الوقت والمساعدات الأساسية ---------------- */
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  const LOAD = new Date(); LOAD.setSeconds(0, 0);
  const now = () => new Date();
  const addMinutes = (d, m) => new Date(new Date(d).getTime() + m * 60000);
  const addDays = (d, n) => addMinutes(d, n * 1440);
  /** Date → 'YYYY-MM-DDTHH:mm' بالتوقيت المحلي (لحقول datetime-local) */
  const isoLocal = (d) => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
