      get conceptOptions() {
        const f = this.form;
        if (!f.courseId) return [];
        return TC.CONCEPTS.filter((k) => k.courseId === f.courseId && (!f.unitId || k.unitId === f.unitId) && (!f.lessonId || k.lessonId === f.lessonId));
      },
      setCourse(v) {
        if (v === this.form.courseId) return;
        this.form.courseId = v; this.form.unitId = ''; this.form.lessonId = '';
        this.pruneConcepts();
      },
      setUnit(v) { this.form.unitId = v; this.form.lessonId = ''; this.pruneConcepts(); },
      setLesson(v) { this.form.lessonId = v; this.pruneConcepts(); },
      pruneConcepts() { const ok = this.conceptOptions.map((k) => k.id); this.form.conceptIds = this.form.conceptIds.filter((id) => ok.includes(id)); },
      get bloomOptions() { return BLOOMS.map((b) => ({ value: b, label: this.t('aig.bloom.' + b) })); },

      /* ---------- المزيج (بلوم / الصعوبة) ---------- */
      get targetCount() { return this.mode === 'concepts' ? +this.form.conceptCount : +this.form.count; },
      get bloomSum() { return sumOf(this.form.bloomMix, BLOOMS); },
      get diffSum() { return sumOf(this.form.diffMix, DIFFS); },
      sumMessage(sum) {
        const n = +this.form.count;
        if (!Number.isFinite(n)) return '';
        if (sum === n) return this.tf('aig.sumOk', { sum: this.fmtNum(sum) });
        if (sum < n) return this.tf('aig.sumLess', { sum: this.fmtNum(sum), n: this.fmtNum(n), d: this.fmtNum(n - sum) });
        return this.tf('aig.sumMore', { sum: this.fmtNum(sum), n: this.fmtNum(n), d: this.fmtNum(sum - n) });
      },
      setBloomMode(m) {
        this.form.bloomMode = m;
        if (m === 'mix' && this.bloomSum !== +this.form.count) this.distributeBloom();
      },
      setDiffMode(m) {
        this.form.diffMode = m;
        if (m === 'mix' && this.diffSum !== +this.form.count) this.distributeDiff();
      },
      distributeBloom() {
        const n = this.countValid ? +this.form.count : 0;
        const keys = n >= 6 ? BLOOMS : BLOOMS.slice(0, Math.max(1, Math.min(3, n)));
        this.form.bloomMix = fullMix(distribute(n, keys), BLOOMS);
      },
      distributeDiff() { const n = this.countValid ? +this.form.count : 0; this.form.diffMix = fullMix(distribute(n, DIFFS), DIFFS); },
      get countValid() { const n = this.form.count; return typeof n === 'number' && Number.isInteger(n) && n >= COUNT_MIN && n <= COUNT_MAX; },

      /* ---------- التقدير والحصة ---------- */
      get perItemCost() { return this.mode === 'questions' ? TOKENS.question : this.mode === 'concepts' ? TOKENS.concept : TOKENS.summary[this.form.summaryLength]; },
      get estimate() {
        if (this.mode === 'summaries') return TOKENS.summary[this.form.summaryLength] || 0;
        const n = this.targetCount;
        return Number.isFinite(n) && n > 0 ? Math.round(n) * this.perItemCost : 0;
      },
      get overQuota() { return this.estimate > this.remaining; },
      itemCost(r) { return r.kind === 'question' ? TOKENS.question : r.kind === 'concept' ? TOKENS.concept : TOKENS.summary[r.spec.length] || TOKENS.summary.medium; },

      /* ---------- التحقق ---------- */
      get errors() {
        const f = this.form, e = {};
        const intIn = (v, lo, hi) => typeof v === 'number' && Number.isInteger(v) && v >= lo && v <= hi;
        if (!f.courseId) e.course = this.t('aig.errCourse');
        if (this.mode === 'questions') {
          if (!intIn(f.count, COUNT_MIN, COUNT_MAX)) e.count = this.tf('aig.errCount', { min: this.fmtNum(COUNT_MIN), max: this.fmtNum(COUNT_MAX) });
          if (!f.types.length) e.types = this.t('aig.errTypes');
          const mixBad = (mix, keys) => keys.some((k) => !intIn(+mix[k], 0, COUNT_MAX) || mix[k] === '' || mix[k] == null);
          if (f.bloomMode === 'mix' && !e.count && (mixBad(f.bloomMix, BLOOMS) || this.bloomSum !== f.count)) e.bloomMix = this.tf('aig.errBloomMix', { n: this.fmtNum(f.count) });
          if (f.diffMode === 'mix' && !e.count && (mixBad(f.diffMix, DIFFS) || this.diffSum !== f.count)) e.diffMix = this.tf('aig.errDiffMix', { n: this.fmtNum(f.count) });
        }
        if (this.mode === 'concepts' && !intIn(f.conceptCount, COUNT_MIN, CONCEPT_MAX)) e.conceptCount = this.tf('aig.errCount', { min: this.fmtNum(COUNT_MIN), max: this.fmtNum(CONCEPT_MAX) });
        if ((f.prompt || '').length > PROMPT_MAX) e.prompt = this.tf('aig.errPrompt', { max: this.fmtNum(PROMPT_MAX) });
        if (this.fileError) e.file = this.fileError;
        return e;
      },
      get errorList() {
        const target = { course: 'ai-course', count: 'ai-count-num', conceptCount: 'ai-ccount-num', types: 'ai-type-mcq', bloomMix: 'ai-bmix-remember', diffMix: 'ai-dmix-easy', prompt: 'ai-prompt', file: 'ai-file' };
        const e = this.errors;
        return Object.keys(target).filter((k) => e[k]).map((k) => ({ key: k, msg: e[k], target: target[k] }));
      },
      err(k) { return (this.showErrors || k === 'file') ? (this.errors[k] || '') : ''; },
      invalid(k) { return this.err(k) ? 'true' : null; },
      describedBy(k, hint) { return [hint, this.err(k) ? 'err-' + k : ''].filter(Boolean).join(' ') || null; },
      validate() { this.showErrors = true; return this.errorList.length === 0; },

      /* ---------- الملف المرجعي ---------- */
      validateFile(f) {
        if (!f) return '';
        const ext = String(f.name || '').split('.').pop().toLowerCase();
        if (!String(f.name || '').includes('.') || !FILE_EXT.includes(ext)) return this.t('aig.errFileType');
        if (!(f.size > 0)) return this.t('aig.errFileEmpty');
        if (f.size > FILE_MAX) return this.tf('aig.errFileSize', { size: this.fmtBytes(f.size) });
        return '';
      },
      onFile(ev) {
        const input = ev && ev.target;
        const f = input && input.files && input.files[0];
        if (!f) return;
        const msg = this.validateFile(f);
        if (msg) {
          this.fileError = msg; this.file = null;
          try { input.value = ''; } catch (e) {}
          this.announce(msg);
          return;
        }
        this.fileError = '';
        this.file = { name: f.name, size: f.size, type: f.type || '' };
        this.announce(this.tf('aig.liveFile', { name: f.name }));
      },
      removeFile() {
        this.file = null; this.fileError = '';
        const el = document.getElementById('ai-file');
        if (el) { try { el.value = ''; } catch (e) {} if (el.focus) el.focus(); }
        this.announce(this.t('aig.liveFileRemoved'));
      },

      /* ---------- أدوات ---------- */
      announce(msg) { this.liveMsg = ''; this.$nextTick(() => { this.liveMsg = msg; }); },
      focusId(id, scroll = true) {
        const el = document.getElementById(id);
        if (!el || !el.focus) return false;
        if (scroll && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        el.focus({ preventScroll: !scroll });
        return true;
      },
      focusLater(id) { this.$nextTick(() => setTimeout(() => this.focusId(id), 30)); },
      toast(msg, icon = 'success') {
        if (typeof Swal === 'undefined') return;
        Swal.fire({ toast: true, position: 'top-end', icon, titleText: msg, showConfirmButton: false, timer: 3500, customClass: { popup: 'firob-swal firob-toast' } });
      },
      async confirmLose(reason) {
        const n = this.unsavedCount;
        if (reason !== 'running' && !n) return true;
        const text = this.tf('aig.confirm.' + reason, { n: this.fmtNum(n) });
        if (typeof Swal === 'undefined') return typeof window.confirm === 'function' ? window.confirm(text) : true;
        const r = await Swal.fire({
          icon: 'warning', titleText: this.t('aig.confirm.title'), text,
          showCancelButton: true, confirmButtonText: this.t('aig.confirm.ok'), cancelButtonText: this.t('aig.confirm.cancel'),
          reverseButtons: true, focusCancel: true, customClass: { popup: 'firob-swal' },
        });
        return !!(r && r.isConfirmed);
      },

      /* ---------- المسودات غير المحفوظة ---------- */
      get unsavedCount() { return this.results.filter((r) => r.status === 'generated' && !r.addedTo && !r.exported).length; },
      get hasUnsaved() { return this.unsavedCount > 0; },

      /* ---------- تبديل الوضع والمسح ---------- */
      async requestMode(m) {
        if (m === this.mode) return;
        const running = this.genState === 'running';
        const ok = running ? await this.confirmLose('running') : await this.confirmLose('mode');
        if (!ok) { this.modeRender++; return false; }
        if (running) this.runSeq++;
        this.resetResults();
        this.mode = m;
        this.showErrors = false;
        this.modeRender++;
        return true;
      },
      resetResults() {
        this.results = []; this.genState = 'idle'; this.progress = { i: 0, n: 0 };
        this.editUid = null; this.editErrors = {}; this.regenUid = null;
        this.savedNotice = null; this.addedNotice = null; this.clearUndo();
      },
      async clearAll() {
        const ok = this.genState === 'running' ? await this.confirmLose('running') : await this.confirmLose('clear');
        if (!ok) return false;
        this.runSeq++;
        this.resetResults();
        this.form = EMPTY_FORM();
        this.file = null; this.fileError = ''; this.showErrors = false;
        const el = document.getElementById('ai-file'); if (el) { try { el.value = ''; } catch (e) {} }
        this.announce(this.t('aig.liveCleared'));
        return true;
      },
      async clearResults() {
        if (!(await this.confirmLose('clear'))) return false;
        this.resetResults();
        this.announce(this.t('aig.liveResultsCleared'));
        this.focusLater('ai-generate');
        return true;
      },

      /* ---------- بناء مواصفات العناصر ---------- */
      get topic() {
        const c = this.course, u = this.unit, l = this.lesson;
        return (l && l.title) || (u && u.title) || (c && c.title) || { ar: '', en: '' };
      },
      get pool() {
        const sel = this.form.conceptIds.map((id) => TC.concept(id)).filter(Boolean);
        const list = sel.length ? sel : this.conceptOptions;
        return list.length ? list.map((k) => ({ id: k.id, name: k.name })) : [{ id: null, name: this.topic }];
      },
      buildSpecs() {
        const f = this.form;
        const langs = f.lang === 'both' ? ['ar', 'en'] : [f.lang];
        const ctx = { courseId: f.courseId, unitId: f.unitId, lessonId: f.lessonId, topic: deep(this.topic), grade: deep((this.course && this.course.grade) || { ar: '', en: '' }) };
        const base = { langs, ctx, regen: 0, key: [f.courseId, f.unitId, f.lessonId, f.conceptIds.slice().sort().join(','), f.lang].join('|') };
        if (this.mode === 'questions') {
          const n = f.count, pool = this.pool;
          const types = TYPES.filter((t) => f.types.includes(t));
          const blooms = f.bloomMode === 'mix' ? expand(f.bloomMix, BLOOMS) : Array(n).fill(f.bloom);
          const diffs = f.diffMode === 'mix' ? expand(f.diffMix, DIFFS) : Array(n).fill(f.difficulty);
          return Array.from({ length: n }, (_, i) => ({ ...base, kind: 'question', i, type: types[i % types.length], bloom: blooms[i], difficulty: diffs[i], concept: deep(pool[i % pool.length]) }));
        }
        if (this.mode === 'concepts') return Array.from({ length: f.conceptCount }, (_, i) => ({ ...base, kind: 'concept', i }));
        return [{ ...base, kind: 'summary', i: 0, length: f.summaryLength, pool: deep(this.pool) }];
      },

      /* ---------- المولّد الحتمي (محاكاة) ---------- */
      makeItem(spec) {
        const rand = rng(hash(spec.kind + '|' + spec.key + '|' + spec.i + '|' + spec.regen + '|' + (spec.type || '') + (spec.bloom || '') + (spec.difficulty || '')));
        const L = spec.langs, li = (lg) => (lg === 'ar' ? 0 : 1);
        const bi = (tpl, vars) => { const o = { ar: '', en: '' }; L.forEach((lg) => { const v = {}; Object.keys(vars).forEach((k) => { v[k] = typeof vars[k] === 'object' ? (vars[k][lg] || '') : vars[k]; }); o[lg] = fill(tpl[li(lg)], v); }); return o; };
        const l = spec.ctx.topic;
        const item = {
          uid: TC.uid('gen'), kind: spec.kind, spec, langs: L.slice(),
          type: spec.type || null, bloom: spec.bloom || null, difficulty: spec.difficulty || null,
          conceptId: (spec.concept && spec.concept.id) || null, marks: 0,
          text: { ar: '', en: '' }, options: [], answer: { ar: '', en: '' }, explanation: { ar: '', en: '' },
          status: 'generated', addedTo: null, exported: false, edited: false, selected: false,
        };
        const variant = (spec.i + spec.regen) % 2;
        if (spec.kind === 'question') {
          const c = spec.concept.name;
          const v = { ar: VERB[spec.bloom][0], en: VERB[spec.bloom][1] };
          item.marks = BASE_MARKS[spec.type] + (spec.difficulty === 'hard' ? 1 : 0);
          item.explanation = bi(EXPLAIN, { c });
          if (spec.type === 'mcq') {
            item.text = bi(MCQ_STEM[spec.bloom][variant], { c, l });
            const right = Math.floor(rand() * 4);
            const wrong = MCQ_WRONG.slice();
            item.options = Array.from({ length: 4 }, (_, oi) => ({
              uid: item.uid + '-' + LETTERS[oi], correct: oi === right,
              text: bi(oi === right ? MCQ_RIGHT : wrong.shift(), { c }),
            }));
          } else if (spec.type === 'tf') {
            const [tpl, truth] = TF_STMT[Math.floor(rand() * TF_STMT.length)];
            item.text = bi(tpl, { c, l });
            item.options = TF_OPTS.map((o, oi) => ({ uid: item.uid + (oi ? '-F' : '-T'), correct: oi === 0 ? truth : !truth, text: bi(o, {}) }));
          } else if (spec.type === 'short') {
            item.text = bi(SHORT_STEM[variant], { c, v });
            item.answer = bi(SHORT_ANSWER, { c });
          } else {
            item.text = bi(ESSAY_STEM[variant], { c, v, l });
            item.answer = bi(ESSAY_ANSWER, {});
          }
        } else if (spec.kind === 'concept') {
          const a = ASPECTS[(spec.i + spec.regen * 3) % ASPECTS.length];
          const round = Math.floor(spec.i / ASPECTS.length);
          const name = { ar: '', en: '' };
          L.forEach((lg) => { name[lg] = (l[lg] || '') + ': ' + a[li(lg)] + (round ? ' (' + (round + 1) + ')' : ''); });
          item.text = name;
          item.answer = bi(CONCEPT_DEF, { n: name, g: spec.ctx.grade });
          item.explanation = bi(CONCEPT_EX, { n: name, l });
        } else {
          item.text = bi(SUMMARY_TITLE, { l });
          const k = BULLETS_BY_LEN[spec.length] || 5;
          const start = Math.floor(rand() * BULLETS.length);
          L.forEach((lg) => {
            item.answer[lg] = Array.from({ length: k }, (_, b) => {
              const c = spec.pool[b % spec.pool.length].name[lg] || '';
              return fill(BULLETS[(start + b) % BULLETS.length][li(lg)], { c, l: l[lg] || '' });
            }).join('\n');
          });
        }
        return item;
      },

      /* ---------- آلة حالات التوليد ---------- */
      get statusTitle() { return { error: this.t('aig.status.errorTitle'), cancelled: this.t('aig.status.cancelledTitle'), quota: this.t('aig.status.quotaTitle') }[this.genState] || ''; },
      get statusText() {
        if (this.genState === 'quota') return this.tf('aig.status.quotaText', { need: this.fmtNum(this.quotaNeed), rem: this.fmtNum(this.remaining), date: this.fmtDateOnly(this.usage.resetsOn) });
        if (this.genState === 'cancelled') return this.t('aig.status.cancelledText');
        if (this.genState === 'error') return this.errorText;
        return '';
      },
      get progressText() { return this.tf('aig.progress', { i: this.fmtNum(this.progress.i), n: this.fmtNum(this.progress.n) }); },
      get progressPct() { return this.progress.n ? Math.round(((this.progress.i - 1) / this.progress.n) * 100) : 0; },

      async generate() {
        if (this.genState === 'running') return false;
        if (!this.validate()) {
          this.announce(this.tf('aig.errSummary', { n: this.fmtNum(this.errorList.length) }));
          const first = this.errorList[0];
          this.$nextTick(() => this.focusId(first.target));
          return false;
        }
        if (this.hasUnsaved && !(await this.confirmLose('replace'))) return false;
        const est = this.estimate;
        this.resetResults();
        if (est > this.remaining) {
          this.quotaNeed = est;
          this.genState = 'quota';
          this.announce(this.statusText);
          this.focusLater('gen-status-title');
          return false;
        }
        const specs = this.buildSpecs();
        const runId = ++this.runSeq;
        this.genState = 'running';
        this.progress = { i: 0, n: specs.length };
        this.announce(this.tf('aig.liveRunning', { n: this.fmtNum(specs.length) }));
        this.focusLater('gen-cancel');
        const out = [];
        for (let i = 0; i < specs.length; i++) {
          this.progress.i = i + 1;
          await sleep(this.stepDelay);
          if (runId !== this.runSeq || this.genState !== 'running') return false;
          const offline = typeof navigator !== 'undefined' && navigator.onLine === false;
          if (this.simulateError || offline) {
            this.genState = 'error';
            this.errorText = offline ? this.t('aig.status.offlineText') : this.t('aig.status.errorText');
            this.announce(this.statusTitle + '. ' + this.errorText);
            this.focusLater('gen-status-title');
            return false;
          }
          out.push(this.makeItem(specs[i]));
        }
        this.results = out;
        this.usage.used += est;
        this.usage.logs.push({ id: 'AIG-' + (6000 + this.usage.logs.length), at: new Date().toISOString(), quizCode: null, count: out.length, tokens: est, model: MODEL, kind: this.mode });
        this.genState = 'done';
        this.announce(this.tf('aig.liveDone', { n: this.fmtNum(out.length), t: this.fmtNum(est) }));
        this.focusLater('results-title');
        return true;
      },
      cancelRun() {
        if (this.genState !== 'running') return false;
        this.runSeq++;
        this.genState = 'cancelled';
        this.progress = { i: 0, n: 0 };
        this.announce(this.statusTitle + '. ' + this.statusText);
        this.focusLater('gen-status-title');
        return true;
      },
      backToSettings() { this.genState = 'idle'; this.focusLater('ai-generate'); },

      /* ---------- العناصر: تسمية، تحديد ---------- */
      idx(r) { return this.results.findIndex((x) => x.uid === r.uid); },
      label(r) { return this.tf('aig.itemHeading.' + r.kind, { n: this.fmtNum(this.idx(r) + 1) }); },
      get selectable() { return this.results.filter((r) => r.kind !== 'summary'); },
      get selectedItems() { return this.selectable.filter((r) => r.selected); },
      get allSelected() { return this.selectable.length > 0 && this.selectedItems.length === this.selectable.length; },
      get someSelected() { return this.selectedItems.length > 0 && !this.allSelected; },
      toggleAll(on) { this.selectable.forEach((r) => { r.selected = !!on; }); },
      kindOf() { return this.results[0] && this.results[0].kind === 'concept' ? 'concept' : 'question'; },
      courseTitle(id) { const c = TC.course(id); return c ? this.loc(c.title) : ''; },
      bloomCls(b) { return ['remember', 'understand'].includes(b) ? 'badge-info' : ['apply', 'analyze'].includes(b) ? 'badge-primary' : 'badge-accent'; },
      diffCls(d) { return d === 'easy' ? 'badge-success' : d === 'hard' ? 'badge-danger' : 'badge-warning'; },
      lines(s) { return String(s || '').split('\n').map((x) => x.trim()).filter(Boolean); },

      /* ---------- التعديل ---------- */
      startEdit(r) {
        if (r.status !== 'generated') return;
        this.editUid = r.uid;
        this.editErrors = {};
        this.editBuf = {
          text: deep(r.text), answer: deep(r.answer), explanation: deep(r.explanation),
          options: deep(r.options), correct: r.options.findIndex((o) => o.correct),
        };
        this.focusLater('ed-' + r.uid + '-' + r.langs[0] + '-text');
      },
      cancelEdit(r) { this.editUid = null; this.editErrors = {}; this.focusLater('r-' + r.uid + '-edit'); },
      saveEdit(r) {
        const b = this.editBuf, e = {};
        const blank = (s) => !String(s || '').trim();
        r.langs.forEach((lg) => {
          const ln = this.t('langName.' + lg);
          if (blank(b.text[lg])) e[lg + '-text'] = this.tf('aig.errEdText', { field: this.t('aig.edText.' + r.kind), lang: ln });
          if (r.type === 'mcq') b.options.forEach((o, oi) => { if (blank(o.text[lg])) e[lg + '-opt-' + oi] = this.tf('aig.errEdOption', { l: LETTERS[oi], lang: ln }); });
          if ((r.kind !== 'question' || ['short', 'essay'].includes(r.type)) && blank(b.answer[lg])) e[lg + '-answer'] = this.tf('aig.errEdText', { field: this.t('aig.edAnswer.' + r.kind), lang: ln });
        });
        if (r.options.length && !(b.correct >= 0 && b.correct < b.options.length)) e.correct = this.t('aig.errEdCorrect');
        this.editErrors = e;
        const keys = Object.keys(e);
        if (keys.length) {
          this.announce(e[keys[0]]);
          const k = keys[0];
          this.$nextTick(() => this.focusId(k === 'correct' ? 'ed-' + r.uid + '-correct-0' : 'ed-' + r.uid + '-' + k));
          return false;
        }
        r.text = deep(b.text); r.answer = deep(b.answer); r.explanation = deep(b.explanation);
        r.options = b.options.map((o, i) => ({ ...o, text: deep(o.text), correct: i === +b.correct }));
        r.edited = true;
        this.editUid = null;
        this.announce(this.tf('aig.liveEdited', { label: this.label(r) }));
        this.focusLater('r-' + r.uid + '-edit');
        return true;
      },
      edErr(k) { return this.editErrors[k] || ''; },

      /* ---------- إعادة توليد عنصر ---------- */
      async regenerate(r) {
        if (this.regenUid || r.status !== 'generated') return false;
        const cost = this.itemCost(r);
        if (cost > this.remaining) {
          const msg = this.tf('aig.toastQuotaItem', { t: this.fmtNum(cost), rem: this.fmtNum(this.remaining) });
          this.announce(msg); this.toast(msg, 'warning');
          return false;
        }
        if (this.editUid === r.uid) this.editUid = null;
        this.regenUid = r.uid;
        await sleep(this.stepDelay);
        const i = this.idx(r);
        if (i < 0) { this.regenUid = null; return false; }
        const spec = { ...r.spec, regen: r.spec.regen + 1 };
        const fresh = this.makeItem(spec);
        fresh.selected = r.selected;
        this.results.splice(i, 1, fresh);
        this.usage.used += cost;
        this.usage.logs.push({ id: 'AIG-' + (6000 + this.usage.logs.length), at: new Date().toISOString(), quizCode: null, count: 1, tokens: cost, model: MODEL, kind: this.mode });
        this.regenUid = null;
        this.announce(this.tf('aig.liveRegenerated', { label: this.label(fresh), t: this.fmtNum(cost) }));
        this.focusLater('r-' + fresh.uid + '-regen');
        return fresh;
      },

      /* ---------- التجاهل مع التراجع ---------- */
      discard(r) {
        const i = this.idx(r);
        if (i < 0) return false;
        if (this.editUid === r.uid) this.editUid = null;
        const label = this.label(r);
        this.clearUndo();
        this.results.splice(i, 1);
        this.undo = { item: r, index: i, label };
        this.undoTimer = setTimeout(() => { this.undo = null; this.undoTimer = null; }, UNDO_MS);
        this.announce(this.tf('aig.undoText', { label }));
        const next = this.results[i] || this.results[i - 1];
        this.$nextTick(() => { if (!(next && this.focusId('r-' + next.uid + '-discard', false))) this.focusId('undo-btn', false); });
        return true;
      },
      undoDiscard() {
        if (!this.undo) return false;
        const { item, index } = this.undo;
        this.clearUndo();
        this.results.splice(Math.min(index, this.results.length), 0, item);
        if (this.genState !== 'done') this.genState = 'done';
        this.announce(this.tf('aig.liveRestored', { label: this.label(item) }));
        this.focusLater('r-' + item.uid + '-discard');
        return true;
      },
      clearUndo() { if (this.undoTimer) clearTimeout(this.undoTimer); this.undoTimer = null; this.undo = null; },

      /* ---------- الحفظ في بنك الأسئلة (مسودات ⇒ المراجعة) ---------- */
      saveSelected() {
        const sel = this.selectedItems;
        if (!sel.length) { const m = this.t('aig.noneSelected'); this.announce(m); this.toast(m, 'info'); return 0; }
        const todo = sel.filter((r) => r.status === 'generated');
        if (!todo.length) { const m = this.t('aig.alreadySaved'); this.announce(m); this.toast(m, 'info'); return 0; }
        if (this.editUid && todo.some((r) => r.uid === this.editUid)) this.editUid = null;
        const now = new Date().toISOString();
        todo.forEach((r) => {
          r.status = 'draft'; r.reviewStatus = 'pending'; r.savedAt = now; r.selected = false;
          this.bank.push({ ...deep({ ...r, spec: null }), status: 'draft', reviewStatus: 'pending', courseId: r.spec.ctx.courseId, unitId: r.spec.ctx.unitId || null, lessonId: r.spec.ctx.lessonId || null });
        });
        const kind = todo[0].kind;
        this.savedNotice = { n: todo.length, kind };
        const msg = this.tf('aig.savedNotice.' + kind, { n: this.fmtNum(todo.length) });
        this.announce(msg); this.toast(msg);
        this.focusLater('saved-notice');
        return todo.length;
      },

      /* ---------- إضافة إلى اختبار ---------- */
      get quizOptions() {
        const cid = this.results[0] && this.results[0].spec.ctx.courseId;
        return TC.QUIZZES.map((q) => ({ code: q.code, title: q.title, courseId: q.courseId, status: TC.quizStatus(q) }))
          .filter((q) => q.status === 'draft' || q.status === 'scheduled')
          .sort((a, b) => (a.courseId === cid ? 0 : 1) - (b.courseId === cid ? 0 : 1) || a.code.localeCompare(b.code));
      },
      get selectedQuestions() { return this.selectedItems.filter((r) => r.kind === 'question'); },
      openQuiz(ev) {
        if (!this.selectedQuestions.length) { const m = this.t('aig.noneSelected'); this.announce(m); this.toast(m, 'info'); return false; }
        this.quizOpener = (ev && ev.currentTarget) || document.activeElement;
        const opts = this.quizOptions;
        this.quizChoice = opts.length ? opts[0].code : '';
        this.quizError = '';
        this.quizOpen = true;
        return true;
      },
      closeQuiz(focusId) {
        this.quizOpen = false;
        const el = this.quizOpener; this.quizOpener = null;
        this.$nextTick(() => { if (!(focusId && this.focusId(focusId))) el && el.focus && el.focus(); });
        setTimeout(() => { if (!this.quizOpen) { this.quizChoice = ''; this.quizError = ''; } }, 250);
      },
      confirmAddToQuiz() {
        const q = TC.quiz(this.quizChoice);
        if (!q || !this.quizOptions.some((o) => o.code === q.code)) { this.quizError = this.t('aig.quizDlg.errChoose'); this.$nextTick(() => this.focusId('quiz-choices', false)); return false; }
        const items = this.selectedQuestions;
        items.forEach((r) => { r.addedTo = q.code; r.selected = false; });
        this.addedNotice = { n: items.length, code: q.code, title: q.title };
        const msg = this.tf('aig.addedNotice', { n: this.fmtNum(items.length), title: this.loc(q.title) });
        this.announce(msg); this.toast(msg);
        this.closeQuiz('added-notice');
        return true;
      },

      /* ---------- الملخص: تنزيل ونسخ ---------- */
      summaryText(r) {
        return r.langs.map((lg) => [r.text[lg], ''].concat(this.lines(r.answer[lg]).map((x) => '• ' + x)).join('\r\n')).join('\r\n\r\n');
      },
      fileName(r) { const c = TC.course(r.spec.ctx.courseId); return 'summary-' + ((c && c.code) || 'course') + (r.spec.ctx.lessonId ? '-' + r.spec.ctx.lessonId : r.spec.ctx.unitId ? '-' + r.spec.ctx.unitId : '') + '.txt'; },
      downloadSummary(r) {
        const name = this.fileName(r);
        try {
          const blob = new Blob(['﻿' + this.summaryText(r)], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          r.exported = true;
          const m = this.tf('aig.toastDownloaded', { name }); this.announce(m); this.toast(m);
          return true;
        } catch (e) {
          const m = this.t('aig.toastDownloadFail'); this.announce(m); this.toast(m, 'error');
          return false;
        }
      },
      async copySummary(r) {
        try {
          if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('no clipboard');
          await navigator.clipboard.writeText(this.summaryText(r));
          r.exported = true;
          const m = this.t('aig.toastCopied'); this.announce(m); this.toast(m);
          return true;
        } catch (e) {
          const m = this.t('aig.toastCopyFail'); this.announce(m); this.toast(m, 'error');
          return false;
        }
      },

      /* ---------- سجل الاستخدام (درج جانبي) ---------- */
      openLogs(ev) { this.logsOpener = (ev && ev.currentTarget) || document.activeElement; this.logsOpen = true; },
      closeLogs() {
        this.logsOpen = false;
        const el = this.logsOpener; this.logsOpener = null;
        this.$nextTick(() => el && el.focus && el.focus());
      },

      /* ---------- عامة ---------- */
      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        try { this.simulateError = new URLSearchParams(location.search).get('simulate') === 'error'; } catch (e) {}
        this.syncTitle();
        window.addEventListener('beforeunload', (e) => { if (this.hasUnsaved || this.genState === 'running') { e.preventDefault(); e.returnValue = ''; } });
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },
    };
  }
</script>
