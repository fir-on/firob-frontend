<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>طلباتي للمراجعة — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- تلميحات أزرار الإجراءات (Action Tooltips) ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg border border-white/10 bg-slate-900/90 px-2.5 py-1 text-xs font-medium tracking-wide text-white opacity-0 shadow-xl backdrop-blur-md transition-all duration-200 ease-out;
      @apply dark:border-slate-800/20 dark:bg-slate-100 dark:text-slate-900;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-slate-900/90 opacity-0 transition-all duration-200 ease-out;
      @apply dark:border-t-slate-100;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  {@apply bg-accent-500/20 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }
    .badge-warning { @apply bg-warning-500/15 text-warning-700 dark:text-warning-500; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-line-strong; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }
    .btn-success { @apply bg-success-500 text-white hover:bg-success-700; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }


    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-4 py-2.5 text-start text-sm font-medium text-ink transition-colors hover:bg-soft; }
    .combo-option.is-active   { @apply bg-soft; }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }

    /* ---------- أزرار معطّلة بـ aria-disabled (تبقى قابلة للتركيز وتشرح السبب) ---------- */
    .btn[aria-disabled="true"] { @apply cursor-not-allowed border border-line bg-soft text-muted shadow-none hover:bg-soft; }

    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- النافذة المنبثقة / اللوحة الجانبية ---------- */
    .modal-panel { @apply relative flex max-h-[90dvh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }

    /* ---------- تبويبات نوع العنصر (Segmented Tabs) ---------- */
    .seg-tab { @apply inline-flex shrink-0 items-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .seg-tab[aria-selected="true"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600 hover:text-white; }
    .seg-tab .seg-count { @apply inline-grid h-5 min-w-[1.25rem] place-items-center rounded-full bg-black/10 px-1 text-[11px] font-extrabold; }
    .seg-tab[aria-selected="true"] .seg-count { @apply bg-white/25; }

    /* ---------- سلسلة التصنيف الأكاديمي (Breadcrumb Chip) ---------- */
    .class-chain { @apply flex flex-wrap items-center gap-x-1.5 gap-y-1 text-xs font-bold text-muted; }
    .class-chain i { @apply text-[9px] text-muted; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }

    /* ---------- [layout: full-height sidebar + bottom footer] ---------- */
    html, body { min-height: 100%; }
    body { margin: 0; }
    .app-col { min-height: 100vh; min-height: 100dvh; }
    @media (min-width: 1024px) {
      #sidebar { height: 100vh; height: 100dvh; }
      .app-col { margin-inline-start: 18rem; transition: margin-inline-start .3s ease; }
      .app-col.is-collapsed { margin-inline-start: 5rem; }
      .save-bar { inset-inline-start: 18rem; transition: inset-inline-start .3s ease; }
      .save-bar.is-collapsed { inset-inline-start: 5rem; }
    }
</style>

<!-- ⑥ Alpine.js (+ إضافة Focus لحصر التركيز داخل النوافذ المنبثقة) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- ⑦ SweetAlert2 -->
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5"></script>
</head>

<body x-data="reviewQueueManager()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch.focus(); }"
      @scroll.window="openMenuId = null" @resize.window="openMenuId = null"
      :class="{ 'overflow-hidden': (mobileNav && mobile) || previewOpen || resubmitOpen }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <span class="inline-flex min-w-0 flex-1 items-center gap-3" :class="!expanded && 'lg:flex-none lg:justify-center'">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </span>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-muted" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="navCount(item) && expanded" aria-hidden="true"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent"
                        x-text="fmtNum(navCount(item))"></span>
                  <span x-show="navCount(item)" class="sr-only" x-text="tf('rq.navPendingSr', { n: fmtNum(navCount(item)) })"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="app-col flex min-w-0 flex-1 flex-col" :class="collapsed && 'is-collapsed'">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent="search = $refs.globalSearch.value; $nextTick(() => document.getElementById('rq-search')?.focus())">
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex"><bdi dir="ltr">Ctrl K</bdi></kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-haspopup="true" :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="notifText(n)"></p>
                      <p class="text-xs text-muted"><time :datetime="n.at" :title="fmtDate(n.at)" x-text="relTime(n.at)"></time></p>
                    </div>
                  </li>
                </template>
              </ul>
              <div class="border-t border-line p-2">
                <a href="../common/notifications.html" class="menu-item justify-center text-brand" @click="notifOpen = false">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  <span x-text="t('viewAllNotif')"></span>
                </a>
              </div>
            </div>
          </div>

          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" class="flex max-w-[14rem] items-center gap-2 rounded-xl p-1 transition hover:bg-soft focus-visible:ring-2 md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    aria-haspopup="menu" :aria-expanded="profileOpen.toString()" aria-controls="profile-menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true" x-text="loc(teacher.initials)"></span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="loc(teacher.name)"></span>
                <span class="block truncate text-xs text-muted" x-text="t('roleTeacher')"></span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted md:block" aria-hidden="true"></i>
            </button>
            <div id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-56" role="menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <a href="../common/profile.html" role="menuitem" class="menu-item"><i class="fa-regular fa-user w-4 text-muted" aria-hidden="true"></i> <span x-text="t('profile')"></span></a>
              <button type="button" role="menuitem" class="menu-item cursor-not-allowed opacity-60" aria-disabled="true" tabindex="-1"><i class="fa-solid fa-gear w-4 text-muted" aria-hidden="true"></i> <span x-text="t('settings')"></span></button>
              <a href="../common/errors.html" role="menuitem" class="menu-item"><i class="fa-solid fa-triangle-exclamation w-4 text-muted" aria-hidden="true"></i> <span x-text="t('statusErrors')"></span></a>
              <div class="border-t border-line"></div>
              <a href="../auth/login.html" role="menuitem" class="menu-item !text-danger"><i class="fa-solid fa-arrow-right-from-bracket w-4" aria-hidden="true"></i> <span x-text="t('logout')"></span></a>
            </div>
          </div>
        </div>
      </div>

      <!-- زبدة الخبز (Breadcrumb) -->
      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="locale === 'ar' ? 'مسار التنقل' : 'Breadcrumb'">
          <ol class="flex items-center gap-2" role="list">
            <li x-text="t('breadcrumb.home')"></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li x-text="t('breadcrumb.portal')"></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li class="text-ink" aria-current="page" x-text="t('rq.breadcrumbCurrent')"></li>
          </ol>
        </nav>
      </div>
    </header>

    <!-- ================= المحتوى الرئيسي — طلباتي للمراجعة (المعلم = المُرسِل) ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">
      <!--
        الدور: هذه شاشة «طلباتي للمراجعة» للمعلم — يتابع ما أرسله، يسحب الطلب المعلّق، ويعدّل ويعيد الإرسال.
        لا اعتماد ولا رفض هنا: واجهة المراجِع (اعتماد/رفض مع السبب) تبقى في tenant-admin/ReviewQueue.html.
        Laravel: مكوّن Livewire واحد <livewire:review-queue :scope="'submitter'|'reviewer'" /> يشترك في الاستعلام والعرض،
        ويُظهر الإجراءات حسب النطاق وسياسات الصلاحيات (submitter: withdraw/resubmit ؛ reviewer: approve/reject).
      -->

      <!-- منطقة الإعلانات لقارئ الشاشة (الأعداد ونتائج الإجراءات) -->
      <p class="sr-only" aria-live="polite" x-text="liveMsg"></p>

      <!-- العنوان -->
      <section class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end sm:justify-between">
        <div class="min-w-0">
          <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="t('rq.title')"></h1>
          <p class="mt-1 max-w-3xl text-sm text-muted sm:text-base" x-text="t('rq.subtitle')"></p>
        </div>
      </section>

      <!-- ================= بطاقات المؤشرات (KPI) — محسوبة من البيانات ================= -->
      <section :aria-label="t('rq.kpisLabel')" class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4 xl:grid-cols-4">
        <template x-for="k in kpiCards" :key="k.key">
          <div class="panel p-4 sm:p-5">
            <div class="flex items-center justify-between gap-3">
              <p class="min-w-0 truncate text-sm font-bold text-muted" x-text="t('rq.kpi.' + k.key)"></p>
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl" :class="k.tone" aria-hidden="true"><i class="fa-solid" :class="k.icon"></i></span>
            </div>
            <p class="mt-2 text-2xl font-extrabold tabular-nums" x-text="fmtNum(k.value)"></p>
            <p class="mt-1 text-xs text-muted" x-text="t('rq.kpiHint.' + k.key)"></p>
          </div>
        </template>
      </section>

      <!-- ================= التبويبات (نوع العنصر) + الفلاتر ================= -->
      <section class="panel p-2 sm:p-3" :aria-label="t('rq.filtersLabel')">
        <div class="flex flex-wrap items-center gap-2" role="tablist" :aria-label="t('rq.kindLabel')">
          <template x-for="(k, i) in KINDS" :key="k.key">
            <button type="button" role="tab" class="seg-tab" :id="'rq-tab-' + k.key" aria-controls="rq-panel"
                    :aria-selected="(kind === k.key).toString()" :tabindex="kind === k.key ? 0 : -1"
                    @click="setKind(k.key)" @keydown="onTabKey($event, i)">
              <i class="fa-solid" :class="k.icon" aria-hidden="true"></i>
              <span x-text="t('rq.tab.' + k.key)"></span>
              <span class="seg-count" x-text="fmtNum(kindCounts[k.key])"></span>
            </button>
          </template>
        </div>

        <div class="mt-3 grid grid-cols-1 gap-3 border-t border-line px-1 pt-3 sm:grid-cols-2 lg:grid-cols-[minmax(0,1fr)_15rem_15rem]">
          <div class="min-w-0 sm:col-span-2 lg:col-span-1">
            <label for="rq-search" class="label" x-text="t('rq.searchLabel')"></label>
            <div class="relative">
              <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
              <input id="rq-search" type="search" x-model="search" autocomplete="off" aria-describedby="rq-search-hint"
                     class="field h-11 ps-10" :placeholder="t('rq.searchPlaceholder')">
            </div>
            <p id="rq-search-hint" class="sr-only" x-text="t('rq.searchHint')"></p>
          </div>
          <div class="relative w-full min-w-0"
               x-data="selectDropdown({ id: 'rq-status', options: () => statusOptions, get: () => status, set: (v) => setStatus(v) })"
               @click.outside="closeList()">
            <span id="rq-status-label" class="label" x-text="t('rq.filterStatus')"></span>
            <button type="button" id="rq-status" x-ref="btn" role="combobox" aria-haspopup="listbox"
                    aria-labelledby="rq-status-label rq-status"
                    :aria-expanded="open.toString()" aria-controls="rq-status-list"
                    :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                    class="field flex h-11 w-full items-center justify-between gap-2 text-start font-bold"
                    @click="toggleList()" @keydown="onKey($event)">
              <span class="truncate" x-text="triggerLabel"></span>
              <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
            </button>
            <ul x-show="open" x-cloak x-ref="list" id="rq-status-list" role="listbox" aria-labelledby="rq-status-label"
                x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
              <template x-for="(item, idx) in items" :key="item.value">
                <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                    class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                    @click="choose(item)" @mousemove="active = idx">
                  <span class="truncate" x-text="item.label"></span>
                  <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                </li>
              </template>
            </ul>
          </div>
          <div class="relative w-full min-w-0"
               x-data="selectDropdown({ id: 'rq-sort', options: () => sortOptions, get: () => sortValue, set: (v) => setSortValue(v) })"
               @click.outside="closeList()">
            <span id="rq-sort-label" class="label" x-text="t('rq.sortLabel')"></span>
            <button type="button" id="rq-sort" x-ref="btn" role="combobox" aria-haspopup="listbox"
                    aria-labelledby="rq-sort-label rq-sort"
                    :aria-expanded="open.toString()" aria-controls="rq-sort-list"
                    :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                    class="field flex h-11 w-full items-center justify-between gap-2 text-start font-bold"
                    @click="toggleList()" @keydown="onKey($event)">
              <span class="truncate" x-text="triggerLabel"></span>
              <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
            </button>
            <ul x-show="open" x-cloak x-ref="list" id="rq-sort-list" role="listbox" aria-labelledby="rq-sort-label"
                x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
              <template x-for="(item, idx) in items" :key="item.value">
                <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                    class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                    @click="choose(item)" @mousemove="active = idx">
                  <span class="truncate" x-text="item.label"></span>
                  <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                </li>
              </template>
            </ul>
          </div>
        </div>
      </section>

      <!-- ================= لوحة النتائج (عرض واحد: بطاقات أو جدول) ================= -->
      <section id="rq-panel" role="tabpanel" :aria-labelledby="'rq-tab-' + kind" class="panel overflow-hidden">
        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-line px-4 py-3 sm:px-5">
          <h2 id="rq-results" tabindex="-1" class="text-base font-extrabold focus:outline-none" x-text="t('rq.tab.' + kind)"></h2>
          <p class="text-xs font-bold text-muted" x-text="rangeText"></p>
        </div>

        <!-- حالة فارغة -->
        <template x-if="!filtered.length">
          <div class="px-6 py-14 text-center">
            <span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-soft text-xl text-brand" aria-hidden="true"><i class="fa-solid fa-inbox"></i></span>
            <p class="mt-4 font-extrabold" x-text="hasFilters ? t('rq.emptyFiltered') : t('rq.emptyAll')"></p>
            <p class="mt-1 text-sm text-muted" x-text="hasFilters ? t('rq.emptyFilteredHint') : t('rq.emptyAllHint')"></p>
            <template x-if="hasFilters">
              <button type="button" class="btn btn-outline mt-4" @click="clearFilters()">
                <i class="fa-solid fa-filter-circle-xmark" aria-hidden="true"></i> <span x-text="t('rq.clearFilters')"></span>
              </button>
            </template>
          </div>
        </template>

        <!-- (أ) بطاقات — الجوال والتابلت (< 1024px) -->
        <template x-if="filtered.length && !wide">
          <ul class="grid grid-cols-1 gap-3 p-3 sm:grid-cols-2 sm:p-4" role="list">
            <template x-for="r in pageRows" :key="r.id">
              <li class="flex min-w-0 flex-col gap-3 rounded-xl border border-line p-4">
                <div class="flex items-start justify-between gap-3">
                  <div class="flex min-w-0 items-start gap-3">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl" :class="kindMeta(r.kind).tone" aria-hidden="true"><i class="fa-solid" :class="kindMeta(r.kind).icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words font-extrabold leading-6" x-text="loc(r.title)"></p>
                      <p class="text-start text-xs text-muted"><bdi dir="ltr" x-text="r.code"></bdi></p>
                    </div>
                  </div>
                  <span class="badge shrink-0" :class="kindMeta(r.kind).badge" x-text="t('rq.kind.' + r.kind)"></span>
                </div>
                <div class="class-chain">
                  <span x-text="loc(r.course?.title)"></span><i class="fa-solid fa-chevron-right rtl:-scale-x-100" aria-hidden="true"></i>
                  <span x-text="loc(r.unit?.title)"></span>
                  <template x-if="r.lesson"><i class="fa-solid fa-chevron-right rtl:-scale-x-100" aria-hidden="true"></i></template>
                  <template x-if="r.lesson"><span class="text-ink" x-text="loc(r.lesson.title)"></span></template>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  <span class="badge" :class="statusMeta(r.status).badge">
                    <i class="fa-solid text-[10px]" :class="statusMeta(r.status).icon" aria-hidden="true"></i>
                    <span x-text="t('rq.status.' + r.status)"></span>
                  </span>
                  <template x-if="r.status === 'pending'">
                    <span class="badge" :class="r.ageDays >= WARN_DAYS ? 'badge-warning' : 'badge-muted'">
                      <i class="fa-solid text-[10px]" :class="r.ageDays >= WARN_DAYS ? 'fa-triangle-exclamation' : 'fa-clock'" aria-hidden="true"></i>
                      <span x-text="ageText(r)"></span>
                    </span>
                  </template>
                </div>
                <div class="space-y-1">
                  <p class="text-xs text-muted">
                    <span x-text="t('rq.submittedLabel')"></span>
                    <time class="font-bold text-ink" :datetime="r.submittedAt" :title="fmtDate(r.submittedAt)" x-text="relTime(r.submittedAt)"></time>
                  </p>
                  <template x-if="r.decidedAt">
                    <p class="flex items-center gap-1.5 text-xs text-muted">
                      <i class="fa-solid fa-user-check text-[10px]" aria-hidden="true"></i>
                      <span x-text="tf('rq.decidedBy', { name: loc(r.reviewer), date: fmtDate(r.decidedAt) })"></span>
                    </p>
                  </template>
                </div>
                <template x-if="r.reason">
                  <details class="rounded-lg border border-line bg-page/40 px-3 py-2">
                    <summary class="cursor-pointer text-xs font-extrabold text-ink">
                      <i class="fa-solid fa-comment-dots me-1" :class="r.status === 'rejected' ? 'text-danger' : 'text-warning-700 dark:text-warning-500'" aria-hidden="true"></i>
                      <span x-text="t('rq.reviewerReason')"></span>
                    </summary>
                    <p class="mt-2 break-words text-sm leading-6 text-ink" x-text="loc(r.reason)"></p>
                  </details>
                </template>
                <template x-if="r.history.length">
                  <p class="flex items-center gap-1.5 text-xs text-muted">
                    <i class="fa-solid fa-clock-rotate-left text-[10px]" aria-hidden="true"></i>
                    <span x-text="tf('rq.resubmittedTimes', { n: fmtNum(r.history.length) })"></span>
                  </p>
                </template>
                <div class="mt-auto flex flex-wrap items-center gap-2 border-t border-line pt-3">
                  <button type="button" class="btn btn-sm btn-outline" @click="openPreview(r.id, $event)" :aria-label="tf('rq.actViewFor', { title: loc(r.title) })">
                    <i class="fa-solid fa-eye" aria-hidden="true"></i> <span x-text="t('rq.actView')"></span>
                  </button>
                  <template x-if="r.status === 'pending'">
                    <button type="button" class="btn btn-sm btn-outline !text-danger hover:!bg-error-500/10" @click="withdraw(r.id)" :aria-label="tf('rq.actWithdrawFor', { title: loc(r.title) })">
                      <i class="fa-solid fa-rotate-left" aria-hidden="true"></i> <span x-text="t('rq.actWithdraw')"></span>
                    </button>
                  </template>
                  <template x-if="canResubmit(r)">
                    <span class="group relative inline-block">
                      <button type="button" class="btn btn-sm btn-primary" @click="openResubmit(r.id, $event)"
                              :aria-label="tf('rq.actResubmitFor', { title: loc(r.title) })"
                              :aria-disabled="resubmitBlock(r) ? 'true' : null"
                              :aria-describedby="resubmitBlock(r) ? 'rq-blk-' + r.id : null">
                        <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i> <span x-text="t('rq.actResubmit')"></span>
                      </button>
                      <template x-if="resubmitBlock(r)">
                        <span :id="'rq-blk-' + r.id" class="tooltip-bubble" role="tooltip" x-text="resubmitBlock(r)"></span>
                      </template>
                      <template x-if="resubmitBlock(r)"><span class="tooltip-arrow" aria-hidden="true"></span></template>
                    </span>
                  </template>
                  <a :href="r.editorHref" class="btn btn-sm btn-outline" :aria-label="tf('rq.actOpenEditorFor', { title: loc(r.title) })">
                    <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> <span x-text="t('rq.actOpenEditor')"></span>
                  </a>
                </div>
              </li>
            </template>
          </ul>
        </template>

        <!-- (ب) جدول — الشاشات الكبيرة (≥ 1024px) -->
        <template x-if="filtered.length && wide">
          <div class="overflow-x-auto">
            <table class="w-full min-w-[920px] border-collapse text-sm">
              <caption class="sr-only" x-text="t('rq.tab.' + kind) + ' — ' + rangeText"></caption>
              <thead>
                <tr class="bg-soft text-ink">
                  <th scope="col" class="px-5 py-2 text-start text-xs font-extrabold" :aria-sort="ariaSort('title')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded-md px-1 py-1.5 hover:text-brand focus-visible:ring-2" @click="sortBy('title')">
                      <span x-text="t('rq.colItem')"></span><i class="fa-solid text-[10px]" :class="sortIcon('title')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('rq.colClassification')"></th>
                  <th scope="col" class="px-4 py-2 text-start text-xs font-extrabold" :aria-sort="ariaSort('submitted')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded-md px-1 py-1.5 hover:text-brand focus-visible:ring-2" @click="sortBy('submitted')">
                      <span x-text="t('rq.colSubmitted')"></span><i class="fa-solid text-[10px]" :class="sortIcon('submitted')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('rq.colStatus')"></th>
                  <th scope="col" class="px-5 py-3.5 text-end text-xs font-extrabold" x-text="t('rq.colActions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-line">
                <template x-for="r in pageRows" :key="r.id">
                  <tr class="align-top transition hover:bg-soft/40">
                    <td class="px-5 py-4">
                      <div class="flex min-w-0 items-start gap-3">
                        <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl" :class="kindMeta(r.kind).tone" aria-hidden="true"><i class="fa-solid" :class="kindMeta(r.kind).icon"></i></span>
                        <div class="min-w-0">
                          <p class="break-words font-extrabold leading-6" x-text="loc(r.title)"></p>
                          <p class="text-start text-xs text-muted"><bdi dir="ltr" x-text="r.code"></bdi> · <span x-text="t('rq.kind.' + r.kind)"></span></p>
                        </div>
                      </div>
                    </td>
                    <td class="px-4 py-4">
                      <div class="class-chain">
                        <span x-text="loc(r.course?.title)"></span><i class="fa-solid fa-chevron-right rtl:-scale-x-100" aria-hidden="true"></i>
                        <span x-text="loc(r.unit?.title)"></span>
                        <template x-if="r.lesson"><i class="fa-solid fa-chevron-right rtl:-scale-x-100" aria-hidden="true"></i></template>
                        <template x-if="r.lesson"><span class="text-ink" x-text="loc(r.lesson.title)"></span></template>
                      </div>

<script>
  /* ==========================================================================
     بيانات المعلم المشتركة (global TC) — مصدر واحد لكل صفحات المعلم
     ========================================================================== */
/* ==========================================================================
   FirOb — بيانات المعلم المشتركة (Teacher shared mock data) — global `TC`
   مصدر واحد متّسق لكل صفحات المعلم: المقررات، المفاهيم، العناصر التعليمية،
   الاختبارات وأسئلتها، الطلبة، المحاولات، استهلاك الذكاء الاصطناعي، طلبات المراجعة.
   - كل الطوابع الزمنية محسوبة نسبةً إلى لحظة التحميل (إزاحات ثابتة، بلا عشوائية).
   - البيانات للقراءة؛ انسخها نسخًا عميقًا (TC.clone) قبل تعديلها في حالة الصفحة.
   ========================================================================== */
const TC = (() => {
  'use strict';

  /* ---------------- الوقت والمساعدات الأساسية ---------------- */
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  const LOAD = new Date(); LOAD.setSeconds(0, 0);
  const now = () => new Date();
  const addMinutes = (d, m) => new Date(new Date(d).getTime() + m * 60000);
  const addDays = (d, n) => addMinutes(d, n * 1440);
  /** Date → 'YYYY-MM-DDTHH:mm' بالتوقيت المحلي (لحقول datetime-local) */
  const isoLocal = (d) => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };

      choose(item) { set(item.value); this.closeList(); this.$refs.btn?.focus(); },
      setActive(i) { this.active = Math.min(Math.max(i, 0), this.items.length - 1); this.scrollActiveIntoView(); },
      move(step) { if (!this.open) { this.openList(); return; } this.setActive(this.active + step); },
      onKey(e) {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); if (e.altKey && this.open && k === 'ArrowUp') { this.choose(this.items[this.active]); return; } this.move(k === 'ArrowDown' ? 1 : -1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.setActive(0); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.setActive(this.items.length - 1); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); (this.open && this.active > -1) ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape') { if (this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); } }
        else if (k === 'Tab') { if (this.open) this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          const now = Date.now();
          this.typed = (now - this.typedAt > 600 ? '' : this.typed) + k.toLowerCase();
          this.typedAt = now;
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this.typed));
          if (i > -1) { if (!this.open) this.openList(); this.setActive(i); }
        }
      },
      // children[0] هو <template x-for> — لذا +1
      scrollActiveIntoView() { this.$nextTick(() => this.$refs.list?.children[this.active + 1]?.scrollIntoView({ block: 'nearest' })); },
      isSelected(item) { const sel = this.selectedItem; return !!sel && sel.value === item.value; },
    };
  }

        document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
        document.title = this.t('docTitle');
        try { localStorage.setItem('firob-locale', loc); } catch (e) {}
      },
      toggleLocale() { this.setLocale(this.locale === 'ar' ? 'en' : 'ar'); },

      /* ---------- التنقل (Teacher Portal) ---------- */
      nav: [
        { group: 'main', items: [
          { key: 'teacherDashboard', icon: 'fa-solid fa-gauge-high', href: 'teacher-dashboard.html' },
        ]},
        { group: 'teaching', items: [
          { key: 'myCourses', icon: 'fa-solid fa-book-open', href: 'CoursesManagement.html' },
          { key: 'conceptsTree', icon: 'fa-solid fa-diagram-project', href: 'concepts.html' },
        ]},
        { group: 'assessment', items: [
          { key: 'quizBank', icon: 'fa-solid fa-list-check', href: 'quizzes.html' },
          { key: 'learningObjects', icon: 'fa-solid fa-cubes', href: 'learning-objects.html' },
          { key: 'aiStudio', icon: 'fa-solid fa-wand-magic-sparkles', href: 'ai-generator.html' },
        ]},
        { group: 'grading', items: [
          { key: 'reviewQueue', icon: 'fa-solid fa-clipboard-check', href: 'ReviewQueue.html' },
          { key: 'studentResults', icon: 'fa-solid fa-chart-line', href: 'quiz-results.html' },
        ]},
      ],
      /** شارة القائمة = عدد الطلبات «بانتظار المراجعة» (نفس مصدر المؤشر) */
      navCount(item) { return item.key === 'reviewQueue' ? this.kpis.pending : 0; },
      setActive(key) { this.active = key; this.mobileNav = false; },

      /* ---------- الإشعارات (قرارات المراجِع الأخيرة) ---------- */
      notifications: decided.map((d, i) => ({
        id: d.id, key: d.status, at: d.decidedAt, title: d.title, read: d.status === 'approved',
        icon: 'fa-solid ' + STATUS_META[d.status].icon,
        tone: { approved: 'bg-success-500/15 text-success-700 dark:text-success-500', rejected: 'bg-error-500/15 text-error-700 dark:text-red-300', changes_requested: 'bg-warning-500/15 text-warning-700 dark:text-warning-500' }[d.status],
      })),
      get unread() { return this.notifications.filter(n => !n.read).length; },
      notifText(n) { return this.tf('notif.' + n.key, { title: this.loc(n.title) }); },

      /* ---------- البيانات (نسخة عميقة قابلة للتعديل) ---------- */
      items: TC.clone(TC.REVIEW_ITEMS).map(it => ({ ...it, note: null, history: [] })),

      /** الصفوف بعد الربط مع TC + حقول مشتقة */
      get rows() {
        const now = Date.now();
        return this.items.map(it => {
          const j = resolve(it);
          const ageDays = Math.max(0, Math.floor((now - Date.parse(it.submittedAt)) / DAY));
          const hay = TC.normalize([
            it.title.ar, it.title.en, j.code, it.refId,
            j.entity && (j.entity.name || j.entity.title || j.entity.text) ? [(j.entity.name || j.entity.title || j.entity.text).ar, (j.entity.name || j.entity.title || j.entity.text).en].join(' ') : '',
            j.quiz ? [j.quiz.code, j.quiz.title.ar, j.quiz.title.en].join(' ') : '',
            j.course ? [j.course.code, j.course.title.ar, j.course.title.en].join(' ') : '',
          ].join(' '));
          return { ...it, ...j, ageDays, hay };
        });
      },
      kindMeta(k) { return KIND_META[k] || KIND_META.concept; },
      statusMeta(s) { return STATUS_META[s] || STATUS_META.pending; },

      /* ---------- المؤشرات (من كل الطلبات، دون فلاتر) ---------- */
      get kpis() {
        const now = new Date();
        const by = (s) => this.items.filter(i => i.status === s).length;
        const approvedMonth = this.items.filter(i => {
          if (i.status !== 'approved' || !i.decidedAt) return false;
          const d = new Date(i.decidedAt);
          return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d <= now;
        }).length;
        return { pending: by('pending'), changes: by('changes_requested'), approvedMonth, rejected: by('rejected') };
      },
      get kpiCards() {
        const k = this.kpis;
        return [
          { key: 'pending', value: k.pending, icon: 'fa-hourglass-half', tone: 'bg-info-500/15 text-info-700 dark:text-blue-300' },
          { key: 'changes', value: k.changes, icon: 'fa-pen-to-square', tone: 'bg-warning-500/15 text-warning-700 dark:text-warning-500' },
          { key: 'approvedMonth', value: k.approvedMonth, icon: 'fa-circle-check', tone: 'bg-success-500/15 text-success-700 dark:text-success-500' },
          { key: 'rejected', value: k.rejected, icon: 'fa-circle-xmark', tone: 'bg-error-500/15 text-error-700 dark:text-red-300' },
        ];
      },

      /* ---------- الفلاتر والفرز والترقيم ---------- */
      kind: 'all', status: 'all', search: '', sortKey: 'submitted', sortDir: 'desc', page: 1, pageSize: PAGE_SIZE,
      liveMsg: '',
      get hasFilters() { return !!this.search.trim() || this.status !== 'all' || this.kind !== 'all'; },
      /** الصفوف بعد البحث والحالة (قبل تبويب النوع) — أساس عدّادات التبويبات */
      get baseRows() {
        const q = TC.normalize(this.search);
        const terms = q ? q.split(' ') : [];
        return this.rows.filter(r => (this.status === 'all' || r.status === this.status) && terms.every(w => r.hay.includes(w)));
      },
      get kindCounts() {
        const base = this.baseRows, c = { all: base.length };
        KIND_KEYS.slice(1).forEach(k => { c[k] = base.filter(r => r.kind === k).length; });
        return c;
      },
      get filtered() {
        const list = this.baseRows.filter(r => this.kind === 'all' || r.kind === this.kind);
        const dir = this.sortDir === 'asc' ? 1 : -1;
        const coll = new Intl.Collator(this.locale === 'ar' ? 'ar' : 'en');
        return list.slice().sort((a, b) => {
          const v = this.sortKey === 'title' ? coll.compare(this.loc(a.title), this.loc(b.title)) : a.submittedAt.localeCompare(b.submittedAt);
          return (v || a.id.localeCompare(b.id)) * dir;
        });
      },
      get pageCount() { return Math.max(1, Math.ceil(this.filtered.length / this.pageSize)); },
      get curPage() { return Math.min(Math.max(1, this.page), this.pageCount); },
      get pageRows() { const s = (this.curPage - 1) * this.pageSize; return this.filtered.slice(s, s + this.pageSize); },
      get rangeText() {
        const n = this.filtered.length;
        if (!n) return this.t('rq.noResults');
        const a = (this.curPage - 1) * this.pageSize + 1, b = Math.min(n, a + this.pageSize - 1);
        return this.tf('rq.range', { a: this.fmtNum(a), b: this.fmtNum(b), n: this.fmtNum(n) });
      },
      get statusOptions() {
        return [{ value: 'all', label: this.t('rq.statusAll') }].concat(STATUSES.map(s => ({ value: s, label: this.t('rq.status.' + s) })));
      },
      get sortOptions() { return SORTS.map(s => ({ value: s, label: this.t('rq.sort.' + s) })); },
      get sortValue() { return this.sortKey + '-' + this.sortDir; },
      setSortValue(v) {
        if (!SORTS.includes(v)) return;
        [this.sortKey, this.sortDir] = v.split('-');
        this.page = 1; this.syncUrl(); this.liveMsg = this.t('rq.sort.' + v);
      },
      sortBy(key) {
        if (this.sortKey === key) this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
        else { this.sortKey = key; this.sortDir = key === 'submitted' ? 'desc' : 'asc'; }
        this.page = 1; this.syncUrl();
        this.liveMsg = this.t(key === 'title' ? 'rq.colItem' : 'rq.colSubmitted') + ' — ' + this.t(this.sortDir === 'asc' ? 'rq.sortAsc' : 'rq.sortDesc');
      },
      ariaSort(key) { return this.sortKey === key ? (this.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'; },
      sortIcon(key) { return this.sortKey !== key ? 'fa-sort' : (this.sortDir === 'asc' ? 'fa-sort-up' : 'fa-sort-down'); },
      setKind(k) { if (!KIND_KEYS.includes(k)) return; this.kind = k; this.onFilterChange(); },
      setStatus(s) { if (s !== 'all' && !STATUSES.includes(s)) return; this.status = s; this.onFilterChange(); },
      clearFilters() { this.search = ''; this.status = 'all'; this.kind = 'all'; this.onFilterChange(); },
      onFilterChange() { this.page = 1; this.syncUrl(); this.announce(); },
      announce() { this.liveMsg = this.tf('rq.liveCount', { n: this.fmtNum(this.filtered.length) }); },
      goPage(n) {
        if (n < 1 || n > this.pageCount || n === this.curPage) return;
        this.page = n; this.syncUrl(); this.liveMsg = this.rangeText;
        this.$nextTick(() => document.getElementById('rq-results')?.focus());
      },
      /** تبويبات: أسهم واعية للاتجاه + Home/End (تنشيط تلقائي) */
      onTabKey(e, i) {
        const rtl = this.locale === 'ar';
        let j = null;
        if (e.key === 'ArrowRight') j = rtl ? i - 1 : i + 1;
        else if (e.key === 'ArrowLeft') j = rtl ? i + 1 : i - 1;
        else if (e.key === 'Home') j = 0;
        else if (e.key === 'End') j = KINDS.length - 1;
        if (j === null) return;
        e.preventDefault();
        j = (j + KINDS.length) % KINDS.length;
        this.setKind(KINDS[j].key);
        this.$nextTick(() => document.getElementById('rq-tab-' + KINDS[j].key)?.focus());
      },

      /* ---------- مزامنة الرابط ---------- */
      readUrl() {
        const p = new URLSearchParams(location.search || '');
        if (KIND_KEYS.includes(p.get('kind'))) this.kind = p.get('kind');
        if (STATUSES.includes(p.get('status'))) this.status = p.get('status');
        if (p.get('q')) this.search = p.get('q').slice(0, 100);
        if (SORTS.includes(p.get('sort'))) [this.sortKey, this.sortDir] = p.get('sort').split('-');
        const pg = parseInt(p.get('page'), 10); if (pg > 1) this.page = pg;
      },
      syncUrl() {
        const p = new URLSearchParams();
        if (this.kind !== 'all') p.set('kind', this.kind);
        if (this.status !== 'all') p.set('status', this.status);
        if (this.search.trim()) p.set('q', this.search.trim());
        if (this.sortValue !== 'submitted-desc') p.set('sort', this.sortValue);
        if (this.curPage > 1) p.set('page', String(this.curPage));
        const qs = p.toString();
        try { history.replaceState(history.state, '', location.pathname + (qs ? '?' + qs : '')); } catch (e) {}
      },

      /* ---------- عرض العمر ---------- */
      ageText(r) {
        if (r.ageDays < 1) return this.t('rq.ageToday');
        const d = this.fmtNum(r.ageDays, { style: 'unit', unit: 'day', unitDisplay: 'long' });
        return this.tf('rq.ageWaiting', { d }) + (r.ageDays >= WARN_DAYS ? ' · ' + this.t('rq.ageLong') : '');
      },

      /* ---------- المعاينة ---------- */
      previewOpen: false, previewId: null,
      /** ملخص المحتوى المُرسَل من TC حسب النوع */
      preview(id) {
        const row = this.rows.find(r => r.id === id);
        if (!row || !row.entity) return null;
        const L = (o) => this.loc(o), e = row.entity;
        const facts = [];
        const place = () => {
          facts.push({ k: 'course', v: L(row.course?.title) }, { k: 'unit', v: L(row.unit?.title) });
          if (row.lesson) facts.push({ k: 'lesson', v: L(row.lesson.title) });
        };
        const conceptList = (ids) => ids.map(id => TC.concept(id)).filter(Boolean).map(c => ({ id: c.id, code: c.code, name: L(c.name) }));
        const out = { row, facts, question: null, concepts: null, conceptsLabel: 'rq.pvConcepts' };
        if (row.kind === 'concept') {
          place();
          facts.push({ k: 'bloom', v: this.t('bloom.' + e.bloom) }, { k: 'difficulty', v: this.t('difficulty.' + e.difficulty) },
                     { k: 'classification', v: this.t(e.classified ? 'rq.classified' : 'rq.unclassified') });
          out.concepts = conceptList(e.prerequisites); out.conceptsLabel = 'rq.pvPrereqs';
        } else if (row.kind === 'learning_object') {
          facts.push({ k: 'loType', v: this.t('loType.' + e.type) }, { k: 'size', v: TC.fmtBytes(e.sizeBytes, this.locale) },
                     { k: 'visibility', v: this.t('visibility.' + e.visibility) });
          place();
          out.concepts = conceptList(e.conceptIds);
        } else if (row.kind === 'question') {
          facts.push({ k: 'quiz', v: L(row.quiz.title) + ' (' + row.quiz.code + ')' }, { k: 'qtype', v: this.t('qtype.' + e.type) },
                     { k: 'marks', v: this.fmtNum(e.marks) }, { k: 'bloom', v: this.t('bloom.' + e.bloom) }, { k: 'difficulty', v: this.t('difficulty.' + e.difficulty) });
          place();
          out.question = { text: L(e.text), options: e.options.map(o => ({ uid: o.uid, text: L(o.text), correct: !!o.correct })), modelAnswer: e.modelAnswer ? L(e.modelAnswer) : '' };
          out.concepts = conceptList(e.conceptId ? [e.conceptId] : []);
        }
        return out;
      },
      get pv() { return this.previewId ? this.preview(this.previewId) : null; },
      openPreview(id, ev) {
        if (!this.rows.some(r => r.id === id)) return;
        opener = ev?.currentTarget || document.activeElement;
        this.previewId = id; this.previewOpen = true;
      },
      closePreview() {
        if (!this.previewOpen) return;
        this.previewOpen = false;
        this.restoreFocus();
        setTimeout(() => { if (!this.previewOpen) this.previewId = null; }, 200);   // بعد انتهاء انتقال الإغلاق
      },
      restoreFocus() { const el = opener; opener = null; this.$nextTick(() => { if (el && el.isConnected !== false) el.focus?.(); }); },

      /* ---------- سحب طلب معلّق (تأكيد + تراجع 6 ثوانٍ) ---------- */
      undo: null,
      async withdraw(id) {
        const it = this.items.find(i => i.id === id);
        if (!it || it.status !== 'pending') return false;
        const title = this.loc(it.title);
        let ok = false;
        if (typeof Swal !== 'undefined') {
          const r = await Swal.fire({
            icon: 'warning', titleText: this.t('rq.withdrawTitle'), text: this.tf('rq.withdrawText', { title }),
            showCancelButton: true, confirmButtonText: this.t('rq.withdrawConfirm'), cancelButtonText: this.t('rq.cancel'),
            focusCancel: true, customClass: { popup: 'firob-swal', confirmButton: 'btn btn-danger', cancelButton: 'btn btn-outline' }, buttonsStyling: false,
          });
          ok = !!(r && r.isConfirmed);
        } else ok = window.confirm(this.tf('rq.withdrawText', { title }));
        if (!ok) return false;
        const idx = this.items.findIndex(i => i.id === id);
        if (idx < 0) return false;
        const [item] = this.items.splice(idx, 1);
        clearTimeout(undoTimer);
        this.undo = { item, index: idx };
        undoTimer = setTimeout(() => { this.undo = null; }, UNDO_MS);
        if (this.page > this.pageCount) this.page = this.pageCount;
        this.syncUrl();
        this.liveMsg = this.tf('rq.withdrawn', { title });
        this.$nextTick(() => document.getElementById('rq-results')?.focus());
        return true;
      },
      undoWithdraw() {
        if (!this.undo) return false;
        const { item, index } = this.undo;
        clearTimeout(undoTimer); undoTimer = null;
        this.items.splice(Math.min(index, this.items.length), 0, item);
        this.undo = null;
        this.liveMsg = this.tf('rq.undone', { title: this.loc(item.title) });
        return true;
      },

      /* ---------- تعديل وإعادة الإرسال ---------- */
      resubmitOpen: false, rsId: null, rsNote: '', rsSubmitted: false, busy: false,
      canResubmit(r) { return r.status === 'rejected' || r.status === 'changes_requested'; },
      /** سبب منع إعادة الإرسال (أو '') — يُعرض عبر aria-disabled + تلميح */
      resubmitBlock(r) {
        if (r.kind === 'concept' && r.entity && r.entity.classified === false) return this.t('rq.blockUnclassified');
        return '';
      },
      get rs() { return this.rsId ? this.rows.find(r => r.id === this.rsId) || null : null; },
      get rsError() {
        const n = this.rsNote.trim().length;
        if (!n) return this.t('rq.noteRequired');
        if (n < NOTE_MIN) return this.tf('rq.noteTooShort', { min: this.fmtNum(NOTE_MIN) });
        if (n > NOTE_MAX) return this.tf('rq.noteTooLong', { max: this.fmtNum(NOTE_MAX) });
        return '';
      },
      openResubmit(id, ev) {
        const r = this.rows.find(x => x.id === id);
        if (!r || !this.canResubmit(r)) return false;
        const block = this.resubmitBlock(r);
        if (block) { this.liveMsg = block; return false; }
        opener = ev?.currentTarget || document.activeElement;
        this.rsId = id; this.rsNote = ''; this.rsSubmitted = false; this.resubmitOpen = true;
        this.$nextTick(() => setTimeout(() => document.getElementById('rs-note')?.focus(), 60));
        return true;
      },
      closeResubmit() {
        if (this.busy || !this.resubmitOpen) return;
        this.resubmitOpen = false;
        this.restoreFocus();
        setTimeout(() => { if (!this.resubmitOpen) { this.rsId = null; this.rsNote = ''; this.rsSubmitted = false; } }, 200);
      },
      async confirmResubmit() {
        if (this.busy) return false;
        this.rsSubmitted = true;
        if (this.rsError) {
          this.liveMsg = this.rsError;
          this.$nextTick(() => document.getElementById('rs-note')?.focus());
          return false;
        }
        const it = this.items.find(i => i.id === this.rsId);
        if (!it || !(it.status === 'rejected' || it.status === 'changes_requested')) return false;
        this.busy = true;
        await new Promise(r => setTimeout(r, 400));
        const note = this.rsNote.trim();
        const nowIso = new Date().toISOString();
        it.history.push({ status: it.status, reviewer: it.reviewer, reason: it.reason, decidedAt: it.decidedAt, submittedAt: it.submittedAt, resubmittedAt: nowIso, note });
        Object.assign(it, { status: 'pending', submittedAt: nowIso, reviewer: null, reason: null, decidedAt: null, note });
        this.busy = false;
        const msg = this.tf('rq.resubmitted', { title: this.loc(it.title) });
        this.resubmitOpen = false;
        this.restoreFocus();
        setTimeout(() => { if (!this.resubmitOpen) { this.rsId = null; this.rsNote = ''; this.rsSubmitted = false; } }, 200);
        if (this.page > this.pageCount) this.page = this.pageCount;
        this.liveMsg = msg;
        this.toast(msg);
        return true;
      },

      /* ---------- SweetAlert2: تنبيه سريع (titleText فقط) ---------- */
      toast(msg, icon = 'success') {
        if (typeof Swal === 'undefined') return;
        Swal.fire({ toast: true, position: 'top-end', icon, titleText: msg, showConfirmButton: false, timer: 3000, customClass: { popup: 'firob-swal firob-toast' } });
      },

      /* ---------- عامة ---------- */
      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; this.wide = m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        document.title = this.t('docTitle');
        this.readUrl();
        this.syncUrl();
        this.announce();
        this.$watch('search', () => this.onFilterChange());
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      /** Escape على مستوى النافذة: القوائم فقط — الحوارات تعالج Escape بنفسها (.stop) */
      closeAll() {
        this.notifOpen = false; this.profileOpen = false; this.mobileNav = false;
      },
    };
  }
</script>
</body>
