<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>مقرراتي الدراسية — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- تلميحات أزرار الإجراءات (Action Tooltips) ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg border border-white/10 bg-slate-900/90 px-2.5 py-1 text-xs font-medium tracking-wide text-white opacity-0 shadow-xl backdrop-blur-md transition-all duration-200 ease-out;
      @apply dark:border-slate-800/20 dark:bg-slate-100 dark:text-slate-900;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-slate-900/90 opacity-0 transition-all duration-200 ease-out;
      @apply dark:border-t-slate-100;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  {@apply bg-accent-500/20 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }
    .badge-warning { @apply bg-warning-500/15 text-warning-700 dark:text-warning-500; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger dark:text-red-300; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-muted; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-4 py-2.5 text-start text-sm font-medium text-ink transition-colors hover:bg-soft; }
    .combo-option.is-active   { @apply bg-soft; }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }
    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- النافذة المنبثقة / اللوحة الجانبية ---------- */
    .modal-panel { @apply relative flex max-h-[90dvh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }

    /* ---------- مقياس الحصة / شريط التقدّم (QuotaMeter) ---------- */
    .quota-track { @apply h-1.5 w-full overflow-hidden rounded-full bg-line; }
    .quota-fill { @apply h-full rounded-full transition-all duration-500; }

    /* ---------- بطاقة المقرر (CourseCard) ---------- */
    .course-icon { @apply grid h-12 w-12 shrink-0 place-items-center rounded-xl text-lg; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }

    /* ---------- [layout: full-height sidebar + bottom footer] ---------- */
    html, body { min-height: 100%; }
    body { margin: 0; }
    .app-col { min-height: 100vh; min-height: 100dvh; }
    @media (min-width: 1024px) {
      #sidebar { height: 100vh; height: 100dvh; }
      .app-col { margin-inline-start: 18rem; transition: margin-inline-start .3s ease; }
      .app-col.is-collapsed { margin-inline-start: 5rem; }
      .save-bar { inset-inline-start: 18rem; transition: inset-inline-start .3s ease; }
      .save-bar.is-collapsed { inset-inline-start: 5rem; }
    }
</style>

<!-- ⑥ Alpine.js (+ Focus لحصر التركيز داخل النوافذ المنبثقة + Collapse) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- ⑦ SweetAlert2 -->
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5"></script>
</head>

<body x-data="coursesManager()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch.focus(); }
                       else if ($event.key === '/' && !panelOpen && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { $event.preventDefault(); $refs.courseSearch?.focus(); }"
      @scroll.window="notifOpen = false" @resize.window="notifOpen = false"
      :class="{ 'overflow-hidden': (mobileNav && mobile) || panelOpen }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <span class="inline-flex min-w-0 flex-1 items-center gap-3" :class="!expanded && 'lg:flex-none lg:justify-center'">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </span>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-muted" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="item.count && expanded"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent"
                        x-text="item.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="app-col flex min-w-0 flex-1 flex-col" :class="collapsed && 'is-collapsed'">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex"><bdi dir="ltr">Ctrl K</bdi></kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-haspopup="true" :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="notifText(n)"></p>

              <div class="border-t border-line p-2">

                  <span x-text="t('viewAllNotif')"></span>

              </div>
            </div>
          </div>

          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" class="flex max-w-[14rem] items-center gap-2 rounded-xl p-1 transition hover:bg-soft focus-visible:ring-2 md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    aria-haspopup="menu" :aria-expanded="profileOpen.toString()" aria-controls="profile-menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true" x-text="loc(teacher.initials)"></span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="loc(teacher.name)"></span>
                <span class="block truncate text-xs text-muted" x-text="t('roleTeacher')"></span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted md:block" aria-hidden="true"></i>
            </button>
            <div id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-56" role="menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <a href="../common/profile.html" role="menuitem" class="menu-item"><i class="fa-regular fa-user w-4 text-muted" aria-hidden="true"></i> <span x-text="t('profile')"></span></a>
              <a href="../common/errors.html" role="menuitem" class="menu-item"><i class="fa-solid fa-triangle-exclamation w-4 text-muted" aria-hidden="true"></i> <span x-text="t('statusErrors')"></span></a>
              <div class="border-t border-line"></div>
              <a href="../auth/login.html" role="menuitem" class="menu-item !text-danger"><i class="fa-solid fa-arrow-right-from-bracket w-4" aria-hidden="true"></i> <span x-text="t('logout')"></span></a>
            </div>
          </div>
        </div>
      </div>

      <!-- زبدة الخبز (Breadcrumb) -->
      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="locale === 'ar' ? 'مسار التنقل' : 'Breadcrumb'">
          <ol class="flex items-center gap-2" role="list">
            <li x-text="t('breadcrumb.home')"></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li x-text="t('breadcrumb.portal')"></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li class="text-ink" aria-current="page" x-text="t('navItems.myCourses')"></li>
          </ol>
        </nav>
      </div>
    </header>

    <!-- ================= المحتوى الرئيسي — إدارة المقررات الدراسية ================= -->
    <!-- ================= المحتوى الرئيسي — مقرراتي الدراسية (نطاق المعلم) ================= -->
    <!--
      نطاق الدور (Teacher scope):
      المعلم يعرض مقرراته المسندة فقط ويُدير هيكلها (الوحدات والدروس): إضافة، إعادة تسمية، ترتيب، وحذف ما لا مراجع له.
      أُزيلت من هذه الصفحة عمدًا لأنها من صلاحيات مدير المستأجر:
        - إنشاء مقرر جديد، وحذف/أرشفة/نسخ المقرر، ومفتاح حالة النشر.
        - تعديل رمز المقرر واسمه ولونه وأيقونته (منتقيات اللون/الأيقونة).
        - إشعارات المستأجر (قبول الدعوات، حصة المقاعد، إعادة تعيين كلمات المرور) ومؤشر «صفوف بدون مقررات».
      تبقى هذه الميزات في tenant-admin/CoursesManagement.html. وفي Laravel: مكوّن Livewire مشترك
      (CoursesManagement) مع Policy للمعلم (CoursePolicy@viewAny/manageStructure) تُخفي إجراءات المدير وتمنعها على الخادم.
    -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">

      <!-- العنوان -->
      <section class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end sm:justify-between">
        <div class="min-w-0">
          <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="t('cm.title')"></h1>
          <p class="mt-1 max-w-2xl text-sm text-muted sm:text-base" x-text="t('cm.subtitle')"></p>
        </div>
        <p class="inline-flex max-w-md items-start gap-2 rounded-xl border border-line bg-card px-3 py-2 text-xs font-bold leading-5 text-muted">
          <i class="fa-solid fa-circle-info mt-0.5 shrink-0 text-brand" aria-hidden="true"></i>
          <span x-text="t('cm.scopeNote')"></span>
        </p>
      </section>

      <!-- ================= شريط مؤشرات الأداء (محسوبة من البيانات) ================= -->
      <section :aria-label="t('cm.kpiAria')" class="grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-4">
        <div class="panel p-4 sm:p-5">
          <div class="flex items-center justify-between gap-3">
            <p class="min-w-0 truncate text-sm font-bold text-muted" x-text="t('cm.kpi.courses')"></p>
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-primary-500/10 text-brand" aria-hidden="true"><i class="fa-solid fa-book-open"></i></span>
          </div>
          <p class="mt-2 text-2xl font-extrabold tabular-nums" x-text="fmtNum(kpis.courses)"></p>
        </div>
        <div class="panel p-4 sm:p-5">
          <div class="flex items-center justify-between gap-3">
            <p class="min-w-0 truncate text-sm font-bold text-muted" x-text="t('cm.kpi.units')"></p>
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-info-500/15 text-info-700 dark:text-blue-300" aria-hidden="true"><i class="fa-solid fa-layer-group"></i></span>
          </div>
          <p class="mt-2 text-2xl font-extrabold tabular-nums" x-text="fmtNum(kpis.units)"></p>
        </div>
        <div class="panel p-4 sm:p-5">
          <div class="flex items-center justify-between gap-3">
            <p class="min-w-0 truncate text-sm font-bold text-muted" x-text="t('cm.kpi.lessons')"></p>
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-success-500/15 text-success-700 dark:text-success-500" aria-hidden="true"><i class="fa-regular fa-file-lines"></i></span>
          </div>
          <p class="mt-2 text-2xl font-extrabold tabular-nums" x-text="fmtNum(kpis.lessons)"></p>
        </div>
        <div class="panel p-4 sm:p-5">
          <div class="flex items-center justify-between gap-3">
            <p class="min-w-0 truncate text-sm font-bold text-muted" x-text="t('cm.kpi.unclassified')"></p>
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-warning-500/15 text-warning-700 dark:text-warning-500" aria-hidden="true"><i class="fa-solid fa-triangle-exclamation"></i></span>
          </div>
          <p class="mt-2 flex flex-wrap items-baseline gap-x-2 gap-y-1">
            <span class="text-2xl font-extrabold tabular-nums" x-text="fmtNum(kpis.unclassified)"></span>
            <a href="concepts.html" class="text-xs font-bold text-brand underline-offset-4 hover:underline" x-show="kpis.unclassified" x-text="t('cm.kpi.unclassifiedLink')"></a>
          </p>
        </div>
      </section>

      <!-- ================= شريط البحث والفلاتر + تبديل العرض ================= -->
      <section class="panel flex flex-col gap-3 p-4 lg:flex-row lg:items-center sm:p-5" :aria-label="t('cm.filtersAria')">
        <form role="search" class="relative min-w-0 flex-1" @submit.prevent>
          <label for="course-search" class="sr-only" x-text="t('cm.searchLabel')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="course-search" x-ref="courseSearch" type="search" x-model="search" :placeholder="t('cm.searchPlaceholder')" dir="auto" autocomplete="off" maxlength="100"
                 class="h-11 w-full min-w-0 rounded-xl border border-line bg-field ps-10 pe-3 text-start text-sm text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
        </form>

        <div class="relative w-full shrink-0 lg:w-48"
             x-data="selectDropdown({ id: 'cm-grade', options: () => gradeOptions, get: () => fGrade, set: (v) => setGrade(v) })"
             @click.outside="closeList()">
          <span id="cm-grade-label" class="sr-only" x-text="t('cm.filterGradeLabel')"></span>
          <button type="button" id="cm-grade" x-ref="btn" role="combobox" aria-haspopup="listbox"
                  aria-labelledby="cm-grade-label cm-grade"
                  :aria-expanded="open.toString()" aria-controls="cm-grade-list"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  class="field flex h-11 w-full items-center justify-between gap-2 text-start font-bold"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="cm-grade-list" role="listbox" aria-labelledby="cm-grade-label"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
        </div>
        <div class="relative w-full shrink-0 lg:w-56"
             x-data="selectDropdown({ id: 'cm-subject', options: () => subjectOptions, get: () => fSubject, set: (v) => setSubject(v) })"
             @click.outside="closeList()">
          <span id="cm-subject-label" class="sr-only" x-text="t('cm.filterSubjectLabel')"></span>
          <button type="button" id="cm-subject" x-ref="btn" role="combobox" aria-haspopup="listbox"
                  aria-labelledby="cm-subject-label cm-subject"
                  :aria-expanded="open.toString()" aria-controls="cm-subject-list"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  class="field flex h-11 w-full items-center justify-between gap-2 text-start font-bold"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="cm-subject-list" role="listbox" aria-labelledby="cm-subject-label"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
        </div>
        <button type="button" class="btn btn-outline shrink-0" @click="resetFilters()" :disabled="!hasFilters">
          <i class="fa-solid fa-filter-circle-xmark text-muted" aria-hidden="true"></i>
          <span x-text="t('cm.resetFilters')"></span>
        </button>

        <!-- تبديل طريقة العرض (الشاشات الواسعة فقط) -->
        <template x-if="wide">
          <div class="flex shrink-0 items-center gap-1 rounded-xl border border-line bg-page/50 p-1" role="group" :aria-label="t('cm.viewToggleLabel')">
            <button type="button" class="act group relative border-0" :class="viewMode === 'table' ? 'bg-primary-500 text-white hover:bg-primary-600' : 'text-muted'"
                    @click="setView('table')" :aria-pressed="(viewMode === 'table').toString()" :aria-label="t('cm.viewTable')">
              <i class="fa-solid fa-table-list" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="t('cm.viewTable')"></span><span class="tooltip-arrow" aria-hidden="true"></span>
            </button>
            <button type="button" class="act group relative border-0" :class="viewMode === 'grid' ? 'bg-primary-500 text-white hover:bg-primary-600' : 'text-muted'"
                    @click="setView('grid')" :aria-pressed="(viewMode === 'grid').toString()" :aria-label="t('cm.viewGrid')">
              <i class="fa-solid fa-grip" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="t('cm.viewGrid')"></span><span class="tooltip-arrow" aria-hidden="true"></span>
            </button>
          </div>
        </template>
      </section>

      <!-- ================= قائمة المقررات (عرض واحد: جدول أو بطاقات) ================= -->
      <section aria-labelledby="courses-title" class="space-y-4">
        <h2 id="courses-title" class="sr-only" x-text="t('cm.listTitle')"></h2>
        <p class="sr-only" aria-live="polite" x-text="panelOpen ? '' : liveMsg"></p>

        <!-- حالة فارغة -->
        <template x-if="!filtered.length">
          <div class="panel flex flex-col items-center gap-3 p-10 text-center">
            <span class="grid h-14 w-14 place-items-center rounded-full bg-primary-500/10 text-brand" aria-hidden="true"><i class="fa-solid fa-book-open-reader text-xl"></i></span>
            <p class="text-lg font-extrabold text-ink" x-text="courses.length ? t('cm.emptyTitle') : t('cm.emptyNone')"></p>
            <p class="max-w-sm text-sm text-muted" x-text="courses.length ? t('cm.emptySubtitle') : t('cm.emptyNoneText')"></p>
            <button type="button" class="btn btn-outline mt-1" x-show="hasFilters" @click="resetFilters()">
              <i class="fa-solid fa-filter-circle-xmark text-muted" aria-hidden="true"></i> <span x-text="t('cm.resetFilters')"></span>
            </button>
          </div>
        </template>

        <!-- عرض البطاقات (الجوال دائمًا، أو اختياري على الشاشات الواسعة) -->
        <template x-if="filtered.length && (!wide || viewMode === 'grid')">
          <ul class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3" role="list">
            <template x-for="r in paged" :key="r.id">
              <li class="flex">
                <article class="panel flex w-full flex-col gap-3 p-4" :aria-labelledby="'ct-' + r.id">
                  <div class="flex items-start justify-between gap-2">
                    <div class="flex min-w-0 items-center gap-3">
                      <span class="course-icon" :class="tone(r.c)" aria-hidden="true"><i class="fa-solid" :class="r.c.icon"></i></span>
                      <span class="min-w-0 text-start"><bdi dir="ltr" class="badge badge-muted font-mono" x-text="r.c.code"></bdi></span>
                    </div>
                    <span class="badge badge-neutral shrink-0"><i class="fa-solid fa-user-graduate text-[10px]" aria-hidden="true"></i><span x-text="tf('cm.studentsN', { n: fmtNum(r.counts.students) })"></span></span>
                  </div>
                  <div class="min-w-0 text-start">
                    <h3 :id="'ct-' + r.id" class="truncate text-base font-extrabold leading-6" x-text="title(r.c)"></h3>
                    <p class="truncate text-xs text-muted"><bdi dir="auto" :lang="otherLocale" x-text="altTitle(r.c)"></bdi></p>
                  </div>
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="badge badge-primary" x-text="loc(r.c.grade)"></span>
                    <span class="badge badge-neutral" x-text="subjectLabel(r.c)"></span>
                  </div>
                  <dl class="grid grid-cols-5 gap-1.5 text-center">
                    <div class="flex flex-col-reverse rounded-lg bg-page/60 px-1 py-2">
                      <dt class="truncate text-[11px] font-bold text-muted" x-text="t('cm.count.units')"></dt>
                      <dd class="text-base font-extrabold tabular-nums text-ink" x-text="fmtNum(r.counts.units)"></dd>
                    </div>
                    <div class="flex flex-col-reverse rounded-lg bg-page/60 px-1 py-2">
                      <dt class="truncate text-[11px] font-bold text-muted" x-text="t('cm.count.lessons')"></dt>
                      <dd class="text-base font-extrabold tabular-nums text-ink" x-text="fmtNum(r.counts.lessons)"></dd>
                    </div>
                    <div class="flex flex-col-reverse rounded-lg bg-page/60 px-1 py-2">
                      <dt class="truncate text-[11px] font-bold text-muted" x-text="t('cm.count.concepts')"></dt>
                      <dd class="text-base font-extrabold tabular-nums text-ink" x-text="fmtNum(r.counts.concepts)"></dd>
                    </div>
                    <div class="flex flex-col-reverse rounded-lg bg-page/60 px-1 py-2">
                      <dt class="truncate text-[11px] font-bold text-muted" x-text="t('cm.count.los')"></dt>
                      <dd class="text-base font-extrabold tabular-nums text-ink" x-text="fmtNum(r.counts.los)"></dd>
                    </div>
                    <div class="flex flex-col-reverse rounded-lg bg-page/60 px-1 py-2">
                      <dt class="truncate text-[11px] font-bold text-muted" x-text="t('cm.count.quizzes')"></dt>
                      <dd class="text-base font-extrabold tabular-nums text-ink" x-text="fmtNum(r.counts.quizzes)"></dd>
                    </div>
                  </dl>
                  <div>
                    <div class="flex flex-wrap items-center justify-between gap-x-2 gap-y-0.5 text-xs font-bold">
                      <span :id="'rd-' + r.id" class="text-muted" x-text="t('cm.readiness')"></span>
                      <span class="inline-flex items-center gap-1" :class="readyTone(r).text" aria-hidden="true"><i class="fa-solid text-[10px]" :class="readyTone(r).icon"></i><span x-text="readyText(r)"></span></span>
                    </div>
                    <div class="quota-track mt-1.5" role="progressbar" :aria-labelledby="'rd-' + r.id" aria-valuemin="0" aria-valuemax="100"
                         :aria-valuenow="r.ready.pct ?? 0" :aria-valuetext="readyValueText(r)">
                      <div class="quota-fill" :class="readyTone(r).bar" :style="'width:' + (r.ready.pct ?? 0) + '%'"></div>
                    </div>
                  </div>
                  <div class="mt-auto flex flex-wrap items-center justify-between gap-2 border-t border-line pt-3">
                    <button type="button" class="btn btn-sm btn-outline" @click="openPanel(r.id, $event)" aria-haspopup="dialog"
                            :aria-label="tf('cm.act.manageFor', { title: title(r.c) })">
                      <i class="fa-solid fa-sitemap" aria-hidden="true"></i> <span x-text="t('cm.act.manage')"></span>
                    </button>
                    <div class="flex flex-wrap gap-1.5">
                      <a :href="conceptsHref(r.c)" class="act group relative" :aria-label="tf('cm.link.conceptsFor', { title: title(r.c) })"><i class="fa-solid fa-diagram-project" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="t('cm.link.concepts')"></span><span class="tooltip-arrow" aria-hidden="true"></span></a>
                      <a :href="losHref(r.c)" class="act group relative" :aria-label="tf('cm.link.losFor', { title: title(r.c) })"><i class="fa-solid fa-cubes" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="t('cm.link.los')"></span><span class="tooltip-arrow" aria-hidden="true"></span></a>
                      <a :href="quizzesHref(r.c)" class="act group relative" :aria-label="tf('cm.link.quizzesFor', { title: title(r.c) })"><i class="fa-solid fa-list-check" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="t('cm.link.quizzes')"></span><span class="tooltip-arrow" aria-hidden="true"></span></a>
                      <template x-if="hasAttempts(r.c)">
                        <a :href="resultsHref(r.c)" class="act group relative" :aria-label="tf('cm.link.resultsFor', { title: title(r.c) })"><i class="fa-solid fa-chart-simple" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="t('cm.link.results')"></span><span class="tooltip-arrow" aria-hidden="true"></span></a>
                      </template>
                    </div>
                  </div>
                </article>
              </li>
            </template>
          </ul>
        </template>

        <!-- عرض الجدول (الشاشات الواسعة) -->
        <template x-if="filtered.length && wide && viewMode === 'table'">
          <div class="panel overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full min-w-[1080px] border-collapse text-sm">
                <caption class="sr-only" x-text="tf('cm.tableCaption', { range: rangeText })"></caption>
                <thead>
                  <tr class="bg-soft text-ink">
                    <th scope="col" class="px-5 py-3.5 text-start text-xs font-extrabold" :aria-sort="ariaSort('title')">
                      <button type="button" class="inline-flex items-center gap-1.5 rounded text-start font-extrabold transition hover:text-brand focus-visible:ring-2" @click="sortBy('title')">
                        <span x-text="t('cm.col.title')"></span>

    return {
      /* ---------- حالة عامة (Shell) ---------- */
      dark: document.documentElement.classList.contains('dark'),
      locale: document.documentElement.lang === 'en' ? 'en' : 'ar',

      /* ---------- الترجمة والتنسيق ---------- */
      t(path) {
        const dict = I18N[this.locale];
        return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), dict) ?? path;
      },
      tf(path, vars) {
        let s = this.t(path);
        Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
        return s;
      },
      loc(o) { return TC.loc(o, this.locale); },
      get otherLocale() { return this.locale === 'ar' ? 'en' : 'ar'; },
      fmtNum(n, opts) { return TC.fmtNum(n, this.locale, opts); },
      fmtPct(v, digits = 0) { return TC.fmtPct(v, this.locale, digits); },
      relTime(iso) { return TC.relTime(iso, this.locale); },
      listFmt(parts) {
        try { return new Intl.ListFormat(intlLoc(this.locale), { style: 'long', type: 'conjunction' }).format(parts); } catch (e) { return parts.join('، '); }
      },
      setLocale(loc) {
        this.locale = loc;
        document.documentElement.lang = loc;
        document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
        document.title = this.t('docTitle');
        try { localStorage.setItem('firob-locale', loc); } catch (e) {}
      },
      toggleLocale() { this.setLocale(this.locale === 'ar' ? 'en' : 'ar'); },

      /* ---------- التنقل (Teacher Portal) ---------- */
      nav: [

      notifications: [
        latestPending && { id: 1, key: 'pendingGrading', at: pastIso(latestPending.submittedAt), read: false, icon: 'fa-solid fa-hourglass-half', tone: 'bg-accent-500/20 text-yellow-900 dark:text-accent-500',
          vars: (l) => ({ n: TC.fmtNum(pendingGradingAll, l) }) },
        openSoonest && { id: 2, key: 'quizOpen', at: pastIso(openSoonest.opensAt), read: false, icon: 'fa-solid fa-circle-play', tone: 'bg-success-500/15 text-success-700 dark:text-success-500',
          vars: (l) => ({ quiz: TC.loc(openSoonest.title, l), when: TC.relTime(openSoonest.closesAt, l) }) },
        changesRequested && { id: 3, key: 'changesRequested', at: pastIso(changesRequested.decidedAt), read: true, icon: 'fa-solid fa-pen-ruler', tone: 'bg-info-500/15 text-info-700 dark:text-blue-300',

      get unread() { return this.notifications.filter(n => !n.read).length; },
      notifText(n) { return this.tf('notif.' + n.key, n.vars(this.locale)); },

      /* ---------- البيانات القابلة للتعديل (نسخة عميقة من مقررات المعلم) ---------- */
      courses: TC.clone(TC.COURSES),

      /** مراجع TC لوحدة/درس (مفاهيم، عناصر تعليمية، اختبارات) */
      refsWhere(pred) {
        const r = { concepts: TC.CONCEPTS.filter(pred).length, los: TC.LEARNING_OBJECTS.filter(pred).length, quizzes: TC.QUIZZES.filter(pred).length };
        r.total = r.concepts + r.los + r.quizzes;
        return r;
      },
      unitRefs(u) { return this.refsWhere(x => x.unitId === u.id); },
      lessonRefs(l) { return this.refsWhere(x => x.lessonId === l.id); },
      refsLong(r) {
        const parts = [];
        if (r.concepts) parts.push(this.tf('cm.refs.concepts', { n: this.fmtNum(r.concepts) }));
        if (r.los) parts.push(this.tf('cm.refs.los', { n: this.fmtNum(r.los) }));
        if (r.quizzes) parts.push(this.tf('cm.refs.quizzes', { n: this.fmtNum(r.quizzes) }));
        return this.listFmt(parts);
      },
      refsShort(r) { return this.tf('cm.refs.linkedN', { n: this.fmtNum(r.total) }); },

      /** الأعداد الحيّة (الوحدات/الدروس من الحالة؛ المفاهيم/العناصر/الاختبارات من TC) */
      countsOf(c) {
        return {
          units: c.units.length,
          lessons: c.units.reduce((s, u) => s + u.lessons.length, 0),
          concepts: TC.CONCEPTS.filter(byCourse(c.id)).length,
          los: TC.LEARNING_OBJECTS.filter(byCourse(c.id)).length,
          quizzes: TC.QUIZZES.filter(byCourse(c.id)).length,
          students: TC.studentsOf(c.id).length,
        };
      },
      readinessOf(c) {
        const ks = TC.CONCEPTS.filter(byCourse(c.id));
        const classified = ks.filter(k => k.classified).length;
        return { classified, total: ks.length, pct: ks.length ? Math.round((classified / ks.length) * 100) : null };
      },
      get rows() {
        return this.courses.map((c) => ({
          id: c.id, c, counts: this.countsOf(c), ready: this.readinessOf(c), gradeKey: gradeKey(c),
          hay: TC.normalize([c.code, c.title.ar, c.title.en].join(' ')),
        }));
      },
      rowOf(c) { return this.rows.find(r => r.id === (c && c.id)) || null; },

      /* ---------- المؤشرات ---------- */
      get kpis() {
        const ids = new Set(this.courses.map(c => c.id));
        return {
          courses: this.courses.length,
          units: this.courses.reduce((s, c) => s + c.units.length, 0),
          lessons: this.courses.reduce((s, c) => s + c.units.reduce((a, u) => a + u.lessons.length, 0), 0),
          unclassified: TC.CONCEPTS.filter(k => ids.has(k.courseId) && !k.classified).length,
        };
      },

      /* ---------- الفلاتر والفرز والترقيم ---------- */
      search: '', fGrade: 'all', fSubject: 'all',
      sortKey: DEFAULT_SORT, sortDir: DEFAULT_DIR[DEFAULT_SORT], page: 1, pageSize: PAGE_SIZE,
      viewMode: 'table',
      liveMsg: '',

      get gradeOptions() {
        const seen = new Map();
        this.courses.slice().sort((a, b) => gradeNum(a) - gradeNum(b)).forEach(c => { if (!seen.has(gradeKey(c))) seen.set(gradeKey(c), this.loc(c.grade)); });
        return [{ value: 'all', label: this.t('cm.gradeAll') }, ...[...seen].map(([value, label]) => ({ value, label }))];
      },
      get subjectOptions() {
        const keys = [...new Set(this.courses.map(c => c.subject))];
        return [{ value: 'all', label: this.t('cm.subjectAll') }, ...keys.map(k => ({ value: k, label: this.loc(TC.SUBJECTS[k]) }))];
      },
      setGrade(v) { this.fGrade = v; this.onFilterChange(); },
      setSubject(v) { this.fSubject = v; this.onFilterChange(); },
      get hasFilters() { return !!this.search.trim() || this.fGrade !== 'all' || this.fSubject !== 'all'; },
      resetFilters() { this.search = ''; this.fGrade = 'all'; this.fSubject = 'all'; this.onFilterChange(); },

      get filtered() {
        const terms = TC.normalize(this.search).split(' ').filter(Boolean);
        return this.rows.filter(r =>
          (this.fGrade === 'all' || r.gradeKey === this.fGrade) &&
          (this.fSubject === 'all' || r.c.subject === this.fSubject) &&
          terms.every(w => r.hay.includes(w)));
      },
      get sorted() {
        const k = this.sortKey, dir = this.sortDir === 'asc' ? 1 : -1;
        const coll = new Intl.Collator(intlLoc(this.locale), { numeric: true, sensitivity: 'base' });
        const val = (r) => k === 'title' ? this.title(r.c) : k === 'grade' ? gradeNum(r.c) : k === 'lessons' ? r.counts.lessons : (r.ready.pct ?? -1);
        return this.filtered.slice().sort((a, b) => {
          const va = val(a), vb = val(b);
          const c = typeof va === 'string' ? coll.compare(va, vb) : va - vb;
          return c * dir || coll.compare(this.title(a.c), this.title(b.c));
        });
      },
      get pageCount() { return Math.max(1, Math.ceil(this.filtered.length / this.pageSize)); },
      get curPage() { return Math.min(Math.max(1, this.page), this.pageCount); },
      get paged() { const s = (this.curPage - 1) * this.pageSize; return this.sorted.slice(s, s + this.pageSize); },
      get pageNumbers() { return Array.from({ length: this.pageCount }, (_, i) => i + 1); },
      get rangeText() {
        const n = this.filtered.length;
        const a = n ? (this.curPage - 1) * this.pageSize + 1 : 0;
        const b = Math.min(n, this.curPage * this.pageSize);
        return this.tf('cm.range', { a: this.fmtNum(a), b: this.fmtNum(b), n: this.fmtNum(n) });
      },
      goPage(p) { this.page = Math.min(Math.max(1, p), this.pageCount); this.syncUrl(); },
      sortBy(k) {
        if (!SORT_KEYS.includes(k)) return;
        if (this.sortKey === k) this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
        else { this.sortKey = k; this.sortDir = DEFAULT_DIR[k]; }
        this.page = 1; this.syncUrl();
        this.liveMsg = this.tf('cm.liveSorted', { col: this.t('cm.col.' + k), dir: this.t(this.sortDir === 'asc' ? 'cm.sortAsc' : 'cm.sortDesc') });
      },
      ariaSort(k) { return this.sortKey === k ? (this.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'; },
      sortIcon(k) { return this.sortKey !== k ? 'fa-sort text-muted' : (this.sortDir === 'asc' ? 'fa-sort-up text-brand' : 'fa-sort-down text-brand'); },
      setView(v) {
        if (!VIEWS.includes(v)) return;
        this.viewMode = v;
        try { localStorage.setItem('firob-cm-view', v); } catch (e) {}
        this.liveMsg = this.tf('cm.viewNow', { view: this.t(v === 'table' ? 'cm.viewTable' : 'cm.viewGrid') });
      },
      onFilterChange() { this.page = 1; this.syncUrl(); this.announce(); },
      announce() { this.liveMsg = this.tf('cm.liveCount', { n: this.fmtNum(this.filtered.length) }); },

      /* ---------- مزامنة الرابط ---------- */
      readUrl() {
        let p;
        try { p = new URLSearchParams(location.search || ''); } catch (e) { return null; }
        const q = p.get('q'); if (q) this.search = q.slice(0, 100);
        const g = p.get('grade'); if (g && this.gradeOptions.some(o => o.value === g)) this.fGrade = g;
        const s = p.get('subject'); if (s && this.subjectOptions.some(o => o.value === s)) this.fSubject = s;
        const sk = p.get('sort'); if (SORT_KEYS.includes(sk)) { this.sortKey = sk; this.sortDir = DEFAULT_DIR[sk]; }
        const dir = p.get('dir'); if (dir === 'asc' || dir === 'desc') this.sortDir = dir;
        const pg = parseInt(p.get('page'), 10); if (pg > 0) this.page = pg;
        this.page = this.curPage;
        return p.get('course');
      },
      urlQuery() {
        const p = new URLSearchParams();
        if (this.search.trim()) p.set('q', this.search.trim());
        if (this.fGrade !== 'all') p.set('grade', this.fGrade);
        if (this.fSubject !== 'all') p.set('subject', this.fSubject);
        if (this.sortKey !== DEFAULT_SORT || this.sortDir !== DEFAULT_DIR[DEFAULT_SORT]) { p.set('sort', this.sortKey); p.set('dir', this.sortDir); }
        if (this.curPage > 1) p.set('page', String(this.curPage));
        if (this.panelOpen && this.panelId) p.set('course', this.panelId);
        return p.toString();
      },
      syncUrl() {
        const qs = this.urlQuery();
        try { history.replaceState(history.state ?? null, '', location.pathname + (qs ? '?' + qs : '')); } catch (e) {}
      },

      /* ---------- عرض المقرر ---------- */
      title(c) { return this.loc(c.title); },
      altTitle(c) { return TC.loc(c.title, this.otherLocale); },
      subjectLabel(c) { return this.loc(TC.SUBJECTS[c.subject]); },
      tone(c) { return COURSE_TONE[c && c.color] || COURSE_TONE.primary; },
      readyTone(r) {
        const p = r.ready.pct;
        if (p == null) return { text: 'text-muted', bar: 'bg-line', icon: 'fa-circle-minus' };
        if (p >= 100) return { text: 'text-success-700 dark:text-success-500', bar: 'bg-success-500', icon: 'fa-circle-check' };
        if (p >= 70) return { text: 'text-brand', bar: 'bg-primary-500', icon: 'fa-circle-half-stroke' };
        return { text: 'text-warning-700 dark:text-warning-500', bar: 'bg-warning-500', icon: 'fa-triangle-exclamation' };
      },
      readyText(r) {
        return r.ready.total ? this.tf('cm.readyText', { c: this.fmtNum(r.ready.classified), t: this.fmtNum(r.ready.total) }) : this.t('cm.readyNone');
      },
      readyValueText(r) {
        return r.ready.total
          ? this.tf('cm.readyValue', { p: this.fmtPct(r.ready.pct), c: this.fmtNum(r.ready.classified), t: this.fmtNum(r.ready.total) })
          : this.t('cm.readyValueNone');
      },
      conceptsHref(c) { return 'concepts.html?course=' + encodeURIComponent(c.id); },
      losHref(c) { return 'learning-objects.html?course=' + encodeURIComponent(c.id); },
      quizzesHref(c) { return 'quizzes.html?course=' + encodeURIComponent(c.id); },
      resultsHref(c) { return 'quiz-results.html?course=' + encodeURIComponent(c.id); },
      /** رابط النتائج يظهر فقط إن كان لاختبارات المقرر محاولات */
      hasAttempts(c) { const id = c && c.id; return TC.QUIZZES.some(q => q.courseId === id && TC.attemptsOf(q.code).length > 0); },

      /* ---------- لوحة المقرر (حوار جانبي) ---------- */
      panelOpen: false, panelId: null, busy: false, _opener: null, _clearTimer: null,
      openUnits: {},
      get panelCourse() { return this.panelId ? this.courses.find(c => c.id === this.panelId) || null : null; },
      get panelRow() { return this.panelCourse ? this.rowOf(this.panelCourse) : null; },
      openPanel(id, ev) {
        const c = this.courses.find(x => x.id === id || x.code === id);
        if (!c) return false;
        this._opener = (ev && ev.currentTarget) || null;
        clearTimeout(this._clearTimer);
        this.panelId = c.id;
        this.form = null;
        if (c.units[0] && this.openUnits[c.units[0].id] === undefined) this.openUnits = Object.assign({}, this.openUnits, { [c.units[0].id]: true });
        this.panelOpen = true;
        this.syncUrl();
        return true;
      },
      closePanel() {
        if (!this.panelOpen || this.busy) return false;
        this.form = null;
        this.finalizeUndo();
        this.panelOpen = false;
        this.syncUrl();
        const opener = this._opener; this._opener = null;
        this.$nextTick(() => {
          try { if (opener && opener.isConnected !== false && opener.focus) opener.focus(); else focusId('main'); } catch (e) {}
        });
        // تفريغ المحتوى بعد انتهاء انتقال الإغلاق فقط
        this._clearTimer = setTimeout(() => { if (!this.panelOpen) this.panelId = null; }, 320);
        return true;
      },
      isUnitOpen(id) { return !!this.openUnits[id]; },
      toggleUnit(id) { this.openUnits = Object.assign({}, this.openUnits, { [id]: !this.openUnits[id] }); },
      findUnit(unitId) { const c = this.panelCourse; return (c && c.units.find(u => u.id === unitId)) || null; },

      /* ---------- النموذج المضمّن (إضافة / إعادة تسمية) ---------- */
      form: null,
      formAt(mode, unitId = null, lessonId = null) {
        const f = this.form;
        return !!f && f.mode === mode && (unitId == null || f.unitId === unitId) && (lessonId == null || f.lessonId === lessonId);
      },
      openForm(f) {
        this.finalizeUndo();
        this.form = Object.assign({ unitId: null, lessonId: null, ar: '', en: '', submitted: false, errors: { ar: '', en: '' }, returnTo: null }, f);
        this.$nextTick(() => focusId('tf-ar'));
        return this.form;
      },
      startAddUnit() { return this.openForm({ mode: 'addUnit', returnTo: 'cp-add-unit-btn' }); },
      startAddLesson(u) {
        if (!this.isUnitOpen(u.id)) this.toggleUnit(u.id);
        return this.openForm({ mode: 'addLesson', unitId: u.id, returnTo: 'add-l-' + u.id });
      },
      startRenameUnit(u) { return this.openForm({ mode: 'renameUnit', unitId: u.id, ar: u.title.ar, en: u.title.en, returnTo: 'ut-' + u.id }); },
      startRenameLesson(u, l) { return this.openForm({ mode: 'renameLesson', unitId: u.id, lessonId: l.id, ar: l.title.ar, en: l.title.en, returnTo: 'lt-' + l.id }); },
      get formTitle() {
        const f = this.form; if (!f) return '';
        if (f.mode === 'addLesson') { const u = this.findUnit(f.unitId); return this.tf('cm.form.addLesson', { unit: u ? this.loc(u.title) : '' }); }
        return this.t('cm.form.' + f.mode);
      },
      get formSubmitLabel() { return this.form && this.form.mode.startsWith('add') ? this.t('cm.form.add') : this.t('cm.form.save'); },
      get formErrorCount() { const f = this.form; return f && f.submitted ? (f.errors.ar ? 1 : 0) + (f.errors.en ? 1 : 0) : 0; },
      errText(key) { return key ? this.tf(key, { n: this.fmtNum(MAX_TITLE) }) : ''; },
      cancelEdit() {
        const f = this.form; if (!f) return false;
        this.form = null;
        this.liveMsg = this.t('cm.msg.editCancelled');
        this.$nextTick(() => focusId(f.returnTo));
        return true;
      },
      /** يتحقق من الحقلين: مطلوبان، بحد أقصى للطول، وفريدان داخل الأب (بعد التطبيع) */
      validate() {
        const f = this.form; if (!f) return false;
        const ar = String(f.ar || '').trim(), en = String(f.en || '').trim();
        const errors = { ar: '', en: '' };
        if (!ar) errors.ar = 'cm.err.arRequired'; else if (ar.length > MAX_TITLE) errors.ar = 'cm.err.tooLong';
        if (!en) errors.en = 'cm.err.enRequired'; else if (en.length > MAX_TITLE) errors.en = 'cm.err.tooLong';
        const isUnit = f.mode === 'addUnit' || f.mode === 'renameUnit';
        const c = this.panelCourse;
        const unit = isUnit ? null : this.findUnit(f.unitId);
        const siblings = isUnit ? (c ? c.units.filter(u => u.id !== f.unitId) : []) : (unit ? unit.lessons.filter(l => l.id !== f.lessonId) : []);
        const dup = isUnit ? 'cm.err.dupUnit' : 'cm.err.dupLesson';
        if (!errors.ar && siblings.some(s => TC.normalize(s.title.ar) === TC.normalize(ar))) errors.ar = dup;
        if (!errors.en && siblings.some(s => TC.normalize(s.title.en) === TC.normalize(en))) errors.en = dup;
        f.errors = errors;
        return !errors.ar && !errors.en;
      },
      saveEdit() {
        const f = this.form; if (!f || this.busy) return null;
        f.submitted = true;
        if (!this.validate()) {
          this.liveMsg = this.tf('cm.form.summary', { n: this.fmtNum(this.formErrorCount) });
          this.$nextTick(() => focusId(f.errors.ar ? 'tf-ar' : 'tf-en'));
          return null;
        }
        const c = this.panelCourse; if (!c) return null;
        const nt = { ar: f.ar.trim(), en: f.en.trim() };
        let msg = '', target = null, focus = null;
        if (f.mode === 'addUnit') {
          target = { id: TC.uid('U'), title: nt, lessons: [] };
          c.units.push(target);
          this.openUnits = Object.assign({}, this.openUnits, { [target.id]: true });
          msg = this.tf('cm.msg.unitAdded', { title: this.loc(nt), course: this.title(c) }); focus = 'ut-' + target.id;
        } else if (f.mode === 'addLesson') {
          const u = this.findUnit(f.unitId); if (!u) return null;
          target = { id: TC.uid('L'), title: nt };
          u.lessons.push(target);
          msg = this.tf('cm.msg.lessonAdded', { title: this.loc(nt), unit: this.loc(u.title) }); focus = 'lt-' + target.id;
        } else if (f.mode === 'renameUnit') {
          target = this.findUnit(f.unitId); if (!target) return null;
          target.title = nt;
          msg = this.tf('cm.msg.unitRenamed', { title: this.loc(nt) }); focus = 'ut-' + target.id;
        } else if (f.mode === 'renameLesson') {
          const u = this.findUnit(f.unitId); target = u && u.lessons.find(l => l.id === f.lessonId); if (!target) return null;
          target.title = nt;
          msg = this.tf('cm.msg.lessonRenamed', { title: this.loc(nt) }); focus = 'lt-' + target.id;
        }
        this.form = null;
        this.liveMsg = msg; this.toast(msg);
        this.$nextTick(() => focusId(focus));
        return target;
      },

      /* ---------- إعادة الترتيب (أزرار + Alt+↑/↓) مع إعلان ---------- */
      moveIn(list, id, dir, btnPrefix) {
        if (this.form) return false;
        const i = list.findIndex(x => x.id === id); if (i < 0) return false;
        const name = this.loc(list[i].title);
        const j = i + dir;
        if (j < 0 || j >= list.length) {
          this.liveMsg = this.tf(dir < 0 ? 'cm.msg.alreadyFirst' : 'cm.msg.alreadyLast', { title: name });
          return false;
        }
        const [it] = list.splice(i, 1);
        list.splice(j, 0, it);
        this.liveMsg = this.tf('cm.msg.moved', { title: name, pos: this.fmtNum(j + 1), n: this.fmtNum(list.length) });
        this.$nextTick(() => focusId(btnPrefix + id + (dir < 0 ? '-up' : '-down')));
        return true;
      },
      moveUnit(unitId, dir) { const c = this.panelCourse; return c ? this.moveIn(c.units, unitId, dir, 'mv-u-') : false; },
      moveLesson(unitId, lessonId, dir) { const u = this.findUnit(unitId); return u ? this.moveIn(u.lessons, lessonId, dir, 'mv-l-') : false; },

      /* ---------- الحذف (فقط بلا مراجع) + تراجع خلال 6 ثوانٍ ---------- */
      canDeleteUnit(u) { return this.unitRefs(u).total === 0; },
      canDeleteLesson(l) { return this.lessonRefs(l).total === 0; },
      delUnitLabel(u) {
        const title = this.loc(u.title);
        if (!this.canDeleteUnit(u)) return this.tf('cm.act.deleteBlockedFor', { title, refs: this.refsLong(this.unitRefs(u)) });
        return u.lessons.length ? this.tf('cm.act.deleteUnitLessonsFor', { title, n: this.fmtNum(u.lessons.length) }) : this.tf('cm.act.deleteFor', { title });
      },
      delUnitTip(u) { return this.canDeleteUnit(u) ? this.t('cm.act.delete') : this.tf('cm.act.deleteBlockedTip', { refs: this.refsLong(this.unitRefs(u)) }); },
      delLessonLabel(l) {
        const title = this.loc(l.title);
        return this.canDeleteLesson(l) ? this.tf('cm.act.deleteFor', { title }) : this.tf('cm.act.deleteBlockedFor', { title, refs: this.refsLong(this.lessonRefs(l)) });
      },
      delLessonTip(l) { return this.canDeleteLesson(l) ? this.t('cm.act.delete') : this.tf('cm.act.deleteBlockedTip', { refs: this.refsLong(this.lessonRefs(l)) }); },
      undo: null, _undoTimer: null,
      deleteUnit(unitId) {
        const c = this.panelCourse; if (!c) return false;
        const idx = c.units.findIndex(u => u.id === unitId); if (idx < 0) return false;
        const u = c.units[idx];
        if (!this.canDeleteUnit(u)) { this.explain(this.delUnitLabel(u)); return false; }
        this.finalizeUndo(); this.form = null;
        c.units.splice(idx, 1);
        return this.startUndo({ kind: 'unit', courseId: c.id, unitId: null, item: u, idx });
      },
      deleteLesson(unitId, lessonId) {
        const u = this.findUnit(unitId); if (!u) return false;
        const idx = u.lessons.findIndex(l => l.id === lessonId); if (idx < 0) return false;
        const l = u.lessons[idx];
        if (!this.canDeleteLesson(l)) { this.explain(this.delLessonLabel(l)); return false; }
        this.finalizeUndo(); this.form = null;
        u.lessons.splice(idx, 1);
        return this.startUndo({ kind: 'lesson', courseId: this.panelId, unitId, item: l, idx });
      },
      startUndo(entry) {
        this.undo = entry;
        this._undoTimer = setTimeout(() => this.finalizeUndo(), UNDO_MS);
        this.liveMsg = this.undoText;
        this.$nextTick(() => focusId('cp-undo'));
        return true;
      },
      get undoText() {
        const x = this.undo; if (!x) return '';
        const title = this.loc(x.item.title);
        if (x.kind === 'lesson') return this.tf('cm.msg.lessonDeleted', { title });
        return x.item.lessons.length ? this.tf('cm.msg.unitDeletedLessons', { title, n: this.fmtNum(x.item.lessons.length) }) : this.tf('cm.msg.unitDeleted', { title });
      },
      undoDelete() {
        const x = this.undo; if (!x) return false;
        clearTimeout(this._undoTimer); this._undoTimer = null;
        const c = this.courses.find(cc => cc.id === x.courseId);
        const list = !c ? null : x.kind === 'unit' ? c.units : (c.units.find(u => u.id === x.unitId) || {}).lessons;
        this.undo = null;
        if (!list) return false;
        list.splice(Math.min(x.idx, list.length), 0, x.item);
        this.liveMsg = this.tf('cm.msg.restored', { title: this.loc(x.item.title) });
        this.$nextTick(() => focusId((x.kind === 'unit' ? 'ut-' : 'lt-') + x.item.id));
        return true;
      },
      finalizeUndo() { clearTimeout(this._undoTimer); this._undoTimer = null; this.undo = null; },
      get undoMs() { return UNDO_MS; },

      explain(msg) { this.liveMsg = msg; this.toast(msg, 'info'); },
      toast(msg, icon = 'success') {
        if (window.Swal) Swal.fire({ toast: true, position: 'top-end', icon, titleText: msg, showConfirmButton: false, timer: 3500, customClass: { popup: 'firob-swal firob-toast' } });
      },

      /* ---------- عامة ---------- */
      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; this.wide = m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        try { const v = localStorage.getItem('firob-cm-view'); if (VIEWS.includes(v)) this.viewMode = v; } catch (e) {}
        document.title = this.t('docTitle');
        const courseParam = this.readUrl();
        if (courseParam) this.openPanel(courseParam);
        this.syncUrl();
        this.announce();
        this.$watch('search', () => this.onFilterChange());
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      closeAll() {
        this.notifOpen = false; this.profileOpen = false; this.mobileNav = false;
        if (this.form) { this.cancelEdit(); return; }
        this.closePanel();
      },
    };
  }
</script>
</body>
