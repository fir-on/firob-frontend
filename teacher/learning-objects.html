<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>مكتبة العناصر التعليمية — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* إلغاء أيقونة التفريغ الأصلية لحقول type="search" */
    input[type="search"]::-webkit-search-decoration,
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-results-button,
    input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- تلميحات أزرار الإجراءات (Action Tooltips) ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg border border-white/10 bg-slate-900/90 px-2.5 py-1 text-xs font-medium tracking-wide text-white opacity-0 shadow-xl backdrop-blur-md transition-all duration-200 ease-out;
      @apply dark:border-slate-800/20 dark:bg-slate-100 dark:text-slate-900;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-slate-900/90 opacity-0 transition-all duration-200 ease-out;
      @apply dark:border-t-slate-100;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  {@apply bg-accent-500/20 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }
    .badge-warning { @apply bg-warning-500/15 text-warning-700 dark:text-warning-500; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-line-strong; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-4 py-2.5 text-start text-sm font-medium text-ink transition-colors hover:bg-soft; }
    .combo-option.is-active   { @apply bg-soft; }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }
    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- النافذة المنبثقة / اللوحة الجانبية ---------- */
    .modal-panel { @apply relative flex max-h-[90dvh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }


    /* ---------- منطقة رفع الملفات (Dropzone) ---------- */
    .dropzone { @apply flex cursor-pointer flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-line-strong bg-field px-4 py-7 text-center transition; }
    .dropzone:hover, .dropzone.is-drag { @apply border-primary-500 bg-soft; }
    .dropzone:focus-within { box-shadow: var(--ring); }
    .dropzone[data-invalid='true'] { @apply border-error-600 bg-error-500/10; }

    /* ---------- أيقونة تنسيق الملف (Format Icon Chip) ---------- */
    .format-icon { @apply grid h-11 w-11 shrink-0 place-items-center rounded-xl text-base; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }

    /* ---------- [layout: full-height sidebar + bottom footer] ---------- */
    html, body { min-height: 100%; }
    body { margin: 0; }
    .app-col { min-height: 100vh; min-height: 100dvh; }
    @media (min-width: 1024px) {
      #sidebar { height: 100vh; height: 100dvh; }
      .app-col { margin-inline-start: 18rem; transition: margin-inline-start .3s ease; }
      .app-col.is-collapsed { margin-inline-start: 5rem; }
      .save-bar { inset-inline-start: 18rem; transition: inset-inline-start .3s ease; }
      .save-bar.is-collapsed { inset-inline-start: 5rem; }
    }
</style>

<!-- ⑥ Alpine.js (+ إضافة Focus لحصر التركيز داخل النوافذ المنبثقة) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- ⑦ SweetAlert2 -->
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5"></script>
</head>

<body x-data="learningObjects()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch.focus(); }"
      @scroll.window="notifOpen = false; profileOpen = false" @resize.window="notifOpen = false; profileOpen = false"
      :class="{ 'overflow-hidden': (mobileNav && mobile) || panelOpen || previewOpen || centralOpen }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <span class="inline-flex min-w-0 flex-1 items-center gap-3" :class="!expanded && 'lg:flex-none lg:justify-center'">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </span>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-muted" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="item.count && expanded"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent"
                        x-text="item.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="app-col flex min-w-0 flex-1 flex-col" :class="collapsed && 'is-collapsed'">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex"><bdi dir="ltr">Ctrl K</bdi></kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-haspopup="true" :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>

               x-data="selectDropdown({ id: 'lo-course', options: () => formCourseOptions, get: () => form.course, set: (v) => setFormCourse(v), placeholder: () => t('lo.form.coursePlaceholder') })"
               @click.outside="closeList()">
            <span id="lo-course-label" class="label flex items-center justify-between gap-1.5">

            </span>
            <button type="button" id="lo-course" x-ref="btn" role="combobox" aria-haspopup="listbox"
                    aria-labelledby="lo-course-label lo-course" aria-required="true" :aria-invalid="showErr('course').toString()" :aria-describedby="describedBy('course')"

              <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
            </button>
            <ul x-show="open" x-cloak x-ref="list" id="lo-course-list" role="listbox" aria-labelledby="lo-course-label"
                x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
              <template x-for="(item, idx) in items" :key="item.value">
                <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                    class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                    @click="choose(item)" @mousemove="active = idx">
                  <span class="truncate" x-text="item.label"></span>
                  <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                </li>
              </template>
            </ul>
            <p id="lo-err-course" class="err" x-show="showErr('course')" x-cloak><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="t('lo.err.course')"></span></p>
          </div>
          <div class="relative "
               x-data="selectDropdown({ id: 'lo-unit', options: () => formUnitOptions, get: () => form.unit, set: (v) => setFormUnit(v), placeholder: () => t('lo.form.notSpecified') })"
               @click.outside="closeList()">
            <span id="lo-unit-label" class="label flex items-center justify-between gap-1.5">
              <span><span x-text="t('lo.form.unit')"></span></span>
              <span class="badge badge-muted shrink-0 !px-1.5 !py-0 !text-[10px]" x-text="t('lo.form.optional')"></span>
            </span>
            <button type="button" id="lo-unit" x-ref="btn" role="combobox" aria-haspopup="listbox"
                    aria-labelledby="lo-unit-label lo-unit" :disabled="!form.course"
                    :aria-expanded="open.toString()" aria-controls="lo-unit-list"
                    :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                    class="field flex w-full items-center justify-between gap-2 px-4 py-3 text-start"
                    @click="toggleList()" @keydown="onKey($event)">
              <span class="truncate" x-text="triggerLabel"></span>
              <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
            </button>
            <ul x-show="open" x-cloak x-ref="list" id="lo-unit-list" role="listbox" aria-labelledby="lo-unit-label"
                x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
              <template x-for="(item, idx) in items" :key="item.value">
                <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                    class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                    @click="choose(item)" @mousemove="active = idx">
                  <span class="truncate" x-text="item.label"></span>
                  <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                </li>
              </template>
            </ul>
          </div>
          <div class="relative "
               x-data="selectDropdown({ id: 'lo-lesson', options: () => formLessonOptions, get: () => form.lesson, set: (v) => setFormLesson(v), placeholder: () => t('lo.form.notSpecified') })"
               @click.outside="closeList()">
            <span id="lo-lesson-label" class="label flex items-center justify-between gap-1.5">
              <span><span x-text="t('lo.form.lesson')"></span></span>
              <span class="badge badge-muted shrink-0 !px-1.5 !py-0 !text-[10px]" x-text="t('lo.form.optional')"></span>
            </span>
            <button type="button" id="lo-lesson" x-ref="btn" role="combobox" aria-haspopup="listbox"
                    aria-labelledby="lo-lesson-label lo-lesson" :disabled="!form.unit"
                    :aria-expanded="open.toString()" aria-controls="lo-lesson-list"
                    :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                    class="field flex w-full items-center justify-between gap-2 px-4 py-3 text-start"
                    @click="toggleList()" @keydown="onKey($event)">
              <span class="truncate" x-text="triggerLabel"></span>
              <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
            </button>
            <ul x-show="open" x-cloak x-ref="list" id="lo-lesson-list" role="listbox" aria-labelledby="lo-lesson-label"
                x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
              <template x-for="(item, idx) in items" :key="item.value">
                <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                    class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                    @click="choose(item)" @mousemove="active = idx">
                  <span class="truncate" x-text="item.label"></span>
                  <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>

      <div class="border-t border-line"></div>

      <!-- ================= 3. المفاهيم المرتبطة (اختيار متعدد + اقتراحات) ================= -->
      <section class="space-y-4" aria-labelledby="lo-section-concepts">
        <div class="flex items-center gap-3">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true">3</span>
          <h3 id="lo-section-concepts" class="text-base font-extrabold text-ink sm:text-lg" x-text="t('lo.form.sectionConcepts')"></h3>
        </div>

        <div class="relative"
             x-data="conceptPicker({ id: 'lo-concepts', options: () => formConceptOptions, get: () => form.concepts, set: (v) => form.concepts = v, labelOf: (id) => conceptLabel(id) })"
             @click.outside="closeList()">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span id="lo-concepts-label" class="label !mb-0"><span x-text="t('lo.form.concepts')"></span> <span class="text-danger" aria-hidden="true">*</span></span>
            <button type="button" class="btn btn-outline btn-sm shrink-0" @click="suggestConcepts()" aria-describedby="lo-ai-hint">
              <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
              <span x-text="t('lo.ai.button')"></span>
            </button>
          </div>
          <p id="lo-concepts-hint" class="hint !mt-1" x-text="form.course ? t('lo.form.conceptsHint') : t('lo.form.conceptsNeedCourse')"></p>
          <p id="lo-ai-hint" class="sr-only" x-text="t('lo.ai.hint')"></p>

          <div class="field mt-1.5 flex min-h-[2.75rem] w-full flex-wrap items-center gap-1.5 py-1.5" :class="showErr('concepts') && '!border-error-600 bg-error-500/5'">
            <template x-for="c in selected" :key="c.value">
              <span class="badge badge-primary gap-1.5 py-1">
                <span x-text="c.label"></span>
                <button type="button" class="-me-1 inline-grid h-5 w-5 shrink-0 place-items-center rounded-full hover:bg-primary-500/20 focus-visible:ring-2" @click="remove(c.value)" :aria-label="tf('lo.form.removeConcept', { name: c.label })">
                  <i class="fa-solid fa-xmark text-[10px]" aria-hidden="true"></i>
                </button>
              </span>
            </template>
            <button type="button" id="lo-concepts-btn" x-ref="btn" role="combobox" aria-haspopup="listbox" aria-controls="lo-concepts-list"
                    aria-labelledby="lo-concepts-label lo-concepts-btn" aria-required="true"
                    :aria-expanded="open.toString()" :aria-activedescendant="open && active > -1 && available[active] ? optId(available[active]) : null"
                    :aria-invalid="showErr('concepts').toString()" :aria-describedby="describedBy('concepts', 'lo-concepts-hint')" :disabled="!form.course"
                    class="inline-flex shrink-0 items-center gap-1.5 rounded-lg px-2 py-1 text-xs font-bold text-brand transition hover:bg-soft focus-visible:ring-2 disabled:cursor-not-allowed disabled:text-muted"
                    @click="toggleList()" @keydown="onKey($event)">
              <i class="fa-solid fa-plus" aria-hidden="true"></i> <span x-text="t('lo.form.conceptsAdd')"></span>
            </button>
          </div>

          <ul x-show="open" x-cloak x-ref="list" id="lo-concepts-list" role="listbox" aria-labelledby="lo-concepts-label" aria-multiselectable="true"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in available" :key="item.value">
              <li :id="optId(item)" role="option" aria-selected="false" class="combo-option" :class="idx === active && 'is-active'" @click="add(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-plus shrink-0 text-xs text-brand" aria-hidden="true"></i>
              </li>
            </template>
            <li x-show="!available.length" role="presentation" class="px-4 py-2.5 text-sm text-muted" x-text="items.length ? t('lo.form.conceptsAllAdded') : t('lo.form.conceptsEmpty')"></li>
          </ul>
          <p id="lo-err-concepts" class="err" x-show="showErr('concepts')" x-cloak><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="t('lo.err.concepts')"></span></p>

          <!-- الاقتراحات -->
          <div x-show="aiSuggestions.length" x-cloak class="mt-3 rounded-xl border border-dashed border-primary-500/40 bg-primary-500/5 p-3">
            <p class="mb-2 flex items-center gap-1.5 text-xs font-extrabold text-brand"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> <span x-text="t('lo.ai.title')"></span></p>
            <div class="flex flex-wrap gap-1.5">
              <template x-for="id in aiSuggestions" :key="id">
                <button type="button" class="badge badge-accent gap-1.5 transition hover:brightness-95 focus-visible:ring-2" @click="acceptSuggestion(id)" :aria-label="tf('lo.ai.add', { name: conceptLabel(id) })">
                  <i class="fa-solid fa-plus text-[10px]" aria-hidden="true"></i> <span x-text="conceptLabel(id)"></span>
                </button>
              </template>
            </div>
          </div>
        </div>
      </section>

      <div class="border-t border-line"></div>

      <!-- ================= 4. الملفات (تحقق من الامتداد والحجم) ================= -->
      <section class="space-y-4" aria-labelledby="lo-section-files">
        <div class="flex items-center gap-3">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true">4</span>
          <h3 id="lo-section-files" class="text-base font-extrabold text-ink sm:text-lg" x-text="t('lo.form.sectionFiles')"></h3>
        </div>

        <div>
          <p class="label"><span x-text="t('lo.form.filesLabel')"></span> <span class="text-danger" aria-hidden="true">*</span></p>
          <p id="lo-file-hint" class="hint !mt-0 mb-2" x-text="filesHint"></p>

          <ul class="mb-3 grid grid-cols-1 gap-2 sm:grid-cols-2" x-show="form.files.length" role="list">
            <template x-for="f in form.files" :key="f.id">
              <li class="flex items-center gap-3 rounded-xl border p-3" :class="fileIssue(f) ? 'border-error-600 bg-error-500/5' : 'border-line'">
                <span class="format-icon shrink-0 bg-line text-muted" aria-hidden="true"><i class="fa-solid fa-file"></i></span>
                <div class="min-w-0 flex-1">
                  <p class="truncate text-sm font-bold text-ink"><bdi dir="auto" x-text="f.name"></bdi></p>
                  <div class="mt-1 flex flex-wrap items-center gap-2">
                    <span class="badge badge-muted" x-text="f.existing ? t('lo.form.currentFile') : t('lo.form.newFile')"></span>
                    <span class="text-xs text-muted tabular-nums" x-text="fmtBytes(f.size)"></span>
                  </div>
                  <p class="err !mt-1" x-show="fileIssue(f)"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="fileIssue(f)"></span></p>
                </div>
                <button type="button" class="act shrink-0 !text-danger hover:!bg-error-500/10" @click="removeFile(f.id)" :aria-label="tf('lo.form.removeFile', { name: f.name })">
                  <i class="fa-solid fa-trash" aria-hidden="true"></i>
                </button>
              </li>
            </template>
          </ul>

          <p x-show="!form.files.length" class="mb-3 rounded-xl border border-dashed border-line-strong bg-page/50 p-4 text-center text-xs text-muted" x-text="t('lo.form.noFilesYet')"></p>

          <label for="lo-file" class="dropzone" :class="dragOver && 'is-drag'" :data-invalid="showErr('files').toString()"
                 @dragover.prevent="dragOver = true" @dragleave.prevent="dragOver = false" @drop.prevent="onFileDrop($event)">
            <i class="fa-solid fa-cloud-arrow-up text-2xl text-muted" aria-hidden="true"></i>
            <span class="text-sm font-bold text-ink" x-text="form.files.length ? t('lo.form.addMore') : t('lo.form.dropHint')"></span>
            <input id="lo-file" type="file" multiple :accept="acceptAttr" class="sr-only" @change="onFileChange($event)"
                   :aria-invalid="showErr('files').toString()"
                   :aria-describedby="[describedBy('files', 'lo-file-hint'), fileRejects.length ? 'lo-file-rejects' : null].filter(Boolean).join(' ')">
          </label>
          <p id="lo-err-files" class="err" x-show="showErr('files')" x-cloak><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="formErrors.files ? t(formErrors.files) : ''"></span></p>

          <div id="lo-file-rejects" x-show="fileRejects.length" x-cloak role="alert"
               class="mt-2 rounded-xl border border-error-500/40 bg-error-500/10 p-3 text-xs font-bold text-error-700 dark:text-red-300">
            <p x-text="t('lo.file.rejectedTitle')"></p>
            <ul class="mt-1 list-disc space-y-0.5 ps-5" role="list">
              <template x-for="(x, i) in fileRejects" :key="i">
                <li x-text="fileRejectText(x)"></li>
              </template>
            </ul>
          </div>
        </div>
      </section>

      <div class="border-t border-line"></div>

      <!-- ================= نطاق الظهور (خاص / المؤسسة؛ المركزي بطلب منفصل) ================= -->
      <fieldset x-show="['private', 'tenant'].includes(form.visibility)" class="space-y-2">
        <legend class="label" x-text="t('lo.form.visibility')"></legend>
        <div class="grid grid-cols-1 gap-2 sm:grid-cols-2">
          <label class="flex cursor-pointer items-start gap-3 rounded-xl border p-3.5 transition" :class="form.visibility === 'private' ? 'border-primary-500 bg-soft' : 'border-line hover:bg-soft/60'">
            <input type="radio" name="lo-visibility" value="private" x-model="form.visibility" class="mt-1 h-4 w-4 accent-primary-600">
            <span class="flex items-center gap-2 text-sm font-bold text-ink"><i class="fa-solid fa-lock text-muted" aria-hidden="true"></i><span x-text="t('lo.form.visPrivate')"></span></span>
          </label>
          <label class="flex cursor-pointer items-start gap-3 rounded-xl border p-3.5 transition" :class="form.visibility === 'tenant' ? 'border-primary-500 bg-soft' : 'border-line hover:bg-soft/60'">
            <input type="radio" name="lo-visibility" value="tenant" x-model="form.visibility" class="mt-1 h-4 w-4 accent-primary-600">
            <span class="flex items-center gap-2 text-sm font-bold text-ink"><i class="fa-solid fa-building-columns text-muted" aria-hidden="true"></i><span x-text="t('lo.form.visTenant')"></span></span>
          </label>
        </div>
        <p class="hint" x-text="t('lo.form.visCentralNote')"></p>
      </fieldset>
      <p x-show="!['private', 'tenant'].includes(form.visibility)" x-cloak class="rounded-xl border border-line bg-page/50 p-4 text-sm text-muted"
         x-text="tf('lo.form.visLocked', { vis: t('lo.vis.' + form.visibility) })"></p>
    </div>

    <footer class="flex shrink-0 items-center justify-end gap-3 border-t border-line bg-page/40 p-4">
      <button type="button" class="btn btn-outline" :disabled="busy" @click="closePanel()" x-text="t('lo.form.cancel')"></button>
      <button type="submit" class="btn btn-primary" :disabled="busy" :aria-busy="busy.toString()">
        <i class="fa-solid fa-circle-notch animate-spin" x-show="busy" aria-hidden="true"></i>
        <span x-text="busy ? t('lo.form.saving') : t('lo.form.save')"></span>
      </button>
    </footer>
  </form>
</div>

<!-- ==========================================================================
     نافذة — معاينة العنصر التعليمي (ملخص البيانات الوصفية)
     ========================================================================== -->
<div x-cloak x-show="previewOpen" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4"
     @keydown.escape.stop="closePreview()">
  <div class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closePreview()" aria-hidden="true"></div>
  <div x-show="previewOpen" x-trap.noscroll="previewOpen" role="dialog" aria-modal="true" aria-labelledby="pm-title" aria-describedby="pm-sub"
       x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition duration-150 ease-in" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
       class="modal-panel max-w-2xl">
    <header class="flex shrink-0 items-start justify-between gap-3 border-b border-line bg-soft p-5">
      <div class="min-w-0">
        <h2 id="pm-title" class="text-lg font-extrabold text-ink" x-text="t('lo.preview.title')"></h2>
        <p id="pm-sub" class="text-sm font-bold text-muted" x-text="previewRow ? title(previewRow) : ''"></p>
      </div>
      <button type="button" class="icon-btn shrink-0" @click="closePreview()" :aria-label="t('lo.preview.close')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </header>
    <div class="min-h-0 flex-1 overflow-y-auto">
      <template x-if="previewRow">
        <div class="space-y-4 p-5">
          <div class="flex items-start gap-3">
            <span class="format-icon" :class="typeMeta(previewRow).tone" aria-hidden="true"><i class="fa-solid" :class="typeMeta(previewRow).icon"></i></span>
            <div class="min-w-0 flex-1 text-start">
              <p class="text-lg font-extrabold leading-7" x-text="title(previewRow)"></p>
              <p class="text-sm text-muted" x-text="previewRow.o.title[locale === 'ar' ? 'en' : 'ar']" :lang="locale === 'ar' ? 'en' : 'ar'" :dir="locale === 'ar' ? 'ltr' : 'rtl'"></p>

      dark: document.documentElement.classList.contains('dark'),
      locale: document.documentElement.lang === 'en' ? 'en' : 'ar',
      mobile: !desktopMQ.matches,
      wide: desktopMQ.matches,
      mobileNav: false,
      collapsed: false,
      notifOpen: false, profileOpen: false,
      active: 'learningObjects',
      teacher: TC.TEACHER,
      get expanded() { return this.mobile || !this.collapsed; },

      /* ---------- الترجمة والتنسيق ---------- */
      t(path) {
        const dict = I18N[this.locale];
        return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), dict) ?? path;
      },
      tf(path, vars) {
        let s = this.t(path);
        Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
        return s;
      },
      plural(path, n) {
        const forms = this.t(path);
        if (!forms || typeof forms !== 'object') return path;
        let cat = 'other';
        try { cat = n === 0 && forms.zero ? 'zero' : new Intl.PluralRules(this.locale === 'en' ? 'en' : 'ar').select(n); } catch (e) {}
        return String(forms[cat] ?? forms.other).split('{n}').join(this.fmtNum(n));
      },
      loc(o) { return TC.loc(o, this.locale); },
      fmtNum(n, opts) { return TC.fmtNum(n, this.locale, opts); },
      fmtBytes(b) { return TC.fmtBytes(b, this.locale); },
      fmtDate(iso) { return TC.fmtDate(iso, this.locale); },
      relTime(iso) { return TC.relTime(iso, this.locale); },
      listFmt(arr, type = 'conjunction') { try { return new Intl.ListFormat(this.locale === 'en' ? 'en' : 'ar', { type }).format(arr); } catch (e) { return arr.join(', '); } },
      setLocale(loc) {
        this.locale = loc;
        document.documentElement.lang = loc;
        document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
        document.title = this.t('docTitle');
        try { localStorage.setItem('firob-locale', loc); } catch (e) {}
      },
      toggleLocale() { this.setLocale(this.locale === 'ar' ? 'en' : 'ar'); },

      /* ---------- التنقل (بوابة المعلم) ---------- */
      nav: [
        { group: 'main', items: [
          { key: 'teacherDashboard', icon: 'fa-solid fa-gauge-high', href: 'teacher-dashboard.html' },
        ]},
        { group: 'teaching', items: [
          { key: 'myCourses', icon: 'fa-solid fa-book-open', href: 'CoursesManagement.html' },
          { key: 'conceptsTree', icon: 'fa-solid fa-diagram-project', href: 'concepts.html' },
        ]},
        { group: 'assessment', items: [
          { key: 'quizBank', icon: 'fa-solid fa-list-check', href: 'quizzes.html' },
          { key: 'learningObjects', icon: 'fa-solid fa-cubes', href: 'learning-objects.html' },
          { key: 'aiStudio', icon: 'fa-solid fa-wand-magic-sparkles', href: 'ai-generator.html' },
        ]},
        { group: 'grading', items: [
          { key: 'reviewQueue', icon: 'fa-solid fa-clipboard-check', href: 'ReviewQueue.html', count: TC.REVIEW_ITEMS.filter(x => x.status === 'pending').length },
          { key: 'studentResults', icon: 'fa-solid fa-chart-line', href: 'quiz-results.html', count: TC.ATTEMPTS.filter(a => a.status === 'pending_grading').length },
        ]},
      ],
      setActive(key) { this.active = key; this.mobileNav = false; },

      /* ---------- الإشعارات (مشتقة من طلبات المراجعة في TC) ---------- */
      notifications: [
        lastRejected && { id: 1, key: 'loRejected', at: pastIso(lastRejected.decidedAt), read: false, icon: 'fa-solid fa-circle-xmark', tone: 'bg-error-500/15 text-error-700 dark:text-red-300',
          vars: (l) => ({ title: TC.loc(lastRejected.title, l) }) },
        pendingLo.length && { id: 2, key: 'loPending', at: pastIso(pendingLo[0].submittedAt), read: false, icon: 'fa-solid fa-hourglass-half', tone: 'bg-accent-500/20 text-yellow-900 dark:text-accent-500',
          vars: (l) => ({ n: TC.fmtNum(pendingLo.length, l) }) },
        lastApproved && { id: 3, key: 'loApproved', at: pastIso(lastApproved.decidedAt), read: true, icon: 'fa-solid fa-circle-check', tone: 'bg-success-500/15 text-success-700 dark:text-success-500',
          vars: (l) => ({ title: TC.loc(lastApproved.title, l) }) },
      ].filter(Boolean),
      get unread() { return this.notifications.filter(n => !n.read).length; },
      notifText(n) { return this.tf('notif.' + n.key, n.vars(this.locale)); },

      /* ---------- البيانات القابلة للتعديل (نسخ عميقة من TC) ---------- */
      items: TC.clone(TC.LEARNING_OBJECTS),
      reviews: TC.clone(TC.REVIEW_ITEMS),

      decorate(o) {
        const course = TC.course(o.courseId);
        const unit = o.unitId ? TC.unit(o.courseId, o.unitId) : null;
        const lesson = o.lessonId && o.unitId ? TC.lesson(o.courseId, o.unitId, o.lessonId) : null;
        return {
          id: o.id, code: o.code, o, course, unit, lesson,
          concepts: (o.conceptIds || []).map(id => TC.concept(id)).filter(Boolean),
          hay: TC.normalize([o.code, o.title.ar, o.title.en].join(' ')),
        };
      },
      get rows() { return this.items.map(o => this.decorate(o)); },
      rowById(id) { const o = this.items.find(x => x.id === id || x.code === id); return o ? this.decorate(o) : null; },
      findItem(id) { return this.items.find(x => x.id === id) || null; },

      /* ---------- المؤشرات (محسوبة من البيانات) ---------- */
      get kpis() {
        const xs = this.items;
        return {
          total: xs.length,
          scorm: xs.filter(o => o.type === 'scorm').length,
          interactive: xs.filter(o => ['interactive', 'h5p', 'simulation'].includes(o.type)).length,
          central: xs.filter(o => o.visibility === 'central').length,
          centralPending: xs.filter(o => o.visibility === 'central_pending').length,
        };
      },
      get ownerCounts() { return { all: this.items.length, mine: this.items.filter(o => o.owner === 'me').length, shared: this.items.filter(o => o.owner !== 'me').length }; },

      /* ---------- الفلاتر والفرز والترقيم ---------- */
      search: '', fOwner: 'all', fType: 'all', fStatus: 'all', fCourse: 'all', fUnit: 'all', fLesson: 'all',
      sortKey: DEFAULT_SORT, sortDir: DEFAULT_DIR[DEFAULT_SORT], page: 1, pageSize: PAGE_SIZE,
      liveMsg: '',

      get selectedCourse() { return this.fCourse !== 'all' ? TC.course(this.fCourse) : null; },
      get selectedUnit() { const c = this.selectedCourse; return c && this.fUnit !== 'all' ? c.units.find(u => u.id === this.fUnit) || null : null; },
      get courseOptions() { return [{ value: 'all', label: this.t('lo.filterCourseAll') }, ...TC.COURSES.map(c => ({ value: c.id, label: this.loc(c.title) }))]; },
      get unitOptions() { const c = this.selectedCourse; return [{ value: 'all', label: this.t('lo.filterUnitAll') }, ...(c ? c.units.map(u => ({ value: u.id, label: this.loc(u.title) })) : [])]; },
      get lessonOptions() { const u = this.selectedUnit; return [{ value: 'all', label: this.t('lo.filterLessonAll') }, ...(u ? u.lessons.map(l => ({ value: l.id, label: this.loc(l.title) })) : [])]; },
      get typeOptions() { return [{ value: 'all', label: this.t('lo.filterTypeAll') }, ...TYPES.map(k => ({ value: k, label: this.t('lo.type.' + k) }))]; },
      get statusOptions() { return [{ value: 'all', label: this.t('lo.filterStatusAll') }, ...STATUSES.map(k => ({ value: k, label: this.t('lo.st.' + k) }))]; },
      get sortOptions() { return ['updated_desc', 'updated_asc', 'title_asc', 'title_desc', 'size_desc', 'size_asc'].map(v => ({ value: v, label: this.t('lo.sortOptDir.' + v) })); },
      get sortValue() { return this.sortKey + '_' + this.sortDir; },
      setSortValue(v) { const i = v.lastIndexOf('_'); const k = v.slice(0, i), d = v.slice(i + 1); if (!SORT_KEYS.includes(k)) return; this.sortKey = k; this.sortDir = d === 'asc' ? 'asc' : 'desc'; this.page = 1; this.syncUrl(); this.announceSort(); },

      setOwner(v) { if (!OWNERS.includes(v)) return; this.fOwner = v; this.onFilterChange(); },
      setType(v) { this.fType = v; this.onFilterChange(); },
      setStatus(v) { this.fStatus = v; this.onFilterChange(); },
      setCourse(v) { this.fCourse = v; this.fUnit = 'all'; this.fLesson = 'all'; this.onFilterChange(); },
      setUnit(v) { this.fUnit = v; this.fLesson = 'all'; this.onFilterChange(); },
      setLesson(v) { this.fLesson = v; this.onFilterChange(); },
      get hasFilters() { return !!(this.search.trim() || this.fOwner !== 'all' || this.fType !== 'all' || this.fStatus !== 'all' || this.fCourse !== 'all'); },
      resetFilters() {
        this.search = ''; this.fOwner = 'all'; this.fType = 'all'; this.fStatus = 'all'; this.fCourse = 'all'; this.fUnit = 'all'; this.fLesson = 'all';
        this.onFilterChange();
      },

      get filtered() {
        const q = TC.normalize(this.search);
        return this.rows.filter(r => {
          const o = r.o;
          if (q && !r.hay.includes(q)) return false;
          if (this.fOwner === 'mine' && o.owner !== 'me') return false;
          if (this.fOwner === 'shared' && o.owner === 'me') return false;
          if (this.fType !== 'all' && o.type !== this.fType) return false;
          if (this.fStatus !== 'all' && o.status !== this.fStatus) return false;
          if (this.fCourse !== 'all' && o.courseId !== this.fCourse) return false;
          if (this.fUnit !== 'all' && o.unitId !== this.fUnit) return false;
          if (this.fLesson !== 'all' && o.lessonId !== this.fLesson) return false;
          return true;
        });
      },
      get sorted() {
        const k = this.sortKey, dir = this.sortDir === 'asc' ? 1 : -1;
        const coll = new Intl.Collator(this.locale === 'en' ? 'en' : 'ar', { numeric: true, sensitivity: 'base' });
        return this.filtered.slice().sort((a, b) => {
          let c = 0;
          if (k === 'title') c = coll.compare(this.loc(a.o.title), this.loc(b.o.title));
          else if (k === 'size') c = (a.o.sizeBytes || 0) - (b.o.sizeBytes || 0);
          else c = String(a.o.updatedAt).localeCompare(String(b.o.updatedAt));
          return c * dir || coll.compare(a.code, b.code);
        });
      },
      get pageCount() { return Math.max(1, Math.ceil(this.filtered.length / this.pageSize)); },
      get curPage() { return Math.min(Math.max(1, this.page), this.pageCount); },
      get paged() { const s = (this.curPage - 1) * this.pageSize; return this.sorted.slice(s, s + this.pageSize); },
      get rangeText() {
        const n = this.filtered.length;
        const a = n ? (this.curPage - 1) * this.pageSize + 1 : 0;
        const b = Math.min(n, this.curPage * this.pageSize);
        return this.tf('lo.range', { a: this.fmtNum(a), b: this.fmtNum(b), n: this.fmtNum(n) });
      },
      get pageItems() {
        const n = this.pageCount, c = this.curPage;
        if (n <= 7) return Array.from({ length: n }, (_, i) => i + 1);
        const out = [1];
        const s = Math.max(2, c - 1), e = Math.min(n - 1, c + 1);
        if (s > 2) out.push('…a');
        for (let i = s; i <= e; i++) out.push(i);
        if (e < n - 1) out.push('…b');
        out.push(n);
        return out;
      },
      goPage(p) { this.page = Math.min(Math.max(1, p), this.pageCount); this.syncUrl(); this.$nextTick(() => document.getElementById('lo-list-title')?.scrollIntoView?.({ block: 'nearest' })); },
      revealRow(id) {
        const pos = this.sorted.findIndex(r => r.id === id);
        if (pos < 0) return false;
        this.page = Math.floor(pos / this.pageSize) + 1; this.syncUrl();
        return true;
      },

      sortBy(k) {
        if (!SORT_KEYS.includes(k)) return;
        if (this.sortKey === k) this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
        else { this.sortKey = k; this.sortDir = DEFAULT_DIR[k]; }
        this.page = 1; this.syncUrl(); this.announceSort();
      },
      announceSort() { this.liveMsg = this.tf('lo.liveSorted', { col: this.t('lo.sortOpt.' + this.sortKey), dir: this.t(this.sortDir === 'asc' ? 'lo.sortAsc' : 'lo.sortDesc') }); },
      ariaSort(k) { return this.sortKey === k ? (this.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'; },
      sortIcon(k) { return this.sortKey !== k ? 'fa-sort text-muted' : (this.sortDir === 'asc' ? 'fa-sort-up text-brand' : 'fa-sort-down text-brand'); },

      onFilterChange() { this.page = 1; this.syncUrl(); this.announce(); },
      announce() { this.liveMsg = this.tf('lo.liveCount', { n: this.fmtNum(this.filtered.length) }); },

      /* ---------- مزامنة الرابط ---------- */
      readUrl() {
        let p;
        try { p = new URLSearchParams(location.search || ''); } catch (e) { return null; }
        const c = p.get('course'); const course = c && TC.COURSES.find(x => x.id === c || x.code === c);
        if (course) {
          this.fCourse = course.id;
          const u = p.get('unit'); const unit = u && course.units.find(x => x.id === u);
          if (unit) {
            this.fUnit = unit.id;
            const l = p.get('lesson'); if (l && unit.lessons.some(x => x.id === l)) this.fLesson = l;
          }
        }
        const ow = p.get('owner'); if (OWNERS.includes(ow)) this.fOwner = ow;
        const ty = p.get('type'); if (TYPES.includes(ty)) this.fType = ty;
        const st = p.get('status'); if (STATUSES.includes(st)) this.fStatus = st;
        const q = p.get('q'); if (q) this.search = q.slice(0, 100);
        const sk = p.get('sort'); if (SORT_KEYS.includes(sk)) { this.sortKey = sk; this.sortDir = DEFAULT_DIR[sk]; }
        const dir = p.get('dir'); if (dir === 'asc' || dir === 'desc') this.sortDir = dir;
        const pg = parseInt(p.get('page'), 10); if (pg > 0) this.page = pg;
        this.page = this.curPage;
        return p.get('id');
      },
      urlQuery() {
        const p = new URLSearchParams();
        if (this.search.trim()) p.set('q', this.search.trim());
        if (this.fOwner !== 'all') p.set('owner', this.fOwner);
        if (this.fCourse !== 'all') p.set('course', this.fCourse);
        if (this.fUnit !== 'all') p.set('unit', this.fUnit);
        if (this.fLesson !== 'all') p.set('lesson', this.fLesson);
        if (this.fType !== 'all') p.set('type', this.fType);
        if (this.fStatus !== 'all') p.set('status', this.fStatus);
        if (this.sortKey !== DEFAULT_SORT || this.sortDir !== DEFAULT_DIR[DEFAULT_SORT]) { p.set('sort', this.sortKey); p.set('dir', this.sortDir); }
        if (this.curPage > 1) p.set('page', String(this.curPage));
        if (this.previewOpen && this.previewId) p.set('id', this.previewId);
        return p.toString();
      },
      syncUrl() {
        const qs = this.urlQuery();
        try { history.replaceState(history.state ?? null, '', location.pathname + (qs ? '?' + qs : '')); } catch (e) {}
      },

      /* ---------- عرض الصفوف ---------- */
      title(r) { return this.loc(r.o.title); },
      typeMeta(r) {
        const o = r.o || r; const m = TYPE_META[o.type] || TYPE_META.scorm;
        const label = o.type === 'scorm' && o.scormVersion ? this.tf('lo.scormVersion', { v: o.scormVersion }) : this.t('lo.type.' + o.type);
        return Object.assign({ label }, m);
      },
      statusMeta(s) { s = typeof s === 'string' ? s : s.o.status; return Object.assign({ label: this.t('lo.st.' + s) }, STATUS_META[s] || STATUS_META.draft); },
      visMeta(v) { v = typeof v === 'string' ? v : v.o.visibility; return Object.assign({ label: this.t('lo.vis.' + v) }, VIS_META[v] || VIS_META.private); },
      rvMeta(s) { return Object.assign({ label: this.t('lo.rv.' + s) }, RV_META[s] || RV_META.pending); },
      ownerLabel(r) { return this.t(r.o.owner === 'me' ? 'lo.owner.mine' : 'lo.owner.shared'); },
      lessonLabel(r) { return r.lesson ? this.loc(r.lesson.title) : (r.unit ? this.t('lo.wholeUnit') : this.t('lo.wholeCourse')); },
      pathText(r) { return [this.loc(r.course?.title), r.unit ? this.loc(r.unit.title) : null, this.lessonLabel(r)].filter(Boolean).join(' › '); },
      conceptChips(r, max = 2) { return r.concepts.slice(0, max).map(k => ({ id: k.id, label: this.loc(k.name) })); },
      moreConcepts(r, max = 2) { return Math.max(0, r.concepts.length - max); },
      usageText(r) { return this.plural('lo.usedIn', r.o.usedIn || 0); },
      latestReview(id) { return this.reviews.filter(x => x.refId === id).sort(byDesc('submittedAt'))[0] || null; },

      /* ---------- الإجراءات: الإتاحة + السبب (aria-disabled مع شرح) ---------- */
      can(r, kind) {
        const o = r.o, mine = o.owner === 'me', title = this.title(r);
        let reason = null;
        if (kind !== 'preview' && !mine) reason = this.t('lo.why.notOwner');
        else if (kind === 'submit') reason = o.status === 'draft' ? null : this.t('lo.why.' + ({ review: 'inReview', active: 'alreadyActive', rejected: 'rejectedEditFirst' })[o.status]);
        else if (kind === 'central') reason = o.visibility === 'central' ? this.t('lo.why.alreadyCentral') : o.visibility === 'central_pending' ? this.t('lo.why.centralPending') : o.status !== 'active' ? this.t('lo.why.centralNeedsActive') : null;
        else if (kind === 'delete') reason = (o.usedIn || 0) > 0 ? this.usageText(r) : null;
        const action = this.t('lo.act.' + kind);
        return reason
          ? { ok: false, reason, tip: reason, label: this.tf('lo.act.unavailableFor', { action, title, reason }) }
          : { ok: true, reason: null, tip: action, label: this.tf('lo.act.' + kind + 'For', { title }) };
      },
      run(r, kind, ev) {
        const a = this.can(r, kind);
        if (!a.ok) { this.explain(a.label); return false; }
        if (kind === 'preview') return this.openPreview(r, ev);
        if (kind === 'edit') return this.openEdit(r, ev);
        if (kind === 'submit') return this.submitForReview(r);
        if (kind === 'central') return this.requestCentral(r, ev);
        if (kind === 'delete') return this.deleteItem(r);
        return false;
      },
      explain(msg) { this.liveMsg = msg; this.toast(msg, 'info'); },
      toast(msg, icon = 'success') {
        if (window.Swal) Swal.fire({ toast: true, position: 'top-end', icon, titleText: msg, showConfirmButton: false, timer: 3500, customClass: { popup: 'firob-swal firob-toast' } });
      },
      nextReviewId() {
        const n = this.reviews.reduce((m, x) => Math.max(m, parseInt(String(x.id).replace(/\D/g, ''), 10) || 0), 0);
        return 'REV-' + (n + 1);
      },
      addReview(o, extra = {}) {
        const rv = { id: this.nextReviewId(), kind: 'learning_object', refId: o.id, title: TC.clone(o.title), submittedAt: nowIso(), status: 'pending', reviewer: null, reason: null, decidedAt: null, ...extra };
        this.reviews.push(rv);
        return rv;
      },

      /* ---------- إرسال للمراجعة (مسودة → قيد المراجعة) ---------- */
      submitForReview(r) {
        const o = this.findItem(r.id);
        if (!o || !this.can(this.decorate(o), 'submit').ok) return false;
        o.status = 'review'; o.updatedAt = nowIso();
        const rv = this.addReview(o);
        const msg = this.tf('lo.submitted', { title: this.loc(o.title), id: rv.id });
        this.liveMsg = msg; this.toast(msg);
        return rv;
      },

      /* ---------- طلب النشر المركزي (تأكيد ← central_pending، لا نشر مباشر) ---------- */
      centralOpen: false, centralId: null,
      get centralRow() { return this.centralId ? this.rowById(this.centralId) : null; },
      requestCentral(r, ev) {
        if (!this.can(r, 'central').ok) return false;
        clearTimeout(this._centralClear);
        this._centralOpener = ev?.currentTarget || null;
        this.centralId = r.id; this.centralOpen = true;
        return true;
      },
      confirmCentral() {
        if (this.busy) return false;
        const o = this.centralId && this.findItem(this.centralId);
        if (!o || !this.can(this.decorate(o), 'central').ok) { this.closeCentral(); return false; }
        this.busy = true;
        try {
          o.visibility = 'central_pending'; o.updatedAt = nowIso();
          const rv = this.addReview(o, { scope: 'central' });
          const msg = this.tf('lo.centralRequested', { title: this.loc(o.title), id: rv.id });
          this.liveMsg = msg; this.toast(msg);
        } finally { this.busy = false; }
        this.closeCentral();
        return true;
      },
      closeCentral() {
        if (!this.centralOpen || this.busy) return;
        this.centralOpen = false;
        this.restoreFocus(this._centralOpener);
        this._centralClear = setTimeout(() => { if (!this.centralOpen) this.centralId = null; }, 220);
      },

      /* ---------- الحذف (المالك فقط، غير المستخدم) + تراجع ---------- */
      undo: null, _undoTimer: null,
      deleteItem(r) {
        if (!this.can(r, 'delete').ok) return false;
        if (this.undo) this.finalizeUndo();
        const idx = this.items.findIndex(x => x.id === r.id);
        if (idx < 0) return false;
        const [item] = this.items.splice(idx, 1);
        const msg = this.tf('lo.deleted', { title: this.loc(item.title) });
        this.undo = { item, idx, msg, at: Date.now() };
        this._undoTimer = setTimeout(() => this.finalizeUndo(), UNDO_MS);
        this.page = this.curPage; this.syncUrl();
        this.liveMsg = msg;
        this.$nextTick(() => { try { this.$refs.undoBtn?.focus(); } catch (e) {} });
        return true;
      },
      undoDelete() {
        if (!this.undo) return false;
        clearTimeout(this._undoTimer);
        const { item, idx } = this.undo;
        this.items.splice(Math.min(idx, this.items.length), 0, item);
        this.undo = null;
        this.liveMsg = this.tf('lo.undone', { title: this.loc(item.title) });
        return true;
      },
      finalizeUndo() { clearTimeout(this._undoTimer); this._undoTimer = null; this.undo = null; },
      get undoMs() { return UNDO_MS; },

      /* ---------- المعاينة (بيانات وصفية) ---------- */
      previewOpen: false, previewId: null,
      get previewRow() { return this.previewId ? this.rowById(this.previewId) : null; },
      get previewReview() { return this.previewId ? this.latestReview(this.previewId) : null; },
      openPreview(r, ev) {
        clearTimeout(this._previewClear);
        this._previewOpener = ev?.currentTarget || null;
        this.previewId = r.id; this.previewOpen = true; this.syncUrl();
        return true;
      },
      closePreview() {
        if (!this.previewOpen) return;
        this.previewOpen = false; this.syncUrl();
        this.restoreFocus(this._previewOpener);
        this._previewClear = setTimeout(() => { if (!this.previewOpen) this.previewId = null; }, 220);
      },
      restoreFocus(el) { this.$nextTick(() => { try { el && el.isConnected !== false && el.focus && el.focus(); } catch (e) {} }); },

      /* ---------- نافذة الرفع / التعديل ---------- */
      panelOpen: false, editingId: null, submitted: false, busy: false, dragOver: false,
      fileRejects: [], aiSuggestions: [],
      form: { titleAr: '', titleEn: '', type: '', course: '', unit: '', lesson: '', concepts: [], files: [], visibility: 'private' },
      blankForm() { return { titleAr: '', titleEn: '', type: '', course: '', unit: '', lesson: '', concepts: [], files: [], visibility: 'private' }; },
      get editing() { return this.editingId ? this.findItem(this.editingId) : null; },

      get formTypeOptions() { return TYPES.map(k => ({ value: k, label: this.t('lo.type.' + k) })); },
      get formCourseOptions() { return TC.COURSES.map(c => ({ value: c.id, label: this.loc(c.title) })); },
      get formUnitOptions() {
        const c = this.form.course && TC.course(this.form.course);
        return [{ value: '', label: this.t('lo.form.notSpecified') }, ...(c ? c.units.map(u => ({ value: u.id, label: this.loc(u.title) })) : [])];
      },
      get formLessonOptions() {
        const u = this.form.course && this.form.unit && TC.unit(this.form.course, this.form.unit);
        return [{ value: '', label: this.t('lo.form.notSpecified') }, ...(u ? u.lessons.map(l => ({ value: l.id, label: this.loc(l.title) })) : [])];
      },
      inScope(k) {
        const f = this.form;
        if (!f.course || k.courseId !== f.course) return false;
        if (f.unit && k.unitId !== f.unit) return false;
        if (f.lesson && k.lessonId !== f.lesson && k.lessonId) return false;
        return true;
      },
      get formConceptOptions() { return TC.CONCEPTS.filter(k => this.inScope(k)).map(k => ({ value: k.id, label: this.loc(k.name) })); },
      conceptLabel(id) { const k = TC.concept(id); return k ? this.loc(k.name) : id; },
      pruneConcepts() {
        const ok = (id) => { const k = TC.concept(id); return !!k && this.inScope(k); };
        this.form.concepts = this.form.concepts.filter(ok);
        this.aiSuggestions = this.aiSuggestions.filter(ok);
      },
      setFormType(v) { this.form.type = v; },
      setFormCourse(v) { if (this.form.course === v) return; this.form.course = v; this.form.unit = ''; this.form.lesson = ''; this.pruneConcepts(); },
      setFormUnit(v) { if (this.form.unit === v) return; this.form.unit = v; this.form.lesson = ''; this.pruneConcepts(); },
      setFormLesson(v) { this.form.lesson = v; this.pruneConcepts(); },

      typeRule(type) { const m = TYPE_META[type || this.form.type]; return m ? { exts: m.exts, maxBytes: m.maxMB * MB } : null; },
      get filesHint() {
        const r = this.typeRule();
        if (!r) return this.t('lo.form.filesHintNoType');
        return this.tf('lo.form.filesHint', { exts: this.listFmt(r.exts.map(e => '.' + e), 'disjunction'), max: this.fmtBytes(r.maxBytes) });
      },
      get acceptAttr() { const r = this.typeRule(); return r ? r.exts.map(e => '.' + e).join(',') : '.zip,.html,.htm,.mp4,.webm,.pdf'; },
      fileIssue(f) {
        const r = this.typeRule();
        if (!r) return null;
        if (!r.exts.includes(f.ext)) return this.t('lo.file.badExtShort');
        if (!f.existing && f.size > r.maxBytes) return this.tf('lo.file.tooBig', { name: f.name, size: this.fmtBytes(f.size), max: this.fmtBytes(r.maxBytes) });
        return null;
      },
      fileRejectText(x) { return this.tf('lo.file.' + x.key, x.vars); },
      /** يتحقق من كل ملف (اختيار أو سحب وإفلات) مقابل امتدادات النوع وحده الأقصى للحجم */
      addFiles(list) {
        const added = [], rejected = [];
        const r = this.typeRule();
        for (const f of Array.from(list || [])) {
          const name = String(f && f.name || ''), size = +(f && f.size) || 0, ext = extOf(name);
          let key = null, vars = { name };
          if (!r) key = 'chooseTypeFirst';
          else if (!r.exts.includes(ext)) { key = 'badExt'; vars = { name, exts: r.exts.map(e => '.' + e).join(' ') }; }
          else if (size <= 0) key = 'empty';
          else if (size > r.maxBytes) { key = 'tooBig'; vars = { name, size: TC.fmtBytes(size, this.locale), max: TC.fmtBytes(r.maxBytes, this.locale) }; }
          if (key) { rejected.push({ key, vars }); continue; }
          const item = { id: TC.uid('file'), name, size, ext, existing: false };
          this.form.files.push(item); added.push(item);
        }
        this.fileRejects = rejected;
        const parts = [];
        if (added.length) parts.push(this.tf('lo.file.added', { n: this.fmtNum(added.length) }));
        rejected.forEach(x => parts.push(this.fileRejectText(x)));
        if (parts.length) this.liveMsg = parts.join(' ');
        return { added, rejected };
      },
      onFileChange(evt) { this.addFiles(evt.target.files); try { evt.target.value = ''; } catch (e) {} },
      onFileDrop(evt) { this.dragOver = false; return this.addFiles(evt.dataTransfer && evt.dataTransfer.files); },
      removeFile(id) {
        const f = this.form.files.find(x => x.id === id);
        this.form.files = this.form.files.filter(x => x.id !== id);
        if (f) this.liveMsg = this.tf('lo.form.removeFile', { name: f.name });
      },

      /* ---------- اقتراح المفاهيم (مطابقة العنوان مع مفاهيم النطاق؛ في الإنتاج: خدمة الذكاء الاصطناعي) ---------- */
      suggestConcepts() {
        if (!this.form.course) { this.aiSuggestions = []; this.liveMsg = this.t('lo.ai.needCourse'); return []; }
        const words = tokens(this.form.titleAr + ' ' + this.form.titleEn);
        const scored = TC.CONCEPTS.filter(k => this.inScope(k) && !this.form.concepts.includes(k.id)).map(k => {
          const hay = tokens(k.name.ar + ' ' + k.name.en);
          const hits = words.filter(w => hay.some(h => h.startsWith(w) || w.startsWith(h))).length;
          return { k, score: hits * 2 + (this.form.lesson && k.lessonId === this.form.lesson ? 1 : 0) };
        }).filter(x => x.score > 1 || (x.score > 0 && !words.length)).sort((a, b) => b.score - a.score).slice(0, 4);
        this.aiSuggestions = scored.map(x => x.k.id);
        this.liveMsg = this.aiSuggestions.length
          ? this.tf('lo.ai.found', { n: this.fmtNum(this.aiSuggestions.length), list: this.listFmt(this.aiSuggestions.map(id => this.conceptLabel(id))) })
          : this.t('lo.ai.none');
        return this.aiSuggestions.slice();
      },
      acceptSuggestion(id) {
        if (!this.form.concepts.includes(id)) this.form.concepts = [...this.form.concepts, id];
        this.aiSuggestions = this.aiSuggestions.filter(x => x !== id);
      },

      /* ---------- التحقق والحفظ ---------- */
      get formErrors() {
        const f = this.form, e = {};
        if (!String(f.titleAr).trim()) e.titleAr = 'lo.err.titleAr';
        if (!String(f.titleEn).trim()) e.titleEn = 'lo.err.titleEn';
        if (!f.type) e.type = 'lo.err.type';
        if (!f.course) e.course = 'lo.err.course';
        if (!f.concepts.length) e.concepts = 'lo.err.concepts';
        if (!f.files.length) e.files = 'lo.err.files';
        else if (f.files.some(x => this.fileIssue(x))) e.files = 'lo.err.filesInvalid';
        return e;
      },
      get errorList() { const e = this.formErrors; return FIELD_ORDER.filter(([k]) => e[k]).map(([k, id]) => ({ key: k, id, msg: this.t(e[k]) })); },
      showErr(k) { return this.submitted && !!this.formErrors[k]; },
      describedBy(k, hint) { return [hint, this.showErr(k) ? 'lo-err-' + k : null].filter(Boolean).join(' ') || null; },
      focusField(id) { this.$nextTick(() => { try { const el = document.getElementById(id); el && el.focus && el.focus(); } catch (e) {} }); },

      openUpload(ev) {
        clearTimeout(this._panelClear);
        this._panelOpener = ev?.currentTarget || null;
        this.editingId = null;
        this.form = this.blankForm();
        if (this.fCourse !== 'all') { this.form.course = this.fCourse; if (this.fUnit !== 'all') { this.form.unit = this.fUnit; if (this.fLesson !== 'all') this.form.lesson = this.fLesson; } }
        this.submitted = false; this.fileRejects = []; this.aiSuggestions = [];
        this.panelOpen = true;
        return true;
      },
      openEdit(r, ev) {
        const o = this.findItem(r.id);
        if (!o || o.owner !== 'me') return false;
        clearTimeout(this._panelClear);
        this._panelOpener = ev?.currentTarget || null;
        this.editingId = o.id;
        const ext = (TYPE_META[o.type] || TYPE_META.scorm).exts[0];
        this.form = {
          titleAr: o.title.ar, titleEn: o.title.en, type: o.type,
          course: o.courseId, unit: o.unitId || '', lesson: o.lessonId || '',
          concepts: [...(o.conceptIds || [])],
          files: [{ id: 'cur-' + o.id, name: o.code.toLowerCase() + '.' + ext, size: o.sizeBytes || 0, ext, existing: true }],
          visibility: o.visibility,
        };
        this.submitted = false; this.fileRejects = []; this.aiSuggestions = [];
        this.panelOpen = true;
        return true;
      },
      closePanel() {
        if (!this.panelOpen || this.busy) return;
        this.panelOpen = false;
        this.dragOver = false;
        this.restoreFocus(this._panelOpener);
        this._panelClear = setTimeout(() => { if (!this.panelOpen) { this.editingId = null; this.form = this.blankForm(); this.fileRejects = []; this.aiSuggestions = []; this.submitted = false; } }, 220);
      },
      nextCode(type) {
        const prefix = 'LO-' + (TYPE_META[type] || TYPE_META.scorm).prefix + '-';
        const n = this.items.reduce((m, o) => Math.max(m, parseInt(String(o.code).split('-').pop(), 10) || 0), 0);
        let i = n + 1, code;
        do { code = prefix + String(i++).padStart(3, '0'); } while (this.items.some(o => o.code === code));
        return code;
      },
      submitForm() {
        if (this.busy) return null;
        this.submitted = true;
        const errs = this.errorList;
        if (errs.length) {
          this.liveMsg = this.tf('lo.err.summaryN', { n: this.fmtNum(errs.length) });
          this.focusField(errs[0].id);
          return null;
        }
        this.busy = true;
        let o, msg;
        try {
          const f = this.form, stamp = nowIso();
          const data = {
            title: { ar: f.titleAr.trim(), en: f.titleEn.trim() }, type: f.type,
            courseId: f.course, unitId: f.unit || null, lessonId: (f.unit && f.lesson) || null,
            conceptIds: [...f.concepts], sizeBytes: f.files.reduce((s, x) => s + (x.size || 0), 0),
            updatedAt: stamp, status: 'draft',
          };
          if (this.editing) {
            o = this.editing;
            const wasPending = o.visibility === 'central_pending';
            if (['private', 'tenant'].includes(o.visibility)) data.visibility = ['private', 'tenant'].includes(f.visibility) ? f.visibility : o.visibility;
            if (wasPending) data.visibility = 'tenant';
            if (data.type !== 'scorm') delete o.scormVersion;
            Object.assign(o, data);
            msg = this.tf('lo.saved', { title: this.loc(o.title) }) + (wasPending ? ' ' + this.t('lo.centralWithdrawn') : '');
          } else {
            o = Object.assign({ id: TC.uid('LO'), code: this.nextCode(f.type), owner: 'me', usedIn: 0, visibility: ['private', 'tenant'].includes(f.visibility) ? f.visibility : 'private' }, data);
            this.items.unshift(o);
            msg = this.tf('lo.created', { title: this.loc(o.title), code: o.code });
          }
        } finally { this.busy = false; }
        if (!this.revealRow(o.id)) msg = this.tf('lo.savedHidden', { msg });
        this.closePanel();
        this.liveMsg = msg; this.toast(msg);
        return o;
      },

      /* ---------- عامة ---------- */
      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; this.wide = m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        document.title = this.t('docTitle');
        const id = this.readUrl();
        this.syncUrl();
        this.announce();
        this.$watch('search', () => this.onFilterChange());
        const r = id && this.rowById(id);
        if (r) { this.revealRow(r.id); this.openPreview(r, null); }
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      /** Escape على مستوى النافذة: يغلق القوائم، ثم الطبقة العليا فقط */
      closeAll() {
        this.notifOpen = false; this.profileOpen = false; this.mobileNav = false;
        if (this.centralOpen) this.closeCentral();
        else if (this.previewOpen) this.closePreview();
        else if (this.panelOpen) this.closePanel();
      },
    };
  }
</script>
