<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>لوحة المعلم — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  {@apply bg-accent-500/20 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-line-strong; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }
    .btn-success { @apply bg-success-500 text-white hover:bg-success-700; }
    .btn-ghost-light { @apply border border-white/30 bg-white/10 text-white hover:bg-white/20; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }

    /* ---------- مقياس الحصة (QuotaMeter) ---------- */
    .quota-track { @apply h-1.5 w-full overflow-hidden rounded-full bg-line; }
    .quota-fill { @apply h-full rounded-full transition-all duration-500; }

    /* ---------- بطاقة اختصار سريع (QuickTile) ---------- */
    .quick-tile { @apply flex items-center gap-3 rounded-2xl border border-line bg-card p-4 shadow-card transition motion-safe:hover:-translate-y-0.5 hover:border-primary-500 hover:shadow-pop focus-visible:ring-2; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }

    /* ---------- [layout: full-height sidebar + bottom footer] ---------- */
    html, body { min-height: 100%; }
    body { margin: 0; }
    .app-col { min-height: 100vh; min-height: 100dvh; }
    @media (min-width: 1024px) {
      #sidebar { height: 100vh; height: 100dvh; }
      .app-col { margin-inline-start: 18rem; transition: margin-inline-start .3s ease; }
      .app-col.is-collapsed { margin-inline-start: 5rem; }
      .save-bar { inset-inline-start: 18rem; transition: inset-inline-start .3s ease; }
      .save-bar.is-collapsed { inset-inline-start: 5rem; }
    }
</style>

<!-- ⑥ Alpine.js -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- ⑦ SweetAlert2 -->
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5"></script>
</head>

<body x-data="shell()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch && $refs.globalSearch.focus(); }"
      @scroll.window="openMenuId = null" @resize.window="openMenuId = null"
      :class="{ 'overflow-hidden': mobileNav && mobile }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar — بوابة المعلم (Teacher Portal) ================= -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <span class="inline-flex min-w-0 flex-1 items-center gap-3" :class="!expanded && 'lg:flex-none lg:justify-center'">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </span>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-muted" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="item.live && expanded && reviewPendingCount"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent">
                    <span aria-hidden="true" x-text="num(reviewPendingCount)"></span>
                    <span class="sr-only" x-text="tf('navCount', { n: num(reviewPendingCount) })"></span>
                  </span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="app-col flex min-w-0 flex-1 flex-col" :class="collapsed && 'is-collapsed'">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent="goSearch()">
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" x-model="searchQ" maxlength="100" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex"><bdi dir="ltr">Ctrl K</bdi></kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-haspopup="true" :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications') + (unread ? ' — ' + tf('unreadCount', { n: num(unread) }) : '')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="markAllRead()" :disabled="!unread" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li :class="n.read ? '' : 'bg-soft/60'">
                    <a :href="n.href" class="flex gap-3 px-4 py-3 transition hover:bg-soft focus-visible:bg-soft" @click="n.read = true; notifOpen = false">
                      <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                      <span class="block min-w-0">
                        <span class="block break-words text-sm font-bold leading-6 text-ink" x-text="notifText(n)"></span>
                        <span class="block text-xs text-muted">
                          <time :datetime="n.at" x-text="relTime(n.at)"></time>
                          <span class="sr-only" x-show="!n.read" x-text="t('unreadLabel')"></span>
                        </span>
                      </span>
                    </a>
                  </li>
                </template>
                <li x-show="!notifications.length" class="px-4 py-6 text-center text-sm text-muted" x-text="t('noNotif')"></li>
              </ul>
              <div class="border-t border-line p-2">
                <a href="../common/notifications.html" class="menu-item justify-center text-brand" @click="notifOpen = false">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  <span x-text="t('viewAllNotif')"></span>
                </a>
              </div>
            </div>
          </div>

          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" class="flex max-w-[14rem] items-center gap-2 rounded-xl p-1 transition hover:bg-soft focus-visible:ring-2 md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    aria-haspopup="menu" :aria-expanded="profileOpen.toString()" aria-controls="profile-menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true" x-text="L(teacher.initials)"></span>
              <span class="hidden min-w-0 text-start md:block">

      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="locale === 'ar' ? 'مسار التنقل' : 'Breadcrumb'">
          <ol class="flex items-center gap-2" role="list">
            <li x-text="t('breadcrumb.home')"></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li x-text="t('breadcrumb.portal')"></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li class="text-ink" aria-current="page" x-text="t('dash.title')"></li>
          </ol>
        </nav>
      </div>
    </header>

    <!-- ================= المحتوى الرئيسي — TCH-01: لوحة المعلم (كل الأرقام من TC) ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">

      <p class="sr-only" aria-live="polite" x-text="liveMsg"></p>

      <!-- ================= البانر الترحيبي ================= -->
      <section class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-primary-500 via-primary-700 to-primary-900 p-5 text-white shadow-pop sm:p-8" aria-labelledby="hero-title">
        <div aria-hidden="true" class="absolute -end-16 -top-16 h-56 w-56 rounded-full bg-accent-500/15 blur-3xl"></div>
        <div aria-hidden="true" class="absolute -bottom-20 -start-10 h-64 w-64 rounded-full bg-white/5 blur-3xl"></div>
        <div class="relative z-10 flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">
          <div class="min-w-0 max-w-xl">
            <p class="text-xs font-extrabold uppercase tracking-wide text-primary-100" x-text="t('dash.heroEyebrow')"></p>
            <h1 id="hero-title" class="mt-1.5 text-2xl font-extrabold sm:text-3xl" x-text="tf('dash.heroGreeting', { name: L(teacher.firstName) })"></h1>
            <p class="mt-1 text-sm font-bold text-primary-100">
              <i class="fa-regular fa-calendar me-1" aria-hidden="true"></i>
              <time :datetime="todayIso" x-text="todayLabel"></time>
            </p>
            <p class="mt-2 text-sm leading-6 text-primary-50 sm:text-base" x-text="t('dash.heroSub')"></p>
          </div>
          <div class="flex flex-wrap gap-2.5">
            <a href="quiz-builder.html" class="btn btn-accent shrink-0">
              <i class="fa-solid fa-plus" aria-hidden="true"></i> <span x-text="t('dash.heroCtaQuiz')"></span>
            </a>
            <a href="ai-generator.html" class="btn btn-ghost-light shrink-0">
              <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> <span x-text="t('dash.heroCtaAI')"></span>
            </a>
            <a href="quiz-results.html?status=pending_grading" class="btn btn-ghost-light shrink-0">
              <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i> <span x-text="t('dash.heroCtaGrade')"></span>
            </a>
          </div>
        </div>
      </section>

      <!-- ================= مؤشرات الأداء (روابط) ================= -->
      <section :aria-label="t('dash.kpiRegion')" class="grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-4">
        <template x-for="k in kpis" :key="k.key">
          <a :href="k.href" :aria-label="k.label"
             class="panel block p-4 transition hover:border-primary-500 hover:shadow-pop focus-visible:ring-2 motion-safe:hover:-translate-y-0.5 sm:p-5">
            <span class="flex items-center justify-between gap-3">
              <span class="min-w-0 truncate text-sm font-bold text-muted" x-text="k.title"></span>
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl" :class="k.tone" aria-hidden="true"><i :class="k.icon"></i></span>
            </span>
            <span class="mt-2 block text-2xl font-extrabold tabular-nums" x-text="num(k.value)"></span>
            <span class="mt-0.5 block text-xs text-muted" x-text="k.caption"></span>
          </a>
        </template>
      </section>

      <!-- ================= طابور التصحيح ================= -->
      <section class="panel overflow-hidden" aria-labelledby="grading-title">
        <div class="flex flex-col gap-3 border-b border-line p-4 sm:flex-row sm:items-center sm:justify-between sm:p-5">
          <div class="flex min-w-0 flex-wrap items-center gap-3">
            <h2 id="grading-title" class="text-lg font-extrabold text-ink" x-text="t('dash.gradingTitle')"></h2>
            <span class="badge badge-accent shrink-0">
              <i class="fa-solid fa-hourglass-half" aria-hidden="true"></i>
              <span x-text="tf('dash.gradingBadge', { n: num(pendingAttempts.length) })"></span>
            </span>
          </div>
          <a href="quiz-results.html?status=pending_grading" class="btn btn-outline btn-sm shrink-0">
            <i class="fa-solid fa-list-check" aria-hidden="true"></i> <span x-text="t('dash.viewAllQueue')"></span>
          </a>
        </div>

        <p class="px-4 pt-3 text-xs text-muted sm:px-5" x-show="pendingAttempts.length" x-text="tf('dash.queueHint', { shown: num(gradingQueue.length), total: num(pendingAttempts.length) })"></p>

        <!-- حالة فارغة -->
        <template x-if="!gradingQueue.length">
          <div class="flex flex-col items-center gap-2 p-8 text-center">
            <span class="grid h-12 w-12 place-items-center rounded-full bg-success-500/15 text-success-700 dark:text-success-500" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
            <p class="font-extrabold" x-text="t('dash.queueEmpty')"></p>
          </div>
        </template>

        <!-- (أ) بطاقات — أقل من 1024px -->
        <template x-if="gradingQueue.length && !wide">
          <ul class="grid grid-cols-1 gap-3 p-3 sm:grid-cols-2 sm:p-4" role="list" :aria-label="t('dash.gradingTitle')">
            <template x-for="row in gradingQueue" :key="row.id">
              <li class="min-w-0 rounded-xl border border-line p-4">
                <div class="flex items-start gap-3">
                  <span class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-soft text-sm font-extrabold text-brand" aria-hidden="true" x-text="row.initials"></span>
                  <div class="min-w-0 flex-1">
                    <p class="truncate font-extrabold leading-6" x-text="L(row.student.name)"></p>
                    <p class="text-start text-xs text-muted"><bdi dir="ltr" x-text="row.student.studentNo"></bdi></p>
                    <p class="mt-1 text-sm text-ink" x-text="L(row.quiz.title)"></p>
                  </div>
                </div>
                <div class="mt-3 flex flex-wrap items-center gap-2 text-xs">
                  <span class="badge badge-primary"><bdi dir="ltr" x-text="row.course.code"></bdi></span>
                  <span class="badge badge-accent"><i class="fa-solid fa-pen" aria-hidden="true"></i> <span x-text="tf('dash.pendingQs', { n: num(row.pendingQs) })"></span></span>
                  <span class="text-muted"><span x-text="t('dash.submittedLabel')"></span> <time :datetime="row.submittedAt" :title="fmtDate(row.submittedAt)" x-text="relTime(row.submittedAt)"></time></span>
                </div>
                <div class="mt-3 flex flex-wrap items-center gap-2">
                  <a :href="'quiz-grading.html?attempt=' + encodeURIComponent(row.id)" class="btn btn-success btn-sm"
                     :aria-label="tf('dash.gradeNowFor', { name: L(row.student.name) })">
                    <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i> <span x-text="t('dash.gradeNow')"></span>
                  </a>
                  <a :href="'quiz-results.html?quiz=' + encodeURIComponent(row.quiz.code)" class="act"
                     :aria-label="tf('dash.quizResultsFor', { title: L(row.quiz.title) })">
                    <i class="fa-solid fa-chart-column" aria-hidden="true"></i>
                  </a>
                </div>
              </li>
            </template>
          </ul>
        </template>

        <!-- (ب) جدول — 1024px فأكثر -->
        <template x-if="gradingQueue.length && wide">
          <div class="overflow-x-auto">
            <table class="w-full border-collapse text-sm">
              <caption class="sr-only" x-text="t('dash.gradingCaption')"></caption>
              <thead>
                <tr class="bg-soft text-ink">
                  <th scope="col" class="px-5 py-3.5 text-start text-xs font-extrabold" x-text="t('dash.colStudent')"></th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('dash.colQuiz')"></th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('dash.colSubmitted')"></th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('dash.colPendingQs')"></th>
                  <th scope="col" class="px-5 py-3.5 text-end text-xs font-extrabold" x-text="t('dash.colActions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-line">
                <template x-for="row in gradingQueue" :key="row.id">
                  <tr class="transition hover:bg-soft/40">
                    <th scope="row" class="px-5 py-4 text-start align-middle font-normal">
                      <div class="flex items-center gap-3">
                        <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-soft text-sm font-extrabold text-brand" aria-hidden="true" x-text="row.initials"></span>
                        <div class="min-w-0">
                          <p class="truncate font-extrabold leading-6" x-text="L(row.student.name)"></p>
                          <p class="text-start text-xs text-muted"><bdi dir="ltr" x-text="row.student.studentNo"></bdi></p>
                        </div>
                      </div>
                    </th>
                    <td class="px-4 py-4 align-middle">
                      <p class="text-ink" x-text="L(row.quiz.title)"></p>
                      <span class="badge badge-primary mt-1"><bdi dir="ltr" x-text="row.course.code"></bdi></span>
                    </td>
                    <td class="whitespace-nowrap px-4 py-4 align-middle text-muted">
                      <time :datetime="row.submittedAt" :title="fmtDate(row.submittedAt)" x-text="relTime(row.submittedAt)"></time>
                    </td>
                    <td class="px-4 py-4 align-middle">
                      <span class="badge badge-accent"><i class="fa-solid fa-pen" aria-hidden="true"></i> <span x-text="tf('dash.pendingQs', { n: num(row.pendingQs) })"></span></span>
                    </td>
                    <td class="px-5 py-4 align-middle">
                      <div class="flex justify-end gap-2">
                        <a :href="'quiz-grading.html?attempt=' + encodeURIComponent(row.id)" class="btn btn-success btn-sm"
                           :aria-label="tf('dash.gradeNowFor', { name: L(row.student.name) })">
                          <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i> <span x-text="t('dash.gradeNow')"></span>
                        </a>
                        <a :href="'quiz-results.html?quiz=' + encodeURIComponent(row.quiz.code)" class="act"
                           :aria-label="tf('dash.quizResultsFor', { title: L(row.quiz.title) })" :title="t('dash.quizResults')">
                          <i class="fa-solid fa-chart-column" aria-hidden="true"></i>
                        </a>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>

        <!-- صُحّحت مؤخرًا -->
        <div class="border-t border-line p-4 sm:p-5" x-show="recentlyGraded.length">
          <h3 class="mb-3 text-sm font-extrabold text-ink" x-text="t('dash.recentTitle')"></h3>
          <ul class="divide-y divide-line" role="list">
            <template x-for="row in recentlyGraded" :key="row.id">
              <li class="flex flex-wrap items-center gap-x-3 gap-y-2 py-2.5">
                <div class="min-w-0 flex-1">
                  <p class="truncate text-sm font-extrabold" x-text="L(row.student.name)"></p>
                  <p class="truncate text-xs text-muted">
                    <span x-text="L(row.quiz.title)"></span> ·
                    <span x-text="t('dash.gradedLabel')"></span> <time :datetime="row.gradedAt" :title="fmtDate(row.gradedAt)" x-text="relTime(row.gradedAt)"></time>
                  </p>
                </div>
                <span class="badge" :class="row.passed ? 'badge-success' : 'badge-danger'">
                  <i class="fa-solid" :class="row.passed ? 'fa-circle-check' : 'fa-circle-xmark'" aria-hidden="true"></i>
                  <span class="tabular-nums" x-text="fmtPct(row.percent, 1)"></span>
                  <span x-text="row.passed ? t('dash.passed') : t('dash.failed')"></span>
                </span>
                <a :href="'quiz-results.html?quiz=' + encodeURIComponent(row.quiz.code)" class="btn btn-outline btn-sm"
                   :aria-label="tf('dash.viewResultFor', { name: L(row.student.name), title: L(row.quiz.title) })">
                  <i class="fa-solid fa-square-poll-vertical" aria-hidden="true"></i> <span x-text="t('dash.viewResult')"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </section>

      <!-- ================= المواعيد القادمة + حصة الذكاء الاصطناعي ================= -->
      <section class="grid grid-cols-1 gap-3 sm:gap-4 lg:grid-cols-3">
        <div class="panel min-w-0 p-4 sm:p-5 lg:col-span-2" role="region" aria-labelledby="deadlines-title">
          <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
            <h2 id="deadlines-title" class="text-lg font-extrabold text-ink" x-text="t('dash.deadlinesTitle')"></h2>
            <a href="quizzes.html?status=open" class="text-sm font-bold text-brand hover:underline" x-text="t('dash.allQuizzes')"></a>
          </div>
          <p x-show="!deadlines.length" class="rounded-xl border border-dashed border-line p-6 text-center text-sm text-muted" x-text="t('dash.deadlinesEmpty')"></p>
          <ul class="divide-y divide-line" role="list" x-show="deadlines.length">
            <template x-for="d in deadlines" :key="d.code">
              <li class="flex flex-col gap-3 py-3 sm:flex-row sm:items-center">
                <div class="min-w-0 flex-1">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="badge" :class="d.status === 'open' ? 'badge-success' : 'badge-info'">
                      <i class="fa-solid" :class="d.status === 'open' ? 'fa-lock-open' : 'fa-calendar-day'" aria-hidden="true"></i>
                      <span x-text="d.status === 'open' ? t('dash.statusOpen') : t('dash.statusScheduled')"></span>
                    </span>
                    <span class="badge badge-primary"><bdi dir="ltr" x-text="d.course.code"></bdi></span>
                  </div>
                  <p class="mt-1.5 font-extrabold leading-6" x-text="L(d.title)"></p>
                  <p class="mt-0.5 text-xs text-muted">
                    <span x-text="d.status === 'open' ? t('dash.openedLabel') : t('dash.opensLabel')"></span>
                    <time :datetime="d.opensAt" :title="fmtDate(d.opensAt)" x-text="relTime(d.opensAt)"></time>
                    <span aria-hidden="true">·</span>
                    <span x-text="t('dash.closesLabel')"></span>
                    <time :datetime="d.closesAt" :title="fmtDate(d.closesAt)" x-text="relTime(d.closesAt)"></time>
                  </p>
                </div>
                <div class="w-full shrink-0 sm:w-44">
                  <p class="text-xs font-bold text-ink" x-text="tf('dash.submittedOf', { n: num(d.submitted), total: num(d.students) })"></p>
                  <div class="quota-track mt-1.5" aria-hidden="true">
                    <div class="quota-fill bg-primary-500" :style="{ width: d.pct + '%' }"></div>
                  </div>
                </div>
                <a :href="d.status === 'open' ? 'quiz-results.html?quiz=' + encodeURIComponent(d.code) : 'quiz-builder.html?quiz=' + encodeURIComponent(d.code)"
                   class="btn btn-outline btn-sm shrink-0 self-start sm:self-center"
                   :aria-label="(d.status === 'open' ? t('dash.viewResults') : t('dash.editQuiz')) + ': ' + L(d.title)">
                  <i class="fa-solid" :class="d.status === 'open' ? 'fa-chart-column' : 'fa-pen-ruler'" aria-hidden="true"></i>
                  <span x-text="d.status === 'open' ? t('dash.viewResults') : t('dash.editQuiz')"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>

        <!-- حصة الذكاء الاصطناعي الشخصية -->
        <div class="panel flex h-full flex-col justify-between p-4 sm:p-5" role="region" aria-labelledby="ai-title">
          <div>
            <div class="flex items-center justify-between gap-3">
              <h2 id="ai-title" class="min-w-0 truncate text-sm font-bold text-muted" x-text="t('dash.aiQuotaTitle')"></h2>
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-primary-500/10 text-brand" aria-hidden="true"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
            </div>
            <p class="mt-3 text-2xl font-extrabold tabular-nums">
              <span x-text="num(ai.used)"></span>
              <span class="text-base font-bold text-muted">/ <span x-text="num(ai.limit)"></span></span>
            </p>
            <p class="mt-0.5 text-xs text-muted" x-text="t('dash.aiQuotaCaption')"></p>
          </div>
          <div class="mt-4">
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs font-bold">
              <span class="badge" :class="ai.percent >= 90 ? 'badge-danger' : ai.percent >= 75 ? 'badge-accent' : 'badge-primary'">
                <span x-text="tf('dash.aiUsedPct', { pct: fmtPct(ai.percent) })"></span>
              </span>
              <span class="text-muted" x-text="tf('dash.aiQuotaReset', { date: fmtDate(ai.resetsOn, { year: 'numeric', month: 'long', day: 'numeric' }) })"></span>
            </div>
            <div class="quota-track mt-1.5" aria-hidden="true">
              <div class="quota-fill" :class="ai.percent >= 90 ? 'bg-error-500' : ai.percent >= 75 ? 'bg-accent-500' : 'bg-primary-500'" :style="{ width: Math.min(100, ai.percent) + '%' }"></div>
            </div>
            <p class="mt-2 text-xs text-muted" x-text="tf('dash.aiRemaining', { n: num(ai.remaining), runs: num(ai.runs) })"></p>
            <p class="hint mt-1" x-text="t('dash.aiQuotaNote')"></p>
            <a href="ai-generator.html" class="btn btn-outline btn-sm mt-3 w-full">
              <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> <span x-text="t('dash.aiOpen')"></span>
            </a>
          </div>
        </div>
      </section>

      <!-- ================= تقدّم المقررات ================= -->
      <section aria-labelledby="progress-title">
        <div class="mb-3 min-w-0">
          <h2 id="progress-title" class="text-lg font-extrabold text-ink" x-text="t('dash.progressTitle')"></h2>
          <p class="mt-0.5 text-sm text-muted" x-text="t('dash.progressSubtitle')"></p>
        </div>
        <ul class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4 xl:grid-cols-4" role="list">
          <template x-for="c in courseProgress" :key="c.id">
            <li class="panel flex h-full min-w-0 flex-col p-4 sm:p-5">
              <div class="flex items-start gap-3">
                <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-primary-500/10 text-brand" aria-hidden="true"><i class="fa-solid" :class="c.icon"></i></span>
                <div class="min-w-0 flex-1">
                  <h3 class="text-sm font-extrabold leading-6 text-ink">
                    <a :href="'CoursesManagement.html?course=' + encodeURIComponent(c.code)" class="rounded hover:text-brand hover:underline focus-visible:ring-2" x-text="L(c.title)"></a>
                  </h3>
                  <p class="text-start text-xs text-muted"><bdi dir="ltr" x-text="c.code"></bdi> · <span x-text="tf('dash.studentsN', { n: num(c.counts.students) })"></span></p>
                </div>
              </div>

              <dl class="mt-4 grid grid-cols-3 gap-2 text-center">
                <template x-for="m in ['units', 'lessons', 'concepts', 'los', 'quizzes']" :key="m">
                  <div class="rounded-lg bg-soft/60 px-1 py-1.5">
                    <dt class="truncate text-[11px] font-bold text-muted" x-text="t('dash.cnt.' + m)"></dt>
                    <dd class="text-base font-extrabold tabular-nums" x-text="num(c.counts[m])"></dd>
                  </div>
                </template>
              </dl>

              <div class="mt-4">
                <div class="flex items-center justify-between gap-2 text-xs font-bold" aria-hidden="true">
                  <span class="text-ink" x-text="c.conceptsTotal ? tf('dash.readiness', { done: num(c.classified), total: num(c.conceptsTotal) }) : t('dash.noConcepts')"></span>
                  <span class="tabular-nums text-muted" x-text="fmtPct(c.readyPct)"></span>
                </div>
                <div class="quota-track mt-1.5" role="progressbar" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="c.readyPct"

          { key: 'conceptsTree', icon: 'fa-solid fa-diagram-project', href: 'concepts.html' },
        ]},
        { group: 'assessment', items: [
          { key: 'quizBank', icon: 'fa-solid fa-list-check', href: 'quizzes.html' },
          { key: 'learningObjects', icon: 'fa-solid fa-cubes', href: 'learning-objects.html' },
          { key: 'aiStudio', icon: 'fa-solid fa-wand-magic-sparkles', href: 'ai-generator.html' },
        ]},
        { group: 'grading', items: [
          { key: 'reviewQueue', icon: 'fa-solid fa-clipboard-check', href: 'ReviewQueue.html', live: true },
          { key: 'studentResults', icon: 'fa-solid fa-chart-line', href: 'quiz-results.html' },
        ]},
      ],
      setActive(key) { this.active = key; this.mobileNav = false; },
      goSearch() {
        const q = String(this.searchQ || '').trim().slice(0, 100);
        location.href = 'quizzes.html' + (q ? '?q=' + encodeURIComponent(q) : '');
      },

      /* ---------- مشتقات البيانات ---------- */
      get courses() { return TC.COURSES; },
      get pendingAttempts() { return TC.ATTEMPTS.filter((a) => a.status === 'pending_grading' && a.submittedAt).slice().sort(bySubmitted); },
      get openQuizzes() { return TC.QUIZZES.filter((q) => TC.quizStatus(q) === 'open'); },
      get pendingReviews() { return TC.REVIEW_ITEMS.filter((r) => r.status === 'pending'); },
      get reviewPendingCount() { return this.pendingReviews.length; },
      get studentTotal() { return new Set(TC.STUDENTS.filter((s) => s.courseIds.some((id) => TC.course(id))).map((s) => s.id)).size; },

      get kpis() {
        const oldest = this.pendingAttempts[0] || null;
        const nextClose = this.openQuizzes.map((q) => q.closesAt).sort()[0] || null;
        const k = (key, value, href, icon, tone, caption) => ({
          key, value, href, icon, tone, caption,
          title: this.t('dash.kpi.' + key + 'Title'),
          label: this.t('dash.kpi.' + key + 'Title') + ': ' + this.num(value),
        });
        return [
          k('courses', this.courses.length, 'CoursesManagement.html', 'fa-solid fa-book-open', 'bg-primary-500/10 text-brand',
            this.tf('dash.kpi.coursesCaption', { n: this.num(this.studentTotal) })),
          k('open', this.openQuizzes.length, 'quizzes.html?status=open', 'fa-solid fa-lock-open', 'bg-success-500/15 text-success-700 dark:text-success-500',
            nextClose ? this.tf('dash.kpi.openCaption', { when: this.relTime(nextClose) }) : this.t('dash.kpi.openNone')),
          k('pending', this.pendingAttempts.length,
            oldest ? 'quiz-grading.html?attempt=' + encodeURIComponent(oldest.id) : 'quiz-results.html?status=pending_grading',
            'fa-solid fa-hourglass-half', 'bg-accent-500/20 text-yellow-900 dark:text-accent-500',
            oldest ? this.tf('dash.kpi.pendingCaption', { when: this.relTime(oldest.submittedAt) }) : this.t('dash.kpi.pendingNone')),
          k('reviews', this.pendingReviews.length, 'ReviewQueue.html', 'fa-solid fa-clipboard-check', 'bg-info-500/15 text-info-700 dark:text-blue-300',
            this.t('dash.kpi.reviewsCaption')),
        ];
      },

      get gradingQueue() {
        return this.pendingAttempts.slice(0, 5).map((a) => {
          const quiz = TC.quiz(a.quizCode), student = TC.student(a.studentId);
          return {
            id: a.id, submittedAt: a.submittedAt, quiz, student, course: TC.course(quiz.courseId),
            pendingQs: TC.attemptScore(a).pending, initials: this.initials(student.name),
          };
        });
      },

      get recentlyGraded() {
        const now = this.nowTick;
        return TC.ATTEMPTS.filter((a) => isScored(a) && a.gradedAt && Date.parse(a.gradedAt) <= now)
          .slice().sort((a, b) => String(b.gradedAt).localeCompare(String(a.gradedAt)) || a.id.localeCompare(b.id))
          .slice(0, 4)
          .map((a) => {
            const s = TC.attemptScore(a);
            return { id: a.id, gradedAt: a.gradedAt, quiz: TC.quiz(a.quizCode), student: TC.student(a.studentId), percent: s.percent, passed: s.passed };
          });
      },

      get deadlines() {
        const now = this.nowTick;
        return TC.QUIZZES.map((q) => ({ q, status: TC.quizStatus(q, now) }))
          .filter((x) => x.status === 'open' || x.status === 'scheduled')
          .map(({ q, status }) => {
            const submitted = TC.attemptsOf(q.code).filter((a) => a.submittedAt && a.status !== 'in_progress').length;
            const students = TC.studentsOf(q.courseId).length;
            return {
              code: q.code, title: q.title, status, opensAt: q.opensAt, closesAt: q.closesAt,
              course: TC.course(q.courseId), submitted, students,
              pct: students ? Math.min(100, Math.round((submitted / students) * 100)) : 0,
              due: status === 'open' ? q.closesAt : q.opensAt,
            };
          })
          .sort((a, b) => String(a.due).localeCompare(String(b.due)) || a.code.localeCompare(b.code));
      },

      get courseProgress() {
        return this.courses.map((c) => {
          const counts = TC.courseCounts(c.id);
          const concepts = TC.CONCEPTS.filter((k) => k.courseId === c.id);
          const classified = concepts.filter((k) => k.classified).length;
          const quizCodes = new Set(TC.QUIZZES.filter((q) => q.courseId === c.id).map((q) => q.code));
          const pcts = TC.ATTEMPTS.filter((a) => isScored(a) && quizCodes.has(a.quizCode)).map((a) => TC.attemptScore(a).percent);
          const avg = mean(pcts);
          return {
            id: c.id, code: c.code, title: c.title, icon: c.icon, counts,
            conceptsTotal: concepts.length, classified,
            readyPct: concepts.length ? Math.round((classified / concepts.length) * 100) : 0,
            avg: avg == null ? null : round1(avg), scoredN: pcts.length,
          };
        });
      },

      get struggling() {
        const per = new Map();
        for (const a of TC.ATTEMPTS) {
          if (!isScored(a)) continue;
          const qz = TC.quiz(a.quizCode); if (!qz) continue;
          const s = TC.attemptScore(a);
          const r = per.get(a.studentId) || { pcts: [], passes: [], failed: 0 };
          r.pcts.push(s.percent); r.passes.push(qz.passMark); if (s.passed === false) r.failed++;
          per.set(a.studentId, r);
        }
        return [...per.entries()]
          .map(([id, r]) => ({ student: TC.student(id), avg: round1(mean(r.pcts)), pass: round1(mean(r.passes)), n: r.pcts.length, failed: r.failed }))
          .filter((r) => r.student && r.avg < r.pass)
          .sort((a, b) => a.avg - b.avg || a.student.id.localeCompare(b.student.id))
          .slice(0, 5);
      },

      get ai() {
        const u = TC.AI_USAGE;
        const used = u.used, limit = u.teacherMonthlyLimit;
        return {
          used, limit, remaining: Math.max(0, limit - used),
          percent: limit ? round1((used / limit) * 100) : 0,
          resetsOn: u.resetsOn, runs: u.logs.length,
        };
      },

      tiles: [
        { key: 'concepts', icon: 'fa-diagram-project', href: 'concepts.html' },
        { key: 'quizzes', icon: 'fa-list-check', href: 'quizzes.html' },
        { key: 'los', icon: 'fa-cubes', href: 'learning-objects.html' },
        { key: 'ai', icon: 'fa-wand-magic-sparkles', href: 'ai-generator.html' },
      ],

      /* ---------- الإشعارات (مشتقة للمعلم: التصحيح المعلّق + قرارات المراجعة) ---------- */
      notifications: [],
      buildNotifications() {
        const list = [];
        const pend = this.pendingAttempts;
        if (pend.length) {
          list.push({ id: 'grading', kind: 'grading', n: pend.length, at: pend[pend.length - 1].submittedAt,
            href: 'quiz-grading.html?attempt=' + encodeURIComponent(pend[0].id), read: false, ...NOTIF_STYLE.grading });
        }
        const week = 7 * 86400000;
        TC.REVIEW_ITEMS.filter((r) => r.decidedAt && NOTIF_KEYS[r.status]).forEach((r) => {
          list.push({ id: r.id, kind: r.status, title: r.title, at: r.decidedAt, href: 'ReviewQueue.html',
            read: Date.now() - Date.parse(r.decidedAt) > week, ...NOTIF_STYLE[r.status] });
        });
        list.sort((a, b) => String(b.at).localeCompare(String(a.at)));
        this.notifications = list;
      },
      notifText(n) {
        if (n.kind === 'grading') return this.tf('notif.pendingGrading', { n: this.num(n.n) });
        return this.tf(NOTIF_KEYS[n.kind], { title: this.L(n.title) });
      },
      get unread() { return this.notifications.filter((n) => !n.read).length; },
      markAllRead() {
        this.notifications.forEach((n) => { n.read = true; });
        this.liveMsg = this.t('allRead');
      },

      /* ---------- عامة ---------- */
      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        this.buildNotifications();
        this.syncTitle();
        if (this.$watch) this.$watch('locale', () => this.syncTitle());
        this._tick = setInterval(() => { this.nowTick = Date.now(); }, 60000);
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      closeAll() {
        this.notifOpen = false; this.profileOpen = false; this.mobileNav = false;
      },
    };
  }
</script>
