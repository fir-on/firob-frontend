      get statusOptions() { return [{ value: 'all', label: this.t('cp.filterStatusAll') }, ...STATUSES.map(s => ({ value: s, label: this.t('st.' + s) }))]; },
      get sortOptions() {
        return SORT_KEYS.flatMap(k => ['asc', 'desc'].map(d => ({ value: k + '_' + d, label: this.t('cp.sortOpt.' + k) + ' — ' + this.t(d === 'asc' ? 'cp.sortAsc' : 'cp.sortDesc') })));
      },
      get sortValue() { return this.sortKey + '_' + this.sortDir; },
      setSortValue(v) { const i = v.lastIndexOf('_'); const k = v.slice(0, i), d = v.slice(i + 1); if (!SORT_KEYS.includes(k)) return; this.sortKey = k; this.sortDir = d === 'desc' ? 'desc' : 'asc'; this.page = 1; this.syncUrl(); this.announceSort(); },

      setCourse(v) { if (v === this.fCourse) return; this.fCourse = v; this.fUnit = 'all'; this.fLesson = 'all'; this.onFilterChange(); },
      setUnit(v) { if (v === this.fUnit) return; this.fUnit = v; this.fLesson = 'all'; this.onFilterChange(); },
      setLesson(v) { this.fLesson = v; this.onFilterChange(); },
      setBloom(v) { this.fBloom = v; this.onFilterChange(); },
      setClass(v) { this.fClass = v; this.onFilterChange(); },
      setStatus(v) { this.fStatus = v; this.onFilterChange(); },
      /** مفتاح «الناقصة فقط» = اختصار لفلتر حالة التصنيف (incomplete) */
      get incompleteOnly() { return this.fClass === 'incomplete'; },
      toggleIncomplete() { this.setClass(this.incompleteOnly ? 'all' : 'incomplete'); },

      get hasFilters() { return !!this.search.trim() || ['fCourse', 'fUnit', 'fLesson', 'fBloom', 'fClass', 'fStatus'].some(k => this[k] !== 'all'); },
      resetFilters() {
        this.search = ''; this.fCourse = 'all'; this.fUnit = 'all'; this.fLesson = 'all'; this.fBloom = 'all'; this.fClass = 'all'; this.fStatus = 'all';
        this.onFilterChange();
      },

      get filtered() {
        const terms = TC.normalize(this.search).split(' ').filter(Boolean);
        return this.rows.filter(r =>
          (this.fCourse === 'all' || r.k.courseId === this.fCourse) &&
          (this.fUnit === 'all' || r.k.unitId === this.fUnit) &&
          (this.fLesson === 'all' || (this.fLesson === 'none' ? !r.k.lessonId : r.k.lessonId === this.fLesson)) &&
          (this.fBloom === 'all' || (this.fBloom === 'none' ? !r.k.bloom : r.k.bloom === this.fBloom)) &&
          (this.fClass === 'all' || (this.fClass === 'classified') === r.classified) &&
          (this.fStatus === 'all' || r.k.status === this.fStatus) &&
          terms.every(w => r.hay.includes(w)));
      },
      pathKey(r) {
        const ci = TC.COURSES.findIndex(c => c.id === r.k.courseId);
        const ui = r.course ? r.course.units.findIndex(u => u.id === r.k.unitId) : -1;
        const li = r.unit && r.k.lessonId ? r.unit.lessons.findIndex(l => l.id === r.k.lessonId) : 99;
        return (ci < 0 ? 99 : ci) * 10000 + (ui < 0 ? 99 : ui) * 100 + li;
      },
      get sorted() {
        const k = this.sortKey, dir = this.sortDir === 'asc' ? 1 : -1;
        const coll = new Intl.Collator(intlLoc(this.locale), { numeric: true, sensitivity: 'base' });
        const val = (r) => k === 'code' ? r.code : k === 'name' ? this.loc(r.k.name) : k === 'path' ? this.pathKey(r)
          : k === 'bloom' ? (r.k.bloom ? BLOOMS.indexOf(r.k.bloom) : 99) : k === 'class' ? (r.classified ? 1 : 0) : r[k];
        return this.filtered.slice().sort((a, b) => {
          const va = val(a), vb = val(b);
          const c = typeof va === 'string' ? coll.compare(va, vb) : va - vb;
          return c * dir || coll.compare(a.code, b.code);
        });
      },
      get pageCount() { return Math.max(1, Math.ceil(this.filtered.length / this.pageSize)); },
      get curPage() { return Math.min(Math.max(1, this.page), this.pageCount); },
      get paged() { const s = (this.curPage - 1) * this.pageSize; return this.sorted.slice(s, s + this.pageSize); },
      get rangeText() {
        const n = this.filtered.length;
        const a = n ? (this.curPage - 1) * this.pageSize + 1 : 0;
        const b = Math.min(n, this.curPage * this.pageSize);
        return this.tf('cp.range', { a: this.fmtNum(a), b: this.fmtNum(b), n: this.fmtNum(n) });
      },
      get pageItems() {
        const n = this.pageCount, c = this.curPage;
        if (n <= 7) return Array.from({ length: n }, (_, i) => i + 1);
        const out = [1];
        const s = Math.max(2, c - 1), e = Math.min(n - 1, c + 1);
        if (s > 2) out.push('…a');
        for (let i = s; i <= e; i++) out.push(i);
        if (e < n - 1) out.push('…b');
        out.push(n);
        return out;
      },
      goPage(p) { this.page = Math.min(Math.max(1, p), this.pageCount); this.syncUrl(); this.$nextTick(() => document.getElementById('concepts-title')?.scrollIntoView?.({ block: 'nearest' })); },

      sortBy(k) {
        if (!SORT_KEYS.includes(k)) return;
        if (this.sortKey === k) this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
        else { this.sortKey = k; this.sortDir = DEFAULT_DIR[k]; }
        this.page = 1; this.syncUrl(); this.announceSort();
      },
      announceSort() { this.liveMsg = this.tf('cp.liveSorted', { col: this.t('cp.sortOpt.' + this.sortKey), dir: this.t(this.sortDir === 'asc' ? 'cp.sortAsc' : 'cp.sortDesc') }); },
      ariaSort(k) { return this.sortKey === k ? (this.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'; },
      sortIcon(k) { return this.sortKey !== k ? 'fa-sort text-muted' : (this.sortDir === 'asc' ? 'fa-sort-up text-brand' : 'fa-sort-down text-brand'); },

      onFilterChange() { this.page = 1; this.syncUrl(); this.announce(); },
      announce() { this.liveMsg = this.tf('cp.liveCount', { n: this.fmtNum(this.filtered.length) }); },

      /* ---------- مزامنة الرابط ---------- */
      readUrl() {
        let p;
        try { p = new URLSearchParams(location.search || ''); } catch (e) { return null; }
        const c = p.get('course'); const course = c && TC.course(c);
        if (course) {
          this.fCourse = course.id;
          const u = p.get('unit'); const unit = u && course.units.find(x => x.id === u);
          if (unit) {
            this.fUnit = unit.id;
            const l = p.get('lesson'); if (l === 'none' || (l && unit.lessons.some(x => x.id === l))) this.fLesson = l;
          }
        }
        const bl = p.get('bloom'); if (bl === 'none' || BLOOMS.includes(bl)) this.fBloom = bl;
        const cl = p.get('class'); if (CLASSES.includes(cl)) this.fClass = cl;
        if (p.get('incomplete') === '1') this.fClass = 'incomplete';
        const st = p.get('status'); if (STATUSES.includes(st)) this.fStatus = st;
        const q = p.get('q'); if (q) this.search = q.slice(0, 100);
        const sk = p.get('sort'); if (SORT_KEYS.includes(sk)) { this.sortKey = sk; this.sortDir = DEFAULT_DIR[sk]; }
        const dir = p.get('dir'); if (dir === 'asc' || dir === 'desc') this.sortDir = dir;
        const pg = parseInt(p.get('page'), 10); if (pg > 0) this.page = pg;
        this.page = this.curPage;
        return p.get('id') || p.get('concept');
      },
      urlQuery() {
        const p = new URLSearchParams();
        if (this.search.trim()) p.set('q', this.search.trim());
        if (this.fCourse !== 'all') p.set('course', this.fCourse);
        if (this.fUnit !== 'all') p.set('unit', this.fUnit);
        if (this.fLesson !== 'all') p.set('lesson', this.fLesson);
        if (this.fBloom !== 'all') p.set('bloom', this.fBloom);
        if (this.fClass !== 'all') p.set('class', this.fClass);
        if (this.fStatus !== 'all') p.set('status', this.fStatus);
        if (this.sortKey !== DEFAULT_SORT || this.sortDir !== DEFAULT_DIR[DEFAULT_SORT]) { p.set('sort', this.sortKey); p.set('dir', this.sortDir); }
        if (this.curPage > 1) p.set('page', String(this.curPage));
        if (this.detailsOpen && this.detailsId) p.set('id', this.detailsId);
        return p.toString();
      },
      syncUrl() {
        const qs = this.urlQuery();
        try { history.replaceState(history.state ?? null, '', location.pathname + (qs ? '?' + qs : '')); } catch (e) {}
      },

      /* ---------- طريقة العرض (radiogroup، تُحفظ محليًا) ---------- */
      view: 'list',
      setView(v, focus = false) {
        if (v !== 'list' && v !== 'tree') return;
        const changed = v !== this.view;
        this.view = v;
        try { localStorage.setItem(VIEW_KEY, v); } catch (e) {}
        if (changed) this.liveMsg = this.tf('cp.liveView', { view: this.t(v === 'list' ? 'cp.viewList' : 'cp.viewTree') });
        if (focus) this.$nextTick(() => document.getElementById('view-' + v)?.focus());
      },
      onViewKey(e) {
        const rtl = this.locale === 'ar';
        const next = { ArrowDown: 1, ArrowUp: -1, ArrowRight: rtl ? -1 : 1, ArrowLeft: rtl ? 1 : -1 }[e.key];
        const views = ['list', 'tree'];
        if (next) { e.preventDefault(); const i = (views.indexOf(this.view) + next + views.length) % views.length; this.setView(views[i], true); }
        else if (e.key === 'Home') { e.preventDefault(); this.setView('list', true); }
        else if (e.key === 'End') { e.preventDefault(); this.setView('tree', true); }
      },

      /* ---------- عرض الصفوف ---------- */
      name(r) { return this.loc((r.k || r).name); },
      altName(r) { return TC.loc((r.k || r).name, this.otherLocale); },
      courseTone(r) { return COURSE_TONE[r.course?.color] || COURSE_TONE.primary; },
      statusMeta(s) { return Object.assign({ label: this.t('st.' + s) }, STATUS_META[s] || STATUS_META.draft); },
      bloomLabel(b) { return this.t('bloom.' + (b || 'none')); },
      bloomBadge(b) { return BLOOM_BADGE[b] || 'badge-muted'; },
      diffLabel(d) { return this.t('diff.' + (d || 'none')); },
      pathText(r) { return [this.loc(r.course?.title), this.loc(r.unit?.title), r.lesson ? this.loc(r.lesson.title) : this.t('cp.lessonMissing')].join(' › '); },
      loHref(o) { return 'learning-objects.html?lo=' + encodeURIComponent(o.id); },
      quizHref(qz) { return 'quiz-builder.html?quiz=' + encodeURIComponent(qz.code); },

      /** الحذف مسموح فقط بلا عناصر تعليمية ولا أسئلة ولا مفاهيم تعتمد عليه */
      deleteInfo(r) {
        const reasons = [];
        if (r.los) reasons.push(this.tf('cp.reason.los', { n: this.fmtNum(r.los) }));
        if (r.questions) reasons.push(this.tf('cp.reason.questions', { n: this.fmtNum(r.questions) }));
        if (r.dependents) reasons.push(this.tf('cp.reason.dependents', { n: this.fmtNum(r.dependents) }));
        const name = this.name(r);
        return reasons.length
          ? { ok: false, tip: this.t('cp.act.deleteBlocked'), label: this.tf('cp.act.deleteBlockedFor', { name, reasons: this.listFmt(reasons) }) }
          : { ok: true, tip: this.t('cp.act.delete'), label: this.tf('cp.act.deleteFor', { name }) };
      },
      explain(msg) { this.liveMsg = msg; this.toast(msg, 'info'); },
      toast(msg, icon = 'success') {
        if (window.Swal) Swal.fire({ toast: true, position: 'top-end', icon, titleText: msg, showConfirmButton: false, timer: 3500, customClass: { popup: 'firob-swal firob-toast' } });
      },
      revealRow(id) {
        const visible = this.filtered.some(x => x.id === id);
        if (visible && this.view === 'list') { const pos = this.sorted.findIndex(x => x.id === id); this.page = Math.floor(pos / this.pageSize) + 1; this.syncUrl(); }
        if (visible && this.view === 'tree') this.expandTo(id);
        return visible;
      },
      uniqueCode(base) {
        const taken = new Set(this.concepts.map(k => k.code.toUpperCase()));
        let code = base.toUpperCase() + '-COPY', i = 2;
        while (taken.has(code)) code = base.toUpperCase() + '-COPY-' + i++;
        return code;
      },

      /* ---------- نسخ (مسودة جديدة حقيقية) + تراجع ---------- */
      duplicate(r) {
        const src = this.findConcept(r.id); if (!src) return null;
        const copy = TC.clone(src);
        Object.assign(copy, {
          id: TC.uid('K'), code: this.uniqueCode(src.code), status: 'draft',
          name: { ar: this.tIn('ar', 'cp.copyOf', { name: src.name.ar }), en: this.tIn('en', 'cp.copyOf', { name: src.name.en }) },
          updatedAt: nowIso(),
        });
        copy.classified = this.isClassified(copy);
        this.concepts.splice(this.concepts.indexOf(src) + 1, 0, copy);
        const visible = this.revealRow(copy.id);
        const msg = this.tf('cp.duplicated', { name: this.loc(copy.name), code: copy.code });
        this.startUndo({ kind: 'dup', id: copy.id, msg: visible ? msg : this.tf('cp.savedHidden', { msg }) });
        this.toast(msg);
        return copy;
      },

      /* ---------- حذف (بلا اعتماديات) + تأكيد + تراجع ---------- */
      deleteId: null, deleteOpen: false, _delOpener: null,
      get deleteRow() { return this.deleteId ? this.rowById(this.deleteId) : null; },
      askDelete(r, ev) {
        const info = this.deleteInfo(r);
        if (!info.ok) { this.explain(info.label); return false; }
        this._delOpener = (ev && ev.currentTarget) || document.activeElement;
        this.deleteId = r.id; this.deleteOpen = true;
        return true;
      },
      closeDelete(restoreFocus = true) {
        if (this.busy || !this.deleteOpen) return;
        this.deleteOpen = false;
        const opener = this._delOpener;
        if (restoreFocus) this.$nextTick(() => { try { opener && opener.isConnected !== false && opener.focus && opener.focus(); } catch (e) {} });
        setTimeout(() => { if (!this.deleteOpen) this.deleteId = null; }, 220);
      },
      confirmDelete() {
        const r = this.deleteRow; if (!r || this.busy) return false;
        if (!this.deleteInfo(r).ok) { this.closeDelete(); this.explain(this.deleteInfo(r).label); return false; }
        const idx = this.concepts.findIndex(k => k.id === r.id);
        const [concept] = this.concepts.splice(idx, 1);
        this.deleteOpen = false; this.deleteId = null;
        this.page = this.curPage; this.syncUrl();
        this.startUndo({ kind: 'del', concept, idx, msg: this.tf('cp.deleted', { name: this.loc(concept.name) }) });
        return true;
      },

      /* ---------- شريط التراجع (6 ثوانٍ) ---------- */
      undo: null, _undoTimer: null,
      get undoMs() { return UNDO_MS; },
      startUndo(u) {
        this.finalizeUndo();
        this.undo = u;
        this.liveMsg = u.msg;
        this._undoTimer = setTimeout(() => this.finalizeUndo(), UNDO_MS);
        this.$nextTick(() => { try { this.$refs.undoBtn?.focus(); } catch (e) {} });
      },
      undoLast() {
        const u = this.undo; if (!u) return false;
        clearTimeout(this._undoTimer);
        if (u.kind === 'del') {
          this.concepts.splice(Math.min(u.idx, this.concepts.length), 0, u.concept);
          this.liveMsg = this.tf('cp.undone', { name: this.loc(u.concept.name) });
        } else {
          const k = this.findConcept(u.id);
          if (k && this.dependentsOf(k.id).length) { this.undo = null; this.explain(this.tf('cp.dupUndoBlocked', { name: this.loc(k.name) })); return false; }
          if (k) this.concepts.splice(this.concepts.indexOf(k), 1);
          this.page = this.curPage;
          this.liveMsg = this.tf('cp.dupUndone', { name: k ? this.loc(k.name) : '' });
        }
        this.undo = null; this.syncUrl();
        return true;
      },
      finalizeUndo() { clearTimeout(this._undoTimer); this._undoTimer = null; this.undo = null; },

      /* ---------- الشجرة (role="tree"، عناصر مسطّحة مع aria-level/setsize/posinset) ---------- */
      treeOpen: {}, treeFocusId: null, _typed: '', _typedAt: 0,
      nodeDomId(id) { return 'tn-' + domId(id); },
      isOpen(id) { return this.treeOpen[id] !== undefined ? this.treeOpen[id] : !id.startsWith('k:'); },
      get treeRoots() {
        const rows = this.sorted.slice().sort((a, b) => this.pathKey(a) - this.pathKey(b) || a.code.localeCompare(b.code));
        const prune = this.hasFilters;
        const cNode = (r) => ({ type: 'concept', id: 'k:' + r.id, row: r, label: this.name(r),
          children: r.k.prerequisites.map(pid => { const t = this.findConcept(pid); return { type: 'prereq', id: 'p:' + r.id + ':' + pid, target: pid, label: this.tf('cp.prereqNode', { name: t ? this.loc(t.name) : pid }), children: [] }; }) });
        const out = [];
        for (const c of TC.COURSES) {
          const units = [];
          for (const u of c.units) {
            const children = [];
            for (const l of u.lessons) {
              const ks = rows.filter(r => r.k.courseId === c.id && r.k.unitId === u.id && r.k.lessonId === l.id).map(cNode);
              if (!prune || ks.length) children.push({ type: 'lesson', id: 'l:' + l.id, label: this.loc(l.title), count: ks.length, children: ks });
            }
            children.push(...rows.filter(r => r.k.courseId === c.id && r.k.unitId === u.id && !r.k.lessonId).map(cNode));
            if (!prune || children.length) units.push({ type: 'unit', id: 'u:' + u.id, label: this.loc(u.title), count: rows.filter(r => r.k.unitId === u.id && r.k.courseId === c.id).length, children });
          }
          if (!prune || units.length) out.push({ type: 'course', id: 'c:' + c.id, course: c, label: this.loc(c.title), count: rows.filter(r => r.k.courseId === c.id).length, children: units });
        }
        return out;
      },
      /** عقد ظاهرة فقط (الآباء مفتوحون) مسطّحة بترتيب العرض */
      get visibleNodes() {
        const out = [];
        const walk = (nodes, level, parentId) => nodes.forEach((n, i) => {
          const has = n.children.length > 0;
          const open = has && this.isOpen(n.id);
          out.push(Object.assign({}, n, { level, posinset: i + 1, setsize: nodes.length, parentId, hasChildren: has, open }));
          if (open) walk(n.children, level + 1, n.id);
        });
        walk(this.treeRoots, 1, null);
        return out;
      },
      get treeTabId() { const v = this.visibleNodes; return v.some(n => n.id === this.treeFocusId) ? this.treeFocusId : (v[0] ? v[0].id : null); },
      setOpen(id, open) { this.treeOpen = Object.assign({}, this.treeOpen, { [id]: open }); },
      focusNode(id) {
        this.treeFocusId = id;
        this.$nextTick(() => { try { document.getElementById(this.nodeDomId(id))?.focus(); } catch (e) {} });
      },
      /** يفتح الأسلاف حتى يظهر المفهوم، ويعيد معرّف عقدته أو null إن كان مخفيًا بالفلاتر */
      expandTo(conceptId) {
        const target = 'k:' + conceptId;
        const trail = [];
        const find = (nodes) => { for (const n of nodes) { if (n.id === target) return true; trail.push(n.id); if (find(n.children)) return true; trail.pop(); } return false; };
        if (!find(this.treeRoots)) return null;
        const patch = {}; trail.forEach(id => { patch[id] = true; });
        this.treeOpen = Object.assign({}, this.treeOpen, patch);
        return target;
      },
      goToConcept(id, ev) {
        const k = this.findConcept(id); if (!k) return false;
        const node = this.expandTo(k.id);
        if (!node) { this.openDetails(k.id, ev); this.liveMsg = this.tf('cp.hiddenTarget', { name: this.loc(k.name) }); return false; }
        this.focusNode(node);
        this.liveMsg = this.tf('cp.movedTo', { name: this.loc(k.name) });
        return true;
      },
      activateNode(n, ev) {
        if (n.type === 'concept') this.openDetails(n.row.id, ev);
        else if (n.type === 'prereq') this.goToConcept(n.target, ev);
        else if (n.hasChildren) this.setOpen(n.id, !n.open);
      },
      nodeClick(n, ev) { this.treeFocusId = n.id; this.activateNode(n, ev); },
      toggleNode(n) { if (n.hasChildren) { this.treeFocusId = n.id; this.setOpen(n.id, !n.open); } },
      onTreeKey(e, n) {
        const v = this.visibleNodes;
        const i = v.findIndex(x => x.id === n.id);
        if (i < 0) return;
        const rtl = this.locale === 'ar';
        const inward = rtl ? 'ArrowLeft' : 'ArrowRight';
        const outward = rtl ? 'ArrowRight' : 'ArrowLeft';
        const k = e.key;
        const stop = () => { e.preventDefault(); e.stopPropagation && e.stopPropagation(); };
        if (k === 'ArrowDown') { stop(); if (v[i + 1]) this.focusNode(v[i + 1].id); }
        else if (k === 'ArrowUp') { stop(); if (v[i - 1]) this.focusNode(v[i - 1].id); }
        else if (k === 'Home') { stop(); this.focusNode(v[0].id); }
        else if (k === 'End') { stop(); this.focusNode(v[v.length - 1].id); }
        else if (k === inward) {
          stop();
          if (n.hasChildren && !n.open) this.setOpen(n.id, true);
          else if (n.hasChildren && n.open && v[i + 1]) this.focusNode(v[i + 1].id);
        }
        else if (k === outward) {
          stop();
          if (n.hasChildren && n.open) this.setOpen(n.id, false);
          else if (n.parentId) this.focusNode(n.parentId);
        }
        else if (k === 'Enter') { stop(); this.activateNode(n, e); }
        else if (k === ' ') { stop(); if (n.hasChildren) this.setOpen(n.id, !n.open); else this.activateNode(n, e); }
        else if (k === '*') { stop(); const sibs = v.filter(x => x.parentId === n.parentId && x.hasChildren); const patch = {}; sibs.forEach(x => { patch[x.id] = true; }); this.treeOpen = Object.assign({}, this.treeOpen, patch); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          stop();
          const now = Date.now();
          this._typed = (now - this._typedAt > 700 ? '' : this._typed) + k;
          this._typedAt = now;
          const q = TC.normalize(this._typed);
          const order = v.slice(i + 1).concat(v.slice(0, i + 1));
          const hit = order.find(x => TC.normalize(x.label).startsWith(q));
          if (hit) this.focusNode(hit.id);
        }
      },
      nodeAria(n) {
        if (n.type === 'concept') {
          const r = n.row;
          return [this.name(r), r.code, this.bloomLabel(r.k.bloom), this.t('cls.' + (r.classified ? 'classified' : 'incomplete')),
            r.prereqs ? this.tf('cp.prereqsN', { n: this.fmtNum(r.prereqs) }) : this.t('cp.noPrereqs')].join(this.locale === 'ar' ? '، ' : ', ');
        }
        if (n.type === 'prereq') { const t = this.findConcept(n.target); return n.label + (t ? ' (' + t.code + ')' : ''); }
        return n.label + ' — ' + (n.count ? this.tf('cp.conceptsN', { n: this.fmtNum(n.count) }) : this.t('cp.treeEmptyLesson'));
      },

      /* ---------- لوحة التفاصيل (dialog) ---------- */
      detailsOpen: false, detailsId: null, _detOpener: null, _detClear: null,
      get detailsRow() { return this.detailsId ? this.rowById(this.detailsId) : null; },
      get details() {
        const r = this.detailsRow; if (!r) return null;
        return {
          r,
          prereqs: r.k.prerequisites.map(id => this.findConcept(id)).filter(Boolean),
          requiredBy: this.dependentsOf(r.id),
          los: this.losOf(r.id),
          questions: this.questionsOf(r.id),
        };
      },
      openDetails(id, ev) {
        const k = this.findConcept(id); if (!k) return false;
        if (!this.detailsOpen) this._detOpener = (ev && ev.currentTarget) || document.activeElement;
        clearTimeout(this._detClear);
        this.detailsId = k.id; this.detailsOpen = true;
        this.syncUrl();
        this.$nextTick(() => { try { document.getElementById('details-title')?.focus(); } catch (e) {} });
        return true;
      },
      closeDetails(restoreFocus = true) {
        if (!this.detailsOpen) return;
        this.detailsOpen = false;
        this.syncUrl();
        const opener = this._detOpener;
        if (restoreFocus) this.$nextTick(() => { try { opener && opener.isConnected !== false && opener.focus && opener.focus(); } catch (e) {} });
        this._detClear = setTimeout(() => { if (!this.detailsOpen) this.detailsId = null; }, 320);
      },
      editFromDetails() {
        const r = this.detailsRow; if (!r) return;
        const opener = this._detOpener;
        this.closeDetails(false);
        this.openEditor(r, null, null, opener);
      },

      /* ---------- محرّر المفهوم (للمعلم) ---------- */
      editorOpen: false, editorMode: 'add', form: emptyForm(), submitted: false, busy: false, _edOpener: null, _edClear: null,
      get formCourse() { return this.form.courseId ? TC.course(this.form.courseId) : null; },
      get formUnit() { return this.formCourse && this.form.unitId ? TC.unit(this.form.courseId, this.form.unitId) : null; },
      get editorTitle() { return this.t(this.editorMode === 'add' ? 'cp.editorAdd' : this.editorMode === 'complete' ? 'cp.editorComplete' : 'cp.editorEdit'); },
      openEditor(r, ev, focusField, opener) {
        this._edOpener = opener || (ev && ev.currentTarget) || document.activeElement;
        clearTimeout(this._edClear);
        const k = r ? this.findConcept(r.id) : null;
        this.form = k ? { id: k.id, nameAr: k.name.ar, nameEn: k.name.en, code: k.code, courseId: k.courseId || '', unitId: k.unitId || '', lessonId: k.lessonId || '',
          bloom: k.bloom || '', difficulty: k.difficulty || '', prerequisites: k.prerequisites.slice() } : emptyForm();
        if (!k && this.fCourse !== 'all') { this.form.courseId = this.fCourse; if (this.fUnit !== 'all') this.form.unitId = this.fUnit; if (this.fLesson !== 'all' && this.fLesson !== 'none') this.form.lessonId = this.fLesson; }
        this.editorMode = !k ? 'add' : (focusField ? 'complete' : 'edit');
        this.submitted = false;
        this.editorOpen = true;
        const target = focusField ? { lesson: this.form.unitId ? 'ce-lesson' : 'ce-unit', bloom: 'ce-bloom', difficulty: 'ce-diff' }[focusField] : 'ce-nameAr';
        this.$nextTick(() => setTimeout(() => { try { document.getElementById(target)?.focus(); } catch (e) {} }, 60));
        return true;
      },
      closeEditor() {
        if (this.busy || !this.editorOpen) return;
        this.editorOpen = false;
        const opener = this._edOpener;
        this.$nextTick(() => { try { opener && opener.isConnected !== false && opener.focus && opener.focus(); } catch (e) {} });
        this._edClear = setTimeout(() => { if (!this.editorOpen) { this.form = emptyForm(); this.submitted = false; } }, 320);
      },
      onFormCourse() {
        this.form.unitId = ''; this.form.lessonId = '';
        const before = this.form.prerequisites.length;
        this.form.prerequisites = this.form.prerequisites.filter(id => { const p = this.findConcept(id); return p && p.courseId === this.form.courseId; });
        const dropped = before - this.form.prerequisites.length;
        if (dropped) this.liveMsg = this.tf('cp.prereqsDropped', { n: this.fmtNum(dropped) });
      },
      onFormUnit() { this.form.lessonId = ''; },
      /** الرسم بعد تطبيق متطلبات النموذج على المفهوم قيد التحرير */
      formGraph(prereqs) {
        const g = this.graph;
        g[this.form.id || '__new__'] = (prereqs || this.form.prerequisites).slice();
        return g;
      },
      codeOf(id) { const k = this.findConcept(id); return k ? k.code : (this.form.code.trim() || '?'); },
      chainText(ids) { return ids.map(id => this.codeOf(id)).join(' → '); },
      /** سلسلة الحلقة إن أُضيف candidate كمتطلّب للمفهوم قيد التحرير: [self, candidate, …, self] أو null */
      cycleIfAdded(candidateId) {
        const self = this.form.id; if (!self) return null;
        if (candidateId === self) return [self, self];
        const p = pathTo(this.formGraph(), candidateId, self);
        return p ? [self].concat(p) : null;
      },
      get prereqCandidates() {
        if (!this.form.courseId) return [];
        return this.concepts.filter(k => k.courseId === this.form.courseId && k.id !== this.form.id).map(k => {
          const checked = this.form.prerequisites.includes(k.id);
          const cyc = checked ? null : this.cycleIfAdded(k.id);
          return { id: k.id, code: k.code, name: this.loc(k.name), checked, disabled: !!cyc, reason: cyc ? this.tf('cp.f.cycleReason', { chain: this.chainText(cyc) }) : '' };
        });
      },
      togglePrereq(id) {
        const i = this.form.prerequisites.indexOf(id);
        if (i > -1) { this.form.prerequisites.splice(i, 1); return true; }
        const cyc = this.cycleIfAdded(id);
        if (cyc) { this.explain(this.tf('cp.f.cycleReason', { chain: this.chainText(cyc) })); return false; }
        this.form.prerequisites.push(id);
        return true;
      },
      get formMissing() { return this.missingOf({ courseId: this.form.courseId, unitId: this.form.unitId, lessonId: this.form.lessonId, bloom: this.form.bloom, difficulty: this.form.difficulty }); },
      get formClassified() { return this.formMissing.length === 0; },
      validate() {
        const f = this.form, e = {};
        const ar = f.nameAr.trim(), en = f.nameEn.trim(), code = f.code.trim();
        if (!ar) e.nameAr = this.t('cp.err.nameArReq'); else if (ar.length > NAME_MAX) e.nameAr = this.tf('cp.err.nameLong', { n: this.fmtNum(NAME_MAX) });
        if (!en) e.nameEn = this.t('cp.err.nameEnReq'); else if (en.length > NAME_MAX) e.nameEn = this.tf('cp.err.nameLong', { n: this.fmtNum(NAME_MAX) });
        if (!code) e.code = this.t('cp.err.codeReq');
        else if (!CODE_RE.test(code)) e.code = this.t('cp.err.codePattern');
        else {
          const other = this.concepts.find(k => k.id !== f.id && k.code.toUpperCase() === code.toUpperCase());
          if (other) e.code = this.tf('cp.err.codeTaken', { code: other.code, name: this.loc(other.name) });
        }
        if (!f.courseId || !TC.course(f.courseId)) e.courseId = this.t('cp.err.courseReq');
        else if (!f.unitId || !TC.unit(f.courseId, f.unitId)) e.unitId = this.t('cp.err.unitReq');
        if (f.prerequisites.some(id => { const p = this.findConcept(id); return !p || p.courseId !== f.courseId || id === f.id; })) e.prerequisites = this.t('cp.err.crossCourse');
        else if (f.id) {
          const cyc = findCycle(this.formGraph(), f.id);
          if (cyc) e.prerequisites = this.tf('cp.err.cycle', { chain: this.chainText(cyc) });
        }
        return e;
      },
      get errors() { return this.submitted ? this.validate() : {}; },
      get errorList() { const e = this.errors; return ['nameAr', 'nameEn', 'code', 'courseId', 'unitId', 'prerequisites'].filter(k => e[k]).map(k => ({ field: k, msg: e[k] })); },
      fieldDomId(f) { return { nameAr: 'ce-nameAr', nameEn: 'ce-nameEn', code: 'ce-code', courseId: 'ce-course', unitId: 'ce-unit', prerequisites: 'ce-prereqs' }[f]; },
      focusField(f) {
        this.$nextTick(() => {
          try {
            const el = document.getElementById(this.fieldDomId(f));
            if (f === 'prerequisites') (el?.querySelector('input:not([disabled])') || el)?.focus();
            else el?.focus();
          } catch (e) {}
        });
      },
      async save() {
        if (this.busy) return false;
        this.submitted = true;
        const list = this.errorList;
        if (list.length) { this.focusField(list[0].field); this.liveMsg = this.tf('cp.err.summary', { n: this.fmtNum(list.length) }); return false; }
        this.busy = true;
        await new Promise(r => setTimeout(r, 250));
        const f = this.form;
        const data = {
          code: f.code.trim(), name: { ar: f.nameAr.trim(), en: f.nameEn.trim() },
          courseId: f.courseId, unitId: f.unitId, lessonId: f.lessonId || null,
          bloom: f.bloom || null, difficulty: f.difficulty || null,
          prerequisites: f.prerequisites.slice(), status: 'review', updatedAt: nowIso(),
        };
        data.classified = this.isClassified(data);
        let k = f.id ? this.findConcept(f.id) : null;
        const isNew = !k;
        if (k) Object.assign(k, data);
        else { k = Object.assign({ id: TC.uid('K') }, data); this.concepts.push(k); }
        this.busy = false;
        const msg = isNew ? this.tf('cp.added', { name: this.loc(k.name), code: k.code }) : this.tf('cp.saved', { name: this.loc(k.name) });
        const visible = this.revealRow(k.id);
        this.liveMsg = visible ? msg : this.tf('cp.savedHidden', { msg });
        this.toast(msg);
        this.closeEditor();
        return k;
      },

      /* ---------- عامة ---------- */
      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; this.wide = m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        try { const v = localStorage.getItem(VIEW_KEY); if (v === 'list' || v === 'tree') this.view = v; } catch (e) {}
        document.title = this.t('docTitle');
        const openId = this.readUrl();
        this.syncUrl();
        this.announce();
        this.$watch('search', () => this.onFilterChange());
        if (openId && this.findConcept(openId)) this.openDetails(openId);
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      /** Escape على مستوى النافذة يغلق القوائم فقط؛ النوافذ تعالج Escape بنفسها (.stop) */
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },
    };
  }
</script>
</body>
</html>
