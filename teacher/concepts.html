<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>شجرة المفاهيم — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* إلغاء أيقونة التفريغ الأصلية لحقول type="search" — تتعارض مع أيقونة البحث وزر التفريغ المخصص، وتسوء في RTL */
    input[type="search"]::-webkit-search-decoration,
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-results-button,
    input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- تلميحات أزرار الإجراءات (Action Tooltips) ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg border border-white/10 bg-slate-900/90 px-2.5 py-1 text-xs font-medium tracking-wide text-white opacity-0 shadow-xl backdrop-blur-md transition-all duration-200 ease-out;
      @apply dark:border-slate-800/20 dark:bg-slate-100 dark:text-slate-900;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-slate-900/90 opacity-0 transition-all duration-200 ease-out;
      @apply dark:border-t-slate-100;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  {@apply bg-accent-500/20 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }
    .badge-warning { @apply bg-warning-500/15 text-warning-700 dark:text-warning-500; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-line-strong; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-4 py-2.5 text-start text-sm font-medium text-ink transition-colors hover:bg-soft; }
    .combo-option.is-active   { @apply bg-soft; }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }
    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- النافذة المنبثقة / اللوحة الجانبية ---------- */
    .modal-panel { @apply relative flex max-h-[90dvh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }

    /* ---------- مقياس الحصة / شريط التقدّم (QuotaMeter) ---------- */
    .quota-track { @apply h-1.5 w-full overflow-hidden rounded-full bg-line; }
    .quota-fill { @apply h-full rounded-full transition-all duration-500; }

    /* ---------- مفتاح التبديل (Settings Switch) ---------- */
    .switch-track { @apply relative inline-flex h-6 w-11 shrink-0 cursor-pointer items-center rounded-full border border-line-strong/30 bg-line transition-colors duration-200; }
    .switch-track[aria-checked="true"] { @apply border-transparent bg-primary-500; }
    .switch-track:disabled, .switch-track[aria-disabled="true"] { @apply cursor-not-allowed opacity-50; }
    .switch-knob { @apply inline-block h-5 w-5 translate-x-0.5 rounded-full bg-card shadow transition-transform duration-200 ltr:translate-x-0.5 rtl:-translate-x-0.5; }
    .switch-track[aria-checked="true"] .switch-knob { @apply ltr:translate-x-5 rtl:-translate-x-5; }

    /* ---------- بطاقة المقرر / المفهوم (Icon Chip) ---------- */
    .course-icon { @apply grid h-12 w-12 shrink-0 place-items-center rounded-xl text-lg; }
  }

    /* مفتاح التبديل: role=switch على الزر الحاوي */
    [role="switch"][aria-checked="true"] > .switch-track { @apply border-transparent bg-primary-500; }
    [role="switch"][aria-checked="true"] > .switch-track .switch-knob { @apply ltr:translate-x-5 rtl:-translate-x-5; }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }

    /* ---------- [layout: full-height sidebar + bottom footer] ---------- */
    html, body { min-height: 100%; }
    body { margin: 0; }
    .app-col { min-height: 100vh; min-height: 100dvh; }
    @media (min-width: 1024px) {
      #sidebar { height: 100vh; height: 100dvh; }
      .app-col { margin-inline-start: 18rem; transition: margin-inline-start .3s ease; }
      .app-col.is-collapsed { margin-inline-start: 5rem; }
      .save-bar { inset-inline-start: 18rem; transition: inset-inline-start .3s ease; }
      .save-bar.is-collapsed { inset-inline-start: 5rem; }
    }
</style>

<!-- ⑥ Alpine.js (+ Focus لحصر التركيز داخل النوافذ المنبثقة + Collapse) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- ⑦ SweetAlert2 -->
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5"></script>
</head>

<body x-data="conceptsManager()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch.focus(); }
                       else if ($event.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { $event.preventDefault(); $refs.conceptSearch?.focus(); }"
      @scroll.window="notifOpen = false" @resize.window="notifOpen = false"
      :class="{ 'overflow-hidden': (mobileNav && mobile) || detailsOpen || editorOpen || deleteOpen }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <span class="inline-flex min-w-0 flex-1 items-center gap-3" :class="!expanded && 'lg:flex-none lg:justify-center'">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </span>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-muted" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="item.count && expanded"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent"
                        x-text="item.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="app-col flex min-w-0 flex-1 flex-col" :class="collapsed && 'is-collapsed'">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex"><bdi dir="ltr">Ctrl K</bdi></kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">

            <span id="view-label" class="text-xs font-extrabold text-muted" x-text="t('cp.viewLabel')"></span>
            <div role="radiogroup" aria-labelledby="view-label" class="inline-flex rounded-xl border border-line bg-page/50 p-1" @keydown="onViewKey($event)">
              <button type="button" id="view-list" role="radio" :aria-checked="(view === 'list').toString()" :tabindex="view === 'list' ? 0 : -1" @click="setView('list')"
                      class="inline-flex items-center gap-2 rounded-lg px-3 py-1.5 text-sm font-bold transition focus-visible:ring-2"
                      :class="view === 'list' ? 'bg-primary-500 text-white shadow' : 'text-muted hover:bg-soft hover:text-ink'">
                <i class="fa-solid fa-table-list" aria-hidden="true"></i><span x-text="t('cp.viewList')"></span>
              </button>
              <button type="button" id="view-tree" role="radio" :aria-checked="(view === 'tree').toString()" :tabindex="view === 'tree' ? 0 : -1" @click="setView('tree')"
                      class="inline-flex items-center gap-2 rounded-lg px-3 py-1.5 text-sm font-bold transition focus-visible:ring-2"
                      :class="view === 'tree' ? 'bg-primary-500 text-white shadow' : 'text-muted hover:bg-soft hover:text-ink'">
                <i class="fa-solid fa-sitemap" aria-hidden="true"></i><span x-text="t('cp.viewTree')"></span>
              </button>
            </div>
            <p class="text-xs font-bold text-muted tabular-nums" x-text="view === 'list' ? rangeText : tf('cp.liveCount', { n: fmtNum(filtered.length) })"></p>
          </div>
          <template x-if="view === 'list' && !wide && filtered.length">
            <div class="w-full sm:w-64">
                    <div class="relative w-full shrink-0 "
                         x-data="selectDropdown({ id: 'cp-sort', options: () => sortOptions, get: () => sortValue, set: (v) => setSortValue(v) })"
                         @click.outside="closeList()">
                      <span id="cp-sort-label" class="sr-only" x-text="t('cp.sortLabel')"></span>
                      <button type="button" id="cp-sort" x-ref="btn" role="combobox" aria-haspopup="listbox"
                              aria-labelledby="cp-sort-label cp-sort" 
                              :aria-expanded="open.toString()" aria-controls="cp-sort-list"
                              :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                              class="field flex h-11 w-full items-center justify-between gap-2 text-start font-bold"
                              @click="toggleList()" @keydown="onKey($event)">
                        <span class="truncate" x-text="triggerLabel"></span>
                        <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
                      </button>
                      <ul x-show="open" x-cloak x-ref="list" id="cp-sort-list" role="listbox" aria-labelledby="cp-sort-label"
                          x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                        <template x-for="(item, idx) in items" :key="item.value">
                          <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                              class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                              @click="choose(item)" @mousemove="active = idx">
                            <span class="truncate" x-text="item.label"></span>
                            <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                          </li>
                        </template>
                      </ul>
                    </div>
            </div>
          </template>
        </div>

        <!-- حالة فارغة (للعرضين) -->
        <template x-if="!filtered.length">
          <div class="flex flex-col items-center gap-3 px-6 py-14 text-center">
            <span class="grid h-14 w-14 place-items-center rounded-full bg-soft text-xl text-brand" aria-hidden="true"><i class="fa-solid fa-diagram-project"></i></span>
            <p class="text-lg font-extrabold" x-text="rows.length ? t('cp.emptyTitle') : t('cp.emptyNone')"></p>
            <p class="max-w-md text-sm text-muted" x-show="rows.length" x-text="t('cp.emptyText')"></p>
            <div class="mt-2 flex flex-wrap justify-center gap-2.5">
              <button type="button" class="btn btn-outline" x-show="hasFilters" @click="resetFilters()">
                <i class="fa-solid fa-filter-circle-xmark text-muted" aria-hidden="true"></i>
                <span x-text="t('cp.resetFilters')"></span>
              </button>
              <button type="button" class="btn btn-accent" @click="openEditor(null, $event)" aria-haspopup="dialog">
                <i class="fa-solid fa-plus" aria-hidden="true"></i>
                <span x-text="t('cp.addConcept')"></span>
              </button>
            </div>
          </div>
        </template>

        <!-- ===== عرض القائمة: جدول (شاشات واسعة) ===== -->
        <template x-if="view === 'list' && filtered.length && wide">
          <div class="overflow-x-auto">
            <table class="w-full min-w-[1180px] border-collapse text-sm">
              <caption class="sr-only" x-text="tf('cp.tableCaption', { range: rangeText })"></caption>
              <thead>
                <tr class="bg-soft text-ink">
                  <th scope="col" class="px-3 py-3.5 text-xs font-extrabold text-start" :aria-sort="ariaSort('name')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded text-start font-extrabold transition hover:text-brand focus-visible:ring-2" @click="sortBy('name')">
                      <span x-text="t('cp.col.name')"></span>
                      <i class="fa-solid text-[10px]" :class="sortIcon('name')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-3 py-3.5 text-xs font-extrabold text-start" :aria-sort="ariaSort('path')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded text-start font-extrabold transition hover:text-brand focus-visible:ring-2" @click="sortBy('path')">
                      <span x-text="t('cp.col.path')"></span>
                      <i class="fa-solid text-[10px]" :class="sortIcon('path')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-3 py-3.5 text-xs font-extrabold text-start" :aria-sort="ariaSort('bloom')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded text-start font-extrabold transition hover:text-brand focus-visible:ring-2" @click="sortBy('bloom')">
                      <span x-text="t('cp.col.bloom')"></span>
                      <i class="fa-solid text-[10px]" :class="sortIcon('bloom')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-3 py-3.5 text-xs font-extrabold text-center" :aria-sort="ariaSort('prereqs')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded text-start font-extrabold transition hover:text-brand focus-visible:ring-2" @click="sortBy('prereqs')">
                      <span x-text="t('cp.col.prereqs')"></span>
                      <i class="fa-solid text-[10px]" :class="sortIcon('prereqs')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-3 py-3.5 text-xs font-extrabold text-center" :aria-sort="ariaSort('los')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded text-start font-extrabold transition hover:text-brand focus-visible:ring-2" @click="sortBy('los')">
                      <span x-text="t('cp.col.los')"></span>
                      <i class="fa-solid text-[10px]" :class="sortIcon('los')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-3 py-3.5 text-xs font-extrabold text-center" :aria-sort="ariaSort('quizzes')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded text-start font-extrabold transition hover:text-brand focus-visible:ring-2" @click="sortBy('quizzes')">
                      <span x-text="t('cp.col.quizzes')"></span>
                      <i class="fa-solid text-[10px]" :class="sortIcon('quizzes')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-3 py-3.5 text-xs font-extrabold text-start" :aria-sort="ariaSort('class')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded text-start font-extrabold transition hover:text-brand focus-visible:ring-2" @click="sortBy('class')">
                      <span x-text="t('cp.col.class')"></span>
                      <i class="fa-solid text-[10px]" :class="sortIcon('class')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-4 py-3.5 text-end text-xs font-extrabold" x-text="t('cp.col.actions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-line">
                <template x-for="r in paged" :key="r.id">
                  <tr class="transition" :class="r.classified ? 'hover:bg-soft/40' : 'bg-warning-500/5 hover:bg-warning-500/10'">
                    <th scope="row" class="max-w-[19rem] px-4 py-4 text-start align-middle font-normal">
                      <div class="flex items-center gap-3">
                        <span class="course-icon h-10 w-10 text-base" :class="courseTone(r)" aria-hidden="true"><i class="fa-solid" :class="r.course?.icon || 'fa-circle-question'"></i></span>
                        <div class="min-w-0 text-start">
                          <bdi dir="ltr" class="badge badge-muted mb-1 font-mono" x-text="r.code"></bdi>
                          <p class="font-extrabold leading-6" x-text="name(r)"></p>
                          <p class="truncate text-xs text-muted"><bdi :lang="otherLocale" x-text="altName(r)"></bdi></p>
                        </div>
                      </div>
                    </th>
                    <td class="max-w-[15rem] px-3 py-4 align-middle">
                      <div class="flex flex-wrap items-center gap-1 text-xs">
                        <span class="font-bold text-ink" x-text="loc(r.course?.title)"></span>
                        <i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[9px] text-muted" aria-hidden="true"></i>
                        <span class="text-muted" x-text="loc(r.unit?.title)"></span>
                        <i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[9px] text-muted" aria-hidden="true"></i>
                        <template x-if="r.lesson"><span class="text-muted" x-text="loc(r.lesson.title)"></span></template>
                        <template x-if="!r.lesson"><span class="badge badge-warning" :title="t('cp.lessonMissing')"><span aria-hidden="true">—</span><span class="sr-only" x-text="t('cp.lessonMissing')"></span></span></template>
                      </div>
                    </td>
                    <td class="px-3 py-4 align-middle">
                      <div class="flex flex-wrap items-center gap-1.5">
                        <span class="badge" :class="bloomBadge(r.k.bloom)"><i class="fa-solid fa-layer-group text-[10px]" aria-hidden="true"></i><span x-text="bloomLabel(r.k.bloom)"></span></span>
                        <span class="text-xs font-bold text-muted" x-text="diffLabel(r.k.difficulty)"></span>
                      </div>
                    </td>
                    <td class="px-3 py-4 text-center align-middle font-bold tabular-nums" x-text="fmtNum(r.prereqs)"></td>
                    <td class="px-3 py-4 text-center align-middle font-bold tabular-nums" x-text="fmtNum(r.los)"></td>
                    <td class="px-3 py-4 text-center align-middle font-bold tabular-nums" x-text="fmtNum(r.quizzes)"></td>
                    <td class="px-3 py-4 align-middle">
                      <div class="flex flex-col items-start gap-1.5">
                        <span class="badge" :class="r.classified ? 'badge-success' : 'badge-warning'"><i class="fa-solid text-[10px]" :class="r.classified ? 'fa-circle-check' : 'fa-triangle-exclamation'" aria-hidden="true"></i><span x-text="t('cls.' + (r.classified ? 'classified' : 'incomplete'))"></span></span>
                        <span class="badge" :class="statusMeta(r.k.status).badge"><i class="fa-solid text-[10px]" :class="statusMeta(r.k.status).icon" aria-hidden="true"></i><span x-text="statusMeta(r.k.status).label"></span></span>
                        <template x-if="!r.classified">
                          <div class="flex flex-col items-start gap-1.5">
                            <span class="text-xs font-bold text-warning-700 dark:text-warning-500" x-text="tf('cp.missingList', { list: missingText(r.k) })"></span>
                            <button type="button" class="btn btn-sm btn-outline" aria-haspopup="dialog" @click="openEditor(r, $event, r.missing[0])" :aria-label="tf('cp.completeFor', { name: name(r), missing: missingText(r.k) })">
                              <i class="fa-solid fa-list-check" aria-hidden="true"></i> <span x-text="t('cp.completeClassification')"></span>
                            </button>
                          </div>
                        </template>
                      </div>
                    </td>
                    <td class="px-4 py-4 align-middle">
                      <div class="flex flex-wrap justify-end gap-1.5">
                        <button type="button" class="act group relative" aria-haspopup="dialog" @click="openDetails(r.id, $event)" :aria-label="tf('cp.act.detailsFor', { name: name(r) })"><i class="fa-solid fa-eye" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="t('cp.act.details')"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                        <button type="button" class="act group relative" aria-haspopup="dialog" @click="openEditor(r, $event)" :aria-label="tf('cp.act.editFor', { name: name(r) })"><i class="fa-solid fa-pen" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="t('cp.act.edit')"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                        <button type="button" class="act group relative" @click="duplicate(r)" :aria-label="tf('cp.act.duplicateFor', { name: name(r) })"><i class="fa-solid fa-copy" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="t('cp.act.duplicate')"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                        <button type="button" class="act group relative" @click="askDelete(r, $event)"
                                :class="deleteInfo(r).ok ? '!text-danger hover:!bg-error-500/10' : 'cursor-not-allowed bg-soft/60 text-muted'"
                                :aria-disabled="deleteInfo(r).ok ? null : 'true'" :aria-label="deleteInfo(r).label"><i class="fa-solid fa-trash" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="deleteInfo(r).tip"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>

        <!-- ===== عرض القائمة: بطاقات (شاشات ضيقة) ===== -->
        <template x-if="view === 'list' && filtered.length && !wide">
          <ul class="grid grid-cols-1 gap-3 p-3 sm:grid-cols-2 sm:p-4" role="list">
            <template x-for="r in paged" :key="r.id">
              <li class="flex min-w-0 flex-col gap-3 rounded-2xl border p-4" :class="r.classified ? 'border-line' : 'border-warning-500/40 bg-warning-500/5'">
                <div class="flex items-start gap-3">
                  <span class="course-icon h-10 w-10 text-base" :class="courseTone(r)" aria-hidden="true"><i class="fa-solid" :class="r.course?.icon || 'fa-circle-question'"></i></span>
                  <div class="min-w-0 flex-1 text-start">
                    <bdi dir="ltr" class="badge badge-muted mb-1 font-mono" x-text="r.code"></bdi>
                    <h3 class="font-extrabold leading-6" x-text="name(r)"></h3>
                    <p class="truncate text-xs text-muted"><bdi :lang="otherLocale" x-text="altName(r)"></bdi></p>
                  </div>
                </div>
                <div class="flex flex-wrap items-center gap-1 text-xs">
                  <span class="font-bold text-ink" x-text="loc(r.course?.title)"></span>
                  <i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[9px] text-muted" aria-hidden="true"></i>
                  <span class="text-muted" x-text="loc(r.unit?.title)"></span>
                  <i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[9px] text-muted" aria-hidden="true"></i>
                  <template x-if="r.lesson"><span class="text-muted" x-text="loc(r.lesson.title)"></span></template>
                  <template x-if="!r.lesson"><span class="badge badge-warning" :title="t('cp.lessonMissing')"><span aria-hidden="true">—</span><span class="sr-only" x-text="t('cp.lessonMissing')"></span></span></template>
                </div>
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="badge" :class="bloomBadge(r.k.bloom)"><i class="fa-solid fa-layer-group text-[10px]" aria-hidden="true"></i><span x-text="bloomLabel(r.k.bloom)"></span></span>
                  <span class="text-xs font-bold text-muted" x-text="diffLabel(r.k.difficulty)"></span>
                </div>
                <dl class="grid grid-cols-3 gap-2 text-center">
                  <div class="rounded-xl bg-soft/60 p-2"><dt class="text-[11px] font-bold text-muted" x-text="t('cp.col.prereqs')"></dt><dd class="font-extrabold tabular-nums" x-text="fmtNum(r.prereqs)"></dd></div>
                  <div class="rounded-xl bg-soft/60 p-2"><dt class="text-[11px] font-bold text-muted" x-text="t('cp.col.los')"></dt><dd class="font-extrabold tabular-nums" x-text="fmtNum(r.los)"></dd></div>
                  <div class="rounded-xl bg-soft/60 p-2"><dt class="text-[11px] font-bold text-muted" x-text="t('cp.col.quizzes')"></dt><dd class="font-extrabold tabular-nums" x-text="fmtNum(r.quizzes)"></dd></div>
                </dl>
                <div class="flex flex-col items-start gap-1.5">
                  <span class="badge" :class="r.classified ? 'badge-success' : 'badge-warning'"><i class="fa-solid text-[10px]" :class="r.classified ? 'fa-circle-check' : 'fa-triangle-exclamation'" aria-hidden="true"></i><span x-text="t('cls.' + (r.classified ? 'classified' : 'incomplete'))"></span></span>
                  <span class="badge" :class="statusMeta(r.k.status).badge"><i class="fa-solid text-[10px]" :class="statusMeta(r.k.status).icon" aria-hidden="true"></i><span x-text="statusMeta(r.k.status).label"></span></span>
                  <template x-if="!r.classified">
                    <div class="flex flex-col items-start gap-1.5">
                      <span class="text-xs font-bold text-warning-700 dark:text-warning-500" x-text="tf('cp.missingList', { list: missingText(r.k) })"></span>
                      <button type="button" class="btn btn-sm btn-outline" aria-haspopup="dialog" @click="openEditor(r, $event, r.missing[0])" :aria-label="tf('cp.completeFor', { name: name(r), missing: missingText(r.k) })">
                        <i class="fa-solid fa-list-check" aria-hidden="true"></i> <span x-text="t('cp.completeClassification')"></span>
                      </button>
                    </div>
                  </template>
                </div>
                <div class="border-t border-line pt-3">
                      <div class="flex flex-wrap justify-start gap-1.5">
                      <button type="button" class="act group relative" aria-haspopup="dialog" @click="openDetails(r.id, $event)" :aria-label="tf('cp.act.detailsFor', { name: name(r) })"><i class="fa-solid fa-eye" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="t('cp.act.details')"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                      <button type="button" class="act group relative" aria-haspopup="dialog" @click="openEditor(r, $event)" :aria-label="tf('cp.act.editFor', { name: name(r) })"><i class="fa-solid fa-pen" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="t('cp.act.edit')"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                      <button type="button" class="act group relative" @click="duplicate(r)" :aria-label="tf('cp.act.duplicateFor', { name: name(r) })"><i class="fa-solid fa-copy" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="t('cp.act.duplicate')"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                      <button type="button" class="act group relative" @click="askDelete(r, $event)"
                              :class="deleteInfo(r).ok ? '!text-danger hover:!bg-error-500/10' : 'cursor-not-allowed bg-soft/60 text-muted'"
                              :aria-disabled="deleteInfo(r).ok ? null : 'true'" :aria-label="deleteInfo(r).label"><i class="fa-solid fa-trash" aria-hidden="true"></i><span class="tooltip-bubble" aria-hidden="true" x-text="deleteInfo(r).tip"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                    </div>
                </div>
              </li>
            </template>
          </ul>
        </template>

        <!-- ترقيم الصفحات (عرض القائمة) -->
        <div x-show="view === 'list' && filtered.length" class="flex flex-col gap-3 border-t border-line px-4 py-3.5 sm:flex-row sm:items-center sm:justify-between sm:px-5">
          <p class="text-xs font-bold text-muted tabular-nums" x-text="rangeText"></p>
          <nav class="flex flex-wrap items-center gap-1.5" :aria-label="t('cp.pagination')" x-show="pageCount > 1">
            <button type="button" class="act disabled:cursor-not-allowed disabled:bg-soft/60 disabled:text-muted" :disabled="curPage <= 1" @click="goPage(curPage - 1)" :aria-label="t('cp.prev')">
              <i class="fa-solid fa-chevron-left rtl:-scale-x-100 text-xs" aria-hidden="true"></i>
            </button>
            <template x-for="p in pageItems" :key="p">
              <span class="contents">
                <template x-if="typeof p === 'number'">
                  <button type="button" class="act font-bold tabular-nums" :class="p === curPage && 'border-transparent bg-primary-500 text-white hover:bg-primary-600'"
                          :aria-current="p === curPage ? 'page' : null" :aria-label="tf('cp.pageN', { n: fmtNum(p) })" @click="goPage(p)" x-text="fmtNum(p)"></button>
                </template>
                <template x-if="typeof p !== 'number'">
                  <span aria-hidden="true" class="inline-grid h-9 w-9 shrink-0 place-items-center text-sm font-bold text-muted">&hellip;</span>
                </template>
              </span>
            </template>
            <button type="button" class="act disabled:cursor-not-allowed disabled:bg-soft/60 disabled:text-muted" :disabled="curPage >= pageCount" @click="goPage(curPage + 1)" :aria-label="t('cp.next')">
              <i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-xs" aria-hidden="true"></i>
            </button>
          </nav>
        </div>

        <!-- ===== عرض الشجرة (role=tree، تنقّل بلوحة المفاتيح، roving tabindex) ===== -->
        <template x-if="view === 'tree' && filtered.length">
          <div class="p-3 sm:p-5">
            <p id="tree-help" class="mb-3 text-xs text-muted" x-text="t('cp.treeHelp')"></p>
            <ul role="tree" :aria-label="t('cp.treeLabel')" aria-describedby="tree-help" class="space-y-0.5">
              <template x-for="n in visibleNodes" :key="n.id">
                <li role="treeitem" :id="nodeDomId(n.id)"
                    :aria-level="n.level" :aria-setsize="n.setsize" :aria-posinset="n.posinset"
                    :aria-expanded="n.hasChildren ? n.open.toString() : null" :aria-label="nodeAria(n)"
                    :tabindex="treeTabId === n.id ? 0 : -1"
                    @keydown="onTreeKey($event, n)" @focus="treeFocusId = n.id" @click="nodeClick(n, $event)"
                    class="flex min-w-0 cursor-pointer items-center gap-2 rounded-xl py-2 pe-3 transition hover:bg-soft/60 focus:outline-none focus-visible:ring-2"
                    :class="{ 'bg-soft/40': n.type === 'course', 'bg-warning-500/5': n.type === 'concept' && !n.row.classified }"
                    :style="'padding-inline-start:' + (0.5 + (n.level - 1) * 1.5) + 'rem'">
                  <span class="grid h-6 w-6 shrink-0 place-items-center rounded-md text-xs text-muted hover:bg-soft hover:text-brand" aria-hidden="true" @click.stop="toggleNode(n)">
                    <i class="fa-solid" x-show="n.hasChildren" :class="n.open ? 'fa-chevron-down' : 'fa-chevron-right rtl:-scale-x-100'"></i>
                  </span>

                  <template x-if="n.type === 'course'">
                    <span class="flex min-w-0 flex-1 items-center gap-2.5" aria-hidden="true">
                      <span class="course-icon h-8 w-8 text-sm" :class="courseTone({ course: n.course })"><i class="fa-solid" :class="n.course.icon"></i></span>
                      <span class="min-w-0 truncate font-extrabold" x-text="n.label"></span>
                      <span class="badge badge-muted shrink-0" x-text="tf('cp.conceptsN', { n: fmtNum(n.count) })"></span>
                    </span>
                  </template>
                  <template x-if="n.type === 'unit' || n.type === 'lesson'">
                    <span class="flex min-w-0 flex-1 items-center gap-2.5" aria-hidden="true">
                      <i class="fa-solid w-4 shrink-0 text-center text-muted" :class="n.type === 'unit' ? 'fa-folder-tree' : 'fa-book-open'"></i>
                      <span class="min-w-0 truncate" :class="n.type === 'unit' ? 'font-extrabold' : 'font-bold'" x-text="n.label"></span>
                      <span class="shrink-0 text-xs font-bold text-muted" x-text="n.count ? tf('cp.conceptsN', { n: fmtNum(n.count) }) : t('cp.treeEmptyLesson')"></span>
                    </span>
                  </template>
                  <template x-if="n.type === 'concept'">
                    <span class="flex min-w-0 flex-1 flex-wrap items-center gap-x-2.5 gap-y-1" aria-hidden="true">
                      <i class="fa-solid fa-lightbulb w-4 shrink-0 text-center text-brand"></i>
                      <bdi dir="ltr" class="badge badge-muted font-mono" x-text="n.row.code"></bdi>
                      <span class="min-w-0 font-extrabold leading-6" x-text="name(n.row)"></span>
                      <span class="badge" :class="bloomBadge(n.row.k.bloom)" x-text="bloomLabel(n.row.k.bloom)"></span>
                      <span class="badge" :class="n.row.classified ? 'badge-success' : 'badge-warning'">
                        <i class="fa-solid text-[10px]" :class="n.row.classified ? 'fa-circle-check' : 'fa-triangle-exclamation'"></i>
                        <span x-text="t('cls.' + (n.row.classified ? 'classified' : 'incomplete'))"></span>
                      </span>
                      <span class="text-xs font-bold text-muted" x-text="n.row.prereqs ? tf('cp.prereqsN', { n: fmtNum(n.row.prereqs) }) : t('cp.noPrereqs')"></span>
                    </span>
                  </template>
                  <template x-if="n.type === 'prereq'">
                    <span class="flex min-w-0 flex-1 items-center gap-2 text-sm font-bold text-brand underline-offset-4 hover:underline" aria-hidden="true">
                      <i class="fa-solid fa-link w-4 shrink-0 text-center text-xs"></i>
                      <span class="min-w-0" x-text="n.label"></span>
                      <bdi dir="ltr" class="font-mono text-xs text-muted" x-text="codeOf(n.target)"></bdi>
                      <i class="fa-solid fa-arrow-turn-up text-[10px] text-muted"></i>
                    </span>
                  </template>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </section>
    </main>

    <!-- ================= Footer ================= -->
    <footer class="mt-auto border-t border-line bg-card/60"
          x-data="{ year: new Date().getFullYear(), version: 'v1.0.0', env: 'Production' }"
          style="padding-bottom: env(safe-area-inset-bottom, 0px);">
    <div class="mx-auto flex w-full min-w-0 max-w-[1400px] flex-col gap-4 px-3 py-0 sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-8">

      <div class="flex min-w-0 items-center gap-3">
        <img src="../asset/images/firob-logo.png" alt="FirOb" class="block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        <p class="min-w-0 text-sm text-muted"><span x-text="t('footer.repo')"></span>
          <span class="block text-xs sm:inline sm:text-sm">
            <span class="hidden sm:inline" aria-hidden="true">·</span>
            © <span class="tabular-nums" x-text="year"></span> <span x-text="t('footer.rights')"></span>

        </p>
      </div>

      <nav :aria-label="locale === 'ar' ? 'روابط التذييل' : 'Footer links'" class="min-w-0">

          <li><a href="../index.html" class="rounded font-bold text-muted underline-offset-4 transition hover:text-brand hover:underline">&#8962; <span x-text="t('footer.sitemap')"></span></a></li>
          <li><span class="inline-flex cursor-not-allowed items-center text-muted" aria-disabled="true" x-text="t('footer.help')"></span></li>
          <li><span class="inline-flex cursor-not-allowed items-center text-muted" aria-disabled="true" x-text="t('footer.docs')"></span></li>
          <li><span class="inline-flex cursor-not-allowed items-center text-muted" aria-disabled="true" x-text="t('footer.privacy')"></span></li>
          <li><span class="inline-flex cursor-not-allowed items-center text-muted" aria-disabled="true" x-text="t('footer.terms')"></span></li>
        </ul>
      </nav>

      <div class="flex flex-wrap items-center gap-2">
        <span class="badge badge-success">
          <span class="h-2 w-2 rounded-full bg-success-500" aria-hidden="true"></span>
          <span x-text="t('footer.ok')"></span>
        </span>
      </div>

  </footer>

</div>

<!-- ==========================================================================
     اللوحة الجانبية — تفاصيل المفهوم (dialog)
     ========================================================================== -->
<div x-cloak x-show="detailsOpen" x-transition.opacity.duration.300ms class="fixed inset-0 z-[60]"
     @keydown.escape.stop="closeDetails()">
  <div class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closeDetails()" aria-hidden="true"></div>

  <div x-show="detailsOpen" x-trap.noscroll="detailsOpen"
       role="dialog" aria-modal="true" aria-labelledby="details-title" aria-describedby="details-sub"
       x-transition:enter="transition duration-300 ease-out" x-transition:enter-start="ltr:translate-x-full rtl:-translate-x-full" x-transition:enter-end="translate-x-0"
       x-transition:leave="transition duration-200 ease-in" x-transition:leave-start="translate-x-0" x-transition:leave-end="ltr:translate-x-full rtl:-translate-x-full"
       class="absolute inset-y-0 end-0 flex w-full max-w-xl flex-col border-s border-line bg-card shadow-pop">

    <header class="flex shrink-0 items-center justify-between gap-3 border-b border-line bg-soft p-5">
      <div class="min-w-0">
        <h2 id="details-title" tabindex="-1" class="text-lg font-extrabold text-ink focus:outline-none" x-text="details ? name(details.r) : t('cp.detailsTitle')"></h2>
        <p id="details-sub" class="truncate text-xs font-bold text-muted" x-text="t('cp.detailsTitle')"></p>
      </div>
      <button type="button" class="icon-btn" @click="closeDetails()" :aria-label="t('cp.close')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </header>

    <div class="min-h-0 flex-1 overflow-y-auto">
      <template x-if="details">
        <div class="space-y-5 p-5">
          <div class="flex flex-wrap items-center gap-1.5 text-start">
            <bdi dir="ltr" class="badge badge-muted font-mono" x-text="details.r.code"></bdi>
            <span class="badge" :class="statusMeta(details.r.k.status).badge"><i class="fa-solid text-[10px]" :class="statusMeta(details.r.k.status).icon" aria-hidden="true"></i><span x-text="statusMeta(details.r.k.status).label"></span></span>
            <span class="badge" :class="details.r.classified ? 'badge-success' : 'badge-warning'">
              <i class="fa-solid text-[10px]" :class="details.r.classified ? 'fa-circle-check' : 'fa-triangle-exclamation'" aria-hidden="true"></i>
              <span x-text="t('cls.' + (details.r.classified ? 'classified' : 'incomplete'))"></span>
            </span>
          </div>

          <dl class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <div class="rounded-xl border border-line p-3.5">
              <dt class="mb-1 text-xs font-extrabold text-muted" x-text="t('cp.nameAr')"></dt>
              <dd class="text-sm font-bold text-ink" lang="ar" dir="rtl" x-text="details.r.k.name.ar"></dd>
            </div>
            <div class="rounded-xl border border-line p-3.5">
              <dt class="mb-1 text-xs font-extrabold text-muted" x-text="t('cp.nameEn')"></dt>
              <dd class="text-sm font-bold text-ink text-start"><bdi lang="en" x-text="details.r.k.name.en"></bdi></dd>
            </div>
            <div class="rounded-xl border border-line bg-soft/60 p-3.5 sm:col-span-2">
              <dt class="mb-1 text-xs font-extrabold text-muted" x-text="t('cp.path')"></dt>
              <dd class="text-sm font-bold leading-6 text-ink" x-text="pathText(details.r)"></dd>
            </div>
            <div class="rounded-xl border border-line p-3.5">
              <dt class="mb-1 text-xs font-extrabold text-muted" x-text="t('cp.bloomLabel')"></dt>
              <dd><span class="badge" :class="bloomBadge(details.r.k.bloom)" x-text="bloomLabel(details.r.k.bloom)"></span></dd>
            </div>
            <div class="rounded-xl border border-line p-3.5">
              <dt class="mb-1 text-xs font-extrabold text-muted" x-text="t('cp.diffLabel')"></dt>
              <dd class="text-sm font-bold text-ink" x-text="diffLabel(details.r.k.difficulty)"></dd>
            </div>
          </dl>

          <p class="rounded-xl border border-warning-500/40 bg-warning-500/10 p-3 text-sm font-bold text-warning-700 dark:text-warning-500" x-show="!details.r.classified">
            <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
            <span x-text="tf('cp.missingList', { list: missingText(details.r.k) })"></span>
          </p>

          <!-- المتطلبات السابقة -->
          <section aria-labelledby="det-prereqs">
            <h3 id="det-prereqs" class="mb-2 text-sm font-extrabold text-ink" x-text="tf('cp.prereqsTitle', { n: fmtNum(details.prereqs.length) })"></h3>
            <p class="text-sm text-muted" x-show="!details.prereqs.length" x-text="t('cp.noneYet')"></p>
            <ul class="flex flex-wrap gap-2" role="list" x-show="details.prereqs.length">
              <template x-for="p in details.prereqs" :key="p.id">
                <li>
                  <button type="button" class="inline-flex items-center gap-2 rounded-lg border border-line px-3 py-1.5 text-sm font-bold text-brand transition hover:bg-soft focus-visible:ring-2"
                          @click="openDetails(p.id)" :aria-label="tf('cp.showConcept', { name: loc(p.name) })">
                    <i class="fa-solid fa-link text-xs" aria-hidden="true"></i>
                    <span x-text="loc(p.name)"></span>
                    <bdi dir="ltr" class="font-mono text-xs text-muted" x-text="p.code"></bdi>
                  </button>
                </li>
              </template>
            </ul>
          </section>

          <!-- مطلوب لـ (عكس المتطلبات) -->
          <section aria-labelledby="det-reqby">
            <h3 id="det-reqby" class="mb-2 text-sm font-extrabold text-ink" x-text="tf('cp.requiredByTitle', { n: fmtNum(details.requiredBy.length) })"></h3>
            <p class="text-sm text-muted" x-show="!details.requiredBy.length" x-text="t('cp.noneYet')"></p>
            <ul class="flex flex-wrap gap-2" role="list" x-show="details.requiredBy.length">
              <template x-for="p in details.requiredBy" :key="p.id">
                <li>
                  <button type="button" class="inline-flex items-center gap-2 rounded-lg border border-line px-3 py-1.5 text-sm font-bold text-brand transition hover:bg-soft focus-visible:ring-2"
                          @click="openDetails(p.id)" :aria-label="tf('cp.showConcept', { name: loc(p.name) })">
                    <i class="fa-solid fa-arrow-turn-down text-xs" aria-hidden="true"></i>
                    <span x-text="loc(p.name)"></span>
                    <bdi dir="ltr" class="font-mono text-xs text-muted" x-text="p.code"></bdi>
                  </button>
                </li>
              </template>
            </ul>
          </section>

          <!-- العناصر التعليمية -->
          <section aria-labelledby="det-los">
            <h3 id="det-los" class="mb-2 text-sm font-extrabold text-ink" x-text="tf('cp.losTitle', { n: fmtNum(details.los.length) })"></h3>
            <p class="text-sm text-muted" x-show="!details.los.length" x-text="t('cp.noneYet')"></p>
            <ul class="space-y-2" role="list" x-show="details.los.length">
              <template x-for="o in details.los" :key="o.id">
                <li>
                  <a :href="loHref(o)" class="flex items-center gap-3 rounded-xl border border-line p-3 text-start transition hover:bg-soft focus-visible:ring-2" :aria-label="tf('cp.openLo', { title: loc(o.title) })">
                    <i class="fa-solid fa-cube text-brand" aria-hidden="true"></i>
                    <span class="min-w-0 flex-1 text-sm font-bold text-ink" x-text="loc(o.title)"></span>
                    <bdi dir="ltr" class="badge badge-muted font-mono" x-text="o.code"></bdi>
                  </a>
                </li>
              </template>
            </ul>
          </section>

          <!-- أسئلة الاختبارات -->
          <section aria-labelledby="det-qs">
            <h3 id="det-qs" class="mb-2 text-sm font-extrabold text-ink" x-text="tf('cp.questionsTitle', { n: fmtNum(details.questions.length) })"></h3>
            <p class="text-sm text-muted" x-show="!details.questions.length" x-text="t('cp.noneYet')"></p>
            <ul class="space-y-2" role="list" x-show="details.questions.length">
              <template x-for="x in details.questions" :key="x.q.uid">
                <li class="rounded-xl border border-line p-3 text-start">
                  <p class="text-sm font-bold leading-6 text-ink" x-text="loc(x.q.text)"></p>
                  <a :href="quizHref(x.quiz)" class="mt-1 inline-flex items-center gap-1.5 text-xs font-bold text-brand hover:underline" :aria-label="tf('cp.openInBuilder', { quiz: loc(x.quiz.title) })">
                    <i class="fa-solid fa-list-check" aria-hidden="true"></i>
                    <span x-text="loc(x.quiz.title)"></span>
                    <bdi dir="ltr" class="font-mono text-muted" x-text="x.quiz.code"></bdi>
                  </a>
                </li>
              </template>
            </ul>
          </section>
        </div>
      </template>
    </div>

    <footer class="flex shrink-0 items-center justify-end gap-3 border-t border-line bg-page/40 p-4">
      <button type="button" class="btn btn-outline" @click="closeDetails()" x-text="t('cp.close')"></button>
      <button type="button" class="btn btn-primary" @click="editFromDetails()" aria-haspopup="dialog">
        <i class="fa-solid fa-pen" aria-hidden="true"></i> <span x-text="t('cp.act.edit')"></span>
      </button>
    </footer>
  </div>
</div>

<!-- ==========================================================================
     محرّر المفهوم (للمعلم) — إضافة / تعديل / استكمال التصنيف
     ========================================================================== -->
<div x-cloak x-show="editorOpen" x-transition.opacity.duration.200ms class="fixed inset-0 z-[65] grid place-items-center p-3 sm:p-4"
     @keydown.escape.stop="closeEditor()">
  <div class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closeEditor()" aria-hidden="true"></div>

  <div x-show="editorOpen" x-trap.noscroll="editorOpen"
       role="dialog" aria-modal="true" aria-labelledby="editor-title" aria-describedby="editor-sub"
       x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="opacity-0 scale-95"
       class="modal-panel max-w-2xl">
    <form novalidate @submit.prevent="save()" class="flex min-h-0 flex-1 flex-col">
      <header class="flex shrink-0 items-center justify-between gap-3 border-b border-line bg-soft p-5">
        <div class="min-w-0">
          <h2 id="editor-title" class="text-lg font-extrabold text-ink" x-text="editorTitle"></h2>
          <p id="editor-sub" class="text-xs font-bold text-muted" x-text="t('cp.editorSub')"></p>
        </div>
        <button type="button" class="icon-btn" @click="closeEditor()" :disabled="busy" :aria-label="t('cp.cancel')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      </header>

      <div class="min-h-0 flex-1 space-y-4 overflow-y-auto p-5">
        <!-- ملخص الأخطاء -->
        <div x-show="errorList.length" tabindex="-1" x-ref="errSummary"
             class="rounded-xl border border-error-500/40 bg-error-500/10 p-3.5 text-sm text-error-700 dark:text-red-300">
          <p class="font-extrabold" x-text="tf('cp.err.summary', { n: fmtNum(errorList.length) })"></p>
          <ul class="mt-1.5 list-disc space-y-1 ps-5" role="list">
            <template x-for="e in errorList" :key="e.field">
              <li><button type="button" class="text-start font-bold underline underline-offset-2" @click="focusField(e.field)" x-text="e.msg"></button></li>
            </template>
          </ul>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label for="ce-nameAr" class="label" x-text="t('cp.f.nameAr')"></label>
            <input id="ce-nameAr" type="text" class="field" lang="ar" dir="rtl" maxlength="160" x-model="form.nameAr" autocomplete="off" aria-required="true"
                   :aria-invalid="errors.nameAr ? 'true' : 'false'" :aria-describedby="errors.nameAr ? 'ce-nameAr-err' : null">
            <p id="ce-nameAr-err" class="err" role="alert" x-show="errors.nameAr"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="errors.nameAr"></span></p>
          </div>
          <div>
            <label for="ce-nameEn" class="label" x-text="t('cp.f.nameEn')"></label>
            <input id="ce-nameEn" type="text" class="field" lang="en" dir="ltr" maxlength="160" x-model="form.nameEn" autocomplete="off" aria-required="true"
                   :aria-invalid="errors.nameEn ? 'true' : 'false'" :aria-describedby="errors.nameEn ? 'ce-nameEn-err' : null">
            <p id="ce-nameEn-err" class="err" role="alert" x-show="errors.nameEn"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="errors.nameEn"></span></p>
          </div>
          <div class="sm:col-span-2">
            <label for="ce-code" class="label" x-text="t('cp.f.code')"></label>
            <input id="ce-code" type="text" class="field font-mono" dir="ltr" maxlength="40" x-model="form.code" autocomplete="off" spellcheck="false" aria-required="true"
                   :aria-invalid="errors.code ? 'true' : 'false'" :aria-describedby="errors.code ? 'ce-code-err ce-code-hint' : 'ce-code-hint'">
            <p id="ce-code-hint" class="hint" x-text="t('cp.f.codeHint')"></p>
            <p id="ce-code-err" class="err" role="alert" x-show="errors.code"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="errors.code"></span></p>
          </div>

          <div>
            <label for="ce-course" class="label" x-text="t('cp.f.course')"></label>
            <select id="ce-course" class="field" x-model="form.courseId" @change="onFormCourse()" aria-required="true"
                    :aria-invalid="errors.courseId ? 'true' : 'false'" :aria-describedby="errors.courseId ? 'ce-course-err' : null">
              <option value="" x-text="t('cp.f.choose')"></option>
              <template x-for="c in allCourses" :key="c.id">
                <option :value="c.id" :selected="form.courseId === c.id" x-text="loc(c.title)"></option>
              </template>
            </select>
            <p id="ce-course-err" class="err" role="alert" x-show="errors.courseId"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="errors.courseId"></span></p>
          </div>
          <div>
            <label for="ce-unit" class="label" x-text="t('cp.f.unit')"></label>
            <select id="ce-unit" class="field" x-model="form.unitId" @change="onFormUnit()" :disabled="!formCourse" aria-required="true"
                    :aria-invalid="errors.unitId ? 'true' : 'false'" :aria-describedby="errors.unitId ? 'ce-unit-err' : null">
              <option value="" x-text="formCourse ? t('cp.f.choose') : t('cp.f.chooseCourseFirst')"></option>
              <template x-for="u in (formCourse ? formCourse.units : [])" :key="u.id">
                <option :value="u.id" :selected="form.unitId === u.id" x-text="loc(u.title)"></option>
              </template>
            </select>
            <p id="ce-unit-err" class="err" role="alert" x-show="errors.unitId"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="errors.unitId"></span></p>
          </div>
          <div class="sm:col-span-2">
            <label for="ce-lesson" class="label" x-text="t('cp.f.lesson')"></label>
            <select id="ce-lesson" class="field" x-model="form.lessonId" :disabled="!formUnit">
              <option value="" x-text="formUnit ? t('cp.f.notSet') : t('cp.f.chooseUnitFirst')"></option>
              <template x-for="l in (formUnit ? formUnit.lessons : [])" :key="l.id">
                <option :value="l.id" :selected="form.lessonId === l.id" x-text="loc(l.title)"></option>
              </template>
            </select>
          </div>
          <div>
            <label for="ce-bloom" class="label" x-text="t('cp.f.bloom')"></label>
            <select id="ce-bloom" class="field" x-model="form.bloom">
              <option value="" x-text="t('cp.f.notSet')"></option>
              <template x-for="b in blooms" :key="b">
                <option :value="b" :selected="form.bloom === b" x-text="bloomLabel(b)"></option>
              </template>
            </select>
          </div>
          <div>
            <label for="ce-diff" class="label" x-text="t('cp.f.difficulty')"></label>
            <select id="ce-diff" class="field" x-model="form.difficulty">
              <option value="" x-text="t('cp.f.notSet')"></option>
              <template x-for="d in diffs" :key="d">
                <option :value="d" :selected="form.difficulty === d" x-text="diffLabel(d)"></option>
              </template>
            </select>
          </div>
        </div>

        <!-- المتطلبات السابقة: اختيار متعدد مع منع الحلقات -->
        <fieldset id="ce-prereqs" tabindex="-1" class="rounded-xl border border-line p-4" :aria-invalid="errors.prerequisites ? 'true' : null"
                  :aria-describedby="errors.prerequisites ? 'ce-prereqs-err ce-prereqs-hint' : 'ce-prereqs-hint'">
          <legend class="px-1 text-sm font-bold text-ink" x-text="t('cp.f.prereqs')"></legend>

          const course = TC.course(k.courseId);
          const unit = k.unitId ? TC.unit(k.courseId, k.unitId) : null;
          const lesson = k.lessonId ? TC.lesson(k.courseId, k.unitId, k.lessonId) : null;
          const qs = this.questionsOf(k.id);
          const missing = this.missingOf(k);
          return {
            id: k.id, code: k.code, k, course, unit, lesson,
            classified: missing.length === 0, missing,
            prereqs: k.prerequisites.length, los: this.losOf(k.id).length, questions: qs.length,
            quizzes: new Set(qs.map(x => x.quiz.code)).size, dependents: deps[k.id] || 0,

      },
