<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>تصفح المقررات الدراسية — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 127 143 166;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: 2px solid rgb(var(--brand)); outline-offset: 2px; }  /* outline لا يتعارض مع ظلال المكونات ويعمل في forced-colors */
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft; }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  {@apply bg-accent-500/20 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }  /* كان 3.93:1 في الداكن */
    .badge-neutral { @apply bg-neutral-200 text-ink dark:bg-soft-2; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-muted; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex w-full cursor-pointer items-center gap-2 rounded-lg px-4 py-2.5 text-start text-sm font-medium text-ink transition-colors hover:bg-soft; }
    .combo-option.is-active   { @apply bg-soft; }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }
    .combo-option.is-active.is-selected { @apply bg-primary-500/20 ring-1 ring-inset ring-brand/40; }  /* مؤشر لوحة المفاتيح ظاهر حتى على الخيار المختار */
    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- أشرطة التقدّم (ProgressMeter) ---------- */
    .quota-track { @apply h-1.5 w-full overflow-hidden rounded-full bg-line; }
    .quota-fill { @apply h-full rounded-full transition-[width] duration-500; }

    /* ---------- شجرة الوحدات والدروس (Units/Lessons Tree) ---------- */
    /* الصف كله زر (هدف نقر كبير) والعنوان جزء منه — بدل أيقونة 24px منفصلة */
    .tree-row { @apply flex min-h-11 flex-wrap items-center gap-2.5 rounded-xl px-3 py-2.5 transition hover:bg-soft; }
    .tree-chevron { @apply w-4 shrink-0 text-center text-xs text-muted transition-transform duration-150; }
    .tree-chevron.is-open { transform: rotate(90deg); }
    [dir="rtl"] .tree-chevron { transform: scaleX(-1); }
    [dir="rtl"] .tree-chevron.is-open { transform: scaleX(-1) rotate(90deg); }
    .tree-children { @apply ms-5 border-s-2 border-line-strong/50 ps-3; }  /* كان border-line ‏1.17:1 — الخط هو مؤشر العمق الوحيد */
    .level-chip { @apply inline-flex shrink-0 items-center rounded-md bg-soft-2 px-1.5 py-0.5 text-[10px] font-extrabold text-brand; }

    /* ---------- بطاقة المفهوم (ConceptCard) ---------- */
    .concept-card { @apply flex min-w-0 flex-col gap-3 rounded-xl border border-line bg-field/40 p-4 transition hover:border-primary-500; content-visibility: auto; contain-intrinsic-size: auto 210px; }
    .cv-auto { content-visibility: auto; contain-intrinsic-size: auto 260px; }
    .overlay-backdrop { -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .overlay-backdrop { -webkit-backdrop-filter: none; backdrop-filter: none; }
      header.app-topbar { -webkit-backdrop-filter: none; backdrop-filter: none; background-color: rgb(var(--card)); }
    }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }
  }
</style>

<!-- ⑥ Alpine.js (+ Focus لحصر التركيز داخل الأدراج + Collapse لحركة شجرة الوحدات) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

</head>

<body x-data="shell()" x-init="init()" @keydown.escape.window="closeAll()"
      @keydown.window="onGlobalKey($event)"
      :class="{ 'overflow-hidden': mobileNav && mobile }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="overlay-backdrop fixed inset-0 z-40 bg-primary-900/60 lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="t('mainMenu')"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:sticky lg:top-0 lg:h-[100dvh] lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <a href="student-dashboard.html" class="inline-flex min-w-0 flex-1 items-center gap-3 rounded-lg focus-visible:ring-2" :class="!expanded && 'lg:flex-none lg:justify-center'" :aria-label="t('appTitle')">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </a>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="t('mainNav')">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold text-muted ltr:tracking-wide" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); } else if (mobile) { mobileNav = false; }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="(item.key === 'notificationCenter' ? unread : item.count) && expanded"
                        class="shrink-0 rounded-full text-xs"
                        :class="item.tone === 'primary' ? 'bg-primary-500/10 px-2 py-0.5 font-bold text-brand' : 'bg-accent-500 px-2 font-extrabold text-onaccent'"
                        x-text="item.key === 'notificationCenter' ? unread : item.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid rtl:-scale-x-100" :class="collapsed ? 'fa-angles-right' : 'fa-angles-left'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="flex min-w-0 flex-1 flex-col">

    <!-- ================= Topbar ================= -->
    <header class="app-topbar sticky top-0 z-30 flex flex-col border-b border-line bg-card/90 backdrop-blur-sm">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd dir="ltr" aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex">Ctrl K</kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <!-- جرس الإشعارات -->
          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-controls="notif-menu" :aria-expanded="notifOpen.toString()"
                    :aria-label="t('notifications') + (unread ? ' (' + fmt(unread) + ')' : '')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="t('notif.' + n.key)"></p>
                      <p class="text-xs text-muted" x-text="relMin(n.min)"></p>
                    </div>
                  </li>
                </template>
              </ul>
              <div class="border-t border-line p-2">
                <a href="../common/notifications.html" class="menu-item justify-center text-brand" @click="notifOpen = false">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  <span x-text="t('viewAllNotif')"></span>
                </a>
              </div>
            </div>
          </div>

          <!-- قائمة الملف الشخصي -->
          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" class="flex max-w-[14rem] items-center gap-2 rounded-xl p-1 transition hover:bg-soft md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    aria-haspopup="menu" :aria-expanded="profileOpen.toString()" aria-controls="profile-menu" :aria-label="studentName + ' — ' + t('accountMenu')">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true" x-text="initials"></span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="studentName"></span>
                <span class="block truncate text-xs text-muted" x-text="t('roleStudent')"></span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted md:block" aria-hidden="true"></i>
            </button>
            <div id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-56" role="menu" :aria-label="t('accountMenu')">
              <a href="../common/profile.html" role="menuitem" class="menu-item"><i class="fa-regular fa-user w-4 text-brand" aria-hidden="true"></i> <span x-text="t('profile')"></span></a>
              <a href="../common/notifications.html" role="menuitem" class="menu-item"><i class="fa-regular fa-bell w-4 text-muted" aria-hidden="true"></i> <span x-text="t('notifications')"></span></a>
              <div role="separator" class="border-t border-line"></div>
              <a href="../auth/login.html" role="menuitem" class="menu-item !text-danger"><i class="fa-solid fa-arrow-right-from-bracket w-4" aria-hidden="true"></i> <span x-text="t('logout')"></span></a>
            </div>
          </div>
        </div>
      </div>

      <!-- زبدة الخبز (Breadcrumb) — تدعم التنقّل الهرمي العميق حتى مستوى المفهوم -->
      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="t('breadcrumbLabel')">
          <ol class="flex flex-wrap items-center gap-2" role="list">
            <li><a href="student-dashboard.html" class="hover:text-brand hover:underline" x-text="t('breadcrumb.home')"></a></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <template x-if="view === 'catalog'">
              <li class="text-ink" aria-current="page" x-text="t('sc.title')"></li>
            </template>
            <template x-if="view === 'course'">
              <li><a href="student-courses.html" class="hover:text-brand hover:underline" @click.prevent="backToCatalog()" x-text="t('sc.title')"></a></li>
            </template>
            <template x-if="view === 'course'">
              <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            </template>
            <template x-if="view === 'course'">
              <li class="text-ink" aria-current="page" x-text="course ? course[locale] : '—'"></li>
            </template>
          </ol>
        </nav>
      </div>
    </header>

    <!-- ================= المحتوى الرئيسي — STU-02: تصفّح المقررات الدراسية (مصدر بيانات واحد + حالة في الرابط) ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">

      <!-- العنوان + زر الرجوع -->
      <section class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end sm:justify-between">
        <div class="min-w-0">
          <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="t('sc.title')"></h1>
          <p class="mt-1 text-sm text-muted sm:text-base" x-text="view === 'catalog' ? t('sc.subtitleCatalog') : t('sc.subtitleCourse')"></p>
        </div>
        <a href="student-courses.html" class="btn btn-outline shrink-0" x-show="view === 'course'" x-cloak @click.prevent="backToCatalog()">
          <i class="fa-solid fa-arrow-left rtl:-scale-x-100" aria-hidden="true"></i>
          <span x-text="t('sc.backToCatalog')"></span>
        </a>
      </section>

      <!-- ================= شريط البحث والفلاتر (بحث فوري — لا حاجة لزر) ================= -->
      <section class="panel flex flex-col gap-3 p-4 lg:flex-row lg:items-center sm:p-5" role="search" :aria-label="t('sc.filtersLabel')">
        <div class="relative min-w-0 flex-1">
          <label for="course-search" class="sr-only" x-text="view === 'catalog' ? t('sc.searchPlaceholder') : t('sc.searchInCourse')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="course-search" type="search" x-model.debounce.200ms="searchTerm" autocomplete="off"
                 :placeholder="view === 'catalog' ? t('sc.searchPlaceholder') : t('sc.searchInCourse')"
                 @keydown.escape.stop="searchTerm = ''"
                 class="h-11 w-full min-w-0 rounded-xl border border-line-strong bg-field pe-10 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none sm:text-sm">
          <button type="button" x-show="searchTerm" x-cloak @click="searchTerm = ''; $el.previousElementSibling.focus()"
                  class="absolute end-1.5 top-1/2 grid h-8 w-8 -translate-y-1/2 place-items-center rounded-lg text-muted hover:bg-soft hover:text-brand"
                  :aria-label="t('sc.clearSearch')">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <!-- فلتر الصف الدراسي — خياراته مشتقة من المقررات الفعلية — يظهر في مستوى الكتالوج فقط -->
        <div class="relative w-full shrink-0 lg:w-60" x-show="view === 'catalog'" x-cloak
             x-data="selectDropdown({
               id: 'grade-filter',
               options: () => gradeOptions,
               get: () => gradeFilter,
               set: (val) => gradeFilter = val,
             })"
             @click.outside="closeList()">
          <span id="grade-filter-label" class="sr-only" x-text="t('sc.gradeFilterLabel')"></span>
          <button type="button" id="grade-filter" x-ref="btn" role="combobox" aria-haspopup="listbox"
                  :aria-expanded="open.toString()" aria-controls="grade-filter-list" aria-labelledby="grade-filter-label grade-filter"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  class="field flex h-11 w-full items-center justify-between gap-2 text-start font-bold"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="grade-filter-list" role="listbox" aria-labelledby="grade-filter-label"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <span class="ms-auto shrink-0 text-xs font-bold tabular-nums text-muted" x-text="fmt(item.count)"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
        </div>

        <!-- مفتاح نطاق التصفّح الهرمي — داخل صفحة المقرر فقط -->
        <div class="inline-flex shrink-0 rounded-xl border border-line p-1" role="group" x-show="view === 'course'" x-cloak :aria-label="t('sc.hierarchyToggleLabel')">
          <template x-for="m in ['full', 'direct']" :key="m">
            <button type="button" class="btn btn-sm" :aria-pressed="(browseMode === m).toString()" @click="setMode(m)"
                    :class="browseMode === m ? 'btn-primary' : '!bg-transparent !text-muted !shadow-none hover:!bg-soft'">
              <i class="fa-solid" :class="m === 'full' ? 'fa-sitemap' : 'fa-diagram-project'" aria-hidden="true"></i>
              <span x-text="t(m === 'full' ? 'sc.browseFull' : 'sc.browseDirect')"></span>
            </button>
          </template>
        </div>
      </section>

      <!-- إعلان نتائج البحث/الفلترة لقارئ الشاشة -->
      <p class="sr-only" aria-live="polite" x-text="liveMsg"></p>

      <!-- ملاحظة تصفية المحتوى المنشور فقط (تُغني عن شارة «منشور» على كل عنصر) -->
      <p class="flex items-center gap-2 px-1 text-xs font-bold text-muted">
        <i class="fa-solid fa-circle-check text-success-700 dark:text-success-500" aria-hidden="true"></i>
        <span x-text="t('sc.publishedOnlyNote')"></span>
      </p>

      <!-- ====================================================================
           المستوى الأول — شبكة المقررات (تُرسم فقط عند عرض الكتالوج)
           ==================================================================== -->
      <template x-if="view === 'catalog'">
        <section id="catalog" aria-labelledby="catalog-title" class="space-y-3">
          <div class="flex flex-wrap items-end justify-between gap-2">
            <h2 id="catalog-title" class="text-lg font-extrabold text-ink sm:text-xl" x-text="t('sc.catalogTitle')"></h2>
            <p class="text-xs font-bold text-muted" x-text="catalogCountText"></p>
          </div>

          <div x-show="!filteredCourses.length" class="panel flex flex-col items-center gap-3 p-8 text-center">
            <span class="grid h-12 w-12 place-items-center rounded-full bg-soft text-brand" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>
            <p class="font-bold text-ink" x-text="t('sc.noCourses')"></p>
            <button type="button" class="btn btn-outline btn-sm" @click="resetFilters()" x-text="t('sc.resetFilters')"></button>
          </div>

          <ul class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" role="list">
            <template x-for="c in filteredCourses" :key="c.id">
              <li class="panel cv-auto flex flex-col gap-4 p-4 sm:p-5">
                <div class="flex items-center gap-3">
                  <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl" :class="c.tone" aria-hidden="true"><i class="fa-solid" :class="c.icon"></i></span>
                  <div class="min-w-0 flex-1">
                    <h3 :id="'course-' + c.id" class="truncate font-extrabold text-ink" x-text="c[locale]"></h3>
                    <p class="truncate text-xs text-muted" x-text="t('sc.grades.' + c.grade)"></p>
                  </div>
                </div>
                <ul class="flex flex-wrap gap-1.5 text-xs" role="list">
                  <li class="badge badge-muted"><i class="fa-solid fa-layer-group" aria-hidden="true"></i> <span x-text="pluralize('units', c.units.length)"></span></li>
                  <li class="badge badge-muted"><i class="fa-solid fa-chalkboard" aria-hidden="true"></i> <span x-text="pluralize('lessons', c.lessonCount)"></span></li>
                  <li class="badge badge-muted"><i class="fa-solid fa-lightbulb" aria-hidden="true"></i> <span x-text="pluralize('concepts', c.conceptCount)"></span></li>
                </ul>
                <p x-show="q && c.matchCount" class="rounded-lg bg-soft px-2.5 py-1.5 text-xs font-bold text-brand"
                   x-text="tf('sc.matchesInCourse', { n: pluralize('concepts', c.matchCount) })"></p>
                <div>
                  <div class="flex items-center justify-between text-xs font-bold">
                    <span class="text-muted" x-text="t('sc.progress')"></span>
                    <span class="tabular-nums" :class="tone(c.progress).text" x-text="fmtPct(c.progress)"></span>
                  </div>
                  <div class="quota-track mt-1.5" role="progressbar" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="c.progress"
                       :aria-label="t('sc.progress') + ': ' + c[locale]">
                    <div class="quota-fill" :class="tone(c.progress).bar" :style="'width:' + c.progress + '%'"></div>
                  </div>
                </div>
                <a :href="'?course=' + c.id" class="btn btn-primary btn-sm mt-auto w-full" @click.prevent="openCourse(c.id)"
                   :aria-label="t('sc.viewCourse') + ': ' + c[locale]">
                  <i class="fa-solid fa-book-open" aria-hidden="true"></i> <span x-text="t('sc.viewCourse')"></span>
                </a>
              </li>
            </template>
          </ul>
        </section>
      </template>

      <!-- ====================================================================
           المستويان الثاني والثالث — وحدات/دروس/مفاهيم المقرر المختار (تُرسم فقط عند فتح مقرر)
           ==================================================================== -->
      <template x-if="view === 'course' && course">
        <div id="course-detail" class="space-y-4 sm:space-y-6">

          <!-- رأس المقرر -->
          <section class="panel flex flex-wrap items-center gap-4 p-4 sm:p-5" aria-labelledby="course-title">
            <span class="grid h-14 w-14 shrink-0 place-items-center rounded-2xl text-xl" :class="course.tone" aria-hidden="true">
              <i class="fa-solid" :class="course.icon"></i>
            </span>
            <div class="min-w-0 flex-1">
              <h2 id="course-title" x-ref="courseTitle" tabindex="-1" class="truncate text-lg font-extrabold text-ink focus:outline-none sm:text-xl" x-text="course[locale]"></h2>
              <p class="truncate text-xs text-muted sm:text-sm" x-text="t('sc.grades.' + course.grade)"></p>
            </div>
            <div class="w-full sm:w-56">
              <div class="flex items-center justify-between text-xs font-bold">
                <span class="text-muted" x-text="t('sc.progress')"></span>
                <span class="tabular-nums" :class="tone(course.progress).text" x-text="fmtPct(course.progress)"></span>
              </div>
              <div class="quota-track mt-1.5" role="progressbar" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="course.progress" :aria-label="t('sc.progress')">
                <div class="quota-fill" :class="tone(course.progress).bar" :style="'width:' + course.progress + '%'"></div>
              </div>
              <p class="mt-1.5 text-xs text-muted"
                 x-text="[pluralize('units', course.units.length), pluralize('lessons', course.lessonCount), pluralize('concepts', course.conceptCount)].join(' · ')"></p>
            </div>
          </section>

          <!-- (أ) الشجرة الكاملة: وحدة › درس › مفهوم -->
          <section class="panel p-3 sm:p-5" x-show="browseMode === 'full'" aria-labelledby="tree-title">
            <div class="mb-3 flex flex-wrap items-center justify-between gap-2 px-1">
              <h2 id="tree-title" class="text-lg font-extrabold text-ink" x-text="t('sc.treeTitle')"></h2>
              <div class="flex items-center gap-1">
                <button type="button" class="btn btn-outline btn-sm" @click="expandAll(true)" x-text="t('sc.expandAll')"></button>
                <button type="button" class="btn btn-outline btn-sm" @click="expandAll(false)" x-text="t('sc.collapseAll')"></button>
              </div>
            </div>

            <p x-show="!tree.length" class="rounded-xl border border-dashed border-line p-6 text-center text-sm text-muted" x-text="t('sc.noMatchesInCourse')"></p>

            <ul class="space-y-1" role="list">
              <template x-for="u in tree" :key="u.id">
                <li>
                  <h3>
                    <button type="button" class="tree-row w-full text-start" @click="toggle(u.id)"
                            :aria-expanded="isOpen(u.id).toString()" :aria-controls="'br-' + u.id">
                      <i class="fa-solid fa-chevron-right tree-chevron" :class="isOpen(u.id) && 'is-open'" aria-hidden="true"></i>
                      <span class="level-chip" x-text="t('sc.unitWord')"></span>
                      <span class="min-w-0 flex-1 font-extrabold text-ink" x-text="u[locale]"></span>
                      <span class="badge badge-primary shrink-0"><i class="fa-solid fa-chalkboard" aria-hidden="true"></i> <span x-text="pluralize('lessons', u.lessons.length)"></span></span>
                    </button>
                  </h3>
                  <p class="ms-10 me-2 mt-0.5 text-xs leading-5 text-muted"><span class="font-bold" x-text="t('sc.objective') + ': '"></span><span x-text="locale === 'ar' ? u.objAr : u.objEn"></span></p>

                  <div :id="'br-' + u.id" x-show="isOpen(u.id)" x-collapse>
                    <ul class="tree-children mt-2 space-y-1" role="list">
                      <template x-for="l in u.lessons" :key="l.id">
                        <li>
                          <h4>
                            <button type="button" class="tree-row w-full text-start" @click="toggle(l.id)"
                                    :aria-expanded="isOpen(l.id).toString()" :aria-controls="'br-' + l.id">
                              <i class="fa-solid fa-chevron-right tree-chevron" :class="isOpen(l.id) && 'is-open'" aria-hidden="true"></i>
                              <span class="level-chip" x-text="t('sc.lessonWord')"></span>
                              <span class="min-w-0 flex-1 font-bold text-ink" x-text="l[locale]"></span>
                              <span class="badge badge-muted shrink-0"><i class="fa-regular fa-clock" aria-hidden="true"></i> <span x-text="pluralize('minutes', l.minutes)"></span></span>
                              <span class="badge badge-muted shrink-0"><i class="fa-solid fa-lightbulb" aria-hidden="true"></i> <span x-text="fmt(l.concepts.length)"></span><span class="sr-only" x-text="' ' + t('sc.conceptsWord')"></span></span>
                            </button>
                          </h4>
                          <div :id="'br-' + l.id" x-show="isOpen(l.id)" x-collapse>
                            <div class="tree-children mt-2">
                              <p class="px-2 pb-2 text-xs font-bold text-muted" x-text="t('sc.conceptsInLesson')"></p>
                              <ul class="grid gap-3 px-2 pb-3 sm:grid-cols-2" role="list">
                                <template x-for="k in l.concepts" :key="k.id">
                                  <li class="min-w-0">
                                    <article class="concept-card h-full" :aria-labelledby="'c-' + k.id + '-t'">
                                      <div class="min-w-0">
                                        <h5 :id="'c-' + k.id + '-t'" class="font-extrabold leading-6 text-ink" x-text="k[locale]"></h5>
                                        <p class="truncate text-xs text-muted" :lang="altLocale" :dir="altLocale === 'ar' ? 'rtl' : 'ltr'" x-text="k[altLocale]"></p>
                                      </div>
                                      <p class="text-sm leading-6 text-muted" x-text="locale === 'ar' ? k.descAr : k.descEn"></p>
                                      <div class="mt-auto flex flex-wrap items-center justify-between gap-2">
                                        <span class="badge badge-info"><i class="fa-solid fa-cubes" aria-hidden="true"></i> <span x-text="pluralize('los', k.los)"></span></span>
                                        <a :href="'concept-viewer.html?id=' + k.id" class="btn btn-primary btn-sm" :aria-label="t('sc.exploreConcept') + ': ' + k[locale]">
                                          <span x-text="t('sc.exploreConcept')"></span> <i class="fa-solid fa-arrow-right rtl:-scale-x-100" aria-hidden="true"></i>
                                        </a>
                                      </div>
                                    </article>
                                  </li>
                                </template>
                              </ul>
                            </div>
                          </div>
                        </li>
                      </template>
                    </ul>
                  </div>
                </li>
              </template>
            </ul>
          </section>

          <!-- (ب) العرض المباشر: مقرر › مفهوم (كل مفاهيم المقرر، مع مسارها) -->
          <section class="space-y-3" x-show="browseMode === 'direct'" aria-labelledby="direct-title">
            <div class="flex flex-wrap items-center justify-between gap-2 px-1">
              <h2 id="direct-title" class="text-lg font-extrabold text-ink" x-text="t('sc.directTitle')"></h2>
              <p class="text-xs font-bold text-muted" x-text="pluralize('concepts', directConcepts.length)"></p>
            </div>
            <p x-show="!directConcepts.length" class="panel p-6 text-center text-sm text-muted" x-text="t('sc.noMatchesInCourse')"></p>
            <ul class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" role="list">
              <template x-for="k in directConcepts" :key="k.id">
                <li class="min-w-0">
                  <article class="concept-card h-full" :aria-labelledby="'c-' + k.id + '-d'">
                    <div class="min-w-0">
                    <p class="truncate text-[11px] font-bold text-muted" x-text="k.unit[locale] + ' › ' + k.lesson[locale]"></p>
                      <h3 :id="'c-' + k.id + '-d'" class="font-extrabold leading-6 text-ink" x-text="k[locale]"></h3>
                      <p class="truncate text-xs text-muted" :lang="altLocale" :dir="altLocale === 'ar' ? 'rtl' : 'ltr'" x-text="k[altLocale]"></p>
                    </div>
                    <p class="text-sm leading-6 text-muted" x-text="locale === 'ar' ? k.descAr : k.descEn"></p>
                    <div class="mt-auto flex flex-wrap items-center justify-between gap-2">
                      <span class="badge badge-info"><i class="fa-solid fa-cubes" aria-hidden="true"></i> <span x-text="pluralize('los', k.los)"></span></span>
                      <a :href="'concept-viewer.html?id=' + k.id" class="btn btn-primary btn-sm" :aria-label="t('sc.exploreConcept') + ': ' + k[locale]">
                        <span x-text="t('sc.exploreConcept')"></span> <i class="fa-solid fa-arrow-right rtl:-scale-x-100" aria-hidden="true"></i>
                      </a>
                    </div>
                  </article>
                </li>
              </template>
            </ul>
          </section>
        </div>
      </template>

      <!-- رابط مقرر غير موجود / غير مسجَّل -->
      <template x-if="view === 'course' && !course">
        <section class="panel flex flex-col items-center gap-3 p-8 text-center" role="alert">
          <span class="grid h-12 w-12 place-items-center rounded-full bg-error-500/15 text-error-700 dark:text-red-300" aria-hidden="true"><i class="fa-solid fa-circle-exclamation"></i></span>
          <p class="font-bold text-ink" x-text="t('sc.courseNotFound')"></p>
          <a href="student-courses.html" class="btn btn-outline btn-sm" @click.prevent="backToCatalog()" x-text="t('sc.backToCatalog')"></a>
        </section>
      </template>
    </main>

    <!-- ================= Footer (كل النصوص عبر I18N) ================= -->
    <footer class="mt-auto border-t border-line bg-card/60"
          x-data="{ year: new Date().getFullYear() }"
          style="padding-bottom: env(safe-area-inset-bottom, 0px);">
    <div class="mx-auto flex w-full min-w-0 max-w-[1400px] flex-col gap-4 px-3 py-0 sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-8">

      <div class="flex min-w-0 items-center gap-3">
        <img src="../asset/images/firob-logo.png" alt="FirOb" loading="lazy" decoding="async" class="block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        <p class="min-w-0 text-sm text-muted"><span x-text="t('footer.tagline')"></span>

<script>
  /**
   * مكوّن القائمة المنسدلة المخصّصة (Combobox Listbox) — النسخة الموحّدة في المشروع:
   * Home/End، البحث بالكتابة (type-ahead)، Escape لا يتسرّب للنافذة، Tab يغلق القائمة.
   */
  function selectDropdown({ id, options, get, set, placeholder = '' }) {
    return {
      id, open: false, active: -1, typed: '', typedAt: 0,
      get items() { return options(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { const sel = this.selectedItem; return sel ? sel.label : (typeof placeholder === 'function' ? placeholder() : placeholder); },
      optId(item) { return this.id + '-opt-' + item.value; },
      openList() {
        if (!this.items.length) return;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item) { set(item.value); this.closeList(); this.$refs.btn?.focus(); },
      setActive(i) { this.active = Math.min(Math.max(i, 0), this.items.length - 1); this.scrollActiveIntoView(); },
      move(step) { if (!this.open) { this.openList(); return; } this.setActive(this.active + step); },
      onKey(e) {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); if (e.altKey && this.open && k === 'ArrowUp') { this.choose(this.items[this.active]); return; } this.move(k === 'ArrowDown' ? 1 : -1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.setActive(0); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.setActive(this.items.length - 1); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); (this.open && this.active > -1) ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape') { if (this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); } }
        else if (k === 'Tab') { if (this.open) this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          const now = Date.now();
          this.typed = (now - this.typedAt > 600 ? '' : this.typed) + k.toLowerCase();
          this.typedAt = now;
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this.typed));
          if (i > -1) { if (!this.open) this.openList(); this.setActive(i); }
        }
      },
      // children[0] هو <template x-for> — لذا +1
      scrollActiveIntoView() { this.$nextTick(() => this.$refs.list?.children[this.active + 1]?.scrollIntoView({ block: 'nearest' })); },
      isSelected(item) { const sel = this.selectedItem; return !!sel && sel.value === item.value; },
    };
  }

    return {
      /* ---------- حالة عامة ---------- */

      mobile: !desktopMQ.matches,

      notifOpen: false, profileOpen: false,

      get expanded() { return this.mobile || !this.collapsed; },
      get altLocale() { return this.locale === 'ar' ? 'en' : 'ar'; },
      get studentName() { return STUDENT[this.locale]; },
      get initials() { return STUDENT[this.locale].trim().split(/\s+/).slice(0, 2).map(w => w[0]).join(this.locale === 'ar' ? '‌' : '').toUpperCase(); },

      /* ---------- حالة التنقّل الهرمي (Drill-down) — متزامنة مع الرابط ---------- */
      view: 'catalog',            // 'catalog' | 'course'
      courseId: null,
      searchTerm: '',

      openMap: {},                // حالة فتح الوحدات/الدروس { id: true }

      get q() { return norm(this.searchTerm); },

      get course() { return COURSES.find(c => c.id === this.courseId) || null; },

      /* الكتالوج */
      courseMatchCount(c) { return this.q ? c.concepts.filter(k => this.matches(k) || this.matches(k.lesson) || this.matches(k.unit)).length : 0; },
      get filteredCourses() {
        return COURSES.filter(c => this.gradeFilter === 'all' || c.grade === this.gradeFilter)
          .map(c => ({ ...c, matchCount: this.courseMatchCount(c) }))
          .filter(c => !this.q || this.matches(c) || c.matchCount > 0);
      },
      get gradeOptions() {
        const grades = [...new Set(COURSES.map(c => c.grade))].sort();
        return [{ value: 'all', label: this.t('sc.gradeAll'), count: COURSES.length }]
          .concat(grades.map(g => ({ value: g, label: this.t('sc.grades.' + g), count: COURSES.filter(c => c.grade === g).length })));
      },
      get catalogCountText() {
        const n = this.filteredCourses.length;
        return n === COURSES.length ? this.tf('sc.thisTerm', { n: this.pluralize('courses', n) })
                                    : this.tf('sc.shownOf', { n: this.fmt(n), total: this.pluralize('courses', COURSES.length) });
      },
      resetFilters() { this.searchTerm = ''; this.gradeFilter = 'all'; },

      /* الشجرة المفلترة: وحدة مطابقة ← كل دروسها؛ درس مطابق ← كل مفاهيمه؛ وإلا المفاهيم المطابقة فقط */

        const c = this.course; if (!c) return [];
        if (!this.q) return c.units;
        return c.units.map(u => {
          if (this.matches(u)) return u;
          const lessons = u.lessons.map(l => this.matches(l) ? l : { ...l, concepts: l.concepts.filter(k => this.matches(k)) })
                                   .filter(l => l.concepts.length || this.matches(l));
          return lessons.length ? { ...u, lessons } : null;
        }).filter(Boolean);
      },
      get directConcepts() {
        const c = this.course; if (!c) return [];
        return c.concepts.filter(k => this.matches(k) || this.matches(k.lesson) || this.matches(k.unit));
      },
      isOpen(id) { return !!this.openMap[id]; },
      toggle(id) { this.openMap = { ...this.openMap, [id]: !this.openMap[id] }; },
      expandAll(on) {
        const m = {};
        if (on) this.tree.forEach(u => { m[u.id] = true; u.lessons.forEach(l => { m[l.id] = true; }); });
        this.openMap = m;
      },
      defaultOpen() {
        if (this.q) { this.expandAll(true); return; }
        const first = this.course?.units[0];
        this.openMap = first ? { [first.id]: true } : {};
      },

      openCourse(id, push = true) {
        this.courseId = id; this.view = 'course';
        // يبقى البحث كما هو: يُصفّي شجرة المقرر ويوسّع الفروع المطابقة مباشرة
        this.defaultOpen();
        if (push) this.syncUrl(true);
        this.$nextTick(() => { window.scrollTo({ top: 0 }); this.$refs.courseTitle?.focus({ preventScroll: true }); this.announce(); });
      },
      backToCatalog(push = true) {
        const from = this.courseId;
        this.view = 'catalog'; this.courseId = null; this.openMap = {};
        if (push) this.syncUrl(true);
        this.$nextTick(() => {
          // إرجاع التركيز إلى زر المقرر الذي فُتح منه
          const btn = from && document.querySelector('a[href="?course=' + from + '"]');
          if (btn) btn.focus(); else document.getElementById('main')?.focus();
          this.announce();
        });
      },
      setMode(m) { this.browseMode = m; this.syncUrl(false); this.announce(); },

      syncUrl(push) {
        const p = new URLSearchParams();
        if (this.view === 'course' && this.courseId) p.set('course', this.courseId);
        if (this.view === 'course' && this.browseMode === 'direct') p.set('mode', 'direct');
        if (this.searchTerm.trim()) p.set('q', this.searchTerm.trim());
        if (this.view === 'catalog' && this.gradeFilter !== 'all') p.set('grade', this.gradeFilter);
        const url = location.pathname + (p.toString() ? '?' + p : '');
        const state = { course: this.view === 'course' ? this.courseId : null };
        try { push ? history.pushState(state, '', url) : history.replaceState(state, '', url); } catch (e) {}
      },
      readUrl() {
        const p = new URLSearchParams(location.search);
        this.searchTerm = p.get('q') || '';
        this.gradeFilter = this.gradeOptions.some(o => o.value === p.get('grade')) ? p.get('grade') : 'all';
        this.browseMode = p.get('mode') === 'direct' ? 'direct' : 'full';
        const id = p.get('course');
        if (id) { this.courseId = id; this.view = 'course'; this.defaultOpen(); }   // معرّف غير موجود ← حالة «غير موجود»
        else { this.view = 'catalog'; this.courseId = null; }
      },
      announce() {
        const n = this.view === 'catalog' ? this.filteredCourses.length : (this.browseMode === 'direct' ? this.directConcepts.length : this.tree.reduce((s, u) => s + u.lessons.reduce((a, l) => a + l.concepts.length, 0), 0));
        this.liveMsg = this.view === 'catalog' ? this.tf('sc.liveCourses', { n: this.pluralize('courses', n) }) : this.tf('sc.liveConcepts', { n: this.pluralize('concepts', n) });
      },

      tone(p) {

        return p >= 75 ? { bar: 'bg-success-700 dark:bg-success-500', text: 'text-success-700 dark:text-success-500' }
                       : { bar: 'bg-primary-500', text: 'text-brand' };
      },

      /* ---------- الترجمة والتنسيق ---------- */
      t(path) {
        const dict = I18N[this.locale];
        return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), dict) ?? path;
      },
      tf(path, vars) { return String(this.t(path)).replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] != null ? vars[k] : '')); },
      get intlLocale() { return this.locale === 'ar' ? 'ar-u-nu-latn' : 'en-US'; },
      fmt(n) { return new Intl.NumberFormat(this.intlLocale).format(n); },
      fmtPct(n) { return n == null ? '—' : this.fmt(n) + '%'; },
      pluralize(key, n) {
        const forms = this.t('plural.' + key);
        const cat = new Intl.PluralRules(this.locale).select(n);
        return ((n === 0 && forms.zero) || forms[cat] || forms.other).replace('{n}', this.fmt(n));
      },
      relMin(min) {
        const rtf = new Intl.RelativeTimeFormat(this.intlLocale, { numeric: 'auto', style: 'short' });
        return min < 60 ? rtf.format(-min, 'minute') : (min < 1440 ? rtf.format(-Math.round(min / 60), 'hour') : rtf.format(-Math.round(min / 1440), 'day'));
      },
      setLocale(loc) {

        document.documentElement.lang = loc;
        document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
        document.title = this.t('docTitle');

        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}

        this.readUrl();
        try { history.replaceState({ course: this.view === 'course' ? this.courseId : null }, '', location.href); } catch (e) {}
        window.addEventListener('popstate', () => { this.readUrl(); this.$nextTick(() => this.announce()); });

        this.$watch('searchTerm', () => {
          if (this.view === 'course') this.defaultOpen();
          this.syncUrl(false); this.announce();
        });
        this.$watch('gradeFilter', () => { this.syncUrl(false); this.announce(); });
      },
      onGlobalKey(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const g = document.getElementById('course-search') || this.$refs.globalSearch;
          if (g && g.offsetParent !== null) g.focus();
        }
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      closeAll() {
        this.notifOpen = false; this.profileOpen = false; this.mobileNav = false;
      },
    };
  }
</script>
</body>
</html>
