<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>نتيجة الاختبار — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 127 143 166;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: 2px solid rgb(var(--brand)); outline-offset: 2px; }  /* outline لا يتعارض مع ظلال المكونات ويعمل في forced-colors */
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft; }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  {@apply bg-accent-500/20 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }  /* كان 3.93:1 في الداكن */
    .badge-neutral { @apply bg-neutral-200 text-ink dark:bg-soft-2; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }
    .badge-warning { @apply bg-warning-500/15 text-warning-800 dark:text-warning-500; }  /* كان 4.28:1 */

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-muted; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- أشرطة التقدّم (ProgressMeter) ---------- */
    .quota-track { @apply h-1.5 w-full overflow-hidden rounded-full bg-line; }
    .quota-fill { @apply h-full rounded-full transition-[width] duration-500; }
    /* ---------- تلميحات أزرار الإجراءات (Action Tooltips) ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .overlay-backdrop { -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .overlay-backdrop { -webkit-backdrop-filter: none; backdrop-filter: none; }
      header.app-topbar { -webkit-backdrop-filter: none; backdrop-filter: none; background-color: rgb(var(--card)); }
    }

    /* ---------- مؤشر صحة/خطأ الإجابة (AnswerIndicator) ---------- */
    .ans-indicator { @apply grid h-9 w-9 shrink-0 place-items-center rounded-full text-sm; }

    /* ---------- بطاقة سؤال قابلة للطيّ (QuestionAccordion) ---------- */
    .q-trigger { @apply flex w-full items-start justify-between gap-3 p-4 text-start transition hover:bg-soft/60 sm:p-5; }

    /* ---------- الطباعة / حفظ PDF ---------- */
    @media print {
      aside#sidebar, header.app-topbar, footer, .no-print { display: none !important; }
      body { background: #fff !important; }
      .panel { box-shadow: none !important; break-inside: avoid; }
      .q-panel { display: block !important; height: auto !important; overflow: visible !important; }
      .q-trigger .fa-chevron-down { display: none; }
    }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }
  }
</style>

<!-- ⑥ Alpine.js (+ Focus لحصر التركيز + Collapse للبطاقات القابلة للطيّ) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

</head>

<body x-data="shell()" x-init="init()" @keydown.escape.window="closeAll()"
      @keydown.window="onGlobalKey($event)"
      :class="{ 'overflow-hidden': mobileNav && mobile }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="overlay-backdrop fixed inset-0 z-40 bg-primary-900/60 lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="t('mainMenu')"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:sticky lg:top-0 lg:h-[100dvh] lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <a href="student-dashboard.html" class="inline-flex min-w-0 flex-1 items-center gap-3 rounded-lg focus-visible:ring-2" :class="!expanded && 'lg:flex-none lg:justify-center'" :aria-label="t('appTitle')">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </a>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="t('mainNav')">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold text-muted ltr:tracking-wide" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); } else if (mobile) { mobileNav = false; }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="(item.key === 'notificationCenter' ? unread : item.count) && expanded"
                        class="shrink-0 rounded-full text-xs"
                        :class="item.tone === 'primary' ? 'bg-primary-500/10 px-2 py-0.5 font-bold text-brand' : 'bg-accent-500 px-2 font-extrabold text-onaccent'"
                        x-text="item.key === 'notificationCenter' ? unread : item.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid rtl:-scale-x-100" :class="collapsed ? 'fa-angles-right' : 'fa-angles-left'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="flex min-w-0 flex-1 flex-col">

    <!-- ================= Topbar ================= -->
    <header class="app-topbar sticky top-0 z-30 flex flex-col border-b border-line bg-card/90 backdrop-blur-sm">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd dir="ltr" aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex">Ctrl K</kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <!-- جرس الإشعارات -->
          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-controls="notif-menu" :aria-expanded="notifOpen.toString()"
                    :aria-label="t('notifications') + (unread ? ' (' + fmt(unread) + ')' : '')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="t('notif.' + n.key)"></p>
                      <p class="text-xs text-muted" x-text="relMin(n.min)"></p>
                    </div>
                  </li>
                </template>
              </ul>
              <div class="border-t border-line p-2">
                <a href="../common/notifications.html" class="menu-item justify-center text-brand" @click="notifOpen = false">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  <span x-text="t('viewAllNotif')"></span>
                </a>
              </div>
            </div>
          </div>

          <!-- قائمة الملف الشخصي -->
          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" class="flex max-w-[14rem] items-center gap-2 rounded-xl p-1 transition hover:bg-soft md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    aria-haspopup="menu" :aria-expanded="profileOpen.toString()" aria-controls="profile-menu" :aria-label="studentName + ' — ' + t('accountMenu')">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true" x-text="initials"></span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="studentName"></span>
                <span class="block truncate text-xs text-muted" x-text="t('roleStudent')"></span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted md:block" aria-hidden="true"></i>
            </button>
            <div id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-56" role="menu" :aria-label="t('accountMenu')">
              <a href="../common/profile.html" role="menuitem" class="menu-item"><i class="fa-regular fa-user w-4 text-brand" aria-hidden="true"></i> <span x-text="t('profile')"></span></a>

<script>
  /**
   * حالة واجهة شاشة «نتيجة المحاولة» (STU-06).
   * المحاولة من ?attempt= عبر المصدر المشترك (لوحة الطالب + السجل + ما سُلِّم من مشغّل الاختبار).
   * لا نسبة ولا «ناجح/راسب» قبل اكتمال التصحيح؛ «ملاحظة المعلّم» منفصلة عن «شرح الذكاء الاصطناعي».
   * في Laravel: policy (الطالب صاحب المحاولة + النتيجة منشورة) وإظهار الإجابة الصحيحة حسب إعداد الاختبار.
   */
  function shell() {
    const desktopMQ = window.matchMedia('(min-width: 1024px)');

    /* ================= محاولات الطالب — مصدر واحد مشترك بين: لوحة الطالب، سجل المحاولات، صفحة النتيجة =================
       كل درجة/نسبة/حالة محسوبة من الإجابات نفسها (لا أرقام مكتوبة يدويًا).
       earned = null ⇒ السؤال بانتظار تصحيح المعلّم ⇒ المحاولة «بانتظار التصحيح» ولا نسبة/نجاح نهائي.
       + المحاولات المُسلَّمة فعليًا من quiz-player.html (localStorage: firob-attempt-done:CODE) تُدمج تلقائيًا. */
    const T = (ar, en) => ({ ar, en });
    const M = (math) => ({ math });
    const SA_DAY = 864e5;
    const SA_TODAY = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();

    const SUBJECT_META = {
      'math-g11': { ar: 'الرياضيات', en: 'Mathematics', icon: 'fa-square-root-variable' },
      'phys-g11': { ar: 'الفيزياء', en: 'Physics', icon: 'fa-atom' },
      'arab-g11': { ar: 'اللغة العربية', en: 'Arabic Language', icon: 'fa-language' },
      'hist-g11': { ar: 'التاريخ', en: 'History', icon: 'fa-landmark' },
      'chem-g11': { ar: 'الكيمياء', en: 'Chemistry', icon: 'fa-flask' },
      'engl-g11': { ar: 'اللغة الإنجليزية', en: 'English Language', icon: 'fa-spell-check' },
    };

    const SA_RAW = [
      { id: 'ATT-2210-09', code: 'QZ-C11-104', subject: 'chem-g11', title: T('اختبار الروابط الكيميائية', 'Chemical Bonds Quiz'),
        attemptNo: 1, attemptsAllowed: 2, daysAgo: 3, at: [10, 5], durationSec: 1260, timeAllowed: 30, passMark: 60, questions: [
        { type: 'mcq', bloom: 'remember', marks: 10, earned: 10, q: T('ما نوع الرابطة في جزيء كلوريد الصوديوم؟', 'What type of bond is in sodium chloride?'), math: 'NaCl',
          yours: T('أيونية', 'Ionic'), correct: T('أيونية', 'Ionic'), grader: 'auto', fb: T('صحيح: انتقال إلكترون من Na إلى Cl يكوّن أيونين متجاذبين.', 'Correct: an electron moves from Na to Cl, forming attracting ions.') },
        { type: 'tf', bloom: 'understand', marks: 10, earned: 10, q: T('الرابطة التساهمية تنتج عن مشاركة الإلكترونات.', 'A covalent bond results from sharing electrons.'),
          yours: T('صواب', 'True'), correct: T('صواب', 'True'), grader: 'auto', fb: T('صحيح.', 'Correct.') },
        { type: 'mcq', bloom: 'apply', marks: 10, earned: 0, q: T('كم رابطة تساهمية يكوّنها الكربون عادةً؟', 'How many covalent bonds does carbon usually form?'),
          yours: M('2'), correct: M('4'), grader: 'auto', fb: T('للكربون أربعة إلكترونات تكافؤ، فيكوّن أربع روابط.', 'Carbon has four valence electrons, so it forms four bonds.') },
        { type: 'essay', bloom: 'analyze', marks: 10, earned: null, q: T('قارن بين الرابطة الأيونية والتساهمية من حيث درجة الانصهار.', 'Compare ionic and covalent bonds in terms of melting point.'),

      en: {

        roleStudent: 'Student',
        breadcrumb: { home: 'Home' },
        navGroups: { overview: 'Overview', learning: 'Learning', account: 'Account' },
        navItems: {
          dashboard: 'Dashboard', courses: 'Courses', catalog: 'Public Catalog',
          availableQuizzes: 'Available Quizzes', quizResults: 'Quiz Results', quizHistory: 'Attempt History',
          profile: 'Profile', notificationCenter: 'Notification Center',
        },
        notif: {
          resultPublished: 'Result published for "Chapter 3 Quiz" — Mathematics',
          upcomingReminder: '"Periodic Table Quiz" is due tomorrow — Chemistry',
          gradePosted: 'Your teacher manually graded "Grammar Rules Quiz"',
        },
        footer: {
          tagline: 'Central Educational Repository', rights: 'All rights reserved', navLabel: 'Footer links', screenMap: 'Screen map',
          help: 'Help Center', docs: 'Documentation', privacy: 'Privacy Policy', terms: 'Terms of Use', systemsOk: 'All systems operational',
        },
        plural: {
          questions: { zero: 'no questions', one: '{n} question', other: '{n} questions' },
        },

        qr: {
          title: 'Quiz Result', toHistory: 'My attempt history', latestShown: 'Showing your latest attempt — pick another one from your history.',
          notFound: 'We couldn’t find this attempt among yours.',
          status: { passed: 'Passed', failed: 'Failed', pending: 'Awaiting teacher grading' },
          attemptOf: 'Attempt {n} of {m}',
          grades: { excellent: 'Excellent', veryGood: 'Very Good', good: 'Good', needsImprovement: 'Needs Improvement' },
          pendingNote: 'Your final score and result appear once your teacher grades the essay questions.',
          pointsEarned: 'Score', pointsSoFar: 'Score on graded questions', passMark: 'Pass mark', timeSpent: 'Time spent', submittedAt: 'Submitted',
          localSummary: 'Attempt submitted — you answered {n} of {m}.', localHint: 'The per-question breakdown will appear here after grading.',

          bloomTitle: 'Performance by Cognitive Level (Bloom’s Taxonomy)', bloomSubtitle: 'Your score at each thinking level — so you know where to focus your review.',
          bloomPending: 'Computed from graded questions only, for now.',
          bloom: { remember: 'Remember', understand: 'Understand', apply: 'Apply', analyze: 'Analyze' },
          level: { strong: 'Strong', good: 'Good', fair: 'Fair', weak: 'Needs review' },
          bloomBasis: '{e} of {m} marks across {n}', smallSample: 'small sample',

          answersTitle: 'Answer Breakdown', viewLabel: 'View', viewAll: 'All ({n})', viewMistakes: 'My mistakes ({n})',
          expandAll: 'Expand all', collapseAll: 'Collapse all',
          questionN: 'Question {n}', type: { mcq: 'Multiple choice', tf: 'True / False', essay: 'Essay' },
          state: { full: 'Correct', partial: 'Partial credit', zero: 'Incorrect', pending: 'Awaiting grading' },
          yourAnswer: 'Your answer', correctAnswer: 'Correct answer', noAnswer: 'Not answered',
          teacherNote: 'Teacher’s note', aiExplanation: 'AI-assisted explanation', awaitingTeacher: 'This question is awaiting teacher grading.',

          printReport: 'Print / Save as PDF', backToCourse: 'Course page', retakeQuiz: 'Retake Quiz',
          retakeAvailable: 'You can retake this quiz.', retakeMax: 'All allowed attempts for this quiz are used.',
          retakePending: 'Retake becomes available once grading is final.', retakeNewer: 'A newer attempt exists for this quiz.',
        },
      },
    };

    const STATUS = {
      passed:  { badge: 'badge-success', text: 'text-success-700 dark:text-success-500', icon: 'fa-circle-check' },
      failed:  { badge: 'badge-danger',  text: 'text-error-700 dark:text-red-300',       icon: 'fa-circle-xmark' },
      pending: { badge: 'badge-warning', text: 'text-warning-800 dark:text-warning-500', icon: 'fa-hourglass-half' },
    };
    const TONE = {
      full:    { ind: 'bg-success-500/15 text-success-700 dark:text-success-500', icon: 'fa-check',              badge: 'badge-success' },
      partial: { ind: 'bg-warning-500/15 text-warning-800 dark:text-warning-500', icon: 'fa-circle-half-stroke', badge: 'badge-warning' },
      zero:    { ind: 'bg-error-500/15 text-error-700 dark:text-red-300',         icon: 'fa-xmark',              badge: 'badge-danger' },
      pending: { ind: 'bg-accent-500/20 text-yellow-900 dark:text-accent-500',    icon: 'fa-hourglass-half',     badge: 'badge-muted' },
    };
    const toneOf = (q) => q.earned == null ? 'pending' : (q.earned >= q.marks ? 'full' : (q.earned > 0 ? 'partial' : 'zero'));

    return {
      /* ---------- حالة عامة ---------- */
      dark: document.documentElement.classList.contains('dark'),
      locale: document.documentElement.lang === 'en' ? 'en' : 'ar',
      mobile: !desktopMQ.matches,
      mobileNav: false,
      collapsed: false,
      notifOpen: false, profileOpen: false,
      active: 'quizResults',
      liveMsg: '',
      STATUS, TONE,
      get expanded() { return this.mobile || !this.collapsed; },
      get studentName() { return STUDENT[this.locale]; },
      get initials() { return STUDENT[this.locale].trim().split(/\s+/).slice(0, 2).map(w => w[0]).join(this.locale === 'ar' ? '‌' : '').toUpperCase(); },
      announce(msg) { this.liveMsg = ''; this.$nextTick(() => { this.liveMsg = msg; }); },

      /* ---------- المحاولة ---------- */
      a: CURRENT,
      defaulted: !reqId && !!CURRENT,
      get qs() { return (this.a?.questions || []).map((q, idx) => ({ ...q, idx, tone: toneOf(q) })); },
      get mistakes() { return this.qs.filter(q => q.tone === 'zero' || q.tone === 'partial'); },
      view: 'all',
      openSet: {},
      get visibleQs() { return this.view === 'mistakes' ? this.mistakes : this.qs; },
      get allOpen() { return this.visibleQs.length > 0 && this.visibleQs.every(q => this.openSet[q.idx]); },
      isOpen(i) { return !!this.openSet[i]; },
      toggle(i) { this.openSet = { ...this.openSet, [i]: !this.openSet[i] }; },
      toggleAll() { const on = !this.allOpen, m = { ...this.openSet }; this.visibleQs.forEach(q => { m[q.idx] = on; }); this.openSet = m; },
      setView(v) {
        this.view = v;
        if (v === 'mistakes') { const m = { ...this.openSet }; this.mistakes.forEach(q => { m[q.idx] = true; }); this.openSet = m; }
        this.announce(this.tf(v === 'mistakes' ? 'qr.viewMistakes' : 'qr.viewAll', { n: this.fmt(this.visibleQs.length) }));
      },
      answerText(v) { return v ? (v.math || v[this.locale] || '') : ''; },

      get attemptLabel() { return this.a ? this.tf('qr.attemptOf', { n: this.fmt(this.a.attemptNo), m: this.fmt(this.a.attemptsAllowed) }) : ''; },
      get gradeKey() {
        const p = this.a?.pct ?? 0;
        return p >= 85 ? 'excellent' : p >= 70 ? 'veryGood' : p >= 60 ? 'good' : 'needsImprovement';
      },
      get bloomGroups() {
        return ['remember', 'understand', 'apply', 'analyze'].map(key => {
          const items = this.qs.filter(q => q.bloom === key && q.earned != null);
          const earned = items.reduce((s, q) => s + q.earned, 0), max = items.reduce((s, q) => s + q.marks, 0);
          const pct = max ? Math.round(earned / max * 100) : 0;
          const level = pct >= 85 ? 'strong' : pct >= 70 ? 'good' : pct >= 50 ? 'fair' : 'weak';
          const tone = { strong: { bar: 'bg-success-700 dark:bg-success-500', text: 'text-success-700 dark:text-success-500' },
                         good:   { bar: 'bg-primary-500', text: 'text-brand' },
                         fair:   { bar: 'bg-warning-500', text: 'text-warning-800 dark:text-warning-500' },
                         weak:   { bar: 'bg-error-600 dark:bg-red-400', text: 'text-error-700 dark:text-red-300' } }[level];
          return { key, earned, max, n: items.length, pct, level, tone };
        }).filter(g => g.max > 0);
      },
      hasNewer() { return ATT.some(b => b.code === this.a.code && b.id !== this.a.id && b.date > this.a.date); },
      get canRetake() { return !!this.a && !this.a.pending && !this.hasNewer() && this.a.attemptNo < this.a.attemptsAllowed; },
      get retakeReason() { return !this.a ? '' : this.t(this.a.pending ? 'qr.retakePending' : (this.hasNewer() ? 'qr.retakeNewer' : 'qr.retakeMax')); },
      printReport() {
        const m = {}; this.qs.forEach(q => { m[q.idx] = true; }); this.openSet = m; this.view = 'all';
        setTimeout(() => window.print(), 350);          // بعد اكتمال حركة الطيّ
      },

      subjectName(id) { return (SUBJECT_META[id] || { ar: id, en: id })[this.locale]; },
      subjectIcon(id) { return (SUBJECT_META[id] || {}).icon || 'fa-book'; },

      /* ---------- الترجمة والتنسيق ---------- */
      t(path) {
        const dict = I18N[this.locale];
        return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), dict) ?? path;
      },
      tf(path, vars) { return String(this.t(path)).replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] != null ? vars[k] : '')); },
      get intlLocale() { return this.locale === 'ar' ? 'ar-u-nu-latn' : 'en-US'; },
      fmt(n) { return new Intl.NumberFormat(this.intlLocale).format(n); },
      fmtPct(n) { return n == null ? '—' : this.fmt(n) + '%'; },
      fmtDate(d) { return new Intl.DateTimeFormat(this.intlLocale, { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }).format(d); },
      fmtDuration(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); },
      pluralize(key, n) {
        const forms = this.t('plural.' + key);
        const cat = new Intl.PluralRules(this.locale).select(n);
        return ((n === 0 && forms.zero) || forms[cat] || forms.other).replace('{n}', this.fmt(n));
      },
      relMin(min) {
        const rtf = new Intl.RelativeTimeFormat(this.intlLocale, { numeric: 'auto', style: 'short' });
        return min < 60 ? rtf.format(-min, 'minute') : (min < 1440 ? rtf.format(-Math.round(min / 60), 'hour') : rtf.format(-Math.round(min / 1440), 'day'));
      },
      updateTitle() { document.title = (this.a ? this.a.title[this.locale] + ' — ' : '') + this.t('qr.title') + ' — FirOb'; },
      setLocale(loc) {
        this.locale = loc;
        document.documentElement.lang = loc;
        document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
        this.updateTitle();
        try { localStorage.setItem('firob-locale', loc); } catch (e) {}
      },
      toggleLocale() { this.setLocale(this.locale === 'ar' ? 'en' : 'ar'); },

      nav: [
        { group: 'overview', items: [
          { key: 'dashboard', icon: 'fa-solid fa-gauge-high', href: 'student-dashboard.html' },
        ]},
        { group: 'learning', items: [
          { key: 'courses', icon: 'fa-solid fa-book-open', href: 'student-courses.html' },
          { key: 'catalog', icon: 'fa-solid fa-layer-group', href: 'learning-objects-catalog.html' },
          { key: 'availableQuizzes', icon: 'fa-solid fa-pen-to-square', href: 'quiz-player.html' },
          { key: 'quizResults', icon: 'fa-solid fa-chart-simple', href: 'student-quiz-result.html' },
          { key: 'quizHistory', icon: 'fa-solid fa-clock-rotate-left', href: 'student-quiz-history.html' },
        ]},
        { group: 'account', items: [
          { key: 'profile', icon: 'fa-regular fa-user', href: '../common/profile.html' },
          { key: 'notificationCenter', icon: 'fa-regular fa-bell', href: '../common/notifications.html', tone: 'primary' },
        ]},
      ],
      notifications: [
        { id: 1, key: 'resultPublished', min: 15,   read: false, icon: 'fa-solid fa-square-check', tone: 'bg-success-500/15 text-success-700 dark:text-success-500' },
        { id: 2, key: 'upcomingReminder', min: 120, read: false, icon: 'fa-regular fa-clock', tone: 'bg-accent-500/20 text-yellow-900 dark:text-accent-500' },
        { id: 3, key: 'gradePosted', min: 1440,     read: true,  icon: 'fa-solid fa-pen', tone: 'bg-primary-500/15 text-brand' },
      ],
      get unread() { return this.notifications.filter(n => !n.read).length; },

      init() {
        this.updateTitle();
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        const m = {}; this.mistakes.forEach(q => { m[q.idx] = true; }); this.openSet = m;   // الأخطاء مفتوحة افتراضيًا — هي ما يحتاج الطالب مراجعته
      },
      onGlobalKey(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const g = this.$refs.globalSearch;
          if (g && g.offsetParent !== null) g.focus();
        }
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },
    };
  }
