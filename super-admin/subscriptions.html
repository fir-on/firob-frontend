      },
      humanSize(mb) {
        mb = Number(mb) || 0;
        const f = (n) => new Intl.NumberFormat(SA.fmtLocale(this.locale), { maximumFractionDigits: 2 }).format(n);
        if (mb >= 1024 * 1024) return f(mb / 1024 / 1024) + ' TB';
        if (mb >= 1024) return f(mb / 1024) + ' GB';
        return f(mb) + ' MB';
      },
      compactNumber(n) { return new Intl.NumberFormat(SA.fmtLocale(this.locale), { notation: 'compact', maximumFractionDigits: 2 }).format(Number(n) || 0); },
      quotaPct(used, limit) { return limit ? Math.min(100, Math.round((used / limit) * 100)) : 0; },
      quotaBarClass(pct) { return pct >= 100 ? 'bg-error-600' : pct > 80 ? 'bg-accent-500' : 'bg-primary-500'; },
      quotaTextClass(pct) { return pct >= 100 ? 'text-error-700 dark:text-red-300' : pct > 80 ? 'text-yellow-900 dark:text-accent-500' : 'text-muted'; },
      diffClass(oldV, newV) { return newV > oldV ? 'text-success-700 dark:text-success-500' : newV < oldV ? 'text-error-700 dark:text-red-300' : 'text-ink'; },
      quotaRows(s) {
        const p = this.planById(s.plan_id); const u = s.usage;
        return [
          { key: 'users', label: 'sb.soUsers', pct: this.quotaPct(u.usersUsed, p.max_users), text: this.fmtNum(u.usersUsed) + ' / ' + this.fmtNum(p.max_users) },
          { key: 'storage', label: 'sb.soStorage', pct: this.quotaPct(u.storageUsedMb, p.max_storage_mb), text: this.humanSize(u.storageUsedMb) + ' / ' + this.humanSize(p.max_storage_mb) },
          { key: 'ai', label: 'sb.soAiTokens', pct: this.quotaPct(u.aiTokensUsed, p.ai_token_quota_monthly), text: this.fmtNum(u.aiTokensUsed) + ' / ' + this.fmtNum(p.ai_token_quota_monthly) },
        ];
      },

      statusLabel(s) { return this.t('sb.status.' + s); },
      statusClass(s) { return { active: 'badge-success', trialing: 'badge-info', past_due: 'badge-warning', expired: 'badge-muted', cancelled: 'badge-danger', paused: 'badge-neutral' }[s] || 'badge-muted'; },
      statusDotClass(s) { return { active: 'text-success-500', trialing: 'text-info-500', past_due: 'text-warning-500', expired: 'text-line-strong', cancelled: 'text-error-500', paused: 'text-muted' }[s] || 'text-line-strong'; },
      cancelReasonLabel(r) { return r ? this.t('sb.reasonOptions.' + r) : '—'; },
      invState(inv) { return SA.invoiceState(inv, this.payments); },
      invStatusLabel(s) { return this.t('sb.invStatus.' + s); },
      invStatusClass(s) { return { paid: 'badge-success', partially_paid: 'badge-info', unpaid: 'badge-warning', overdue: 'badge-danger', refunded: 'badge-neutral', void: 'badge-muted' }[s] || 'badge-muted'; },
      invoicesFor(s) {
        if (!s) return [];
        return this.invoices.filter(i => i.tenant_id === s.tenant_id)
          .sort((a, b) => (a.issue_date === b.issue_date ? b.id - a.id : (a.issue_date < b.issue_date ? 1 : -1)));
      },
      invoiceLineLabel(inv) {
        const it = inv.items[0]; if (!it) return '';
        const plan = this.planName(this.planById(it.plan_id));
        let s = it.description_key === 'sub' ? this.tf('sb.invLineSub', { plan })
          : it.description_key === 'renewal' ? this.tf('sb.invLineRenewal', { plan, n: this.fmtNum(it.qty) })
          : it.description_key === 'proration' ? this.tf('sb.invLineProration', { plan })
          : (it.description ? (it.description[this.locale] || it.description.ar) : '');
        if (inv.items.length > 1) s += ' ' + this.tf('sb.moreItems', { n: this.fmtNum(inv.items.length - 1) });
        return s;
      },

      daysLeft(s) { return SA.daysBetween(SA.todayIso(), s.ends_at); },
      daysRemainingLabel(s) {
        if (!s.ends_at) return '—';
        const n = this.daysLeft(s);
        if (s.status === 'paused') return this.t('sb.status.paused');
        if (s.status === 'cancelled') return this.t('sb.cancelledShort');
        if (s.status === 'past_due') return n >= 0 ? this.t('sb.dueToday') : this.tf('sb.dueSince', { n: this.fmtNum(Math.abs(n)) });
        if (n < 0) return this.tf('sb.endedDaysAgo', { n: this.fmtNum(Math.abs(n)) });
        if (n === 0) return this.t('sb.endsToday');
        if (n === 1) return this.t('sb.daysLeftOne');
        return this.tf('sb.daysLeft', { n: this.fmtNum(n) });
      },
      daysRemainingClass(s) {
        if (['cancelled', 'expired', 'paused'].includes(s.status)) return 'text-muted';
        if (s.status === 'past_due') return 'text-warning-700 dark:text-warning-500';
        return this.daysLeft(s) <= 7 ? 'text-warning-700 dark:text-warning-500' : 'text-muted';
      },

      /* ---------- مؤشرات KPI (محسوبة من الحالة الحالية) ---------- */
      mrrOf(subs) { return SA.m.sum(subs.filter(s => BILLABLE.includes(s.status)).map(s => this.planById(s.plan_id).price_monthly)); },
      isExpiring(s) { if (!['active', 'trialing'].includes(s.status)) return false; const n = this.daysLeft(s); return n >= 0 && n <= 30; },
      get kpis() {
        const subs = this.subscriptions;
        return {
          active: subs.filter(s => s.status === 'active').length,
          trialing: subs.filter(s => s.status === 'trialing').length,
          expiring: subs.filter(s => this.isExpiring(s)).length,
          billable: subs.filter(s => BILLABLE.includes(s.status)).length,
          mrr: this.mrrOf(subs),
        };
      },

      /* ---------- بحث / فلاتر / ترتيب / ترقيم ---------- */
      search: '', statusFilter: 'all', planFilter: 'all',
      sortKey: 'starts_at', sortDir: 'desc', page: 1, pageSize: 8,
      sortCols: [
        { key: 'tenant', label: 'sb.colTenant' }, { key: 'plan', label: 'sb.colPlan' }, { key: 'status', label: 'sb.colStatus' },
        { key: 'starts_at', label: 'sb.colStart' }, { key: 'ends_at', label: 'sb.colEnd' },
      ],
      get statusTabs() {
        const labels = { all: 'tabAll', active: 'tabActive', trialing: 'tabTrialing', past_due: 'tabPastDue', paused: 'tabPaused', expired: 'tabExpired', cancelled: 'tabCancelled' };
        return Object.keys(labels).map(k => ({
          key: k, label: this.t('sb.' + labels[k]),
          count: k === 'all' ? this.subscriptions.length : this.subscriptions.filter(s => s.status === k).length,
        }));
      },
      setStatusFilter(k) { this.statusFilter = k; },
      onTabsKey(e) {
        const keys = this.statusTabs.map(x => x.key);
        const next = this.rovingIndex(e, keys.indexOf(this.statusFilter), keys.length);
        if (next === null) return;
        this.statusFilter = keys[next];
        this.$nextTick(() => document.getElementById('st-tab-' + keys[next])?.focus());
      },
      /* مؤشر التنقل الدوّار (RTL-aware): يعيد الفهرس الجديد أو null */
      rovingIndex(e, cur, len, vertical = false) {
        const rtl = document.documentElement.dir === 'rtl';
        let step = 0;
        if (e.key === 'ArrowRight') step = rtl ? -1 : 1;
        else if (e.key === 'ArrowLeft') step = rtl ? 1 : -1;
        else if (vertical && e.key === 'ArrowDown') step = 1;
        else if (vertical && e.key === 'ArrowUp') step = -1;
        else if (e.key === 'Home') { e.preventDefault(); return 0; }
        else if (e.key === 'End') { e.preventDefault(); return len - 1; }
        else return null;
        e.preventDefault();
        return ((cur < 0 ? 0 : cur + step) % len + len) % len;
      },
      get hasFilters() { return !!this.search.trim() || this.statusFilter !== 'all' || this.planFilter !== 'all'; },
      matches(s) {
        const q = norm(this.search);
        const plan = this.planById(s.plan_id);
        const hay = norm([s.tenant.name.ar, s.tenant.name.en, s.tenant.domain, plan.name.ar, plan.name.en, plan.code].join(' '));
        const matchesStatus = this.statusFilter === 'all' || (this.statusFilter === 'expiring' ? this.isExpiring(s) : s.status === this.statusFilter);
        const matchesPlan = this.planFilter === 'all' || plan.code === this.planFilter;
        return (!q || hay.includes(q)) && matchesStatus && matchesPlan;
      },
      sortValue(s, key) {
        if (key === 'tenant') return this.tenantName(s.tenant);
        if (key === 'plan') return this.planById(s.plan_id).price_monthly;
        if (key === 'status') return this.statusLabel(s.status);
        return s[key] || '';
      },
      get filteredSubs() {
        const dir = this.sortDir === 'asc' ? 1 : -1, key = this.sortKey;
        const coll = new Intl.Collator(SA.fmtLocale(this.locale));
        return this.subscriptions.filter(s => this.matches(s)).sort((a, b) => {
          const va = this.sortValue(a, key), vb = this.sortValue(b, key);
          const c = typeof va === 'number' ? va - vb : coll.compare(String(va), String(vb));
          return (c || a.id - b.id) * dir;
        });
      },
      get pageCount() { return Math.max(1, Math.ceil(this.filteredSubs.length / this.pageSize)); },
      get pagedSubs() { const p = Math.min(this.page, this.pageCount); return this.filteredSubs.slice((p - 1) * this.pageSize, p * this.pageSize); },
      get pageFrom() { return this.filteredSubs.length ? (Math.min(this.page, this.pageCount) - 1) * this.pageSize + 1 : 0; },
      get pageTo() { return Math.min(this.filteredSubs.length, Math.min(this.page, this.pageCount) * this.pageSize); },
      goPage(n) {
        const p = Math.min(Math.max(1, n), this.pageCount);
        if (p === this.page) return;
        this.page = p;
        this.announce(this.tf('sb.livePage', { n: this.fmtNum(p), total: this.fmtNum(this.pageCount) }));
      },
      sortBy(key) {
        if (this.sortKey === key) this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
        else { this.sortKey = key; this.sortDir = ['starts_at', 'ends_at'].includes(key) ? 'desc' : 'asc'; }
        this.page = 1;
        const col = this.t(this.sortCols.find(c => c.key === key).label);
        this.announce(this.tf('sb.liveSorted', { col, dir: this.t(this.sortDir === 'asc' ? 'sb.sortAsc' : 'sb.sortDesc') }));
      },
      ariaSort(key) { return this.sortKey === key ? (this.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'; },
      get sortSummary() {
        const col = this.sortCols.find(c => c.key === this.sortKey);
        return this.tf('sb.sortedBy', { col: this.t(col.label), dir: this.t(this.sortDir === 'asc' ? 'sb.sortAsc' : 'sb.sortDesc') });
      },
      onFiltersChanged() {
        this.page = 1;
        this.announce(this.tf('sb.liveResults', { n: this.fmtNum(this.filteredSubs.length) }));
      },
      resetFilters() { this.search = ''; this.statusFilter = 'all'; this.planFilter = 'all'; this.onFiltersChanged(); },

      /* ---------- قواعد العمل وصلاحية الإجراءات ---------- */
      tenantHasCurrent(tenant_id, excludeId) {
        return this.subscriptions.some(s => s.tenant_id === tenant_id && s.id !== excludeId && CURRENT.includes(s.status));
      },
      availableTenants() { return this.tenantsPool.filter(tn => !this.tenantHasCurrent(tn.id)); },
      isCurrent(s) { return CURRENT.includes(s.status); },
      isReactivation(s) { return !!s && (s.status === 'expired' || s.status === 'cancelled'); },
      renewBlockedByRule(s) { return this.isReactivation(s) && this.tenantHasCurrent(s.tenant_id, s.id); },
      canEdit(s) { return ['active', 'trialing', 'past_due', 'paused'].includes(s.status); },
      canUpgrade(s) { return ['active', 'trialing', 'past_due'].includes(s.status); },
      canRenew(s) { return !this.renewBlockedByRule(s); },
      canCancel(s) { return ['active', 'trialing', 'past_due', 'paused'].includes(s.status); },
      canPause(s) { return ['active', 'trialing', 'past_due'].includes(s.status); },
      canResume(s) { return s.status === 'paused'; },
      canToggleAutoRenew(s) { return CURRENT.includes(s.status); },
      rowActions(s) {
        const paused = s.status === 'paused';
        return [
          { key: 'view', icon: 'fa-regular fa-eye', label: this.t('sb.viewDetails'), disabled: false },
          { key: 'edit', icon: 'fa-solid fa-pen', label: this.t('sb.menuEdit'), disabled: !this.canEdit(s) },
          { key: 'upgrade', icon: 'fa-solid fa-arrow-right-arrow-left', label: this.t('sb.menuUpgrade'), disabled: !this.canUpgrade(s) },
          { key: 'renew', icon: 'fa-solid fa-rotate', label: this.isReactivation(s) ? this.t('sb.menuReactivate') : this.t('sb.menuRenew'), disabled: !this.canRenew(s) },
          { key: 'pause', icon: paused ? 'fa-solid fa-play' : 'fa-solid fa-pause', label: paused ? this.t('sb.menuResume') : this.t('sb.menuPause'), disabled: !this.canPause(s) && !this.canResume(s) },
          { key: 'cancel', icon: 'fa-solid fa-ban', label: this.t('sb.menuCancel'), danger: true, disabled: !this.canCancel(s) },
        ];
      },
      runAction(key, s) {
        const a = this.rowActions(s).find(x => x.key === key);
        if (!a) return;
        if (a.disabled) { this.announce(this.tf('sb.liveUnavailable', { action: a.label, name: this.tenantName(s.tenant) })); return; }
        ({ view: () => this.openDetails(s), edit: () => this.openEditModal(s), upgrade: () => this.openUpgradeModal(s), renew: () => this.openRenewModal(s),
           pause: () => (s.status === 'paused' ? this.menuResume(s) : this.menuPause(s)), cancel: () => this.openCancelModal(s) })[key]();
      },

      /* ---------- إدارة التركيز ---------- */
      soOpener: null, modalOpener: null, confirmOpener: null,
      restoreFocus(el) {
        this.$nextTick(() => setTimeout(() => {
          if (el && el.isConnected !== false && typeof el.focus === 'function') el.focus();
          else document.getElementById('main')?.focus?.();
        }, 30));
      },

      /* ---------- Slide-over التفاصيل ---------- */
      slideOverOpen: false, selectedId: null, soTab: 'overview',
      get selected() { return this.subscriptions.find(s => s.id === this.selectedId) || null; },
      openDetails(s) {
        this.soOpener = document.activeElement;
        this.selectedId = s.id; this.soTab = 'overview';
        this.slideOverOpen = true;
      },
      closeDetails() { if (!this.slideOverOpen) return; this.slideOverOpen = false; this.restoreFocus(this.soOpener); },
      onSoTabsKey(e) {
        const tabs = ['overview', 'invoices'];
        const next = this.rovingIndex(e, tabs.indexOf(this.soTab), tabs.length);
        if (next === null) return;
        this.soTab = tabs[next];
        this.$nextTick(() => document.getElementById('so-tab-' + tabs[next])?.focus());
      },

      /* ---------- حوار التأكيد العام ---------- */
      confirmDlg: { open: false, title: '', text: '', confirmLabel: '', danger: false },
      askConfirm({ title, text, confirmLabel, danger = false }) {
        this.confirmOpener = document.activeElement;
        this.confirmDlg = { open: true, title, text, confirmLabel, danger };
        return new Promise(res => { confirmResolve = res; });
      },
      resolveConfirm(ok) {
        const r = confirmResolve; confirmResolve = null;
        this.confirmDlg = { open: false, title: '', text: '', confirmLabel: '', danger: false };
        this.restoreFocus(this.confirmOpener);
        if (r) r(ok);
      },

      /* ---------- النوافذ ---------- */
      modal: null, busy: false, activeSubId: null,
      get activeSub() { return this.subscriptions.find(s => s.id === this.activeSubId) || null; },
      wait(ms = 400) { return new Promise(r => setTimeout(r, ms)); },
      openModal(name, s) {
        this.modalOpener = document.activeElement;
        this.activeSubId = s ? s.id : null;
        this.modal = name;
      },
      closeModal() {
        if (this.busy || !this.modal) return;
        this.modal = null; this.activeSubId = null;
        this.restoreFocus(this.modalOpener);
      },
      focusField(id) { this.$nextTick(() => document.getElementById(id)?.focus?.()); },

      /* ---------- إنشاء / تعديل اشتراك (الانتهاء محسوب) ---------- */
      subForm: { mode: 'new', id: null, tenant_id: '', plan_id: 2, status: 'trialing', billing_cycle: 'monthly', starts_at: SA.todayIso() },
      formErrors: { tenant: '', plan: '', starts_at: '' },
      trialDaysFor(planId) { const p = this.planById(planId); return (p && p.trial_days) || 14; },
      computeEndDate(f) {
        if (!isIso(f.starts_at)) return '';
        return f.status === 'trialing' ? SA.addDays(this.trialDaysFor(f.plan_id), f.starts_at) : addPeriod(f.starts_at, f.billing_cycle, 1);
      },
      get formEndDate() { return this.computeEndDate(this.subForm); },
      subLine(planId, months, key = 'sub') {
        const p = this.planById(planId);
        return { description_key: key, plan_id: planId, qty: months, unit_price: p.price_monthly };
      },
      get formInvoicePreview() {
        const f = this.subForm, p = this.planById(f.plan_id);
        if (f.mode !== 'new' || f.status !== 'active' || !p || !p.price_monthly) return null;
        return SA.invoiceTotals({ items: [this.subLine(f.plan_id, monthsOf(f.billing_cycle))] });
      },
      openNewModal() {
        this.formErrors = { tenant: '', plan: '', starts_at: '' };
        this.subForm = { mode: 'new', id: null, tenant_id: this.availableTenants()[0]?.id || '', plan_id: 2, status: 'trialing', billing_cycle: 'monthly', starts_at: SA.todayIso() };
        this.openModal('form', null);
      },
      openEditModal(s) {
        if (!this.canEdit(s)) return;
        this.formErrors = { tenant: '', plan: '', starts_at: '' };
        this.subForm = { mode: 'edit', id: s.id, tenant_id: s.tenant_id, plan_id: s.plan_id, status: s.status === 'trialing' ? 'trialing' : 'active', billing_cycle: s.billing_cycle, starts_at: s.starts_at };
        this.openModal('form', s);
      },
      validateSubForm() {
        const f = this.subForm, e = { tenant: '', plan: '', starts_at: '' };
        if (f.mode === 'new') {
          if (!f.tenant_id) e.tenant = this.t('sb.errTenant');
          else if (this.tenantHasCurrent(f.tenant_id)) e.tenant = this.t('sb.errTenantTaken');
        }
        const p = this.planById(f.plan_id);
        if (!p || (f.mode === 'new' && !p.is_active)) e.plan = this.t('sb.errPlan');
        if (!isIso(f.starts_at)) e.starts_at = this.t('sb.errStart');
        else if (Math.abs(SA.daysBetween(SA.todayIso(), f.starts_at)) > 365) e.starts_at = this.t('sb.errStartRange');
        else if (this.computeEndDate(f) <= SA.todayIso()) e.starts_at = this.t('sb.errEndPast');
        this.formErrors = e;
        return e;
      },
      async saveSubscription() {
        if (this.busy) return false;
        const e = this.validateSubForm();
        const firstBad = e.tenant ? 'nf-tenant-btn' : e.plan ? 'nf-plan-btn' : e.starts_at ? 'nf-start' : null;
        if (firstBad) { this.announce(e.tenant || e.plan || e.starts_at); this.focusField(firstBad); return false; }
        const f = { ...this.subForm };
        this.busy = true;
        await this.wait();
        let msg;
        if (f.mode === 'new') {
          const tenant = this.tenantById(f.tenant_id);
          const sub = {
            id: Math.max(...this.subscriptions.map(s => s.id)) + 1, tenant_id: f.tenant_id, plan_id: f.plan_id, status: f.status,
            auto_renew: f.status === 'active', starts_at: f.starts_at, ends_at: this.computeEndDate(f),
            cancelled_at: null, cancel_reason: null, cancel_note: null, scheduledPlanId: null,
            usage: { usersUsed: 0, storageUsedMb: 0, aiTokensUsed: 0 },
            billing_cycle: f.status === 'trialing' ? 'monthly' : f.billing_cycle, credit_minor: 0, tenant,
          };
          this.subscriptions.unshift(sub);
          msg = this.tf('sb.toastCreated', { name: this.tenantName(tenant) });
          if (f.status === 'active' && this.planById(f.plan_id).price_monthly > 0) {
            const inv = this.createInvoice(sub, [this.subLine(f.plan_id, monthsOf(sub.billing_cycle))]);
            msg += ' ' + this.invoiceMsg(inv);
          }
        } else {
          const sub = this.subscriptions.find(s => s.id === f.id);
          sub.billing_cycle = f.billing_cycle;
          sub.starts_at = f.starts_at;
          sub.ends_at = this.computeEndDate(f);
          msg = this.tf('sb.toastEdited', { name: this.tenantName(sub.tenant), date: this.fmtDate(sub.ends_at) });
        }
        this.busy = false;
        this.closeModal();
        this.notify(msg);
        return true;
      },

      /* ---------- الفواتير ---------- */
      nextInvoiceNumber() {
        const year = SA.today().getFullYear();
        const seq = this.invoices.map(i => /^INV-(\d{4})-(\d+)$/.exec(i.invoice_number)).filter(m => m && +m[1] === year).map(m => +m[2]);
        return 'INV-' + year + '-' + String((seq.length ? Math.max(...seq) : 0) + 1).padStart(4, '0');
      },
      createInvoice(sub, items) {
        const inv = {
          id: Math.max(...this.invoices.map(i => i.id)) + 1, invoice_number: this.nextInvoiceNumber(),
          tenant_id: sub.tenant_id, subscription_id: sub.id, issue_date: SA.todayIso(), due_date: SA.addDays(15),
          items, voided_at: null, void_reason: null, status_override: null,
        };
        this.invoices.unshift(inv);
        return inv;
      },
      invoiceMsg(inv) { return this.tf('sb.toastInvoice', { inv: inv.invoice_number, total: this.money(SA.invoiceTotals(inv).total) }); },

      /* ---------- التجديد ---------- */
      renewForm: { cycle: 'monthly', count: 1, note: '' },
      renewError: '',
      renewBase(s) {
        const today = SA.todayIso();
        return this.isReactivation(s) ? (s.ends_at > today ? s.ends_at : today) : s.ends_at;
      },
      maxPeriods(cycle) { return cycle === 'yearly' ? 3 : 12; },
      validPeriods(f) { return Number.isInteger(f.count) && f.count >= 1 && f.count <= this.maxPeriods(f.cycle); },
      get renewEndDate() {
        const s = this.activeSub;
        if (!s || !this.validPeriods(this.renewForm)) return '';
        return addPeriod(this.renewBase(s), this.renewForm.cycle, this.renewForm.count);
      },
      get renewPlanId() { const s = this.activeSub; return s ? (s.scheduledPlanId || s.plan_id) : null; },
      get renewInvoicePreview() {
        const s = this.activeSub; if (!s || !this.renewEndDate) return null;
        const p = this.planById(this.renewPlanId);
        if (!p.price_monthly) return null;
        return SA.invoiceTotals({ items: [this.subLine(p.id, monthsOf(this.renewForm.cycle, this.renewForm.count), 'renewal')] });
      },
      /* حارس: تاريخ الانتهاء الجديد يجب أن يكون بعد الحالي وبعد اليوم */
      renewEndError(s, iso) {
        if (!iso || !isIso(iso)) return this.t('sb.errPeriods');
        if (iso <= s.ends_at) return this.tf('sb.errEndNotAfter', { date: this.fmtDate(s.ends_at) });
        if (iso <= SA.todayIso()) return this.t('sb.errEndPast');
        return '';
      },
      openRenewModal(s) {
        if (!this.canRenew(s)) return;
        this.renewForm = { cycle: s.billing_cycle || 'monthly', count: 1, note: '' };
        this.renewError = '';
        this.openModal('renew', s);
      },
      async applyRenew() {
        const s = this.activeSub;
        if (this.busy || !s || this.renewBlockedByRule(s)) return false;
        const newEnd = this.renewEndDate;
        const err = !this.validPeriods(this.renewForm) ? this.t('sb.errPeriods') : this.renewEndError(s, newEnd);
        if (err) { this.renewError = err; this.announce(err); this.focusField('rf-count'); return false; }
        const preview = this.renewInvoicePreview, planId = this.renewPlanId, months = monthsOf(this.renewForm.cycle, this.renewForm.count);
        this.busy = true;
        await this.wait();
        s.plan_id = planId; s.scheduledPlanId = null;
        s.ends_at = newEnd;
        s.billing_cycle = this.renewForm.cycle;
        if (['past_due', 'expired', 'cancelled'].includes(s.status)) { s.status = 'active'; s.cancelled_at = null; s.cancel_reason = null; s.cancel_note = null; }
        let msg = this.tf('sb.toastRenewed', { name: this.tenantName(s.tenant), date: this.fmtDate(newEnd) });
        if (preview) msg += ' ' + this.invoiceMsg(this.createInvoice(s, [this.subLine(planId, months, 'renewal')]));
        this.busy = false;
        this.closeModal();
        this.notify(msg);
        return true;
      },

      /* ---------- تغيير الباقة ---------- */
      upgradeForm: { new_plan_id: null, applyWhen: 'immediate' },
      get planChoices() { const s = this.activeSub; return s ? this.plans.filter(p => p.is_active && p.id !== s.plan_id) : []; },
      planTabIndex(p, i) {
        const sel = this.upgradeForm.new_plan_id;
        const has = this.planChoices.some(x => x.id === sel);
        return (has ? p.id === sel : i === 0) ? 0 : -1;
      },
      pickPlan(id) { this.upgradeForm.new_plan_id = id; },
      onPlanKey(e) {
        const list = this.planChoices;
        const next = this.rovingIndex(e, list.findIndex(p => p.id === this.upgradeForm.new_plan_id), list.length, true);
        if (next === null) return;
        this.pickPlan(list[next].id);
        this.$nextTick(() => document.getElementById('um-plan-' + list[next].id)?.focus());
      },
      /* حدود الباقة الهدف التي يتجاوزها الاستهلاك الحالي */
      limitIssues(sub, plan) {
        if (!sub || !plan) return [];
        const u = sub.usage, out = [];
        if (u.usersUsed > plan.max_users) out.push({ key: 'users', label: 'sb.comparisonUsers', used: u.usersUsed, limit: plan.max_users });
        if (u.storageUsedMb > plan.max_storage_mb) out.push({ key: 'storage', label: 'sb.comparisonStorage', used: u.storageUsedMb, limit: plan.max_storage_mb });
        if (u.aiTokensUsed > plan.ai_token_quota_monthly) out.push({ key: 'ai', label: 'sb.comparisonAiTokens', used: u.aiTokensUsed, limit: plan.ai_token_quota_monthly });
        return out;
      },
      get upgradeIssues() { return this.limitIssues(this.activeSub, this.planById(this.upgradeForm.new_plan_id)); },
      issueText(iss) {
        const f = iss.key === 'storage' ? (v) => this.humanSize(v) : (v) => this.fmtNum(v);
        return this.tf('sb.limitIssue', { limit: this.t(iss.label), used: f(iss.used), max: f(iss.limit) });
      },
      comparisonRows(sub, planId) {
        const a = this.planById(sub.plan_id), b = this.planById(planId);
        if (!a || !b) return [];
        return [
          { key: 'users', label: 'sb.comparisonUsers', a: a.max_users, b: b.max_users, from: this.fmtNum(a.max_users), to: this.fmtNum(b.max_users) },
          { key: 'storage', label: 'sb.comparisonStorage', a: a.max_storage_mb, b: b.max_storage_mb, from: this.humanSize(a.max_storage_mb), to: this.humanSize(b.max_storage_mb) },
          { key: 'ai', label: 'sb.comparisonAiTokens', a: a.ai_token_quota_monthly, b: b.ai_token_quota_monthly, from: this.compactNumber(a.ai_token_quota_monthly), to: this.compactNumber(b.ai_token_quota_monthly) },
          { key: 'price', label: 'sb.comparisonPrice', a: a.price_monthly, b: b.price_monthly, from: this.planPriceLabel(a), to: this.planPriceLabel(b) },
        ];
      },
      /* الاحتساب التناسبي بالهللة: الأيام المتبقية ÷ أيام الفترة × فرق سعر الفترة */
      prorationFor(sub, planId) {
        const from = this.planById(sub.plan_id), to = this.planById(planId);
        if (!from || !to || !BILLABLE.includes(sub.status)) return { applicable: false, remaining: 0, period: 0, diff: 0, amount: 0 };
        const periodStart = addPeriod(sub.ends_at, sub.billing_cycle, -1);
        const period = SA.daysBetween(periodStart, sub.ends_at);
        const remaining = Math.min(Math.max(SA.daysBetween(SA.todayIso(), sub.ends_at), 0), period);
        const diff = (to.price_monthly - from.price_monthly) * monthsOf(sub.billing_cycle);
        const amount = period > 0 ? Math.round(remaining * diff / period) : 0;
        return { applicable: true, remaining, period, diff, amount };
      },
      get proration() { const s = this.activeSub; return s && this.upgradeForm.new_plan_id ? this.prorationFor(s, this.upgradeForm.new_plan_id) : null; },
      get prorationInvoiceTotal() { const p = this.proration; return p && p.amount > 0 ? SA.invoiceTotals({ items: [{ qty: 1, unit_price: p.amount }] }).total : 0; },
      openUpgradeModal(s) {
        if (!this.canUpgrade(s)) return;
        this.upgradeForm = { new_plan_id: null, applyWhen: 'immediate' };
        this.openModal('upgrade', s);
      },
      async applyUpgrade() {
        const s = this.activeSub, planId = this.upgradeForm.new_plan_id;
        if (this.busy || !s || !planId) return false;
        if (this.upgradeIssues.length) { this.announce(this.t('sb.liveBlocked')); return false; }
        const pr = this.prorationFor(s, planId);
        this.busy = true;
        await this.wait();
        let msg;
        if (this.upgradeForm.applyWhen === 'immediate') {
          s.plan_id = planId; s.scheduledPlanId = null;
          msg = this.tf('sb.toastUpgraded', { name: this.tenantName(s.tenant) });
          if (pr.amount > 0) msg += ' ' + this.invoiceMsg(this.createInvoice(s, [{ description_key: 'proration', plan_id: planId, qty: 1, unit_price: pr.amount }]));
          else if (pr.amount < 0) { s.credit_minor += -pr.amount; msg += ' ' + this.tf('sb.toastCredit', { amount: this.money(-pr.amount) }); }
        } else {
          s.scheduledPlanId = planId;
          msg = this.tf('sb.toastScheduled', { name: this.tenantName(s.tenant) });
        }
        this.busy = false;
        this.closeModal();
        this.notify(msg);
        return true;
      },

      /* ---------- الإلغاء ---------- */
      cancelForm: { reason: '', note: '' },
      cancelErrors: { reason: '', note: '' },
      cancelImpact(s) {
        if (!s) return [];
        const out = [this.t('sb.impactAccess')];
        if (s.auto_renew) out.push(this.t('sb.impactAutoRenew'));
        if (BILLABLE.includes(s.status)) {
          const price = this.planById(s.plan_id).price_monthly;
          if (price > 0) out.push(this.tf('sb.impactMrr', { amount: this.money(price) }));
        }
        if (s.scheduledPlanId) out.push(this.t('sb.impactScheduled'));
        return out;
      },
      openCancelModal(s) {
        if (!this.canCancel(s)) return;
        this.cancelForm = { reason: '', note: '' };
        this.cancelErrors = { reason: '', note: '' };
        this.openModal('cancel', s);
      },
      async applyCancel() {
        const s = this.activeSub;
        if (this.busy || !s) return false;
        const e = { reason: '', note: '' };
        if (!this.cancelForm.reason) e.reason = this.t('sb.errReason');
        if (this.cancelForm.reason === 'other' && (this.cancelForm.note || '').trim().length < 5) e.note = this.t('sb.errNote');
        this.cancelErrors = e;
        if (e.reason || e.note) { this.announce(e.reason || e.note); this.focusField(e.reason ? 'cf-reason-btn' : 'cf-notes'); return false; }
        this.busy = true;
        await this.wait();
        s.status = 'cancelled';
        s.cancelled_at = SA.todayIso();
        s.cancel_reason = this.cancelForm.reason;
        s.cancel_note = this.cancelForm.note || null;
        s.auto_renew = false;
        s.scheduledPlanId = null;
        this.busy = false;
        this.closeModal();
        this.notify(this.tf('sb.toastCancelled', { name: this.tenantName(s.tenant) }));
        return true;
      },

      /* ---------- إيقاف / استئناف ---------- */
      async menuPause(s) {
        if (!this.canPause(s)) return false;
        const ok = await this.askConfirm({ title: this.t('sb.pauseConfirmTitle'), text: this.tf('sb.pauseConfirmText', { name: this.tenantName(s.tenant) }), confirmLabel: this.t('sb.pauseBtn') });
        if (!ok) return false;
        s._statusBeforePause = s.status;
        s.status = 'paused';
        this.notify(this.tf('sb.toastPaused', { name: this.tenantName(s.tenant) }));
        return true;
      },
      menuResume(s) {
        if (!this.canResume(s)) return false;
        s.status = (s._statusBeforePause && s._statusBeforePause !== 'paused') ? s._statusBeforePause : 'active';
        delete s._statusBeforePause;
        this.notify(this.tf('sb.toastResumed', { name: this.tenantName(s.tenant) }));
        return true;
      },

      /* ---------- التجديد التلقائي (الإيقاف يتطلب تأكيدًا) ---------- */
      autoRenewLabel(s) { return this.tf('sb.autoRenewFor', { name: this.tenantName(s.tenant) }); },
      async toggleAutoRenew(s) {
        if (!this.canToggleAutoRenew(s)) { this.announce(this.tf('sb.liveUnavailable', { action: this.t('sb.autoRenew'), name: this.tenantName(s.tenant) })); return false; }
        if (s.auto_renew) {
          const ok = await this.askConfirm({
            title: this.t('sb.autoRenewOffTitle'),
            text: this.tf('sb.autoRenewOffText', { name: this.tenantName(s.tenant), date: this.fmtDate(s.ends_at) }),
            confirmLabel: this.t('sb.autoRenewOffBtn'), danger: true,
          });
          if (!ok) return false;
        }
        s.auto_renew = !s.auto_renew;
        this.notify(this.tf(s.auto_renew ? 'sb.toastAutoRenewOn' : 'sb.toastAutoRenewOff', { name: this.tenantName(s.tenant) }));
        return true;
      },

      /* ---------- تصدير CSV (BOM + اقتباس + منع حقن الصيغ) ---------- */
      csvCell(v) {
        let s = String(v ?? '');
        if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
        return '"' + s.replace(/"/g, '""') + '"';
      },
      buildCsv(rows) {
        const k = ['id', 'tenant', 'domain', 'plan', 'price', 'currency', 'cycle', 'status', 'autoRenew', 'start', 'end'];
        const lines = [k.map(x => this.csvCell(this.t('sb.csv.' + x))).join(',')];
        rows.forEach(s => {
          const p = this.planById(s.plan_id);
          lines.push([
            s.id, this.tenantName(s.tenant), s.tenant.domain, this.planName(p), (SA.m.toMajor(p.price_monthly)).toFixed(2), SA.CURRENCY,
            this.t('sb.cycle.' + s.billing_cycle), this.statusLabel(s.status), this.t(s.auto_renew ? 'sb.yes' : 'sb.no'), s.starts_at, s.ends_at,
          ].map(v => this.csvCell(v)).join(','));
        });
        return '﻿' + lines.join('\r\n');
      },
      exportCsv() {
        const rows = this.filteredSubs;
        if (!rows.length) return;
        const blob = new Blob([this.buildCsv(rows)], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'subscriptions-' + SA.todayIso() + '.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        this.announce(this.tf('sb.liveExported', { n: this.fmtNum(rows.length) }));
      },

      /* ---------- إشعار: منطقة حية + Toast (بلا HTML) ---------- */
      notify(text) {
        this.announce(text);
        if (typeof Swal === 'undefined') return;
        Swal.fire({
          toast: true, position: this.locale === 'ar' ? 'top-start' : 'top-end',
          showConfirmButton: false, timer: 3600, timerProgressBar: true,
          icon: 'success', titleText: text,
          customClass: { popup: 'firob-swal firob-toast' },
          didOpen: (popup) => popup.setAttribute('dir', this.locale === 'ar' ? 'rtl' : 'ltr'),
        });
      },

      /* ---------- عامة ---------- */
      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; this.wide = m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        document.title = this.t('docTitle');
        ['search', 'statusFilter', 'planFilter'].forEach(k => this.$watch(k, () => this.onFiltersChanged()));
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      /* Escape عام: يغلق الطبقة العليا فقط */
      closeAll() {
        if (this.confirmDlg.open) { this.resolveConfirm(false); return; }
        if (this.modal) { this.closeModal(); return; }
        if (this.slideOverOpen) { this.closeDetails(); return; }
        this.notifOpen = false; this.profileOpen = false; this.mobileNav = false;
      },
    };
  }
</script>
</body>
</html>
