<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>إدارة الاشتراكات — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  { @apply bg-accent-500/25 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-warning { @apply bg-warning-500/15 text-warning-700 dark:text-warning-500; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-line-strong; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-4 py-2.5 text-start text-sm font-medium text-ink transition-colors hover:bg-soft; }
    .combo-option.is-active   { @apply bg-soft; }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }
    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- النافذة المنبثقة (Modal) ---------- */
    .modal-panel { @apply relative flex max-h-[90dvh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }

    /* ---------- مقياس الحصة (QuotaMeter) ---------- */
    .quota-track { @apply h-1.5 w-full overflow-hidden rounded-full bg-line; }
    .quota-fill { @apply h-full rounded-full transition-all duration-500; }

    /* ---------- مقطع أزرار (Segmented control) ---------- */
    .seg { @apply inline-flex items-center gap-1 rounded-xl border border-line bg-card p-1; }
    .seg-btn { @apply inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-bold text-muted transition; }
    .seg-btn[aria-pressed="true"] { @apply bg-primary-500 text-white shadow; }

    /* ---------- تبويبات الحالة (Status Tabs) ---------- */
    .status-tab { @apply relative inline-flex shrink-0 items-center gap-2 whitespace-nowrap rounded-xl border border-line bg-card px-3.5 py-2 text-sm font-bold text-muted transition hover:bg-soft hover:text-ink; }
    .status-tab[aria-pressed="true"] { @apply border-primary-500 bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .status-tab .tab-count { @apply grid h-5 min-w-5 place-items-center rounded-full bg-line px-1 text-[11px] font-extrabold text-ink; }
    .status-tab[aria-pressed="true"] .tab-count { @apply bg-white/25 text-white; }

    /* ---------- بطاقة اختيار (SelectCard) ---------- */
    .pick-card { @apply relative flex cursor-pointer flex-col gap-1 rounded-xl border-2 border-line bg-page/50 p-3.5 text-start transition hover:border-primary-500; }
    .pick-card[data-checked="true"] { @apply border-primary-500 bg-primary-500/10; }
    .pick-card[data-disabled="true"] { @apply pointer-events-none cursor-not-allowed opacity-45; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }
</style>

<!-- ⑥ Alpine.js (+ إضافة Focus لحصر التركيز داخل النوافذ المنبثقة) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- ⑦ SweetAlert2 -->
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- ⑧ Flatpickr — تقويم موحّد لحقول التاريخ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
<link rel="stylesheet" href="../asset/css/firob-datepicker.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ar.js"></script>
<script src="../asset/js/firob-datepicker.js"></script>
</head>

<body x-data="shell()" x-init="init()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch.focus(); }"
      :class="{ 'overflow-hidden': (mobileNav && mobile) || modal || slideOverOpen || confirmDlg.open }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:sticky lg:top-0 lg:h-[100dvh] lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <a href="overview.html" class="inline-flex min-w-0 flex-1 items-center gap-3 rounded-lg focus-visible:ring-2" :class="!expanded && 'lg:flex-none lg:justify-center'" :aria-label="t('appTitle')">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </a>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-line-strong" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="item.count && expanded"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent" x-text="item.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="flex min-w-0 flex-1 flex-col">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-line-strong" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-line-strong focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd dir="ltr" aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex">Ctrl K</kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-haspopup="true" :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="t('notif.' + n.key)"></p>
                      <p class="text-xs text-muted" x-text="n.time"></p>
                    </div>
                  </li>
                </template>
              </ul>
              <div class="border-t border-line p-2">
                <a href="../common/notifications.html" class="menu-item justify-center text-brand" @click="notifOpen = false">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  <span x-text="t('viewAllNotif')"></span>
                </a>
              </div>
            </div>
          </div>

          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" class="flex max-w-[14rem] items-center gap-2 rounded-xl p-1 transition hover:bg-soft focus-visible:ring-2 md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    aria-haspopup="menu" :aria-expanded="profileOpen.toString()" aria-controls="profile-menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true">S</span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="t('appSubtitle')"></span>
                <span class="block truncate text-xs text-muted" x-text="t('superAdmin')"></span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted md:block" aria-hidden="true"></i>
            </button>
            <div id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-56" role="menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <a href="../common/profile.html" role="menuitem" class="menu-item"><i class="fa-regular fa-user w-4 text-muted" aria-hidden="true"></i> <span x-text="t('profile')"></span></a>
              <a href="system-settings.html" role="menuitem" class="menu-item"><i class="fa-solid fa-gear w-4 text-muted" aria-hidden="true"></i> <span x-text="t('settings')"></span></a>
              <a href="../common/errors.html" role="menuitem" class="menu-item"><i class="fa-solid fa-triangle-exclamation w-4 text-muted" aria-hidden="true"></i> <span x-text="t('systemStatus')"></span></a>
              <div class="border-t border-line"></div>
              <a href="../auth/login.html" role="menuitem" class="menu-item !text-danger"><i class="fa-solid fa-arrow-right-from-bracket w-4" aria-hidden="true"></i> <span x-text="t('logout')"></span></a>
            </div>
          </div>
        </div>
      </div>

      <!-- زبدة الخبز (Breadcrumb) -->
      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="locale === 'ar' ? 'مسار التنقل' : 'Breadcrumb'">
          <ol class="flex items-center gap-2" role="list">
            <li x-text="t('appTitle')"></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li class="text-ink" x-text="t('navItems.' + active)"></li>
          </ol>
        </nav>
      </div>
    </header>

    <!-- ================= المحتوى الرئيسي — LND-05: إدارة الاشتراكات ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">

      <!-- منطقة الإعلانات الحية لقارئ الشاشة -->
      <p class="sr-only" role="status" aria-live="polite" aria-atomic="true" x-text="liveMsg"></p>

      <!-- العنوان + إجراء الإضافة -->
      <section class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end sm:justify-between">
        <div class="min-w-0">
          <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="t('sb.title')"></h1>
          <p class="mt-1 text-sm text-muted sm:text-base" x-text="t('sb.subtitle')"></p>
        </div>
        <button type="button" class="btn btn-primary" @click="openNewModal()">
          <i class="fa-solid fa-plus" aria-hidden="true"></i>
          <span x-text="t('sb.addSubscription')"></span>
        </button>
      </section>

      <!-- ================= بطاقات المؤشرات (KPIs) — محسوبة من الحالة الحالية ================= -->
      <section :aria-label="t('sb.kpiRegion')" class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4 lg:grid-cols-4">
        <button type="button" class="panel p-4 text-start transition hover:border-success-500 sm:p-5" :class="statusFilter === 'active' && 'ring-2 ring-success-500'"
                @click="setStatusFilter('active')" :aria-pressed="(statusFilter === 'active').toString()">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="truncate text-sm font-bold text-muted" x-text="t('sb.kpiActive')"></p>
              <p class="mt-2 text-2xl font-extrabold tabular-nums text-success-700 dark:text-success-500 sm:text-3xl" x-text="fmtNum(kpis.active)"></p>
            </div>
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-success-500/15 text-success-700 dark:text-success-500" aria-hidden="true"><i class="fa-solid fa-circle-check"></i></span>
          </div>
        </button>
        <button type="button" class="panel p-4 text-start transition hover:border-info-500 sm:p-5" :class="statusFilter === 'trialing' && 'ring-2 ring-info-500'"
                @click="setStatusFilter('trialing')" :aria-pressed="(statusFilter === 'trialing').toString()">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="truncate text-sm font-bold text-muted" x-text="t('sb.kpiTrialing')"></p>
              <p class="mt-2 text-2xl font-extrabold tabular-nums text-info-700 dark:text-blue-300 sm:text-3xl" x-text="fmtNum(kpis.trialing)"></p>
            </div>
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-info-500/15 text-info-700 dark:text-blue-300" aria-hidden="true"><i class="fa-solid fa-hourglass-half"></i></span>
          </div>
        </button>
        <button type="button" class="panel p-4 text-start transition hover:border-warning-500 sm:p-5" :class="statusFilter === 'expiring' && 'ring-2 ring-warning-500'"
                @click="setStatusFilter('expiring')" :aria-pressed="(statusFilter === 'expiring').toString()">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="truncate text-sm font-bold text-muted" x-text="t('sb.kpiExpiring')"></p>
              <p class="mt-2 text-2xl font-extrabold tabular-nums text-warning-700 dark:text-warning-500 sm:text-3xl" x-text="fmtNum(kpis.expiring)"></p>
            </div>
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-warning-500/15 text-warning-700 dark:text-warning-500" aria-hidden="true"><i class="fa-solid fa-triangle-exclamation"></i></span>
          </div>
        </button>
        <div class="panel p-4 sm:p-5">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="truncate text-sm font-bold text-muted" x-text="t('sb.kpiMrr')"></p>
              <p class="mt-2 truncate text-2xl font-extrabold tabular-nums text-brand sm:text-3xl" x-text="money(kpis.mrr)"></p>
              <p class="mt-1 truncate text-xs text-muted" x-text="tf('sb.kpiMrrHint', { n: fmtNum(kpis.billable) })"></p>
            </div>
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-primary-500/15 text-brand" aria-hidden="true"><i class="fa-solid fa-sack-dollar"></i></span>
          </div>
        </div>
      </section>

      <!-- ================= شريط البحث والتبويبات والفلاتر ================= -->
      <section class="panel flex flex-col gap-4 p-4 sm:p-5">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center">
          <div class="relative min-w-0 flex-1">
            <label for="sub-search" class="sr-only" x-text="t('sb.searchPlaceholder')"></label>
            <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-line-strong" aria-hidden="true"></i>
            <input id="sub-search" type="search" x-model.debounce.250ms="search" :placeholder="t('sb.searchPlaceholder')"
                   class="h-11 w-full min-w-0 rounded-xl border border-line bg-field ps-10 pe-3 text-sm text-ink placeholder:text-line-strong focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          </div>

          <div class="relative w-full shrink-0 lg:w-56"
               x-data="selectDropdown({
                 id: 'plan-filter',
                 options: () => [{ value: 'all', label: t('sb.planFilterAll') }, ...plans.map(p => ({ value: p.code, label: planName(p) }))],
                 get: () => planFilter,
                 set: (v) => planFilter = v,
               })"
               @click.outside="closeList()">
            <span id="plan-filter-lbl" class="sr-only" x-text="t('sb.planFilterLabel')"></span>

            <button type="button" id="plan-filter-btn" x-ref="btn" role="combobox" aria-haspopup="listbox"
                    :aria-expanded="open.toString()" aria-controls="plan-filter-list" aria-labelledby="plan-filter-lbl plan-filter-btn"
                    :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                    class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                    @click="toggleList()" @keydown="onKey($event)">
              <span class="truncate" x-text="triggerLabel"></span>
              <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
            </button>

            <ul x-show="open" x-cloak x-ref="list" id="plan-filter-list" role="listbox" aria-labelledby="plan-filter-lbl"
                x-transition.origin.top.duration.150ms
                class="combo-list scroll-thin">
              <template x-for="(item, idx) in items" :key="item.value">
                <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                    class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                    @click="choose(item)" @mousemove="active = idx">
                  <span class="truncate" x-text="item.label"></span>
                  <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                </li>
              </template>
            </ul>
          </div>

          <button type="button" class="btn btn-outline shrink-0" @click="resetFilters()" :disabled="!hasFilters">
            <i class="fa-solid fa-filter-circle-xmark text-muted" aria-hidden="true"></i>
            <span x-text="t('sb.resetFilters')"></span>
          </button>

          <button type="button" class="btn btn-outline shrink-0" @click="exportCsv()" :disabled="!filteredSubs.length">
            <i class="fa-solid fa-file-csv text-muted" aria-hidden="true"></i>
            <span x-text="t('sb.exportCsv')"></span>
          </button>
        </div>

        <!-- تبويبات الحالة (tablist بتنقّل لوحة المفاتيح، تتحكم في لوحة الجدول) -->
        <div class="-mx-1 flex snap-x gap-2 overflow-x-auto px-1 pb-1" role="tablist" :aria-label="t('sb.statusTabsLabel')" @keydown="onTabsKey($event)">
          <template x-for="tab in statusTabs" :key="tab.key">
            <button type="button" class="status-tab snap-start" role="tab" :id="'st-tab-' + tab.key"
                    aria-controls="subs-panel" :aria-selected="(statusFilter === tab.key).toString()" :aria-pressed="(statusFilter === tab.key).toString()"
                    :tabindex="statusFilter === tab.key || (!statusTabs.some(x => x.key === statusFilter) && tab.key === 'all') ? 0 : -1"
                    @click="setStatusFilter(tab.key)">
              <span class="h-1.5 w-1.5 rounded-full bg-current" :class="tab.key !== 'all' ? statusDotClass(tab.key) : ''" aria-hidden="true"></span>
              <span x-text="tab.label"></span>
              <span class="tab-count" x-text="fmtNum(tab.count)"></span>
            </button>
          </template>
        </div>
      </section>

      <!-- ================= جدول / بطاقات الاشتراكات (عرض واحد عبر x-if) ================= -->
      <section id="subs-panel" class="panel overflow-hidden" role="tabpanel" :aria-labelledby="'st-tab-' + (statusTabs.some(x => x.key === statusFilter) ? statusFilter : 'all')">
        <h2 id="subs-table-title" class="sr-only" x-text="t('sb.title')"></h2>

        <!-- سطح المكتب: جدول -->
        <template x-if="wide">
          <div class="table-scroll overflow-x-auto">
            <table class="w-full min-w-[1100px] border-collapse text-sm">
              <caption class="sr-only" x-text="t('sb.tableCaption') + ' — ' + sortSummary"></caption>
              <thead>
                <tr class="bg-soft text-ink">
                  <template x-for="col in sortCols" :key="col.key">
                    <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" :aria-sort="ariaSort(col.key)">
                      <button type="button" class="inline-flex items-center gap-1.5 rounded font-extrabold hover:text-brand focus-visible:ring-2" @click="sortBy(col.key)">
                        <span x-text="t(col.label)"></span>
                        <i class="fa-solid text-[10px] text-muted" :class="sortKey === col.key ? (sortDir === 'asc' ? 'fa-arrow-up-short-wide' : 'fa-arrow-down-wide-short') : 'fa-sort'" aria-hidden="true"></i>
                      </button>
                    </th>
                  </template>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('sb.colActions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-line">
                <template x-for="s in pagedSubs" :key="s.id">
                  <tr class="transition hover:bg-soft/50">
                    <!-- المؤسسة -->
                    <td class="px-4 py-3.5 align-middle">
                      <div class="flex items-center gap-3">
                        <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl text-sm font-extrabold text-white" :style="'background:' + s.tenant.color" aria-hidden="true" x-text="initials(s.tenant)"></span>
                        <div class="min-w-0">
                          <div class="flex items-center gap-1.5">
                            <p class="truncate font-bold leading-5 text-ink" x-text="tenantName(s.tenant)"></p>
                            <span x-show="isCurrent(s)" class="shrink-0 text-[10px]" :title="t('sb.current')"><i class="fa-solid fa-star text-accent-500" aria-hidden="true"></i><span class="sr-only" x-text="t('sb.current')"></span></span>
                          </div>
                          <a :href="'https://' + s.tenant.domain" target="_blank" rel="noopener noreferrer"
                             class="mt-0.5 block truncate text-xs font-medium text-brand hover:underline" dir="ltr" x-text="s.tenant.domain"></a>
                        </div>
                      </div>
                    </td>

                    <!-- الباقة والسعر -->
                    <td class="px-4 py-3.5 align-middle">
                      <p class="font-bold leading-5 text-ink" x-text="planName(planById(s.plan_id))"></p>
                      <p class="mt-0.5 text-xs text-muted tabular-nums" x-text="planPriceLabel(planById(s.plan_id)) + ' · ' + t('sb.cycle.' + s.billing_cycle)"></p>
                      <p x-show="s.scheduledPlanId" class="mt-1 inline-flex items-center gap-1 text-[11px] font-bold text-yellow-900 dark:text-accent-500">
                        <i class="fa-solid fa-arrow-turn-up rtl:-scale-x-100" aria-hidden="true"></i>
                        <span x-text="tf('sb.scheduledChange', { plan: s.scheduledPlanId ? planName(planById(s.scheduledPlanId)) : '' })"></span>
                      </p>
                    </td>

                    <!-- الحالة + التجديد التلقائي -->
                    <td class="px-4 py-3.5 align-middle">
                      <span class="badge" :class="statusClass(s.status)">
                        <span class="h-1.5 w-1.5 rounded-full bg-current" aria-hidden="true"></span>
                        <span x-text="statusLabel(s.status)"></span>
                      </span>
                      <div class="mt-1.5 flex items-center gap-2 text-[11px] font-bold" :class="s.auto_renew ? 'text-success-700 dark:text-success-500' : 'text-muted'">
                        <button type="button" role="switch" :aria-checked="s.auto_renew.toString()" :aria-label="autoRenewLabel(s)"
                                :aria-disabled="(!canToggleAutoRenew(s)).toString()" @click="toggleAutoRenew(s)"
                                class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full transition focus-visible:ring-2"
                                :class="[s.auto_renew ? 'bg-primary-500' : 'bg-line-strong/40', !canToggleAutoRenew(s) && 'cursor-not-allowed opacity-50']">
                          <span class="inline-block h-3.5 w-3.5 transform rounded-full bg-white shadow transition" :class="s.auto_renew ? 'ltr:translate-x-[1.1rem] rtl:-translate-x-[1.1rem]' : 'ltr:translate-x-0.5 rtl:-translate-x-0.5'" aria-hidden="true"></span>
                        </button>
                        <span aria-hidden="true" x-text="t('sb.autoRenew') + ': ' + (s.auto_renew ? t('sb.autoRenewOn') : t('sb.autoRenewOff'))"></span>
                      </div>
                    </td>

                    <!-- تاريخ البدء -->
                    <td class="whitespace-nowrap px-4 py-3.5 align-middle text-sm text-muted tabular-nums" x-text="fmtDate(s.starts_at)"></td>

                    <!-- تاريخ الانتهاء + العد التنازلي -->
                    <td class="whitespace-nowrap px-4 py-3.5 align-middle">
                      <p class="text-sm font-bold text-ink tabular-nums" x-text="fmtDate(s.ends_at)"></p>
                      <p class="mt-0.5 text-xs font-bold" :class="daysRemainingClass(s)" x-text="daysRemainingLabel(s)"></p>
                    </td>

                    <!-- إجراءات (أيقونات + تلميحات) -->
                    <td class="px-4 py-3.5 align-middle">
                      <div class="flex items-center gap-1.5">
                        <template x-for="a in rowActions(s)" :key="a.key">
                          <button type="button" class="act group relative" :class="[a.danger && 'text-danger hover:!bg-error-500/10', a.disabled && 'cursor-not-allowed opacity-40']"
                                  :aria-label="a.label + ' — ' + tenantName(s.tenant)" :aria-disabled="a.disabled.toString()"
                                  @click="runAction(a.key, s)">
                            <i :class="a.icon" aria-hidden="true"></i>
                            <span class="tooltip-bubble" aria-hidden="true" x-text="a.label"></span>
                            <span class="tooltip-arrow" aria-hidden="true"></span>
                          </button>
                        </template>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>

        <!-- الجوال/الأجهزة اللوحية: بطاقات -->
        <template x-if="!wide">
          <ul class="divide-y divide-line" role="list" :aria-label="t('sb.tableCaption')">
            <template x-for="s in pagedSubs" :key="s.id">
              <li class="space-y-3 p-4">
                <div class="flex items-start gap-3">
                  <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl text-sm font-extrabold text-white" :style="'background:' + s.tenant.color" aria-hidden="true" x-text="initials(s.tenant)"></span>
                  <div class="min-w-0 flex-1">
                    <h3 class="truncate font-bold leading-5 text-ink" x-text="tenantName(s.tenant)"></h3>
                    <p class="mt-0.5 truncate text-xs text-muted" x-text="planName(planById(s.plan_id)) + ' · ' + planPriceLabel(planById(s.plan_id))"></p>
                  </div>
                  <span class="badge shrink-0" :class="statusClass(s.status)">
                    <span class="h-1.5 w-1.5 rounded-full bg-current" aria-hidden="true"></span>
                    <span x-text="statusLabel(s.status)"></span>
                  </span>
                </div>
                <dl class="grid grid-cols-2 gap-2 text-xs">
                  <div><dt class="text-muted" x-text="t('sb.colStart')"></dt><dd class="font-bold tabular-nums" x-text="fmtDate(s.starts_at)"></dd></div>
                  <div><dt class="text-muted" x-text="t('sb.colEnd')"></dt><dd class="font-bold tabular-nums" x-text="fmtDate(s.ends_at)"></dd><dd class="font-bold" :class="daysRemainingClass(s)" x-text="daysRemainingLabel(s)"></dd></div>
                </dl>
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center gap-2 text-xs font-bold" :class="s.auto_renew ? 'text-success-700 dark:text-success-500' : 'text-muted'">
                    <button type="button" role="switch" :aria-checked="s.auto_renew.toString()" :aria-label="autoRenewLabel(s)"
                            :aria-disabled="(!canToggleAutoRenew(s)).toString()" @click="toggleAutoRenew(s)"
                            class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full transition focus-visible:ring-2"
                            :class="[s.auto_renew ? 'bg-primary-500' : 'bg-line-strong/40', !canToggleAutoRenew(s) && 'cursor-not-allowed opacity-50']">
                      <span class="inline-block h-3.5 w-3.5 transform rounded-full bg-white shadow transition" :class="s.auto_renew ? 'ltr:translate-x-[1.1rem] rtl:-translate-x-[1.1rem]' : 'ltr:translate-x-0.5 rtl:-translate-x-0.5'" aria-hidden="true"></span>
                    </button>
                    <span aria-hidden="true" x-text="t('sb.autoRenew') + ': ' + (s.auto_renew ? t('sb.autoRenewOn') : t('sb.autoRenewOff'))"></span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <template x-for="a in rowActions(s)" :key="a.key">
                      <button type="button" class="act group relative" :class="[a.danger && 'text-danger', a.disabled && 'cursor-not-allowed opacity-40']"
                              :aria-label="a.label + ' — ' + tenantName(s.tenant)" :aria-disabled="a.disabled.toString()"
                              @click="runAction(a.key, s)">
                        <i :class="a.icon" aria-hidden="true"></i>
                        <span class="tooltip-bubble" aria-hidden="true" x-text="a.label"></span>
                        <span class="tooltip-arrow" aria-hidden="true"></span>
                      </button>
                    </template>
                  </div>
                </div>
              </li>
            </template>
          </ul>
        </template>

        <!-- ================= حالة عدم وجود نتائج (Empty State) ================= -->
        <div x-show="filteredSubs.length === 0" class="px-4 py-16 text-center">
          <span class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-full bg-primary-500/10 text-brand" aria-hidden="true">
            <i class="fa-solid fa-file-circle-xmark text-xl"></i>
          </span>
          <p class="font-extrabold text-ink" x-text="t('sb.emptyTitle')"></p>

                    :aria-expanded="open.toString()" aria-controls="nf-tenant-list" aria-labelledby="nf-tenant-lbl nf-tenant-btn" aria-required="true"

                  <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>

        <!-- 3. حالة الاشتراك (عند الإنشاء) -->

          <legend class="label" x-text="t('sb.fStatus')"></legend>
          <div class="seg w-full">
            <button type="button" class="seg-btn flex-1 justify-center" :aria-pressed="(subForm.status === 'trialing').toString()" @click="subForm.status = 'trialing'" x-text="t('sb.statusTrialingOpt')"></button>
            <button type="button" class="seg-btn flex-1 justify-center" :aria-pressed="(subForm.status === 'active').toString()" @click="subForm.status = 'active'" x-text="t('sb.statusActiveOpt')"></button>
          </div>
        </fieldset>

        <!-- 4. دورة الفوترة -->
        <fieldset class="space-y-1.5" x-show="subForm.status !== 'trialing'">
          <legend class="label" x-text="t('sb.fCycle')"></legend>
          <div class="seg w-full">
            <template x-for="c in ['monthly', 'yearly']" :key="c">
              <button type="button" class="seg-btn flex-1 justify-center" :aria-pressed="(subForm.billing_cycle === c).toString()" @click="subForm.billing_cycle = c" x-text="t('sb.cycle.' + c)"></button>
            </template>
          </div>
        </fieldset>

        <!-- 5. تاريخ البدء + الانتهاء المحسوب -->
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div class="space-y-1.5">
            <label for="nf-start" class="label"><span x-text="t('sb.fStartDate')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
            <input id="nf-start" type="date" x-model="subForm.starts_at" @input="formErrors.starts_at = ''" required class="field tabular-nums" dir="ltr"
                   :aria-invalid="(!!formErrors.starts_at).toString()" :aria-describedby="formErrors.starts_at ? 'nf-start-err' : null">
            <p id="nf-start-err" class="err" x-show="formErrors.starts_at"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="formErrors.starts_at"></span></p>
          </div>
          <div class="space-y-1.5">
            <p class="label" id="nf-end-lbl" x-text="t('sb.fEndDateComputed')"></p>
            <output class="field block bg-soft font-bold tabular-nums" aria-labelledby="nf-end-lbl" aria-live="polite" x-text="formEndDate ? fmtDate(formEndDate) : '—'"></output>
            <p class="hint" x-text="subForm.status === 'trialing' ? tf('sb.endHintTrial', { n: fmtNum(trialDaysFor(subForm.plan_id)) }) : t('sb.endHintCycle')"></p>
          </div>
        </div>

        <!-- معاينة الفاتورة الأولى -->
        <div x-show="subForm.mode === 'new' && formInvoicePreview" class="rounded-xl border border-line bg-page/50 p-3.5 text-sm">
          <p class="mb-2 text-xs font-extrabold text-muted" x-text="t('sb.firstInvoice')"></p>
          <template x-if="formInvoicePreview">
            <dl class="space-y-1.5">
              <div class="flex justify-between"><dt class="text-muted" x-text="t('sb.subtotal')"></dt><dd class="font-bold tabular-nums" x-text="money(formInvoicePreview.subtotal)"></dd></div>
              <div class="flex justify-between"><dt class="text-muted" x-text="t('sb.vat')"></dt><dd class="font-bold tabular-nums" x-text="money(formInvoicePreview.vat)"></dd></div>
              <div class="flex justify-between border-t border-line pt-1.5"><dt class="font-bold" x-text="t('sb.total')"></dt><dd class="font-extrabold tabular-nums" x-text="money(formInvoicePreview.total)"></dd></div>
            </dl>
          </template>
        </div>
      </div>

      <footer class="flex shrink-0 items-center justify-end gap-3 border-t border-line bg-page/40 p-4">
        <button type="button" class="btn btn-outline" :disabled="busy" @click="closeModal()" x-text="t('sb.close')"></button>
        <button type="submit" class="btn btn-primary" :disabled="busy || (subForm.mode === 'new' && !availableTenants().length)" :aria-busy="busy.toString()">
          <i class="fa-solid animate-spin fa-circle-notch" x-show="busy" aria-hidden="true"></i>
          <span x-text="subForm.mode === 'edit' ? t('sb.saveChanges') : t('sb.addSubscription')"></span>
        </button>
      </footer>
    </form>
  </template>
</div>

<!-- ==========================================================================
     نافذة — ترقية / تخفيض الباقة (radiogroup + حجب التخفيض + احتساب تناسبي)
     ========================================================================== -->
<div x-cloak x-show="modal === 'upgrade'" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4">
  <div class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closeModal()" aria-hidden="true"></div>

  <template x-if="modal === 'upgrade' && activeSub">
    <form @submit.prevent="applyUpgrade()" x-trap.noscroll="modal === 'upgrade'"
          role="dialog" aria-modal="true" aria-labelledby="um-title" aria-describedby="um-sub" @keydown.escape.stop="closeModal()"
          class="modal-panel max-w-xl">
      <header class="flex shrink-0 items-center justify-between gap-3 border-b border-line p-5">
        <div class="min-w-0">
          <h2 id="um-title" class="truncate text-lg font-extrabold text-brand" x-text="t('sb.modalUpgradeTitle')"></h2>
          <p id="um-sub" class="truncate text-sm text-muted" x-text="tenantName(activeSub.tenant)"></p>
        </div>
        <button type="button" class="icon-btn shrink-0" @click="closeModal()" :disabled="busy" :aria-label="t('sb.close')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>

      <div class="min-h-0 flex-1 space-y-5 overflow-y-auto p-5">

          <div class="flex items-center justify-between rounded-xl border border-line bg-page/50 p-3.5">
            <span class="badge badge-muted" x-text="planName(planById(activeSub.plan_id))"></span>
            <span class="text-sm font-extrabold tabular-nums text-ink" x-text="planPriceLabel(planById(activeSub.plan_id))"></span>
          </div>
        </div>

        <div>
          <p class="label" id="um-newplan-lbl" x-text="t('sb.newPlanLbl')"></p>
          <div class="grid grid-cols-1 gap-2.5 sm:grid-cols-2" role="radiogroup" aria-labelledby="um-newplan-lbl" aria-required="true" @keydown="onPlanKey($event)">
            <template x-for="(p, i) in planChoices" :key="p.id">
              <div class="pick-card" :id="'um-plan-' + p.id" role="radio" :data-checked="(upgradeForm.new_plan_id === p.id).toString()"

                   :aria-describedby="limitIssues(activeSub, p).length ? 'um-plan-warn-' + p.id : null"

                  <span class="font-bold text-ink" x-text="planName(p)"></span>
                  <i class="fa-solid fa-circle-check text-brand" x-show="upgradeForm.new_plan_id === p.id" aria-hidden="true"></i>
                </div>
                <span class="text-xs font-bold tabular-nums text-muted" x-text="planPriceLabel(p)"></span>
                <span :id="'um-plan-warn-' + p.id" x-show="limitIssues(activeSub, p).length" class="inline-flex items-center gap-1 text-[11px] font-bold text-danger">
                  <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i><span x-text="t('sb.exceedsUsage')"></span>
                </span>
              </div>
            </template>
          </div>
        </div>

        <!-- حجب التخفيض بسبب الاستهلاك -->
        <div x-show="upgradeForm.new_plan_id && upgradeIssues.length" role="alert"
             class="rounded-xl border border-error-600/30 bg-error-500/10 p-3.5 text-xs font-bold text-error-700 dark:text-red-300">
          <p class="mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-ban" aria-hidden="true"></i><span x-text="t('sb.downgradeBlocked')"></span></p>
          <ul class="list-disc space-y-0.5 ps-5" role="list">
            <template x-for="iss in upgradeIssues" :key="iss.key">
              <li x-text="issueText(iss)"></li>
            </template>
          </ul>
        </div>

        <template x-if="upgradeForm.new_plan_id">
          <div>
            <p class="mb-2 text-xs font-extrabold text-muted" x-text="t('sb.previewChanges')"></p>
            <div class="space-y-2.5 rounded-xl border border-line bg-page/50 p-3.5 text-sm">
              <template x-for="row in comparisonRows(activeSub, upgradeForm.new_plan_id)" :key="row.key">
                <div class="flex items-center justify-between" :class="row.key === 'price' && 'border-t border-line pt-2.5'">
                  <span class="text-muted" x-text="t(row.label)"></span>
                  <span class="flex items-center gap-1.5 font-bold tabular-nums">
                    <span class="text-muted" x-text="row.from"></span>
                    <i class="fa-solid fa-arrow-right rtl:-scale-x-100 text-[10px] text-line-strong" aria-hidden="true"></i>
                    <span class="sr-only" x-text="t('sb.to')"></span>
                    <span :class="diffClass(row.a, row.b)" x-text="row.to"></span>
                  </span>
                </div>
              </template>
            </div>
          </div>
        </template>

        <fieldset>
          <legend class="label" x-text="t('sb.applyWhen')"></legend>
          <div class="space-y-2">
            <label class="flex cursor-pointer items-center gap-2.5 rounded-xl border border-line p-3 text-sm font-bold transition hover:bg-soft" :class="upgradeForm.applyWhen === 'immediate' && 'border-primary-500 bg-primary-500/10'">
              <input type="radio" name="applyWhen" value="immediate" x-model="upgradeForm.applyWhen" class="h-4 w-4 accent-current text-brand">
              <span x-text="t('sb.applyImmediate')"></span>
            </label>
            <label class="flex cursor-pointer items-center gap-2.5 rounded-xl border border-line p-3 text-sm font-bold transition hover:bg-soft" :class="upgradeForm.applyWhen === 'renewal' && 'border-primary-500 bg-primary-500/10'">
              <input type="radio" name="applyWhen" value="renewal" x-model="upgradeForm.applyWhen" class="h-4 w-4 accent-current text-brand">
              <span x-text="tf('sb.applyRenewal', { date: fmtDate(activeSub.ends_at) })"></span>
            </label>
          </div>
        </fieldset>

        <!-- الاحتساب التناسبي (قبل التأكيد) -->
        <div x-show="upgradeForm.new_plan_id && upgradeForm.applyWhen === 'immediate' && !upgradeIssues.length" class="rounded-xl border border-line bg-page/50 p-3.5 text-sm" aria-live="polite">
          <template x-if="proration">
            <div class="space-y-1.5">
              <p class="text-xs font-extrabold text-muted" x-text="t('sb.proration')"></p>
              <p class="text-xs text-muted" x-text="proration.applicable ? tf('sb.prorationFormula', { remaining: fmtNum(proration.remaining), period: fmtNum(proration.period), diff: money(proration.diff) }) : t('sb.prorationNA')"></p>
              <div class="flex items-center justify-between border-t border-line pt-1.5" x-show="proration.applicable">
                <span class="font-bold" x-text="proration.amount >= 0 ? t('sb.prorationCharge') : t('sb.prorationCredit')"></span>
                <span class="font-extrabold tabular-nums" :class="proration.amount < 0 && 'text-success-700 dark:text-success-500'" x-text="money(Math.abs(proration.amount))"></span>
              </div>
              <p class="text-xs text-muted" x-show="proration.applicable && proration.amount > 0" x-text="tf('sb.prorationInvoiceNote', { total: money(prorationInvoiceTotal) })"></p>
            </div>
          </template>
        </div>
      </div>

      <footer class="flex shrink-0 items-center justify-end gap-3 border-t border-line bg-page/40 p-4">
        <button type="button" class="btn btn-outline" :disabled="busy" @click="closeModal()" x-text="t('sb.close')"></button>
        <button type="submit" class="btn btn-primary" :disabled="busy || !upgradeForm.new_plan_id || upgradeIssues.length > 0" :aria-busy="busy.toString()">
          <i class="fa-solid animate-spin fa-circle-notch" x-show="busy" aria-hidden="true"></i>
          <span x-text="t('sb.applyBtn')"></span>
        </button>
      </footer>
    </form>
  </template>
</div>

<!-- ==========================================================================
     نافذة — تمديد / تجديد الاشتراك (تاريخ محسوب + فاتورة بالضريبة)

<div x-cloak x-show="modal === 'renew'" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4">
  <div class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closeModal()" aria-hidden="true"></div>

  <template x-if="modal === 'renew' && activeSub">
    <form @submit.prevent="applyRenew()" novalidate x-trap.noscroll="modal === 'renew'"
          role="dialog" aria-modal="true" aria-labelledby="rm2-title" aria-describedby="rm2-sub" @keydown.escape.stop="closeModal()"
          class="modal-panel max-w-md">
      <header class="flex shrink-0 items-center justify-between gap-3 border-b border-line p-5">
        <div class="min-w-0">
          <h2 id="rm2-title" class="truncate text-lg font-extrabold text-brand" x-text="isReactivation(activeSub) ? t('sb.menuReactivate') : t('sb.modalRenewTitle')"></h2>
          <p id="rm2-sub" class="truncate text-sm text-muted" x-text="tenantName(activeSub.tenant)"></p>
        </div>
        <button type="button" class="icon-btn shrink-0" @click="closeModal()" :disabled="busy" :aria-label="t('sb.close')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>

      <div class="min-h-0 flex-1 space-y-4 overflow-y-auto p-5">
        <div class="flex items-start gap-2.5 rounded-xl border border-warning-500/30 bg-warning-500/10 p-3.5 text-xs font-bold text-warning-800 dark:text-warning-500" x-show="renewBlockedByRule(activeSub)" role="alert">
          <i class="fa-solid fa-triangle-exclamation mt-0.5" aria-hidden="true"></i>
          <span x-text="t('sb.renewWarnActive')"></span>
        </div>

        <fieldset class="space-y-1.5">
          <legend class="label" x-text="t('sb.fCycle')"></legend>
          <div class="seg w-full">
            <template x-for="c in ['monthly', 'yearly']" :key="c">
              <button type="button" class="seg-btn flex-1 justify-center" :aria-pressed="(renewForm.cycle === c).toString()" @click="renewForm.cycle = c; renewError = ''" x-text="t('sb.cycle.' + c)"></button>
            </template>
          </div>
        </fieldset>

        <div class="space-y-1.5">
          <label for="rf-count" class="label"><span x-text="t('sb.fPeriods')"></span> <span class="text-danger" aria-hidden="true">*</span></label>

        <dl id="rf-dates" class="space-y-1.5 rounded-xl border border-line bg-page/50 p-3.5 text-sm">

          <div class="flex justify-between"><dt class="text-muted" x-text="t('sb.fNewEndDate')"></dt><dd class="font-extrabold tabular-nums text-brand" x-text="renewEndDate ? fmtDate(renewEndDate) : '—'"></dd></div>
          <div class="flex justify-between" x-show="activeSub.scheduledPlanId"><dt class="text-muted" x-text="t('sb.renewPlan')"></dt><dd class="font-bold" x-text="planName(planById(renewPlanId))"></dd></div>

              <div class="flex justify-between border-t border-line pt-1.5"><dt class="font-bold" x-text="t('sb.total')"></dt><dd class="font-extrabold tabular-nums" x-text="money(renewInvoicePreview.total)"></dd></div>

        <button type="button" class="btn btn-outline" :disabled="busy" @click="closeModal()" x-text="t('sb.close')"></button>
        <button type="submit" class="btn btn-primary" :disabled="busy || renewBlockedByRule(activeSub)" :aria-busy="busy.toString()">

          <span x-text="t('sb.renewBtn')"></span>
        </button>
      </footer>

<!-- ==========================================================================
     نافذة — إلغاء الاشتراك (سبب إلزامي + بيان الأثر)
     ========================================================================== -->
<div x-cloak x-show="modal === 'cancel'" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4">
  <div class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closeModal()" aria-hidden="true"></div>

  <template x-if="modal === 'cancel' && activeSub">
    <form @submit.prevent="applyCancel()" novalidate x-trap.noscroll="modal === 'cancel'"
          role="alertdialog" aria-modal="true" aria-labelledby="cm-title" aria-describedby="cm-impact" @keydown.escape.stop="closeModal()"
          class="modal-panel max-w-md">
      <header class="flex shrink-0 items-center gap-3 border-b border-line p-5">
        <span class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-error-100 text-error-700" aria-hidden="true"><i class="fa-solid fa-ban"></i></span>
        <div class="min-w-0">
          <h2 id="cm-title" class="truncate text-lg font-extrabold text-ink" x-text="t('sb.modalCancelTitle')"></h2>
          <p class="truncate text-sm text-muted" x-text="tenantName(activeSub.tenant)"></p>
        </div>
      </header>

      <div class="min-h-0 flex-1 space-y-4 overflow-y-auto p-5">
        <div id="cm-impact" class="space-y-1 rounded-xl border border-error-600/30 bg-error-500/10 p-3.5 text-xs font-bold text-error-700 dark:text-red-300">
          <p x-text="t('sb.cancelWarning')"></p>
          <ul class="list-disc space-y-0.5 ps-5" role="list">
            <template x-for="line in cancelImpact(activeSub)" :key="line">
              <li x-text="line"></li>
            </template>
          </ul>
        </div>

        <div class="relative"
             x-data="selectDropdown({
               id: 'cf-reason',
               options: () => CANCEL_REASONS.map(k => ({ value: k, label: t('sb.reasonOptions.' + k) })),
               get: () => cancelForm.reason,
               set: (v) => { cancelForm.reason = v; cancelErrors.reason = ''; },
               placeholder: () => t('sb.fReasonPlaceholder'),
             })"
             @click.outside="closeList()">
          <p class="label"><span id="cf-reason-lbl" x-text="t('sb.fReason')"></span> <span class="text-danger" aria-hidden="true">*</span></p>
          <button type="button" id="cf-reason-btn" x-ref="btn" role="combobox" aria-haspopup="listbox"
                  :aria-expanded="open.toString()" aria-controls="cf-reason-list" aria-labelledby="cf-reason-lbl cf-reason-btn" aria-required="true"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  :aria-invalid="(!!cancelErrors.reason).toString()" :aria-describedby="cancelErrors.reason ? 'cf-reason-err' : null"
                  class="field flex w-full items-center justify-between gap-2 text-start"
                  :class="selectedItem ? 'font-bold' : 'font-normal text-muted'"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="cf-reason-list" role="listbox" aria-labelledby="cf-reason-lbl"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
          <p id="cf-reason-err" class="err" x-show="cancelErrors.reason"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="cancelErrors.reason"></span></p>
        </div>

        <div>
          <label for="cf-notes" class="label"><span x-text="cancelForm.reason === 'other' ? t('sb.fCancelNotesReq') : t('sb.fCancelNotes')"></span> <span class="text-danger" aria-hidden="true" x-show="cancelForm.reason === 'other'">*</span></label>
          <textarea id="cf-notes" x-model.trim="cancelForm.note" @input="cancelErrors.note = ''" rows="3" class="field resize-none" :placeholder="t('sb.fNotesPh')"
                    :aria-required="(cancelForm.reason === 'other').toString()" :aria-invalid="(!!cancelErrors.note).toString()" :aria-describedby="cancelErrors.note ? 'cf-notes-err' : null"></textarea>
          <p id="cf-notes-err" class="err" x-show="cancelErrors.note"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="cancelErrors.note"></span></p>
        </div>
      </div>

      <footer class="flex shrink-0 items-center justify-end gap-3 border-t border-line bg-page/40 p-4">
        <button type="button" class="btn btn-outline" :disabled="busy" @click="closeModal()" x-text="t('sb.cancelCancelBtn')"></button>
        <button type="submit" class="btn btn-danger" :disabled="busy" :aria-busy="busy.toString()">
          <i class="fa-solid animate-spin fa-circle-notch" x-show="busy" aria-hidden="true"></i>
          <span x-text="t('sb.cancelBtn')"></span>
        </button>
      </footer>
    </form>
  </template>
</div>

  function selectDropdown({ id, options, get, set, placeholder = '' }) {
    return {
      id, open: false, active: -1, typed: '', typedAt: 0,
      get items() { return options(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { const sel = this.selectedItem; return sel ? sel.label : (typeof placeholder === 'function' ? placeholder() : placeholder); },
      optId(item) { return this.id + '-opt-' + item.value; },
      openList() {
        if (!this.items.length) return;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item) { set(item.value); this.closeList(); this.$refs.btn?.focus(); },
      setActive(i) { this.active = Math.min(Math.max(i, 0), this.items.length - 1); this.scrollActiveIntoView(); },
      move(step) { if (!this.open) { this.openList(); return; } this.setActive(this.active + step); },
      onKey(e) {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); if (e.altKey && this.open && k === 'ArrowUp') { this.choose(this.items[this.active]); return; } this.move(k === 'ArrowDown' ? 1 : -1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.setActive(0); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.setActive(this.items.length - 1); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); (this.open && this.active > -1) ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape') { if (this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); } }
        else if (k === 'Tab') { if (this.open) this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          const now = Date.now();
          this.typed = (now - this.typedAt > 600 ? '' : this.typed) + k.toLowerCase();
          this.typedAt = now;
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this.typed));

      /* ---------- البيانات ---------- */
      plans: PLANS,

      /* ---------- تنسيق ---------- */
      money(minor) { return SA.money(minor, this.locale); },

      tenantById(id) { return this.tenantsPool.find(tn => tn.id === id) || null; },

        if (!tn) return '';

        return (tn.name.en || '').split(/\s+/).map(w => w.replace(/^Al-/, '')[0] || '').slice(0, 2).join('').toUpperCase();
      },

        if (!p) return '—';
