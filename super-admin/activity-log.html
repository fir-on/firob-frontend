<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>سجل النشاط والتدقيق — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  { @apply bg-accent-500/25 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-warning { @apply bg-warning-500/15 text-warning-700 dark:text-warning-500; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-line-strong; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-2 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-4 py-2.5 text-start text-sm font-medium text-ink transition-colors hover:bg-soft; }
    .combo-option.is-active   { @apply bg-soft; }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }
    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- مقطع أزرار (Segmented control) ---------- */
    .seg { @apply inline-flex flex-wrap items-center gap-1 rounded-xl border border-line bg-card p-1; }
    .seg-btn { @apply inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-bold text-muted transition; }
    .seg-btn[aria-pressed="true"], .seg-btn[aria-selected="true"] { @apply bg-primary-500 text-white shadow; }

    /* ---------- شرائح الهيكل العظمي (Skeleton) ---------- */
    .sk { @apply animate-pulse rounded-md bg-line; }

    /* ---------- خط زمني (Timeline) ---------- */
    .tl-dot { @apply grid h-9 w-9 shrink-0 place-items-center rounded-full text-sm ring-4 ring-page; }
    .tl-card { @apply min-w-0 flex-1 rounded-xl border border-line bg-card p-4 text-start transition hover:-translate-y-0.5 hover:border-primary-500 hover:shadow-card; }

    /* ---------- اللوحة المنبثقة الجانبية (Slide-over Drawer) ---------- */
    .drawer-panel { @apply absolute inset-y-0 flex w-full max-w-xl flex-col border-line bg-card shadow-pop; inset-inline-end: 0; border-inline-start-width: 1px; }
    .diff-cell { @apply min-w-0 rounded-lg border p-3 text-xs leading-6; }
    .diff-old { @apply border-error-500/30 bg-error-500/5 text-error-700 dark:text-red-300; }
    .diff-new { @apply border-success-500/30 bg-success-500/5 text-success-700 dark:text-success-500; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }
</style>

<!-- ⑥ Alpine.js (+ إضافة Focus لحصر التركيز داخل الدرج الجانبي) -->

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- ⑧ Flatpickr — تقويم موحّد لحقول التاريخ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
<link rel="stylesheet" href="../asset/css/firob-datepicker.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ar.js"></script>

</head>

<body x-data="activityLogData()" x-init="init()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch.focus(); }"
      :class="{ 'overflow-hidden': (mobileNav && mobile) || drawerOpen || exportOpen }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:sticky lg:top-0 lg:h-[100dvh] lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <a href="overview.html" class="inline-flex min-w-0 flex-1 items-center gap-3 rounded-lg focus-visible:ring-2" :class="!expanded && 'lg:flex-none lg:justify-center'" :aria-label="t('appTitle')">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </a>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-line-strong" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="item.count && expanded"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent" x-text="item.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="flex min-w-0 flex-1 flex-col">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-line-strong" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-line-strong focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd dir="ltr" aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex">Ctrl K</kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-haspopup="true" :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="t('notif.' + n.key)"></p>
                      <p class="text-xs text-muted" x-text="n.time"></p>
                    </div>
                  </li>
                </template>
              </ul>
              <div class="border-t border-line p-2">

<script>
  /* =====================================================================================
     FirOb — بيانات المسؤول العام المشتركة (Single Source of Truth) — SA
     تُضمَّن حرفيًا في كل صفحات super-admin عند البناء، فلا تتعارض الصفحات أبدًا.
     - العملة واحدة: USD (لا تتغير مع اللغة)، وضريبة القيمة المضافة 15% محسوبة على البنود.
     - كل الحساب المالي بالهللة (أعداد صحيحة) عبر SA.m — لا جمع لأعداد عشرية.
     - التواريخ محلية YYYY-MM-DD (لا toISOString) — لا انزياح يوم في UTC+3.
     - حالة الفاتورة مشتقة من المدفوعات وتاريخ الاستحقاق (إلا void/draft المخزّنتين).
     في Laravel: نفس الجداول (plans, tenants, subscriptions, invoices, invoice_items, payments, refunds)
     والمبالغ bigint بالهللة، والحالات تُحسب في Model accessors/Jobs.
     ===================================================================================== */
  const SA = (() => {
    /* ---------- التواريخ (محلية) ---------- */
    const pad = (n) => String(n).padStart(2, '0');
    const isoLocal = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const parseLocal = (s) => { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d, 12, 0, 0, 0); };
    const today = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; };
    const addDays = (n, from) => { const d = from ? parseLocal(from) : today(); d.setDate(d.getDate() + n); return isoLocal(d); };
    const daysBetween = (a, b) => Math.round((parseLocal(b) - parseLocal(a)) / 864e5);   // b − a بالأيام
    const startOfDay = (s) => { const d = parseLocal(s); d.setHours(0, 0, 0, 0); return d; };
    const endOfDay = (s) => { const d = parseLocal(s); d.setHours(23, 59, 59, 999); return d; };
    const todayIso = () => isoLocal(today());

    /* ---------- المال (هللة) ---------- */
    const CURRENCY = 'USD';
    const VAT_RATE = 0.15;
    const m = {
      toMinor: (usd) => Math.round(Number(usd || 0) * 100),
      toMajor: (minor) => minor / 100,
      sum: (arr) => arr.reduce((s, x) => s + Math.round(x), 0),
    };
    const fmtLocale = (loc) => (loc === 'ar' ? 'ar-SA-u-nu-latn' : 'en-US');
    const money = (minor, loc) => new Intl.NumberFormat(fmtLocale(loc), { style: 'currency', currency: CURRENCY, minimumFractionDigits: 2, maximumFractionDigits: 2 }).format((minor || 0) / 100);
    const moneyShort = (minor, loc) => new Intl.NumberFormat(fmtLocale(loc), { style: 'currency', currency: CURRENCY, notation: 'compact', maximumFractionDigits: 1 }).format((minor || 0) / 100);
    const fmtDate = (s, loc, opts) => s ? new Intl.DateTimeFormat(fmtLocale(loc), opts || { day: 'numeric', month: 'short', year: 'numeric' }).format(parseLocal(s)) : '—';
    const fmtNum = (n, loc) => new Intl.NumberFormat(fmtLocale(loc)).format(n || 0);

    /* ---------- الباقات (الأسعار شهرية بالهللة، قبل الضريبة) ---------- */
    const PLANS = [
      { id: 1, code: 'trial',      name: { ar: 'الباقة التجريبية', en: 'Trial Plan' },       price_monthly: 0,     max_users: 5,   max_storage_mb: 1024,    ai_token_quota_monthly: 10000,   trial_days: 14, is_active: true,  sort_order: 1 },
      { id: 2, code: 'basic',      name: { ar: 'الباقة الأساسية', en: 'Basic Plan' },        price_monthly: 4900,  max_users: 10,  max_storage_mb: 5120,    ai_token_quota_monthly: 50000,   trial_days: 0,  is_active: true,  sort_order: 2 },
      { id: 3, code: 'pro',        name: { ar: 'الباقة الاحترافية', en: 'Pro Plan' },        price_monthly: 14900, max_users: 50,  max_storage_mb: 10240,   ai_token_quota_monthly: 100000,  trial_days: 0,  is_active: true,  sort_order: 3 },
      { id: 4, code: 'enterprise', name: { ar: 'باقة المؤسسات', en: 'Enterprise Plan' },     price_monthly: 49900, max_users: 500, max_storage_mb: 1048576, ai_token_quota_monthly: 2000000, trial_days: 0,  is_active: true,  sort_order: 4 },
      { id: 5, code: 'legacy',     name: { ar: 'الباقة القديمة', en: 'Legacy Plan' },        price_monthly: 2900,  max_users: 20,  max_storage_mb: 2048,    ai_token_quota_monthly: 20000,   trial_days: 0,  is_active: false, sort_order: 5 },
    ];

    /* ---------- المؤسسات (status: active | trial | suspended | inactive — متّسقة مع اشتراكاتها) ---------- */
    const TENANTS = [
      { id: 't1',  name: { ar: 'جامعة الأقصى', en: 'Al-Aqsa University' },               domain: 'aqsa-univ.firob.sa',   color: '#0E80A1', created_at: addDays(-900), status: 'active', country: 'PS', contact: { name: { ar: 'د. سامي الحلو', en: 'Sami Al-Helou' }, email: 'admin@aqsa-univ.edu.ps', phone: '+970 8 284 1234' } },
      { id: 't2',  name: { ar: 'مدارس الرواد الأهلية', en: 'Al-Ruwad Schools' },          domain: 'alruwad.firob.sa',     color: '#0B6680', created_at: addDays(-200), status: 'active', country: 'SA', contact: { name: { ar: 'أ. نورة القحطاني', en: 'Noura Al-Qahtani' }, email: 'it@alruwad.edu.sa', phone: '+966 11 456 7788' } },

   * id: بادئة معرّفات الخيارات (aria-activedescendant) — options/get/set كما سبق.
   */
  function selectDropdown({ id, options, get, set, placeholder = '' }) {
    return {
      id, open: false, active: -1, typed: '', typedAt: 0,
      get items() { return options(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { const sel = this.selectedItem; return sel ? sel.label : (typeof placeholder === 'function' ? placeholder() : placeholder); },
      optId(item) { return this.id + '-opt-' + item.value; },
      openList() {
        if (!this.items.length) return;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item) { set(item.value); this.closeList(); this.$refs.btn?.focus(); },
      setActive(i) { this.active = Math.min(Math.max(i, 0), this.items.length - 1); this.scrollActiveIntoView(); },
      move(step) { if (!this.open) { this.openList(); return; } this.setActive(this.active + step); },
      onKey(e) {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); if (e.altKey && this.open && k === 'ArrowUp') { this.choose(this.items[this.active]); return; } this.move(k === 'ArrowDown' ? 1 : -1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.setActive(0); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.setActive(this.items.length - 1); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); (this.open && this.active > -1) ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape') { if (this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); } }
        else if (k === 'Tab') { if (this.open) this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          const now = Date.now();
          this.typed = (now - this.typedAt > 600 ? '' : this.typed) + k.toLowerCase();
          this.typedAt = now;
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this.typed));
          if (i > -1) { if (!this.open) this.openList(); this.setActive(i); }
        }
      },
      // children[0] هو <template x-for> — لذا +1
      scrollActiveIntoView() { this.$nextTick(() => this.$refs.list?.children[this.active + 1]?.scrollIntoView({ block: 'nearest' })); },
      isSelected(item) { const sel = this.selectedItem; return !!sel && sel.value === item.value; },
    };

  /* ================= أدوات الخصوصية والتصدير (دوال نقية تُختبر مستقلة) ================= */
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const IPV4_RE = /^\d{1,3}(\.\d{1,3}){3}$/;
  /* 192.168.10.24 → 192.168.•.•  ؛ IPv6 → أول مقطعين فقط */
  const maskIp = (ip) => {
    const s = String(ip || '');
    if (IPV4_RE.test(s)) { const p = s.split('.'); return p[0] + '.' + p[1] + '.•.•'; }
    if (s.includes(':')) return s.split(':').slice(0, 2).join(':') + ':•••';
    return s ? '•••' : '';
  };
  /* e.kullab@firob.com → e•••@firob.com */
  const maskEmail = (e) => {
    const s = String(e || ''); const at = s.indexOf('@');
    return at < 1 ? (s ? '•••' : '') : s[0] + '•••' + s.slice(at);
  };
  /* إقناع عميق لأي قيمة داخل properties (بريد/IP) */
  const maskDeep = (v) => {
    if (typeof v === 'string') return EMAIL_RE.test(v) ? maskEmail(v) : IPV4_RE.test(v) ? maskIp(v) : v;
    if (Array.isArray(v)) return v.map(maskDeep);
    if (v && typeof v === 'object') { const o = {}; Object.keys(v).forEach(k => { o[k] = maskDeep(v[k]); }); return o; }
    return v;
  };
  /* خلية CSV: اقتباس دائم + مضاعفة " + تحييد حقن الصيغ (= + - @ Tab CR) بإضافة ' */
  const csvCell = (v) => {
    let s = v == null ? '' : String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  };
  /* PRNG ثابت البذرة (mulberry32) — نفس البيانات في كل تحميل */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

    /**
     * يولّد السجل حتميًا: نفس البذرة ⇒ نفس الأحداث. التواريخ نسبية لليوم (SA) ولا يتجاوز أي حدث «الآن»:
     * أحداث اليوم تقع بين منتصف الليل واللحظة الحالية، والأيام السابقة على مدار اليوم كاملًا.
     * عدد استدعاءات PRNG لا يعتمد على الوقت فتبقى البيانات ثابتة.
     */
    function generateLogs(now) {
      now = now || new Date();
      const rnd = mulberry32(SEED);
      const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
      const int = (min, max) => min + Math.floor(rnd() * (max - min + 1));
      const todayIso = SA.isoLocal(now);
      const plan = [];                                   // أيام الرجوع لكل حدث
      for (let i = 0; i < 14; i++) plan.push(0);
      for (let i = 0; i < 8; i++) plan.push(1);
      for (let i = 0; i < 40; i++) plan.push(int(2, 29));
      for (let i = 0; i < 10; i++) plan.push(int(30, 88));
      const logs = plan.map((daysBack) => {
        const tpl = pick(TEMPLATES), causer = pick(CAUSERS), ip = pick(IPS), ua = pick(AGENTS);
        const frac = rnd();
        const start = SA.startOfDay(SA.addDays(-daysBack, todayIso));
        const span = daysBack === 0 ? Math.max(0, Math.floor((now - start) / 1000)) : 86399;   // بالثواني
        const created = new Date(start.getTime() + Math.floor(frac * (span + 1)) * 1000);
        const data = tpl.build({ pick, int, ip });
        return Object.assign({ log_name: tpl.log_name, action: tpl.action, severity: tpl.severity, causer_type: 'AdminUser', causer: causer.key,
          ip_address: ip, user_agent: ua.ua, browser: ua.browser, os: ua.os, created_at: created > now ? new Date(now.getTime()) : created }, data);
      });
      logs.sort((a, b) => a.created_at - b.created_at);
      logs.forEach((l, i) => { l.id = 1000 + i; });
      return logs.reverse();
    }

    /* منسّقات Intl مخزّنة لكل لغة */
    const DTF = {};
    const fmtDT = (d, loc, full) => {
      const k = loc + (full ? 'F' : 'S');
      DTF[k] = DTF[k] || new Intl.DateTimeFormat(SA.fmtLocale(loc), full
        ? { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }
        : { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      return DTF[k].format(d);
    };
    const DEFAULT_FILTERS = () => ({ query: '', category: 'all', severity: 'all', causer: 'all', dateRange: 'last30', customFrom: '', customTo: '' });

    return {
      /* ---------- حالة عامة (Shell) ---------- */
      dark: document.documentElement.classList.contains('dark'),
      locale: document.documentElement.lang === 'en' ? 'en' : 'ar',
      mobile: !desktopMQ.matches,
      wide: desktopMQ.matches,
      mobileNav: false,
      collapsed: false,
      notifOpen: false, profileOpen: false, exportOpen: false,
      active: 'activityLog',
      liveMsg: '',

      t(path) {
        const dict = I18N[this.locale];
        return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), dict) ?? path;
      },
      tf(path, vars) {
        let s = this.t(path);
        Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
        return s;
      },
      fmtNum(n) { return SA.fmtNum(n, this.locale); },
      setLocale(loc) {
        this.locale = loc;
        document.documentElement.lang = loc;
        document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
        document.title = this.t('docTitle');
        try { localStorage.setItem('firob-locale', loc); } catch (e) {}
      },
      toggleLocale() { this.setLocale(this.locale === 'ar' ? 'en' : 'ar'); },

      get expanded() { return this.mobile || !this.collapsed; },

      nav: [
        { group: 'overview', items: [
          { key: 'dashboard', icon: 'fa-solid fa-gauge-high', href: 'overview.html' },
          { key: 'aiAnalytics', icon: 'fa-solid fa-robot', href: 'ai-analytics.html' },
        ]},
        { group: 'admin', items: [
          { key: 'tenants', icon: 'fa-solid fa-building-columns', href: 'tenants.html' },
          { key: 'plans', icon: 'fa-solid fa-cubes', href: 'plans.html' },
          { key: 'subscriptions', icon: 'fa-solid fa-layer-group', href: 'subscriptions.html' },
          { key: 'payments', icon: 'fa-solid fa-file-invoice-dollar', href: 'payments.html' },
        ]},
        { group: 'system', items: [
          { key: 'activityLog', icon: 'fa-solid fa-clock-rotate-left', href: 'activity-log.html' },
          { key: 'systemSettings', icon: 'fa-solid fa-sliders', href: 'system-settings.html' },
        ]},
      ],
      setActive(key) { this.active = key; this.mobileNav = false; },

      notifications: [
        { id: 1, key: 'upload', time: '5m', read: false, icon: 'fa-solid fa-upload', tone: 'bg-primary-500/15 text-brand' },
        { id: 2, key: 'quota', time: '1h', read: false, icon: 'fa-solid fa-triangle-exclamation', tone: 'bg-warning-500/15 text-warning-700 dark:text-warning-500' },
        { id: 3, key: 'backup', time: '6h', read: true, icon: 'fa-solid fa-database', tone: 'bg-success-500/15 text-success-700 dark:text-success-500' },
      ],
      get unread() { return this.notifications.filter(n => !n.read).length; },

      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; this.wide = m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        document.title = this.t('docTitle');
        this._rawLogs = generateLogs(new Date());
        this.$watch('filters', () => this.onFilterChange());
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      /* Escape العام: القوائم فقط — الدرج يُغلق من لوحته (escape.stop) */
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; this.exportOpen = false; },

      /* ================= LND-08: سجل النشاط والتدقيق ================= */
      _rawLogs: [],
      view: 'timeline',
      sortDir: 'desc',
      page: 1,
      pageSize: 12,
      filters: DEFAULT_FILTERS(),

      categoryOptions: ['auth', 'billing', 'tenant_management', 'system_config', 'security'],
      severityOptions: ['success', 'info', 'warning', 'critical'],
      get causerOptions() { return CAUSERS.map(c => ({ value: c.key, label: c.name[this.locale] })); },
      get todayIso() { return SA.isoLocal(new Date()); },

      get decoratedLogs() {
        const L = this.locale;
        return this._rawLogs.map(l => {
          const c = CAUSER[l.causer];
          return Object.assign({}, l, {
            description: l.description[L], subject_label: l.subject_label[L],
            causer_name: c.name[L], causer_role: c.role[L], causer_email_masked: maskEmail(c.email),
            ip_masked: maskIp(l.ip_address),
            created_iso: isoDateTime(l.created_at), created_at_fmt: fmtDT(l.created_at, L), created_at_full: fmtDT(l.created_at, L, true),
          });
        });
      },

      /* حدود التاريخ شاملة: من بداية يوم «من» حتى نهاية يوم «إلى» */
      get dateBounds() {
        const f = this.filters, today = SA.isoLocal(new Date()), ok = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
        const range = (fromIso, toIso) => ({ from: SA.startOfDay(fromIso), to: SA.endOfDay(toIso) });
        switch (f.dateRange) {
          case 'today': return range(today, today);
          case 'yesterday': { const y = SA.addDays(-1, today); return range(y, y); }
          case 'last7': return range(SA.addDays(-6, today), today);
          case 'last30': return range(SA.addDays(-29, today), today);
          case 'custom': {
            const from = ok(f.customFrom) ? SA.startOfDay(f.customFrom) : null;
            const to = ok(f.customTo) ? SA.endOfDay(f.customTo) : null;
            if (from && to && from > to) return { from, to, invalid: true };
            return { from, to };
          }
          default: return { from: null, to: null };
        }
      },
      get dateError() { return this.dateBounds.invalid ? this.t('al.toolbar.dateError') : ''; },

      get filteredLogs() {
        const f = this.filters, b = this.dateBounds;
        if (b.invalid) return [];
        const q = (f.query || '').trim().toLowerCase();
        const dir = this.sortDir === 'asc' ? 1 : -1;
        return this.decoratedLogs.filter(l => {
          if (f.category !== 'all' && l.log_name !== f.category) return false;
          if (f.severity !== 'all' && l.severity !== f.severity) return false;
          if (f.causer !== 'all' && l.causer !== f.causer) return false;
          if (b.from && l.created_at < b.from) return false;
          if (b.to && l.created_at > b.to) return false;
          if (q) {
            const hay = [l.description, l.causer_name, l.subject_label, String(l.subject_id ?? ''), String(l.id), l.ip_masked].join(' ').toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        }).sort((a, b2) => dir * (a.created_at - b2.created_at) || dir * (a.id - b2.id));
      },
      get filtersActive() { return JSON.stringify(this.filters) !== JSON.stringify(DEFAULT_FILTERS()); },

      /* ---------- ترقيم محصور ---------- */
      get pageCount() { return Math.max(1, Math.ceil(this.filteredLogs.length / this.pageSize)); },
      get currentPage() { return Math.min(Math.max(1, this.page || 1), this.pageCount); },
      get pagedLogs() { const s = (this.currentPage - 1) * this.pageSize; return this.filteredLogs.slice(s, s + this.pageSize); },
      get rangeText() {
        const n = this.filteredLogs.length;
        if (!n) return this.t('al.table.rangeNone');
        const a = (this.currentPage - 1) * this.pageSize + 1, b = Math.min(n, a + this.pageSize - 1);
        return this.tf('al.table.range', { a: this.fmtNum(a), b: this.fmtNum(b), total: this.fmtNum(n) });
      },
      goPage(p) {
        this.page = Math.min(Math.max(1, Math.floor(Number(p) || 1)), this.pageCount);
        this.liveMsg = this.tf('al.table.livePage', { p: this.fmtNum(this.page), n: this.fmtNum(this.pageCount) });
      },
      onFilterChange() {
        this.page = 1;
        this.liveMsg = this.dateError || this.tf('al.table.live', { n: this.fmtNum(this.filteredLogs.length) });
      },
      toggleSort() {
        this.sortDir = this.sortDir === 'desc' ? 'asc' : 'desc';
        this.page = 1;
        this.liveMsg = this.tf('al.table.liveSort', { dir: this.sortDir === 'asc' ? this.t('al.table.sortAsc') : this.t('al.table.sortDesc') });
      },
      get tableCaption() {
        return this.tf('al.table.caption', { title: this.t('al.table.title'), dir: this.sortDir === 'asc' ? this.t('al.table.sortAsc') : this.t('al.table.sortDesc') });
      },
      setView(v) { this.view = v; },
      clearFilters() {
        this.filters = DEFAULT_FILTERS();
        this.onFilterChange();
      },

      /* ---------- مؤشرات (KPIs) — على النتائج المفلترة ---------- */
      get kpis() {
        const rows = this.filteredLogs;
        const securityLogs = rows.filter(l => l.action === 'security' || l.severity === 'critical' || l.severity === 'warning');
        const counts = {};
        rows.forEach(l => { counts[l.causer] = (counts[l.causer] || 0) + 1; });
        const top = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))[0];
        const topName = top ? CAUSER[top[0]].name[this.locale] : '—';
        const uniqueIps = new Set(rows.map(l => l.ip_address));
        return [
          { key: 'total', raw: rows.length, value: this.fmtNum(rows.length), icon: 'fa-solid fa-bolt', tone: 'bg-primary-500/15 text-brand' },
          { key: 'security', raw: securityLogs.length, value: this.fmtNum(securityLogs.length), icon: 'fa-solid fa-shield-halved', tone: 'bg-warning-500/15 text-warning-700 dark:text-warning-500' },
          { key: 'topOperator', raw: top ? top[0] : null, value: topName, title: topName, icon: 'fa-solid fa-user-tie', tone: 'bg-success-500/15 text-success-700 dark:text-success-500' },
          { key: 'uniqueIps', raw: uniqueIps.size, value: this.fmtNum(uniqueIps.size), icon: 'fa-solid fa-network-wired', tone: 'bg-info-500/15 text-info-700 dark:text-blue-300' },
        ];
      },

      /* ---------- ألوان + أيقونات (المعنى لا يعتمد على اللون وحده) ---------- */
      actionTone(action) {
        const map = {
          created:  { dot: 'bg-success-500 text-white',  badge: 'badge-success', icon: 'fa-solid fa-circle-plus' },
          updated:  { dot: 'bg-info-500 text-white',      badge: 'badge-info',    icon: 'fa-solid fa-pen' },
          deleted:  { dot: 'bg-error-600 text-white',     badge: 'badge-danger',  icon: 'fa-solid fa-trash' },
          security: { dot: 'bg-warning-500 text-onaccent', badge: 'badge-warning', icon: 'fa-solid fa-shield-halved' },
        };
        return map[action] || map.updated;
      },
      severityTone(severity) {
        const map = { success: 'badge-success', info: 'badge-info', warning: 'badge-warning', critical: 'badge-danger' };
        return map[severity] || 'badge-muted';
      },
      severityIcon(severity) {
        const map = { success: 'fa-solid fa-circle-check', info: 'fa-solid fa-circle-info', warning: 'fa-solid fa-triangle-exclamation', critical: 'fa-solid fa-circle-exclamation' };
        return map[severity] || 'fa-solid fa-circle';
      },

      /* ---------- قائمة التصدير (لوحة مفاتيح) ---------- */
      exportItems() { return [...(this.$refs.exportMenu?.querySelectorAll('[role="menuitem"]') || [])]; },
      toggleExport() {
        this.exportOpen = !this.exportOpen;
        if (this.exportOpen) this.$nextTick(() => this.exportItems()[0]?.focus());
      },
      exportKey(e) {
        if (!this.exportOpen) return;
        const items = this.exportItems(), i = items.indexOf(document.activeElement);
        const go = (n) => { e.preventDefault(); items[(n + items.length) % items.length]?.focus(); };
        if (e.key === 'ArrowDown') go(i + 1);
        else if (e.key === 'ArrowUp') go(i - 1);
        else if (e.key === 'Home') go(0);
        else if (e.key === 'End') go(items.length - 1);
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); this.exportOpen = false; this.$refs.exportBtn?.focus(); }
        else if (e.key === 'Tab') this.exportOpen = false;
      },

      /* ---------- الدرج الجانبي: تفاصيل الحدث ---------- */
      drawerOpen: false,
      drawerTab: 'overview',
      drawerTabs: [
        { key: 'overview', icon: 'fa-regular fa-id-card' },
        { key: 'diff', icon: 'fa-solid fa-code-compare' },
        { key: 'raw', icon: 'fa-solid fa-code' },
      ],
      selectedLog: null,
      _opener: null,
      openDrawer(log) {
        const el = document.activeElement;
        this._opener = el && el !== document.body ? el : null;
        this.selectedLog = log; this.drawerTab = 'overview'; this.drawerOpen = true;
      },
      closeDrawer() {
        this.drawerOpen = false;
        const el = this._opener; this._opener = null;
        this.$nextTick(() => { if (el && el.isConnected !== false) el.focus?.(); });
      },
      tabKey(e) {
        const keys = this.drawerTabs.map(x => x.key), i = keys.indexOf(this.drawerTab), rtl = this.locale === 'ar';
        let n = null;
        if (e.key === 'ArrowRight') n = i + (rtl ? -1 : 1);
        else if (e.key === 'ArrowLeft') n = i + (rtl ? 1 : -1);
        else if (e.key === 'Home') n = 0;
        else if (e.key === 'End') n = keys.length - 1;
        if (n === null) return;
        e.preventDefault();
        this.drawerTab = keys[(n + keys.length) % keys.length];
        this.$nextTick(() => document.getElementById('al-tab-' + this.drawerTab)?.focus());
      },

      get diffRows() {
        if (!this.selectedLog) return [];
        const oldObj = maskDeep(this.selectedLog.properties?.old || {});
        const newObj = maskDeep(this.selectedLog.properties?.attributes || {});
        const keys = [...new Set([...Object.keys(oldObj), ...Object.keys(newObj)])];
        return keys
          .filter(k => JSON.stringify(oldObj[k]) !== JSON.stringify(newObj[k]))
          .map(k => ({ field: k, oldVal: oldObj[k] !== undefined ? String(oldObj[k]) : '—', newVal: newObj[k] !== undefined ? String(newObj[k]) : '—' }));
      },

      /* سجل قابل للتصدير/العرض — مُقنَّع دائمًا */
      exportRecord(l) {
        return {
          id: l.id, created_at: l.created_iso, category: l.log_name, action: l.action, severity: l.severity,
          description: l.description, subject_type: l.subject_type, subject_id: l.subject_id, subject: l.subject_label,
          causer: l.causer_name, causer_email: l.causer_email_masked, ip_address: l.ip_masked,
          properties: maskDeep(l.properties),
        };
      },
      get rawJson() {
        if (!this.selectedLog) return '';
        return JSON.stringify(Object.assign(this.exportRecord(this.selectedLog), { user_agent: this.selectedLog.user_agent }), null, 2);
      },
      copyRawJson() {
        const done = (ok) => this.toast(ok ? 'success' : 'error', this.t(ok ? 'al.drawer.raw.copied' : 'al.drawer.raw.copyFailed'));
        try { navigator.clipboard.writeText(this.rawJson).then(() => done(true), () => done(false)); }
        catch (e) { done(false); }
      },

      /* ---------- تصدير السجل (حقيقي: Blob للنتائج المفلترة، مُقنَّع) ---------- */
      buildCsv(rows) {
        const header = ['id', 'created_at', 'category', 'action', 'severity', 'description', 'subject_type', 'subject_id', 'subject', 'causer', 'causer_email', 'ip_address'];
        const lines = [header.map(csvCell).join(',')].concat(rows.map(l => {
          const r = this.exportRecord(l);
          return header.map(h => csvCell(r[h])).join(',');
        }));
        return '﻿' + lines.join('\r\n') + '\r\n';
      },
      buildJson(rows) {
        return JSON.stringify({ exported_at: isoDateTime(new Date()), filters: this.filters, count: rows.length, records: rows.map(l => this.exportRecord(l)) }, null, 2);
      },
      exportLogs(format) {
        this.exportOpen = false;
        const rows = this.filteredLogs;
        if (!rows.length) {
          this.liveMsg = this.t('al.toast.nothingToExport');
          this.toast('info', this.liveMsg);
          return false;
        }
        const isJson = format === 'json';
        try {
          const blob = isJson
            ? new Blob([this.buildJson(rows)], { type: 'application/json;charset=utf-8' })
            : new Blob([this.buildCsv(rows)], { type: 'text/csv;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `firob-activity-log-${SA.todayIso()}.${isJson ? 'json' : 'csv'}`;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (e) {
          this.liveMsg = this.t('al.toast.exportFailed');
          this.toast('error', this.liveMsg);
          return false;
        }
        this.liveMsg = this.tf(isJson ? 'al.toast.exportedJson' : 'al.toast.exportedCsv', { n: this.fmtNum(rows.length) });
        this.toast('success', this.liveMsg);
        return true;
      },

      /* ---------- SweetAlert2: تنبيه سريع (نص فقط — بلا HTML) ---------- */
      toast(icon, text) {
        if (!window.Swal) return;
        window.Swal.fire({
          toast: true, position: this.locale === 'ar' ? 'top-start' : 'top-end',
          showConfirmButton: false, timer: 2800, timerProgressBar: true,
          customClass: { popup: 'firob-swal firob-toast' },
          didOpen: (popup) => popup.setAttribute('dir', this.locale === 'ar' ? 'rtl' : 'ltr'),
          icon, titleText: text,
        });
      },
    };
  }
</script>
