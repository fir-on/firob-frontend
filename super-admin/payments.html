      dark: document.documentElement.classList.contains('dark'),
      locale: document.documentElement.lang === 'en' ? 'en' : 'ar',
      mobile: !desktopMQ.matches,
      wide: wideMQ.matches,
      mobileNav: false,
      collapsed: false,
      notifOpen: false, profileOpen: false,
      active: 'payments',
      liveMsg: '',
      get expanded() { return this.mobile || !this.collapsed; },

      /* ---------- الترجمة والتنسيق ---------- */
      t(path) {
        const dict = I18N[this.locale];
        return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), dict) ?? path;
      },
      tf(path, vars) {
        let s = this.t(path);
        Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
        return s;
      },
      setLocale(loc) {
        this.locale = loc;
        document.documentElement.lang = loc;
        document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
        document.title = this.t('pb.title') + ' — FirOb';
        try { localStorage.setItem('firob-locale', loc); } catch (e) {}
      },
      toggleLocale() { this.setLocale(this.locale === 'ar' ? 'en' : 'ar'); },
      money(minor) { return SA.money(minor, this.locale); },
      fmtDate(iso) { return SA.fmtDate(iso, this.locale); },
      fmtNum(n) { return SA.fmtNum(n, this.locale); },
      fmtPct(p) { return new Intl.NumberFormat(SA.fmtLocale(this.locale), { style: 'percent', maximumFractionDigits: 1 }).format((p || 0) / 100); },
      relTime(mins) {
        const rtf = new Intl.RelativeTimeFormat(SA.fmtLocale(this.locale), { numeric: 'auto', style: 'short' });
        return mins < 60 ? rtf.format(-mins, 'minute') : rtf.format(-Math.round(mins / 60), 'hour');
      },
      announce(msg) { this.liveMsg = ''; this.$nextTick(() => { this.liveMsg = msg; }); },

      /* ---------- التنقل ---------- */
      nav: [
        { group: 'overview', items: [
          { key: 'dashboard', icon: 'fa-solid fa-gauge-high', href: 'overview.html' },
          { key: 'aiAnalytics', icon: 'fa-solid fa-robot', href: 'ai-analytics.html' },
        ]},
        { group: 'admin', items: [
          { key: 'tenants', icon: 'fa-solid fa-building-columns', href: 'tenants.html' },
          { key: 'plans', icon: 'fa-solid fa-cubes', href: 'plans.html' },
          { key: 'subscriptions', icon: 'fa-solid fa-layer-group', href: 'subscriptions.html' },
          { key: 'payments', icon: 'fa-solid fa-file-invoice-dollar', href: 'payments.html' },
        ]},
        { group: 'system', items: [
          { key: 'activityLog', icon: 'fa-solid fa-clock-rotate-left', href: 'activity-log.html' },
          { key: 'systemSettings', icon: 'fa-solid fa-sliders', href: 'system-settings.html' },
        ]},
      ],
      setActive(key) { this.active = key; this.mobileNav = false; },

      /* ---------- الإشعارات (الوقت نسبي ومترجم عبر Intl.RelativeTimeFormat) ---------- */
      notifications: [
        { id: 1, key: 'upload', mins: 5, read: false, icon: 'fa-solid fa-upload', tone: 'bg-primary-500/15 text-brand' },
        { id: 2, key: 'pastdue', mins: 40, read: false, icon: 'fa-solid fa-triangle-exclamation', tone: 'bg-warning-500/15 text-warning-700 dark:text-warning-500' },
        { id: 3, key: 'quota', mins: 60, read: true, icon: 'fa-solid fa-gauge-high', tone: 'bg-info-500/15 text-info-700 dark:text-blue-300' },
      ],
      get unread() { return this.notifications.filter(n => !n.read).length; },

      /* ---------- بيانات (SA) ---------- */
      tenants: SA.TENANTS,
      invoices: INVOICES,
      paymentsLog: PAYMENTS,
      methods: METHODS,
      reasons: REASONS,

      /* ---------- مساعدات البيانات المشتقة ---------- */
      tenantById(id) { return SA.tenant(id); },
      tenantName(tn) { return tn ? (tn.name[this.locale] || tn.name.ar) : '—'; },
      initials(tn) {
        if (!tn) return '?';
        const words = this.tenantName(tn).replace(/-/g, ' ').split(/\s+/).filter(Boolean);
        const first = (w) => (w || '').replace(/^ال(?=\S{2,})/, '').charAt(0);
        return (first(words[0]) + first(words[1])).toUpperCase();
      },
      stateOf(inv) { return SA.invoiceState(inv, this.paymentsLog); },
      invRow(inv) { return inv ? Object.assign({}, inv, { tenant: this.tenantById(inv.tenant_id), st: this.stateOf(inv), totals: SA.invoiceTotals(inv) }) : null; },
      invoiceById(id) { return this.invoices.find(i => i.id === id) || null; },
      paymentById(id) { return this.paymentsLog.find(p => p.id === id) || null; },
      payStatusOf(p) {
        if (p.status !== 'completed') return p.status;
        const r = SA.refundedOf(p);
        return r <= 0 ? 'completed' : (r >= p.amount ? 'refunded' : 'partially_refunded');
      },
      payRow(p) {
        if (!p) return null;
        const inv = this.invoiceById(p.invoice_id);
        return Object.assign({}, p, { tenant: this.tenantById(p.tenant_id), invoice: inv, dstatus: this.payStatusOf(p), refunded: SA.refundedOf(p), refundable: SA.refundableOf(p) });
      },
      planLabel(inv) {
        if (!inv.subscription_id) return this.t('pb.manualInvoice');
        const sub = SA.SUBSCRIPTIONS.find(s => s.id === inv.subscription_id);
        const plan = sub && SA.plan(sub.plan_id);
        return plan ? plan.name[this.locale] : '—';
      },
      itemDesc(it) {
        if (it.description) return it.description[this.locale] || it.description.ar || '—';
        if (it.description_key === 'sub') { const p = SA.plan(it.plan_id); return this.tf('pb.subLine', { plan: p ? p.name[this.locale] : '' }); }
        return '—';
      },
      paymentsForInvoice(invoice_id) {
        return this.paymentsLog.filter(p => p.invoice_id === invoice_id).sort((a, b) => (a.paid_at < b.paid_at ? 1 : -1)).map(p => this.payRow(p));
      },
      paidOnOf(inv) {
        const st = this.stateOf(inv);
        if (st.status !== 'paid' && st.status !== 'refunded') return null;
        const dates = this.paymentsLog.filter(p => p.invoice_id === inv.id && p.status === 'completed').map(p => p.paid_at).sort();
        return dates[dates.length - 1] || null;
      },

      invStatusLabel(s) { return this.t('pb.invStatus.' + s); },
      invStatusClass(s) { return { paid: 'badge-success', unpaid: 'badge-warning', partially_paid: 'badge-info', overdue: 'badge-danger', void: 'badge-muted', refunded: 'badge-purple' }[s] || 'badge-muted'; },
      payStatusLabel(s) { return this.t('pb.payStatus.' + s); },
      payStatusClass(s) { return { completed: 'badge-success', pending: 'badge-warning', failed: 'badge-danger', refunded: 'badge-purple', partially_refunded: 'badge-purple' }[s] || 'badge-muted'; },
      methodLabel(m) { return this.t('pb.methods.' + (LEGACY_METHODS[m] || m)); },
      methodIcon(m) {
        return {
          credit_card: 'fa-solid fa-credit-card', bank_transfer: 'fa-solid fa-building-columns',
          paypal: 'fa-brands fa-paypal', stripe: 'fa-brands fa-stripe-s',
          cash: 'fa-solid fa-money-bill-wave', check: 'fa-solid fa-money-check-dollar', online: 'fa-solid fa-globe',
        }[m] || 'fa-solid fa-circle-question';
      },

      /* ---------- مؤشرات KPI (بالهللة؛ الفواتير الملغاة مستبعدة من المفوتَر) ---------- */
      get kpi() {
        const sts = this.invoices.filter(i => i.status_override !== 'void').map(i => this.stateOf(i));
        const sum = (f) => SA.m.sum(sts.map(f));
        const done = this.paymentsLog.filter(p => p.status === 'completed');
        const billed = sum(s => s.total);
        const collected = SA.m.sum(done.map(p => p.amount));            // إجمالي المحصّل (قبل الاسترداد)
        const refunded = SA.m.sum(done.map(p => SA.refundedOf(p)));     // مجموع سجلات refunds[]
        const paidCount = sts.filter(s => s.status === 'paid').length;
        const unpaidCount = sts.filter(s => s.balance > 0).length;
        return {
          billed, collected, refunded, net: collected - refunded,
          outstanding: sum(s => s.balance),
          overdue: sts.filter(s => s.overdue).length,
          rate: billed ? (collected / billed) * 100 : 0,
          paidCount, unpaidCount,
          paidRatio: (paidCount + unpaidCount) ? (paidCount / (paidCount + unpaidCount)) * 100 : 0,
        };
      },
      get collectionRateClass() { const r = this.kpi.rate; return r >= 90 ? 'text-success-700 dark:text-success-500' : r >= 70 ? 'text-warning-700 dark:text-warning-500' : 'text-error-700 dark:text-red-300'; },
      get collectionRateBarClass() { const r = this.kpi.rate; return r >= 90 ? 'bg-success-500' : r >= 70 ? 'bg-warning-500' : 'bg-error-500'; },

      /* ---------- التبويبات (نمط tablist حقيقي: أسهم حسب الاتجاه + Home/End) ---------- */
      activeTab: 'invoices',
      search: '', statusFilter: 'all', methodFilter: 'all', dateFrom: '', dateTo: '',
      setTab(tab) { this.activeTab = tab; this.statusFilter = 'all'; },
      tabKeydown(e, keys, current, select, idPrefix) {
        const i = keys.indexOf(current), last = keys.length - 1, rtl = this.locale === 'ar';
        let n = null;
        if (e.key === 'ArrowRight') n = rtl ? i - 1 : i + 1;
        else if (e.key === 'ArrowLeft') n = rtl ? i + 1 : i - 1;
        else if (e.key === 'Home') n = 0;
        else if (e.key === 'End') n = last;
        if (n === null) return;
        e.preventDefault();
        n = n < 0 ? last : (n > last ? 0 : n);
        select(keys[n]);
        this.$nextTick(() => document.getElementById(idPrefix + keys[n])?.focus());
      },
      resetFilters() {
        this.search = ''; this.statusFilter = 'all'; this.methodFilter = 'all'; this.dateFrom = ''; this.dateTo = '';
        this.$nextTick(() => document.getElementById('pb-search')?.focus());
      },
      get filtersActive() { return !!(this.search.trim() || this.statusFilter !== 'all' || this.methodFilter !== 'all' || this.dateFrom || this.dateTo); },
      get todayIso() { return SA.todayIso(); },
      get dateRangeInvalid() { return !!(this.dateFrom && this.dateTo && this.dateFrom > this.dateTo); },
      get filterSig() { return [this.activeTab, this.search, this.statusFilter, this.methodFilter, this.dateFrom, this.dateTo].join('|'); },
      onFiltersChanged() {
        this.invPage = 1; this.payPage = 1;
        const n = this.activeTab === 'invoices' ? this.filteredInvoices().length : this.filteredPayments().length;
        this.announce(this.tf(this.activeTab === 'invoices' ? 'pb.liveInv' : 'pb.livePay', { n: this.fmtNum(n) }));
      },
      statusTabs() {
        if (this.activeTab === 'invoices') {
          const rows = this.invoices.map(i => this.stateOf(i));
          const defs = [
            { key: 'all', label: 'tabAll', dot: '' },
            { key: 'paid', label: 'tabPaid', dot: 'text-success-500' },
            { key: 'unpaid', label: 'tabUnpaid', dot: 'text-warning-500' },
            { key: 'partially_paid', label: 'tabPartiallyPaid', dot: 'text-info-500' },
            { key: 'overdue', label: 'tabOverdue', dot: 'text-error-500' },
            { key: 'refunded', label: 'tabRefunded', dot: 'text-purple-500' },
            { key: 'void', label: 'tabVoid', dot: 'text-line-strong' },
          ];
          return defs.map(d => ({ key: d.key, dot: d.dot, label: this.t('pb.' + d.label), count: rows.filter(st => this.invStatusMatch(st, d.key)).length }));
        }
        const defs = [
          { key: 'all', label: 'tabAll', dot: '' },
          { key: 'completed', label: 'tabCompleted', dot: 'text-success-500' },
          { key: 'pending', label: 'tabPending', dot: 'text-warning-500' },
          { key: 'failed', label: 'tabFailed', dot: 'text-error-500' },
          { key: 'refunded', label: 'tabRefunded', dot: 'text-purple-500' },
        ];
        return defs.map(d => ({ key: d.key, dot: d.dot, label: this.t('pb.' + d.label), count: this.paymentsLog.filter(p => this.payStatusMatch(p, d.key)).length }));
      },
      /* «متأخرة» = overdue === true (يشمل المدفوعة جزئيًا بعد الاستحقاق) — نفس تعريف مؤشر KPI */
      invStatusMatch(st, key) { return key === 'all' || (key === 'overdue' ? st.overdue : st.status === key); },
      payStatusMatch(p, key) {
        if (key === 'all') return true;
        const s = this.payStatusOf(p);
        return key === 'refunded' ? (s === 'refunded' || s === 'partially_refunded') : s === key;
      },

      /* ---------- الترتيب والترقيم ---------- */
      invSort: { key: 'issue_date', dir: 'desc' }, paySort: { key: 'paid_at', dir: 'desc' },
      invPage: 1, payPage: 1, perPage: PER_PAGE,
      sortState(tab) { return tab === 'invoices' ? this.invSort : this.paySort; },
      sortBy(tab, key) {
        const s = this.sortState(tab);
        if (s.key === key) s.dir = s.dir === 'asc' ? 'desc' : 'asc'; else { s.key = key; s.dir = 'desc'; }
        if (tab === 'invoices') this.invPage = 1; else this.payPage = 1;
      },
      ariaSort(tab, key) { const s = this.sortState(tab); return s.key === key ? (s.dir === 'asc' ? 'ascending' : 'descending') : 'none'; },
      sortIcon(tab, key) { const s = this.sortState(tab); return s.key !== key ? 'fa-sort' : (s.dir === 'asc' ? 'fa-sort-up' : 'fa-sort-down'); },
      sortRows(rows, s, valueOf) {
        const dir = s.dir === 'asc' ? 1 : -1;
        return rows.sort((a, b) => {
          const va = valueOf(a, s.key), vb = valueOf(b, s.key);
          if (va < vb) return -dir;
          if (va > vb) return dir;
          return (b.id - a.id);
        });
      },
      pageCount(tab) { const n = tab === 'invoices' ? this.filteredInvoices().length : this.filteredPayments().length; return Math.max(1, Math.ceil(n / PER_PAGE)); },
      curPage(tab) { return Math.min(tab === 'invoices' ? this.invPage : this.payPage, this.pageCount(tab)); },
      goPage(tab, p) {
        const n = Math.min(Math.max(1, p), this.pageCount(tab));
        if (tab === 'invoices') this.invPage = n; else this.payPage = n;
        this.announce(this.tf('pb.pageOf', { p: this.fmtNum(n), n: this.fmtNum(this.pageCount(tab)) }));
      },
      pagedInvoices() { const p = this.curPage('invoices'); return this.filteredInvoices().slice((p - 1) * PER_PAGE, p * PER_PAGE); },
      pagedPayments() { const p = this.curPage('payments'); return this.filteredPayments().slice((p - 1) * PER_PAGE, p * PER_PAGE); },
      rangeText(tab) {
        const total = tab === 'invoices' ? this.filteredInvoices().length : this.filteredPayments().length;
        if (!total) return this.t('pb.rangeEmpty');
        const p = this.curPage(tab), from = (p - 1) * PER_PAGE + 1, to = Math.min(total, p * PER_PAGE);
        return this.tf(tab === 'invoices' ? 'pb.rangeInv' : 'pb.rangePay', { from: this.fmtNum(from), to: this.fmtNum(to), total: this.fmtNum(total) });
      },

      /* ---------- بحث / فلاتر ---------- */
      matchText(q, parts) { return !q || parts.some(s => String(s || '').toLowerCase().includes(q)); },
      filteredInvoices() {
        const q = this.search.trim().toLowerCase();
        const rows = this.invoices.map(inv => this.invRow(inv)).filter(r => {
          const tn = r.tenant || { name: {}, domain: '' };
          return this.matchText(q, [r.invoice_number, tn.name.ar, tn.name.en, tn.domain, this.planLabel(r)])
            && this.invStatusMatch(r.st, this.statusFilter)
            && (!this.dateFrom || r.issue_date >= this.dateFrom)
            && (!this.dateTo || r.issue_date <= this.dateTo);
        });
        return this.sortRows(rows, this.invSort, (r, k) => (k === 'total' ? r.st.total : k === 'balance' ? r.st.balance : k === 'tenant' ? this.tenantName(r.tenant) : r[k]));
      },
      filteredPayments() {
        const q = this.search.trim().toLowerCase();
        const rows = this.paymentsLog.map(p => this.payRow(p)).filter(p => {
          const tn = p.tenant || { name: {} };
          return this.matchText(q, [p.transaction_reference, p.invoice && p.invoice.invoice_number, tn.name.ar, tn.name.en])
            && this.payStatusMatch(p, this.statusFilter)
            && (this.methodFilter === 'all' || p.payment_method === this.methodFilter)
            && (!this.dateFrom || p.paid_at >= this.dateFrom)
            && (!this.dateTo || p.paid_at <= this.dateTo);
        });
        return this.sortRows(rows, this.paySort, (r, k) => (k === 'tenant' ? this.tenantName(r.tenant) : r[k]));
      },

      /* ---------- تصدير CSV (القائمة المفلترة كاملة، مع حماية من حقن الصيغ) ---------- */
      csvCell(v) {
        let s = v === null || v === undefined ? '' : String(v);
        if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
        if (/[",;\r\n]/.test(s) || s !== s.trim()) s = '"' + s.replace(/"/g, '""') + '"';
        return s;
      },
      csvAmount(minor) { return (minor / 100).toFixed(2); },   // رقم خام بلا رمز عملة (العملة في رأس العمود)
      csvRows() {
        const cur = ' (' + SA.CURRENCY + ')';
        if (this.activeTab === 'invoices') {
          const head = ['colInvoice', 'colTenant', 'colPlan', 'colIssued', 'colDue'].map(k => this.t('pb.' + k))
            .concat(['colSubtotal', 'colVat', 'colTotal', 'colAmountPaid', 'colRefunded', 'colBalance'].map(k => this.t('pb.' + k) + cur))
            .concat([this.t('pb.colStatus')]);
          return [head].concat(this.filteredInvoices().map(r => [
            r.invoice_number, this.tenantName(r.tenant), this.planLabel(r), r.issue_date, r.due_date,
            this.csvAmount(r.totals.subtotal), this.csvAmount(r.totals.vat), this.csvAmount(r.st.total),
            this.csvAmount(r.st.paid), this.csvAmount(r.st.refunded), this.csvAmount(r.st.balance),
            this.invStatusLabel(r.st.status) + (r.st.overdue && r.st.status !== 'overdue' ? ' / ' + this.invStatusLabel('overdue') : ''),
          ]));
        }
        const head = ['colTxRef', 'colInvoice', 'colTenant', 'colMethod'].map(k => this.t('pb.' + k))
          .concat(['colAmount', 'colRefunded'].map(k => this.t('pb.' + k) + cur))
          .concat([this.t('pb.colPaymentDate'), this.t('pb.colGatewayStatus')]);
        return [head].concat(this.filteredPayments().map(p => [
          p.transaction_reference, p.invoice ? p.invoice.invoice_number : '', this.tenantName(p.tenant), this.methodLabel(p.payment_method),
          this.csvAmount(p.amount), this.csvAmount(p.refunded), p.paid_at, this.payStatusLabel(p.dstatus),
        ]));
      },
      buildCsv() { return '﻿' + this.csvRows().map(r => r.map(c => this.csvCell(c)).join(',')).join('\r\n'); },
      exportCsv() {
        const rows = this.csvRows().length - 1;
        try {
          const blob = new Blob([this.buildCsv()], { type: 'text/csv;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'firob-' + this.activeTab + '-' + SA.todayIso() + '.csv';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          const msg = this.tf('pb.csvExported', { n: this.fmtNum(rows) });
          this.toast(msg); this.announce(msg);
        } catch (e) { this.toast(this.t('pb.csvFailed'), 'error'); }
      },

      /* ---------- النوافذ: فتح/إغلاق مع إرجاع التركيز إلى الزر الفاتح ---------- */
      modal: null, busy: false, submitted: false,
      _opener: null, _soOpener: null,
      openModal(name) { if (!this.modal) this._opener = document.activeElement || null; this.modal = name; this.submitted = false; },
      closeModal() {
        if (this.busy) return;
        this.modal = null;
        const el = this._opener; this._opener = null;
        this.$nextTick(() => el && el.focus && el.focus());
      },

      /* Slide-over تفاصيل الفاتورة — يُقرأ دائمًا من الحالة الحيّة (لا نسخ قديمة) */
      slideOverOpen: false, selectedInvoiceId: null,
      get selectedInvoice() { return this.invRow(this.invoiceById(this.selectedInvoiceId)); },
      openInvoiceDetails(inv) {
        if (!inv) return;
        if (this.modal) { this._soOpener = this._opener; this._opener = null; this.modal = null; }
        else if (!this.slideOverOpen) this._soOpener = document.activeElement || null;
        this.selectedInvoiceId = inv.id;
        this.slideOverOpen = true;
      },
      closeSlideOver() {
        if (this.busy) return;
        this.slideOverOpen = false;
        const el = this._soOpener; this._soOpener = null;
        this.$nextTick(() => el && el.focus && el.focus());
      },

      selectedPaymentId: null,
      get selectedPayment() { return this.payRow(this.paymentById(this.selectedPaymentId)); },
      openPaymentDetails(p) { this.selectedPaymentId = p.id; this.openModal('payDetails'); },

      /* ---------- إصدار فاتورة: بنود بالدولار → سنت، ضريبة 15%، تحقق التواريخ ---------- */
      blankItem() { return { desc_ar: '', desc_en: '', qty: 1, unit_price: '' }; },
      newInvoiceForm: { tenant_id: '', subscription_id: '', items: [], issue_date: '', due_date: '' },
      openNewInvoiceModal() {
        this.newInvoiceForm = { tenant_id: '', subscription_id: '', items: [this.blankItem()], issue_date: SA.todayIso(), due_date: SA.addDays(14) };
        this.openModal('newInvoice');
      },
      subscriptionsFor(tenant_id) { return SA.SUBSCRIPTIONS.filter(s => s.tenant_id === tenant_id); },
      subOptionLabel(s) { const p = SA.plan(s.plan_id); return '#' + s.id + ' — ' + (p ? p.name[this.locale] : ''); },
      onSubscriptionChosen(id) {
        this.newInvoiceForm.subscription_id = id;
        const sub = SA.SUBSCRIPTIONS.find(s => s.id === id), plan = sub && SA.plan(sub.plan_id);
        const items = this.newInvoiceForm.items;
        const it = items[0];
        if (plan && items.length === 1 && !it.desc_ar.trim() && !it.desc_en.trim() && (it.unit_price === '' || Number(it.unit_price) === 0)) {
          it.desc_ar = I18N.ar.pb.subLine.replace('{plan}', plan.name.ar);
          it.desc_en = I18N.en.pb.subLine.replace('{plan}', plan.name.en);
          it.unit_price = String(SA.m.toMajor(plan.price_monthly));
        }
      },
      addInvoiceItem() { this.newInvoiceForm.items.push(this.blankItem()); },
      removeInvoiceItem(idx) { if (this.newInvoiceForm.items.length > 1) this.newInvoiceForm.items.splice(idx, 1); },
      itemValid(it) {
        const q = Number(it.qty), u = Number(it.unit_price);
        return !!((it.desc_ar || '').trim() || (it.desc_en || '').trim()) && Number.isInteger(q) && q >= 1
          && it.unit_price !== '' && it.unit_price !== null && Number.isFinite(u) && u >= 0;
      },
      niItemsMinor() { return this.newInvoiceForm.items.map(it => ({ qty: Math.max(0, Math.floor(Number(it.qty) || 0)), unit_price: Math.max(0, SA.m.toMinor(it.unit_price)) })); },
      niTotals() { return SA.invoiceTotals({ items: this.niItemsMinor() }); },
      itemLineMinor(it) { return Math.max(0, Math.floor(Number(it.qty) || 0)) * Math.max(0, SA.m.toMinor(it.unit_price)); },
      get niErrors() {
        const f = this.newInvoiceForm, e = {};
        if (!f.tenant_id) e.tenant = this.t('pb.errTenant');
        if (!f.items.length || !f.items.every(it => this.itemValid(it))) e.items = this.t('pb.errItems');
        else if (this.niTotals().total <= 0) e.total = this.t('pb.errTotal');
        if (!f.issue_date) e.issue = this.t('pb.errDateRequired');
        if (!f.due_date) e.due = this.t('pb.errDateRequired');
        else if (f.issue_date && f.due_date < f.issue_date) e.due = this.t('pb.errDueBeforeIssue');
        return e;
      },
      nextInvoiceNumber(issueIso) {
        const year = issueIso.slice(0, 4), prefix = 'INV-' + year + '-';
        const max = this.invoices.filter(i => i.invoice_number.startsWith(prefix)).reduce((m, i) => Math.max(m, parseInt(i.invoice_number.slice(prefix.length), 10) || 0), 0);
        return prefix + String(max + 1).padStart(4, '0');
      },
      async submitNewInvoice() {
        if (this.busy) return false;
        this.submitted = true;
        const errs = this.niErrors;
        if (Object.keys(errs).length) { this.announce(this.tf('pb.fixErrors', { msg: Object.values(errs).join(' ') })); return false; }
        this.busy = true;
        await delay(400);
        const f = this.newInvoiceForm;
        const number = this.nextInvoiceNumber(f.issue_date);
        const inv = {
          id: this.invoices.reduce((m, i) => Math.max(m, i.id), 0) + 1,
          invoice_number: number, tenant_id: f.tenant_id, subscription_id: f.subscription_id || null,
          issue_date: f.issue_date, due_date: f.due_date, voided_at: null, void_reason: null, status_override: null,
          items: f.items.map(it => {
            const ar = it.desc_ar.trim(), en = it.desc_en.trim();
            return { description: { ar: ar || en, en: en || ar }, qty: Math.floor(Number(it.qty)), unit_price: SA.m.toMinor(it.unit_price) };
          }),
        };
        this.invoices.unshift(inv);
        this.busy = false;
        this.closeModal();
        const msg = this.tf('pb.toastInvoiceCreated', { number, name: this.tenantName(this.tenantById(f.tenant_id)) });
        this.toast(msg); this.announce(msg);
        return inv;
      },

      /* ---------- تسجيل دفعة: مبلغ ≤ الرصيد (رفض لا اقتطاع)، تاريخ بين الإصدار واليوم ---------- */
      recordPaymentForm: { invoice_id: '', amount: '', payment_method: 'bank_transfer', reference: '', notes: '', paid_at: '' },
      canRecordPayment(inv) { if (!inv) return false; const st = this.stateOf(inv); return st.status !== 'void' && st.balance > 0; },
      payableInvoices() { return this.invoices.filter(i => this.canRecordPayment(i)).map(i => this.invRow(i)); },
      recordPaymentInvoice() { return this.invRow(this.invoiceById(this.recordPaymentForm.invoice_id)); },
      openRecordPaymentModal(inv) {
        const bal = inv ? this.stateOf(inv).balance : 0;
        this.recordPaymentForm = { invoice_id: inv && this.canRecordPayment(inv) ? inv.id : '', amount: bal ? String(SA.m.toMajor(bal)) : '', payment_method: 'bank_transfer', reference: '', notes: '', paid_at: SA.todayIso() };
        this.openModal('recordPayment');
      },
      onRecordPaymentInvoiceChange(id) {
        this.recordPaymentForm.invoice_id = id;
        const inv = this.invoiceById(id);
        if (inv) this.recordPaymentForm.amount = String(SA.m.toMajor(this.stateOf(inv).balance));
      },
      get rpErrors() {
        const f = this.recordPaymentForm, e = {}, inv = this.invoiceById(f.invoice_id);
        if (!inv || !this.canRecordPayment(inv)) e.invoice = this.t('pb.errInvoice');
        const amt = Number(f.amount), minor = SA.m.toMinor(f.amount);
        if (f.amount === '' || f.amount === null || !Number.isFinite(amt) || minor <= 0) e.amount = this.t('pb.errAmountPos');
        else if (inv && minor > this.stateOf(inv).balance) e.amount = this.tf('pb.errAmountMax', { amount: this.money(minor), balance: this.money(this.stateOf(inv).balance) });
        if (!METHODS.includes(f.payment_method)) e.method = this.t('pb.errMethod');
        const ref = (f.reference || '').trim();
        if (!ref) e.reference = this.t('pb.errRef');
        else if (this.paymentsLog.some(p => p.transaction_reference.toLowerCase() === ref.toLowerCase())) e.reference = this.t('pb.errRefDup');
        if (!f.paid_at) e.date = this.t('pb.errDateRequired');
        else if (f.paid_at > SA.todayIso()) e.date = this.t('pb.errPayDateFuture');
        else if (inv && f.paid_at < inv.issue_date) e.date = this.tf('pb.errPayDateBeforeIssue', { date: this.fmtDate(inv.issue_date) });
        return e;
      },
      async submitRecordPayment() {
        if (this.busy) return false;          // حماية من الإرسال المزدوج
        this.submitted = true;
        const errs = this.rpErrors;
        if (Object.keys(errs).length) { this.announce(this.tf('pb.fixErrors', { msg: Object.values(errs).join(' ') })); return false; }
        this.busy = true;
        await delay(400);
        const f = this.recordPaymentForm, inv = this.invoiceById(f.invoice_id), amount = SA.m.toMinor(f.amount);
        const p = {
          id: this.paymentsLog.reduce((m, x) => Math.max(m, x.id), 0) + 1,
          invoice_id: inv.id, tenant_id: inv.tenant_id, amount, payment_method: f.payment_method,
          transaction_reference: f.reference.trim(), status: 'completed', paid_at: f.paid_at, refunds: [],
          notes: (f.notes || '').trim(), recorded_by: CURRENT_USER,
        };
        this.paymentsLog.unshift(p);
        this.busy = false;
        this.closeModal();
        const msg = this.tf('pb.toastPaymentRecorded', { amount: this.money(amount), number: inv.invoice_number });
        this.toast(msg); this.announce(msg);
        return p;
      },

      /* ---------- إلغاء فاتورة: فقط إن لم يُدفع عليها شيء — مع سبب وتاريخ ---------- */
      voidTargetId: null, voidForm: { reason: '', note: '' },
      get voidTarget() { return this.invRow(this.invoiceById(this.voidTargetId)); },
      voidBlockReason(inv) {
        const st = this.stateOf(inv);
        if (st.status === 'void') return 'void';
        if (st.paid > 0) return 'paid';
        if (this.paymentsLog.some(p => p.invoice_id === inv.id && p.status === 'pending')) return 'pending';
        return null;
      },
      canVoidInvoice(inv) { return !!inv && !this.voidBlockReason(inv); },
      voidTip(inv) { const r = this.voidBlockReason(inv); return !r ? this.t('pb.menuVoid') : (r === 'void' ? this.t('pb.alreadyVoid') : this.t('pb.voidTooltipBlocked')); },
      voidBlockedMsg(inv) {
        const r = this.voidBlockReason(inv);
        if (r === 'paid') return this.tf('pb.voidBlockedPaid', { number: inv.invoice_number, paid: this.money(this.stateOf(inv).paid) });
        if (r === 'pending') return this.tf('pb.voidBlockedPending', { number: inv.invoice_number });
        return '';
      },
      openVoidModal(inv) {
        const r = this.voidBlockReason(inv);
        if (r === 'void') return false;
        if (r) { const msg = this.voidBlockedMsg(inv); this.info(this.t('pb.voidBlockedTitle'), msg); this.announce(msg); return false; }
        this.voidTargetId = inv.id;
        this.voidForm = { reason: '', note: '' };
        this.openModal('void');
        return true;
      },
      reasonErrors(form) {
        const e = {};
        if (!REASONS.includes(form.reason)) e.reason = this.t('pb.errReason');
        else if (form.reason === 'other' && !(form.note || '').trim()) e.note = this.t('pb.errReasonNote');
        return e;
      },
      get voidErrors() { return this.reasonErrors(this.voidForm); },
      async confirmVoid() {
        if (this.busy) return false;
        this.submitted = true;
        const inv = this.invoiceById(this.voidTargetId);
        if (!inv || Object.keys(this.voidErrors).length) { this.announce(this.tf('pb.fixErrors', { msg: Object.values(this.voidErrors).join(' ') })); return false; }
        if (this.voidBlockReason(inv)) { this.announce(this.voidBlockedMsg(inv)); return false; }   // تحقق ثانٍ قبل التنفيذ
        this.busy = true;
        await delay(400);
        inv.status_override = 'void';
        inv.voided_at = SA.todayIso();
        inv.void_reason = reasonText(this.voidForm.reason, (this.voidForm.note || '').trim());
        inv.void_reason_code = this.voidForm.reason;
        inv.voided_by = CURRENT_USER;
        this.busy = false;
        this.closeModal();
        const msg = this.tf('pb.toastVoided', { number: inv.invoice_number });
        this.toast(msg); this.announce(msg);
        return true;
      },

      /* ---------- الاسترداد: جزئي أو كلي ≤ القابل للاسترداد، مع سبب وسجل refunds[] ---------- */
      refundTargetId: null, refundForm: { amount: '', reason: '', note: '' },
      get refundTarget() { return this.payRow(this.paymentById(this.refundTargetId)); },
      canRefund(p) { return !!p && SA.refundableOf(p) > 0; },
      openRefundModal(p) {
        const pay = this.paymentById(p.id);
        if (!this.canRefund(pay)) return false;
        this.refundTargetId = pay.id;
        this.refundForm = { amount: String(SA.m.toMajor(SA.refundableOf(pay))), reason: '', note: '' };
        this.openModal('refund');
        return true;
      },
      get refundErrors() {
        const p = this.paymentById(this.refundTargetId), f = this.refundForm;
        const e = this.reasonErrors(f);
        const amt = Number(f.amount), minor = SA.m.toMinor(f.amount);
        if (f.amount === '' || f.amount === null || !Number.isFinite(amt) || minor <= 0) e.amount = this.t('pb.errAmountPos');
        else if (p && minor > SA.refundableOf(p)) e.amount = this.tf('pb.errRefundMax', { max: this.money(SA.refundableOf(p)) });
        return e;
      },
      get refundImpact() {
        const p = this.paymentById(this.refundTargetId);
        if (!p) return '';
        const minor = SA.m.toMinor(this.refundForm.amount), refundable = SA.refundableOf(p);
        if (!(minor > 0) || minor > refundable) return '';
        const inv = this.invoiceById(p.invoice_id);
        // محاكاة الحالة بعد الاسترداد لعرض الأثر بدقة
        const sim = this.paymentsLog.map(x => (x.id === p.id ? Object.assign({}, x, { refunds: (x.refunds || []).concat([{ amount: minor }]) }) : x));
        const after = inv ? SA.invoiceState(inv, sim).status : '';
        const number = inv ? inv.invoice_number : '—';
        if (after === 'refunded') return this.tf('pb.refundImpactFull', { amount: this.money(minor), number });
        return this.tf('pb.refundImpactPartial', { amount: this.money(minor), refundable: this.money(refundable), number, status: after ? this.invStatusLabel(after) : '—' });
      },
      async confirmRefund() {
        if (this.busy) return false;
        this.submitted = true;
        const p = this.paymentById(this.refundTargetId);
        const errs = this.refundErrors;
        if (!p || Object.keys(errs).length) { this.announce(this.tf('pb.fixErrors', { msg: Object.values(errs).join(' ') })); return false; }
        this.busy = true;
        await delay(400);
        const amount = SA.m.toMinor(this.refundForm.amount);
        if (amount > SA.refundableOf(p)) { this.busy = false; return false; }
        const maxId = this.paymentsLog.flatMap(x => x.refunds || []).reduce((m, r) => Math.max(m, parseInt(String(r.id).replace(/\D/g, ''), 10) || 0), 300);
        p.refunds = (p.refunds || []).concat([{
          id: 'R-' + (maxId + 1), amount, reason: reasonText(this.refundForm.reason, (this.refundForm.note || '').trim()),
          reason_code: this.refundForm.reason, by: CURRENT_USER, at: SA.todayIso(),
        }]);
        this.busy = false;
        this.closeModal();
        const msg = this.tf('pb.toastRefunded', { amount: this.money(amount), ref: p.transaction_reference });
        this.toast(msg); this.announce(msg);
        return true;
      },

      /* ---------- الطباعة (فاتورة ضريبية: مورّد + رقم ضريبي توضيحي + مجموع/ضريبة/إجمالي) ---------- */
      PLATFORM_VAT_NO: '3XXXXXXXXXXXXX3',
      printTargetId: null,
      get printTarget() { return this.invRow(this.invoiceById(this.printTargetId)); },
      printInvoice(inv) {
        this.printTargetId = inv.id;
        this.$nextTick(() => window.print());
      },

      /* ---------- SweetAlert2 (نص فقط — لا HTML) ---------- */
      toast(text, icon = 'success') {
        if (!window.Swal) return;
        Swal.mixin({
          toast: true, position: this.locale === 'ar' ? 'top-start' : 'top-end',
          showConfirmButton: false, timer: 3200, timerProgressBar: true,
          customClass: { popup: 'firob-swal firob-toast' },
          didOpen: (popup) => popup.setAttribute('dir', this.locale === 'ar' ? 'rtl' : 'ltr'),
        }).fire({ icon, titleText: text });
      },
      info(title, text) {
        if (!window.Swal) return;
        Swal.fire({
          icon: 'info', titleText: title, text, confirmButtonText: this.t('pb.ok'),
          customClass: { popup: 'firob-swal', confirmButton: 'btn btn-primary' }, buttonsStyling: false,
          didOpen: (popup) => popup.setAttribute('dir', this.locale === 'ar' ? 'rtl' : 'ltr'),
        });
      },

      /* ---------- عامة ---------- */
      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        wideMQ.addEventListener('change', (m) => { this.wide = m.matches; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        window.addEventListener('afterprint', () => { this.printTargetId = null; });
        document.title = this.t('pb.title') + ' — FirOb';
        let timer = null;
        this.$watch('filterSig', () => { clearTimeout(timer); timer = setTimeout(() => this.onFiltersChanged(), 350); });
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      /* Escape على مستوى النافذة يغلق القوائم فقط؛ كل نافذة تُغلق نفسها بـ @keydown.escape.stop */
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },
    };
  }
</script>
