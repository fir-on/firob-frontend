        { ar: 'تم تجاوز حد الطلبات المسموح للمؤسسة خلال الدقيقة الحالية', en: 'Tenant exceeded its allowed request rate for the current minute' },
        { ar: 'تم الوصول إلى الحد الأقصى لباقة الاشتراك الشهرية من التوكنز', en: 'Monthly subscription token quota has been reached' },
      ],
    };
    const PAYLOAD_SAMPLES = {
      question_generation: {
        system: 'You are FirOb\'s question-generation assistant. Produce curriculum-aligned multiple-choice questions with 4 options and one correct answer.',
        user: 'Generate 10 multiple-choice questions for grade 5 on the topic "Decimal Fractions", medium difficulty.',
        response: '1. What is 0.25 + 0.50?\nA) 0.65  B) 0.75  C) 0.85  D) 1.00\nCorrect: B\n2. Which decimal is equivalent to 3/4?\n...',
      },
      lesson_planner: {
        system: 'You are FirOb\'s lesson-planning assistant. Produce a structured 45-minute lesson plan with objectives, activities, and assessment.',
        user: 'Plan a 45-minute lesson on "Photosynthesis" for grade 7 science, including a hands-on activity.',
        response: 'Objective: Students explain the process of photosynthesis...\nWarm-up (5m): ...\nDirect instruction (15m): ...\nActivity (15m): ...\nAssessment (10m): ...',
      },
      auto_grading: {
        system: 'You are FirOb\'s auto-grading assistant. Score the student answer against the provided rubric and return a score with feedback.',
        user: 'Rubric: max 10 points. Student answer: "Photosynthesis is how plants make food using sunlight, water and CO2."',
        response: '{"score": 8, "feedback": "Correct core concept. Missing mention of chlorophyll/oxygen release for full marks."}',
      },
      ai_tutor: {
        system: 'You are FirOb\'s AI tutor. Answer student questions clearly, encouraging step-by-step understanding.',
        user: 'Can you explain why the sky is blue in simple terms?',
        response: 'Great question! Sunlight looks white but is made of many colors. When it hits our atmosphere, blue light scatters more than other colors because...',
      },
    };

    /* ================= مولّد ثابت البذرة (mulberry32) ================= */
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const weighted = (arr, r, w = (a) => a.weight) => {
      const total = arr.reduce((s, a) => s + w(a), 0);
      let x = r * total;
      for (const a of arr) { if ((x -= w(a)) <= 0) return a; }
      return arr[arr.length - 1];
    };

    /* المؤسسات المولِّدة للسجلات: من SA — الوزن = جذر استهلاك الاشتراك الحالي؛ المنتهية/الموقوفة لا تستهلك */
    const TENANT_POOL = SA.TENANTS.map(tn => {
      const sub = SA.currentSubscription(tn.id);
      const active = !!sub && !['expired', 'paused'].includes(sub.status);
      const since = [tn.created_at, sub ? sub.starts_at : tn.created_at].sort()[1];
      return { tn, since, weight: active ? Math.sqrt(sub.usage?.aiTokensUsed || 0) : 0 };
    }).filter(p => p.weight > 0);

    /* يولّد سجلات DATA_DAYS يومًا حتى «now» — عدد السحبات ثابت لكل سجل، فالنتيجة حتمية لنفس اليوم */
    function generateLogs(now) {
      now = now || new Date();
      const rnd = mulberry32(SEED);
      const todayIso = SA.isoLocal(now);
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const logs = [];
      let id = 1;
      for (let d = 0; d < DATA_DAYS; d++) {
        const dayIso = SA.addDays(-d, todayIso);
        const count = (d < 7 ? 6 : 2) + Math.floor(rnd() * 6);
        const pool = TENANT_POOL.filter(p => p.since <= dayIso);
        for (let i = 0; i < count; i++) {
          const r = Array.from({ length: 12 }, rnd);   // 12 سحبة ثابتة لكل سجل
          const p = (r[0] < 0.92 && pool.length) ? weighted(pool, r[1]) : null;
          const tn = p ? p.tn : null;
          const model = weighted(MODELS, r[2]);
          const feature = weighted(FEATURES, r[3]);
          const status = r[4] < 0.93 ? 'success' : (r[4] < 0.97 ? 'rate_limited' : 'failed');
          const baseP = feature.key === 'auto_grading' ? [400, 3800] : feature.key === 'ai_tutor' ? [80, 900] : [200, 2400];
          const baseC = feature.key === 'lesson_planner' ? [300, 2000] : feature.key === 'auto_grading' ? [40, 260] : [80, 1400];
          let prompt = 0, completion = 0, ms;
          if (status === 'success') {
            prompt = Math.floor(baseP[0] + r[5] * (baseP[1] - baseP[0]));
            completion = Math.floor(baseC[0] + r[6] * (baseC[1] - baseC[0]));
            ms = Math.floor(280 + r[7] * 3500);
          } else if (status === 'rate_limited') {
            ms = Math.floor(40 + r[7] * 200);
          } else {
            prompt = Math.floor(baseP[0] + r[5] * (baseP[1] - baseP[0]));
            ms = Math.floor(150 + r[7] * 5800);
          }
          // الفاشل يُحتسب عليه الإدخال المُرسل فقط؛ تجاوز الحد لا يُرسَل فلا تكلفة
          const cost = Math.round((prompt * model.inRate + completion * model.outRate) / 1e6);
          const maxMin = d === 0 ? Math.max(0, nowMin - 1) : 1439;
          const minute = Math.floor(r[8] * (maxMin + 1));
          const dt = SA.parseLocal(dayIso);
          dt.setHours(Math.floor(minute / 60), minute % 60, Math.floor(r[9] * 60), 0);
          const ts = Math.min(dt.getTime(), now.getTime());
          const errList = status !== 'success' ? ERRORS[status] : null;
          logs.push({
            id: 8400000 + id++,
            tenant_id: tn ? tn.id : null,
            user_name: tn ? tn.contact.name : null, user_email: tn ? tn.contact.email : null,
            model: model.key, feature: feature.key,
            prompt_tokens: prompt, completion_tokens: completion, total_tokens: prompt + completion,
            cost, response_time_ms: ms, status,
            error: errList ? errList[Math.floor(r[10] * errList.length)] : null,
            ts, day: SA.isoLocal(new Date(ts)),
            hay: [tn ? tn.name.ar : '', tn ? tn.name.en : '', tn ? tn.domain : '', tn ? tn.contact.name.ar : '', tn ? tn.contact.name.en : '',
                  model.label, model.key, feature.ar, feature.en, String(8400000 + id - 1)].join(' ').toLowerCase(),
          });
        }
      }
      logs.sort((a, b) => b.ts - a.ts);
      return logs;
    }

    /* تجميع واحد يغذّي المؤشرات والرسوم والجداول — كل الأرقام من نفس الصفوف */
    function aggregate(rows, from, to) {
      const days = [];
      for (let d = from; d <= to; d = SA.addDays(1, d)) days.push(d);
      const dayIdx = Object.fromEntries(days.map((d, i) => [d, i]));
      const series = MODELS.map(m => ({ key: m.key, values: days.map(() => 0) }));
      const models = MODELS.map(m => ({ key: m.key, calls: 0, tokens: 0, cost: 0 }));
      const features = FEATURES.map(f => ({ key: f.key, calls: 0, tokens: 0 }));
      const byTenant = new Map();
      let totalTokens = 0, promptTokens = 0, totalCost = 0, success = 0, msSum = 0;
      for (const l of rows) {
        const mi = MODELS.findIndex(m => m.key === l.model);
        const fi = FEATURES.findIndex(f => f.key === l.feature);
        const di = dayIdx[l.day];
        if (di !== undefined) series[mi].values[di] += l.total_tokens;
        models[mi].calls++; models[mi].tokens += l.total_tokens; models[mi].cost += l.cost;
        features[fi].calls++; features[fi].tokens += l.total_tokens;
        const tk = l.tenant_id || '_system';
        const b = byTenant.get(tk) || { key: tk, tokens: 0, cost: 0, calls: 0 };
        b.tokens += l.total_tokens; b.cost += l.cost; b.calls++;
        byTenant.set(tk, b);
        totalTokens += l.total_tokens; promptTokens += l.prompt_tokens; totalCost += l.cost;
        if (l.status === 'success') success++;
        msSum += l.response_time_ms;
      }
      const totals = days.map((_, i) => series.reduce((s, x) => s + x.values[i], 0));
      // أعلى 5 مؤسسات + «أخرى» (تشمل مهام النظام) — مجموعها = إجمالي التوكنز
      const ranked = [...byTenant.values()].filter(b => b.key !== '_system').sort((a, b) => b.tokens - a.tokens || a.key.localeCompare(b.key));
      const top = ranked.slice(0, 5);
      const rest = [...ranked.slice(5), ...(byTenant.has('_system') ? [byTenant.get('_system')] : [])];
      const tenants = top.slice();
      if (rest.length) tenants.push(rest.reduce((o, b) => ({ key: '_others', tokens: o.tokens + b.tokens, cost: o.cost + b.cost, calls: o.calls + b.calls }), { key: '_others', tokens: 0, cost: 0, calls: 0 }));
      const calls = rows.length;
      const promptPct = totalTokens ? Math.round(promptTokens / totalTokens * 100) : 0;
      const successPct = calls ? Math.round(success / calls * 100) : 0;
      return {
        rows, from, to,
        trend: { days, series, totals },
        models, features, tenants,
        kpis: {
          totalTokens, promptTokens, completionTokens: totalTokens - promptTokens,
          promptPct, completionPct: totalTokens ? 100 - promptPct : 0,
          totalCost, avgCostPerCall: calls ? Math.round(totalCost / calls) : 0,
          totalCalls: calls, successCount: success, errorCount: calls - success,
          successPct, errorPct: calls ? 100 - successPct : 0,
          avgResponseMs: calls ? Math.round(msSum / calls) : 0,
        },
      };
    }

    /* هروب نص SVG (أسماء المؤسسات تدخل في x-html) */
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const DEFAULT_FILTERS = () => ({ query: '', tenant: 'all', model: 'all', feature: 'all', status: 'all', dateRange: 'last30', customFrom: '', customTo: '' });

    return {
      /* ---------- حالة عامة (Shell) ---------- */
      dark: document.documentElement.classList.contains('dark'),
      locale: document.documentElement.lang === 'en' ? 'en' : 'ar',
      mobile: !desktopMQ.matches,
      wide: wideMQ.matches,
      mobileNav: false,
      collapsed: false,
      notifOpen: false, profileOpen: false, exportOpen: false,
      active: 'aiAnalytics',
      drawerOpen: false,
      selectedLog: null,
      _opener: null,
      liveMsg: '',

      t(path) {
        const dict = I18N[this.locale];
        const v = path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), dict);
        return typeof v === 'string' ? v : path;
      },
      tf(path, vars) {
        let s = this.t(path);
        Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
        return s;
      },
      setLocale(loc) {
        this.locale = loc;
        document.documentElement.lang = loc;
        document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
        document.title = this.t('ai.docTitle');
        try { localStorage.setItem('firob-locale', loc); } catch (e) {}
      },
      toggleLocale() { this.setLocale(this.locale === 'ar' ? 'en' : 'ar'); },

      get expanded() { return this.mobile || !this.collapsed; },

      nav: [
        { group: 'overview', items: [
          { key: 'dashboard', icon: 'fa-solid fa-gauge-high', href: 'overview.html' },
          { key: 'aiAnalytics', icon: 'fa-solid fa-robot', href: 'ai-analytics.html' },
        ]},
        { group: 'admin', items: [
          { key: 'tenants', icon: 'fa-solid fa-building-columns', href: 'tenants.html' },
          { key: 'plans', icon: 'fa-solid fa-cubes', href: 'plans.html' },
          { key: 'subscriptions', icon: 'fa-solid fa-layer-group', href: 'subscriptions.html' },
          { key: 'payments', icon: 'fa-solid fa-file-invoice-dollar', href: 'payments.html' },
        ]},
        { group: 'system', items: [
          { key: 'activityLog', icon: 'fa-solid fa-clock-rotate-left', href: 'activity-log.html' },
          { key: 'systemSettings', icon: 'fa-solid fa-sliders', href: 'system-settings.html' },
        ]},
      ],

      notifications: [
        { id: 1, key: 'upload', mins: 5, read: false, icon: 'fa-solid fa-upload', tone: 'bg-primary-500/15 text-brand' },
        { id: 2, key: 'quota', mins: 60, read: false, icon: 'fa-solid fa-triangle-exclamation', tone: 'bg-warning-500/15 text-warning-700 dark:text-warning-500' },
        { id: 3, key: 'backup', mins: 360, read: true, icon: 'fa-solid fa-database', tone: 'bg-success-500/15 text-success-700 dark:text-success-500' },
      ],
      get unread() { return this.notifications.filter(n => !n.read).length; },
      relTime(mins) {
        const rtf = new Intl.RelativeTimeFormat(SA.fmtLocale(this.locale), { numeric: 'auto' });
        return mins < 60 ? rtf.format(-mins, 'minute') : rtf.format(-Math.round(mins / 60), 'hour');
      },

      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        wideMQ.addEventListener('change', (m) => { this.wide = m.matches; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        document.title = this.t('ai.docTitle');
        this.todayIso = SA.todayIso();
        this.dataStart = SA.addDays(-(DATA_DAYS - 1), this.todayIso);
        this._rawLogs = generateLogs(new Date());
        this.recompute();
        this.$watch(() => JSON.stringify(this.filters), () => this.queueRecompute());
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      /* Escape على مستوى النافذة لا يغلق الدرج — الدرج يعالج Escape بنفسه (.stop) */
      closeAll() {
        const hadExport = this.exportOpen;
        this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; this.exportOpen = false;
        if (hadExport) this.$refs.exportBtn?.focus();
      },

      /* ================= LND-09 ================= */
      MODELS, FEATURES,
      _rawLogs: [],
      todayIso: '', dataStart: '',
      visibleCount: PAGE,
      sortKey: 'ts', sortDir: 'desc',
      modelVisible: MODELS.map(() => true),
      statusOptions: ['all', 'success', 'failed', 'rate_limited'],
      filters: DEFAULT_FILTERS(),
      applied: { from: '', to: '', tenant: 'all' },
      rangeError: '',
      view: aggregate([], SA.todayIso(), SA.todayIso()),
      updating: false,
      _timer: null,
      _recomputes: 0,

      /* ---------- تنسيق (Intl حسب اللغة) ---------- */
      get loc() { return SA.fmtLocale(this.locale); },
      fmtNum(n) { return SA.fmtNum(n, this.locale); },
      fmtTok(n) { return new Intl.NumberFormat(this.loc, { notation: 'compact', maximumFractionDigits: 1 }).format(n || 0); },
      fmtPct(r) { return new Intl.NumberFormat(this.loc, { style: 'percent', maximumFractionDigits: 1 }).format(r || 0); },
      fmtMs(n) { return new Intl.NumberFormat(this.loc, { style: 'unit', unit: 'millisecond', unitDisplay: 'short' }).format(n || 0); },
      money(minor) { return SA.money(minor, this.locale); },
      fmtDay(iso) { return iso ? SA.fmtDate(iso, this.locale) : '—'; },
      fmtDayShort(iso) { return SA.fmtDate(iso, this.locale, { day: 'numeric', month: 'short' }); },
      fmtDateTime(ts, seconds) {
        return new Intl.DateTimeFormat(this.loc, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: seconds ? '2-digit' : undefined }).format(new Date(ts));
      },

      /* ---------- الفترة الزمنية: شاملة لليومين، من ≤ إلى، بلا مستقبل ---------- */
      setDateRange(v) {
        if (v === 'custom' && (!this.filters.customFrom || !this.filters.customTo)) {
          this.filters.customFrom = this.applied.from || SA.addDays(-29, this.todayIso);
          this.filters.customTo = this.applied.to || this.todayIso;
        }
        this.filters.dateRange = v;
      },
      resolveRange(f) {
        f = f || this.filters;
        const today = this.todayIso || SA.todayIso();
        switch (f.dateRange) {
          case 'today': return { from: today, to: today };
          case 'last7': return { from: SA.addDays(-6, today), to: today };
          case 'month': return { from: today.slice(0, 8) + '01', to: today };
          case 'last90': return { from: SA.addDays(-(DATA_DAYS - 1), today), to: today };
          case 'custom': {
            const a = f.customFrom, b = f.customTo;
            if (!a || !b) return { error: 'ai.errors.rangeRequired' };
            if (a > b) return { error: 'ai.errors.rangeOrder' };
            if (b > today) return { error: 'ai.errors.rangeFuture' };
            if (a < SA.addDays(-(DATA_DAYS - 1), today)) return { error: 'ai.errors.rangeTooOld' };
            return { from: a, to: b };
          }
          default: return { from: SA.addDays(-29, today), to: today };
        }
      },
      /* فلترة نقية: نفس الدالة للمؤشرات والرسوم والجدول والتصدير */
      filterRows(rows, f, range) {
        const start = SA.startOfDay(range.from).getTime(), end = SA.endOfDay(range.to).getTime();
        const q = (f.query || '').trim().toLowerCase();
        return rows.filter(l =>
          l.ts >= start && l.ts <= end &&
          (f.tenant === 'all' || l.tenant_id === f.tenant) &&
          (f.model === 'all' || l.model === f.model) &&
          (f.feature === 'all' || l.feature === f.feature) &&
          (f.status === 'all' || l.status === f.status) &&
          (!q || l.hay.includes(q)));
      },
      queueRecompute() {
        clearTimeout(this._timer);
        this.updating = true;
        this._timer = setTimeout(() => { this._timer = null; this.recompute(); }, DEBOUNCE_MS);
      },
      recompute() {
        this._recomputes++;
        this.updating = false;
        const r = this.resolveRange();
        if (r.error) {        // تبقى آخر نتيجة صالحة معروضة
          this.rangeError = r.error;
          this.liveMsg = this.tf('ai.live.rangeInvalid', { msg: this.t(r.error) });
          return;
        }
        this.rangeError = '';
        this.applied = { from: r.from, to: r.to, tenant: this.filters.tenant };
        this.view = aggregate(this.filterRows(this._rawLogs, this.filters, r), r.from, r.to);
        this.visibleCount = PAGE;
        const k = this.view.kpis;
        this.liveMsg = this.tf('ai.live.updated', { n: this.fmtNum(k.totalCalls), tokens: this.fmtTok(k.totalTokens), cost: this.money(k.totalCost) });
      },
      get kpis() { return this.view.kpis; },
      get hasActiveFilters() { return JSON.stringify(this.filters) !== JSON.stringify(DEFAULT_FILTERS()); },
      clearFilters() { this.filters = DEFAULT_FILTERS(); },

      /* ---------- الجدول ---------- */
      get sortedLogs() {
        const rows = [...this.view.rows];
        const key = this.sortKey, dir = this.sortDir === 'asc' ? 1 : -1;
        rows.sort((a, b) => (a[key] - b[key]) * dir || (b.ts - a.ts));
        return rows;
      },
      get visibleLogs() { return this.sortedLogs.slice(0, this.visibleCount); },
      loadMore() {
        this.visibleCount += PAGE;
        this.liveMsg = this.tf('ai.table.showingCount', { n: this.fmtNum(this.visibleLogs.length), total: this.fmtNum(this.view.rows.length) });
      },
      sortBy(key) {
        if (this.sortKey === key) this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
        else { this.sortKey = key; this.sortDir = 'desc'; }
      },
      ariaSort(key) { return this.sortKey === key ? (this.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'; },
      sortIcon(key) { if (this.sortKey !== key) return 'fa-sort text-muted'; return this.sortDir === 'asc' ? 'fa-sort-up text-brand' : 'fa-sort-down text-brand'; },
      inspectLabel(log) { return this.tf('ai.table.inspectRow', { id: log.id, t: this.tenantName(log) }); },

      /* ---------- تسميات ---------- */
      tenantName(l) { const tn = l.tenant_id ? SA.tenant(l.tenant_id) : null; return tn ? tn.name[this.locale] : this.t('ai.systemWide'); },
      tenantDomain(l) { const tn = l.tenant_id ? SA.tenant(l.tenant_id) : null; return tn ? tn.domain : '—'; },
      userName(l) { return l.user_name ? l.user_name[this.locale] : this.t('ai.automatedJob'); },
      errorText(l) { return l.error ? l.error[this.locale] : ''; },
      modelLabel(key) { const m = MODELS.find(x => x.key === key); return m ? m.label : key; },
      featureLabel(key) { const f = FEATURES.find(x => x.key === key); return f ? f[this.locale] : key; },
      bucketLabel(key) { return key === '_others' ? this.t('ai.charts.others') : (SA.tenant(key)?.name[this.locale] || key); },
      tenantOptions() { return [{ value: 'all', label: this.t('ai.toolbar.tenantAll') }, ...SA.TENANTS.map(tn => ({ value: tn.id, label: tn.name[this.locale] }))]; },
      modelOptions() { return [{ value: 'all', label: this.t('ai.toolbar.modelAll') }, ...MODELS.map(m => ({ value: m.key, label: m.label }))]; },
      featureOptions() { return [{ value: 'all', label: this.t('ai.toolbar.featureAll') }, ...FEATURES.map(f => ({ value: f.key, label: f[this.locale] }))]; },
      dateOptions() { return ['today', 'last7', 'last30', 'month', 'last90', 'custom'].map(v => ({ value: v, label: this.t('ai.toolbar.dateRange.' + v) })); },

      /* ---------- ألوان وهوية بصرية ---------- */
      seriesColor(idx) { const s = SLOTS[this.dark ? 'dark' : 'light']; return s[idx % s.length]; },
      modelBadgeClass(key) {
        const idx = MODELS.findIndex(x => x.key === key);
        const map = ['bg-[#2a78d6]/15 text-[#1c5cab] dark:text-[#86b6ef]', 'bg-[#c4501f]/15 text-[#a3421a] dark:text-[#f0946a]', 'bg-[#12805a]/15 text-[#0e6b4b] dark:text-[#5cd1a6]', 'bg-[#9a6200]/15 text-[#7a4e00] dark:text-[#f0c060]', 'bg-[#7c3aed]/15 text-[#6d28d9] dark:text-[#c4b5fd]'];
        return map[idx] || 'badge-muted';
      },
      statusBadgeClass(s) { return s === 'success' ? 'badge-success' : s === 'failed' ? 'badge-danger' : 'badge-warning'; },
      statusIcon(s) { return s === 'success' ? 'fa-solid fa-circle-check' : s === 'failed' ? 'fa-solid fa-circle-xmark' : s === 'rate_limited' ? 'fa-solid fa-hourglass-half' : 'fa-solid fa-layer-group'; },
      get hiddenModels() { return this.modelVisible.some(v => !v); },
      toggleModelSeries(i) { this.modelVisible[i] = !this.modelVisible[i]; },

      /* ---------- رسوم SVG وصولية (role=img + title/desc عبر aria-labelledby) ---------- */
      get rtl() { return this.locale === 'ar'; },
      txtStyle(size, weight) { return 'fill:rgb(var(--muted));font-size:' + (size || 11) + 'px;font-weight:' + (weight || 600) + ';font-family:inherit'; },
      svgOpen(id, w, h, title, desc) {
        return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" role="img" direction="ltr" aria-labelledby="' + id + '-t ' + id + '-d" class="block h-auto w-full overflow-visible">' +
          '<title id="' + id + '-t">' + esc(title) + '</title><desc id="' + id + '-d">' + esc(desc) + '</desc>';
      },
      niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; },

      trendDesc() {
        const tr = this.view.trend;
        let peakI = 0; tr.totals.forEach((v, i) => { if (v > tr.totals[peakI]) peakI = i; });
        return this.tf('ai.charts.trendDesc', {
          days: this.fmtNum(tr.days.length), from: this.fmtDay(this.view.from), to: this.fmtDay(this.view.to),
          total: this.fmtNum(this.kpis.totalTokens), peakDay: tr.days.length ? this.fmtDay(tr.days[peakI]) : '—', peak: this.fmtNum(tr.totals[peakI] || 0),
        });
      },
      get trendSvg() {
        const W = 640, H = 250, top = 12, bottom = 30, axisW = 52, edge = 14;
        const tr = this.view.trend, n = tr.days.length;
        const left = this.rtl ? edge : axisW, right = this.rtl ? W - axisW : W - edge;
        const plotH = H - top - bottom, step = n > 1 ? (right - left) / (n - 1) : 0;
        const x = (i) => n === 1 ? (left + right) / 2 : (this.rtl ? right - i * step : left + i * step);
        const visible = tr.series.filter((s, i) => this.modelVisible[i]);
        const max = this.niceMax(Math.max(0, ...visible.flatMap(s => s.values)));
        const y = (v) => top + plotH - (v / max) * plotH;
        let out = this.svgOpen('ai-trend-svg', W, H, this.t('ai.charts.trendTitle'), this.trendDesc());
        for (let g = 0; g <= 4; g++) {
          const v = max * g / 4, yy = y(v).toFixed(1);
          out += '<line x1="' + left + '" x2="' + right + '" y1="' + yy + '" y2="' + yy + '" style="stroke:rgb(var(--line))" stroke-width="1"/>';
          out += '<text x="' + (this.rtl ? right + 6 : left - 6) + '" y="' + yy + '" dy="4" text-anchor="' + (this.rtl ? 'start' : 'end') + '" style="' + this.txtStyle(10) + '">' + esc(this.fmtTok(v)) + '</text>';
        }
        const every = Math.max(1, Math.ceil(n / 6));
        tr.days.forEach((d, i) => {
          if (i % every && i !== n - 1) return;
          out += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" style="' + this.txtStyle(10) + '">' + esc(this.fmtDayShort(d)) + '</text>';
        });
        tr.series.forEach((s, si) => {
          if (!this.modelVisible[si]) return;
          const color = this.seriesColor(si), label = this.modelLabel(s.key);
          if (n > 1) out += '<polyline fill="none" stroke="' + color + '" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" points="' + s.values.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ') + '"/>';
          if (n <= 31) s.values.forEach((v, i) => {
            out += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="3" fill="' + color + '" style="stroke:rgb(var(--card))" stroke-width="1"><title>' + esc(label + ' · ' + this.fmtDay(tr.days[i]) + ': ' + this.fmtNum(v)) + '</title></circle>';
          });
        });
        return out + '</svg>';
      },
      get modelSvg() {
        const S = 200, c = 100, R = 72, C = 2 * Math.PI * R, total = this.kpis.totalCalls || 1;
        const items = this.view.models.map(m => this.modelLabel(m.key) + ' ' + this.fmtNum(m.calls) + ' (' + this.fmtPct(m.calls / total) + ')').join('، ');
        let out = this.svgOpen('ai-model-svg', S, S, this.t('ai.charts.modelTitle'), this.tf('ai.charts.listDesc', { items }));
        out += '<circle cx="' + c + '" cy="' + c + '" r="' + R + '" fill="none" style="stroke:rgb(var(--line))" stroke-width="26"/>';
        let off = 0;
        this.view.models.forEach((m, i) => {
          if (!m.calls) return;
          const len = m.calls / total * C;
          out += '<circle cx="' + c + '" cy="' + c + '" r="' + R + '" fill="none" stroke="' + this.seriesColor(i) + '" stroke-width="26" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 ' + c + ' ' + c + ')"><title>' + esc(this.modelLabel(m.key) + ': ' + this.fmtNum(m.calls) + ' (' + this.fmtPct(m.calls / total) + ')') + '</title></circle>';
          off += len;
        });
        out += '<text x="' + c + '" y="' + (c - 2) + '" text-anchor="middle" style="fill:rgb(var(--ink));font-size:26px;font-weight:800;font-family:inherit">' + esc(this.fmtTok(this.kpis.totalCalls)) + '</text>';
        out += '<text x="' + c + '" y="' + (c + 20) + '" text-anchor="middle" style="' + this.txtStyle(12) + '">' + esc(this.t('ai.charts.totalCalls')) + '</text>';
        return out + '</svg>';
      },
      /* أشرطة أفقية تبدأ من جهة البداية (يمين في العربية) */
      barsSvg(id, title, items, color) {
        const W = 420, rowH = 42, H = Math.max(rowH, items.length * rowH), valW = 64, maxW = W - valW;
        const max = Math.max(1, ...items.map(it => it.value));
        const desc = this.tf('ai.charts.listDesc', { items: items.map(it => it.label + ' ' + it.display).join('، ') });
        let out = this.svgOpen(id, W, H, title, desc);
        items.forEach((it, i) => {
          const y0 = i * rowH, w = Math.max(it.value ? 2 : 0, it.value / max * maxW);
          const bx = this.rtl ? W - w : 0;
          out += '<text x="' + (this.rtl ? W : 0) + '" y="' + (y0 + 13) + '" text-anchor="' + (this.rtl ? 'end' : 'start') + '" style="fill:rgb(var(--ink));font-size:12px;font-weight:700;font-family:inherit">' + esc(it.label) + '</text>';
          out += '<rect x="0" y="' + (y0 + 19) + '" width="' + maxW + '" height="14" rx="7" transform="translate(' + (this.rtl ? valW : 0) + ' 0)" style="fill:rgb(var(--line))"/>';
          out += '<rect x="' + bx.toFixed(1) + '" y="' + (y0 + 19) + '" width="' + w.toFixed(1) + '" height="14" rx="7" fill="' + color(i) + '"><title>' + esc(it.label + ': ' + it.display) + '</title></rect>';
          out += '<text x="' + (this.rtl ? W - maxW - 6 : maxW + 6) + '" y="' + (y0 + 30) + '" text-anchor="' + (this.rtl ? 'end' : 'start') + '" style="' + this.txtStyle(11, 700) + '">' + esc(it.display) + '</text>';
        });
        return out + '</svg>';
      },
      get tenantsSvg() {
        return this.barsSvg('ai-tenants-svg', this.t('ai.charts.tenantsTitle'),
          this.view.tenants.map(r => ({ label: this.bucketLabel(r.key), value: r.tokens, display: this.fmtNum(r.tokens) })),
          (i) => this.view.tenants[i].key === '_others' ? (this.dark ? '#7d93a3' : '#5a687d') : this.seriesColor(0));
      },
      get featureSvg() {
        return this.barsSvg('ai-feature-svg', this.t('ai.charts.featureTitle'),
          this.view.features.map(f => ({ label: this.featureLabel(f.key), value: f.calls, display: this.fmtNum(f.calls) })),
          (i) => this.seriesColor(i));
      },

      /* ---------- الحصص: استهلاك دورة الفوترة مقابل حد الباقة (null = غير محدودة) ---------- */
      quotaOf(tenantId) {
        const sub = SA.currentSubscription(tenantId);
        const plan = sub ? SA.plan(sub.plan_id) : null;
        const tn = SA.tenant(tenantId);
        if (!sub || !plan) return { id: tenantId, name: tn.name[this.locale], planName: null, used: null, quota: null, unlimited: false, pct: null, over: 0, state: 'none' };
        const raw = plan.ai_token_quota_monthly;
        const unlimited = raw === null || raw === undefined || raw < 0;
        const used = sub.usage && typeof sub.usage.aiTokensUsed === 'number' ? sub.usage.aiTokensUsed : null;
        const quota = unlimited ? null : raw;
        const pct = (!unlimited && quota > 0 && used !== null) ? used / quota : null;
        const state = unlimited ? 'unlimited' : pct === null ? 'ok' : pct > 1 ? 'over' : pct >= 0.9 ? 'near' : 'ok';
        return { id: tenantId, name: tn.name[this.locale], planName: plan.name[this.locale], used, quota, unlimited, pct, over: state === 'over' ? used - quota : 0, state };
      },
      get quotaRows() {
        const sel = this.applied.tenant;
        const rank = (q) => q.pct !== null ? q.pct : q.unlimited ? -1 : -2;
        return SA.TENANTS.filter(tn => sel === 'all' || tn.id === sel).map(tn => this.quotaOf(tn.id)).sort((a, b) => rank(b) - rank(a) || a.id.localeCompare(b.id));
      },
      get quotaSummary() {
        const limited = this.quotaRows.filter(q => q.pct !== null);
        const used = limited.reduce((s, q) => s + q.used, 0), quota = limited.reduce((s, q) => s + q.quota, 0);
        return { used, quota, pct: quota ? used / quota : null, unlimitedCount: this.quotaRows.filter(q => q.unlimited).length };
      },
      get quotaSummaryText() {
        const s = this.quotaSummary;
        return s.pct === null ? this.t('ai.quota.summaryNone') : this.tf('ai.quota.summary', { used: this.fmtTok(s.used), quota: this.fmtTok(s.quota), pct: this.fmtPct(s.pct) });
      },
      quotaLine(q) {
        if (q.state === 'none') return this.t('ai.quota.noSub');
        const used = q.used === null ? '—' : this.fmtNum(q.used);
        if (q.unlimited) return this.tf('ai.quota.lineUnlimited', { used });
        let s = this.tf('ai.quota.line', { used, quota: this.fmtNum(q.quota) }) + (q.pct !== null ? ' (' + this.fmtPct(q.pct) + ')' : '');
        if (q.state === 'over') s += ' — ' + this.tf('ai.quota.overBy', { v: this.fmtNum(q.over) });
        return s;
      },
      quotaBadgeClass(s) { return s === 'over' ? 'badge-danger' : s === 'near' ? 'badge-warning' : s === 'unlimited' ? 'badge-info' : s === 'none' ? 'badge-muted' : 'badge-success'; },
      quotaIcon(s) { return s === 'over' ? 'fa-solid fa-circle-exclamation' : s === 'near' ? 'fa-solid fa-triangle-exclamation' : s === 'unlimited' ? 'fa-solid fa-infinity' : s === 'none' ? 'fa-solid fa-minus' : 'fa-solid fa-circle-check'; },

      /* ---------- قائمة التصدير (لوحة مفاتيح) ---------- */
      menuItems() { return [...(this.$refs.exportMenu?.querySelectorAll('[role="menuitem"]') || [])]; },
      toggleExportMenu() {
        this.exportOpen = !this.exportOpen;
        if (this.exportOpen) this.$nextTick(() => this.menuItems()[0]?.focus());
      },
      onMenuKey(e) {
        if (!this.exportOpen) return;
        const items = this.menuItems(), i = items.indexOf(document.activeElement);
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = items.length; items[(i + (e.key === 'ArrowDown' ? 1 : -1) + n) % n]?.focus(); }
        else if (e.key === 'Home') { e.preventDefault(); items[0]?.focus(); }
        else if (e.key === 'End') { e.preventDefault(); items[items.length - 1]?.focus(); }
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); this.exportOpen = false; this.$refs.exportBtn?.focus(); }
        else if (e.key === 'Tab') { this.exportOpen = false; }
      },

      /* ---------- CSV حقيقي: BOM + اقتباس + تحييد الصيغ ---------- */
      csvCell(v) {
        if (v === null || v === undefined) return '';
        if (typeof v === 'number') return String(v);
        let s = String(v);
        if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;          // منع حقن الصيغ في Excel/Sheets
        if (/[",\r\n;]/.test(s) || /^\s|\s$/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
        return s;
      },
      buildCsv(rows) {
        const pad = (n) => String(n).padStart(2, '0');
        const stamp = (ts) => { const d = new Date(ts); return SA.isoLocal(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
        const head = ['request_id', 'timestamp_local', 'tenant_id', 'tenant', 'domain', 'user', 'model', 'feature', 'prompt_tokens', 'completion_tokens', 'total_tokens', 'cost_halalas', 'cost_sar', 'response_ms', 'status', 'error'];
        const lines = [head.join(',')];
        for (const l of rows) {
          lines.push([l.id, stamp(l.ts), l.tenant_id || '', this.tenantName(l), this.tenantDomain(l), this.userName(l), this.modelLabel(l.model), this.featureLabel(l.feature),
            l.prompt_tokens, l.completion_tokens, l.total_tokens, l.cost, SA.m.toMajor(l.cost), l.response_time_ms, this.t('ai.status.' + l.status), this.errorText(l)]
            .map(v => this.csvCell(v)).join(','));
        }
        return '﻿' + lines.join('\r\n') + '\r\n';
      },
      toast(icon, text) {
        if (!window.Swal) return;
        window.Swal.fire({ toast: true, position: 'top-end', icon, titleText: text, showConfirmButton: false, timer: 3000, customClass: { popup: 'firob-swal firob-toast' } });
      },
      exportReport(type) {
        this.exportOpen = false;
        this.$refs.exportBtn?.focus();
        if (type === 'pdf') {
          this.liveMsg = this.t('ai.toast.printing');
          this.toast('info', this.t('ai.toast.printing'));
          window.print?.();
          return;
        }
        const rows = this.sortedLogs;
        if (!rows.length) { this.liveMsg = this.t('ai.toast.exportEmpty'); this.toast('info', this.liveMsg); return null; }
        const csv = this.buildCsv(rows);
        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        const a = document.createElement('a');
        a.href = url; a.download = 'ai-usage_' + this.applied.from + '_' + this.applied.to + '.csv';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        this.liveMsg = this.tf('ai.toast.exportedCsv', { n: this.fmtNum(rows.length) });
        this.toast('success', this.liveMsg);
        return csv;
      },

      /* ---------- الدرج الجانبي ---------- */
      openDrawer(log, e) {
        this._opener = (e && e.currentTarget) || document.activeElement;
        this.selectedLog = log;
        this.drawerOpen = true;
      },
      closeDrawer() {
        this.drawerOpen = false;
        const el = this._opener; this._opener = null;
        this.$nextTick(() => el?.focus?.());
      },
      get drawerPromptPct() {
        if (!this.selectedLog || !this.selectedLog.total_tokens) return 50;
        return Math.round((this.selectedLog.prompt_tokens / this.selectedLog.total_tokens) * 100);
      },
      get payloadJson() {
        if (!this.selectedLog) return '';
        const l = this.selectedLog;
        return JSON.stringify({ request_id: l.id, model: l.model, feature: l.feature, status: l.status,
          usage: { prompt_tokens: l.prompt_tokens, completion_tokens: l.completion_tokens, total_tokens: l.total_tokens },
          payload: PAYLOAD_SAMPLES[l.feature] || {} }, null, 2);
      },
      async copyText(text) {
        try {
          if (!navigator.clipboard?.writeText) throw new Error('no clipboard');
          await navigator.clipboard.writeText(text);
          this.liveMsg = this.t('ai.drawer.copied'); this.toast('success', this.liveMsg); return true;
        } catch (e) {
          this.liveMsg = this.t('ai.drawer.copyFailed'); this.toast('error', this.liveMsg); return false;
        }
      },
      copyRequestId() { return this.selectedLog ? this.copyText(String(this.selectedLog.id)) : false; },
      copyPayloadJson() { return this.selectedLog ? this.copyText(this.payloadJson) : false; },

      /* للاختبارات */
      _generateLogs: generateLogs, _aggregate: aggregate, _mulberry32: mulberry32, _SA: SA,
    };
  }
</script>
