<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>تحليلات واستهلاك الذكاء الاصطناعي — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  { @apply bg-accent-500/25 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-warning { @apply bg-warning-500/15 text-warning-700 dark:text-warning-500; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-line-strong; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-2 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-4 py-2.5 text-start text-sm font-medium text-ink transition-colors hover:bg-soft; }
    .combo-option.is-active   { @apply bg-soft; }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }
    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- مقطع أزرار (Segmented control) ---------- */
    .seg { @apply inline-flex flex-wrap items-center gap-1 rounded-xl border border-line bg-card p-1; }
    .seg-btn { @apply inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-bold text-muted transition; }
    .seg-btn[aria-pressed="true"], .seg-btn[aria-selected="true"] { @apply bg-primary-500 text-white shadow; }

    /* ---------- بطاقات المؤشرات (KPI) ---------- */
    .kpi-track { @apply flex h-2 w-full overflow-hidden rounded-full bg-line; }

    /* ---------- بطاقة الرسم البياني ---------- */
    .chart-card { @apply panel flex flex-col p-4 sm:p-5; }
    .chart-box  { @apply relative w-full flex-1; }

    /* ---------- شارات النماذج / السياقات (ألوان ثابتة حسب الهوية) ---------- */
    .swatch { @apply inline-block h-2.5 w-2.5 shrink-0 rounded-full; }

    /* ---------- اللوحة المنبثقة الجانبية (Slide-over Drawer) ---------- */
    .drawer-panel { @apply absolute inset-y-0 flex w-full max-w-xl flex-col border-line bg-card shadow-pop; inset-inline-end: 0; border-inline-start-width: 1px; }
    .code-block { @apply max-h-[50dvh] overflow-auto rounded-xl border border-line bg-page/60 p-3.5 font-mono text-[11px] leading-6 text-ink; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }
</style>

<body x-data="aiAnalyticsData()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch.focus(); }"
      :class="{ 'overflow-hidden': (mobileNav && mobile) || drawerOpen }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:sticky lg:top-0 lg:h-[100dvh] lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <a href="overview.html" class="inline-flex min-w-0 flex-1 items-center gap-3 rounded-lg focus-visible:ring-2" :class="!expanded && 'lg:flex-none lg:justify-center'" :aria-label="t('appTitle')">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </a>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-line-strong" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="item.count && expanded"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent" x-text="item.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="flex min-w-0 flex-1 flex-col">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-line-strong" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-line-strong focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd dir="ltr" aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex">Ctrl K</kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">
          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-haspopup="true" :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>

                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="t('notif.' + n.key)"></p>
                      <p class="text-xs text-muted" x-text="relTime(n.mins)"></p>
                    </div>
                  </li>
                </template>
              </ul>

              <li class="flex items-center gap-2">
                <span class="swatch" :style="'background:' + seriesColor(i)" aria-hidden="true"></span>
                <span class="min-w-0 flex-1 truncate font-bold" x-text="modelLabel(m.key)"></span>

          </div>
          <details class="mt-3 rounded-xl border border-line">

            <div class="overflow-x-auto border-t border-line">
              <table class="w-full text-xs">
                <caption class="sr-only" x-text="t('ai.charts.modelTitle')"></caption>
                <thead class="text-muted"><tr>
                  <th scope="col" class="px-3 py-2 text-start font-extrabold" x-text="t('ai.charts.colModel')"></th>
                  <th scope="col" class="px-3 py-2 text-end font-extrabold" x-text="t('ai.charts.colCalls')"></th>
                  <th scope="col" class="px-3 py-2 text-end font-extrabold" x-text="t('ai.charts.colShare')"></th>
                  <th scope="col" class="px-3 py-2 text-end font-extrabold" x-text="t('ai.charts.colCost')"></th>
                </tr></thead>
                <tbody class="divide-y divide-line">
                  <template x-for="m in view.models" :key="'mt-' + m.key">
                    <tr>
                      <th scope="row" class="whitespace-nowrap px-3 py-1.5 text-start font-bold" x-text="modelLabel(m.key)"></th>
                      <td class="px-3 py-1.5 text-end tabular-nums" x-text="fmtNum(m.calls)"></td>

                      <td class="whitespace-nowrap px-3 py-1.5 text-end tabular-nums" x-text="money(m.cost)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </details>
        </div>

        <!-- أكثر المؤسسات استهلاكًا (ضمن الفترة المفلترة) -->
        <div class="chart-card" style="min-height:22rem">

            <div class="overflow-x-auto border-t border-line">
              <table class="w-full text-xs">
                <caption class="sr-only" x-text="t('ai.charts.tenantsTitle')"></caption>

                  <th scope="col" class="px-3 py-2 text-start font-extrabold" x-text="t('ai.charts.colTenant')"></th>

        <!-- الاستخدام حسب السياق الوظيفي -->
        <div class="chart-card xl:col-span-2" style="min-height:22rem">
          <h2 id="ai-feature-h" class="font-extrabold" x-text="t('ai.charts.featureTitle')"></h2>
          <p class="text-xs text-muted" x-text="t('ai.charts.featureSubtitle')"></p>
          <div class="chart-box mt-3" x-show="kpis.totalCalls" x-html="featureSvg"></div>
          <div class="chart-box mt-3 grid place-items-center text-sm font-bold text-muted" style="min-height:12rem" x-show="!kpis.totalCalls">
            <p class="flex items-center gap-2"><i class="fa-regular fa-chart-bar" aria-hidden="true"></i><span x-text="t('ai.charts.noData')"></span></p>
          </div>
          <details class="mt-3 rounded-xl border border-line">
            <summary class="cursor-pointer rounded-xl px-3 py-2 text-xs font-bold text-brand focus-visible:ring-2" x-text="t('ai.charts.showTable')"></summary>
            <div class="overflow-x-auto border-t border-line">
              <table class="w-full text-xs">
                <caption class="sr-only" x-text="t('ai.charts.featureTitle')"></caption>
                <thead class="text-muted"><tr>
                  <th scope="col" class="px-3 py-2 text-start font-extrabold" x-text="t('ai.charts.colFeature')"></th>
                  <th scope="col" class="px-3 py-2 text-end font-extrabold" x-text="t('ai.charts.colCalls')"></th>
                  <th scope="col" class="px-3 py-2 text-end font-extrabold" x-text="t('ai.charts.colTokens')"></th>
                </tr></thead>
                <tbody class="divide-y divide-line">
                  <template x-for="f in view.features" :key="'ft-' + f.key">
                    <tr>
                      <th scope="row" class="px-3 py-1.5 text-start font-bold" x-text="featureLabel(f.key)"></th>
                      <td class="px-3 py-1.5 text-end tabular-nums" x-text="fmtNum(f.calls)"></td>
                      <td class="px-3 py-1.5 text-end tabular-nums" x-text="fmtNum(f.tokens)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </details>
        </div>

        <!-- حصص التوكنز الشهرية (عدّادات الاشتراك للفترة الحالية) -->
        <div class="chart-card" style="min-height:22rem" role="region" aria-labelledby="ai-quota-h">
          <h2 id="ai-quota-h" class="font-extrabold" x-text="t('ai.quota.title')"></h2>
          <p class="text-xs text-muted" x-text="t('ai.quota.subtitle')"></p>
          <p class="mt-2 text-xs font-bold" x-text="quotaSummaryText"></p>
          <ul class="mt-3 space-y-3" role="list" x-show="quotaRows.length">
            <template x-for="q in quotaRows" :key="'q-' + q.id">
              <li class="min-w-0">
                <div class="flex items-center justify-between gap-2 text-xs">
                  <span class="min-w-0 truncate font-bold" x-text="q.name" :title="q.name"></span>
                  <span class="badge shrink-0" :class="quotaBadgeClass(q.state)">
                    <i :class="quotaIcon(q.state)" aria-hidden="true"></i><span x-text="t('ai.quota.state.' + q.state)"></span>
                  </span>
                </div>
                <div class="kpi-track mt-1.5" x-show="q.pct !== null" aria-hidden="true">
                  <div :class="q.state === 'over' ? 'bg-error-600 dark:bg-red-400' : q.state === 'near' ? 'bg-warning-500' : 'bg-primary-500 dark:bg-[#6ecde4]'" :style="'width:' + Math.min(100, Math.round((q.pct || 0) * 100)) + '%'"></div>
                </div>
                <p class="mt-1 text-[11px] tabular-nums text-muted" x-text="quotaLine(q)"></p>
              </li>
            </template>
          </ul>
          <p class="mt-4 text-sm text-muted" x-show="!quotaRows.length" x-text="t('ai.quota.empty')"></p>
          <details class="mt-3 rounded-xl border border-line">
            <summary class="cursor-pointer rounded-xl px-3 py-2 text-xs font-bold text-brand focus-visible:ring-2" x-text="t('ai.charts.showTable')"></summary>
            <div class="overflow-x-auto border-t border-line">
              <table class="w-full text-xs">
                <caption class="sr-only" x-text="t('ai.quota.title')"></caption>
                <thead class="text-muted"><tr>
                  <th scope="col" class="px-3 py-2 text-start font-extrabold" x-text="t('ai.quota.colTenant')"></th>
                  <th scope="col" class="px-3 py-2 text-start font-extrabold" x-text="t('ai.quota.colPlan')"></th>
                  <th scope="col" class="px-3 py-2 text-end font-extrabold" x-text="t('ai.quota.colUsed')"></th>
                  <th scope="col" class="px-3 py-2 text-end font-extrabold" x-text="t('ai.quota.colQuota')"></th>
                  <th scope="col" class="px-3 py-2 text-end font-extrabold" x-text="t('ai.quota.colUsage')"></th>
                  <th scope="col" class="px-3 py-2 text-start font-extrabold" x-text="t('ai.quota.colStatus')"></th>
                </tr></thead>
                <tbody class="divide-y divide-line">
                  <template x-for="q in quotaRows" :key="'qt-' + q.id">
                    <tr>
                      <th scope="row" class="px-3 py-1.5 text-start font-bold" x-text="q.name"></th>
                      <td class="px-3 py-1.5" x-text="q.planName || '—'"></td>
                      <td class="px-3 py-1.5 text-end tabular-nums" x-text="q.used === null ? '—' : fmtNum(q.used)"></td>
                      <td class="px-3 py-1.5 text-end tabular-nums">
                        <span x-show="q.unlimited" aria-hidden="true">∞</span><span x-show="q.unlimited" class="sr-only" x-text="t('ai.quota.unlimited')"></span>
                        <span x-show="!q.unlimited" x-text="q.quota === null ? '—' : fmtNum(q.quota)"></span>
                      </td>
                      <td class="px-3 py-1.5 text-end tabular-nums" x-text="q.pct === null ? '—' : fmtPct(q.pct)"></td>
                      <td class="whitespace-nowrap px-3 py-1.5"><i :class="quotaIcon(q.state)" aria-hidden="true"></i> <span x-text="t('ai.quota.state.' + q.state)"></span></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </details>
        </div>
      </section>

      <!-- ================= جدول سجلات الاستخدام ================= -->
      <section class="panel" aria-labelledby="ai-table-title">
        <div class="flex items-center justify-between gap-3 border-b border-line p-4 sm:p-5">
          <div>
            <h2 id="ai-table-title" class="font-extrabold" x-text="t('ai.table.title')"></h2>
            <p class="text-xs text-muted" x-text="tf('ai.table.showingCount', { n: fmtNum(visibleLogs.length), total: fmtNum(view.rows.length) })"></p>
          </div>
        </div>

        <!-- حالة فارغة -->
        <div x-show="!view.rows.length" class="py-14 text-center">
          <span class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-full bg-primary-500/15 text-brand" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>
          <p class="font-bold" x-text="t('ai.table.emptyTitle')"></p>
          <p class="mt-1 text-xs text-muted" x-text="t('ai.table.emptyDesc')"></p>
          <button type="button" class="btn btn-outline btn-sm mt-3" @click="clearFilters()" x-show="hasActiveFilters" x-text="t('ai.table.clearSearch')"></button>
        </div>

        <!-- بطاقات — جوال/تابلت (عرض واحد فقط حسب العرض) -->
        <template x-if="view.rows.length && !wide">
          <ul class="grid grid-cols-1 gap-3 p-3 sm:grid-cols-2 sm:p-4" role="list">
            <template x-for="log in visibleLogs" :key="'card-' + log.id">
              <li class="min-w-0 rounded-xl border border-line p-4">
                <div class="flex items-start justify-between gap-2">
                  <span class="badge" :class="modelBadgeClass(log.model)" x-text="modelLabel(log.model)"></span>
                  <span class="badge" :class="statusBadgeClass(log.status)"><i :class="statusIcon(log.status)" aria-hidden="true"></i><span x-text="t('ai.status.' + log.status)"></span></span>
                </div>
                <p class="mt-2.5 truncate font-bold leading-6" x-text="tenantName(log)" :title="tenantName(log)"></p>
                <p class="truncate text-xs text-muted" dir="ltr" style="text-align:start" x-text="tenantDomain(log)"></p>
                <p class="mt-1 text-xs tabular-nums text-muted" x-text="fmtDateTime(log.ts)"></p>
                <dl class="mt-2.5 grid grid-cols-2 gap-2 border-t border-line pt-2.5 text-xs">
                  <div><dt class="text-muted" x-text="t('ai.table.colFeature')"></dt><dd class="mt-0.5 truncate font-bold" x-text="featureLabel(log.feature)"></dd></div>
                  <div><dt class="text-muted" x-text="t('ai.table.colTokens')"></dt><dd class="mt-0.5 font-bold tabular-nums" x-text="fmtNum(log.total_tokens)"></dd></div>
                  <div><dt class="text-muted" x-text="t('ai.table.colResponse')"></dt><dd class="mt-0.5 font-bold tabular-nums" x-text="fmtMs(log.response_time_ms)"></dd></div>
                  <div><dt class="text-muted" x-text="t('ai.table.colCost')"></dt><dd class="mt-0.5 font-bold tabular-nums" x-text="money(log.cost)"></dd></div>
                </dl>
                <button type="button" class="btn btn-outline btn-sm mt-3 w-full" @click="openDrawer(log, $event)" :aria-label="inspectLabel(log)"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span x-text="t('ai.table.inspect')"></span></button>
              </li>
            </template>
          </ul>
        </template>

        <!-- جدول — سطح المكتب -->
        <template x-if="view.rows.length && wide">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <caption class="sr-only" x-text="t('ai.table.title') + ' — ' + tf('ai.table.showingCount', { n: fmtNum(visibleLogs.length), total: fmtNum(view.rows.length) })"></caption>
              <thead class="bg-soft/60 text-xs text-muted">
                <tr>
                  <th scope="col" class="whitespace-nowrap px-5 py-3 text-start font-extrabold" :aria-sort="ariaSort('ts')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded font-extrabold hover:text-brand focus-visible:ring-2" @click="sortBy('ts')"><span x-text="t('ai.table.colTimestamp')"></span><i class="fa-solid" :class="sortIcon('ts')" aria-hidden="true"></i></button>
                  </th>
                  <th scope="col" class="whitespace-nowrap px-4 py-3 text-start font-extrabold" x-text="t('ai.table.colTenant')"></th>
                  <th scope="col" class="whitespace-nowrap px-4 py-3 text-start font-extrabold" x-text="t('ai.table.colModel')"></th>
                  <th scope="col" class="whitespace-nowrap px-4 py-3 text-start font-extrabold" x-text="t('ai.table.colFeature')"></th>
                  <th scope="col" class="whitespace-nowrap px-4 py-3 text-start font-extrabold" :aria-sort="ariaSort('total_tokens')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded font-extrabold hover:text-brand focus-visible:ring-2" @click="sortBy('total_tokens')"><span x-text="t('ai.table.colTokens')"></span><i class="fa-solid" :class="sortIcon('total_tokens')" aria-hidden="true"></i></button>
                  </th>
                  <th scope="col" class="whitespace-nowrap px-4 py-3 text-start font-extrabold" :aria-sort="ariaSort('response_time_ms')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded font-extrabold hover:text-brand focus-visible:ring-2" @click="sortBy('response_time_ms')"><span x-text="t('ai.table.colResponse')"></span><i class="fa-solid" :class="sortIcon('response_time_ms')" aria-hidden="true"></i></button>
                  </th>
                  <th scope="col" class="whitespace-nowrap px-4 py-3 text-start font-extrabold" :aria-sort="ariaSort('cost')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded font-extrabold hover:text-brand focus-visible:ring-2" @click="sortBy('cost')"><span x-text="t('ai.table.colCost')"></span><i class="fa-solid" :class="sortIcon('cost')" aria-hidden="true"></i></button>
                  </th>
                  <th scope="col" class="whitespace-nowrap px-4 py-3 text-start font-extrabold" x-text="t('ai.table.colStatus')"></th>
                  <th scope="col" class="whitespace-nowrap px-5 py-3 text-end font-extrabold" x-text="t('ai.table.colActions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-line">
                <template x-for="log in visibleLogs" :key="'row-' + log.id">
                  <tr class="transition hover:bg-soft/40">
                    <td class="whitespace-nowrap px-5 py-3.5 tabular-nums text-muted" x-text="fmtDateTime(log.ts)"></td>
                    <td class="max-w-[12rem] px-4 py-3.5">
                      <p class="truncate font-bold" x-text="tenantName(log)" :title="tenantName(log)"></p>
                      <p class="truncate text-xs text-muted" dir="ltr" style="text-align:start" x-text="tenantDomain(log)"></p>
                    </td>
                    <td class="whitespace-nowrap px-4 py-3.5"><span class="badge" :class="modelBadgeClass(log.model)" x-text="modelLabel(log.model)"></span></td>
                    <td class="whitespace-nowrap px-4 py-3.5"><span class="badge badge-muted" x-text="featureLabel(log.feature)"></span></td>
                    <td class="whitespace-nowrap px-4 py-3.5">
                      <p class="font-extrabold tabular-nums" x-text="fmtNum(log.total_tokens)"></p>
                      <p class="text-[11px] tabular-nums text-muted" x-text="tf('ai.table.tokenParts', { p: fmtNum(log.prompt_tokens), c: fmtNum(log.completion_tokens) })"></p>
                    </td>
                    <td class="whitespace-nowrap px-4 py-3.5 tabular-nums" x-text="fmtMs(log.response_time_ms)"></td>
                    <td class="whitespace-nowrap px-4 py-3.5 font-bold tabular-nums" x-text="money(log.cost)"></td>
                    <td class="whitespace-nowrap px-4 py-3.5"><span class="badge" :class="statusBadgeClass(log.status)"><i :class="statusIcon(log.status)" aria-hidden="true"></i><span x-text="t('ai.status.' + log.status)"></span></span></td>
                    <td class="whitespace-nowrap px-5 py-3.5 text-end">
                      <button type="button" class="act group relative ms-auto" @click="openDrawer(log, $event)" :aria-label="inspectLabel(log)">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <span class="tooltip-bubble" aria-hidden="true" x-text="t('ai.table.inspect')"></span><span class="tooltip-arrow" aria-hidden="true"></span>
                      </button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>

        <!-- تحميل المزيد -->
        <div class="flex justify-center border-t border-line p-4" x-show="view.rows.length && visibleLogs.length < view.rows.length" x-cloak>
          <button type="button" class="btn btn-outline btn-sm" @click="loadMore()">
            <i class="fa-solid fa-angles-down" aria-hidden="true"></i><span x-text="t('ai.table.loadMore')"></span>
          </button>
        </div>
      </section>

    </main>
  </div>
</div>

<!-- ==========================================================================
     الدرج الجانبي — فاحص الاستدعاء والحمولة (Prompt / Response Inspector)
     ========================================================================== -->
<div x-show="drawerOpen" x-cloak class="fixed inset-0 z-[60]">
  <div x-show="drawerOpen" x-transition.opacity class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closeDrawer()" aria-hidden="true"></div>

  <div x-show="drawerOpen" x-trap.noscroll="drawerOpen" role="dialog" aria-modal="true" aria-labelledby="drawer-title"
       @keydown.escape.stop="closeDrawer()"
       x-transition:enter="transition-transform duration-300 ease-out" x-transition:enter-start="ltr:translate-x-full rtl:-translate-x-full" x-transition:enter-end="translate-x-0"
       x-transition:leave="transition-transform duration-200 ease-in" x-transition:leave-start="translate-x-0" x-transition:leave-end="ltr:translate-x-full rtl:-translate-x-full"
       class="drawer-panel">

    <template x-if="selectedLog">

  /* قائمة اختيار مخصّصة (Combobox + Listbox): Home/End، بحث بالكتابة، Tab يغلق، Escape لا يتسرّب */
  function selectDropdown({ id, options, get, set, placeholder = '' }) {
    return {
      id, open: false, active: -1, typed: '', typedAt: 0,
      get items() { return options(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { const sel = this.selectedItem; return sel ? sel.label : (typeof placeholder === 'function' ? placeholder() : placeholder); },
      optId(item) { return this.id + '-opt-' + item.value; },
      openList() {
        if (!this.items.length) return;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item) { set(item.value); this.closeList(); this.$refs.btn?.focus(); },
      setActive(i) { this.active = Math.min(Math.max(i, 0), this.items.length - 1); this.scrollActiveIntoView(); },
      move(step) { if (!this.open) { this.openList(); return; } this.setActive(this.active + step); },
      onKey(e) {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); if (e.altKey && this.open && k === 'ArrowUp') { this.choose(this.items[this.active]); return; } this.move(k === 'ArrowDown' ? 1 : -1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.setActive(0); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.setActive(this.items.length - 1); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); (this.open && this.active > -1) ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape') { if (this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); } }
        else if (k === 'Tab') { if (this.open) this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          const now = Date.now();
          this.typed = (now - this.typedAt > 600 ? '' : this.typed) + k.toLowerCase();
          this.typedAt = now;
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this.typed));
          if (i > -1) { if (!this.open) this.openList(); this.setActive(i); }
        }
      },
      // children[0] هو <template x-for> — لذا +1
      scrollActiveIntoView() { this.$nextTick(() => this.$refs.list?.children[this.active + 1]?.scrollIntoView({ block: 'nearest' })); },
      isSelected(item) { const sel = this.selectedItem; return !!sel && sel.value === item.value; },
    };

    /* ================= لوحة الألوان (تباين ≥ 3:1 للرسوم على خلفية البطاقة في الوضعين) ================= */
    const SLOTS = {
      light: ['#2a78d6', '#c4501f', '#12805a', '#9a6200', '#7c3aed'],
      dark:  ['#4a94ec', '#e0703f', '#2bb583', '#d79a1c', '#a78bfa'],
    };

    /* ================= النماذج الحالية — أسعار مرجعية بالهللة لكل مليون توكن (USD × 3.75) ================= */
    const MODELS = [
      { key: 'claude-opus-4-5',   label: 'Claude Opus 4.5',   provider: 'Anthropic', inRate: 1875, outRate: 9375, weight: 10 },
      { key: 'claude-sonnet-4-5', label: 'Claude Sonnet 4.5', provider: 'Anthropic', inRate: 1125, outRate: 5625, weight: 30 },

      { key: 'gemini-2.5-pro',    label: 'Gemini 2.5 Pro',    provider: 'Google',    inRate: 469,  outRate: 3750, weight: 15 },
    ];
    const FEATURES = [
      { key: 'question_generation', ar: 'مولّد بنك الأسئلة', en: 'Question Bank Generator', weight: 30 },
      { key: 'lesson_planner', ar: 'مخطط الدروس', en: 'Lesson Planner', weight: 24 },

    ];
    const ERRORS = {
      failed: [
        { ar: 'انتهت مهلة الاتصال بخادم النموذج (Timeout) بعد 30 ثانية', en: 'Model server connection timed out after 30s' },

      ],
