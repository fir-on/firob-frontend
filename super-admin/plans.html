    /* نسخة عميقة من باقات SA + الإضافات */
    const buildPlans = () => JSON.parse(JSON.stringify(SA.PLANS)).map((p) => Object.assign(p, JSON.parse(JSON.stringify(EXTRA[p.id] || { color: PALETTE[0], price_yearly: null, features: [] })), { price_change: null }));

    let uidSeq = 0;
    const featUid = () => 'f' + (++uidSeq);
    const toStr = (v) => (v === null || v === undefined ? '' : String(v));
    const minorToInput = (minor) => (minor === null || minor === undefined ? '' : Math.trunc(minor / 100) + '.' + String(Math.abs(minor % 100)).padStart(2, '0'));   // قيمة حقل إدخال (سنت → دولار)، لا عرض

    return {
      /* ---------- حالة عامة ---------- */
      dark: document.documentElement.classList.contains('dark'),
      locale: document.documentElement.lang === 'en' ? 'en' : 'ar',
      mobile: !desktopMQ.matches,
      mobileNav: false,
      collapsed: false,
      notifOpen: false, profileOpen: false,
      active: 'plans',
      liveMsg: '',
      get expanded() { return this.mobile || !this.collapsed; },

      /* ---------- الترجمة ---------- */
      t(path) {
        const dict = I18N[this.locale];
        return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), dict) ?? path;
      },
      tf(path, vars) {
        let s = this.t(path);
        Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
        return s;
      },
      setLocale(loc) {
        this.locale = loc;
        document.documentElement.lang = loc;
        document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
        try { localStorage.setItem('firob-locale', loc); } catch (e) {}
        this.syncTitle();
      },
      toggleLocale() { this.setLocale(this.locale === 'ar' ? 'en' : 'ar'); },
      syncTitle() { document.title = this.t('pl.title') + ' — FirOb'; },

      /* ---------- التنسيق (Intl + SA) ---------- */
      money(minor) { return SA.money(minor, this.locale); },
      moneyOrDash(minor) { return minor === null || minor === undefined ? '—' : SA.money(minor, this.locale); },
      fmtNum(n) { return SA.fmtNum(n, this.locale); },
      fmtPct(pct) { return new Intl.NumberFormat(SA.fmtLocale(this.locale), { style: 'percent', maximumFractionDigits: 1 }).format((pct || 0) / 100); },
      fmtCompact(n) { return new Intl.NumberFormat(SA.fmtLocale(this.locale), { notation: 'compact', maximumFractionDigits: 2 }).format(n || 0); },
      fmtSize(mb) {
        mb = Number(mb) || 0;
        const f = (v) => new Intl.NumberFormat(SA.fmtLocale(this.locale), { maximumFractionDigits: 2 }).format(v);
        if (mb >= 1024 * 1024) return f(mb / 1024 / 1024) + ' TB';
        if (mb >= 1024) return f(mb / 1024) + ' GB';
        return f(mb) + ' MB';
      },
      fmtLimitValue(key, v) {
        if (v === null || v === undefined) return this.t('pl.unlimited');
        if (key === 'max_storage_mb') return this.fmtSize(v);
        if (key === 'ai_token_quota_monthly') return this.fmtCompact(v) + ' ' + this.t('pl.tokensMo');
        return this.fmtNum(v);
      },
      fmtLimit(p, key) { return this.fmtLimitValue(key, p[key]); },
      get arrow() { return this.locale === 'ar' ? ' ← ' : ' → '; },

      /* ---------- التنقل ---------- */
      nav: [
        { group: 'overview', items: [
          { key: 'dashboard', icon: 'fa-solid fa-gauge-high', href: 'overview.html' },
          { key: 'aiAnalytics', icon: 'fa-solid fa-robot', href: 'ai-analytics.html' },
        ]},
        { group: 'admin', items: [
          { key: 'tenants', icon: 'fa-solid fa-building-columns', href: 'tenants.html' },
          { key: 'plans', icon: 'fa-solid fa-cubes', href: 'plans.html' },
          { key: 'subscriptions', icon: 'fa-solid fa-layer-group', href: 'subscriptions.html' },
          { key: 'payments', icon: 'fa-solid fa-file-invoice-dollar', href: 'payments.html' },
        ]},
        { group: 'system', items: [
          { key: 'activityLog', icon: 'fa-solid fa-clock-rotate-left', href: 'activity-log.html' },
          { key: 'systemSettings', icon: 'fa-solid fa-sliders', href: 'system-settings.html' },
        ]},
      ],
      setActive(key) { this.active = key; this.mobileNav = false; },

      /* ---------- الإشعارات (شريط علوي عام) ---------- */
      notifications: [
        { id: 1, key: 'upload', time: '5m', read: false, icon: 'fa-solid fa-upload', tone: 'bg-primary-500/15 text-brand' },
        { id: 2, key: 'quota', time: '1h', read: false, icon: 'fa-solid fa-triangle-exclamation', tone: 'bg-warning-500/15 text-warning-700 dark:text-warning-500' },
        { id: 3, key: 'backup', time: '6h', read: true, icon: 'fa-solid fa-database', tone: 'bg-success-500/15 text-success-700 dark:text-success-500' },
      ],
      get unread() { return this.notifications.filter(n => !n.read).length; },

      /* ---------- البيانات ---------- */
      plans: buildPlans(),
      subscriptions: JSON.parse(JSON.stringify(SA.SUBSCRIPTIONS)),
      limitDefs: LIMITS,

      /* مشتركو الباقة = اشتراكات active/trialing/past_due (محسوبة دائمًا، لا تُخزَّن) */
      subscribersOf(planId) { return this.subscriptions.filter(s => s.plan_id === planId && COUNTED.includes(s.status)).length; },
      linkedOf(planId) { return this.subscriptions.filter(s => s.plan_id === planId).length; },
      /* أعلى استخدام حالي لحدّ معيّن مع المؤسسة صاحبته */
      maxUsage(planId, limitKey) {
        const def = LIMITS.find(l => l.key === limitKey);
        let best = null;
        this.subscriptions.filter(s => s.plan_id === planId && LIVE.includes(s.status)).forEach((s) => {
          const v = (s.usage && s.usage[def.usage]) || 0;
          if (!best || v > best.value) best = { value: v, tenant_id: s.tenant_id };
        });
        return best;
      },
      tenantName(id) { const tn = SA.tenant(id); return tn ? (tn.name[this.locale] || tn.name.ar) : id; },

      /* الباقات مع عدد المشتركين المحسوب */
      get plansView() { return this.plans.map((p) => { const n = this.subscribersOf(p.id); if (p.subscribers !== n) p.subscribers = n; return p; }); },

      /* ---------- مساعدات العرض ---------- */
      planName(p) { return (p.name && (p.name[this.locale] || p.name.ar || p.name.en)) || p.code; },
      planNameOther(p) { const o = this.locale === 'ar' ? 'en' : 'ar'; return (p.name && p.name[o]) || ''; },
      featText(f) { return typeof f === 'string' ? f : (f[this.locale] || f.ar || f.en || ''); },
      /* نسبة التوفير السنوي مقابل 12 × الشهري (null إن لم ينطبق) */
      savePctOf(monthly, yearly) {
        if (yearly === null || yearly === undefined || !(monthly > 0)) return null;
        const full = monthly * 12;
        if (yearly >= full) return 0;
        return Math.round(((full - yearly) / full) * 1000) / 10;
      },
      savePct(p) { return this.savePctOf(p.price_monthly, p.price_yearly) || 0; },
      priceChangeBadge(p) {
        const c = p.price_change;
        if (!c) return '';
        return c.policy === 'grandfather'
          ? this.tf('pl.badgeGrandfather', { n: this.fmtNum(c.affected), price: this.money(c.old_monthly) })
          : this.tf('pl.badgeNextRenewal', { n: this.fmtNum(c.affected) });
      },
      get totalPlans() { return this.plans.length; },
      get activePlansCount() { return this.plans.filter(p => p.is_active).length; },
      get totalSubscribers() { return this.plans.reduce((s, p) => s + this.subscribersOf(p.id), 0); },
      get mostPopularPlan() {
        const list = this.plansView;
        if (!list.length) return null;
        const top = list.slice().sort((a, b) => b.subscribers - a.subscribers || (a.sort_order || 0) - (b.sort_order || 0))[0];
        return top.subscribers > 0 ? top : null;
      },
      isPopular(p) { return !!this.mostPopularPlan && p.id === this.mostPopularPlan.id; },

      /* ---------- عرض / بحث / فلاتر / فرز ---------- */
      view: 'grid', search: '', statusFilter: 'all',
      sortKey: 'price_monthly', sortDir: 'asc',
      get hasFilters() { return !!this.search.trim() || this.statusFilter !== 'all'; },
      matches(p) {
        const q = this.search.trim().toLowerCase();
        const matchesQ = !q || p.code.toLowerCase().includes(q) || (p.name.ar || '').toLowerCase().includes(q) || (p.name.en || '').toLowerCase().includes(q);
        const matchesStatus = this.statusFilter === 'all' || (this.statusFilter === 'active' ? p.is_active : !p.is_active);
        return matchesQ && matchesStatus;
      },
      get visiblePlans() {
        const list = this.plansView.filter(p => this.matches(p));
        if (this.view !== 'table') return list.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
        const dir = this.sortDir === 'asc' ? 1 : -1, key = this.sortKey;
        const val = (p) => (p[key] === null || p[key] === undefined ? Infinity : p[key]);   // غير محدود = الأكبر
        return list.sort((a, b) => {
          const va = val(a), vb = val(b);
          if (typeof va === 'string') return va.localeCompare(vb) * dir;
          return (va === vb ? 0 : (va > vb ? 1 : -1)) * dir;
        });
      },
      sortBy(key) {
        if (this.sortKey === key) { this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc'; }
        else { this.sortKey = key; this.sortDir = 'asc'; }
      },
      sortIcon(key) {
        if (this.sortKey !== key) return 'fa-sort text-line-strong';
        return this.sortDir === 'asc' ? 'fa-sort-up text-brand' : 'fa-sort-down text-brand';
      },
      ariaSort(key) { return this.sortKey === key ? (this.sortDir === 'asc' ? 'ascending' : 'descending') : null; },
      resetFilters() { this.search = ''; this.statusFilter = 'all'; this.announceCount(); },
      announceCount() { this.liveMsg = this.tf('pl.liveCount', { n: this.fmtNum(this.visiblePlans.length) }); },
      announce(msg) { this.liveMsg = ''; this.$nextTick(() => { this.liveMsg = msg; }); },

      /* ---------- النوافذ: إدارة التركيز ---------- */
      modal: null, sub: null, busy: false, opener: null, subOpener: null, target: null,
      rememberOpener() { const a = document.activeElement; this.opener = a && a !== document.body ? a : null; },
      restoreFocus(el) {
        this.$nextTick(() => {
          const node = el && el.isConnected !== false ? el : document.getElementById('add-plan-btn');
          node?.focus?.();
        });
      },
      closeModal() {
        if (this.busy) return;
        this.modal = null; this.sub = null; this.target = null; this.snapshot = null;
        this.restoreFocus(this.opener); this.opener = null;
      },
      openSub(kind) { const a = document.activeElement; this.subOpener = a && a !== document.body ? a : null; this.sub = kind; },
      closeSub() { if (this.busy) return; this.sub = null; this.restoreFocus(this.subOpener); this.subOpener = null; },

      /* ---------- نموذج الإضافة / التعديل ---------- */
      isEditing: false, submitted: false, editingPlan: null, snapshot: null,
      policyChoice: '', policyError: false, pendingPrice: null,
      /* قيمة مبدئية غير فارغة: روابط النافذة المخفية تُقيَّم قبل فتحها */
      form: { id: null, code: '', name: { ar: '', en: '' }, price_monthly: '0.00', price_yearly: '', trial_days: '0', max_users: '10', max_storage_mb: '5120',
              ai_token_quota_monthly: '50000', unl: { max_users: false, max_storage_mb: false, ai_token_quota_monthly: false }, sort_order: '1', features: [], is_active: true },
      blankForm() {
        return { id: null, code: '', name: { ar: '', en: '' }, price_monthly: '0.00', price_yearly: '', trial_days: '0',
                 max_users: '10', max_storage_mb: '5120', ai_token_quota_monthly: '50000',
                 unl: { max_users: false, max_storage_mb: false, ai_token_quota_monthly: false },
                 sort_order: String(this.nextSortOrder()), features: [], is_active: true };
      },
      planToForm(p) {
        const f = { id: p.id, code: p.code, name: { ar: p.name.ar || '', en: p.name.en || '' },
                    price_monthly: minorToInput(p.price_monthly), price_yearly: minorToInput(p.price_yearly), trial_days: toStr(p.trial_days || 0),
                    unl: {}, sort_order: toStr(p.sort_order || 1), is_active: !!p.is_active,
                    features: (p.features || []).map(x => (typeof x === 'string' ? { ar: x, en: x } : { ar: x.ar || '', en: x.en || '' })).map(x => Object.assign(x, { uid: featUid() })) };
        LIMITS.forEach(({ key }) => { f.unl[key] = p[key] === null; f[key] = p[key] === null ? '' : toStr(p[key]); });
        return f;
      },
      nextSortOrder() { return this.plans.length ? Math.max(...this.plans.map(p => p.sort_order || 0)) + 1 : 1; },
      serialize(f) { return JSON.stringify(f, (k, v) => (k === 'uid' ? undefined : v)); },
      get dirty() { return this.modal === 'edit' && !!this.form && this.snapshot !== null && this.serialize(this.form) !== this.snapshot; },
      openForm(form, editingPlan) {
        this.rememberOpener();
        this.form = form; this.editingPlan = editingPlan; this.isEditing = !!editingPlan;
        this.submitted = false; this.policyChoice = ''; this.policyError = false; this.pendingPrice = null;
        this.snapshot = this.serialize(form);
        this.modal = 'edit';
        this.$nextTick(() => document.getElementById('pf-name-ar')?.focus());
      },
      openAddModal() { this.openForm(this.blankForm(), null); },
      openEditModal(p) { this.openForm(this.planToForm(p), p); },
      duplicatePlan(p) {
        const f = this.planToForm(p);
        f.id = null;
        let code = p.code + '-copy', i = 2;
        while (this.plans.some(x => x.code.toLowerCase() === code)) code = p.code + '-copy-' + (i++);
        f.code = code; f.sort_order = String(this.nextSortOrder());
        this.openForm(f, null);
        this.snapshot = this.serialize(this.blankForm());   // نسخة جديدة = تغييرات غير محفوظة
      },
      addFeature() { this.form.features.push({ ar: '', en: '', uid: featUid() }); this.$nextTick(() => document.getElementById('pf-feat-' + (this.form.features.length - 1) + '-ar')?.focus()); },
      removeFeature(idx) { this.form.features.splice(idx, 1); this.$nextTick(() => document.getElementById('pf-add-feature')?.focus()); },
      featureInvalid(f) { const a = (f.ar || '').trim(), e = (f.en || '').trim(); return (!!a) !== (!!e); },
      requestCloseEdit() {
        if (this.busy) return false;
        if (this.dirty) { this.openSub('discard'); return 'confirm'; }
        this.closeModal(); return true;
      },
      discardChanges() { this.sub = null; this.subOpener = null; this.snapshot = null; this.busy = false; this.closeModal(); },

      /* ---------- التحقق ---------- */
      parseMoney(str) {
        const s = String(str ?? '').trim();
        if (s === '') return { empty: true };
        if (/^-/.test(s) && MONEY_RE.test(s.slice(1))) return { error: 'pl.errMin0' };
        if (!MONEY_RE.test(s)) return { error: 'pl.errMoney' };
        return { minor: SA.m.toMinor(s) };
      },
      get formMonthlyMinor() { const r = this.form ? this.parseMoney(this.form.price_monthly) : {}; return r.minor ?? 0; },
      get formSavePct() {
        if (!this.form) return null;
        const m = this.parseMoney(this.form.price_monthly), y = this.parseMoney(this.form.price_yearly);
        if (m.minor === undefined || y.minor === undefined) return null;
        return this.savePctOf(m.minor, y.minor);
      },
      limitHint(key) {
        if (!this.editingPlan) return this.t('pl.limitNoUsage');
        const u = this.maxUsage(this.editingPlan.id, key);
        return u ? this.tf('pl.limitUsage', { usage: this.fmtLimitValue(key, u.value) + ' — ' + this.tenantName(u.tenant_id) }) : this.t('pl.limitNoUsage');
      },
      /* كل الأخطاء (key → رسالة مترجمة) */
      get errors() {
        const f = this.form, e = {};
        if (!f || this.modal !== 'edit') return e;
        if (!f.name.ar.trim()) e.name_ar = this.t('pl.errRequired');
        if (!f.name.en.trim()) e.name_en = this.t('pl.errRequired');
        const code = f.code.trim();
        if (!code) e.code = this.t('pl.errRequired');
        else if (this.plans.some(p => p.id !== f.id && p.code.toLowerCase() === code.toLowerCase())) e.code = this.t('pl.errCodeDup');
        else if (!CODE_RE.test(code)) e.code = this.t('pl.errCodePattern');

        const m = this.parseMoney(f.price_monthly);
        if (m.empty) e.price_monthly = this.t('pl.errRequired');
        else if (m.error) e.price_monthly = this.t(m.error);
        const y = this.parseMoney(f.price_yearly);
        if (y.error) e.price_yearly = this.t(y.error);
        else if (!y.empty && m.minor !== undefined && y.minor > m.minor * 12) e.price_yearly = this.tf('pl.errYearlyMax', { max: this.money(m.minor * 12) });

        const td = String(f.trial_days ?? '').trim();
        if (!INT_RE.test(td)) e.trial_days = this.t('pl.errInt');
        const so = String(f.sort_order ?? '').trim();
        if (!INT_RE.test(so) || Number(so) < 1) e.sort_order = this.t('pl.errSortInt');

        LIMITS.forEach(({ key }) => {
          if (f.unl[key]) return;
          const s = String(f[key] ?? '').trim();
          if (!INT_RE.test(s)) { e[key] = this.t('pl.errInt'); return; }
          if (this.editingPlan) {
            const u = this.maxUsage(this.editingPlan.id, key);
            if (u && Number(s) < u.value) e[key] = this.tf('pl.errBelowUsage', { usage: this.fmtLimitValue(key, u.value), tenant: this.tenantName(u.tenant_id) });
          }
        });
        if (f.features.some(x => this.featureInvalid(x))) e.features = this.t('pl.errFeature');
        return e;
      },
      get errorList() {
        const labels = { name_ar: ['pl.fNameAr', 'pf-name-ar'], name_en: ['pl.fNameEn', 'pf-name-en'], code: ['pl.fCode', 'pf-code'],
          price_monthly: ['pl.fPrice', 'pf-price'], price_yearly: ['pl.fPriceYearly', 'pf-price-yearly'], trial_days: ['pl.fTrialDays', 'pf-trial'],
          sort_order: ['pl.fSortOrder', 'pf-sort-order'], max_users: ['pl.fMaxUsers', 'pf-users'], max_storage_mb: ['pl.fMaxStorage', 'pf-storage'],
          ai_token_quota_monthly: ['pl.fAiQuota', 'pf-ai'], features: ['pl.fFeatures', 'pf-add-feature'] };
        const e = this.errors;
        return Object.keys(labels).filter(k => e[k]).map(k => ({ key: k, label: this.t(labels[k][0]), id: labels[k][1], msg: e[k] }));
      },
      showErr(key) { return this.submitted ? (this.errors[key] || '') : ''; },
      focusField(id) {
        if (id === 'pf-add-feature' && this.form) {
          const i = this.form.features.findIndex(x => this.featureInvalid(x));
          if (i > -1) id = 'pf-feat-' + i + '-' + ((this.form.features[i].ar || '').trim() ? 'en' : 'ar');
        }
        document.getElementById(id)?.focus();
      },

      /* ---------- الحفظ ---------- */
      formToPlan() {
        const f = this.form;
        const p = {
          code: f.code.trim(), name: { ar: f.name.ar.trim(), en: f.name.en.trim() },
          price_monthly: this.parseMoney(f.price_monthly).minor,
          price_yearly: this.parseMoney(f.price_yearly).empty ? null : this.parseMoney(f.price_yearly).minor,
          trial_days: Number(String(f.trial_days).trim()), sort_order: Number(String(f.sort_order).trim()), is_active: !!f.is_active,
          features: f.features.filter(x => (x.ar || '').trim() && (x.en || '').trim()).map(x => ({ ar: x.ar.trim(), en: x.en.trim() })),
        };
        LIMITS.forEach(({ key }) => { p[key] = f.unl[key] ? null : Number(String(f[key]).trim()); });
        return p;
      },
      /* يعيد: false (أخطاء/مشغول) | 'policy' (بانتظار السياسة) | true (حُفظ) */
      async savePlan() {
        if (this.busy || this.modal !== 'edit') return false;
        this.submitted = true;
        const n = this.errorList.length;
        if (n) {
          this.announce(this.tf('pl.liveErrors', { n: this.fmtNum(n) }));
          this.$nextTick(() => this.$refs.errSummary?.focus());
          return false;
        }
        const data = this.formToPlan();
        const ep = this.editingPlan;
        if (ep) {
          const subs = this.subscribersOf(ep.id);
          const priceChanged = data.price_monthly !== ep.price_monthly || data.price_yearly !== ep.price_yearly;
          if (priceChanged && subs > 0) {
            this.pendingPrice = { old_monthly: ep.price_monthly, new_monthly: data.price_monthly, old_yearly: ep.price_yearly, new_yearly: data.price_yearly, affected: subs };
            this.policyChoice = ''; this.policyError = false;
            this.openSub('policy');
            return 'policy';
          }
        }
        return this.commit(data, null);
      },
      get policyIntro() {
        if (!this.editingPlan || !this.pendingPrice) return '';
        return this.tf('pl.policyIntro', { name: this.planName(this.editingPlan), n: this.fmtNum(this.pendingPrice.affected) });
      },
      async confirmPolicy() {
        if (this.busy) return false;
        if (!['grandfather', 'next_renewal'].includes(this.policyChoice)) { this.policyError = true; return false; }
        const policy = Object.assign({ policy: this.policyChoice, at: SA.todayIso() }, this.pendingPrice);
        this.sub = null; this.subOpener = null;
        return this.commit(this.formToPlan(), policy);
      },
      async commit(data, policy) {
        this.busy = true;
        await new Promise(r => setTimeout(r, 300));
        let saved;
        if (this.editingPlan) {
          saved = this.plans.find(p => p.id === this.editingPlan.id);
          Object.assign(saved, data);
          if (policy) saved.price_change = policy;
        } else {
          saved = Object.assign({ id: Math.max(0, ...this.plans.map(p => p.id)) + 1, color: PALETTE[this.plans.length % PALETTE.length], price_change: null }, data);
          this.plans.push(saved);
        }
        this.busy = false;
        const name = this.planName(saved);
        const msg = policy
          ? this.tf('pl.toastPolicy', { name, policy: this.t(policy.policy === 'grandfather' ? 'pl.policyGrandfather' : 'pl.policyNextRenewal') })
          : this.tf(this.editingPlan ? 'pl.toastEdited' : 'pl.toastAdded', { name });
        this.snapshot = null;
        this.closeModal();
        this.toastSuccess(msg); this.announce(msg);
        return true;
      },

      /* ---------- تفعيل / تعطيل / حذف ---------- */
      toggleActive(p) {
        if (p.is_active) return this.openDeactivate(p, false);
        p.is_active = true;
        const msg = this.tf('pl.toastActivated', { name: this.planName(p) });
        this.toastSuccess(msg); this.announce(msg);
        return true;
      },
      openDeactivate(p, fromGuard) {
        if (!fromGuard) this.rememberOpener();
        this.target = p; this.modal = 'deactivate';
        return 'confirm';
      },
      async deactivateConfirmed() {
        if (this.busy || !this.target) return false;
        this.busy = true;
        await new Promise(r => setTimeout(r, 250));
        const p = this.plans.find(x => x.id === this.target.id);
        p.is_active = false;
        this.busy = false;
        const msg = this.tf('pl.toastDeactivated', { name: this.planName(p) });
        this.closeModal();
        this.toastSuccess(msg); this.announce(msg);
        return true;
      },
      get restrictText() {
        const p = this.target;
        if (!p) return '';
        const n = this.subscribersOf(p.id), h = this.linkedOf(p.id);
        return n > 0
          ? this.tf('pl.restrictCurrent', { name: this.planName(p), n: this.fmtNum(n), h: this.fmtNum(h) })
          : this.tf('pl.restrictHistory', { name: this.planName(p), h: this.fmtNum(h) });
      },
      confirmDelete(p) {
        this.rememberOpener();
        this.target = p;
        this.modal = this.linkedOf(p.id) > 0 ? 'restrict' : 'delete';
        return this.modal;
      },
      async deleteConfirmed() {
        if (this.busy || !this.target) return false;
        if (this.linkedOf(this.target.id) > 0) { this.modal = 'restrict'; return false; }   // حارس مزدوج
        this.busy = true;
        await new Promise(r => setTimeout(r, 300));
        const name = this.planName(this.target), id = this.target.id;
        this.plans = this.plans.filter(p => p.id !== id);
        this.busy = false;
        this.opener = null;                                    // الزر حُذف — يعود التركيز لزر الإضافة
        this.closeModal();
        const msg = this.tf('pl.toastDeleted', { name });
        this.toastSuccess(msg); this.announce(msg);
        return true;
      },

      /* ---------- SweetAlert2: تنبيه سريع (نص فقط — لا HTML) ---------- */
      toastSuccess(text) {
        if (!window.Swal) return;
        window.Swal.mixin({
          toast: true, position: this.locale === 'ar' ? 'top-start' : 'top-end',
          showConfirmButton: false, timer: 2600, timerProgressBar: true,
          customClass: { popup: 'firob-swal firob-toast' },
          didOpen: (popup) => popup.setAttribute('dir', this.locale === 'ar' ? 'rtl' : 'ltr'),
        }).fire({ icon: 'success', titleText: text });
      },

      /* ---------- عامة ---------- */
      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        this.syncTitle();
        this.$watch('search', () => this.announceCount());
        this.$watch('statusFilter', () => this.announceCount());
        /* تحذير المتصفح عند المغادرة مع تغييرات غير محفوظة */
        window.addEventListener('beforeunload', (e) => { if (this.dirty) { e.preventDefault(); e.returnValue = ''; return ''; } });
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      /* Escape العام يغلق القوائم فقط؛ النوافذ تعالج Escape بنفسها (الأعلى فقط) */
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },
    };
  }
</script>
</body>
