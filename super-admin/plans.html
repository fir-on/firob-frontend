<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>إدارة الباقات — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  { @apply bg-accent-500/25 text-yellow-900 dark:text-accent-200; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-line-strong; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-4 py-2.5 text-start text-sm font-medium text-ink transition-colors hover:bg-soft; }
    .combo-option.is-active   { @apply bg-soft; }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }
    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- النافذة المنبثقة (Modal) ---------- */
    .modal-panel { @apply relative flex max-h-[90dvh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }

    /* ---------- مقياس الحصة (QuotaMeter) ---------- */
    .quota-track { @apply h-1.5 w-full overflow-hidden rounded-full bg-line; }
    .quota-fill { @apply h-full rounded-full transition-all duration-500; }

    /* ---------- مفتاح التبديل (Switch) ---------- */
    .switch { @apply inline-flex cursor-pointer items-center gap-3 text-sm font-bold; }
    .switch-track { @apply relative h-6 w-11 shrink-0 rounded-full bg-line-strong transition-colors; }
    .switch-track::after { content: ''; @apply absolute start-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform; }
    .peer:checked ~ .switch-track { @apply bg-primary-500; }
    .peer:checked ~ .switch-track::after { transform: translateX(1.25rem); }
    [dir='rtl'] .peer:checked ~ .switch-track::after { transform: translateX(-1.25rem); }
    .peer:focus-visible ~ .switch-track { box-shadow: var(--ring); }
    .peer:disabled ~ .switch-track { @apply opacity-45; }

    /* ---------- مقطع أزرار (Segmented control) ---------- */
    .seg { @apply inline-flex items-center gap-1 rounded-xl border border-line bg-card p-1; }
    .seg-btn { @apply inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-bold text-muted transition; }
    .seg-btn[aria-pressed="true"] { @apply bg-primary-500 text-white shadow; }

    /* ---------- كرت الباقة (PricingCard) ---------- */
    .plan-card { @apply relative flex h-full flex-col justify-between rounded-2xl border border-line bg-card p-5 shadow-card transition; }
    .plan-card[data-popular="true"] { @apply border-accent-500 ring-2 ring-accent-500/70 shadow-[0_0_0_1px_rgba(247,217,51,.35),0_22px_45px_-16px_rgba(247,217,51,.6)]; }
    .plan-card[data-inactive="true"] { @apply opacity-70; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }
</style>

<!-- ⑥ Alpine.js (+ إضافة Focus لحصر التركيز داخل النوافذ المنبثقة) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- ⑦ SweetAlert2 -->
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body x-data="shell()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch.focus(); }"
      :class="{ 'overflow-hidden': (mobileNav && mobile) || modal }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:sticky lg:top-0 lg:h-[100dvh] lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <a href="overview.html" class="inline-flex min-w-0 flex-1 items-center gap-3 rounded-lg focus-visible:ring-2" :class="!expanded && 'lg:flex-none lg:justify-center'" :aria-label="t('appTitle')">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </a>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-line-strong" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="item.count && expanded"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent" x-text="item.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="flex min-w-0 flex-1 flex-col">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-line-strong" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-line-strong focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd dir="ltr" aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex">Ctrl K</kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-haspopup="true" :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="t('notif.' + n.key)"></p>
                      <p class="text-xs text-muted" x-text="n.time"></p>
                    </div>
                  </li>
                </template>
              </ul>
              <div class="border-t border-line p-2">
                <a href="../common/notifications.html" class="menu-item justify-center text-brand" @click="notifOpen = false">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  <span x-text="t('viewAllNotif')"></span>
                </a>
              </div>
            </div>
          </div>

          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" class="flex max-w-[14rem] items-center gap-2 rounded-xl p-1 transition hover:bg-soft focus-visible:ring-2 md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    aria-haspopup="menu" :aria-expanded="profileOpen.toString()" aria-controls="profile-menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true">S</span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="t('appSubtitle')"></span>
                <span class="block truncate text-xs text-muted">Super Admin</span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted md:block" aria-hidden="true"></i>
            </button>
            <div id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-56" role="menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <a href="../common/profile.html" role="menuitem" class="menu-item"><i class="fa-regular fa-user w-4 text-muted" aria-hidden="true"></i> <span x-text="t('profile')"></span></a>
              <a href="system-settings.html" role="menuitem" class="menu-item"><i class="fa-solid fa-gear w-4 text-muted" aria-hidden="true"></i> <span x-text="t('settings')"></span></a>
              <a href="../common/errors.html" role="menuitem" class="menu-item"><i class="fa-solid fa-triangle-exclamation w-4 text-muted" aria-hidden="true"></i> <span x-text="t('systemStatus')"></span></a>
              <div class="border-t border-line"></div>
              <a href="../auth/login.html" role="menuitem" class="menu-item !text-danger"><i class="fa-solid fa-arrow-right-from-bracket w-4" aria-hidden="true"></i> <span x-text="t('logout')"></span></a>
            </div>
          </div>
        </div>
      </div>

      <!-- زبدة الخبز (Breadcrumb) -->
      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="locale === 'ar' ? 'مسار التنقل' : 'Breadcrumb'">
          <ol class="flex items-center gap-2" role="list">
            <li x-text="t('appTitle')"></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li class="text-ink" x-text="t('navItems.' + active)"></li>
          </ol>
        </nav>
      </div>
    </header>

    <!-- ================= المحتوى الرئيسي — LND-04: إدارة الباقات ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">

      <!-- منطقة إعلان لقارئ الشاشة (عدد النتائج ونتائج الإجراءات) -->
      <p class="sr-only" aria-live="polite" x-text="liveMsg"></p>

      <!-- العنوان + إجراء الإضافة -->
      <section class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end sm:justify-between">
        <div class="min-w-0">
          <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="t('pl.title')"></h1>
          <p class="mt-1 text-sm text-muted sm:text-base" x-text="t('pl.subtitle')"></p>
        </div>
        <button type="button" id="add-plan-btn" class="btn btn-primary" @click="openAddModal()">
          <i class="fa-solid fa-plus" aria-hidden="true"></i>
          <span x-text="t('pl.addPlan')"></span>
        </button>
      </section>

      <!-- ================= بطاقات المؤشرات (KPIs) — محسوبة من الاشتراكات ================= -->
      <section :aria-label="t('pl.kpiLabel')" class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4 lg:grid-cols-4">
        <div class="panel p-4 sm:p-5">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="truncate text-sm font-bold text-muted" x-text="t('pl.kpiTotal')"></p>
              <p class="mt-2 text-2xl font-extrabold tabular-nums sm:text-3xl" x-text="fmtNum(totalPlans)"></p>
            </div>
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-primary-500/15 text-brand" aria-hidden="true"><i class="fa-solid fa-cubes"></i></span>
          </div>
        </div>
        <div class="panel p-4 sm:p-5">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="truncate text-sm font-bold text-muted" x-text="t('pl.kpiActive')"></p>
              <p class="mt-2 text-2xl font-extrabold tabular-nums sm:text-3xl" x-text="fmtNum(activePlansCount)"></p>
            </div>
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-success-500/15 text-success-700 dark:text-success-500" aria-hidden="true"><i class="fa-solid fa-circle-check"></i></span>
          </div>
        </div>
        <div class="panel p-4 sm:p-5">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="truncate text-sm font-bold text-muted" x-text="t('pl.kpiPopular')"></p>
              <p class="mt-2 truncate text-xl font-extrabold sm:text-2xl" x-text="mostPopularPlan ? planName(mostPopularPlan) : '—'"></p>
            </div>
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-accent-500/25 text-yellow-900 dark:text-accent-200" aria-hidden="true"><i class="fa-solid fa-star"></i></span>
          </div>
        </div>
        <div class="panel p-4 sm:p-5">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="truncate text-sm font-bold text-muted" x-text="t('pl.kpiSubscribers')"></p>
              <p class="mt-2 text-2xl font-extrabold tabular-nums sm:text-3xl" x-text="fmtNum(totalSubscribers)"></p>
              <p class="mt-1 text-xs text-muted" x-text="t('pl.kpiSubscribersHint')"></p>
            </div>
            <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-info-500/15 text-info-700 dark:text-blue-300" aria-hidden="true"><i class="fa-solid fa-building-columns"></i></span>
          </div>
        </div>
      </section>

      <!-- ================= شريط البحث والفلاتر وتبديل العرض ================= -->
      <section class="panel flex flex-col gap-3 p-4 lg:flex-row lg:items-center sm:p-5">
        <div class="relative min-w-0 flex-1">
          <label for="plan-search" class="sr-only" x-text="t('pl.searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-line-strong" aria-hidden="true"></i>
          <input id="plan-search" type="search" x-model.debounce.200ms="search" :placeholder="t('pl.searchPlaceholder')"
                 class="h-11 w-full min-w-0 rounded-xl border border-line bg-field ps-10 pe-3 text-sm text-ink placeholder:text-line-strong focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
        </div>

        <div class="relative w-full shrink-0 lg:w-48"
             x-data="selectDropdown({
               id: 'plan-status-filter',
               options: () => [
                 { value: 'all', label: t('pl.statusAll') },
                 { value: 'active', label: t('pl.statusActive') },
                 { value: 'inactive', label: t('pl.statusInactive') },
               ],
               get: () => statusFilter,
               set: (v) => statusFilter = v,
             })"
             @click.outside="closeList()">
          <span id="plan-status-filter-label" class="sr-only" x-text="t('pl.colStatus')"></span>
          <button type="button" id="plan-status-filter" x-ref="btn" role="combobox" aria-haspopup="listbox"
                  :aria-expanded="open.toString()" aria-controls="plan-status-filter-list" aria-labelledby="plan-status-filter-label plan-status-filter"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="plan-status-filter-list" role="listbox" aria-labelledby="plan-status-filter-label"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
        </div>

        <button type="button" class="btn btn-outline shrink-0" @click="resetFilters()" :disabled="!hasFilters">
          <i class="fa-solid fa-filter-circle-xmark text-muted" aria-hidden="true"></i>
          <span x-text="t('pl.resetFilters')"></span>
        </button>

        <div class="seg shrink-0" role="group" :aria-label="t('pl.viewSwitch')">
          <button type="button" class="seg-btn" :aria-pressed="(view === 'grid').toString()" @click="view = 'grid'" :aria-label="t('pl.viewGrid')">
            <i class="fa-solid fa-grip" aria-hidden="true"></i> <span class="hidden sm:inline" x-text="t('pl.viewGrid')"></span>
          </button>
          <button type="button" class="seg-btn" :aria-pressed="(view === 'table').toString()" @click="view = 'table'" :aria-label="t('pl.viewTable')">
            <i class="fa-solid fa-table-list" aria-hidden="true"></i> <span class="hidden sm:inline" x-text="t('pl.viewTable')"></span>
          </button>
        </div>
      </section>

      <!-- ================= عرض الكروت (Pricing Cards) — يُرسم عرض واحد فقط ================= -->
      <template x-if="view === 'grid' && visiblePlans.length">
        <section :aria-label="t('pl.gridLabel')">
          <ul class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-4" role="list">
            <template x-for="p in visiblePlans" :key="p.id">
              <li class="plan-card" :data-popular="isPopular(p)" :data-inactive="!p.is_active">
                <span x-show="isPopular(p)" class="badge badge-accent absolute -top-3 start-5 shadow-sm">
                  <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> <span x-text="t('pl.mostPopularBadge')"></span>
                </span>

                <div>
                  <div class="flex items-start justify-between gap-3">
                    <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl text-white" :style="'background:' + p.color" aria-hidden="true">
                      <i class="fa-solid fa-cube"></i>
                    </span>
                    <span class="badge" :class="p.is_active ? 'badge-success' : 'badge-muted'">
                      <span class="h-1.5 w-1.5 rounded-full bg-current" aria-hidden="true"></span>
                      <span x-text="p.is_active ? t('pl.statusActive') : t('pl.statusInactive')"></span>
                    </span>
                  </div>

                  <h2 class="mt-4 truncate text-lg font-extrabold text-ink" x-text="planName(p)"></h2>
                  <p class="text-xs font-bold uppercase tracking-wide text-muted" dir="ltr" x-text="p.code"></p>

                  <div class="mt-4">
                    <template x-if="p.price_monthly > 0">
                      <p class="flex flex-wrap items-baseline gap-1.5">
                        <span class="text-2xl font-extrabold text-ink tabular-nums" x-text="money(p.price_monthly)"></span>
                        <span class="text-xs text-muted" x-text="t('pl.perMonth')"></span>
                      </p>
                    </template>
                    <template x-if="p.price_monthly === 0">
                      <p class="text-3xl font-extrabold text-ink" x-text="t('pl.free')"></p>
                    </template>
                    <p class="mt-1 text-xs text-muted" x-show="p.price_yearly > 0">
                      <span x-text="money(p.price_yearly) + ' ' + t('pl.perYear')"></span>
                      <span class="badge badge-success ms-1" x-show="savePct(p) > 0" x-text="tf('pl.saveX', { pct: fmtPct(savePct(p)) })"></span>
                    </p>
                    <p class="mt-1 text-xs font-bold text-muted" x-show="p.trial_days > 0" x-text="tf('pl.trialDays', { n: fmtNum(p.trial_days) })"></p>
                    <p class="mt-2" x-show="p.price_change">
                      <span class="badge badge-info" x-text="priceChangeBadge(p)"></span>
                    </p>
                  </div>

                  <ul class="mt-4 space-y-2.5 border-t border-line pt-4 text-sm text-ink" role="list">
                    <li class="flex items-center gap-2.5"><i class="fa-solid fa-users w-4 text-brand" aria-hidden="true"></i>
                      <span class="text-muted" x-text="t('pl.cardUsers') + ':'"></span> <span class="font-bold tabular-nums" x-text="fmtLimit(p, 'max_users')"></span></li>
                    <li class="flex items-center gap-2.5"><i class="fa-solid fa-database w-4 text-brand" aria-hidden="true"></i>
                      <span class="text-muted" x-text="t('pl.cardStorage') + ':'"></span> <span class="font-bold" x-text="fmtLimit(p, 'max_storage_mb')"></span></li>
                    <li class="flex items-center gap-2.5"><i class="fa-solid fa-bolt w-4 text-brand" aria-hidden="true"></i>
                      <span class="text-muted" x-text="t('pl.cardAiQuota') + ':'"></span> <span class="font-bold" x-text="fmtLimit(p, 'ai_token_quota_monthly')"></span></li>
                    <li class="flex items-center gap-2.5"><i class="fa-solid fa-building-columns w-4 text-brand" aria-hidden="true"></i>
                      <span class="text-muted" x-text="t('pl.cardSubscribers') + ':'"></span> <span class="font-bold tabular-nums" x-text="fmtNum(p.subscribers)"></span></li>
                    <template x-for="(feat, fidx) in (p.features || [])" :key="p.id + '-' + fidx">
                      <li class="flex items-center gap-2.5"><i class="fa-solid fa-check w-4 text-success-700 dark:text-success-500" aria-hidden="true"></i>
                        <span class="font-bold" x-text="featText(feat)"></span></li>
                    </template>
                  </ul>
                </div>

                <div class="mt-5 flex items-center gap-2">
                  <button type="button" class="btn btn-outline btn-sm flex-1" @click="openEditModal(p)" :aria-label="tf('pl.aEdit', { name: planName(p) })">
                    <i class="fa-solid fa-pen" aria-hidden="true"></i> <span x-text="t('pl.cardEdit')"></span>
                  </button>
                  <button type="button" class="act group relative" @click="duplicatePlan(p)" :aria-label="tf('pl.aDuplicate', { name: planName(p) })">
                    <i class="fa-solid fa-copy" aria-hidden="true"></i>
                    <span class="tooltip-bubble" aria-hidden="true" x-text="t('pl.cardDuplicate')"></span><span class="tooltip-arrow" aria-hidden="true"></span>
                  </button>
                  <button type="button" class="act group relative" @click="toggleActive(p)"
                          :aria-label="tf(p.is_active ? 'pl.aDeactivate' : 'pl.aActivate', { name: planName(p) })">
                    <i class="fa-solid" :class="p.is_active ? 'fa-toggle-on text-brand' : 'fa-toggle-off text-muted'" aria-hidden="true"></i>
                    <span class="tooltip-bubble" aria-hidden="true" x-text="p.is_active ? t('pl.cardDeactivate') : t('pl.cardActivate')"></span><span class="tooltip-arrow" aria-hidden="true"></span>
                  </button>
                  <button type="button" class="act group relative !text-danger hover:!bg-error-500/10" @click="confirmDelete(p)" :aria-label="tf('pl.aDelete', { name: planName(p) })">
                    <i class="fa-solid fa-trash" aria-hidden="true"></i>
                    <span class="tooltip-bubble" aria-hidden="true" x-text="t('pl.cardDelete')"></span><span class="tooltip-arrow" aria-hidden="true"></span>
                  </button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </template>

      <!-- ================= عرض الجدول (Data Table) ================= -->
      <template x-if="view === 'table' && visiblePlans.length">
        <section class="panel overflow-hidden">
          <div class="table-scroll overflow-x-auto">
            <table class="w-full min-w-[1080px] border-collapse text-sm">
              <caption class="sr-only" x-text="t('pl.tableCaption')"></caption>
              <thead>
                <tr class="bg-soft text-ink">
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" :aria-sort="ariaSort('code')">
                    <button type="button" class="inline-flex items-center gap-1.5 hover:text-brand" @click="sortBy('code')">
                      <span x-text="t('pl.colCode')"></span> <i class="fa-solid text-[10px]" :class="sortIcon('code')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('pl.colName')"></th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" :aria-sort="ariaSort('max_users')">
                    <button type="button" class="inline-flex items-center gap-1.5 hover:text-brand" @click="sortBy('max_users')">
                      <span x-text="t('pl.colUsers')"></span> <i class="fa-solid text-[10px]" :class="sortIcon('max_users')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" :aria-sort="ariaSort('max_storage_mb')">
                    <button type="button" class="inline-flex items-center gap-1.5 hover:text-brand" @click="sortBy('max_storage_mb')">
                      <span x-text="t('pl.colStorage')"></span> <i class="fa-solid text-[10px]" :class="sortIcon('max_storage_mb')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('pl.colAiQuota')"></th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" :aria-sort="ariaSort('price_monthly')">
                    <button type="button" class="inline-flex items-center gap-1.5 hover:text-brand" @click="sortBy('price_monthly')">
                      <span x-text="t('pl.colPrice')"></span> <i class="fa-solid text-[10px]" :class="sortIcon('price_monthly')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('pl.colYearly')"></th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" :aria-sort="ariaSort('subscribers')">
                    <button type="button" class="inline-flex items-center gap-1.5 hover:text-brand" @click="sortBy('subscribers')">
                      <span x-text="t('pl.colSubscribers')"></span> <i class="fa-solid text-[10px]" :class="sortIcon('subscribers')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('pl.colStatus')"></th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('pl.colActions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-line">
                <template x-for="p in visiblePlans" :key="p.id">
                  <tr class="transition hover:bg-soft/50">
                    <td class="whitespace-nowrap px-4 py-3.5 align-middle font-mono text-xs font-bold text-brand" dir="ltr" x-text="p.code"></td>
                    <td class="px-4 py-3.5 align-middle">
                      <p class="font-bold leading-5 text-ink" x-text="planName(p)"></p>
                      <p class="mt-0.5 text-xs text-muted" x-text="planNameOther(p)"></p>
                      <span class="badge badge-info mt-1" x-show="p.price_change" x-text="priceChangeBadge(p)"></span>
                    </td>
                    <td class="whitespace-nowrap px-4 py-3.5 align-middle tabular-nums" x-text="fmtLimit(p, 'max_users')"></td>
                    <td class="whitespace-nowrap px-4 py-3.5 align-middle tabular-nums" x-text="fmtLimit(p, 'max_storage_mb')"></td>
                    <td class="whitespace-nowrap px-4 py-3.5 align-middle tabular-nums" x-text="fmtLimit(p, 'ai_token_quota_monthly')"></td>
                    <td class="whitespace-nowrap px-4 py-3.5 align-middle tabular-nums font-bold" x-text="p.price_monthly > 0 ? money(p.price_monthly) : t('pl.free')"></td>
                    <td class="whitespace-nowrap px-4 py-3.5 align-middle tabular-nums">
                      <span x-text="p.price_yearly > 0 ? money(p.price_yearly) : '—'"></span>
                      <span class="block text-xs font-bold text-success-700 dark:text-success-500" x-show="savePct(p) > 0" x-text="tf('pl.saveX', { pct: fmtPct(savePct(p)) })"></span>
                    </td>
                    <td class="whitespace-nowrap px-4 py-3.5 align-middle tabular-nums">
                      <span class="font-bold" x-text="fmtNum(p.subscribers)"></span>
                    </td>
                    <td class="px-4 py-3.5 align-middle">
                      <span class="badge" :class="p.is_active ? 'badge-success' : 'badge-muted'">
                        <span class="h-1.5 w-1.5 rounded-full bg-current" aria-hidden="true"></span>
                        <span x-text="p.is_active ? t('pl.statusActive') : t('pl.statusInactive')"></span>
                      </span>
                    </td>
                    <td class="px-4 py-3.5 align-middle">
                      <div class="flex items-center gap-1.5">
                        <button type="button" class="act group relative" @click="openEditModal(p)" :aria-label="tf('pl.aEdit', { name: planName(p) })">
                          <i class="fa-solid fa-pen" aria-hidden="true"></i>
                          <span class="tooltip-bubble" aria-hidden="true" x-text="t('pl.cardEdit')"></span><span class="tooltip-arrow" aria-hidden="true"></span>
                        </button>
                        <button type="button" class="act group relative" @click="duplicatePlan(p)" :aria-label="tf('pl.aDuplicate', { name: planName(p) })">
                          <i class="fa-solid fa-copy" aria-hidden="true"></i>
                          <span class="tooltip-bubble" aria-hidden="true" x-text="t('pl.cardDuplicate')"></span><span class="tooltip-arrow" aria-hidden="true"></span>
                        </button>
                        <button type="button" class="act group relative" @click="toggleActive(p)"

<!-- ==========================================================================

<div x-cloak x-show="modal === 'edit'" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4">

    <div class="min-h-0 flex-1 space-y-4 overflow-y-auto p-5">

          <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>

          </template>
        </ul>

      <!-- السياسة السعرية المسجّلة سابقًا -->

          <p id="pf-name-ar-err" class="err" x-show="showErr('name_ar')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="showErr('name_ar')"></span></p>
        </div>
        <div>
          <label for="pf-name-en" class="label"><span x-text="t('pl.fNameEn')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
          <input id="pf-name-en" type="text" x-model="form.name.en" dir="ltr" lang="en" aria-required="true" class="field"
                 :aria-invalid="(!!showErr('name_en')).toString()" :aria-describedby="showErr('name_en') ? 'pf-name-en-err' : null">
          <p id="pf-name-en-err" class="err" x-show="showErr('name_en')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="showErr('name_en')"></span></p>
        </div>
      </div>

      <div>

        </div>
        <div>
          <label for="pf-price-yearly" class="label" x-text="t('pl.fPriceYearly')"></label>
          <div class="relative rounded-xl" dir="ltr">
            <input id="pf-price-yearly" type="text" inputmode="decimal" x-model="form.price_yearly"

        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

          <p id="pf-trial-err" class="err" x-show="showErr('trial_days')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="showErr('trial_days')"></span></p>
        </div>
        <div>
          <label for="pf-sort-order" class="label" x-text="t('pl.fSortOrder')"></label>

          <p id="pf-sort-order-hint" class="hint" x-show="!showErr('sort_order')" x-text="t('pl.fSortOrderHint')"></p>
          <p id="pf-sort-order-err" class="err" x-show="showErr('sort_order')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="showErr('sort_order')"></span></p>
        </div>

      <!-- الحدود: عدد صحيح ≥ 0 أو «غير محدود» — ولا تقل عن أعلى استخدام حالي للمشتركين -->

          <div>
            <div class="mb-1.5 flex flex-wrap items-center justify-between gap-2">
              <label :for="lim.id" class="text-sm font-bold text-ink" x-text="t(lim.label)"></label>
              <label class="inline-flex items-center gap-2 text-xs font-bold text-muted">
                <input type="checkbox" class="h-4 w-4 rounded border-line-strong accent-primary-600" x-model="form.unl[lim.key]" :aria-label="tf('pl.unlimitedFor', { limit: t(lim.label) })">
                <span x-text="t('pl.unlimited')"></span>
              </label>
            </div>
            <div class="relative rounded-xl" dir="ltr">
              <input :id="lim.id" type="text" inputmode="numeric" x-model="form[lim.key]" :disabled="form.unl[lim.key]"

                     :aria-describedby="lim.id + (showErr(lim.key) ? '-err' : '-hint')">

          <template x-for="(feat, idx) in form.features" :key="feat.uid">

              <div class="grid min-w-0 flex-1 grid-cols-1 gap-2 sm:grid-cols-2">
                <input type="text" x-model="feat.ar" dir="rtl" lang="ar" class="field" :id="'pf-feat-' + idx + '-ar'"

              <button type="button" class="act group relative !text-danger hover:!bg-error-500/10" @click="removeFeature(idx)" :aria-label="tf('pl.removeFeatureN', { n: idx + 1 })">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                <span class="tooltip-bubble" aria-hidden="true" x-text="t('pl.removeFeature')"></span><span class="tooltip-arrow" aria-hidden="true"></span>
              </button>
            </div>
          </template>
          <p id="pf-features-err" class="err" x-show="showErr('features')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="showErr('features')"></span></p>

          </button>

      <div>
        <label class="switch">

          <span class="switch-track" aria-hidden="true"></span>
          <span x-text="t('pl.fActive')"></span>
        </label>
        <p id="pf-active-note" class="hint" x-text="form.is_active ? t('pl.fActiveOnHint') : tf('pl.fActiveOffHint', { n: fmtNum(editingPlan ? editingPlan.subscribers : 0) })"></p>
      </div>
    </div>

    <footer class="flex shrink-0 items-center justify-end gap-3 border-t border-line bg-page/40 p-4">

      <button type="button" class="btn btn-outline" :disabled="busy" @click="requestCloseEdit()" x-text="t('pl.cancel')"></button>

        <span x-text="t('pl.save')"></span>

<!-- ==========================================================================

<div x-cloak x-show="modal === 'restrict'" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4">
  <div class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closeModal()" aria-hidden="true"></div>
  <div x-show="modal === 'restrict'" x-trap.noscroll="modal === 'restrict'" role="alertdialog" aria-modal="true"
       aria-labelledby="rm-title" aria-describedby="rm-desc" @keydown.escape.stop="closeModal()"
       x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="opacity-0 scale-95"
       class="relative w-full max-w-md rounded-2xl border border-line bg-card p-6 text-center shadow-pop">
    <span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-accent-500/25 text-yellow-900 dark:text-accent-200" aria-hidden="true"><i class="fa-solid fa-lock text-xl"></i></span>
    <h3 id="rm-title" class="mt-4 text-lg font-extrabold text-ink" x-text="t('pl.restrictTitle')"></h3>
    <p id="rm-desc" class="mt-2 text-sm text-muted" x-text="restrictText"></p>

    <p class="mt-4 rounded-xl border border-line bg-page/50 p-3.5 text-start text-xs font-bold text-muted"
       x-text="target && target.is_active ? t('pl.restrictDeactivateHint') : t('pl.restrictAlreadyInactive')"></p>

    <div class="mt-6 flex flex-col justify-center gap-2.5">
      <button type="button" x-show="target && target.is_active" class="btn btn-accent w-full" @click="openDeactivate(target, true)">
        <i class="fa-solid fa-toggle-off" aria-hidden="true"></i> <span x-text="t('pl.restrictDeactivateBtn')"></span>
      </button>
      <button type="button" class="btn btn-outline w-full" @click="closeModal()" x-text="t('pl.restrictClose')"></button>
    </div>
  </div>
</div>

<!-- ==========================================================================
     نافذة — تأكيد تعطيل الباقة (مع بيان الأثر)
     ========================================================================== -->
<div x-cloak x-show="modal === 'deactivate'" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4">
  <div class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closeModal()" aria-hidden="true"></div>
  <div x-show="modal === 'deactivate'" x-trap.noscroll="modal === 'deactivate'" role="alertdialog" aria-modal="true"
       aria-labelledby="da-title" aria-describedby="da-desc" @keydown.escape.stop="closeModal()"
       class="relative w-full max-w-md rounded-2xl border border-line bg-card p-6 text-center shadow-pop">
    <span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-warning-500/15 text-warning-700 dark:text-warning-500" aria-hidden="true"><i class="fa-solid fa-toggle-off text-xl"></i></span>
    <h3 id="da-title" class="mt-4 text-lg font-extrabold text-ink" x-text="t('pl.deactTitle')"></h3>
    <div id="da-desc" class="mt-2 space-y-2 text-sm text-muted">
      <p class="font-bold text-ink" x-text="target ? planName(target) : ''"></p>
      <ul class="space-y-1.5 rounded-xl border border-line bg-page/50 p-3.5 text-start text-xs font-bold" role="list">
        <li class="flex gap-2"><i class="fa-solid fa-eye-slash mt-0.5 w-4 text-warning-700 dark:text-warning-500" aria-hidden="true"></i> <span x-text="t('pl.deactImpactHidden')"></span></li>
        <li class="flex gap-2"><i class="fa-solid fa-user-check mt-0.5 w-4 text-success-700 dark:text-success-500" aria-hidden="true"></i> <span x-text="tf('pl.deactImpactKept', { n: fmtNum(target ? target.subscribers : 0) })"></span></li>
      </ul>
    </div>
    <div class="mt-6 flex justify-center gap-3">
      <button type="button" class="btn btn-outline" :disabled="busy" @click="closeModal()" x-text="t('pl.cancel')"></button>
      <button type="button" class="btn btn-accent" :disabled="busy" :aria-busy="busy.toString()" @click="deactivateConfirmed()">
        <i class="fa-solid animate-spin fa-circle-notch" x-show="busy" aria-hidden="true"></i>
        <span x-text="t('pl.deactConfirm')"></span>
      </button>
    </div>
  </div>
</div>

<!-- ==========================================================================
     نافذة — تأكيد حذف الباقة (فقط إن لم ترتبط بأي اشتراك)
     ========================================================================== -->
<div x-cloak x-show="modal === 'delete'" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4">
  <div class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closeModal()" aria-hidden="true"></div>
  <div x-show="modal === 'delete'" x-trap.noscroll="modal === 'delete'" role="alertdialog" aria-modal="true"
       aria-labelledby="dm-title" aria-describedby="dm-desc" @keydown.escape.stop="closeModal()"
       x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="opacity-0 scale-95"
       class="relative w-full max-w-sm rounded-2xl border border-line bg-card p-6 text-center shadow-pop">
    <span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-error-100 text-error-700" aria-hidden="true"><i class="fa-solid fa-trash text-xl"></i></span>
    <h3 id="dm-title" class="mt-4 text-lg font-extrabold text-ink" x-text="t('pl.delTitle')"></h3>
    <p id="dm-desc" class="mt-2 text-sm text-muted" x-text="target ? tf('pl.delText', { name: planName(target) }) : ''"></p>
    <div class="mt-6 flex justify-center gap-3">
      <button type="button" class="btn btn-outline" :disabled="busy" @click="closeModal()" x-text="t('pl.delCancel')"></button>
      <button type="button" class="btn btn-danger" :disabled="busy" :aria-busy="busy.toString()" @click="deleteConfirmed()">
        <i class="fa-solid animate-spin fa-circle-notch" x-show="busy" aria-hidden="true"></i>
        <span x-text="t('pl.delConfirm')"></span>
      </button>
    </div>
  </div>
</div>

  /* قائمة اختيار مخصّصة (Combobox) — Home/End، بحث بالكتابة، Tab يغلق، Escape لا يتسرّب */
  function selectDropdown({ id, options, get, set, placeholder = '' }) {
    return {
      id, open: false, active: -1, typed: '', typedAt: 0,
      get items() { return options(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { const sel = this.selectedItem; return sel ? sel.label : (typeof placeholder === 'function' ? placeholder() : placeholder); },
      optId(item) { return this.id + '-opt-' + item.value; },
      openList() {
        if (!this.items.length) return;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item) { set(item.value); this.closeList(); this.$refs.btn?.focus(); },
      setActive(i) { this.active = Math.min(Math.max(i, 0), this.items.length - 1); this.scrollActiveIntoView(); },
      move(step) { if (!this.open) { this.openList(); return; } this.setActive(this.active + step); },
      onKey(e) {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); if (e.altKey && this.open && k === 'ArrowUp') { this.choose(this.items[this.active]); return; } this.move(k === 'ArrowDown' ? 1 : -1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.setActive(0); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.setActive(this.items.length - 1); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); (this.open && this.active > -1) ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape') { if (this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); } }
        else if (k === 'Tab') { if (this.open) this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          const now = Date.now();
          this.typed = (now - this.typedAt > 600 ? '' : this.typed) + k.toLowerCase();
          this.typedAt = now;
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this.typed));
          if (i > -1) { if (!this.open) this.openList(); this.setActive(i); }
        }
      },
      // children[0] هو <template x-for> — لذا +1
      scrollActiveIntoView() { this.$nextTick(() => this.$refs.list?.children[this.active + 1]?.scrollIntoView({ block: 'nearest' })); },
      isSelected(item) { const sel = this.selectedItem; return !!sel && sel.value === item.value; },
    };
