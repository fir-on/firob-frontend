    /* سجل نشاط أولي مشتق من بيانات SA (ثنائي اللغة عبر مفاتيح الترجمة) */
    let seq = 0;
    const seedActivity = (t, subs) => {
      const list = [{ type: 'created', at: t.created_at, by: 'system', vars: {}, seq: ++seq }];
      subs.filter(s => s.tenant_id === t.id).sort((a, b) => (a.starts_at < b.starts_at ? -1 : 1)).forEach(s => {
        list.push({ type: 'subStarted', at: s.starts_at, by: 'system', vars: { plan: SA.plan(s.plan_id).name }, seq: ++seq });
        if (s.status === 'past_due') list.push({ type: 'pastDue', at: s.ends_at < SA.todayIso() ? s.ends_at : SA.todayIso(), by: 'system', vars: {}, seq: ++seq });
      });
      return list;
    };

    return {
      /* ---------- حالة عامة ---------- */
      dark: document.documentElement.classList.contains('dark'),
      locale: document.documentElement.lang === 'en' ? 'en' : 'ar',
      mobile: !desktopMQ.matches,
      wide: desktopMQ.matches,
      mobileNav: false,
      collapsed: false,
      notifOpen: false, profileOpen: false,
      active: 'tenants',
      liveMsg: '',
      DOMAIN_SUFFIX,
      get expanded() { return this.mobile || !this.collapsed; },

      /* ---------- الترجمة ---------- */
      t(path) {
        const dict = I18N[this.locale];
        return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), dict) ?? path;
      },
      tf(path, vars) {
        let s = this.t(path);
        Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
        return s;
      },
      setLocale(loc) {
        this.locale = loc;
        document.documentElement.lang = loc;
        document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
        document.title = this.t('tn.docTitle');
        try { localStorage.setItem('firob-locale', loc); } catch (e) {}
      },
      toggleLocale() { this.setLocale(this.locale === 'ar' ? 'en' : 'ar'); },
      fmtDate(iso) { return SA.fmtDate(iso, this.locale); },
      fmtNum(n, opts) { return new Intl.NumberFormat(SA.fmtLocale(this.locale), opts).format(n || 0); },
      money(minor) { return SA.money(minor, this.locale); },
      countryName(c) { return this.t('countries.' + c) === 'countries.' + c ? c : this.t('countries.' + c); },
      announce(msg) { this.liveMsg = ''; this.$nextTick(() => { this.liveMsg = msg; }); },

      /* ---------- التنقل ---------- */
      nav: [
        { group: 'overview', items: [
          { key: 'dashboard', icon: 'fa-solid fa-gauge-high', href: 'overview.html' },
          { key: 'aiAnalytics', icon: 'fa-solid fa-robot', href: 'ai-analytics.html' },
        ]},
        { group: 'admin', items: [
          { key: 'tenants', icon: 'fa-solid fa-building-columns', href: 'tenants.html' },
          { key: 'plans', icon: 'fa-solid fa-cubes', href: 'plans.html' },
          { key: 'subscriptions', icon: 'fa-solid fa-layer-group', href: 'subscriptions.html' },
          { key: 'payments', icon: 'fa-solid fa-file-invoice-dollar', href: 'payments.html' },
        ]},
        { group: 'system', items: [
          { key: 'activityLog', icon: 'fa-solid fa-clock-rotate-left', href: 'activity-log.html' },
          { key: 'systemSettings', icon: 'fa-solid fa-sliders', href: 'system-settings.html' },
        ]},
      ],
      setActive(key) { this.active = key; this.mobileNav = false; },

      /* ---------- الإشعارات (شريط علوي عام) ---------- */
      notifications: [
        { id: 1, key: 'upload', time: '5m', read: false, icon: 'fa-solid fa-upload', tone: 'bg-primary-500/15 text-brand' },
        { id: 2, key: 'quota', time: '1h', read: false, icon: 'fa-solid fa-triangle-exclamation', tone: 'bg-warning-500/15 text-warning-700 dark:text-warning-500' },
        { id: 3, key: 'backup', time: '6h', read: true, icon: 'fa-solid fa-database', tone: 'bg-success-500/15 text-success-700 dark:text-success-500' },
      ],
      get unread() { return this.notifications.filter(n => !n.read).length; },

      /* ---------- البيانات: نسخة عميقة من SA ---------- */
      tenants: [], subs: [],
      subOf(tid) {
        const list = this.subs.filter(s => s.tenant_id === tid).sort((a, b) => (a.starts_at < b.starts_at ? 1 : -1));
        return list.find(s => !['cancelled', 'expired'].includes(s.status)) || list[0] || null;
      },
      rowOf(t) {
        const sub = this.subOf(t.id);
        const plan = sub ? SA.plan(sub.plan_id) : null;
        const name = t.name[this.locale] || t.name.ar;
        const words = name.replace(/^(د|أ|م)\.\s*/, '').split(/\s+/).filter(Boolean);
        return {
          id: t.id, name, domain: t.domain, color: t.color, status: t.status, created_at: t.created_at, country: t.country,
          initials: (words.length > 1 ? words[0][0] + words[1][0] : (words[0] || '?').slice(0, 2)).toUpperCase(),
          contactName: t.contact.name ? (t.contact.name[this.locale] || t.contact.name.ar) : '',
          email: t.contact.email, phone: t.contact.phone,
          sub, plan, activity: (t.activity || []).slice().sort((a, b) => (a.at === b.at ? b.seq - a.seq : (a.at < b.at ? 1 : -1))),
        };
      },
      get rows() { return this.tenants.map(t => this.rowOf(t)); },
      tenantById(id) { return this.tenants.find(t => t.id === id) || null; },

      /* ---------- البحث والفلاتر والترتيب ---------- */
      search: '', statusFilter: 'all', planFilter: 'all',
      sortKey: 'created', sortDir: 'desc',
      page: 1, pageSize: 8,
      get statusOptions() {
        return [{ value: 'all', label: this.t('tn.statusAll') }]
          .concat(['active', 'trial', 'suspended', 'inactive'].map(s => ({ value: s, label: this.t('tn.status.' + s) })));
      },
      get planFilterOptions() {
        return [{ value: 'all', label: this.t('tn.planAll') }]
          .concat(SA.PLANS.slice().sort((a, b) => a.sort_order - b.sort_order).map(p => ({ value: String(p.id), label: p.name[this.locale] })));
      },
      get planFormOptions() {
        return SA.PLANS.filter(p => p.is_active).map(p => ({ value: p.id, label: p.name[this.locale] + ' — ' + this.money(p.price_monthly) }));
      },
      get filtersActive() { return !!this.search.trim() || this.statusFilter !== 'all' || this.planFilter !== 'all'; },
      sortValue(r, k) {
        if (k === 'name') return r.name;
        if (k === 'plan') return r.plan ? r.plan.price_monthly : -1;
        if (k === 'users') return r.plan ? r.sub.usage.usersUsed / r.plan.max_users : -1;
        return r.created_at;
      },
      get filteredTenants() {
        const q = norm(this.search);
        const coll = new Intl.Collator(SA.fmtLocale(this.locale));
        const t0 = this.tenants;
        const list = this.rows.filter(r => {
          const src = t0.find(t => t.id === r.id);
          const hay = norm([src.name.ar, src.name.en, r.domain, r.email, src.contact.name?.ar, src.contact.name?.en].join(' '));
          return (!q || hay.includes(q))
            && (this.statusFilter === 'all' || r.status === this.statusFilter)
            && (this.planFilter === 'all' || (r.plan && String(r.plan.id) === this.planFilter));
        });
        const dir = this.sortDir === 'asc' ? 1 : -1, k = this.sortKey;
        return list.sort((a, b) => {
          const va = this.sortValue(a, k), vb = this.sortValue(b, k);
          const c = typeof va === 'string' ? coll.compare(va, vb) : va - vb;
          return (c || coll.compare(a.name, b.name)) * dir;
        });
      },
      sortBy(k) {
        if (this.sortKey === k) this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
        else { this.sortKey = k; this.sortDir = k === 'name' ? 'asc' : 'desc'; }
        this.page = 1;
        this.announce(this.t('tn.sortKeys.' + k) + ' — ' + (this.sortDir === 'asc' ? this.t('tn.sortedAsc') : this.t('tn.sortedDesc')));
      },
      ariaSort(k) { return this.sortKey === k ? (this.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'; },
      sortIcon(k) { return this.sortKey !== k ? 'fa-sort' : (this.sortDir === 'asc' ? 'fa-sort-up' : 'fa-sort-down'); },
      resetFilters() {
        this.search = ''; this.statusFilter = 'all'; this.planFilter = 'all'; this.page = 1;
        this.announceCount();
        this.$nextTick(() => document.getElementById('tenant-search')?.focus());
      },
      announceCount() {
        const n = this.filteredTenants.length;
        this.announce(n ? this.tf('tn.liveCount', { n: this.fmtNum(n) }) : this.t('tn.liveNone'));
      },
      get countText() { return this.tf('tn.countN', { n: this.fmtNum(this.filteredTenants.length) }); },
      get tableCaption() { return this.t('tn.tableCaption'); },

      /* ---------- ترقيم الصفحات ---------- */
      get totalPages() { return Math.max(1, Math.ceil(this.filteredTenants.length / this.pageSize)); },
      get pagedTenants() { const s = (this.page - 1) * this.pageSize; return this.filteredTenants.slice(s, s + this.pageSize); },
      get rangeText() {
        const total = this.filteredTenants.length;
        return this.tf('tn.range', { from: this.fmtNum(total ? (this.page - 1) * this.pageSize + 1 : 0), to: this.fmtNum(Math.min(this.page * this.pageSize, total)), total: this.fmtNum(total) });
      },
      pageNumbers() {
        const total = this.totalPages, current = this.page;
        if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
        const pages = [1], start = Math.max(2, current - 1), end = Math.min(total - 1, current + 1);
        if (start > 2) pages.push('...');
        for (let p = start; p <= end; p++) pages.push(p);
        if (end < total - 1) pages.push('...');
        pages.push(total);
        return pages;
      },
      goToPage(p) { if (p < 1 || p > this.totalPages) return; this.page = p; },
      clampPage() { this.page = Math.min(Math.max(1, this.page), this.totalPages); },

      /* ---------- مساعدات العرض ---------- */
      planBadgeClass(p) { return { trial: 'badge-info', basic: 'badge-muted', pro: 'badge-primary', enterprise: 'badge-accent', legacy: 'badge-neutral' }[p && p.code] || 'badge-muted'; },
      statusClass(s) { return { active: 'badge-success', trial: 'badge-info', suspended: 'badge-accent', inactive: 'badge-muted' }[s] || 'badge-muted'; },
      subStatusClass(s) { return { active: 'text-success-700 dark:text-success-500', trialing: 'text-info-700 dark:text-blue-300', past_due: 'text-danger', paused: 'text-yellow-900 dark:text-accent-500' }[s] || 'text-muted'; },
      endsLabel(sub) {
        const k = sub.ends_at < SA.todayIso() ? 'ended' : sub.status === 'trialing' ? 'trialEnds' : (sub.auto_renew && sub.status === 'active') ? 'renews' : 'ends';
        return this.t('tn.ends.' + k);
      },
      endsClass(sub) {
        const d = SA.daysBetween(SA.todayIso(), sub.ends_at);
        return d < 0 ? 'text-danger' : d <= 7 ? 'text-yellow-900 dark:text-accent-500' : 'text-ink';
      },
      quotas(r, withAi) {
        if (!r || !r.plan || !r.sub) return [];
        const u = r.sub.usage, p = r.plan, loc = this;
        const gb = (mb) => loc.fmtNum(mb / 1024, { maximumFractionDigits: 1 }) + ' ' + loc.t('tn.gb');
        const mk = (key, used, limit, fmt) => {
          const pct = limit ? Math.min(100, Math.round(used / limit * 100)) : 0;
          const text = fmt(used) + ' / ' + fmt(limit);
          return { key, label: this.t('tn.quota.' + key), pct, text, valueText: this.tf('tn.quotaValue', { used: fmt(used), limit: fmt(limit), pct: this.fmtNum(pct) }) };
        };
        const list = [mk('users', u.usersUsed, p.max_users, (n) => this.fmtNum(n)), mk('storage', u.storageUsedMb, p.max_storage_mb, gb)];
        if (withAi) list.push(mk('ai', u.aiTokensUsed, p.ai_token_quota_monthly, (n) => this.fmtNum(n)));
        return list;
      },
      quotaBarClass(pct) { return pct >= 100 ? 'bg-error-600' : pct > 80 ? 'bg-accent-500' : 'bg-primary-500'; },
      quotaTextClass(pct) { return pct >= 100 ? 'text-error-700 dark:text-red-300' : pct > 80 ? 'text-yellow-900 dark:text-accent-500' : 'text-muted'; },
      suspendKey(r) { return r.status === 'suspended' ? 'reactivate' : 'suspend'; },
      actionLabel(key, r) { return this.tf('tn.actionFor', { action: this.t('tn.' + key), name: r.name }); },
      activityIcon(type) {
        return { created: 'fa-solid fa-building-circle-check', subStarted: 'fa-solid fa-layer-group', pastDue: 'fa-solid fa-file-invoice-dollar',
                 suspended: 'fa-solid fa-circle-pause', reactivated: 'fa-solid fa-circle-play', undo: 'fa-solid fa-rotate-left',
                 edited: 'fa-solid fa-pen', impersonate: 'fa-solid fa-user-secret' }[type] || 'fa-solid fa-circle-info';
      },
      activityText(a) {
        const vars = {};
        Object.keys(a.vars || {}).forEach(k => {
          const v = a.vars[k];
          vars[k] = v && typeof v === 'object' ? (v[this.locale] || v.ar) : (k === 'status' ? this.t('tn.status.' + v) : v);
        });
        return this.tf('tn.act.' + a.type, vars);
      },
      log(t, type, vars) { t.activity = t.activity || []; t.activity.push({ type, vars: vars || {}, at: SA.todayIso(), by: 'Super Admin', seq: ++seq }); },

      /* ---------- إدارة التركيز ---------- */
      opener: null, soOpener: null,
      remember() { const el = document.activeElement; return el && el !== document.body ? el : null; },
      restore(el, fallbackId) {
        this.$nextTick(() => {
          if (el && el.isConnected && typeof el.focus === 'function') el.focus();
          else document.getElementById(fallbackId)?.focus();
        });
      },

      /* ---------- اللوحة الجانبية + التبويبات ---------- */
      soOpen: false, selectedId: null, activeTab: 'overview',
      tabs: ['overview', 'subscription', 'activity'],
      get selected() { const t = this.selectedId && this.tenantById(this.selectedId); return t ? this.rowOf(t) : null; },
      openDetails(id) {
        this.soOpener = this.remember();
        this.selectedId = id; this.activeTab = 'overview'; this.soOpen = true;
      },
      closeDetails() {
        if (!this.soOpen) return;
        this.soOpen = false;
        this.restore(this.soOpener, 'tenants-heading');
      },
      selectTab(tab, focus) {
        this.activeTab = tab;
        if (focus) this.$nextTick(() => document.getElementById('so-tab-' + tab)?.focus());
      },
      onTabKey(e) {
        const i = this.tabs.indexOf(this.activeTab), n = this.tabs.length;
        const rtl = this.locale === 'ar';
        let j = null;
        if (e.key === 'ArrowRight') j = rtl ? i - 1 : i + 1;
        else if (e.key === 'ArrowLeft') j = rtl ? i + 1 : i - 1;
        else if (e.key === 'Home') j = 0;
        else if (e.key === 'End') j = n - 1;
        if (j === null) return;
        e.preventDefault();
        this.selectTab(this.tabs[(j + n) % n], true);
      },

      /* ---------- النوافذ ---------- */
      modal: null, busy: false,
      openModal(name) { this.opener = this.remember(); this.modal = name; },
      closeModal() {
        if (this.busy || !this.modal) return;
        this.modal = null;
        this.restore(this.opener, this.soOpen ? 'so-title' : 'tenants-heading');
      },
      wait(ms) { return new Promise(r => setTimeout(r, ms)); },

      /* ---------- إضافة / تعديل ---------- */
      form: { mode: 'create', id: null, nameAr: '', nameEn: '', sub: '', contact: '', email: '', phone: '', planId: null },
      formSubmitted: false, touched: {},
      openAdd() {
        this.form = { mode: 'create', id: null, nameAr: '', nameEn: '', sub: '', contact: '', email: '', phone: '', planId: null };
        this.formSubmitted = false; this.touched = {};
        this.openModal('form');
        this.$nextTick(() => document.getElementById('f-name-ar')?.focus());
      },
      openEdit(id) {
        const t = this.tenantById(id); if (!t) return;
        this.form = {
          mode: 'edit', id, nameAr: t.name.ar, nameEn: t.name.en,
          sub: t.domain.toLowerCase().endsWith(DOMAIN_SUFFIX) ? t.domain.slice(0, -DOMAIN_SUFFIX.length) : t.domain,
          contact: t.contact.name ? (t.contact.name[this.locale] || t.contact.name.ar) : '', email: t.contact.email, phone: t.contact.phone || '', planId: null,
        };
        this.formSubmitted = false; this.touched = {};
        this.openModal('form');
        this.$nextTick(() => document.getElementById('f-name-ar')?.focus());
      },
      get editPlanName() { const s = this.form.id && this.subOf(this.form.id); return s ? SA.plan(s.plan_id).name[this.locale] : this.t('tn.noSubscription'); },
      touch(k) { this.touched = Object.assign({}, this.touched, { [k]: true }); },
      subNorm() { return (this.form.sub || '').trim().replace(/\.firob\.sa$/i, ''); },
      get formErrors() {
        const f = this.form, e = {};
        if (!f.nameAr.trim()) e.nameAr = this.t('tn.err.nameAr');
        if (!f.nameEn.trim()) e.nameEn = this.t('tn.err.nameEn');
        const sub = this.subNorm();
        if (!sub) e.sub = this.t('tn.err.subReq');
        else if (!SUB_RE.test(sub) || sub.includes('--')) e.sub = this.t('tn.err.subPattern');
        else if (RESERVED.includes(sub.toLowerCase())) e.sub = this.t('tn.err.subReserved');
        else if (this.tenants.some(t => t.id !== f.id && t.domain.toLowerCase() === (sub + DOMAIN_SUFFIX).toLowerCase())) e.sub = this.t('tn.err.subTaken');
        const email = f.email.trim();
        if (!email) e.email = this.t('tn.err.emailReq');
        else if (!EMAIL_RE.test(email)) e.email = this.t('tn.err.emailPattern');
        const phone = f.phone.trim();
        if (phone) { const digits = phone.replace(/\D/g, '').length; if (!PHONE_RE.test(phone) || digits < 7 || digits > 15) e.phone = this.t('tn.err.phonePattern'); }
        if (f.mode === 'create' && !SA.PLANS.some(p => p.is_active && p.id === f.planId)) e.plan = this.t('tn.err.planReq');
        return e;
      },
      get formErrorList() {
        const ids = { nameAr: 'f-name-ar', nameEn: 'f-name-en', sub: 'f-sub', email: 'f-email', phone: 'f-phone', plan: 'f-plan' };
        const e = this.formErrors;
        return Object.keys(ids).filter(k => e[k]).map(k => ({ key: k, id: ids[k], msg: e[k] }));
      },
      showErr(k) { return (this.formSubmitted || this.touched[k]) ? (this.formErrors[k] || '') : ''; },
      focusField(id) { document.getElementById(id)?.focus(); },
      async saveForm() {
        if (this.busy) return false;
        this.formSubmitted = true;
        const errs = this.formErrorList;
        if (errs.length) {
          this.announce(this.tf('tn.errorsLive', { n: this.fmtNum(errs.length) }));
          this.$nextTick(() => document.getElementById('fm-errors')?.focus());
          return false;
        }
        this.busy = true;
        await this.wait(250);
        const f = this.form, domain = this.subNorm().toLowerCase() + DOMAIN_SUFFIX;
        let t;
        if (f.mode === 'edit') {
          t = this.tenantById(f.id);
          t.name = { ar: f.nameAr.trim(), en: f.nameEn.trim() };
          t.domain = domain;
          t.contact = Object.assign({}, t.contact, { email: f.email.trim(), phone: f.phone.trim(), name: f.contact.trim() ? { ar: f.contact.trim(), en: f.contact.trim() } : null });
          this.log(t, 'edited');
        } else {
          const plan = SA.plan(f.planId);
          const nextNum = Math.max(0, ...this.tenants.map(x => parseInt(String(x.id).slice(1), 10) || 0)) + 1;
          const nextSub = Math.max(1000, ...this.subs.map(s => s.id)) + 1;
          t = { id: 't' + nextNum, name: { ar: f.nameAr.trim(), en: f.nameEn.trim() }, domain, color: '#0E80A1', created_at: SA.todayIso(),
                status: plan.trial_days ? 'trial' : 'active', country: 'SA',
                contact: { name: f.contact.trim() ? { ar: f.contact.trim(), en: f.contact.trim() } : null, email: f.email.trim(), phone: f.phone.trim() }, activity: [] };
          this.subs.push({ id: nextSub, tenant_id: t.id, plan_id: plan.id, status: plan.trial_days ? 'trialing' : 'active', auto_renew: !plan.trial_days,
                           starts_at: SA.todayIso(), ends_at: SA.addDays(plan.trial_days || 30), cancelled_at: null, cancel_reason: null, scheduledPlanId: null,
                           usage: { usersUsed: 0, storageUsedMb: 0, aiTokensUsed: 0 } });
          t.activity = seedActivity(t, this.subs);
          this.tenants.push(t);
          this.page = 1;
        }
        this.busy = false;
        const msg = this.tf(f.mode === 'edit' ? 'tn.doneEdit' : 'tn.doneCreate', { name: t.name[this.locale] });
        this.modal = null;
        this.restore(this.opener, 'tenants-heading');
        this.formSubmitted = false;
        this.toast(msg);
        this.announce(msg);
        return true;
      },

      /* ---------- تعليق / إعادة تفعيل مع تراجع ---------- */
      statusTargetId: null, statusMode: 'suspend', statusReason: '', statusSubmitted: false,
      get statusTarget() { const t = this.statusTargetId && this.tenantById(this.statusTargetId); return t ? this.rowOf(t) : null; },
      reactivateTo(id) { const s = this.subOf(id); return ({ trialing: 'trial', cancelled: 'inactive', expired: 'inactive' })[s && s.status] || 'active'; },
      openStatus(id) {
        const t = this.tenantById(id); if (!t || t.status === 'inactive') return;
        this.statusTargetId = id; this.statusMode = t.status === 'suspended' ? 'reactivate' : 'suspend';
        this.statusReason = ''; this.statusSubmitted = false;
        this.openModal('status');
        this.$nextTick(() => document.getElementById('st-reason')?.focus());
      },
      get statusImpact() {
        const r = this.statusTarget; if (!r) return [];
        const n = this.fmtNum(r.sub ? r.sub.usage.usersUsed : 0);
        return this.statusMode === 'suspend'
          ? [this.tf('tn.impactSuspendUsers', { n }), this.tf('tn.impactSuspendDomain', { domain: r.domain }), this.t('tn.impactSuspendBilling')]
          : [this.tf('tn.impactReactUsers', { n }), this.tf('tn.impactReactStatus', { status: this.t('tn.status.' + this.reactivateTo(r.id)) })];
      },
      get statusReasonErr() { return this.statusSubmitted && this.statusReason.trim().length < 5 ? this.t('tn.err.reason') : ''; },
      async confirmStatus() {
        if (this.busy) return false;
        this.statusSubmitted = true;
        if (this.statusReasonErr) { this.$nextTick(() => document.getElementById('st-reason')?.focus()); this.announce(this.statusReasonErr); return false; }
        const t = this.tenantById(this.statusTargetId); if (!t) return false;
        this.busy = true;
        await this.wait(250);
        const prev = t.status, mode = this.statusMode;
        t.status = mode === 'suspend' ? 'suspended' : this.reactivateTo(t.id);
        this.log(t, mode === 'suspend' ? 'suspended' : 'reactivated', { reason: this.statusReason.trim() });
        this.busy = false;
        this.modal = null;
        this.restore(this.opener, 'tenants-heading');
        const msg = this.tf(mode === 'suspend' ? 'tn.doneSuspend' : 'tn.doneReactivate', { name: t.name[this.locale] });
        this.announce(msg);
        this.showUndo(msg, () => {
          const cur = this.tenantById(t.id); if (!cur) return;
          cur.status = prev;
          this.log(cur, 'undo', { status: prev });
          this.announce(this.tf('tn.doneUndo', { name: cur.name[this.locale], status: this.t('tn.status.' + prev) }));
        });
        return true;
      },
      undoState: null, undoTimer: null,
      showUndo(msg, fn) {
        clearTimeout(this.undoTimer);
        this.undoState = { msg, fn };
        this.undoTimer = setTimeout(() => { this.undoState = null; }, 10000);
      },
      pauseUndo() { clearTimeout(this.undoTimer); },
      runUndo() { const u = this.undoState; this.dismissUndo(); if (u) u.fn(); },
      dismissUndo() { clearTimeout(this.undoTimer); this.undoState = null; },

      /* ---------- الحذف (كتابة النطاق للتأكيد) ---------- */
      deleteTargetId: null, deleteConfirmText: '', deleteSubmitted: false,
      get deleteTarget() { const t = this.deleteTargetId && this.tenantById(this.deleteTargetId); return t ? this.rowOf(t) : null; },
      openDelete(id) {
        if (!this.tenantById(id)) return;
        this.deleteTargetId = id; this.deleteConfirmText = ''; this.deleteSubmitted = false;
        this.openModal('delete');
        this.$nextTick(() => document.getElementById('dm-confirm')?.focus());
      },
      get canDelete() { return !!this.deleteTarget && this.deleteConfirmText.trim() === this.deleteTarget.domain; },
      get deleteErr() { return this.deleteSubmitted && !this.canDelete ? this.t('tn.err.delMismatch') : ''; },
      get deleteImpact() {
        const r = this.deleteTarget; if (!r) return [];
        return [this.tf('tn.delImpactUsers', { n: this.fmtNum(r.sub ? r.sub.usage.usersUsed : 0) }),
                this.tf('tn.delImpactSubs', { n: this.fmtNum(this.subs.filter(s => s.tenant_id === r.id).length) }),
                this.t('tn.delImpactPermanent')];
      },
      async confirmDelete() {
        if (this.busy) return false;
        this.deleteSubmitted = true;
        if (!this.canDelete) { this.$nextTick(() => document.getElementById('dm-confirm')?.focus()); this.announce(this.deleteErr); return false; }
        this.busy = true;
        await this.wait(250);
        const id = this.deleteTargetId, t = this.tenantById(id), name = t.name[this.locale];
        this.tenants = this.tenants.filter(x => x.id !== id);
        this.subs = this.subs.filter(s => s.tenant_id !== id);
        this.busy = false;
        this.modal = null; this.deleteTargetId = null;
        if (this.selectedId === id) { this.soOpen = false; this.selectedId = null; }
        this.clampPage();
        this.restore(null, 'tenants-heading');
        const msg = this.tf('tn.doneDelete', { name });
        this.toast(msg);
        this.announce(msg);
        return true;
      },

      /* ---------- الدخول بصفة المؤسسة (نموذج أولي صريح + قيد تدقيق) ---------- */
      impersonate(id) {
        const t = this.tenantById(id); if (!t) return;
        this.log(t, 'impersonate');
        const name = t.name[this.locale];
        this.announce(this.tf('tn.impLive', { name }));
        window.Swal?.fire({
          icon: 'info', titleText: this.t('tn.impTitle'), text: this.tf('tn.impText', { name }),
          confirmButtonText: this.t('tn.impOk'), customClass: { popup: 'firob-swal', confirmButton: 'btn btn-primary' }, buttonsStyling: false,
        });
      },

      /* ---------- SweetAlert2: إشعار نجاح (نص فقط — لا HTML) ---------- */
      toast(msg) {
        window.Swal?.fire({ toast: true, position: 'top-end', icon: 'success', titleText: msg, showConfirmButton: false, timer: 3000,
                            customClass: { popup: 'firob-swal firob-toast' } });
      },

      /* ---------- عامة ---------- */
      init() {
        this.subs = clone(SA.SUBSCRIPTIONS);
        this.tenants = clone(SA.TENANTS).map(t => Object.assign(t, { activity: seedActivity(t, this.subs) }));
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; this.wide = m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        document.title = this.t('tn.docTitle');
        let tm = null;
        const onFilter = () => { this.page = 1; clearTimeout(tm); tm = setTimeout(() => this.announceCount(), 400); };
        this.$watch('search', onFilter);
        this.$watch('statusFilter', onFilter);
        this.$watch('planFilter', onFilter);
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      /* Escape العام يغلق القوائم فقط؛ الحوارات تغلق نفسها (@keydown.escape.stop على اللوحة) */
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },
    };
  }
</script>
