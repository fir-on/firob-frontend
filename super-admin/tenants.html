<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>إدارة المؤسسات — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft focus-visible:ring-2; }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  { @apply bg-accent-500/25 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-line-strong; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-4 py-2.5 text-start text-sm font-medium text-ink transition-colors hover:bg-soft; }
    .combo-option.is-active   { @apply bg-soft; }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }
    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- النافذة المنبثقة (Modal) ---------- */
    .modal-panel { @apply relative flex max-h-[90dvh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }

    /* ---------- مقياس الحصة (QuotaMeter) ---------- */
    .quota-track { @apply h-1.5 w-full overflow-hidden rounded-full bg-line; }
    .quota-fill { @apply h-full rounded-full transition-all duration-500; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }
</style>

<!-- ⑥ Alpine.js (+ إضافة Focus لحصر التركيز داخل النوافذ المنبثقة) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- ⑦ SweetAlert2 -->
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body x-data="shell()" x-init="init()" @keydown.escape.window="closeAll()"
      @keydown.window="if (($event.ctrlKey || $event.metaKey) && $event.key.toLowerCase() === 'k') { $event.preventDefault(); $refs.globalSearch.focus(); }"
      :class="{ 'overflow-hidden': (mobileNav && mobile) || modal || soOpen }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar =================
       جوال: درج خارج الشاشة (off-canvas) باتجاه بداية السطر (start) مع خلفية ضبابية
       سطح المكتب: ثابت لاصق مع إمكانية الطي -->
  <aside id="sidebar" :aria-label="locale === 'ar' ? 'القائمة الرئيسية' : 'Main menu'"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:sticky lg:top-0 lg:h-[100dvh] lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <a href="overview.html" class="inline-flex min-w-0 flex-1 items-center gap-3 rounded-lg focus-visible:ring-2" :class="!expanded && 'lg:flex-none lg:justify-center'" :aria-label="t('appTitle')">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </a>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-line-strong" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="item.count && expanded"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent" x-text="item.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid" :class="collapsed ? 'fa-angles-right rtl:-scale-x-100' : 'fa-angles-left rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="flex min-w-0 flex-1 flex-col">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-line-strong" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-line-strong focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd dir="ltr" aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex">Ctrl K</kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-haspopup="true" :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="t('notif.' + n.key)"></p>
                      <p class="text-xs text-muted" x-text="n.time"></p>
                    </div>
                  </li>
                </template>
              </ul>
              <div class="border-t border-line p-2">
                <a href="../common/notifications.html" class="menu-item justify-center text-brand" @click="notifOpen = false">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  <span x-text="locale === 'ar' ? 'عرض جميع الإشعارات' : 'View all notifications'"></span>
                </a>
              </div>
            </div>
          </div>

          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" class="flex max-w-[14rem] items-center gap-2 rounded-xl p-1 transition hover:bg-soft focus-visible:ring-2 md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    aria-haspopup="menu" :aria-expanded="profileOpen.toString()" aria-controls="profile-menu" :aria-label="locale === 'ar' ? 'قائمة الحساب' : 'Account menu'">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true">S</span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="t('appSubtitle')"></span>
                <span class="block truncate text-xs text-muted">Super Admin</span>
              </span>

    <!-- ================= المحتوى الرئيسي — LND-02: قائمة المستأجرين ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"

      <!-- منطقة الإعلانات الحيّة لقارئ الشاشة (نتائج الفلترة ونتائج الإجراءات) -->
      <p class="sr-only" aria-live="polite" aria-atomic="true" x-text="liveMsg"></p>

      <!-- العنوان + إجراء الإضافة -->
      <section class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end sm:justify-between">
        <div class="min-w-0">
          <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="t('tn.title')"></h1>
          <p class="mt-1 text-sm text-muted sm:text-base" x-text="t('tn.subtitle')"></p>
        </div>
        <button type="button" class="btn btn-primary" @click="openAdd()">
          <i class="fa-solid fa-plus" aria-hidden="true"></i>
          <span x-text="t('tn.addTenant')"></span>
        </button>
      </section>

      <!-- ================= شريط البحث والفلاتر ================= -->
      <section class="panel flex flex-col gap-3 p-4 lg:flex-row lg:items-center sm:p-5" :aria-label="t('tn.filtersLabel')">
        <div class="relative min-w-0 flex-1">
          <label for="tenant-search" class="sr-only" x-text="t('tn.searchLabel')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-line-strong" aria-hidden="true"></i>
          <input id="tenant-search" type="search" x-model="search" :placeholder="t('tn.searchPlaceholder')" autocomplete="off"
                 class="h-11 w-full min-w-0 rounded-xl border border-line bg-field ps-10 pe-3 text-base text-ink placeholder:text-line-strong focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30 sm:text-sm">
        </div>

        <div class="relative w-full shrink-0 lg:w-48"
             x-data="selectDropdown({ id: 'status-filter', options: () => statusOptions, get: () => statusFilter, set: (v) => statusFilter = v })"
             @click.outside="closeList()">
          <span id="status-filter-label" class="sr-only" x-text="t('tn.colStatus')"></span>
          <button type="button" id="status-filter" x-ref="btn" role="combobox" aria-haspopup="listbox"
                  aria-labelledby="status-filter-label status-filter"
                  :aria-expanded="open.toString()" aria-controls="status-filter-list"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="status-filter-list" role="listbox" aria-labelledby="status-filter-label"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
        </div>

        <div class="relative w-full shrink-0 lg:w-52"
             x-data="selectDropdown({ id: 'plan-filter', options: () => planFilterOptions, get: () => planFilter, set: (v) => planFilter = v })"
             @click.outside="closeList()">
          <span id="plan-filter-label" class="sr-only" x-text="t('tn.planLabel')"></span>
          <button type="button" id="plan-filter" x-ref="btn" role="combobox" aria-haspopup="listbox"
                  aria-labelledby="plan-filter-label plan-filter"
                  :aria-expanded="open.toString()" aria-controls="plan-filter-list"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="plan-filter-list" role="listbox" aria-labelledby="plan-filter-label"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
        </div>

        <button type="button" class="btn btn-outline shrink-0" @click="resetFilters()" :disabled="!filtersActive">
          <i class="fa-solid fa-filter-circle-xmark text-muted" aria-hidden="true"></i>
          <span x-text="t('tn.resetFilters')"></span>
        </button>
      </section>

      <!-- ================= قائمة المستأجرين (عرض واحد: جدول ≥lg أو بطاقات على الجوال) ================= -->

        </div>

        <template x-if="filteredTenants.length && wide">

                    </button>
                  </th>
                  <th scope="col" class="px-4 py-3.5 text-start" :aria-sort="ariaSort('plan')">

                    </button>
                  </th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('tn.colStatus')"></th>
                  <th scope="col" class="px-4 py-3.5 text-start" :aria-sort="ariaSort('created')">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded text-xs font-extrabold transition hover:text-brand focus-visible:ring-2" @click="sortBy('created')">
                      <span x-text="t('tn.colCreated')"></span><i class="fa-solid text-[10px] text-muted" :class="sortIcon('created')" aria-hidden="true"></i>
                    </button>
                  </th>
                  <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('tn.colActions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-line">
                <template x-for="r in pagedTenants" :key="r.id">

                    <th scope="row" class="px-4 py-3.5 text-start align-middle font-normal">
                      <div class="flex items-center gap-3">
                        <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl text-sm font-extrabold text-white" :style="'background:' + r.color" aria-hidden="true" x-text="r.initials"></span>
                        <div class="min-w-0">
                          <p class="max-w-[16rem] truncate font-bold leading-5 text-ink" x-text="r.name"></p>
                          <p class="mt-0.5 max-w-[16rem] truncate text-xs font-medium text-muted" dir="ltr" x-text="r.domain"></p>
                        </div>
                      </div>
                    </th>

                    <!-- الباقة والاشتراك -->

                      <template x-if="r.plan">
                        <div>
                          <span class="badge" :class="planBadgeClass(r.plan)" x-text="r.plan.name[locale]"></span>
                          <p class="mt-1.5 text-xs text-muted"><span x-text="endsLabel(r.sub)"></span> <span class="font-bold" :class="endsClass(r.sub)" x-text="fmtDate(r.sub.ends_at)"></span></p>
                          <p class="mt-0.5 text-[11px] font-bold" :class="subStatusClass(r.sub.status)" x-text="t('tn.subStatus.' + r.sub.status)"></p>
                        </div>
                      </template>
                      <template x-if="!r.plan"><span class="text-xs text-muted" x-text="t('tn.noSubscription')"></span></template>

                    <!-- استخدام الموارد (من اشتراك المؤسسة وحدود باقتها) -->

                      <div class="space-y-2">
                        <template x-for="q in quotas(r)" :key="q.key">
                          <div>
                            <div class="mb-1 flex items-center justify-between gap-2 text-[11px] font-bold text-muted">
                              <span x-text="q.label"></span>
                              <span class="tabular-nums" :class="quotaTextClass(q.pct)" x-text="q.text"></span>
                            </div>
                            <div class="quota-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="q.pct" :aria-valuetext="q.valueText" :aria-label="q.label">
                              <div class="quota-fill" :class="quotaBarClass(q.pct)" :style="'width:' + q.pct + '%'"></div>
                            </div>
                          </div>
                        </template>
                      </div>
                    </td>

                    <!-- الحالة -->
                    <td class="px-4 py-3.5 align-middle">
                      <span class="badge" :class="statusClass(r.status)">
                        <span class="h-1.5 w-1.5 rounded-full bg-current" aria-hidden="true"></span>
                        <span x-text="t('tn.status.' + r.status)"></span>
                      </span>
                    </td>

                    <!-- تاريخ الإنشاء -->
                    <td class="whitespace-nowrap px-4 py-3.5 align-middle text-sm text-muted" x-text="fmtDate(r.created_at)"></td>

                    <!-- إجراءات: أزرار أيقونية مع تلميح واسم المؤسسة في aria-label -->
                    <td class="px-4 py-3.5 align-middle">
                      <div class="grid w-max grid-cols-3 gap-1">

                          <i class="fa-regular fa-eye" aria-hidden="true"></i>
                          <span class="tooltip-arrow" aria-hidden="true"></span><span class="tooltip-bubble" aria-hidden="true" x-text="t('tn.viewDetails')"></span>
                        </button>
                        <button type="button" class="act group relative" @click="openEdit(r.id)" :aria-label="actionLabel('edit', r)">
                          <i class="fa-solid fa-pen" aria-hidden="true"></i>
                          <span class="tooltip-arrow" aria-hidden="true"></span><span class="tooltip-bubble" aria-hidden="true" x-text="t('tn.edit')"></span>
                        </button>
                        <a class="act group relative" :href="'subscriptions.html?tenant=' + encodeURIComponent(r.id)" :aria-label="actionLabel('changePlan', r)">

                          <i class="fa-solid" :class="r.status === 'suspended' ? 'fa-circle-play text-success-700 dark:text-success-500' : 'fa-circle-pause'" aria-hidden="true"></i>
                          <span class="tooltip-arrow" aria-hidden="true"></span><span class="tooltip-bubble" aria-hidden="true" x-text="r.status === 'inactive' ? t('tn.inactiveNoSuspend') : t('tn.' + suspendKey(r))"></span>
                        </button>
                        <button type="button" class="act group relative text-danger hover:!bg-error-500/10" :id="'act-del-' + r.id" @click="openDelete(r.id)" :aria-label="actionLabel('delete', r)">
                          <i class="fa-solid fa-trash" aria-hidden="true"></i>
                          <span class="tooltip-arrow" aria-hidden="true"></span><span class="tooltip-bubble" aria-hidden="true" x-text="t('tn.delete')"></span>
                        </button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>

        <!-- عرض البطاقات (أقل من lg) — لا تمرير أفقي على الجوال -->
        <template x-if="filteredTenants.length && !wide">
          <div>
            <!-- ترتيب البطاقات على الجوال -->
            <div class="flex flex-wrap items-center gap-2 border-b border-line px-4 py-3" role="group" :aria-label="t('tn.sortLabel')">
              <span class="text-xs font-bold text-muted" aria-hidden="true" x-text="t('tn.sortLabel')"></span>
              <template x-for="k in ['name', 'plan', 'users', 'created']" :key="k">
                <button type="button" class="btn btn-sm" :class="sortKey === k ? 'btn-primary' : 'btn-outline'" :aria-pressed="(sortKey === k).toString()" @click="sortBy(k)">
                  <span x-text="t('tn.sortKeys.' + k)"></span>
                  <i class="fa-solid text-[10px]" :class="sortIcon(k)" aria-hidden="true"></i>
                  <span class="sr-only" x-show="sortKey === k" x-text="sortDir === 'asc' ? t('tn.sortedAsc') : t('tn.sortedDesc')"></span>
                </button>
              </template>
            </div>
            <ul class="divide-y divide-line" role="list" :aria-label="t('tn.listTitle')">
              <template x-for="r in pagedTenants" :key="r.id">
                <li class="space-y-3 p-4">
                  <div class="flex items-start gap-3">
                    <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl text-sm font-extrabold text-white" :style="'background:' + r.color" aria-hidden="true" x-text="r.initials"></span>
                    <div class="min-w-0 flex-1">
                      <h3 class="break-words font-bold leading-5 text-ink" x-text="r.name"></h3>

                      <span class="h-1.5 w-1.5 rounded-full bg-current" aria-hidden="true"></span>
                      <span x-text="t('tn.status.' + r.status)"></span>
                    </span>
                  </div>

                    <template x-if="r.sub"><span class="font-bold" :class="subStatusClass(r.sub.status)" x-text="t('tn.subStatus.' + r.sub.status)"></span></template>
                    <span><span x-text="t('tn.colCreated')"></span>: <span class="font-bold text-ink" x-text="fmtDate(r.created_at)"></span></span>
                  </div>
                  <div class="space-y-2">
                    <template x-for="q in quotas(r)" :key="q.key">
                      <div>
                        <div class="mb-1 flex items-center justify-between gap-2 text-[11px] font-bold text-muted">

                          <span class="tabular-nums" :class="quotaTextClass(q.pct)" x-text="q.text"></span>

                          <div class="quota-fill" :class="quotaBarClass(q.pct)" :style="'width:' + q.pct + '%'"></div>
                        </div>
                      </div>
                    </template>
                  </div>
                  <div class="flex flex-wrap gap-1.5 pt-1">
                    <button type="button" class="act group relative" :id="'act-view-' + r.id" @click="openDetails(r.id)" :aria-label="actionLabel('viewDetails', r)">
                      <i class="fa-regular fa-eye" aria-hidden="true"></i>
                      <span class="tooltip-arrow" aria-hidden="true"></span><span class="tooltip-bubble" aria-hidden="true" x-text="t('tn.viewDetails')"></span>

                      <span class="tooltip-arrow" aria-hidden="true"></span><span class="tooltip-bubble" aria-hidden="true" x-text="t('tn.edit')"></span>
                    </button>
                    <a class="act group relative" :href="'subscriptions.html?tenant=' + encodeURIComponent(r.id)" :aria-label="actionLabel('changePlan', r)">

                      <span class="tooltip-arrow" aria-hidden="true"></span><span class="tooltip-bubble" aria-hidden="true" x-text="r.status === 'inactive' ? t('tn.inactiveNoSuspend') : t('tn.' + suspendKey(r))"></span>

                    <button type="button" class="act group relative text-danger hover:!bg-error-500/10" :id="'act-del-' + r.id" @click="openDelete(r.id)" :aria-label="actionLabel('delete', r)">
                      <i class="fa-solid fa-trash" aria-hidden="true"></i>
                      <span class="tooltip-arrow" aria-hidden="true"></span><span class="tooltip-bubble" aria-hidden="true" x-text="t('tn.delete')"></span>
                    </button>
                  </div>
                </li>
              </template>
            </ul>
          </div>
        </template>

            <span class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-full bg-primary-500/10 text-brand" aria-hidden="true">
              <i class="fa-solid fa-building-circle-xmark text-xl"></i>

            <p class="font-extrabold text-ink" x-text="t('tn.emptyTitle')"></p>

        <!-- ================= تذييل الصفحات (Pagination) ================= -->
        <div x-show="filteredTenants.length" class="flex flex-col gap-3 border-t border-line px-4 py-3.5 sm:flex-row sm:items-center sm:justify-between sm:px-5">
          <p class="text-xs font-bold text-muted" x-text="rangeText"></p>
          <nav class="flex items-center gap-1.5" :aria-label="t('tn.pagination')">
            <button type="button" :disabled="page === 1" class="act disabled:opacity-40" @click="goToPage(page - 1)" :aria-label="t('tn.prev')">
              <i class="fa-solid fa-chevron-left rtl:-scale-x-100 text-xs" aria-hidden="true"></i>

          <li><span class="inline-flex cursor-not-allowed items-center text-line-strong" aria-disabled="true" x-text="t('footer.privacy')"></span></li>
          <li><span class="inline-flex cursor-not-allowed items-center text-line-strong" aria-disabled="true" x-text="t('footer.terms')"></span></li>

<div x-cloak x-show="undoState" x-transition.opacity

        <!-- محتوى التبويبات -->

              <h3 class="mb-2 text-xs font-extrabold text-muted" x-text="t('tn.soOwnerContact')"></h3>
              <div class="space-y-2.5 rounded-xl border border-line bg-page/50 p-4 text-sm">
                <div class="flex items-center gap-2.5"><i class="fa-regular fa-user w-4 text-muted" aria-hidden="true"></i><span class="font-bold text-ink" x-text="selected.contactName || '—'"></span></div>
                <div class="flex items-center gap-2.5"><i class="fa-regular fa-envelope w-4 text-muted" aria-hidden="true"></i><span class="sr-only" x-text="t('tn.fEmail')"></span><a class="break-all text-brand hover:underline" dir="ltr" :href="'mailto:' + selected.email" x-text="selected.email"></a></div>
                <div class="flex items-center gap-2.5"><i class="fa-solid fa-phone w-4 text-muted" aria-hidden="true"></i><span class="sr-only" x-text="t('tn.fPhone')"></span><span dir="ltr" x-text="selected.phone || '—'"></span></div>
              </div>
            </div>
            <div>
              <h3 class="mb-2 text-xs font-extrabold text-muted" x-text="t('tn.soDomain')"></h3>
              <p class="rounded-xl border border-line bg-page/50 p-4 text-sm font-bold text-brand"><span dir="ltr" x-text="selected.domain"></span></p>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <h3 class="mb-2 text-xs font-extrabold text-muted" x-text="t('tn.soRegistered')"></h3>
                <p class="rounded-xl border border-line bg-page/50 p-4 text-sm font-bold text-ink" x-text="fmtDate(selected.created_at)"></p>
              </div>
              <div>
                <h3 class="mb-2 text-xs font-extrabold text-muted" x-text="t('tn.soCountry')"></h3>
                <p class="rounded-xl border border-line bg-page/50 p-4 text-sm font-bold text-ink" x-text="countryName(selected.country)"></p>
              </div>
            </div>
          </div>

          <!-- الاشتراك والحصص (من SA.SUBSCRIPTIONS + حدود SA.PLANS) -->
          <div x-show="activeTab === 'subscription'" id="so-panel-subscription" role="tabpanel" aria-labelledby="so-tab-subscription" tabindex="0" class="space-y-5 rounded-lg focus-visible:ring-2">
            <template x-if="selected.sub">
              <div class="space-y-2 rounded-xl border border-line bg-page/50 p-4 text-sm">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <span class="badge" :class="planBadgeClass(selected.plan)" x-text="selected.plan.name[locale]"></span>
                  <span class="text-xs font-bold" :class="subStatusClass(selected.sub.status)" x-text="t('tn.subStatus.' + selected.sub.status)"></span>
                </div>
                <dl class="grid grid-cols-2 gap-x-3 gap-y-1.5 text-xs">
                  <dt class="text-muted" x-text="t('tn.soPrice')"></dt><dd class="font-bold text-ink" x-text="money(selected.plan.price_monthly) + ' ' + t('tn.perMonth')"></dd>
                  <dt class="text-muted" x-text="t('tn.soStarted')"></dt><dd class="font-bold text-ink" x-text="fmtDate(selected.sub.starts_at)"></dd>
                  <dt class="text-muted" x-text="endsLabel(selected.sub)"></dt><dd class="font-bold" :class="endsClass(selected.sub)" x-text="fmtDate(selected.sub.ends_at)"></dd>
                  <dt class="text-muted" x-text="t('tn.soSubId')"></dt><dd class="font-bold text-ink" dir="ltr" x-text="'#' + selected.sub.id"></dd>
                </dl>
              </div>
            </template>
            <p x-show="!selected.sub" class="rounded-xl border border-line bg-page/50 p-4 text-sm text-muted" x-text="t('tn.noSubscription')"></p>

            <div class="space-y-4">
              <template x-for="q in quotas(selected, true)" :key="q.key">
                <div>
                  <div class="mb-1.5 flex items-center justify-between gap-2 text-xs font-bold text-muted">
                    <span x-text="q.label"></span><span class="tabular-nums" :class="quotaTextClass(q.pct)" x-text="q.text"></span>
                  </div>
                  <div class="quota-track !h-2" role="progressbar" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="q.pct" :aria-valuetext="q.valueText" :aria-label="q.label">
                    <div class="quota-fill" :class="quotaBarClass(q.pct)" :style="'width:' + q.pct + '%'"></div>
                  </div>
                </div>
              </template>
            </div>

            <div x-show="quotas(selected, true).some(q => q.pct >= 90)"
                 class="flex items-start gap-2.5 rounded-xl border border-warning-500/40 bg-warning-500/10 p-3.5 text-xs font-bold text-warning-800 dark:text-warning-500">
              <i class="fa-solid fa-triangle-exclamation mt-0.5" aria-hidden="true"></i>
              <span x-text="t('tn.soQuotaNear')"></span>
            </div>

            <a class="btn btn-outline w-full" :href="'subscriptions.html?tenant=' + encodeURIComponent(selected.id)">
              <i class="fa-solid fa-layer-group" aria-hidden="true"></i> <span x-text="t('tn.soChangePlan')"></span>
            </a>
          </div>

          <!-- سجل النشاط (يتضمن قيود التدقيق المضافة من هذه الصفحة) -->
          <div x-show="activeTab === 'activity'" id="so-panel-activity" role="tabpanel" aria-labelledby="so-tab-activity" tabindex="0" class="rounded-lg focus-visible:ring-2">
            <ul class="space-y-4" role="list" x-show="selected.activity.length">
              <template x-for="a in selected.activity" :key="a.seq">
                <li class="flex gap-3">
                  <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500/10 text-brand" aria-hidden="true"><i :class="activityIcon(a.type)"></i></span>
                  <div class="min-w-0 flex-1 border-b border-line pb-4">
                    <p class="break-words text-sm font-bold text-ink" x-text="activityText(a)"></p>
                    <p class="mt-0.5 text-xs text-muted"><span x-text="fmtDate(a.at)"></span> · <span x-text="a.by === 'system' ? t('tn.bySystem') : a.by"></span></p>
                  </div>
                </li>
              </template>
            </ul>
            <p x-show="!selected.activity.length" class="text-sm text-muted" x-text="t('tn.soNoActivity')"></p>
          </div>
        </div>

        <!-- تذييل اللوحة -->
        <footer class="shrink-0 space-y-2.5 border-t border-line p-4">
          <button type="button" @click="impersonate(selected.id)" class="btn btn-accent w-full">
            <i class="fa-solid fa-user-secret" aria-hidden="true"></i>
            <span x-text="t('tn.soImpersonateBtn')"></span>
          </button>
          <div class="flex gap-2.5">
            <button type="button" @click="openEdit(selected.id)" class="btn btn-outline flex-1">

            </button>
            <button type="button" @click="closeDetails()" class="btn btn-outline flex-1" x-text="t('tn.soClose')"></button>
          </div>
        </footer>
      </div>
    </template>
  </aside>

<!-- ==========================================================================
     نافذة — إضافة / تعديل مؤسسة (تحقق + ملخص أخطاء)
     ========================================================================== -->
<div x-cloak x-show="modal === 'form'" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4">
  <div class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closeModal()" aria-hidden="true"></div>

  <form @submit.prevent="saveForm()" novalidate x-show="modal === 'form'" x-trap.noscroll="modal === 'form'"
        role="dialog" aria-modal="true" aria-labelledby="fm-title" @keydown.escape.stop="closeModal()"
        x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="opacity-0 scale-95"
        class="modal-panel">
    <header class="flex shrink-0 items-center justify-between gap-3 border-b border-line p-5">
      <h2 id="fm-title" class="text-lg font-extrabold text-brand" x-text="form.mode === 'edit' ? t('tn.editTitle') : t('tn.addTitle')"></h2>
      <button type="button" class="icon-btn" @click="closeModal()" :disabled="busy" :aria-label="t('tn.cancel')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </header>

    <div class="min-h-0 flex-1 space-y-4 overflow-y-auto p-5">
      <p class="text-xs text-muted"><span class="text-danger" aria-hidden="true">*</span> <span x-text="t('tn.requiredNote')"></span></p>

      <!-- ملخص الأخطاء -->
      <div x-show="formSubmitted && formErrorList.length" id="fm-errors" tabindex="-1" role="alert"
           class="rounded-xl border border-error-600/30 bg-error-500/10 p-3.5 text-sm text-error-700 focus:outline-none dark:text-red-300">
        <p class="font-extrabold" x-text="tf('tn.errSummary', { n: fmtNum(formErrorList.length) })"></p>
        <ul class="mt-1.5 list-disc space-y-0.5 ps-5" role="list">
          <template x-for="e in formErrorList" :key="e.id">
            <li><a :href="'#' + e.id" class="font-bold underline" @click.prevent="focusField(e.id)" x-text="e.msg"></a></li>
          </template>
        </ul>
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label for="f-name-ar" class="label"><span x-text="t('tn.fNameAr')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
          <input id="f-name-ar" type="text" dir="rtl" lang="ar" x-model="form.nameAr" @blur="touch('nameAr')" required aria-required="true" class="field"
                 :aria-invalid="(!!showErr('nameAr')).toString()" :aria-describedby="showErr('nameAr') ? 'f-name-ar-err' : null">
          <p id="f-name-ar-err" class="err" x-show="showErr('nameAr')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="showErr('nameAr')"></span></p>
        </div>
        <div>
          <label for="f-name-en" class="label"><span x-text="t('tn.fNameEn')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
          <input id="f-name-en" type="text" dir="ltr" lang="en" x-model="form.nameEn" @blur="touch('nameEn')" required aria-required="true" class="field"
                 :aria-invalid="(!!showErr('nameEn')).toString()" :aria-describedby="showErr('nameEn') ? 'f-name-en-err' : null">
          <p id="f-name-en-err" class="err" x-show="showErr('nameEn')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="showErr('nameEn')"></span></p>
        </div>
      </div>

      <div>
        <label for="f-sub" class="label"><span x-text="t('tn.fSub')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
        <div class="flex items-stretch" dir="ltr">
          <input id="f-sub" type="text" x-model="form.sub" @blur="touch('sub')" required aria-required="true" autocomplete="off" spellcheck="false"
                 placeholder="my-school" class="field !rounded-e-none"

          <span class="inline-flex shrink-0 items-center rounded-e-lg border border-s-0 border-line-strong bg-soft px-3 text-sm font-bold text-muted" x-text="DOMAIN_SUFFIX"></span>
        </div>
        <p id="f-sub-hint" class="hint" x-text="t('tn.fSubHint')"></p>
        <p id="f-sub-err" class="err" x-show="showErr('sub')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="showErr('sub')"></span></p>
      </div>

      <div>
        <label for="f-contact" class="label" x-text="t('tn.fContact')"></label>
        <input id="f-contact" type="text" x-model="form.contact" autocomplete="name" class="field">
      </div>

      <div class="grid gap-4 sm:grid-cols-2">

          <label for="f-email" class="label"><span x-text="t('tn.fEmail')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
          <input id="f-email" type="email" dir="ltr" x-model="form.email" @blur="touch('email')" required aria-required="true" autocomplete="email" placeholder="owner@example.com" class="field"

          <p id="f-email-err" class="err" x-show="showErr('email')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="showErr('email')"></span></p>

        <div>
          <label for="f-phone" class="label" x-text="t('tn.fPhone')"></label>

                 :aria-invalid="(!!showErr('phone')).toString()" :aria-describedby="'f-phone-hint' + (showErr('phone') ? ' f-phone-err' : '')">
          <p id="f-phone-hint" class="hint" x-text="t('tn.fPhoneHint')"></p>
          <p id="f-phone-err" class="err" x-show="showErr('phone')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="showErr('phone')"></span></p>
        </div>

      <template x-if="form.mode === 'create'">
        <div class="relative"
             x-data="selectDropdown({ id: 'f-plan', options: () => planFormOptions, get: () => form.planId, set: (v) => { form.planId = v; touch('plan'); }, placeholder: () => t('tn.choosePlan') })"
             @click.outside="closeList()">
          <span id="f-plan-label" class="label"><span x-text="t('tn.fPlan')"></span> <span class="text-danger" aria-hidden="true">*</span></span>
          <button type="button" id="f-plan" x-ref="btn" role="combobox" aria-haspopup="listbox" aria-required="true"
                  aria-labelledby="f-plan-label f-plan" :aria-expanded="open.toString()" aria-controls="f-plan-list"

<script>
  /**
   * حالة واجهة LND-02 — إدارة المؤسسات + اللوحة الجانبية.
   * المصدر الوحيد للبيانات: SA (المؤسسات + الاشتراك الحالي + حدود الباقة)، تُنسخ نسخة عميقة
   * قابلة للتعديل محليًا. في Laravel: TenantController + سياسات (Policies) + سجل تدقيق (activity_log).
   */

  /**
   * مكوّن قائمة الاختيار (Combobox Listbox) — Home/End، بحث بالكتابة، Tab يغلق، Escape لا يتسرّب.
   * options: () => [{ value, label }]  get/set: ربط القيمة  placeholder: نص أو دالة
   */
  function selectDropdown({ id, options, get, set, placeholder = '' }) {
    return {
      id, open: false, active: -1, typed: '', typedAt: 0,
      get items() { return options(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { const sel = this.selectedItem; return sel ? sel.label : (typeof placeholder === 'function' ? placeholder() : placeholder); },
      optId(item) { return this.id + '-opt-' + item.value; },
      openList() {
        if (!this.items.length) return;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item) { set(item.value); this.closeList(); this.$refs.btn?.focus(); },
      setActive(i) { this.active = Math.min(Math.max(i, 0), this.items.length - 1); this.scrollActiveIntoView(); },
      move(step) { if (!this.open) { this.openList(); return; } this.setActive(this.active + step); },
      onKey(e) {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); if (e.altKey && this.open && k === 'ArrowUp') { this.choose(this.items[this.active]); return; } this.move(k === 'ArrowDown' ? 1 : -1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.setActive(0); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.setActive(this.items.length - 1); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); (this.open && this.active > -1) ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape') { if (this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); } }
        else if (k === 'Tab') { if (this.open) this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          const now = Date.now();
          this.typed = (now - this.typedAt > 600 ? '' : this.typed) + k.toLowerCase();
          this.typedAt = now;
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this.typed));
          if (i > -1) { if (!this.open) this.openList(); this.setActive(i); }
        }
      },
      // children[0] هو <template x-for> — لذا +1
      scrollActiveIntoView() { this.$nextTick(() => this.$refs.list?.children[this.active + 1]?.scrollIntoView({ block: 'nearest' })); },
      isSelected(item) { const sel = this.selectedItem; return !!sel && sel.value === item.value; },
    };
  }

  /* =====================================================================================
     FirOb — بيانات المسؤول العام المشتركة (Single Source of Truth) — SA
     تُضمَّن حرفيًا في كل صفحات super-admin عند البناء، فلا تتعارض الصفحات أبدًا.
     - العملة واحدة: USD (لا تتغير مع اللغة)، وضريبة القيمة المضافة 15% محسوبة على البنود.
     - كل الحساب المالي بالهللة (أعداد صحيحة) عبر SA.m — لا جمع لأعداد عشرية.
     - التواريخ محلية YYYY-MM-DD (لا toISOString) — لا انزياح يوم في UTC+3.
     - حالة الفاتورة مشتقة من المدفوعات وتاريخ الاستحقاق (إلا void/draft المخزّنتين).
     في Laravel: نفس الجداول (plans, tenants, subscriptions, invoices, invoice_items, payments, refunds)

    const today = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; };

    const moneyShort = (minor, loc) => new Intl.NumberFormat(fmtLocale(loc), { style: 'currency', currency: CURRENCY, notation: 'compact', maximumFractionDigits: 1 }).format((minor || 0) / 100);
    const fmtDate = (s, loc, opts) => s ? new Intl.DateTimeFormat(fmtLocale(loc), opts || { day: 'numeric', month: 'short', year: 'numeric' }).format(parseLocal(s)) : '—';
