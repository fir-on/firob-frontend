<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 90 104 125;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand focus-visible:ring-2; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition focus-visible:ring-2; }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    /*.badge-accent  { @apply bg-accent-500/25 text-yellow-900 dark:text-accent-500; }*/
    .badge-accent { @apply bg-accent-500/25 text-amber-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-line-strong; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-2 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }

    /* ---------- شرائح الهيكل العظمي (Skeleton) ---------- */
    .sk { @apply animate-pulse rounded-md bg-line; }
  }

    /* ---------- [SA shell fixes] ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }
    .combo-option.is-active.is-selected { @apply ring-1 ring-inset ring-brand/40; }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md, .backdrop-blur-lg { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }
</style>

<body x-data="dashboardData()" x-init="init()" @keydown.escape.window="closeAll()"

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->

           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'

      <div class="inline-flex items-center p-0">

      </div>
      <div class="min-w-0 flex-1" x-show="expanded">

      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->

      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-line-strong" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="item.count && expanded"
                        class="shrink-0 rounded-full bg-accent-500 px-2 text-xs font-extrabold text-onaccent" x-text="item.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">

        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

              <a href="../common/profile.html" role="menuitem" class="menu-item"><i class="fa-regular fa-user w-4 text-muted" aria-hidden="true"></i> <span x-text="t('profile')"></span></a>

    <!-- ================= المحتوى الرئيسي — LND-01: لوحة المسؤول العام ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">

      <!-- العنوان + إجراء التحديث -->

        <div class="min-w-0">
          <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="t('dash.title')"></h1>
          <p class="mt-1 text-sm text-muted sm:text-base" x-text="t('dash.subtitle')"></p>
        </div>
        <div class="flex flex-wrap items-center gap-3">
          <p class="text-xs font-bold text-muted" x-show="updatedAt" x-text="tf('dash.updatedAt', { time: updatedLabel })"></p>
          <button type="button" class="btn btn-outline" :disabled="loading" :aria-busy="loading.toString()" @click="refresh()">
            <i class="fa-solid fa-arrows-rotate" :class="loading && 'animate-spin'" aria-hidden="true"></i>
            <span x-text="loading ? t('dash.refreshing') : t('dash.refresh')"></span>
          </button>
        </div>
      </section>

      <!-- ================= KPIs (محسوبة من بيانات SA) ================= -->
      <section :aria-label="t('dash.kpiRegion')" class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4 lg:grid-cols-3" :aria-busy="loading.toString()">
        <template x-for="k in kpis" :key="k.key">
          <div class="panel flex flex-col p-4 sm:p-5">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <h2 class="truncate text-sm font-bold text-muted" x-text="t('dash.kpi.' + k.key)"></h2>
                <p class="mt-2 text-2xl font-extrabold tabular-nums sm:text-3xl" x-text="k.value"></p>
                <p class="mt-1 text-xs text-muted" x-text="k.sub"></p>
              </div>
              <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl" :class="k.tone" aria-hidden="true"><i :class="k.icon"></i></span>
            </div>
            <div class="mt-auto flex flex-wrap items-center justify-between gap-2 pt-3 text-xs">
              <p class="flex flex-wrap items-center gap-1.5">
                <template x-if="k.trend">
                  <span class="inline-flex items-center gap-1 font-bold" :class="k.trend.tone">
                    <i class="fa-solid" :class="k.trend.icon" aria-hidden="true"></i>
                    <span x-text="k.trend.text" :aria-label="k.trend.sr"></span>
                  </span>
                </template>
                <span class="text-muted" x-text="k.note"></span>
              </p>
              <a :href="k.href" class="rounded font-bold text-brand underline-offset-4 hover:underline focus-visible:ring-2"
                 :aria-label="tf('dash.kpi.detailsOf', { name: t('dash.kpi.' + k.key) })">
                <span x-text="t('dash.kpi.details')"></span>
                <i class="fa-solid fa-arrow-right rtl:-scale-x-100 text-[10px]" aria-hidden="true"></i>
              </a>
            </div>
          </div>
        </template>
      </section>

      <!-- ================= الصف الأول: نمو المؤسسات + توزيع حالات الاشتراك ================= -->
      <section class="grid grid-cols-1 gap-4 xl:grid-cols-3">

        <!-- نمو المؤسسات (من created_at) -->
        <div class="panel p-4 sm:p-5 xl:col-span-2">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 id="growth-h" class="font-extrabold" x-text="t('dash.chart.tenantsGrowth')"></h2>
              <p class="text-xs text-muted" x-text="t('dash.chart.last6Months')"></p>
            </div>
            <span class="badge" :class="growthBadge.cls">
              <i class="fa-solid" :class="growthBadge.icon" aria-hidden="true"></i>
              <span x-text="growthBadge.text"></span>
              <span class="sr-only" x-text="growthBadge.sr"></span>
            </span>
          </div>

          <div class="relative mt-4 h-56 sm:h-64" dir="ltr">
            <!-- ملاحظة: <template x-for> لا يعمل كابن مباشر لِـ <svg>، لذا يُبنى المحتوى (مع <title>/<desc>) كنص SVG
                 ويُحقن عبر x-html؛ القيم كلها أرقام محسوبة أو نصوص مُهرَّبة. التلميح بالمؤشر فقط، والجدول يقدّم البيانات للوحة المفاتيح. -->
            <svg viewBox="0 0 600 240" preserveAspectRatio="xMidYMid meet" class="h-full w-full" role="img"
                 aria-labelledby="growth-svg-title growth-svg-desc"
                 x-html="growthChart.svg"
                 @mouseover="if ($event.target.dataset.idx !== undefined) growthTip = growthChart.pts[+$event.target.dataset.idx]"
                 @mouseout="growthTip = null"></svg>

            <div x-show="growthTip" x-cloak aria-hidden="true"
                 class="pointer-events-none absolute z-10 -translate-x-1/2 -translate-y-[calc(100%+10px)] whitespace-nowrap rounded-lg border border-line bg-card px-3 py-1.5 text-xs font-bold shadow-pop"
                 :style="growthTip ? ('left:' + growthTip.leftPct + '%; top:' + growthTip.topPct + '%') : ''">
              <span x-text="growthTip && growthTip.longLabel"></span>: <span class="text-brand" x-text="growthTip && growthTip.valueText"></span>
            </div>
          </div>

          <button type="button" class="mt-3 rounded text-xs font-bold text-brand hover:underline focus-visible:ring-2" @click="growthTableOpen = !growthTableOpen"
                  :aria-expanded="growthTableOpen.toString()" aria-controls="growth-table">
            <span x-text="growthTableOpen ? t('dash.chart.hideTable') : t('dash.chart.viewTable')"></span>
          </button>
          <div id="growth-table" x-show="growthTableOpen" x-cloak class="mt-2 overflow-x-auto rounded-lg border border-line">
            <table class="w-full text-xs">
              <caption class="sr-only" x-text="t('dash.chart.tenantsGrowth')"></caption>
              <thead class="bg-soft/60 text-muted"><tr>
                <th scope="col" class="px-3 py-2 text-start font-extrabold" x-text="t('dash.chart.colMonth')"></th>
                <th scope="col" class="px-3 py-2 text-start font-extrabold" x-text="t('dash.chart.colNewTenants')"></th>
                <th scope="col" class="px-3 py-2 text-start font-extrabold" x-text="t('dash.chart.colTotalTenants')"></th>
              </tr></thead>
              <tbody class="divide-y divide-line">
                <template x-for="r in growthTable" :key="'grow-' + r.key">
                  <tr>
                    <th scope="row" class="px-3 py-2 text-start font-bold" x-text="r.month"></th>
                    <td class="px-3 py-2 tabular-nums" x-text="r.added"></td>
                    <td class="px-3 py-2 tabular-nums" x-text="r.total"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- توزيع حالات الاشتراك (الاشتراك الحالي لكل مؤسسة) -->
        <div class="panel p-4 sm:p-5">
          <h2 class="font-extrabold" x-text="t('dash.chart.subStatus')"></h2>
          <p class="text-xs text-muted" x-text="tf('dash.chart.totalSubs', { n: fmtNum(subsRows.length) })"></p>

          <ul class="mt-4 space-y-2.5" role="list">
            <template x-for="s in subStatusView" :key="s.key">
              <li>
                <button type="button" class="group flex w-full items-center gap-3 rounded-lg p-1.5 text-start transition hover:bg-soft focus-visible:ring-2"
                        @click="setSubFilter(subFilter === s.key ? 'all' : s.key)" :aria-pressed="(subFilter === s.key).toString()">
                  <span class="h-2.5 w-2.5 shrink-0 rounded-full" :class="s.bar" aria-hidden="true"></span>
                  <span class="min-w-0 flex-1">
                    <span class="flex items-center justify-between gap-2 text-xs font-bold" :class="subFilter === s.key ? 'text-brand' : 'text-ink'">
                      <span x-text="t('dash.subStatus.' + s.key)"></span>
                      <span class="tabular-nums text-muted" x-text="s.valueText"></span>
                    </span>
                    <span class="mt-1.5 block h-2 overflow-hidden rounded-full bg-neutral-200 dark:bg-line" aria-hidden="true">
                      <span class="block h-full rounded-full transition-all duration-500" :class="s.bar" :style="'width:' + s.pct + '%'"></span>
                    </span>
                  </span>
                </button>
              </li>
            </template>
          </ul>
          <p class="mt-3 text-[11px] text-muted" x-text="t('dash.chart.clickToFilter')"></p>
        </div>
      </section>

      <!-- ================= الصف الثاني: الإيراد الشهري الصافي + توزيع الباقات ================= -->
      <section class="grid grid-cols-1 gap-4 xl:grid-cols-3">

        <!-- الإيراد الشهري (مدفوعات مكتملة − مبالغ مستردة) -->
        <div class="panel p-4 sm:p-5 xl:col-span-2">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="font-extrabold" x-text="t('dash.chart.revenue')"></h2>
              <p class="text-xs text-muted" x-text="t('dash.chart.revenueSub')"></p>
            </div>
            <span class="badge badge-primary"><i class="fa-solid fa-sack-dollar" aria-hidden="true"></i> <span x-text="tf('dash.chart.revenueTotal', { amount: money(revenueTotals.net) })"></span></span>
          </div>

          <div class="relative mt-4 h-48 sm:h-56" dir="ltr">
            <svg viewBox="0 0 600 240" preserveAspectRatio="xMidYMid meet" class="h-full w-full" role="img"
                 aria-labelledby="revenue-svg-title revenue-svg-desc"
                 x-html="revenueChart.svg"
                 @mouseover="if ($event.target.dataset.idx !== undefined) revTip = revenueChart.pts[+$event.target.dataset.idx]"
                 @mouseout="revTip = null"></svg>
            <div x-show="revTip" x-cloak aria-hidden="true"
                 class="pointer-events-none absolute z-10 -translate-x-1/2 -translate-y-[calc(100%+10px)] whitespace-nowrap rounded-lg border border-line bg-card px-3 py-1.5 text-xs font-bold shadow-pop"
                 :style="revTip ? ('left:' + revTip.leftPct + '%; top:' + revTip.topPct + '%') : ''">
              <span x-text="revTip && revTip.longLabel"></span>: <span class="text-brand" x-text="revTip && revTip.valueText"></span>
            </div>
          </div>

          <button type="button" class="mt-3 rounded text-xs font-bold text-brand hover:underline focus-visible:ring-2" @click="revTableOpen = !revTableOpen"
                  :aria-expanded="revTableOpen.toString()" aria-controls="revenue-table">
            <span x-text="revTableOpen ? t('dash.chart.hideTable') : t('dash.chart.viewTable')"></span>
          </button>
          <div id="revenue-table" x-show="revTableOpen" x-cloak class="mt-2 overflow-x-auto rounded-lg border border-line">
            <table class="w-full text-xs">
              <caption class="sr-only" x-text="t('dash.chart.revenue')"></caption>
              <thead class="bg-soft/60 text-muted"><tr>
                <th scope="col" class="px-3 py-2 text-start font-extrabold" x-text="t('dash.chart.colMonth')"></th>
                <th scope="col" class="px-3 py-2 text-start font-extrabold" x-text="t('dash.chart.colCollected')"></th>
                <th scope="col" class="px-3 py-2 text-start font-extrabold" x-text="t('dash.chart.colRefunds')"></th>
                <th scope="col" class="px-3 py-2 text-start font-extrabold" x-text="t('dash.chart.colNet')"></th>
              </tr></thead>
              <tbody class="divide-y divide-line">
                <template x-for="r in revenueTable" :key="'rev-' + r.key">
                  <tr>
                    <th scope="row" class="px-3 py-2 text-start font-bold" x-text="r.month"></th>
                    <td class="px-3 py-2 tabular-nums" x-text="r.collected"></td>
                    <td class="px-3 py-2 tabular-nums" x-text="r.refunds"></td>
                    <td class="px-3 py-2 font-bold tabular-nums" x-text="r.net"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- توزيع الباقات (الاشتراكات القائمة) -->
        <div class="panel p-4 sm:p-5">
          <h2 class="font-extrabold" x-text="t('dash.chart.plans')"></h2>
          <p class="text-xs text-muted" x-text="tf('dash.chart.plansSub', { n: fmtNum(planTotal) })"></p>
          <ul class="mt-4 space-y-2.5" role="list">
            <template x-for="p in planView" :key="'plan-' + p.id">
              <li>
                <div class="flex items-center justify-between gap-2 text-xs font-bold text-ink">
                  <span x-text="p.name"></span>
                  <span class="tabular-nums text-muted" x-text="p.valueText"></span>
                </div>
                <div class="mt-1.5 h-2 overflow-hidden rounded-full bg-neutral-200 dark:bg-line" aria-hidden="true">
                  <div class="h-full rounded-full bg-brand" :style="'width:' + p.pct + '%'"></div>
                </div>
              </li>
            </template>
          </ul>
          <a href="plans.html" class="mt-3 inline-flex items-center gap-1 rounded text-xs font-bold text-brand hover:underline focus-visible:ring-2">
            <span x-text="t('dash.chart.managePlans')"></span>
            <i class="fa-solid fa-arrow-right rtl:-scale-x-100 text-[10px]" aria-hidden="true"></i>
          </a>
        </div>
      </section>

      <!-- ================= المؤسسات الجديدة + آخر النشاطات ================= -->
      <section class="grid grid-cols-1 gap-4 xl:grid-cols-3">

        <!-- جدول: المؤسسات الجديدة -->
        <div class="panel min-w-0 xl:col-span-2" role="region" aria-labelledby="recent-tenants-title">
          <div class="flex flex-col gap-3 border-b border-line p-4 sm:flex-row sm:items-center sm:justify-between sm:p-5">
            <div>
              <h2 id="recent-tenants-title" class="font-extrabold" x-text="t('dash.table.recentTenants')"></h2>
              <p class="text-xs text-muted" x-text="t('dash.table.recentTenantsSub')"></p>
            </div>
            <div class="flex items-center gap-2">
              <form role="search" class="relative min-w-0 flex-1 sm:max-w-xs" @submit.prevent>
                <label for="tq" class="sr-only" x-text="t('dash.table.searchTenants')"></label>
                <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-line-strong" aria-hidden="true"></i>
                <input id="tq" type="search" x-model="tenantQuery" :placeholder="t('dash.table.searchTenants')"
                       class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-3 ps-10 text-sm text-ink placeholder:text-line-strong focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
              </form>
              <a href="tenants.html" class="btn btn-outline btn-sm shrink-0"><span x-text="t('dash.table.viewAllTenants')"></span> <i class="fa-solid fa-arrow-right rtl:-scale-x-100" aria-hidden="true"></i></a>
            </div>
          </div>

          <!-- بطاقات — جوال/تابلت (عرض واحد فقط عبر wide) -->
          <template x-if="!wide">
            <ul class="grid grid-cols-1 gap-3 p-3 sm:grid-cols-2 sm:p-4" role="list">
              <template x-for="tn in filteredRecentTenants" :key="'card-' + tn.id">
                <li class="min-w-0 rounded-xl border border-line p-4">
                  <div class="flex items-start gap-3">
                    <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-soft text-sm font-extrabold text-brand" aria-hidden="true" x-text="tn.initials"></span>
                    <div class="min-w-0 flex-1">
                      <a href="tenants.html" class="block truncate rounded font-extrabold leading-6 hover:text-brand hover:underline focus-visible:ring-2" x-text="tn.name"></a>
                      <p class="truncate text-xs text-muted" x-text="tn.planName"></p>
                    </div>
                    <span class="badge shrink-0" :class="tenantTone[tn.status]" x-text="t('dash.tenantStatus.' + tn.status)"></span>
                  </div>
                  <dl class="mt-3 grid grid-cols-2 gap-2 border-t border-line pt-3 text-xs">
                    <div><dt class="text-muted" x-text="t('dash.table.colUsers')"></dt><dd class="mt-0.5 font-bold tabular-nums" x-text="tn.usersText"></dd></div>
                    <div><dt class="text-muted" x-text="t('dash.table.colJoined')"></dt>
                      <dd class="mt-0.5 font-bold"><time :datetime="tn.created_at" :title="tn.relative" x-text="tn.joined"></time></dd></div>
                  </dl>
                </li>
              </template>
              <li x-show="!filteredRecentTenants.length" class="col-span-full py-10 text-center">
                <span class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-full bg-primary-500/15 text-brand" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>
                <p class="font-bold" x-text="t('dash.table.emptyTitle')"></p>
                <p class="mt-1 text-xs text-muted" x-text="t('dash.table.emptyDesc')"></p>
                <button type="button" class="btn btn-outline btn-sm mt-3" @click="tenantQuery = ''" x-text="t('dash.table.clearSearch')"></button>
              </li>
            </ul>
          </template>

          <!-- جدول — سطح المكتب -->
          <template x-if="wide">
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <caption class="sr-only" x-text="t('dash.table.recentTenants')"></caption>
                <thead class="bg-soft/60 text-xs text-muted">
                  <tr>
                    <th scope="col" class="px-5 py-3 text-start font-extrabold" x-text="t('dash.table.colTenant')"></th>
                    <th scope="col" class="px-4 py-3 text-start font-extrabold" x-text="t('dash.table.colPlan')"></th>
                    <th scope="col" class="px-4 py-3 text-start font-extrabold" x-text="t('dash.table.colUsers')"></th>
                    <th scope="col" class="px-4 py-3 text-start font-extrabold" x-text="t('dash.table.colStatus')"></th>
                    <th scope="col" class="px-5 py-3 text-end font-extrabold" x-text="t('dash.table.colJoined')"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-line">
                  <template x-for="tn in filteredRecentTenants" :key="'row-' + tn.id">
                    <tr class="transition hover:bg-soft/40">
                      <td class="px-5 py-4">
                        <div class="flex items-center gap-3">
                          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-soft text-sm font-extrabold text-brand" aria-hidden="true" x-text="tn.initials"></span>
                          <a href="tenants.html" class="truncate rounded font-extrabold leading-6 hover:text-brand hover:underline focus-visible:ring-2" x-text="tn.name"></a>
                        </div>
                      </td>
                      <td class="px-4 py-4 text-muted" x-text="tn.planName"></td>
                      <td class="px-4 py-4 tabular-nums" x-text="tn.usersText"></td>
                      <td class="px-4 py-4"><span class="badge" :class="tenantTone[tn.status]" x-text="t('dash.tenantStatus.' + tn.status)"></span></td>
                      <td class="px-5 py-4 text-end text-muted">
                        <time class="block" :datetime="tn.created_at" x-text="tn.joined"></time>
                        <span class="text-[11px]" x-text="tn.relative"></span>
                      </td>
                    </tr>
                  </template>
                  <tr x-show="!filteredRecentTenants.length">
                    <td colspan="5" class="px-5 py-10 text-center">
                      <span class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-full bg-primary-500/15 text-brand" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>
                      <p class="font-bold" x-text="t('dash.table.emptyTitle')"></p>
                      <p class="mt-1 text-xs text-muted" x-text="t('dash.table.emptyDesc')"></p>
                      <button type="button" class="btn btn-outline btn-sm mt-3" @click="tenantQuery = ''" x-text="t('dash.table.clearSearch')"></button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </template>

          <div class="flex flex-wrap items-center justify-between gap-2 border-t border-line px-4 py-3 text-xs text-muted sm:px-5">
            <p x-text="tf('dash.table.showingCount', { n: fmtNum(filteredRecentTenants.length), total: fmtNum(recentTenants.length) })"></p>
          </div>
        </div>

        <!-- آخر النشاطات (مشتقة من المؤسسات والاشتراكات والمدفوعات والفواتير) -->
        <div class="panel min-w-0" role="region" aria-labelledby="activity-title">
          <div class="border-b border-line p-4 sm:p-5">
            <h2 id="activity-title" class="font-extrabold" x-text="t('dash.activity.title')"></h2>
            <p class="text-xs text-muted" x-text="t('dash.activity.sub')"></p>
          </div>
          <ol class="divide-y divide-line" role="list">
            <template x-for="ev in recentActivity" :key="ev.id">
              <li>
                <a :href="ev.href" class="flex gap-3 px-4 py-3 transition hover:bg-soft/40 focus-visible:ring-2 sm:px-5">
                  <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="ev.tone" aria-hidden="true"><i :class="ev.icon"></i></span>
                  <span class="min-w-0 flex-1">
                    <span class="block break-words text-sm font-bold leading-6" x-text="ev.text"></span>

            </template>
            <li x-show="!recentActivity.length" class="px-5 py-10 text-center text-sm text-muted" x-text="t('dash.activity.empty')"></li>
          </ol>
        </div>
      </section>

        <div class="flex flex-col gap-3 border-b border-line p-4 sm:p-5">
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h2 id="active-subs-title" class="font-extrabold" x-text="t('dash.table.activeSubs')"></h2>
              <p class="text-xs text-muted" x-text="t('dash.table.activeSubsSub')"></p>
            </div>
            <a href="subscriptions.html" class="btn btn-outline btn-sm shrink-0"><span x-text="t('dash.table.viewAllSubs')"></span> <i class="fa-solid fa-arrow-right rtl:-scale-x-100" aria-hidden="true"></i></a>

          <div class="flex flex-wrap gap-2" role="group" :aria-label="t('dash.table.statusFilter')">
            <template x-for="f in subFilters" :key="f">
              <button type="button" class="rounded-full border px-3 py-1.5 text-xs font-bold transition focus-visible:ring-2"
                      :class="subFilter === f ? 'border-primary-500 bg-primary-500 text-white' : 'border-line text-muted hover:bg-soft'"
                      :aria-pressed="(subFilter === f).toString()" @click="setSubFilter(f)"
                      x-text="t('dash.subStatus.' + f)"></button>
            </template>
          </div>
        </div>

        <!-- بطاقات — جوال/تابلت -->
        <template x-if="!wide">
          <ul class="grid grid-cols-1 gap-3 p-3 sm:grid-cols-2 sm:p-4" role="list">
            <template x-for="sb in filteredSubscriptions" :key="'scard-' + sb.id">
              <li class="min-w-0 rounded-xl border border-line p-4">

    const paidOf = (inv, payments) => m.sum((payments || PAYMENTS).filter(p => p.invoice_id === inv.id && p.status === 'completed').map(p => p.amount));

      else if (paid > 0) status = 'partially_paid';
      else status = overdue ? 'overdue' : 'unpaid';
      return { total, paid, refunded, net: paid - refunded, balance, overdue, status };
    };

  /* ---------- أدوات الرسم (SVG نصّي يُحقن عبر x-html — كل النصوص مُهرَّبة) ---------- */
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* خطوة «لطيفة» للمحور (1، 2، 2.5، 5 × 10ⁿ) */
  function niceStep(x, integer) {
    if (!(x > 0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(x)));
    for (const k of [1, 2, 2.5, 5, 10]) { const s = k * p; if (s >= x) return integer ? Math.max(1, Math.ceil(s)) : s; }
    return 10 * p;
  }
  function scaleY(values, integer) {
    const hi = Math.max(0, ...values), lo = Math.min(0, ...values);
    const step = niceStep((hi - lo) / 4 || 1, integer);
    const max = Math.max(step, Math.ceil(hi / step) * step), min = Math.floor(lo / step) * step;
    const ticks = [];
    for (let v = min; v <= max + 1e-9; v += step) ticks.push(+v.toFixed(6));
    return { min, max, ticks };
  }

  /* هندسة مشتركة: المحور الزمني يجري من «البداية» إلى «النهاية» — في RTL الأقدم يمينًا */
  function frame(n, rtl) {
    const W = 600, H = 240, padT = 16, padB = 30, padS = 64, padE = 14;
    const plotW = W - padS - padE, plotH = H - padT - padB, y1 = H - padB;
    const X = (x) => (rtl ? W - x : x);
    return { W, H, padT, padB, padS, padE, plotW, plotH, y1, X, n };
  }
  function axes(f, sc, fmtTick, yOf) {
    const anchor = f.X(0) === 0 ? 'end' : 'start';      // تسميات المحور الرأسي على جهة البداية
    return sc.ticks.map((v) => {
      const y = +yOf(v).toFixed(1);
      return `<line x1="${f.X(f.padS)}" x2="${f.X(f.W - f.padE)}" y1="${y}" y2="${y}" class="stroke-line" stroke-width="1"></line>` +
             `<text x="${f.X(f.padS - 8)}" y="${y + 3.5}" text-anchor="${anchor}" class="fill-muted" font-size="11" font-weight="700">${esc(fmtTick(v))}</text>`;
    }).join('');
  }
  function xLabels(f, pts) {
    return pts.map((p) => `<text x="${p.cx}" y="${f.H - 9}" text-anchor="middle" class="fill-muted" font-size="11" font-weight="700">${esc(p.label)}</text>`).join('');
  }
  function heading(o) {
    return `<title id="${o.id}-svg-title">${esc(o.title)}</title><desc id="${o.id}-svg-desc">${esc(o.desc)}</desc>`;
  }

  /* خط زمني (نمو المؤسسات التراكمي) */
  function lineChart(series, o) {
    const f = frame(series.length, o.rtl), sc = scaleY(series.map((p) => p.value), true);
    const yOf = (v) => f.y1 - ((v - sc.min) / (sc.max - sc.min)) * f.plotH;
    const pts = series.map((p, i) => {
      const xl = f.n > 1 ? f.padS + i * (f.plotW / (f.n - 1)) : f.padS + f.plotW / 2;
      const x = +f.X(xl).toFixed(1), y = +yOf(p.value).toFixed(1);
      return { ...p, x, y, cx: x, leftPct: +((x / f.W) * 100).toFixed(2), topPct: +((y / f.H) * 100).toFixed(2) };
    });
    const path = pts.map((p, i) => (i ? 'L' : 'M') + p.x + ',' + p.y).join(' ');
    const base = +yOf(Math.max(sc.min, 0)).toFixed(1);
    const area = pts.length ? `${path} L${pts[pts.length - 1].x},${base} L${pts[0].x},${base} Z` : '';
    const svg = heading(o) +
      `<defs><linearGradient id="${o.id}Fill" x1="0" y1="0" x2="0" y2="1">` +
      `<stop offset="0%" stop-color="rgb(var(--brand))" stop-opacity="0.28"></stop>` +
      `<stop offset="100%" stop-color="rgb(var(--brand))" stop-opacity="0"></stop></linearGradient></defs>` +
      axes(f, sc, o.fmtTick, yOf) +
      `<path d="${area}" fill="url(#${o.id}Fill)" stroke="none"></path>` +
      `<path d="${path}" fill="none" stroke="rgb(var(--brand))" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>` +
      xLabels(f, pts) +
      pts.map((p, i) => `<circle data-idx="${i}" data-value="${p.value}" cx="${p.x}" cy="${p.y}" r="5" class="cursor-pointer fill-card stroke-brand" stroke-width="2.5"></circle>`).join('');
    return { pts, svg, scale: sc };
  }

  /* أعمدة زمنية (الإيراد الصافي؛ يدعم القيم السالبة إن زادت المستردات عن المحصَّل) */
  function barChart(series, o) {
    const f = frame(series.length, o.rtl), sc = scaleY(series.map((p) => p.value), false);
    const yOf = (v) => f.y1 - ((v - sc.min) / (sc.max - sc.min)) * f.plotH;
    const slot = f.plotW / Math.max(f.n, 1), bw = Math.min(56, slot * 0.6), y0 = yOf(0);
    const pts = series.map((p, i) => {
      const xl = f.padS + i * slot + (slot - bw) / 2;
      const x = o.rtl ? f.W - xl - bw : xl, yv = yOf(p.value);
      const y = Math.min(yv, y0), h = Math.abs(y0 - yv);
      const cx = +(x + bw / 2).toFixed(1);
      return { ...p, x: +x.toFixed(1), y: +y.toFixed(1), w: +bw.toFixed(1), h: +h.toFixed(1), cx,
               leftPct: +((cx / f.W) * 100).toFixed(2), topPct: +((y / f.H) * 100).toFixed(2) };
    });
    const svg = heading(o) + axes(f, sc, o.fmtTick, yOf) +
      `<line x1="${f.X(f.padS)}" x2="${f.X(f.W - f.padE)}" y1="${+y0.toFixed(1)}" y2="${+y0.toFixed(1)}" class="stroke-line-strong" stroke-width="1"></line>` +
      pts.map((b, i) => `<rect data-idx="${i}" data-value="${b.value}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="3" class="cursor-pointer" fill="${b.value < 0 ? 'rgb(var(--danger))' : 'rgb(var(--brand))'}"></rect>`).join('') +
      xLabels(f, pts);
    return { pts, svg, scale: sc };
  }

  /* نسبة التغيّر عن الفترة السابقة: null عند غياب أساس للمقارنة (القسمة على صفر) */
  function pctChange(cur, prev) {
    if (!prev) return cur ? null : 0;
    return Math.round(((cur - prev) / Math.abs(prev)) * 1000) / 10;
  }

  /* ---------- الحسابات الخام (تُعاد عند كل «تحديث») ---------- */
  function computeOverview() {
    const today = SA.todayIso(), now = SA.today();
    const ago = (iso) => SA.daysBetween(iso, today);                       // كم يومًا مضى
    const T = SA.TENANTS, S = SA.SUBSCRIPTIONS, P = SA.PAYMENTS;

    /* المؤسسات حسب الحالة + المقارنة مع قبل 30 يومًا (حسب created_at) */
    const tenantsByStatus = { active: 0, trial: 0, suspended: 0, inactive: 0 };
    T.forEach((t) => { tenantsByStatus[t.status] = (tenantsByStatus[t.status] || 0) + 1; });
    const tenantsTotal = T.length;
    const tenantsPrev = T.filter((t) => ago(t.created_at) >= 30).length;

    /* الاشتراكات */
    const subsByStatus = {};
    S.forEach((s) => { subsByStatus[s.status] = (subsByStatus[s.status] || 0) + 1; });
    const mrr = SA.mrr();
    const billable = S.filter((s) => ['active', 'past_due'].includes(s.status)).length;

    /* المدفوعات: المحصَّل (مكتملة) − المستردات، على نوافذ 30 يومًا */
    const refundsAll = [];
    P.forEach((p) => (p.refunds || []).forEach((r) => refundsAll.push({ ...r, payment: p })));
    const completed = P.filter((p) => p.status === 'completed');
    const win = (from, to) => {                                               // from ≤ أيام مضت < to
      const gross = SA.m.sum(completed.filter((p) => ago(p.paid_at) >= from && ago(p.paid_at) < to).map((p) => p.amount));
      const refunds = SA.m.sum(refundsAll.filter((r) => ago(r.at) >= from && ago(r.at) < to).map((r) => r.amount));
      return { gross, refunds, net: gross - refunds };
    };
    const rev30 = win(0, 30), revPrev30 = win(30, 60);

    /* الأشهر الستة الأخيرة (تقويمية، تشمل الشهر الحالي) */
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1, 12);
      const end = new Date(d.getFullYear(), d.getMonth() + 1, 0, 12);
      const endIso = SA.isoLocal(end) < today ? SA.isoLocal(end) : today;
      months.push({ key: SA.isoLocal(d).slice(0, 7), start: SA.isoLocal(d), end: endIso });
    }
    const growthBaseline = T.filter((t) => t.created_at < months[0].start).length;
    const growth = months.map((mo) => ({
      key: mo.key, start: mo.start,
      added: T.filter((t) => t.created_at.slice(0, 7) === mo.key).length,
      total: T.filter((t) => t.created_at <= mo.end).length,
    }));
    const revenue = months.map((mo) => {
      const collected = SA.m.sum(completed.filter((p) => p.paid_at.slice(0, 7) === mo.key).map((p) => p.amount));
      const refunds = SA.m.sum(refundsAll.filter((r) => r.at.slice(0, 7) === mo.key).map((r) => r.amount));
      return { key: mo.key, start: mo.start, collected, refunds, net: collected - refunds };
    });

    /* الفواتير: المستحق والمتأخر من الحالة المشتقة */
    let outstanding = 0, overdue = 0, overdueCount = 0, openCount = 0;
    SA.INVOICES.forEach((inv) => {
      const st = SA.invoiceState(inv);
      if (st.status === 'void') return;
      if (st.balance > 0) { outstanding += st.balance; openCount++; }
      if (st.overdue) { overdue += st.balance; overdueCount++; }
    });

    /* توزيع الباقات: الاشتراكات القائمة (غير الملغاة/المنتهية) */
    const LIVE = ['active', 'trialing', 'past_due', 'paused'];
    const plans = SA.PLANS.map((p) => {
      const subs = S.filter((s) => s.plan_id === p.id && LIVE.includes(s.status));
      return { id: p.id, count: subs.length,
               mrr: SA.m.sum(subs.filter((s) => ['active', 'past_due'].includes(s.status)).map(() => p.price_monthly)) };
    }).filter((p) => p.count > 0 || SA.plan(p.id).is_active);

    /* النشاطات الأخيرة (أحداث مشتقة) */
    const events = [];
    T.forEach((t) => events.push({ id: 'tn-' + t.id, type: 'tenantCreated', at: t.created_at, tenant: t.id, href: 'tenants.html' }));
    S.forEach((s) => { if (s.cancelled_at) events.push({ id: 'sc-' + s.id, type: 'subCancelled', at: s.cancelled_at, tenant: s.tenant_id, plan: s.plan_id, href: 'subscriptions.html' }); });
    P.forEach((p) => {
      events.push({ id: 'py-' + p.id, type: 'payment_' + p.status, at: p.paid_at, tenant: p.tenant_id, amount: p.amount, href: 'payments.html' });
      (p.refunds || []).forEach((r) => events.push({ id: 'rf-' + r.id, type: 'refund', at: r.at, tenant: p.tenant_id, amount: r.amount, href: 'payments.html' }));
    });
    SA.INVOICES.forEach((inv) => { if (inv.voided_at) events.push({ id: 'iv-' + inv.id, type: 'invoiceVoided', at: inv.voided_at, tenant: inv.tenant_id, number: inv.invoice_number, href: 'payments.html' }); });
    const activity = events.filter((e) => e.at <= today)
      .sort((a, b) => (a.at === b.at ? a.id.localeCompare(b.id) : a.at < b.at ? 1 : -1)).slice(0, 8);

    return {
      today, tenantsByStatus, tenantsTotal, tenantsPrev,
      subsByStatus, mrr, arr: mrr * 12, billable,
      rev30, revPrev30, growthBaseline, growth, revenue,
      outstanding, overdue, overdueCount, openCount, plans, activity,
    };
  }

    /* بحث مطبَّع (عربي/إنجليزي) */
    const norm = (s) => String(s || '').toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim();

    return {
      /* ---------- حالة عامة (Shell) ---------- */
      dark: document.documentElement.classList.contains('dark'),
      locale: document.documentElement.lang === 'en' ? 'en' : 'ar',
      mobile: !desktopMQ.matches,
      wide: desktopMQ.matches,
      mobileNav: false,
      collapsed: false,
      notifOpen: false, profileOpen: false,
      active: 'dashboard',
      liveMsg: '',
      get expanded() { return this.mobile || !this.collapsed; },

      t(path) {
        const dict = I18N[this.locale];
        return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), dict) ?? path;
      },
      tf(path, vars) {
        return String(this.t(path)).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined ? vars[k] : m));
      },
      get loc() { return SA.fmtLocale(this.locale); },
      fmtNum(n) { return SA.fmtNum(n, this.locale); },
      money(minor) { return SA.money(minor, this.locale); },
      fmtPct(p) {
        if (p === null || p === undefined || !isFinite(p)) return '—';
        return new Intl.NumberFormat(this.loc, { style: 'percent', maximumFractionDigits: 1, signDisplay: 'exceptZero' }).format(p / 100);
      },
      relTime(iso) {
        const days = SA.daysBetween(iso, this.stats ? this.stats.today : SA.todayIso());
        const rtf = new Intl.RelativeTimeFormat(this.loc, { numeric: 'auto' });
        if (Math.abs(days) < 30) return rtf.format(-days, 'day');
        if (Math.abs(days) < 365) return rtf.format(-Math.round(days / 30), 'month');
        return rtf.format(-Math.round(days / 365), 'year');
      },
      relMinutes(mins) {
        const rtf = new Intl.RelativeTimeFormat(this.loc, { numeric: 'auto' });
        return mins < 60 ? rtf.format(-mins, 'minute') : rtf.format(-Math.round(mins / 60), 'hour');
      },
      monthLabel(startIso, long) {
        return SA.fmtDate(startIso, this.locale, long ? { month: 'long', year: 'numeric' } : { month: 'short' });
      },
      tenantName(id) { const tn = SA.tenant(id); return tn ? tn.name[this.locale] : id; },
      planName(id) { const p = SA.plan(id); return p ? p.name[this.locale] : '—'; },
      setLocale(loc) {
        this.locale = loc;
        document.documentElement.lang = loc;
        document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
        document.title = this.t('dash.pageTitle');
        try { localStorage.setItem('firob-locale', loc); } catch (e) {}
      },
      toggleLocale() { this.setLocale(this.locale === 'ar' ? 'en' : 'ar'); },

      nav: [
        { group: 'overview', items: [
          { key: 'dashboard', icon: 'fa-solid fa-gauge-high', href: 'overview.html' },
          { key: 'aiAnalytics', icon: 'fa-solid fa-robot', href: 'ai-analytics.html' },
        ]},
        { group: 'admin', items: [
          { key: 'tenants', icon: 'fa-solid fa-building-columns', href: 'tenants.html' },
          { key: 'plans', icon: 'fa-solid fa-cubes', href: 'plans.html' },
          { key: 'subscriptions', icon: 'fa-solid fa-layer-group', href: 'subscriptions.html' },
          { key: 'payments', icon: 'fa-solid fa-file-invoice-dollar', href: 'payments.html' },
        ]},
        { group: 'system', items: [
          { key: 'activityLog', icon: 'fa-solid fa-clock-rotate-left', href: 'activity-log.html' },
          { key: 'systemSettings', icon: 'fa-solid fa-sliders', href: 'system-settings.html' },
        ]},
      ],
      setActive(key) { this.active = key; this.mobileNav = false; },

      notifications: [
        { id: 1, key: 'upload', vars: { n: 12 }, mins: 5, read: false, icon: 'fa-solid fa-upload', tone: 'bg-primary-500/15 text-brand' },
        { id: 2, key: 'quota', vars: { pct: 87 }, mins: 60, read: false, icon: 'fa-solid fa-triangle-exclamation', tone: 'bg-warning-500/15 text-warning-700 dark:text-warning-500' },
        { id: 3, key: 'backup', vars: {}, mins: 360, read: true, icon: 'fa-solid fa-database', tone: 'bg-success-500/15 text-success-700 dark:text-success-500' },
      ],
      notifText(n) {
        const v = {};
        if (n.vars.n !== undefined) v.n = this.fmtNum(n.vars.n);
        if (n.vars.pct !== undefined) v.pct = this.fmtPct(n.vars.pct).replace(/^[+‎]+/, '');
        return this.tf('notif.' + n.key, v);
      },
      get unread() { return this.notifications.filter(n => !n.read).length; },

      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; this.wide = m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        document.title = this.t('dash.pageTitle');
        this.compute();
        this.$watch('tenantQuery', () => {
          this.liveMsg = this.tf('dash.table.liveTenants', { n: this.fmtNum(this.filteredRecentTenants.length) });
        });
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },

      /* ================= LND-01: بيانات اللوحة ================= */
      stats: null,
      updatedAt: null,
      loading: false,
      pctChange,
      compute() {
        this.stats = computeOverview();
        this.updatedAt = new Date();
      },
      get updatedLabel() {
        return this.updatedAt ? new Intl.DateTimeFormat(this.loc, { hour: 'numeric', minute: '2-digit', second: '2-digit' }).format(this.updatedAt) : '';
      },
      /* تحديث فعلي: يعيد الحساب من البيانات، ويعلن الوقت فقط بعد النجاح */
      async refresh() {
        if (this.loading) return;
        this.loading = true;
        this.liveMsg = this.t('dash.refreshing');
        try {
          await new Promise((r) => setTimeout(r, 250));      // يُفسح المجال لإظهار حالة الانشغال
          this.compute();
          this.liveMsg = this.tf('dash.updatedLive', { time: this.updatedLabel });
        } catch (e) {
          this.liveMsg = this.t('dash.refreshFailed');
        } finally {
          this.loading = false;
        }
      },

      trendView(pct, note) {
        const s = { pct: this.fmtPct(Math.abs(pct || 0)) };
        if (pct === null) return { pct, text: '—', tone: 'text-muted', icon: 'fa-minus', sr: this.t('dash.trend.noBaseline'), note: this.t('dash.trend.noBaseline') };
        if (pct === 0) return { pct, text: this.fmtPct(0), tone: 'text-muted', icon: 'fa-minus', sr: this.t('dash.trend.flat'), note: this.t(note) };
        const up = pct > 0;
        return { pct, text: this.fmtPct(pct), tone: up ? 'text-success-700 dark:text-success-500' : 'text-error-700 dark:text-red-300',
                 icon: up ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down', sr: this.tf(up ? 'dash.trend.up' : 'dash.trend.down', s), note: this.t(note) };
      },

      /* ---------- KPIs ---------- */
      get kpis() {
        const s = this.stats; if (!s) return [];
        const n = (x) => this.fmtNum(x || 0);
        const tenTrend = this.trendView(pctChange(s.tenantsTotal, s.tenantsPrev), 'dash.trend.vs30');
        const revTrend = this.trendView(pctChange(s.rev30.net, s.revPrev30.net), 'dash.trend.vsPrev30');
        const noHist = this.t('dash.trend.noHistory');
        return [
          { key: 'tenants', raw: s.tenantsTotal, value: n(s.tenantsTotal), href: 'tenants.html',
            sub: this.tf('dash.kpi.tenantsSub', { active: n(s.tenantsByStatus.active), trial: n(s.tenantsByStatus.trial), suspended: n(s.tenantsByStatus.suspended), inactive: n(s.tenantsByStatus.inactive) }),
            trend: tenTrend, note: tenTrend.note, icon: 'fa-solid fa-building-columns', tone: 'bg-primary-500/15 text-brand' },
          { key: 'activeSubs', raw: s.subsByStatus.active || 0, value: n(s.subsByStatus.active), href: 'subscriptions.html',
            sub: this.tf('dash.kpi.activeSubsSub', { trialing: n(s.subsByStatus.trialing), past_due: n(s.subsByStatus.past_due), paused: n(s.subsByStatus.paused) }),
            trend: null, note: noHist, icon: 'fa-solid fa-layer-group', tone: 'bg-success-500/15 text-success-700 dark:text-success-500' },
          { key: 'mrr', raw: s.mrr, value: this.money(s.mrr), href: 'subscriptions.html',
            sub: this.tf('dash.kpi.mrrSub', { n: n(s.billable) }),
            trend: null, note: noHist, icon: 'fa-solid fa-arrows-spin', tone: 'bg-info-500/15 text-info-700 dark:text-blue-300' },
          { key: 'arr', raw: s.arr, value: SA.moneyShort(s.arr, this.locale), href: 'plans.html',
            sub: this.t('dash.kpi.arrSub'),
            trend: null, note: noHist, icon: 'fa-solid fa-chart-line', tone: 'bg-primary-500/15 text-brand' },
          { key: 'revenue30', raw: s.rev30.net, value: this.money(s.rev30.net), href: 'payments.html',
            sub: this.tf('dash.kpi.revenueSub', { gross: this.money(s.rev30.gross), refunds: this.money(s.rev30.refunds) }),
            trend: revTrend, note: revTrend.note, icon: 'fa-solid fa-sack-dollar', tone: 'bg-success-500/15 text-success-700 dark:text-success-500' },
          { key: 'outstanding', raw: s.outstanding, value: this.money(s.outstanding), href: 'payments.html',
            sub: this.tf('dash.kpi.outstandingSub', { amount: this.money(s.overdue), n: n(s.overdueCount) }),
            trend: null, note: noHist, icon: 'fa-solid fa-file-invoice-dollar', tone: 'bg-warning-500/15 text-warning-800 dark:text-warning-500' },
        ];
      },

      /* ---------- نمو المؤسسات ---------- */
      growthTip: null, growthTableOpen: false,
      get growthSeries() {
        return this.stats ? this.stats.growth.map((g) => ({ ...g, value: g.total, label: this.monthLabel(g.start), longLabel: this.monthLabel(g.start, true), valueText: this.fmtNum(g.total) })) : [];
      },
      get growthChart() {
        const series = this.growthSeries;
        if (!series.length) return { pts: [], svg: '' };
        const first = series[0], last = series[series.length - 1];
        return lineChart(series, {
          id: 'growth', rtl: this.locale === 'ar', fmtTick: (v) => this.fmtNum(v),
          title: this.t('dash.chart.tenantsGrowth'),
          desc: this.tf('dash.chart.growthDesc', { from: this.fmtNum(this.stats.growthBaseline), first: first.longLabel, to: this.fmtNum(last.total), last: last.longLabel,
                                                   added: this.fmtNum(series.reduce((a, g) => a + g.added, 0)) }),
        });
      },
      get growthTable() {
        return this.growthSeries.map((g) => ({ key: g.key, month: g.longLabel, added: this.fmtNum(g.added), total: g.valueText }));
      },
      get growthBadge() {
        const s = this.stats; if (!s || !s.growth.length) return { text: '—', cls: 'badge-muted', icon: 'fa-minus', sr: '' };
        const v = this.trendView(pctChange(s.growth[s.growth.length - 1].total, s.growthBaseline), 'dash.chart.growthBadge');
        return { text: v.text, icon: v.icon, sr: (v.pct === null ? v.sr : this.t('dash.chart.growthBadge')),
                 cls: v.pct === null || v.pct === 0 ? 'badge-muted' : v.pct > 0 ? 'badge-success' : 'badge-danger' };
      },

      /* ---------- الإيراد الشهري الصافي ---------- */
      revTip: null, revTableOpen: false,
      get revenueSeries() {
        return this.stats ? this.stats.revenue.map((r) => ({ ...r, value: r.net, label: this.monthLabel(r.start), longLabel: this.monthLabel(r.start, true), valueText: this.money(r.net) })) : [];
      },
      get revenueTotals() {
        const s = this.revenueSeries;
        return { collected: SA.m.sum(s.map((r) => r.collected)), refunds: SA.m.sum(s.map((r) => r.refunds)), net: SA.m.sum(s.map((r) => r.net)) };
      },
      get revenueChart() {
        const series = this.revenueSeries;
        if (!series.length) return { pts: [], svg: '' };
        const peak = series.reduce((a, r) => (r.net > a.net ? r : a), series[0]);
        return barChart(series, {
          id: 'revenue', rtl: this.locale === 'ar', fmtTick: (v) => new Intl.NumberFormat(this.loc, { style: 'currency', currency: SA.CURRENCY, notation: 'compact', minimumFractionDigits: 0, maximumFractionDigits: 1 }).format(v / 100),
          title: this.t('dash.chart.revenue'),
          desc: this.tf('dash.chart.revenueDesc', { first: series[0].longLabel, last: series[series.length - 1].longLabel,
                                                    total: this.money(this.revenueTotals.net), peak: peak.longLabel, peakValue: this.money(peak.net) }),
        });
      },
      get revenueTable() {
        return this.revenueSeries.map((r) => ({ key: r.key, month: r.longLabel, collected: this.money(r.collected), refunds: this.money(r.refunds), net: r.valueText }));
      },

      /* ---------- توزيع الباقات ---------- */
      get planTotal() { return this.stats ? this.stats.plans.reduce((a, p) => a + p.count, 0) : 0; },
      get planView() {
        if (!this.stats) return [];
        const total = this.planTotal || 1;
        return this.stats.plans.map((p) => ({ ...p, name: this.planName(p.id), pct: +((p.count / total) * 100).toFixed(1),
          valueText: this.tf('dash.chart.planValue', { n: this.fmtNum(p.count), mrr: this.money(p.mrr) }) }));
      },

      /* ---------- الاشتراكات (الحالي لكل مؤسسة) ---------- */
      subFilter: 'all',
      subFilters: ['all', 'active', 'trialing', 'past_due', 'paused', 'cancelled', 'expired'],
      subStatusTone: { trialing: 'badge-primary', active: 'badge-success', past_due: 'badge-accent', paused: 'badge-info', cancelled: 'badge-muted', expired: 'badge-danger' },
      subStatusBar: { trialing: 'bg-brand', active: 'bg-success-700 dark:bg-success-500', past_due: 'bg-warning-700 dark:bg-warning-500', paused: 'bg-info-700 dark:bg-info-500', cancelled: 'bg-line-strong', expired: 'bg-error-700 dark:bg-error-500' },
      get subsRows() {
        if (!this.stats) return [];
        return SA.TENANTS.map((tn) => SA.currentSubscription(tn.id)).filter(Boolean).map((sb) => {
          const p = SA.plan(sb.plan_id);
          const billing = ['active', 'past_due'].includes(sb.status);
          const usagePct = p.max_users ? Math.min(100, Math.round((sb.usage.usersUsed / p.max_users) * 100)) : 0;
          return {
            id: sb.id, tenant_id: sb.tenant_id, tenantName: this.tenantName(sb.tenant_id), planName: p.name[this.locale], status: sb.status,
            mrr: billing ? p.price_monthly : null, mrrText: billing ? this.money(p.price_monthly) : '—',
            usagePct, usageText: this.fmtPct(usagePct).replace(/^[+‎]+/, '') + ' (' + this.tf('dash.table.usersOf', { used: this.fmtNum(sb.usage.usersUsed), max: this.fmtNum(p.max_users) }) + ')',
            ends_at: sb.ends_at, endsText: SA.fmtDate(sb.ends_at, this.locale),
            renews: sb.auto_renew && !['cancelled', 'expired'].includes(sb.status),
          };
        });
      },
      get subStatusView() {
        const rows = this.subsRows, total = rows.length || 1;
        return this.subFilters.filter((f) => f !== 'all').map((key) => {
          const value = rows.filter((r) => r.status === key).length;
          return { key, value, valueText: this.fmtNum(value), pct: +((value / total) * 100).toFixed(1), bar: this.subStatusBar[key] };
        });
      },
      get filteredSubscriptions() {
        return this.subFilter === 'all' ? this.subsRows : this.subsRows.filter((s) => s.status === this.subFilter);
      },
      setSubFilter(f) {
        this.subFilter = f;
        this.liveMsg = this.tf('dash.table.liveSubs', { n: this.fmtNum(this.filteredSubscriptions.length), status: this.t('dash.subStatus.' + f) });
      },
      usageBar(pct) { return pct >= 90 ? 'bg-error-700 dark:bg-error-500' : pct >= 75 ? 'bg-warning-700 dark:bg-warning-500' : 'bg-brand'; },

      /* ---------- المؤسسات الجديدة ---------- */
      tenantQuery: '',
      tenantTone: { active: 'badge-success', trial: 'badge-primary', suspended: 'badge-accent', inactive: 'badge-muted' },
      get recentTenants() {
        if (!this.stats) return [];
        return SA.TENANTS.slice().sort((a, b) => (a.created_at === b.created_at ? 0 : a.created_at < b.created_at ? 1 : -1)).slice(0, 6).map((tn) => {
          const sb = SA.currentSubscription(tn.id), p = sb ? SA.plan(sb.plan_id) : null;
          const name = tn.name[this.locale];
          return {
            id: tn.id, name, names: [tn.name.ar, tn.name.en], status: tn.status, created_at: tn.created_at,
            initials: name.replace(/^(د\.|أ\.|م\.)\s*/, '').split(/\s+/).slice(0, 2).map((w) => w.charAt(0)).join('').toUpperCase(),
            planName: p ? p.name[this.locale] : '—',
            usersText: sb ? this.fmtNum(sb.usage.usersUsed) : '—',
            joined: SA.fmtDate(tn.created_at, this.locale), relative: this.relTime(tn.created_at),
          };
        });
      },
      get filteredRecentTenants() {
        const q = norm(this.tenantQuery);
        return this.recentTenants.filter((tn) => !q || tn.names.some((n) => norm(n).includes(q)));
      },

      /* ---------- آخر النشاطات ---------- */
      activityIcon: {
        tenantCreated: ['fa-solid fa-building-columns', 'bg-primary-500/15 text-brand'],
        subCancelled: ['fa-solid fa-ban', 'bg-line text-muted'],
        payment_completed: ['fa-solid fa-circle-check', 'bg-success-500/15 text-success-700 dark:text-success-500'],
        payment_failed: ['fa-solid fa-circle-xmark', 'bg-error-500/15 text-error-700 dark:text-red-300'],
        payment_pending: ['fa-solid fa-hourglass-half', 'bg-warning-500/15 text-warning-800 dark:text-warning-500'],
        refund: ['fa-solid fa-rotate-left', 'bg-info-500/15 text-info-700 dark:text-blue-300'],
        invoiceVoided: ['fa-solid fa-file-circle-xmark', 'bg-line text-muted'],
      },
      get recentActivity() {
        if (!this.stats) return [];
        return this.stats.activity.map((e) => {
          const [icon, tone] = this.activityIcon[e.type] || ['fa-solid fa-circle', 'bg-line text-muted'];
          return { id: e.id, type: e.type, at: e.at, href: e.href, icon, tone,
                   text: this.tf('dash.activity.' + e.type, { tenant: this.tenantName(e.tenant), amount: e.amount !== undefined ? this.money(e.amount) : '', plan: e.plan ? this.planName(e.plan) : '', number: e.number || '' }),
                   date: SA.fmtDate(e.at, this.locale), relative: this.relTime(e.at) };
        });
      },
    };
  }
</script>
