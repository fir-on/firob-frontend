          { key: 'kpiTotalPermissions', icon: 'fa-key',                  value: this.allPermCodes.length,                tone: 'bg-info/15 text-info', note: this.tf('rm.kpiDangerNote', { n: this.fmt(dangerTotal) }) },
          { key: 'kpiCustomRoles',      icon: 'fa-wand-magic-sparkles',  value: this.roles.filter(r => r.isCustom).length, tone: 'bg-accent-500/20 text-onaccent dark:text-accent-500' },
          { key: 'kpiPending',          icon: 'fa-pen-to-square',        value: this.changes.length,                     tone: this.dirty ? 'bg-accent-500/25 text-onaccent dark:text-accent-500' : 'bg-line text-muted',
            note: this.dirty ? this.tf('rm.kpiPendingNote', { g: this.fmt(this.grantedChanges.length), r: this.fmt(this.revokedChanges.length) }) : '' },
        ];
      },

      /* ---------- إبراز دور (بعد الإنشاء) ---------- */
      flashedRoleId: null,
      flashRole(id) {
        this.flashedRoleId = id;
        setTimeout(() => { this.flashedRoleId = null; }, 1700);
      },

      /* ---------- الجوال: اختيار الدور ---------- */
      selectedMobileRoleId: 2,
      get selectedMobileRole() { return this.roles.find(r => r.id === this.selectedMobileRoleId) || this.roles[0]; },
      roleKey(e) {
        const rtl = document.documentElement.dir === 'rtl';
        const d = { ArrowRight: rtl ? -1 : 1, ArrowLeft: rtl ? 1 : -1, ArrowDown: 1, ArrowUp: -1, Home: -999, End: 999 }[e.key];
        if (d === undefined) return;
        e.preventDefault();
        const ids = this.roles.map(r => r.id);
        const i = Math.min(Math.max(ids.indexOf(this.selectedMobileRoleId) + d, 0), ids.length - 1);
        this.selectedMobileRoleId = ids[i];
        this.$nextTick(() => document.getElementById('rt-' + ids[i])?.focus());
      },

      /* ---------- النوافذ الموحّدة ---------- */
      modal: null, roleToDelete: null, reassignTo: null, pendingHref: null, _modalReturn: null,
      openModal(type, payload = null) {
        this.closeMenu();
        this._modalReturn = document.activeElement;
        if (type === 'deleteRole') { this.roleToDelete = payload; this.reassignTo = null; }
        if (type === 'leave') this.pendingHref = payload;
        this.modal = type;
      },
      get modalMeta() {
        const n = this.fmt(this.changes.length);
        switch (this.modal) {
          case 'review': return { title: this.t('rm.reviewTitle'), text: this.tf('rm.reviewText', { n, r: this.fmt(this.changesByRole.length) }),
            confirm: this.t('rm.saveNow'), cancel: this.t('rm.back'), btn: 'btn-primary', tone: 'bg-primary-500/15 text-brand', icon: 'fa-list-check' };
          case 'discard': return { title: this.t('rm.discardTitle'), text: this.tf('rm.discardText', { n }),
            confirm: this.t('rm.discardConfirm'), cancel: this.t('rm.back'), btn: 'btn-danger', tone: 'bg-error-500/15 text-danger', icon: 'fa-rotate-left' };
          case 'global': {
            const grant = !this.globalAllChecked;
            const danger = grant ? this.visiblePermCodes.filter(c => this.permByCode[c].danger).length : 0;
            return { title: grant ? this.t('rm.globalGrantTitle') : this.t('rm.globalRevokeTitle'),
              text: this.tf('rm.globalText', { p: this.fmt(this.visiblePermCodes.length), r: this.fmt(this.editableRoles.length) }) + (danger ? this.tf('rm.globalDanger', { n: this.fmt(danger) }) : ''),
              confirm: grant ? this.t('rm.globalGrantConfirm') : this.t('rm.globalRevokeConfirm'), cancel: this.t('rm.cancel'),
              btn: grant ? 'btn-accent' : 'btn-danger', tone: grant ? 'bg-warning-500/15 text-warn' : 'bg-error-500/15 text-danger', icon: grant ? 'fa-triangle-exclamation' : 'fa-square-minus' };
          }
          case 'deleteRole': {
            const r = this.roleToDelete || { users: 0, names: { ar: '', en: '' } };
            return { title: this.tf('rm.deleteRoleTitle', { name: this.roleName(r) }),
              text: r.users ? this.tf('rm.deleteRoleTextUsers', { n: this.fmt(r.users) }) : this.t('rm.deleteRoleText'),
              confirm: this.t('rm.deleteRoleConfirm'), cancel: this.t('rm.cancel'), btn: 'btn-danger', tone: 'bg-error-500/15 text-danger', icon: 'fa-trash' };
          }
          case 'leave': return { title: this.t('rm.leaveTitle'), text: this.tf('rm.leaveText', { n }),
            confirm: this.t('rm.leaveConfirm'), cancel: this.t('rm.stay'), btn: 'btn-danger', tone: 'bg-warning-500/15 text-warn', icon: 'fa-door-open' };
        }
        return { title: '', text: '', confirm: '', cancel: '', btn: '', tone: '', icon: '' };
      },
      get modalBlocked() { return this.modal === 'deleteRole' && !!this.roleToDelete?.users && !this.reassignTo; },
      closeModal() {
        if (this.busy) return;
        this.modal = null; this.roleToDelete = null; this.pendingHref = null;
        const el = this._modalReturn;
        setTimeout(() => (el && el.isConnected && el.offsetParent !== null ? el : document.getElementById('main'))?.focus({ preventScroll: true }), 60);
      },
      async modalConfirm() {
        if (this.busy || this.modalBlocked) return;
        const type = this.modal;
        if (type === 'review') {
          this.busy = true;
          /* Livewire: $wire.syncPermissions(changes) — الخادم يتحقق من الصلاحية ويسجّل في activity_log */
          await new Promise(r => setTimeout(r, 600));
          const n = this.changes.length;
          this.originalMatrix = clone(this.matrix);
          this.busy = false;
          this.toast('success', this.tf('rm.toastMatrixSaved', { n: this.fmt(n) }));
        } else if (type === 'discard') {
          this.matrix = clone(this.originalMatrix);
          this.toast('info', this.t('rm.toastMatrixDiscarded'));
        } else if (type === 'global') {
          const v = !this.globalAllChecked;
          this.editableRoles.forEach(r => this.visiblePermCodes.forEach(c => this.setCell(r, c, v)));
        } else if (type === 'deleteRole') {
          const role = this.roleToDelete;
          this.busy = true;
          await new Promise(r => setTimeout(r, 450));
          if (role.users && this.reassignTo) { const to = this.roles.find(x => x.id === this.reassignTo); if (to) to.users += role.users; }
          this.roles = this.roles.filter(r => r.id !== role.id);
          delete this.matrix[role.id]; delete this.originalMatrix[role.id];
          if (this.selectedMobileRoleId === role.id) this.selectedMobileRoleId = this.roles[0].id;
          this.busy = false;
          this.toast('success', this.tf('rm.toastRoleDeleted', { name: this.roleName(role) }));
        } else if (type === 'leave') {
          const href = this.pendingHref;
          this._leaving = true;
          this.modal = null;
          window.location.href = href;
          return;
        }
        this.modal = null; this.roleToDelete = null;
        const el = this._modalReturn;
        setTimeout(() => (el && el.isConnected && el.offsetParent !== null ? el : document.getElementById('main'))?.focus({ preventScroll: true }), 60);
      },

      /* ---------- اللوحة الجانبية: إضافة / تعديل / استنساخ ---------- */
      panelOpen: false, editingRole: null, formSubmitted: false, touched: false, discardAsk: false, _snapshot: '', _panelTrigger: null,
      roleForm: { name: '', description: '', cloneFromId: '' },
      slugify(text) {
        return String(text || '').toLowerCase().replace(/[ً-ْ]/g, '')
          .replace(/[؀-ۿ]/g, ch => AR_LATIN[ch] ?? '')
          .normalize('NFKD').replace(/[̀-ͯ]/g, '')
          .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);
      },
      uniqueKey(base) {
        let k = base || 'custom_role', i = 2;
        while (this.roles.some(r => r.key === k)) k = (base || 'custom_role') + '_' + i++;
        return k;
      },
      get roleKeyPreview() { return this.uniqueKey(this.slugify(this.roleForm.name)); },
      get nameError() {
        const n = this.roleForm.name.trim().toLowerCase();
        if (!n) return 'nameRequired';
        if (n.length < 2) return 'nameShort';
        if (this.roles.some(r => r.id !== this.editingRole?.id && (r.names.ar.toLowerCase() === n || r.names.en.toLowerCase() === n))) return 'nameTaken';
        return '';
      },
      get cloneSource() { return this.roleForm.cloneFromId ? this.roles.find(r => r.id === this.roleForm.cloneFromId) : null; },
      get cloneHint() {
        const s = this.cloneSource;
        if (!s) return this.t('rm.cloneHintNone');
        return this.tf('rm.cloneHintFrom', { n: this.fmt(this.grantedCount(s)), role: this.roleName(s) }) + (this.roleChangeCount(s) ? ' ' + this.t('rm.cloneHintUnsaved') : '');
      },
      get panelDirty() { return JSON.stringify(this.roleForm) !== this._snapshot; },
      openCreateRole(cloneFromId = null, trigger = null) {
        this.closeMenu();
        this._panelTrigger = trigger || this._menuBtn || this.$refs.addBtn;
        this.editingRole = null;
        const src = cloneFromId ? this.roles.find(r => r.id === cloneFromId) : null;
        this.roleForm = { name: src ? this.tf('rm.cloneNamePrefix', { name: this.roleName(src) }) : '', description: src ? this.roleDesc(src) : '', cloneFromId: cloneFromId || '' };
        this._openPanel();
      },
      openEditRole(role) {
        this._panelTrigger = this._menuBtn;
        this.editingRole = role;
        this.roleForm = { name: this.roleName(role), description: this.roleDesc(role), cloneFromId: '' };
        this._openPanel();
      },
      _openPanel() {
        this.formSubmitted = false; this.touched = false; this.discardAsk = false;
        this._snapshot = JSON.stringify(this.roleForm);
        this.panelOpen = true;
        setTimeout(() => { const i = document.getElementById('rf-name'); i?.focus(); i?.select(); }, 80);
      },
      closePanel() {
        if (this.busy) return;
        if (this.panelDirty && !this.discardAsk) { this.discardAsk = true; this.$nextTick(() => this.$refs.keepEditing?.focus()); return; }
        this.forceClosePanel();
      },
      forceClosePanel() {
        this.panelOpen = false; this.discardAsk = false;
        const t = this._panelTrigger;
        setTimeout(() => (t && t.isConnected && t.offsetParent !== null ? t : this.$refs.addBtn)?.focus(), 320);
      },
      async submitRole() {
        if (this.busy) return;
        this.formSubmitted = true;
        if (this.nameError) { this.$nextTick(() => document.getElementById('rf-name')?.focus()); return; }
        this.busy = true;
        await new Promise(r => setTimeout(r, 500));
        const name = this.roleForm.name.trim(), desc = this.roleForm.description.trim();
        if (this.editingRole) {
          this.editingRole.names[this.locale] = name;
          this.editingRole.descs[this.locale] = desc;
          this.toast('success', this.tf('rm.toastRoleUpdated', { name }));
        } else {
          /* الإنشاء ذرّي: الدور + صلاحياته المنسوخة تُحفظ معًا (لا تظهر كتغييرات معلّقة) */
          const id = this.nextRoleId++, src = this.cloneSource, base = {};
          this.allPermCodes.forEach(c => { base[c] = src ? this.cellChecked(src, c) : false; });
          this.roles.push({ id, key: this.roleKeyPreview, names: { ar: name, en: name }, descs: { ar: desc, en: desc }, isSystem: false, isCustom: true, users: 0 });
          this.matrix[id] = base;
          this.originalMatrix[id] = clone(base);
          this.selectedMobileRoleId = id;
          this.toast('success', this.tf('rm.toastRoleCreated', { name }));
          this.flashRole(id);
          this.$nextTick(() => { const s = this.$refs.matrixScroll; if (s) s.scrollTo({ left: document.documentElement.dir === 'rtl' ? -s.scrollWidth : s.scrollWidth, behavior: 'smooth' }); });
        }
        this.busy = false;
        this._snapshot = JSON.stringify(this.roleForm);
        this.forceClosePanel();
      },

      /* ---------- قائمة إجراءات الدور (Kebab) ---------- */
      openMenuId: null, kebabRole: null, menuPos: { top: -999, left: -999 }, _menuBtn: null,
      toggleMenu(role, evt, viaKey = false) {
        if (this.openMenuId === role.id && !viaKey) { this.closeMenu(true); return; }
        this._menuBtn = evt.currentTarget;
        this.kebabRole = role;
        this.menuPos = { top: -999, left: -999 };
        this.openMenuId = role.id;
        this.$nextTick(() => requestAnimationFrame(() => {
          const r = this._menuBtn.getBoundingClientRect(), m = this.$refs.kebab, pad = 8, gap = 6;
          const w = m.offsetWidth, h = m.offsetHeight, rtl = document.documentElement.dir === 'rtl';
          let left = rtl ? r.left : r.right - w;
          left = Math.min(Math.max(pad, left), window.innerWidth - w - pad);
          let top = r.bottom + gap;
          if (top + h > window.innerHeight - pad) top = Math.max(pad, r.top - h - gap);
          this.menuPos = { top, left };
          this.menuMove(0, true);
        }));
      },
      menuItems() { return [...(this.$refs.kebab?.querySelectorAll('[role=menuitem]:not([disabled])') || [])]; },
      menuMove(step, abs = false) {
        const items = this.menuItems(); if (!items.length) return;
        const i = items.indexOf(document.activeElement);
        const n = abs ? (step < 0 ? items.length - 1 : 0) : (i + step + items.length) % items.length;
        items[n].focus({ preventScroll: true });
      },
      closeMenu(returnFocus = false) {
        if (this.openMenuId === null) return;
        this.openMenuId = null;
        if (returnFocus) this.$nextTick(() => this._menuBtn?.focus());
      },
      menuAction(a) {
        const r = this.kebabRole;
        this.closeMenu();
        if (a === 'edit')      this.openEditRole(r);
        if (a === 'clone')     this.openCreateRole(r.id, this._menuBtn);
        if (a === 'toggleAll') { this.toggleRole(r); this.$nextTick(() => this._menuBtn?.focus()); }
        if (a === 'reset')     { this.resetRole(r); this.$nextTick(() => this._menuBtn?.focus()); }
        if (a === 'delete')    this.openModal('deleteRole', r);
      },

      /* ---------- Toast ---------- */
      toast(icon, msg) {
        this.announce(msg);
        if (!window.Swal) return;
        Swal.fire({
          toast: true, position: 'top-end', icon, title: msg,
          showConfirmButton: false, timer: 3500, timerProgressBar: true,
          customClass: { popup: 'firob-swal firob-toast' },
          didOpen: (t) => { t.addEventListener('mouseenter', Swal.stopTimer); t.addEventListener('mouseleave', Swal.resumeTimer); },
        });
      },

      /* ---------- البحث العام ---------- */
      focusSearch() {
        if (this.panelOpen || this.modal) return;
        if (mdMQ.matches) { this.$refs.globalSearch?.focus(); this.$refs.globalSearch?.select(); return; }
        this.searchOpen = true;
        this.$nextTick(() => this.$refs.mobileSearch?.focus());
      },
      toggleMobileSearch() {
        this.searchOpen = !this.searchOpen;
        if (this.searchOpen) this.$nextTick(() => this.$refs.mobileSearch?.focus());
      },

      /* ---------- عامة ---------- */
      init() {
        this.originalMatrix = clone(this.matrix);
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        mdMQ.addEventListener('change', (m) => { if (m.matches) this.searchOpen = false; });
        wideMQ.addEventListener('change', (m) => { this.wide = m.matches; this.closeMenu(); });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        document.title = this.t('rm.title') + ' — FirOb';

        /* إعلان عدد التغييرات بعد التوقف عن النقر */
        this.$watch('changes.length', (n) => {
          clearTimeout(this._chgT);
          this._chgT = setTimeout(() => { this.changesLive = n ? this.tf('rm.liveChanges', { n: this.fmt(n) }) : this.t('rm.liveNone'); }, 700);
        });
        /* حماية المغادرة: إغلاق التبويب أو إعادة التحميل */
        window.addEventListener('beforeunload', (e) => { if (this.dirty && !this._leaving) { e.preventDefault(); e.returnValue = ''; } });
        /* حماية المغادرة: الروابط الداخلية (القائمة الجانبية، المسار، …) */
        document.addEventListener('click', (e) => {
          const a = e.target.closest && e.target.closest('a[href]');
          if (!a || !this.dirty || a.target === '_blank' || e.ctrlKey || e.metaKey || e.shiftKey) return;
          const href = a.getAttribute('href');
          if (!href || href.startsWith('#') || href.startsWith('javascript:')) return;
          e.preventDefault();
          this.mobileNav = false; this.notifOpen = false; this.profileOpen = false;
          this.openModal('leave', a.href);
        }, true);
        try {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            let saved = null; try { saved = localStorage.getItem('firob-theme'); } catch (_) {}
            if (!saved) this.applyTheme(e.matches);
          });
        } catch (e) {}
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      closeMobileNav() { this.mobileNav = false; this.$nextTick(() => this.$refs.navToggle?.focus()); },
      applyTheme(isDark) {
        document.body.classList.add('theme-anim');
        this.dark = isDark;
        document.documentElement.classList.toggle('dark', isDark);
        document.getElementById('theme-color')?.setAttribute('content', isDark ? '#09141B' : '#F1EDE7');
        clearTimeout(this._themeT); this._themeT = setTimeout(() => document.body.classList.remove('theme-anim'), 350);
      },
      toggleTheme() {
        this.applyTheme(!this.dark);
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      closeAll() {
        if (this.modal)       { this.closeModal(); return; }
        if (this.panelOpen)   { if (this.discardAsk) { this.discardAsk = false; return; } this.closePanel(); return; }
        if (this.openMenuId !== null) { this.closeMenu(true); return; }
        if (this.notifOpen)   { this.notifOpen = false;   this.$refs.notifBtn?.focus(); return; }
        if (this.profileOpen) { this.profileOpen = false; this.$refs.profileBtn?.focus(); return; }
        if (this.searchOpen)  { this.searchOpen = false; return; }
        if (this.mobileNav)   { this.closeMobileNav(); }
      },
    };
  }
</script>
</body>
</html>
