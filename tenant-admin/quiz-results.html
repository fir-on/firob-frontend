<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

    html, body { max-width: 100%; overflow-x: hidden; }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: 2px solid rgb(var(--brand)); outline-offset: 2px; }  /* outline لا يتعارض مع ظلال المكونات ويعمل في forced-colors */
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* إلغاء أيقونة التفريغ الأصلية لحقول type="search" */
    input[type="search"]::-webkit-search-decoration,
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-results-button,

    .tooltip-bubble {

      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }

    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }

<script>
  /**
   * مكوّن قائمة الاختيار المخصصة (Select-only Combobox — نمط ARIA APG).
   * options: () => [{ value, label }] | get: () => القيمة | set: (v) => تحديث
   * لوحة المفاتيح: ↑↓ Home End Enter Space Esc Tab + البحث بالكتابة (type-ahead).
   * Esc يوقف الانتشار حتى لا يُغلق اللوحة الجانبية/النافذة الأم (C5).
   */
  function selectDropdown({ id, options, get, set, placeholder = '' }) {
    return {
      id, open: false, active: -1, typed: '', typedAt: 0,
      get items() { return options(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { const sel = this.selectedItem; return sel ? sel.label : placeholder; },
      optId(item) { return this.id + '-opt-' + (item.value === '' ? 'none' : item.value); },
      openList() {
        if (!this.items.length) return;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item) { set(item.value); this.closeList(); this.$refs.btn?.focus(); },
      setActive(i) { this.active = Math.min(Math.max(i, 0), this.items.length - 1); this.scrollActiveIntoView(); },
      move(step) { if (!this.open) { this.openList(); return; } this.setActive(this.active + step); },
      onKey(e) {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); if (e.altKey && this.open && k === 'ArrowUp') { this.choose(this.items[this.active]); return; } this.move(k === 'ArrowDown' ? 1 : -1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.setActive(0); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.setActive(this.items.length - 1); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); (this.open && this.active > -1) ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape') { if (this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); } }
        else if (k === 'Tab') { if (this.open) this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          const now = Date.now();
          this.typed = (now - this.typedAt > 600 ? '' : this.typed) + k.toLowerCase();
          this.typedAt = now;
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this.typed));
          if (i > -1) { if (!this.open) this.openList(); this.setActive(i); }
        }
      },
      scrollActiveIntoView() { this.$nextTick(() => this.$refs.list?.children[this.active + 1]?.scrollIntoView({ block: 'nearest' })); },
      isSelected(item) { const sel = this.selectedItem; return !!sel && sel.value === item.value; },
    };
  }

      kpiCards: [
        { key: 'total', icon: 'fa-list-check', cls: 'bg-primary-500/10 text-brand' },
        { key: 'avg', icon: 'fa-chart-simple', cls: 'bg-info-500/15 text-info-700 dark:text-blue-300' },
        { key: 'pass', icon: 'fa-trophy', cls: 'bg-success-500/15 text-success-700 dark:text-success-500' },
        { key: 'time', icon: 'fa-stopwatch', cls: 'bg-accent-500/20 text-yellow-900 dark:text-accent-500' },
      ],
      get kpis() {
        const F = this.filtered;
        const graded = F.filter(a => a.submittedAt && !this.pendingCount(a));
        const submitted = F.filter(a => a.submittedAt);
        const avg = (xs) => xs.length ? Math.round(xs.reduce((s, x) => s + x, 0) / xs.length) : null;
        return {
          total: F.length, inProgress: F.filter(a => !a.submittedAt).length, graded: graded.length,
          avg: avg(graded.map(a => this.pct(a))),
          pass: graded.length ? Math.round(graded.filter(a => this.status(a) === 'passed').length / graded.length * 100) : null,
          time: avg(submitted.map(a => a.durationSec)),
          needsGrading: F.filter(a => this.status(a) === 'needs_grading').length,
        };
      },
      kpiValue(k) {
        const v = this.kpis;
        return { total: this.fmt(v.total), avg: v.avg == null ? '—' : v.avg + '%', pass: v.pass == null ? '—' : v.pass + '%', time: this.fmtDuration(v.time) }[k];
      },
      kpiHint(k) {
        const v = this.kpis;
        return { total: this.tf('qr.kpiHint.total', { n: v.inProgress }), avg: this.tf('qr.kpiHint.avg', { n: v.graded }),
                 pass: this.t('qr.kpiHint.pass'), time: this.t('qr.kpiHint.time') }[k];
      },

      /* ---------- تحليل الأسئلة ---------- */
      get gradedCount() { return this.filtered.filter(a => a.submittedAt).length; },
      get itemAnalysis() {
        const q = this.curQuiz;
        if (!q) return [];
        const subs = this.filtered.filter(a => a.submittedAt);
        if (!subs.length) return [];
        return q.questions.map((qq, idx) => {
          let n = 0, correct = 0; const wrong = {};
          subs.forEach(a => {
            const x = a.answers[idx];
            if (!x || x.earned == null) return;
            n++;
            if (x.earned >= qq.marks) correct++;
            else if (qq.type !== 'essay') wrong[x.answer] = (wrong[x.answer] || 0) + 1;
          });
          const top = Object.entries(wrong).sort((a, b) => b[1] - a[1])[0];
          return { idx, q: qq.q, n, correct, rate: n ? Math.round(correct / n * 100) : 0, topWrong: top?.[0], topWrongN: top?.[1] };
        }).filter(r => r.n).sort((a, b) => a.rate - b.rate);
      },

      /* ---------- الترقيم ---------- */
      page: 1, perPage: 8,
      get pageCount() { return Math.max(1, Math.ceil(this.filtered.length / this.perPage)); },
      get pageRows() { return this.filtered.slice((this.page - 1) * this.perPage, this.page * this.perPage); },
      get pageInfo() {
        const total = this.filtered.length, from = total ? (this.page - 1) * this.perPage + 1 : 0;
        return this.tf('qr.pageInfo', { from, to: Math.min(from + this.perPage - 1, total), total: this.pluralize('attempts', total) });
      },
      goPage(p) { this.page = Math.min(Math.max(1, p), this.pageCount); },

      /* ---------- لوحة التفاصيل ---------- */
      detailsOpen: false, pvId: null, _pvReturn: null,
      get pv() { return this.attempts.find(a => a.id === this.pvId) || null; },
      get pvIndex() { return this.filtered.findIndex(a => a.id === this.pvId); },
      openDetails(a, ev) { this._pvReturn = ev?.currentTarget || null; this.pvId = a.id; this.detailsOpen = true; },
      stepDetails(d) { const n = this.filtered[this.pvIndex + d]; if (n) this.pvId = n.id; },
      closeDetails() {
        this.detailsOpen = false;
        const id = this.pvId, back = this._pvReturn;
        this.$nextTick(() => {
          const row = document.querySelector(`[data-att="${id}"] [data-act=details]`);
          (row || (back?.isConnected ? back : null) || this.$refs.attemptSearch)?.focus();
        });
      },

      /* ---------- التصدير (Livewire: Job في الطابور + إشعار برابط مؤقت) ---------- */
      liveMsg: '',
      exportReport(type, single = null) {
        const msg = this.tf('qr.toastExport', { type: this.t('qr.fmt.' + type), n: this.pluralize('attempts', single ? 1 : this.filtered.length) });
        this.liveMsg = msg;
        if (!window.Swal) return;
        Swal.fire({ toast: true, position: 'top-end', icon: 'info', title: msg, showConfirmButton: false, timer: 5000, customClass: { popup: 'firob-swal firob-toast' } });
      },

      /* ---------- عامة ---------- */
      init() {
        const qp = new URLSearchParams(window.location.search);
        const code = qp.get('code'), st = qp.get('status');                       // قادم من quizzes.html / quiz-grading.html
        if (code && QUIZZES[code]) this.quizFilter = code;
        if (['passed', 'failed', 'needs_grading', 'in_progress'].includes(st)) this.statusFilter = st;
        document.title = this.t('docTitle');
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        wideMQ.addEventListener('change', (m) => { this.wide = m.matches; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        ['search', 'quizFilter', 'statusFilter', 'dateFilter', 'sortBy'].forEach(k => this.$watch(k, () => { this.page = 1; }));
      },
      onGlobalKey(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const g = this.$refs.globalSearch;
          (g && g.offsetParent !== null ? g : this.$refs.attemptSearch)?.focus();
        }
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      // Esc العام: القوائم فقط — اللوحة الجانبية تعالج Esc بنفسها
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },
    };
  }
</script>
