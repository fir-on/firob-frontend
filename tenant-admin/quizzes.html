<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ==========================================================================
     حذف / أرشفة — الحذف النهائي فقط لمسودة بلا محاولات؛ غير ذلك أرشفة تحفظ سجلات الطلاب

<div x-cloak x-show="isDeleteModalOpen" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4">
  <div class="overlay-backdrop absolute inset-0 bg-primary-900/60" @click="closeDeleteModal()" aria-hidden="true"></div>
  <div x-show="isDeleteModalOpen" x-trap.noscroll.noreturn="isDeleteModalOpen" role="alertdialog" aria-modal="true"
       aria-labelledby="del-title" aria-describedby="del-desc" @keydown.escape.stop.prevent="closeDeleteModal()"
       x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="opacity-0 scale-95"
       class="relative w-full max-w-sm rounded-2xl border border-line bg-card p-6 text-center shadow-pop">
    <template x-if="deleteTarget">
      <div>
        <span class="mx-auto grid h-14 w-14 place-items-center rounded-full" aria-hidden="true"
              :class="canHardDelete(deleteTarget) ? 'bg-error-500/15 text-error-700 dark:text-red-300' : 'bg-warning-500/15 text-warning-800 dark:text-warning-500'">
          <i class="fa-solid text-xl" :class="canHardDelete(deleteTarget) ? 'fa-trash' : 'fa-box-archive'"></i>
        </span>
        <h2 id="del-title" class="mt-4 text-lg font-extrabold text-ink" x-text="t(canHardDelete(deleteTarget) ? 'qz.deleteTitle' : 'qz.archiveTitle')"></h2>
        <p id="del-desc" class="mt-2 text-sm leading-6 text-muted"
           x-text="canHardDelete(deleteTarget) ? tf('qz.deleteText', { name: name(deleteTarget) })
                                               : tf('qz.archiveText', { name: name(deleteTarget), attempts: pluralize('attempts', deleteTarget.attempts) })"></p>
        <div class="mt-6 flex justify-center gap-3">
          <button type="button" x-ref="delCancel" class="btn btn-outline" :disabled="busy" @click="closeDeleteModal()" x-text="t('qz.deleteCancel')"></button>
          <button type="button" class="btn" :class="canHardDelete(deleteTarget) ? 'btn-danger' : 'btn-primary'" :disabled="busy" :aria-busy="busy.toString()" @click="deleteConfirmed()">
            <i class="fa-solid fa-circle-notch motion-safe:animate-spin" x-show="busy" aria-hidden="true"></i>
            <span x-text="t(canHardDelete(deleteTarget) ? 'qz.deleteConfirm' : 'qz.archiveConfirm')"></span>
          </button>
        </div>
      </div>
    </template>
  </div>
</div>

<script>
  /**
   * مكوّن قائمة الاختيار المخصصة (Select-only Combobox — نمط ARIA APG).
   * options: () => [{ value, label }] | get: () => القيمة | set: (v) => تحديث
   * لوحة المفاتيح: ↑↓ Home End Enter Space Esc Tab + البحث بالكتابة (type-ahead).
   * Esc يوقف الانتشار حتى لا يُغلق اللوحة الجانبية/النافذة الأم (C5).
   */
  function selectDropdown({ id, options, get, set, placeholder = '' }) {
    return {
      id, open: false, active: -1, typed: '', typedAt: 0,
      get items() { return options(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { const sel = this.selectedItem; return sel ? sel.label : (typeof placeholder === 'function' ? placeholder() : placeholder); },  // placeholder تفاعلي مع اللغة
      optId(item) { return this.id + '-opt-' + (item.value === '' ? 'none' : item.value); },
      openList() {
        if (!this.items.length) return;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item) { set(item.value); this.closeList(); this.$refs.btn?.focus(); },
      setActive(i) { this.active = Math.min(Math.max(i, 0), this.items.length - 1); this.scrollActiveIntoView(); },
      move(step) { if (!this.open) { this.openList(); return; } this.setActive(this.active + step); },
      onKey(e) {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); if (e.altKey && this.open && k === 'ArrowUp') { this.choose(this.items[this.active]); return; } this.move(k === 'ArrowDown' ? 1 : -1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.setActive(0); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.setActive(this.items.length - 1); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); (this.open && this.active > -1) ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape') { if (this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); } }
        else if (k === 'Tab') { if (this.open) this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          const now = Date.now();
          this.typed = (now - this.typedAt > 600 ? '' : this.typed) + k.toLowerCase();
          this.typedAt = now;
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this.typed));
          if (i > -1) { if (!this.open) this.openList(); this.setActive(i); }
        }
      },
      scrollActiveIntoView() { this.$nextTick(() => this.$refs.list?.children[this.active + 1]?.scrollIntoView({ block: 'nearest' })); },
      isSelected(item) { const sel = this.selectedItem; return !!sel && sel.value === item.value; },
    };
  }

  /**
   * حالة واجهة قائمة الاختبارات.
   * — البيانات الأكاديمية من window.FIROB_MOCK (مشتركة مع المفاهيم/العناصر/طابور المراجعة/المولّد).
   * — الفلترة فعلية ومتسلسلة (مقرر ← وحدة ← درس)، والمؤشرات والترقيم محسوبة.
   * — الحذف النهائي لمسودة بلا محاولات فقط؛ غير ذلك أرشفة تحفظ سجلات الطلاب، مع تراجع.
   * — «توليد بالذكاء الاصطناعي» بوابة إلى ai-generator.html بنفس المعطيات (حصة + مراجعة + طابور مراجعة موحّد).
   */
  function quizzesManager() {
    const desktopMQ = window.matchMedia('(min-width: 1024px)');
    const wideMQ = window.matchMedia('(min-width: 1280px)');
    const M = window.FIROB_MOCK;
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        const L = this.locale;
        return [
          { level: 'course', label: this.course(z.courseId)?.[L] },
          { level: 'unit', label: M.units.find(u => u.id === z.unitId)?.[L] },
          { level: 'lesson', label: M.lessons.find(l => l.id === z.lessonId)?.[L] },
        ].filter(s => s.label);
      },
      missingLevels(z) {
        const s = M.structure, m = [];
        if (!z.courseId) m.push('course');
        if (s.units.enabled && s.units.required && !z.unitId) m.push('unit');
        if (s.lessons.enabled && s.lessons.required && !z.lessonId) m.push('lesson');
        return m;
      },
      missingText(z) { return this.tf('qz.missing', { levels: this.missingLevels(z).map(l => this.t('qz.level.' + l)).join(this.locale === 'ar' ? '، ' : ', ') }); },
      statusMeta(z) {
        return { published: { cls: 'badge-success', icon: 'fa-circle-check' }, draft: { cls: 'badge-warning', icon: 'fa-pen' },
                 in_review: { cls: 'badge-info', icon: 'fa-hourglass-half' }, archived: { cls: 'badge-muted', icon: 'fa-box-archive' } }[z.status];
      },
      rowTone(z) { return { draft: 'bg-warning-500/5 hover:bg-warning-500/10', archived: 'is-archived hover:bg-soft/40' }[z.status] || 'hover:bg-soft/40'; },
      sampleQuestions(z) {
        return (SAMPLES[z.courseId] || []).slice(0, Math.min(3, z.questions)).map(([text, k]) => ({ text, meta: this.t('qz.qkind.' + k) }));
      },

      get kpis() {
        const Q = this.quizzes;
        return { total: Q.length, published: Q.filter(z => z.status === 'published').length,
                 drafts: Q.filter(z => z.status === 'draft' || z.status === 'in_review').length, questions: Q.reduce((s, z) => s + z.questions, 0) };
      },
      kpiCards: [
        { key: 'total', icon: 'fa-list-check', cls: 'bg-primary-500/10 text-brand' },
        { key: 'published', icon: 'fa-circle-check', cls: 'bg-success-500/15 text-success-700 dark:text-success-500' },
        { key: 'drafts', icon: 'fa-pen-to-square', cls: 'bg-warning-500/15 text-warning-800 dark:text-warning-500' },
        { key: 'questions', icon: 'fa-circle-question', cls: 'bg-info-500/15 text-info-700 dark:text-blue-300' },
      ],

      /* ---------- الفلاتر (Livewire: #[Url] + updatedCourse() يصفّر الوحدة والدرس) ---------- */
      search: '', courseFilter: 'all', unitFilter: 'all', lessonFilter: 'all', typeFilter: 'all', statusFilter: 'all',
      courseOptions() { return [{ value: 'all', label: this.t('qz.all.course') }, ...M.courses.map(c => ({ value: c.id, label: c[this.locale] }))]; },
      unitOptions() {
        return [{ value: 'all', label: this.t('qz.all.unit') },
                ...M.units.filter(u => this.courseFilter === 'all' || u.courseId === this.courseFilter).map(u => ({ value: u.id, label: u[this.locale] }))];
      },
      lessonOptions() {
        return [{ value: 'all', label: this.unitFilter === 'all' ? this.t('qz.pickUnitFirst') : this.t('qz.all.lesson') },
                ...M.lessons.filter(l => this.unitFilter !== 'all' && l.unitId === this.unitFilter).map(l => ({ value: l.id, label: l[this.locale] }))];
      },
      typeOptions() { return [{ value: 'all', label: this.t('qz.all.type') }, ...['formative', 'summative', 'diagnostic'].map(v => ({ value: v, label: this.t('qz.type.' + v) }))]; },
      statusOptions() { return [{ value: 'all', label: this.t('qz.all.status') }, ...['published', 'draft', 'in_review', 'archived'].map(v => ({ value: v, label: this.t('qz.status.' + v) }))]; },
      get activeFilterCount() {
        return (this.search.trim() ? 1 : 0) + ['courseFilter', 'unitFilter', 'lessonFilter', 'typeFilter', 'statusFilter'].filter(k => this[k] !== 'all').length;
      },
      resetFilters() { this.search = ''; this.courseFilter = 'all'; this.unitFilter = 'all'; this.lessonFilter = 'all'; this.typeFilter = 'all'; this.statusFilter = 'all'; },
      get filtered() {
        const q = this.search.trim().toLowerCase();
        return this.quizzes.filter(z =>
          (this.courseFilter === 'all' || z.courseId === this.courseFilter) &&
          (this.unitFilter === 'all' || z.unitId === this.unitFilter) &&
          (this.lessonFilter === 'all' || z.lessonId === this.lessonFilter) &&
          (this.typeFilter === 'all' || z.type === this.typeFilter) &&
          (this.statusFilter === 'all' || z.status === this.statusFilter) &&
          (!q || [z.ar, z.en, z.code].some(s => s.toLowerCase().includes(q))));
      },
      get resultsMsg() { return this.activeFilterCount ? this.tf('qz.resultsCount', { quizzes: this.pluralize('quizzes', this.filtered.length) }) : ''; },

      /* ---------- الترقيم ---------- */
      page: 1, perPage: 6,
      get pageCount() { return Math.max(1, Math.ceil(this.filtered.length / this.perPage)); },
      get pageRows() { return this.filtered.slice((this.page - 1) * this.perPage, this.page * this.perPage); },
      get pageInfo() {
        const total = this.filtered.length, from = total ? (this.page - 1) * this.perPage + 1 : 0;
        return this.tf('qz.pageInfo', { from, to: Math.min(from + this.perPage - 1, total), total: this.pluralize('quizzes', total) });
      },
      goPage(p) { this.page = Math.min(Math.max(1, p), this.pageCount); },

      /* ---------- الإجراءات ---------- */
      liveMsg: '',
      announce(msg) { this.liveMsg = ''; this.$nextTick(() => { this.liveMsg = msg; }); },
      focusRow(id, act = 'preview') {
        this.$nextTick(() => (document.querySelector(`[data-quiz="${id}"] [data-act=${act}]`) || this.$refs.quizSearch)?.focus());
      },
      toastUndo(msg, undo) {
        this.announce(msg);
        if (!window.Swal) return;
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: msg, timer: 6000, timerProgressBar: true,
                    showConfirmButton: true, confirmButtonText: this.t('qz.undo'), customClass: { popup: 'firob-swal firob-toast' } })
          .then(r => { if (r.isConfirmed) { undo(); this.announce(this.t('qz.undone')); } });
      },
      nextCode(z) {
        const prefix = z.code.replace(/-\d+$/, '');
        const max = Math.max(...this.quizzes.filter(q => q.code.startsWith(prefix)).map(q => +q.code.split('-').pop()));
        return prefix + '-' + String(max + 1).padStart(3, '0');
      },
      duplicateQuiz(z) {
        const copy = { ...z, id: Date.now(), code: this.nextCode(z), ar: z.ar + ' (نسخة)', en: z.en + ' (Copy)', status: 'draft', attempts: 0, source: 'human' };
        this.quizzes.splice(this.quizzes.indexOf(z) + 1, 0, copy);
        const idx = this.filtered.indexOf(copy);
        if (idx > -1) this.page = Math.floor(idx / this.perPage) + 1;
        this.toastUndo(this.tf('qz.toastDuplicate', { name: this.name(z) }), () => { this.quizzes.splice(this.quizzes.indexOf(copy), 1); });
        this.focusRow(copy.id, 'edit');
      },
      removeLabel(z) { return this.t('qz.act.' + (z.status === 'archived' ? 'restore' : this.canHardDelete(z) ? 'delete' : 'archive')); },
      restoreQuiz(z) {
        const prev = z.status; z.status = 'draft';
        this.toastUndo(this.tf('qz.toastRestore', { name: this.name(z) }), () => { z.status = prev; });
        this.focusRow(z.id, 'remove');
      },

      /* ---------- المعاينة ---------- */
      previewOpen: false, pvId: null,
      get pv() { return this.quizzes.find(z => z.id === this.pvId) || null; },
      openPreview(z) { this.pvId = z.id; this.previewOpen = true; },
      closePreview() { this.previewOpen = false; this.focusRow(this.pvId); },

      /* ---------- نافذة التوليد ← مولّد المحتوى ---------- */
      aiModalOpen: false, aiSubmitted: false, _aiReturn: null,
      aiForm: { courseId: '', unitId: '', lessonId: '', type: 'formative', count: 10, difficulty: 'medium' },
      aiCourseOpts() { return M.courses.map(c => ({ value: c.id, label: c[this.locale] })); },
      aiUnitOpts() { return M.units.filter(u => u.courseId === this.aiForm.courseId).map(u => ({ value: u.id, label: u[this.locale] })); },
      aiLessonOpts() { return M.lessons.filter(l => l.unitId === this.aiForm.unitId).map(l => ({ value: l.id, label: l[this.locale] })); },
      aiTypeOpts() { return ['formative', 'summative', 'diagnostic'].map(v => ({ value: v, label: this.t('qz.type.' + v) })); },
      get reqUnit() { return M.structure.units.enabled && M.structure.units.required; },
      get reqLesson() { return M.structure.lessons.enabled && M.structure.lessons.required; },
      aiSetCourse(v) { if (v === this.aiForm.courseId) return; this.aiForm.courseId = v; this.aiForm.unitId = ''; this.aiForm.lessonId = ''; },
      aiSetUnit(v) { if (v === this.aiForm.unitId) return; this.aiForm.unitId = v; this.aiForm.lessonId = ''; },
      get aiMissing() {
        const m = [];
        if (!this.aiForm.courseId) m.push('course');
        if (this.reqUnit && !this.aiForm.unitId) m.push('unit');
        if (this.reqLesson && !this.aiForm.lessonId) m.push('lesson');
        return m;
      },
      aiInvalid(k) { return this.aiSubmitted && this.aiMissing.includes(k); },
      get aiHint() { return this.tf('qz.aiMissing', { fields: this.aiMissing.map(k => this.t('qz.filter.' + k)).join(this.locale === 'ar' ? '، ' : ', ') }); },
      openAiModal(ev) {
        this._aiReturn = ev?.currentTarget || null;
        if (this.courseFilter !== 'all' && !this.aiForm.courseId) {        // يبدأ من الفلاتر الحالية
          this.aiForm.courseId = this.courseFilter;
          if (this.unitFilter !== 'all') this.aiForm.unitId = this.unitFilter;
          if (this.lessonFilter !== 'all') this.aiForm.lessonId = this.lessonFilter;
        }
        this.aiSubmitted = false; this.aiModalOpen = true;
        this.$nextTick(() => setTimeout(() => document.getElementById('ai-course')?.focus(), 60));
      },
      closeAiModal() { this.aiModalOpen = false; this.$nextTick(() => this._aiReturn?.focus()); },
      generateWithAI() {
        this.aiSubmitted = true;
        if (this.aiMissing.length) { this.announce(this.aiHint); document.getElementById('ai-' + this.aiMissing[0])?.focus(); return; }
        const f = this.aiForm;
        const p = new URLSearchParams({ mode: 'questions', course: f.courseId, unit: f.unitId, lesson: f.lessonId, count: f.count, difficulty: f.difficulty, quizType: f.type, from: 'quizzes' });
        window.location.href = 'ai-generator.html?' + p.toString();
      },

      /* ---------- الحذف / الأرشفة ---------- */
      busy: false, isDeleteModalOpen: false, deleteTarget: null, _delReturn: null,
      canHardDelete(z) { return z.status === 'draft' && !z.attempts; },
      confirmDelete(z, ev) {
        this._delReturn = ev?.currentTarget || null;
        this.deleteTarget = z; this.isDeleteModalOpen = true;
        this.$nextTick(() => setTimeout(() => this.$refs.delCancel?.focus(), 60));
      },
      closeDeleteModal() {
        if (this.busy) return;
        this.isDeleteModalOpen = false;
        this.$nextTick(() => { if (this._delReturn?.isConnected) this._delReturn.focus(); });
        setTimeout(() => { if (!this.isDeleteModalOpen) this.deleteTarget = null; }, 220);   // بعد انتهاء انتقال الإغلاق
      },
      async deleteConfirmed() {
        const z = this.deleteTarget;
        if (!z) return;
        this.busy = true;
        await sleep(400);                                         // Livewire: $wire.destroy(id)
        this.busy = false;
        this.isDeleteModalOpen = false;
        const idx = this.filtered.indexOf(z);
        if (this.canHardDelete(z)) {
          const at = this.quizzes.indexOf(z);
          this.quizzes.splice(at, 1);
          this.goPage(this.page);
          this.toastUndo(this.tf('qz.toastDelete', { name: this.name(z) }), () => { this.quizzes.splice(at, 0, z); });
          this.$nextTick(() => {
            const next = this.filtered[idx] || this.filtered[idx - 1];
            next ? this.focusRow(next.id) : this.$refs.quizSearch?.focus();
          });
        } else {
          const prev = z.status;
          z.status = 'archived';
          this.toastUndo(this.tf('qz.toastArchive', { name: this.name(z) }), () => { z.status = prev; });
          this.focusRow(z.id, 'remove');
        }
        setTimeout(() => { if (!this.isDeleteModalOpen) this.deleteTarget = null; }, 220);
      },

      /* ---------- عامة ---------- */
      init() {
        document.title = this.t('docTitle');
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        wideMQ.addEventListener('change', (m) => { this.wide = m.matches; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        this.$watch('courseFilter', () => { this.unitFilter = 'all'; this.lessonFilter = 'all'; this.page = 1; });
        this.$watch('unitFilter', () => { this.lessonFilter = 'all'; this.page = 1; });
        ['search', 'lessonFilter', 'typeFilter', 'statusFilter'].forEach(k => this.$watch(k, () => { this.page = 1; }));
      },
      onGlobalKey(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const g = this.$refs.globalSearch;
          (g && g.offsetParent !== null ? g : this.$refs.quizSearch)?.focus();
        }
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      // Esc العام: القوائم فقط — كل نافذة تعالج Esc بنفسها
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },
    };
  }
</script>
</body>
</html>
