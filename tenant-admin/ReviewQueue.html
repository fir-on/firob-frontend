<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<body x-data="reviewQueueManager()" x-init="init()" @keydown.escape.window="closeAll()"

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->

         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'

    <!-- الشعار -->

        <span class="inline-flex shrink-0 items-center p-0">

        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </a>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="t('mainNav')">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-muted" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="navCount(item) && expanded"
                        class="shrink-0 rounded-full text-xs"
                        :class="item.tone === 'primary' ? 'bg-primary-500/10 px-2 py-0.5 font-bold text-brand' : 'bg-accent-500 px-2 font-extrabold text-onaccent'"
                        x-text="navCount(item)"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid rtl:-scale-x-100" :class="collapsed ? 'fa-angles-right' : 'fa-angles-left'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="flex min-w-0 flex-1 flex-col">

    <!-- ================= Topbar ================= -->
    <header class="app-topbar sticky top-0 z-30 flex flex-col border-b border-line bg-card/90 backdrop-blur-sm">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd dir="ltr" aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex">Ctrl K</kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0">
                      <p class="break-words text-sm font-bold leading-6" x-text="t('notif.' + n.key)"></p>
                      <p class="text-xs text-muted" x-text="n.time"></p>
                    </div>
                  </li>
                </template>
              </ul>
              <div class="border-t border-line p-2">
                <a href="../common/notifications.html" class="menu-item justify-center text-brand" @click="notifOpen = false">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  <span x-text="t('viewAllNotif')"></span>
                </a>
              </div>
            </div>
          </div>

          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" class="flex max-w-[14rem] items-center gap-2 rounded-xl p-1 transition hover:bg-soft md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    aria-haspopup="menu" :aria-expanded="profileOpen.toString()" aria-controls="profile-menu" :aria-label="t('appSubtitle') + ' — ' + t('accountMenu')">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true">T</span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="t('appSubtitle')"></span>
                <span class="block truncate text-xs text-muted" x-text="t('roleName')"></span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted md:block" aria-hidden="true"></i>
            </button>
            <div id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-56" role="menu" :aria-label="t('accountMenu')">
              <a href="../common/profile.html" role="menuitem" class="menu-item"><i class="fa-regular fa-user w-4 text-muted" aria-hidden="true"></i> <span x-text="t('profile')"></span></a>
              <button type="button" role="menuitem" class="menu-item cursor-not-allowed opacity-60" aria-disabled="true" tabindex="-1"><i class="fa-solid fa-gear w-4 text-muted" aria-hidden="true"></i> <span x-text="t('settings')"></span></button>
              <a href="../common/errors.html" role="menuitem" class="menu-item"><i class="fa-solid fa-triangle-exclamation w-4 text-muted" aria-hidden="true"></i> <span x-text="t('systemStatus')"></span></a>
              <div role="separator" class="border-t border-line"></div>
              <a href="../auth/login.html" role="menuitem" class="menu-item !text-danger"><i class="fa-solid fa-arrow-right-from-bracket w-4" aria-hidden="true"></i> <span x-text="t('logout')"></span></a>
            </div>
          </div>
        </div>
      </div>

      <!-- زبدة الخبز (Breadcrumb) -->
      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="t('breadcrumbLabel')">
          <ol class="flex items-center gap-2" role="list">
            <li><a href="TenantDashboard.html" class="rounded hover:text-brand hover:underline" x-text="t('breadcrumb.home')"></a></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li x-text="t('navGroups.content')"></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li class="text-ink" x-text="t('navItems.reviewQueue')"></li>
          </ol>
        </nav>
      </div>
    </header>

    <!-- ================= المحتوى الرئيسي — طابور المراجعة ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">

      <!-- العنوان -->
      <section class="min-w-0">
        <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="t('rq.title')"></h1>
        <p class="mt-1 max-w-3xl text-sm text-muted sm:text-base" x-text="t('rq.subtitle')"></p>
      </section>

      <!-- ================= مؤشرات الأداء — محسوبة من البيانات ================= -->
      <section :aria-label="t('rq.kpisLabel')" class="grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-4">
        <template x-for="k in kpiCards" :key="k.key">
          <div class="panel p-4 sm:p-5">
            <div class="flex items-center justify-between gap-3">
              <p class="min-w-0 truncate text-sm font-bold text-muted" x-text="t('rq.kpi.' + k.key)"></p>
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl" :class="k.cls" aria-hidden="true"><i class="fa-solid" :class="k.icon"></i></span>
            </div>
            <p class="mt-2 text-2xl font-extrabold tabular-nums" x-text="fmt(kpis[k.key])"></p>
            <p class="mt-1 text-xs text-muted" x-text="t('rq.kpiHint.' + k.key)"></p>
          </div>
        </template>
      </section>

      <!-- ================= التبويبات (نمط ARIA Tabs كامل) ================= -->
      <div class="panel p-2 sm:p-3">
        <div class="flex flex-wrap items-center gap-2" role="tablist" :aria-label="t('rq.tabsLabel')" @keydown="onTabKey($event)">
          <template x-for="k in KINDS" :key="k">
            <button type="button" role="tab" class="seg-tab" :id="'tab-' + k" aria-controls="rq-panel"
                    :aria-selected="(activeTab === k).toString()" :tabindex="activeTab === k ? 0 : -1" @click="setTab(k)">
              <i class="fa-solid" :class="TAB_ICON[k]" aria-hidden="true"></i>
              <span x-text="t('rq.tab.' + k)"></span>
              <span class="seg-count" aria-hidden="true" x-text="count(k)"></span>
              <span class="sr-only" x-text="'(' + tf('rq.pendingN', { n: count(k) }) + ')'"></span>
            </button>
          </template>
        </div>
      </div>

      <!-- ================= لوحة التبويب ================= -->
      <section id="rq-panel" role="tabpanel" :aria-labelledby="'tab-' + activeTab" class="space-y-4">

        <!-- البحث والفلاتر -->
        <div class="panel flex flex-wrap items-center gap-3 p-4 sm:p-5" role="search" :aria-label="t('rq.filtersLabel')">
          <div class="relative min-w-0 flex-[2_1_16rem]">
            <label for="rq-search" class="sr-only" x-text="t('rq.searchPlaceholder')"></label>
            <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
            <input id="rq-search" x-ref="rqSearch" type="search" x-model.debounce.200ms="search" :placeholder="t('rq.searchPlaceholder')" autocomplete="off"
                   class="h-11 w-full min-w-0 rounded-xl border border-line-strong bg-field ps-10 pe-3 text-sm text-ink placeholder:text-muted focus:border-brand focus:outline-none">
          </div>
          <div class="min-w-0 flex-[1_1_14rem]"
               x-data="selectDropdown({ id: 'rq-course', options: () => courseOptions(), get: () => courseFilter, set: (v) => { courseFilter = v }, placeholder: '—' })"
               @click.outside="closeList()">
            <label id="rq-course-label" for="rq-course" class="sr-only" x-text="t('rq.colCourse')"></label>
            <div class="relative" data-combo-anchor>
              <button type="button" id="rq-course" x-ref="btn" role="combobox" aria-haspopup="listbox"
                      :aria-expanded="open.toString()" aria-controls="rq-course-list"
                      :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                      class="field flex h-11 w-full items-center justify-between gap-2 text-start font-bold"
                      @click="toggleList()" @keydown="onKey($event)">
                <span class="truncate" x-text="triggerLabel"></span>
                <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
              </button>
              <ul x-show="open" x-cloak x-ref="list" id="rq-course-list" role="listbox" aria-labelledby="rq-course-label"
                  x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                <template x-for="(item, idx) in items" :key="item.value">
                  <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                      class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                      @click="choose(item)" @mousemove="active = idx">
                    <span class="truncate" x-text="item.label"></span>
                    <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                  </li>
                </template>
              </ul>
            </div>
          </div>
          <div class="min-w-0 flex-[1_1_12rem]"
               x-data="selectDropdown({ id: 'rq-source', options: () => sourceOptions(), get: () => sourceFilter, set: (v) => { sourceFilter = v }, placeholder: '—' })"
               @click.outside="closeList()">
            <label id="rq-source-label" for="rq-source" class="sr-only" x-text="t('rq.colSource')"></label>
            <div class="relative" data-combo-anchor>
              <button type="button" id="rq-source" x-ref="btn" role="combobox" aria-haspopup="listbox"
                      :aria-expanded="open.toString()" aria-controls="rq-source-list"
                      :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                      class="field flex h-11 w-full items-center justify-between gap-2 text-start font-bold"
                      @click="toggleList()" @keydown="onKey($event)">
                <span class="truncate" x-text="triggerLabel"></span>
                <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
              </button>
              <ul x-show="open" x-cloak x-ref="list" id="rq-source-list" role="listbox" aria-labelledby="rq-source-label"
                  x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                <template x-for="(item, idx) in items" :key="item.value">
                  <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                      class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                      @click="choose(item)" @mousemove="active = idx">
                    <span class="truncate" x-text="item.label"></span>
                    <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                  </li>
                </template>
              </ul>
            </div>
          </div>
          <div class="min-w-0 flex-[1_1_12rem]"
               x-data="selectDropdown({ id: 'rq-sort', options: () => sortOptions(), get: () => sortBy, set: (v) => { sortBy = v }, placeholder: '—' })"
               @click.outside="closeList()">
            <label id="rq-sort-label" for="rq-sort" class="sr-only" x-text="t('rq.colSort')"></label>
            <div class="relative" data-combo-anchor>
              <button type="button" id="rq-sort" x-ref="btn" role="combobox" aria-haspopup="listbox"
                      :aria-expanded="open.toString()" aria-controls="rq-sort-list"
                      :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                      class="field flex h-11 w-full items-center justify-between gap-2 text-start font-bold"
                      @click="toggleList()" @keydown="onKey($event)">
                <span class="truncate" x-text="triggerLabel"></span>
                <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
              </button>
              <ul x-show="open" x-cloak x-ref="list" id="rq-sort-list" role="listbox" aria-labelledby="rq-sort-label"
                  x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                <template x-for="(item, idx) in items" :key="item.value">
                  <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                      class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                      @click="choose(item)" @mousemove="active = idx">
                    <span class="truncate" x-text="item.label"></span>
                    <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                  </li>
                </template>
              </ul>
            </div>
          </div>
          <button type="button" class="btn btn-outline h-11 flex-[1_1_auto] sm:flex-none" @click="resetFilters()" :disabled="!activeFilterCount">
            <i class="fa-solid fa-filter-circle-xmark" aria-hidden="true"></i>
            <span x-text="t('rq.resetFilters')"></span>
            <span x-show="activeFilterCount" class="badge badge-primary px-2" x-text="activeFilterCount"></span>
          </button>
        </div>

        <!-- شريط التحديد الجماعي -->
        <div x-show="rows.length" class="flex flex-wrap items-center gap-3 rounded-2xl border border-line bg-card px-4 py-3">
          <label class="inline-flex min-h-[2.75rem] cursor-pointer items-center gap-2.5 text-sm font-bold">
            <input type="checkbox" class="h-5 w-5 shrink-0 accent-primary-500" :checked="allSelected"
                   x-effect="$el.indeterminate = someSelected && !allSelected" @change="toggleAll($event.target.checked)">
            <span x-text="selected.length ? tf('rq.selectedN', { items: pluralize('items', selected.length) }) : t('rq.selectAll')"></span>
          </label>
          <div x-show="selected.length" x-cloak class="ms-auto flex flex-wrap gap-2">
            <button type="button" class="btn btn-success btn-sm" @click="approveSelected()" :disabled="!eligibleSelected.length">
              <i class="fa-solid fa-check-double" aria-hidden="true"></i>
              <span x-text="tf('rq.approveN', { n: eligibleSelected.length })"></span>
            </button>
            <button type="button" class="btn btn-outline btn-sm !text-danger hover:!bg-error-500/10" aria-haspopup="dialog" @click="openReject(selectedItems, $event)">
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
              <span x-text="tf('rq.rejectN', { n: selected.length })"></span>
            </button>
          </div>
          <p x-show="selected.length && eligibleSelected.length < selected.length" x-cloak class="basis-full text-xs font-bold text-warning-800 dark:text-warning-500"
             x-text="tf('rq.batchSkipNote', { n: selected.length - eligibleSelected.length })"></p>
        </div>

        <p class="sr-only" role="status" aria-live="polite" x-text="liveMsg"></p>

        <!-- حالة فارغة -->
        <div x-show="!rows.length" x-cloak class="panel flex flex-col items-center gap-3 p-10 text-center">
          <span class="grid h-14 w-14 place-items-center rounded-full bg-success-500/15 text-success-700 dark:text-success-500" aria-hidden="true">
            <i class="fa-solid text-xl" :class="activeFilterCount ? 'fa-filter-circle-xmark' : 'fa-circle-check'"></i>
          </span>
          <h2 class="text-lg font-extrabold text-ink" x-text="activeFilterCount ? t('rq.emptyFilteredTitle') : t('rq.emptyTitle')"></h2>
          <p class="max-w-sm text-sm text-muted" x-text="activeFilterCount ? t('rq.emptyFilteredSub') : t('rq.emptySub')"></p>
          <button x-show="activeFilterCount" type="button" class="btn btn-outline mt-1" @click="resetFilters(); $refs.rqSearch.focus()">
            <i class="fa-solid fa-filter-circle-xmark" aria-hidden="true"></i> <span x-text="t('rq.resetFilters')"></span>
          </button>
        </div>

        <!-- ================= بطاقات (أقل من xl) — عرض واحد فقط يُرسم ================= -->
        <template x-if="rows.length && !wide">
          <ul class="grid grid-cols-1 gap-3 sm:grid-cols-2" role="list" :aria-label="t('rq.tab.' + activeTab)">
            <template x-for="it in rows" :key="it.id">
              <li class="rq-card panel flex min-w-0 flex-col gap-3 p-4" :data-rq="it.id" :class="isSelected(it) && 'ring-2 ring-primary-500/50'">
                <div class="flex items-start gap-3">
                  <input type="checkbox" class="mt-1 h-5 w-5 shrink-0 accent-primary-500" :checked="isSelected(it)" @change="toggleSel(it)"
                         :aria-label="tf('rq.selectItem', { title: title(it) })">
                  <div class="min-w-0 flex-1">
                    <h2 class="line-clamp-2 font-extrabold leading-6" :lang="titleLang(it)" dir="auto" style="text-align: match-parent" x-text="title(it)"></h2>
                    <p class="truncate text-xs text-muted"><bdi class="font-mono" dir="ltr" x-text="it.refId"></bdi></p>
                  </div>
                </div>
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="badge" :class="subMeta(it).cls"><i class="fa-solid text-[10px]" :class="subMeta(it).icon" aria-hidden="true"></i> <span x-text="subMeta(it).label"></span></span>
                  <span x-show="it.source === 'ai'" class="badge badge-accent"><i class="fa-solid fa-wand-magic-sparkles text-[10px]" aria-hidden="true"></i> <span x-text="t('rq.src.ai')"></span></span>
                  <span x-show="isLate(it)" class="badge badge-warning"><i class="fa-solid fa-clock text-[10px]" aria-hidden="true"></i> <span x-text="t('rq.late')"></span></span>
                </div>
                <ol x-show="!missingLevels(it).length" class="class-chain" :aria-label="t('rq.colClassification')">
                  <template x-for="(s, i) in pathOf(it)" :key="s.level">
                    <li class="inline-flex min-w-0 items-center gap-1.5">
                      <i x-show="i > 0" class="fa-solid fa-chevron-right rtl:-scale-x-100" aria-hidden="true"></i>
                      <span :class="i === pathOf(it).length - 1 && 'text-ink'" x-text="s.label"></span>
                    </li>
                  </template>
                </ol>
                <p x-show="missingLevels(it).length" :id="'why-' + it.id" class="flex flex-wrap items-start gap-x-1.5 text-xs font-bold text-warning-800 dark:text-warning-500">
                  <i class="fa-solid fa-triangle-exclamation mt-0.5" aria-hidden="true"></i>
                  <span x-text="missingText(it)"></span>
                  <a :href="fixUrl(it)" class="underline underline-offset-2 hover:text-brand" x-text="t('rq.fixClassification')"></a>
                </p>
                <p class="flex items-center gap-2 text-xs text-muted">
                  <span class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-soft text-[10px] font-extrabold text-brand" lang="ar" aria-hidden="true" x-text="initials(it.submittedBy)"></span>
                  <span class="min-w-0"><span class="block truncate font-bold text-ink" x-text="it.submittedBy"></span>
                  <time class="block" :datetime="it.submittedAt" :title="new Date(it.submittedAt).toLocaleString(locale)" x-text="ago(it.submittedAt)"></time></span>
                </p>
                <div class="mt-auto flex items-center justify-end gap-1.5 border-t border-line pt-3">
                          <button type="button" data-act="preview" class="act group relative" @click="openPreview(it, $event)" aria-haspopup="dialog" :aria-label="t('rq.actPreview') + ': ' + title(it)"><i class="fa-solid fa-eye" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('rq.actPreview')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                          <button type="button" data-act="reject" class="act group relative !text-danger hover:!bg-error-500/10" @click="openReject([it], $event)" aria-haspopup="dialog" :aria-label="t('rq.actReject') + ': ' + title(it)"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('rq.actReject')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                          <button type="button" data-act="approve" class="act group relative border-success-700 text-success-700 hover:!bg-success-500/10 dark:border-success-500 dark:text-success-500" @click="approve(it)" :aria-disabled="(!!missingLevels(it).length).toString()" :aria-describedby="missingLevels(it).length ? 'why-' + it.id : null" :class="missingLevels(it).length && 'cursor-not-allowed opacity-50'" :aria-label="t('rq.actApprove') + ': ' + title(it)"><i class="fa-solid fa-check" aria-hidden="true"></i><span class="tooltip-bubble" x-text="missingLevels(it).length ? t('rq.blockedShort') : t('rq.actApprove')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                </div>
              </li>
            </template>
          </ul>
        </template>

        <!-- ================= جدول (xl+) ================= -->
        <template x-if="rows.length && wide">
          <div class="panel overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full min-w-[1080px] border-collapse text-sm">
                <caption class="sr-only" x-text="t('rq.tab.' + activeTab) + ' — ' + pluralize('items', rows.length)"></caption>
                <thead>
                  <tr class="bg-soft text-ink">
                    <th scope="col" class="w-12 px-4 py-3.5"><span class="sr-only" x-text="t('rq.colSelect')"></span></th>
                    <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('rq.colItem')"></th>
                    <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('rq.colClassification')"></th>
                    <th scope="col" class="px-4 py-3.5 text-start text-xs font-extrabold" x-text="t('rq.colSubmitted')"></th>
                    <th scope="col" class="px-5 py-3.5 text-end text-xs font-extrabold" x-text="t('rq.colActions')"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-line">
                  <template x-for="it in rows" :key="it.id">
                    <tr class="transition-colors hover:bg-soft/40" :data-rq="it.id" :class="isSelected(it) && 'bg-primary-500/5'">
                      <td class="px-4 py-4 align-middle">
                        <input type="checkbox" class="h-5 w-5 accent-primary-500" :checked="isSelected(it)" @change="toggleSel(it)"
                               :aria-label="tf('rq.selectItem', { title: title(it) })">
                      </td>
                      <td class="px-4 py-4 align-middle">
                        <div class="min-w-0 max-w-[24rem]">
                          <p class="truncate font-extrabold leading-6" :lang="titleLang(it)" dir="auto" style="text-align: match-parent" :title="title(it)" x-text="title(it)"></p>
                          <p class="truncate text-xs text-muted"><bdi class="font-mono" dir="ltr" x-text="it.refId"></bdi></p>
                        </div>
                        <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
                          <span class="badge" :class="subMeta(it).cls"><i class="fa-solid text-[10px]" :class="subMeta(it).icon" aria-hidden="true"></i> <span x-text="subMeta(it).label"></span></span>
                          <span x-show="it.source === 'ai'" class="badge badge-accent"><i class="fa-solid fa-wand-magic-sparkles text-[10px]" aria-hidden="true"></i> <span x-text="t('rq.src.ai')"></span></span>
                          <span x-show="isLate(it)" class="badge badge-warning"><i class="fa-solid fa-clock text-[10px]" aria-hidden="true"></i> <span x-text="t('rq.late')"></span></span>
                        </div>
                      </td>
                      <td class="max-w-[20rem] px-4 py-4 align-middle">
                        <ol x-show="!missingLevels(it).length" class="class-chain" :aria-label="t('rq.colClassification')">
                          <template x-for="(s, i) in pathOf(it)" :key="s.level">
                            <li class="inline-flex min-w-0 items-center gap-1.5">
                              <i x-show="i > 0" class="fa-solid fa-chevron-right rtl:-scale-x-100" aria-hidden="true"></i>
                              <span :class="i === pathOf(it).length - 1 && 'text-ink'" x-text="s.label"></span>
                            </li>
                          </template>
                        </ol>
                        <p x-show="missingLevels(it).length" :id="'why-' + it.id" class="flex flex-wrap items-start gap-x-1.5 text-xs font-bold text-warning-800 dark:text-warning-500">
                          <i class="fa-solid fa-triangle-exclamation mt-0.5" aria-hidden="true"></i>
                          <span x-text="missingText(it)"></span>
                          <a :href="fixUrl(it)" class="underline underline-offset-2 hover:text-brand" x-text="t('rq.fixClassification')"></a>
                        </p>
                      </td>
                      <td class="px-4 py-4 align-middle">
                        <p class="flex items-center gap-2 text-xs text-muted">
                          <span class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-soft text-[10px] font-extrabold text-brand" lang="ar" aria-hidden="true" x-text="initials(it.submittedBy)"></span>
                          <span class="min-w-0"><span class="block truncate font-bold text-ink" x-text="it.submittedBy"></span>
                          <time class="block" :datetime="it.submittedAt" :title="new Date(it.submittedAt).toLocaleString(locale)" x-text="ago(it.submittedAt)"></time></span>
                        </p>
                      </td>
                      <td class="px-5 py-4 align-middle">
                        <div class="flex justify-end gap-1.5">
                          <button type="button" data-act="preview" class="act group relative" @click="openPreview(it, $event)" aria-haspopup="dialog" :aria-label="t('rq.actPreview') + ': ' + title(it)"><i class="fa-solid fa-eye" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('rq.actPreview')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                          <button type="button" data-act="reject" class="act group relative !text-danger hover:!bg-error-500/10" @click="openReject([it], $event)" aria-haspopup="dialog" :aria-label="t('rq.actReject') + ': ' + title(it)"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('rq.actReject')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                          <button type="button" data-act="approve" class="act group relative border-success-700 text-success-700 hover:!bg-success-500/10 dark:border-success-500 dark:text-success-500" @click="approve(it)" :aria-disabled="(!!missingLevels(it).length).toString()" :aria-describedby="missingLevels(it).length ? 'why-' + it.id : null" :class="missingLevels(it).length && 'cursor-not-allowed opacity-50'" :aria-label="t('rq.actApprove') + ': ' + title(it)"><i class="fa-solid fa-check" aria-hidden="true"></i><span class="tooltip-bubble" x-text="missingLevels(it).length ? t('rq.blockedShort') : t('rq.actApprove')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </section>
    </main>

    <!-- ================= Footer (كل النصوص عبر I18N) ================= -->
    <footer class="mt-auto border-t border-line bg-card/60"
          x-data="{ year: new Date().getFullYear() }"
          style="padding-bottom: env(safe-area-inset-bottom, 0px);">
    <div class="mx-auto flex w-full min-w-0 max-w-[1400px] flex-col gap-4 px-3 py-0 sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-8">

      <div class="flex min-w-0 items-center gap-3">
        <img src="../asset/images/firob-logo.png" alt="FirOb" loading="lazy" decoding="async" class="block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        <p class="min-w-0 text-sm text-muted"><span x-text="t('footer.tagline')"></span>
          <span class="block text-xs sm:inline sm:text-sm">
            <span class="hidden sm:inline" aria-hidden="true">·</span>
            © <span class="tabular-nums" x-text="year"></span> <span x-text="t('footer.rights')"></span>
          </span>
        </p>
      </div>

      <nav :aria-label="t('footer.navLabel')" class="min-w-0">
        <ul class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm font-bold" role="list">
          <li><a href="../index.html" class="rounded font-bold text-muted underline-offset-4 transition hover:text-brand hover:underline"><span aria-hidden="true">&#8962;</span> <span x-text="t('footer.screenMap')"></span></a></li>
          <template x-for="k in ['help', 'docs', 'privacy', 'terms']" :key="k">
            <li><span class="inline-flex cursor-not-allowed items-center text-line-strong" aria-disabled="true" x-text="t('footer.' + k)"></span></li>
          </template>
        </ul>
      </nav>

      <div class="flex flex-wrap items-center gap-2">
        <span class="badge badge-success">
          <span class="h-2 w-2 rounded-full bg-success-500" aria-hidden="true"></span>
          <span x-text="t('footer.systemsOk')"></span>
        </span>
      </div>
    </div>
  </footer>
  </div>
</div>

<!-- ==========================================================================
     لوحة المعاينة — يرى المراجع المحتوى كاملًا قبل القرار، مع التنقل للعنصر التالي
     ========================================================================== -->
<div x-show="previewOpen" x-cloak x-transition.opacity class="fixed inset-0 z-[60]">
  <div class="overlay-backdrop absolute inset-0 bg-primary-900/60" @click="closePreview()" aria-hidden="true"></div>

  <div x-show="previewOpen" x-trap.noscroll.noreturn="previewOpen && !rejectModalOpen" role="dialog" aria-modal="true" aria-labelledby="pv-title"
       @keydown.escape.stop.prevent="closePreview()"
       x-transition:enter="transition duration-300 ease-out" x-transition:enter-start="ltr:translate-x-full rtl:-translate-x-full" x-transition:enter-end="translate-x-0"
       x-transition:leave="transition duration-200 ease-in" x-transition:leave-start="translate-x-0" x-transition:leave-end="ltr:translate-x-full rtl:-translate-x-full"
       class="absolute inset-y-0 end-0 flex w-full max-w-xl flex-col border-s border-line bg-card shadow-pop">
    <template x-if="pv">
      <div class="flex min-h-0 flex-1 flex-col">
        <header class="flex shrink-0 items-start justify-between gap-3 border-b border-line bg-soft p-5">
          <div class="min-w-0">
            <p class="text-xs font-bold text-muted" x-text="tf('rq.posOf', { n: pvIndex + 1, total: rows.length }) + ' · ' + t('rq.tab.' + pv.kind)"></p>
            <h2 id="pv-title" class="mt-0.5 text-lg font-extrabold leading-7 text-ink" :lang="titleLang(pv)" dir="auto" style="text-align: match-parent" x-text="title(pv)"></h2>
            <p class="text-xs text-muted"><bdi class="font-mono" dir="ltr" x-text="pv.refId"></bdi></p>
          </div>
          <div class="flex shrink-0 items-center gap-1">
            <button type="button" class="icon-btn" @click="stepPreview(-1)" :disabled="pvIndex <= 0" :aria-label="t('rq.prevItem')"><i class="fa-solid fa-chevron-left rtl:-scale-x-100" aria-hidden="true"></i></button>
            <button type="button" class="icon-btn" @click="stepPreview(1)" :disabled="pvIndex >= rows.length - 1" :aria-label="t('rq.nextItem')"><i class="fa-solid fa-chevron-right rtl:-scale-x-100" aria-hidden="true"></i></button>
            <button type="button" class="icon-btn" @click="closePreview()" :aria-label="t('rq.closePreview')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </header>

        <div class="min-h-0 flex-1 space-y-5 overflow-y-auto overscroll-contain p-5">
          <!-- البيانات الوصفية -->
          <dl class="grid grid-cols-1 gap-3 text-sm sm:grid-cols-2">
            <div><dt class="text-xs font-bold text-muted" x-text="t('rq.colClassification')"></dt>
              <dd class="mt-1">
                <span x-show="!missingLevels(pv).length" x-text="pathOf(pv).map(s => s.label).join(' › ')"></span>
                <span x-show="missingLevels(pv).length" class="font-bold text-warning-800 dark:text-warning-500" x-text="missingText(pv)"></span>
              </dd></div>
            <div><dt class="text-xs font-bold text-muted" x-text="t('rq.colSubmitted')"></dt>
              <dd class="mt-1"><span x-text="pv.submittedBy"></span> · <time :datetime="pv.submittedAt" x-text="ago(pv.submittedAt)"></time></dd></div>
            <div><dt class="text-xs font-bold text-muted" x-text="t('rq.source')"></dt>
              <dd class="mt-1"><span class="badge" :class="pv.source === 'ai' ? 'badge-accent' : 'badge-muted'">
                <i class="fa-solid text-[10px]" :class="pv.source === 'ai' ? 'fa-wand-magic-sparkles' : 'fa-user-pen'" aria-hidden="true"></i>
                <span x-text="t('rq.src.' + pv.source)"></span></span></dd></div>
            <div><dt class="text-xs font-bold text-muted" x-text="t('rq.colType')"></dt>
              <dd class="mt-1"><span class="badge" :class="subMeta(pv).cls" x-text="subMeta(pv).label"></span></dd></div>
          </dl>
          <p x-show="pv.note" class="rounded-lg bg-soft px-3 py-2.5 text-sm text-muted"><i class="fa-regular fa-comment me-1 text-brand" aria-hidden="true"></i><span class="font-bold text-ink" x-text="t('rq.submitterNote') + ': '"></span><span x-text="pv.note"></span></p>

          <!-- المحتوى -->
          <section :aria-label="t('rq.contentLabel')" class="rounded-xl border border-line p-4">
            <template x-if="pv.kind === 'concepts'">
              <div class="grid gap-4 sm:grid-cols-2">
                <div lang="ar" dir="rtl"><h3 class="font-extrabold" x-text="pv.titleAr"></h3><p class="mt-1 text-sm leading-6 text-muted" x-text="pv.body.descAr"></p></div>
                <div lang="en" dir="ltr" class="border-line sm:border-s sm:ps-4"><h3 class="font-extrabold" x-text="pv.titleEn"></h3><p class="mt-1 text-sm leading-6 text-muted" x-text="pv.body.descEn"></p></div>
              </div>
            </template>
            <template x-if="pv.kind === 'learningObjects'">
              <div class="space-y-3">
                <div class="grid aspect-video place-items-center rounded-lg bg-soft text-center">
                  <div>
                    <i class="fa-solid text-4xl text-brand" :class="subMeta(pv).icon" aria-hidden="true"></i>
                    <p class="mt-2 text-sm font-bold"><bdi dir="ltr" x-text="pv.body.file"></bdi></p>
                    <p class="text-xs text-muted"><bdi dir="ltr" x-text="pv.body.size"></bdi></p>
                  </div>
                </div>
                <ul x-show="pv.body.points" class="space-y-1.5 text-sm leading-6 text-muted" lang="ar" dir="rtl" role="list">
                  <template x-for="(p, i) in pv.body.points || []" :key="i"><li class="flex gap-2"><i class="fa-solid fa-circle mt-2 text-[6px] text-brand" aria-hidden="true"></i><span x-text="p"></span></li></template>
                </ul>
                <p class="text-xs text-muted" x-text="t('rq.fileNote')"></p>
              </div>
            </template>
            <template x-if="pv.kind === 'quizzes'">
              <div lang="ar" dir="rtl" class="space-y-3">
                <p class="font-bold leading-7" x-text="pv.body.text"></p>
                <ul x-show="pv.body.options" class="space-y-1.5 text-sm" role="list">
                  <template x-for="(op, i) in pv.body.options || []" :key="i">
                    <li class="flex items-center gap-2 rounded-lg px-3 py-1.5" :class="i === pv.body.correct ? 'bg-success-50 font-bold text-ink dark:bg-success-500/10' : 'text-muted'">
                      <i class="fa-regular" :class="i === pv.body.correct ? 'fa-circle-dot text-success-700 dark:text-success-500' : 'fa-circle'" aria-hidden="true"></i>
                      <span x-text="op"></span>
                      <span x-show="i === pv.body.correct" class="ms-auto text-xs text-success-700 dark:text-success-500" x-text="t('rq.correct')"></span>
                    </li>
                  </template>
                </ul>
                <p x-show="pv.body.answer !== undefined" class="rounded-lg bg-success-50 px-3 py-2 text-sm dark:bg-success-500/10">
                  <span class="font-bold" x-text="t('rq.correct') + ': '"></span>
                  <span x-text="pv.body.answer === true ? t('rq.true') : pv.body.answer === false ? t('rq.false') : pv.body.answer"></span>
                </p>
                <p x-show="pv.body.questions" class="text-sm text-muted" x-text="tf('rq.quizMeta', { q: pv.body.questions, m: pv.body.marks, d: pv.body.minutes })"></p>
                <p x-show="pv.body.explanation" class="rounded-lg bg-soft px-3 py-2.5 text-xs leading-5 text-muted">
                  <span class="font-bold text-ink" x-text="t('rq.explanation') + ': '"></span><span x-text="pv.body.explanation"></span>
                </p>
              </div>
            </template>
          </section>
        </div>

        <footer class="shrink-0 space-y-2 border-t border-line p-4">
          <p x-show="missingLevels(pv).length" id="pv-why" class="text-xs font-bold text-warning-800 dark:text-warning-500">
            <i class="fa-solid fa-triangle-exclamation me-1" aria-hidden="true"></i><span x-text="missingText(pv)"></span>
            <a :href="fixUrl(pv)" class="ms-1 underline underline-offset-2" x-text="t('rq.fixClassification')"></a>
          </p>
          <div class="flex flex-wrap justify-end gap-2">
            <button type="button" class="btn btn-outline !text-danger hover:!bg-error-500/10" aria-haspopup="dialog" @click="openReject([pv], $event)">
              <i class="fa-solid fa-xmark" aria-hidden="true"></i> <span x-text="t('rq.actReject')"></span>
            </button>
            <button type="button" id="pv-approve" class="btn btn-success" :aria-disabled="(!!missingLevels(pv).length).toString()"
                    :aria-describedby="missingLevels(pv).length ? 'pv-why' : null" :class="missingLevels(pv).length && 'cursor-not-allowed opacity-60'"
                    @click="approve(pv)">
              <i class="fa-solid fa-check" aria-hidden="true"></i> <span x-text="t('rq.approveAndNext')"></span>
            </button>
          </div>
        </footer>
      </div>
    </template>
  </div>

      <h2 id="rj-title" class="text-lg font-extrabold text-ink" x-text="rejectTargets.length > 1 ? tf('rq.rejectTitleN', { items: pluralize('items', rejectTargets.length) }) : t('rq.rejectTitle')"></h2>
      <button type="button" class="icon-btn" @click="closeRejectModal()" :disabled="busy" :aria-label="t('rq.cancel')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>

    <div class="min-h-0 flex-1 space-y-4 overflow-y-auto p-5">

        <ul class="mt-1.5 space-y-0.5" role="list">
          <template x-for="it in rejectTargets.slice(0, 4)" :key="it.id">
            <li class="truncate font-bold text-ink" :lang="titleLang(it)" dir="auto" style="text-align: match-parent" x-text="'• ' + title(it)"></li>
          </template>
          <li x-show="rejectTargets.length > 4" class="text-xs" x-text="tf('rq.andMore', { n: rejectTargets.length - 4 })"></li>
        </ul>
      </div>

      <fieldset class="min-w-0">
        <legend class="label" x-text="t('rq.quickReasons')"></legend>
        <div class="flex flex-wrap gap-2">
          <template x-for="r in REASONS" :key="r">
            <button type="button" class="reason-chip" :aria-pressed="rejectTags.includes(r).toString()" @click="toggleTag(r)">
              <i class="fa-solid text-[10px]" :class="rejectTags.includes(r) ? 'fa-check' : 'fa-plus'" aria-hidden="true"></i>
              <span x-text="t('rq.reason.' + r)"></span>

          </template>
        </div>

        <label for="rj-reason" class="label"><span x-text="t('rq.rejectReasonLabel')"></span> <span class="text-danger" aria-hidden="true">*</span></label>

  /**
   * مكوّن قائمة الاختيار المخصصة (Select-only Combobox — نمط ARIA APG).
   * options: () => [{ value, label }] | get: () => القيمة | set: (v) => تحديث
   * لوحة المفاتيح: ↑↓ Home End Enter Space Esc Tab + البحث بالكتابة (type-ahead).
   * Esc يوقف الانتشار حتى لا يُغلق اللوحة الجانبية/النافذة الأم (C5).
   */
  function selectDropdown({ id, options, get, set, placeholder = '' }) {
    return {
      id, open: false, active: -1, typed: '', typedAt: 0,
      get items() { return options(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { const sel = this.selectedItem; return sel ? sel.label : placeholder; },
      optId(item) { return this.id + '-opt-' + (item.value === '' ? 'none' : item.value); },
      openList() {
        if (!this.items.length) return;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item) { set(item.value); this.closeList(); this.$refs.btn?.focus(); },
      setActive(i) { this.active = Math.min(Math.max(i, 0), this.items.length - 1); this.scrollActiveIntoView(); },
      move(step) { if (!this.open) { this.openList(); return; } this.setActive(this.active + step); },
      onKey(e) {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); if (e.altKey && this.open && k === 'ArrowUp') { this.choose(this.items[this.active]); return; } this.move(k === 'ArrowDown' ? 1 : -1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.setActive(0); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.setActive(this.items.length - 1); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); (this.open && this.active > -1) ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape') { if (this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); } }
        else if (k === 'Tab') { if (this.open) this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          const now = Date.now();
          this.typed = (now - this.typedAt > 600 ? '' : this.typed) + k.toLowerCase();
          this.typedAt = now;
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this.typed));
          if (i > -1) { if (!this.open) this.openList(); this.setActive(i); }
        }
      },
      scrollActiveIntoView() { this.$nextTick(() => this.$refs.list?.children[this.active + 1]?.scrollIntoView({ block: 'nearest' })); },
      isSelected(item) { const sel = this.selectedItem; return !!sel && sel.value === item.value; },
    };

        const map = { [rtl ? 'ArrowLeft' : 'ArrowRight']: (i + 1) % 3, [rtl ? 'ArrowRight' : 'ArrowLeft']: (i + 2) % 3, Home: 0, End: 2 };
        if (!(e.key in map)) return;

      decide(list, status, extra = {}) {
        const firstIdx = this.rows.indexOf(list[0]);
        list.forEach(it => Object.assign(it, { status, decidedAt: new Date().toISOString() }, extra));
        this.selected = this.selected.filter(id => !list.some(it => it.id === id));
        const what = list.length === 1 ? '«' + this.title(list[0]) + '»' : this.pluralize('items', list.length);
        const msg = this.tf('rq.decided.' + status, { what, left: this.fmt(this.count(this.activeTab)) });

        const chips = new Set(this.REASONS.map(r => '• ' + this.t('rq.reason.' + r)));

        } else {
          this.rejectTags = [...this.rejectTags, r];

        }

      },
      onGlobalKey(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const g = this.$refs.globalSearch;
          (g && g.offsetParent !== null ? g : this.$refs.rqSearch)?.focus();
        }
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      // Esc العام: القوائم فقط — المعاينة والنافذة تعالجان Esc بنفسيهما
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },
    };
  }
</script>
</body>
</html>
