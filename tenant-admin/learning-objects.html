<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {

    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;

      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;

    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: 2px solid rgb(var(--brand)); outline-offset: 2px; }  /* outline لا يتعارض مع ظلال المكونات ويعمل في forced-colors */
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* إلغاء أيقونة التفريغ الأصلية لحقول type="search" */
    input[type="search"]::-webkit-search-decoration,
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-results-button,
    input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; }

  @layer components {

    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }

    .nav-link i { @apply w-5 shrink-0 text-center text-base; }

    /* ---------- تلميحات أزرار الإجراءات (Action Tooltips) ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg bg-ink px-2.5 py-1 text-xs font-medium text-card opacity-0 shadow-xl transition-[opacity,transform] duration-200 ease-out;

    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-[opacity,transform] duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }

    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink dark:bg-soft-2; }

    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-muted; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */

    /* ---------- النافذة المنبثقة / اللوحة الجانبية ---------- */

    /* ---------- أيقونة تنسيق الملف (Format Icon Chip) ---------- */
    .format-icon { @apply grid h-11 w-11 shrink-0 place-items-center rounded-xl text-base; }

    /* ---------- رقم القسم في نموذج الرفع: يتحوّل إلى ✓ عند اكتماله ---------- */
    .step-dot { @apply grid h-8 w-8 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white transition-colors; }
    .step-dot.is-done { @apply bg-success-700; }
    /* زر إزالة الوسم: هدف لمس ≥ 24px (WCAG 2.5.8) */
    .tag-x { @apply inline-grid h-6 w-6 shrink-0 place-items-center rounded-full transition-colors hover:bg-primary-500/20; }

    .modal-panel { contain: layout paint; overflow: clip; }
    .overlay-backdrop { -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    @media (max-width: 640px), (prefers-reduced-transparency: reduce) {

          <p id="lo-course-err" class="err" x-show="formSubmitted && errors.course"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="errors.course"></span></p>
        </div>
            <!-- الصف: للقراءة فقط — مشتق من المقرر (subjects.grade_id) -->
            <div>
              <p id="lo-grade-label" class="label" x-text="t('lo.fieldGrade')"></p>
              <p class="field flex items-center gap-2 bg-soft text-muted" aria-labelledby="lo-grade-label" aria-live="polite">
                <i class="fa-solid fa-layer-group text-xs" aria-hidden="true"></i>
                <span x-text="gradeLabel || t('lo.gradeFromCourse')"></span>
              </p>
            </div>
          </div>
          <div class="my-5 border-t border-dashed border-line-strong/60"></div>
          <div class="grid grid-cols-1 items-start gap-5 sm:grid-cols-2">
        <div class="min-w-0"
             x-data="selectDropdown({ id: 'lo-unit', options: () => unitOptions(), get: () => form.unit, set: (v) => { if (form.unit !== v) { form.unit = v; form.lesson = ''; } }, placeholder: '—' })"
             @click.outside="closeList()">
          <label id="lo-unit-label" for="lo-unit" class="label"><span x-text="t('lo.fieldUnit')"></span></label>
          <div class="relative" data-combo-anchor>
          <button type="button" id="lo-unit" x-ref="btn" role="combobox" aria-haspopup="listbox" :disabled="!form.course" aria-describedby="lo-unit-hint"
                  :aria-expanded="open.toString()" aria-controls="lo-unit-list"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  class="field flex w-full items-center justify-between gap-2 text-start"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="lo-unit-list" role="listbox" aria-labelledby="lo-unit-label"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
          </div>
          <p id="lo-unit-hint" class="hint" x-show="!form.course" x-text="t('lo.selectCourseFirst')"></p>
        </div>
        <div class="min-w-0"
             x-data="selectDropdown({ id: 'lo-lesson', options: () => lessonOptions(), get: () => form.lesson, set: (v) => { form.lesson = v }, placeholder: '—' })"
             @click.outside="closeList()">
          <label id="lo-lesson-label" for="lo-lesson" class="label"><span x-text="t('lo.fieldLesson')"></span></label>
          <div class="relative" data-combo-anchor>
          <button type="button" id="lo-lesson" x-ref="btn" role="combobox" aria-haspopup="listbox" :disabled="!form.unit" aria-describedby="lo-lesson-hint"
                  :aria-expanded="open.toString()" aria-controls="lo-lesson-list"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  class="field flex w-full items-center justify-between gap-2 text-start"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="lo-lesson-list" role="listbox" aria-labelledby="lo-lesson-label"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
          </div>
          <p id="lo-lesson-hint" class="hint" x-show="form.course && !form.unit" x-text="t('lo.selectUnitFirst')"></p>
        </div>
          </div>
        </div>
      </section>

      <div class="border-t border-line"></div>

      <!-- ================= 3. المفاهيم المرتبطة + مساعد AI ================= -->
      <section class="space-y-3" aria-labelledby="lo-sec-3"
               x-data="conceptMultiSelect({ id: 'lo-concepts', options: () => conceptOptions(), get: () => form.concepts, set: (v) => form.concepts = v })"
               @click.outside="closeList()">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <span class="step-dot" :class="sectionDone.concepts && 'is-done'" aria-hidden="true"><i x-show="sectionDone.concepts" class="fa-solid fa-check text-xs"></i><span x-show="!sectionDone.concepts">3</span></span>
            <h3 id="lo-sec-3" class="text-base font-extrabold text-ink sm:text-lg" x-text="t('lo.sectionConcepts')"></h3>
          </div>
          <button type="button" class="btn btn-outline btn-sm" :disabled="aiLoading || !form.course" :aria-busy="aiLoading" @click="runAiAssistant()">
            <i class="fa-solid" :class="aiLoading ? 'fa-circle-notch animate-spin' : 'fa-wand-magic-sparkles'" aria-hidden="true"></i>
            <span x-text="aiLoading ? t('lo.aiAnalyzing') : t('lo.aiAssistant')"></span>
          </button>
        </div>
        <p class="hint !mt-0" x-text="form.course ? t('lo.fieldConceptsHint') : t('lo.conceptsNeedCourse')"></p>

        <div class="relative" data-combo-anchor>
          <div class="field flex min-h-[2.75rem] w-full flex-wrap items-center gap-1.5 py-1.5" :class="!form.course && 'bg-soft'"
               :aria-invalid="(formSubmitted && !!errors.concepts).toString()">
            <ul class="contents" role="list" :aria-label="t('lo.selectedConcepts')">
              <template x-for="c in selected" :key="c.value">
                <li class="badge badge-primary gap-1 py-0.5 pe-0.5">
                  <span dir="auto" x-text="c.label"></span>
                  <button type="button" class="tag-x" @click="remove(c.value)" :aria-label="t('lo.removeConcept') + ': ' + c.label">
                    <i class="fa-solid fa-xmark text-[10px]" aria-hidden="true"></i>
                  </button>
                </li>
              </template>
            </ul>
            <button type="button" id="lo-concepts" x-ref="btn" role="combobox" aria-haspopup="listbox" aria-controls="lo-concepts-list"
                    :aria-expanded="open.toString()" :aria-activedescendant="open && active > -1 && available[active] ? optId(available[active]) : null"
                    aria-labelledby="lo-sec-3" aria-describedby="lo-concepts-err" :disabled="!form.course"
                    class="inline-flex min-h-[2rem] shrink-0 items-center gap-1.5 rounded-lg px-2 py-1 text-xs font-bold text-brand transition-colors hover:bg-soft disabled:cursor-not-allowed disabled:text-muted"
                    @click="toggleList()" @keydown="onKey($event)">
              <i class="fa-solid fa-plus" aria-hidden="true"></i> <span x-text="t('lo.conceptsAdd')"></span>
            </button>
          </div>
          <ul x-show="open" x-cloak x-ref="list" id="lo-concepts-list" role="listbox" aria-labelledby="lo-sec-3" aria-multiselectable="true"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in available" :key="item.value">
              <li :id="optId(item)" role="option" aria-selected="false" class="combo-option" :class="idx === active && 'is-active'" @click="add(item)" @mousemove="active = idx">
                <span class="truncate" dir="auto" x-text="item.label"></span>
                <span class="flex shrink-0 items-center gap-2"><span class="font-mono text-[10px] text-muted" dir="ltr" x-text="item.value"></span><i class="fa-solid fa-plus text-xs text-brand" aria-hidden="true"></i></span>
              </li>
            </template>
            <li x-show="!available.length" role="presentation" class="px-4 py-2.5 text-sm text-muted" x-text="t('lo.conceptsAllAdded')"></li>
          </ul>
        </div>
        <p id="lo-concepts-err" class="err" x-show="formSubmitted && errors.concepts"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="errors.concepts"></span></p>
        <p class="sr-only" aria-live="polite" x-text="liveMsg"></p>

        <!-- اقتراحات AI: مرتبطة بالمقرر والعنوان، مع سبب الاقتراح -->
        <div x-show="aiSuggestions.length" x-cloak class="rounded-xl border border-dashed border-primary-500/40 bg-primary-500/5 p-3">
          <p class="mb-2 flex items-center gap-1.5 text-xs font-extrabold text-brand"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> <span x-text="t('lo.aiSuggestionsTitle')"></span></p>
          <ul class="flex flex-wrap gap-2" role="list">
            <template x-for="s in aiSuggestions" :key="s.value">
              <li>
                <button type="button" class="badge badge-accent gap-1.5 py-1 transition hover:brightness-95" @click="add(s); aiSuggestions = aiSuggestions.filter(x => x.value !== s.value)"
                        :aria-label="t('lo.aiAdd') + ': ' + s.label + ' — ' + s.reason">
                  <i class="fa-solid fa-plus text-[10px]" aria-hidden="true"></i> <span dir="auto" x-text="s.label"></span>
                  <span class="font-normal opacity-80" x-text="'· ' + s.reason"></span>
                </button>
              </li>
            </template>
          </ul>
        </div>
      </section>

      <div class="border-t border-line"></div>

      <!-- ================= 4. ملفات/مصادر العنصر ================= -->
      <section class="space-y-3" aria-labelledby="lo-sec-4">
        <div class="flex items-center gap-3">
          <span class="step-dot" :class="sectionDone.files && 'is-done'" aria-hidden="true"><i x-show="sectionDone.files" class="fa-solid fa-check text-xs"></i><span x-show="!sectionDone.files">4</span></span>
          <h3 id="lo-sec-4" class="text-base font-extrabold text-ink sm:text-lg" x-text="t('lo.sectionFiles')"></h3>
        </div>
        <p class="hint !mt-0" x-text="t('lo.fieldFilesMultiHint')"></p>

        <ul class="grid grid-cols-1 gap-2 sm:grid-cols-2" x-show="form.files.length" role="list" :aria-label="t('lo.filesList')">
          <template x-for="f in form.files" :key="f.id">
            <li class="flex items-center gap-3 rounded-xl border border-line p-3" :class="f.status === 'failed' && 'border-error-600'">
              <span class="format-icon shrink-0" :class="fileMeta(f.kind).iconClass" aria-hidden="true"><i class="fa-solid" :class="fileMeta(f.kind).icon"></i></span>
              <div class="min-w-0 flex-1">
                <p class="truncate text-sm font-bold text-ink" dir="auto" x-text="f.name"></p>
                <div class="mt-1 flex flex-wrap items-center gap-2">
                  <span class="badge" :class="fileMeta(f.kind).badge" x-text="fileMeta(f.kind).label"></span>
                  <bdi class="text-xs text-muted" dir="ltr" x-text="formatSize(f.bytes)"></bdi>
                  <span x-show="f.existing" class="text-xs text-muted" x-text="t('lo.fileStored')"></span>
                </div>
                <div x-show="f.status === 'uploading' || f.status === 'done'" class="quota-track mt-2" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                     :aria-valuenow="f.progress" :aria-label="t('lo.uploading') + ': ' + f.name">
                  <div class="quota-fill" :class="f.status === 'done' ? 'bg-success-500' : 'bg-primary-500'" :style="'width:' + f.progress + '%'"></div>
                </div>
              </div>
              <button type="button" class="act shrink-0 !text-danger hover:!bg-error-500/10" @click="removeFile(f.id)" :disabled="busy || (f.existing && existingCount === 1 && !newCount)"
                      :aria-label="t('lo.removeFile') + ': ' + f.name">
                <i class="fa-solid fa-trash" aria-hidden="true"></i>
              </button>
            </li>
          </template>
        </ul>

        <label for="lo-file" class="dropzone" :class="dragOver && 'is-drag'" :data-invalid="(formSubmitted && !!errors.files).toString()"
               @dragenter.prevent="onDragEnter()" @dragover.prevent @dragleave.prevent="onDragLeave()" @drop.prevent="onDrop($event)">
          <i class="fa-solid fa-cloud-arrow-up text-2xl text-muted" aria-hidden="true"></i>
          <span class="text-sm font-bold text-ink" x-text="form.files.length ? t('lo.addMoreFiles') : t('lo.fieldFileHint')"></span>
          <span class="text-xs text-muted" x-text="t('lo.fieldFileTypes')"></span>
          <input id="lo-file" type="file" multiple accept=".zip,.html,.htm,.mp4,.mov,.webm,.pdf" class="sr-only" @change="onFileChange($event)" aria-describedby="lo-files-err lo-files-rejected">
        </label>
        <p id="lo-files-err" class="err" x-show="formSubmitted && errors.files"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="errors.files"></span></p>
        <ul id="lo-files-rejected" x-show="fileErrors.length" class="space-y-1" role="alert">
          <template x-for="(msg, i) in fileErrors" :key="i">
            <li class="err !mt-0"><i class="fa-solid fa-ban" aria-hidden="true"></i> <span dir="auto" x-text="msg"></span></li>
          </template>
        </ul>
      </section>

      <div class="border-t border-line"></div>

      <!-- مفتاح is_public -->
      <div class="flex items-start justify-between gap-3 rounded-xl border border-line bg-page/50 p-4">
        <span class="min-w-0">
          <span id="lo-public-lbl" class="block text-sm font-bold text-ink" x-text="t('lo.fieldIsPublic')"></span>
          <span id="lo-public-hint" class="hint block" x-text="t('lo.fieldIsPublicHint')"></span>
        </span>
        <button type="button" class="switch-track" role="switch" :aria-checked="form.isPublic.toString()"
                aria-labelledby="lo-public-lbl" aria-describedby="lo-public-hint" @click="form.isPublic = !form.isPublic">
          <span class="switch-knob"></span>
        </button>
      </div>
    </div>

    <footer class="flex shrink-0 flex-wrap items-center justify-end gap-3 border-t border-line bg-page/40 p-4">
      <p x-show="formSubmitted && errorCount" class="me-auto flex items-center gap-1.5 text-xs font-bold text-danger" role="alert">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="tf('lo.errorsSummary', { n: errorCount })"></span>
      </p>
      <button type="button" class="btn btn-outline" :disabled="busy" @click="closePanel()" x-text="t('lo.cancel')"></button>
      <button type="submit" class="btn btn-primary" :disabled="busy" :aria-busy="busy">
        <i class="fa-solid animate-spin fa-circle-notch" x-show="busy" aria-hidden="true"></i>
        <span x-text="busy ? (newCount ? t('lo.uploading') : t('lo.saving')) : (editingObject ? (newCount ? t('lo.saveUpload') : t('lo.saveEdit')) : t('lo.saveUpload'))"></span>
      </button>
    </footer>
  </form>
</div>

<!-- ==========================================================================
     نافذة — معاينة العنصر التعليمي
     ========================================================================== -->
<div x-cloak x-show="modal === 'preview'" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4" @keydown.escape.window="closeModal()">
  <div class="overlay-backdrop absolute inset-0 bg-primary-900/60" @click="closeModal()" aria-hidden="true"></div>
  <div x-show="modal === 'preview'" x-trap.noscroll.noreturn="modal === 'preview'" role="dialog" aria-modal="true" aria-labelledby="pm-title"
       x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="opacity-0 scale-95"
       class="modal-panel max-h-[92dvh] max-w-2xl">
    <template x-if="previewTarget">
      <div class="flex min-h-0 flex-1 flex-col">
        <header class="flex shrink-0 items-center justify-between gap-3 border-b border-line bg-soft p-5">
          <div class="min-w-0">
            <h2 id="pm-title" class="truncate text-lg font-extrabold text-ink" dir="auto" x-text="title(previewTarget)"></h2>
            <p class="font-mono text-xs text-muted" dir="ltr" style="text-align: match-parent" x-text="previewTarget.code"></p>
          </div>
          <button type="button" class="icon-btn" @click="closeModal()" :aria-label="t('lo.close')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </header>
        <div class="scroll-thin min-h-0 flex-1 space-y-4 overflow-y-auto p-5">
          <div class="grid aspect-video place-items-center rounded-xl border border-dashed border-line-strong bg-page/60 text-muted">
            <div class="flex flex-col items-center gap-2 px-4 text-center">
              <i class="fa-solid text-3xl text-brand" :class="fileMeta(previewTarget.format).icon" aria-hidden="true"></i>
              <span class="text-xs font-bold" x-text="t('lo.previewHint')"></span>
            </div>
          </div>
          <dl class="grid grid-cols-1 gap-x-4 gap-y-2 text-sm sm:grid-cols-[auto_1fr]">
            <dt class="font-bold text-muted" x-text="t('lo.colFormat')"></dt>
            <dd><span class="badge" :class="fileMeta(previewTarget.format).badge" x-text="fileMeta(previewTarget.format).label"></span></dd>
            <dt class="font-bold text-muted" x-text="t('lo.colLinked')"></dt>
            <dd class="text-ink" dir="auto" x-text="pathOf(previewTarget).map(s => s.label).join(' › ')"></dd>
            <dt class="font-bold text-muted" x-text="t('lo.fieldConcepts')"></dt>
            <dd class="flex flex-wrap gap-1.5">
              <template x-for="code in previewTarget.concepts" :key="code"><span class="badge badge-primary" dir="auto" x-text="conceptLabel(code)"></span></template>
              <span x-show="!previewTarget.concepts.length" class="text-muted">—</span>
            </dd>
            <dt class="font-bold text-muted" x-text="t('lo.colVisibility')"></dt>
            <dd x-text="previewTarget.isPublic ? t('lo.visibilityPublic') : t('lo.visibilityPrivate')"></dd>
          </dl>
          <div>
            <p class="mb-2 text-xs font-extrabold text-muted" x-text="t('lo.filesList')"></p>
            <ul class="space-y-2" role="list">
              <template x-for="f in previewTarget.files" :key="f.name">
                <li class="flex items-center gap-3 rounded-xl border border-line p-2.5">
                  <i class="fa-solid w-5 text-center text-brand" :class="fileMeta(f.kind).icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate text-sm font-bold" dir="auto" x-text="f.name"></span>
                  <bdi class="text-xs text-muted" dir="ltr" x-text="formatSize(f.bytes)"></bdi>
                </li>
              </template>
            </ul>
          </div>
        </div>
        <footer class="flex shrink-0 items-center justify-end gap-3 border-t border-line bg-page/40 p-4">
          <button type="button" class="btn btn-outline" @click="closeModal()" x-text="t('lo.close')"></button>
          <button type="button" class="btn btn-primary" @click="const o = previewTarget; closeModal(false); openEdit(o)"><i class="fa-solid fa-pen" aria-hidden="true"></i> <span x-text="t('lo.actEdit')"></span></button>
        </footer>
      </div>
    </template>
  </div>
</div>

<!-- ==========================================================================
     نافذة — حذف العنصر التعليمي (حارس: عنصر مستخدم في أسئلة لا يُحذف)
     ========================================================================== -->
<div x-cloak x-show="modal === 'delete'" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-4" @keydown.escape.window="closeModal()">
  <div class="overlay-backdrop absolute inset-0 bg-primary-900/60" @click="closeModal()" aria-hidden="true"></div>
  <div x-show="modal === 'delete'" x-trap.noscroll.noreturn="modal === 'delete'" role="alertdialog" aria-modal="true" aria-labelledby="dm-title" aria-describedby="dm-desc"
       x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="opacity-0 scale-95"
       class="relative w-full max-w-md rounded-2xl border border-line bg-card p-6 text-center shadow-pop">
    <template x-if="deleteTarget && deleteTarget.questions > 0">
      <div>
        <span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-accent-500/20 text-yellow-800 dark:text-accent-500" aria-hidden="true"><i class="fa-solid fa-shield-halved text-xl"></i></span>
        <h2 id="dm-title" class="mt-4 text-lg font-extrabold text-ink" x-text="t('lo.guardTitle')"></h2>
        <p id="dm-desc" class="mt-2 text-sm text-muted"><span class="font-bold text-ink" dir="auto" x-text="title(deleteTarget)"></span> <span x-text="tf('lo.guardText', { questions: pluralize('questions', deleteTarget.questions) })"></span></p>
        <div class="mt-6 flex flex-col-reverse justify-center gap-3 sm:flex-row">
          <button type="button" class="btn btn-outline" @click="closeModal()" x-text="t('lo.close')"></button>
          <button type="button" class="btn btn-primary" x-show="deleteTarget.isPublic" @click="const o = deleteTarget; closeModal(); setPublic(o, false)">
            <i class="fa-solid fa-lock" aria-hidden="true"></i> <span x-text="t('lo.actMakePrivate')"></span>
          </button>
        </div>
      </div>
    </template>
    <template x-if="deleteTarget && !(deleteTarget.questions > 0)">
      <div>
        <span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-error-100 text-error-700 dark:bg-error-500/20 dark:text-red-300" aria-hidden="true"><i class="fa-solid fa-trash text-xl"></i></span>
        <h2 id="dm-title" class="mt-4 text-lg font-extrabold text-ink" x-text="t('lo.deleteTitle')"></h2>
        <p id="dm-desc" class="mt-2 text-sm text-muted" x-text="tf('lo.deleteText', { title: title(deleteTarget), files: pluralize('files', deleteTarget.files.length) })"></p>
        <div class="mt-6 flex justify-center gap-3">
          <button type="button" class="btn btn-outline" :disabled="busy" @click="closeModal()" x-text="t('lo.deleteCancel')"></button>
          <button type="button" class="btn btn-danger" :disabled="busy" :aria-busy="busy" @click="deleteConfirmed()">
            <i class="fa-solid animate-spin fa-circle-notch" x-show="busy" aria-hidden="true"></i>
            <span x-text="t('lo.deleteConfirm')"></span>
          </button>
        </div>
      </div>
    </template>
  </div>
</div>

<p class="sr-only" aria-live="polite" x-text="pageLiveMsg"></p>

<script>
  /**

      /* ---------- البيانات المرجعية (مشتركة) + العناصر ---------- */
      objects: OBJECTS,
      label(item) { return item ? (item[this.locale] || item.ar) : ''; },
      courseById(id) { return DATA.courses.find(c => c.id === id); },

        return [
          { level: 'course', label: this.label(this.courseById(o.courseId)) },
          o.unitId   && { level: 'unit',   label: this.label(DATA.units.find(u => u.id === o.unitId)) },

      },
      get kpis() {
        const os = this.objects;
        return { total: os.length, scorm: os.filter(o => o.format.startsWith('scorm')).length, html5: os.filter(o => o.format === 'html5').length, public: os.filter(o => o.isPublic).length };
      },
      kpiCards: [
        { key: 'total',  label: 'kpiTotal',  icon: 'fa-cubes',          cls: 'bg-primary-500/10 text-brand' },
        { key: 'scorm',  label: 'kpiScorm',  icon: 'fa-box-archive',    cls: 'bg-info-500/15 text-info-700 dark:text-blue-300' },
        { key: 'html5',  label: 'kpiHtml5',  icon: 'fa-code',           cls: 'bg-accent-500/20 text-yellow-800 dark:text-accent-500' },
        { key: 'public', label: 'kpiPublic', icon: 'fa-earth-americas', cls: 'bg-success-500/15 text-success-700 dark:text-success-500' },
      ],
      fileMeta(kind) {
        const map = {
          scorm12:   { label: this.t('lo.formatScorm12'),   icon: 'fa-box-archive', iconClass: 'bg-info-500/15 text-info-700 dark:text-blue-300', badge: 'badge-info' },
          scorm2004: { label: this.t('lo.formatScorm2004'), icon: 'fa-box-archive', iconClass: 'bg-info-500/15 text-info-700 dark:text-blue-300', badge: 'badge-info' },
          html5:     { label: this.t('lo.formatHtml5'),     icon: 'fa-code',        iconClass: 'bg-accent-500/20 text-yellow-800 dark:text-accent-500', badge: 'badge-accent' },
          video:     { label: this.t('lo.formatVideo'),     icon: 'fa-film',        iconClass: 'bg-primary-500/10 text-brand', badge: 'badge-primary' },
          pdf:       { label: this.t('lo.formatPdf'),       icon: 'fa-file-pdf',    iconClass: 'bg-error-500/10 text-error-700 dark:text-red-300', badge: 'badge-danger' },
        };
        return map[kind] || { label: 'FILE', icon: 'fa-file', iconClass: 'bg-line text-muted', badge: 'badge-muted' };
      },
      formatSize(bytes) {
        if (!bytes) return '—';
        const units = ['B', 'KB', 'MB', 'GB'];
        let n = bytes, i = 0;
        while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
        return n.toFixed(i > 0 && n < 10 ? 1 : 0) + ' ' + units[i];
      },

      /* ---------- الفلاتر (حقيقية + متسلسلة) ---------- */
      search: '', formatFilter: 'all', visibilityFilter: 'all', courseFilter: 'all', unitFilter: 'all',
      formatOptions() { return ['all', 'scorm12', 'scorm2004', 'html5', 'video', 'pdf'].map(v => ({ value: v, label: v === 'all' ? this.t('lo.formatAll') : this.fileMeta(v).label })); },
      visibilityOptions() { return [{ value: 'all', label: this.t('lo.visibilityAll') }, { value: 'public', label: this.t('lo.visibilityPublic') }, { value: 'private', label: this.t('lo.visibilityPrivate') }]; },
      courseFilterOptions() { return [{ value: 'all', label: this.t('lo.courseAll') }, ...DATA.courses.map(c => ({ value: c.id, label: this.label(c) }))]; },
      unitFilterOptions() { return [{ value: 'all', label: this.t('lo.unitAll') }, ...DATA.units.filter(u => this.courseFilter === 'all' || u.courseId === this.courseFilter).map(u => ({ value: u.id, label: this.label(u) }))]; },
      get filtered() {
        const q = this.search.trim().toLowerCase();
        return this.objects.filter(o =>
          (!q || [o.code, o.titleAr, o.titleEn].some(s => (s || '').toLowerCase().includes(q))) &&
          (this.formatFilter === 'all' || o.files.some(f => f.kind === this.formatFilter)) &&
          (this.visibilityFilter === 'all' || o.isPublic === (this.visibilityFilter === 'public')) &&
          (this.courseFilter === 'all' || o.courseId === this.courseFilter) &&
          (this.unitFilter === 'all' || o.unitId === this.unitFilter));
      },
      get activeFilterCount() { return [this.search.trim(), this.formatFilter !== 'all', this.visibilityFilter !== 'all', this.courseFilter !== 'all', this.unitFilter !== 'all'].filter(Boolean).length; },
      get resultsMsg() { return this.activeFilterCount ? this.tf('lo.resultsCount', { objects: this.pluralize('objects', this.filtered.length) }) : ''; },
      resetFilters() { this.search = ''; this.formatFilter = 'all'; this.visibilityFilter = 'all'; this.courseFilter = 'all'; this.unitFilter = 'all'; },

      /* ---------- الترقيم ---------- */
      page: 1, perPage: 5,
      get pageCount() { return Math.max(1, Math.ceil(this.filtered.length / this.perPage)); },
      get pageRows() { const p = Math.min(this.page, this.pageCount); return this.filtered.slice((p - 1) * this.perPage, p * this.perPage); },
      get pageInfo() {
        const total = this.filtered.length, from = total ? (Math.min(this.page, this.pageCount) - 1) * this.perPage + 1 : 0;
        return this.tf('lo.pageInfo', { from, to: Math.min(from + this.perPage - 1, total), total: this.pluralize('objects', total) });
      },
      goPage(p) { this.page = Math.min(Math.max(1, p), this.pageCount); this.$nextTick(() => document.getElementById('main')?.scrollIntoView({ block: 'start', behavior: 'smooth' })); },

      /* ---------- نافذة الرفع / التعديل ---------- */
      panelOpen: false, editingObject: null, formSubmitted: false, busy: false, lastTrigger: null,
      dragOver: false, dragDepth: 0, fileErrors: [], aiLoading: false, aiSuggestions: [],
      form: emptyForm(), snapshot: '',
      get dirty() { return JSON.stringify(this.form) !== this.snapshot; },
      get gradeLabel() { const c = this.courseById(this.form.course); return c ? (this.locale === 'en' ? c.gradeEn : c.gradeAr) : ''; },
      courseOptions() { return DATA.courses.map(c => ({ value: c.id, label: this.label(c) })); },
      unitOptions() { return [{ value: '', label: this.t('lo.notSpecified') }, ...DATA.units.filter(u => u.courseId === this.form.course).map(u => ({ value: u.id, label: this.label(u) }))]; },
      lessonOptions() { return [{ value: '', label: this.t('lo.notSpecified') }, ...DATA.lessons.filter(l => l.unitId === this.form.unit).map(l => ({ value: l.id, label: this.label(l) }))]; },
      conceptOptions() { return DATA.concepts.filter(c => c.courseId && c.courseId === this.form.course).map(c => ({ value: c.code, label: this.label(c) })); },
      setCourse(v) {
        if (this.form.course === v) return;
        const keep = new Set(DATA.concepts.filter(c => c.courseId === v).map(c => c.code));
        this.form.course = v; this.form.unit = ''; this.form.lesson = '';
        this.form.concepts = this.form.concepts.filter(c => keep.has(c));      // لا مفاهيم من مقرر آخر
        this.aiSuggestions = [];
      },
      get newCount() { return this.form.files.filter(f => !f.existing).length; },
      get existingCount() { return this.form.files.filter(f => f.existing).length; },
      get sectionDone() {
        const e = this.errors;
        return { basic: !e.titleAr && !e.titleEn, academic: !e.course, concepts: !e.concepts, files: !e.files };
      },
      get errors() {
        const e = {}, f = this.form;
        if (!f.titleAr) e.titleAr = this.t('lo.titleArRequired');
        if (!f.titleEn) e.titleEn = this.t('lo.titleEnRequired');
        else if (/[؀-ۿ]/.test(f.titleEn)) e.titleEn = this.t('lo.titleEnLatin');
        if (!f.course) e.course = this.t('lo.courseRequired');
        if (!f.concepts.length) e.concepts = this.t('lo.conceptsRequired');
        if (!f.files.length) e.files = this.t('lo.filesRequired');
        return e;
      },
      get errorCount() { return Object.keys(this.errors).length; },
      openUpload(evt) {
        this.lastTrigger = evt?.currentTarget || document.activeElement;
        this.editingObject = null;
        this.resetPanel(emptyForm());
      },
      openEdit(o, evt) {
        this.lastTrigger = evt?.currentTarget || this.lastTrigger || document.activeElement;
        this.editingObject = o;
        this.resetPanel({
          titleAr: o.titleAr, titleEn: o.titleEn, course: o.courseId, unit: o.unitId || '', lesson: o.lessonId || '',
          concepts: [...o.concepts], isPublic: o.isPublic,
          files: o.files.map((f, i) => ({ id: 'ex-' + o.id + '-' + i, name: f.name, kind: f.kind, bytes: f.bytes, existing: true, status: 'stored', progress: 100 })),
        });
      },
      resetPanel(form) {
        this.formSubmitted = false; this.fileErrors = []; this.aiSuggestions = []; this.dragDepth = 0; this.dragOver = false;
        this.form = form; this.snapshot = JSON.stringify(form);
        this.panelOpen = true;
      },
      closePanel(force = false) {
        if (this.busy || !this.panelOpen) return;
        if (!force && this.dirty && !window.confirm(this.t('lo.discardChanges'))) return;
        this.panelOpen = false;
        this.restoreFocus();
      },
      restoreFocus() {
        const el = this.lastTrigger; this.lastTrigger = null;
        this.$nextTick(() => { if (el && el.isConnected && el.offsetParent !== null) el.focus(); else document.getElementById('main')?.focus(); });
      },

      /* ---------- الملفات: تحقق النوع/الحجم/التكرار/العدد + سحب بلا وميض ---------- */
      fileKindFromName(name) {
        const ext = (name.split('.').pop() || '').toLowerCase();
        if (ext === 'zip') return 'scorm12';          // يُحدَّد الإصدار الدقيق في الخادم من imsmanifest.xml
        if (ext === 'pdf') return 'pdf';
        if (['mp4', 'mov', 'webm'].includes(ext)) return 'video';
        if (['html', 'htm'].includes(ext)) return 'html5';
        return null;
      },
      addFiles(list) {
        const errs = []; let added = 0;
        for (const f of Array.from(list || [])) {
          const kind = this.fileKindFromName(f.name);
          if (!kind) { errs.push(this.tf('lo.errType', { name: f.name })); continue; }
          if (f.size > LIMITS.bytes[kind]) { errs.push(this.tf('lo.errSize', { name: f.name, max: this.formatSize(LIMITS.bytes[kind]) })); continue; }
          if (this.form.files.some(x => x.name === f.name && x.bytes === f.size)) { errs.push(this.tf('lo.errDup', { name: f.name })); continue; }
          if (this.form.files.length >= LIMITS.maxFiles) { errs.push(this.t('lo.errMax')); break; }
          this.form.files.push({ id: 'f-' + Date.now() + '-' + Math.random().toString(16).slice(2), name: f.name, kind, bytes: f.size, existing: false, status: 'queued', progress: 0 });
          added++;
        }
        this.fileErrors = errs;
        if (added) this.announce(this.tf('lo.filesAdded', { files: this.pluralize('files', added) }));
      },
      onFileChange(e) { this.addFiles(e.target.files); e.target.value = ''; },
      onDragEnter() { this.dragDepth++; this.dragOver = true; },
      onDragLeave() { if (--this.dragDepth <= 0) { this.dragDepth = 0; this.dragOver = false; } },
      onDrop(e) { this.dragDepth = 0; this.dragOver = false; this.addFiles(e.dataTransfer.files); },
      removeFile(id) {
        const i = this.form.files.findIndex(f => f.id === id);
        if (i < 0) return;
        const [f] = this.form.files.splice(i, 1);
        this.toastUndo(this.tf('lo.fileRemoved', { name: f.name }), () => { this.form.files.splice(i, 0, f); });
      },

      /* ---------- مساعد المفاهيم: مرتبط بالمقرر/الوحدة/الدرس/العنوان مع سبب ---------- */
      async runAiAssistant() {
        if (!this.form.course) return;
        this.aiLoading = true;
        await sleep(700);
        const words = (this.form.titleAr + ' ' + this.form.titleEn).toLowerCase().split(/\s+/).filter(w => w.length > 3);
        const rank = (c) => {
          if (this.form.lesson && c.lessonId === this.form.lesson) return [3, 'aiReasonLesson'];
          if (this.form.unit && c.unitId === this.form.unit) return [2, 'aiReasonUnit'];
          if (words.some(w => (c.ar + ' ' + c.en).toLowerCase().includes(w))) return [2, 'aiReasonTitle'];
          return [1, 'aiReasonCourse'];
        };
        this.aiSuggestions = DATA.concepts
          .filter(c => c.courseId === this.form.course && !this.form.concepts.includes(c.code))
          .map(c => { const [score, why] = rank(c); return { value: c.code, label: this.label(c), score, reason: this.t('lo.' + why) }; })
          .sort((a, b) => b.score - a.score).slice(0, 4);
        this.aiLoading = false;
        this.announce(this.aiSuggestions.length ? this.tf('lo.aiReady', { n: this.aiSuggestions.length }) : this.t('lo.aiNone'));
      },

      /* ---------- الحفظ: تحقق + تقدّم رفع تجريبي لكل ملف جديد ---------- */
      async submitObject() {
        this.formSubmitted = true;
        if (this.errorCount) {
          await this.$nextTick();
          this.$refs.form.querySelector('[aria-invalid="true"]')?.focus();
          return;
        }
        this.busy = true;
        for (const f of this.form.files.filter(x => !x.existing)) {
          f.status = 'uploading';
          for (let p = 20; p <= 100; p += 20) { f.progress = p; await sleep(90); }
          f.status = 'done';
        }
        await sleep(200);
        const f = this.form;
        const data = { titleAr: f.titleAr, titleEn: f.titleEn, courseId: f.course, unitId: f.unit, lessonId: f.lesson, concepts: [...f.concepts], isPublic: f.isPublic,
                       files: f.files.map(x => ({ name: x.name, kind: x.kind, bytes: x.bytes })) };
        data.format = data.files[0].kind;
        if (this.editingObject) Object.assign(this.editingObject, data);
        else {
          const prefix = { scorm12: 'SCORM', scorm2004: 'SCORM', html5: 'HTML5', video: 'VID', pdf: 'PDF' }[data.format];
          this.objects.unshift({ id: Date.now(), code: 'LO-' + prefix + '-' + String(100 + this.objects.length).padStart(3, '0'), status: 'review', questions: 0, ...data });
        }
        this.busy = false;
        this.toastSuccess(this.t(this.editingObject ? 'lo.toastSave' : 'lo.toastUpload'));
        this.snapshot = JSON.stringify(this.form);
        this.closePanel(true);
      },

      /* ---------- المعاينة / الظهور / الحذف ---------- */
      modal: null, previewTarget: null, deleteTarget: null,
      openPreview(o, evt) { this.lastTrigger = evt?.currentTarget || document.activeElement; this.previewTarget = o; this.modal = 'preview'; },
      closeModal(restore = true) {
        if (this.busy || !this.modal) return;
        this.modal = null; this.previewTarget = null; this.deleteTarget = null;
        if (restore) this.restoreFocus();
      },
      async togglePublic(o) {
        if (!o.isPublic) {
          const ok = await this.confirmDialog(this.t('lo.publishTitle'), this.tf('lo.publishText', { title: this.title(o) }), this.t('lo.publishConfirm'));
          if (!ok) return;
        }
        this.setPublic(o, !o.isPublic);
      },
      setPublic(o, val) {
        const prev = o.isPublic; o.isPublic = val;
        this.toastUndo(this.tf(val ? 'lo.toastPublic' : 'lo.toastPrivate', { title: this.title(o) }), () => { o.isPublic = prev; });
      },
      async confirmDialog(title, text, confirmText) {
        if (!window.Swal) return window.confirm(text);
        const r = await Swal.fire({ title, text, icon: 'warning', showCancelButton: true, focusCancel: true, reverseButtons: true,
          confirmButtonText: confirmText, cancelButtonText: this.t('lo.cancel'), buttonsStyling: false,
          customClass: { popup: 'firob-swal', confirmButton: 'btn btn-primary', cancelButton: 'btn btn-outline' } });
        return r.isConfirmed;
      },
      confirmDelete(o, evt) { this.lastTrigger = evt?.currentTarget || document.activeElement; this.deleteTarget = o; this.modal = 'delete'; },
      async deleteConfirmed() {
        const o = this.deleteTarget;
        if (!o || o.questions > 0) return;
        this.busy = true; await sleep(400); this.busy = false;
        this.objects = this.objects.filter(x => x.id !== o.id);
        this.modal = null; this.deleteTarget = null;
        this.toastSuccess(this.tf('lo.toastDelete', { title: this.title(o) }));
        this.restoreFocus();
      },

      /* ---------- SweetAlert2 ---------- */
      toastBase(extra) {
        if (!window.Swal) return Promise.resolve({});
        return Swal.fire(Object.assign({
          toast: true, position: 'top-end', icon: 'success', showConfirmButton: false, timer: 3000,
          customClass: { popup: 'firob-swal firob-toast' },
          didOpen: (el) => { el.addEventListener('mouseenter', Swal.stopTimer); el.addEventListener('mouseleave', Swal.resumeTimer); el.addEventListener('focusin', Swal.stopTimer); },
        }, extra));
      },
      toastSuccess(msg) { this.toastBase({ title: msg }); },
      toastUndo(msg, undo) {
        this.toastBase({ title: msg, timer: 6000, timerProgressBar: true, showConfirmButton: true, confirmButtonText: this.t('lo.undo'), buttonsStyling: false,
          customClass: { popup: 'firob-swal firob-toast', confirmButton: 'btn btn-sm btn-outline' } })
          .then(r => { if (r.isConfirmed) { undo(); this.toastSuccess(this.t('lo.undone')); } });
      },

      /* ---------- عامة ---------- */
      init() {
        document.title = this.t('docTitle');
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        wideMQ.addEventListener('change', (m) => { this.wide = m.matches; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        this.$watch('courseFilter', () => { this.unitFilter = 'all'; this.page = 1; });
        ['search', 'formatFilter', 'visibilityFilter', 'unitFilter'].forEach(k => this.$watch(k, () => { this.page = 1; }));
        window.addEventListener('beforeunload', (e) => { if (this.panelOpen && this.dirty && !this.busy) { e.preventDefault(); e.returnValue = ''; } });
      },
      onGlobalKey(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const g = this.$refs.globalSearch;
          (g && g.offsetParent !== null ? g : this.$refs.loSearch)?.focus();
        }
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      // Esc العام: القوائم فقط — كل نافذة تعالج Esc بنفسها (مع تأكيد التغييرات غير المحفوظة)
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },
    };
  }
</script>
</body>
