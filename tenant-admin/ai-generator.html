<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

    .gen-skeleton { @apply h-24 rounded-xl border border-line bg-soft/60 motion-safe:animate-pulse; }
    /* زر إزالة الملف: هدف لمس ≥ 24px (WCAG 2.5.8) */
    .tag-x { @apply inline-grid h-7 w-7 shrink-0 place-items-center rounded-full text-muted transition-colors hover:bg-error-500/10 hover:text-danger; }

    /* ---------- منزلقات العدد: مسار ≥ 3:1 (WCAG 1.4.11) + جزء ممتلئ + تركيز واضح ---------- */
    .range { @apply h-2 w-full cursor-pointer appearance-none rounded-full;
             background: linear-gradient(to right, rgb(var(--brand)) var(--pct, 50%), rgb(var(--line-strong)) var(--pct, 50%)); }
    [dir="rtl"] .range { background: linear-gradient(to left, rgb(var(--brand)) var(--pct, 50%), rgb(var(--line-strong)) var(--pct, 50%)); }
    .range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; height: 1.25rem; width: 1.25rem; border-radius: 9999px;
             background: rgb(var(--brand)); border: 3px solid rgb(var(--card)); box-shadow: 0 0 0 1px rgb(var(--brand)); }
    .range::-moz-range-thumb { height: 1.25rem; width: 1.25rem; border-radius: 9999px; background: rgb(var(--brand));
             border: 3px solid rgb(var(--card)); box-shadow: 0 0 0 1px rgb(var(--brand)); }
    .range:focus-visible { outline: 3px solid rgb(var(--brand)); outline-offset: 6px; }
    @media (forced-colors: active) { .range { background: CanvasText; } }
  }
</style>

                  <label id="ai-unit-label" for="ai-unit" class="label"><span x-text="t('aig.field.unit')"></span> <span class="text-danger" aria-hidden="true" x-show="reqUnit">*</span></label>
                  <div class="relative" data-combo-anchor>
                    <button type="button" id="ai-unit" x-ref="btn" role="combobox" aria-haspopup="listbox" :disabled="!aiForm.courseId" :aria-required="(reqUnit).toString()" :aria-invalid="(invalid('unit')).toString()" aria-describedby="ai-unit-hint"
                            :aria-expanded="open.toString()" aria-controls="ai-unit-list"
                            :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                            class="field flex min-h-[2.75rem] w-full items-center justify-between gap-2 text-start font-bold"
                            @click="toggleList()" @keydown="onKey($event)">
                      <span class="truncate" :class="!selectedItem && 'font-medium text-muted'" x-text="triggerLabel"></span>
                      <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
                    </button>
                    <ul x-show="open" x-cloak x-ref="list" id="ai-unit-list" role="listbox" aria-labelledby="ai-unit-label"
                        x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                      <template x-for="(item, idx) in items" :key="item.value">
                        <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                            class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                            @click="choose(item)" @mousemove="active = idx">
                          <span class="truncate" x-text="item.label"></span>
                          <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                        </li>
                      </template>
                    </ul>
                  </div>
                  <p id="ai-unit-hint" class="hint" :class="(invalid('unit')) && 'font-bold !text-danger'" x-show="aiForm.courseId && reqUnit" x-text="t('aig.requiredBySettings')"></p>
                </div>
                <div class="min-w-0"
                     x-data="selectDropdown({ id: 'ai-lesson', options: () => lessonOpts, get: () => aiForm.lessonId, set: (v) => { aiForm.lessonId = v }, placeholder: () => lessonPh() })"
                     @click.outside="closeList()">
                  <label id="ai-lesson-label" for="ai-lesson" class="label"><span x-text="t('aig.field.lesson')"></span> <span class="text-danger" aria-hidden="true" x-show="reqLesson">*</span></label>
                  <div class="relative" data-combo-anchor>
                    <button type="button" id="ai-lesson" x-ref="btn" role="combobox" aria-haspopup="listbox" :disabled="!aiForm.unitId" :aria-required="(reqLesson).toString()" :aria-invalid="(invalid('lesson')).toString()" aria-describedby="ai-lesson-hint"
                            :aria-expanded="open.toString()" aria-controls="ai-lesson-list"
                            :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                            class="field flex min-h-[2.75rem] w-full items-center justify-between gap-2 text-start font-bold"
                            @click="toggleList()" @keydown="onKey($event)">
                      <span class="truncate" :class="!selectedItem && 'font-medium text-muted'" x-text="triggerLabel"></span>
                      <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
                    </button>
                    <ul x-show="open" x-cloak x-ref="list" id="ai-lesson-list" role="listbox" aria-labelledby="ai-lesson-label"
                        x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                      <template x-for="(item, idx) in items" :key="item.value">
                        <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                            class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                            @click="choose(item)" @mousemove="active = idx">
                          <span class="truncate" x-text="item.label"></span>
                          <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                        </li>
                      </template>
                    </ul>
                  </div>
                  <p id="ai-lesson-hint" class="hint" :class="(invalid('lesson')) && 'font-bold !text-danger'" x-show="aiForm.unitId && reqLesson" x-text="t('aig.requiredBySettings')"></p>
                </div>
              </div>
            </fieldset>

            <!-- ========== معطيات الأسئلة ========== -->
            <div x-show="generationMode === 'questions'" class="space-y-4 border-t border-line pt-5">
              <h2 class="label" x-text="t('aig.paramsTitle')"></h2>
                <div class="min-w-0"
                     x-data="selectDropdown({ id: 'ai-bloom', options: () => bloomOpts(), get: () => aiForm.bloom, set: (v) => { aiForm.bloom = v }, placeholder: () => '' })"
                     @click.outside="closeList()">
                  <label id="ai-bloom-label" for="ai-bloom" class="label"><span x-text="t('aig.fieldBloom')"></span></label>
                  <div class="relative" data-combo-anchor>
                    <button type="button" id="ai-bloom" x-ref="btn" role="combobox" aria-haspopup="listbox"
                            :aria-expanded="open.toString()" aria-controls="ai-bloom-list"
                            :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                            class="field flex min-h-[2.75rem] w-full items-center justify-between gap-2 text-start font-bold"
                            @click="toggleList()" @keydown="onKey($event)">
                      <span class="truncate" :class="!selectedItem && 'font-medium text-muted'" x-text="triggerLabel"></span>
                      <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
                    </button>
                    <ul x-show="open" x-cloak x-ref="list" id="ai-bloom-list" role="listbox" aria-labelledby="ai-bloom-label"
                        x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                      <template x-for="(item, idx) in items" :key="item.value">
                        <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                            class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                            @click="choose(item)" @mousemove="active = idx">
                          <span class="truncate" x-text="item.label"></span>
                          <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                        </li>
                      </template>
                    </ul>
                  </div>
                </div>
              <fieldset class="min-w-0">
                <legend class="label" x-text="t('aig.fieldQType')"></legend>
                <div class="grid grid-cols-2 gap-2">
                  <template x-for="q in ['mcq', 'tf', 'fill', 'essay']" :key="q">
                    <label class="pill-option" :class="aiForm.qtype === q && 'is-checked'">
                      <input type="radio" name="ai-qtype" :value="q" x-model="aiForm.qtype" class="sr-only">
                      <span x-text="t('aig.qType.' + q)"></span>
                    </label>
                  </template>
                </div>
              </fieldset>

              <fieldset class="min-w-0">
                <legend class="label" x-text="t('aig.fieldDifficulty')"></legend>
                <div class="grid grid-cols-2 gap-2 sm:grid-cols-4">
                  <template x-for="d in ['easy', 'medium', 'hard', 'mixed']" :key="d">
                    <label class="pill-option" :class="aiForm.difficulty === d && 'is-checked'">
                      <input type="radio" name="ai-difficulty" :value="d" x-model="aiForm.difficulty" class="sr-only">
                      <span x-text="t('aig.diff.' + d)"></span>
                    </label>
                  </template>
                </div>
              </fieldset>

              <div>
                <label for="ai-count" class="label flex items-center justify-between gap-2">
                  <span x-text="t('aig.fieldCount')"></span>
                  <output for="ai-count" class="font-mono text-brand" aria-hidden="true" x-text="aiForm.count"></output>
                </label>
                <input id="ai-count" type="range" min="3" max="20" step="1" class="range" x-model.number="aiForm.count"
                       :style="`--pct:${(aiForm.count - 3) / 17 * 100}%`" :aria-valuetext="pluralize('questions', aiForm.count)">
                <div class="mt-1 flex justify-between text-xs tabular-nums text-muted" aria-hidden="true"><span>3</span><span>20</span></div>
              </div>
            </div>

            <!-- ========== معطيات المفاهيم ========== -->
            <div x-show="generationMode === 'concepts'" x-cloak class="space-y-4 border-t border-line pt-5">
              <h2 class="label" x-text="t('aig.paramsTitle')"></h2>
              <div>
                <label for="ai-concept-count" class="label flex items-center justify-between gap-2">
                  <span x-text="t('aig.fieldConceptCount')"></span>
                  <output for="ai-concept-count" class="font-mono text-brand" aria-hidden="true" x-text="aiForm.conceptCount"></output>
                </label>
                <input id="ai-concept-count" type="range" min="1" max="10" step="1" class="range" x-model.number="aiForm.conceptCount"
                       :style="`--pct:${(aiForm.conceptCount - 1) / 9 * 100}%`" :aria-valuetext="pluralize('concepts', aiForm.conceptCount)">
                <div class="mt-1 flex justify-between text-xs tabular-nums text-muted" aria-hidden="true"><span>1</span><span>10</span></div>
              </div>
              <p class="flex items-start gap-2 rounded-lg bg-soft px-3 py-2.5 text-xs leading-5 text-muted">
                <i class="fa-solid fa-language mt-0.5 text-brand" aria-hidden="true"></i>
                <span x-text="t('aig.conceptsBilingualNote')"></span>
              </p>
            </div>

            <!-- ========== معطيات الملخصات ========== -->
            <div x-show="generationMode === 'summaries'" x-cloak class="space-y-4 border-t border-line pt-5">
              <h2 class="label" x-text="t('aig.paramsTitle')"></h2>
              <fieldset class="min-w-0">
                <legend class="label" x-text="t('aig.fieldSummaryLength')"></legend>
                <div class="grid grid-cols-3 gap-2">
                  <template x-for="s in ['short', 'medium', 'long']" :key="s">
                    <label class="pill-option" :class="aiForm.summaryLength === s && 'is-checked'">
                      <input type="radio" name="ai-summary-len" :value="s" x-model="aiForm.summaryLength" class="sr-only">
                      <span x-text="t('aig.summary.' + s)"></span>
                    </label>
                  </template>
                </div>
              </fieldset>
            </div>

            <!-- السياق النصي + الملف المرجعي -->
            <div class="border-t border-line pt-5">
              <label for="ai-prompt" class="label" x-text="t('aig.promptLabel')"></label>
              <textarea id="ai-prompt" rows="4" x-model="aiForm.prompt" :maxlength="PROMPT_MAX" class="field resize-y"
                        :placeholder="t('aig.promptPlaceholder')" aria-describedby="ai-prompt-hint ai-prompt-count"></textarea>
              <div class="mt-1.5 flex items-start justify-between gap-3">
                <p id="ai-prompt-hint" class="text-xs text-muted" x-text="t('aig.promptHint')"></p>
                <p id="ai-prompt-count" class="shrink-0 text-xs tabular-nums" dir="ltr"
                   :class="aiForm.prompt.length > PROMPT_MAX * .9 ? 'font-bold text-danger' : 'text-muted'"
                   x-text="aiForm.prompt.length + ' / ' + PROMPT_MAX"></p>
              </div>

              <div class="mt-3">
                <input type="file" x-ref="file" class="hidden" :accept="FILE_ACCEPT" @change="onFile($event)" tabindex="-1" aria-hidden="true">
                <button type="button" x-ref="attachBtn" x-show="!attached" class="btn btn-outline btn-sm" @click="$refs.file.click()" aria-describedby="ai-file-hint">
                  <i class="fa-solid fa-paperclip" aria-hidden="true"></i>
                  <span x-text="t('aig.attachFile')"></span>
                </button>
                <p id="ai-file-hint" x-show="!attached" class="hint" x-text="t('aig.fileHint')"></p>
                <div x-show="attached" x-cloak class="inline-flex max-w-full items-center gap-2 rounded-lg border border-line bg-soft py-1 pe-1 ps-3 text-sm">
                  <i class="fa-regular fa-file-lines text-brand" aria-hidden="true"></i>
                  <bdi class="min-w-0 truncate font-bold" dir="auto" x-text="attached?.name"></bdi>
                  <bdi class="shrink-0 text-xs text-muted" dir="ltr" x-text="attached ? formatSize(attached.size) : ''"></bdi>
                  <button type="button" class="tag-x" @click="removeFile()" :aria-label="t('aig.removeFile') + ': ' + (attached?.name || '')">
                    <i class="fa-solid fa-xmark text-xs" aria-hidden="true"></i>
                  </button>
                </div>
                <p x-show="fileError" x-cloak class="err" role="alert"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="fileError"></span></p>
              </div>
            </div>
          </fieldset>

          <!-- التكلفة التقديرية + التوليد / الإلغاء -->
          <div class="space-y-2.5 border-t border-line pt-5">
            <p class="flex items-center justify-between gap-2 text-xs font-bold" :class="overQuota ? 'text-danger' : 'text-muted'">
              <span><i class="fa-solid fa-coins me-1" aria-hidden="true"></i> <span x-text="t('aig.estimateLabel')"></span></span>
              <span class="tabular-nums" dir="ltr" x-text="'≈ ' + fmt(estimate) + ' ' + t('aig.tokensUnit')"></span>
            </p>
            <div class="flex gap-2">
              <button type="submit" class="btn btn-accent btn-lg flex-1 justify-center py-3.5 text-base"
                      :class="!canGenerate && !running && 'opacity-60'" :aria-disabled="(!canGenerate).toString()" :disabled="running"
                      aria-describedby="ai-gen-hint">
                <i class="fa-solid" :class="running ? 'fa-circle-notch motion-safe:animate-spin' : 'fa-wand-magic-sparkles'" aria-hidden="true"></i>
                <span x-text="running ? t('aig.generating') : t('aig.generateBtn')"></span>
              </button>
              <button type="button" x-show="running" x-cloak class="btn btn-outline btn-lg" @click="cancel()">
                <i class="fa-solid fa-stop" aria-hidden="true"></i>
                <span x-text="t('aig.cancel')"></span>
              </button>
            </div>
            <p id="ai-gen-hint" class="hint text-center" :class="(submitted && missing.length) || overQuota ? 'font-bold !text-danger' : ''" x-text="genHint"></p>
          </div>
        </form>

        <!-- ========== لوحة المعاينة والنتائج ========== -->
        <section class="panel min-h-[32rem] p-5 sm:p-6" aria-labelledby="res-title" :aria-busy="running.toString()">
          <h2 id="res-title" class="sr-only" x-text="t('aig.resultsLabel')"></h2>

          <!-- فارغة -->
          <div x-show="cur.status === 'idle' && !cur.items.length" class="flex min-h-[28rem] flex-col items-center justify-center text-center">
            <span class="mb-4 grid h-16 w-16 place-items-center rounded-2xl bg-primary-500/10 text-2xl text-brand" aria-hidden="true"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
            <p class="font-extrabold text-ink" x-text="t('aig.emptyTitle')"></p>
            <p class="mx-auto mt-1.5 max-w-sm text-sm text-muted" x-text="t('aig.emptySubtitle')"></p>
            <ul class="mx-auto mt-5 max-w-sm space-y-2.5 text-start text-sm text-muted" role="list">
              <template x-for="k in ['tip1', 'tip2', 'tip3']" :key="k">
                <li class="flex items-start gap-2.5"><i class="fa-solid fa-circle-check mt-0.5 shrink-0 text-success-700 dark:text-success-500" aria-hidden="true"></i> <span x-text="t('aig.' + k)"></span></li>
              </template>
            </ul>
          </div>

          <!-- قيد التوليد: مراحل + هياكل بعدد العناصر المطلوبة -->
          <div x-show="cur.status === 'running'" x-cloak class="flex min-h-[28rem] flex-col items-center justify-center gap-5 text-center">
            <span class="grid h-14 w-14 place-items-center rounded-2xl bg-accent-500/20 text-xl text-yellow-900 dark:text-accent-500" aria-hidden="true">
              <i class="fa-solid fa-circle-notch motion-safe:animate-spin"></i>
            </span>
            <div>
              <p class="font-extrabold text-ink" x-text="t('aig.busyTitle')"></p>
              <p class="mt-1 text-sm text-muted" x-text="t('aig.busySubtitle')"></p>
            </div>
            <ol class="space-y-1.5 text-start text-sm" role="list">
              <template x-for="(s, i) in ['analyze', 'generate', 'validate']" :key="s">
                <li class="flex items-center gap-2" :class="i <= stage ? 'font-bold text-ink' : 'text-muted'">
                  <i class="fa-solid w-4 text-center" aria-hidden="true"
                     :class="i < stage ? 'fa-circle-check text-success-700 dark:text-success-500' : (i === stage ? 'fa-circle-notch motion-safe:animate-spin text-brand' : 'fa-circle text-[8px]')"></i>
                  <span x-text="t('aig.stage.' + s)"></span>
                </li>
              </template>
            </ol>
            <div class="w-full max-w-sm space-y-2.5" aria-hidden="true">
              <template x-for="i in skeletonCount" :key="i"><div class="gen-skeleton"></div></template>
            </div>
          </div>

          <!-- خطأ -->
          <div x-show="cur.status === 'error'" x-cloak class="mb-4 rounded-xl border border-error-600/40 bg-error-500/5 p-4" role="alert">
            <p class="flex items-center gap-2 font-extrabold text-danger"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> <span x-text="t('aig.err.title')"></span></p>
            <p class="mt-1 text-sm text-muted" x-text="cur.error ? t('aig.err.' + cur.error) : ''"></p>
            <div class="mt-3 flex flex-wrap gap-2">
              <button type="button" class="btn btn-outline btn-sm" @click="generate()"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i> <span x-text="t('aig.retry')"></span></button>
              <a x-show="cur.error === 'quota'" href="SubscriptionsAndInvoices.html" class="btn btn-accent btn-sm"><i class="fa-solid fa-bolt" aria-hidden="true"></i> <span x-text="t('aig.tokens.recharge')"></span></a>
            </div>
          </div>

          <!-- النتائج (بيانات حقيقية تعكس المعطيات) -->
          <template x-if="cur.status !== 'running' && cur.items.length">
            <div class="space-y-4">
              <div class="flex flex-wrap items-start justify-between gap-3">
                <div class="min-w-0">
                  <p x-ref="resultsHead" tabindex="-1" class="flex items-center gap-2 text-sm font-bold text-success-700 focus:outline-none dark:text-success-500">
                    <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                    <span x-text="tf('aig.resultsReady', { items: pluralize('items', cur.items.length) })"></span>
                  </p>
                  <p class="mt-1 text-xs text-muted" x-text="contextLine(cur.ctx)"></p>
                </div>
                <span class="badge badge-muted shrink-0" x-show="savedCount" x-text="tf('aig.savedOf', { n: savedCount, total: cur.items.length })"></span>
              </div>

              <ol class="space-y-3" role="list">
                <template x-for="(r, i) in cur.items" :key="r.uid">
                  <li class="gen-card" :class="r.saved && 'border-success-500/50'" :data-uid="r.uid"
                      @keydown.escape.stop="r.editing && cancelEdit(r, $event)">
                    <article :aria-labelledby="'gi-' + r.uid">
                      <header class="mb-3 flex flex-wrap items-center gap-1.5">
                        <span :id="'gi-' + r.uid" class="badge badge-muted tabular-nums" x-text="tf('aig.itemN', { n: i + 1 })"></span>
                        <template x-if="r.kind === 'question'">
                          <span class="contents">
                            <span class="badge badge-primary" x-text="t('aig.qType.' + r.type)"></span>
                            <span class="badge badge-info" x-text="t('aig.bloom.' + r.bloom)"></span>
                            <span class="badge" :class="{ easy: 'badge-success', medium: 'badge-accent', hard: 'badge-danger' }[r.difficulty]" x-text="t('aig.diff.' + r.difficulty)"></span>
                            <span class="badge badge-neutral"><i class="fa-solid fa-star text-[9px]" aria-hidden="true"></i> <span x-text="tf('aig.cardMarks', { n: r.marks })"></span></span>
                          </span>
                        </template>
                        <template x-if="r.kind === 'concept'">
                          <bdi class="badge badge-neutral font-mono" dir="ltr" x-text="r.code"></bdi>
                        </template>
                        <span x-show="r.saved" class="badge badge-success ms-auto"><i class="fa-solid fa-hourglass-half text-[10px]" aria-hidden="true"></i> <span x-text="t('aig.sentToReview')"></span></span>
                        <span x-show="r.added" class="badge badge-info"><i class="fa-solid fa-clipboard-check text-[10px]" aria-hidden="true"></i> <span x-text="t('aig.addedToQuiz')"></span></span>
                      </header>

                      <!-- ===== عرض ===== -->
                      <div x-show="!r.editing" :class="r.busy && 'opacity-50'">
                        <!-- سؤال -->
                        <template x-if="r.kind === 'question'">
                          <div lang="ar" dir="rtl">
                            <p class="text-sm font-bold leading-6 text-ink" x-text="r.text"></p>
                            <ul x-show="r.type === 'mcq'" class="mt-3 space-y-1.5 text-sm text-muted" role="list">
                              <template x-for="(op, oi) in r.options" :key="oi">
                                <li class="flex items-center gap-2 rounded-lg px-3 py-1.5" :class="oi === r.correct && 'bg-success-50 py-2 dark:bg-success-500/10'">
                                  <i class="fa-regular shrink-0" :class="oi === r.correct ? 'fa-circle-dot text-success-700 dark:text-success-500' : 'fa-circle'" aria-hidden="true"></i>
                                  <span x-text="op"></span>
                                  <span x-show="oi === r.correct" class="ms-auto shrink-0 text-xs font-bold text-success-700 dark:text-success-500" x-text="t('aig.correctAnswer')"></span>
                                </li>
                              </template>
                            </ul>
                            <p x-show="r.type === 'tf' || r.type === 'fill'" class="mt-3 flex items-center gap-2 rounded-lg bg-success-50 px-3 py-2 text-sm text-ink dark:bg-success-500/10">
                              <i class="fa-regular fa-circle-dot shrink-0 text-success-700 dark:text-success-500" aria-hidden="true"></i>
                              <span x-text="r.type === 'tf' ? t(r.answer ? 'aig.trueLabel' : 'aig.falseLabel') : r.answer"></span>
                              <span class="ms-auto shrink-0 text-xs font-bold text-success-700 dark:text-success-500" x-text="t('aig.correctAnswer')"></span>
                            </p>
                            <p x-show="r.explanation" class="mt-3 rounded-lg bg-soft px-3 py-2.5 text-xs leading-5 text-muted">
                              <i class="fa-regular fa-lightbulb me-1 text-brand" aria-hidden="true"></i>
                              <span class="font-bold text-ink" x-text="t(r.type === 'essay' ? 'aig.rubric' : 'aig.cardExplanation') + ': '"></span>
                              <span x-text="r.explanation"></span>
                            </p>
                          </div>
                        </template>
                        <!-- مفهوم (ثنائي اللغة) -->
                        <template x-if="r.kind === 'concept'">
                          <div class="grid gap-3 sm:grid-cols-2">
                            <div lang="ar" dir="rtl">
                              <h3 class="font-extrabold text-ink" x-text="r.nameAr"></h3>

<script>
  /**
   * مكوّن قائمة الاختيار المخصصة (Select-only Combobox — نمط ARIA APG).
   * options: () => [{ value, label }] | get: () => القيمة | set: (v) => تحديث
   * لوحة المفاتيح: ↑↓ Home End Enter Space Esc Tab + البحث بالكتابة (type-ahead).
   * Esc يوقف الانتشار حتى لا يُغلق اللوحة الجانبية/النافذة الأم (C5).
   */
  function selectDropdown({ id, options, get, set, placeholder = '' }) {
    return {
      id, open: false, active: -1, typed: '', typedAt: 0,
      get items() { return options(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { const sel = this.selectedItem; return sel ? sel.label : (typeof placeholder === 'function' ? placeholder() : placeholder); },  // placeholder تفاعلي مع اللغة
      optId(item) { return this.id + '-opt-' + (item.value === '' ? 'none' : item.value); },
      openList() {
        if (!this.items.length) return;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item) { set(item.value); this.closeList(); this.$refs.btn?.focus(); },
      setActive(i) { this.active = Math.min(Math.max(i, 0), this.items.length - 1); this.scrollActiveIntoView(); },
      move(step) { if (!this.open) { this.openList(); return; } this.setActive(this.active + step); },
      onKey(e) {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); if (e.altKey && this.open && k === 'ArrowUp') { this.choose(this.items[this.active]); return; } this.move(k === 'ArrowDown' ? 1 : -1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.setActive(0); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.setActive(this.items.length - 1); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); (this.open && this.active > -1) ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape') { if (this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); } }
        else if (k === 'Tab') { if (this.open) this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          const now = Date.now();
          this.typed = (now - this.typedAt > 600 ? '' : this.typed) + k.toLowerCase();
          this.typedAt = now;
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this.typed));
          if (i > -1) { if (!this.open) this.openList(); this.setActive(i); }
        }
      },
      scrollActiveIntoView() { this.$nextTick(() => this.$refs.list?.children[this.active + 1]?.scrollIntoView({ block: 'nearest' })); },
      isSelected(item) { const sel = this.selectedItem; return !!sel && sel.value === item.value; },
    };
  }

  /**
   * حالة واجهة مولّد المحتوى والأسئلة العام.
   * — البيانات الأكاديمية من window.FIROB_MOCK (مشتركة مع المفاهيم/العناصر التعليمية).
   * — النتائج تُبنى من المعطيات فعليًا (النوع، العدد، الصعوبة، بلوم، طول الملخص) عبر مولّد تجريبي.
   * — في Laravel: generate() ⇢ $wire.generate() يُنشئ AiGenerationRun ويُرسل Job إلى طابور "ai"،
   *   والحالة تُتابَع عبر wire:poll أو بثّ Echo؛ الحفظ يُنشئ سجلات source=ai بحالة review_status=pending.
   */
  function aiGenerator() {
    const desktopMQ = window.matchMedia('(min-width: 1024px)');
    const M = window.FIROB_MOCK;

    /* ---------- مولّد تجريبي (يُحذف مع الانتقال إلى مزوّد AI حقيقي) ---------- */
    const QBANK = {
      'math-g7': {
        mcq: [
          { text: 'ما نتيجة ضرب (-4) × (-3)؟', options: ['12', '-12', '7', '-7'], correct: 0, explanation: 'حاصل ضرب عددين سالبين موجب دائمًا؛ لذلك (-4) × (-3) = 12.' },
          { text: 'ما ناتج (-15) ÷ 5؟', options: ['3', '-3', '-20', '-10'], correct: 1, explanation: 'قسمة عدد سالب على عدد موجب تعطي ناتجًا سالبًا.' },
          { text: 'أيّ الأعداد التالية هو الأصغر؟', options: ['-2', '0', '-9', '4'], correct: 2, explanation: 'كلما ابتعد العدد السالب عن الصفر صغرت قيمته.' },
        ],
        tf: [

      submitted: false,

      /* حالة مستقلة لكل وضع: تبديل الوضع لا يفقد النتائج */
      state: { questions: emptyRun(), concepts: emptyRun(), summaries: emptyRun() },
      get cur() { return this.state[this.generationMode]; },
      get running() { return Object.values(this.state).some(s => s.status === 'running'); },
      stage: 0, liveMsg: '', _ctrl: null,

      /* ---------- البيانات الأكاديمية المتسلسلة ---------- */
      label(o) { return o ? o[this.locale] : ''; },
      course(id) { return M.courses.find(c => c.id === id); },
      unit(id) { return M.units.find(u => u.id === id); },
      lesson(id) { return M.lessons.find(l => l.id === id); },
      get courseOpts() { return M.courses.map(c => ({ value: c.id, label: c[this.locale] })); },
      get unitOpts() { return M.units.filter(u => u.courseId === this.aiForm.courseId).map(u => ({ value: u.id, label: u[this.locale] })); },
      get lessonOpts() { return M.lessons.filter(l => l.unitId === this.aiForm.unitId).map(l => ({ value: l.id, label: l[this.locale] })); },
      get gradeLabel() { const c = this.course(this.aiForm.courseId); return c ? c[this.locale === 'ar' ? 'gradeAr' : 'gradeEn'] : '—'; },
      get reqUnit() { return this.structure.units.enabled && this.structure.units.required; },
      get reqLesson() { return this.structure.lessons.enabled && this.structure.lessons.required; },
      unitPh() { return !this.aiForm.courseId ? this.t('aig.pickCourseFirst') : this.t(this.reqUnit ? 'aig.unitPh' : 'aig.optionalPh'); },
      lessonPh() { return !this.aiForm.unitId ? this.t('aig.pickUnitFirst') : this.t(this.reqLesson ? 'aig.lessonPh' : 'aig.optionalPh'); },
      setCourse(v) { if (v === this.aiForm.courseId) return; this.aiForm.courseId = v; this.aiForm.unitId = ''; this.aiForm.lessonId = ''; },
      setUnit(v) { if (v === this.aiForm.unitId) return; this.aiForm.unitId = v; this.aiForm.lessonId = ''; },
      bloomOpts() { return ['mixed', ...BLOOMS].map(b => ({ value: b, label: this.t('aig.bloom.' + b) })); },

      get missing() {
        const m = [];
        if (!this.aiForm.courseId) m.push('course');
        if (this.reqUnit && !this.aiForm.unitId) m.push('unit');
        if (this.reqLesson && !this.aiForm.lessonId) m.push('lesson');
        return m;
      },
      invalid(field) { return this.submitted && this.missing.includes(field); },

      /* ---------- التكلفة التقديرية ---------- */
      get estimate() {
        const f = this.aiForm;
        const base = {
          questions: f.count * (f.qtype === 'essay' ? 220 : 160),
          concepts: f.conceptCount * 220,
          summaries: { short: 350, medium: 650, long: 1100 }[f.summaryLength],
        }[this.generationMode];
        return 120 + base + Math.ceil(f.prompt.length / 3) + (this.attached ? 900 : 0);
      },
      get overQuota() { return this.estimate > this.quotaRemaining; },
      get canGenerate() { return !this.running && !this.missing.length && !this.overQuota; },
      get skeletonCount() { return Math.min(3, this.generationMode === 'questions' ? this.aiForm.count : this.generationMode === 'concepts' ? this.aiForm.conceptCount : 1); },
      get genHint() {
        if (this.running) return this.t('aig.runningHint');
        if (this.missing.length) return this.tf('aig.missingHint', { fields: this.missing.map(k => this.t('aig.field.' + k)).join(this.locale === 'ar' ? '، ' : ', ') });
        if (this.overQuota) return this.t('aig.overQuotaHint');
        return this.t('aig.readyHint');
      },

      /* ---------- الملف المرجعي (Livewire: WithFileUploads + rules mimes:pdf,docx,pptx,txt|max:10240) ---------- */
      onFile(e) {
        const f = e.target.files?.[0];
        e.target.value = '';
        if (!f) return;
        const ext = f.name.split('.').pop().toLowerCase();
        if (!['pdf', 'docx', 'pptx', 'txt'].includes(ext)) { this.fileError = this.t('aig.fileErrType'); return; }
        if (f.size > this.FILE_MAX) { this.fileError = this.t('aig.fileErrSize'); return; }
        this.fileError = '';
        this.attached = { name: f.name, size: f.size };
        this.toastSuccess(this.t('aig.toastFile'));
      },
      removeFile() { this.attached = null; this.fileError = ''; this.$nextTick(() => this.$refs.attachBtn?.focus()); },

      /* ---------- التوليد ---------- */
      unsaved(mode) { return this.state[mode].items.filter(r => !r.saved).length; },
      get unsavedCount() { return this.unsaved(this.generationMode); },
      get savedCount() { return this.cur.items.filter(r => r.saved).length; },

      async generate() {
        if (this.running) return;
        this.submitted = true;
        if (this.missing.length) {
          this.liveMsg = this.genHint;
          document.getElementById('ai-' + this.missing[0])?.focus();
          return;
        }
        const mode = this.generationMode, run = this.state[mode];
        if (this.overQuota) { run.status = 'error'; run.error = 'quota'; this.liveMsg = this.t('aig.err.quota'); return; }
        if (this.unsaved(mode) && !(await this.confirmReplace(this.unsaved(mode)))) return;

        const ctx = { mode, ...clone(this.aiForm), file: this.attached?.name || null };
        const cost = this.estimate;
        const prev = run.items;
        run.status = 'running'; run.error = null; this.stage = 0;
        this.liveMsg = this.t('aig.startedMsg');
        this._ctrl = new AbortController();
        try {
          for (let s = 0; s < 3; s++) { this.stage = s; await sleep(480, this._ctrl.signal); }
          if (/#fail/i.test(ctx.prompt)) throw Object.assign(new Error('provider'), { code: 'provider' });   // لمعاينة حالة الخطأ: اكتب ‎#fail‎ في السياق
          run.items = this.build(ctx);
          run.ctx = ctx;
          run.status = 'idle';
          this.quota.used += Math.round(cost * 0.92);
          this.logs.unshift({ id: Date.now(), mode, courseId: ctx.courseId, unitId: ctx.unitId, lessonId: ctx.lessonId, at: new Date(), user: null, items: run.items.length, tokens: Math.round(cost * 0.92), status: 'done' });
          this.liveMsg = this.tf('aig.doneMsg', { items: this.pluralize('items', run.items.length) });
          this.$nextTick(() => {
            const h = this.$refs.resultsHead;
            if (!h) return;
            h.focus({ preventScroll: true });
            if (this.mobile) h.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
          });
        } catch (e) {
          if (e.name === 'AbortError') {
            run.status = 'idle'; run.items = prev;
            this.logs.unshift({ id: Date.now(), mode, courseId: ctx.courseId, unitId: ctx.unitId, lessonId: ctx.lessonId, at: new Date(), user: null, items: 0, tokens: 0, status: 'cancelled' });
            this.liveMsg = this.t('aig.cancelledMsg');
          } else {
            run.status = 'error'; run.error = e.code || 'provider'; run.items = prev;
            this.liveMsg = this.t('aig.err.' + run.error);
          }
        } finally { this._ctrl = null; }
      },
      cancel() { this._ctrl?.abort(); },
      async confirmReplace(n) {
        const text = this.tf('aig.confirmReplaceText', { items: this.pluralize('items', n) });
        if (!window.Swal) return window.confirm(text);
        const r = await Swal.fire({
          icon: 'warning', title: this.t('aig.confirmReplaceTitle'), text,
          showCancelButton: true, confirmButtonText: this.t('aig.confirmReplace'), cancelButtonText: this.t('aig.keep'),
          reverseButtons: this.locale === 'ar', focusCancel: true,
          customClass: { popup: 'firob-swal', confirmButton: 'btn btn-accent', cancelButton: 'btn btn-outline' }, buttonsStyling: false,
        });
        return r.isConfirmed;
      },

      /* يبني عناصر تعكس المعطيات (النوع/العدد/الصعوبة/بلوم/الطول) */
      build(ctx, only = null, avoid = null) {
        const cid = ctx.courseId;
        const seed = Math.floor(Math.random() * 3);
        if (ctx.mode === 'questions') {
          const pool = QBANK[cid][ctx.qtype];
          const n = only !== null ? 1 : ctx.count;
          return Array.from({ length: n }, (_, i) => {
            let src = pool[(seed + i) % pool.length];
            if (avoid && src.text === avoid) src = pool[(pool.indexOf(src) + 1) % pool.length];
            const bloom = ctx.bloom === 'mixed' ? BLOOMS[(i + (only ?? 0)) % BLOOMS.length] : ctx.bloom;
            const difficulty = ctx.difficulty === 'mixed' ? DIFFS[(i + (only ?? 0)) % 3] : ctx.difficulty;
            return { uid: uid(), kind: 'question', type: ctx.qtype, bloom, difficulty,
                     marks: ctx.qtype === 'essay' ? 5 : { easy: 1, medium: 2, hard: 3 }[difficulty],
                     ...clone(src), editing: false, draft: null, errors: {}, saved: false, added: false, busy: false };
          });
        }
        if (ctx.mode === 'concepts') {
          const pool = CBANK[cid];
          const max = Math.max(...M.concepts.map(c => +c.code.split('-').pop()));
          const n = only !== null ? 1 : ctx.conceptCount;
          return Array.from({ length: n }, (_, i) => {
            const k = (seed + i) % pool.length, round = Math.floor((seed + i) / pool.length);
            let src = clone(pool[k]);
            if (avoid && src.nameAr === avoid) src = clone(pool[(k + 1) % pool.length]);
            if (round) { src.nameAr += ' (' + (round + 1) + ')'; src.nameEn += ' (' + (round + 1) + ')'; }
            const code = 'CPT-' + CODE_PREFIX[cid] + '-' + String(max + 1 + (only ?? i)).padStart(3, '0');
            return { uid: uid(), kind: 'concept', code, ...src, editing: false, draft: null, errors: {}, saved: false, busy: false };
          });
        }
        const pts = SBANK[cid];
        const len = { short: 3, medium: 5, long: 8 }[ctx.summaryLength];
        const place = this.lesson(ctx.lessonId)?.ar || this.unit(ctx.unitId)?.ar || this.course(cid).ar;
        return [{ uid: uid(), kind: 'summary', title: 'ملخص: ' + place, points: pts.slice(0, len),
                  editing: false, draft: null, errors: {}, saved: false, busy: false }];
      },

      contextLine(ctx) {
        if (!ctx) return '';
        const path = [this.course(ctx.courseId), this.unit(ctx.unitId), this.lesson(ctx.lessonId)].filter(Boolean).map(o => this.label(o));
        const p = { questions: [this.t('aig.qType.' + ctx.qtype), this.t('aig.bloom.' + ctx.bloom), this.t('aig.diff.' + ctx.difficulty)],
                    concepts: [], summaries: [this.t('aig.fieldSummaryLength') + ': ' + this.t('aig.summary.' + ctx.summaryLength)] }[ctx.mode];
        return [path.join(' › '), ...p].join(' · ');
      },

      /* ---------- إجراءات العنصر ---------- */
      card(r) { return this.$root.querySelector(`[data-uid="${r.uid}"]`); },
      startEdit(r) {
        r.draft = clone(r);
        if (r.kind === 'summary') r.draft.pointsText = r.points.join('\n');
        r.errors = {}; r.editing = true;
        this.$nextTick(() => this.card(r)?.querySelector('textarea, input[type=text]')?.focus());
      },
      cancelEdit(r, e) {
        e?.preventDefault?.();
        r.editing = false; r.errors = {}; r.draft = null;
        this.$nextTick(() => this.card(r)?.querySelector('[data-act=edit]')?.focus());
      },
      validate(r) {
        const d = r.draft, v = (k) => this.t('aig.v.' + k), e = {};
        if (r.kind === 'question') {
          if (!d.text.trim()) e.text = v('required');
          if (d.type === 'mcq') {
            const ops = d.options.map(o => o.trim());
            if (ops.some(o => !o)) e.options = v('optionsEmpty');
            else if (new Set(ops).size !== ops.length) e.options = v('optionsDup');
          }
          if (d.type === 'fill' && !String(d.answer).trim()) e.text = e.text || v('required');
        } else if (r.kind === 'concept') {
          if (!d.nameAr.trim()) e.nameAr = v('required'); else if (!AR.test(d.nameAr)) e.nameAr = v('needArabic');
          if (!d.nameEn.trim()) e.nameEn = v('required'); else if (AR.test(d.nameEn) || !LATIN.test(d.nameEn)) e.nameEn = v('noArabic');
        } else {
          if (!d.title.trim()) e.title = v('required');
        }
        return e;
      },
      saveEdit(r) {
        r.errors = this.validate(r);
        if (Object.keys(r.errors).length) {
          this.$nextTick(() => this.card(r)?.querySelector('[aria-invalid="true"]')?.focus());
          return;
        }
        const d = r.draft;
        if (r.kind === 'question') Object.assign(r, { text: d.text.trim(), options: d.options?.map(o => o.trim()), correct: d.correct, answer: d.answer, explanation: d.explanation });
        else if (r.kind === 'concept') Object.assign(r, { nameAr: d.nameAr.trim(), nameEn: d.nameEn.trim(), descAr: d.descAr, descEn: d.descEn });
        else Object.assign(r, { title: d.title.trim(), points: d.pointsText.split('\n').map(s => s.trim()).filter(Boolean) });
        this.toastSuccess(this.t('aig.toastEditSaved'));
        this.cancelEdit(r);
      },
      saveItem(r) {
        if (r.saved || r.editing) return;
        r.saved = true;
        this.toastSuccess(this.t('aig.toastSaved.' + this.generationMode));
      },
      addToQuiz(r) { r.added = true; this.toastSuccess(this.t('aig.toastAddedQuiz')); },
      async regenerate(r) {
        if (r.busy || r.saved) return;
        r.busy = true;
        const ctx = this.cur.ctx, idx = this.cur.items.indexOf(r);
        await sleep(900);
        const [fresh] = this.build(ctx, idx, r.text || r.nameAr || r.title);
        const { uid: _keep, ...rest } = fresh;
        Object.assign(r, rest, { busy: false });
        this.quota.used += 180;
        this.liveMsg = this.t('aig.toastRegenerated');
      },
      discard(r) {
        const items = this.cur.items, i = items.indexOf(r);
        items.splice(i, 1);
        this.liveMsg = this.t('aig.toastDiscarded');
        this.$nextTick(() => {
          const next = items[i] || items[i - 1];
          (next ? this.card(next)?.querySelector('[data-act=save]') : this.$refs.resultsHead)?.focus();
        });
        if (!window.Swal) return;
        Swal.fire({
          toast: true, position: 'top-end', icon: 'info', title: this.t('aig.toastDiscarded'), timer: 5000, timerProgressBar: true,
          showConfirmButton: true, confirmButtonText: this.t('aig.undo'), customClass: { popup: 'firob-swal firob-toast' },
        }).then(res => { if (res.isConfirmed) { items.splice(i, 0, r); this.liveMsg = this.t('aig.undo'); } });
      },
      saveAll() {
        const todo = this.cur.items.filter(r => !r.saved && !r.editing);
        const skipped = this.cur.items.some(r => !r.saved && r.editing);
        todo.forEach(r => { r.saved = true; });
        if (todo.length) this.toastSuccess(this.tf('aig.toastSavedAll', { items: this.pluralize('items', todo.length) }) + (skipped ? ' — ' + this.t('aig.toastSkippedEditing') : ''));
      },
      exportAs(kind) { this.toastSuccess(this.tf('aig.toastExport.' + kind, { items: this.pluralize('items', this.cur.items.length) })); },

      /* ---------- سجل التوليد (ai_usage_logs) ---------- */
      logs: [
        { id: 1, mode: 'questions', courseId: 'math-g7', unitId: 'u101', lessonId: 'l1011', at: daysAgo(0, 10, 24), user: 'سارة أحمد المصري', items: 8, tokens: 1280, status: 'done' },
        { id: 2, mode: 'summaries', courseId: 'sci-g8', unitId: 'u201', lessonId: null, at: daysAgo(1, 16, 11), user: 'محمد خالد يوسف', items: 1, tokens: 640, status: 'done' },
        { id: 3, mode: 'concepts', courseId: 'sci-g8', unitId: 'u202', lessonId: 'l2022', at: daysAgo(1, 11, 48), user: 'ليان عمر الشريف', items: 4, tokens: 910, status: 'done' },
        { id: 4, mode: 'questions', courseId: 'math-g7', unitId: 'u101', lessonId: 'l1012', at: daysAgo(17, 14, 5), user: 'يوسف إبراهيم النجار', items: 12, tokens: 2140, status: 'done' },
        { id: 5, mode: 'questions', courseId: 'sci-g8', unitId: 'u201', lessonId: 'l2012', at: daysAgo(19, 9, 15), user: 'نور حسن عودة', items: 6, tokens: 980, status: 'done' },
      ],
      logTitle(l) {
        const place = this.lesson(l.lessonId) || this.unit(l.unitId) || this.course(l.courseId);
        return this.t('aig.logVerb.' + l.mode) + ' — ' + this.label(place);
      },
      logsOpen: false,
      openLogs() { this.logsOpen = true; },
      closeLogs() { this.logsOpen = false; },

      /* ---------- SweetAlert2 ---------- */
      toastSuccess(msg) {
        this.liveMsg = msg;
        if (!window.Swal) return;
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: msg, showConfirmButton: false, timer: 3000, customClass: { popup: 'firob-swal firob-toast' } });
      },

      /* ---------- عامة ---------- */
      /* ---------- قادم من قائمة الاختبارات (quizzes.html → ?mode=…&course=…&unit=…&lesson=…&count=…) ---------- */
      handoff: null,
      readHandoff() {
        const p = new URLSearchParams(window.location.search);
        const mode = p.get('mode');
        if (mode && this.state[mode]) this.generationMode = mode;
        const c = p.get('course'), u = p.get('unit'), l = p.get('lesson');
        if (M.courses.some(x => x.id === c)) {
          this.setCourse(c);
          if (M.units.some(x => x.id === u && x.courseId === c)) {
            this.setUnit(u);
            if (M.lessons.some(x => x.id === l && x.unitId === u)) this.aiForm.lessonId = l;
          }
        }
        const n = parseInt(p.get('count'), 10);
        if (n) this.aiForm.count = Math.min(20, Math.max(3, n));
        const d = p.get('difficulty');
        if (['easy', 'medium', 'hard', 'mixed'].includes(d)) this.aiForm.difficulty = d;
        if (p.get('from') === 'quizzes') {
          const qt = p.get('quizType');
          this.handoff = { quizType: ['formative', 'summative', 'diagnostic'].includes(qt) ? qt : null };
        }
      },

      init() {
        this.readHandoff();
        document.title = this.t('docTitle');
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        window.addEventListener('beforeunload', (e) => {
          if (this.running || Object.keys(this.state).some(k => this.unsaved(k))) { e.preventDefault(); e.returnValue = ''; }
        });
      },
      onGlobalKey(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const g = this.$refs.globalSearch;
          (g && g.offsetParent !== null ? g : document.getElementById('ai-prompt'))?.focus();
        }
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      // Esc العام: القوائم فقط — اللوحة الجانبية وبطاقات التعديل تعالج Esc بنفسها
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },
    };
  }
</script>
</body>
</html>
