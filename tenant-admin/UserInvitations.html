      /* ---------- الإجراءات المفردة ---------- */
      ACTIONS: { pending: ['resend', 'copyLink', 'extend', 'revoke'], expired: ['resend'], revoked: ['reinvite'], accepted: ['viewUser'] },
      has(i, a) { return (this.ACTIONS[i.status] || []).includes(a); },
      canResend(i) { return this.tick - i.lastSentAt >= RESEND_COOLDOWN; },
      cooldownLeft(i) { return Math.max(1, Math.ceil((RESEND_COOLDOWN - (this.tick - i.lastSentAt)) / MIN)); },
      /* إعادة إرسال: يحدّث وقت الإرسال، ويجدّد الصلاحية للمنتهية */
      renew(i, validity) {
        const t = Date.now();
        i.lastSentAt = t; i.sentAt = t; this.tick = t;
        if (validity) i.expiresAt = t + validity;
        if (i.status === 'expired') i.status = 'pending';
      },
      async copy(text, okKey, warnKey) {
        let ok = false;
        try { await navigator.clipboard.writeText(text); ok = true; }
        catch (e) {
          try {
            const ta = document.createElement('textarea');
            ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
            document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
          } catch (_) {}
        }
        if (ok) this.toast(warnKey ? 'warning' : 'success', this.t(warnKey || okKey));
        else this.toast('error', this.t('inv.copyFailed'));
      },
      menuAction(a) {
        const i = this.kebabInv;
        this.closeMenu();
        if (a === 'resend') {
          if (!this.canResend(i)) { this.toast('info', this.t('inv.cooldownToast')); return this.refocusTrigger(); }
          this.renew(i, i.status === 'expired' ? 7 * DAY : null);
          this.toast('success', this.tf('inv.toastResend', { email: i.email }));
          this.refocusTrigger();
        }
        if (a === 'copyLink') {
          /* في الإنتاج: رابط موقّع من الخادم (URL::temporarySignedRoute) — لا يُبنى في الواجهة */
          this.copy(location.origin + '/invitations/accept?token=demo-' + i.id, null, 'inv.linkWarn');
          this.refocusTrigger();
        }
        if (a === 'extend') {
          i.expiresAt = Math.max(i.expiresAt, Date.now()) + 7 * DAY;
          this.toast('success', this.tf('inv.toastExtend', { email: i.email }));
          this.refocusTrigger();
        }
        if (a === 'revoke')   this.openModal('revoke', i);
        if (a === 'reinvite') this.openModal('reinvite', i);
      },

      /* ---------- قائمة الإجراءات (Kebab) ---------- */
      openMenuId: null, kebabInv: null, menuPos: { top: -999, left: -999 }, _menuBtn: null,
      toggleMenu(inv, evt, viaKey = false) {
        if (this.openMenuId === inv.id && !viaKey) { this.closeMenu(true); return; }
        this.tick = Date.now();
        this._menuBtn = evt.currentTarget;
        this.kebabInv = inv;
        this.menuPos = { top: -999, left: -999 };
        this.openMenuId = inv.id;
        this.$nextTick(() => requestAnimationFrame(() => {
          const r = this._menuBtn.getBoundingClientRect(), m = this.$refs.kebab, pad = 8, gap = 6;
          const w = m.offsetWidth, h = m.offsetHeight, rtl = document.documentElement.dir === 'rtl';
          let left = rtl ? r.left : r.right - w;
          left = Math.min(Math.max(pad, left), window.innerWidth - w - pad);
          let top = r.bottom + gap;
          if (top + h > window.innerHeight - pad) top = Math.max(pad, r.top - h - gap);
          this.menuPos = { top, left };
          this.menuMove(0, true);
        }));
      },
      menuItems() { return [...(this.$refs.kebab?.querySelectorAll('[role=menuitem]:not([disabled])') || [])]; },
      menuMove(step, abs = false) {
        const items = this.menuItems(); if (!items.length) return;
        const i = items.indexOf(document.activeElement);
        const n = abs ? (step < 0 ? items.length - 1 : 0) : (i + step + items.length) % items.length;
        items[n].focus({ preventScroll: true });
      },
      closeMenu(returnFocus = false) {
        if (this.openMenuId === null) return;
        this.openMenuId = null;
        if (returnFocus) this.$nextTick(() => this._menuBtn?.focus());
      },
      refocusTrigger() {
        setTimeout(() => {
          const b = this._menuBtn;
          if (b && b.isConnected && b.offsetParent !== null) b.focus();
          else document.getElementById('inv-table-title')?.focus();
        }, 60);
      },

      /* ---------- النوافذ ---------- */
      modal: null, modalInv: null, busy: false,
      get modalText() {
        if (this.modal === 'bulkRevoke') return this.t('inv.bulkRevokeText');
        return this.modalInv ? this.tf('inv.' + this.modal + 'Text', { email: this.modalInv.email }) : '';
      },
      openModal(type, inv = null) {
        if (type === 'bulkRevoke') this._menuBtn = null;
        this.modalInv = inv; this.modal = type;
      },
      closeModal() {
        if (this.busy) return;
        this.modal = null; this.modalInv = null;
        this.refocusTrigger();
      },
      async modalConfirm() {
        if (this.busy) return;
        this.busy = true;
        await new Promise(r => setTimeout(r, 450));
        const type = this.modal, i = this.modalInv;
        if (type === 'revoke') {
          i.status = 'revoked'; i.revokedAt = Date.now();
          this.toast('success', this.tf('inv.toastRevoke', { email: i.email }));
        } else if (type === 'bulkRevoke') {
          const list = this.revocable, t = Date.now();
          list.forEach(x => { x.status = 'revoked'; x.revokedAt = t; });
          this.toast('success', this.tf('inv.toastBulkRevoke', { n: this.fmt(list.length) }));
          this.selectedIds = [];
          if (this.page > this.pages) this.page = this.pages;
        } else if (type === 'reinvite') {
          const t = Date.now();
          Object.assign(i, { status: 'pending', sentAt: t, lastSentAt: t, expiresAt: t + 7 * DAY, invitedBy: this.me.name });
          delete i.revokedAt;
          this.tick = t;
          this.toast('success', this.tf('inv.toastReinvite', { email: i.email }));
        }
        this.busy = false;
        this.modal = null; this.modalInv = null;
        this.refocusTrigger();
      },

      panelOpen: false, formSubmitted: false, touchedEmails: false, discardAsk: false, _snapshot: '', _panelTrigger: null,
      MAX_BATCH: 50, EXPIRIES: ['24h', '48h', '7d'], EXPIRY_MS: { '24h': DAY, '48h': 2 * DAY, '7d': 7 * DAY },
      form: { emails: '', role: 'editor', expiry: '7d', message: '' },
      /* تحليل الإيميلات: فاصلة/فاصلة منقوطة/مسافة/سطر جديد + تحقق مقيّد + كشف المكرر والأعضاء والمعلّق */
      get parsedEmails() {
        const seen = new Set(); let okCount = 0;
        return this.form.emails.split(/[\s,;،]+/).map(s => s.trim().replace(/^<|>$/g, '').toLowerCase()).filter(Boolean).map(email => {
          let state = 'ok';
          if (!EMAIL_RE.test(email)) state = 'invalid';
          else if (seen.has(email)) state = 'dup';
          else if (this.existingEmails.includes(email)) state = 'member';
          else if (this.invites.some(i => i.email === email && i.status === 'pending')) state = 'pending';
          else if (okCount >= this.MAX_BATCH) state = 'over';
          seen.add(email);
          if (state === 'ok') okCount++;
          return { email, state };
        });
      },
      get sendable() { return this.parsedEmails.filter(p => p.state === 'ok'); },
      get emailSummary() {
        const ok = this.sendable.length;
        return this.tf('inv.summary', { ok: this.fmt(ok), skip: this.fmt(this.parsedEmails.length - ok) });
      },
      chipClass(s) { return { ok: 'badge-success', invalid: 'badge-danger', dup: 'badge-muted', member: 'badge-muted', pending: 'badge-pending', over: 'badge-muted' }[s]; },
      chipIcon(s)  { return { ok: 'fa-check', invalid: 'fa-xmark', dup: 'fa-clone', member: 'fa-user-check', pending: 'fa-hourglass-half', over: 'fa-ban' }[s]; },
      removeEmail(email) {
        const parts = this.form.emails.split(/[\s,;،]+/).filter(p => p.trim() && p.trim().toLowerCase() !== email);
        this.form.emails = parts.join(', ');
        this.$nextTick(() => document.getElementById('if-emails')?.focus());
      },
      keepValidOnly() {
        this.form.emails = this.sendable.map(p => p.email).join(', ');
        this.$nextTick(() => document.getElementById('if-emails')?.focus());
      },
      get dirty() { return JSON.stringify(this.form) !== this._snapshot; },
      openInvite(trigger) {
        this._panelTrigger = trigger || this.$refs.addBtn;
        this.form = { emails: '', role: 'editor', expiry: '7d', message: '' };
        this.formSubmitted = false; this.touchedEmails = false; this.discardAsk = false;
        this._snapshot = JSON.stringify(this.form);
        this.panelOpen = true;
        setTimeout(() => document.getElementById('if-emails')?.focus(), 80);
      },
      closePanel() {
        if (this.busy) return;
        if (this.dirty && !this.discardAsk) { this.discardAsk = true; this.$nextTick(() => this.$refs.keepEditing?.focus()); return; }
        this.forceClosePanel();
      },
      forceClosePanel() {
        this.panelOpen = false; this.discardAsk = false;
        const t = this._panelTrigger;
        setTimeout(() => (t && t.isConnected ? t : this.$refs.addBtn)?.focus(), 320);
      },
      async submitInvite() {
        if (this.busy) return;
        this.formSubmitted = true;
        const list = this.sendable;
        if (!list.length) { this.$nextTick(() => document.getElementById('if-emails')?.focus()); return; }
        this.busy = true;
        /* Livewire: $wire.sendInvitations({ emails, role, expiry, message }) — الخادم يعيد التحقق ويطبّق Rate Limiting */
        await new Promise(r => setTimeout(r, 700));
        const t = Date.now(), exp = this.EXPIRY_MS[this.form.expiry];
        list.forEach(p => this.invites.push({
          id: this._nextId++, email: p.email, role: this.form.role, status: 'pending', invitedBy: this.me.name,
          sentAt: t, lastSentAt: t, expiresAt: t + exp,
        }));
        this.tick = t;
        this.busy = false;
        this.resetFilters(); this.page = 1;
        this.toast('success', list.length > 1 ? this.tf('inv.toastSentN', { n: this.fmt(list.length) }) : this.tf('inv.toastSent', { email: list[0].email }));
        this._snapshot = JSON.stringify(this.form);
        this.forceClosePanel();
      },

      /* ---------- Toast ---------- */
      toast(icon, msg) {
        this.announce(msg);
        if (!window.Swal) return;
        Swal.fire({
          toast: true, position: 'top-end', icon, title: msg,
          showConfirmButton: false, timer: icon === 'warning' ? 5000 : 3500, timerProgressBar: true,
          customClass: { popup: 'firob-swal firob-toast' },
          didOpen: (t) => { t.addEventListener('mouseenter', Swal.stopTimer); t.addEventListener('mouseleave', Swal.resumeTimer); },
        });
      },

      /* ---------- البحث العام ---------- */
      focusSearch() {
        if (this.panelOpen || this.modal) return;
        if (mdMQ.matches) { this.$refs.globalSearch?.focus(); this.$refs.globalSearch?.select(); return; }
        this.searchOpen = true;
        this.$nextTick(() => this.$refs.mobileSearch?.focus());
      },
      toggleMobileSearch() {
        this.searchOpen = !this.searchOpen;
        if (this.searchOpen) this.$nextTick(() => this.$refs.mobileSearch?.focus());
      },

      /* ---------- عامة ---------- */
      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        mdMQ.addEventListener('change', (m) => { if (m.matches) this.searchOpen = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        document.title = this.t('inv.title') + ' — FirOb';
        /* تحديث الأوقات النسبية ومهلة إعادة الإرسال كل دقيقة */
        setInterval(() => { this.tick = Date.now(); }, 30000);
        /* أي تغيير في العرض يمسح التحديد (لا إجراء على عناصر غير مرئية) ويعيد للصفحة الأولى */
        this.$watch('search + "|" + roleFilter + "|" + statusFilter + "|" + pageSize', () => {
          this.page = 1; this.closeMenu();
          if (this.selectedIds.length) { this.selectedIds = []; this.announce(this.t('inv.selectionCleared')); }
          clearTimeout(this._annT);
          this._annT = setTimeout(() => this.announce(this.tf('inv.resultsCount', { n: this.fmt(this.filtered.length) })), 500);
        });
        this.$watch('page', () => { if (this.selectedIds.length) { this.selectedIds = []; this.announce(this.t('inv.selectionCleared')); } });
        try {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            let saved = null; try { saved = localStorage.getItem('firob-theme'); } catch (_) {}
            if (!saved) this.applyTheme(e.matches);
          });
        } catch (e) {}
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      closeMobileNav() { this.mobileNav = false; this.$nextTick(() => this.$refs.navToggle?.focus()); },
      applyTheme(isDark) {
        document.body.classList.add('theme-anim');
        this.dark = isDark;
        document.documentElement.classList.toggle('dark', isDark);
        document.getElementById('theme-color')?.setAttribute('content', isDark ? '#09141B' : '#F1EDE7');
        clearTimeout(this._themeT); this._themeT = setTimeout(() => document.body.classList.remove('theme-anim'), 350);
      },
      toggleTheme() {
        this.applyTheme(!this.dark);
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      closeAll() {
        if (this.modal)       { this.closeModal(); return; }
        if (this.panelOpen)   { if (this.discardAsk) { this.discardAsk = false; return; } this.closePanel(); return; }
        if (this.openMenuId !== null) { this.closeMenu(true); return; }
        if (this.notifOpen)   { this.notifOpen = false;   this.$refs.notifBtn?.focus(); return; }
        if (this.profileOpen) { this.profileOpen = false; this.$refs.profileBtn?.focus(); return; }
        if (this.searchOpen)  { this.searchOpen = false; return; }
        if (this.mobileNav)   { this.closeMobileNav(); }
      },
    };
  }
</script>
