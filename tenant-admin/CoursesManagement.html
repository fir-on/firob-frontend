      iconOptions: ['fa-square-root-variable', 'fa-flask', 'fa-book-open', 'fa-language', 'fa-mosque', 'fa-earth-asia', 'fa-palette', 'fa-dumbbell'],
      colorMeta(v) { return this.colorOptions.find(c => c.value === v) || this.colorOptions[0]; },
      title(c, loc = this.locale) { return (loc === 'en' && c.titleEn) || c.titleAr; },
      titleLang(c) { return this.locale === 'en' && c.titleEn ? 'en' : 'ar'; },
      altTitle(c) { const alt = this.title(c, this.altLocale); return alt !== this.title(c) ? alt : ''; },
      // حارس الحذف يُشتق من العدّادات — لا من علم يدوي (C3). في الخادم: withCount + FK RESTRICT.
      hasContent(c) { return (c.units + c.lessons + c.questions) > 0 || this.unitsOf(c).length > 0; },
      contentSummary(c) {
        return [['units', c.units], ['lessons', c.lessons], ['questions', c.questions]]
          .filter(([, n]) => n > 0).map(([k, n]) => this.pluralize(k, n)).join(this.locale === 'ar' ? ' و' : ', ');
      },
      canAddUnits(c) { return c.unitsEnabled && c.status !== 'archived'; },
      get kpis() {
        const cs = this.courses.filter(c => c.status !== 'archived');
        return {
          total: cs.length,
          active: cs.filter(c => c.status === 'active').length,
          noGrade: cs.filter(c => !c.grade).length,
          units: cs.reduce((a, c) => a + c.units, 0),
          lessons: cs.reduce((a, c) => a + c.lessons, 0),
        };
      },

      /* ---------- البحث والفلاتر وتبديل العرض (فلترة فعلية — C7) ---------- */
      searchQuery: '', selectedGrade: 'all', selectedDomain: 'all', selectedStatus: 'all',
      viewMode: 'table',
      get filteredCourses() {
        const q = this.searchQuery.trim().toLowerCase();
        return this.courses.filter(c =>
          (!q || [c.code, c.titleAr, c.titleEn].some(s => (s || '').toLowerCase().includes(q))) &&
          (this.selectedGrade === 'all' || (this.selectedGrade === 'none' ? !c.grade : c.grade === this.selectedGrade)) &&
          (this.selectedDomain === 'all' || c.domain === this.selectedDomain) &&
          (this.selectedStatus === 'all' ? c.status !== 'archived' : c.status === this.selectedStatus));
      },
      get activeFilterCount() {
        return [this.searchQuery.trim() !== '', this.selectedGrade !== 'all', this.selectedDomain !== 'all', this.selectedStatus !== 'all'].filter(Boolean).length;
      },
      get resultsMsg() { return this.activeFilterCount ? this.tf('cm.resultsCount', { courses: this.pluralize('courses', this.filteredCourses.length) }) : ''; },
      resetFilters() { this.searchQuery = ''; this.selectedGrade = 'all'; this.selectedDomain = 'all'; this.selectedStatus = 'all'; },
      setView(v) { this.viewMode = v; try { localStorage.setItem('firob-courses-view', v); } catch (e) {} },

      /* ---------- قائمة الإجراءات السريعة (Kebab) — موضع ثابت + لوحة مفاتيح + إعادة تركيز ---------- */
      openMenuId: null, kebabCourse: null, menuTrigger: null, lastTrigger: null, menuPos: { top: 0, left: 0 },
      lastW: window.innerWidth,
      toggleMenu(course, evt) {
        if (this.openMenuId === course.id) { this.closeMenu(); return; }
        const btn = evt.currentTarget;
        this.menuTrigger = btn;
        const r = btn.getBoundingClientRect();
        const menuW = 256, gap = 6, pad = 8;
        const isRtl = document.documentElement.dir === 'rtl';
        let left = isRtl ? r.left : r.right - menuW;          // محاذاة حافة النهاية مع الزر
        left = Math.min(Math.max(pad, left), window.innerWidth - menuW - pad);
        const place = (h) => (r.bottom + gap + h > window.innerHeight - pad) ? Math.max(pad, r.top - h - gap) : r.bottom + gap;
        this.menuPos = { top: place(320), left };
        this.kebabCourse = course;
        this.openMenuId = course.id;
        this.$nextTick(() => requestAnimationFrame(() => requestAnimationFrame(() => {
          const el = this.$refs.kebab;
          if (!el || this.openMenuId !== course.id) return;
          if (el.offsetHeight) this.menuPos.top = place(el.offsetHeight);
          this.$focus.within(el).first();
        })));
      },
      closeMenu(restore = true) {
        if (this.openMenuId === null) return;
        this.openMenuId = null;
        if (restore && this.menuTrigger) this.menuTrigger.focus();
      },
      onResize() {
        if (window.innerWidth === this.lastW) return;            // تجاهل تغيّر ارتفاع شريط عنوان الجوال
        this.lastW = window.innerWidth;
        this.closeMenu(false);
      },
      // يُحفظ مصدر فتح النافذة لإعادة التركيز إليه عند الإغلاق (بديل x-trap الافتراضي الذي يعيده لعنصر قائمة مخفي)
      rememberTrigger(evt) {
        this.lastTrigger = this.openMenuId !== null ? this.menuTrigger : (evt?.currentTarget || document.activeElement);
        this.closeMenu(false);
      },
      restoreFocus() {
        const el = this.lastTrigger;
        this.lastTrigger = null;
        this.$nextTick(() => {
          if (el && el.isConnected && el.offsetParent !== null) el.focus();
          else document.getElementById('main')?.focus();
        });
      },
      get anyOverlayOpen() { return this.isDrawerOpen || this.isDeleteModalOpen || this.quickAddUnitOpen || this.quickAddLessonOpen; },
      onGlobalKey(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); this.$refs.globalSearch?.focus(); return; }
        if (e.key === '/' && !this.anyOverlayOpen && !e.target.closest('input, textarea, select, [contenteditable], [role="combobox"]')) {
          e.preventDefault(); this.$refs.courseSearch?.focus();
        }
      },

      /* ---------- معاينة الهيكل الشجري (الوحدات والدروس) ---------- */
      expandedTreeId: null,
      toggleTree(course) { this.expandedTreeId = this.expandedTreeId === course.id ? null : course.id; },
      unitsOf(c) { return this.courseUnits[c.id] || []; },
      unitTitle(u) { return (this.locale === 'en' && u.titleEn) || u.titleAr; },
      courseUnits: {
        1: [
          { id: 101, titleAr: 'الوحدة الأولى: الأعداد الصحيحة', titleEn: 'Unit 1: Integers', open: true, lessons: [
            { id: 1011, titleAr: 'جمع الأعداد الصحيحة وطرحها', status: 'published' },
            { id: 1012, titleAr: 'ضرب الأعداد الصحيحة وقسمتها', status: 'published' },
            { id: 1013, titleAr: 'خصائص الأعداد الصحيحة', status: 'draft' },
          ]},
          { id: 102, titleAr: 'الوحدة الثانية: الكسور والنسب', titleEn: 'Unit 2: Fractions & Ratios', open: false, lessons: [
            { id: 1021, titleAr: 'تبسيط الكسور', status: 'published' },
            { id: 1022, titleAr: 'النسبة والتناسب', status: 'published' },
          ]},
        ],
        2: [
          { id: 201, titleAr: 'الوحدة الأولى: الخلية ومكوناتها', open: true, lessons: [
            { id: 2011, titleAr: 'المجهر وأنواعه', status: 'published' },
            { id: 2012, titleAr: 'تركيب الخلية النباتية والحيوانية', status: 'published' },
          ]},
          { id: 202, titleAr: 'الوحدة الثانية: التفاعلات الكيميائية', open: false, lessons: [
            { id: 2021, titleAr: 'أنواع التفاعلات الكيميائية', status: 'published' },
            { id: 2022, titleAr: 'موازنة المعادلات الكيميائية', status: 'draft' },
          ]},
        ],
        3: [
          { id: 301, titleAr: 'الوحدة الأولى: النصوص الأدبية', open: true, lessons: [
            { id: 3011, titleAr: 'تحليل النص الشعري', status: 'published' },
            { id: 3012, titleAr: 'عناصر القصة القصيرة', status: 'published' },
          ]},
        ],
        4: [
          { id: 401, titleAr: 'Unit 1: Grammar Essentials', open: true, lessons: [
            { id: 4011, titleAr: 'Present Simple vs Present Continuous', status: 'published' },
            { id: 4012, titleAr: 'Subject-Verb Agreement', status: 'draft' },
          ]},
        ],
        5: [],
        6: [
          { id: 601, titleAr: 'الوحدة الأولى: الموقع الجغرافي', open: true, lessons: [
            { id: 6011, titleAr: 'الموقع الجغرافي لفلسطين', status: 'published' },
            { id: 6012, titleAr: 'المناخ والتضاريس', status: 'published' },
          ]},
        ],
        7: [],
      },

      /* ---------- إضافة وحدة سريعة — تُضاف فعليًا إلى الشجرة (M1) ---------- */
      quickAddUnitOpen: false, quickAddUnitTarget: null, unitFormSubmitted: false,
      unitForm: { titleAr: '', titleEn: '' },
      openQuickAddUnit(course, trigger) {
        if (!this.canAddUnits(course)) return;
        this.lastTrigger = trigger || document.activeElement;
        this.closeMenu(false);
        this.quickAddUnitTarget = course;
        this.unitFormSubmitted = false;
        this.unitForm = { titleAr: '', titleEn: '' };
        this.quickAddUnitOpen = true;
      },
      closeQuickAddUnit() { if (this.busy || !this.quickAddUnitOpen) return; this.quickAddUnitOpen = false; this.restoreFocus(); },
      async submitQuickAddUnit() {
        this.unitFormSubmitted = true;
        if (!this.unitForm.titleAr) { await this.$nextTick(); this.$refs.unitForm.querySelector('[aria-invalid="true"]')?.focus(); return; }
        this.busy = true;
        await sleep(400);
        const c = this.quickAddUnitTarget;
        (this.courseUnits[c.id] ||= []).push({ id: Date.now(), titleAr: this.unitForm.titleAr, titleEn: this.unitForm.titleEn, open: true, lessons: [] });
        c.units++;
        this.busy = false;
        this.quickAddUnitOpen = false;
        this.expandedTreeId = c.id;                        // عرض النتيجة في مكانها
        this.toastSuccess(this.tf('cm.toastUnitAdded', { name: this.unitForm.titleAr }));
        this.restoreFocus();
      },

      /* ---------- إضافة درس سريع — يُضاف فعليًا إلى الوحدة ---------- */
      quickAddLessonOpen: false, quickAddLessonTarget: null, quickAddLessonUnit: null, lessonFormSubmitted: false,
      lessonForm: { titleAr: '', titleEn: '', published: false },
      openQuickAddLesson(course, unit) {
        this.lastTrigger = document.activeElement;
        this.quickAddLessonTarget = course;
        this.quickAddLessonUnit = unit;
        this.lessonFormSubmitted = false;
        this.lessonForm = { titleAr: '', titleEn: '', published: false };
        this.quickAddLessonOpen = true;
      },
      closeQuickAddLesson() { if (this.busy || !this.quickAddLessonOpen) return; this.quickAddLessonOpen = false; this.restoreFocus(); },
      async submitQuickAddLesson() {
        this.lessonFormSubmitted = true;
        if (!this.lessonForm.titleAr) { await this.$nextTick(); this.$refs.lessonForm.querySelector('[aria-invalid="true"]')?.focus(); return; }
        this.busy = true;
        await sleep(400);
        const c = this.quickAddLessonTarget, u = this.quickAddLessonUnit;
        u.lessons.push({ id: Date.now(), titleAr: this.lessonForm.titleAr, titleEn: this.lessonForm.titleEn, status: this.lessonForm.published ? 'published' : 'draft' });
        u.open = true;
        c.lessons++;
        this.busy = false;
        this.quickAddLessonOpen = false;
        this.toastSuccess(this.tf('cm.toastLessonAdded', { name: this.lessonForm.titleAr }));
        this.restoreFocus();
      },

      /* ---------- اللوحة الجانبية (Slide-over): إضافة / تعديل مقرر ---------- */
      isDrawerOpen: false, editingCourse: null, formSubmitted: false, busy: false,
      form: { code: '', titleAr: '', titleEn: '', grade: '', domain: 'math', description: '', color: 'primary', icon: 'fa-square-root-variable', unitsEnabled: true, published: true },
      get errors() {
        const e = {}, f = this.form;
        if (!f.code) e.code = this.t('cm.codeRequired');
        else if (this.courses.some(c => c.code.toUpperCase() === f.code.toUpperCase() && c.id !== this.editingCourse?.id)) e.code = this.t('cm.codeTaken');
        if (!f.titleAr) e.titleAr = this.t('cm.titleArRequired');
        return e;
      },
      openCreate() {
        this.rememberTrigger();
        this.editingCourse = null;
        this.formSubmitted = false;
        this.form = { code: '', titleAr: '', titleEn: '', grade: '', domain: 'math', description: '', color: 'primary', icon: 'fa-square-root-variable', unitsEnabled: true, published: true };
        this.isDrawerOpen = true;
      },
      // يستقبل كائن المقرر الكامل من مصدر البيانات (يُصلح C2: كانت القائمة تمرّر كائنًا جزئيًا)
      openEdit(course, evt) {
        this.rememberTrigger(evt);
        this.editingCourse = course;
        this.formSubmitted = false;
        this.form = {
          code: course.code, titleAr: course.titleAr, titleEn: course.titleEn || '',
          grade: course.grade || '', domain: course.domain, description: course.description || '',
          color: course.color, icon: course.icon, unitsEnabled: course.unitsEnabled, published: course.status === 'active',
        };
        this.isDrawerOpen = true;
      },
      closeDrawer() { if (this.busy || !this.isDrawerOpen) return; this.isDrawerOpen = false; this.restoreFocus(); },
      async submitCourse() {
        this.formSubmitted = true;
        if (Object.keys(this.errors).length) {
          await this.$nextTick();
          this.$refs.courseForm.querySelector('[aria-invalid="true"]')?.focus();
          return;
        }
        this.busy = true;
        await sleep(500);
        const f = this.form;
        const data = {
          code: f.code.toUpperCase(), titleAr: f.titleAr, titleEn: f.titleEn, grade: f.grade, domain: f.domain,
          description: f.description, color: f.color, icon: f.icon, unitsEnabled: f.unitsEnabled,
        };
        if (this.editingCourse) {
          Object.assign(this.editingCourse, data);
          if (this.editingCourse.status !== 'archived') this.editingCourse.status = f.published ? 'active' : 'draft';
        } else {
          this.courses.unshift({ id: Date.now(), ...data, status: f.published ? 'active' : 'draft', units: 0, lessons: 0, questions: 0, publishedPct: 0 });
        }
        this.busy = false;
        this.toastSuccess(this.t(this.editingCourse ? 'cm.toastSave' : 'cm.toastCreate'));
        this.isDrawerOpen = false;
        this.restoreFocus();
      },

      /* ---------- الحالة: نشر / مسودة / أرشفة / استعادة (M2) ---------- */
      toggleStatus(c) {
        if (c.status === 'archived') return;
        const prev = c.status;
        c.status = prev === 'active' ? 'draft' : 'active';
        this.closeMenu(true);
        this.toastUndo(this.tf(c.status === 'active' ? 'cm.toastPublish' : 'cm.toastUnpublish', { name: this.title(c) }), () => { c.status = prev; });
      },
      restoreCourse(c) {
        c.status = 'draft';
        this.closeMenu(true);
        this.toastUndo(this.tf('cm.toastRestore', { name: this.title(c) }), () => { c.status = 'archived'; });
      },

      /* ---------- النسخ: ينشئ مسودة فعلية بلا محتوى ---------- */
      duplicateCourse(c) {
        let code = c.code + '-COPY', n = 2;
        while (this.courses.some(x => x.code === code)) code = c.code + '-COPY' + n++;
        const copy = { ...c, id: Date.now(), code, titleAr: c.titleAr + I18N.ar.cm.copySuffix, titleEn: c.titleEn ? c.titleEn + I18N.en.cm.copySuffix : '',
                       status: 'draft', units: 0, lessons: 0, questions: 0, publishedPct: 0 };
        this.courses.splice(this.courses.indexOf(c) + 1, 0, copy);
        this.closeMenu(true);
        this.toastUndo(this.tf('cm.toastDuplicate', { name: this.title(c) }), () => { this.courses = this.courses.filter(x => x.id !== copy.id); });
      },

      /* ---------- نافذة الحذف: حارس متكيّف ---------- */
      isDeleteModalOpen: false, deleteTarget: null,
      confirmDelete(course, evt) {
        this.rememberTrigger(evt);
        this.deleteTarget = course;
        this.isDeleteModalOpen = true;
      },
      closeDeleteModal() {
        if (this.busy || !this.isDeleteModalOpen) return;
        this.isDeleteModalOpen = false; this.deleteTarget = null;
        this.restoreFocus();
      },
      async archiveCourse() {
        const c = this.deleteTarget;
        if (!c) return;
        this.busy = true;
        await sleep(400);
        const prev = c.status;
        c.status = 'archived';
        if (this.expandedTreeId === c.id) this.expandedTreeId = null;
        this.busy = false;
        this.isDeleteModalOpen = false; this.deleteTarget = null;
        this.restoreFocus();
        this.toastUndo(this.tf('cm.toastArchive', { name: this.title(c) }), () => { c.status = prev; });
      },
      async deleteConfirmed() {
        const c = this.deleteTarget;
        if (!c || this.hasContent(c)) return;            // حماية مزدوجة (والخادم هو المرجع النهائي)
        this.busy = true;
        await sleep(400);
        this.courses = this.courses.filter(x => x.id !== c.id);
        this.busy = false;
        this.isDeleteModalOpen = false; this.deleteTarget = null;
        this.toastSuccess(this.tf('cm.toastDelete', { name: this.title(c) }));
        this.restoreFocus();                               // العنصر حُذف ← يعود التركيز إلى <main>
      },

      /* ---------- SweetAlert2: تنبيهات سريعة (Toast) ---------- */
      toastBase(extra) {
        if (!window.Swal) return Promise.resolve({});
        return Swal.fire(Object.assign({
          toast: true, position: 'top-end', icon: 'success', showConfirmButton: false, timer: 3000,
          customClass: { popup: 'firob-swal firob-toast' },
          // WCAG 2.2.1: إيقاف المؤقت عند المرور أو التركيز
          didOpen: (el) => {
            el.addEventListener('mouseenter', Swal.stopTimer);
            el.addEventListener('mouseleave', Swal.resumeTimer);
            el.addEventListener('focusin', Swal.stopTimer);
          },
        }, extra));
      },
      toastSuccess(msg) { this.toastBase({ title: msg }); },
      toastUndo(msg, undo) {
        this.toastBase({
          title: msg, timer: 6000, timerProgressBar: true,
          showConfirmButton: true, confirmButtonText: this.t('cm.undo'), buttonsStyling: false,
          customClass: { popup: 'firob-swal firob-toast', confirmButton: 'btn btn-sm btn-outline' },
        }).then(r => { if (r.isConfirmed) { undo(); this.toastSuccess(this.t('cm.undone')); } });
      },

      /* ---------- عامة ---------- */
      init() {
        document.title = this.t('docTitle');
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; this.closeMenu(false); });
        try {
          this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed';
          const v = localStorage.getItem('firob-courses-view'); if (v === 'grid' || v === 'table') this.viewMode = v;
        } catch (e) {}
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      // Esc العام: القوائم فقط — كل نافذة/لوحة تعالج Esc بنفسها وتعيد التركيز
      closeAll() {
        this.notifOpen = false; this.profileOpen = false; this.mobileNav = false;
        this.closeMenu(true);
      },
    };
  }
</script>
</body>
