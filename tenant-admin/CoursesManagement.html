<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<title>إدارة المقررات الدراسية — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ② الخطوط: Tajawal (عربي) + Manrope (إنجليزي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../asset/images/firob-favicon.png">
<link rel="apple-touch-icon" href="../asset/images/firob-favicon.png">

<!-- ③ الأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<!-- ④ Tailwind + التوكنز المعتمدة (Style Guide v1.0) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'), danger: v('danger'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
        info:    { 50:'#EFF6FF', 100:'#DBEAFE', 500:'#3B82F6', 700:'#1D4ED8', 800:'#1E40AF' },
        neutral: { 200:'#E4DED4', 300:'#D6CFC3' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 127 143 166;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      --danger: 185 28 28;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: 2px solid rgb(var(--brand)); outline-offset: 2px; }  /* outline لا يتعارض مع ظلال المكونات ويعمل في forced-colors */
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft; }

    /* ---------- تلميحات أزرار الإجراءات (Action Tooltips) ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg border border-white/10 bg-ink px-2.5 py-1 text-xs font-medium tracking-wide text-card opacity-0 shadow-xl backdrop-blur-md transition-all duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-all duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  {@apply bg-accent-500/20 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink dark:bg-soft-2; }  /* كان 1.16:1 في الوضع الداكن */
    .badge-primary { @apply bg-primary-500/15 text-brand; }
    .badge-warning { @apply bg-warning-500/15 text-warning-700 dark:text-warning-500; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-muted; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition hover:bg-soft focus-visible:bg-soft; }
    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }
    .menu-item:focus-visible { outline-offset: -2px; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-4 py-2.5 text-start text-sm font-medium text-ink transition-colors hover:bg-soft; }
    .combo-option.is-active   { @apply bg-soft; }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }
    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- النافذة المنبثقة / اللوحة الجانبية ---------- */
    .modal-panel { @apply relative flex max-h-[90dvh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }

    /* ---------- SweetAlert2: مواءمة مع نظام التصميم ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-actions { gap: .5rem; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }

    /* ---------- مقياس الحصة / شريط التقدّم (QuotaMeter) ---------- */
    .quota-track { @apply h-1.5 w-full overflow-hidden rounded-full bg-line-strong/30; }
    .quota-fill { @apply h-full rounded-full transition-all duration-500; }

    /* ---------- مفتاح التبديل (Settings Switch) ---------- */
    .switch-track { @apply relative inline-flex h-6 w-11 shrink-0 cursor-pointer items-center rounded-full border border-line-strong bg-line-strong/25 transition-colors duration-200; }
    .switch-track[aria-checked="true"] { @apply border-primary-700 bg-primary-500; }
    .switch-track:disabled, .switch-track[aria-disabled="true"] { @apply cursor-not-allowed opacity-50; }
    .switch-knob { @apply inline-block h-5 w-5 translate-x-0.5 rounded-full bg-white shadow ring-1 ring-line-strong/60 dark:bg-ink transition-transform duration-200 ltr:translate-x-0.5 rtl:-translate-x-0.5; }
    .switch-track[aria-checked="true"] .switch-knob { @apply ltr:translate-x-5 rtl:-translate-x-5; }

    /* ---------- بطاقة المقرر (CourseCard) ---------- */
    .course-icon { @apply grid h-12 w-12 shrink-0 place-items-center rounded-xl text-lg; }
    /* الألوان والأيقونات: راديو أصلي مخفي بصريًا + عنصر مرئي يليه (اختيار واحد بالأسهم) */
    .swatch { @apply h-9 w-9 shrink-0 rounded-full border-2 border-line-strong transition; }
    input:checked + .swatch { @apply border-ink; box-shadow: var(--ring); }
    .icon-option { @apply grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-line-strong text-base text-muted transition hover:bg-soft; }
    input:checked + .icon-option { @apply border-primary-700 bg-primary-500/10 text-brand; box-shadow: inset 0 0 0 1px rgb(var(--brand)); }
    input:focus-visible + .swatch, input:focus-visible + .icon-option { outline: 2px solid rgb(var(--brand)); outline-offset: 3px; }
  }
</style>

<!-- ⑥ Alpine.js (+ Focus لحصر التركيز داخل النوافذ المنبثقة + Collapse) -->
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- ⑦ SweetAlert2 -->
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>  <!-- يُفضَّل تثبيت إصدار دقيق في Vite -->
</head>

<body x-data="coursesManager()" x-init="init()" @keydown.escape.window="closeAll()"
      @keydown.window="onGlobalKey($event)"
      @scroll.window="closeMenu(false)" @resize.window="onResize()"
      :class="{ 'overflow-hidden': (mobileNav && mobile) || isDeleteModalOpen || isDrawerOpen || quickAddUnitOpen || quickAddLessonOpen }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')"></a>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->
  <div x-cloak x-show="mobileNav && mobile" x-transition.opacity @click="mobileNav = false"
       class="fixed inset-0 z-40 bg-primary-900/60 backdrop-blur-sm lg:hidden" aria-hidden="true"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar" :aria-label="t('mainMenu')"
         class="fixed inset-y-0 start-0 z-50 flex w-72 max-w-[85vw] shrink-0 flex-col border-e border-line bg-card transition-[transform,width,visibility] duration-300 lg:sticky lg:top-0 lg:h-[100dvh] lg:max-w-none"
         :class="[
           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav).toString()" :inert="mobile && !mobileNav">

    <!-- الشعار -->
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <a href="TenantDashboard.html" class="inline-flex min-w-0 flex-1 items-center gap-3" :class="!expanded && 'lg:flex-none lg:justify-center'">
        <span class="inline-flex shrink-0 items-center p-0">
          <img src="../asset/images/firob-logo.png" alt="FirOb" class="mx-1 -my-2.5 block h-[clamp(4rem,10vh,6rem)] w-auto max-w-[22rem] object-contain">
        </span>
        <span class="min-w-0 flex-1" x-show="expanded">
          <p class="truncate text-base font-extrabold leading-tight" x-text="t('appTitle')"></p>
          <p class="truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></p>
        </span>
      </a>
      <button type="button" class="icon-btn lg:hidden" @click="mobileNav = false" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- روابط التنقل -->
    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="t('mainNav')">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-muted" x-show="expanded" x-text="t('navGroups.' + group.group)"></p>
          <ul class="space-y-1" role="list">
            <template x-for="item in group.items" :key="item.key">
              <li>
                <a :href="item.href || '#'" class="nav-link" @click="if (!item.href) { $event.preventDefault(); setActive(item.key); }"
                   :aria-current="active === item.key ? 'page' : null"
                   :title="expanded ? null : t('navItems.' + item.key)"
                   :aria-label="expanded ? null : t('navItems.' + item.key)"
                   :class="!expanded && 'justify-center'">
                  <i :class="item.icon" aria-hidden="true"></i>
                  <span class="min-w-0 flex-1 truncate" x-show="expanded" x-text="t('navItems.' + item.key)"></span>
                  <span x-show="(item.key === 'notificationCenter' ? unread : item.count) && expanded"
                        class="shrink-0 rounded-full text-xs"
                        :class="item.tone === 'primary' ? 'bg-primary-500/10 px-2 py-0.5 font-bold text-brand' : 'bg-accent-500 px-2 font-extrabold text-onaccent'"
                        x-text="item.key === 'notificationCenter' ? unread : item.count"></span>
                </a>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </nav>

    <!-- تبديل الطي (سطح المكتب) -->
    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()" :aria-label="t('toggleSidebar')">
        <i class="fa-solid rtl:-scale-x-100" :class="collapsed ? 'fa-angles-right' : 'fa-angles-left'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="flex min-w-0 flex-1 flex-col">

    <!-- ================= Topbar ================= -->
    <header class="sticky top-0 z-30 flex flex-col border-b border-line bg-card/85 backdrop-blur-md">
      <div class="flex items-center gap-1 px-2 sm:gap-2 sm:px-6" style="height: var(--topbar-h); padding-top: env(safe-area-inset-top, 0px);">

        <button type="button" class="icon-btn" @click="toggleSidebar()" aria-controls="sidebar"
                :aria-expanded="(mobile ? mobileNav : !collapsed).toString()" :aria-label="t('toggleSidebar')">
          <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </button>

        <form role="search" class="relative hidden min-w-0 max-w-md flex-1 md:block" @submit.prevent>
          <label for="q" class="sr-only" x-text="t('searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-line-strong" aria-hidden="true"></i>
          <input id="q" x-ref="globalSearch" type="search" :placeholder="t('searchPlaceholder')"
                 class="h-10 w-full min-w-0 rounded-xl border border-line bg-field pe-16 ps-10 text-base text-ink placeholder:text-muted focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30">
          <kbd dir="ltr" aria-hidden="true"
               class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 items-center gap-1 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted sm:inline-flex">Ctrl K</kbd>
        </form>

        <div class="ms-auto flex shrink-0 items-center gap-0.5 sm:gap-1">

          <button type="button"
                  class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-xl px-2.5 text-muted transition hover:bg-soft hover:text-brand"
                  @click="toggleLocale()" :lang="locale === 'ar' ? 'en' : 'ar'"
                  :aria-label="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'"
                  :title="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span class="text-xs font-extrabold" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="region" :aria-label="t('notifications')">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <p class="font-extrabold" x-text="t('notifications')"></p>
                <button type="button" class="text-xs font-bold text-brand hover:underline" @click="notifications.forEach(n => n.read = true)" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">

                    <div class="min-w-0">

          <div class="sm:relative" @click.outside="profileOpen = false">

              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="t('appSubtitle')"></span>
                <span class="block truncate text-xs text-muted" x-text="t('roleName')"></span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted md:block" aria-hidden="true"></i>
            </button>
            <div id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-56" role="menu" :aria-label="t('accountMenu')">
              <a href="../common/profile.html" role="menuitem" class="menu-item"><i class="fa-regular fa-user w-4 text-muted" aria-hidden="true"></i> <span x-text="t('profile')"></span></a>
              <button type="button" role="menuitem" class="menu-item cursor-not-allowed opacity-60" aria-disabled="true" tabindex="-1"><i class="fa-solid fa-gear w-4 text-muted" aria-hidden="true"></i> <span x-text="t('settings')"></span></button>
              <a href="../common/errors.html" role="menuitem" class="menu-item"><i class="fa-solid fa-triangle-exclamation w-4 text-muted" aria-hidden="true"></i> <span x-text="t('systemStatus')"></span></a>
              <div role="separator" class="border-t border-line"></div>
              <a href="../auth/login.html" role="menuitem" class="menu-item !text-danger"><i class="fa-solid fa-arrow-right-from-bracket w-4" aria-hidden="true"></i> <span x-text="t('logout')"></span></a>
            </div>
          </div>
        </div>
      </div>

      <!-- زبدة الخبز (Breadcrumb) -->
      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="t('breadcrumbLabel')">
          <ol class="flex items-center gap-2" role="list">
            <li><a href="TenantDashboard.html" class="rounded hover:text-brand hover:underline" x-text="t('breadcrumb.home')"></a></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li><a href="AcademicStructure.html" class="transition hover:text-brand hover:underline" x-text="t('navItems.academicStructure')"></a></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right rtl:-scale-x-100 text-[10px]"></i></li>
            <li class="text-ink" x-text="t('navItems.coursesManagement')"></li>
          </ol>
        </nav>
      </div>
    </header>

    <!-- ================= المحتوى الرئيسي — إدارة المقررات الدراسية ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">

      <!-- العنوان + إجراء الإضافة -->
      <section class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end sm:justify-between">
        <div class="min-w-0">
          <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="t('cm.title')"></h1>
          <p class="mt-1 max-w-2xl text-sm text-muted sm:text-base" x-text="t('cm.subtitle')"></p>
        </div>
        <button type="button" class="btn btn-accent" aria-haspopup="dialog" @click="openCreate()">
          <i class="fa-solid fa-plus" aria-hidden="true"></i>
          <span x-text="t('cm.addCourse')"></span>
        </button>
      </section>

      <!-- ================= شريط مؤشرات الأداء (KPI) — محسوبة من البيانات ================= -->
      <section :aria-label="t('cm.kpis')" class="grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-4">
        <div class="panel p-4 sm:p-5">
          <div class="flex items-center justify-between gap-3">
            <p class="min-w-0 truncate text-sm font-bold text-muted" x-text="t('cm.kpiTotal')"></p>
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-primary-500/10 text-brand" aria-hidden="true"><i class="fa-solid fa-book-open"></i></span>
          </div>
          <p class="mt-2 text-2xl font-extrabold tabular-nums" x-text="kpis.total"></p>
        </div>
        <div class="panel p-4 sm:p-5">
          <div class="flex items-center justify-between gap-3">
            <p class="min-w-0 truncate text-sm font-bold text-muted" x-text="t('cm.kpiActive')"></p>
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-success-500/15 text-success-700 dark:text-success-500" aria-hidden="true"><i class="fa-solid fa-circle-check"></i></span>
          </div>
          <p class="mt-2 text-2xl font-extrabold tabular-nums" x-text="kpis.active"></p>
        </div>
        <div class="panel p-4 sm:p-5">
          <div class="flex items-center justify-between gap-3">
            <p class="min-w-0 truncate text-sm font-bold text-muted" x-text="t('cm.kpiNoGrade')"></p>
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-warning-500/15 text-warning-700 dark:text-warning-500" aria-hidden="true"><i class="fa-solid fa-triangle-exclamation"></i></span>
          </div>
          <p class="mt-2 text-2xl font-extrabold tabular-nums" x-text="kpis.noGrade"></p>
        </div>
        <div class="panel p-4 sm:p-5">
          <div class="flex items-center justify-between gap-3">
            <p class="min-w-0 truncate text-sm font-bold text-muted" x-text="t('cm.kpiUnitsLessons')"></p>
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-info-500/15 text-info-700 dark:text-blue-300" aria-hidden="true"><i class="fa-solid fa-cubes"></i></span>
          </div>
          <p class="mt-2 text-2xl font-extrabold tabular-nums">
            <span x-text="kpis.units"></span> <span class="text-sm font-bold text-muted" aria-hidden="true">•</span> <span x-text="kpis.lessons"></span>
            <span class="sr-only" x-text="'(' + pluralize('units', kpis.units) + '، ' + pluralize('lessons', kpis.lessons) + ')'"></span>
          </p>
        </div>
      </section>

      <!-- ================= شريط البحث والفلاتر + تبديل العرض (فلترة فعلية على البيانات) ================= -->
      <section class="panel flex flex-col gap-3 p-4 lg:flex-row lg:items-center sm:p-5" :aria-label="t('cm.filtersLabel')">
        <div class="relative min-w-0 flex-1">
          <label for="course-search" class="sr-only" x-text="t('cm.searchPlaceholder')"></label>
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="course-search" x-ref="courseSearch" type="search" x-model.debounce.150ms="searchQuery" :placeholder="t('cm.searchPlaceholder')"
                 aria-describedby="course-search-hint" autocomplete="off"
                 class="h-11 w-full min-w-0 rounded-xl border border-line-strong bg-field ps-10 pe-10 text-sm text-ink placeholder:text-muted focus:border-brand focus:outline-none">
          <kbd dir="ltr" aria-hidden="true" class="pointer-events-none absolute end-2.5 top-1/2 hidden -translate-y-1/2 rounded border border-line-strong bg-page px-1.5 py-0.5 text-[11px] font-bold text-muted lg:inline-flex">/</kbd>
          <span id="course-search-hint" class="sr-only" x-text="t('cm.searchShortcutHint')"></span>
        </div>

        <div class="relative w-full shrink-0 lg:w-48"
             x-data="selectDropdown({ id: 'grade-filter', options: () => gradeOptions(true), get: () => selectedGrade, set: (v) => selectedGrade = v })"
             @click.outside="closeList()">
          <label id="grade-filter-label" for="grade-filter" class="sr-only" x-text="t('cm.colGrade')"></label>
          <div class="relative" data-combo-anchor>
          <button type="button" id="grade-filter" x-ref="btn" role="combobox" aria-haspopup="listbox"
                  :aria-expanded="open.toString()" aria-controls="grade-filter-list"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="grade-filter-list" role="listbox" aria-labelledby="grade-filter-label"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
          </div>
        </div>
        <div class="relative w-full shrink-0 lg:w-56"
             x-data="selectDropdown({ id: 'domain-filter', options: () => domainOptions(true), get: () => selectedDomain, set: (v) => selectedDomain = v })"
             @click.outside="closeList()">
          <label id="domain-filter-label" for="domain-filter" class="sr-only" x-text="t('cm.colDomain')"></label>
          <div class="relative" data-combo-anchor>
          <button type="button" id="domain-filter" x-ref="btn" role="combobox" aria-haspopup="listbox"
                  :aria-expanded="open.toString()" aria-controls="domain-filter-list"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="domain-filter-list" role="listbox" aria-labelledby="domain-filter-label"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
          </div>
        </div>
        <div class="relative w-full shrink-0 lg:w-48"
             x-data="selectDropdown({ id: 'status-filter', options: () => statusOptions(), get: () => selectedStatus, set: (v) => selectedStatus = v })"
             @click.outside="closeList()">
          <label id="status-filter-label" for="status-filter" class="sr-only" x-text="t('cm.colStatus')"></label>
          <div class="relative" data-combo-anchor>
          <button type="button" id="status-filter" x-ref="btn" role="combobox" aria-haspopup="listbox"
                  :aria-expanded="open.toString()" aria-controls="status-filter-list"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  class="field flex w-full items-center justify-between gap-2 text-start font-bold"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="status-filter-list" role="listbox" aria-labelledby="status-filter-label"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
          </div>
        </div>

        <button type="button" class="btn btn-outline shrink-0" @click="resetFilters()" :disabled="!activeFilterCount">
          <i class="fa-solid fa-filter-circle-xmark" aria-hidden="true"></i>
          <span x-text="t('cm.resetFilters')"></span>
          <span x-show="activeFilterCount" class="badge badge-primary px-2" x-text="activeFilterCount"></span>
        </button>

        <!-- تبديل طريقة العرض: يظهر فقط حيث يكون له أثر (lg+) -->
        <div class="hidden shrink-0 items-center gap-1 rounded-xl border border-line bg-page/50 p-1 lg:flex" role="group" :aria-label="t('cm.viewToggleLabel')">
          <button type="button" class="act border-0" :class="viewMode === 'table' ? 'bg-primary-500 text-white' : 'text-muted'"
                  @click="setView('table')" :aria-pressed="(viewMode === 'table').toString()" :title="t('cm.viewTable')" :aria-label="t('cm.viewTable')">
            <i class="fa-solid fa-table-list" aria-hidden="true"></i>
          </button>
          <button type="button" class="act border-0" :class="viewMode === 'grid' ? 'bg-primary-500 text-white' : 'text-muted'"
                  @click="setView('grid')" :aria-pressed="(viewMode === 'grid').toString()" :title="t('cm.viewGrid')" :aria-label="t('cm.viewGrid')">
            <i class="fa-solid fa-grip" aria-hidden="true"></i>
          </button>
        </div>
      </section>

      <!-- إعلان عدد النتائج لقارئات الشاشة -->
      <p class="sr-only" aria-live="polite" x-text="resultsMsg"></p>

      <!-- ================= حالة فارغة (بلا نتائج) — مربوطة بنتيجة الفلترة ================= -->
      <section x-show="!filteredCourses.length" x-cloak class="panel flex flex-col items-center gap-3 p-10 text-center">
        <span class="grid h-14 w-14 place-items-center rounded-full bg-primary-500/10 text-brand" aria-hidden="true"><i class="fa-solid fa-book-open-reader text-xl"></i></span>
        <h2 class="text-lg font-extrabold text-ink" x-text="t('cm.emptyTitle')"></h2>
        <p class="max-w-sm text-sm text-muted" x-text="t('cm.emptySubtitle')"></p>
        <button type="button" class="btn btn-outline mt-1" @click="resetFilters(); $refs.courseSearch.focus()">
          <i class="fa-solid fa-filter-circle-xmark" aria-hidden="true"></i> <span x-text="t('cm.resetFilters')"></span>
        </button>
      </section>

      <!-- ================= عرض البطاقات — دائمًا على الجوال، واختياري على lg+ (يُرسم عرض واحد فقط) ================= -->
      <template x-if="filteredCourses.length && (mobile || viewMode === 'grid')">
        <section :aria-label="t('cm.viewGrid')">
          <ul class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3" role="list">
            <template x-for="c in filteredCourses" :key="c.id">
              <li class="panel flex min-w-0 flex-col gap-3 p-4" :class="c.status === 'archived' && 'border-dashed border-line-strong'">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex min-w-0 items-center gap-3">
                    <span class="course-icon" :class="colorMeta(c.color).icon" aria-hidden="true"><i class="fa-solid" :class="c.icon"></i></span>
                    <span class="badge badge-muted font-mono" dir="ltr" x-text="c.code"></span>
                  </div>
                  <button type="button" class="act shrink-0" data-kebab @click="toggleMenu(c, $event)" @keydown.arrow-down.prevent="openMenuId === c.id || toggleMenu(c, $event)"
                          aria-haspopup="menu" aria-controls="course-menu" :aria-expanded="(openMenuId === c.id).toString()"
                          :aria-label="t('cm.colActions') + ': ' + title(c)">
                    <i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>
                  </button>
                </div>
                <div class="min-w-0">
                  <h2 class="truncate text-base font-extrabold leading-6" :lang="titleLang(c)" dir="auto" style="text-align: match-parent" x-text="title(c)"></h2>
                  <p x-show="altTitle(c)" class="truncate text-xs text-muted" :lang="altLocale" dir="auto" style="text-align: match-parent" x-text="altTitle(c)"></p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  <span class="badge" :class="c.grade ? 'badge-primary' : 'badge-muted'">
                    <i x-show="!c.grade" class="fa-solid fa-minus text-[9px]" aria-hidden="true"></i>
                    <span x-text="c.grade ? gradeLabel(c.grade) : t('cm.gradeNone')"></span>
                  </span>
                  <span class="badge badge-neutral" x-text="domainLabel(c.domain)"></span>
                  <span class="badge" :class="statusMeta[c.status].badge">
                    <i class="fa-solid" :class="statusMeta[c.status].icon" aria-hidden="true"></i>
                    <span x-text="t('cm.status' + cap(c.status))"></span>
                  </span>
                </div>
                <div>
                  <template x-if="c.units || c.lessons">
                    <div>
                      <div class="flex items-center justify-between gap-2 text-xs font-bold text-muted">
                        <span x-text="pluralize('units', c.units) + ' • ' + pluralize('lessons', c.lessons)"></span>
                        <span class="tabular-nums" x-text="tf('cm.publishedPct', { pct: c.publishedPct })"></span>
                      </div>
                      <div class="quota-track mt-1.5" role="progressbar" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="c.publishedPct" :aria-label="t('cm.publishedLessons')">
                        <div class="quota-fill" :class="colorMeta(c.color).fill" :style="'width:' + c.publishedPct + '%'"></div>
                      </div>
                    </div>
                  </template>
                  <p x-show="!c.units && !c.lessons" class="text-xs font-bold text-muted" x-text="t('cm.noContentYet')"></p>
                </div>
                <div class="mt-auto flex flex-wrap items-center gap-2 border-t border-line pt-3">
                  <button type="button" class="btn btn-sm btn-outline" @click="toggleTree(c)" :aria-expanded="(expandedTreeId === c.id).toString()" :aria-controls="'tree-' + c.id + '-grid'">
                    <i class="fa-solid fa-sitemap" aria-hidden="true"></i> <span x-text="t('cm.actPreviewTree')"></span>
                    <i class="fa-solid fa-chevron-down text-[10px] transition-transform duration-200" :class="expandedTreeId === c.id && 'rotate-180'" aria-hidden="true"></i>
                  </button>
                </div>
                <div x-show="expandedTreeId === c.id" x-collapse>
          <!-- معاينة الهيكل الشجري: الوحدات والدروس (بيانات مشتركة بين العرضين) -->
          <div :id="'tree-' + c.id + '-grid'" class="rounded-xl border border-line bg-page/60 p-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <p class="text-xs font-extrabold text-muted" x-text="t('cm.treeHeading')"></p>
              <button type="button" class="btn btn-sm btn-outline" x-show="canAddUnits(c)" @click="openQuickAddUnit(c)">
                <i class="fa-solid fa-plus" aria-hidden="true"></i> <span x-text="t('cm.addUnit')"></span>
              </button>
            </div>
            <p x-show="!c.unitsEnabled" class="mt-3 text-xs font-bold text-muted" x-text="t('cm.unitsDisabledNote')"></p>
            <p x-show="c.unitsEnabled && !unitsOf(c).length" class="mt-3 text-xs font-bold text-muted" x-text="t('cm.noUnitsYet')"></p>
            <ul class="mt-3 grid gap-2 " role="list">
              <template x-for="unit in unitsOf(c)" :key="unit.id">
                <li class="rounded-xl border border-line bg-card p-3">
                  <div class="flex items-center justify-between gap-2">
                    <button type="button" class="flex min-w-0 flex-1 items-center gap-2 rounded-lg text-start" @click="unit.open = !unit.open"
                            :aria-expanded="unit.open.toString()" :aria-controls="'unit-' + unit.id + '-grid'">
                      <i class="fa-solid fa-chevron-down shrink-0 text-[11px] text-muted transition-transform duration-200" :class="unit.open && 'rotate-180'" aria-hidden="true"></i>
                      <span class="min-w-0 truncate text-sm font-bold text-ink" dir="auto" x-text="unitTitle(unit)"></span>
                    </button>
                    <span class="badge badge-neutral shrink-0" x-text="pluralize('lessons', unit.lessons.length)"></span>
                  </div>
                  <div :id="'unit-' + unit.id + '-grid'" x-show="unit.open" x-collapse class="mt-2.5 border-t border-line pt-2.5 ps-5">
                    <ul class="space-y-1.5" role="list">
                      <template x-for="lesson in unit.lessons" :key="lesson.id">
                        <li class="flex items-center justify-between gap-2 rounded-lg px-2 py-1.5 transition hover:bg-soft">
                          <span class="flex min-w-0 items-center gap-2 text-sm text-ink">
                            <i class="fa-regular fa-file-lines shrink-0 text-xs text-muted" aria-hidden="true"></i>
                            <span class="min-w-0 truncate" dir="auto" x-text="unitTitle(lesson)"></span>
                          </span>
                          <span class="badge shrink-0" :class="lesson.status === 'published' ? 'badge-success' : 'badge-warning'" x-text="lesson.status === 'published' ? t('cm.lessonPublished') : t('cm.lessonDraft')"></span>
                        </li>
                      </template>
                    </ul>

                        <button type="button" class="act group relative" @click="duplicateCourse(c)"
                                :aria-label="t('cm.actDuplicate') + ': ' + title(c)"><i class="fa-solid fa-copy" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('cm.actDuplicate')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                        <button type="button" class="act group relative !text-danger hover:!bg-error-500/10" @click="confirmDelete(c, $event)" aria-haspopup="dialog"
                                :aria-label="t('cm.actDelete') + ': ' + title(c)"><i class="fa-solid fa-trash" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('cm.actDelete')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                      </div>
                    </td>
                  </tr>
                  <tr x-show="expandedTreeId === c.id">
                    <td colspan="6" class="border-t border-line bg-page/50 p-4">
          <!-- معاينة الهيكل الشجري: الوحدات والدروس (بيانات مشتركة بين العرضين) -->
          <div :id="'tree-' + c.id + '-table'" class="rounded-xl border border-line bg-page/60 p-3">

              <p class="text-xs font-extrabold text-muted" x-text="t('cm.treeHeading')"></p>
              <button type="button" class="btn btn-sm btn-outline" x-show="canAddUnits(c)" @click="openQuickAddUnit(c)">

                    <ul class="space-y-1.5" role="list">
                      <template x-for="lesson in unit.lessons" :key="lesson.id">

                            <i class="fa-regular fa-file-lines shrink-0 text-xs text-muted" aria-hidden="true"></i>
                            <span class="min-w-0 truncate" dir="auto" x-text="unitTitle(lesson)"></span>
                          </span>
                          <span class="badge shrink-0" :class="lesson.status === 'published' ? 'badge-success' : 'badge-warning'" x-text="lesson.status === 'published' ? t('cm.lessonPublished') : t('cm.lessonDraft')"></span>
                        </li>
                      </template>
                    </ul>
                    <button type="button" class="btn btn-sm btn-outline mt-2" x-show="c.status !== 'archived'" @click="openQuickAddLesson(c, unit)">
                      <i class="fa-solid fa-plus" aria-hidden="true"></i> <span x-text="t('cm.addLesson')"></span>
                    </button>
                  </div>
                </li>
              </template>
            </ul>
          </div>
                    </td>
                  </tr>
                </tbody>
              </template>
            </table>
          </div>
        </section>
      </template>

      <!-- عدد النتائج (الترقيم الفعلي عبر Livewire ->paginate() لاحقًا) -->
      <p x-show="filteredCourses.length" class="px-1 text-xs font-bold text-muted"
         x-text="tf('cm.showingCourses', { shown: filteredCourses.length, total: pluralize('courses', courses.length) })"></p>
    </main>

    <!-- ================= Footer (كل النصوص عبر I18N) ================= -->

<!-- ==========================================================================
     قائمة الإجراءات السريعة (Kebab Menu) — عنصر واحد بموضع ثابت + لوحة مفاتيح كاملة (C1, M10)
     ========================================================================== -->
<div id="course-menu" x-ref="kebab" x-show="openMenuId !== null" x-cloak x-transition.opacity.scale.95
     class="fixed z-[70] w-64 overflow-hidden rounded-2xl border border-line bg-card py-1 shadow-pop"
     :style="'top:' + menuPos.top + 'px; left:' + menuPos.left + 'px;'"
     role="menu" :aria-label="kebabCourse ? t('cm.colActions') + ': ' + title(kebabCourse) : null"
     @click.outside="if (!$event.target.closest('[data-kebab]')) closeMenu(false)"
     @keydown.arrow-down.prevent="$focus.within($refs.kebab).wrap().next()"
     @keydown.arrow-up.prevent="$focus.within($refs.kebab).wrap().previous()"
     @keydown.home.prevent="$focus.within($refs.kebab).first()"
     @keydown.end.prevent="$focus.within($refs.kebab).last()"
     @keydown.escape.stop.prevent="closeMenu()"
     @keydown.tab="closeMenu(false)">
  <template x-if="kebabCourse">
    <div>
      <button type="button" role="menuitem" class="menu-item" :disabled="!canAddUnits(kebabCourse)" @click="openQuickAddUnit(kebabCourse, menuTrigger)">
        <i class="fa-solid fa-layer-group w-4 text-muted" aria-hidden="true"></i> <span x-text="t('cm.actAddUnitDirect')"></span>
      </button>
      <button type="button" role="menuitem" class="menu-item" @click="toggleTree(kebabCourse); closeMenu(true)">
        <i class="fa-solid fa-sitemap w-4 text-muted" aria-hidden="true"></i> <span x-text="t('cm.actPreviewTree')"></span>
      </button>
      <button type="button" role="menuitem" class="menu-item" @click="openEdit(kebabCourse)">
        <i class="fa-solid fa-pen w-4 text-muted" aria-hidden="true"></i> <span x-text="t('cm.actEdit')"></span>
      </button>
      <button type="button" role="menuitem" class="menu-item" @click="duplicateCourse(kebabCourse)">
        <i class="fa-solid fa-copy w-4 text-muted" aria-hidden="true"></i> <span x-text="t('cm.actDuplicate')"></span>
      </button>
      <button type="button" role="menuitem" class="menu-item" x-show="kebabCourse.status !== 'archived'" @click="toggleStatus(kebabCourse)">
        <i class="fa-solid w-4 text-muted" :class="kebabCourse.status === 'active' ? 'fa-pen-ruler' : 'fa-circle-check'" aria-hidden="true"></i>
        <span x-text="kebabCourse.status === 'active' ? t('cm.actUnpublish') : t('cm.actPublish')"></span>
      </button>
      <button type="button" role="menuitem" class="menu-item" x-show="kebabCourse.status === 'archived'" @click="restoreCourse(kebabCourse)">
        <i class="fa-solid fa-box-open w-4 text-muted" aria-hidden="true"></i> <span x-text="t('cm.actRestore')"></span>
      </button>
      <div role="separator" class="my-1 border-t border-line"></div>
      <button type="button" role="menuitem" class="menu-item !items-start !text-danger hover:!bg-error-500/10" @click="confirmDelete(kebabCourse)">
        <i class="fa-solid fa-trash mt-0.5 w-4" aria-hidden="true"></i>
        <span class="min-w-0">
          <span class="block" x-text="t('cm.actDelete')"></span>
          <span x-show="hasContent(kebabCourse)" class="block text-xs font-medium text-muted" x-text="t('cm.deleteBlockedHint')"></span>
        </span>
      </button>
    </div>
  </template>
</div>

<!-- ==========================================================================
     اللوحة الجانبية (Slide-over) — إضافة / تعديل مقرر دراسي
     ========================================================================== -->
<div x-show="isDrawerOpen" x-cloak x-transition.opacity class="fixed inset-0 z-[60]" @keydown.escape.window="closeDrawer()">
  <div class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closeDrawer()" aria-hidden="true"></div>

  <form x-ref="courseForm" novalidate @submit.prevent="submitCourse()" x-show="isDrawerOpen" x-trap.noscroll.noreturn="isDrawerOpen"
        role="dialog" aria-modal="true" aria-labelledby="drawer-title"
        x-transition:enter="transition duration-300 ease-out" x-transition:enter-start="ltr:translate-x-full rtl:-translate-x-full" x-transition:enter-end="translate-x-0"
        x-transition:leave="transition duration-200 ease-in" x-transition:leave-start="translate-x-0" x-transition:leave-end="ltr:translate-x-full rtl:-translate-x-full"
        class="absolute inset-y-0 end-0 flex w-full max-w-lg flex-col border-s border-line bg-card shadow-pop">

    <header class="flex shrink-0 items-center justify-between gap-3 border-b border-line bg-soft p-5">
      <h2 id="drawer-title" class="text-lg font-extrabold text-ink" x-text="editingCourse ? t('cm.panelEditTitle') : t('cm.panelAddTitle')"></h2>
      <button type="button" class="icon-btn" @click="closeDrawer()" :disabled="busy" :aria-label="t('cm.close')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </header>

    <div class="min-h-0 flex-1 space-y-5 overflow-y-auto p-5">
      <p class="text-xs text-muted"><span class="text-danger" aria-hidden="true">*</span> <span x-text="t('cm.requiredLegend')"></span></p>

      <p x-show="editingCourse && editingCourse.status === 'archived'" class="flex items-start gap-2 rounded-xl border border-line-strong bg-page/60 p-3 text-xs font-bold text-muted">
        <i class="fa-solid fa-box-archive mt-0.5" aria-hidden="true"></i> <span x-text="t('cm.editingArchivedNote')"></span>
      </p>

      <!-- رمز المقرر -->
      <div>
        <label for="cf-code" class="label"><span x-text="t('cm.fieldCode')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
        <input id="cf-code" autofocus type="text" x-model.trim="form.code" @blur="form.code = form.code.toUpperCase()" required aria-required="true" maxlength="50"
               autocomplete="off" spellcheck="false" dir="ltr" style="text-align: match-parent" placeholder="MATH-G7-PAL" class="field font-mono"
               :aria-invalid="(formSubmitted && !!errors.code).toString()" aria-describedby="cf-code-hint cf-code-err">
        <p id="cf-code-hint" class="hint" x-text="t('cm.fieldCodeHint')"></p>
        <p id="cf-code-err" class="err" x-show="formSubmitted && errors.code"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="errors.code"></span></p>
      </div>

      <!-- اسم المقرر بالعربية -->
      <div>
        <label for="cf-title-ar" class="label"><span x-text="t('cm.fieldTitleAr')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
        <input id="cf-title-ar" type="text" lang="ar" dir="rtl" style="text-align: match-parent" x-model.trim="form.titleAr" required aria-required="true" maxlength="150" class="field"
               :aria-invalid="(formSubmitted && !!errors.titleAr).toString()" aria-describedby="cf-title-ar-err">
        <p id="cf-title-ar-err" class="err" x-show="formSubmitted && errors.titleAr"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="errors.titleAr"></span></p>
      </div>

      <!-- اسم المقرر بالإنجليزية -->
      <div>
        <label for="cf-title-en" class="label" x-text="t('cm.fieldTitleEn')"></label>
        <input id="cf-title-en" type="text" lang="en" dir="ltr" style="text-align: match-parent" x-model.trim="form.titleEn" maxlength="150" class="field">
      </div>

      <div class="relative "
             x-data="selectDropdown({ id: 'cf-grade', options: () => gradeOptions(false), get: () => form.grade, set: (v) => form.grade = v })"
             @click.outside="closeList()">
          <label id="cf-grade-label" for="cf-grade" class="label" x-text="t('cm.fieldGrade')"></label>
          <div class="relative" data-combo-anchor>
          <button type="button" id="cf-grade" x-ref="btn" role="combobox" aria-haspopup="listbox" aria-describedby="cf-grade-hint"
                  :aria-expanded="open.toString()" aria-controls="cf-grade-list"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  class="field flex w-full items-center justify-between gap-2 text-start"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="cf-grade-list" role="listbox" aria-labelledby="cf-grade-label"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
          </div>
        <p id="cf-grade-hint" class="hint" x-text="t('cm.fieldGradeHint')"></p>
        </div>
        <div class="relative "
             x-data="selectDropdown({ id: 'cf-domain', options: () => domainOptions(false), get: () => form.domain, set: (v) => form.domain = v })"

          <label id="cf-domain-label" for="cf-domain" class="label" x-text="t('cm.fieldDomain')"></label>
          <div class="relative" data-combo-anchor>
          <button type="button" id="cf-domain" x-ref="btn" role="combobox" aria-haspopup="listbox"
                  :aria-expanded="open.toString()" aria-controls="cf-domain-list"
                  :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                  class="field flex w-full items-center justify-between gap-2 text-start"
                  @click="toggleList()" @keydown="onKey($event)">
            <span class="truncate" x-text="triggerLabel"></span>
            <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
          </button>
          <ul x-show="open" x-cloak x-ref="list" id="cf-domain-list" role="listbox" aria-labelledby="cf-domain-label"
              x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
            <template x-for="(item, idx) in items" :key="item.value">
              <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                  class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                  @click="choose(item)" @mousemove="active = idx">
                <span class="truncate" x-text="item.label"></span>
                <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
              </li>
            </template>
          </ul>
          </div>
        </div>

      <!-- وصف المقرر -->
      <div>
        <label for="cf-desc" class="label" x-text="t('cm.fieldDescription')"></label>

      <fieldset>
        <legend class="label" x-text="t('cm.fieldColor')"></legend>
        <div class="flex flex-wrap gap-2.5">

<script>
  /**
   * مكوّن قائمة الاختيار المخصصة (Select-only Combobox — نمط ARIA APG).
   * options: () => [{ value, label }] | get: () => القيمة | set: (v) => تحديث
   * لوحة المفاتيح: ↑↓ Home End Enter Space Esc Tab + البحث بالكتابة (type-ahead).
   * Esc يوقف الانتشار حتى لا يُغلق اللوحة الجانبية/النافذة الأم (C5).
   */
  function selectDropdown({ id, options, get, set, placeholder = '' }) {
    return {
      id, open: false, active: -1, typed: '', typedAt: 0,
      get items() { return options(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { const sel = this.selectedItem; return sel ? sel.label : placeholder; },
      optId(item) { return this.id + '-opt-' + (item.value === '' ? 'none' : item.value); },
      openList() {
        if (!this.items.length) return;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item) { set(item.value); this.closeList(); this.$refs.btn?.focus(); },
      setActive(i) { this.active = Math.min(Math.max(i, 0), this.items.length - 1); this.scrollActiveIntoView(); },
      move(step) { if (!this.open) { this.openList(); return; } this.setActive(this.active + step); },
      onKey(e) {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); if (e.altKey && this.open && k === 'ArrowUp') { this.choose(this.items[this.active]); return; } this.move(k === 'ArrowDown' ? 1 : -1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.setActive(0); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.setActive(this.items.length - 1); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); (this.open && this.active > -1) ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape') { if (this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); } }
        else if (k === 'Tab') { if (this.open) this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          const now = Date.now();
          this.typed = (now - this.typedAt > 600 ? '' : this.typed) + k.toLowerCase();
          this.typedAt = now;
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this.typed));
          if (i > -1) { if (!this.open) this.openList(); this.setActive(i); }
        }
      },
      scrollActiveIntoView() { this.$nextTick(() => this.$refs.list?.children[this.active + 1]?.scrollIntoView({ block: 'nearest' })); },
      isSelected(item) { const sel = this.selectedItem; return !!sel && sel.value === item.value; },
    };
