<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

    .pill-option.is-correct { @apply border-success-700 bg-success-50 text-success-800 dark:border-success-500 dark:bg-success-500/10 dark:text-success-500; }
    .pill-option:focus-within { outline: 2px solid rgb(var(--brand)); outline-offset: 2px; }

    /* ---------- حقل نص الخيار: تركيز مرئي (كان focus:ring-0 + box-shadow:none) ---------- */
    .opt-input { @apply min-w-0 flex-1 rounded-md bg-transparent px-2 py-1.5 text-sm text-ink placeholder:text-muted; }
    .opt-input:focus-visible, .opt-input:focus { outline: 2px solid rgb(var(--brand)); outline-offset: 1px; }

    /* ---------- المنزلق ---------- */
    .range { @apply h-2 w-full cursor-pointer appearance-none rounded-full;
             background: linear-gradient(to right, rgb(var(--brand)) var(--pct, 50%), rgb(var(--line-strong)) var(--pct, 50%)); }
    [dir="rtl"] .range { background: linear-gradient(to left, rgb(var(--brand)) var(--pct, 50%), rgb(var(--line-strong)) var(--pct, 50%)); }
    .range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; height: 1.25rem; width: 1.25rem; border-radius: 9999px; background: rgb(var(--brand)); border: 3px solid rgb(var(--card)); box-shadow: 0 0 0 1px rgb(var(--brand)); }
    .range::-moz-range-thumb { height: 1.25rem; width: 1.25rem; border-radius: 9999px; background: rgb(var(--brand)); border: 3px solid rgb(var(--card)); box-shadow: 0 0 0 1px rgb(var(--brand)); }
    .range:focus-visible { outline: 3px solid rgb(var(--brand)); outline-offset: 6px; }

    /* ---------- الأداء + الطبقات ---------- */

    .overlay-backdrop { -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }

  }

            </div>
            <div class="min-w-0"
                 x-data="selectDropdown({ id: 'qb-unit', options: () => unitOpts(), get: () => quizForm.unitId, set: (v) => { setUnit(v) }, placeholder: () => quizForm.courseId ? t('qb.unitPh') : t('qb.pickCourseFirst') })"

              <div class="relative" data-combo-anchor>
                <button type="button" id="qb-unit" x-ref="btn" role="combobox" aria-haspopup="listbox" :disabled="!quizForm.courseId" :aria-required="(reqUnit).toString()" :aria-invalid="(submitted && !!fieldError('unit')).toString()" aria-describedby="qb-unit-err"
                        :aria-expanded="open.toString()" aria-controls="qb-unit-list"
                        :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                        class="field flex min-h-[2.75rem] w-full items-center justify-between gap-2 text-start font-bold"
                        @click="toggleList()" @keydown="onKey($event)">
                  <span class="truncate" :class="!selectedItem && 'font-medium text-muted'" x-text="triggerLabel"></span>
                  <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
                </button>
                <ul x-show="open" x-cloak x-ref="list" id="qb-unit-list" role="listbox" aria-labelledby="qb-unit-label"
                    x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                  <template x-for="(item, idx) in items" :key="item.value">
                    <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"

                        @click="choose(item)" @mousemove="active = idx">
                      <span class="truncate" x-text="item.label"></span>
                      <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                    </li>

                </ul>
              </div>
              <p id="qb-unit-err" class="err" x-show="submitted && !!fieldError('unit')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="fieldError('unit')"></span></p>
            </div>
            <div class="min-w-0"
                 x-data="selectDropdown({ id: 'qb-lesson', options: () => lessonOpts(), get: () => quizForm.lessonId, set: (v) => { quizForm.lessonId = v }, placeholder: () => quizForm.unitId ? t('qb.lessonPh') : t('qb.pickUnitFirst') })"
                 @click.outside="closeList()">
              <label id="qb-lesson-label" for="qb-lesson" class="label"><span x-text="t('qb.field.lesson')"></span> <span class="text-danger" aria-hidden="true" x-show="reqLesson">*</span></label>
              <div class="relative" data-combo-anchor>
                <button type="button" id="qb-lesson" x-ref="btn" role="combobox" aria-haspopup="listbox" :disabled="!quizForm.unitId" :aria-required="(reqLesson).toString()" :aria-invalid="(submitted && !!fieldError('lesson')).toString()" aria-describedby="qb-lesson-err"
                        :aria-expanded="open.toString()" aria-controls="qb-lesson-list"
                        :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                        class="field flex min-h-[2.75rem] w-full items-center justify-between gap-2 text-start font-bold"
                        @click="toggleList()" @keydown="onKey($event)">
                  <span class="truncate" :class="!selectedItem && 'font-medium text-muted'" x-text="triggerLabel"></span>
                  <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
                </button>
                <ul x-show="open" x-cloak x-ref="list" id="qb-lesson-list" role="listbox" aria-labelledby="qb-lesson-label"
                    x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                  <template x-for="(item, idx) in items" :key="item.value">
                    <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                        class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                        @click="choose(item)" @mousemove="active = idx">
                      <span class="truncate" x-text="item.label"></span>
                      <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                    </li>
                  </template>
                </ul>
              </div>
              <p id="qb-lesson-err" class="err" x-show="submitted && !!fieldError('lesson')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="fieldError('lesson')"></span></p>
            </div>
          </div>
          <p class="hint" x-text="t('qb.fieldHierarchyHint')"></p>
        </fieldset>

        <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <div class="min-w-0"
                 x-data="selectDropdown({ id: 'qb-type', options: () => typeOpts(), get: () => quizForm.type, set: (v) => { quizForm.type = v }, placeholder: '—' })"
                 @click.outside="closeList()">
              <label id="qb-type-label" for="qb-type" class="label"><span x-text="t('qb.fieldType')"></span></label>
              <div class="relative" data-combo-anchor>
                <button type="button" id="qb-type" x-ref="btn" role="combobox" aria-haspopup="listbox"
                        :aria-expanded="open.toString()" aria-controls="qb-type-list"
                        :aria-activedescendant="open && active > -1 ? optId(items[active]) : null"
                        class="field flex min-h-[2.75rem] w-full items-center justify-between gap-2 text-start font-bold"
                        @click="toggleList()" @keydown="onKey($event)">
                  <span class="truncate" :class="!selectedItem && 'font-medium text-muted'" x-text="triggerLabel"></span>
                  <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
                </button>
                <ul x-show="open" x-cloak x-ref="list" id="qb-type-list" role="listbox" aria-labelledby="qb-type-label"
                    x-transition.origin.top.duration.150ms class="combo-list scroll-thin">
                  <template x-for="(item, idx) in items" :key="item.value">
                    <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                        class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                        @click="choose(item)" @mousemove="active = idx">
                      <span class="truncate" x-text="item.label"></span>
                      <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                    </li>
                  </template>
                </ul>
              </div>
            </div>
          <div>
            <label for="qb-duration" class="label" x-text="t('qb.fieldDuration')"></label>
            <div class="relative">
              <input id="qb-duration" type="number" min="1" max="240" inputmode="numeric" x-model.number="quizForm.duration" class="field pe-16"
                     aria-describedby="qb-duration-unit qb-duration-err" :aria-invalid="(submitted && !!fieldError('duration')).toString()">
              <span id="qb-duration-unit" class="pointer-events-none absolute inset-y-0 end-3.5 flex items-center text-xs font-bold text-muted" x-text="t('qb.minutesSuffix')"></span>
            </div>
            <p id="qb-duration-err" class="err" x-show="submitted && fieldError('duration')" x-text="fieldError('duration')"></p>
          </div>
          <div>
            <p id="qb-total-label" class="label" x-text="t('qb.fieldTotalMarks')"></p>
            <p class="field flex items-center justify-between gap-2 bg-soft font-bold tabular-nums" aria-labelledby="qb-total-label" aria-live="polite">
              <span x-text="totalMarks"></span>
              <span class="text-xs font-medium text-muted" x-text="t('qb.autoComputed')"></span>
            </p>
          </div>
          <div>
            <label for="qb-passing" class="label" x-text="t('qb.fieldPassingScore')"></label>
            <div class="relative">
              <input id="qb-passing" type="number" min="0" max="100" inputmode="numeric" x-model.number="quizForm.passingScore" class="field pe-10"
                     aria-describedby="qb-passing-unit qb-passing-hint">
              <span id="qb-passing-unit" class="pointer-events-none absolute inset-y-0 end-3.5 flex items-center text-xs font-bold text-muted">%</span>
            </div>
            <p id="qb-passing-hint" class="hint" x-text="tf('qb.passMarkHint', { n: passMark, total: totalMarks })"></p>
          </div>
        </div>

        <div class="mt-4">
          <label for="qb-instructions" class="label" x-text="t('qb.fieldInstructions')"></label>
          <textarea id="qb-instructions" rows="3" x-model="quizForm.instructions" class="field resize-y" lang="ar" dir="auto" maxlength="1000"
                    :placeholder="t('qb.fieldInstructionsPh')" aria-describedby="qb-instructions-hint"></textarea>
          <p id="qb-instructions-hint" class="hint" x-text="t('qb.fieldInstructionsHint')"></p>
        </div>
      </section>

      <!-- ================= Section 2: أسئلة الاختبار ================= -->
      <section aria-labelledby="section3-title">
        <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
          <div class="min-w-0">
            <h2 id="section3-title" class="text-lg font-extrabold text-ink" x-text="t('qb.section3Title')"></h2>
            <p class="text-xs text-muted sm:text-sm" x-text="tf('qb.section3Sub', { q: pluralize('questions', questions.length), m: totalMarks })"></p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="btn btn-ai" aria-haspopup="dialog" @click="openAiModal($event)">
              <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
              <span x-text="t('qb.aiGenerateBtn')"></span>
            </button>
            <button type="button" id="qb-add-q" class="btn btn-outline" @click="addQuestion()">
              <i class="fa-solid fa-plus" aria-hidden="true"></i>
              <span x-text="t('qb.addManualQuestion')"></span>
            </button>
          </div>
        </div>

        <div x-show="!questions.length" class="panel flex flex-col items-center gap-3 border-dashed p-10 text-center">
          <span class="grid h-14 w-14 place-items-center rounded-full bg-primary-500/10 text-brand" aria-hidden="true"><i class="fa-solid fa-circle-question text-xl"></i></span>
          <p class="font-extrabold" x-text="t('qb.emptyTitle')"></p>
          <p class="max-w-sm text-sm text-muted" x-text="t('qb.emptySub')"></p>
        </div>

        <ol class="space-y-4" role="list">
          <template x-for="(q, i) in questions" :key="q.uid">
            <li>
              <article class="q-card panel p-5" :data-q="q.uid" :aria-labelledby="'ql-' + q.uid"
                       :class="submitted && questionErrors(q).length && 'ring-2 ring-error-600/40'">
                <header class="mb-4 flex flex-wrap items-start justify-between gap-3 border-b border-line pb-4">
                  <h3 :id="'ql-' + q.uid" class="flex flex-wrap items-center gap-2">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-primary-500/10 text-sm font-extrabold text-brand tabular-nums" aria-hidden="true" x-text="i + 1"></span>
                    <span class="sr-only" x-text="tf('qb.questionN', { n: i + 1 })"></span>
                    <span class="badge" :class="TYPE_CLS[q.type]" x-text="t('qb.qType.' + q.type)"></span>
                    <span class="badge badge-muted tabular-nums" x-text="tf('qb.marksN', { n: q.marks || 0 })"></span>
                    <span x-show="q.source === 'ai'" class="badge badge-accent"><i class="fa-solid fa-wand-magic-sparkles text-[10px]" aria-hidden="true"></i> <span x-text="t('qb.srcAi')"></span></span>
                    <span x-show="submitted && questionErrors(q).length" class="badge badge-danger"><i class="fa-solid fa-circle-exclamation text-[10px]" aria-hidden="true"></i> <span x-text="t('qb.needsFix')"></span></span>
                  </h3>
                  <div class="flex items-center gap-1.5">
                    <button type="button" data-act="up" class="act group relative disabled:cursor-not-allowed disabled:opacity-40" :disabled="i === 0" @click="move(i, -1)" :aria-label="t('qb.act.up') + ' — ' + tf('qb.questionN', { n: i + 1 })"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('qb.act.up')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                    <button type="button" data-act="down" class="act group relative disabled:cursor-not-allowed disabled:opacity-40" :disabled="i === questions.length - 1" @click="move(i, 1)" :aria-label="t('qb.act.down') + ' — ' + tf('qb.questionN', { n: i + 1 })"><i class="fa-solid fa-arrow-down" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('qb.act.down')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                    <button type="button" data-act="duplicate" class="act group relative disabled:cursor-not-allowed disabled:opacity-40" @click="duplicate(i)" :aria-label="t('qb.act.duplicate') + ' — ' + tf('qb.questionN', { n: i + 1 })"><i class="fa-solid fa-copy" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('qb.act.duplicate')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                    <button type="button" data-act="delete" class="act group relative disabled:cursor-not-allowed disabled:opacity-40 !text-danger hover:!bg-error-500/10" @click="remove(i)" :aria-label="t('qb.act.delete') + ' — ' + tf('qb.questionN', { n: i + 1 })"><i class="fa-solid fa-trash" aria-hidden="true"></i><span class="tooltip-bubble" x-text="t('qb.act.delete')" aria-hidden="true"></span><span class="tooltip-arrow" aria-hidden="true"></span></button>
                  </div>
                </header>

                <!-- نوع السؤال (أقراص — أخف من قائمة لكل بطاقة) -->
                <fieldset class="min-w-0">
                  <legend class="label" x-text="t('qb.qTypeLabel')"></legend>
                  <div class="grid grid-cols-3 gap-2">
                    <template x-for="ty in ['mcq', 'tf', 'essay']" :key="ty">
                      <label class="pill-option" :class="q.type === ty && 'is-checked'">
                        <input type="radio" class="sr-only" :name="'type-' + q.uid" :value="ty" :checked="q.type === ty" @change="changeType(q, ty, $event)">
                        <i class="fa-solid text-xs" :class="TYPE_ICON[ty]" aria-hidden="true"></i>
                        <span x-text="t('qb.qType.' + ty)"></span>
                      </label>
                    </template>
                  </div>
                </fieldset>

                <!-- نص السؤال -->
                <div class="mt-4">
                  <label :for="'q-text-' + q.uid" class="label"><span x-text="t('qb.qTextLabel')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
                  <textarea :id="'q-text-' + q.uid" rows="2" x-model="q.text" class="field resize-y" lang="ar" dir="auto" aria-required="true" maxlength="2000"
                            :aria-invalid="(submitted && qErr(q, 'text')).toString()" :aria-describedby="'q-text-err-' + q.uid"></textarea>
                  <p :id="'q-text-err-' + q.uid" class="err" x-show="submitted && qErr(q, 'text')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="t('qb.v.text')"></span></p>
                </div>

                <!-- خيارات الاختيار من متعدد -->
                <fieldset x-show="q.type === 'mcq'" class="mt-4 min-w-0" :aria-describedby="'q-opt-err-' + q.uid">
                  <legend class="label" x-text="t('qb.optionsLegend')"></legend>
                  <div class="space-y-2">
                    <template x-for="(op, oi) in q.options" :key="oi">
                      <div class="flex items-center gap-2 rounded-lg border px-2.5 py-1.5 transition-colors"
                           :class="q.correct === oi ? 'border-success-700 bg-success-50 dark:border-success-500 dark:bg-success-500/10' : 'border-line-strong/60'">
                        <input type="radio" class="h-5 w-5 shrink-0 cursor-pointer accent-success-700" :name="'correct-' + q.uid" :checked="q.correct === oi"
                               @change="q.correct = oi" :aria-label="tf('qb.markCorrectN', { n: oi + 1 })">
                        <input type="text" :id="'q-opt-' + q.uid + '-' + oi" class="opt-input" x-model="q.options[oi]" lang="ar" dir="auto" maxlength="300"
                               :aria-label="tf('qb.optionN', { n: oi + 1 })" :placeholder="tf('qb.optionN', { n: oi + 1 })">
                        <span x-show="q.correct === oi" class="badge badge-success shrink-0"><i class="fa-solid fa-check text-[10px]" aria-hidden="true"></i> <span class="hidden sm:inline" x-text="t('qb.correctAnswer')"></span></span>
                        <button type="button" class="act shrink-0 disabled:cursor-not-allowed disabled:opacity-40" :disabled="q.options.length <= 2"
                                @click="removeOption(q, oi)" :aria-label="tf('qb.deleteOptionN', { n: oi + 1 })"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
                      </div>
                    </template>
                  </div>
                  <p :id="'q-opt-err-' + q.uid" class="err" x-show="submitted && (qErr(q, 'options') || qErr(q, 'optionsDup'))">
                    <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="t(qErr(q, 'options') ? 'qb.v.options' : 'qb.v.optionsDup')"></span>
                  </p>
                  <button type="button" class="btn btn-outline btn-sm mt-3" @click="addOption(q)" :disabled="q.options.length >= 6">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i> <span x-text="t('qb.addOption')"></span>
                  </button>
                </fieldset>

                <!-- صح / خطأ -->
                <fieldset x-show="q.type === 'tf'" class="mt-4 min-w-0">
                  <legend class="label" x-text="t('qb.correctAnswer')"></legend>
                  <div class="grid grid-cols-2 gap-2">
                    <template x-for="v in [true, false]" :key="String(v)">
                      <label class="pill-option" :class="q.answer === v && 'is-checked is-correct'">
                        <input type="radio" class="sr-only" :name="'tf-' + q.uid" :checked="q.answer === v" @change="q.answer = v">
                        <i class="fa-solid text-xs" :class="v ? 'fa-check' : 'fa-xmark'" aria-hidden="true"></i>
                        <span x-text="t(v ? 'qb.trueLabel' : 'qb.falseLabel')"></span>
                      </label>
                    </template>
                  </div>
                </fieldset>

                <!-- مقالي -->
                <div x-show="q.type === 'essay'" class="mt-4 space-y-3">
                  <p class="rounded-xl border border-dashed border-line-strong/60 bg-page/50 p-3.5 text-xs leading-6 text-muted">
                    <i class="fa-solid fa-circle-info me-1" aria-hidden="true"></i><span x-text="t('qb.essayNote')"></span>
                  </p>
                  <div>
                    <label :for="'q-model-' + q.uid" class="label"><span x-text="t('qb.modelAnswerLabel')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
                    <textarea :id="'q-model-' + q.uid" rows="2" x-model="q.modelAnswer" class="field resize-y" lang="ar" dir="auto" maxlength="3000"
                              :placeholder="t('qb.modelAnswerPh')" :aria-invalid="(submitted && qErr(q, 'modelAnswer')).toString()" :aria-describedby="'q-model-err-' + q.uid"></textarea>
                    <p :id="'q-model-err-' + q.uid" class="err" x-show="submitted && qErr(q, 'modelAnswer')"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> <span x-text="t('qb.v.modelAnswer')"></span></p>
                  </div>
                </div>

                <!-- الدرجة + الصعوبة + بلوم -->
                <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-3">
                  <div>
                    <label :for="'q-marks-' + q.uid" class="label"><span x-text="t('qb.marksLabel')"></span> <span class="text-danger" aria-hidden="true">*</span></label>
                    <input :id="'q-marks-' + q.uid" type="number" min="0.5" max="100" step="0.5" inputmode="decimal" x-model.number="q.marks" class="field"
                           :aria-invalid="(submitted && qErr(q, 'marks')).toString()" :aria-describedby="'q-marks-err-' + q.uid">
                    <p :id="'q-marks-err-' + q.uid" class="err" x-show="submitted && qErr(q, 'marks')" x-text="t('qb.v.marks')"></p>
                  </div>
                  <div>
                    <label :for="'q-diff-' + q.uid" class="label" x-text="t('qb.difficultyLabel')"></label>
                    <select :id="'q-diff-' + q.uid" x-model="q.difficulty" class="field">
                      <template x-for="d in ['easy', 'medium', 'hard']" :key="d"><option :value="d" :selected="q.difficulty === d" x-text="t('qb.diff.' + d)"></option></template>
                    </select>
                  </div>
                  <div>
                    <label :for="'q-bloom-' + q.uid" class="label" x-text="t('qb.bloomLabel')"></label>
                    <select :id="'q-bloom-' + q.uid" x-model="q.bloom" class="field">
                      <template x-for="b in BLOOMS" :key="b"><option :value="b" :selected="q.bloom === b" x-text="t('qb.bloom.' + b)"></option></template>
                    </select>
                  </div>
                </div>

                <div class="mt-4">

<script>
  /**
   * مكوّن قائمة الاختيار المخصصة (Select-only Combobox — نمط ARIA APG).
   * options: () => [{ value, label }] | get: () => القيمة | set: (v) => تحديث
   * لوحة المفاتيح: ↑↓ Home End Enter Space Esc Tab + البحث بالكتابة (type-ahead).
   * Esc يوقف الانتشار حتى لا يُغلق اللوحة الجانبية/النافذة الأم (C5).
   */
  function selectDropdown({ id, options, get, set, placeholder = '' }) {
    return {
      id, open: false, active: -1, typed: '', typedAt: 0,
      get items() { return options(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { const sel = this.selectedItem; return sel ? sel.label : (typeof placeholder === 'function' ? placeholder() : placeholder); },  // placeholder تفاعلي مع اللغة
      optId(item) { return this.id + '-opt-' + (item.value === '' ? 'none' : item.value); },
      openList() {
        if (!this.items.length) return;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },

      get issues() {
        const out = [];
        const FIELD_ID = { titleAr: 'qb-titleAr', titleEn: 'qb-titleEn', course: 'qb-course', unit: 'qb-unit', lesson: 'qb-lesson', duration: 'qb-duration' };
        Object.keys(FIELD_ID).forEach(k => { const m = this.fieldError(k); if (m) out.push({ label: m, target: FIELD_ID[k] }); });
        if (!this.questions.length) out.push({ label: this.t('qb.v.noQuestions'), target: 'qb-add-q' });
        this.questions.forEach((q, i) => this.questionErrors(q).forEach(k => {
          const target = { text: 'q-text-', options: 'q-opt-', optionsDup: 'q-opt-', correct: 'q-opt-', marks: 'q-marks-', modelAnswer: 'q-model-' }[k] + q.uid
                         + (['options', 'optionsDup', 'correct'].includes(k) && q.type === 'mcq' ? '-0' : '');
          out.push({ label: this.tf('qb.issueQ', { n: i + 1, msg: this.t('qb.v.' + k) }), target: k === 'correct' && q.type === 'tf' ? 'q-text-' + q.uid : target });
        }));
        return out;
      },
      goToIssue(is) {
        const el = document.getElementById(is.target);
        if (!el) return;
        el.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
        el.focus({ preventScroll: true });
      },

      /* ---------- إدارة الأسئلة ---------- */
      liveMsg: '',
      announce(msg) { this.liveMsg = ''; this.$nextTick(() => { this.liveMsg = msg; }); },
      focusIn(qid, sel) { this.$nextTick(() => document.querySelector(`[data-q="${qid}"] ${sel}`)?.focus()); },
      addQuestion() {
        const q = normalize({ type: 'mcq', marks: 1, options: ['', '', '', ''] });
        this.questions.push(q);
        this.announce(this.tf('qb.added', { n: this.questions.length }));
        this.$nextTick(() => { const el = document.getElementById('q-text-' + q.uid); el?.scrollIntoView({ block: 'center' }); el?.focus({ preventScroll: true }); });
      },
      move(i, d) {
        const j = i + d;
        if (j < 0 || j >= this.questions.length) return;
        const q = this.questions[i];
        this.questions.splice(i, 1);
        this.questions.splice(j, 0, q);
        this.announce(this.tf('qb.movedTo', { n: j + 1 }));
        const act = (d < 0 && j === 0) ? 'down' : (d > 0 && j === this.questions.length - 1) ? 'up' : (d < 0 ? 'up' : 'down');
        this.focusIn(q.uid, `[data-act=${act}]`);
      },
      duplicate(i) {
        const c = { ...clone(this.questions[i]), uid: uid() };
        this.questions.splice(i + 1, 0, c);
        this.announce(this.tf('qb.duplicated', { n: i + 2 }));
        this.focusIn(c.uid, '[data-act=duplicate]');
      },
      remove(i) {
        const [q] = this.questions.splice(i, 1);
        const next = this.questions[i] || this.questions[i - 1];
        if (next) this.focusIn(next.uid, '[data-act=delete]'); else this.$nextTick(() => document.getElementById('qb-add-q')?.focus());
        this.toastUndo(this.tf('qb.deleted', { n: i + 1 }), () => { this.questions.splice(i, 0, q); this.focusIn(q.uid, '[data-act=delete]'); });
      },
      addOption(q) {
        if (q.options.length >= 6) return;
        q.options.push('');
        this.$nextTick(() => document.getElementById(`q-opt-${q.uid}-${q.options.length - 1}`)?.focus());
      },
      removeOption(q, oi) {
        if (q.options.length <= 2) return;
        q.options.splice(oi, 1);
        if (q.correct === oi) q.correct = 0; else if (q.correct > oi) q.correct--;
        this.$nextTick(() => document.getElementById(`q-opt-${q.uid}-${Math.min(oi, q.options.length - 1)}`)?.focus());
      },
      async changeType(q, ty, ev) {
        if (q.type === ty) return;
        const lossy = (q.type === 'mcq' && q.options.some(o => o.trim())) || (q.type === 'essay' && q.modelAnswer.trim());
        if (lossy && !(await this.confirmDialog(this.t('qb.confirmTypeTitle'), this.t('qb.confirmTypeText')))) {
          ev.target.checked = false;
          this.$nextTick(() => document.querySelector(`[data-q="${q.uid}"] input[name="type-${q.uid}"][value="${q.type}"]`)?.focus());
          return;
        }
        Object.assign(q, { type: ty, options: ty === 'mcq' ? ['', '', '', ''] : q.options, correct: 0,
                           answer: true, modelAnswer: ty === 'essay' ? q.modelAnswer : '' });
        if (ty !== 'mcq') q.options = ['', ''];
      },

      /* ---------- الحفظ والإرسال ---------- */
      dirty: false, lastSavedAt: null, savingDraft: false, publishing: false, now: Date.now(), _ready: false, _t: null,
      get saveStateText() {
        if (this.savingDraft) return this.t('qb.saving');
        if (this.dirty) return this.t('qb.unsaved');
        if (!this.lastSavedAt) return this.t('qb.notSaved');
        const s = Math.round((this.now - this.lastSavedAt) / 1000);
        const rel = s < 45 ? this.t('qb.justNow') : new Intl.RelativeTimeFormat(this.locale, { numeric: 'auto' }).format(-Math.max(1, Math.round(s / 60)), 'minute');
        return this.tf('qb.savedAgo', { t: rel });
      },
      markDirty() {
        if (!this._ready) return;
        this.dirty = true;
        clearTimeout(this._t);
        this._t = setTimeout(() => { if (this.dirty) this.saveDraft({ silent: true }); }, 4000);   // حفظ تلقائي
      },
      nextCode() {
        const prefix = 'QZ-' + (CODE_PREFIX[this.quizForm.courseId] || 'GEN');
        const nums = QUIZ_INDEX.filter(q => q.code.startsWith(prefix + '-')).map(q => +q.code.split('-').pop());
        return prefix + '-' + String((nums.length ? Math.max(...nums) : 100) + 1).padStart(3, '0');
      },
      async saveDraft({ silent = false } = {}) {
        if (this.savingDraft) return;
        clearTimeout(this._t);
        this.savingDraft = true;
        await sleep(500);                                           // Livewire: $wire.saveDraft()
        let assigned = '';
        this._ready = false;                                        // تغييرات الحفظ نفسها لا تُعلِّم النموذج كمعدَّل
        if (!this.quizForm.code && this.quizForm.courseId) { this.quizForm.code = this.nextCode(); assigned = this.quizForm.code; }
        if (this.quizForm.status !== 'in_review') this.quizForm.status = 'draft';
        this.savingDraft = false;
        this.$nextTick(() => { this.dirty = false; clearTimeout(this._t); this._ready = true; });   // بعد مراقبي التغييرات
        this.lastSavedAt = Date.now(); this.now = Date.now();
        if (!silent) this.toastSuccess(this.t('qb.toastSaved') + (assigned ? ' ' + this.tf('qb.codeAssigned', { code: assigned }) : ''));
      },
      async submitForReview() {
        this.submitted = true;
        if (this.issues.length) {
          this.announce(this.tf('qb.issuesTitle', { n: this.issues.length }));
          this.$nextTick(() => { this.$refs.issuesBox?.scrollIntoView({ block: 'center' }); this.$refs.issuesBox?.focus({ preventScroll: true }); });
          return;
        }
        this.publishing = true;
        await this.saveDraft({ silent: true });
        await sleep(500);                                           // Livewire: $wire.submitForReview() → ReviewRequest
        this._ready = false;
        this.quizForm.status = 'in_review';
        this.publishing = false;
        this.dirty = false;
        this.toastSuccess(this.tf('qb.toastSubmitted', { name: this.displayTitle }));
        setTimeout(() => { window.location.href = 'quizzes.html'; }, 1400);
      },

      /* ---------- المعاينة ---------- */
      previewOpen: false, _pvReturn: null,
      openPreview(ev) { this._pvReturn = ev?.currentTarget || null; this.previewOpen = true; },
      closePreview() { this.previewOpen = false; this.$nextTick(() => this._pvReturn?.focus()); },

      /* ---------- التوليد بالذكاء الاصطناعي ---------- */
      aiModalOpen: false, aiBusy: false, aiResults: [], _aiReturn: null,
      aiForm: { concept: '', bloom: 'mixed', qtype: 'mcq', difficulty: 'medium', count: 5 },
      aiConceptOpts() {
        const f = this.quizForm;
        const list = M.concepts.filter(c => c.courseId === f.courseId && (!f.unitId || c.unitId === f.unitId) && (!f.lessonId || !c.lessonId || c.lessonId === f.lessonId));
        return [{ value: '', label: this.t('qb.aiAllConcepts') }, ...list.map(c => ({ value: c.code, label: c[this.locale] }))];
      },
      aiBloomOpts() { return ['mixed', ...BLOOMS].map(b => ({ value: b, label: this.t('qb.bloom.' + b) })); },
      aiTypeOpts() { return ['mcq', 'tf', 'essay'].map(v => ({ value: v, label: this.t('qb.qType.' + v) })); },
      get aiContextText() { return this.quizForm.courseId ? this.tf('qb.aiContext', { path: this.pathLabels().join(' › ') }) : ''; },
      get aiEstimate() { return 120 + this.aiForm.count * (this.aiForm.qtype === 'essay' ? 220 : 160); },
      openAiModal(ev) {
        this._aiReturn = ev?.currentTarget || null;
        this.aiResults = [];
        this.aiModalOpen = true;
        this.$nextTick(() => setTimeout(() => document.getElementById('ai-concept')?.focus(), 60));
      },
      closeAiModal() { if (this.aiBusy) return; this.aiModalOpen = false; this.$nextTick(() => this._aiReturn?.focus()); },
      async generateWithAI() {
        if (!this.quizForm.courseId || this.aiBusy) return;
        this.aiBusy = true;
        await sleep(1100);                                          // Livewire: AiGenerationRun + Job (نفس مسار المولّد)
        const f = this.aiForm, pool = (QBANK[this.quizForm.courseId] || {})[f.qtype] || [];
        const seed = Math.floor(Math.random() * 3);
        this.aiResults = Array.from({ length: f.count }, (_, i) => {
          const src = clone(pool[(seed + i) % pool.length]);
          const difficulty = f.difficulty === 'mixed' ? DIFFS[i % 3] : f.difficulty;
          return { uid: uid(), type: f.qtype, bloom: f.bloom === 'mixed' ? BLOOMS[i % BLOOMS.length] : f.bloom, difficulty,
                   marks: f.qtype === 'essay' ? 5 : { easy: 1, medium: 2, hard: 3 }[difficulty], added: false, ...src };
        });
        this.aiBusy = false;
        this.$nextTick(() => this.$refs.aiResultsHead?.focus());
      },
      addGenerated(r) {
        if (r.added) return;
        r.added = true;
        const { added, ...rest } = clone(r);
        const q = normalize({ ...rest, source: 'ai', modelAnswer: '', options: r.type === 'mcq' ? rest.options : ['', ''] });
        this.questions.push(q);
        this.announce(this.tf('qb.added', { n: this.questions.length }));
      },
      addAllGenerated() { this.aiResults.filter(r => !r.added).forEach(r => this.addGenerated(r)); },

      /* ---------- حوارات وتنبيهات ---------- */
      async confirmDialog(title, text) {
        if (!window.Swal) return window.confirm(text);
        const r = await Swal.fire({ icon: 'warning', title, text, showCancelButton: true, focusCancel: true, reverseButtons: this.locale === 'ar',
                                    confirmButtonText: this.t('qb.confirmYes'), cancelButtonText: this.t('qb.confirmNo'), buttonsStyling: false,
                                    customClass: { popup: 'firob-swal', confirmButton: 'btn btn-primary', cancelButton: 'btn btn-outline' } });
        return r.isConfirmed;
      },
      toastSuccess(msg) {
        this.announce(msg);
        if (!window.Swal) return;
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: msg, showConfirmButton: false, timer: 3000, customClass: { popup: 'firob-swal firob-toast' } });
      },
      toastUndo(msg, undo) {
        this.announce(msg);
        if (!window.Swal) return;
        Swal.fire({ toast: true, position: 'top-end', icon: 'info', title: msg, timer: 6000, timerProgressBar: true,
                    showConfirmButton: true, confirmButtonText: this.t('qb.undo'), customClass: { popup: 'firob-swal firob-toast' } })
          .then(r => { if (r.isConfirmed) { undo(); this.announce(this.t('qb.undone')); } });
      },

      /* ---------- التهيئة ---------- */
      loadFromUrl() {
        const p = new URLSearchParams(window.location.search);
        const meta = QUIZ_INDEX.find(q => q.code === p.get('code'));
        if (!meta) { this.questions = [normalize({ type: 'mcq', marks: 1, options: ['', '', '', ''] })]; return; }
        this.mode = 'edit';
        this.originalStatus = meta.status; this.attempts = meta.attempts;
        Object.assign(this.quizForm, { code: meta.code, titleAr: meta.ar, titleEn: meta.en, type: meta.type, status: meta.status,
                                       courseId: meta.courseId, unitId: meta.unitId || '', lessonId: meta.lessonId || '', duration: meta.duration });
        const bank = QBANK[meta.courseId] || {};
        const seedQs = meta.code === 'QZ-MATH-102' ? DEMO_102
          : [['mcq', 2], ['tf', 1], ['essay', 5]].filter(([ty]) => bank[ty]).map(([ty, marks]) => ({ type: ty, marks, ...clone(bank[ty][0]),
              modelAnswer: ty === 'essay' ? 'إجابة نموذجية تجريبية يكتبها المعلّم.' : '' }));
        this.questions = seedQs.map(normalize);
        this.lastSavedAt = Date.now() - 3600e3;
      },
      init() {
        this.loadFromUrl();
        document.title = this.t('docTitle');
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        this.$watch('quizForm', () => this.markDirty());
        this.$watch('questions', () => this.markDirty());
        this.$nextTick(() => { this._ready = true; });
        setInterval(() => { this.now = Date.now(); }, 30000);
        window.addEventListener('beforeunload', (e) => { if (this.dirty || this.savingDraft) { e.preventDefault(); e.returnValue = ''; } });
      },
      onGlobalKey(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); this.saveDraft(); return; }   // Ctrl+S: حفظ
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const g = this.$refs.globalSearch;
          if (g && g.offsetParent !== null) g.focus();
        }
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      // Esc العام: القوائم فقط — النوافذ تعالج Esc بنفسها
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },
    };
  }
</script>
