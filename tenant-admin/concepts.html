<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    try {
      var s = localStorage.getItem('firob-theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
      var loc = localStorage.getItem('firob-locale') || 'ar';
      document.documentElement.lang = loc;
      document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>

<!-- ⑤ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;

    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165;

    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased transition-colors duration-300; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    :focus-visible { outline: 2px solid rgb(var(--brand)); outline-offset: 2px; }  /* outline لا يتعارض مع ظلال المكونات ويعمل في forced-colors */
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* إلغاء أيقونة التفريغ الأصلية لحقول type="search" — تتعارض مع أيقونة البحث وزر التفريغ المخصص، وتسوء في RTL */
    input[type="search"]::-webkit-search-decoration,
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-results-button,
    input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .icon-btn { @apply relative inline-grid h-10 w-10 shrink-0 place-items-center rounded-xl text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link { @apply flex items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-sm transition hover:bg-soft; }

    /* ---------- تلميحات أزرار الإجراءات (Action Tooltips) ---------- */
    .tooltip-bubble {
      @apply pointer-events-none absolute -top-9 left-1/2 z-30 -translate-x-1/2 scale-95 whitespace-nowrap rounded-lg border border-white/10 bg-ink px-2.5 py-1 text-xs font-medium tracking-wide text-card opacity-0 shadow-xl backdrop-blur-md transition-all duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:scale-100 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:scale-100 group-focus-visible:opacity-100;
    }
    .tooltip-arrow {
      @apply pointer-events-none absolute -top-3 left-1/2 z-30 h-0 w-0 -translate-x-1/2 border-4 border-transparent border-t-ink opacity-0 transition-all duration-200 ease-out;
      @apply group-hover:-translate-y-1 group-hover:opacity-100 group-focus-visible:-translate-y-1 group-focus-visible:opacity-100;
    }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-success-700 dark:text-success-500; }
    .badge-accent  {@apply bg-accent-500/20 text-yellow-900 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info-500/15 text-info-700 dark:text-blue-300; }
    .badge-danger  { @apply bg-error-500/15 text-error-700 dark:text-red-300; }
    .badge-neutral { @apply bg-neutral-200 text-ink dark:bg-soft-2; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }
    .badge-warning { @apply bg-warning-500/15 text-warning-800 dark:text-warning-500; }  /* 700 كان 4.15:1 على الصفوف الملوّنة */

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-sm text-ink transition placeholder:text-muted; }
    .field:hover { @apply border-primary-500; }
    .field:focus { @apply border-primary-700 outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار ---------- */
    .btn { @apply inline-flex select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }

    .menu-item:disabled { @apply cursor-not-allowed opacity-40 hover:bg-transparent; }
    .menu-item:focus-visible { outline-offset: -2px; }

    /* ---------- قائمة الاختيار المخصصة (Combobox Listbox) ---------- */
    .combo-list { @apply absolute top-full z-50 mt-1.5 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }

    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- النافذة المنبثقة / اللوحة الجانبية ---------- */
    .modal-panel { @apply relative flex max-h-[90dvh] w-full max-w-lg flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }

<script>
  /**
   * مكوّن قائمة الاختيار المخصصة (Select-only Combobox — نمط ARIA APG).
   * options: () => [{ value, label }] | get: () => القيمة | set: (v) => تحديث
   * لوحة المفاتيح: ↑↓ Home End Enter Space Esc Tab + البحث بالكتابة (type-ahead).
   * Esc يوقف الانتشار حتى لا يُغلق اللوحة الجانبية/النافذة الأم (C5).
   */
  function selectDropdown({ id, options, get, set, placeholder = '' }) {
    return {
      id, open: false, active: -1, typed: '', typedAt: 0,
      get items() { return options(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { const sel = this.selectedItem; return sel ? sel.label : placeholder; },
      optId(item) { return this.id + '-opt-' + (item.value === '' ? 'none' : item.value); },
      openList() {
        if (!this.items.length) return;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item) { set(item.value); this.closeList(); this.$refs.btn?.focus(); },
      setActive(i) { this.active = Math.min(Math.max(i, 0), this.items.length - 1); this.scrollActiveIntoView(); },
      move(step) { if (!this.open) { this.openList(); return; } this.setActive(this.active + step); },
      onKey(e) {
        const k = e.key;
        if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); if (e.altKey && this.open && k === 'ArrowUp') { this.choose(this.items[this.active]); return; } this.move(k === 'ArrowDown' ? 1 : -1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.setActive(0); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.setActive(this.items.length - 1); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); (this.open && this.active > -1) ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape') { if (this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); } }
        else if (k === 'Tab') { if (this.open) this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          const now = Date.now();
          this.typed = (now - this.typedAt > 600 ? '' : this.typed) + k.toLowerCase();
          this.typedAt = now;
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this.typed));
          if (i > -1) { if (!this.open) this.openList(); this.setActive(i); }
        }
      },
      scrollActiveIntoView() { this.$nextTick(() => this.$refs.list?.children[this.active + 1]?.scrollIntoView({ block: 'nearest' })); },
      isSelected(item) { const sel = this.selectedItem; return !!sel && sel.value === item.value; },
    };
  }

    return {

      get expanded() { return this.mobile || !this.collapsed; },
      get altLocale() { return this.locale === 'ar' ? 'en' : 'ar'; },

      /* ---------- الترجمة ---------- */
      t(path) {
        const dict = I18N[this.locale];
        return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), dict) ?? path;
      },
      tf(path, vars) {
        let s = this.t(path);
        Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
        return s;
      },
      pluralize(key, n) {
        const forms = this.t('plural.' + key);
        if (!forms || typeof forms !== 'object') return String(n);
        return (forms[new Intl.PluralRules(this.locale).select(n)] ?? forms.other).split('{n}').join(n);
      },
      setLocale(loc) {
        this.locale = loc;
        document.documentElement.lang = loc;
        document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
        document.title = this.t('docTitle');
        try { localStorage.setItem('firob-locale', loc); } catch (e) {}

        { id: 2, key: 'quota', time: '2h', read: false, icon: 'fa-solid fa-triangle-exclamation', tone: 'bg-warning-500/15 text-warning-700 dark:text-warning-500' },
        { id: 3, key: 'reset', time: '1d', read: true, icon: 'fa-solid fa-key', tone: 'bg-success-500/15 text-success-700 dark:text-success-500' },
      ],
      get unread() { return this.notifications.filter(n => !n.read).length; },

      /* ---------- إعدادات الهيكل الأكاديمي (tenant_settings: academic.structure) — نفس مصدر شاشة ADM-05 ---------- */
      structure: structuredClone(FIROB_MOCK.structure),   // asset/js/firob-mock-data.js
      get requiredLevelsText() {
        const lv = ['course'];
        if (this.structure.units.enabled && this.structure.units.required) lv.push('unit');
        if (this.structure.lessons.enabled && this.structure.lessons.required) lv.push('lesson');
        return lv.map(l => this.t('cp.level.' + l)).join(' › ');
      },

      /* ---------- البيانات المرجعية (Subject / Unit / Lesson) ---------- */
      courses: FIROB_MOCK.courses,
      units: FIROB_MOCK.units,
      lessons: FIROB_MOCK.lessons,
      label(item) { return item ? (item[this.locale] || item.ar) : ''; },
      courseById(id) { return this.courses.find(x => x.id === id); },
      unitById(id)   { return this.units.find(x => x.id === id); },
      lessonById(id) { return this.lessons.find(x => x.id === id); },

      /* ---------- المفاهيم — Concept::with(['subject','unit','lesson'])->withCount(['learningObjects','questions']) ---------- */
      concepts: FIROB_MOCK.concepts.map(c => ({ ...c, links: { ...c.links } })),
      title(c, loc = this.locale) { return (loc === 'en' && c.en) || c.ar; },
      titleLang(c) { return this.locale === 'en' && c.en ? 'en' : 'ar'; },
      altTitle(c) { const alt = this.title(c, this.altLocale); return alt !== this.title(c) ? alt : ''; },
      iconMeta(c) {
        const course = this.courseById(c.courseId);
        return course ? { icon: course.icon, cls: course.cls } : { icon: 'fa-circle-question', cls: 'bg-line text-muted' };
      },

      // C5: الاكتمال يتبع إعدادات «إلزامي» للمؤسسة — لا شارة ثابتة
      missingLevels(c) {
        const m = [];
        if (!c.courseId) m.push('course');
        if (this.structure.units.enabled && this.structure.units.required && !c.unitId) m.push('unit');
        if (this.structure.lessons.enabled && this.structure.lessons.required && !c.lessonId) m.push('lesson');
        return m;
      },
      isComplete(c) { return this.missingLevels(c).length === 0; },
      missingText(c) { return this.t('cp.missingPrefix') + ' ' + this.missingLevels(c).map(l => this.t('cp.level.' + l)).join(this.locale === 'ar' ? '، ' : ', '); },
      pathOf(c) {
        const S = this.structure, steps = [{ level: 'course', label: this.label(this.courseById(c.courseId)), required: true }];
        if (S.units.enabled)   steps.push({ level: 'unit',   label: this.label(this.unitById(c.unitId)),     required: S.units.required });
        if (S.lessons.enabled) steps.push({ level: 'lesson', label: this.label(this.lessonById(c.lessonId)), required: S.lessons.required });
        return steps;
      },
      editorUrl(c) { return 'concept-editor.html?code=' + encodeURIComponent(c.code) + '&mode=' + (this.isComplete(c) ? 'edit' : 'complete'); },
      hasLinks(c) { return (c.links.objects + c.links.questions) > 0; },
      linksSummary(c) {
        return [['objects', c.links.objects], ['questions', c.links.questions]].filter(([, n]) => n > 0)
          .map(([k, n]) => this.pluralize(k, n)).join(this.locale === 'ar' ? ' و' : ' and ');
      },
      get kpis() {
        const done = this.concepts.filter(c => this.isComplete(c)).length;
        return { total: this.concepts.length, done, incomplete: this.concepts.length - done };
      },

      /* ---------- البحث والفلاتر المتسلسلة (C1, C2) ---------- */
      searchQuery: '', selectedCourse: 'all', selectedUnit: 'all', selectedLesson: 'all', incompleteOnly: false,
      courseOptions() { return [{ value: 'all', label: this.t('cp.filterCourseAll') }, ...this.courses.map(c => ({ value: c.id, label: this.label(c) }))]; },
      get scopedUnits() { return this.units.filter(u => this.selectedCourse === 'all' || u.courseId === this.selectedCourse); },
      get scopedLessons() {
        return this.lessons.filter(l => this.selectedUnit === 'all' ? this.scopedUnits.some(u => u.id === l.unitId) : l.unitId === this.selectedUnit);
      },
      unitOptions() { return [{ value: 'all', label: this.t('cp.filterUnitAll') }, ...this.scopedUnits.map(u => ({ value: u.id, label: this.label(u) }))]; },
      lessonOptions() { return [{ value: 'all', label: this.t('cp.filterLessonAll') }, ...this.scopedLessons.map(l => ({ value: l.id, label: this.label(l) }))]; },
      get filtered() {
        const q = this.searchQuery.trim().toLowerCase();
        return this.concepts.filter(c =>
          (!q || [c.code, c.ar, c.en].some(s => (s || '').toLowerCase().includes(q))) &&
          (this.selectedCourse === 'all' || c.courseId === this.selectedCourse) &&
          (this.selectedUnit   === 'all' || c.unitId   === this.selectedUnit) &&
          (this.selectedLesson === 'all' || c.lessonId === this.selectedLesson) &&
          (!this.incompleteOnly || !this.isComplete(c)));
      },
      get activeFilterCount() {
        return [this.searchQuery.trim() !== '', this.selectedCourse !== 'all', this.selectedUnit !== 'all', this.selectedLesson !== 'all', this.incompleteOnly].filter(Boolean).length;
      },
      get resultsMsg() { return this.activeFilterCount ? this.tf('cp.resultsCount', { concepts: this.pluralize('concepts', this.filtered.length) }) : ''; },
      resetFilters() { this.searchQuery = ''; this.selectedCourse = 'all'; this.selectedUnit = 'all'; this.selectedLesson = 'all'; this.incompleteOnly = false; },

      /* ---------- الترقيم ---------- */
      page: 1, perPage: 8,
      get pageCount() { return Math.max(1, Math.ceil(this.filtered.length / this.perPage)); },
      get pageRows() { const p = Math.min(this.page, this.pageCount); return this.filtered.slice((p - 1) * this.perPage, p * this.perPage); },
      get pageInfo() {
        const total = this.filtered.length, from = total ? (Math.min(this.page, this.pageCount) - 1) * this.perPage + 1 : 0;
        return this.tf('cp.pageInfo', { from, to: Math.min(from + this.perPage - 1, total), total: this.pluralize('concepts', total) });
      },
      goPage(p) {
        this.page = Math.min(Math.max(1, p), this.pageCount);
        this.$nextTick(() => document.getElementById('main')?.scrollIntoView({ block: 'start', behavior: 'smooth' }));
      },

      /* ---------- النسخ: ينشئ نسخة فعلية برمز فريد + تراجع ---------- */
      duplicateConcept(c) {
        let n = 2, code = c.code + '-C';
        while (this.concepts.some(x => x.code === code)) code = c.code + '-C' + n++;
        const copy = { ...c, id: Date.now(), code, ar: c.ar + I18N.ar.cp.copySuffix, en: c.en ? c.en + I18N.en.cp.copySuffix : '', links: { objects: 0, questions: 0 } };
        this.concepts.splice(this.concepts.indexOf(c) + 1, 0, copy);
        this.toastUndo(this.tf('cp.toastDuplicate', { name: this.title(c), code }), () => { this.concepts = this.concepts.filter(x => x.id !== copy.id); });
      },

      /* ---------- نافذة الحذف + حارس الارتباطات (C4) ---------- */
      busy: false, isDeleteModalOpen: false, deleteTarget: null, lastTrigger: null,
      confirmDelete(c, evt) {
        this.lastTrigger = evt?.currentTarget || document.activeElement;
        this.deleteTarget = c;
        this.isDeleteModalOpen = true;
      },
      restoreFocus() {
        const el = this.lastTrigger;
        this.lastTrigger = null;
        this.$nextTick(() => {
          if (el && el.isConnected && el.offsetParent !== null) el.focus();
          else document.getElementById('main')?.focus();
        });
      },
      closeDeleteModal() {
        if (this.busy || !this.isDeleteModalOpen) return;
        this.isDeleteModalOpen = false; this.deleteTarget = null;
        this.restoreFocus();
      },
      async deleteConfirmed() {
        const c = this.deleteTarget;
        if (!c || this.hasLinks(c)) return;             // حماية مزدوجة — الخادم هو المرجع النهائي
        this.busy = true;
        await sleep(400);
        this.concepts = this.concepts.filter(x => x.id !== c.id);
        this.busy = false;
        this.isDeleteModalOpen = false; this.deleteTarget = null;
        this.toastSuccess(this.tf('cp.toastDelete', { name: this.title(c) }));
        this.restoreFocus();                               // الصف حُذف ← يعود التركيز إلى <main>
      },

      /* ---------- SweetAlert2: تنبيهات سريعة (Toast) ---------- */
      toastBase(extra) {
        if (!window.Swal) return Promise.resolve({});
        return Swal.fire(Object.assign({
          toast: true, position: 'top-end', icon: 'success', showConfirmButton: false, timer: 3000,
          customClass: { popup: 'firob-swal firob-toast' },
          didOpen: (el) => {
            el.addEventListener('mouseenter', Swal.stopTimer);
            el.addEventListener('mouseleave', Swal.resumeTimer);
            el.addEventListener('focusin', Swal.stopTimer);
          },
        }, extra));
      },
      toastSuccess(msg) { this.toastBase({ title: msg }); },
      toastUndo(msg, undo) {
        this.toastBase({
          title: msg, timer: 6000, timerProgressBar: true,
          showConfirmButton: true, confirmButtonText: this.t('cp.undo'), buttonsStyling: false,
          customClass: { popup: 'firob-swal firob-toast', confirmButton: 'btn btn-sm btn-outline' },
        }).then(r => { if (r.isConfirmed) { undo(); this.toastSuccess(this.t('cp.undone')); } });
      },

      /* ---------- اختصارات لوحة المفاتيح ---------- */
      onGlobalKey(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const g = this.$refs.globalSearch;
          (g && g.offsetParent !== null ? g : this.$refs.conceptSearch)?.focus();   // البحث العام مخفي تحت md
          return;
        }
        if (e.key === '/' && !this.isDeleteModalOpen && !e.target.closest('input, textarea, select, [contenteditable], [role="combobox"]')) {
          e.preventDefault(); this.$refs.conceptSearch?.focus();
        }
      },

      /* ---------- عامة ---------- */
      init() {
        document.title = this.t('docTitle');
        // رسالة نجاح قادمة من محرر المفهوم (?saved=CODE&action=create|edit|complete) — بديل session()->flash في Laravel
        const qp = new URLSearchParams(location.search), saved = qp.get('saved');
        if (saved) {
          const show = () => this.toastSuccess(this.tf('cp.flash.' + (qp.get('action') || 'edit'), { code: saved }));
          document.readyState === 'complete' ? show() : window.addEventListener('load', show, { once: true });
          history.replaceState(null, '', location.pathname);
        }
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        // فلاتر متسلسلة: تغيير الأب يعيد ضبط الأبناء، وأي تغيير يعيد إلى الصفحة الأولى
        this.$watch('selectedCourse', () => { this.selectedUnit = 'all'; this.selectedLesson = 'all'; this.page = 1; });
        this.$watch('selectedUnit', () => { this.selectedLesson = 'all'; this.page = 1; });
        ['selectedLesson', 'searchQuery', 'incompleteOnly'].forEach(k => this.$watch(k, () => { this.page = 1; }));
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      toggleTheme() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        document.getElementById('theme-color')?.setAttribute('content', this.dark ? '#09141B' : '#F1EDE7');
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      // Esc العام: القوائم فقط — النافذة تعالج Esc بنفسها وتعيد التركيز
      closeAll() { this.notifOpen = false; this.profileOpen = false; this.mobileNav = false; },
    };
  }
</script>
</body>
</html>
