<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#F1EDE7">
<meta name="color-scheme" content="light dark">
<!-- لوحة تحكم محمية خلف تسجيل الدخول: لا فهرسة ولا وصف تسويقي ولا OG -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>تحليلات استهلاك الذكاء الاصطناعي — FirOb</title>

<!-- ① تطبيق الثيم قبل الرسم (يمنع وميض FOUC) -->
<script>
  (function () {
    var d = false;
    try {
      var s = localStorage.getItem('firob-theme');
      d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) {
      d = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    document.documentElement.classList.toggle('dark', d);
    var m = document.getElementById('theme-color');
    if (m) m.setAttribute('content', d ? '#09141B' : '#F1EDE7');
  })();
</script>

<!-- ①-ب طبقة النموذج الأولي: توحيد الروابط + تثبيت اللغة (تُحذف عند الانتقال إلى Laravel) -->
<script src="../asset/js/firob-prototype.js"></script>

<!-- ①-ج اللغة والاتجاه قبل الرسم (يمنع قفزة RTL ↔ LTR) -->
<script>
  (function () {
    var l = (window.FIROB && FIROB.locale) || null;
    if (!l) { try { l = localStorage.getItem('firob-locale'); } catch (e) {} }
    l = l === 'en' ? 'en' : 'ar';
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  })();
</script>

<!-- ② اتصالات مبكرة -->
<link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

      crossorigin referrerpolicy="no-referrer" onload="this.onload=null;this.rel='stylesheet'">

<!-- ⑤ Tailwind (إصدار مثبّت) + التوكنز المعتمدة (Style Guide v1.0). في الإنتاج: CSS مبني مسبقًا عبر Vite. -->
<script src="https://cdn.tailwindcss.com/3.4.5"></script>
<script>
  const v = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Tajawal', 'Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        page: v('page'), card: v('card'), field: v('field'), ink: v('ink'), muted: v('muted'),
        line: v('line'), 'line-strong': v('line-strong'),
        brand: v('brand'), soft: v('soft'), 'soft-2': v('soft-2'),
        danger: v('danger'), ok: v('ok'), warn: v('warn'), info: v('info'),
        onaccent: '#1E293B',
        primary: { 50:'#E7F4F8', 100:'#C9E7EF', 200:'#A3D5E2', 500:'#0E80A1', 600:'#0C6F8B', 700:'#0B6680', 800:'#094F63', 900:'#073C4C' },
        accent:  { 100:'#FDF6CC', 200:'#FBEE96', 500:'#F7D933', 600:'#E8C81F', 700:'#CFAE12' },
        success: { 50:'#ECFDF5', 100:'#D1FAE5', 500:'#10B981', 700:'#047857', 800:'#065F46' },
        warning: { 50:'#FFFBEB', 100:'#FEF3C7', 500:'#F59E0B', 700:'#B45309', 800:'#92400E' },
        error:   { 50:'#FEF2F2', 100:'#FEE2E2', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
      },
      boxShadow: {
        card: '0 1px 2px rgba(30,41,59,.06), 0 12px 32px -12px rgba(30,41,59,.14)',
        pop:  '0 20px 50px -12px rgba(7,60,76,.45)',
      },
    } }
  }
</script>

<!-- ⑥ طبقة التوكنز والمكونات -->
<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --page: 241 237 231;  --card: 251 249 246;  --field: 255 255 255;
      --ink: 30 41 59;      --muted: 71 85 105;
      --line: 226 232 240;  --line-strong: 127 143 166;
      --brand: 11 102 128;  --soft: 231 244 248;  --soft-2: 201 231 239;
      /* ألوان الحالة النصية — كلها ≥ 4.5:1 على البطاقة والشارات الشفافة */
      --danger: 185 28 28;  --ok: 4 120 87;       --warn: 180 83 9;    --info: 29 78 216;
      --topbar-h: calc(4rem + env(safe-area-inset-top, 0px));
      --ring: 0 0 0 2px rgb(var(--card)), 0 0 0 4px rgb(var(--brand)), 0 0 0 7px rgba(247,217,51,.55);
    }
    .dark {
      color-scheme: dark;
      --page: 9 20 27;      --card: 15 30 40;     --field: 10 22 30;
      --ink: 232 240 245;   --muted: 157 178 192;
      --line: 34 55 69;     --line-strong: 100 125 143;
      --brand: 110 205 228; --soft: 20 52 66;     --soft-2: 27 68 85;
      --danger: 252 165 165; --ok: 110 231 183;   --warn: 252 211 77;  --info: 147 197 253;
    }
    html { font-family: 'Tajawal', 'Manrope', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html[lang="en"] { font-family: 'Manrope', 'Tajawal', ui-sans-serif, system-ui, sans-serif; }

    /* شبكة أمان ضد أي سكرول أفقي — clip لا يكسر position: sticky */
    html, body { max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }

    body { @apply bg-page text-ink antialiased; }
    body.theme-anim, body.theme-anim * { transition: background-color .3s, border-color .3s, color .3s !important; }
    img, svg, video, canvas { max-width: 100%; }
    [x-cloak] { display: none !important; }
    i[class*='fa-'] { display: inline-block; min-width: 1em; text-align: center; font-style: normal; }
    :focus-visible { outline: 2px solid transparent; outline-offset: 2px; box-shadow: var(--ring); }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  }

  @layer components {
    .app-h { min-height: 100vh; min-height: 100dvh; }
    .panel { @apply min-w-0 rounded-2xl border border-line bg-card shadow-card; }
    .dark .panel { box-shadow: 0 24px 48px -24px rgb(0 0 0 / .7); }
    .icon-btn { @apply relative inline-grid h-11 w-11 shrink-0 place-items-center rounded-xl text-muted transition-colors hover:bg-soft hover:text-brand disabled:opacity-50 sm:h-10 sm:w-10; }
    .nav-link { @apply flex min-h-[2.75rem] items-center gap-3 rounded-xl px-3 py-2.5 text-[0.9375rem] font-bold text-muted transition-colors hover:bg-soft hover:text-brand; }
    .nav-link[aria-current="page"] { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25; }
    .nav-link i { @apply w-5 shrink-0 text-center text-base; }
    .act { @apply inline-grid h-11 w-11 shrink-0 place-items-center rounded-lg border border-line-strong/60 text-sm text-muted transition-colors hover:bg-soft hover:text-brand disabled:pointer-events-none disabled:opacity-40 sm:h-9 sm:w-9; }
    .act[aria-current="page"] { @apply border-transparent bg-primary-500 text-white hover:bg-primary-600 hover:text-white; }

    /* ---------- الشارات (StatusBadge) ---------- */
    .badge { @apply inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-bold leading-5; }
    .badge-success { @apply bg-success-500/15 text-ok; }
    .badge-accent  { @apply bg-accent-500/25 text-onaccent dark:bg-accent-500/15 dark:text-accent-500; }
    .badge-muted   { @apply bg-line text-muted; }
    .badge-info    { @apply bg-info/15 text-info; }
    .badge-danger  { @apply bg-error-500/15 text-danger; }
    .badge-neutral { @apply bg-line text-ink; }
    .badge-primary { @apply bg-primary-500/15 text-brand; }

    /* ---------- عناصر النموذج ---------- */
    .label { @apply mb-1.5 block text-sm font-bold text-ink; }
    .hint  { @apply mt-1.5 text-xs text-muted; }
    .err   { @apply mt-1.5 flex items-center gap-1.5 text-xs font-bold text-danger; }
    .field { @apply block min-h-[2.75rem] w-full rounded-lg border border-line-strong bg-field px-3.5 py-2.5 text-ink transition-colors placeholder:text-muted/80; font-size: max(16px, .875rem); }
    .field:hover:not(:disabled) { @apply border-primary-500; }
    .field:focus { @apply border-brand outline-none; box-shadow: var(--ring); }
    .field[aria-invalid="true"] { @apply border-error-600 bg-error-500/5; }
    .field:disabled, .field[aria-disabled="true"] { @apply cursor-not-allowed border-line bg-soft text-muted; }

    /* ---------- الأزرار (حلقة التركيز من :focus-visible الموحّد) ---------- */
    .btn { @apply inline-flex min-h-[2.75rem] select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-bold leading-5 transition-colors disabled:pointer-events-none disabled:opacity-50; touch-action: manipulation; }
    .btn-sm { @apply px-3 py-1.5 text-xs sm:min-h-[2.25rem]; }
    .btn-primary { @apply bg-primary-500 text-white shadow-lg shadow-primary-500/25 hover:bg-primary-600; }
    .btn-outline { @apply border border-line-strong/60 bg-card text-ink hover:bg-soft; }
    .btn-danger  { @apply bg-error-600 text-white hover:bg-error-700; }
    .btn-accent  { @apply bg-accent-500 text-onaccent hover:bg-accent-600; }

    /* ---------- القوائم المنسدلة ---------- */
    .menu { @apply z-50 overflow-hidden rounded-2xl border border-line bg-card shadow-pop;
            position: fixed; inset-inline: .75rem; top: calc(var(--topbar-h) + .5rem); }
    @media (min-width: 640px) {
      .menu { position: absolute; inset-inline-start: auto; inset-inline-end: 0; top: 100%; margin-top: .5rem; }
    }
    .menu-item { @apply flex min-h-[2.75rem] w-full items-center gap-3 px-4 py-2.5 text-start text-sm font-bold text-ink transition-colors hover:bg-soft focus:bg-soft focus:outline-none disabled:cursor-not-allowed disabled:opacity-40; }
    .menu-item:focus-visible { box-shadow: inset 0 0 0 2px rgb(var(--brand)); }

    /* ---------- قائمة الاختيار المخصصة (Select-only Combobox) ---------- */
    .combo-list { @apply absolute z-50 w-full overflow-y-auto rounded-xl border border-line bg-card p-1.5 shadow-pop; max-height: 14rem; }
    .combo-option { @apply flex min-h-[2.75rem] w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-4 py-2 text-start text-sm font-medium text-ink transition-colors hover:bg-soft sm:min-h-[2.5rem]; }
    .combo-option.is-active   { @apply bg-soft; box-shadow: inset 0 0 0 2px rgb(var(--brand) / .5); }
    .combo-option.is-selected { @apply bg-primary-500/10 font-bold text-brand; }
    .scroll-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgb(var(--line-strong)); border-radius: 9999px; }

    /* ---------- SweetAlert2 ---------- */
    .firob-swal { font-family: inherit !important; border-radius: 1rem !important; background: rgb(var(--card)) !important; color: rgb(var(--ink)) !important; border: 1px solid rgb(var(--line)) !important; }
    .firob-swal .swal2-title { color: rgb(var(--ink)) !important; font-size: .9375rem !important; }
    .firob-swal .swal2-html-container { color: rgb(var(--muted)) !important; }
    .firob-swal .swal2-timer-progress-bar { background: rgb(var(--brand) / .5) !important; }
    .firob-toast { box-shadow: 0 20px 50px -12px rgba(7,60,76,.45) !important; }

    /* ---------- ألوان سلاسل الرسم — زوج مُتحقَّق منه آليًا (تمييز عمى الألوان + تباين ≥ 3:1) ---------- */
    :root { --series1: 14 128 161; --series2: 180 83 9; }        /* #0E80A1 / #B45309 — فاتح */
    .dark { --series1: 21 151 184; --series2: 217 119 6; }       /* #1597B8 / #D97706 — داكن */
    .bg-series1 { background-color: rgb(var(--series1)); } .bg-series2 { background-color: rgb(var(--series2)); }
    .fill-series1 { fill: rgb(var(--series1)); } .fill-series2 { fill: rgb(var(--series2)); }
    .stroke-series1 { stroke: rgb(var(--series1)); } .stroke-series2 { stroke: rgb(var(--series2)); }
    .chart-grid { stroke: rgb(var(--line)); stroke-width: 1; }
    .chart-cross { stroke: rgb(var(--line-strong)); stroke-width: 1; stroke-dasharray: 3 3; }
    .chart-ring { stroke: rgb(var(--card)); stroke-width: 2; }
    .chart-text { fill: rgb(var(--muted)); font-size: 11px; font-weight: 700; font-family: inherit; }
    .chart-tip { @apply pointer-events-none absolute top-0 z-10 min-w-[11rem] -translate-x-1/2 rounded-xl border border-line bg-card px-3 py-2 text-xs shadow-pop; }
    .chart-card { @apply min-w-0 rounded-2xl border border-line bg-card p-4 shadow-card sm:p-5 flex flex-col; }
    .dark .chart-card { box-shadow: 0 24px 48px -24px rgb(0 0 0 / .7); }
    .swatch { @apply inline-block h-2.5 w-2.5 shrink-0 rounded-full; }
    .kpi-track { @apply flex h-2 w-full overflow-hidden rounded-full bg-line; }

    /* ---------- شارة التحذير / المقيّد ---------- */
    .badge-warning { @apply bg-warning-500/15 text-warn; }

    /* ---------- مقطع أزرار (radiogroup) ---------- */
    .seg { @apply inline-flex items-center gap-1 rounded-xl border border-line bg-card p-1; }
    .seg-btn { @apply inline-flex min-h-[2.5rem] items-center gap-1.5 rounded-lg px-3 text-sm font-bold text-muted transition-colors hover:text-ink; }
    .seg-btn[aria-checked="true"] { @apply bg-primary-500 text-white shadow hover:text-white; }

    /* ---------- النافذة + كتل الشيفرة ---------- */
    .modal-panel { @apply relative flex max-h-[92dvh] w-full max-w-2xl flex-col overflow-hidden rounded-2xl border border-line bg-card shadow-pop; }
    .code-block  { @apply max-h-56 overflow-auto rounded-xl border border-line bg-page/60 p-3.5 font-mono text-[11px] leading-6 text-ink; }

    /* ---------- مقياس الحصة ---------- */
    .quota-track { @apply h-2 w-full overflow-hidden rounded-full bg-line; }
    .quota-fill { @apply h-full rounded-full transition-[width] duration-700; }
  }
</style>

<body x-data="shell()"
      @keydown.escape.window="closeAll()"
      @keydown.window.ctrl.k.prevent="focusSearch()" @keydown.window.meta.k.prevent="focusSearch()"
      @scroll.window.passive="openMenuId !== null && closeMenu()" @resize.window="openMenuId !== null && closeMenu()"
      :class="{ 'overflow-hidden': mobileNav && mobile }">

<a href="#main" class="sr-only z-[100] rounded-xl bg-accent-500 px-4 py-2 font-bold text-onaccent focus:not-sr-only focus:fixed focus:start-4 focus:top-4" x-text="t('skipLink')">تخطَّ إلى المحتوى</a>

<!-- منطقة إعلانات قارئ الشاشة -->
<p class="sr-only" role="status" aria-live="polite" aria-atomic="true" x-text="live"></p>

<div class="app-h flex w-full">

  <!-- ================= Backdrop (الجوال) ================= -->

           mobileNav ? 'translate-x-0' : 'max-lg:invisible max-lg:ltr:-translate-x-full max-lg:rtl:translate-x-full',
           collapsed ? 'lg:w-20' : 'lg:w-72'
         ]"
         :aria-hidden="(mobile && !mobileNav) ? 'true' : null" :inert="mobile && !mobileNav">

    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-4" :class="!expanded && 'lg:justify-center lg:px-0'">
      <a href="TenantDashboard.html" class="inline-flex min-w-0 flex-1 items-center gap-3 rounded-lg" :class="!expanded && 'lg:flex-none lg:justify-center'">
        <img x-show="expanded" src="../asset/images/firob-logo.png" alt="FirOb" width="124" height="32" decoding="async"
             class="block h-8 w-auto max-w-[8.5rem] shrink-0 object-contain dark:brightness-125">
        <img x-show="!expanded" x-cloak src="../asset/images/firob-favicon.png" alt="FirOb" width="36" height="36" decoding="async"
             class="block h-9 w-9 shrink-0 object-contain">
        <span class="min-w-0 flex-1 border-s border-line ps-3" x-show="expanded">
          <span class="block truncate text-xs font-bold text-muted" x-text="t('appSubtitle')"></span>
        </span>
      </a>
      <button type="button" class="icon-btn lg:hidden" @click="closeMobileNav()" :aria-label="t('closeMenu')">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <nav class="flex-1 space-y-6 overflow-y-auto overflow-x-hidden px-3 py-5" :aria-label="t('mainNav')">
      <template x-for="group in nav" :key="group.group">
        <div>
          <p class="mb-2 truncate px-3 text-xs font-extrabold tracking-wide text-muted" x-show="expanded" x-text="t('navGroups.' + group.group)" :id="'ng-' + group.group"></p>
          <div class="mx-auto mb-2 h-px w-8 bg-line" x-show="!expanded" aria-hidden="true"></div>
          <ul class="space-y-1" role="list" :aria-labelledby="expanded ? 'ng-' + group.group : null">
            <template x-for="item in group.items" :key="item.key">

                <a :href="item.href" class="nav-link relative"
                   :aria-current="active === item.key ? 'page' : null"

                        :class="active === item.key ? 'bg-white/20 text-white' : (item.tone === 'primary' ? 'bg-primary-500/15 text-brand' : 'bg-accent-500 text-onaccent')"
                        x-text="navCount(item)"></span>
                  <span x-show="navCount(item) && !expanded" x-cloak class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full ring-2 ring-card"
                        :class="item.tone === 'primary' ? 'bg-primary-500' : 'bg-accent-500'" aria-hidden="true"></span>

            </template>
          </ul>
        </div>
      </template>
    </nav>

    <div class="hidden shrink-0 border-t border-line p-3 lg:block">
      <button type="button" class="icon-btn w-full" :class="expanded && 'justify-start gap-3 px-3'" @click="toggleSidebar()"

        <i class="fa-solid fa-angles-left transition-transform" :class="collapsed ? 'ltr:-scale-x-100' : 'rtl:-scale-x-100'" aria-hidden="true"></i>
        <span class="truncate text-sm font-bold" x-show="expanded" x-text="t('collapseSidebar')"></span>
      </button>
    </div>
  </aside>

  <!-- ================= العمود الرئيسي ================= -->
  <div class="flex min-w-0 flex-1 flex-col">

        <button type="button" x-ref="navToggle" class="icon-btn lg:hidden" @click="toggleSidebar()" aria-controls="sidebar"

        </button>
        <button type="button" class="icon-btn hidden lg:inline-grid" @click="toggleSidebar()" aria-controls="sidebar"

          <!-- الحساب -->
          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" x-ref="profileBtn" class="flex min-h-[2.75rem] max-w-[14rem] items-center gap-2 rounded-xl p-1 transition-colors hover:bg-soft md:pe-2"

              <span class="sr-only md:hidden" x-text="t('accountMenu')"></span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="me.name"></span>
                <span class="block truncate text-xs text-muted" x-text="t('roleTenantAdmin')"></span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted transition-transform md:block" :class="profileOpen && 'rotate-180'" aria-hidden="true"></i>
            </button>
            <nav id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-60" :aria-label="t('accountMenu')">
              <ul role="list" class="py-1">
                <li><a href="../common/profile.html" class="menu-item"><i class="fa-regular fa-user w-4 text-muted" aria-hidden="true"></i> <span x-text="t('profile')"></span></a></li>
                <li><a href="TenantSettingsForm.html" class="menu-item"><i class="fa-solid fa-gear w-4 text-muted" aria-hidden="true"></i> <span x-text="t('navItems.orgSettings')"></span></a></li>
                <li><a href="../common/errors.html" class="menu-item"><i class="fa-solid fa-triangle-exclamation w-4 text-muted" aria-hidden="true"></i> <span x-text="t('statusErrors')"></span></a></li>
                <li class="border-t border-line"><a href="../auth/login.html" class="menu-item !text-danger"><i class="fa-solid fa-arrow-right-from-bracket w-4 rtl:-scale-x-100" aria-hidden="true"></i> <span x-text="t('logout')"></span></a></li>
              </ul>
            </nav>
          </div>

      <form id="mobile-search" role="search" x-cloak x-show="searchOpen" x-transition.opacity class="border-t border-line px-3 py-2 md:hidden" @submit.prevent>
        <label for="q-m" class="sr-only" x-text="t('searchPlaceholder')"></label>
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q-m" x-ref="mobileSearch" type="search" enterkeyhint="search" :placeholder="t('searchPlaceholder')"
                 class="h-11 w-full rounded-xl border border-line-strong/60 bg-field pe-3 ps-10 text-base text-ink placeholder:text-muted/80 focus:border-brand focus:outline-none focus:shadow-[var(--ring)]">
        </div>
      </form>

      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="t('breadcrumbLabel')">
          <ol class="flex items-center gap-2" role="list">
            <li><a href="TenantDashboard.html" class="rounded hover:text-brand hover:underline" x-text="t('breadcrumb.home')"></a></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right text-[10px] rtl:-scale-x-100"></i></li>
            <li x-text="t('breadcrumb.org')"></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right text-[10px] rtl:-scale-x-100"></i></li>
            <li><span class="text-ink" aria-current="page" x-text="t('navItems.aiAnalytics')"></span></li>
          </ol>

    <!-- ================= المحتوى الرئيسي — ADM-08: تحليلات استهلاك الذكاء الاصطناعي ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">

      <!-- العنوان + التصدير -->
      <div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-end sm:justify-between">
        <div class="min-w-0">
          <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="t('ai.title')">تحليلات استهلاك الذكاء الاصطناعي</h1>
          <p class="mt-1 max-w-3xl text-sm text-muted sm:text-base" x-text="t('ai.subtitle')"></p>
        </div>
        <button type="button" class="btn btn-outline shrink-0" :disabled="!rows.length" @click="exportCsv()">
          <i class="fa-solid fa-file-csv" aria-hidden="true"></i><span x-text="tf('ai.exportN', { n: fmt(rows.length) })"></span>
        </button>
      </div>

      <!-- ================= حصة التوكنز الشهرية + التوقّع ================= -->
      <section class="panel p-4 sm:p-5" aria-labelledby="quota-title">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
          <div class="flex min-w-0 items-start gap-4">
            <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl" :class="quotaTone.iconBg" aria-hidden="true"><i class="fa-solid fa-gauge-high text-xl"></i></span>
            <div class="min-w-0">
              <h2 id="quota-title" class="font-extrabold text-ink" x-text="t('ai.quota.title')"></h2>
              <p class="mt-0.5 text-sm text-muted" x-text="tf('ai.quota.caption', { month: fmtMonth(Date.now()) })"></p>
            </div>
          </div>
          <ul class="flex flex-wrap items-center gap-1.5 lg:shrink-0" role="list" :aria-label="t('ai.quota.legendTitle')">
            <li class="badge badge-primary"><i class="fa-solid fa-circle-check text-[10px]" aria-hidden="true"></i><span x-text="t('ai.quota.legendNormal')"></span></li>
            <li class="badge badge-warning"><i class="fa-solid fa-triangle-exclamation text-[10px]" aria-hidden="true"></i><span x-text="t('ai.quota.legendWarning')"></span></li>
            <li class="badge badge-danger"><i class="fa-solid fa-circle-xmark text-[10px]" aria-hidden="true"></i><span x-text="t('ai.quota.legendExceeded')"></span></li>
          </ul>
        </div>

        <div class="mt-4">
          <div class="flex flex-wrap items-end justify-between gap-2">
            <p class="text-2xl font-extrabold tabular-nums">
              <bdi dir="ltr"><span x-text="fmt(quota.used)"></span> <span class="text-base font-bold text-muted" x-text="'/ ' + fmt(quota.limit)"></span></bdi>
              <span class="ms-1 text-sm font-bold text-muted" x-text="t('ai.tokensWord')"></span>
            </p>
            <span class="badge" :class="quotaTone.badge"><i class="fa-solid text-[10px]" :class="quotaTone.icon" aria-hidden="true"></i><span x-text="tf('ai.quota.usedPct', { v: fmt(quotaPct) })"></span></span>
          </div>
          <div class="quota-track mt-2.5" role="progressbar" aria-valuemin="0" :aria-valuemax="quota.limit" :aria-valuenow="quota.used"
               aria-labelledby="quota-title" :aria-valuetext="tf('ai.quota.valueText', { used: fmt(quota.used), limit: fmt(quota.limit), pct: fmt(quotaPct) })">
            <div class="quota-fill" :class="quotaTone.fill" :style="'width:' + Math.min(100, quotaPct) + '%'"></div>
          </div>
          <!-- التوقّع: متى تنفد الحصة بمعدل آخر 7 أيام -->
          <div class="mt-3 grid gap-2 text-xs sm:grid-cols-3">
            <p class="flex items-start gap-1.5 font-bold" :class="forecast.beforeReset ? 'text-warn' : 'text-ok'">
              <i class="fa-solid mt-0.5" :class="forecast.beforeReset ? 'fa-triangle-exclamation' : 'fa-circle-check'" aria-hidden="true"></i>
              <span x-text="forecast.beforeReset ? tf('ai.quota.runsOut', { date: fmtDate(forecast.date), n: fmt(forecast.daysEarly) }) : t('ai.quota.enough')"></span>
            </p>
            <p class="text-muted"><i class="fa-solid fa-chart-line me-1" aria-hidden="true"></i><span x-text="tf('ai.quota.perDay', { n: fmtCompact(forecast.perDay) })"></span></p>
            <p class="text-muted"><i class="fa-regular fa-calendar me-1" aria-hidden="true"></i><span x-text="tf('ai.quota.resetOn', { date: fmtDate(quota.resetAt), n: fmt(quota.daysToReset) })"></span></p>
          </div>
        </div>
      </section>

      <!-- ================= الفلاتر (صف واحد فوق المؤشرات والرسوم — تؤثر على كل ما تحتها) ================= -->
      <section class="panel space-y-3 p-3.5 sm:p-4" aria-labelledby="filters-title">
        <h2 id="filters-title" class="sr-only" x-text="t('ai.toolbar.title')"></h2>
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center">
          <form role="search" class="relative min-w-0 flex-1" @submit.prevent>
            <label for="ai-q" class="sr-only" x-text="t('ai.toolbar.searchPlaceholder')"></label>
            <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
            <input id="ai-q" x-ref="aiSearch" type="search" x-model.debounce.300ms="filters.query" autocomplete="off" enterkeyhint="search" :placeholder="t('ai.toolbar.searchPlaceholder')"
                   class="h-11 w-full min-w-0 rounded-xl border border-line-strong/60 bg-field pe-3 ps-10 text-base text-ink placeholder:text-muted/80 focus:border-brand focus:outline-none focus:shadow-[var(--ring)]">
          </form>

          <div class="seg shrink-0 overflow-x-auto" role="radiogroup" :aria-label="t('ai.toolbar.statusLabel')" @keydown="radioKey($event, STATUSES, 'status', 'st-')">
            <template x-for="s in STATUSES" :key="s">
              <button type="button" role="radio" class="seg-btn whitespace-nowrap" :id="'st-' + s" :aria-checked="(filters.status === s).toString()" :tabindex="filters.status === s ? 0 : -1"
                      @click="filters.status = s">
                <i x-show="s !== 'all'" class="fa-solid text-xs" :class="statusMeta(s).icon" aria-hidden="true"></i>
                <span x-text="s === 'all' ? t('ai.toolbar.statusAll') : t('ai.status.' + s)"></span>
              </button>
            </template>
          </div>

          <button type="button" class="btn btn-outline shrink-0" :disabled="!filtersActive" @click="clearFilters(true)">
            <i class="fa-solid fa-filter-circle-xmark" aria-hidden="true"></i><span x-text="t('ai.toolbar.clearFilters')"></span>
          </button>
        </div>

        <div class="grid grid-cols-1 gap-2.5 sm:grid-cols-3">
          <template x-for="f in [
              { id: 'ai-feature', label: 'ai.toolbar.featureLabel', key: 'feature' },
              { id: 'ai-model',   label: 'ai.toolbar.modelLabel',   key: 'model' },
              { id: 'ai-range',   label: 'ai.toolbar.rangeLabel',   key: 'dateRange' } ]" :key="f.id">
            <div class="relative min-w-0"
                 x-data="selectDropdown({ id: f.id, options: () => filterOptions(f.key), get: () => filters[f.key], set: (v) => filters[f.key] = v })"
                 @click.outside="closeList()">
              <span :id="f.id + '-label'" class="mb-1 block text-xs font-bold text-muted" x-text="t(f.label)"></span>
              <button type="button" :id="f.id" x-ref="btn" role="combobox" aria-haspopup="listbox" :aria-labelledby="f.id + '-label ' + f.id"
                      :aria-expanded="open.toString()" :aria-controls="f.id + '-list'" :aria-activedescendant="activeId"
                      class="field flex w-full items-center justify-between gap-2 text-start font-bold" :class="filters[f.key] !== DEFAULTS[f.key] && '!border-brand'"
                      @click="toggleList()" @keydown="onKey($event)">
                <span class="truncate" x-text="triggerLabel"></span>
                <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
              </button>
              <ul x-show="open" x-cloak x-ref="list" :id="f.id + '-list'" role="listbox" :aria-labelledby="f.id + '-label'" tabindex="-1"
                  x-transition.opacity.duration.150ms class="combo-list scroll-thin" :class="dropUp ? 'bottom-full mb-1.5' : 'top-full mt-1.5'">
                <template x-for="(item, idx) in items" :key="item.value">
                  <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                      class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                      @click="choose(item)" @mousemove="active = idx">
                    <span class="truncate" x-text="item.label"></span>
                    <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </div>

        <!-- نطاق مخصّص -->
        <div x-show="filters.dateRange === 'custom'" x-cloak class="grid grid-cols-1 gap-2.5 border-t border-line pt-3 sm:grid-cols-2 lg:w-2/3">
          <div>
            <label for="ai-from" class="label" x-text="t('ai.toolbar.from')"></label>
            <input id="ai-from" type="date" class="field" dir="ltr" x-model="filters.customFrom" :min="minDate" :max="filters.customTo || maxDate" :aria-invalid="(!!rangeError).toString()">
          </div>
          <div>
            <label for="ai-to" class="label" x-text="t('ai.toolbar.to')"></label>
            <input id="ai-to" type="date" class="field" dir="ltr" x-model="filters.customTo" :min="filters.customFrom || minDate" :max="maxDate" :aria-invalid="(!!rangeError).toString()">
          </div>
          <p x-show="rangeError" class="err sm:col-span-2" role="alert"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="rangeError ? t('ai.toolbar.' + rangeError) : ''"></span></p>
        </div>
        <p class="text-xs font-bold text-muted" aria-live="polite" x-text="loading ? t('ai.updating') : tf('ai.scopeNote', { n: fmt(rows.length), range: rangeLabel })"></p>
      </section>

      <!-- ================= المؤشرات (محسوبة من النتائج المصفّاة) ================= -->
      <section aria-labelledby="kpi-title" :aria-busy="loading.toString()">
        <h2 id="kpi-title" class="sr-only" x-text="t('ai.kpi.title')"></h2>
        <ul class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4 lg:grid-cols-4 transition-opacity" :class="loading && 'opacity-60'" role="list">
          <li class="panel flex h-full flex-col justify-between p-4 sm:p-5">
            <div class="flex items-start justify-between gap-3">
              <h3 class="min-w-0 text-sm font-bold text-muted" x-text="t('ai.kpi.totalTokens')"></h3>
              <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-primary-500/15 text-brand" aria-hidden="true"><i class="fa-solid fa-layer-group"></i></span>
            </div>
            <div>
              <p class="mt-2 text-2xl font-extrabold tabular-nums sm:text-3xl" :title="fmt(stats.tokens)" x-text="fmtCompact(stats.tokens)"></p>
              <div class="kpi-track mt-3 gap-0.5" aria-hidden="true">
                <div class="bg-series1" :style="'width:' + stats.promptPct + '%'"></div>
                <div class="bg-series2" :style="'width:' + (100 - stats.promptPct) + '%'"></div>
              </div>
              <p class="mt-1.5 flex flex-wrap gap-x-3 text-xs font-bold text-muted">
                <span class="inline-flex items-center gap-1"><span class="swatch bg-series1" aria-hidden="true"></span><span x-text="'Prompt ' + fmt(stats.promptPct) + '%'"></span></span>
                <span class="inline-flex items-center gap-1"><span class="swatch bg-series2" aria-hidden="true"></span><span x-text="'Completion ' + fmt(100 - stats.promptPct) + '%'"></span></span>
              </p>
            </div>
          </li>
          <li class="panel flex h-full flex-col justify-between p-4 sm:p-5">
            <div class="flex items-start justify-between gap-3">
              <h3 class="min-w-0 text-sm font-bold text-muted" x-text="t('ai.kpi.totalCost')"></h3>
              <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-success-500/15 text-ok" aria-hidden="true"><i class="fa-solid fa-sack-dollar"></i></span>
            </div>
            <div>
              <p class="mt-2 text-2xl font-extrabold tabular-nums sm:text-3xl" x-text="fmtMoney(stats.cost, 2)"></p>
              <p class="mt-1.5 text-xs font-bold text-muted" x-text="tf('ai.kpi.avgCostPerCall', { v: fmtMoney(stats.avgCost, 4), n: fmt(stats.calls) })"></p>
              <p class="mt-0.5 text-[11px] text-muted" x-text="t('ai.kpi.costNote')"></p>
            </div>
          </li>
          <li class="panel flex h-full flex-col justify-between p-4 sm:p-5">
            <div class="flex items-start justify-between gap-3">
              <h3 class="min-w-0 text-sm font-bold text-muted" x-text="t('ai.kpi.mostActiveFeature')"></h3>
              <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-accent-500/25 text-onaccent dark:text-accent-500" aria-hidden="true"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
            </div>
            <div>
              <p class="mt-2 truncate text-xl font-extrabold sm:text-2xl" x-text="stats.topFeature ? t('ai.features.' + stats.topFeature.key) : '—'"></p>
              <p class="mt-1.5 text-xs font-bold text-muted" x-text="stats.topFeature ? tf('ai.kpi.mostActiveShare', { v: fmt(stats.topFeature.pct) }) : ''"></p>
            </div>
          </li>
          <li class="panel flex h-full flex-col justify-between p-4 sm:p-5">
            <div class="flex items-start justify-between gap-3">
              <h3 class="min-w-0 text-sm font-bold text-muted" x-text="t('ai.kpi.activeUsers')"></h3>
              <span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-info/15 text-info" aria-hidden="true"><i class="fa-solid fa-users"></i></span>
            </div>
            <div>
              <p class="mt-2 text-2xl font-extrabold tabular-nums sm:text-3xl"><bdi dir="ltr"><span x-text="fmt(stats.users)"></span> <span class="text-base font-bold text-muted" x-text="'/ ' + fmt(USERS.length)"></span></bdi></p>
              <p class="mt-1.5 text-xs font-bold text-muted" x-text="tf('ai.kpi.failRate', { v: fmt(stats.failPct), t: fmt(stats.throttledPct) })"></p>
            </div>
          </li>
        </ul>
      </section>

      <!-- ================= الرسوم البيانية ================= -->
      <section class="grid grid-cols-1 gap-3 sm:gap-4 xl:grid-cols-3" aria-labelledby="charts-title" :aria-busy="loading.toString()">
        <h2 id="charts-title" class="sr-only" x-text="t('ai.charts.title')"></h2>

        <!-- اتجاه الاستهلاك -->
        <figure class="chart-card xl:col-span-2" aria-labelledby="trend-title">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0">
              <h3 id="trend-title" class="font-extrabold" x-text="t('ai.charts.trendTitle')"></h3>
              <p class="text-xs text-muted" x-text="buckets.hourly ? t('ai.charts.trendHourly') : t('ai.charts.trendDaily')"></p>
            </div>
            <ul class="flex flex-wrap gap-3" role="list" :aria-label="t('ai.charts.legend')">
              <li class="inline-flex items-center gap-1.5 text-xs font-bold text-muted"><span class="h-0.5 w-4 rounded bg-series1" aria-hidden="true"></span>Prompt</li>
              <li class="inline-flex items-center gap-1.5 text-xs font-bold text-muted"><span class="h-0.5 w-4 rounded bg-series2" aria-hidden="true"></span>Completion</li>
            </ul>
          </div>

          <!-- الرسم ومحوره معًا داخل LTR: الأقدم يسارًا دائمًا (المحور لا ينقلب عن البيانات) -->
          <div dir="ltr" class="relative mt-3" :class="loading && 'opacity-60'">
            <div x-show="!buckets.list.length || !stats.tokens" class="grid h-56 place-items-center text-sm text-muted" x-text="t('ai.charts.noData')"></div>
            <div x-show="buckets.list.length && stats.tokens" class="relative">
              <svg x-ref="trendSvg" viewBox="0 0 600 220" class="block h-auto w-full touch-none outline-none" tabindex="0" role="img"
                   :aria-label="trendSummary" aria-describedby="trend-kbd" x-html="trendSvg"
                   @pointermove="hoverAt($event)" @pointerleave="hi = null" @focus="hi = hi ?? buckets.list.length - 1" @blur="hi = null"
                   @keydown.arrow-left.prevent="hi = Math.max(0, (hi ?? 0) - 1)" @keydown.arrow-right.prevent="hi = Math.min(buckets.list.length - 1, (hi ?? -1) + 1)"
                   @keydown.home.prevent="hi = 0" @keydown.end.prevent="hi = buckets.list.length - 1"></svg>
              <!-- تلميح القيم -->
              <div x-show="hi !== null && buckets.list[hi]" x-cloak class="chart-tip" :style="tipStyle" role="status" :dir="locale === 'ar' ? 'rtl' : 'ltr'">
                <template x-if="hi !== null && buckets.list[hi]">
                  <div>
                    <p class="mb-1 font-extrabold text-ink" x-text="bucketLabel(buckets.list[hi], true)"></p>
                    <p class="flex items-center justify-between gap-4"><span class="inline-flex items-center gap-1.5"><span class="swatch bg-series1" aria-hidden="true"></span>Prompt</span><b class="tabular-nums" x-text="fmt(buckets.list[hi].prompt)"></b></p>
                    <p class="flex items-center justify-between gap-4"><span class="inline-flex items-center gap-1.5"><span class="swatch bg-series2" aria-hidden="true"></span>Completion</span><b class="tabular-nums" x-text="fmt(buckets.list[hi].completion)"></b></p>
                    <p class="mt-1 border-t border-line pt-1 text-muted" x-text="tf('ai.charts.tipCalls', { n: fmt(buckets.list[hi].calls), c: fmtMoney(buckets.list[hi].cost, 2) })"></p>
                  </div>
                </template>
              </div>
            </div>
          </div>
          <p id="trend-kbd" class="sr-only" x-text="t('ai.charts.kbdHint')"></p>

          <details class="mt-3 rounded-xl border border-line">
            <summary class="cursor-pointer select-none rounded-xl px-3 py-2 text-xs font-bold text-brand" x-text="t('ai.charts.asTable')"></summary>
            <div class="max-h-64 overflow-auto border-t border-line scroll-thin">
              <table class="w-full text-xs">
                <caption class="sr-only" x-text="t('ai.charts.trendTitle')"></caption>
                <thead class="sticky top-0 bg-soft"><tr>
                  <th scope="col" class="px-3 py-2 text-start" x-text="buckets.hourly ? t('ai.charts.colHour') : t('ai.charts.colDay')"></th>
                  <th scope="col" class="px-3 py-2 text-end">Prompt</th><th scope="col" class="px-3 py-2 text-end">Completion</th>
                  <th scope="col" class="px-3 py-2 text-end" x-text="t('ai.charts.colCalls')"></th>
                </tr></thead>
                <tbody class="divide-y divide-line">
                  <template x-for="b in buckets.list" :key="b.t">
                    <tr><th scope="row" class="px-3 py-1.5 text-start font-bold" x-text="bucketLabel(b, true)"></th>
                      <td class="px-3 py-1.5 text-end tabular-nums" x-text="fmt(b.prompt)"></td><td class="px-3 py-1.5 text-end tabular-nums" x-text="fmt(b.completion)"></td>
                      <td class="px-3 py-1.5 text-end tabular-nums" x-text="fmt(b.calls)"></td></tr>
                  </template>
                </tbody>
              </table>
            </div>
          </details>
        </figure>

        <!-- التوزيع حسب الميزة: قياس مقدار → لون واحد -->
        <figure class="chart-card" aria-labelledby="feat-title">
          <h3 id="feat-title" class="font-extrabold" x-text="t('ai.charts.featureTitle')"></h3>
          <p class="text-xs text-muted" x-text="t('ai.charts.featureSubtitle')"></p>
          <ul class="mt-4 flex-1 space-y-3.5" role="list" :class="loading && 'opacity-60'">
            <template x-for="f in stats.byFeature" :key="f.key">
              <li>
                <button type="button" class="w-full rounded-lg text-start" @click="filters.feature = filters.feature === f.key ? 'all' : f.key"
                        :aria-pressed="(filters.feature === f.key).toString()" :aria-label="t('ai.features.' + f.key) + ': ' + fmt(f.pct) + '% — ' + t('ai.charts.filterBy')">
                  <span class="mb-1 flex items-center justify-between gap-2 text-xs font-bold">
                    <span class="truncate" :class="filters.feature === f.key && 'text-brand'" x-text="t('ai.features.' + f.key)"></span>
                    <span class="shrink-0 tabular-nums text-muted"><span x-text="fmt(f.pct) + '%'"></span> · <span x-text="fmtCompact(f.tokens)"></span></span>
                  </span>
                  <span class="kpi-track block" aria-hidden="true"><span class="block h-full rounded-full bg-brand" :style="'width:' + Math.max(f.pct, 1.5) + '%'"></span></span>
                </button>
              </li>
            </template>
          </ul>
          <p x-show="!stats.byFeature.length" class="py-10 text-center text-sm text-muted" x-text="t('ai.charts.noData')"></p>
        </figure>
      </section>

      <!-- ================= سجلات الاستخدام ================= -->
      <section class="panel" aria-labelledby="ai-table-title" :aria-busy="loading.toString()">
        <div class="flex flex-wrap items-end justify-between gap-2 border-b border-line p-4 sm:p-5">
          <div class="min-w-0">
            <h2 id="ai-table-title" tabindex="-1" class="rounded font-extrabold focus:outline-none" x-text="t('ai.table.title')"></h2>
            <p class="text-xs text-muted" x-text="t('ai.table.subtitle')"></p>
          </div>
          <p class="text-xs font-bold text-muted" x-text="tf('ai.table.resultsN', { n: fmt(rows.length) })"></p>
        </div>

        <!-- تحميل -->
        <div x-show="tableState === 'loading'" x-cloak class="space-y-2 p-4" aria-hidden="true">
          <template x-for="i in 5" :key="i"><div class="h-14 animate-pulse rounded-xl bg-line/60"></div></template>
        </div>
        <p x-show="tableState === 'loading'" x-cloak class="sr-only" x-text="t('ai.table.loadingTitle')"></p>

        <!-- فارغ -->
        <div x-show="tableState === 'empty'" x-cloak class="py-14 text-center">
          <span class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-full bg-primary-500/15 text-brand" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>
          <p class="font-bold" x-text="t('ai.table.emptyTitle')"></p>
          <p class="mt-1 text-xs text-muted" x-text="t('ai.table.emptyDesc')"></p>
          <button type="button" class="btn btn-outline btn-sm mt-3" @click="clearFilters(true)" x-text="t('ai.toolbar.clearFilters')"></button>
        </div>

        <div x-show="tableState === 'data'">
          <!-- بطاقات — جوال/تابلت -->
          <ul class="grid grid-cols-1 gap-3 p-3 sm:grid-cols-2 sm:p-4 xl:hidden" role="list">
            <template x-for="r in paged" :key="r.id">
              <li class="min-w-0 rounded-xl border border-line p-4">
                <div class="flex items-start justify-between gap-2">
                  <h3 class="min-w-0 truncate text-sm font-extrabold" x-text="t('ai.features.' + r.feature)"></h3>
                  <span class="badge shrink-0" :class="statusMeta(r.status).badge"><i class="fa-solid text-[10px]" :class="statusMeta(r.status).icon" aria-hidden="true"></i><span x-text="t('ai.status.' + r.status)"></span></span>
                </div>
                <div class="mt-2.5 flex items-center gap-2.5">
                  <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-soft text-xs font-extrabold text-brand" aria-hidden="true" x-text="initials(r.user.name)"></span>
                  <div class="min-w-0">
                    <p class="truncate font-bold leading-5" x-text="r.user.name"></p>
                    <p class="text-xs text-muted" x-text="t('ai.roles.' + r.user.role)"></p>
                  </div>
                </div>
                <dl class="mt-2.5 grid grid-cols-2 gap-2 border-t border-line pt-2.5 text-xs">
                  <div><dt class="text-muted" x-text="t('ai.table.colProvider')"></dt><dd class="mt-0.5 truncate font-bold"><bdi dir="ltr" x-text="modelLabel(r.model)"></bdi></dd></div>
                  <div><dt class="text-muted" x-text="t('ai.table.colTokens')"></dt><dd class="mt-0.5 font-bold tabular-nums" x-text="fmt(r.prompt + r.completion)"></dd></div>
                  <div><dt class="text-muted" x-text="t('ai.table.colTimestamp')"></dt><dd class="mt-0.5 font-bold"><time :datetime="iso(r.at)" :title="fmtFull(r.at)" x-text="rel(r.at)"></time></dd></div>
                  <div><dt class="text-muted" x-text="t('ai.table.colCost')"></dt><dd class="mt-0.5 font-bold tabular-nums" x-text="fmtMoney(r.cost, 4)"></dd></div>
                </dl>
                <button type="button" class="btn btn-outline btn-sm mt-3 w-full" @click="openDetails(r, $el)" :aria-label="t('ai.table.viewDetails') + ': ' + r.id">
                  <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span x-text="t('ai.table.viewDetails')"></span>
                </button>
              </li>
            </template>
          </ul>

          <!-- جدول — سطح المكتب (أعمدة ثابتة: لا تمرير أفقي) -->
          <div class="hidden xl:block">
            <table class="w-full table-fixed text-sm">
              <caption class="sr-only" x-text="t('ai.table.title') + ' — ' + tf('ai.table.pageOf', { n: fmt(page), total: fmt(pages) })"></caption>
              <colgroup><col class="w-[14%]"><col class="w-[20%]"><col class="w-[17%]"><col class="w-[19%]"><col class="w-[12%]"><col class="w-[11%]"><col class="w-[7%]"></colgroup>
              <thead class="bg-soft text-xs text-ink">
                <tr>
                  <th scope="col" class="px-5 py-3 text-start font-extrabold" x-text="t('ai.table.colTimestamp')"></th>
                  <th scope="col" class="px-3 py-3 text-start font-extrabold" x-text="t('ai.table.colUser')"></th>
                  <th scope="col" class="px-3 py-3 text-start font-extrabold" x-text="t('ai.table.colFeature')"></th>
                  <th scope="col" class="px-3 py-3 text-start font-extrabold" x-text="t('ai.table.colProvider')"></th>
                  <th scope="col" class="px-3 py-3 text-end font-extrabold" x-text="t('ai.table.colTokens')"></th>
                  <th scope="col" class="px-3 py-3 text-start font-extrabold" x-text="t('ai.table.colStatus')"></th>
                  <th scope="col" class="px-5 py-3 text-end font-extrabold"><span class="sr-only" x-text="t('ai.table.colActions')"></span></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-line">
                <template x-for="r in paged" :key="r.id">
                  <tr class="transition-colors hover:bg-soft/40">
                    <td class="px-5 py-3 text-muted"><time :datetime="iso(r.at)" :title="fmtFull(r.at)" x-text="rel(r.at)"></time><bdi dir="ltr" class="block text-[11px]" x-text="r.id"></bdi></td>
                    <th scope="row" class="px-3 py-3 text-start font-normal">
                      <div class="flex min-w-0 items-center gap-2.5">
                        <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-soft text-[11px] font-extrabold text-brand" aria-hidden="true" x-text="initials(r.user.name)"></span>
                        <div class="min-w-0"><p class="truncate font-bold leading-5" x-text="r.user.name"></p><p class="truncate text-xs text-muted" x-text="t('ai.roles.' + r.user.role)"></p></div>
                      </div>
                    </th>
                    <td class="px-3 py-3"><span class="block truncate" x-text="t('ai.features.' + r.feature)"></span></td>
                    <td class="px-3 py-3 text-muted"><bdi dir="ltr" class="block truncate" :title="modelLabel(r.model)" x-text="modelLabel(r.model)"></bdi></td>
                    <td class="px-3 py-3 text-end">
                      <p class="font-extrabold tabular-nums" x-text="fmt(r.prompt + r.completion)"></p>
                      <p class="text-[11px] tabular-nums text-muted"><bdi dir="ltr" x-text="'P ' + fmt(r.prompt) + ' · C ' + fmt(r.completion)"></bdi></p>
                    </td>
                    <td class="px-3 py-3"><span class="badge" :class="statusMeta(r.status).badge"><i class="fa-solid text-[10px]" :class="statusMeta(r.status).icon" aria-hidden="true"></i><span x-text="t('ai.status.' + r.status)"></span></span></td>
                    <td class="px-5 py-3 text-end">
                      <button type="button" class="act ms-auto" @click="openDetails(r, $el)" :aria-label="t('ai.table.viewDetails') + ': ' + r.id" :title="t('ai.table.viewDetails')">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                      </button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- الترقيم -->
          <div class="flex flex-col items-center justify-between gap-3 border-t border-line p-4 sm:flex-row">
            <p class="text-xs font-bold text-muted" x-text="tf('ai.table.showingRange', { from: fmt((page - 1) * PER_PAGE + 1), to: fmt(Math.min(page * PER_PAGE, rows.length)), total: fmt(rows.length) })"></p>
            <nav :aria-label="t('ai.table.pagination')" class="flex items-center gap-1.5">
              <button type="button" class="act" :disabled="page === 1" @click="goPage(page - 1)" :aria-label="t('ai.table.prevPage')"><i class="fa-solid fa-chevron-left text-xs rtl:-scale-x-100" aria-hidden="true"></i></button>
              <span class="px-2 text-xs font-bold text-muted tabular-nums" aria-live="polite" x-text="tf('ai.table.pageOf', { n: fmt(page), total: fmt(pages) })"></span>
              <button type="button" class="act" :disabled="page === pages" @click="goPage(page + 1)" :aria-label="t('ai.table.nextPage')"><i class="fa-solid fa-chevron-right text-xs rtl:-scale-x-100" aria-hidden="true"></i></button>
            </nav>
          </div>
        </div>
      </section>
    </main>

    <!-- ================= Footer ================= -->
    <footer class="mt-auto border-t border-line bg-card/60" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
      <div class="mx-auto flex w-full min-w-0 max-w-[1400px] flex-col gap-4 px-3 py-5 sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-8">
        <div class="flex min-w-0 items-center gap-3">
          <img src="../asset/images/firob-logo.png" alt="FirOb" width="108" height="28" loading="lazy" decoding="async" class="block h-7 w-auto shrink-0 object-contain dark:brightness-125">
          <p class="min-w-0 text-sm text-muted">
            <span x-text="t('footer.tagline')"></span>
            <span class="block text-xs sm:inline sm:text-sm">
              <span class="hidden sm:inline" aria-hidden="true">·</span>
              © <span class="tabular-nums" x-text="year"></span> <span x-text="t('footer.rights')"></span>
            </span>
          </p>
        </div>
        <nav :aria-label="t('footer.nav')" class="min-w-0">
          <ul class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm font-bold" role="list">
            <li><a href="../index.html" class="inline-flex min-h-[2.25rem] items-center gap-1.5 rounded text-muted underline-offset-4 transition-colors hover:text-brand hover:underline"><i class="fa-solid fa-sitemap text-xs" aria-hidden="true"></i><span x-text="t('footer.screens')"></span></a></li>
            <template x-for="k in ['help', 'docs', 'privacy', 'terms']" :key="k">
              <li><span class="inline-flex cursor-not-allowed items-center text-muted/70" aria-disabled="true"><span x-text="t('footer.' + k)"></span><span class="sr-only" x-text="' (' + t('footer.soon') + ')'"></span></span></li>
            </template>
          </ul>
        </nav>
        <p class="flex flex-wrap items-center gap-2 text-xs text-muted">
          <span class="badge badge-muted" dir="ltr" x-text="version"></span>
        </p>
      </div>
    </footer>
  </div>
</div>

<!-- ==========================================================================
     النافذة — فاحص تفاصيل المهمة
     ========================================================================== -->
<div x-cloak x-show="detailsOpen" x-transition.opacity class="fixed inset-0 z-[60] grid place-items-center p-3 sm:p-4">
  <div class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="closeDetails()" aria-hidden="true"></div>

  <div x-show="detailsOpen" x-trap.noscroll.inert="detailsOpen" role="dialog" aria-modal="true" aria-labelledby="details-title" aria-describedby="details-desc"
       x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="opacity-0 scale-95"
       class="modal-panel" @keydown.alt.arrow-down.prevent="stepLog(1)" @keydown.alt.arrow-up.prevent="stepLog(-1)">
    <template x-if="selectedLog">
      <div class="flex min-h-0 flex-1 flex-col">
        <header class="flex shrink-0 items-start justify-between gap-3 border-b border-line p-4 sm:p-5">
          <div class="min-w-0">
            <p class="text-xs font-extrabold text-muted" x-text="t('ai.modal.title')"></p>
            <h2 id="details-title" class="mt-0.5 text-lg font-extrabold text-ink" x-text="t('ai.features.' + selectedLog.feature)"></h2>
            <p id="details-desc" class="mt-0.5 text-xs text-muted">
              <bdi dir="ltr" x-text="selectedLog.id"></bdi> · <time :datetime="iso(selectedLog.at)" x-text="fmtFull(selectedLog.at)"></time>
            </p>
            <div class="mt-2 flex flex-wrap items-center gap-1.5">
              <span class="badge" :class="statusMeta(selectedLog.status).badge"><i class="fa-solid text-[10px]" :class="statusMeta(selectedLog.status).icon" aria-hidden="true"></i><span x-text="t('ai.status.' + selectedLog.status)"></span></span>
              <span class="badge badge-muted"><bdi dir="ltr" x-text="modelLabel(selectedLog.model)"></bdi></span>
            </div>
          </div>
          <button type="button" class="icon-btn shrink-0" @click="closeDetails()" :aria-label="t('ai.modal.close')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </header>

        <div class="min-h-0 flex-1 space-y-5 overflow-y-auto p-4 sm:p-5">
          <!-- أثر الخطأ أو التقييد — أعلى النافذة لأنه سبب الفتح غالبًا -->
          <section x-show="selectedLog.error" aria-labelledby="err-title"
                   class="rounded-xl border p-3.5" :class="selectedLog.status === 'failed' ? 'border-error-500/40 bg-error-500/5' : 'border-warning-500/40 bg-warning-500/10'">
            <div class="mb-2 flex items-center justify-between gap-2">
              <h3 id="err-title" class="flex items-center gap-2 text-sm font-extrabold" :class="selectedLog.status === 'failed' ? 'text-danger' : 'text-warn'">
                <i class="fa-solid" :class="selectedLog.status === 'failed' ? 'fa-circle-xmark' : 'fa-hourglass-half'" aria-hidden="true"></i>
                <span x-text="selectedLog.status === 'failed' ? t('ai.modal.errorTrace') : t('ai.modal.throttleTrace')"></span>
              </h3>
              <button type="button" class="btn btn-outline btn-sm" @click="copyText(selectedLog.error, 'ai.modal.errorCopied')">
                <i class="fa-regular fa-copy" aria-hidden="true"></i><span x-text="t('ai.modal.copy')"></span>
              </button>
            </div>
            <p class="mb-2 text-xs text-ink" x-text="selectedLog.status === 'failed' ? t('ai.modal.failedHint') : t('ai.modal.throttledHint')"></p>
            <pre class="code-block !max-h-40 whitespace-pre-wrap break-words" dir="ltr" tabindex="0" x-text="selectedLog.error"></pre>
          </section>

          <section aria-labelledby="meta-title">
            <h3 id="meta-title" class="mb-2 text-sm font-extrabold text-ink" x-text="t('ai.modal.requestMeta')"></h3>
            <dl class="grid grid-cols-1 gap-3 rounded-xl border border-line p-3.5 sm:grid-cols-2">
              <div class="min-w-0"><dt class="text-xs text-muted" x-text="t('ai.table.colUser')"></dt>
                <dd class="mt-0.5 font-bold"><span x-text="selectedLog.user.name"></span> <span class="text-xs font-medium text-muted" x-text="'· ' + t('ai.roles.' + selectedLog.user.role)"></span></dd></div>
              <div><dt class="text-xs text-muted" x-text="t('ai.modal.duration')"></dt>
                <dd class="mt-0.5 font-bold tabular-nums" :class="selectedLog.duration >= 30000 && 'text-danger'" x-text="fmtDuration(selectedLog.duration)"></dd></div>
              <div class="min-w-0"><dt class="text-xs text-muted" x-text="t('ai.modal.provider')"></dt><dd class="mt-0.5 truncate font-bold"><bdi dir="ltr" x-text="modelLabel(selectedLog.model)"></bdi></dd></div>

<script>
  /**
   * مكوّن الاختيار المخصص (Select-only Combobox — نمط WAI-ARIA APG).
   * ↓/↑ Home/End · Enter/Space اختيار · Tab اختيار وانتقال · Esc إغلاق (دون إغلاق اللوحة الأم)
   * · البحث بأول الأحرف · ينقلب للأعلى عند ضيق المساحة.
   */
  function selectDropdown({ id, options, get, set, disabled = () => false }) {
    return {
      open: false, active: -1, dropUp: false, _q: '', _qt: null,
      get items() { return options(); },
      get isDisabled() { return !!disabled(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { return this.selectedItem ? this.selectedItem.label : ''; },
      get activeId() { return this.open && this.active > -1 && this.items[this.active] ? this.optId(this.items[this.active]) : null; },
      optId(item) { return id + '-opt-' + item.value; },
      isSelected(item) { return get() === item.value; },
      openList() {
        if (this.isDisabled || !this.items.length) return;
        const r = this.$refs.btn.getBoundingClientRect();
        const need = Math.min(224, this.items.length * 46 + 16);
        this.dropUp = r.bottom + need > window.innerHeight - 8 && r.top > need;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item, refocus = true) { set(item.value); this.closeList(); if (refocus) this.$refs.btn?.focus(); },
      move(step) {
        if (!this.open) { this.openList(); return; }
        this.active = Math.min(Math.max(this.active + step, 0), this.items.length - 1);
        this.scrollActiveIntoView();
      },
      scrollActiveIntoView() {
        this.$nextTick(() => {
          const list = this.$refs.list, el = list?.children[this.active];
          if (!list || !el) return;
          /* تمرير يدوي داخل القائمة فقط (scrollIntoView قد يحرّك الصفحة أو اللوحة) */
          if (el.offsetTop < list.scrollTop) list.scrollTop = el.offsetTop - 6;
          else if (el.offsetTop + el.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = el.offsetTop + el.offsetHeight - list.clientHeight + 6;
        });
      },
      onKey(e) {
        if (this.isDisabled) return;
        const k = e.key;
        if (k === 'ArrowDown') { e.preventDefault(); this.move(1); }
        else if (k === 'ArrowUp') { e.preventDefault(); this.move(-1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.active = 0; this.scrollActiveIntoView(); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.active = this.items.length - 1; this.scrollActiveIntoView(); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); this.open && this.active > -1 ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape' && this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); }
        else if (k === 'Tab' && this.open) { if (this.active > -1) this.choose(this.items[this.active], false); else this.closeList(); }
        else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          this._q += k.toLowerCase(); clearTimeout(this._qt); this._qt = setTimeout(() => this._q = '', 600);
          const i = this.items.findIndex(o => o.label.toLowerCase().startsWith(this._q));
          if (i > -1) { if (!this.open) this.openList(); this.active = i; this.scrollActiveIntoView(); }
        }
      },
    };
  }

  /* مولّد عشوائي ثابت البذرة: نفس البيانات في كل تحميل، بتوقيتات نسبية إلى الآن */
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function pickW(rnd, items, weights) { const s = weights.reduce((a, b) => a + b, 0); let r = rnd() * s; for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; } return items[items.length - 1]; }

  function generateLogs(now) {
    const rnd = mulberry32(20261019), out = [], today0 = startOfDay(now);
    let seq = 30000;
    for (let d = 45; d >= 0; d--) {
      const day0 = today0 - d * DAY, dow = new Date(day0).getDay();
      const weekend = dow === 5 || dow === 6;                       /* الجمعة والسبت */
      const calls = Math.round((weekend ? 38 : 100) * (0.85 + rnd() * 0.3));
      const times = Array.from({ length: calls }, () => day0 + (7 + rnd() * 15) * HOUR).filter(ts => ts < now).sort((a, b) => a - b);
      for (const at of times) {
        const f = pickW(rnd, FEATURES, FEATURES.map(x => x.w));
        const modelId = pickW(rnd, f.models.map(m => m[0]), f.models.map(m => m[1])), m = MODELS[modelId];
        const user = pickW(rnd, USERS, USER_W);
        const r = rnd(), status = r < 0.045 ? 'failed' : r < 0.095 ? 'throttled' : 'success';
        const prompt = Math.round(300 + rnd() * 1100);
        const completion = status === 'failed' ? 0 : Math.round(150 + rnd() * 750);
        const timeout = status === 'failed' && rnd() < 0.5;
        const duration = timeout ? 30000 + Math.round(rnd() * 400) : status === 'throttled' ? Math.round(4000 + rnd() * 9000) : Math.round(900 + rnd() * 3200);
        const sid = Math.round(100 + rnd() * 9000);
        const error = status === 'failed'
          ? (timeout ? `${m.provider}\\TimeoutException: Request exceeded 30000ms while running "${f.key}" for ${f.subj} #${sid}.`
                     : `${m.provider}\\InvalidResponseException: Model returned malformed JSON while parsing "${f.key}" output for ${f.subj} #${sid}.`)
          : status === 'throttled' ? `RateLimitException: Provider rate limit reached for "${f.key}"; request queued and retried after ${Math.round(duration / 1000)}s.` : null;

          id: 'AIJ-' + (++seq), at: Math.round(at), user, feature: f.key, model: modelId, prompt, completion,
          cost: (prompt * m.in + completion * m.out) / 1e6, duration, status, error, subject: f.subj + ' #' + sid,
          payload: { feature: f.key, [f.subj.toLowerCase() + '_id']: sid, locale: rnd() < 0.8 ? 'ar' : 'en', max_tokens: 900, model: m.name },
        }));
      }
    }
    return out.reverse();   /* الأحدث أولًا */
  }

      quota: (() => {

      filters: { ...DEFAULTS },
      rows: [], stats: { tokens: 0, prompt: 0, completion: 0, promptPct: 0, cost: 0, avgCost: 0, calls: 0, users: 0, byFeature: [], topFeature: null, failPct: 0, throttledPct: 0 },

      },

      /* =====================================================================
         رسم الاتجاه: SVG يُبنى نصيًا (x-for لا يعمل داخل SVG)، بمقياس ثابت (لا تمطيط)
         ===================================================================== */
      CH: { w: 600, h: 220, l: 52, r: 10, t: 12, b: 28 },
      bucketLabel(b, long = false) {
        if (this.buckets.hourly) return new Intl.DateTimeFormat(this.intl(), { hour: 'numeric', minute: '2-digit' }).format(new Date(b.t));
        return new Intl.DateTimeFormat(this.intl(), long ? { weekday: 'long', day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short' }).format(new Date(b.t));
      },
      get chartGeom() {
        const C = this.CH, L = this.buckets.list, n = L.length;
        const max = Math.max(1, ...L.map(b => Math.max(b.prompt, b.completion)));
        const step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max / step * 1.1) * step;
        const x = (i) => C.l + (n <= 1 ? (C.w - C.l - C.r) / 2 : i * (C.w - C.l - C.r) / (n - 1));
        const y = (v) => C.h - C.b - v / nice * (C.h - C.t - C.b);
        return { x, y, nice, n };
      },
      get trendSvg() {
        const L = this.buckets.list; if (!L.length) return '';
        const C = this.CH, { x, y, nice, n } = this.chartGeom, esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
        let s = '';
        for (let k = 0; k <= 4; k++) {                       /* شبكة + قيم المحور العمودي */
          const v = nice * k / 4, yy = y(v);
          s += `<line x1="${C.l}" x2="${C.w - C.r}" y1="${yy}" y2="${yy}" class="chart-grid"/>`;
          s += `<text x="${C.l - 8}" y="${yy + 4}" text-anchor="end" class="chart-text">${esc(this.fmtCompact(v))}</text>`;
        }
        const every = Math.max(1, Math.ceil(n / 7));          /* ≤ 7 تسميات على المحور الأفقي لتجنّب التداخل */
        L.forEach((b, i) => { if (i % every === 0 || i === n - 1) s += `<text x="${x(i)}" y="${C.h - 8}" text-anchor="middle" class="chart-text">${esc(this.bucketLabel(b))}</text>`; });
        const pts = (k) => L.map((b, i) => `${x(i).toFixed(1)},${y(b[k]).toFixed(1)}`).join(' ');
        s += `<polygon points="${C.l},${y(0)} ${pts('prompt')} ${x(n - 1)},${y(0)}" class="fill-series1" opacity=".1"/>`;
        s += `<polyline points="${pts('prompt')}" class="stroke-series1" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        s += `<polyline points="${pts('completion')}" class="stroke-series2" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>`;
        if (this.hi !== null && L[this.hi]) {
          const hx = x(this.hi);
          s += `<line x1="${hx}" x2="${hx}" y1="${C.t}" y2="${C.h - C.b}" class="chart-cross"/>`;
          s += `<circle cx="${hx}" cy="${y(L[this.hi].prompt)}" r="5" class="fill-series1 chart-ring"/>`;
          s += `<circle cx="${hx}" cy="${y(L[this.hi].completion)}" r="5" class="fill-series2 chart-ring"/>`;
        } else if (n <= 31) {
          L.forEach((b, i) => { s += `<circle cx="${x(i)}" cy="${y(b.prompt)}" r="3" class="fill-series1 chart-ring"/><circle cx="${x(i)}" cy="${y(b.completion)}" r="3" class="fill-series2 chart-ring"/>`; });
        }
        return s;
      },
      hoverAt(e) {
        const svg = this.$refs.trendSvg; if (!svg || !this.buckets.list.length) return;
        const r = svg.getBoundingClientRect(), C = this.CH, n = this.buckets.list.length;
        const vx = (e.clientX - r.left) / r.width * C.w;
        this.hi = n <= 1 ? 0 : Math.min(n - 1, Math.max(0, Math.round((vx - C.l) / (C.w - C.l - C.r) * (n - 1))));
      },
      get tipStyle() {
        if (this.hi === null) return '';
        const px = this.chartGeom.x(this.hi) / this.CH.w * 100;
        return `left:${Math.min(85, Math.max(15, px))}%;`;
      },
      get trendSummary() {
        const L = this.buckets.list; if (!L.length) return this.t('ai.charts.trendTitle');
        const peak = L.reduce((a, b) => (b.prompt + b.completion > a.prompt + a.completion ? b : a));
        return this.tf('ai.charts.summary', { title: this.t('ai.charts.trendTitle'), total: this.fmt(this.stats.tokens), peak: this.fmt(peak.prompt + peak.completion), at: this.bucketLabel(peak, true) });
      },

      /* ---------- نافذة التفاصيل ---------- */
      detailsOpen: false, selectedLog: null, _detailsTrigger: null,
      get logIndex() { return this.selectedLog ? this.rows.findIndex(r => r.id === this.selectedLog.id) : -1; },
      get payloadJson() { return this.selectedLog ? JSON.stringify(this.selectedLog.payload, null, 2) : ''; },
      openDetails(log, trigger) { this._detailsTrigger = trigger || null; this.selectedLog = log; this.detailsOpen = true; },
      closeDetails() {
        this.detailsOpen = false;
        const t = this._detailsTrigger;
        setTimeout(() => (t && t.isConnected && t.offsetParent !== null ? t : document.getElementById('ai-table-title'))?.focus(), 220);
      },
      stepLog(d) {
        const i = this.logIndex + d; if (i < 0 || i >= this.rows.length) return;
        this.selectedLog = this.rows[i];
        this.page = Math.floor(i / this.PER_PAGE) + 1;
        this._detailsTrigger = null;
        this.announce(this.t('ai.features.' + this.selectedLog.feature) + ' — ' + this.selectedLog.id);
      },
      filterUser(u) {
        this.filters.query = u.email; this.detailsOpen = false;
        this.announce(this.tf('ai.modal.userFiltered', { name: u.name }));
        setTimeout(() => document.getElementById('ai-table-title')?.focus(), 400);
      },
      async copyText(text, okKey) {
        let ok = false;
        try { await navigator.clipboard.writeText(text); ok = true; } catch (_) {
          try {
            const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
            document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
          } catch (__) {}
        }
        this.toast(ok ? 'success' : 'error', this.t(ok ? okKey : 'ai.modal.copyFailed'));
      },

      /* ---------- تصدير CSV فعلي للنتائج المصفّاة ---------- */
      exportCsv() {
        const esc = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
        const head = ['id', 'created_at', 'user', 'email', 'feature', 'provider', 'model', 'prompt_tokens', 'completion_tokens', 'cost_usd', 'duration_ms', 'status', 'error'];
        const lines = this.rows.map(l => [l.id, new Date(l.at).toISOString(), l.user.name, l.user.email, l.feature, MODELS[l.model].provider, MODELS[l.model].name,
          l.prompt, l.completion, l.cost.toFixed(6), l.duration, l.status, l.error].map(esc).join(','));
        const blob = new Blob(['﻿' + [head.join(','), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'ai-usage-' + isoDate(Date.now()) + '.csv';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        this.toast('success', this.tf('ai.csvDone', { n: this.fmt(this.rows.length) }));
      },

      /* ---------- Toast ---------- */
      toast(icon, msg) {
        this.announce(msg);
        if (!window.Swal) return;
        Swal.fire({ toast: true, position: 'top-end', icon, title: msg, showConfirmButton: false, timer: 3000, timerProgressBar: true,
          customClass: { popup: 'firob-swal firob-toast' },
          didOpen: (t) => { t.addEventListener('mouseenter', Swal.stopTimer); t.addEventListener('mouseleave', Swal.resumeTimer); } });
      },

      /* ---------- البحث العام ---------- */
      focusSearch() {
        if (this.detailsOpen) return;
        if (mdMQ.matches) { this.$refs.globalSearch?.focus(); this.$refs.globalSearch?.select(); return; }
        this.searchOpen = true; this.$nextTick(() => this.$refs.mobileSearch?.focus());
      },
      toggleMobileSearch() { this.searchOpen = !this.searchOpen; if (this.searchOpen) this.$nextTick(() => this.$refs.mobileSearch?.focus()); },
      closeMenu() {},

      /* ---------- عامة ---------- */
      init() {
        this.recompute();
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        mdMQ.addEventListener('change', (m) => { if (m.matches) this.searchOpen = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        document.title = this.t('ai.title') + ' — FirOb';
        /* تغيير الفلاتر: حالة تحميل قصيرة (محاكاة طلب Livewire) ثم إعادة الحساب وإعلان النتيجة */
        this.$watch('filters', () => {
          this.loading = true;
          clearTimeout(this._recT);
          this._recT = setTimeout(() => {
            this.recompute(); this.loading = false;
            this.announce(this.tf('ai.scopeNote', { n: this.fmt(this.rows.length), range: this.rangeLabel }));
          }, 280);
        }, { deep: true });
        /* إعادة بناء الرسم عند تغيير اللغة (تنسيق الأرقام والتواريخ) */
        this.$watch('locale', () => { this.buckets = { ...this.buckets }; });
        try {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            let saved = null; try { saved = localStorage.getItem('firob-theme'); } catch (_) {}
            if (!saved) this.applyTheme(e.matches);
          });
        } catch (e) {}
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      closeMobileNav() { this.mobileNav = false; this.$nextTick(() => this.$refs.navToggle?.focus()); },
      applyTheme(isDark) {
        document.body.classList.add('theme-anim');
        this.dark = isDark;
        document.documentElement.classList.toggle('dark', isDark);
        document.getElementById('theme-color')?.setAttribute('content', isDark ? '#09141B' : '#F1EDE7');
        clearTimeout(this._themeT); this._themeT = setTimeout(() => document.body.classList.remove('theme-anim'), 350);
      },
      toggleTheme() {
        this.applyTheme(!this.dark);
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      closeAll() {
        if (this.detailsOpen) { this.closeDetails(); return; }
        if (this.notifOpen)   { this.notifOpen = false;   this.$refs.notifBtn?.focus(); return; }
        if (this.profileOpen) { this.profileOpen = false; this.$refs.profileBtn?.focus(); return; }
        if (this.searchOpen)  { this.searchOpen = false; return; }
        if (this.mobileNav)   { this.closeMobileNav(); }
      },
    };
  }
</script>
