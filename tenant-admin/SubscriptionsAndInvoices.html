            <span class="text-xs font-extrabold" aria-hidden="true" x-text="locale === 'ar' ? 'EN' : 'ع'"></span>
          </button>

          <button type="button" class="icon-btn" @click="toggleTheme()" :aria-pressed="dark.toString()"
                  :aria-label="t('darkMode')" :title="dark ? t('lightMode') : t('darkMode')">
            <i class="fa-solid" :class="dark ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <!-- الإشعارات -->
          <div class="sm:relative" @click.outside="notifOpen = false">
            <button type="button" x-ref="notifBtn" class="icon-btn" @click="notifOpen = !notifOpen; profileOpen = false"
                    aria-haspopup="dialog" :aria-expanded="notifOpen.toString()" aria-controls="notif-menu"
                    :aria-label="t('notifications') + (unread ? ' — ' + tf('notifUnread', { n: unread }) : '')">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
              <span x-show="unread" class="absolute end-2 top-2 h-2.5 w-2.5 rounded-full bg-error-500 ring-2 ring-card" aria-hidden="true"></span>
            </button>
            <div id="notif-menu" x-cloak x-show="notifOpen" x-transition.opacity.scale.95 class="menu sm:w-80" role="dialog" aria-labelledby="notif-title">
              <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
                <h2 id="notif-title" class="font-extrabold" x-text="t('notifications')"></h2>
                <button type="button" class="min-h-[2.25rem] rounded-lg px-2 text-xs font-bold text-brand hover:underline disabled:opacity-50 disabled:no-underline"
                        :disabled="!unread" @click="markAllRead()" x-text="t('markAllRead')"></button>
              </div>
              <ul class="max-h-[60dvh] divide-y divide-line overflow-y-auto sm:max-h-80" role="list">
                <template x-for="n in notifications" :key="n.id">
                  <li class="flex gap-3 px-4 py-3" :class="n.read ? '' : 'bg-soft/60'">
                    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" :class="n.tone" aria-hidden="true"><i :class="n.icon"></i></span>
                    <div class="min-w-0 flex-1">
                      <p class="break-words text-sm font-bold leading-6">
                        <span class="sr-only" x-show="!n.read" x-text="t('unreadSr') + ': '"></span>
                        <span x-text="tf('notif.' + n.key, notifVars)"></span>
                      </p>
                      <p class="text-xs text-muted"><time :datetime="isoAgo(n.mins)" x-text="ago(n.mins)"></time></p>
                    </div>
                    <span x-show="!n.read" class="mt-2 h-2 w-2 shrink-0 rounded-full bg-primary-500" aria-hidden="true"></span>
                  </li>
                </template>
              </ul>
              <div class="border-t border-line p-2">
                <a href="../common/notifications.html" class="menu-item justify-center rounded-xl text-brand" @click="notifOpen = false">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i><span x-text="t('viewAllNotif')"></span>
                </a>
              </div>
            </div>
          </div>

          <!-- الحساب -->
          <div class="sm:relative" @click.outside="profileOpen = false">
            <button type="button" x-ref="profileBtn" class="flex min-h-[2.75rem] max-w-[14rem] items-center gap-2 rounded-xl p-1 transition-colors hover:bg-soft md:pe-2"
                    @click="profileOpen = !profileOpen; notifOpen = false"
                    :aria-expanded="profileOpen.toString()" aria-controls="profile-menu">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary-500 text-sm font-extrabold text-white" aria-hidden="true" x-text="initials(me.name)"></span>
              <span class="sr-only md:hidden" x-text="t('accountMenu')"></span>
              <span class="hidden min-w-0 text-start md:block">
                <span class="block truncate text-sm font-extrabold leading-tight" x-text="me.name"></span>
                <span class="block truncate text-xs text-muted" x-text="t('roleTenantAdmin')"></span>
              </span>
              <i class="fa-solid fa-chevron-down hidden shrink-0 text-xs text-muted transition-transform md:block" :class="profileOpen && 'rotate-180'" aria-hidden="true"></i>
            </button>
            <nav id="profile-menu" x-cloak x-show="profileOpen" x-transition.opacity.scale.95 class="menu sm:w-60" :aria-label="t('accountMenu')">
              <ul role="list" class="py-1">
                <li><a href="../common/profile.html" class="menu-item"><i class="fa-regular fa-user w-4 text-muted" aria-hidden="true"></i> <span x-text="t('profile')"></span></a></li>
                <li><a href="TenantSettingsForm.html" class="menu-item"><i class="fa-solid fa-gear w-4 text-muted" aria-hidden="true"></i> <span x-text="t('navItems.orgSettings')"></span></a></li>
                <li><a href="../common/errors.html" class="menu-item"><i class="fa-solid fa-triangle-exclamation w-4 text-muted" aria-hidden="true"></i> <span x-text="t('statusErrors')"></span></a></li>
                <li class="border-t border-line"><a href="../auth/login.html" class="menu-item !text-danger"><i class="fa-solid fa-arrow-right-from-bracket w-4 rtl:-scale-x-100" aria-hidden="true"></i> <span x-text="t('logout')"></span></a></li>
              </ul>
            </nav>
          </div>
        </div>
      </div>

      <form id="mobile-search" role="search" x-cloak x-show="searchOpen" x-transition.opacity class="border-t border-line px-3 py-2 md:hidden" @submit.prevent>
        <label for="q-m" class="sr-only" x-text="t('searchPlaceholder')"></label>
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
          <input id="q-m" x-ref="mobileSearch" type="search" enterkeyhint="search" :placeholder="t('searchPlaceholder')"
                 class="h-11 w-full rounded-xl border border-line-strong/60 bg-field pe-3 ps-10 text-base text-ink placeholder:text-muted/80 focus:border-brand focus:outline-none focus:shadow-[var(--ring)]">
        </div>
      </form>

      <div class="hidden border-t border-line px-6 py-2 text-xs font-bold text-muted sm:block">
        <nav :aria-label="t('breadcrumbLabel')">
          <ol class="flex items-center gap-2" role="list">
            <li><a href="TenantDashboard.html" class="rounded hover:text-brand hover:underline" x-text="t('breadcrumb.home')"></a></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right text-[10px] rtl:-scale-x-100"></i></li>
            <li x-text="t('breadcrumb.org')"></li>
            <li aria-hidden="true"><i class="fa-solid fa-chevron-right text-[10px] rtl:-scale-x-100"></i></li>
            <li><span class="text-ink" aria-current="page" x-text="t('navItems.subscription')"></span></li>
          </ol>
        </nav>
      </div>
    </header>

    <!-- ================= المحتوى الرئيسي — ADM-07: الاشتراك والفوترة ================= -->
    <main id="main" tabindex="-1" class="mx-auto w-full min-w-0 max-w-[1400px] flex-1 space-y-4 px-3 py-4 focus:outline-none sm:space-y-6 sm:p-6 lg:p-8"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px));">

      <!-- العنوان + الإجراءات الرئيسية (CTA Accent واحد فقط) -->
      <div class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end sm:justify-between">
        <div class="min-w-0">
          <h1 class="text-2xl font-extrabold text-brand sm:text-3xl" x-text="t('sub.title')">الاشتراك والفوترة</h1>
          <p class="mt-1 max-w-3xl text-sm text-muted sm:text-base" x-text="t('sub.subtitle')"></p>
        </div>
        <div class="grid grid-cols-1 gap-2 min-[420px]:grid-cols-2 sm:flex sm:flex-wrap sm:items-center">
          <button type="button" class="btn btn-outline" @click="openModal('payment', $el)">
            <i class="fa-solid fa-credit-card" aria-hidden="true"></i><span x-text="t('sub.ctaUpdatePayment')"></span>
          </button>
          <button type="button" class="btn btn-accent" aria-haspopup="dialog" @click="openUpgrade($el)">
            <i class="fa-solid fa-arrow-trend-up" aria-hidden="true"></i><span x-text="t('sub.ctaUpgrade')"></span>
          </button>
        </div>
      </div>

      <!-- ================= تنبيهات الحساب (مشتقة من الحالة) ================= -->
      <section x-show="alerts.length" :aria-label="t('sub.alerts.title')" class="space-y-2">
        <template x-for="a in alerts" :key="a.key">
          <div class="alert-bar" :class="'alert-' + a.tone">
            <div class="flex min-w-0 flex-1 items-start gap-3">
              <i class="fa-solid a-ic mt-0.5 shrink-0" :class="a.icon" aria-hidden="true"></i>
              <p class="min-w-0 text-sm font-bold leading-6 text-ink" x-text="a.text"></p>
            </div>
            <div class="flex shrink-0 flex-wrap gap-2 ps-7 sm:ps-0">
              <template x-for="act in a.actions" :key="act.label">
                <button type="button" class="btn btn-sm" :class="act.primary ? 'btn-primary' : 'btn-outline'" @click="act.run($el)" x-text="act.label"></button>
              </template>
            </div>
          </div>
        </template>
      </section>

      <!-- ================= بطاقة الاشتراك النشط ================= -->
      <section class="panel p-4 sm:p-6" aria-labelledby="plan-name">
        <div class="flex flex-col gap-6 lg:flex-row lg:items-start lg:justify-between">

          <!-- تفاصيل الباقة -->
          <div class="min-w-0 lg:max-w-md">
            <p class="text-xs font-extrabold text-muted" x-text="t('sub.planLabel')"></p>
            <div class="mt-1 flex flex-wrap items-center gap-2.5">
              <h2 id="plan-name" class="text-xl font-extrabold text-ink sm:text-2xl" x-text="t('sub.plans.' + sub.plan + '.name')"></h2>
              <span class="badge" :class="stateMeta.badge"><i class="fa-solid text-[10px]" :class="stateMeta.icon" aria-hidden="true"></i><span x-text="stateLabel"></span></span>
            </div>
            <p class="mt-3 flex flex-wrap items-baseline gap-1.5">
              <span class="text-3xl font-extrabold tabular-nums text-ink" x-text="fmtMoney(price)"></span>
              <span class="text-sm font-bold text-muted" x-text="'/ ' + t('sub.per.' + sub.cycle)"></span>
            </p>
            <p class="mt-1 text-xs text-muted">
              <i class="fa-solid fa-rotate" aria-hidden="true"></i>
              <span x-text="t('sub.cycle.' + sub.cycle)"></span> · <span x-text="tf('sub.taxNote', { rate: fmt(TAX_RATE * 100) })"></span>
            </p>
            <p x-show="hasSchedule && !sub.cancelAtPeriodEnd" x-cloak class="mt-2 flex items-start gap-1.5 text-xs font-bold text-info">
              <i class="fa-solid fa-calendar-days mt-0.5" aria-hidden="true"></i><span x-text="scheduleText"></span>
            </p>

            <div class="mt-5 flex flex-wrap items-center gap-2">
              <button type="button" class="btn btn-outline btn-sm" aria-haspopup="dialog" :disabled="sub.cancelAtPeriodEnd" @click="openCycle($el)">
                <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i><span x-text="t('sub.changeCycle')"></span>
              </button>
              <button x-show="!sub.cancelAtPeriodEnd" type="button" class="btn btn-outline btn-sm !text-danger hover:!bg-error-500/10" aria-haspopup="dialog" @click="openModal('cancel', $el)">
                <i class="fa-solid fa-ban" aria-hidden="true"></i><span x-text="t('sub.cancelSub')"></span>
              </button>
              <button x-show="sub.cancelAtPeriodEnd" x-cloak type="button" class="btn btn-primary btn-sm" @click="resume()">
                <i class="fa-solid fa-play" aria-hidden="true"></i><span x-text="t('sub.resumeSub')"></span>
              </button>
            </div>
          </div>

          <!-- التجديد + المقاعد + التجديد التلقائي -->
          <div class="grid w-full min-w-0 gap-4 sm:grid-cols-2 lg:w-auto lg:min-w-[24rem] lg:max-w-md lg:grid-cols-1">

            <div class="min-w-0 rounded-xl border border-line p-4">
              <div class="flex items-center justify-between gap-2">
                <p class="text-xs font-bold text-muted" x-text="sub.cancelAtPeriodEnd ? t('sub.endsLabel') : t('sub.renewalLabel')"></p>
                <i class="fa-solid" :class="sub.cancelAtPeriodEnd ? 'fa-hourglass-half text-warn' : 'fa-calendar-check text-brand'" aria-hidden="true"></i>
              </div>
              <p class="mt-1.5 text-lg font-extrabold text-ink"><time :datetime="iso(sub.periodEnd)" x-text="fmtDateLong(sub.periodEnd)"></time></p>
              <p class="mt-0.5 text-xs font-bold" :class="sub.cancelAtPeriodEnd ? 'text-warn' : 'text-brand'" x-text="relDays(sub.periodEnd)"></p>
              <p class="hint" x-text="renewalHint"></p>
            </div>

            <div class="min-w-0 rounded-xl border border-line p-4">
              <div class="flex items-center justify-between gap-2">
                <p id="seats-label" class="text-xs font-bold text-muted" x-text="t('sub.seatsLabel')"></p>
                <span class="text-xs font-extrabold tabular-nums" :class="seatTone.text" x-text="seatsUnlimited ? t('sub.upgrade.unlimited') : fmt(seatsPct) + '%'" aria-hidden="true"></span>
              </div>
              <div class="quota-track mt-2" role="progressbar" aria-labelledby="seats-label" aria-valuemin="0" aria-valuemax="100"
                   :aria-valuenow="seatsUnlimited ? null : seatsPct" :aria-valuetext="seatsText">
                <div class="quota-fill" :class="seatTone.fill" :style="'width:' + (seatsUnlimited ? 100 : Math.min(100, seatsPct)) + '%'"></div>
              </div>
              <p class="mt-1.5 text-xs font-bold text-muted" x-text="seatsText"></p>
              <p x-show="seatTone.warn" class="mt-1 flex flex-wrap items-center gap-x-2 text-xs font-bold text-warn">
                <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                <span x-text="tf('sub.seatsLeft', { n: fmt(seatsLeft) })"></span>
                <button type="button" class="min-h-[2.25rem] rounded text-brand underline-offset-2 hover:underline" aria-haspopup="dialog" @click="openUpgrade($el)" x-text="t('sub.seatsAction')"></button>
              </p>
            </div>

            <div class="flex min-w-0 items-center justify-between gap-3 rounded-xl border border-line p-4 sm:col-span-2 lg:col-span-1">
              <div class="min-w-0">
                <p id="ar-label" class="font-bold text-ink" x-text="t('sub.autoRenewLabel')"></p>
                <p id="ar-hint" class="hint" x-text="sub.cancelAtPeriodEnd ? tf('sub.autoRenewOffHint', { date: fmtDate(sub.periodEnd) }) : t('sub.autoRenewOnHint')"></p>
              </div>
              <!-- إيقاف التجديد = إلغاء في نهاية الدورة ⇒ يمر عبر نافذة التأكيد نفسها -->
              <button type="button" role="switch" class="sw" :aria-checked="(!sub.cancelAtPeriodEnd).toString()"
                      aria-labelledby="ar-label" aria-describedby="ar-hint" @click="toggleAutoRenew($el)">
                <span class="sw-knob" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- ================= التبويبات (WAI-ARIA Tabs: أسهم + Home/End) ================= -->
      <div class="panel p-1.5">
        <div role="tablist" class="flex items-center gap-1 overflow-x-auto scroll-thin" :aria-label="t('sub.tabsLabel')" @keydown="tabKey($event)">
          <template x-for="tb in TABS" :key="tb.key">
            <button type="button" role="tab" class="tab-btn" :id="'tab-' + tb.key" :aria-controls="'panel-' + tb.key"
                    :aria-selected="(activeTab === tb.key).toString()" :tabindex="activeTab === tb.key ? 0 : -1" @click="setTab(tb.key)">
              <i class="fa-solid" :class="tb.icon" aria-hidden="true"></i>
              <span x-text="tb.key === 'invoices' ? t('sub.tabInvoices') : t('sub.tabPayments')"></span>
              <span class="count" x-text="fmt(tb.key === 'invoices' ? allInvoices.length : payments.length)"></span>
            </button>
          </template>
        </div>
      </div>

      <!-- ================= التبويب ١: سجل الفواتير ================= -->
      <section id="panel-invoices" role="tabpanel" aria-labelledby="tab-invoices" tabindex="0" x-show="activeTab === 'invoices'" class="space-y-4 focus:outline-none sm:space-y-6">

        <!-- الفلاتر -->
        <div class="panel p-4 sm:p-5">
          <h2 class="sr-only" x-text="t('sub.inv.filtersTitle')"></h2>
          <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-[minmax(0,1fr)_13rem_auto_auto] lg:items-end">
            <div class="min-w-0 sm:col-span-2 lg:col-span-1">
              <label for="inv-q" class="label !text-xs" x-text="t('sub.inv.searchLabel')"></label>
              <div class="relative">
                <i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted" aria-hidden="true"></i>
                <input id="inv-q" type="search" class="field ps-10" dir="auto" autocomplete="off" enterkeyhint="search" x-model.debounce.250ms="filters.q" :placeholder="t('sub.inv.searchPh')">
              </div>
            </div>

            <!-- الحالة: Select-only Combobox v2 -->
            <div class="min-w-0" x-data="selectDropdown({ id: 'inv-status', options: () => statusOptions, get: () => filters.status, set: (v) => filters.status = v })" @click.outside="closeList()">
              <span id="inv-status-label" class="label !text-xs" x-text="t('sub.inv.statusLabel')"></span>
              <div class="relative">
                <button type="button" id="inv-status" x-ref="btn" role="combobox" aria-haspopup="listbox" aria-labelledby="inv-status-label inv-status"
                        :aria-expanded="open.toString()" aria-controls="inv-status-list" :aria-activedescendant="activeId"
                        class="field flex w-full items-center justify-between gap-2 text-start font-bold" :class="filters.status !== 'all' && '!border-brand'"
                        @click="toggleList()" @keydown="onKey($event)">
                  <span class="truncate" x-text="triggerLabel"></span>
                  <i class="fa-solid fa-chevron-down shrink-0 text-xs text-muted transition-transform duration-200" :class="open && 'rotate-180'" aria-hidden="true"></i>
                </button>
                <ul x-show="open" x-cloak x-ref="list" id="inv-status-list" role="listbox" aria-labelledby="inv-status-label" tabindex="-1"
                    x-transition.opacity.duration.150ms class="combo-list scroll-thin" :class="dropUp ? 'bottom-full mb-1.5' : 'top-full mt-1.5'">
                  <template x-for="(item, idx) in items" :key="item.value">
                    <li :id="optId(item)" role="option" :aria-selected="isSelected(item).toString()"
                        class="combo-option" :class="{ 'is-active': idx === active, 'is-selected': isSelected(item) }"
                        @click="choose(item)" @mousemove="active = idx">
                      <span class="truncate" x-text="item.label"></span>
                      <i class="fa-solid fa-check shrink-0 text-xs text-brand" x-show="isSelected(item)" aria-hidden="true"></i>
                    </li>
                  </template>
                </ul>
              </div>
            </div>

            <!-- الفترة -->
            <fieldset class="min-w-0">
              <legend class="label !text-xs" x-text="t('sub.inv.periodLabel')"></legend>
              <div class="grid grid-cols-2 gap-2">
                <label for="inv-from" class="sr-only" x-text="t('sub.inv.dateFrom')"></label>
                <input id="inv-from" type="date" class="field min-w-0 lg:w-40" x-model="filters.from" :max="filters.to || null"
                       :aria-invalid="rangeError.toString()" :aria-describedby="rangeError ? 'range-err' : null">
                <label for="inv-to" class="sr-only" x-text="t('sub.inv.dateTo')"></label>
                <input id="inv-to" type="date" class="field min-w-0 lg:w-40" x-model="filters.to" :min="filters.from || null"
                       :aria-invalid="rangeError.toString()" :aria-describedby="rangeError ? 'range-err' : null">
              </div>
            </fieldset>

            <button type="button" class="btn btn-outline sm:col-span-2 lg:col-span-1" :disabled="!filtersActive" @click="resetFilters()">
              <i class="fa-solid fa-filter-circle-xmark" aria-hidden="true"></i><span x-text="t('sub.inv.reset')"></span>
            </button>
          </div>
          <p id="range-err" x-show="rangeError" x-cloak class="err" role="alert"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="t('sub.inv.rangeError')"></span></p>
        </div>

        <!-- القائمة -->
        <div class="panel overflow-hidden">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-line px-4 py-3 sm:px-5">
            <h2 id="inv-list-title" tabindex="-1" class="text-base font-extrabold text-ink focus:outline-none" x-text="t('sub.tabInvoices')"></h2>
            <p class="text-xs font-bold text-muted" x-text="tf('sub.inv.results', { n: fmt(filtered.length) })"></p>
          </div>

          <!-- الحالة الفارغة (فعلية) -->
          <div x-show="!filtered.length" x-cloak class="px-5 py-14 text-center">
            <span class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-full bg-primary-500/10 text-brand" aria-hidden="true"><i class="fa-solid fa-file-circle-question text-xl"></i></span>
            <p class="font-extrabold text-ink" x-text="t('sub.inv.emptyTitle')"></p>
            <p class="mx-auto mt-1.5 max-w-sm text-sm text-muted" x-text="t('sub.inv.emptySubtitle')"></p>
            <button type="button" class="btn btn-outline mt-4" @click="resetFilters()"><i class="fa-solid fa-filter-circle-xmark" aria-hidden="true"></i><span x-text="t('sub.inv.reset')"></span></button>
          </div>

          <!-- (أ) بطاقات — الجوال والتابلت -->
          <ul x-show="filtered.length" class="grid grid-cols-1 gap-3 p-3 sm:grid-cols-2 sm:p-4 xl:hidden" role="list" aria-labelledby="inv-list-title">
            <template x-for="inv in paged" :key="inv.id">
              <li class="min-w-0 rounded-xl border border-line p-4" :class="inv.upcoming && 'border-dashed border-line-strong'">
                <div class="flex items-start justify-between gap-3">
                  <div class="min-w-0">
                    <p class="truncate font-extrabold leading-6"><bdi :dir="inv.upcoming ? null : 'ltr'" x-text="invNo(inv)"></bdi></p>
                    <p class="mt-1 text-xs text-muted">
                      <time :datetime="iso(inv.issued)" x-text="fmtDate(inv.issued)"></time> ·
                      <span x-text="t('sub.inv.dueShort')"></span> <time :datetime="iso(inv.due)" x-text="fmtDate(inv.due)"></time>
                    </p>
                  </div>
                  <span class="badge shrink-0" :class="invStatus(inv).badge"><i class="fa-solid text-[10px]" :class="invStatus(inv).icon" aria-hidden="true"></i><span x-text="t('sub.inv.status.' + inv.status)"></span></span>
                </div>
                <div class="mt-3 flex flex-wrap items-center justify-between gap-2 border-t border-line pt-3">
                  <p class="text-lg font-extrabold tabular-nums" :class="inv.status === 'void' ? 'text-muted line-through' : 'text-ink'" x-text="fmtMoney(inv.t.total)"></p>
                  <div class="flex items-center gap-2">
                    <button x-show="payable(inv)" type="button" class="btn btn-primary btn-sm" aria-haspopup="dialog" @click="openPay(inv, $el)">
                      <i class="fa-solid fa-credit-card" aria-hidden="true"></i><span x-text="t('sub.inv.payNow')"></span>
                    </button>
                    <button type="button" class="act" :disabled="!canDownload(inv)" :aria-busy="(downloading === inv.id).toString()" @click="downloadPdf(inv)"
                            :aria-label="t('sub.inv.download') + ': ' + invNo(inv)" :title="canDownload(inv) ? t('sub.inv.download') : t('sub.inv.noPdf')">
                      <i class="fa-solid" :class="downloading === inv.id ? 'fa-circle-notch animate-spin' : 'fa-download'" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="act" aria-haspopup="dialog" @click="openInvoice(inv)" :aria-label="t('sub.inv.view') + ': ' + invNo(inv)" :title="t('sub.inv.view')">
                      <i class="fa-regular fa-eye" aria-hidden="true"></i>
                    </button>
                  </div>
                </div>
              </li>
            </template>
          </ul>

          <!-- (ب) جدول — سطح المكتب -->
          <div x-show="filtered.length" class="hidden overflow-x-auto xl:block">
            <table class="w-full text-sm">
              <caption class="sr-only" x-text="t('sub.tabInvoices') + ' — ' + rangeText"></caption>
              <thead class="border-b border-line bg-soft/60 text-xs font-extrabold text-muted">
                <tr>
                  <th scope="col" class="px-5 py-3 text-start" x-text="t('sub.inv.cols.number')"></th>
                  <th scope="col" class="px-4 py-3 text-start" x-text="t('sub.inv.cols.issued')"></th>
                  <th scope="col" class="px-4 py-3 text-start" x-text="t('sub.inv.cols.due')"></th>
                  <th scope="col" class="px-4 py-3 text-end" x-text="t('sub.inv.cols.amount')"></th>
                  <th scope="col" class="px-4 py-3 text-start" x-text="t('sub.inv.cols.status')"></th>
                  <th scope="col" class="px-5 py-3 text-end" x-text="t('sub.inv.cols.actions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-line">
                <template x-for="inv in paged" :key="inv.id">
                  <tr class="transition-colors hover:bg-soft/40">
                    <th scope="row" class="px-5 py-3.5 text-start font-extrabold" :class="inv.status === 'void' ? 'text-muted' : 'text-ink'"><bdi :dir="inv.upcoming ? null : 'ltr'" x-text="invNo(inv)"></bdi></th>
                    <td class="whitespace-nowrap px-4 py-3.5 text-muted"><time :datetime="iso(inv.issued)" x-text="fmtDate(inv.issued)"></time></td>
                    <td class="whitespace-nowrap px-4 py-3.5 text-muted"><time :datetime="iso(inv.due)" x-text="fmtDate(inv.due)"></time></td>
                    <td class="whitespace-nowrap px-4 py-3.5 text-end font-bold tabular-nums" :class="inv.status === 'void' ? 'text-muted line-through' : 'text-ink'" x-text="fmtMoney(inv.t.total)"></td>
                    <td class="px-4 py-3.5"><span class="badge" :class="invStatus(inv).badge"><i class="fa-solid text-[10px]" :class="invStatus(inv).icon" aria-hidden="true"></i><span x-text="t('sub.inv.status.' + inv.status)"></span></span></td>
                    <td class="px-5 py-3.5">
                      <div class="flex items-center justify-end gap-2">
                        <button x-show="payable(inv)" type="button" class="btn btn-primary btn-sm" aria-haspopup="dialog" @click="openPay(inv, $el)"
                                :aria-label="t('sub.inv.payNow') + ': ' + inv.number">
                          <i class="fa-solid fa-credit-card" aria-hidden="true"></i><span x-text="t('sub.inv.payNow')"></span>
                        </button>
                        <button type="button" class="act" :disabled="!canDownload(inv)" :aria-busy="(downloading === inv.id).toString()" @click="downloadPdf(inv)"
                                :aria-label="t('sub.inv.download') + ': ' + invNo(inv)" :title="canDownload(inv) ? t('sub.inv.download') : t('sub.inv.noPdf')">
                          <i class="fa-solid" :class="downloading === inv.id ? 'fa-circle-notch animate-spin' : 'fa-download'" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="act" aria-haspopup="dialog" @click="openInvoice(inv)" :aria-label="t('sub.inv.view') + ': ' + invNo(inv)" :title="t('sub.inv.view')">
                          <i class="fa-regular fa-eye" aria-hidden="true"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- الترقيم (فعلي) -->
          <div x-show="filtered.length" class="flex flex-col gap-3 border-t border-line px-4 py-3.5 sm:flex-row sm:items-center sm:justify-between sm:px-5">
            <p class="text-xs font-bold text-muted" x-text="rangeText"></p>
            <nav x-show="pages > 1" :aria-label="t('sub.inv.pagination')">
              <ul class="flex flex-wrap items-center gap-1.5" role="list">
                <li><button type="button" class="act" :disabled="page === 1" @click="goPage(page - 1)" :aria-label="t('sub.inv.prev')"><i class="fa-solid fa-chevron-right text-xs ltr:-scale-x-100" aria-hidden="true"></i></button></li>
                <template x-for="p in pages" :key="p">
                  <li><button type="button" class="act font-bold" :aria-current="p === page ? 'page' : null" :aria-label="tf('sub.inv.pageN', { n: p })" @click="goPage(p)" x-text="fmt(p)"></button></li>
                </template>
                <li><button type="button" class="act" :disabled="page === pages" @click="goPage(page + 1)" :aria-label="t('sub.inv.next')"><i class="fa-solid fa-chevron-left text-xs ltr:-scale-x-100" aria-hidden="true"></i></button></li>
              </ul>
            </nav>
          </div>
        </div>
      </section>

      <!-- ================= التبويب ٢: وسائل الدفع والسجل ================= -->
      <section id="panel-payments" role="tabpanel" aria-labelledby="tab-payments" tabindex="0" x-show="activeTab === 'payments'" x-cloak class="space-y-4 focus:outline-none sm:space-y-6">

        <div class="grid gap-4 lg:grid-cols-2 sm:gap-6">
          <!-- وسيلة الدفع الأساسية -->
          <div class="panel p-4 sm:p-6">
            <h2 class="mb-4 text-base font-extrabold text-ink" x-text="t('sub.pay.methodTitle')"></h2>
            <div class="flex items-start justify-between gap-4">
              <div class="flex min-w-0 items-center gap-4">
                <span class="grid h-12 w-16 shrink-0 place-items-center rounded-lg bg-soft text-brand" aria-hidden="true"><i class="fa-brands text-3xl" :class="brandIcon(card.brand)"></i></span>
                <div class="min-w-0">
                  <div class="flex flex-wrap items-center gap-2">
                    <p class="font-extrabold text-ink"><bdi dir="ltr" x-text="cardLabel(card)"></bdi></p>
                    <span class="badge badge-primary" x-text="t('sub.pay.default')"></span>
                    <span x-show="cardExpiring" class="badge badge-warning"><i class="fa-solid fa-clock text-[10px]" aria-hidden="true"></i><span x-text="t('sub.pay.expiringSoon')"></span></span>
                    <span x-show="cardExpired" x-cloak class="badge badge-danger"><i class="fa-solid fa-xmark text-[10px]" aria-hidden="true"></i><span x-text="t('sub.pay.expired')"></span></span>
                  </div>
                  <p class="mt-1 text-xs text-muted"><span x-text="tf('sub.pay.expires', { exp: '' })"></span><bdi dir="ltr" x-text="fmtExp(card)"></bdi></p>
                  <p class="truncate text-xs text-muted" x-text="card.holder"></p>
                </div>
              </div>

              <!-- إجراءات البطاقة: قائمة إفصاح (Disclosure) بالكيبورد -->
              <div class="relative shrink-0 sm:relative" @click.outside="cardMenu = false"
                   @keydown.escape="if (cardMenu) { $event.stopPropagation(); cardMenu = false; $refs.cardMenuBtn.focus(); }">
                <button type="button" x-ref="cardMenuBtn" class="act" @click="cardMenu = !cardMenu; cardMenu && $nextTick(() => $focus.within($refs.cardMenuList).first())"
                        :aria-expanded="cardMenu.toString()" aria-controls="card-menu" :aria-label="t('sub.pay.actions')">
                  <i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>
                </button>
                <ul id="card-menu" x-ref="cardMenuList" x-show="cardMenu" x-cloak x-transition.opacity.scale.95 class="menu py-1 sm:w-56" role="list"
                    @keydown.arrow-down.prevent="$focus.within($el).wrap().next()" @keydown.arrow-up.prevent="$focus.within($el).wrap().previous()"
                    @keydown.home.prevent="$focus.within($el).first()" @keydown.end.prevent="$focus.within($el).last()">
                  <li><button type="button" class="menu-item" @click="cardMenu = false; openModal('payment', $refs.cardMenuBtn)">
                    <i class="fa-solid fa-arrows-rotate w-4 text-muted" aria-hidden="true"></i><span x-text="t('sub.pay.edit')"></span></button></li>
                  <li class="border-t border-line"><button type="button" class="menu-item !text-danger" @click="cardMenu = false; openModal('removeCard', $refs.cardMenuBtn)">
                    <i class="fa-solid fa-trash w-4" aria-hidden="true"></i><span x-text="t('sub.pay.remove')"></span></button></li>
                </ul>
              </div>
            </div>
            <p class="mt-4 flex items-center gap-1.5 border-t border-line pt-3 text-xs text-muted"><i class="fa-solid fa-lock" aria-hidden="true"></i><span x-text="t('sub.pm.secure')"></span></p>
          </div>

          <!-- جهة الفوترة -->
          <div class="panel p-4 sm:p-6">
            <h2 class="mb-4 text-base font-extrabold text-ink" x-text="t('sub.pay.contactTitle')"></h2>
            <dl class="space-y-3 text-sm">
              <div><dt class="sr-only" x-text="t('sub.inv.panel.billTo')"></dt><dd class="font-extrabold text-ink" x-text="L(ORG.name)"></dd><dd class="text-muted" x-text="L(ORG.city)"></dd></div>
              <div><dt class="text-xs font-bold text-muted" x-text="t('sub.pay.billingEmail')"></dt><dd class="mt-0.5 font-bold text-ink"><bdi dir="ltr" x-text="ORG.email"></bdi></dd></div>
              <div><dt class="text-xs font-bold text-muted" x-text="t('sub.inv.panel.taxId')"></dt><dd class="mt-0.5 font-bold text-ink"><bdi dir="ltr" x-text="ORG.taxId"></bdi></dd></div>
            </dl>
            <a href="TenantSettingsForm.html" class="mt-4 inline-flex min-h-[2.25rem] items-center gap-1.5 rounded text-xs font-bold text-brand hover:underline">
              <i class="fa-solid fa-pen" aria-hidden="true"></i><span x-text="t('sub.pay.editContact')"></span>
            </a>
          </div>
        </div>

        <!-- سجل المدفوعات (مشتق من الفواتير) -->
        <div class="panel overflow-hidden">
          <div class="border-b border-line p-4 sm:px-5">
            <h2 id="log-title" class="text-base font-extrabold text-ink" x-text="t('sub.pay.logTitle')"></h2>
            <p class="mt-0.5 text-xs text-muted" x-text="t('sub.pay.logHint')"></p>
          </div>

          <ul class="grid grid-cols-1 gap-3 p-3 sm:grid-cols-2 sm:p-4 xl:hidden" role="list" aria-labelledby="log-title">
            <template x-for="p in paymentsShown" :key="p.id">
              <li class="min-w-0 rounded-xl border border-line p-4">
                <div class="flex items-start justify-between gap-3">
                  <p class="truncate font-extrabold leading-6"><bdi dir="ltr" x-text="p.id"></bdi></p>
                  <span class="badge shrink-0" :class="payMeta(p.kind).badge"><i class="fa-solid text-[10px]" :class="payMeta(p.kind).icon" aria-hidden="true"></i><span x-text="t('sub.pay.status.' + p.kind)"></span></span>
                </div>
                <p class="mt-1 text-xs text-muted"><time :datetime="iso(p.at)" x-text="fmtDateTime(p.at)"></time> · <bdi dir="ltr" x-text="cardLabel(p.card)"></bdi></p>
                <p x-show="p.code || p.reason" class="mt-1 text-xs font-bold" :class="p.kind === 'failed' ? 'text-danger' : 'text-info'"
                   x-text="p.code ? t('sub.pay.codes.' + p.code) : t('sub.pay.refundReasons.' + p.reason)"></p>
                <div class="mt-2 flex items-center justify-between gap-2 border-t border-line pt-2">
                  <button type="button" class="min-h-[2.25rem] rounded text-xs font-bold text-brand hover:underline" @click="openInvoice(p.inv)" :aria-label="tf('sub.pay.openInvoice', { n: p.inv.number })"><bdi dir="ltr" x-text="p.inv.number"></bdi></button>
                  <p class="text-lg font-extrabold tabular-nums" :class="p.kind === 'failed' ? 'text-muted line-through' : 'text-ink'" x-text="fmtMoney(p.amount)"></p>
                </div>
              </li>
            </template>
          </ul>

          <div class="hidden overflow-x-auto xl:block">
            <table class="w-full text-sm">
              <caption class="sr-only" x-text="t('sub.pay.logTitle')"></caption>
              <thead class="border-b border-line bg-soft/60 text-xs font-extrabold text-muted">
                <tr>
                  <th scope="col" class="px-5 py-3 text-start" x-text="t('sub.pay.cols.txn')"></th>
                  <th scope="col" class="px-4 py-3 text-start" x-text="t('sub.pay.cols.date')"></th>
                  <th scope="col" class="px-4 py-3 text-start" x-text="t('sub.pay.cols.invoice')"></th>
                  <th scope="col" class="px-4 py-3 text-start" x-text="t('sub.pay.cols.method')"></th>
                  <th scope="col" class="px-4 py-3 text-start" x-text="t('sub.pay.cols.ref')"></th>
                  <th scope="col" class="px-4 py-3 text-end" x-text="t('sub.pay.cols.amount')"></th>
                  <th scope="col" class="px-5 py-3 text-start" x-text="t('sub.pay.cols.status')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-line">
                <template x-for="p in paymentsShown" :key="p.id">
                  <tr class="transition-colors hover:bg-soft/40">
                    <th scope="row" class="px-5 py-3.5 text-start font-extrabold text-ink"><bdi dir="ltr" x-text="p.id"></bdi></th>
                    <td class="whitespace-nowrap px-4 py-3.5 text-muted"><time :datetime="iso(p.at)" x-text="fmtDateTime(p.at)"></time></td>
                    <td class="px-4 py-3.5"><button type="button" class="rounded font-bold text-brand hover:underline" @click="openInvoice(p.inv)" :aria-label="tf('sub.pay.openInvoice', { n: p.inv.number })"><bdi dir="ltr" x-text="p.inv.number"></bdi></button></td>
                    <td class="whitespace-nowrap px-4 py-3.5 text-muted"><bdi dir="ltr" x-text="cardLabel(p.card)"></bdi></td>
                    <td class="max-w-[12rem] truncate px-4 py-3.5 font-mono text-xs text-muted"><bdi dir="ltr" x-text="p.ref"></bdi></td>
                    <td class="whitespace-nowrap px-4 py-3.5 text-end font-bold tabular-nums" :class="p.kind === 'failed' ? 'text-muted line-through' : 'text-ink'" x-text="fmtMoney(p.amount)"></td>
                    <td class="px-5 py-3.5">
                      <span class="badge" :class="payMeta(p.kind).badge"><i class="fa-solid text-[10px]" :class="payMeta(p.kind).icon" aria-hidden="true"></i><span x-text="t('sub.pay.status.' + p.kind)"></span></span>
                      <span x-show="p.code || p.reason" class="mt-1 block text-xs font-bold" :class="p.kind === 'failed' ? 'text-danger' : 'text-info'"
                            x-text="p.code ? t('sub.pay.codes.' + p.code) : t('sub.pay.refundReasons.' + p.reason)"></span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <div x-show="payments.length > 8" class="border-t border-line p-3 text-center">
            <button type="button" class="btn btn-outline btn-sm" :aria-expanded="(logLimit >= payments.length).toString()" @click="toggleLog()"
                    x-text="logLimit < payments.length ? tf('sub.pay.showMore', { n: fmt(payments.length - logLimit) }) : t('sub.pay.showLess')"></button>
          </div>
        </div>
      </section>
    </main>

    <!-- ================= Footer ================= -->
    <footer class="mt-auto border-t border-line bg-card/60" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
      <div class="mx-auto flex w-full min-w-0 max-w-[1400px] flex-col gap-4 px-3 py-5 sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-8">
        <div class="flex min-w-0 items-center gap-3">
          <img src="../asset/images/firob-logo.png" alt="FirOb" width="108" height="28" loading="lazy" decoding="async" class="block h-7 w-auto shrink-0 object-contain dark:brightness-125">
          <p class="min-w-0 text-sm text-muted">
            <span x-text="t('footer.tagline')"></span>
            <span class="block text-xs sm:inline sm:text-sm">
              <span class="hidden sm:inline" aria-hidden="true">·</span>
              © <span class="tabular-nums" x-text="year"></span> <span x-text="t('footer.rights')"></span>
            </span>
          </p>
        </div>
        <nav :aria-label="t('footer.nav')" class="min-w-0">
          <ul class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm font-bold" role="list">
            <li><a href="../index.html" class="inline-flex min-h-[2.25rem] items-center gap-1.5 rounded text-muted underline-offset-4 transition-colors hover:text-brand hover:underline"><i class="fa-solid fa-sitemap text-xs" aria-hidden="true"></i><span x-text="t('footer.screens')"></span></a></li>
            <template x-for="k in ['help', 'docs', 'privacy', 'terms']" :key="k">
              <li><span class="inline-flex cursor-not-allowed items-center text-muted/70" aria-disabled="true"><span x-text="t('footer.' + k)"></span><span class="sr-only" x-text="' (' + t('footer.soon') + ')'"></span></span></li>
            </template>
          </ul>
        </nav>
        <p class="flex flex-wrap items-center gap-2 text-xs text-muted">
          <span class="badge badge-muted" dir="ltr" x-text="version"></span>
        </p>
      </div>
    </footer>
  </div>
</div>


<!-- ==========================================================================
     اللوحة الجانبية — تفاصيل الفاتورة (قابلة للطباعة)
     ابن مباشر لـ body: تُطبع وحدها عبر html.print-invoice
     ========================================================================== -->
<div id="invoice-overlay" x-show="invoiceOpen" x-cloak x-transition.opacity class="fixed inset-0 z-[60]">
  <div class="no-print absolute inset-0 bg-primary-900/60 backdrop-blur-sm" aria-hidden="true" @click="closeInvoice()"></div>
  <aside x-show="invoiceOpen" x-trap.noscroll.inert="invoiceOpen" role="dialog" aria-modal="true" aria-labelledby="inv-panel-title"
         x-transition:enter="transition duration-300 ease-out" x-transition:enter-start="translate-x-full rtl:-translate-x-full" x-transition:enter-end="translate-x-0"
         x-transition:leave="transition duration-200 ease-in" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full rtl:-translate-x-full"
         class="print-reset absolute inset-y-0 end-0 flex w-full max-w-xl flex-col border-s border-line bg-card shadow-pop">
    <template x-if="sel">
      <div class="print-reset flex min-h-0 flex-1 flex-col">
        <header class="no-print flex shrink-0 items-start justify-between gap-3 border-b border-line bg-soft p-4 sm:p-5" style="padding-top: max(1rem, env(safe-area-inset-top))">
          <div class="min-w-0">
            <p class="text-xs font-extrabold text-muted" x-text="t('sub.inv.panel.subtitle')"></p>
            <h2 id="inv-panel-title" class="mt-0.5 truncate text-lg font-extrabold text-ink"><bdi :dir="sel.upcoming ? null : 'ltr'" x-text="invNo(sel)"></bdi></h2>
          </div>
          <div class="flex shrink-0 items-center gap-1">
            <button type="button" class="icon-btn" :disabled="sel.upcoming" @click="printInvoice()" :aria-label="t('sub.inv.panel.print')" :title="t('sub.inv.panel.print')"><i class="fa-solid fa-print" aria-hidden="true"></i></button>
            <button type="button" class="icon-btn" @click="closeInvoice()" :aria-label="t('sub.inv.panel.close')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
        </header>

        <div id="invoice-print-area" class="print-reset min-h-0 flex-1 space-y-5 overflow-y-auto p-4 sm:p-5">
          <!-- ترويسة الطباعة -->
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <img src="../asset/images/firob-logo.png" alt="FirOb" width="108" height="28" class="block h-7 w-auto object-contain dark:brightness-125 print:brightness-100">
              <p class="print-only mt-2 text-lg font-extrabold text-ink"><bdi :dir="sel.upcoming ? null : 'ltr'" x-text="invNo(sel)"></bdi></p>
            </div>
            <span class="badge shrink-0" :class="invStatus(sel).badge"><i class="fa-solid text-[10px]" :class="invStatus(sel).icon" aria-hidden="true"></i><span x-text="t('sub.inv.status.' + sel.status)"></span></span>
          </div>

          <!-- ملاحظات الحالة -->
          <p x-show="sel.status === 'void'" class="alert-bar alert-info !p-3 text-sm font-bold text-ink" x-text="tf('sub.inv.panel.voidNote', { reason: t('sub.voidReasons.' + (sel.voidReason || 'duplicate')) })"></p>
          <p x-show="sel.status === 'draft'" class="alert-bar alert-info !p-3 text-sm font-bold text-ink" x-text="t('sub.inv.panel.draftNote')"></p>
          <p x-show="sel.status === 'uncollectible'" class="alert-bar alert-danger !p-3 text-sm font-bold text-ink" x-text="tf('sub.inv.panel.uncollectibleNote', { n: fmt(sel.attempts.length) })"></p>

          <!-- الأطراف -->
          <div class="grid grid-cols-1 gap-4 rounded-xl border border-line p-4 text-sm min-[440px]:grid-cols-2">
            <div class="min-w-0">
              <p class="text-xs font-extrabold text-muted" x-text="t('sub.inv.panel.seller')"></p>
              <p class="mt-1 font-bold text-ink" x-text="L(SELLER.name)"></p>
              <p class="text-muted" x-text="L(SELLER.city)"></p>
              <p class="text-muted"><bdi dir="ltr" x-text="SELLER.email"></bdi></p>
              <p class="text-xs text-muted"><span x-text="t('sub.inv.panel.taxId') + ': '"></span><bdi dir="ltr" x-text="SELLER.taxId"></bdi></p>
            </div>
            <div class="min-w-0">
              <p class="text-xs font-extrabold text-muted" x-text="t('sub.inv.panel.billTo')"></p>
              <p class="mt-1 font-bold text-ink" x-text="L(ORG.name)"></p>
              <p class="text-muted" x-text="L(ORG.city)"></p>
              <p class="text-muted"><bdi dir="ltr" x-text="ORG.email"></bdi></p>
              <p class="text-xs text-muted"><span x-text="t('sub.inv.panel.taxId') + ': '"></span><bdi dir="ltr" x-text="ORG.taxId"></bdi></p>
            </div>
          </div>

          <!-- التواريخ -->
          <dl class="grid grid-cols-2 gap-3 text-sm sm:grid-cols-3">
            <div><dt class="text-xs font-bold text-muted" x-text="t('sub.inv.panel.issued')"></dt><dd class="mt-0.5 font-bold text-ink"><time :datetime="iso(sel.issued)" x-text="fmtDate(sel.issued)"></time></dd></div>
            <div><dt class="text-xs font-bold text-muted" x-text="t('sub.inv.panel.due')"></dt><dd class="mt-0.5 font-bold text-ink"><time :datetime="iso(sel.due)" x-text="fmtDate(sel.due)"></time></dd></div>
            <div x-show="paidAt(sel)"><dt class="text-xs font-bold text-muted" x-text="t('sub.inv.panel.paidAt')"></dt><dd class="mt-0.5 font-bold text-ok"><time :datetime="paidAt(sel) ? iso(paidAt(sel)) : null" x-text="paidAt(sel) ? fmtDate(paidAt(sel)) : ''"></time></dd></div>
          </dl>

          <!-- البنود -->
          <div class="overflow-x-auto rounded-xl border border-line">
            <table class="w-full text-sm">
              <caption class="sr-only" x-text="t('sub.inv.panel.lineItems')"></caption>
              <thead class="border-b border-line bg-soft/60 text-xs font-extrabold text-muted">
                <tr>
                  <th scope="col" class="px-3 py-2.5 text-start" x-text="t('sub.inv.panel.desc')"></th>
                  <th scope="col" class="px-2 py-2.5 text-center" x-text="t('sub.inv.panel.qty')"></th>
                  <th scope="col" class="px-2 py-2.5 text-end" x-text="t('sub.inv.panel.unit')"></th>
                  <th scope="col" class="px-3 py-2.5 text-end" x-text="t('sub.inv.panel.total')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-line">
                <template x-for="(l, idx) in sel.lines" :key="idx">
                  <tr>
                    <td class="px-3 py-2.5 align-top">
                      <span class="block font-bold text-ink" x-text="lineDesc(l)"></span>
                      <span x-show="l.from" class="block text-xs text-muted" x-text="l.from ? t('sub.inv.panel.period') + ': ' + fmtDate(l.from) + ' – ' + fmtDate(l.to) : ''"></span>
                    </td>
                    <td class="px-2 py-2.5 text-center align-top tabular-nums text-muted" x-text="fmt(l.qty)"></td>
                    <td class="whitespace-nowrap px-2 py-2.5 text-end align-top tabular-nums text-muted" x-text="fmtMoney(l.unit)"></td>
                    <td class="whitespace-nowrap px-3 py-2.5 text-end align-top font-bold tabular-nums text-ink" x-text="fmtMoney(l.qty * l.unit)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- الإجماليات (مشتقة من البنود) -->
          <dl class="space-y-1.5 rounded-xl border border-line p-4 text-sm">
            <div class="flex items-center justify-between gap-3"><dt class="text-muted" x-text="t('sub.inv.panel.subtotal')"></dt><dd class="font-bold tabular-nums text-ink" x-text="fmtMoney(sel.t.sub)"></dd></div>
            <div class="flex items-center justify-between gap-3"><dt class="text-muted" x-text="tf('sub.inv.panel.tax', { rate: fmt(TAX_RATE * 100) })"></dt><dd class="font-bold tabular-nums text-ink" x-text="fmtMoney(sel.t.tax)"></dd></div>
            <div class="flex items-center justify-between gap-3 border-t border-line pt-2 text-base"><dt class="font-extrabold text-ink" x-text="t('sub.inv.panel.grand')"></dt><dd class="font-extrabold tabular-nums text-brand" x-text="fmtMoney(sel.t.total)"></dd></div>
            <div x-show="sel.t.paid" class="flex items-center justify-between gap-3"><dt class="text-muted" x-text="t('sub.inv.panel.paid')"></dt><dd class="font-bold tabular-nums text-ok" x-text="fmtMoney(-sel.t.paid)"></dd></div>
            <div x-show="sel.t.refunded" class="flex items-center justify-between gap-3"><dt class="text-muted" x-text="t('sub.inv.panel.refunded')"></dt><dd class="font-bold tabular-nums text-info" x-text="fmtMoney(sel.t.refunded)"></dd></div>
            <div class="flex items-center justify-between gap-3 border-t border-line pt-2"><dt class="font-extrabold text-ink" x-text="t('sub.inv.panel.amountDue')"></dt><dd class="font-extrabold tabular-nums" :class="sel.t.due ? 'text-danger' : 'text-ink'" x-text="fmtMoney(sel.t.due)"></dd></div>
          </dl>

          <p x-show="paidCard(sel)" class="text-xs text-muted">
            <span x-text="t('sub.inv.panel.method') + ': '"></span><bdi dir="ltr" x-text="paidCard(sel) ? cardLabel(paidCard(sel)) : ''"></bdi>
          </p>
          <p class="no-print text-[11px] text-muted" x-text="t('sub.inv.panel.sellerNote')"></p>
        </div>

        <footer class="no-print flex shrink-0 flex-wrap items-center justify-end gap-2 border-t border-line p-3 sm:p-4" style="padding-bottom: max(.75rem, env(safe-area-inset-bottom))">
          <button type="button" class="btn btn-outline" @click="closeInvoice()" x-text="t('sub.inv.panel.close')"></button>
          <button x-show="payable(sel)" type="button" class="btn btn-primary" aria-haspopup="dialog" @click="openPay(sel, $el)">
            <i class="fa-solid fa-credit-card" aria-hidden="true"></i><span x-text="t('sub.inv.payNow')"></span>
          </button>
          <button type="button" class="btn btn-outline" :disabled="!canDownload(sel)" :aria-busy="(downloading === sel.id).toString()" @click="downloadPdf(sel)" :title="canDownload(sel) ? null : t('sub.inv.noPdf')">
            <i class="fa-solid" :class="downloading === sel.id ? 'fa-circle-notch animate-spin' : 'fa-download'" aria-hidden="true"></i><span x-text="t('sub.inv.download')"></span>
          </button>
        </footer>
      </div>
    </template>
  </aside>
</div>

<!-- ==========================================================================
     نافذة — تغيير الباقة (اختيار ← مراجعة التكلفة ← تأكيد)
     ========================================================================== -->
<div x-show="modal === 'upgrade'" x-cloak x-transition.opacity class="fixed inset-0 z-[70] overflow-y-auto p-3 sm:p-6">
  <div class="fixed inset-0 bg-primary-900/60 backdrop-blur-sm" aria-hidden="true" @click="closeModal()"></div>
  <div class="relative mx-auto flex min-h-full max-w-5xl items-center">
    <div x-show="modal === 'upgrade'" x-trap.noscroll.inert="modal === 'upgrade'" role="dialog" aria-modal="true" aria-labelledby="upgrade-title" aria-describedby="upgrade-desc"
         x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="opacity-0 scale-95"
         class="modal-panel max-w-5xl">

      <header class="flex shrink-0 items-start justify-between gap-3 border-b border-line bg-soft p-4 sm:p-5">
        <div class="min-w-0">
          <h2 id="upgrade-title" class="text-lg font-extrabold text-ink" x-text="t('sub.upgrade.title')"></h2>
          <p id="upgrade-desc" class="mt-0.5 text-sm text-muted" x-text="t('sub.upgrade.subtitle')"></p>
        </div>
        <button type="button" class="icon-btn shrink-0" :disabled="busy" @click="closeModal()" :aria-label="t('sub.upgrade.close')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      </header>

      <!-- الخطوة ١: اختيار الباقة -->
      <div x-show="upgrade.step === 'pick'" class="min-h-0 flex-1 overflow-y-auto p-4 sm:p-5">
        <div class="mb-6 flex flex-wrap items-center justify-center gap-3">
          <div class="seg" role="radiogroup" :aria-label="t('sub.upgrade.cycleLabel')" @keydown="cycleKey($event)">
            <template x-for="c in CYCLES" :key="c">
              <button type="button" role="radio" class="seg-btn" :id="'upc-' + c" :aria-checked="(upgrade.cycle === c).toString()"
                      :tabindex="upgrade.cycle === c ? 0 : -1" @click="upgrade.cycle = c" x-text="t('sub.cycle.' + c)"></button>
            </template>
          </div>
          <span class="badge badge-accent"><i class="fa-solid fa-gift text-[10px]" aria-hidden="true"></i><span x-text="t('sub.upgrade.annualBadge')"></span></span>
        </div>

        <ul class="grid grid-cols-1 gap-5 md:grid-cols-3" role="list">
          <template x-for="k in PLAN_KEYS" :key="k">
            <li class="plan-card" :class="k === sub.plan && 'is-current'">
              <span x-show="k === sub.plan" class="absolute -top-3 start-5 rounded-full bg-primary-500 px-3 py-1 text-xs font-extrabold text-white shadow" x-text="t('sub.upgrade.currentBadge')"></span>
              <h3 class="text-sm font-extrabold" :class="k === sub.plan ? 'text-brand' : 'text-muted'" x-text="t('sub.plans.' + k + '.name')"></h3>
              <p class="mt-2 flex flex-wrap items-baseline gap-1.5">
                <span class="text-3xl font-extrabold tabular-nums text-ink" x-text="fmtMoney(PLANS[k][upgrade.cycle], 0)"></span>
                <span class="text-sm font-bold text-muted" x-text="'/ ' + t('sub.per.' + upgrade.cycle)"></span>
              </p>
              <p class="mt-1 min-h-[1.25rem] text-xs font-bold text-ok"
                 x-text="upgrade.cycle === 'annual' ? tf('sub.upgrade.save', { amount: fmtMoney(annualSaving(k), 0) }) : tf('sub.upgrade.annualEq', { amount: fmtMoney(PLANS[k].annual, 0) })"></p>
              <ul class="mt-4 flex-1 space-y-2.5 text-sm" role="list">
                <template x-for="f in t('sub.plans.' + k + '.features')" :key="f">
                  <li class="flex items-start gap-2"><i class="fa-solid fa-circle-check mt-1 shrink-0 text-ok" aria-hidden="true"></i><span x-text="f"></span></li>
                </template>
              </ul>
              <p x-show="planAction(k) === 'blocked'" :id="'blk-' + k" class="err !mt-4"><i class="fa-solid fa-lock" aria-hidden="true"></i>
                <span x-text="tf('sub.upgrade.blocked', { used: fmt(sub.seatsUsed), limit: fmt(PLANS[k].seats) })"></span></p>
              <button type="button" class="btn mt-5 w-full" :id="'plan-btn-' + k" :class="planBtnClass(k)"
                      :disabled="['current', 'scheduled', 'blocked'].includes(planAction(k))"
                      :aria-describedby="planAction(k) === 'blocked' ? 'blk-' + k : null" @click="choosePlan(k)">
                <i class="fa-solid" :class="{ current: 'fa-check', scheduled: 'fa-calendar-check', upgrade: 'fa-arrow-trend-up', downgrade: 'fa-arrow-trend-down', blocked: 'fa-lock', cycle: 'fa-arrows-rotate' }[planAction(k)]" aria-hidden="true"></i>
                <span x-text="planActionLabel(k)"></span>
              </button>
            </li>
          </template>
        </ul>
      </div>

      <!-- الخطوة ٢: مراجعة التكلفة -->
      <template x-if="upgrade.step === 'review' && quote">
        <div class="flex min-h-0 flex-1 flex-col">
          <div class="min-h-0 flex-1 space-y-4 overflow-y-auto p-4 sm:p-5">
            <h3 id="review-title" tabindex="-1" class="text-base font-extrabold text-ink focus:outline-none" x-text="t('sub.upgrade.reviewTitle')"></h3>

            <div class="grid grid-cols-1 items-stretch gap-3 sm:grid-cols-[1fr_auto_1fr]">
              <div class="rounded-xl border border-line p-4">
                <p class="text-xs font-bold text-muted" x-text="t('sub.upgrade.from')"></p>
                <p class="mt-1 font-extrabold text-ink" x-text="t('sub.plans.' + sub.plan + '.name')"></p>
                <p class="text-sm text-muted"><span class="tabular-nums" x-text="fmtMoney(price)"></span> / <span x-text="t('sub.per.' + sub.cycle)"></span></p>
              </div>
              <span class="grid place-items-center text-brand" aria-hidden="true"><i class="fa-solid fa-arrow-left rotate-[-90deg] sm:rotate-0 sm:ltr:-scale-x-100"></i></span>
              <div class="rounded-xl border-2 border-primary-500 p-4">
                <p class="text-xs font-bold text-brand" x-text="t('sub.upgrade.to')"></p>
                <p class="mt-1 font-extrabold text-ink" x-text="t('sub.plans.' + upgrade.target + '.name')"></p>
                <p class="text-sm text-muted"><span class="tabular-nums" x-text="fmtMoney(quote.newPrice)"></span> / <span x-text="t('sub.per.' + upgrade.cycle)"></span></p>
              </div>
            </div>

            <dl x-show="quote.immediate" class="space-y-2 rounded-xl border border-line p-4 text-sm">
              <div class="flex items-center justify-between gap-3"><dt class="text-muted" x-text="quote.sameCycle ? t('sub.upgrade.charge') : t('sub.upgrade.chargeFull')"></dt><dd class="font-bold tabular-nums text-ink" x-text="fmtMoney(quote.charge || 0)"></dd></div>
              <div class="flex items-center justify-between gap-3"><dt class="text-muted" x-text="tf('sub.upgrade.credit', { n: fmt(quote.daysLeft || 0) })"></dt><dd class="font-bold tabular-nums text-ok" x-text="fmtMoney(-(quote.credit || 0))"></dd></div>
              <div class="flex items-center justify-between gap-3"><dt class="text-muted" x-text="tf('sub.upgrade.tax', { rate: fmt(TAX_RATE * 100) })"></dt><dd class="font-bold tabular-nums text-ink" x-text="fmtMoney(quote.tax || 0)"></dd></div>
              <div class="flex items-center justify-between gap-3 border-t border-line pt-2 text-base"><dt class="font-extrabold text-ink" x-text="t('sub.upgrade.dueNow')"></dt><dd class="font-extrabold tabular-nums text-brand" x-text="fmtMoney(quote.dueNow || 0)"></dd></div>
            </dl>

            <div class="alert-bar alert-info">
              <div class="flex min-w-0 flex-1 items-start gap-3">
                <i class="fa-solid fa-circle-info a-ic mt-0.5 shrink-0" aria-hidden="true"></i>
                <p class="text-sm font-bold leading-6 text-ink"
                   x-text="quote.immediate ? tf('sub.upgrade.effectiveNow', { card: cardLabel(card), date: fmtDate(quote.renewal), amount: fmtMoney(quote.nextTotal) })
                                           : tf('sub.upgrade.effectiveLater', { date: fmtDateLong(quote.effective), amount: fmtMoney(quote.nextTotal) })"></p>
              </div>
            </div>
            <p x-show="quote.immediate" class="hint" x-text="t('sub.upgrade.estimate')"></p>
            <p class="sr-only" role="status" x-text="busy ? t('sub.upgrade.processing') : ''"></p>
          </div>
          <footer class="flex shrink-0 flex-col-reverse gap-2 border-t border-line bg-page/40 p-3 sm:flex-row sm:items-center sm:justify-between sm:p-4">
            <button type="button" class="btn btn-outline" :disabled="busy" @click="backToPlans()">
              <i class="fa-solid fa-arrow-right text-xs ltr:-scale-x-100" aria-hidden="true"></i><span x-text="t('sub.upgrade.back')"></span>
            </button>
            <button type="button" class="btn" :class="[quote.immediate ? 'btn-accent' : 'btn-primary', busy ? 'pointer-events-none opacity-80' : '']" :aria-disabled="busy.toString()" @click="confirmPlan()">
              <i class="fa-solid" :class="busy ? 'fa-circle-notch animate-spin' : (quote.immediate ? 'fa-lock' : 'fa-calendar-check')" aria-hidden="true"></i>
              <span x-text="busy ? t('sub.upgrade.processing') : (quote.immediate ? tf('sub.upgrade.confirmUpgrade', { amount: fmtMoney(quote.dueNow) }) : t('sub.upgrade.confirmSchedule'))"></span>
            </button>
          </footer>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- ==========================================================================
     نافذة — تحديث وسيلة الدفع (نمط Stripe Payment Element)
     ========================================================================== -->
<div x-show="modal === 'payment'" x-cloak x-transition.opacity class="fixed inset-0 z-[70] grid place-items-center overflow-y-auto p-3 sm:p-4">
  <div class="fixed inset-0 bg-primary-900/60 backdrop-blur-sm" aria-hidden="true" @click="closeModal()"></div>
  <form x-show="modal === 'payment'" x-trap.noscroll.inert="modal === 'payment'" role="dialog" aria-modal="true" aria-labelledby="pm-title" novalidate
        @submit.prevent="savePaymentMethod()"
        x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="opacity-0 scale-95"
        class="modal-panel max-w-lg">
    <header class="flex shrink-0 items-center justify-between gap-3 border-b border-line bg-soft p-4 sm:p-5">
      <h2 id="pm-title" class="text-lg font-extrabold text-ink" x-text="t('sub.pm.title')"></h2>
      <button type="button" class="icon-btn" :disabled="busy" @click="closeModal()" :aria-label="t('sub.pm.cancel')"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </header>

    <div class="min-h-0 flex-1 space-y-4 overflow-y-auto p-4 sm:p-5">
      <p class="flex items-center gap-2 text-sm text-muted">
        <i class="fa-brands text-xl text-brand" :class="brandIcon(card.brand)" aria-hidden="true"></i>
        <span x-text="t('sub.pm.current') + ':'"></span> <bdi dir="ltr" class="font-bold text-ink" x-text="cardLabel(card) + ' · ' + fmtExp(card)"></bdi>
      </p>

      <div>
        <label for="pm-holder" class="label" x-text="t('sub.pm.holder')"></label>
        <input id="pm-holder" type="text" class="field" autocomplete="cc-name" required aria-required="true" autofocus x-model="pm.holder" :placeholder="t('sub.pm.holderPh')"
               :aria-invalid="(!!pm.holderErr).toString()" :aria-describedby="pm.holderErr ? 'pm-holder-err' : null" @input="pm.holderErr && pm.holder.trim() && (pm.holderErr = '')">
        <p id="pm-holder-err" x-show="pm.holderErr" class="err"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span x-text="pm.holderErr"></span></p>
      </div>

      <!-- في الإنتاج: <div id="payment-element"></div> + stripe.elements().create('payment').mount(...) — لا حقول بطاقة خام هنا -->
      <div>
        <p id="pm-el-label" class="label" x-text="t('sub.pm.element')"></p>
        <div class="stripe-el" role="group" aria-labelledby="pm-el-label" aria-describedby="pm-el-note">
          <p class="mb-3 flex items-center gap-2 text-xs font-extrabold text-muted"><i class="fa-brands fa-stripe text-2xl text-brand" aria-hidden="true"></i><span x-text="t('sub.pm.elementMock')"></span></p>
          <div class="grid grid-cols-2 gap-2" aria-hidden="true">
            <template x-for="(lbl, i) in t('sub.pm.elementFields')" :key="i">
              <div class="rounded-md border border-line bg-page/50 px-3 py-2.5 text-xs text-muted" :class="i === 0 && 'col-span-2'" x-text="lbl"></div>
            </template>
          </div>
        </div>
        <p id="pm-el-note" class="hint flex items-start gap-1.5"><i class="fa-solid fa-lock mt-0.5" aria-hidden="true"></i><span x-text="t('sub.pm.elementNote')"></span></p>
      </div>

      <fieldset class="rounded-xl border border-dashed border-line-strong/70 p-3">
        <legend class="px-1 text-xs font-extrabold text-muted" x-text="t('sub.pm.scenario')"></legend>
        <div class="flex flex-wrap gap-x-5">

   * مكوّن الاختيار المخصص (Select-only Combobox — نمط WAI-ARIA APG).
   * ↓/↑ Home/End · Enter/Space اختيار · Tab اختيار وانتقال · Esc إغلاق (دون إغلاق اللوحة الأم)
   * · البحث بأول الأحرف · ينقلب للأعلى عند ضيق المساحة.
   */
  function selectDropdown({ id, options, get, set, disabled = () => false }) {
    return {
      open: false, active: -1, dropUp: false, _q: '', _qt: null,
      get items() { return options(); },
      get isDisabled() { return !!disabled(); },
      get selectedItem() { const val = get(); return this.items.find(o => o.value === val) ?? null; },
      get triggerLabel() { return this.selectedItem ? this.selectedItem.label : ''; },
      get activeId() { return this.open && this.active > -1 && this.items[this.active] ? this.optId(this.items[this.active]) : null; },
      optId(item) { return id + '-opt-' + item.value; },
      isSelected(item) { return get() === item.value; },
      openList() {
        if (this.isDisabled || !this.items.length) return;
        const r = this.$refs.btn.getBoundingClientRect();
        const need = Math.min(224, this.items.length * 46 + 16);
        this.dropUp = r.bottom + need > window.innerHeight - 8 && r.top > need;
        this.active = Math.max(0, this.items.findIndex(o => o.value === get()));
        this.open = true;
        this.scrollActiveIntoView();
      },
      closeList() { this.open = false; this.active = -1; },
      toggleList() { this.open ? this.closeList() : this.openList(); },
      choose(item, refocus = true) { set(item.value); this.closeList(); if (refocus) this.$refs.btn?.focus(); },
      move(step) {
        if (!this.open) { this.openList(); return; }
        this.active = Math.min(Math.max(this.active + step, 0), this.items.length - 1);
        this.scrollActiveIntoView();
      },
      scrollActiveIntoView() {
        this.$nextTick(() => {
          const list = this.$refs.list, el = list?.children[this.active];
          if (!list || !el) return;
          /* تمرير يدوي داخل القائمة فقط (scrollIntoView قد يحرّك الصفحة أو اللوحة) */
          if (el.offsetTop < list.scrollTop) list.scrollTop = el.offsetTop - 6;
          else if (el.offsetTop + el.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = el.offsetTop + el.offsetHeight - list.clientHeight + 6;
        });
      },
      onKey(e) {
        if (this.isDisabled) return;
        const k = e.key;
        if (k === 'ArrowDown') { e.preventDefault(); this.move(1); }
        else if (k === 'ArrowUp') { e.preventDefault(); this.move(-1); }
        else if (k === 'Home' && this.open) { e.preventDefault(); this.active = 0; this.scrollActiveIntoView(); }
        else if (k === 'End' && this.open) { e.preventDefault(); this.active = this.items.length - 1; this.scrollActiveIntoView(); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); this.open && this.active > -1 ? this.choose(this.items[this.active]) : this.openList(); }
        else if (k === 'Escape' && this.open) { e.preventDefault(); e.stopPropagation(); this.closeList(); }

     payment_methods, charges) عبر مكوّن Livewire. التواريخ نسبية لـ "الآن" فلا تتقادم.

  const DAY = 864e5, HOUR = 36e5;
  const startOfDay = (ts) => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const addMonths = (ts, n) => {
    const d = new Date(ts), day = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + n);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    return d.getTime();
  };
  const isoDate = (ts) => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const round2 = (n) => Math.round(n * 100) / 100;
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  /* الأسعار والحدود — تُحمَّل من الخادم (config/plans.php ↔ Stripe Prices) */
  const PLANS = Object.freeze({

  const PLAN_KEYS = ['starter', 'pro', 'enterprise'];

  const TAX_RATE = 0.05;        /* ضريبة القيمة المضافة — من إعدادات الضريبة للمستأجر */
  const AI_PACK = 49;

  const ORG = Object.freeze({

  const INV_STATUS = {

  function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
  const UP = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', MIX = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
  const code = (r, n, chars) => Array.from({ length: n }, () => chars[Math.floor(r() * chars.length)]).join('');

  function invoiceTotals(inv) {
    const sub = round2(inv.lines.reduce((s, l) => s + l.qty * l.unit, 0));
    const tax = round2(Math.max(0, sub) * TAX_RATE);
    const total = round2(sub + tax);
    const paid = inv.attempts.some(a => a.ok) ? total : 0;
    const refunded = round2(inv.refunds.reduce((s, f) => s + f.amount, 0));
    const due = (inv.status === 'open' || inv.status === 'uncollectible') ? total : 0;
    return { sub, tax, total, paid, refunded, due };
  }

  /* يبني 15 فاتورة متسقة مع سجل المدفوعات: كل دفعة مشتقة من محاولة تحصيل على فاتورة */
  function buildBilling(NOW) {
    const r = rng(20261019);
    const today = startOfDay(NOW);
    const periodEnd = today + 9 * DAY + 9 * HOUR;
    const periodStart = addMonths(periodEnd, -1);
    const CARD = { brand: 'visa', last4: '4242' }, OLD = { brand: 'mastercard', last4: '4444' };
    const planLine = (from) => ({ kind: 'plan', plan: 'pro', cycle: 'monthly', qty: 1, unit: PLANS.pro.monthly, from, to: addMonths(from, 1) });
    const list = [];

    for (let k = 0; k <= 11; k++) {
      const issued = addMonths(periodStart, -k);
      const card = k >= 6 ? OLD : CARD;
      const inv = { issued, due: issued + 7 * DAY, status: 'paid', lines: [planLine(issued)], attempts: [], refunds: [] };
      if (k === 8) {
        inv.status = 'uncollectible';
        inv.attempts = [0, 3, 7].map(d => ({ at: issued + d * DAY + HOUR, ok: false, code: d === 7 ? 'expired_card' : 'insufficient_funds', card }));
      } else if (k === 1) {
        inv.attempts = [{ at: issued + HOUR, ok: false, code: 'card_declined', card }, { at: issued + DAY + 2 * HOUR, ok: true, card }];
      } else {
        inv.attempts = [{ at: issued + HOUR, ok: true, card }];
      }
      if (k === 3) inv.refunds = [{ at: issued + 12 * DAY, amount: 50, reason: 'serviceCredit', card }];
      list.push(inv);
    }
    const pack = (qty) => ({ kind: 'aiPack', qty, unit: AI_PACK });
    const p1 = addMonths(periodStart, -2) + 10 * DAY;
    list.push({ issued: p1, due: p1 + 7 * DAY, status: 'paid', lines: [pack(1)], attempts: [{ at: p1 + HOUR, ok: true, card: CARD }], refunds: [] });
    const p2 = addMonths(periodStart, -5) + 4 * DAY;
    list.push({ issued: p2, due: p2 + 7 * DAY, status: 'void', voidReason: 'duplicate', lines: [pack(1)], attempts: [], refunds: [] });
    const p3 = today - 3 * DAY + 10 * HOUR;
    list.push({ issued: p3, due: today + 4 * DAY + 10 * HOUR, status: 'open', lines: [pack(2)], attempts: [], refunds: [] });

    list.sort((a, b) => a.issued - b.issued);
    list.forEach((inv, i) => {
      inv.number = 'INV-' + new Date(inv.issued).getFullYear() + '-' + String(41 + i).padStart(4, '0');
      inv.id = inv.number;
      inv.attempts.forEach(a => { a.txn = 'TXN-' + code(r, 7, UP); a.ref = 'pi_' + code(r, 14, MIX); });
      inv.refunds.forEach(f => { f.txn = 'TXN-' + code(r, 7, UP); f.ref = 're_' + code(r, 14, MIX); });
      inv.t = invoiceTotals(inv);
    });

    /* البطاقة الحالية تنتهي نهاية الشهر بعد ~40 يومًا ⇒ تنبيه "تنتهي قريبًا" حقيقي */
    const exp = new Date(today + 40 * DAY);
    const card = { ...CARD, expMonth: exp.getMonth() + 1, expYear: exp.getFullYear(), holder: ORG.name.ar };
    return { periodStart, periodEnd, invoices: list.reverse(), card };
  }

      fmtMoney(v, d = 2) { return new Intl.NumberFormat(this.intl(), { style: 'currency', currency: 'USD', minimumFractionDigits: d, maximumFractionDigits: d }).format(v); },
      fmtDate(ts) { return new Intl.DateTimeFormat(this.intl(), { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(ts)); },
      fmtDateLong(ts) { return new Intl.DateTimeFormat(this.intl(), { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(ts)); },
      fmtDateTime(ts) { return new Intl.DateTimeFormat(this.intl(), { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date(ts)); },

      sub: { plan: 'pro', cycle: 'monthly', cancelAtPeriodEnd: false, scheduledPlan: null, scheduledCycle: null,

        return { fill: 'bg-brand', text: 'text-ink', warn: false };

          : this.tf('sub.seatsUsed', { used: this.fmt(this.sub.seatsUsed), total: this.fmt(this.seatsTotal) }) + ' (' + this.fmt(this.seatsPct) + '%)';
      },
      get unpaid() { return this.invoices.filter(i => i.status === 'open' || i.status === 'uncollectible').sort((a, b) => a.due - b.due); },
      get cardDaysLeft() { return Math.ceil((new Date(this.card.expYear, this.card.expMonth, 1).getTime() - Date.now()) / DAY); },
      get cardExpired() { return this.cardDaysLeft <= 0; },
      get cardExpiring() { return !this.cardExpired && this.cardDaysLeft <= 60; },
      cardLabel(c) { return ({ visa: 'Visa', mastercard: 'Mastercard' }[c.brand] || c.brand) + ' •••• ' + c.last4; },

      get renewalHint() {

      filters: { ...DEFAULTS }, page: 1, PER_PAGE: 6,
      get statusOptions() { return ['all', 'unpaid', 'paid', 'open', 'draft', 'void', 'uncollectible'].map(v => ({ value: v, label: this.t('sub.inv.status.' + v) })); },
