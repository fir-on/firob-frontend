      get paged() { const s = (this.page - 1) * this.PER_PAGE; return this.filtered.slice(s, s + this.PER_PAGE); },
      get rangeText() {
        const n = this.filtered.length, from = n ? (this.page - 1) * this.PER_PAGE + 1 : 0, to = Math.min(n, this.page * this.PER_PAGE);
        return this.tf('sub.inv.showing', { from: this.fmt(from), to: this.fmt(to), total: this.fmt(n) });
      },
      goPage(p) {
        this.page = Math.min(Math.max(1, p), this.pages);
        this.$nextTick(() => document.getElementById('inv-list-title')?.focus());
      },
      resetFilters() { this.filters = { ...DEFAULTS }; this.announce(this.t('sub.inv.cleared')); this.$nextTick(() => document.getElementById('inv-q')?.focus()); },

      /* ---------- سجل المدفوعات (مشتق من محاولات التحصيل والاسترداد) ---------- */
      logLimit: 8,
      get payments() {
        const out = [];
        this.invoices.forEach(inv => {
          inv.attempts.forEach(a => out.push({ id: a.txn, at: a.at, inv, kind: a.ok ? 'success' : 'failed', code: a.code, amount: inv.t.total, card: a.card, ref: a.ref }));
          inv.refunds.forEach(f => out.push({ id: f.txn, at: f.at, inv, kind: 'refunded', reason: f.reason, amount: -f.amount, card: f.card, ref: f.ref }));
        });
        return out.sort((a, b) => b.at - a.at);
      },
      get paymentsShown() { return this.payments.slice(0, this.logLimit); },
      payMeta(k) { return PAY_STATUS[k]; },
      toggleLog() {
        const more = this.logLimit < this.payments.length;
        this.logLimit = more ? this.payments.length : 8;
      },

      /* =====================================================================
         النوافذ — طبقة واحدة في كل مرة + إعادة التركيز إلى زر الفتح
         ===================================================================== */
      modal: null, busy: false, _trigger: null,
      openModal(name, trigger) {
        this._trigger = trigger || document.activeElement;
        if (name === 'payment') this.pm = { holder: '', scenario: 'success', error: '', holderErr: '' };
        if (name === 'cycle') this.cycleChoice = this.nextCycle;
        if (name === 'cancel') this.cancelReason = '';
        this.modal = name;
      },
      closeModal(force = false) {
        if (this.busy && !force) return;
        this.modal = null;
        this.restoreFocus();
      },
      restoreFocus() {
        const tr = this._trigger;
        setTimeout(() => {
          const a = document.activeElement;
          if (a && a !== document.body && a.offsetParent !== null) return;     /* x-trap أعاد التركيز بنجاح */
          if (tr && tr.isConnected && tr.offsetParent !== null) tr.focus();
          else document.getElementById('main')?.focus();
        }, 240);
      },
      switchModal(name) { const tr = this._trigger; this.modal = null; setTimeout(() => this.openModal(name, tr), 220); },

      /* ---------- تغيير الباقة: اختيار ← مراجعة ← تأكيد ---------- */
      upgrade: { step: 'pick', cycle: 'monthly', target: null },
      openUpgrade(trigger) { this.upgrade = { step: 'pick', cycle: this.sub.cycle, target: null }; this.openModal('upgrade', trigger); },
      annualSaving(k) { return PLANS[k].monthly * 12 - PLANS[k].annual; },
      planAction(k, cycle = this.upgrade.cycle) {
        if (k === this.sub.plan && cycle === this.sub.cycle) return 'current';
        if (k === this.nextPlan && cycle === this.nextCycle && this.hasSchedule) return 'scheduled';
        if (k === this.sub.plan) return 'cycle';
        if (PLANS[k].rank > PLANS[this.sub.plan].rank) return 'upgrade';
        return this.sub.seatsUsed > PLANS[k].seats ? 'blocked' : 'downgrade';
      },
      planActionLabel(k) {
        const a = this.planAction(k);
        return { current: this.t('sub.upgrade.current'), scheduled: this.t('sub.upgrade.scheduledBtn'), cycle: this.tf('sub.upgrade.switchCycle', { cycle: this.t('sub.cycleWord.' + this.upgrade.cycle) }),
                 upgrade: this.t('sub.upgrade.upgrade'), downgrade: this.t('sub.upgrade.downgrade'), blocked: this.t('sub.upgrade.downgrade') }[a];
      },
      planBtnClass(k) { const a = this.planAction(k); return a === 'upgrade' ? 'btn-accent' : (a === 'current' || a === 'scheduled' || a === 'blocked') ? 'btn-outline' : 'btn-primary'; },
      choosePlan(k) {
        const a = this.planAction(k);
        if (a === 'current' || a === 'scheduled' || a === 'blocked' || this.busy) return;
        this.upgrade.target = k; this.upgrade.step = 'review';
        this.$nextTick(() => document.getElementById('review-title')?.focus());
      },
      backToPlans() { const k = this.upgrade.target; this.upgrade.step = 'pick'; this.$nextTick(() => document.getElementById('plan-btn-' + k)?.focus()); },
      get quote() {
        const k = this.upgrade.target; if (!k) return null;
        const c = this.upgrade.cycle, action = this.planAction(k), newPrice = PLANS[k][c];
        if (action !== 'upgrade') {
          return { action, immediate: false, newPrice, effective: this.sub.periodEnd, nextTotal: round2(newPrice * (1 + TAX_RATE)) };
        }
        const span = this.sub.periodEnd - this.sub.periodStart, left = Math.max(0, this.sub.periodEnd - Date.now());
        const frac = span ? left / span : 0, sameCycle = c === this.sub.cycle;
        const credit = round2(this.price * frac);
        const charge = round2(sameCycle ? newPrice * frac : newPrice);
        const subtotal = round2(Math.max(0, charge - credit)), tax = round2(subtotal * TAX_RATE);
        const renewal = sameCycle ? this.sub.periodEnd : addMonths(Date.now(), c === 'annual' ? 12 : 1);
        return { action, immediate: true, sameCycle, newPrice, credit, charge, subtotal, tax, dueNow: round2(subtotal + tax),
                 daysLeft: Math.ceil(left / DAY), renewal, nextTotal: round2(newPrice * (1 + TAX_RATE)) };
      },
      async confirmPlan() {
        const q = this.quote; if (!q || this.busy) return;
        const k = this.upgrade.target, c = this.upgrade.cycle, oldPlan = this.sub.plan;
        this.busy = true;
        await sleep(900);
        if (q.immediate) {
          const now = Date.now();
          const inv = { issued: now, due: now, status: 'paid', attempts: [{ at: now, ok: true, card: { ...this.card }, txn: 'TXN-' + Math.random().toString(36).slice(2, 9).toUpperCase(), ref: 'pi_' + Math.random().toString(36).slice(2, 16) }], refunds: [],
                        lines: [{ kind: 'credit', plan: oldPlan, cycle: this.sub.cycle, qty: 1, unit: -q.credit }, { kind: 'charge', plan: k, cycle: c, qty: 1, unit: q.charge }] };
          inv.number = inv.id = 'INV-' + new Date(now).getFullYear() + '-' + String(41 + this.invoices.length).padStart(4, '0');
          inv.t = invoiceTotals(inv);
          this.invoices.unshift(inv);
          this.sub.plan = k; this.sub.cycle = c; this.sub.scheduledPlan = null; this.sub.scheduledCycle = null;
          if (!q.sameCycle) { this.sub.periodStart = now; this.sub.periodEnd = q.renewal; }
          this.toast('success', this.tf('sub.upgrade.toastUpgraded', { plan: this.t('sub.plans.' + k + '.name'), amount: this.fmtMoney(q.dueNow) }));
        } else {
          this.sub.scheduledPlan = k === this.sub.plan ? null : k;
          this.sub.scheduledCycle = c === this.sub.cycle ? null : c;
          this.toast('success', this.tf('sub.upgrade.toastScheduled', { plan: this.t('sub.plans.' + k + '.name'), date: this.fmtDate(this.sub.periodEnd) }));
        }
        this.busy = false;
        this.closeModal(true);
      },
      clearSchedule() {
        this.sub.scheduledPlan = null; this.sub.scheduledCycle = null;
        this.toast('success', this.t('sub.bc.toastReverted'));
      },

      /* ---------- دورة الفوترة (تُجدول لنهاية الدورة) ---------- */
      cycleChoice: 'monthly',
      openCycle(trigger) { this.openModal('cycle', trigger); },
      cycleKey(e, prop) {
        const rtl = document.documentElement.dir === 'rtl';
        const d = { ArrowRight: rtl ? -1 : 1, ArrowLeft: rtl ? 1 : -1, ArrowDown: 1, ArrowUp: -1, Home: -9, End: 9 }[e.key];
        if (d === undefined) return;
        e.preventDefault();
        const i = Math.min(Math.max(CYCLES.indexOf(this.upgrade.cycle) + d, 0), CYCLES.length - 1);
        this.upgrade.cycle = CYCLES[i];
        this.$nextTick(() => document.getElementById('upc-' + CYCLES[i])?.focus());
      },
      async saveCycle() {
        if (this.busy || this.cycleChoice === this.nextCycle) return;
        this.busy = true; await sleep(500);
        this.sub.scheduledCycle = this.cycleChoice === this.sub.cycle ? null : this.cycleChoice;
        this.busy = false;
        this.toast('success', this.sub.scheduledCycle
          ? this.tf('sub.bc.toastScheduled', { cycle: this.t('sub.cycleWord.' + this.cycleChoice), date: this.fmtDate(this.sub.periodEnd) })
          : this.t('sub.bc.toastReverted'));
        this.closeModal(true);
      },

      /* ---------- الإلغاء / الاستئناف (cancel_at_period_end) ---------- */
      cancelReason: '',
      toggleAutoRenew(el) { this.sub.cancelAtPeriodEnd ? this.resume() : this.openModal('cancel', el); },
      async confirmCancel() {
        if (this.busy) return;
        this.busy = true; await sleep(700);
        this.sub.cancelAtPeriodEnd = true; this.sub.scheduledPlan = null; this.sub.scheduledCycle = null;
        this.busy = false;
        this.toast('success', this.tf('sub.cs.toastCancelled', { date: this.fmtDate(this.sub.periodEnd) }));
        this.closeModal(true);
      },
      resume() {
        this.sub.cancelAtPeriodEnd = false;
        this.toast('success', this.t('sub.cs.toastResumed'));
      },

      /* ---------- وسيلة الدفع (نمط Stripe Elements: لا بيانات بطاقة خام في DOM) ---------- */
      cardMenu: false,
      pm: { holder: '', scenario: 'success', error: '', holderErr: '' },
      async savePaymentMethod() {
        if (this.busy) return;
        this.pm.error = '';
        if (!this.pm.holder.trim()) { this.pm.holderErr = this.t('sub.pm.holderReq'); this.$nextTick(() => document.getElementById('pm-holder')?.focus()); return; }
        this.pm.holderErr = '';
        this.busy = true; await sleep(900); this.busy = false;
        /* في الإنتاج: stripe.confirmSetup({ elements }) ثم Livewire يحفظ payment_method_id فقط */
        if (this.pm.scenario === 'declined') { this.pm.error = this.t('sub.pm.declined'); this.$nextTick(() => document.getElementById('pm-error')?.focus()); return; }
        const exp = new Date(Date.now() + 3 * 365 * DAY);
        this.card = { brand: 'mastercard', last4: '5454', expMonth: exp.getMonth() + 1, expYear: exp.getFullYear(), holder: this.pm.holder.trim() };
        this.toast('success', this.tf('sub.pm.toastSaved', { card: this.cardLabel(this.card) }));
        this.closeModal(true);
      },

      /* ---------- سداد فاتورة ---------- */
      payTarget: null,
      openPay(inv, trigger) { this.payTarget = inv; this.openModal('pay', trigger); },
      async confirmPay() {
        const inv = this.payTarget; if (!inv || this.busy || this.cardExpired) return;
        this.busy = true; await sleep(900);
        inv.attempts.push({ at: Date.now(), ok: true, card: { ...this.card }, txn: 'TXN-' + Math.random().toString(36).slice(2, 9).toUpperCase(), ref: 'pi_' + Math.random().toString(36).slice(2, 16) });
        inv.status = 'paid';
        inv.t = invoiceTotals(inv);
        this.busy = false;
        this.toast('success', this.tf('sub.payInv.toastPaid', { n: inv.number }));
        this.closeModal(true);
      },

      /* ---------- لوحة تفاصيل الفاتورة + الطباعة ---------- */
      invoiceOpen: false, sel: null,
      openInvoice(inv) { this.sel = inv; this.invoiceOpen = true; },
      closeInvoice() { this.invoiceOpen = false; },
      printInvoice() {
        document.documentElement.classList.add('print-invoice');
        window.print();
      },
      downloading: null,
      async downloadPdf(inv) {
        if (!this.canDownload(inv) || this.downloading) return;
        this.downloading = inv.id;
        await sleep(600);      /* في Laravel: $invoice->downloadPDF() عبر Cashier */
        this.downloading = null;
        this.toast('success', this.tf('sub.inv.toastPdf', { n: inv.number }));
      },

      /* ---------- Toast ---------- */
      toast(icon, msg) {
        this.announce(msg);
        if (!window.Swal) return;
        Swal.fire({ toast: true, position: 'top-end', icon, title: msg, showConfirmButton: false, timer: 3500, timerProgressBar: true,
          customClass: { popup: 'firob-swal firob-toast' },
          didOpen: (t) => { t.addEventListener('mouseenter', Swal.stopTimer); t.addEventListener('mouseleave', Swal.resumeTimer); } });
      },

      /* ---------- البحث العام ---------- */
      focusSearch() {
        if (this.modal || this.invoiceOpen) return;
        if (mdMQ.matches) { this.$refs.globalSearch?.focus(); this.$refs.globalSearch?.select(); return; }
        this.searchOpen = true; this.$nextTick(() => this.$refs.mobileSearch?.focus());
      },
      toggleMobileSearch() { this.searchOpen = !this.searchOpen; if (this.searchOpen) this.$nextTick(() => this.$refs.mobileSearch?.focus()); },
      closeMenu() { this.cardMenu = false; },

      /* ---------- عامة ---------- */
      init() {
        desktopMQ.addEventListener('change', (m) => { this.mobile = !m.matches; if (m.matches) this.mobileNav = false; });
        mdMQ.addEventListener('change', (m) => { if (m.matches) this.searchOpen = false; });
        try { this.collapsed = localStorage.getItem('firob-sidebar') === 'collapsed'; } catch (e) {}
        document.title = this.t('sub.title') + ' — FirOb';
        const h = (location.hash || '').slice(1);
        if (this.TABS.some(x => x.key === h)) this.activeTab = h;
        /* تغيير الفلاتر: العودة للصفحة الأولى + إعلان عدد النتائج (مؤجَّل) */
        this.$watch('filters', () => {
          this.page = 1;
          clearTimeout(this._annT);
          this._annT = setTimeout(() => this.announce(this.tf('sub.inv.resultsAnnounce', { n: this.fmt(this.filtered.length) })), 450);
        }, { deep: true });
        this.$watch('cardMenu', (v) => { this.openMenuId = v ? 'card' : null; });
        window.addEventListener('afterprint', () => document.documentElement.classList.remove('print-invoice'));
        try {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            let saved = null; try { saved = localStorage.getItem('firob-theme'); } catch (_) {}
            if (!saved) this.applyTheme(e.matches);
          });
        } catch (e) {}
      },
      toggleSidebar() {
        if (this.mobile) { this.mobileNav = !this.mobileNav; return; }
        this.collapsed = !this.collapsed;
        try { localStorage.setItem('firob-sidebar', this.collapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      },
      closeMobileNav() { this.mobileNav = false; this.$nextTick(() => this.$refs.navToggle?.focus()); },
      applyTheme(isDark) {
        document.body.classList.add('theme-anim');
        this.dark = isDark;
        document.documentElement.classList.toggle('dark', isDark);
        document.getElementById('theme-color')?.setAttribute('content', isDark ? '#09141B' : '#F1EDE7');
        clearTimeout(this._themeT); this._themeT = setTimeout(() => document.body.classList.remove('theme-anim'), 350);
      },
      toggleTheme() {
        this.applyTheme(!this.dark);
        try { localStorage.setItem('firob-theme', this.dark ? 'dark' : 'light'); } catch (e) {}
      },
      /* Esc: يغلق الطبقة العليا فقط */
      closeAll() {
        if (this.modal)       { this.closeModal(); return; }
        if (this.invoiceOpen) { this.closeInvoice(); return; }
        if (this.cardMenu)    { this.cardMenu = false; this.$refs.cardMenuBtn?.focus(); return; }
        if (this.notifOpen)   { this.notifOpen = false;   this.$refs.notifBtn?.focus(); return; }
        if (this.profileOpen) { this.profileOpen = false; this.$refs.profileBtn?.focus(); return; }
        if (this.searchOpen)  { this.searchOpen = false; return; }
        if (this.mobileNav)   { this.closeMobileNav(); }
      },
    };
  }
</script>
</body>
