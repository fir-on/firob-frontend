<style>
  [x-cloak]{display:none !important}
  html{scroll-padding-top:5.5rem}
  body{-webkit-font-smoothing:antialiased}

  @keyframes swing{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(247,217,51,.55),0 10px 30px -10px rgba(14,128,161,.6)}50%{box-shadow:0 0 0 10px rgba(247,217,51,0),0 14px 40px -8px rgba(14,128,161,.8)}}
  @keyframes ping2{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.4);opacity:0}}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  @keyframes dash{to{stroke-dashoffset:-24}}

  .anim-swing{transform-origin:50% 0;animation:swing 2.4s ease-in-out infinite}
  .anim-float{animation:float 6s ease-in-out infinite}
  .anim-float-d{animation:float 7s ease-in-out 1.2s infinite}
  .anim-glow{animation:pulseGlow 2.6s ease-in-out infinite}
  .anim-ping{animation:ping2 1.6s cubic-bezier(0,0,.2,1) infinite}
  .anim-orbit{animation:orbit 14s linear infinite}
  .anim-orbit-r{animation:orbit 18s linear infinite reverse}
  .eq-bar{transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}
  .flow-dash{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}

  .glow-card{position:relative;isolation:isolate}
  .glow-card::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;opacity:0;transition:opacity .35s;
    background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(14,128,161,.18),transparent 45%)}
  .dark .glow-card::before{background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(247,217,51,.10),transparent 45%)}
  .glow-card:hover::before{opacity:1}

  .grid-bg{background-image:linear-gradient(rgba(14,128,161,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(14,128,161,.08) 1px,transparent 1px);background-size:44px 44px}
  .dark .grid-bg{background-image:linear-gradient(rgba(95,184,207,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(95,184,207,.06) 1px,transparent 1px)}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:999px;background:linear-gradient(to right,#0E80A1 0%,#0E80A1 var(--p,50%),rgba(14,128,161,.18) var(--p,50%));outline:none}
  [dir=rtl] input[type=range]{background:linear-gradient(to left,#0E80A1 0%,#0E80A1 var(--p,50%),rgba(14,128,161,.18) var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#F7D933;border:3px solid #073C4C;cursor:pointer;box-shadow:0 2px 10px rgba(7,60,76,.35)}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#F7D933;border:3px solid #073C4C;cursor:pointer}
  input[type=range]:focus-visible{outline:3px solid #F7D933;outline-offset:4px}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}

<section id="top" class="relative -mt-24 pt-32 sm:pt-36 pb-28 lg:pb-36 overflow-hidden">

  <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 grid lg:grid-cols-12 gap-12 lg:gap-8 items-center">
    <div class="lg:col-span-6">
      <p class="inline-flex items-center gap-2.5 rounded-full border border-primary-500/25 bg-surface/70 dark:bg-surface-dark/60 backdrop-blur-md px-3.5 py-1.5 text-xs sm:text-sm font-bold text-primary-700 dark:text-primary-200">
        <span class="relative flex w-2.5 h-2.5"><span class="absolute inset-0 rounded-full bg-accent-500 anim-ping"></span><span class="relative w-2.5 h-2.5 rounded-full bg-accent-500"></span></span>

      </p>
      <h1 class="mt-6 text-4xl sm:text-5xl xl:text-6xl font-extrabold leading-[1.2] tracking-tight">
        <span x-text="t('hero_t1')"></span><br>
        <span class="bg-gradient-to-l rtl:bg-gradient-to-r from-primary-500 via-primary-400 to-primary-700 dark:from-accent-400 dark:via-accent-300 dark:to-primary-300 bg-clip-text text-transparent" x-text="t('hero_t2')"></span>
      </h1>
      <p class="mt-5 text-xl font-extrabold text-primary-700 dark:text-accent-400" x-text="t('hero_slogan')"></p>
      <p class="mt-3 text-lg text-ink-soft dark:text-slate-300 max-w-xl leading-relaxed" x-text="t('hero_sub')"></p>

      <div class="mt-8 flex flex-wrap gap-3">
        <button type="button" @click="openModal()" class="group h-14 px-7 rounded-2xl bg-primary-500 hover:bg-primary-600 text-white font-extrabold inline-flex items-center gap-3 anim-glow transition hover:scale-[1.03]">
          <span x-text="t('cta_demo2')"></span>
          <i class="fa-solid fa-arrow-right rtl:rotate-180 group-hover:translate-x-1 rtl:group-hover:-translate-x-1 transition" aria-hidden="true"></i>
        </button>
        <a href="#library" class="h-14 px-7 rounded-2xl border border-primary-500/30 bg-surface/60 dark:bg-white/5 backdrop-blur-md font-bold inline-flex items-center gap-3 hover:border-primary-500 hover:scale-[1.03] transition">
          <i class="fa-solid fa-compass text-primary-500 dark:text-accent-400" aria-hidden="true"></i><span x-text="t('cta_explore')"></span>
        </a>
      </div>

      <!-- Hero search -->
      <form role="search" @submit.prevent="heroSearch()" class="mt-8 max-w-xl relative" @click.outside="suggestOpen = false">
        <div role="radiogroup" :aria-label="t('f_format')" class="flex flex-wrap gap-1.5 mb-2.5">
          <template x-for="fm in heroFormats" :key="fm.id">
            <button type="button" role="radio" :aria-checked="(heroFmt === fm.id).toString()" @click="heroFmt = fm.id; suggestOpen = !!heroQ.trim()"
                    class="h-9 px-3.5 rounded-full text-sm font-bold border transition inline-flex items-center gap-1.5"
                    :class="heroFmt === fm.id ? 'bg-primary-500 border-primary-500 text-white shadow-glow' : 'border-primary-500/25 bg-surface/60 dark:bg-white/5 backdrop-blur-md hover:border-primary-500'">
              <i class="fa-solid text-xs" :class="fm.icon" aria-hidden="true"></i><span x-text="fm.id === 'all' ? t('all') : L(fm)"></span>
            </button>
          </template>
        </div>
        <label for="hero-q" class="sr-only" x-text="t('search_ph')"></label>
        <div class="flex items-center gap-2 rounded-2xl bg-surface dark:bg-surface-dark border border-primary-500/20 focus-within:border-primary-500 focus-within:shadow-glow p-1.5 ps-4 transition">
          <i class="fa-solid fa-magnifying-glass text-primary-500 dark:text-primary-300" aria-hidden="true"></i>
          <input id="hero-q" type="search" x-model="heroQ" :placeholder="t('search_ph')" autocomplete="off"
                 role="combobox" aria-autocomplete="list" aria-controls="hero-suggest" :aria-expanded="(suggestOpen && suggestions.length > 0).toString()"
                 :aria-activedescendant="sIdx >= 0 ? 'sg-' + sIdx : null"
                 @input="suggestOpen = true; sIdx = -1" @focus="suggestOpen = true"
                 @keydown.arrow-down.prevent="sIdx = Math.min(sIdx + 1, suggestions.length - 1)"
                 @keydown.arrow-up.prevent="sIdx = Math.max(sIdx - 1, -1)"
                 class="flex-1 min-w-0 bg-transparent py-2.5 outline-none placeholder:text-ink-soft/70 dark:placeholder:text-slate-400">
          <button type="submit" class="h-11 px-5 rounded-xl bg-accent-500 hover:bg-accent-400 text-primary-900 font-extrabold transition" x-text="t('search_btn')"></button>
        </div>
        <ul id="hero-suggest" role="listbox" x-cloak x-show="suggestOpen && heroQ.trim() && suggestions.length" x-transition.opacity
            class="absolute z-30 inset-x-0 mt-2 rounded-2xl border border-primary-500/20 bg-surface/95 dark:bg-surface-dark/95 backdrop-blur-md shadow-2xl p-1.5">
          <template x-for="(it, i) in suggestions" :key="it.id">
            <li :id="'sg-' + i" role="option" :aria-selected="(sIdx === i).toString()" @click="pickSuggestion(it)" @mouseenter="sIdx = i"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer" :class="sIdx === i ? 'bg-primary-500/10' : ''">
              <span class="w-9 h-9 shrink-0 rounded-lg grid place-items-center text-white" :class="it.bg"><i class="fa-solid text-sm" :class="it.icon" aria-hidden="true"></i></span>
              <span class="flex-1 min-w-0"><span class="block font-bold truncate" x-text="L(it.t)"></span><span class="block text-xs text-ink-soft dark:text-slate-400" x-text="L(byId(subjects, it.subject)) + ' · ' + L(byId(grades, it.grade))"></span></span>
              <span x-show="it.sim" class="text-[11px] font-extrabold px-2 py-0.5 rounded-full bg-accent-500 text-primary-900" x-text="t('live_tag')"></span>
            </li>
          </template>
          <li class="px-3 pt-2 pb-1 text-xs text-ink-soft dark:text-slate-400" aria-hidden="true" x-text="t('suggest_hint')"></li>
        </ul>
        <div class="mt-3 flex flex-wrap items-center gap-2 text-sm">
          <span class="text-ink-soft dark:text-slate-400" x-text="t('popular')"></span>
          <template x-for="p in popular" :key="p.en">
            <button type="button" @click="heroQ = L(p); heroSearch()" class="px-3 py-1 rounded-full bg-primary-500/10 hover:bg-primary-500/20 text-primary-700 dark:text-primary-200 font-semibold transition" x-text="L(p)"></button>
          </template>
        </div>
      </form>
    </div>

    <!-- Concept preview card -->
    <div class="lg:col-span-6 relative">
      <div class="relative mx-auto max-w-lg lg:max-w-none anim-float">
        <div class="rounded-3xl border border-white/60 dark:border-white/10 bg-surface/75 dark:bg-surface-dark/75 backdrop-blur-md shadow-[0_30px_80px_-30px_rgba(7,60,76,.55)] p-4 sm:p-6">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-2" aria-hidden="true"><span class="w-3 h-3 rounded-full bg-red-400"></span><span class="w-3 h-3 rounded-full bg-accent-500"></span><span class="w-3 h-3 rounded-full bg-primary-400"></span></div>
            <p class="text-sm font-bold" x-text="t('pv_title')"></p>
            <span class="text-[11px] font-bold px-2 py-1 rounded-md bg-accent-500/20 text-accent-700 dark:text-accent-300" x-text="t('pv_example')"></span>
          </div>

          <!-- concept header -->
          <div class="mt-5 rounded-2xl bg-gradient-to-br from-primary-600 to-primary-900 text-white p-4 sm:p-5 relative overflow-hidden">
            <div class="absolute -top-10 -end-10 w-32 h-32 rounded-full border-2 border-dashed border-white/20 anim-orbit" aria-hidden="true"></div>
            <p class="text-xs font-bold opacity-80" x-text="t('pv_concept')"></p>
            <p class="mt-1 text-2xl font-extrabold" x-text="t('pv_concept_name')"></p>
            <div class="mt-3 flex flex-wrap gap-1.5 text-[11px] font-bold">
              <span class="rounded-lg bg-white/15 px-2 py-1"><i class="fa-solid fa-layer-group me-1 text-accent-400" aria-hidden="true"></i><span x-text="t('pv_grade')"></span></span>
              <span class="rounded-lg bg-white/15 px-2 py-1"><i class="fa-solid fa-book me-1 text-accent-400" aria-hidden="true"></i><span x-text="t('pv_subject')"></span></span>
              <span class="rounded-lg bg-white/15 px-2 py-1"><i class="fa-solid fa-bookmark me-1 text-accent-400" aria-hidden="true"></i><span x-text="t('pv_lesson')"></span></span>
            </div>
          </div>

          <!-- formats grid -->
          <ul class="mt-4 grid grid-cols-3 sm:grid-cols-6 gap-2" :aria-label="t('tr_formats')">
            <template x-for="(fm, i) in formats" :key="fm.id">
              <li class="rounded-xl border p-2 text-center transition duration-500"
                  :class="pvFmt === i ? 'border-accent-500 bg-accent-500/15 scale-105 shadow-gold' : 'border-primary-500/15 bg-paper/60 dark:bg-white/5'">
                <i class="fa-solid text-primary-600 dark:text-primary-300" :class="fm.icon" aria-hidden="true"></i>
                <span class="block mt-1 text-[11px] font-bold" x-text="L(fm)"></span>
              </li>
            </template>
          </ul>

          <div class="mt-4 grid grid-cols-2 gap-3 sm:gap-4">
            <!-- live pendulum (interactive element) -->
            <button type="button" @click="openLab('pendulum')" class="group text-start rounded-2xl border border-primary-500/15 hover:border-accent-500 bg-paper/60 dark:bg-white/5 p-3 transition hover:shadow-gold">
              <svg viewBox="0 0 120 120" class="w-full h-28" aria-hidden="true">
                <rect x="30" y="2" width="60" height="6" rx="3" class="fill-primary-800 dark:fill-primary-300"/>
                <g :transform="'rotate(' + (-pend.theta * 180 / Math.PI) + ' 60 6)'">
                  <line x1="60" y1="6" x2="60" :y2="6 + miniLen" stroke-width="2" class="stroke-primary-700 dark:stroke-primary-200"/>
                  <circle cx="60" :cy="6 + miniLen" :r="5 + pend.m * 2.6" fill="#F7D933" stroke-width="3" class="stroke-primary-800"/>
                </g>
              </svg>
              <p class="text-xs font-bold mt-1"><i class="fa-solid fa-hand-pointer me-1 text-primary-500" aria-hidden="true"></i><span x-text="t('fmt_interactive')"></span></p>
              <p class="text-[11px] text-ink-soft dark:text-slate-400 inline-flex items-center gap-1"><span x-text="t('open_lab')"></span><i class="fa-solid fa-arrow-right rtl:rotate-180 text-[9px]" aria-hidden="true"></i></p>
            </button>
            <!-- mini test -->
            <div class="rounded-2xl border border-primary-500/15 bg-paper/60 dark:bg-white/5 p-3">
              <p class="text-xs font-bold"><i class="fa-solid fa-list-check me-1 text-primary-500" aria-hidden="true"></i><span x-text="t('fmt_test')"></span></p>
              <p class="mt-2 text-xs font-semibold leading-relaxed" id="mini-q" x-text="t('pv_q')"></p>
              <div class="mt-2 grid gap-1.5" role="group" aria-labelledby="mini-q">
                <template x-for="(o, i) in quizOpts" :key="i">
                  <button type="button" @click="quizPick = i" class="h-9 px-2 rounded-lg text-xs font-bold border text-start flex items-center justify-between transition"
                          :class="quizPick === i ? (o.ok ? 'bg-green-500/15 border-green-600 text-green-800 dark:text-green-300' : 'bg-red-500/10 border-red-500 text-red-700 dark:text-red-300') : 'border-primary-500/20 hover:border-primary-500'">
                    <span x-text="L(o)"></span>
                    <i x-show="quizPick === i" class="fa-solid" :class="o.ok ? 'fa-check' : 'fa-xmark'" aria-hidden="true"></i>
                  </button>
                </template>
              </div>
              <p class="mt-1.5 text-[11px] font-semibold text-ink-soft dark:text-slate-400" aria-live="polite" x-text="quizPick === null ? '' : (quizOpts[quizPick].ok ? t('pv_q_ok') : t('pv_q_no'))"></p>
            </div>
          </div>
        </div>

        <!-- floating badges -->
        <div class="absolute -top-5 -end-2 sm:-end-6 anim-float-d rounded-2xl bg-surface dark:bg-surface-dark border border-primary-500/20 shadow-xl px-3.5 py-2.5 flex items-center gap-2.5">
          <span class="w-9 h-9 rounded-xl bg-accent-500 text-primary-900 grid place-items-center"><i class="fa-solid fa-sitemap" aria-hidden="true"></i></span>
          <div><p class="text-xs font-extrabold" x-text="t('pv_linked')"></p><p class="text-[11px] text-ink-soft dark:text-slate-400" x-text="t('pv_linked_s')"></p></div>
        </div>
        <div class="absolute -bottom-6 -start-2 sm:-start-8 anim-float rounded-2xl bg-surface dark:bg-surface-dark border border-primary-500/20 shadow-xl px-3.5 py-2.5 flex items-center gap-3">
          <span class="w-9 h-9 rounded-xl bg-primary-500 text-white grid place-items-center"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i></span>
          <div class="flex items-end gap-0.5 h-6" aria-hidden="true">
            <template x-for="i in 7" :key="i"><span class="w-1 h-full rounded bg-primary-500 dark:bg-primary-300 eq-bar" :style="'animation-delay:' + (i*0.09) + 's'"></span></template>
          </div>
          <div><p class="text-xs font-extrabold" x-text="t('pv_ai')"></p><p class="text-[11px] font-bold text-accent-700 dark:text-accent-400" x-text="t('soon')"></p></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ 3. TRUST / CREDENTIALS BANNER ============ -->
<section :aria-label="t('trust_label')" class="relative z-10 -mt-16 sm:-mt-20 px-4 sm:px-6 lg:px-8">
  <div x-ref="stats" class="mx-auto max-w-6xl rounded-3xl border border-white/60 dark:border-white/10 bg-surface/80 dark:bg-surface-dark/80 backdrop-blur-md shadow-[0_24px_60px_-30px_rgba(7,60,76,.5)] grid grid-cols-2 lg:grid-cols-4">
    <template x-for="(s, i) in trust" :key="s.k">
      <div class="p-5 sm:p-7 text-center border-primary-500/10" :class="{'border-b lg:border-b-0': i < 2, 'border-e': i % 2 === 0 || i === 1, 'lg:border-e-0': i === 3}">
        <span class="mx-auto w-11 h-11 rounded-xl grid place-items-center bg-primary-500/10 text-primary-600 dark:text-accent-400"><i class="fa-solid" :class="s.icon" aria-hidden="true"></i></span>
        <p class="mt-3 font-en text-2xl sm:text-3xl font-extrabold text-primary-700 dark:text-white" dir="ltr" x-text="s.num !== undefined ? s.cur : s.big"></p>
        <p class="mt-1 text-sm font-bold" x-text="t(s.k)"></p>
        <p class="mt-0.5 text-xs text-ink-soft dark:text-slate-400" x-text="t(s.k + '_s')"></p>
      </div>
    </template>
  </div>
</section>

<!-- ============ PLATFORM STATISTICS ============ -->
<section :aria-label="t('stats_label')" class="pt-14 px-4 sm:px-6 lg:px-8">
  <div x-ref="statsNums" class="mx-auto max-w-6xl rounded-3xl border border-white/60 dark:border-white/10 bg-surface/80 dark:bg-surface-dark/80 backdrop-blur-md shadow-[0_24px_60px_-30px_rgba(7,60,76,.5)] grid grid-cols-2 lg:grid-cols-4">
    <template x-for="(s, i) in stats" :key="s.k">
      <div class="p-5 sm:p-7 text-center border-primary-500/10" :class="{'border-b lg:border-b-0': i < 2, 'border-e': i % 2 === 0, 'lg:border-e': i < 3}">
        <span class="mx-auto w-11 h-11 rounded-xl grid place-items-center bg-primary-500/10 text-primary-600 dark:text-accent-400"><i class="fa-solid" :class="s.icon" aria-hidden="true"></i></span>
        <p class="mt-3 font-en text-3xl sm:text-4xl font-extrabold text-primary-700 dark:text-white" dir="ltr"><span x-text="s.cur.toLocaleString('en-US')"></span><span class="text-accent-600 dark:text-accent-500" x-text="s.suffix"></span></p>
        <p class="mt-1 text-sm font-bold text-ink-soft dark:text-slate-400" x-text="t(s.k)"></p>
      </div>
    </template>
  </div>
</section>

<!-- ============ 4. FEATURES (BENTO) ============ -->
<section id="features" class="py-24 lg:py-32">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl">
      <p class="text-sm font-extrabold uppercase tracking-wider text-primary-600 dark:text-accent-400" x-text="t('feat_eyebrow')"></p>
      <h2 class="mt-3 text-3xl sm:text-4xl font-extrabold leading-tight" x-text="t('feat_title')"></h2>
      <p class="mt-4 text-lg text-ink-soft dark:text-slate-300" x-text="t('feat_sub')"></p>
    </div>

    <div class="mt-12 grid gap-5 md:grid-cols-2 lg:grid-cols-6 lg:auto-rows-[minmax(220px,auto)]">
      <!-- b1: gathers around the concept -->
      <article @mousemove="glow($event)" class="glow-card md:col-span-2 lg:col-span-4 lg:row-span-2 rounded-3xl border border-primary-500/15 hover:border-primary-500/50 bg-surface dark:bg-surface-dark p-6 sm:p-8 overflow-hidden transition hover:-translate-y-1 hover:shadow-glow flex flex-col">
        <span class="w-12 h-12 rounded-2xl bg-primary-500 text-white grid place-items-center text-xl"><i class="fa-solid fa-circle-nodes" aria-hidden="true"></i></span>
        <h3 class="mt-5 text-2xl font-extrabold" x-text="t('b1_t')"></h3>
        <p class="mt-2 text-ink-soft dark:text-slate-300 max-w-lg" x-text="t('b1_d')"></p>
        <div class="mt-6 flex-1 min-h-[260px] rounded-2xl grid-bg bg-paper/70 dark:bg-white/[.03] border border-primary-500/10 relative overflow-hidden grid place-items-center" aria-hidden="true">
          <div class="relative w-60 h-60" dir="ltr">
            <div class="absolute inset-0 rounded-full border-2 border-dashed border-primary-400/40 anim-orbit"></div>
            <div class="absolute inset-0 anim-orbit">
              <template x-for="(fm, i) in formats" :key="'o'+fm.id">
                <span class="absolute w-11 h-11 -ml-[22px] -mt-[22px] rounded-xl bg-surface dark:bg-surface-dark border border-primary-500/25 shadow-md grid place-items-center"
                      :style="'left:' + (50 + 50 * Math.cos(i * Math.PI / 3)) + '%; top:' + (50 + 50 * Math.sin(i * Math.PI / 3)) + '%'">
                  <i class="fa-solid text-primary-600 dark:text-primary-300 anim-orbit-r" :class="fm.icon"></i>
                </span>
              </template>
            </div>
            <div class="absolute inset-[4.5rem] rounded-full bg-gradient-to-br from-accent-400 to-primary-600 shadow-glow grid place-items-center text-center text-white text-xs font-extrabold px-2" x-text="t('concept_word')"></div>
          </div>
        </div>
      </article>

      <!-- b2: connects knowledge -->
      <article @mousemove="glow($event)" class="glow-card md:col-span-1 lg:col-span-2 lg:row-span-2 rounded-3xl border border-primary-500/15 hover:border-accent-500/70 bg-gradient-to-b from-primary-800 to-primary-900 text-white p-6 sm:p-8 overflow-hidden transition hover:-translate-y-1 hover:shadow-gold flex flex-col">
        <span class="w-12 h-12 rounded-2xl bg-accent-500 text-primary-900 grid place-items-center text-xl"><i class="fa-solid fa-sitemap" aria-hidden="true"></i></span>
        <h3 class="mt-5 text-xl font-extrabold" x-text="t('b2_t')"></h3>
        <p class="mt-2 text-primary-100/85" x-text="t('b2_d')"></p>
        <svg viewBox="0 0 200 170" class="mt-6 w-full flex-1" aria-hidden="true">
          <g stroke="#F7D933" stroke-width="2" stroke-opacity=".7" class="flow-dash">
            <line x1="100" y1="85" x2="30" y2="25"/><line x1="100" y1="85" x2="170" y2="25"/>
            <line x1="100" y1="85" x2="30" y2="145"/><line x1="100" y1="85" x2="170" y2="145"/>
          </g>
          <circle cx="100" cy="85" r="24" fill="#F7D933"/>
          <text x="100" y="89" text-anchor="middle" font-size="11" font-weight="800" fill="#073C4C" x-text="t('concept_word')"></text>
          <g fill="#0E80A1" stroke="#5FB8CF">
            <rect x="8" y="9" width="60" height="26" rx="13"/><rect x="132" y="9" width="60" height="26" rx="13"/>
            <rect x="8" y="135" width="60" height="26" rx="13"/><rect x="132" y="135" width="60" height="26" rx="13"/>
          </g>
          <g text-anchor="middle" font-size="10" font-weight="700" fill="#fff">
            <text x="38" y="26" x-text="L(linkNodes[0])"></text><text x="162" y="26" x-text="L(linkNodes[1])"></text>
            <text x="38" y="152" x-text="L(linkNodes[2])"></text><text x="162" y="152" x-text="L(linkNodes[3])"></text>
          </g>
        </svg>
      </article>

      <!-- b3: diversifies understanding -->
      <article @mousemove="glow($event)" class="glow-card lg:col-span-2 rounded-3xl border border-primary-500/15 hover:border-primary-500/50 bg-surface dark:bg-surface-dark p-6 transition hover:-translate-y-1 hover:shadow-glow">
        <span class="w-11 h-11 rounded-2xl bg-primary-500/10 text-primary-600 dark:text-accent-400 grid place-items-center"><i class="fa-solid fa-shapes" aria-hidden="true"></i></span>
        <h3 class="mt-4 text-lg font-extrabold" x-text="t('b3_t')"></h3>
        <p class="mt-1.5 text-sm text-ink-soft dark:text-slate-300" x-text="t('b3_d')"></p>
        <div class="mt-4 flex flex-wrap gap-1.5">
          <template x-for="fm in formats" :key="'b3'+fm.id">
            <span class="text-xs font-bold px-2.5 py-1.5 rounded-full bg-primary-500/10 text-primary-700 dark:text-primary-200 inline-flex items-center gap-1.5 hover:scale-105 transition"><i class="fa-solid" :class="fm.icon" aria-hidden="true"></i><span x-text="L(fm)"></span></span>
          </template>
        </div>
      </article>

      <!-- b4: easier access -->
      <article @mousemove="glow($event)" class="glow-card lg:col-span-2 rounded-3xl border border-primary-500/15 hover:border-primary-500/50 bg-surface dark:bg-surface-dark p-6 transition hover:-translate-y-1 hover:shadow-glow">
        <span class="w-11 h-11 rounded-2xl bg-primary-500/10 text-primary-600 dark:text-accent-400 grid place-items-center"><i class="fa-solid fa-magnifying-glass-location" aria-hidden="true"></i></span>
        <h3 class="mt-4 text-lg font-extrabold" x-text="t('b4_t')"></h3>
        <p class="mt-1.5 text-sm text-ink-soft dark:text-slate-300" x-text="t('b4_d')"></p>
        <div class="mt-4 rounded-xl bg-paper dark:bg-white/5 p-2.5" aria-hidden="true">
          <div class="h-8 rounded-lg bg-surface dark:bg-surface-dark border border-primary-500/15 flex items-center gap-2 px-2.5 text-xs text-ink-soft dark:text-slate-400"><i class="fa-solid fa-magnifying-glass text-primary-500"></i><span x-text="t('pv_concept_name')"></span></div>
          <div class="mt-2 flex gap-1.5 text-[10px] font-bold">
            <span class="px-2 py-1 rounded-md bg-primary-500 text-white" x-text="t('f_grade')"></span>
            <span class="px-2 py-1 rounded-md bg-primary-500/15" x-text="t('f_subject')"></span>
            <span class="px-2 py-1 rounded-md bg-primary-500/15" x-text="t('f_format')"></span>
          </div>
        </div>
      </article>

            <select :id="'f-' + fl.k" x-model="f[fl.k]" class="w-full h-12 rounded-xl bg-paper dark:bg-white/5 dark:[color-scheme:dark] border border-primary-500/15 focus:border-primary-500 outline-none px-3 font-semibold">

              <template x-for="o in fl.opts" :key="o.id"><option :value="o.id" :selected="f[fl.k] === o.id" x-text="L(o)"></option></template>
            </select>
          </div>
        </template>
      </div>
    </div>

    <div class="mt-6 flex items-center justify-between text-sm font-semibold" aria-live="polite">
      <p><span class="font-en font-extrabold text-primary-600 dark:text-accent-400" x-text="filtered.length"></span> <span x-text="t('results')"></span> · <span class="text-ink-soft dark:text-slate-400" x-text="t('samples_note')"></span></p>
      <button type="button" x-show="q || f.grade !== 'all' || f.subject !== 'all' || f.format !== 'all'" @click="clearFilters()" class="text-primary-600 dark:text-accent-400 hover:underline inline-flex items-center gap-1.5"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span x-text="t('clear')"></span></button>
    </div>

    <ul class="mt-5 grid gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      <template x-for="it in filtered" :key="it.id">
        <li @mousemove="glow($event)" class="glow-card group rounded-3xl border border-primary-500/15 hover:border-primary-500/50 bg-surface dark:bg-surface-dark overflow-hidden flex flex-col transition hover:-translate-y-1 hover:shadow-glow">
          <div class="relative h-32 grid place-items-center overflow-hidden" :class="it.bg">
            <div class="absolute inset-0 grid-bg opacity-60" aria-hidden="true"></div>
            <i class="fa-solid text-5xl text-white/90 drop-shadow-lg group-hover:scale-110 transition duration-500" :class="it.icon" aria-hidden="true"></i>
            <span class="absolute top-3 start-3 text-[11px] font-extrabold px-2.5 py-1 rounded-full bg-white/90 text-primary-900" x-text="t('concept_word')"></span>
            <span x-show="it.sim" class="absolute top-3 end-3 text-[11px] font-extrabold px-2.5 py-1 rounded-full bg-accent-500 text-primary-900 inline-flex items-center gap-1"><i class="fa-solid fa-bolt" aria-hidden="true"></i><span x-text="t('live_tag')"></span></span>
          </div>
          <div class="p-5 flex-1 flex flex-col">
            <h3 class="font-extrabold text-lg leading-snug" x-text="L(it.t)"></h3>
            <p class="mt-1.5 text-sm text-ink-soft dark:text-slate-300 flex-1" x-text="L(it.d)"></p>
            <div class="mt-4 flex flex-wrap gap-1.5 text-[11px] font-bold">
              <span class="px-2 py-1 rounded-md bg-primary-500/10 text-primary-700 dark:text-primary-200" x-text="L(byId(grades, it.grade))"></span>
              <span class="px-2 py-1 rounded-md bg-accent-500/20 text-accent-700 dark:text-accent-300" x-text="L(byId(subjects, it.subject))"></span>
              <span class="px-2 py-1 rounded-md bg-paper dark:bg-white/5 text-ink-soft dark:text-slate-300" x-text="L(it.lesson)"></span>
            </div>
            <ul class="mt-3 flex gap-1.5" :aria-label="t('tr_formats')">
              <template x-for="fid in it.formats" :key="fid">
                <li class="w-8 h-8 rounded-lg bg-primary-500/10 text-primary-600 dark:text-primary-300 grid place-items-center" :title="L(byId(formats, fid))">
                  <i class="fa-solid text-xs" :class="byId(formats, fid).icon" aria-hidden="true"></i><span class="sr-only" x-text="L(byId(formats, fid))"></span>
                </li>
              </template>
            </ul>
            <button type="button" @click="launch(it)" class="mt-5 h-11 rounded-xl font-bold inline-flex items-center justify-center gap-2 transition"
                    :class="it.sim ? 'bg-primary-500 hover:bg-primary-600 text-white' : 'border border-primary-500/30 hover:border-primary-500 hover:bg-primary-500/5'">
              <i class="fa-solid" :class="it.sim ? 'fa-play' : 'fa-calendar-check'" aria-hidden="true"></i><span x-text="it.sim ? t('launch') : t('cta_demo2')"></span>
            </button>
          </div>
        </li>
      </template>
    </ul>
    <div x-show="filtered.length === 0" x-cloak class="mt-6 rounded-3xl border-2 border-dashed border-primary-500/25 p-12 text-center">
      <i class="fa-solid fa-magnifying-glass-minus text-4xl text-primary-500/60" aria-hidden="true"></i>
      <p class="mt-4 font-bold" x-text="t('no_results')"></p>
      <button type="button" @click="clearFilters()" class="mt-4 h-11 px-5 rounded-xl bg-primary-500 text-white font-bold" x-text="t('clear')"></button>
    </div>
  </div>
</section>

<!-- ============ FAQ ============ -->
<section id="faq" class="py-24 lg:py-28 bg-surface/60 dark:bg-surface-dark/40 border-y border-primary-500/10">
  <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8">
    <div class="text-center">
      <p class="text-sm font-extrabold uppercase tracking-wider text-primary-600 dark:text-accent-400" x-text="t('faq_eyebrow')"></p>
      <h2 class="mt-3 text-3xl sm:text-4xl font-extrabold" x-text="t('faq_title')"></h2>
    </div>
    <div class="mt-10 space-y-3">
      <template x-for="(fq, i) in faqs" :key="i">
        <div class="rounded-2xl border bg-surface dark:bg-surface-dark transition" :class="faqOpen === i ? 'border-primary-500/60 shadow-glow' : 'border-primary-500/15'">
          <h3>
            <button type="button" :id="'faq-b-' + i" :aria-expanded="(faqOpen === i).toString()" :aria-controls="'faq-p-' + i" @click="faqOpen = faqOpen === i ? null : i"
                    class="w-full flex items-center justify-between gap-4 p-5 text-start font-extrabold">
              <span x-text="L(fq.q)"></span>
              <span class="w-8 h-8 shrink-0 rounded-full grid place-items-center transition" :class="faqOpen === i ? 'bg-primary-500 text-white rotate-45' : 'bg-primary-500/10 text-primary-600 dark:text-primary-300'"><i class="fa-solid fa-plus text-sm" aria-hidden="true"></i></span>
            </button>
          </h3>
          <div :id="'faq-p-' + i" role="region" :aria-labelledby="'faq-b-' + i" x-show="faqOpen === i" x-transition.opacity>
            <p class="px-5 pb-5 text-ink-soft dark:text-slate-300 leading-relaxed" x-text="L(fq.a)"></p>
          </div>
        </div>
      </template>
    </div>
  </div>
</section>

<!-- ============ 10. FINAL BANNER ============ -->
<section class="py-24 px-4 sm:px-6 lg:px-8">
  <div class="relative mx-auto max-w-6xl rounded-[2rem] overflow-hidden bg-gradient-to-br from-primary-500 via-primary-700 to-primary-900 text-white p-8 sm:p-14 text-center">
    <div class="absolute inset-0 grid-bg opacity-30" aria-hidden="true"></div>
    <div class="absolute -top-24 -end-24 w-72 h-72 rounded-full bg-accent-500/30 blur-3xl" aria-hidden="true"></div>
    <div class="hidden md:flex absolute top-0 start-14 anim-swing flex-col items-center" aria-hidden="true"><div class="w-0.5 h-28 bg-white/40"></div><div class="w-9 h-9 rounded-full bg-accent-500 border-4 border-primary-800 shadow-gold"></div></div>
    <div class="hidden md:block absolute bottom-10 end-16 w-24 h-24 rounded-full border-2 border-dashed border-white/25 anim-orbit" aria-hidden="true"><span class="absolute -top-1.5 start-1/2 w-3 h-3 rounded-full bg-accent-400"></span></div>
    <div class="relative">
      <p class="inline-flex items-center gap-2 rounded-full bg-white/10 border border-white/20 px-3.5 py-1.5 text-sm font-bold"><i class="fa-solid fa-school text-accent-400" aria-hidden="true"></i><span x-text="t('fb_badge')"></span></p>
      <h2 class="mt-5 text-3xl sm:text-5xl font-extrabold max-w-3xl mx-auto leading-tight" x-text="t('hero_slogan')"></h2>
      <p class="mt-4 text-lg text-primary-100/90 max-w-2xl mx-auto" x-text="t('fb_sub')"></p>
      <div class="mt-8 flex flex-wrap justify-center gap-3">
        <button type="button" @click="openModal()" class="h-14 px-8 rounded-2xl bg-accent-500 hover:bg-accent-400 text-primary-900 font-extrabold inline-flex items-center gap-3 anim-glow hover:scale-[1.03] transition"><span x-text="t('cta_demo2')"></span><i class="fa-solid fa-arrow-right rtl:rotate-180" aria-hidden="true"></i></button>
        <a href="https://fir-on.net/contact-ar/" target="_blank" rel="noopener" class="h-14 px-8 rounded-2xl border border-white/30 bg-white/10 backdrop-blur-md font-bold inline-flex items-center gap-3 hover:bg-white/20 transition"><i class="fa-solid fa-envelope" aria-hidden="true"></i><span x-text="t('contact')"></span></a>
      </div>
    </div>
  </div>
</section>
</main>

      <p class="mt-4 text-sm text-ink-soft dark:text-slate-400 max-w-xs leading-relaxed" x-text="t('ft_tag')"></p>
      <ul class="mt-5 flex flex-wrap gap-2" :aria-label="t('ft_social')">
        <template x-for="s in socials" :key="s.icon">
          <li><a :href="s.href" target="_blank" rel="noopener" class="w-10 h-10 rounded-xl border border-primary-500/20 hover:border-primary-500 hover:text-primary-500 grid place-items-center transition" :aria-label="s.name"><i class="fa-brands" :class="s.icon" aria-hidden="true"></i></a></li>
        </template>
      </ul>
    </div>
    <template x-for="col in footerCols" :key="col.k">
      <nav class="lg:col-span-2" :aria-label="t(col.k)">
        <h3 class="text-sm font-extrabold" x-text="t(col.k)"></h3>
        <ul class="mt-4 space-y-2.5 text-sm">
          <template x-for="l in col.links" :key="l.k"><li><a :href="l.href" :target="l.ext ? '_blank' : null" :rel="l.ext ? 'noopener' : null" class="text-ink-soft dark:text-slate-400 hover:text-primary-600 dark:hover:text-accent-400 transition" x-text="t(l.k)"></a></li></template>
        </ul>
      </nav>
    </template>
    <div class="sm:col-span-2 lg:col-span-4">
      <h3 class="text-sm font-extrabold" x-text="t('nl_title')"></h3>
      <p class="mt-2 text-sm text-ink-soft dark:text-slate-400" x-text="t('nl_sub')"></p>
      <form @submit.prevent="subscribe()" class="mt-4 flex gap-2" novalidate>
        <label for="nl-email" class="sr-only" x-text="t('f_email')"></label>
        <input id="nl-email" type="email" dir="ltr" x-model.trim="nlEmail" autocomplete="email" :placeholder="'name@school.edu'" :aria-invalid="(nlState === 'bad').toString()" aria-describedby="nl-msg"
               class="flex-1 min-w-0 h-12 rounded-xl bg-paper dark:bg-white/5 border px-3 outline-none" :class="nlState === 'bad' ? 'border-red-500' : 'border-primary-500/20 focus:border-primary-500'">
        <button type="submit" class="h-12 px-5 rounded-xl bg-primary-500 hover:bg-primary-600 text-white font-bold whitespace-nowrap" x-text="t('nl_btn')"></button>
      </form>
      <p id="nl-msg" class="mt-2 text-xs font-semibold" aria-live="polite" :class="nlState === 'ok' ? 'text-green-700 dark:text-green-400' : 'text-red-600'" x-text="nlState === 'ok' ? t('nl_ok') : (nlState === 'bad' ? t('bad_email') : '')"></p>
    </div>
  </div>
  <div class="border-t border-primary-500/10">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-5 flex flex-col sm:flex-row gap-3 justify-between text-xs text-ink-soft dark:text-slate-400">
      <p x-text="t('ft_rights')"></p>
      <p class="inline-flex items-center gap-1.5"><i class="fa-solid fa-certificate text-primary-500" aria-hidden="true"></i><span x-text="t('ft_accr')"></span></p>
    </div>
  </div>
</footer>

<!-- Back to top -->
<button type="button" x-cloak x-show="showTop && !modal" x-transition @click="window.scrollTo({ top: 0, behavior: 'smooth' })"
        class="fixed bottom-5 end-5 z-40 w-12 h-12 rounded-2xl bg-primary-500 hover:bg-primary-600 text-white shadow-glow grid place-items-center hover:scale-105 transition" :aria-label="t('back_top')">
  <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
</button>

<!-- ============ 9. DEMO REQUEST MODAL ============ -->
<div x-cloak x-show="modal" class="fixed inset-0 z-[90] flex items-end sm:items-center justify-center p-0 sm:p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div x-show="modal" x-transition.opacity class="absolute inset-0 bg-primary-900/60 backdrop-blur-sm" @click="modal = false" aria-hidden="true"></div>
  <div x-show="modal" x-transition x-ref="dialog" @keydown.tab="trap($event)" class="relative w-full sm:max-w-2xl max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl bg-surface dark:bg-surface-dark border border-primary-500/20 shadow-2xl">
    <div class="sticky top-0 z-10 flex items-start justify-between gap-4 p-6 sm:px-8 bg-surface/90 dark:bg-surface-dark/90 backdrop-blur-md border-b border-primary-500/10">
      <div class="flex gap-3">
        <span class="w-11 h-11 shrink-0 rounded-xl bg-primary-500 text-accent-500 grid place-items-center"><i class="fa-solid fa-calendar-check" aria-hidden="true"></i></span>
        <div><h2 id="modal-title" class="text-xl font-extrabold" x-text="sent ? t('m_ok_title') : t('m_title')"></h2><p class="text-sm text-ink-soft dark:text-slate-400" x-show="!sent" x-text="t('m_sub')"></p></div>
      </div>

    /* ---------- lifecycle ---------- */
    init() {
      this.applyLang(); this.applyTheme();
      this.$watch('lang', () => this.applyLang());
      this.$watch('dark', () => this.applyTheme());
      this.$watch('modal', v => {
        document.body.style.overflow = v ? 'hidden' : '';
        if (v) this.$nextTick(() => document.getElementById('fm-name')?.focus());
        else if (this._opener) { this._opener.focus?.(); this._opener = null; }
      });
      window.addEventListener('scroll', () => { this.scrolled = window.scrollY > 20; this.showTop = window.scrollY > 900; }, { passive: true });

      const spy = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) this.active = e.target.id; }), { rootMargin: '-45% 0px -50% 0px' });
      this.nav.forEach(n => { const el = document.getElementById(n.id); if (el) spy.observe(el); });

      const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { this.countUp(); io.disconnect(); } }, { threshold: 0.3 });
      io.observe(this.$refs.stats);
      const io2 = new IntersectionObserver(es => { if (es[0].isIntersecting) { this.countStats(); io2.disconnect(); } }, { threshold: 0.3 });
      io2.observe(this.$refs.statsNums);

      setInterval(() => { this.pvFmt = (this.pvFmt + 1) % this.formats.length; }, 1800);
      requestAnimationFrame(ts => this.loop(ts));
    },
    applyLang() {
      document.documentElement.lang = this.lang;
      document.documentElement.dir = this.lang === 'ar' ? 'rtl' : 'ltr';
      document.title = this.lang === 'ar' ? 'FirOb — منصة العناصر التعليمية الذكية من FirOn' : 'FirOb — Smart educational elements by FirOn';
    },
    applyTheme() { document.documentElement.classList.toggle('dark', this.dark); },
    toggleLang() { this.lang = this.lang === 'ar' ? 'en' : 'ar'; },

    /* ---------- helpers ---------- */
    t(k) { return (I18N[this.lang] && I18N[this.lang][k]) ?? I18N.ar[k] ?? k; },
    L(o) { return o ? (o[this.lang] ?? o.ar) : ''; },
    byId(list, id) { return list.find(x => x.id === id); },
    pct(v, min, max) { return '--p:' + ((v - min) / (max - min) * 100) + '%'; },
    deg(r) { return Math.round(r * 180 / Math.PI); },
    glow(e) { const r = e.currentTarget.getBoundingClientRect(); e.currentTarget.style.setProperty('--mx', (e.clientX - r.left) + 'px'); e.currentTarget.style.setProperty('--my', (e.clientY - r.top) + 'px'); },
    countUp() {
      const start = performance.now(), dur = 1200;
      const step = now => {
        const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
        this.trust.forEach(s => { if (s.num !== undefined) s.cur = Math.round(s.num * e); });
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    },
    countStats() {
      const start = performance.now(), dur = 1600;
      const step = now => {
        const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
        this.stats.forEach(s => { s.cur = Math.round(s.target * e); });
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    },
    get heroFormats() { return [{ id: 'all', icon: 'fa-layer-group' }, ...this.formats.filter(x => ['video', 'interactive', 'test', 'file'].includes(x.id))]; },
    get filterDefs() {
      return [
        { k: 'grade',   label: 'f_grade',   opts: this.grades },
        { k: 'subject', label: 'f_subject', opts: this.subjects },
        { k: 'format',  label: 'f_format',  opts: this.formats }
      ];
    },

    /* ---------- pendulum physics ---------- */
    get miniLen() { return 36 + (this.pend.L - 0.4) / 2.1 * 54; },
    get lenPx()  { return 60 + (this.pend.L - 0.4) / 2.1 * 190; },
    get bobR()   { return 10 + this.pend.m * 5; },
    get bobX()   { return 200 + this.lenPx * Math.sin(this.pend.theta); },
    get bobY()   { return 24 + this.lenPx * Math.cos(this.pend.theta); },
    get period() { return 2 * Math.PI * Math.sqrt(this.pend.L / this.pend.g); },
    arcPath() {
      const a = this.pend.amp * Math.PI / 180, r = this.lenPx;
      const x1 = 200 - r * Math.sin(a), y = 24 + r * Math.cos(a), x2 = 200 + r * Math.sin(a);
      return `M ${x1} ${y} A ${r} ${r} 0 0 0 ${x2} ${y}`;
    },
    resetPend() { this.pend.theta = this.pend.amp * Math.PI / 180; this.pend.omega = 0; },
    openLab(mode) { this.sim = mode; if (mode === 'pendulum') this.resetPend(); document.getElementById('sandbox').scrollIntoView({ behavior: 'smooth' }); },
    loop(ts) {
      const dt = Math.min((ts - (this._last || ts)) / 1000, 0.05); this._last = ts;
      if (this.pend.running && dt > 0) {
        const h = dt * this.pend.speed / 8, k = this.pend.g / this.pend.L;
        let th = this.pend.theta, om = this.pend.omega;
        for (let i = 0; i < 8; i++) { om += (-k * Math.sin(th) - 0.03 * om) * h; th += om * h; }
        this.pend.theta = th; this.pend.omega = om;
      }
      requestAnimationFrame(t => this.loop(t));
    },

    /* ---------- balancer ---------- */
    get leftVal()    { return +(this.bal.a * this.bal.x + this.bal.b).toFixed(2); },
    get isBalanced() { return Math.abs(this.leftVal - this.bal.c) < 0.001; },
    get tilt()       { return Math.max(-18, Math.min(18, (this.bal.c - this.leftVal) * 1.2)); },

    /* ---------- library & search ---------- */
    hay(it) { return (it.t.en + ' ' + it.t.ar + ' ' + it.d.en + ' ' + it.d.ar + ' ' + it.lesson.en + ' ' + it.lesson.ar + ' ' + it.kw + ' ' + this.byId(this.subjects, it.subject).ar + ' ' + this.byId(this.subjects, it.subject).en).toLowerCase(); },
    get filtered() {
      const q = this.q.trim().toLowerCase();
      return this.items.filter(it =>
        (this.f.grade   === 'all' || it.grade === this.f.grade) &&
        (this.f.subject === 'all' || it.subject === this.f.subject) &&
        (this.f.format  === 'all' || it.formats.includes(this.f.format)) &&
        (!q || this.hay(it).includes(q))
      );
    },
    get suggestions() {
      const q = this.heroQ.trim().toLowerCase();
      if (!q) return [];
      return this.items.filter(it => (this.heroFmt === 'all' || it.formats.includes(this.heroFmt)) && this.hay(it).includes(q)).slice(0, 5);
    },
    clearFilters() { this.q = ''; this.f = { grade: 'all', subject: 'all', format: 'all' }; },
    heroSearch() {
      if (this.sIdx >= 0 && this.suggestions[this.sIdx]) { this.pickSuggestion(this.suggestions[this.sIdx]); return; }
      this.suggestOpen = false;
      this.q = this.heroQ; this.f = { grade: 'all', subject: 'all', format: this.heroFmt };
      document.getElementById('library').scrollIntoView({ behavior: 'smooth' });
    },
    pickSuggestion(it) {
      this.suggestOpen = false; this.sIdx = -1;
      if (it.sim) { this.openLab(it.sim); return; }
      this.q = this.L(it.t); this.f = { grade: 'all', subject: 'all', format: 'all' };
      document.getElementById('library').scrollIntoView({ behavior: 'smooth' });
    },
    launch(it) { if (it.sim) this.openLab(it.sim); else this.openModal(); },

    /* ---------- newsletter ---------- */
    subscribe() {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(this.nlEmail)) { this.nlState = 'bad'; return; }
      // TODO: connect to FirOn's newsletter service
      this.nlState = 'ok'; this.nlEmail = '';
    },

    /* ---------- modal ---------- */
    openModal() { this._opener = document.activeElement; this.sent = false; this.errors = {}; this.modal = true; },
    trap(e) {
      const f = [...this.$refs.dialog.querySelectorAll('button, input, select, a[href]')].filter(el => !el.disabled && el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    },
    submitForm() {
      const e = {};
      ['name', 'email', 'inst', 'country', 'whatsapp'].forEach(k => { if (!this.form[k]) e[k] = 'required'; });
      if (this.form.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(this.form.email)) e.email = 'bad_email';
      if (this.form.whatsapp && !/^\+?[\d\s()-]{8,}$/.test(this.form.whatsapp)) e.whatsapp = 'bad_phone';
      this.errors = e;
      if (Object.keys(e).length) { document.getElementById('fm-' + Object.keys(e)[0])?.focus(); return; }
      this.sending = true;
      // TODO: send to FirOn's demo-request endpoint, e.g. fetch('/api/demo-requests', { method: 'POST', body: JSON.stringify(this.form) })
      setTimeout(() => { this.sending = false; this.sent = true; this.form = { name: '', email: '', inst: '', country: '', whatsapp: '' }; }, 900);
    }
  };
}
</script>
